schemaVersion: 1
gameId: tutorial
authorOnlyFacts:
  - 해수가 USER 0001이다. 튜토리얼 다섯 단계는 개발팀이 만든 것이 아니라 2019년 4월 11일 14시 52분, 해수가 광철을 처음 받은 순간부터 있었다. 4장 서버실 기록을 읽기 전에는 해수도 태민도 은숙도 이 연결을 말하지 못한다.
  - 레플라 속 광철은 본인이 아니라 도시와 함께 복사된 복제다. 그래서 이쪽 광철은 밤마다 누가 지르는지 모르는 고함을 귀로 듣는다. 광철은 그 목소리가 해수와 닮았다는 데까지만 간다.
  - 4월 18일 새벽 B2에 상혁의 차가 들어간 기록은 사실이다. 상혁이 거기서 무엇을 했는지는 확정하지 않는다.
arc:
  premise: 마트 고객센터 12년 차 정해수는 아무도 불편하지 않게 근무를 넘기고 싶다. 그러려고 삼켜 온 "소리 지르지 마세요" 한마디를 레플라 튜토리얼이 대신 뱉게 해 주는데, 거기서 뱉은 말과 쥔 연필이 이쪽 오광철에게 그대로 닿는다.
  question: 아무도 안 다친다던 곳에서 한 말과 한 일을, 해수는 여기서 자기 이름으로 받을 것인가.
  기:
    chapters: [0]
    summary: 4월 11일, 입사 12년째 되는 날. 해수는 지영의 마감을 대신 서고, 027번 광철의 고함을 "확인해 드릴게요"로 받고, 상혁의 밥과 미납 고지서와 어머니 전화를 챙긴다. 포스기에는 12년 전 첫 손님이 광철이었다는 기록이 뜨고, 해수가 그날 받은 것은 물기에 젖은 체험권 한 장이다.
  승:
    chapters: [1, 2]
    summary: 광철이 사람들 앞에서 고개를 숙이게 한 밤, 해수는 체험권을 쓴다. 튜토리얼 2/5에서 처음으로 소리를 지르고 닷새 밤을 되풀이한다. 광철은 밤마다 그 고함을 듣다가 사과하러 와서 드링크 한 병만 두고 간다. 3/5에서 해수는 C-14 기둥 옆에서 연필을 쥐고, 아침에 광철은 같은 자리에서 숨진 채 발견된다. 4/5는 증거를 책상에 올려놓고, 다음 날 은숙의 휴대폰 사진까지 바뀐다.
  전:
    chapters: [3]
    summary: 숨기는 것도 말하는 것도 통하지 않는다. 현관 CCTV는 해수가 집을 안 나갔다고 하고, 해수가 내민 접속 기록은 그 시각 레플라 B2를 가리킨다. 털어놓으면 "말씀하신 대로 적을게요"로 끝나고, 지웠다면 주차 기록에 남은 상혁에게 수사가 간다. 태민은 서버가 1년 반 전에 다 꺼졌고 튜토리얼은 아무도 만들지 않았다고 말한다. 해수는 출입 카드를 받아 처음으로 근무표에 없는 곳으로 간다.
  결:
    chapters: [4]
    summary: 전기 끊긴 가산동 지하의 PC. 세션 기록 첫 줄 USER 0001의 시각이 0장 상담 이력과 같다. 2/5 미완료 4,388회. 5/5는 선택이다. 전원선을 뽑아 백십만 명을 끊어도 해수만 안 꺼지고, 모니터만 끄면 안내자로 남고, 자기 번호 0001을 직접 쳐야 은숙 앞에서 첫 날짜를 적어 달라고 말하게 된다.
chapters:
  0:
    title: 근무표
    beat: 기
    tells: 해수의 하루가 남의 부탁으로 채워지는 모양. 지영의 마감 교대, 027번 광철의 즉석밥 환불과 고함, 상혁 어머니의 전화, 상혁 방문 밑의 고지서. 해수는 한 번도 자기 용건을 말하지 않는다.
    turn: 영수증을 찍자 '최초 등록 2019.04.11 14:52 · 최초 처리자 정해수'가 뜬다. 12년 전 첫 손님이 지금 소리 지르는 그 사람이다. 밤에 해수는 이불 속에서 "소리 지르지…"까지 입만 움직이다가 옆방 웃음소리에 닫는다.
    carries: 젖은 체험권(앞치마 주머니 또는 둘째 서랍), 광철의 "내일도 온다", 소리 내지 못한 한마디.
  1:
    title: 체험판
    beat: 승
    tells: 031번 광철이 민원 용지에 정해수 석 자를 쓰고 줄 선 사람들 앞에서 사과를 시킨다. 그날 밤 첫 접속. 레플라는 "다시 오신 걸 환영합니다"로 맞고 2/5에서 고함을 '잘하셨습니다'로 채점한다. 닷새 밤 서른한 번. 낮에는 우산 손님에게 응대 문구가 틀어지고, 광철은 밤마다 들리는 고함 얘기를 하러 와서 드링크만 놓고 간다.
    turn: 체험 시간이 끝난 4월 18일 새벽, 3/5 "손에 쥔 물건을 사용해 보세요". 연필을 내려놓아도 밴드를 떼도 C-14 앞에 다시 세운다. 해수는 다가간다.
    carries: 연필 굵기로 눌린 손바닥, 뚜껑을 안 딴 드링크, 028번을 부르던 호출음.
  2:
    title: C-14
    beat: 승
    tells: 속보와 노란 테이프. 은숙의 1차 진술에서 해수만 센 연필 스무 자루, 112 신고에 남은 고함, '고객센터 그 친구한테 사과할 것' 메모가 차례로 나온다. 밤에 4/5가 낮의 증거를 그대로 책상에 올려놓는다. 집에서는 칫솔이 세 개가 되고 상혁이 3층 손님을 '걔'로 알고 따라간다.
    turn: 다음 날 은숙이 창구에 온다. 지웠다면 은숙의 휴대폰에 있던 사진까지 바뀌어 있고, 안 지웠다면 남은 증거가 전부 해수를 가리킨다. 거기서 한 일이 여기 물건을 바꾼다는 것을 해수가 형사의 입으로 듣는다.
    carries: 은숙이 받아 보겠다던 빌라 현관 영상, 상혁 방의 새 도어락 1270, (조작했다면) 주차 기록에 남은 상혁의 차.
  3:
    title: 고시원 304호
    beat: 전
    tells: 2차 진술에서 해수가 휴대폰 접속 기록을 직접 내민다. 01:32–04:12, 레플라 B2. 은숙은 "거기서 뭐 하셨어요"를 묻고, 무슨 답을 해도 사건은 해수에게 오지 않는다. 지영은 주소를 주면서 가지 말라고 하고 오픈을 대신 맡는다. 태민은 식은 컵과 그대로인 접속자 수, 아무도 만들지 않은 튜토리얼, 넘기기 버튼이 안 뜬 한 사람을 말한다.
    turn: 태민이 떨어뜨린 출입 카드를 해수가 줍는다. 부탁받은 일이 아닌 곳에 가는 것은 12년 만에 처음이다. 그래도 막차 시각과 9시 반 오픈부터 계산한다.
    carries: 기태민 이름이 찍힌 출입 카드, 세션 번호 0001, 닫힌(또는 손가락 두 마디 열린) 상혁의 방문, 어머니의 첫차 5시 10분.
  4:
    title: 서버실
    beat: 결
    tells: 차단기가 다 내려간 서버실에서 PC 한 대의 팬이 돈다. 세션 기록에는 해수가 한 말의 음량, 연필을 내려놓은 41초, 지운 증거가 줄로 남아 있고, 문을 두드린 일과 내 준 차액은 없다. 맨 위 줄의 시각이 0장 상담 이력과 같다.
    turn: 5/5 "선택하세요". 전원선을 뽑으면 백십만 명이 끊기고 해수만 남아 2/5로 돌아간다. 모니터만 끄면 9시 반에 "푹 잤습니다"라고 말하는 안내자가 된다. 0001을 직접 입력하면 팬이 멎고, 해수는 경찰서에서 첫 날짜를 적어 달라고 한다.
    carries: 결말마다 창구에 남는 물건 하나. 뽑아도 다시 꽂히는 연필, 이름 칸이 빈 안내자 명찰, 줄 달린 볼펜과 표시판의 027.
characters:
  해수:
    name: 정해수
    age: 31
    assetIds:
      - 해수
    speakerNames: []
    role: 그린마트 상봉점 고객센터 12년 차. USER 0001
    desire: 아무도 불편하지 않게 오늘 근무를 넘긴다. 그 밑에 12년 동안 광철에게 못 한 "소리 지르지 마세요"가 있다. 사람에게 대접받으러 오는 광철, 맞는 숫자를 받아 적으려는 은숙과 부딪친다
    fear: 자기 용건을 말해서 근무와 집이 틀어지는 것. 3장부터는 자기가 한 일이 상혁 이름으로 적히는 것
    contradiction: 남의 수량과 끼니는 다 세면서 자기 휴지와 우유는 못 산다. 0장에서는 고함을 사과로 받고, 1장 레플라에서만 지르고, 2장에서는 숨기거나 버틴다. 4장에서 0001을 직접 치는 경우에만 은숙에게 "적어 주세요", 팀장에게 볼펜을 부탁한다. 모니터만 끄는 결말에서는 끝까지 "괜찮습니다"다
    dailyLife: 마감 때 연필 스무 자루를 세고, 앞치마를 늘 같은 자리에서 접고, 냉장고 둘째 칸과 달걀 개수를 기억한다. 현관 비밀번호는 입사일 0411
    voice: 상혁·경준에게 반말, 지영·은숙·태민·상혁 어머니에게 존대. 혼잣말도 존대("종이는 안 나오네요"). 몰리면 고객님과 죄송합니다가 샌다. 한 번에 한두 마디, 감정 낱말 대신 시각과 개수를 말한다
  상혁:
    name: 변상혁
    age: 31
    assetIds:
      - 상혁
    speakerNames: []
    role: 물류팀, 해수의 고교 친구이자 5년째 동거인
    desire: 자기 번호를 차단하지 않는 '걔'와 계속 있는 것. 방문을 두드리고 밥을 묻는 해수, 처음 본다는 3층 손님과 부딪친다
    fear: 여기서는 아무도 자기를 모른다는 것. 방 안을 들키는 것
    contradiction: 해수가 묶어 둔 분리수거를 내놓기만 하면서 같이 한다고 말한다. 가까이 오라고 하고 들어오지 말라고 한다. 해수가 우편을 알리고 하루만 쉬자고 하고 사실을 감싸 준 경우에만 3장에서 문을 손가락 두 마디 연다. 아니면 의자 끄는 소리가 전부다
    dailyLife: 이용권과 확장팩의 미납 고지서를 안 뜯는다. 생수 두 병을 방으로 들이고, 달걀 두 개 든 라면을 부탁하면서 밥은 먹었다고 한다
    voice: 해수에게 "야, 해수" 짧은 반말, 지영에게 주임님과 존대. 놀릴 때와 고3 독서실 얘기에서만 길어진다. 방과 우편 얘기에는 말이 끊긴다. 문 너머에서는 속삭인다
  지영:
    name: 민지영
    age: 34
    assetIds:
      - 지영
    speakerNames: []
    role: 고객센터 주임, 해수의 직속 선임
    desire: 레플라에서 손님 노릇 할 저녁 시간과 추천인 한 달 무료. 마감을 떠맡는 해수의 시간과 부딪친다
    fear: 자기가 준 체험권이 해수를 그렇게 만들었다는 것
    contradiction: 커피를 사 주면서 자판기 고장 핑계를 댄다. 0장에서는 마감을 바꿔 달라던 사람이 3장에서는 "내가 오픈할게"라고 쓴다. 미안하다는 말은 문자로만 한다
    dailyLife: 연필을 세라고 시키고, 팀장 흉을 보고, 밥을 먹었는지보다 뭘 먹었는지를 묻는다
    voice: 해수야, 툭툭 끊는 반말. 상혁에게는 상혁 씨와 반말. 챙기는 말도 손익 계산으로 시작한다. 해수의 속을 대신 설명하지 않는다
  경준:
    name: 배경준
    age: 22
    assetIds:
      - 경준
    speakerNames: []
    role: 계산대 아르바이트생
    desire: 소식에 끼고 같이 웃는 것. 이름을 단톡에 쓰지 말라는 지영, 조용히 넘기려는 해수와 부딪친다
    fear: 자기 입 때문에 형이 곤란해지는 것
    contradiction: 말이 먼저 나가고 사과가 뒤따른다. 0장에서 손님 흉내를 내던 애가 2장 계단참에서는 앞치마를 받아 든다
    dailyLife: 아무도 안 쓰는 전자레인지 순번표를 다시 붙인다. 레플라 상봉점에 구경을 간다
    voice: 형, 주임님, 상혁 씨. 해요체로 길게 떠든다. 들은 것과 본 것을 섞어 말하다가 "죄송합니다"로 끊는다
  광철:
    name: 오광철
    age: 58
    assetIds:
      - 광철
    speakerNames: []
    role: 2019년 4월 11일부터 온 단골. 4월 18일 새벽의 피해자
    desire: 하루에 한 번 사람과 말하고 사람 대접을 받는 것. 절차 문구로만 대답하는 해수와 부딪친다
    fear: 뉴스가 끝난 집에 혼자 남는 것. 밤마다 들리는 고함
    contradiction: 외롭다는 말 대신 물건과 직원의 잘못을 찾는다. 0·1장에서는 이름을 쪼개 부르며 고개를 숙이게 하고, 4월 17일에는 사과하러 와서 "아니야, 됐어" 하고 드링크만 놓고 간다. 사과는 휴대폰 메모로만 남는다
    dailyLife: 열두 개들이 즉석밥, 고객의 소리 용지 두 장, 엘리베이터 가까운 C-14 옆에 세우는 회색 경차
    voice: 화나면 호칭 없이 반말과 되묻기("된다는 거야, 안 된다는 거야?"). 기가 꺾인 날에는 자네, 날씨와 냉장고 얘기부터. 외로움이 폭언의 면죄부는 아니다
  은숙:
    name: 차은숙
    age: 45
    assetIds:
      - 은숙
    speakerNames: []
    role: 중랑경찰서 경위, 사건 담당
    desire: 시각과 수량이 맞는 진술을 받아 적는 것. "죄송합니다"로 빠져나가려는 해수, 찍어 둔 사진까지 바뀌는 증거와 부딪친다
    fear: 자기 눈으로 본 물증을 자기도 못 믿게 되는 것
    contradiction: 못 믿을 말은 안 적는 사람인데 3장에서는 "말씀하신 대로 적을게요", 세션 종료 결말에서는 전기 끊긴 건물 얘기와 2019년 날짜를 적는다. 해수의 진술을 받아 적고, 이번에는 물을 마시라고 한다
    dailyLife: 물을 먼저 놓는다. 번호표를 뽑는다. 영상을 세 번 돌려 본다
    voice: 정해수 씨, 존대. 질문 하나에 사실 하나. 마른 말투("사과하실 건 아니고요"). 해수의 고객님 호칭을 따라 하지도 가르치지도 않고 "손님 아니에요"로 끊는다. 레플라는 안 해서 그쪽 말을 더듬는다
  태민:
    name: 기태민
    age: 41
    assetIds:
      - 태민
    speakerNames:
      - 문 안의 남자
    role: 레플라 초기 개발자. 2029년 11월 3일 서버를 끈 사람. 망우동 그린고시원 304호
    desire: 누가 자기 숫자를 믿고 자기 대신 가산동 지하에 가 주는 것. 3단계를 넘긴 방문자가 바로 그 사람이라는 사실과 부딪친다
    fear: 다음 단계를 마친 사람과 한 방에 있는 것. 그 PC 앞에 다시 서는 것
    contradiction: 와서 확인하라고 주소까지 올려놓고, 온 사람에게 오른손을 주머니에 넣어 달라고 한다. 끝까지 직접 가지 않는다. 카드를 주고 문자로만 따라간다
    dailyLife: 매주 월요일 같은 표를 출력해 벽에 붙인다. 컵라면 용기를 바닥에 쌓는다
    voice: 낯선 사람에게 존대로 길게, 숫자부터 말한다. 겁나면 말끝이 반말로 흐른다("안 떨어져"). 웃을 일이 아닐 때 웃는다
  엄마:
    name: 상혁 어머니
    age: 성인
    assetIds:
      - 엄마
    speakerNames: []
    role: 지방에 사는 상혁의 어머니. 문자로만 나온다
    desire: 아들을 방에서 꺼내 데려가는 것. 그 일을 해수에게 기대는 버릇과 부딪친다
    fear: 남의 집 아들에게 자기 아들을 떠맡기고 있다는 것
    contradiction: 표와 비밀번호부터 묻다가 "너는 우리 애도 아닌데"가 나오고 곧바로 고친다. 해수의 괜찮습니다를 받아 주지 않는다
    dailyLife: 콩으로 두부를 만들어 보낸다. 새벽 첫차 표를 끊는다
    voice: 해수야, 반말. 마침표 없는 짧은 문자. 아들 상태를 병명처럼 단정하지 않는다
relationships:
  - id: roommates
    participants:
      - 해수
      - 상혁
    history: 고교 2학년 때부터 친구(6반과 7반). 함께 산 것은 5년째. 밥 당번은 금요일이 상혁인데 지켜진 적이 드물다
    perspectives:
      해수:
        seesOtherAs: 밥과 물을 챙겨야 하는 가까운 친구
        address: 상혁아, 생활 반말
      상혁:
        seesOtherAs: 설명 안 해도 내 편일 친구
        address: 해수야, 놀릴 때만 길어진다
    friction: 해수의 돌봄은 밥·우편·물 두 병이고 상혁이 원하는 것은 방을 건드리지 않는 것이다. 2장에서 해수가 증거를 지우면 그 값이 상혁의 주차 기록으로 간다. 오래 안다고 잠긴 방 안의 일까지 아는 것은 아니다
  - id: supervisor
    participants:
      - 해수
      - 지영
    history: 12년 함께 일한 선후배
    perspectives:
      해수:
        seesOtherAs: 거절하기 어렵지만 도움을 받는 주임
        address: 주임님, 익숙한 존대
      지영:
        seesOtherAs: 자기 돈으로 손님을 달래는 후배
        address: 해수야, 반말
    friction: 지영은 해수의 저녁을 자기 접속 시간으로 바꿔 쓴다. 체험권이 문제였다고 느낀 뒤에는 근무를 대신 서는 것으로 갚는다. 미안함을 새 부탁으로 덮지 않는다
  - id: younger_colleague
    participants:
      - 해수
      - 경준
    history: 나이 차이 있는 가까운 동료
    perspectives:
      해수:
        seesOtherAs: 실수할까 챙기는 후배
        address: 반말, 호통보다 짧은 부탁
      경준:
        seesOtherAs: 질문하고 기대도 되는 형
        address: 형, 해요체
    friction: 경준을 어린아이처럼 모든 예의를 배워야 하는 사람으로 쓰지 않는다
  - id: customer
    participants:
      - 해수
      - 광철
    history: 첫 출근부터 만난 단골
    perspectives:
      해수:
        seesOtherAs: 잘 처리해야 다시 민원이 안 생길 손님
        address: 고객님, 절차 존대
      광철:
        seesOtherAs: 12년째 같은 자리에 있는, 자기 이름을 아는 유일한 직원
        address: 직원에게 반말. 사과하려는 날에는 자네
    friction: 광철은 사람과 말하러 오고 해수는 절차로만 답한다. 광철이 소리를 높일수록 해수의 문구는 더 매끄러워진다. 둘 다 하려던 말을 상대 얼굴에 대고는 못 한다. 해수는 레플라에서, 광철은 휴대폰 메모에 한다
  - id: investigation
    participants:
      - 해수
      - 은숙
    history: 참고인으로 처음 만난다
    perspectives:
      해수:
        seesOtherAs: 자기가 아는 것을 들킬까 두려운 조사자
        address: 형사님, 존대
      은숙:
        seesOtherAs: 말과 물증이 어긋나는 참고인
        address: 정해수 씨, 질문 하나씩
    friction: 은숙은 적을 수 있는 말을 원하고 해수는 사과로 넘기려 한다. 3장에서 해수가 사실을 말하면 이번에는 은숙이 적을 수 없다. 형사는 해수의 내면이나 레플라 규칙을 미리 안다고 말하지 않는다
  - id: developer
    participants:
      - 해수
      - 태민
    history: 형사에게 들은 이름으로 고시원을 찾아간다
    perspectives:
      해수:
        seesOtherAs: 알 수 없는 일을 설명해 줄 개발자
        address: 기태민 씨, 자기소개와 용건부터
      태민:
        seesOtherAs: 이미 진행한 단계가 무서운 방문자
        address: 정해수 씨, 존대
    friction: 태민은 대신 가 줄 사람이 필요하고, 그 사람이 3단계를 넘긴 당사자라서 무섭다. 둘은 '그 사람'이라는 삼인칭으로만 그 일을 말한다. 태민은 범행 심리를 진단하지 않는다
  - id: friend_mother
    participants:
      - 해수
      - 엄마
    history: 고교 때부터 아들의 친구로 안다
    perspectives:
      해수:
        seesOtherAs: 상혁을 맡길 수 있지만 폐를 끼치기 싫은 어른
        address: 어머니, 존대
      엄마:
        seesOtherAs: 자기 아들처럼 지내 온 친구
        address: 해수야, 반말
    friction: 가족의 친밀함과 친구에게 지울 수 없는 책임을 구별한다
  - id: work_joke
    participants:
      - 지영
      - 경준
    history: 같은 매장에서 일하는 선임과 아르바이트생
    perspectives:
      지영:
        seesOtherAs: 소문을 먼저 말하는 후배
        address: 반말
      경준:
        seesOtherAs: 커피와 일을 쥔 주임
        address: 주임님, 해요체
    friction: 놀림 뒤에도 근무나 손님 정보는 정확하게 답한다
  - id: work_seniority
    participants:
      - 상혁
      - 지영
    history: 물류팀 직원과 고객센터 주임
    perspectives:
      상혁:
        seesOtherAs: 자기 접속을 놀리는 직장 선임
        address: 주임님, 존대
      지영:
        seesOtherAs: 해수의 집안일을 맡기는 동료
        address: 상혁 씨, 익숙한 반말
    friction: 해수와 친구라는 이유로 직장 호칭까지 반말로 섞지 않는다
scenes:
  0/lunch:
    participants:
      - 해수
      - 상혁
      - 지영
      - 경준
    relations:
      - roommates
      - supervisor
      - younger_colleague
      - work_seniority
    before: 해수·상혁의 과거는 둘만 세부를 안다. 경준은 동거 소문만 들었다
    exchange: 근무·밥 얘기→경준의 동거 확인→오래된 친구의 정정
    avoid: 낯선 청자에게 설명하려고 친구 둘이 자기 역사를 길게 읊지 않는다
    gesture: 먹던 손을 멈추고 상혁 방문 얘기를 슬쩍 넘긴다
  1/breakroom:
    participants:
      - 해수
      - 지영
      - 경준
    relations:
      - supervisor
      - younger_colleague
      - work_joke
    before: 지영은 민원을 들었지만 해수의 속마음은 듣지 못했다
    exchange: 괜찮다는 자동 대답→실제 근무 용건→음료를 건넨다
    avoid: 지영이 해수의 감정을 정확한 진단처럼 대신 말하지 않는다
    gesture: 커피를 밀어 두고 대답을 강요하지 않는다
  2/tape:
    participants:
      - 해수
      - 경준
      - 은숙
    relations:
      - younger_colleague
      - investigation
    before: 경준과 해수는 경찰이 이름을 아는 경로를 모른다
    exchange: 신원→이름을 아는 경로→참고인 요청→앞치마를 맡긴다
    avoid: 범인이라고 단정하거나 경준이 수사 내용을 이미 안다고 하지 않는다
    gesture: 앞치마를 접다가 주머니에서 뚜껑 안 딴 드링크가 불거진다. 경준이 병째로 받아 든다
    illustration: assets/items/drink.svg
  2/interview:
    participants:
      - 해수
      - 은숙
    relations:
      - investigation
    before: 처음 조사. 해수는 현장 기둥 번호를 안다는 것을 숨기고 싶다
    exchange: 퇴근 시각→귀가→발견 장소를 각각 묻는다
    avoid: 형사가 말하지 않은 C-14를 정상 경로에서 먼저 꺼내지 않는다
    gesture: 물컵을 놓고 녹음기에 눈길을 준다
  3/corridor:
    participants:
      - 해수
      - 태민
    relations:
      - developer
    before: 처음 문 앞에서 만난다. 방문자가 경찰인지도 모른다
    exchange: 경찰 여부→자기소개→찾아온 이유→진행 단계
    avoid: 첫 대사부터 함께 일해 온 개발자처럼 설명을 시작하지 않는다
    gesture: 좁은 방의 컵라면 용기를 피할 자리를 내준다
    branches:
      - when:
          var: tampered
          op: eq
          value: 0
        fact: 3단계를 했고 4단계에는 들어가기만 했다고 말한다.
      - when:
          var: tampered
          op: gte
          value: 1
        fact: 4단계를 했다고 말한다. 태민은 바뀐 증거의 구체적인 종류를 아직 듣지 못했다.
  3/door_mom:
    participants:
      - 해수
      - 상혁
      - 엄마
    relations:
      - roommates
      - friend_mother
    before: 해수는 며칠째 닫힌 방을 봤고 2장에서 예전 현관 도어락을 방문에 옮기며 번호 1270을 유지했다는 말을 들었다. 어머니는 지금 처음 듣는다
    exchange: 본 상태→어머니가 알고 있던 과거→첫차와 비밀번호
    avoid: 전화 한 번으로 상혁의 상태나 병명을 확정하지 않는다
    gesture: 통화가 안 되자 문자로 바꾸고 친구가 들을까 목소리를 낮춘다
  2/interview_rest:
    participants:
      - 해수
      - 은숙
    relations:
      - investigation
    before: 조사에서 연필 수량과 신고 내용을 확인하는 중이다
    exchange: 신고 속 말을 들어 봤냐는 질문→해수의 모호한 인정→당일 근무 확인
    avoid: 알아들은 것처럼 맞장구만 치거나 아직 자백하지 않은 일을 전부 고백하지 않는다
    gesture: 물을 놓아 두었지만 해수는 마시지 않는다
    branches:
      - when:
          var: rage
          op: gte
          value: 2
        fact: 해수는 자기 말이 신고에 남은 것을 알아보지만 정확한 출처를 감춘다.
  0/room:
    participants:
      - 해수
    referenced:
      - 상혁
      - 광철
    relations:
      - roommates
      - customer
    before: 하루 종일 남의 용건만 처리했다. 광철에게 하려던 말은 한 번도 소리가 되지 않았다
    exchange: 알람과 못 산 휴지·우유→이불 속에서 입 모양으로만 "소리, 지르지"→옆방 웃음소리에 입을 닫는다
    avoid: 해수가 그 말의 뜻이나 12년을 스스로 설명하지 않는다. 문장을 끝까지 말하지 않는다
    gesture: 입만 움직이다 닫는다
  1/quiet_customer:
    participants:
      - 해수
      - 광철
      - 경준
    relations:
      - customer
      - younger_colleague
    before: 광철은 닷새째 밤마다 고함을 들었고 사과하러 왔다. 해수는 그 고함이 자기 것인 줄 모른다
    exchange: 영수증 없는 방문→밤에 들리는 소리 얘기→"아니야, 됐어"→즉석밥이 먹을 만했다는 말→드링크
    avoid: 광철이 반듯한 사과문을 말하거나 그 목소리가 해수라고 단정하지 않는다. 해수가 드링크의 뜻을 풀이하지 않는다
    gesture: 광철이 미지근한 드링크를 창구에 놓고, 해수는 따지 않고 앞치마 주머니에 넣는다
    illustration: assets/items/drink.svg
    branches:
      - when:
          var: rage
          op: gte
          value: 2
        fact: 광철은 밤에 들은 말("혼자 다 먹지도 못하면서")을 그대로 옮기고 틀린 말은 아니라고 한다.
  3/second_interview:
    participants:
      - 해수
      - 은숙
    referenced:
      - 상혁
      - 광철
    relations:
      - investigation
      - roommates
      - customer
    before: 은숙은 현관 영상으로 해수가 그날 집을 안 나갔다는 것을 확인했다. 레플라 접속 기록은 아직 못 봤다
    exchange: 현관 영상 결과→(조작 시) 주차 기록과 상혁→"레플라는 하세요?"→해수가 잠금을 풀어 접속 기록을 내민다→"거기 주차장에서는 뭐 하셨어요?"
    avoid: 은숙이 레플라의 규칙이나 튜토리얼 단계를 먼저 아는 척하지 않는다. 해수가 묻지 않은 것까지 한꺼번에 자백하지 않는다
    gesture: 해수가 휴대폰 화면을 은숙 쪽으로 돌려 내려놓는다. 은숙은 볼펜 뚜껑을 닫는다
    branches:
      - when:
          var: tampered
          op: gte
          value: 1
        fact: 원본 증거가 달라져 주차 정산 기록만 남았고, 그 기록에는 상혁의 차가 있다. 해수는 상혁을 감싸는 답을 고를 수 있다.
      - when:
          var: tampered
          op: eq
          value: 0
        fact: 접수증·연필·피해자의 방문이 모두 해수를 가리키지만 은숙은 해수가 나갔다고 쓸 수 없다.
  3/dev_talk:
    participants:
      - 해수
      - 태민
    referenced:
      - 광철
    relations:
      - developer
      - customer
    before: 태민은 문 앞에서 해수의 단계를 들었다. 둘 다 '그 사람'이 누구인지 안다
    exchange: 식은 컵→가산동의 PC 한 대→끄면 백십만 명의 문이 닫힌다→C-14→"그 사람"의 자백이 통하는가→튜토리얼은 아무도 안 만들었다→해수가 가겠다고 말한다→떨어진 카드
    avoid: 둘이 해수를 일인칭으로 지목하지 않는다. 태민이 USER 0001과 해수를 잇지 않는다. 해수가 넘기기 버튼이 자기에게 안 떴다고 여기서 말하지 않는다
    gesture: 태민이 카드를 놓치고 줍지 않는다. 해수가 컵라면 용기 사이에서 줍는다
    branches:
      - when:
          var: told_truth
          op: eq
          value: true
        fact: 해수는 '그 사람'이 경찰서에서 이미 말했고 적히기만 했다고 전한다.
  4/end_close:
    participants:
      - 해수
      - 은숙
      - 지영
    referenced:
      - 광철
    relations:
      - investigation
      - supervisor
      - customer
    before: 해수는 자기 번호 0001을 쳐서 세션을 끊고 왔다. 은숙에게는 여전히 물증이 없다
    exchange: 해수의 "제가 했습니다"→은숙이 아는 사실을 확인→해수가 "적어 주세요"라고 요구→첫 날짜와 시각→물→오후의 창구, 사과 메모, 줄 달린 볼펜
    avoid: 은숙이 믿는다고 말하거나 해수를 위로하지 않는다. 해수가 12년의 뜻을 풀이하지 않는다. 지영이 사건을 아는 척하지 않는다
    gesture: 해수가 처음으로 물을 받아 마신다. 연필꽂이 자리에 줄 달린 볼펜이 놓여 있다
    illustration: assets/items/corded-pen.svg
    branches:
      - when:
          var: told_truth
          op: eq
          value: true
        fact: 은숙은 3장에서 들은 진술(레플라, 3단계, C-14)을 먼저 되짚는다.
