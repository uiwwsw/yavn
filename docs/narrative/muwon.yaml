schemaVersion: 1
gameId: muwon
authorOnlyFacts:
  - 송 의녀는 정조 14년 동짓달 열엿새 밤, 옆 약방(박씨 약방) 청심원을 먹고 업혀 온 아이 둘을 잃었다. 『무원록 언해』 맨 뒷장에 남빛 주머니, 약 냄새 없음, 주머니를 거둬 간 검험 의관(이름은 묻지 못함), 본 사람 송씨와 등잔 든 아이 서연을 적었다. 이튿날 혜민서 기록에는 그 죽음이 송 의녀 탓으로 적혔고 검험관 이름은 한명재다. 송 의녀는 쫓겨나 그해 섣달에 죽었다.
  - 서연은 스승이 쫓겨난 공식 기록은 알지만 뒷장은 날짜 줄만 보고 접었다. 접을 때 '약 냄새 없음'이 눈에 걸렸을 뿐이라, 2장에서 분이의 같은 말을 읽고도 어디서 봤는지 떠올리지 못한다. 뒷장은 9월 29일 밤 처음 편다.
  - 한명재는 전의감 약재의 우황을 빼돌려 서빙고의 전의감 빙실에 쟁이고(얼음 열 덩이 중 일곱), 석회 환을 청심원으로 팔았다. 지난달부터는 비단전 감청 주머니에 담아 '전의감 정품'으로 값을 세 배 받았다. 박씨 약방은 그 환을 받아 팔던 곳이다.
  - 분이는 9월 21일 저녁 박씨 약방에 냄새를 물으러 갔고 그날 밤 하인(곰보)에게 졸려 죽었다. 박씨는 이튿날 아침 한명재가 다녀간 뒤 독을 먹고 죽었고, 하인이 목을 긋고 불을 냈다. 한명재는 그 길에 혜민서 약재실 문간을 지났다.
  - 윤길은 대출 장부에 찍힌 한명재의 도장(오른쪽 아래가 깨짐)을 떠서 9월 23일 새벽 서빙고 원본 출납부와 대 보러 갔다. 빙실에 이틀 묶여 있다가 9월 25일 낮, 하인이 얼음을 받아 가던 때 죽었다.
arc:
  premise: 의녀가 된 지 한 달인 서연은 스승이 베껴 준 『무원록 언해』대로 시신에서 본 것을 시장에 남기려 한다. 사인을 쓰는 붓은 판관 도원이, 사건을 닫는 곤장은 포교 강치수가, 누가 증언할 수 있는지는 의관 한명재가 쥐고 있다. 스승이 기록 한 줄로 쫓겨난 뒤 서연은 책 빈칸에 한 줄도 쓰지 못한다.
  question: 말할 자격이 없다는 의녀와 오작인이 본 것은 누구의 이름으로 기록에 남는가. 기록에 이름이 잘못 적힌 사람의 억울함은 풀리는가.
  기:
    chapters: [0]
    summary: 익사로 신고된 분이를 서연과 막쇠가 검안해 도원이 사인을 '교살'로 고쳐 쓴다. 막쇠는 언해 첫 장에 두 번 쓴 원(冤) 자와 접힌 뒷장을 묻는다. 시장 끝에는 판관 이름 하나만 적힌다.
  승:
    chapters: [1, 2]
    summary: 감청 실이 약주머니 삼백 개와 박씨 약방의 청심원 삼백 환으로 이어진다. 불 속에서 장부와 막쇠 가운데 하나를 고른다. 포도청은 덕구의 자복을 받았고, 강치수는 덕구를 풀어 줄 테니 주머니는 덮자고 한다. 서연은 대질로 자복을 뒤집고, 점순 어미의 주머니를 이번엔 받아 들고, 그 밤 막쇠에게 이름을 써 준다.
  전:
    chapters: [3]
    summary: 서빙고에서 윤길의 몸을 살피다 서연이 언해 빈칸에 처음 적는다. 책과 반대로 굳은 몸을 막쇠가 눌러 본 일이다. 도장이 주문서와 맞고, 빙실에서 석회 환과 우황이 나오고, 막쇠가 찔린다. 하인을 곤장에 넘길지 고른 뒤 도원이 고발장에 의녀와 오작인의 이름을 적는다.
  결:
    chapters: [4]
    summary: 근신을 받은 밤 서연이 뒷장을 펴 스승의 기록을 읽는다. 형조에서 한명재는 자격, 하인, 알리바이, 열두 해의 허물 없음으로 버티고, 서연은 버선·장부나 여금·빈칸의 첫 줄과 막쇠·뒷장으로 답한다. 정조 14년 기록에서 검험관 한명재의 이름이 읽힌다. 판결과 빈칸에 누구 이름이 남는지가 결말을 가른다.
chapters:
  0:
    title: 우물 속 신부
    beat: 기
    tells: 혼례 전날 우물에서 건진 분이를 서연과 막쇠가 처음 함께 살핀다. 막쇠는 글을 못 읽지만 첫 장의 같은 글자 두 개와 접힌 뒷장을 알아본다. 막쇠는 입과 코의 거품을, 서연은 언해의 지게미 검시법을 내놓아 목의 손자국을 드러내고, 오라비는 긁힌 데 없는 손등으로 풀려난다.
    turn: 날 밝기 전에 '익사'로 끝내려던 도원이 '교살'이라 쓴다. 시장 끝에는 초검관 김도원의 이름만 오르고, 막쇠는 "우리 이름은 본래 없다"고 한다.
    carries: 손톱 밑의 감청 실과 비단전 여금, 강치수가 준 오라비의 사흘 기한, 접힌 뒷장과 두 번 쓴 원 자, 아직 서연의 글씨가 한 줄도 없는 스승의 책.
  1:
    title: 타 버린 약방
    beat: 승
    tells: 혜민서 평상에 업혀 온 점순이와 어미의 빈 주머니, 박씨 약방 쪽에서 나와 문간을 지나간 의관의 버선. 여금이 감청 실은 약주머니 삼백 개에만 썼다고 알려 주고 분이가 안섶에 꿰맨 주문서를 내준다(다그치면 입을 닫고 서연이 혼자 찾는다). 주문서의 붉은 도장은 모서리가 깨졌다. 박씨 약방이 불타고, 장부 궤짝과 막쇠 가운데 하나를 먼저 끌어낸다. 은비녀가 놓친 독을 닭 검시로 잡는다.
    turn: 죽음이 둘이 되고 주머니 삼백과 청심원 삼백 환이 맞물린다. 포도청은 시장을 읽지도 않고 덕구에게서 곤장 열 대로 자복을 받았다. 서리 윤길이 전의감 의관이 시장을 빌려 갔다고 말한다.
    carries: 상처 탁본과 닭 실험 기록, 탄 장부의 '한' 자(궤짝 경로는 '구월 열아흐레 받음'과 깨진 도장이 남은 장부 한 장), 소매 속 주문서, 약재실 문간의 의관, 옥에 갇힌 덕구.
  2:
    title: 곤장 아래 자백
    beat: 승
    tells: 옥에서 덕구를 치료하며 낫의 날 폭과 못 쓰는 왼손을 확인한다. 강치수는 덕구와 분이 오라비를 놓아줄 테니 주머니는 덮자고 한다. 거절하면 대질로 자복을 뒤집는다. 9월 24일, 점순 어미가 장에서 산 감청 주머니를 서연이 받아 든다. 그 밤 막쇠가 시반 장을 듣고 제 이름의 생김새를 묻는다.
    turn: 덕구가 지게를 찾으러 나간다(틀리면 새남터에서 막쇠와 시신을 거두고 빈칸에 덕구의 왼손을 적는다. 거래를 받으면 뒷장을 처음 펴서 한 줄을 적고 다시 접는다). 막쇠의 머릿수건 안에 이름 쪽지가 들어간다.
    carries: 윤길의 실종과 빙고 출납 사본, 점순 어미의 주머니, 막쇠의 이름 쪽지와 '추우면 더디다'는 말, 강치수가 답하지 않은 '누구에게 들었나'.
  3:
    title: 서빙고의 얼음
    beat: 전
    tells: 윤길의 시반과 턱, 손등, 손목의 끈 자국으로 오늘 낮에 죽었음을 밝히고 서연이 빈칸에 첫 줄을 적는다. 소매 속 도장 탁본을 주문서와 대 보고, 빙실에서 석회 환·우황·깨진 도장을 찾는다. 막쇠가 찔린다.
    turn: 이름이 물증에 붙는 대신 막쇠가 찔린다(죽으면 서연이 제 손으로 첫 시장을 쓰고 이름 쪽지를 언해에 끼운다). 하인을 곤장에 넘길지 고른다. 틀리면 자리를 내놓아야 하는 도원이 고발장에 수결하고 '검안 의녀'와 '입회 오작인'을 적는다.
    carries: 이름 셋이 적힌 고발장, 윤길의 시장, 빈칸의 첫 줄, 열하나 중 열의 행방, 한명재가 걸고 넘어질 증언 자격.
  4:
    title: 무원
    beat: 결
    tells: 9월 29일 근신, 막쇠의 오두막 또는 무덤, 한명재의 답변서, 그 밤 뒷장. 10월 1일 형조에서 참의 앞에 주문서·버선·장부나 여금·윤길의 시장과 빈칸·뒷장을 차례로 내민다. 강치수는 막내 얘기만 한다.
    turn: 정조 14년 혜민서 기록에서 검험관 한명재의 이름이 읽히고, 묻기만 하던 한명재가 답해야 하는 쪽이 된다. 증좌 넷이 서면 송 의녀에게 씌운 죄가 지워지고 판결문에 입회자 이름이 오른다. 하인을 곤장에 넘겼다면 판결이 반쪽이 된다. 모자라면 한명재가 걸어 나간다.
    carries: 돌아오지 않은 약주머니, 두 번 쓴 원 자의 답, 뒷장에 이어 적은 줄.
characters:
  서연:
    name: 의녀 서연
    age: 18
    assetIds:
      - 서연
    speakerNames: []
    role: 혜민서 의녀가 된 지 한 달
    desire: 시신에서 본 것이 본 그대로 시장에 적히게 한다. 빨리 닫으려는 도원의 붓, 자복으로 끝내려는 강치수의 매, 자격을 따지는 한명재와 차례로 부딪친다
    fear: 틀린 기록 때문에 사람이 죽고, 스승이 기록 한 줄로 쫓겨난 것처럼 자기 글씨가 누군가를 망치는 것. 스승이 정말 틀렸을까 봐 뒷장을 접어 두었다
    contradiction: 관원 앞에서는 본 것을 끝까지 말하면서 스승의 책 빈칸에는 한 줄도 못 쓴다. 3장 서빙고에서 처음 쓰는데, 책과 반대로 굳은 몸을 막쇠가 눌러 본 일이고 끝에 막쇠의 이름을 적는다
    dailyLife: 접힌 뒷장, 접어 둔 귀퉁이, 종이 심지와 고약. 정조 14년 그 밤 등잔을 아이들 얼굴에만 대고 어미들 손은 비추지 않았다. 9월 22일에도 점순 어미 손의 주머니를 보지 않았다가 24일에 받아 든다
    voice: 책에서 배운 대로 또박또박 길게 푼다. 관원에게는 "보았습니다, 확인하겠습니다", 막쇠에게는 아저씨와 해요체, 다친 사람에게는 먼저 할 일을 말하고 기다린다
  막쇠:
    name: 막쇠
    age: 54
    assetIds:
      - 막쇠
    speakerNames: []
    role: 오작인, 현장 경험 마흔 해. 송 의녀와도 일한 적이 있다
    desire: 마흔 해 손으로 익힌 것이 맞았는지 책으로 확인해 보고 싶다. 이름이 적히기를 바란다는 말은 입 밖에 내지 않고, 제 이름이 어떻게 생겼는지만 묻는다
    fear: 본 것을 말했다가 오작인 주제에 나선다고 일에서 밀려나는 것
    contradiction: 현장에서는 손댈 순서를 정하는 선배지만 시장에 자기 이름이 없는 것을 "본래 그렇다"고 넘긴다. 글은 끝까지 못 읽고 글자를 모양으로 본다(두 번 쓴 원 자, '막'은 집, '쇠'는 서 있는 사람). 나이를 모른다
    dailyLife: 등잔 높이, 받칠 손, 닭 값과 다친 다리, 머릿수건 안의 이름 쪽지. 종이에 뭐라 적혔는지는 서연에게 묻는다
    voice: 짧고 거칠게 끊는다. 아가씨, 해요체와 했수. 감탄은 허, 가만, 아이고. 위급할 때만 반말이 튀어나온다
  도원:
    name: 김도원
    age: 26
    assetIds:
      - 도원
    speakerNames: []
    role: 한성부 판관, 초검관
    desire: 자기 이름으로 올린 시장이 뒤탈 없이 끝나기를 바란다. 그래서 본 대로 다 적자는 서연과 처음부터 어긋난다
    fear: 고발이 틀려 판관 자리를 잃는 것
    contradiction: 0장에서는 "사인은 내가 쓰겠소"라며 시장에 제 이름만 적는다. 2장에서 분이 오라비를 관아 문지기로 세워 포도청 손에서 빼고, 3장에서 하인을 곤장에 넘기자고 하면서도 고발장에 의녀와 오작인의 이름을 같이 적는다. 믿음(trust_dowon)은 오라비의 손등을 먼저 본 일, 대질을 한 번도 틀리지 않은 일, 윤길의 죽은 때를 오차와 함께 적은 일에서만 오른다. 2 미만이면 형조에서 일어서지 않는다
    dailyLife: 붓을 놓고 수결과 날짜를 다시 본다. 관아 사람은 포도청이 못 끌어간다는 식의 절차를 안다
    voice: 관청 문어체 하오체로 명령하고 묻는다. 서연을 의녀로 부른다. 책임질 결심을 한 뒤에는 "내가", "내 이름"을 앞세운다
  강치수:
    name: 강치수
    age: 41
    assetIds:
      - 강치수
    speakerNames: []
    role: 포도청 포교
    desire: 사건을 자복으로 빨리 닫아 감청 주머니 뒤의 사람과 엮이지 않는다. 검안으로 사건을 다시 여는 서연과 정면으로 부딪친다
    fear: 배후를 말했다가 아들 둘이 보복당하는 것
    contradiction: 자식은 보호하려면서 남의 몸에는 먼저 매를 든다. 끝까지 달라지지 않는다. 4장에서 주머니를 누구에게 들었느냐는 물음에 "막내가 아직 젖니도 안 빠졌다"고만 한다
    dailyLife: 처결 날짜, 공초, 사흘 기한. 발끝으로 짚을 헤집는 버릇
    voice: 짧은 명령과 되묻기(뭐요, 닦았겠지). 도원 앞에서는 나리와 존대, 가족 얘기에서만 목소리를 낮춘다
  여금:
    name: 여금
    age: 34
    assetIds:
      - 여금
    speakerNames: []
    role: 비단전 행수
    desire: 가게와 전의감 납품을 지키면서 분이의 장례를 제 손으로 치른다. 노란 혼수 비단을 입혀 보낸다
    fear: 증언했다가 자신과 가게가 다치는 것
    contradiction: 계산이 빠르지만 분이의 혼수와 장례는 손수 챙긴다. 실을 먼저 보여 주면 약고 얘기와 분이의 마지막 행선지를 말하고 형조에도 스스로 나온다. 어젯밤 행방부터 다그치면 소매로 가던 손을 멈추고 끈을 다시 매고 나가며, 형조에는 오지 않는다
    dailyLife: 비단의 색, 주문 수량, 장옷 끈
    voice: 처음에는 의녀님과 존대. 범인 취급을 받으면 말을 닫는다
  한명재:
    name: 한명재
    age: 52
    assetIds:
      - 한명재
    speakerNames: []
    role: 전의감 의관. 정조 14년 혜민서 아이 둘의 죽음을 검험해 송 의녀 탓으로 적었다
    desire: 직책과 약 장사를 지킨다. 증좌를 다투지 않고 의녀와 오작인이 말할 자격부터 없애려 한다
    fear: 물증으로 자기 이름이 연결되는 것
    contradiction: 예의를 지키는 말로 상대가 말할 권리를 깎는다. 기록에 이름을 쓰는 쪽이었고, 자기가 쓴 기록에서 자기 이름이 읽힌다. 끝까지 달라지지 않는다. 판결 뒤에도 "삼백 개 중에 몇 개나 찾겠느냐"고 묻는다
    dailyLife: 버선과 소매를 정리하고 수결의 빈틈을 짚는다. 묻는 쪽에 서 있을 때만 편하다
    voice: 매끄럽고 느린 합쇼체. 한 번에 하나만 묻고 답을 받은 뒤 다음 구실로 넘어간다. 참의에게 공손하고, 서연에게는 "의녀께"라 부르며 경력을 깎는다. 목소리를 높이지 않는다
  덕구:
    name: 덕구
    age: 29
    assetIds:
      - 덕구
    speakerNames: []
    role: 짐꾼, 고문 뒤 자복한 사람
    desire: 매가 멎고 제 지게를 찾아 돌아간다. 살려면 "했다"고 해야 한다고 믿어서, 안 했다는 증좌를 찾는 서연의 질문에도 처음에는 자복으로 답한다
    fear: 아프다고 하거나 손을 놓으면 다시 맞는 것
    contradiction: 안 했다고 설명하려다 했다고 먼저 대답한다
    dailyLife: 자기 지게, 오른손으로 쥐는 버릇
    voice: 문장을 끝내지 못한다. 처음에는 사과와 순응. 안전함을 알면 아픈 곳과 필요한 물건을 짧게 말한다
  윤길:
    name: 윤길
    age: 24
    assetIds: []
    speakerNames:
      - 서리 윤길
    role: 한성부 서리. 판관이 쓴 시장과 달마다 서빙고 얼음 출납 사본을 베낀다
    desire: 베끼는 문서에 빠진 것이 없게 한다. 누가 무엇을 빌려 갔는지 대출 장부에 도장까지 받아 둔다
    fear: 자기가 베낀 것이 틀린 채로 남는 것
    contradiction: 물어도 되는 자리인지 따지지 않고 묻는다. 대출 장부의 깨진 도장이 빙고 사본에서 본 것과 같아 원본을 보러 혼자 서빙고에 갔다
    dailyLife: 붓을 든 채 고개를 든다. 들은 것은 그 자리에서 적는다
    voice: 짧은 합쇼체. 용건만 묻고 "적었습니다"로 끝낸다. 1장 해 질 녘에 한 번 말하고, 3장에서는 소매 속 종이로만 남는다
  곰보:
    name: 한명재의 하인
    age: 성인
    assetIds:
      - 곰보
    speakerNames: []
    role: 복면을 쓰고 증거를 막는 하인
    desire: 주인의 지시를 수행한다
    fear: 정체가 드러나는 것
    contradiction: 대사로 자기 사정을 설명하지 않는다. 곤장에 넘겨지면 주인 이름과 장돌림 셋을 댄다
    dailyLife: 왼손의 칼, 다친 정강이
    voice: 대사 없음. 칼과 도주 동선만 보인다
  분이:
    name: 분이
    age: 19
    assetIds: []
    speakerNames: []
    role: 비단전 침모, 첫 피해자
    desire: 살아 있을 때 혼례와 맡은 바느질을 챙겼다
    fear: 약주머니의 이상을 알아챈 뒤의 사정은 단정하지 않는다
    contradiction: 물건에 남긴 기록이 본인의 증언을 대신한다. 감청 주머니의 촘촘한 바늘땀이 분이의 것이다
    dailyLife: 혼수 비단과 저고리 안섶의 종이
    voice: 현재 대사 없음. 타인이 자기 마음을 아는 것처럼 말하지 않는다
  송의녀:
    name: 송 의녀
    age: 성인, 고인
    assetIds: []
    speakerNames: []
    role: 서연의 스승. 정조 14년 동짓달 혜민서에서 쫓겨나 그해 섣달에 죽었다
    desire: 읽을 수 있는 책과 본 사람이 적힌 기록을 남겼다
    fear: 현재 마음은 드러나지 않는다
    contradiction: 기록 한 줄로 쫓겨났지만 자기 기록에도 본 사람의 이름을 적었다. 검험 나온 의관의 이름은 묻지 못했다
    dailyLife: 베껴 쓴 언해, 빈칸의 글씨, 첫 장에 한 번 더 적은 '원' 자(뒷장과 같은 먹). 막쇠는 손이 찬 사람으로 기억한다
    voice: 회상의 인물. 죽기 전 했다는 훈계를 새로 만들어 붙이지 않는다. 남긴 글씨와 기록으로만 나온다
  사령:
    name: 사령
    age: 성인
    assetIds: []
    speakerNames:
      - 사령
    role: 한성부 사령. 1장 우물가에 의녀를 데려온다
    desire: 맡은 심부름을 끝낸다
    fear: 드러나지 않는다
    contradiction: 없음
    dailyLife: 앞서 걷고 길을 안내한다
    voice: 오작인이 누군지 한 줄로 일러 주는 하오체
  점순어미:
    name: 점순 어미
    age: 성인
    assetIds: []
    speakerNames:
      - 점순 어미
    role: 다섯 살 점순이의 어미. 박씨 약방 청심원을, 다음엔 장에서 '전의감' 비단 주머니를 샀다
    desire: 아이 열이 내리는 것
    fear: 약값과 아이
    contradiction: 비싼 주머니일수록 나을 거라 믿는다
    dailyLife: 빈 약주머니 끈을 검지에 두 번 감는다
    voice: 생활 말투. 값을 먼저 묻는다
  혜민서제조:
    name: 혜민서 제조
    age: 성인
    assetIds: []
    speakerNames:
      - 혜민서 제조
    role: 혜민서 책임자. 전의감 공문을 그대로 전한다
    desire: 혜민서가 시비에 엮이지 않는 것
    fear: 전의감과 부딪치는 것
    contradiction: 의녀를 감싸지도 꾸짖지도 않고 공문만 읽는다
    dailyLife: 공문, 출입 명부
    voice: 하게체. 짧다
  분이오라비:
    name: 분이 오라비
    age: 성인
    assetIds: []
    speakerNames:
      - 분이 오라비
    role: 1장 용의자. 3장부터 한성부 문지기
    desire: 다시 끌려가지 않는 것
    fear: 포도청
    contradiction: 노름빚이 있었지만 누이를 죽이지 않았다. 손등부터 봐 준 의녀에게 인사를 전한다
    dailyLife: 관아 문지기 심부름
    voice: 짧은 존대
  형조참의:
    name: 형조 참의
    age: 성인
    assetIds: []
    speakerNames:
      - 형조 참의
    role: 10월 1일 형조 대청의 재판관
    desire: 본 것과 보지 않은 것을 가른다
    fear: 드러나지 않는다
    contradiction: 의녀의 자격을 따지지 않는 대신 본 것만 말하라고 못 박는다. 곤장 아래 자복과 시진까지 못 박은 얼음 송장의 죽은 때는 받지 않는다. 오작인을 직접 불러 말하게 한다
    dailyLife: 같은 장을 여러 번 읽는다
    voice: 쉰 목소리의 짧은 해라체 명령
relationships:
  - id: field_partners
    participants:
      - 서연
      - 막쇠
    history: 첫 우물가의 의녀와 오작인→서로 배우는 현장 동료
    perspectives:
      서연:
        seesOtherAs: 경험에서 배울 어른
        address: 아저씨, 해요체와 부탁
      막쇠:
        seesOtherAs: 책을 읽어 주고 직접 손대는 젊은 의녀
        address: 아가씨, 해요체와 했수
    friction: 글을 읽는 일과 몸을 살피는 일의 선배가 다르다. 막쇠는 이름이 안 적히는 것을 당연하게 넘기고 서연은 그게 걸린다
  - id: record_authority
    participants:
      - 서연
      - 도원
    history: 0장에서는 판관이 듣고 판관 이름만 적는다. 3장에서 판관이 고발장에 의녀의 이름을 같이 적는다
    perspectives:
      서연:
        seesOtherAs: 보고하고 설득할 초검관
        address: 나리, 습니다와 하겠습니다
      도원:
        seesOtherAs: 눈으로 확인한 것을 올릴 의녀
        address: 의녀, 하오체
    friction: 의녀가 본 일의 채택과 책임은 초검관의 권한이다. 서연이 "제 이름으로 올리겠다"고 해도 의녀 이름만으로는 형조 문턱을 못 넘는다
  - id: coercion
    participants:
      - 서연
      - 강치수
    history: 검안과 자복이 부딪힌다
    perspectives:
      서연:
        seesOtherAs: 권한은 있지만 반박해야 할 포교
        address: 나리, 존대하되 확인한 것만
      강치수:
        seesOtherAs: 자기 보고를 흔드는 어린 의녀
        address: 의녀, 신분을 낮춰 위압한다
    friction: 가족의 두려움을 말해도 고문의 책임을 대신 사과해 주지 않는다. 거래에는 덕구와 분이 오라비 두 사람의 몸이 걸려 있다
  - id: merchant_witness
    participants:
      - 서연
      - 여금
    history: 죽은 침모의 시신을 거두러 온 첫 만남
    perspectives:
      서연:
        seesOtherAs: 실과 주문서를 아는 행수
        address: 행수님, 확인하는 존대
      여금:
        seesOtherAs: 시신을 살폈지만 아직 믿지 못하는 의녀
        address: 의녀님, 거래 존대
    friction: 처음부터 범인처럼 몰아붙이면 종이를 내주지 않는다
  - id: care
    participants:
      - 서연
      - 덕구
    history: 매 맞은 죄인에게 치료하러 간다
    perspectives:
      서연:
        seesOtherAs: 진술보다 먼저 돌볼 사람
        address: 이름을 명령처럼 부르지 않고 해요체
      덕구:
        seesOtherAs: 또 때리러 왔을까 두려운 낯선 사람
        address: 존대와 사과
    friction: 사과를 안전하다는 동의로 착각하지 않고 손을 멈춘다
  - id: court_status
    participants:
      - 서연
      - 한명재
    history: 신분 차이 큰 피고와 고발 증언자
    perspectives:
      서연:
        seesOtherAs: 증좌로 반박할 의관
        address: 나리, 보고 존대
      한명재:
        seesOtherAs: 말할 자격부터 자를 의녀
        address: 공손한 어미로 신분을 낮춘다
    friction: 예의를 갖춘 언어와 존중하는 관계는 다르다
  - id: pressure
    participants:
      - 강치수
      - 한명재
    history: 배후의 힘을 알고 사건을 덮는다
    perspectives:
      강치수:
        seesOtherAs: 집안에 해를 줄 수 있는 높은 사람
        address: 위 사람에게 존대
      한명재:
        seesOtherAs: 수사를 끝낼 수 있는 실무자
        address: 직책으로 지시
    friction: 직접 협박 장면이 없으면 구체적인 협박 내용을 지어 확정하지 않는다
  - id: servant
    participants:
      - 한명재
      - 곰보
    history: 주인과 하인
    perspectives:
      한명재:
        seesOtherAs: 입막음과 뒤처리를 맡긴 사람
        address: 본편에서는 장부로만 드러난다
      곰보:
        seesOtherAs: 지시를 받는 주인
        address: 대사 없음
    friction: 보지 않은 살인의 전말을 하인 입으로 설명하지 않는다
  - id: lost_apprentice
    participants:
      - 여금
      - 분이
    history: 가게 일을 맡기고 혼수를 고른 사이
    perspectives:
      여금:
        seesOtherAs: 살림까지 챙긴 가게 아이
        address: 회상에서만 짧게 말한다
      분이:
        seesOtherAs: 고용주이자 일터의 어른
        address: 현재 대사 없음
    friction: 장례 돈을 챙긴 행동과 장부 증언의 위험을 함께 둔다
  - id: teacher
    participants:
      - 서연
      - 송의녀
    history: 정조 14년 동짓달 밤, 아이 둘이 업혀 왔을 때 서연은 열여섯이었고 스승 곁에서 등잔을 들었다. 스승은 그 일로 쫓겨나 그해 섣달에 죽었고 언해는 서연에게 남았다
    perspectives:
      서연:
        seesOtherAs: 기록 때문에 쫓겨난 스승. 그 겨울에 쓴 뒷장은 스승이 정말 틀렸을까 봐 접어 두었다
        address: 스승님, 송 의녀님
      송의녀:
        seesOtherAs: 뒷장에 '등잔 든 아이'로 이름을 적어 둔 제자
        address: 현재 대사 없음. 남긴 기록으로만 말한다
    friction: 서연은 뒷장을 9월 29일 밤에야 편다. 그 전까지 스승의 기록 내용을 아는 것처럼 말하지 않는다
scenes:
  0/night_call:
    participants:
      - 서연
      - 막쇠
      - 도원
    relations:
      - field_partners
      - record_authority
    before: 서연과 막쇠는 첫 현장이다. 막쇠는 글을 못 읽고 언해의 그림만 안다. 책의 빈칸에는 송 의녀 글씨뿐이고 맨 뒷장은 접혀 있다
    exchange: 책이 어디서 났는지→"아가씨 글씨는 없수?"→"저 글자는 왜 두 번 썼수?"→"받았을 때부터 그랬어요"→판관의 "사인은 내가 쓰겠소"
    avoid: 막쇠가 책을 읽었다고 하지 않는다. 서연이 두 번 쓴 이유를 아는 것처럼 말하지 않는다
    gesture: 글을 아는 손과 현장을 아는 손이 등잔 아래서 나란해진다. 막쇠는 글자를 모양으로 짚는다
    illustration: assets/items/eonhae.svg
    referenced:
      - 송의녀
  0/c1_neck_scene:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
      - teacher
    before: 지게미를 덮고 심지 한 번 자를 동안 기다린다
    exchange: 막쇠가 묻는다 "뒷장은 왜 접어 뒀수?"→"스승님 쫓겨나던 겨울에 쓰신 장이라… 안 펴요."→막쇠는 더 묻지 않고 심지를 자른다
    avoid: 뒷장 내용을 말하지 않는다. 서연이 스승의 일을 설명하지 않는다
    gesture: 막쇠가 고개만 끄덕이고 심지를 자른다
    referenced:
      - 송의녀
  0/c1_follow_thread:
    participants:
      - 서연
      - 막쇠
      - 도원
      - 강치수
    relations:
      - field_partners
      - record_authority
    before: 사인은 교살로 고쳐졌고 오라비는 사흘 기한으로 풀려났다
    exchange: 실의 색을 막쇠가 알아봄→도원의 지시→시장에 초검관 이름만→"우리 이름은 없수. 본래 그래요"→"주모 이름도 없지"
    avoid: 서연이나 막쇠가 이름이 빠진 것을 억울하다고 말로 풀지 않는다. 농으로 넘기고 3장 고발장에서 갚는다
    gesture: 도원이 수결한 시장을 접어 소매에 넣고 먼저 나간다
    illustration: assets/items/sijang.svg
  1/silk_merchant:
    participants:
      - 서연
      - 여금
      - 분이
    relations:
      - merchant_witness
      - lost_apprentice
    before: 평상에 점순이가 누워 있고 어미는 빈 주머니를 쥐고 존다. 박씨 약방 쪽에서 나온 의관이 문간을 지나간다. 여금은 장례를 치르러 왔고 사인이 바뀐 줄은 지금 듣는다
    exchange: 검안자 확인→사인→혼수 비단→무엇을 먼저 꺼낼지 고른다
    avoid: 장사 정보부터 캐내기 전에 죽은 사람을 아는 관계를 받는다. 서연은 점순 어미의 주머니 색을 보지 않는다
    gesture: 장옷 끈을 꼭 쥐었다 놓는다
  1/c2_press:
    participants:
      - 서연
      - 여금
    relations:
      - merchant_witness
    before: 서연이 여금을 용의자처럼 다그친다
    exchange: 어젯밤 행방과 다툼을 묻는다→"의녀가 포교 흉내를 내네"→소매로 가던 손이 멈춘다→장례 날짜만 남기고 나간다
    avoid: 여금이 약고 얘기나 분이의 마지막 행선지를 흘리지 않는다
    gesture: 장옷 끈을 다시 맨다. 문간에서 한 번 돌아보고 그냥 나간다
  2/jail_visit:
    participants:
      - 서연
      - 덕구
      - 강치수
    relations:
      - care
      - coercion
    before: 덕구는 낯선 손을 다시 때릴 손으로 본다
    exchange: 의녀임을 밝힘→할 처치→통증 때 멈춤→첫 심문을 묻는다
    avoid: 아프지 않다는 대답만 듣고 처치를 강행하지 않는다
    gesture: 고약 묻은 손을 먼저 거둔다
  2/c3_offer:
    participants:
      - 서연
      - 강치수
    relations:
      - coercion
      - pressure
    before: 포교는 주머니를 먼저 언급해 자기가 아는 것을 드러냈다
    exchange: 은폐 제안→서연이 출처를 확인→가족에 대한 두려움
    avoid: 서연이 포교의 가족을 협박한 것처럼 반응하지 않는다. 서연은 배후가 한명재라고 아직 확정할 수 없다
    gesture: 옥문 밖에서 목소리를 낮추며 안쪽을 살핀다
    referenced:
      - 한명재
  2/c3_night:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
    before: 덕구가 풀려났고 윤길이 이틀째 없다. 점순이의 열이 내렸고 감청 주머니가 서연의 소매에 있다
    exchange: 시반 장을 읽어 준다→"추우면 더디우. 그건 안 적혔수?"→"그럼 적어요"에 붓을 들었다 놓는다→닭 값→"내 이름은 어떻게 생겼수?"→쪽지→나이 모름→"그 장은 아직이우?"
    avoid: 막쇠가 글을 읽게 되지 않는다. 서연이 뒷장을 펴지 않는다. 두 사람이 서로의 고마움을 말로 정리하지 않는다
    gesture: 막쇠가 쪽지를 등잔 가까이, 멀리, 다시 가까이 든다. 두 번 접어 머릿수건에 넣는다
    illustration: assets/items/name_slip.svg
    branches:
      - when:
          var: makssoe_hurt
          op: eq
          value: true
        fact: 막쇠가 왼발을 끌고 온다. 서연은 책보다 바짓단을 먼저 걷고 부목을 댄다.
  3/c4_stiff_scene:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
    before: 시반만으로는 하루인지 사흘인지 모른다(막쇠가 어젯밤 말한 추위)
    exchange: 턱이 거꾸로→막쇠가 손등을 누름→서연이 빈칸에 첫 줄→"아가씨 글씨 처음 보우"→"막쇠는 어디요?"→쪽지와 대 본다→"이거하고 같네"
    avoid: 서연이 글을 쓰게 된 까닭을 설명하지 않는다
    gesture: 막쇠가 등잔을 서연의 손 가까이 내린다
    illustration: assets/items/eonhae_note.svg
  3/c4_farewell:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
    before: 막쇠는 한 시진 전 빈칸에서 제 이름을 봤다. 막쇠가 글을 새로 터득한 것은 아니다
    exchange: 막쇠가 묻는다 "거기 내 이름 적었수?"→"생긴 것 좀 봅시다"→"등잔 낮춰요"→"우물에서 그 실 보던 때처럼 봐요"→"처음보다 목소리가 커졌네"→서연이 제 손으로 쓴 첫 시장, 나이 모름
    avoid: 며칠 만에 혼자 독해했다거나 보지 않은 일을 회상하지 않는다. 막쇠는 고발장에 적힌 제 이름을 보지 못하고 죽는다
    gesture: 서연은 등잔을 책 바로 옆에 내린다. 머릿수건에서 나온 쪽지를 언해 둘째 장에 끼운다
  3/c4_seal_owner:
    participants:
      - 서연
      - 도원
      - 막쇠
    relations:
      - record_authority
      - field_partners
    before: 도장이 한명재의 것으로 확인됐다. 틀리면 도원은 판관 자리를 잃는다. 하인을 곤장에 넘기면 열의 행방을 하루 안에 안다
    exchange: 고발 결심과 두려움→곤장 제안과 선택→"제 이름으로 올릴 수는 없습니까"→"의녀 이름으로는 형조 문턱도 못 넘소"→수결 뒤 두 이름을 더 적음
    avoid: 도원이 뉘우침이나 결심을 길게 설명하지 않는다. 붓으로 한다. 서연이 고맙다고 말하지 않는다
    gesture: 수결한 붓을 다시 먹에 적셔 옆에 두 줄을 쓴다
    illustration: assets/items/accusation.svg
    branches:
      - when:
          var: makssoe_alive
          op: eq
          value: true
        fact: 막쇠가 다친 채 와 있다. 제 이름의 생김새를 이제 알아보고 "이거네. 이건 알아"라고 짚는다.
      - when:
          var: makssoe_alive
          op: eq
          value: false
        fact: 막쇠는 죽었다. 서연은 막쇠의 등잔을 들고 왔고, 도원은 형조가 지우라 할 줄 알면서 이름을 적는다.
  4/interlude_margin:
    participants:
      - 서연
    relations:
      - teacher
    before: 근신을 받았고, 한명재가 '열두 해 허물 없음'이라 답변했다
    exchange: 뒷장을 처음 편다→정조 14년 동짓달 열엿새 밤의 기록→'등잔 든 아이'로 적힌 제 이름→둘째 원 자와 같은 먹
    avoid: 서연이 스승의 무죄를 소리 내어 선언하지 않는다. 검험 의관의 이름을 이 기록에서 알게 하지 않는다
    gesture: 심지를 한 번 자른다
    illustration: assets/items/eonhae_margin.svg
    referenced:
      - 송의녀
  4/trial_open:
    participants:
      - 서연
      - 도원
      - 한명재
      - 막쇠
    relations:
      - record_authority
      - court_status
      - field_partners
    before: 고발장 끝에 의녀와 오작인의 이름이 있다. 한명재는 증좌보다 그 두 이름을 먼저 문제 삼는다
    exchange: 두 이름의 자격→"몇 사건이나"→"세 사건입니다"→판관의 보증 여부(보증하면 "본 사람 입으로 듣는 것이 옳소")→참의의 "본 것만 말하라"
    avoid: 한명재가 한꺼번에 여러 가지를 묻지 않는다. 판관의 권한과 의녀의 역할을 같은 것으로 쓰지 않는다
    gesture: 깨끗한 버선과 마당에 남은 신을 대비한다. 서연이 언해를 기록 옆에 놓는다
    illustration: assets/items/eonhae.svg
    branches:
      - when:
          var: makssoe_alive
          op: eq
          value: true
        fact: 막쇠가 마당에 서 있다. 참의가 불러 직접 말하게 한다.
      - when:
          var: makssoe_alive
          op: eq
          value: false
        fact: 막쇠는 죽었다. 새 대사를 하거나 현재 장면에 서 있을 수 없다. 언해 둘째 장의 쪽지와 줄이 그를 대신한다.
  4/chisu_called:
    participants:
      - 서연
      - 도원
      - 강치수
      - 한명재
    relations:
      - coercion
      - pressure
    before: 2장에서 강치수는 포도청에 올라온 적 없는 감청 주머니를 먼저 꺼냈고, 누구에게 들었느냐는 물음에 답하지 않았다
    exchange: 도원이 같은 것을 다시 묻는다→침묵→"막내가 아직 젖니도 안 빠졌습니다"→"기억나지 않습니다"→한명재가 그 침묵을 제 편으로 쓴다
    avoid: 강치수가 배후를 털어놓거나 뉘우치지 않는다. 한명재가 강치수를 직접 협박하는 말을 하지 않는다
    gesture: 피고 쪽으로 고개를 돌리다 말고 발끝으로 마룻바닥의 옹이를 민다
  4/round5_right:
    participants:
      - 서연
      - 한명재
      - 도원
    relations:
      - court_status
      - teacher
    before: 한명재는 '지난달 처음, 열두 해 허물 없음'으로 버틴다. 서연은 사흘 전 밤에 뒷장을 읽었다
    exchange: 뒷장 진술→"그 밤에 등잔은 제가 들었습니다"→"남빛 주머니는 장에 흔합니다"→참의가 정조 14년 기록을 부름→검험관 한명재→"무슨 색이었습니까"→"보셨으면 아실 텐데"→"못 봤습니다"→점순 어미의 주머니→"평상에 누운 아이를 보시고도요"
    avoid: 한명재가 자백하지 않는다. 서연이 정의를 논하거나 스승의 억울함을 소리 내어 선언하지 않는다
    gesture: 한명재가 소매를 쓸어내리려다 손을 무릎에 얹는다. 흰 가루가 상 위에 묻는다
    illustration: assets/items/eonhae_margin.svg
    referenced:
      - 송의녀
  4/epilogue_full:
    participants:
      - 서연
      - 막쇠
      - 덕구
    relations:
      - field_partners
      - care
      - teacher
    before: 판결문에 막쇠 이름이 올랐고 송 의녀의 죄가 지워졌다. 덕구는 제 지게로 돌아간다
    exchange: 서리에게 두 번 읽어 달랜 판결문→닭 값→"그 두 번 쓴 글자는 이제 알았수?"→"하나는 책 거고요. 하나는 스승님이 그 겨울에 쓰신 거예요"→뒷장에 한 줄→"내 이름 또 들어갔수?"→"많이 들어가네"
    avoid: 성취를 정의나 인간성에 대한 긴 훈계로 닫지 않는다
    gesture: 스승의 글씨 아래 빈칸에 형조가 다시 적었다는 줄과 본 사람 막쇠의 이름을 쓴다
    illustration: assets/items/eonhae_filled.svg
    referenced:
      - 송의녀
