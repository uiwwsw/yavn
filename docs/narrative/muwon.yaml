schemaVersion: 1
gameId: muwon
authorOnlyFacts: []
arc:
  premise: 의녀가 된 지 한 달인 서연은 스승이 베껴 준 『무원록 언해』대로 시신에서 본 것을 시장에 남기려 한다. 사인을 쓰는 붓은 판관 도원이, 사건을 닫는 곤장은 포교 강치수가, 누가 증언할 수 있는지는 의관 한명재가 쥐고 있다.
  question: 말할 자격이 없다는 의녀와 오작인이 시신에서 본 것은 누구의 이름으로 기록에 남는가.
  기:
    chapters: [0]
    summary: 익사로 신고된 분이를 서연과 막쇠가 검안해 도원이 사인을 '교살'로 고쳐 쓴다. 본 것은 시장에 올랐지만 시장 끝에는 판관 이름 하나만 적힌다.
  승:
    chapters: [1, 2]
    summary: 감청 실이 약주머니 삼백 개와 박씨 약방의 청심원 삼백 환으로 이어진다. 포도청은 검안을 읽지도 않고 덕구의 자복을 받았고, 강치수는 덕구를 풀어 줄 테니 주머니는 덮자고 한다. 서연은 탁본과 낫과 덕구의 왼손으로 자복에 맞선다.
  전:
    chapters: [3]
    summary: 서빙고에서 윤길의 몸과 석회 환, 깨진 도장이 나와 한명재의 이름이 물증에 붙는다. 그 값으로 막쇠가 왼손잡이의 칼에 찔린다. 도원은 판관 자리를 걸고 고발장에 제 이름을 쓰고, 그 옆에 의녀와 오작인의 이름을 처음으로 적는다.
  결:
    chapters: [4]
    summary: 형조에서 한명재는 증좌 대신 고발장 끝의 두 이름을 문제 삼는다. 서연이 네 번의 증좌로 답하고 마지막에는 한명재에게 직접 묻는다. 판결문과 스승의 책 빈칸에 누구 이름이 남는지가 네 결말을 가른다.
chapters:
  0:
    title: 우물 속 신부
    beat: 기
    tells: 혼례 전날 우물에서 건진 분이를 서연과 막쇠가 처음 함께 살핀다. 막쇠는 입과 코의 거품을, 서연은 언해의 지게미 검시법을 내놓아 목의 손자국을 드러내고, 포교가 끌고 온 오라비는 긁힌 데 없는 손등으로 풀려난다.
    turn: 날 밝기 전에 '익사'로 끝내려던 도원이 '교살'이라 쓴다. 시장 끝에는 초검관 김도원의 이름만 오르고, 막쇠는 "우리 이름은 본래 없다"고 한다.
    carries: 손톱 밑의 감청 실과 비단전 여금, 강치수가 준 오라비의 사흘 기한, 아직 서연의 글씨가 한 줄도 없는 스승의 책.
  1:
    title: 타 버린 약방
    beat: 승
    tells: 여금이 감청 실은 약주머니 삼백 개에만 썼다고 알려 주고 분이가 안섶에 꿰맨 주문서를 내준다. 주문서가 가리킨 박씨 약방이 그날 불타고, 서연은 은비녀가 놓친 독을 막쇠가 아는 닭 검시로 잡는다.
    turn: 죽음이 둘이 되고 주머니 삼백과 청심원 삼백 환이 맞물린다. 그런데 포도청은 도원의 시장을 읽으러 오지도 않고 짐꾼 덕구에게서 곤장 열 대로 자복을 받았다.
    carries: 상처 탁본과 닭 실험 기록, 탄 장부의 '한' 자, 옥에 갇힌 덕구. 혜민서에 업혀 온 아이 어미가 쥐고 있던, 서연이 색을 보지 않은 약주머니. 그 아이를 한 번 보고 지나간 이름 모를 의관의 버선(4장 대청에서 서연이 알아본다). 시장을 베끼다 지게미 덮는 시간을 물어 적는 서리 윤길(2장 끝에 사라지고 3장에 얼음 사이에서 나온다).
  2:
    title: 곤장 아래 자백
    beat: 승
    tells: 서연이 옥에서 덕구의 매 맞은 자리를 치료하며 낫의 날 폭과 못 쓰는 왼손을 확인한다. 강치수는 덕구와 분이 오라비를 놓아줄 테니 감청 주머니는 덮자고 하고, 거절한 서연은 도원 앞에서 증좌 셋으로 자복을 뒤집어야 한다.
    turn: 검안이 자복을 이겨 덕구가 지게를 찾으러 나간다(틀리면 덕구는 새남터로 간다. 거래를 받으면 이야기는 '침묵의 값'으로 끝난다). 포도청에 올린 적 없는 주머니를 강치수가 먼저 꺼냈으므로, 포교 위에 누가 있다는 것이 드러난다.
    carries: 시장을 베끼던 서리 윤길의 실종, 분이의 시장을 빌려 간 전의감, 강치수가 끝내 답하지 않은 '누구에게 들었나'.
  3:
    title: 서빙고의 얼음
    beat: 전
    tells: 얼음 사이에서 나온 윤길의 시반과 턱으로 죽은 때가 오늘 낮임을 밝히고, 소매 속 종이에서 한명재의 이름을, 곳간에서 석회 환과 깨진 도장을 찾는다. 막쇠를 찾으러 간 안쪽에서 복면 쓴 왼손잡이가 칼을 든다.
    turn: 이름이 물증에 붙는 대신 막쇠가 찔린다(죽으면 서연이 제 이름으로 첫 시장을 쓴다). 틀리면 자리를 내놓아야 하는 도원이 고발장에 수결하고, 그 옆에 '검안 의녀'와 '입회 오작인'을 적는다.
    carries: 이름 셋이 적힌 고발장, 한 치짜리 칼, 한명재가 걸고 넘어질 의녀와 오작인의 증언 자격.
  4:
    title: 무원
    beat: 결
    tells: 형조 대청에서 한명재는 고발장의 두 이름, 서연의 검안 횟수, 스승 박 의녀의 기록을 차례로 문제 삼고, 서연은 시장·주문서·닭 기록·도장으로 답한다. 강치수는 주머니를 누구에게 들었느냐는 물음에 막내 얘기만 한다. 서연은 마지막에 한명재에게 침모의 시장을 왜 빌려 갔느냐고 직접 묻는다.
    turn: 묻기만 하던 한명재가 답해야 하는 쪽이 된다. 증좌 넷이 서면 판결문에 본 사람들의 이름이 오르고, 서연은 스승의 책 빈칸에 처음으로 제 글씨를 쓰며 막쇠의 이름을 먼저 적는다. 모자라면 한명재가 걸어 나간다.
    carries: 돌아오지 않은 약주머니의 수, 아직 많이 남은 책의 빈칸.
characters:
  서연:
    name: 의녀 서연
    age: 18
    assetIds:
      - 서연
    speakerNames: []
    role: 혜민서 의녀가 된 지 한 달
    desire: 시신에서 본 것이 본 그대로 시장에 적히게 한다. 빨리 닫으려는 도원의 붓, 자복으로 끝내려는 강치수의 매, 자격을 따지는 한명재와 차례로 부딪친다
    fear: 틀린 기록 때문에 사람이 죽고, 스승이 베껴 준 책에 틀린 글씨를 보태는 것
    contradiction: 관원 앞에서는 본 것을 끝까지 말하면서 스승의 책 빈칸에는 한 줄도 못 쓴다. 0장에서는 "살피겠습니다"라고 보고만 하고, 4장에서는 한명재에게 직접 묻고, 진결말에서야 빈칸에 처음 쓴다
    dailyLife: 스승 글씨만 있는 언해의 빈칸, 접어 둔 귀퉁이, 종이 심지와 고약. 혜민서에 업혀 온 아이 어미의 주머니 색을 보지 않은 일이 걸려 있다
    voice: 책에서 배운 대로 또박또박 길게 푼다. 관원에게는 "보았습니다, 확인하겠습니다", 막쇠에게는 아저씨와 해요체, 다친 사람에게는 먼저 할 일을 말하고 기다린다
  막쇠:
    name: 막쇠
    age: 54
    assetIds:
      - 막쇠
    speakerNames: []
    role: 오작인, 현장 경험 마흔 해
    desire: 마흔 해 손으로 익힌 것이 맞았는지 책으로 확인해 보고 싶다. 이름이 적히기를 바란다는 말은 입 밖에 내지 않는다
    fear: 본 것을 말했다가 오작인 주제에 나선다고 일에서 밀려나는 것
    contradiction: 현장에서는 손댈 순서를 정하는 선배지만 시장에 자기 이름이 없는 것을 "본래 그렇다"고 넘긴다. 글은 끝까지 못 읽는다. 3장 고발장에서 제 이름이 어떻게 생겼는지 처음 본다(죽는 분기에서는 보지 못한다)
    dailyLife: 등잔 위치, 받칠 손, 닭 값과 다친 다리. 종이에 뭐라 적혔는지는 서연에게 묻는다
    voice: 짧고 거칠게 끊는다. 아가씨, 해요체와 했수. 감탄은 허, 가만, 아이고. 위급할 때만 반말이 튀어나온다
  도원:
    name: 김도원
    age: 26
    assetIds:
      - 도원
    speakerNames: []
    role: 한성부 판관, 초검관
    desire: 자기 이름으로 올린 시장이 뒤탈 없이 끝나기를 바란다. 그래서 본 대로 다 적자는 서연과 처음부터 어긋난다
    fear: 고발이 틀려 판관 자리를 잃는 것
    contradiction: 0장에서는 "사인은 내가 쓰겠소"라며 시장에 제 이름만 적는다. 2장에서 분이 오라비를 관아 문지기로 세워 포도청 손에서 빼고, 3장에서 고발장에 의녀와 오작인의 이름을 같이 적는다. trust_dowon이 2 미만이면 4장에서 "그 이상은 장담하지 못하겠소"로 물러선다
    dailyLife: 붓을 놓고 수결과 날짜를 다시 본다. 관아 사람은 포도청이 못 끌어간다는 식의 절차를 안다
    voice: 관청 문어체 하오체로 명령하고 묻는다. 서연을 의녀로 부른다. 책임질 결심을 한 뒤에는 "내가", "내 이름"을 앞세운다
  강치수:
    name: 강치수
    age: 41
    assetIds:
      - 강치수
    speakerNames: []
    role: 포도청 포교
    desire: 사건을 자복으로 빨리 닫아 감청 주머니 뒤의 사람과 엮이지 않는다. 검안으로 사건을 다시 여는 서연과 정면으로 부딪친다
    fear: 배후를 말했다가 아들 둘이 보복당하는 것
    contradiction: 자식은 보호하려면서 남의 몸에는 먼저 매를 든다. 끝까지 달라지지 않는다. 4장에서 주머니를 누구에게 들었느냐는 물음에 "막내가 아직 젖니도 안 빠졌다"고만 한다
    dailyLife: 처결 날짜, 공초, 사흘 기한. 발끝으로 짚을 헤집는 버릇
    voice: 짧은 명령과 되묻기(뭐요, 닦았겠지). 도원 앞에서는 나리와 존대, 가족 얘기에서만 목소리를 낮춘다
  여금:
    name: 여금
    age: 34
    assetIds:
      - 여금
    speakerNames: []
    role: 비단전 행수
    desire: 가게와 전의감 납품을 지키면서 분이의 장례를 제 손으로 치른다. 주문서를 증좌로 쓰려는 서연과는 이해가 어긋난다
    fear: 증언했다가 자신과 가게가 다치는 것
    contradiction: 계산이 빠르지만 분이의 혼수와 장례는 손수 챙긴다. trust_yeogeum이 1 이상이면 4장에서 납품이 끊길 줄 알고도 약고 얘기를 하고, 0이면 "나도 살아야 하니까"로 입을 닫는다
    dailyLife: 비단의 색, 주문 수량, 장옷 끈
    voice: 처음에는 의녀님과 존대. 범인 취급을 받으면 말을 닫는다
  한명재:
    name: 한명재
    age: 52
    assetIds:
      - 한명재
    speakerNames: []
    role: 전의감 의관
    desire: 직책과 약 장사를 지킨다. 증좌를 다투지 않고 의녀와 오작인이 말할 자격부터 없애려 한다
    fear: 물증으로 자기 이름이 연결되는 것
    contradiction: 예의를 지키는 말로 상대가 말할 권리를 깎는다. 끝까지 달라지지 않는다. 판결 뒤에도 사과 대신 "삼백 개 중에 몇 개나 찾겠느냐"고 묻는다
    dailyLife: 버선과 소매를 정리하고 수결의 빈틈을 짚는다. 묻는 쪽에 서 있을 때만 편하다
    voice: 매끄럽고 느린 합쇼체. 한 번에 하나만 묻고 답을 받은 뒤 다음 구실로 넘어간다. 참의에게 공손하고, 서연에게는 "의녀께"라 부르며 경력을 깎는다. 목소리를 높이지 않는다
  덕구:
    name: 덕구
    age: 29
    assetIds:
      - 덕구
    speakerNames: []
    role: 짐꾼, 고문 뒤 자복한 사람
    desire: 매가 멎고 제 지게를 찾아 돌아간다. 살려면 "했다"고 해야 한다고 믿어서, 안 했다는 증좌를 찾는 서연의 질문에도 처음에는 자복으로 답한다
    fear: 아프다고 하거나 손을 놓으면 다시 맞는 것
    contradiction: 안 했다고 설명하려다 했다고 먼저 대답한다
    dailyLife: 자기 지게, 오른손으로 쥐는 버릇
    voice: 문장을 끝내지 못한다. 처음에는 사과와 순응. 안전함을 알면 아픈 곳과 필요한 물건을 짧게 말한다
  윤길:
    name: 윤길
    age: 24
    assetIds: []
    speakerNames:
      - 서리 윤길
    role: 한성부 서리. 판관이 쓴 시장을 베껴 보관한다
    desire: 베끼는 문서에 빠진 것이 없게 한다. 누가 무엇을 빌려 갔는지도 적어 둔다
    fear: 자기가 베낀 것이 틀린 채로 남는 것
    contradiction: 물어도 되는 자리인지 따지지 않고 묻는다. 그래서 전의감이 왜 침모의 시장을 빌려 갔는지도 묻는다
    dailyLife: 붓을 든 채 고개를 든다. 들은 것은 그 자리에서 적는다
    voice: 짧은 합쇼체. 용건만 묻고 "적었습니다"로 끝낸다. 1장 해 질 녘에 한 번 말하고, 3장에서는 소매 속 종이로만 남는다
  곰보:
    name: 한명재의 하인
    age: 성인
    assetIds:
      - 곰보
    speakerNames: []
    role: 복면을 쓰고 증거를 막는 하인
    desire: 주인의 지시를 수행한다
    fear: 정체가 드러나는 것
    contradiction: 대사로 자기 사정을 설명하지 않는다
    dailyLife: 왼손의 칼, 다친 정강이
    voice: 대사 없음. 칼과 도주 동선만 보인다
  분이:
    name: 분이
    age: 19
    assetIds: []
    speakerNames: []
    role: 비단전 침모, 첫 피해자
    desire: 살아 있을 때 혼례와 맡은 바느질을 챙겼다
    fear: 약주머니의 이상을 알아챈 뒤의 사정은 단정하지 않는다
    contradiction: 물건에 남긴 기록이 본인의 증언을 대신한다
    dailyLife: 혼수 비단과 저고리 안섶의 종이
    voice: 현재 대사 없음. 타인이 자기 마음을 아는 것처럼 말하지 않는다
  박의녀:
    name: 박 의녀
    age: 성인, 고인
    assetIds: []
    speakerNames: []
    role: 서연의 스승
    desire: 읽을 수 있는 책과 확인한 기록을 남겼다
    fear: 현재 마음은 드러나지 않는다
    contradiction: 아이 둘을 살리지 못한 기록도 지우지 않고 남긴 사람. 한명재는 그 기록으로 제자를 공격한다
    dailyLife: 베껴 쓴 언해, 빈칸의 글씨, 첫 장에 한 번 더 적은 '원' 자. 막쇠는 손이 찬 사람으로 기억한다
    voice: 회상의 인물. 죽기 전 했다는 훈계를 새로 만들어 붙이지 않는다. 남긴 글씨와 기록으로만 나온다
relationships:
  - id: field_partners
    participants:
      - 서연
      - 막쇠
    history: 첫 우물가의 의녀와 오작인→서로 배우는 현장 동료
    perspectives:
      서연:
        seesOtherAs: 경험에서 배울 어른
        address: 아저씨, 해요체와 부탁
      막쇠:
        seesOtherAs: 책을 읽어 주고 직접 손대는 젊은 의녀
        address: 아가씨, 해요체와 했수
    friction: 글을 읽는 일과 몸을 살피는 일의 선배가 다르다. 막쇠는 이름이 안 적히는 것을 당연하게 넘기고 서연은 그게 걸린다
  - id: record_authority
    participants:
      - 서연
      - 도원
    history: 0장에서는 판관이 듣고 판관 이름만 적는다. 3장에서 판관이 고발장에 의녀의 이름을 같이 적는다
    perspectives:
      서연:
        seesOtherAs: 보고하고 설득할 초검관
        address: 나리, 습니다와 하겠습니다
      도원:
        seesOtherAs: 눈으로 확인한 것을 올릴 의녀
        address: 의녀, 하오체
    friction: 의녀가 본 일의 채택과 책임은 초검관의 권한이다. 서연이 "제 이름으로 올리겠다"고 해도 의녀 이름만으로는 형조 문턱을 못 넘는다
  - id: coercion
    participants:
      - 서연
      - 강치수
    history: 검안과 자복이 부딪힌다
    perspectives:
      서연:
        seesOtherAs: 권한은 있지만 반박해야 할 포교
        address: 나리, 존대하되 확인한 것만
      강치수:
        seesOtherAs: 자기 보고를 흔드는 어린 의녀
        address: 의녀, 신분을 낮춰 위압한다
    friction: 가족의 두려움을 말해도 고문의 책임을 대신 사과해 주지 않는다. 거래에는 덕구와 분이 오라비 두 사람의 몸이 걸려 있다
  - id: merchant_witness
    participants:
      - 서연
      - 여금
    history: 죽은 침모의 시신을 거두러 온 첫 만남
    perspectives:
      서연:
        seesOtherAs: 실과 주문서를 아는 행수
        address: 행수님, 확인하는 존대
      여금:
        seesOtherAs: 시신을 살폈지만 아직 믿지 못하는 의녀
        address: 의녀님, 거래 존대
    friction: 처음부터 범인처럼 몰아붙이면 종이를 내주지 않는다
  - id: care
    participants:
      - 서연
      - 덕구
    history: 매 맞은 죄인에게 치료하러 간다
    perspectives:
      서연:
        seesOtherAs: 진술보다 먼저 돌볼 사람
        address: 이름을 명령처럼 부르지 않고 해요체
      덕구:
        seesOtherAs: 또 때리러 왔을까 두려운 낯선 사람
        address: 존대와 사과
    friction: 사과를 안전하다는 동의로 착각하지 않고 손을 멈춘다
  - id: court_status
    participants:
      - 서연
      - 한명재
    history: 신분 차이 큰 피고와 고발 증언자
    perspectives:
      서연:
        seesOtherAs: 증좌로 반박할 의관
        address: 나리, 보고 존대
      한명재:
        seesOtherAs: 말할 자격부터 자를 의녀
        address: 공손한 어미로 신분을 낮춘다
    friction: 예의를 갖춘 언어와 존중하는 관계는 다르다
  - id: pressure
    participants:
      - 강치수
      - 한명재
    history: 배후의 힘을 알고 사건을 덮는다
    perspectives:
      강치수:
        seesOtherAs: 집안에 해를 줄 수 있는 높은 사람
        address: 위 사람에게 존대
      한명재:
        seesOtherAs: 수사를 끝낼 수 있는 실무자
        address: 직책으로 지시
    friction: 직접 협박 장면이 없으면 구체적인 협박 내용을 지어 확정하지 않는다
  - id: servant
    participants:
      - 한명재
      - 곰보
    history: 주인과 하인
    perspectives:
      한명재:
        seesOtherAs: 입막음과 뒤처리를 맡긴 사람
        address: 본편에서는 장부로만 드러난다
      곰보:
        seesOtherAs: 지시를 받는 주인
        address: 대사 없음
    friction: 보지 않은 살인의 전말을 하인 입으로 설명하지 않는다
  - id: lost_apprentice
    participants:
      - 여금
      - 분이
    history: 가게 일을 맡기고 혼수를 고른 사이
    perspectives:
      여금:
        seesOtherAs: 살림까지 챙긴 가게 아이
        address: 회상에서만 짧게 말한다
      분이:
        seesOtherAs: 고용주이자 일터의 어른
        address: 현재 대사 없음
    friction: 장례 돈을 챙긴 행동과 장부 증언의 위험을 함께 둔다
  - id: teacher
    participants:
      - 서연
      - 박의녀
    history: 책을 물려준 스승과 후배
    perspectives:
      서연:
        seesOtherAs: 혼자 읽을 때 떠올리는 스승
        address: 의녀님, 존대
      박의녀:
        seesOtherAs: 현재 관점은 드러나지 않는다
        address: 현재 대사 없음
    friction: 스승의 이름이 공격받아도 제자에게 모르는 사실을 주지 않는다
scenes:
  0/night_call:
    participants:
      - 서연
      - 막쇠
      - 도원
    relations:
      - field_partners
      - record_authority
    before: 서연과 막쇠는 첫 현장이다. 막쇠는 글을 못 읽고 언해의 그림만 안다. 책의 빈칸에는 박 의녀 글씨뿐이다
    exchange: 신원→등잔 부탁→책이 어디서 났는지→"아가씨 글씨는 없수?"→판관의 "사인은 내가 쓰겠소"
    avoid: 막쇠가 새 책 전체를 이미 읽었다고 하지 않는다. 서연이 빈칸에 이미 무언가 적었다고 하지 않는다(처음 쓰는 것은 진결말이다)
    gesture: 글을 아는 손과 현장을 아는 손이 등잔 아래서 나란해진다
    illustration: assets/items/eonhae.svg
    referenced:
      - 박의녀
  0/c1_follow_thread:
    participants:
      - 서연
      - 막쇠
      - 도원
      - 강치수
    relations:
      - field_partners
      - record_authority
    before: 사인은 교살로 고쳐졌고 오라비는 사흘 기한으로 풀려났다
    exchange: 실의 색을 막쇠가 알아봄→도원의 지시→시장에 초검관 이름만→"우리 이름은 없수. 본래 그래요"→"주모 이름도 없지"
    avoid: 서연이나 막쇠가 이름이 빠진 것을 억울하다고 말로 풀지 않는다. 농으로 넘기고 3장 고발장에서 갚는다
    gesture: 도원이 수결한 시장을 접어 소매에 넣고 먼저 나간다
    illustration: assets/items/sijang.svg
  1/silk_merchant:
    participants:
      - 서연
      - 여금
      - 분이
    relations:
      - merchant_witness
      - lost_apprentice
    before: 여금은 장례를 치르러 왔고 사인이 바뀐 줄은 지금 듣는다
    exchange: 검안자 확인→사인→혼수 비단→포교도 들었는지
    avoid: 장사 정보부터 캐내기 전에 죽은 사람을 아는 관계를 받는다
    gesture: 장옷 끈을 꼭 쥐었다 놓는다
  2/jail_visit:
    participants:
      - 서연
      - 덕구
      - 강치수
    relations:
      - care
      - coercion
    before: 덕구는 낯선 손을 다시 때릴 손으로 본다
    exchange: 의녀임을 밝힘→할 처치→통증 때 멈춤→첫 심문을 묻는다
    avoid: 아프지 않다는 대답만 듣고 처치를 강행하지 않는다
    gesture: 고약 묻은 손을 먼저 거둔다
  2/c3_offer:
    participants:
      - 서연
      - 강치수
    relations:
      - coercion
      - pressure
    before: 포교는 주머니를 먼저 언급해 자기가 아는 것을 드러냈다
    exchange: 은폐 제안→서연이 출처를 확인→가족에 대한 두려움
    avoid: 서연이 포교의 가족을 협박한 것처럼 반응하지 않는다 서연은 배후가 한명재라고 아직 확정할 수 없다.
    gesture: 옥문 밖에서 목소리를 낮추며 안쪽을 살핀다
    referenced:
      - 한명재
  3/c4_farewell:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
    before: 두 사람은 며칠간 서로의 방법을 배웠다. 막쇠가 글을 새로 터득한 것은 아니다
    exchange: 책 얘기→서연의 치료 시도→"먼저 보고 나중에 적어요"→서연이 제 이름으로 쓴 첫 시장
    avoid: 며칠 만에 혼자 독해했다거나 모르는 유언을 회상하지 않는다. 막쇠는 고발장에 적힌 제 이름을 보지 못하고 죽는다
    gesture: 서연은 책보다 상처를 먼저 누른다
  3/c4_seal_owner:
    participants:
      - 서연
      - 도원
      - 막쇠
    relations:
      - record_authority
      - field_partners
    before: 도장이 한명재의 것으로 확인됐다. 틀리면 도원은 판관 자리를 잃는다. 우물가 시장에는 도원 이름만 있었다
    exchange: 고발 결심과 두려움→서연의 "제 이름으로 올릴 수는 없습니까"→"의녀 이름으로는 형조 문턱도 못 넘소"→수결 뒤 두 이름을 더 적음
    avoid: 도원이 뉘우침이나 결심을 길게 설명하지 않는다. 붓으로 한다. 서연이 고맙다고 말하지 않는다
    gesture: 수결한 붓을 다시 먹에 적셔 옆에 두 줄을 쓴다. 막쇠는 어느 게 제 이름인지 묻는다
    illustration: assets/items/accusation.svg
    branches:
      - when:
          var: makssoe_alive
          op: eq
          value: true
        fact: 막쇠가 다친 채 마당에 와 있다. 글을 못 읽어 제 이름의 생김새를 묻는다.
      - when:
          var: makssoe_alive
          op: eq
          value: false
        fact: 막쇠는 죽었다. 도원은 형조가 지우라 할 줄 알면서 이름을 적는다.
  4/trial_open:
    participants:
      - 서연
      - 도원
      - 한명재
      - 막쇠
    relations:
      - record_authority
      - court_status
      - field_partners
    before: 고발장 끝에 의녀와 오작인의 이름이 있다. 한명재는 증좌보다 그 두 이름을 먼저 문제 삼는다
    exchange: 두 이름의 자격→"검안은 몇 번"→"세 번입니다"→판관의 보증 여부(보증하면 "본 사람 입으로 듣는 것이 옳소")
    avoid: 한명재가 한꺼번에 여러 가지를 묻지 않는다. 판관의 권한과 의녀의 역할을 같은 것으로 쓰지 않는다
    gesture: 깨끗한 버선과 마당에 남은 신을 대비한다. 서연이 스승 글씨뿐인 책을 기록 옆에 놓는다
    illustration: assets/items/eonhae.svg
    branches:
      - when:
          var: makssoe_alive
          op: eq
          value: true
        fact: 막쇠가 마당에 서 있다. 생존자의 증언과 몸짓을 쓸 수 있다.
      - when:
          var: makssoe_alive
          op: eq
          value: false
        fact: 막쇠는 죽었다. 새 대사를 하거나 현재 장면에 서 있을 수 없다.
  4/chisu_called:
    participants:
      - 서연
      - 도원
      - 강치수
      - 한명재
    relations:
      - coercion
      - pressure
    before: 2장에서 강치수는 포도청에 올라온 적 없는 감청 주머니를 먼저 꺼냈고, 누구에게 들었느냐는 물음에 답하지 않았다
    exchange: 도원이 같은 것을 다시 묻는다→침묵→"막내가 아직 젖니도 안 빠졌습니다"→"기억나지 않습니다"→한명재가 그 침묵을 제 편으로 쓴다
    avoid: 강치수가 배후를 털어놓거나 뉘우치지 않는다. 한명재가 강치수를 직접 협박하는 말을 하지 않는다
    gesture: 피고 쪽으로 고개를 돌리다 말고 발끝으로 마룻바닥의 옹이를 민다
  4/final_right:
    participants:
      - 서연
      - 한명재
      - 도원
    relations:
      - court_status
      - record_authority
    before: 재판 내내 한명재가 묻고 서연이 답했다
    exchange: 서연이 처음으로 한명재에게 직접 묻는다(침모의 시장을 왜 빌려 갔나)→한명재의 침묵과 되물음→도장→"나은 사람만 나리를 다시 찾아갑니다"
    avoid: 한명재가 자백하거나 장부에 범행을 적어 둔 것으로 처리하지 않는다. 서연이 정의를 논하지 않는다
    gesture: 한명재가 소매를 쓸어내리려다 손을 무릎에 얹는다
  4/epilogue_full:
    participants:
      - 서연
      - 막쇠
      - 덕구
    relations:
      - field_partners
      - care
    before: 판결문에 막쇠 이름이 올랐고 덕구는 제 지게로 돌아간다. 서연은 아직 스승의 책 빈칸에 한 줄도 쓰지 않았다
    exchange: 서리에게 두 번 읽어 달랜 판결문→다음 검안 약속과 닭 값→빈칸에 처음 쓰는 줄, 막쇠 이름이 먼저
    avoid: 성취를 정의나 인간성에 대한 긴 훈계로 닫지 않는다
    gesture: 스승 글씨 옆 빈칸에 네 줄을 적는다. 첫 줄은 막쇠의 이름으로 시작한다
    illustration: assets/items/eonhae_filled.svg
