schemaVersion: 1
gameId: muwon
authorOnlyFacts: []
characters:
  서연:
    name: 의녀 서연
    age: 18
    assetIds:
      - 서연
    speakerNames: []
    role: 혜민서 의녀가 된 지 한 달
    desire: 본 흔적을 기록해 억울한 사람을 살린다
    fear: 틀린 기록 때문에 사람이 죽고 스승의 일을 훼손하는 것
    contradiction: 손은 빠르지만 관원 앞에서 말할 자격은 매번 의심받는다
    dailyLife: 언해의 빈칸에 직접 본 것을 적는다
    voice: 관원에게 보고 존대, 막쇠에게 아저씨와 해요체, 다친 사람에게 먼저 할 일을 말한다
  막쇠:
    name: 막쇠
    age: 54
    assetIds:
      - 막쇠
    speakerNames: []
    role: 오작인, 현장 경험 마흔 해
    desire: 손으로 본 일이 문서에도 남는다
    fear: 자기가 본 것을 말할 자격이 없다고 지워지는 것
    contradiction: 현장에서는 선배지만 기록 앞에서는 낮은 신분이다
    dailyLife: 등잔 위치, 받칠 손, 닭 값과 다친 다리
    voice: 아가씨, 해요체와 했수. 위급할 때만 반말이 튀어나온다
  도원:
    name: 김도원
    age: 26
    assetIds:
      - 도원
    speakerNames: []
    role: 한성부 판관, 초검관
    desire: 틀리지 않는 기록과 자기 이름을 지킨다
    fear: 고발이 틀려 자리를 잃는 것
    contradiction: 원칙을 알지만 빨리 끝내고 싶고, 끝내는 자기 이름을 건다
    dailyLife: 붓을 놓고 수결과 날짜를 다시 본다
    voice: 하오체. 서연을 의녀로 부르고 보고를 받는다
  강치수:
    name: 강치수
    age: 41
    assetIds:
      - 강치수
    speakerNames: []
    role: 포도청 포교
    desire: 사건을 자복으로 끝내 자기 집을 지킨다
    fear: 배후를 말했다가 가족에게 보복당하는 것
    contradiction: 자식은 보호하려면서 남의 몸에는 먼저 매를 든다
    dailyLife: 처결 날짜, 공초, 질문을 크게 되풀이하는 버릇
    voice: 도원 앞에서는 나리와 존대, 의녀와 죄인에게 위압적인 명령
  여금:
    name: 여금
    age: 34
    assetIds:
      - 여금
    speakerNames: []
    role: 비단전 행수
    desire: 가게와 분이의 장례를 지킨다
    fear: 증언했다가 자신과 가게가 다치는 것
    contradiction: 계산이 빠르지만 분이의 혼수와 장례는 손수 챙긴다
    dailyLife: 비단의 색, 주문 수량, 장옷 끈
    voice: 처음에는 의녀님과 존대. 범인 취급을 받으면 말을 닫는다
  한명재:
    name: 한명재
    age: 52
    assetIds:
      - 한명재
    speakerNames: []
    role: 전의감 의관
    desire: 직책과 장사를 지키고 고발을 끊는다
    fear: 물증으로 자기 이름이 연결되는 것
    contradiction: 예의를 지키는 말로 상대가 말할 권리를 깎는다
    dailyLife: 버선과 소매를 정리하고 수결의 빈틈을 짚는다
    voice: 참의에게 공손한 존대, 서연에게는 의녀께라고 부르며 경력을 깎는다
  덕구:
    name: 덕구
    age: 29
    assetIds:
      - 덕구
    speakerNames: []
    role: 짐꾼, 고문 뒤 자복한 사람
    desire: 매가 멎고 지게를 메고 돌아간다
    fear: 아프다고 하거나 손을 놓으면 다시 맞는 것
    contradiction: 안 했다고 설명하려다 했다고 먼저 대답한다
    dailyLife: 자기 지게, 오른손으로 쥐는 버릇
    voice: 처음에는 사과와 순응. 안전함을 알면 아픈 곳과 필요한 물건을 말한다
  곰보:
    name: 한명재의 하인
    age: 성인
    assetIds:
      - 곰보
    speakerNames: []
    role: 복면을 쓰고 증거를 막는 하인
    desire: 주인의 지시를 수행한다
    fear: 정체가 드러나는 것
    contradiction: 대사로 자기 사정을 설명하지 않는다
    dailyLife: 왼손의 칼, 다친 정강이
    voice: 대사 없음. 칼과 도주 동선만 보인다
  분이:
    name: 분이
    age: 19
    assetIds: []
    speakerNames: []
    role: 비단전 침모, 첫 피해자
    desire: 살아 있을 때 혼례와 맡은 바느질을 챙겼다
    fear: 약주머니의 이상을 알아챈 뒤의 사정은 단정하지 않는다
    contradiction: 물건에 남긴 기록이 본인의 증언을 대신한다
    dailyLife: 혼수 비단과 저고리 안섶의 종이
    voice: 현재 대사 없음. 타인이 자기 마음을 아는 것처럼 말하지 않는다
  박의녀:
    name: 박 의녀
    age: 성인, 고인
    assetIds: []
    speakerNames: []
    role: 서연의 스승
    desire: 읽을 수 있는 책과 확인한 기록을 남겼다
    fear: 현재 마음은 드러나지 않는다
    contradiction: 후배가 받는 존중보다 먼저 책을 남긴 사람
    dailyLife: 베껴 쓴 언해와 빈칸
    voice: 회상의 인물. 죽기 전 했다는 훈계를 새로 만들어 붙이지 않는다
relationships:
  - id: field_partners
    participants:
      - 서연
      - 막쇠
    history: 첫 우물가의 의녀와 오작인→서로 배우는 현장 동료
    perspectives:
      서연:
        seesOtherAs: 경험에서 배울 어른
        address: 아저씨, 해요체와 부탁
      막쇠:
        seesOtherAs: 책을 읽어 주고 직접 손대는 젊은 의녀
        address: 아가씨, 해요체와 했수
    friction: 글을 읽는 일과 몸을 살피는 일의 선배가 다르다
  - id: record_authority
    participants:
      - 서연
      - 도원
    history: 기록에 이름을 올리는 관원과 검안자
    perspectives:
      서연:
        seesOtherAs: 보고하고 설득할 초검관
        address: 나리, 습니다와 하겠습니다
      도원:
        seesOtherAs: 눈으로 확인한 것을 올릴 의녀
        address: 의녀, 하오체
    friction: 의녀가 본 일의 채택과 책임은 초검관의 권한이다
  - id: coercion
    participants:
      - 서연
      - 강치수
    history: 검안과 자복이 부딪힌다
    perspectives:
      서연:
        seesOtherAs: 권한은 있지만 반박해야 할 포교
        address: 나리, 존대하되 확인한 것만
      강치수:
        seesOtherAs: 자기 보고를 흔드는 어린 의녀
        address: 의녀, 신분을 낮춰 위압한다
    friction: 가족의 두려움을 말해도 고문의 책임을 대신 사과해 주지 않는다
  - id: merchant_witness
    participants:
      - 서연
      - 여금
    history: 죽은 침모의 시신을 거두러 온 첫 만남
    perspectives:
      서연:
        seesOtherAs: 실과 주문서를 아는 행수
        address: 행수님, 확인하는 존대
      여금:
        seesOtherAs: 시신을 살폈지만 아직 믿지 못하는 의녀
        address: 의녀님, 거래 존대
    friction: 처음부터 범인처럼 몰아붙이면 종이를 내주지 않는다
  - id: care
    participants:
      - 서연
      - 덕구
    history: 매 맞은 죄인에게 치료하러 간다
    perspectives:
      서연:
        seesOtherAs: 진술보다 먼저 돌볼 사람
        address: 이름을 명령처럼 부르지 않고 해요체
      덕구:
        seesOtherAs: 또 때리러 왔을까 두려운 낯선 사람
        address: 존대와 사과
    friction: 사과를 안전하다는 동의로 착각하지 않고 손을 멈춘다
  - id: court_status
    participants:
      - 서연
      - 한명재
    history: 신분 차이 큰 피고와 고발 증언자
    perspectives:
      서연:
        seesOtherAs: 증좌로 반박할 의관
        address: 나리, 보고 존대
      한명재:
        seesOtherAs: 말할 자격부터 자를 의녀
        address: 공손한 어미로 신분을 낮춘다
    friction: 예의를 갖춘 언어와 존중하는 관계는 다르다
  - id: pressure
    participants:
      - 강치수
      - 한명재
    history: 배후의 힘을 알고 사건을 덮는다
    perspectives:
      강치수:
        seesOtherAs: 집안에 해를 줄 수 있는 높은 사람
        address: 위 사람에게 존대
      한명재:
        seesOtherAs: 수사를 끝낼 수 있는 실무자
        address: 직책으로 지시
    friction: 직접 협박 장면이 없으면 구체적인 협박 내용을 지어 확정하지 않는다
  - id: servant
    participants:
      - 한명재
      - 곰보
    history: 주인과 하인
    perspectives:
      한명재:
        seesOtherAs: 입막음과 뒤처리를 맡긴 사람
        address: 본편에서는 장부로만 드러난다
      곰보:
        seesOtherAs: 지시를 받는 주인
        address: 대사 없음
    friction: 보지 않은 살인의 전말을 하인 입으로 설명하지 않는다
  - id: lost_apprentice
    participants:
      - 여금
      - 분이
    history: 가게 일을 맡기고 혼수를 고른 사이
    perspectives:
      여금:
        seesOtherAs: 살림까지 챙긴 가게 아이
        address: 회상에서만 짧게 말한다
      분이:
        seesOtherAs: 고용주이자 일터의 어른
        address: 현재 대사 없음
    friction: 장례 돈을 챙긴 행동과 장부 증언의 위험을 함께 둔다
  - id: teacher
    participants:
      - 서연
      - 박의녀
    history: 책을 물려준 스승과 후배
    perspectives:
      서연:
        seesOtherAs: 혼자 읽을 때 떠올리는 스승
        address: 의녀님, 존대
      박의녀:
        seesOtherAs: 현재 관점은 드러나지 않는다
        address: 현재 대사 없음
    friction: 스승의 이름이 공격받아도 제자에게 모르는 사실을 주지 않는다
scenes:
  0/night_call:
    participants:
      - 서연
      - 막쇠
      - 도원
    relations:
      - field_partners
      - record_authority
    before: 서연과 막쇠는 첫 현장이다. 막쇠는 아직 언해의 내용을 읽지 못한다
    exchange: 신원→등잔 부탁→책의 글→판관의 보고 지시
    avoid: 막쇠가 새 책 전체를 이미 읽었다고 하지 않는다
    gesture: 글을 아는 손과 현장을 아는 손이 등잔 아래서 나란해진다
  1/silk_merchant:
    participants:
      - 서연
      - 여금
      - 분이
    relations:
      - merchant_witness
      - lost_apprentice
    before: 여금은 장례를 치르러 왔고 사인이 바뀐 줄은 지금 듣는다
    exchange: 검안자 확인→사인→혼수 비단→포교도 들었는지
    avoid: 장사 정보부터 캐내기 전에 죽은 사람을 아는 관계를 받는다
    gesture: 장옷 끈을 꼭 쥐었다 놓는다
  2/jail_visit:
    participants:
      - 서연
      - 덕구
      - 강치수
    relations:
      - care
      - coercion
    before: 덕구는 낯선 손을 다시 때릴 손으로 본다
    exchange: 의녀임을 밝힘→할 처치→통증 때 멈춤→첫 심문을 묻는다
    avoid: 아프지 않다는 대답만 듣고 처치를 강행하지 않는다
    gesture: 고약 묻은 손을 먼저 거둔다
  2/c3_offer:
    participants:
      - 서연
      - 강치수
    relations:
      - coercion
      - pressure
    before: 포교는 주머니를 먼저 언급해 자기가 아는 것을 드러냈다
    exchange: 은폐 제안→서연이 출처를 확인→가족에 대한 두려움
    avoid: 서연이 포교의 가족을 협박한 것처럼 반응하지 않는다 서연은 배후가 한명재라고 아직 확정할 수 없다.
    gesture: 옥문 밖에서 목소리를 낮추며 안쪽을 살핀다
    referenced:
      - 한명재
  3/c4_farewell:
    participants:
      - 서연
      - 막쇠
    relations:
      - field_partners
    before: 두 사람은 며칠간 서로의 방법을 배웠다. 막쇠가 글을 새로 터득한 것은 아니다
    exchange: 책 얘기→서연의 치료 시도→현장에서 하던 짧은 당부
    avoid: 며칠 만에 혼자 독해했다거나 모르는 유언을 회상하지 않는다
    gesture: 서연은 책보다 상처를 먼저 누른다
  4/trial_open:
    participants:
      - 서연
      - 도원
      - 한명재
      - 막쇠
    relations:
      - record_authority
      - court_status
      - field_partners
    before: 피고는 의관이고 서연은 판관을 통해 말을 올린다
    exchange: 자격 공격→검안 경력의 답→초검관의 보증 여부
    avoid: 판관의 권한과 의녀의 역할을 같은 것으로 쓰지 않는다
    gesture: 깨끗한 버선과 마당에 남은 신을 대비한다
    branches:
      - when:
          var: makssoe_alive
          op: eq
          value: true
        fact: 막쇠가 마당에 서 있다. 생존자의 증언과 몸짓을 쓸 수 있다.
      - when:
          var: makssoe_alive
          op: eq
          value: false
        fact: 막쇠는 죽었다. 새 대사를 하거나 현재 장면에 서 있을 수 없다.
  4/epilogue_full:
    participants:
      - 서연
      - 막쇠
      - 덕구
    relations:
      - field_partners
      - care
    before: 기록에 막쇠 이름이 올랐고 덕구는 제 지게로 돌아간다
    exchange: 이름이 적힌 기쁨→다음 현장 약속→배운 것을 함께 쓴다
    avoid: 성취를 정의나 인간성에 대한 긴 훈계로 닫지 않는다
    gesture: 빈칸에 함께 본 일과 이름을 적는다
