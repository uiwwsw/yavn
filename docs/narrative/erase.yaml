schemaVersion: 1
gameId: erase
authorOnlyFacts:
  - 하린과 도윤은 같은 사람의 다른 신원이다. 시술은 이름과 얼굴과 본인의 기억을 바꿨고, 남의 기억은 바꾸지 않았다. 2장 상담실 전까지 도윤은 열여덟 전 공백을 사고 때문이라고 믿는다.
  - 아진은 1장 사진관에서 웃는 모양과 이름 끝의 점으로 하린을 알아본다. 아진은 2016년 3월 29일 클리닉 1층 유리문 밖에서 네 시간을 기다렸고, 처음 보는 얼굴로 나온 하린이 웃는 것을 보고 알았다. 하린은 시술 전 그 유리문 너머의 아진을 보고 계단 쪽으로 돌아섰다.
  - 단톡방 소문은 민재가 한 명에게 말한 데서 퍼졌다. 아진은 퍼뜨리지 않았다. 아진은 그 학년 끝까지 하린의 옆자리를 비워 뒀다.
arc:
  premise: 결혼을 4주 앞둔 한도윤은 청첩장 사진을 찍던 날 처음 보는 사진작가 정아진에게 "하린아"라는 이름으로 불린다. 도윤에게는 열여덟 전 기억이 없다. 사고 때문이라고 알고 살았다. 아진은 그 이름을 열한 해 동안 기억하고 있었다.
  question: 내 기억만 지우는 시술 앞에서, 나를 기억하는 사람을 두 번 지울 것인가.
  기:
    chapters: [0]
    summary: 사진관에서 도윤이 눈이 없어지게 웃자 작가 아진이 셔터를 멈추고 "하린아?"라고 부른다. 계약서 이름 끝의 작은 점에서 아진의 펜이 멈춘다. 그날 밤 하객 명단의 도윤 쪽은 회사 사람 열두 명뿐이고, 사진첩은 2016년 3월에서 시작한다. 아진이 열여덟 살 때 찍은 사진을 보내고 도윤은 지우거나 남기거나 잘못 보냈다고 답한다. 11년 전 점심, 하린은 이어폰을 "됐어"로 사양하고 아진은 웃는 하린을 찍는다.
  승:
    chapters: [1]
    summary: 도윤은 매주 월요일 회사 식당 메뉴를 찍는다. 앨범 시안을 건네며 아진이 "점심 메뉴, 찍으세요?"라고 묻고, 하린이 급식표를 찍었다는 것과 비워 둔 옆자리 얘기를 한다. 도윤은 더 듣거나, 이유를 묻거나, 일어선다. 사진을 지우고 일어선 사람에게는 아진이 더 연락하지 않는다. 지수에게 사실대로 말하면 "그 사람한테만 말고 나한테도 말해 줘"를 듣는다. 11년 전 하린은 뒷문에서 민재의 "걔 신경 안 쓸걸"을 듣고 손을 뗀다.
  전:
    chapters: [2, 3]
    summary: 도윤의 유일한 서류, 퇴원 확인서의 발급처는 ERASE 클리닉이다. 상담실 화면에 '신청인 본인, 시술 전 성명 유하린'과 이름 끝의 점이 뜬다. 사고가 아니었다. 그날 밤 아진은 하린의 교실에서 단톡 소문, 차단, 그리고 클리닉 유리문 밖 네 시간을 말한다. 처음 보는 사람이 웃었고 아진 앞을 그냥 지나갔다. 11년 전 하린은 아진에게 "카레"를 들키고 "지우지 말고"와 함께 놀이터 사진을 받는다. 단톡방이 터진 밤부터 시술대까지를 하린 쪽에서 본다. 지수가 퇴원 확인서를 식탁에 올려놓고 "요즘 어디 다녀? 회사 말고"라고 묻는다.
  결:
    chapters: [4]
    summary: 결혼 나흘 전 오전 9시 40분, 예약한 클리닉 1층. 지수와 (아진의 말을 끝까지 들었다면) 아진의 메시지가 온다. 3층에 올라가면 떨리지 않는 손으로 한도윤이라고 쓰고 유리문 밖의 사람을 두 번째로 지나친다. 사진관에 가면 옆자리에 앉아 처음부터 듣겠다고 한다. 지수에게 전화하면 유하린이라는 이름을 처음 말한다. 앞서 털어놓았다면 지수가 그 이름을 불러 보고, 아니라면 반지를 신발장 위에 둔다.
chapters:
  0:
    title: 셔터
    beat: 기
    tells: 2016년 3월 29일 시술실의 서명과 유리문 밖 교복 입은 아이. 11년 뒤 사진관, 대신 온 작가 정아진. 도윤이 웃자 아진이 "하린아?"라고 부르고 사과한다. 지수는 눈 감은 컷을 청첩장으로 고른다. 아진이 고등학교를 묻고 도윤은 사고로 기억이 없다고 하거나 그 사람이 아니라고 한다. 밤에 하객 명단과 날짜 없는 놀이터 사진. 아진이 보낸 사진을 지우거나 남기거나 잘못 보냈다고 답한다. 11년 전 점심 돈까스와 이어폰.
    turn: 처음 보는 사람이 도윤이 모르는 이름을 정확한 웃음 모양으로 알아본다. 그리고 도윤은 그 사람이 보낸 사진에서 자기 웃음을 본다.
    carries: 청첩장 시안과 날짜 없는 놀이터 사진. 아진에게 말한 "사고"(또는 부정). 지우거나 남긴 아진의 사진. 11년 전 아진이 찍은 웃는 하린.
  1:
    title: 급식표
    beat: 승
    tells: 월요일 아침 식당 메뉴를 찍는 버릇. 수요일 사진관에서 아진이 버릇을 짚고 비워 둔 옆자리를 말한다. 도윤이 더 듣겠다고 하면 하린의 돈까스, 사천 원 떡볶이, "관심 없어"라는 입버릇과 그걸 믿은 사람들 얘기를 듣는다. 지수에게 사실대로 말하거나 앨범 얘기만 했다고 한다. 11년 전 방과 후 뒷문.
    turn: 사진을 지우고 앨범만 받아 일어나면 아진은 더 연락하지 않고 결혼식 날 화환 리본에만 이름을 남긴다(지나간 사람). 아니라면 도윤의 버릇이 남의 기억과 맞물리기 시작한다.
    carries: 아진의 말을 끝까지 들었는지(listened). 지수에게 한 첫 고백(told_jisu). 하린이 들은 "걔 신경 안 쓸걸"과 카레 핑계.
  2:
    title: 사고가 아니었다
    beat: 전
    tells: ERASE 클리닉 상담실, 동의서 사본의 유하린과 점. 상담사는 남의 기억은 바뀌지 않는다고, 두 번 받는 사람도 있다고 한다. 도윤은 날짜를 잡거나 그냥 나온다. 처음으로 아진에게 먼저 연락하고, 밤의 3학년 2반에서 아진이 단톡 소문과 유리문 밖 네 시간을 말한다. 도윤은 미안하다고 하거나 그건 하린이라고 한다. 11년 전 과학실, 카레가 아니라 닭볶음탕, "지우지 말고".
    turn: 사고가 아니었다, 내가 신청했다는 기록. 그리고 기억하는 사람 쪽에서 본 같은 날. 처음 보는 사람이 아진 앞을 그냥 지나갔다.
    carries: 클리닉 예약 여부(booked). 교실에서의 사과(sorry). 하린이 저장한 놀이터 사진.
  3:
    title: 지우지 말고
    beat: 전
    tells: 11년 전 목요일 밤 단톡방, 금요일 결석, 차단, 토요일 새벽 사진 삭제와 남긴 한 장, 월요일 "나 그 병원 갈래", 화요일 유리문 너머의 아진과 돌아선 하린, 동의서. 현재, 결혼 닷새 전 월요일 밤 식탁의 퇴원 확인서. 도윤은 전부 말하거나 옛 친구만 말하거나 아무 일 없다고 한다. 새벽 3시 예약 문자.
    turn: 지수의 질문 "나도 언젠가 지울 수 있는 거야?"와 도윤의 첫 "모르겠어". 그 밤에도 손은 예약 버튼을 누른다.
    carries: 지수에게 털어놓은 정도(told_jisu). 다음 날 오전 10시 예약.
  4:
    title: ERASE
    beat: 결
    tells: 결혼 나흘 전 비 오는 클리닉 1층. 지수의 저녁 약속, (들었다면) 아진의 점심 약속. 3층, 사진관, 지수에게 거는 전화 중 하나.
    turn: 열한 해 전과 같은 계단과 유리문 앞에서 이번에는 고를 수 있다.
    carries: 결말이 남기는 것 하나. 떨리지 않는 서명과 두 번째로 지나친 사람(ERASE). 옆자리와 "안 지워요"(옆자리). 지수가 불러 본 이름(두 이름). 신발장 위 반지와 지우지 않은 메시지(완성되지 않은 사람).
characters:
  도윤:
    name: 한도윤
    age: 29
    assetIds:
      - 도윤
    speakerNames: []
    role: 회사원, 지수의 약혼자. 열여덟 전 기억이 없고 사고 때문이라고 알고 산다. 1장에서 모르는 이름으로 불리고, 3장에서 자기가 그 이름을 지워 달라고 했다는 걸 본다. 마지막에 다시 지울지 고른다
    desire: 지수와 결혼해 지금처럼 살고 싶다. 그래서 불편한 것은 손이 먼저 지운다. 지운 것을 기억하는 아진과 부딪힌다
    fear: 자기가 모르는 자기를 남이 더 잘 아는 것
    contradiction: 기억이 없는 걸 아무렇지 않게 말하면서 그 빈칸을 한 번도 찾아보지 않았다. 버릇은 남았다. 이름 끝의 점, 웃으면 없어지는 눈, 월요일마다 찍는 메뉴
    dailyLife: 눈 감은 사진을 지워 달라 하고, 받은 사진은 휴지통까지 비운다. 회사 식당 주간 메뉴를 찍는다
    voice: 짧다. 지수에게는 반말, 아진에게는 존대. 몰리면 "……"와 되묻기. 3장 뒤로 "모르겠어", "미안해요"처럼 처음 하는 말이 생긴다
  지수:
    name: 이지수
    age: 29
    assetIds:
      - 지수
    speakerNames: []
    role: 도윤의 약혼자. 도윤 쪽 하객석이 비는 것을 농담으로 메워 준다. 3장에서 퇴원 확인서를 식탁에 올려놓고 묻는다
    desire: 도윤의 일을 남이 아니라 도윤 입으로 듣고 싶다
    fear: 도윤이 언젠가 자기도 지울 수 있다는 것
    contradiction: 다정하게 넘겨 주면서 넘겨 준 것을 다 기억한다
    dailyLife: 눈 감은 컷을 청첩장으로 고르고, 놀이터 사진의 아이를 하객 1번이라고 부른다
    voice: 도윤아, 친밀한 반말. 화가 나면 질문을 하나씩 하고 기다린다. 결정은 짧게 말한다
  어른아진:
    name: 정아진
    age: 29
    assetIds:
      - 어른아진
    speakerNames:
      - 정아진
    role: 웨딩 사진작가. 하린의 고등학교 친구. 열한 해 전 클리닉 유리문 밖에서 기다렸고, 하린의 학교 졸업 앨범을 해마다 찍는다
    desire: 하린을 되찾고 싶은 게 아니라, 그 자리를 비워 뒀다는 걸 한 번은 말하고 싶다
    fear: 다시 말을 미루다 또 아무 말도 못 하는 것
    contradiction: 더 귀찮게 안 하겠다고 하면서 사진을 보내고, 시안을 핑계로 부른다
    dailyLife: 셔터를 빨리 누르고 카메라 끈을 손에 감는다. 앨범 시안을 끝까지 넘긴 뒤에 말한다
    voice: 도윤에게 존대. 짧고 정확하다. 하린 얘기를 할 때만 길어지고, 웃어도 눈은 안 웃는다. 3장에서 처음 반말이 섞인다("기억 안 나는 사람이 왜 사과를 해")
  하린:
    name: 유하린
    age: 18
    assetIds:
      - 하린
    speakerNames: []
    role: 열한 해 전의 도윤. 아진·민재와 같은 반 고3. 뒷문에서 듣고, 카레를 들키고, 단톡방이 터진 뒤 클리닉에 간다
    desire: 셋 사이에서 빠지고 싶지 않다. 아진이 자기를 먼저 골라 주면 좋겠다
    fear: 끼고 싶다는 마음이 들키는 것
    contradiction: 제일 끼고 싶으면서 관심 없다고 말한다. 다 지우면서 놀이터 사진 한 장은 남긴다
    dailyLife: 돈까스 급식표를 찍고, 사천 원으로 떡볶이를 반 쏘겠다고 한다
    voice: 빠른 반말, 문자엔 ㅋㅋ. 다치면 "됐어", "뭐가 미안해"로 먼저 닫는다
  아진:
    name: 정아진
    age: 18
    assetIds:
      - 아진
    speakerNames:
      - 아진
    role: 하린의 일곱 살 때부터 친구, 민재의 연인. 말을 미루다 과학실에서 미룬 것부터 인정한다
    desire: 하린도 민재도 잃지 않고 사귄다는 걸 직접 말하고 싶다
    fear: 말한 순간 하린이 떠나는 것
    contradiction: 하린의 급식 취향은 챙기면서 정작 해야 할 말은 미룬다
    dailyLife: 이어폰 한쪽을 내밀고, 웃는 하린을 찍고, 놀이터 사진을 보낸다
    voice: 하린아로 시작하는 반말. "지우지 말고"라고 말하는 유일한 사람
  민재:
    name: 서민재
    age: 18
    assetIds:
      - 민재
    speakerNames: []
    role: 하린·아진의 반 친구, 아진의 연인
    desire: 편한 분위기. 하린에게 따로 설명할 일은 없었으면 한다
    fear: 불편한 설명을 떠맡는 것
    contradiction: 하린을 미워하지 않지만 "관심 없어"를 그대로 믿으면 자기가 편하다
    dailyLife: 아진에게만 노래를 골라 보낸다
    voice: 제일 짧은 반말. "나 뭐 좀 할 게 있어", "걔 신경 안 쓸걸"
