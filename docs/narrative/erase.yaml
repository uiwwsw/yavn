scenes:
  0/studio:
    participants:
      - 도윤
      - 지수
      - 어른아진
    relations:
      - couple
      - remembered
    before: 도윤과 지수는 결혼 4주 전 청첩장 사진을 찍는다. 아진은 대신 온 작가로 둘을 처음 만난다
    exchange: 촬영 지시→웃음에 멈춘 셔터와 "하린아?"→사과와 지수의 농담→계약서의 점→문 앞의 질문
    avoid: 아진이 1장에서 하린과 도윤의 관계를 설명하지 않는다
    gesture: 아진은 카메라 끈을 손에 감는다
  2/e3_school:
    participants:
      - 도윤
      - 어른아진
    relations:
      - remembered
    before: 도윤은 오늘 상담실에서 자기가 유하린이었다는 기록을 봤다. 아진은 그 사실을 1장부터 짐작했다
    exchange: 하린의 자리→단톡 소문과 차단→어머니가 알려 준 병원→유리문 밖 네 시간→지나간 사람→한 번은 말하고 싶었다
    avoid: 아진이 도윤에게 기억해 내라고 요구하지 않는다
    gesture: 아진은 하린의 자리가 아니라 옆자리에 앉는다
  3/e4_tell_all:
    participants:
      - 도윤
      - 지수
    relations:
      - couple
    before: 지수는 서랍에서 퇴원 확인서를 찾았다. 도윤이 아진을 만나는 것은 알고 있다
    exchange: 유하린이라는 이름→사고가 아니었다→기억하는 사람→"나도 지울 수 있는 거야?"→"모르겠어"
    avoid: 지수가 그 자리에서 용서하거나 결정하지 않는다
    gesture: 지수는 식은 밥그릇을 손으로 감싼다
