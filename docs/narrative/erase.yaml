schemaVersion: 1
gameId: erase
authorOnlyFacts:
  - 하린과 서윤은 같은 사람의 다른 신원이다. 하린은 여자아이다. 정림의원 3층의 ERASE 시술은 본인의 이름과 얼굴과 기억을 바꿨고, 성별과 남의 기억과 기기 속 기록은 바꾸지 않았다. 2장 상담실 전까지 서윤은 열여덟 전 공백을 사고 때문이라고 믿는다.
  - 서윤의 엄마 한경숙은 2016년 보호자 칸에 서명했고, 서윤에게는 사고라고만 말했다. 2023년 겨울에 돌아가셨다. 서윤 쪽 혼주석이 비는 이유다.
  - 뒷문 얘기를 민재에게 흘린 사람은 아진이다. 그날 밤 아진은 하린이 민재를 좋아하는 것 같다는 말까지 민재에게 했다. 아진이 민재와 사귀는 걸 하린에게 말하지 못한 이유다. 민재가 한 명에게 말했고, 그 한 명이 단톡에 올렸다.
  - 하린은 아진의 첫 톡 미리보기("하린아 뒷문 얘기 그거 내가 민재한…")만 보고 차단했다. 나머지 열 개는 전달되지 않았고, 아진의 옛 휴대폰에는 열한 개 모두 읽지 않음으로 남아 있다.
  - 서윤은 2024년 6월 20일 정림의원에서 두 번째 시술을 받았다. 6월 2일 지수의 첫 청혼을 받고, 지수 부모와의 저녁에서 학교 친구 얘기를 묻자 자리를 떠났고, 그날 밤 반지를 빼고 "너도 나 모르잖아"라고 했다. 지운 기간은 6월 1일~19일. 지수가 데려다주고 1층에서 네 시간 기다렸다. 지수는 그 뒤로 아무 말 없이 반지를 서랍에 넣었다가 2027년 2월 같은 반지로 다시 청혼했다. 반지 안쪽 각인은 2024. 6. 2.다.
  - 상담실 화면에는 처음부터 시술 이력 2건이 뜬다. 상담사는 2016년 기록만 열어 준다. 4장 식탁에서 지수가 반지를 열기 전까지 서윤은 두 번째를 모른다.
  - 아진은 2016년 3월 29일 정림의원 1층 유리문 밖에서 네 시간을 기다렸다. 처음 보는 얼굴로 나온 사람이 웃는 모양을 보고 하린인 줄 알았다. 하린은 시술 전에 그 유리문 너머의 아진을 보고 계단 쪽으로 돌아섰다.
arc:
  premise: 결혼을 4주 앞둔 한서윤은 청첩장 사진을 찍던 날 대신 온 사진작가 정아진에게 "하린아"라는 이름으로 불린다. 서윤에게는 열여덟 전 기억이 없고, 엄마에게 들은 대로 사고 때문이라고 알고 살았다. 아진은 그 이름을 열한 해 동안 기억했고, 열한 개의 읽지 않은 메시지를 아직 갖고 있다.
  question: 내 기억만 지우는 시술 앞에서, 나를 기억하는 사람을 두 번 지울 것인가.
  기:
    chapters: [0]
    summary: 프롤로그는 떨리는 손과 사진 한 장, 유리문 밖의 누군가만 보여 준다. 사진관에서 서윤이 웃자 셔터가 멈추고, 계약서 이름 끝의 점에서 아진이 "하린아"라고 부른다. 그날 밤 하객 명단의 서윤 쪽은 회사 사람 열두 명이고 혼주석은 비어 있다. 사진첩은 2016년 3월에서 시작한다. 11년 전 점심, 아진은 가방으로 하린의 자리를 맡아 두고 웃는 하린을 찍는다.
  승:
    chapters: [1]
    summary: 원본 묶음 마지막에 2016년 교실 사진이 섞여 오고, 서윤이 "마지막 건 뭐예요?"라고 묻는다. 11년 전 놀이터에서 아진은 할 말을 미루고, 하린은 "그럼 더 나중에 해"로 닫는다. 앨범 시안 날 아진이 "점심 메뉴, 찍으세요?"라고 묻는다. 지수에게 사실대로 말하면 "그 사람한테만 말고"를 듣는다. 11년 전 그 의자에 민재가 앉고, 하린은 뒷문에서 자기 입버릇을 남의 입으로 듣는다.
  전:
    chapters: [2, 3]
    summary: 주민센터 기본증명서에 개명 전 이름 유하린이 뜨고 지수는 말없이 봉투에 넣는다. 정림의원 상담실 기록에는 시술 범위와 엄마의 서명이 있다. 서윤이 먼저 한 번 더 받을 수 있느냐고 묻는다. 밤의 교실에서 아진은 하린이 볼 수 없었던 것을 말한다. 11년 전 단톡이 터진 밤부터 서명까지를 하린 쪽에서 본다. 사진관에서 서윤은 열한 개를 다 읽고, 마지막 것이 아진의 잘못이다. 지수는 열흘을 기다렸다가 "요즘 어디 다녀?"라고 묻는다.
  결:
    chapters: [4]
    summary: 결혼 D-4 오전 9시 40분 정림의원 1층. 지울 목록의 첫 줄은 지수가 눈 감은 컷을 고른 날이다. 3층에 오르면 지수가 사라진 4주를 알아챈다. 사진관에 가면 옆자리에 앉는 대신 마지막 가봉을 놓친다. 지수에게 전화하면 지수가 온다. 앞서 다 말했다면 그 이름을 불러 보고, 아니라면 식을 미룬다.
chapters:
  0:
    title: 셔터
    beat: 기
    tells: 2016년 3월 29일 시술실의 떨리는 손과 사진 한 장, 유리문 밖의 사람. 11년 뒤 결혼 D-29 사진관, 장염 난 실장 대신 온 정아진. 서윤이 웃자 셔터가 멈추고, 계약서의 점에서 "하린아". 지수는 눈 감은 컷을 청첩장으로 고른다. 밤에 하객 명단, 비워 둘 혼주석, 손 흔드는 일곱 살 사진. 아진은 원본 날짜만 다시 알린다. 11년 전 점심, 가방으로 맡아 둔 의자와 이어폰.
    turn: 처음 보는 사람이 서윤이 모르는 이름을 정확한 웃음 모양과 이름 끝의 점으로 알아본다.
    carries: 청첩장 컷과 손 흔드는 일곱 살 사진. 아진에게 말한 "사고"(또는 부정). 11년 전 아진이 찍은 웃는 하린.
  1:
    title: 급식표
    beat: 승
    tells: 월요일 식당 메뉴를 찍는 버릇. 목요일 밤 원본 312장 마지막의 2016년 교실 사진과 "잘못 들어갔어요. 지워 주세요." 11년 전 정류장 포스터와 놀이터, 초상 동의서의 점, 미룬 말, 결혼사진 약속. 앨범 시안 날 "점심 메뉴, 찍으세요?" 지수에게 사실대로 말하거나 숨기고 연락처를 지운다. 11년 전 민재가 앉은 의자와 뒷문, 카레 핑계.
    turn: 서윤의 버릇이 남의 기억과 맞물리고, 지수에게 처음으로 말할지 숨길지가 갈린다.
    carries: 지우거나 남긴 2016년 사진(ajin_photo). 아진의 말을 더 들었는지(listened). 지수에게 한 첫 고백(told_first)이나 지운 번호(number_deleted). 하린이 들은 "걔 신경 안 쓸걸".
  2:
    title: 사고가 아니었다
    beat: 전
    tells: 주민센터 기본증명서의 개명 이력과 접혀 들어가는 종이, 엄마 상자의 퇴원 확인서. 정림의원 3층의 시술 기록과 엄마 서명, 서윤이 먼저 묻는 두 번째 시술. 엘리베이터에서 처음 먼저 보낸 메시지와 "오실래요?" 밤의 교실에서 아진이 말하는 카레 나온 금요일, 네 시간, 지나간 사람, 졸업까지 비운 자리, 지금도 남은 1. 11년 전 과학실의 닭볶음탕과 "지우지 말고".
    turn: 사고가 아니었다, 내가 신청했다. 그리고 기억하는 사람 쪽에서 본 같은 날. 교실 초대를 거절하면 이야기는 여기서 닫힌다.
    carries: 예약 여부(booked). 교실에서의 사과(sorry). 하린이 저장한 놀이터 사진. 사진관의 옛 휴대폰.
  3:
    title: 지우지 말고
    beat: 전
    tells: 11년 전 목요일 밤 한 화면의 단톡과 잘린 미리보기, 차단, 토요일 새벽의 삭제와 이름표, 월요일 엄마의 "어느 병원.", 화요일 유리문과 서명. 지금, 문 닫은 사진관에서 읽는 열한 개와 아진의 잘못, 사과를 대신 받을지. 금요일 먹지 못하는 돈까스. 월요일 밤 식탁의 두 장의 종이와 "요즘 어디 다녀? 회사 말고."
    turn: 열한 번째 메시지와 지수의 "나도 언젠가 지울 수 있는 거야?" 앞에서 서윤의 첫 "모르겠어".
    carries: 사과를 받았는지(forgave). 지수에게 전부 말했는지(told_all). 다음 날 아침 1층에 갈 이유(예약 또는 사본).
  4:
    title: ERASE
    beat: 결
    tells: 결혼 D-4 비 오는 정림의원 1층. 동의서나 상담 신청서의 "4월 2일부터 오늘까지"와 일곱 줄의 목록. 지수의 12시 반 가봉, (들어 준 사람에게만) 인화지 뒷면과 아진의 점심 초대. 3층, 사진관, 지수에게 거는 전화 중 하나.
    turn: 열한 해 전과 같은 계단과 유리문 앞에서 이번에는 고를 수 있고, 고른 쪽마다 놓치는 것이 있다.
    carries: 결말이 남기는 것 하나. 이걸 언제 찍었냐는 질문과 교정지(ERASE). 놓친 가봉과 "안 지워요"(옆자리). 가봉 가자는 두 이름(두 이름). 서류철 위 반지와 취소된 가봉(완성되지 않은 사람).
characters:
  서윤:
    name: 한서윤
    age: 29
    assetIds:
      - 서윤
    speakerNames: []
    role: 회사원, 지수의 약혼자. 열여덟 전 기억이 없고 엄마에게 사고라고 들었다. 개명 이력과 시술 기록으로 자기가 지워 달라고 했다는 걸 본다. 마지막에 다시 지울지 고른다
    desire: 지수와 결혼해 지금처럼 살고 싶다. 그래서 불편한 것은 손이 먼저 지운다
    fear: 기억도 안 나는 일로 누군가에게 미안해야 하는 것
    contradiction: 기억이 없는 걸 아무렇지 않게 말하면서 그 빈칸을 한 번도 찾아보지 않았다. 버릇은 남았다. 이름 끝의 점, 웃으면 없어지는 눈, 월요일마다 찍는 메뉴
    dailyLife: 눈 감은 사진을 지워 달라 하고, 받은 사진은 휴지통까지 비운다. 회사 식당 주간 메뉴를 찍는다. 알고 난 주에는 찍지 못한다
    voice: 짧다. 지수에게는 반말, 아진에게는 존대. 몰리면 "……"와 되묻기. 3장 뒤로 "모르겠어"처럼 처음 하는 말이 생긴다
  지수:
    name: 이지수
    age: 29
    assetIds:
      - 지수
    speakerNames: []
    role: 서윤의 약혼자(신랑), 출판사 제작부. 2024년 6월 첫 청혼 뒤 서윤이 그 한 달을 지운 것을 알고도 말하지 않았다. 결혼 준비를 실제로 챙긴다(좌석 배치표, 전세 대출 서류, 마지막 가봉). 주민센터에서 유하린이라는 이름을 먼저 보고 열흘을 기다린다
    desire: 서윤의 일을 남이 아니라 서윤 입으로, 남보다 먼저 듣고 싶다
    fear: 서윤이 자기를 또 지우는 것. 이미 한 번 지워졌다
    contradiction: 다정하게 넘겨 주면서 넘겨 준 것을 다 기억한다. 먼저 알아도 먼저 말하지 않는다
    dailyLife: 종이를 모서리부터 손바닥으로 누른다. 휴대폰 잠금 화면에 결혼 D-day를 띄워 둔다. 냉장고에 가봉 메모를 붙인다
    voice: 친밀한 반말. 화가 나면 질문을 하나씩 하고 기다린다. 고백을 듣자마자 위로하지 않는다
  어른아진:
    name: 정아진
    age: 29
    assetIds:
      - 어른아진
    speakerNames:
      - 정아진
      - "010-4418-2706"
    role: 웨딩 사진작가. 하린의 일곱 살 때부터 친구. 하린의 학교 졸업 앨범을 해마다 찍고, 2016년 휴대폰을 사진관 서랍에 둔다
    desire: 미안하다는 말을 누가 한 번은 들어 주는 것. 하린이 아니어도
    fear: 다시 말을 미루다 또 아무 말도 못 하는 것
    contradiction: 더 귀찮게 안 하겠다면서 원본 묶음에 사진을 섞어 보내고, 잘못 들어갔다고 지워 달라고 한다. 사과를 받으러 온 사람처럼 굴지만 사과할 사람은 자기다
    dailyLife: 셔터를 빨리 누르고, 불편하면 카메라 끈을 손에 감는다. 앨범 시안을 끝까지 넘긴 뒤에 말한다
    voice: 서윤에게 존대. 짧고 정확하다. 하린 얘기에서만 길어진다. 교실에서 처음 반말이 섞인다("기억 안 나는 사람이 왜 사과를 해")
  하린:
    name: 유하린
    age: 18
    assetIds:
      - 하린
    speakerNames: []
    role: 열한 해 전의 서윤. 여자아이. 민재를 좋아했다. 아진·민재와 같은 반 고3. 뒷문에서 듣고, 카레를 들키고, 단톡이 터진 밤 아진의 미리보기 한 줄에서 차단한다
    desire: 셋 사이에서 빠지고 싶지 않다. 아진이 할 말을 자기한테 먼저 해 주면 좋겠다
    fear: 끼고 싶다는 마음이 들키는 것
    contradiction: 제일 끼고 싶으면서 관심 없다고 말한다. 다 지우면서 아진이 보낸 놀이터 사진 한 장은 남긴다
    dailyLife: 돈까스 급식표를 찍고, 사천 원밖에 없으면서 떡볶이는 반 쏘겠다고 한다. 이름 끝에 점을 찍는다
    voice: 빠른 반말, 문자엔 ㅋㅋ. 다치면 "됐어", "그럼 더 나중에 해", "뭐가 미안해"로 먼저 닫는다
  아진:
    name: 정아진
    age: 18
    assetIds:
      - 아진
    speakerNames:
      - 아진
    role: 하린의 일곱 살 때부터 친구, 민재의 연인. 사진반. 말을 미루다 과학실에서 미룬 것부터 인정하고, 그날 저녁 민재에게 뒷문 얘기를 흘린다
    desire: 하린도 민재도 잃지 않고 사귄다는 걸 직접 말하고 싶다
    fear: 말한 순간 하린이 떠나는 것
    contradiction: 하린의 자리는 가방으로 맡아 두면서 정작 해야 할 말은 미룬다. 미안하다고 하고 몇 시간 뒤 같은 얘기를 남에게 한다
    dailyLife: 옆 의자에 가방을 올려 두고, 웃는 하린을 찍고, 놀이터 사진을 보낸다
    voice: 하린아로 시작하는 반말. "지우지 말고"라고 말하는 유일한 사람
  민재:
