relationships:
  - id: couple
    participants:
      - 서윤
      - 지수
    history: 동거하며 결혼을 준비한다. 지수는 서윤의 공백을 사고로 알고 받아 줬다
    perspectives:
      서윤:
        seesOtherAs: 지금의 자기 전부를 아는 사람
        address: 반말, 지수야
      지수:
        seesOtherAs: 열여덟 전이 비어 있는 걸 그냥 받아 준 사람. 그 빈칸을 남보다 늦게 듣는 건 싫다
        address: 반말
    friction: 지수는 주민센터에서 유하린을 먼저 보고도 묻지 않고 기다린다. 서윤은 그 얘기를 지수보다 아진과 먼저 한다
  - id: remembered
    participants:
      - 서윤
      - 어른아진
    history: 열한 해 전 하린과 아진은 일곱 살 때부터 친구였다. 지금 서윤은 아진을 모르고, 아진은 서윤을 안다
    perspectives:
      서윤:
        seesOtherAs: 처음 보는데 자기 버릇을 아는 작가
        address: 아진 씨, 존대
      어른아진:
        seesOtherAs: 하린이었던 사람. 그러나 하린은 아니라는 것도 안다
        address: 존대, 교실에서 반말이 섞인다
    friction: 아진은 기억해 달라고 하지 않는다. 자기가 한 일에 대한 미안함을 누가 받아 주길 바란다. 서윤은 하린 대신 받거나, 그건 하린의 몫이라고 선을 긋는다
  - id: three_of_us
    participants:
      - 하린
      - 아진
    history: 일곱 살 때부터 놀이터를 사이에 둔 두 동에 산다. 고3, 아진은 민재와 하린 몰래 사귄다
    perspectives:
      하린:
        seesOtherAs: 자기 자리를 맡아 주는 친구. 할 말은 자기한테 먼저 해 주길 바라는 친구
        address: 반말
      아진:
        seesOtherAs: 말하면 떠날 것 같은 친구
        address: 하린아
    friction: 아진은 말을 미루고 남에게 먼저 흘린다. 하린은 "됐어"로 먼저 닫고, 미리보기 한 줄에서 차단한다
  - id: mother
    participants:
      - 하린
      - 엄마
    history: 하린의 엄마. 시술에 동의하고 뒤로 서윤에게 사고라고만 말했다
    perspectives:
      하린:
        seesOtherAs: 쟁반을 놓고 가는 사람
        address: 엄마
      엄마:
        seesOtherAs: 이틀째 밥을 먹지 않는 아이
        address: 짧은 반말
    friction: 엄마는 이유를 묻지 않고 가스 불을 끈다. 그 침묵이 서명이 된다
  - id: class_chat
    participants:
      - 하린
      - 반단톡
    history: 같은 반 단체 대화방
    perspectives:
      하린:
        seesOtherAs: 아침마다 먼저 보게 될 곳
        address: 읽지 않음
      반단톡:
        seesOtherAs: 해명할 사람
        address: "@유하린"
    friction: 하린은 해명하지 않고 지운다
scenes:
  0/studio:
    participants:
      - 서윤
      - 지수
      - 어른아진
    relations:
      - couple
      - remembered
    before: 서윤과 지수는 결혼 D-29에 청첩장 사진을 찍는다. 아진은 장염 난 실장 대신 온 작가로 둘을 처음 만난다
    exchange: 실장 대신 왔다는 소개→촬영 지시→웃음에 멈춘 셔터→지수의 "저 이거 보고 결혼해요"→계약서의 점→"하린아"→고등학교 질문
    avoid: 아진이 점이나 하린을 설명하지 않는다. 점은 화면으로만 보인다
    gesture: 아진은 카메라 끈을 손에 감는다
  2/e3_office:
    participants:
      - 서윤
      - 지수
    relations:
      - couple
    before: 전세 대출 서류를 떼러 점심시간에 주민센터에 왔다. 지수는 아직 아무것도 모른다
    exchange: 서류 목록→서명의 점→기본증명서의 개명 이력→"……이거 뭐지"→지수가 세 번 접어 봉투에 넣는다→창구에 딴 질문
    avoid: 지수가 그 자리에서 묻거나 해석하지 않는다
    gesture: 지수는 종이를 세 번 접는다
  2/e3_school:
    participants:
      - 서윤
      - 어른아진
    relations:
      - remembered
    before: 서윤은 오늘 상담실에서 자기가 유하린이었다는 기록과 엄마의 서명을 봤다. 아진은 그 사실을 첫날부터 짐작했다
    exchange: 하린의 자리→첫날 대답 되짚기→병원에 갔었다→카레 나온 금요일의 빈자리→어머니와 정류장 병원→유리문 밖 네 시간→지나간 사람→졸업까지 비운 자리→지금도 남은 1→"그 폰, 사진관에 있어요"
    avoid: 아진이 단톡 내용을 옮기거나 기억해 내라고 요구하지 않는다. 자기 잘못은 아직 말하지 않는다
    gesture: 아진은 하린의 자리가 아니라 옆자리에 앉는다
  3/e4_eleven:
    participants:
      - 서윤
      - 어른아진
    referenced:
      - 하린
      - 민재
    relations:
      - remembered
    before: 아진은 교실에서 열한 개를 말했고, 서윤이 뭐라고 보냈는지 물었다
    exchange: 옛 휴대폰 충전→읽지 않은 말풍선 열한 개→민재 근황→마지막 메시지의 잘못→1이 그대로였던 아침→아진의 바람→사과를 대신 받을지
    avoid: 아진이 용서를 달라고 하지 않는다. 서윤이 하린의 마음을 대신 해석하지 않는다
    gesture: 아진은 충전기 줄을 손가락에 감았다 푼다
  3/e4_tell_all:
    participants:
      - 서윤
      - 지수
    relations:
      - couple
    before: 지수는 주민센터에서 유하린을 봤고 열흘을 기다렸다. 엄마 상자에서 퇴원 확인서도 찾았다
    exchange: 유하린이라는 이름→사고가 아니었다→엄마의 서명→기억하는 사람→"유하린"→"열흘 기다렸어"→"나도 언젠가 지울 수 있는 거야?"→"모르겠어"
    avoid: 지수가 그 자리에서 용서하거나 위로하지 않는다
    gesture: 지수는 식은 밥그릇을 손으로 감싸고, 들고 일어나 개수대로 간다
  4/e5_side_evening:
    participants:
      - 서윤
      - 지수
    referenced:
      - 어른아진
    relations:
      - couple
    before: 서윤은 마지막 가봉을 놓치고 점심을 아진과 먹었다. 지수는 혼자 가봉을 하고 왔다
    exchange: 앨범과 놀이터 사진→처음부터 다 말하기→(말한 정도에 따라) "그 사람한테만 말고"와 "먼저 갔네", 또는 "오늘 처음 듣는데"→좌석표에 이름을 적거나 서랍에 넣기
    avoid: 지수가 가봉을 놓친 일을 없던 일로 하지 않는다
    gesture: 지수는 숟가락을 든 채로 끝까지 듣는다
