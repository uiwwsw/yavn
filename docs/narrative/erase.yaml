    role: 하린의 반 단체 대화방
    desire: 웃을 거리
    fear: 없음
    contradiction: 누가 처음 말했는지는 아무도 모른다
    dailyLife: ㅋㅋ와 멘션
    voice: 짧은 문장과 ㅋㅋ, "@유하린 해명하세요"
  상담사:
