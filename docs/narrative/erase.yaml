    fear: 없음
    contradiction: 지우는 일을 하면서 남는 것을 먼저 말해 준다
    dailyLife: 본인 확인, 화면 돌려 주기, 달력 열기
    voice: 낮은 존대. "그대로 기억하고 계시겠죠"
  의사:
    name: 의사
    age: 45
    assetIds:
      - 의사
    speakerNames: []
    role: 2016년 하린의 시술 담당
    desire: 동의를 확인하는 것
    fear: 없음
    contradiction: 마음 바뀌면 말하라고 하면서 눈 감으라고 한다
    dailyLife: 동의서와 펜
    voice: 낮은 존대
  윤주임:
    name: 윤주임
    age: 31
    assetIds:
      - 윤주임
    speakerNames: []
    role: 도윤의 옆자리 동료
    desire: 별일 없는 월요일
