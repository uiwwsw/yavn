schemaVersion: 1
gameId: erase
authorOnlyFacts:
  - 하린과 도윤은 같은 사람의 다른 신원이다. 4장 reveal 전에는 어느 대화자도 이 연결을 말할 수 없다.
  - 준성은 0장 새벽에 처음부터 깨어 있었다. 도윤은 1장 야근 때 듣기 전까지 모른다.
  - 준성의 결근 이유와 행방은 끝까지 확정하지 않는다. 엘리베이터에서 도윤이 뭘 골랐든 다음 날부터 자리가 빈다.
arc:
  premise: 결혼을 4주 앞둔 한도윤은 지수와 살던 대로 살고 싶어서, 클럽에서 만난 박준성과 보낸 밤을 휴대폰에서 지운다. 그런데 준성은 그 새벽 깨어 있었고 월요일에 새 팀장으로 온다. 도윤이 지운 일은 준성과 지수, 그리고 11년 전의 아진처럼 기억하는 사람 쪽에 그대로 남아 있다.
  question: 지워서 없던 일로 만들 수 없을 때, 도윤은 남은 것 하나를 지우지 않고 가진 채 살 수 있는가.
  기:
    chapters: [0]
    summary: 사진관에서 도윤은 눈 감은 컷을 지워 달라 하고 지수는 그 컷을 따로 받아 둔다. 계약금 대답을 미룬 그 밤 도윤은 클럽에서 준성을 만나고, 새벽에 메시지·사진·위치를 지운 뒤 신발을 들고 나온다. 준성은 누운 채 그 번호를 '아무거나 씨'로 저장한다.
  승:
    chapters: [1, 2]
    summary: 준성이 새 팀장으로 오고, 도윤은 "없던 걸로 하죠"를 받아내지만 준성이 처음부터 깨어 있었다는 말을 듣는다. 지수가 "새 팀장님도 청첩장 드려?"라고 묻자 도윤은 자기 흔적 대신 준성을 뒤지기 시작하고, 결혼식에 오겠다는 준성 앞에서 입을 닫거나 "형도 조심해요"라고 한다. 다음 날부터 준성의 자리가 빈다. 11년 전 하린은 이어폰과 조 편성에서 빠지고, 뒷문에서 민재와 아진이 사귄다는 말을 듣고도 카레 핑계를 댄다.
  전:
    chapters: [3]
    summary: 휴직 서류를 넣으러 간 곳이 그 밤의 오피스텔이다. 도윤이 겁낸 사람은 '미검출' 옆에 '굿'을 쓰고 달력에 '한대리 결혼식 — 축의금?'을 적어 둔 사람이었다. 지울 대상이 사라지자 남은 것이 도윤에게 돌아온다. 날짜 없는 아이 사진, 보건소 번호표, 그리고 피팅에 오지 않은 도윤에게 지수가 하는 질문 "오늘 어디 갔어? 회사 말고." 하린은 아진에게 들키고 "지우지 말고"와 함께 놀이터 사진을 받는다.
  결:
    chapters: [4]
    summary: 옥상에서 도윤은 자기가 새벽 3시에 넣은 ERASE 예약을 보고, 2016년 3월 전의 자기 기록이 없다는 걸 확인한다. 시술 기록에는 '시술 전 유하린, 새 신원 한도윤'이 적혀 있다. 지우는 손버릇은 열여덟의 자기에게서 왔다. 도윤은 휴대폰을 초기화하고 다시 눕거나, 놀이터 사진을 열고 번호표를 쥐거나, 지수에게 하린이라는 이름을 보내고 그 문장을 남겨 둔다.
chapters:
  0:
    title: 완성
    beat: 기
    tells: 청첩장 사진을 찍는 날. 도윤은 눈 감은 컷을 지워 달라 하고 지수는 그것만 따로 보내 달라고 한다. 지수가 계약금을 묻자 도윤은 보내거나, 카드값이 밀린 것을 털어놓거나, 촬영으로 말을 돌린다. 밤에 민석을 핑계로 나간 클럽에서 준성과 앉고, 새벽 5시 10분 처음 보는 방에서 메시지·사진·위치 기록 중 지울 것을 고른다.
    turn: 현관문이 닫히자 준성이 눈을 뜨고 어젯밤 받은 번호를 '아무거나 씨'로 저장한다. 도윤 폰에서 지운 밤이 준성 폰에 이름까지 붙어 남는다.
    carries: 준성 연락처의 그 번호. 지수에게 보낸 "민석이네서 뻗었어". 도윤이 안 지우고 나온 것이 있다면 그 메시지·사진·위치 기록.
  1:
    title: 같은 군대
    beat: 승
    tells: 월요일 아침 그 번호로 전화가 오고, 맞은편 자리에서 준성이 새 팀장으로 인사한다. 목요일 야근 때 도윤은 "없던 걸로 하죠"를 받아낸다. 금요일 단톡방은 '군대' 농담으로 도윤을 부르고, 집에서 지수가 새 팀장을 묻자 도윤은 국밥과 프린터 농담으로 넘긴다. 11년 전 점심시간, 하린은 민재가 아진에게만 보낸 노래와 둘이 먼저 낸 생윤 조에서 빠진다.
    turn: 약속을 받아낸 직후 준성이 "신발까지 들고 나가실 줄은 몰랐어요. 처음부터 깨어 있었어요"라고 한다. 휴대폰을 지워도 그 밤을 본 사람은 맞은편 자리에 앉아 있다.
    carries: 책상 위 준성 폰에 뜬 '감염내과 정기 진료 안내'(낮 회의에서 송과장도 봤다). 단톡방의 군대 농담. 지수의 "새 팀장님 어떤 분이야?". 아진이 하린에게 보낸 "낼 나랑 잠깐 얘기할래? 둘이서".
  2:
    title: 소문
    beat: 승
    tells: 지수가 식장에서 "새 팀장님도 드려? 식장에서 나도 인사드릴게"라고 보낸다. 도윤은 답하지 않고 준성의 인스타를 끝까지 내리고, 진료 알림을 '장보기' 메모에 적고, 단톡방에 전 회사를 묻는다. 아흐레 뒤 엘리베이터에서 준성은 약속을 지켰다고 말하고 결혼식에 가도 되느냐고 묻는다. 도윤은 층수만 보거나 "형도 조심해요. 세상 좁아요"라고 한다. 하린은 체육복을 가지러 돌아갔다가 뒷문에서 민재와 아진의 말을 듣고, 밤에 "카레가 이상했음"이라고 보낸다.
    turn: 다음 날부터 준성이 출근하지 않는다. 송과장이 회의 때 본 '감염내과'를 단톡방에 꺼내고, 팀은 도윤에게 "제일 많이 붙어 있었잖아"라고 묻는다. 도윤이 없애고 싶던 사람이 정말 없어지자 질문이 도윤에게 온다.
    carries: 빈 팀장 자리와 윤주임이 반 컵씩 물 주는 화분. 통화 버튼을 못 누른 준성 번호. 지수 혼자 다녀온 식장. 하린이 듣고도 모른 척한 말과 사물함에 두고 온 체육복.
  3:
    title: 흔적
    beat: 전
    tells: 송과장 심부름으로 휴직 서류를 들고 간 9층이 그 밤의 방이다. 한 뼘 열린 문 너머로 약 봉투의 '밤 10시', 외래 기록의 '미검출'과 연필로 쓴 '굿', 월요일에서 체크가 끊긴 달력과 '한대리 결혼식 — 축의금?'을 본다. 도윤은 문을 닫아 주고 준성에게 문자를 보낸 뒤 빈 사무실에서 검색을 하고, 사진첩 맨 아래 날짜 없는 아이 사진을 남기거나 지운다. 목요일엔 연차를 내고 보건소 번호표 기계 앞에 선다. 11년 전 과학실에서 아진이 "그날 문이 움직였어"라고 말하고, 밤에 놀이터 사진을 보내며 "지우지 말고"라고 한다.
    turn: 피팅에 오지 않은 도윤에게 지수가 회사에 전화해 본 뒤 묻는다. "오늘 어디 갔어? 회사 말고." 길게 눌러 지울 수 없는 질문이고, 은행이라고 둘러대든 소문만 말하든 전부 말하든 그 대답은 지수가 갖는다.
    carries: 지수가 정한 것(식은 밥은 네가 데워 / 토요일 피팅 전까지 말해 / 식장엔 내가 전화할게). 지갑 맨 안쪽의 47번 번호표 또는 빈 칸. 남기거나 지운 놀이터 사진. 준성에게 보낸 문자 옆의 읽지 않음.
  4:
    title: ERASE
    beat: 결
    tells: 결혼식 닷새 전 월요일 점심, 도윤은 옥상에서 지수의 톡을 열지 못한 채 'ERASE 클리닉 내일 오전 10시 예약' 문자를 받는다. 신청자는 본인, 일요일 새벽 3시 2분. 회원 가입 2016년 3월, 주민등록증 발급 2016년 3월 28일, 사진첩의 첫 사진도 2016년 3월. 방문 이력 첫 줄을 누르면 11년 전 토요일 새벽 5시 10분, 하린이 메시지·위치 기록과 다른 사진을 지우고, 놀이터 사진 한 장은 날짜·위치 정보만 지운 채 시술대에 눕는다.
    turn: 시술 기록의 '시술 전 유하린(18) · 새 신원 한도윤'. 도윤은 서명 끝에 찍은 작은 점에서 자기 글씨를 알아본다. 아진이 비워 둔 급식실 옆자리에 가지 않은 사람과, 준성 집 문을 닫고 온 사람이 같은 사람이다.
    carries: 결말이 남기는 것 하나. 초기화한 빈 휴대폰과 떨리지 않는 서명(ERASE·지워진 이름), 날짜 없는 놀이터 사진과 47번 번호표(남겨진 사진), 지수에게 보내고 지우지 않은 "내 이름은 유하린이었어"(완성되지 않은 사람).
characters:
  도윤:
    name: 한도윤
    age: 29
    assetIds:
      - 도윤
    speakerNames: []
    role: 영업2팀 대리, 지수의 약혼자. 0~2장에서는 자기 흔적을, 이어서 준성이라는 사람을 지우려 든다. 3장에서 처음으로 지울 수 없는 질문을 받고, 4장에서 남길 것 하나를 고르거나 다시 전부 지운다
    desire: 지수와 살던 대로 살고 싶다. 그래서 곤란한 일에는 대답하지 않고 지운다. 지수의 "직접 말해 줘"와 준성의 "인사는 하고 지내요" 둘 다와 부딪힌다
    fear: 자기가 원한 것과 한 일이 누구 한 사람 입에서라도 나오는 것
    contradiction: 사람을 편하게 하는 농담은 잘하지만 불편한 대답은 지운다. 준성 집의 열린 문은 닫아 주면서 준성에게 전화는 못 건다
    dailyLife: 눈 감은 사진을 지워 달라 하고, 알림 온 폰을 엎고, 파와 오이를 골라낸다. 메모 제목을 '장보기'로 바꾼다
    voice: 발화가 제일 짧다. 지수에게는 반말과 음식 농담으로 시간을 벌고, 준성에게는 "네", "확인할게요". 몰리면 말줄임과 침묵. 혼자 있을 때만 날짜와 숫자를 입 밖에 낸다
  지수:
    name: 이지수
    age: 29
    assetIds:
      - 지수
    speakerNames: []
    role: 결혼을 함께 준비하던 연인. 0~2장에서는 혼자 식장에 가고 그걸 농담으로 넘긴다. 3장에서 회사에 직접 전화하고 묻는다. 그 뒤의 일정과 돈, 만날지 여부는 지수가 정한다
    desire: 준비와 책임을 같이 지고, 도윤 일은 남이 아니라 도윤 입으로 듣고 싶다. 대답을 하루씩 미루는 도윤과 부딪힌다
    fear: 또 혼자 앉아서 "신랑님은요?"를 듣고, 혼자 뒷정리를 하는 것
    contradiction: 다정한 잔소리가 먼저 나오고 혼자서도 다 해내서, 도윤이 빠질 자리를 자기가 만들어 준다. 그래도 기다리지 않겠다고 정하면 번복하지 않는다
    dailyLife: 눈 감은 사진도 따로 받아 두고, 송금 여부와 함께 가기로 한 약속을 확인한다. 도윤 쪽 장판을 켜 둔다
    voice: 도윤아, 친밀한 반말. 준비를 함께 하자는 부탁과 약속을 구체적으로 말한다. 화가 나면 질문을 하나씩 하고 기다린다. 결정을 알릴 때는 짧다
  준성:
    name: 박준성
    age: 32
    assetIds:
      - 준성
    speakerNames:
      - 전화 속 남자
    role: 클럽에서 만난 사람, 월요일부터 새 팀장. 1장에서 도윤의 요구를 받아들이고, 2장에서 약속을 지킨 채로 인사와 결혼식 참석을 청한다. 그다음 날부터 나오지 않는다. 3장부터는 집에 남긴 물건으로만 나온다
    desire: 새 회사에 오래, 평범하게 다니고 싶다. 그 밤을 숨기지도 떠벌리지도 않고 도윤과 인사는 하는 사이로 남고 싶다. 그 밤 자체를 없애려는 도윤과 부딪힌다
    fear: 호감과 병원 알림이 소문과 위협의 구실이 되는 것
    contradiction: 느긋한 농담으로 먼저 다가가지만 그 농담이 때를 못 맞춘다. 약속은 끝까지 지키면서 본 것은 봤다고 말한다
    dailyLife: 화분 셋에 물 반 컵, 약 먹은 날 달력 체크와 "굿", 달력에 적어 둔 남의 결혼식
    voice: 도윤에게 끝까지 존대, "한대리님". 넷 중 제일 길고 느긋하게 말하고 딴소리(프린터, 김치찌개, 화분, 식대)를 섞는다. 진심이거나 다쳤을 때는 한 줄로 줄고 업무 얘기로 돌아간다
  하린:
    name: 유하린
    age: 18
    assetIds:
      - 하린
    speakerNames: []
    role: 아진·민재와 같은 반 고3. 11년 전의 도윤. 1장에서 빠지고, 2장에서 듣고도 모른 척하고, 3장에서 들키고, 4장에서 사진 한 장만 남기고 전부 지운다
    desire: 셋 사이에서 빠지고 싶지 않다. 아진이 자기를 먼저 골라 주면 좋겠다. 말을 미루는 아진, "관심 없다며"를 믿는 민재와 부딪힌다
    fear: 껴 달라는 말이 진심이라고 들키는 것
    contradiction: 제일 끼고 싶으면서 관심 없다고 말한다. 다 지우면서 놀이터 사진 한 장은 날짜만 지우고 남긴다
    dailyLife: 돈까스 급식표를 찍어 두고, 사천 원으로 떡볶이를 반 쏘겠다고 한다. 대화를 캡처했다가 지운다
    voice: 친구에게 빠른 반말, 문자에는 ㅋㅋ. 신나면 혼자 세 마디를 잇는다. 다치면 "됐어", "뭐가 미안해ㅋㅋ"로 먼저 닫는다. 3장 과학실부터는 한 줄로 줄어든다
  아진:
    name: 정아진
    age: 18
    assetIds:
      - 아진
    speakerNames: []
    role: 하린의 일곱 살 때부터 친구, 민재의 연인. 1~2장에서 말을 미루고 3장에서 미룬 것부터 인정한다. 하린에게 "지우지 말고"라고 말하는 유일한 사람
    desire: 하린도 민재도 잃지 않고 사귄다는 걸 직접 말하고 싶다. 먼저 "됐어"로 닫아 버리는 하린과 부딪힌다
    fear: 말한 순간 하린이 떠나는 것
    contradiction: 하린의 체육복과 급식 취향은 챙기면서 정작 해야 할 말은 그 뒤로 미룬다
    dailyLife: 이어폰 한쪽을 내밀고, 사물함의 체육복을 기억하고, 엄마 폰에서 나온 놀이터 사진을 보낸다
    voice: 하린아로 시작하는 반말. 챙길 용건을 앞에 붙여 말이 길어진다. 3장에서는 "내가 먼저 말했어야 했어"처럼 자기 잘못부터 말하고 내일 누구와 밥을 먹을지 정해서 말한다
  민재:
    name: 서민재
    age: 18
    assetIds:
      - 민재
    speakerNames: []
    role: 하린·아진의 반 친구
    desire: 편한 분위기와 아진과의 연애. 하린에게 따로 설명할 일은 없었으면 한다. 직접 말하겠다는 아진과 부딪힌다
    fear: 불편한 설명을 떠맡는 것
    contradiction: 하린을 미워하지 않지만 "관심 없어"와 ㅋㅋ를 그대로 믿으면 자기가 편하다. 4장에서야 "아진한테만이라도 연락해"라고 보낸다
    dailyLife: 아진에게 노래 구간(1분 20초부터)을 골라 보낸다
    voice: 작품에서 제일 짧은 반말. "그냥 뭐 좀", "ㅇㅇ", "장난이잖아"로 대화를 닫는다
  민석:
    name: 민석
    age: 29
    assetIds: []
    speakerNames:
      - 민석
    role: 대학 친구, 결혼식 사회 예정자
    desire: 친구 얼굴을 보고 함께 놀고 싶다
    fear: 친구 사이가 멀어지는 것
    contradiction: 가벼운 초대가 도윤의 거짓말에 쓰이는 줄 모른다
    dailyLife: 모임 장소와 사회 일정을 연락한다
    voice: 도윤에게 반말과 짧은 문자
  송과장:
    name: 송과장
    age: 성인
    assetIds: []
    speakerNames:
      - 송과장
    role: 팀 선임
    desire: 팀 일정과 이야기의 주도권
    fear: 자기 말에 책임을 묻는 것
    contradiction: 동료를 챙기는 말과 소문을 같은 친근함으로 한다
    dailyLife: 커피와 회식 투표로 화제를 돌린다
    voice: 도윤대리, 직급 아래에는 반말. 위 사람의 소문도 가볍게 옮긴다
  윤주임:
    name: 윤주임
    age: 성인
    assetIds: []
    speakerNames:
      - 윤주임
    role: 도윤의 후배 동료
    desire: 모임에 끼고 사실도 놓치지 않으려 한다
    fear: 자기가 방관했다는 걸 보는 것
    contradiction: 농담에 먼저 끼었다가 잘못된 정보는 정정한다
    dailyLife: 비어 있는 자리의 화분을 돌본다
    voice: 도윤대리님과 해요체. 단톡 농담과 확인하는 말의 길이를 달리한다
  오대리:
    name: 오대리
    age: 성인
    assetIds: []
    speakerNames:
      - 오대리
    role: 팀 동료
    desire: 새 소식을 알아 불안하지 않고 싶다
    fear: 소문이 자기에게 해가 되는 것
    contradiction: 모르는 일을 가장 크게 걱정하며 퍼뜨린다
    dailyLife: 누가 새로 오는지 먼저 단톡에 올린다
    voice: 직장 동료에게 해요체, 단톡에서 짧은 감탄과 재질문
  의사:
    name: 시술 의사
    age: 성인
    assetIds:
      - 의사
    speakerNames: []
    role: 시술 절차를 진행하는 목소리
    desire: 동의와 소지품 절차를 확인한다
    fear: 환자 사정을 자기가 판정하는 것
    contradiction: 차분하지만 당사자의 사정을 전부 아는 사람은 아니다
    dailyLife: 서명과 물건을 확인한다
    voice: 절차 존대. 하린과 도윤을 동시점의 아는 사이로 부르지 않는다
  클리닉:
    name: ERASE 클리닉 알림
    age: 해당 없음
    assetIds: []
    speakerNames:
      - ERASE 클리닉
    role: 예약 안내
    desire: 예약 시각과 준비물을 알린다
    fear: 해당 없음
    contradiction: 감정 상담을 하지 않는 발신자
    dailyLife: 문자와 본인 신청 내역만 보낸다
    voice: 공식 안내문
relationships:
  - id: couple
    participants:
      - 도윤
      - 지수
    history: 동거하며 결혼을 준비한다
    perspectives:
      도윤:
        seesOtherAs: 같이 살고 싶어서 사실을 하루씩 미루게 되는 상대
        address: 반말, 음식과 농담으로 시간 벌기
      지수:
        seesOtherAs: 같이 정하기로 해 놓고 식장에는 한 번도 안 온 상대
        address: 도윤아, 질문에 답할 시간을 준다
    friction: 지수는 3장 고백 전에는 클럽에서 한 일을 모른다. 1장에서 새 팀장을 궁금해하고 2장에서 청첩장을 드리자고 한 사람이 지수다. 3장 뒤로는 지수가 정하고 도윤이 따른다
  - id: private_and_work
    participants:
      - 도윤
      - 준성
    history: 익명의 호감→일터의 상하관계
    perspectives:
      도윤:
        seesOtherAs: 지운 밤을 통째로 기억하는 새 상사. 3장 빈 집 앞에서 처음으로 이름을 부른다
        address: 클럽 존대, 회사 팀장님. 형은 위협 경로에서만. 3장 현관에서 준성 씨
      준성:
        seesOtherAs: 호감이 있었고, 약속은 지킬 테니 인사는 하고 지내고 싶은 동료
        address: 익명 존대→한대리님. 달력에는 한대리 결혼식
    friction: 준성은 그 밤을 회사에서 꺼내지 않는다는 약속을 지킨다. 도윤은 그걸로 모자라 탕비실에서 피하고, 준성을 검색하고, 결혼식에 오겠다는 말에 입을 닫거나 위협한다
  - id: old_friend
    participants:
      - 도윤
      - 민석
    history: 대학 동기
    perspectives:
      도윤:
        seesOtherAs: 말하기 편한 친구이자 외출 핑계
        address: 반말
      민석:
        seesOtherAs: 결혼 전 함께 놀 친구
        address: 반말
    friction: 민석은 자기 이름으로 어떤 거짓말을 했는지 모른다
  - id: team_senior
    participants:
      - 도윤
      - 송과장
    history: 같은 팀 대리와 과장
    perspectives:
      도윤:
        seesOtherAs: 사생활을 흘릴까 불안한 선임
        address: 과장님, 존대
      송과장:
        seesOtherAs: 보고서와 점심을 함께 하는 부하
        address: 도윤대리, 반말
    friction: 친밀한 호칭이 사생활을 캐물을 권한은 아니다
  - id: team_junior
    participants:
      - 도윤
      - 윤주임
    history: 단톡에서 농담하는 동료
    perspectives:
      도윤:
        seesOtherAs: 평소 웃어넘기던 후배
        address: 직장 존대, 짧은 문자
      윤주임:
        seesOtherAs: 답이 짧아 놀리고 싶은 선배
        address: 대리님, 해요체
    friction: 후반에는 농담의 책임과 남은 화분이 관계를 바꾼다
  - id: rumor_fear
    participants:
      - 도윤
      - 오대리
    history: 팀 동료
    perspectives:
      도윤:
        seesOtherAs: 소문을 옮기는 사람
        address: 직장 해요체
      오대리:
        seesOtherAs: 뭔가 알고 있는 것 같은 동료
        address: 대리님, 해요체
    friction: 검사나 성적 지향을 질문지처럼 캐묻지 않는다
  - id: friendship
    participants:
      - 하린
      - 아진
    history: 어릴 때부터 사진을 나누던 친구
    perspectives:
      하린:
        seesOtherAs: 자기를 제일 먼저 골라 줬으면 하는 친구
        address: 반말, 농담으로 부탁을 감춘다
      아진:
        seesOtherAs: 상처 줄까 말을 미루는 친구
        address: 하린아, 챙길 용건을 앞세운다
    friction: 친구의 연애를 허락할 권리를 요구하는 것은 아니다
  - id: excluded
    participants:
      - 하린
      - 민재
    history: 같은 반, 셋으로 어울렸다
    perspectives:
      하린:
        seesOtherAs: 자기만 빼고 뭘 나누는 친구
        address: 반말, 왜 안 보냈냐는 질문을 웃으며 한다
      민재:
        seesOtherAs: 관심 없다고 말하던 친구
        address: 반말, 그냥으로 닫는다
    friction: 민재는 하린의 ㅋㅋ가 진심을 감춘다는 걸 인정하기 싫다
  - id: new_couple
    participants:
      - 아진
      - 민재
    history: 하린에게 아직 밝히지 못한 연인
    perspectives:
      아진:
        seesOtherAs: 친구에게 함께 말해야 할 연인
        address: 반말, 자기 책임도 말한다
      민재:
        seesOtherAs: 굳이 설명할 필요가 없다고 생각하는 연인
        address: 반말, 불편한 사정을 가볍게 본다
    friction: 하린을 두고 심리 진단을 주고받지 않는다
  - id: correction
    participants:
      - 윤주임
      - 오대리
    history: 소문을 주고받는 직장 동료
    perspectives:
      윤주임:
        seesOtherAs: 확인 없이 겁먹는 동료
        address: 오대리님, 사실을 짚는다
      오대리:
        seesOtherAs: 자기보다 아는 게 많은 동료
        address: 해요체, 걱정을 묻는다
    friction: 소문을 곧바로 의학적 사실로 바꾸지 않는다
scenes:
  0/e0_club:
    participants:
      - 도윤
      - 준성
      - 민석
      - 지수
    relations:
      - private_and_work
      - old_friend
      - couple
    before: 집에서는 도윤과 지수가 함께 있어 직접 말한다. 클럽이라고 밝히면 도윤이 외출을 미룬다. 핑계를 대고 나간 길에서 만난 준성과는 서로 이름과 직장을 모른다
    exchange: 민석의 초대를 확인→지수에게 직접 말함→목적지를 밝히면 집에 남음. 핑계를 댄 길에서는 클럽에서 자리와 일행을 확인하고 계속 함께 앉을지 정함
    avoid: 그 밤 이후의 친밀함이나 팀장 직함을 앞당기지 않는다
    gesture: 도윤은 시각을 확인하고 폰을 뒤집는다. 대리를 부르면 집으로 돌아간다고 문자하고, 잔을 받으면 늦으니 먼저 자라고 보낸다
  1/overtime:
    participants:
      - 도윤
      - 준성
    relations:
      - private_and_work
    before: 월요일에 준성이 그 번호로 전화했고, 낮 회의에서 준성 폰의 진료 알림이 한 번 울렸다. 도윤은 아직 준성이 그 새벽 깨어 있었다는 걸 모른다
    exchange: 책상 위 진료 알림과 회의 미루기→도윤의 "없던 걸로 하죠"→준성의 약속(내선으로만)→"신발까지 들고", "처음부터요"→화분 물 부탁
    avoid: 준성이 병명을 설명하거나 도윤의 불안을 해설하지 않는다. 알림을 가리지도 변명하지도 않는다
    gesture: 준성은 화면이 위로 놓인 휴대폰을 뒤집지 않는다. 마지막엔 꺾인 화분 잎을 가리키며 대화를 닫는다
  1/e1_harin:
    participants:
      - 하린
      - 아진
      - 민재
    relations:
      - friendship
      - excluded
      - new_couple
    before: 하린만 두 사람의 연애를 모른다
    exchange: 급식 농담→빠진 노래와 조 편성→친구의 제안
    avoid: 열여덟이 자기 회피의 원인을 완벽한 상담 문장으로 설명하지 않는다
    gesture: 줄 이어폰은 두 쪽뿐이다. 아진이 자기 쪽을 빼서 내밀고, 하린이 안 받으면 민재가 가져간다
    illustration: assets/items/earphone_offer.svg
  2/e2_harin:
    participants:
      - 하린
      - 아진
      - 민재
    relations:
      - friendship
      - excluded
      - new_couple
    before: 하린은 앞부분에서는 아직 연애 사실을 직접 듣지 못했다. 아진은 며칠째 둘이 얘기하자는 말만 해 두었다
    exchange: 떡볶이 제안→민재의 "그냥 뭐 좀"→아진의 "이따가"→뒷문에서 엿듣는다→밤의 카레 핑계
    avoid: 문 밖 하린의 속마음을 방 안 두 사람이 확정하지 않는다
    gesture: 돌아온 이유는 체육복. 문고리에서 손을 뗀다
    branches:
      - when:
          var: h1_sent
          op: eq
          value: true
        fact: 민재와 아진은 하린이 껴 달라는 문자를 보낸 것을 보았다.
      - when:
          var: h1_sent
          op: eq
          value: false
        fact: 하린이 지운 문장은 다른 둘이 알 수 없다.
  3/e2_jisu_all:
    participants:
      - 도윤
      - 지수
    relations:
      - couple
    before: 지수는 연차만 확인했고 외도·검사 경위는 지금 듣는다
    exchange: 도윤이 한 일을 말함→지수가 이후 만남과 검사를 각각 확인함→지수가 피팅과 식장 전화를 자기가 정함
    avoid: 지수가 검사 여부를 대답 전에 알아맞히거나 바로 위로하지 않는다. 도윤이 준성의 병명을 지수에게 옮기지 않는다
    gesture: 따뜻하게 해 둔 밥그릇에서 지수의 손이 떨어진다
    branches:
      - when:
          var: went_to_clinic
          op: eq
          value: true
        fact: 검사를 받았고 결과를 기다린다고 답한다.
      - when:
          var: went_to_clinic
          op: eq
          value: false
        fact: 보건소 입구에서 돌아섰다고 답한다.
    illustration: assets/items/two_bowls.svg
  4/end_unfinished:
    participants:
      - 도윤
      - 지수
    relations:
      - couple
    before: 고백은 들었지만 이별과 금전 정리는 지수가 결정했다
    exchange: 실무 연락→과거 얘기를 해도 되는지 질문→읽을 여유 요청
    avoid: 들어 준다는 답을 재결합이나 용서로 해석하지 않는다
    gesture: 답을 재촉하지 않고 서로 입력을 멈춘다

  2/e2_elevator:
    participants:
      - 도윤
      - 준성
    relations:
      - private_and_work
    before: 준성은 1장의 약속을 지켰다. 도윤은 아흐레 동안 탕비실에서 준성을 피했고, e2_leaked면 준성은 점심 자리에서 자기 전 회사 얘기를 들었다. 지수는 청첩장을 드리자고 했다
    exchange: 3페이지 숫자→탕비실에서 피한 일→"그날 얘긴 한 번도 안 했어요"→결혼식에 가도 되느냐는 물음→도윤의 침묵 또는 위협
    avoid: 준성이 위협에 따지거나 병 얘기로 받아치지 않는다. 호칭 하나만 짚고 청첩장을 사양한 뒤 업무로 돌아간다. 침묵 경로에서 준성이 도윤의 속을 짐작해 말해 주지 않는다
    gesture: 도윤은 층수 표시만 본다. 위협 경로에서는 준성이 돌아보지 않고 먼저 내린다
    branches:
