schemaVersion: 1
gameId: overflow
authorOnlyFacts: []
characters:
  지완:
    name: 문지완
    age: 28
    assetIds:
      - 지완
    speakerNames: []
    role: 출고 담당, 동식의 아들
    desire: 아버지를 보고 안심시키고 싶다
    fear: 동요하면 또 문제 있는 사람으로 분류될까 두렵다
    contradiction: 실무는 잘 챙기지만 도움받는 일에는 서툴다
    dailyLife: 냉동할 국과 반찬 통, 다음 근무 시간을 기억한다
    voice: 아버지에게 생활 존대. 낯선 사람에게 자기소개 후 해요체. 급하면 말 중간에 멈춘다
  동식:
    name: 문동식
    age: 61
    assetIds:
      - 동식
      - 동식_연락처
    speakerNames: []
    role: 혼자 사는 아버지
    desire: 아들과 다음 일요일에도 밥을 먹고 싶다
    fear: 아들이 자기 없이 버티는 일이 걱정된다
    contradiction: 감정을 숨기라 가르쳤지만 정작 아들이 와 주기를 기다린다
    dailyLife: 국을 넉넉히 끓이고 작은 통을 못 찾으면 전화한다
    voice: 아들에게 짧은 반말. 국 얘기 뒤에 방문 약속을 묻는다. 입원 직후에는 단어만 나온다
  수경:
    name: 한수경
    age: 34
    assetIds:
      - 수경
      - 목격자
    speakerNames: []
    role: 표시 장치를 개발·검수한 사람
    desire: 오류를 확인하고 자신이 넘긴 검수를 바로잡고 싶다
    fear: 도움을 핑계로 피해자를 자기 증거로 쓰게 될까 두렵다
    contradiction: 숫자를 설명하는 일은 빠르지만 자기 책임을 말하는 일은 늦다
    dailyLife: 버전 번호를 먼저 보고 출력물을 반듯이 편다
    voice: 처음에는 허락과 이름부터. 확실하지 않으면 단정하지 않는다. 죄책감이 나올 때만 문장이 끊긴다
  세라:
    name: 윤세라
    age: 31
    assetIds:
      - 세라
    speakerNames: []
    role: 병동 간호사
    desire: 환자와 가족을 돌보며 직접 본 일을 기록하고 싶다
    fear: 할 수 없는 허가를 약속해 가족을 더 기다리게 할까 걱정한다
    contradiction: 규정을 따르지만 눈앞의 대답을 숫자보다 먼저 기억한다
    dailyLife: 교대 기록과 면회 대기 시간을 챙긴다
    voice: 보호자님과 성명으로 부른다. 질문 하나를 받고 가능한 다음 일을 안내한다
  도겸:
    name: 임도겸
    age: 26
    assetIds:
      - 도겸
    speakerNames: []
    role: 같은 출고조 동료
    desire: 급한 동료의 빈자리를 메운다
    fear: 자기 가족에게 다시 사고가 생길까 걱정한다
    contradiction: 경보를 믿는 이유는 기술 지식이 아니라 어머니의 경험이다
    dailyLife: 출고를 대신 맡고 가방부터 챙겨 준다
    voice: 지완 씨, 서로 해요체. 사정을 캐묻기보다 맡을 일을 짧게 말한다
  반찬집:
    name: 반찬집 아주머니
    age: 성인
    assetIds: []
    speakerNames:
      - 반찬집 아주머니 (통화)
    role: 동식의 이웃 상인
    desire: 아들에게 아버지의 위치와 상태를 전한다
    fear: 자기가 못 본 상태를 잘못 전할까 걱정한다
    contradiction: 급해도 확인한 것만 말한다
    dailyLife: 구급차를 보내고 동식의 휴대폰을 챙긴다
    voice: 신원부터 밝히고 지완이 묻는 상태에 답한다
  보호자:
    name: 다른 보호자
    age: 성인
    assetIds: []
    speakerNames:
      - 보호자
    role: 면회를 놓친 환자의 딸
    desire: 아버지가 자기가 안 온 줄 알지 않았으면 한다
    fear: 다시 기다리다 아이를 데리러 갈 시간을 놓칠까 두렵다
    contradiction: 신청에 동참하고 싶지만 먼저 권한이 있는지 묻는다
    dailyLife: 어제 접수표와 아이 손을 놓지 않는다
    voice: 처음 보는 지완에게 존대. 자기 사정을 짧게 말한다
  병원알림:
    name: 월계병원 알림
    age: 해당 없음
    assetIds: []
    speakerNames:
      - 월계병원
    role: 면회 시각 안내
    desire: 대기 장소와 시각을 전달한다
    fear: 해당 없음
    contradiction: 상담하는 인격체가 아니다
    dailyLife: 정해진 시간만 알린다
    voice: 공식 안내문. 보호자의 감정이나 원인을 추측하지 않는다
relationships:
  - id: father
    participants:
      - 지완
      - 동식
    history: 서로 살림을 챙기는 부자
    perspectives:
      지완:
        seesOtherAs: 보살펴야 하지만 걱정시키기 싫은 아버지
        address: 아버지 + 생활 존대
      동식:
        seesOtherAs: 일요일에 와 줄 아들
        address: 지완아, 짧은 반말
    friction: 둘 다 국 얘기 뒤에 두려움을 숨긴다
  - id: engineer
    participants:
      - 지완
      - 수경
    history: 장갑을 주워 준 낯선 사람→자료를 함께 확인하는 사이
    perspectives:
      지완:
        seesOtherAs: 도움의 근거를 먼저 알고 싶은 낯선 전문가
        address: 수경 씨, 끝까지 해요체
      수경:
        seesOtherAs: 동의를 구해야 하는 당사자
        address: 지완 씨, 설명보다 먼저 허락
    friction: 지완은 면회를, 수경은 오류 재현을 원한다. 검수 책임이 드러나면 신뢰가 흔들린다
  - id: ward
    participants:
      - 지완
      - 세라
    history: 처음 면회한 보호자와 담당 간호사
    perspectives:
      지완:
        seesOtherAs: 당장 아버지에게 갈 길을 아는 직원
        address: 간호사님, 존대
      세라:
        seesOtherAs: 대답과 행동을 직접 본 보호자
        address: 보호자님, 이후 문지완 님
    friction: 세라는 병원 전체를 대신해 판정 철회를 약속할 수 없다
  - id: colleague
    participants:
      - 지완
      - 도겸
    history: 같은 조에서 일하는 동료
    perspectives:
      지완:
        seesOtherAs: 출고를 맡길 수 있는 동료
        address: 도겸 씨, 해요체
      도겸:
        seesOtherAs: 급한 날 먼저 보내야 하는 동료
        address: 지완 씨, 해요체
    friction: 경보에 대한 경험은 다르지만 서로를 설득하려 들지 않는다
  - id: witness
    participants:
      - 지완
      - 반찬집
    history: 이웃 가게를 통해 아버지 소식을 듣는다
    perspectives:
      지완:
        seesOtherAs: 지금 아버지 곁에 있는 사람
        address: 아주머니, 존대
      반찬집:
        seesOtherAs: 환자의 아들
        address: 지완 씨, 평소 말씨
    friction: 상태를 모르면 모른다고 말한다
  - id: shared_wait
    participants:
      - 지완
      - 보호자
    history: 접수대에서 처음 만난다
    perspectives:
      지완:
        seesOtherAs: 같은 안내 때문에 기다린 사람
        address: 존대, 이름을 아는 척하지 않는다
      보호자:
        seesOtherAs: 신청서를 먼저 쓴 사람
        address: 존대, 허락부터 묻는다
    friction: 지완은 대표자가 아니며 다른 사람의 동의를 대신할 수 없다
  - id: confirmation
    participants:
      - 수경
      - 세라
    history: 기술 확인자와 목격한 직원으로 만난다
    perspectives:
      수경:
        seesOtherAs: 직접 본 사실을 기록해 줄 사람
        address: 간호사님, 정중한 요청
      세라:
        seesOtherAs: 기기 문제를 확인했다는 사람
        address: 어느 분, 신원 확인 후 존대
    friction: 다른 보호자의 연락처는 바로 넘겨받지 않는다
scenes:
  0/waiting_area:
    participants:
      - 지완
      - 수경
    relations:
      - engineer
    before: 서로 이름을 모른다. 수경은 화면을 봤지만 면회 경위를 듣지 못했다
    exchange: 말 걸 허락→지완의 용건 질문→수경이 찾아온 이유
    avoid: 01이 잘못됐다고 확정하거나 출입을 약속하지 않는다
    gesture: 면회표를 쥔 손을 내려다보다 눈을 맞춘다
  1/cafe_introduction:
    participants:
      - 지완
      - 수경
    relations:
      - engineer
    before: 이름과 개발 참여 사실을 처음 공유한다
    exchange: 지완이 오류 가능성을 묻고 수경이 가능성과 한계를 답한다
    avoid: 카페에 왔다는 이유로 사적인 서류를 이미 읽었다고 가정하지 않는다
    gesture: 종이를 향해 손을 내밀기 전에 기다린다
  2/first_visit:
    participants:
      - 지완
      - 동식
    relations:
      - father
    before: 아버지는 아들이 문 밖에서 기다린 시간을 아직 모른다
    exchange: 국 얘기→서로 얼굴을 봄→겁났느냐는 질문
    avoid: 숫자나 제도 설명을 아버지에게 길게 하지 않는다
    gesture: 난간을 두드려 아들을 가까이 부른다
    branches:
      - when:
          var: picked_up
          op: eq
          value: true
        fact: 아버지와 아침 통화를 했다. 국을 반만 얼리기로 한 약속을 안다.
      - when:
          var: picked_up
          op: eq
          value: false
        fact: 아침에는 문자로만 답했다. 병원 메시지를 확인했을 때만 음성 메시지도 들었다.
  3/sign_confirmation:
    participants:
      - 지완
      - 수경
      - 세라
    relations:
      - engineer
      - ward
      - confirmation
    before: 지완은 이번 판독의 오류를 알지만 최초 검수 책임은 이제 듣는다
    exchange: 간호사의 확인자 질문→수경의 신원→지완이 설치 당시를 묻는다
    avoid: 책임 고백을 신뢰를 얻는 홍보 문구로 쓰지 않는다
    gesture: 회사 이름을 쓰려다 펜이 잠깐 멈춘다
    branches:
      - when:
          var: read_report
          op: eq
          value: true
        fact: 지완은 회사에 낸 보고서를 읽었다. 같은 자료를 처음 보는 것처럼 소개하지 않는다.
      - when:
          var: read_report
          op: eq
          value: false
        fact: 지완은 보고서 내용을 모른다. 서류를 줄 때 용도를 짧게 밝힌다.
  4/joint_appeal:
    participants:
      - 지완
      - 보호자
      - 세라
    relations:
      - shared_wait
      - ward
    before: 서로 가족 이름이나 사정은 모른다
    exchange: 보호자의 동참 질문에 먼저 답하고 자기 신청서를 보여 준다
    avoid: 대변인이나 상담자처럼 상대 결정을 대신하지 않는다
    gesture: 자기 서류를 상대가 읽을 방향으로 돌린다
