schemaVersion: 1
gameId: overflow
authorOnlyFacts: []
arc:
  premise: 감정을 숫자로 읽는 에모스 렌즈는 2025년에 나와 팔 년 동안 한 번도 틀린 적이 없다. 고등학교 때 높은 숫자로 경보를 울린 뒤 아버지에게 "셋 세고 말해라"를 배운 문지완은 쓰러진 아버지의 병실 앞에서도 셋을 세고 대답하고, 렌즈는 그에게 01(무반응 의심)을 띄워 문을 멈춘다. 검증팀 한수경은 눈금을 넘친 값이 잘려 01이 됐을 거라고 믿고 그에게 다가온다.
  question: 틀린 적 없는 기계가 0이라고 읽은 사람은 정말 0인가. 아니라면 그것을 숫자 말고 누가 무엇으로 말해 주는가?
  기:
    chapters: [0]
    summary: 2025년 렌즈의 등장, 칼을 든 남자를 잡은 97과 딸을 못 알아보던 노인의 61, 철학과 교수와 인권위의 반대, 그리고 "현장 판독 오류 0건 · 8년 연속". 그 뒤에 국 얘기뿐인 아침 전화와 휠체어를 도운 남자를 94로 잡는 역 경보가 온다. 아버지가 쓰러지고, 지완은 병실 문 앞에서 셋을 세고 "네, 아들입니다"라고 답하지만 01이 뜨고 자동문이 멈춘다. 틀린 적 없는 렌즈가 그렇게 읽었으니 그는 아무렇지 않은 사람이다. 아침에 장갑을 주워 준 여자가 렌즈 회사 사람이라며 01이 틀렸을 수도 있다고 말을 건다.
  승:
    chapters: [1, 2]
    summary: 카페에서 수경은 001과 101이 똑같이 01로 뜨는 시험 출력물을 보여 준다. 눈금은 100까지이고 101은 현장에서 한 번도 들어온 적이 없다. 수경은 지완이 그 첫 사람이기를, 지완은 "기계가 틀렸다는 종이 한 장"을 바란다. 동행 면회에서 아버지가 난간을 세 번 두드리고 "겁났냐"고 묻는다. 같은 시각 검사기가 남긴 값은 101이 아니라 001이다. 잘린 자리가 없다. 기계는 맞게 읽었고, 지완의 손은 떨리는데 숫자는 다시 재도 1이다.
  전:
    chapters: [3]
    summary: 간호사 세라는 01이 뜬 사람을 본 대로 적는 것이 처음이라 칸이 없어 여백에 쓴다. 확인자 칸 앞에서 수경은 팔 년 치 "오류 0건"에 삼 년째 서명한 사람이 자신이라고 말한다. 높게 뜬 판독은 경찰과 조서로 전부 확인했지만 낮게 뜬 사람에게는 아무도 가지 않았다. 틀린 적이 없는 게 아니라 물어본 적이 없다. 수경이 찾던 오버플로(넘쳐서 0부터 다시 세는 것)는 렌즈에서 일어나지 않았고, 사람도 그러느냐는 물음에는 "검증한 적이 없다"고 답한다. 병실 머리맡 판독기는 얼굴 오른쪽이 굳은 아버지를 03으로 읽는다. 아버지는 그날 학교 복도에서 자기도 문 밖에 서 있었다고 털어놓고, "나는 3이란다. 합쳐서 4냐", "나한텐 세지 마라"고 한다.
  결:
    chapters: [4]
    summary: 다음 날 아침 병원은 간호사의 확인서를 보고 지완 한 사람의 면회 제한만 풀어 준다. 01은 맞게 읽힌 값이라 기록에서 지워지지 않는다. 수경은 밤사이 검증 보고서의 "오류 0건" 옆에 "0 판정은 확인한 적 없음"을 넣었다. 어제 01을 받고 돌아간 보호자가 아이 손을 잡고 온다. 지완은 001이 찍힌 출력물을 방송에, 자기 기록 옆에, 다음 사람과 함께 내는 신청서에 쓸지, 꺼내지 않고 병실로 들어갈지 정한다.
chapters:
  0:
    title: 아버지한테 전화가 왔다
    beat: 기
    tells: 렌즈가 세상에 나온 뒤 팔 년 동안 일어난 일(97, 61, 반대, 오류 0건)과, 높은 숫자에는 사람이 달려와 묻고 낮은 숫자에는 문이 닫힌다는 규칙. 지완이 아버지와 국 얘기로만 안부를 나누는 사이라는 것, 고등학교 때 경보를 울린 뒤로 셋을 세고 말한다는 것.
    turn: 자동문이 멈추고 면회표에 "정서 반응 01 · 무반응 의심"이 찍힌다. 틀린 적 없는 렌즈가 그렇게 읽었으므로 지완은 "지금 나는 아무렇지도 않은 사람"이 된다. 그 손은 떨리고 있다.
    carries: 보호자 면회표, 8시 10분 동행 면회, "틀리게 떴을 수도 있다"는 수경의 말과 "틀린 적은 없어요. 아직은요". 문이 멈춘 뒤 지완이 "지금 대답하고 있잖아요"라고 했는지, 셋을 세고 면회 시간부터 물었는지(3장에서 간호사가 본 대로 적는다).
  1:
    title: 01이 두 번 나온다
    beat: 승
    tells: 수경의 시험 출력물에서 001과 101이 똑같이 01로 뜬다. 눈금은 100까지이고 101은 시험실에서 억지로 넣어 본 값이다. 회사는 눈금을 넘긴 사람이 실제로 나와야 다시 보겠다고 했고, 수경은 그 사람을 기다리느라 접수대 앞에 앉아 있었다. 플레이어는 여기서 "넘쳐서 1이 됐다"를 답으로 기대하게 된다.
    turn: 지완이 "내 숫자만, 내가 먼저 보고, 아버지 쪽은 아무것도 안 남긴다"는 조건으로 자기 렌즈에 검사기를 연결하게 한다. 그는 기계가 틀렸다는 종이가 있어야 자기가 아무렇지 않은 사람이 아니게 된다고 생각한다.
    carries: 검사기, "나는 1인가 101인가", 수경이 말하지 않은 것(오류 0건에 서명한 사람).
  2:
    title: 병실 안에서
    beat: 승
    tells: 동행 면회. 아버지는 국부터 묻고, 난간을 세 번 두드려 아들을 부르고, "겁났냐"고 묻는다. 지완은 대답하거나 물을 건넨다. 그때 렌즈는 다시 01을 띄우고 지완은 양말을 주워 신긴다.
    turn: 20시 14분 9초, 센서 입력 001과 렌즈 표시 01이 한 장에 찍힌다. 잘린 자리가 없다. 기계는 틀리지 않았고 수경이 틀렸다. 지완이 다시 재 달라고 하면 20시 31분에도 001이 나온다. 수경은 그의 손이 떨리는 것을 보고, 렌즈는 눈가와 관자놀이만 본다고 답한다.
    carries: 001이 찍힌 출력물, 문 앞에서 지켜본 간호사, (물을 건넨 경우) 대답하지 않은 "겁났냐".
  3:
    title: 누가 사인했어요?
    beat: 전
    tells: 팔 년 치 "오류 0건"이 무엇을 세지 않았는지. 높은 숫자는 전부 확인됐고 낮은 숫자는 한 번도 확인되지 않았다. 감정을 숨기라고 가르친 아버지가 그날 유일하게 "우리 애 겁먹은 거"라고 말한 사람이었다는 것, 그리고 그 아버지도 지금은 03으로 읽힌다는 것.
    turn: 지완이 "그럼 안 틀린 게 아니라 안 물어본 거네요"라고 말하고 출력물을 도로 가져간다. 수경은 오버플로를 찾았지만 렌즈는 넘치지 않았다고 하고, 사람도 넘치면 0부터 다시 세느냐는 물음에 답하지 못한다. 병실에서 지완은 세지 않고 말하고, 아버지는 "나한텐 세지 마라"고 한다.
    carries: 지완 주머니 속 출력물, "0 판정은 확인한 적 없음"을 넣기로 한 검증 보고서, 여백에 적힌 간호사의 두 줄, "내일은 들어오면서 크게 부를게요". 지완이 물었다면, 아침 역에서 병원을 묻던 수경이 그때도 눈금을 넘긴 사람을 기다리러 가던 길이었다는 답과 "장갑은 고마웠어요. 그건 따로예요".
  4:
    title: 새 면회증
    beat: 결
    tells: 병원이 지완 한 사람의 문만 열어 준 아침, 같은 01을 받고 돌아갔던 보호자가 접수대에 온다. 01은 틀린 값이 아니라서 지워지지 않는다. 수경은 자기 이름으로 낼 것을 이미 냈고 출력물은 지완의 결정으로 남겨 둔다.
    turn: 지완이 001이 찍힌 출력물을 어디에 쓸지 정한다. 방송(공개), 숫자 옆에 본 것을 붙인 자기 기록(정정 이력), 꺼내지 않음(출입 허용), 다음 보호자와 함께(이의신청).
    carries: 결말. 공개는 "기계가 틀렸다고는 못 하겠어요. 그날 무서웠다는 건 제가 알아요", 정정은 숫자는 그대로이고 그 옆에 붙은 두 줄, 출입 허용은 복도에 울린 목소리, 이의신청은 답이 오지 않은 신청서와 일요일의 국.
characters:
  지완:
    name: 문지완
    age: 28
    assetIds:
      - 지완
    speakerNames: []
    role: 물류센터 출고 담당, 동식의 아들
    desire: 오늘 밤 아버지 얼굴을 보고, 자기가 늦게 온 게 아니라는 걸 알리고 싶다. 조용히 문만 열리면 된다
    fear: 고등학교 때처럼 다시 '사례'가 되는 것. 아버지가 자기를 못 알아보는 것
    contradiction: 4번 도크 송장은 챙기면서 무서웠다는 말은 못 한다. 셋을 세면 숨겨진다고 배웠고, 십 년 동안 너무 잘 숨겨서 틀린 적 없는 렌즈가 그를 1로 읽는다. 손은 떨린다
    dailyLife: 냉동할 국과 반찬 통, 다음 근무조를 기억한다. 대답하기 전에 셋을 세서 반 박자 늦다
    voice: 짧게 끊는다. 숫자와 시각으로 말한다("8시 14분.", "…001."). 아버지에게 생활 존대, 낯선 사람에게 해요체. 급하면 일 얘기로 샌다. 3장 병실부터는 세지 않고 말한다
  동식:
    name: 문동식
    age: 61
    assetIds:
      - 동식
      - 동식_연락처
    speakerNames: []
    role: 혼자 사는 아버지
    desire: 아들이 일요일에 와서 국을 먹고 가는 것. 아들이 겁났는지 직접 듣는 것
    fear: 아들이 자기처럼 문 밖에 서서 아무 말도 못 하게 되는 것
    contradiction: 학교 복도에서 "우리 애 겁먹은 거"라고 말한 유일한 사람이면서, 그날 집에 와서 아들에게 셋 세고 숨기라고 가르쳤다
    dailyLife: 국을 넉넉히 끓이고 파는 먹을 때 넣으라고 한다. 아들이 셀 때는 식탁이든 난간이든 세 번 두드린다
    voice: 아들에게 짧은 반말. 국 얘기 뒤에 용건이 나온다. 입원 직후에는 단어만("…국.", "겁났냐."), 밤 면회에서는 두 마디씩. 3장에서 가르친 걸 거둔다("나한텐 세지 마라")
  수경:
    name: 한수경
    age: 34
    assetIds:
      - 수경
      - 목격자
    speakerNames: []
    role: 한신뉴로 검증팀. 에모스 연례 검증 보고의 "현장 판독 오류 0건"에 삼 년째 서명해 온 사람. 눈금을 넘는 입력이 화면에서 잘린다는 결함 보고서를 냈고, 그 첫 사례를 기다리며 연차를 내고 접수대 앞에 앉아 있었다
    desire: 회사가 요구한 '실제로 면회를 못 한 사람'의 기록을 확보해 사용 중지를 다시 요청하고 싶다
    fear: 버그가 아닐까 봐. 버그는 고치면 되지만, 아니라면 팔 년 치 0을 찾아가 그날 어땠느냐고 물어야 한다. 그 "0건"에 자기 이름이 있다
    contradiction: 매번 허락을 구하면서 정작 가장 먼저 말했어야 할 것은 물어볼 때까지 말하지 않는다
    dailyLife: 버전 번호부터 보고, 출력물의 접힌 자리를 손날로 눌러 편다
    voice: 인물 중 가장 길게 말한다. 종이의 두 숫자를 짚으며 설명하고 못 하는 약속은 못 한다고 한다. 자기 책임이 나오면 문장이 끊긴다("…저요."). 4장에서는 달라고 하지 않고 기다린다
  세라:
    name: 윤세라
    age: 31
    assetIds:
      - 세라
    speakerNames:
      - 간호사
    role: 신경과 병동 간호사. 동행 면회에 같이 들어간 직원
    desire: 자기가 본 것을 자기 이름으로 적어 남기고 싶다
    fear: 자기 권한 밖의 허가를 약속해서 가족을 더 기다리게 하는 것
    contradiction: 01이 뜨면 규정대로 문을 막지만, 양말을 신기는 걸 보고는 도로 앉는다
    dailyLife: 교대 기록과 면회 대기 시간을 챙긴다. 누가 몇 시에 왔다 갔는지 기억한다
    voice: 처음엔 보호자님, 4장에서 문지완 님. 되는 것과 안 되는 것을 한 문장씩 나눠 말한다("제가 지울 수는 없어요."). 본 것은 동작으로 말한다
  도겸:
    name: 임도겸
    age: 26
    assetIds:
      - 도겸
    speakerNames: []
    role: 같은 출고조 동료
    desire: 급한 동료를 빨리 보내고 빈자리를 메운다
    fear: 어머니가 역에서 또 밀쳐지는 일
    contradiction: 도와준 사람이 잡히는 걸 눈앞에서 보고도 경보가 있어서 다행이라고 한다. 공개 결말에서 어머니가 먼저 묻는다
    dailyLife: 출고를 대신 맡는다. 지완의 대답이 반 박자 늦는 걸 놀린다
    voice: 지완 씨, 서로 해요체. 말이 많고 가볍다. 급할 땐 이름만 부르고 끊는다("지완 씨. 가요.")
  반찬집:
    name: 반찬집 아주머니
    age: 성인
    assetIds: []
    speakerNames:
      - 반찬집 아주머니 (통화)
    role: 동식의 이웃 상인
    desire: 아들에게 아버지의 위치와 상태를 전한다
    fear: 자기가 못 본 상태를 잘못 전할까 걱정한다
    contradiction: 급해도 확인한 것만 말한다
    dailyLife: 구급차를 보내고 동식의 휴대폰을 챙긴다
    voice: 신원부터 밝히고 지완이 묻는 상태에 답한다. 못 본 건 못 봤다고 한다
  보호자:
    name: 다른 보호자
    age: 성인
    assetIds: []
    speakerNames:
      - 보호자
    role: 어제 여섯 시에 01을 받고 면회 전에 돌아간 환자의 딸
    desire: 아버지가 자기가 안 온 줄 알지 않았으면 한다
    fear: 다시 기다리다 아이를 데리러 갈 시간을 놓칠까 두렵다
    contradiction: 신청에 동참하고 싶지만 먼저 그래도 되는지 묻는다
    dailyLife: 아이 손을 놓지 않는다. 도착한 시각을 분까지 기억한다
    voice: 처음 보는 지완에게 존대. 자기 사정을 시각으로 짧게 말한다
  병원알림:
    name: 월계병원 알림
    age: 해당 없음
    assetIds: []
    speakerNames:
      - 월계병원
    role: 면회 시각 안내
    desire: 대기 장소와 시각을 전달한다
    fear: 해당 없음
    contradiction: 상담하는 인격체가 아니다
    dailyLife: 정해진 시간만 알린다
    voice: 공식 안내문. 보호자의 감정이나 원인을 추측하지 않는다
relationships:
  - id: father
    participants:
      - 지완
      - 동식
    history: 고등학교 때 경보가 울린 날 아버지는 복도에 못 들어갔고, 그날 저녁 아들에게 셋 세고 말하라고 가르쳤다. 지금은 일요일마다 국으로 만나는 부자
    perspectives:
      지완:
        seesOtherAs: 걱정시키면 안 되는 사람. 그래서 셋을 세고 양말과 물부터 챙긴다
        address: 아버지 + 생활 존대
      동식:
        seesOtherAs: 셀 때 얼굴이 달라지는 아들. 겁났는지 직접 듣고 싶다
        address: 지완아, 짧은 반말
    friction: 아버지는 묻고("겁났냐") 아들은 일로 피한다. 숨기는 법을 가르친 사람이 이제 그걸 거두려 한다
  - id: engineer
    participants:
      - 지완
      - 수경
    history: 아침에 장갑을 주워 준 낯선 사람→기계가 틀렸기를 같이 바란 사이→001을 같이 본 사이→출력물을 도로 가져간 사이
    perspectives:
      지완:
        seesOtherAs: 숫자를 설명해 주지만 자기를 '사례'로 기다리던 사람. 3장 뒤로는 고맙고도 괘씸한 사람
        address: 수경 씨, 끝까지 해요체
      수경:
        seesOtherAs: 두 달을 기다린 사례이자, 그렇게 불러서는 안 되는 당사자
        address: 지완 씨, 설명보다 먼저 허락
    friction: 지완은 자기가 아무렇지 않은 사람이 아니라는 종이를, 수경은 팔 년 만의 첫 오류를 원한다. 둘 다 얻지 못한다. 수경이 "0건"에 서명한 사람이고 낮은 판독은 확인한 적이 없다는 게 드러나면 지완이 출력물을 거둔다. 4장에서 수경은 달라고 하지 않는다
  - id: ward
    participants:
      - 지완
      - 세라
    history: 접수대에서 01을 같이 본 보호자와 간호사. 동행 면회에 함께 들어갔다
    perspectives:
      지완:
        seesOtherAs: 문을 막은 사람이자 자기가 대답하는 걸 본 유일한 직원
        address: 간호사님, 존대
      세라:
        seesOtherAs: 대답하고 양말을 신기는 걸 직접 본 보호자
        address: 보호자님, 4장부터 문지완 님
    friction: 세라는 본 것을 적어 줄 수는 있어도 판정을 지울 수는 없다. 새 면회증도 한 사람 앞으로만 나온다
  - id: colleague
    participants:
      - 지완
      - 도겸
    history: 같은 조에서 일하는 동료
    perspectives:
      지완:
        seesOtherAs: 출고를 맡길 수 있지만 맡기는 게 미안한 동료
        address: 도겸 씨, 해요체
      도겸:
        seesOtherAs: 맨날 차분하고 대답이 반 박자 늦는 선배 같은 동료
        address: 지완 씨, 해요체
    friction: 도겸은 경보가 어머니를 지켰다고 믿고 지완은 경보에 걸려 본 사람이다. 서로 설득하지 않는다
  - id: witness
    participants:
      - 지완
      - 반찬집
    history: 이웃 가게를 통해 아버지 소식을 듣는다
    perspectives:
      지완:
        seesOtherAs: 지금 아버지 곁에 있는 사람
        address: 아주머니, 존대
      반찬집:
        seesOtherAs: 환자의 아들
        address: 지완 씨, 평소 말씨
    friction: 상태를 모르면 모른다고 말한다
  - id: shared_wait
    participants:
      - 지완
      - 보호자
    history: 다음 날 아침 접수대에서 처음 만난다. 둘 다 01을 받았다
    perspectives:
      지완:
        seesOtherAs: 어제의 자기. 다만 이 사람은 그냥 돌아갔다
        address: 존대, 이름을 아는 척하지 않는다
      보호자:
        seesOtherAs: 신청서를 먼저 쓴 사람
        address: 존대, 허락부터 묻는다
    friction: 지완은 대표자가 아니며 다른 사람의 동의를 대신할 수 없다. 자기 문은 이미 열려 있다
  - id: confirmation
    participants:
      - 수경
      - 세라
    history: 기술 확인자와 목격한 직원으로 만난다. 수경이 연례 검증에 서명해 온 사람이라는 건 확인자 칸에서 드러난다. 세라는 01이 뜬 사람을 본 대로 적는 첫 직원이 된다
    perspectives:
      수경:
        seesOtherAs: 직접 본 사실을 기록해 줄 사람. 다음 사례로 가는 연락처를 가진 사람
        address: 간호사님, 정중한 요청
      세라:
        seesOtherAs: 기기 문제를 확인했다는 사람
        address: 어느 분, 신원 확인 후 존대
    friction: 다른 보호자의 연락처는 넘겨주지 않는다. 세라가 먼저 묻는다
scenes:
  0/station_alert:
    participants:
      - 지완
      - 도겸
    relations:
      - colleague
    before: 도와준 남자가 94로 잡히는 걸 둘이 같이 봤다
    exchange: 도겸의 "다행"→지완의 짧은 반박→도겸의 놀림→지완이 속으로 셋을 센 뒤에야 "그 뒤로 세고 말해요"라고 답한다
    avoid: 누가 셋을 세라고 가르쳤는지는 여기서 말하지 않는다. 학교 일을 지문으로 설명하지 않는다
    gesture: 대답이 반 박자 늦는다
  0/ward_check_in:
    participants:
      - 지완
      - 세라
    relations:
      - ward
    before: 지완은 아버지가 깨어 있는지도 모른 채 도착했다
    exchange: 신원 질문→셋을 세고 대답→01→"대답하고 있잖아요"→동행 면회 안내→전해 달라는 부탁
    avoid: 세라가 01이 틀렸다고 인정하거나 사과하지 않는다. 지완이 언성을 높이지 않는다
    gesture: 대답하기 전에 속으로 셋을 센다
  0/waiting_area:
    participants:
      - 지완
      - 수경
    relations:
      - engineer
    before: 서로 이름을 모른다. 수경은 화면을 봤지만 면회 경위를 듣지 못했다
    exchange: 말 걸 허락→수경이 찾아온 이유→지완은 면회 시각으로 답한다
    avoid: 01이 잘못됐다고 확정하거나 출입을 약속하지 않는다. 수경은 회사 사람이라고만 한다. "오류 0건"에 서명한 사람이라는 말은 3장 확인자 칸 앞까지 나오지 않는다. 렌즈가 틀린 적이 있느냐는 물음에는 "없어요. 아직은요"까지만 답한다
    gesture: 면회표를 쥔 손을 내려다보다 눈을 맞춘다
  1/cafe_introduction:
    participants:
      - 지완
      - 수경
    relations:
      - engineer
    before: 이름과 소속을 처음 공유한다
    exchange: 지완이 자기 01이 틀렸는지 묻고 수경은 아직 모른다고 답한 뒤 접수표를 청한다
    avoid: 카페에 왔다는 이유로 사적인 서류를 이미 읽었다고 가정하지 않는다
    gesture: 종이를 향해 손을 내밀기 전에 기다린다
  1/plan_measurement:
    participants:
      - 지완
      - 수경
    relations:
      - engineer
    before: 지완은 001과 101이 같은 01로 뜬다는 걸 봤다. 눈금은 100까지이고 101은 현장에서 나온 적이 없다는 것도 들었다. 보고서를 읽었다면 수경이 자기 같은 사람을 기다렸다는 것도 안다
    exchange: 수경의 제안→"내일은 혼자 들어가요?"→약속 못 함→"누구 좋으라고"→"저요"→지완의 조건
    avoid: 수경이 면회 허가나 정정을 약속하지 않는다. 지완이 선의로 돕는 것처럼 쓰지 않는다. 거래다
    gesture: 전광판 시각을 보고 지완이 먼저 일어난다
  2/first_visit:
    participants:
      - 지완
      - 동식
    relations:
      - father
    before: 아버지는 아들이 문 밖에서 기다린 시간을 아직 모른다
    exchange: 일어나지 말라는 말→국→난간 세 번→겁났느냐는 질문
    avoid: 숫자나 제도 설명을 아버지에게 하지 않는다. 난간 세 번의 뜻을 여기서 풀지 않는다
    gesture: 난간을 세 번 두드려 아들을 가까이 부른다. 마지막 한 번이 늦다
    branches:
      - when:
          var: picked_up
          op: eq
          value: true
        fact: 아버지와 아침 통화를 했다. 국을 반만 얼리기로 한 약속을 안다.
      - when:
          var: picked_up
          op: eq
          value: false
        fact: 아침에는 문자로만 답했다. 병원 메시지를 확인했을 때만 음성 메시지도 들었다.
  3/sign_confirmation:
    participants:
      - 지완
      - 수경
      - 세라
    relations:
      - engineer
      - ward
      - confirmation
    before: 지완은 기계가 틀리지 않았다는 것을 방금 들었다. 간호사는 본 것을 여백에 적겠다고 했다. 출력물은 책상 위에 있다
    exchange: 간호사의 확인자 질문→수경의 신원(검증팀)→"팔 년 동안 안 틀렸다는 건 누가 사인했어요"→"…저요"→높은 건 다 확인, 낮은 건 확인한 적 없음→"안 틀린 게 아니라 안 물어본 거네요"→"버그이기를 바랐어요"→지완이 출력물을 가져간다→오버플로는 렌즈에서 일어나지 않았다, 사람은 검증한 적 없다
    avoid: 책임 고백을 신뢰를 얻는 홍보 문구로 쓰지 않는다. 지완이 용서하거나 화해하는 말을 하지 않는다. 수경이 변명하지 않는다
    gesture: 수경은 회사 이름을 쓰다가 펜을 멈춘다. 지완은 책상 위 출력물을 자기 쪽으로 끌어온다
    illustration: assets/bg/desk_print.svg
    branches:
      - when:
          var: read_report
          op: eq
          value: true
        fact: 지완은 회사에 낸 보고서와 "사례가 확인되면 재검토"라는 답변을 읽었다. 같은 자료를 처음 보는 것처럼 소개하지 않는다.
      - when:
          var: read_report
          op: eq
          value: false
        fact: 지완은 보고서 내용을 모른다. 받은 자리에서 회사 답변 줄을 처음 읽는다.
  3/second_visit:
    participants:
      - 지완
      - 동식
    relations:
      - father
    before: 지완은 방금 도와주던 사람에게서 출력물을 거뒀다. 숫자는 두 번 다 1이었다. 아버지는 아들이 저녁 내내 문 밖에 있었다는 걸 간호사에게 들었고, 머리맡 판독기는 아버지를 03으로 읽고 있다
    exchange: '"와 있었다며"→아버지도 학교 복도에서 못 들어갔다→담임에게 한 말→그래서 셋을 가르쳤다→지완의 고백 또는 되짚음→"나한텐 세지 마라"'
    avoid: 아버지가 사과문을 읊거나 교훈을 정리하지 않는다. 숫자 얘기는 "기계는 저보고 1이래요"와 "나는 3이란다. 합쳐서 4냐"까지만 한다. 아버지가 렌즈를 평가하거나 0의 뜻을 풀이하지 않는다
    gesture: 지완이 세지 않고 바로 말한다
    branches:
      - when:
          var: told_father
          op: eq
          value: true
        fact: 저녁 면회에서 이미 겁났다고 말했다. 여기서는 앉혀 준 일을 되짚는다.
      - when:
          var: told_father
          op: eq
          value: false
        fact: 저녁에는 물을 건네고 대답하지 않았다. 여기서 처음으로 무서웠다고 말한다.
  4/morning_pass:
    participants:
      - 지완
      - 세라
      - 수경
      - 보호자
    relations:
      - ward
      - engineer
      - shared_wait
    before: 출력물은 지완 주머니에 있다. 수경은 밤사이 검증 보고서의 "오류 0건" 옆에 "0 판정은 확인한 적 없음"을 넣어 회사에 올렸다
    exchange: 새 면회증→"저만 되는 거죠"→수경이 출력물 얘기를 꺼내다 거둔다→어제의 보호자가 온다
    avoid: 수경이 출력물을 달라고 하지 않는다. 세라가 어느 선택이 옳다고 권하지 않는다
    gesture: 세라가 여자의 어제 접수표를 접수대에 올려놓는다. 같은 자리에 01
  4/joint_appeal:
    participants:
      - 지완
      - 보호자
      - 세라
    relations:
      - shared_wait
      - ward
    before: 서로 가족 이름이나 사정은 모른다. 둘 다 01을 받았다는 것만 안다
    exchange: 보호자의 동참 질문에 먼저 답하고 자기 신청서를 보여 준다
    avoid: 대변인이나 상담자처럼 상대 결정을 대신하지 않는다
    gesture: 자기 서류를 상대가 읽을 방향으로 돌리고 그 위에 출력물을 얹는다
    illustration: assets/bg/appeal_turn.svg
