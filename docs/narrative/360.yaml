schemaVersion: 1
gameId: '360'
arc:
  premise: 1809년 겨울, 아이를 이불로 덮어 두고 강 건너로 곡식을 꾸러 나갔다가 잃은 사람이 있다. 그 사람은 죽을 때마다 어둠에서 방금 끝난 삶의 후회 하나를 쥐고 다음 삶으로 간다. 쥔 후회는 다음 삶에서 '하려고 해도 안 되는 일' 하나로 돌아오고, 그 아이는 매번 다른 얼굴로 먼저 와 있는데 주인공은 한 번도 알아보지 못한다.
  question: 후회 하나를 쥐고 가면, 덮어 두고 나온 그 아이 곁에 다음에는 있을 수 있는가.
  기:
    chapters: [0]
    summary: 첫 어둠에서 빛 하나를 골라 삶으로 들어간다. 1894년 제물포의 객주 만석은 곳간 열쇠와 학질 걸린 딸 끝순 사이에서 두 번 고르고, 어느 쪽으로 가도 딸에게 엿 얘기밖에 못 한 채 죽는다. 어둠에서 묻는 소리가 제 안에서 난다는 것, 후회 하나를 쥐어야 그 소리가 멎는다는 규칙을 여기서 익힌다.
  승:
    chapters: [1, 2]
    summary: 쥐고 온 것이 다음 삶에서 입과 손을 막는다. 1952년 부산의 순임은 명부와 영수증의 규칙대로 했는데도 자리와 곗돈을 잃고, 불난 밤 영호 손을 쥔 채 빈 손을 쓰지 못한다. 1988년 병동의 민재는 안 된 것과 스스로 안 한 것이 다르다는 걸 처음 구별하고 "누가 고르는 것 같다. 나 말고"까지 간다. 수경의 침대가 먼저 빈다.
  전:
    chapters: [3]
    summary: 2026년, 전생이 남의 제보가 되어 지안의 책상에 올라온다. 지금까지는 주인공이 낯익은 웃음을 알아봤는데 여기서는 여덟 살 다온이 먼저 알아보고, 뒤에 얼굴 안 보이는 사람이 맨날 서 있다고 말한다. 지안은 못 봤다고 답한다. 서명 자리에서는 무엇을 골라도 쥐고 온 쪽으로 몸이 가고, 엄마의 문자에는 마흔다섯 해 답하지 못한다.
  결:
    chapters: [4]
    summary: 다섯 번째 어둠에서 앞의 세 삶이 녹취처럼 들리고, 쥔 숫자와 두고 간 숫자를 처음으로 나란히 본다. 일흔아홉 해의 것을 하나 쥐고 기우는 중에 번호 없는 1809년 겨울이 온다. 끝순·영호·수경·다온이 그 아이였고, 다온이 본 얼굴 없는 사람이 자기였다. 그 겨울에서 하나를 다시 쥐거나(한 점, 한 바퀴), 가다가 돌아보거나, 아궁이 옆에 남는다.
chapters:
  0:
    title: 곳간 열쇠
    beat: 기
    tells: 첫 어둠에서 빛 셋 가운데 하나로 손을 뻗는다(순서는 플레이어가 정하고, 맨 처음 사는 삶에는 막히는 일이 없다). 1894년 6월 제물포에서는 짚신과 열쇠를 만지고, 봉구가 부르는 이름과 끝순의 아버지라는 부름으로 자기 살림을 알아차린다. 만석은 대문 밖 덕이네에게 제 쌀 백마흔 섬을 풀지, 학질로 누운 끝순을 두고 마포로 삼백 섬 수결을 하러 갈지 고른다. 끝순은 엿을 세 번 조르고 만석은 그때마다 수량으로 답한다.
    turn: 1910년 임종에 만석이 "…엿" 하고 말하는데 봉구가 못 알아듣자 그만둔다. 어둠에서 끝순을 불러도 대답이 없고, 말을 했어야 했다 / 어디에도 매이지 말았어야 했다 가운데 하나를 쥐어야 묻는 소리가 멎는다.
    carries: 쥔 후회 하나(last_taken)와 꺼진 별 하나. 다음 삶의 사람은 포구 이름도 열쇠도 기억하지 못하고, 쥔 것만 버릇으로 남는다.
  1:
    title: 부두
    beat: 승
    tells: 1952년 12월 부산 국제시장. 순임은 복례보다 먼저 자릿세를 내 3열 17번을 얻고 미안하다는 말을 삼킨다. 기호에게 곗돈 삼백오십만 원을 맡기고, 1953년 1월 30일 불 속에서 영호 손을 쥔 채 복례네 아이들 쪽으로 가지 못한다. 부두에서 아들을 기다리는 시어머니를 판잣집에 두고 새벽 기차를 탄다.
    turn: 쇠기둥만 남은 제 자리에 남이 천막을 치고, 영호가 "먼저 선 사람이 임자래"를 전한다. 초콜릿을 조르던 영호는 그 뒤로 조르지 않는다. 1967년 답장에 시어머니는 이재민 명부에 없다.
    carries: 아무도 믿지 말았어야 했다(guard) 또는 떠나지 말았어야 했다(stay). 받은 사람은 이유 없이 사람을 의심하거나 자리를 못 뜬다.
  2:
    title: 6인실
    beat: 승
    tells: 1988년 9월 혜화동 대학병원. 열일곱 민재는 새벽마다 갈치 가시를 발라 오는 엄마에게 무섭다고 말할지, 폐막식 밤 수경이 내민 잠바를 받을지 고른다. 문틈으로 이식 비용 팔백만 원과 성공률 삼사십 퍼센트를 듣고, 안 받겠다는 말을 이번에는 스스로 삼킨다.
    turn: 새벽 두 시에 손을 들어 본다. 지금은 되는데 그때는 안 됐다. "누가 고르는 것 같다. 나 말고." 열이틀 뒤 수경의 침대 시트가 걷히고 약봉지 그림이 돌아온다. 어둠에서는 고르는 쪽도 자기라는 데까지 간다.
    carries: 더 살고 싶었다(live) 또는 한 번은 해 볼걸(dare). 약봉지 위의 점 하나 또는 둘은 다섯 번째 어둠에서 다시 본다.
  3:
    title: 녹취
    beat: 전
    tells: 2026년 3월 상암동. 지안은 전생을 기억한다는 제보 400건에서 사람이 제 얘기로 되돌아가는 자리를 찾는다. 다온이 "아줌마, 어디서 봤는데" 하고 먼저 알아보고, 문호는 지안의 전생을 틀리게 단정한다. 김포 요양병원 유리 너머 십 분, 썼다 지우는 문자, 정규직 계약에 묶인 녹취 원본 양도서.
    turn: 지안은 제 말에서 되돌아가는 자리("다음 주에 올게요")를 찾아내고도 전송을 못 누른다. 서명 자리에서는 일어서려 하든 앉아 있으려 하든 쥐고 온 쪽으로 몸이 간다. 다온에게는 "못 봤어"라고 답했다.
    carries: 마흔다섯 해 깜박인 답장 칸과 김치통. 다온의 말 "얼굴은 안 보여. 맨날 거기 서 있어." 줄을 그었다면 '가다가 돌아봤다'.
  4:
    title: '360'
    beat: 결
    tells: 다섯 번째 어둠. 열쇠·보따리·약봉지가 제보처럼 들리는데 질문을 끝내기 전에 답이 떠오른다. 셋 다 자기다. 쥔 숫자 셋과 두고 간 숫자 셋을 보고, 김치통과 녹취 원본 가운데 하나를 쥔다. 기우는 중에 번호 없는 1809년 겨울이 오고 냄새·소리·추위를 더듬어 식은 아궁이 옆 이불에 닿는다.
    turn: 아이 얼굴은 떠오르지 않고 끝순·영호·수경·다온이 떠오른다. 넷 다 웃을 때 왼쪽 눈이 먼저 감겼다. 따라온 것이 아니라 다섯 번 다 먼저 와 있었고, 얼굴이 안 보이던 쪽은 자기였다.
    carries: 다음 챕터는 없다. 그 겨울에서 쥔 하나(독이 비지 않았더라면 / 그날 나가지 않았더라면)가 일흔아홉 해에 쥔 것과 같으면 한 바퀴, 다르면 한 점, 돌아보면 돌아본 사람, 쥐지 않으면 아궁이 옆에 머문다.
authorOnlyFacts:
  - 겨울의 보호자·만석·순임·민재·지안은 한 사람이다. 각 삶의 인물은 그 사실을 모르고, 다섯 번째 어둠에서만 안다.
  - 끝순·영호·수경·다온은 1809년 겨울에 덮어 두고 나온 아이의 다른 얼굴이다. 겹치는 것은 웃을 때 왼쪽 눈이 먼저 감기는 버릇 하나다. 각 삶의 인물은 모른다.
  - 별 셋(1894·1952·1988)은 플레이어가 고른 순서로 산다. 2026은 반드시 마지막이다. 그래서 어느 삶도 다른 삶의 사건을 말로 가리키지 않고, 직전에 쥔 것(last_taken)만 버릇과 막힘으로 받는다.
  - 막힘은 벌이 아니라 쥔 후회가 지나치게 지켜지는 것이다. 붙잡는 쪽(say·guard·live·hold)을 쥐면 내주기·영수증 받기·무섭다고 털어놓기·자리 박차기가 안 되고, 놓는 쪽(free·stay·dare·kin)을 쥐면 떠나기·모시고 가기·잠바 받기·앉아서 서명하기가 안 된다. 인물은 까닭을 모른다.
  - 문호가 지안에게 단정하는 전생(물에 빠져 죽었다, 한집에 갇혀 살았다)은 틀렸다. 플레이어는 열일곱에 병실에서 죽은 민재를 살아 봐서 안다.
characters:
  만석:
    name: 장만석
    age: 40
    assetIds:
      - 만석
    speakerNames: []
    role: 제물포 객주 주인
    desire: 맡은 쌀 백일흔두 섬에 손대지 않고, 제 쌀 백마흔 섬은 끝순 혼수와 노후로 쥐고 있는다. 대문 밖 덕이네에 쌀을 풀자는 끝순의 바람과 부딪친다
    fear: 곳간을 열었다가 남의 쌀까지 물어 주고 객주 문을 닫는 것
    contradiction: 백마흔 섬을 딸 혼수라고 부르면서 딸이 조르는 깨엿 한 봉지와 덕이네 닷 되는 미룬다. 끝까지 바뀌지 않는다. 임종에도 "…엿"까지만 말하고 그만둔다
    dailyLife: 열쇠를 차고 자고 어젯밤 센 수량을 오늘 또 센다
    voice: 짧다. 봉구에게 지시, 딸에게 반말. 대답 대신 수량과 식은 밥을 말한다. 고맙다·미안하다는 말이 입에 없다
  끝순:
    name: 끝순
    age: 16
    assetIds:
      - 끝순
    speakerNames: [부엌 쪽 목소리]
    role: 만석의 딸
    desire: 덕이네가 닷 되라도 받아 가고, 아버지가 마포에서 깨 붙은 엿을 사 들고 돌아오는 것
    fear: 대문 밖 사람들이 아버지를 그런 사람이라고 부르는 것
    contradiction: 대문 밖에서는 "우리 아버지 그런 사람 아니에요" 하고, 안에 들어와서는 "우리 것도 백마흔이잖아요" 하고 따진다. 살림이 기운 길에서는 조르던 아이가 방세를 세는 사람이 된다
    dailyLife: 깨엿, 포구에 내린 말 구경, 덕이가 주고 간 조개 한 줌, 아버지 밥상
    voice: 길고 빠르다. 아버지에게 존대, 봉구에게 오라버니. 본 것을 신나게 늘어놓다가 따질 때는 아버지가 아는 수량으로 짧게 친다. 물러설 때는 밥 얘기를 한다
  봉구:
    name: 봉구
    age: 성인
    assetIds:
      - 봉구
    speakerNames: [사내]
    role: 객주 서기
    desire: 치부책의 수가 맞고 객주 문이 열려 있는 것. 삼백 섬을 섬에 열닷 냥에 넘기자는 쪽이라 딸 곁에 남으려는 만석과 부딪친다
    fear: 주인 대신 수결했다가 살림을 잃는 것
    contradiction: 시키는 대로 하면서도 "어젯밤에도 세셨잖습니까"는 한다. 열여섯 해 뒤에도 주인의 "…엿"은 못 알아듣는다
    dailyLife: 치부책, 되, 약값과 심부름
    voice: 수량 먼저, 그다음 허락을 기다린다. 주인어른께 보고 존대. 끝순에게는 오래 본 오라버니의 핀잔
  순임:
    name: 김순임
    age: 29세→44세
    assetIds:
      - 순임
    speakerNames: []
    role: 피란민 상인, 영호의 어머니
    desire: 3열 17번을 지키고, 부두에서 기다리는 살림을 접어 영호와 어머이를 데리고 서울로 간다. 부두를 안 뜨려는 시어머니, 같은 자리를 기다린 복례와 부딪친다
    fear: 기다리다가 가진 것까지 없어지는 것
    contradiction: 날짜·금액·이름 석 자를 따지는 사람이 기호 앞에서는 세어 보라는 말도 못 한다. 영호 손은 끝까지 안 놓는데, 그 손 때문에 복례네 아이들 쪽으로는 못 간다. 미안하다는 말은 끝내 안 한다
    dailyLife: 곗돈, 좌판, 흥남에서 들고 와 이태째 안 푼 보따리
    voice: 장사할 때는 금액과 날짜를 또박또박. 마음을 말할 때는 한 줄로 줄어든다. 시어머니에게 어머이, 영호에게 "손 놓지 마" 같은 짧은 반말
  기호:
    name: 최기호
    age: 성인
    assetIds:
      - 기호
    speakerNames: []
    role: 통역을 자처하는 장사 상대
    desire: 순임의 곗돈 삼백오십만 원. 영수증을 받겠다는 순임과 부딪친다
    fear: 도강증이 언제 나오는지, 점방이 명동 어디인지 끝까지 물어보는 것
    contradiction: 정확한 말끝이 정직함처럼 들리게 한다
    dailyLife: 물건 이름을 크게 부르고 영호에게 초콜릿을 준다
    voice: 순임에게 하오체 섞인 존대, 아이에게 반말. 질문을 좋은 조건으로 돌린다
  복례:
    name: 박복례
    age: 41
    assetIds:
      - 복례
    speakerNames: []
    role: 좌판을 기다리던 상인
    desire: 아이 둘을 먹일 천막 칠 자리. 순임이 먼저 낸 3열 17번이 그 자리였다
    fear: 자리를 잃고 사정하는 꼴까지 보이는 것
    contradiction: 제 입으로 "먼저 낸 사람이 임자지" 하고 규칙을 말해 주고 천막 못 치는 길목으로 간다. 돌아보지 않는다
    dailyLife: 자기 짐은 자기가 옮긴다
    voice: 순임에게 하오체와 익숙한 반말. 감정을 해설하지 않는다
  시어머니:
    name: 영호의 할머니
    age: 노년
    assetIds:
      - 시어머니
    speakerNames: []
    role: 부두에서 아들을 기다리는 사람
    desire: 흥남에서 약속한 부산 부두에 서 있는다. 봄에 다 같이 서울로 가자는 순임과 부딪친다
    fear: 자리를 뜬 사이 아들이 와서 못 찾는 것
    contradiction: 며느리 말은 못 들은 척하면서 가락지를 빼 주고 영호 목도리를 챙긴다. 끝까지 안 간다
    dailyLife: 고무신, 목도리, 남겨 주는 가락지
