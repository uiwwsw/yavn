schemaVersion: 1
gameId: '360'
authorOnlyFacts:
  - 끝순·영호·수경·다온의 표식은 같은 아이의 다른 얼굴이다. 각 삶의 인물은 그 사실을 모른다.
characters:
  만석:
    name: 장만석
    age: 40
    assetIds:
      - 만석
    speakerNames: []
    role: 제물포 객주 주인
    desire: 맡은 쌀과 딸의 살림을 지킨다
    fear: 열었다가 남의 쌀까지 잃고 무너지는 것
    contradiction: 딸을 위해 쥔다면서 딸이 바라는 일에는 귀를 닫는다
    dailyLife: 열쇠를 차고 자고 같은 수량을 다시 센다
    voice: 봉구에게 짧은 지시, 딸에게 반말. 돈과 수량으로 말문을 연다
  끝순:
    name: 끝순
    age: 16
    assetIds:
      - 끝순
    speakerNames: []
    role: 만석의 딸
    desire: 아버지와 웃으며 살고 대문 밖 사람도 돕고 싶다
    fear: 아버지가 모두에게 미움받는 것
    contradiction: 아버지를 변호하지만 아버지의 셈을 반박한다
    dailyLife: 깨엿과 말 구경, 덕이가 준 조개
    voice: 아버지에게 존대, 봉구에게 오라버니. 어린 농담과 구체적인 생활 반박
  봉구:
    name: 봉구
    age: 성인
    assetIds:
      - 봉구
    speakerNames: []
    role: 객주 서기
    desire: 객주와 식구의 살림을 유지한다
    fear: 주인의 결정을 대신했다가 살림을 잃는 것
    contradiction: 주인에게 복종하지만 쌀과 약값의 한계는 말한다
    dailyLife: 치부책, 되, 약값과 심부름
    voice: 주인어른, 보고 존대. 끝순에게는 오래 본 오라버니의 반말
  순임:
    name: 김순임
    age: 29세→44세
    assetIds:
      - 순임
    speakerNames: []
    role: 피란민 상인, 영호의 어머니
    desire: 좌판을 지키고 식구와 새 살림을 시작한다
    fear: 기다리다 가진 것까지 사라지는 것
    contradiction: 셈은 빠르지만 사람을 좋아하는 마음에는 허술하다
    dailyLife: 곗돈, 좌판, 풀지 않은 보따리
    voice: 상인에게 거래 존대. 시어머니에게 어머이, 영호에게 생활 반말
  기호:
    name: 최기호
    age: 성인
    assetIds:
      - 기호
    speakerNames: []
    role: 통역을 자처하는 장사 상대
    desire: 순임의 돈과 신뢰를 얻는다
    fear: 세부 조건을 확인받는 것
    contradiction: 정확한 말끝이 정직함처럼 들리게 한다
    dailyLife: 물건 이름을 크게 부르고 영호에게 초콜릿을 준다
    voice: 순임에게 하오체 섞인 존대, 아이에게 반말. 질문을 좋은 조건으로 돌린다
  복례:
    name: 박복례
    age: 41
    assetIds:
      - 복례
    speakerNames: []
    role: 좌판을 기다리던 상인
    desire: 아이 둘을 먹이고 장사할 자리
    fear: 자리도 체면도 잃는 것
    contradiction: 양보했다고 말하지 않지만 빈손으로 물러선다
    dailyLife: 자기 짐은 자기가 옮긴다
    voice: 순임에게 하오체와 익숙한 반말. 감정을 해설하지 않는다
  시어머니:
    name: 영호의 할머니
    age: 노년
    assetIds:
      - 시어머니
    speakerNames: []
    role: 부두에서 아들을 기다리는 사람
    desire: 아들이 자기를 찾을 자리에 남는다
    fear: 자리를 떠나 아들과 영영 어긋나는 것
    contradiction: 며느리와 손자를 아끼면서도 함께 가지 못한다
    dailyLife: 고무신, 목도리, 남겨 주는 가락지
    voice: 며느리에게 고향 말과 짧은 반말. 설득을 못 들은 척해도 손자 물건을 챙긴다
  영호:
    name: 영호
    age: 7세→22세
    assetIds:
      - 영호
      - 청년영호
    speakerNames: []
    role: 순임의 아들
    desire: 어릴 때는 초콜릿과 엄마의 관심, 자라서는 어머니를 쉬게 하는 일
    fear: 엄마가 혼자 모든 일을 떠맡는 것
    contradiction: 어릴 때 돌아보지 않던 아이가 자라서 돌아가 찾는 편지를 쓴다
    dailyLife: 막 배운 글자, 약, 부산에 보내는 편지
    voice: 어린 시절 엄마에게 짧은 반말과 들은 말. 청년 때는 존대와 맡을 일
  민재:
    name: 민재
    age: 17
    assetIds:
      - 민재
    speakerNames: []
    role: 장기 입원한 고등학생
    desire: 혼자 해낼 수 있는 사람으로 대접받고 싶다
    fear: 엄마의 가게와 일상이 자신 때문에 사라지는 것
    contradiction: 어른인 척하다 가장 무서울 때 어린 반말이 나온다
    dailyLife: 차트 숫자, 떡볶이, 생선 가시
    voice: 처음 본 환자에게 존대. 수경의 나이를 안 뒤 누나. 엄마에게 평소 존대
  수경:
    name: 수경
    age: 21
    assetIds:
      - 수경
    speakerNames: []
    role: 옆 침대 환자, 휴학한 미대생
    desire: 퇴원해 다리를 걸어서 건넌다
    fear: 계획이 병실 안에서 끝나는 것
    contradiction: 요령을 아는 척하지만 자기 퇴원도 장담할 수 없다
    dailyLife: 약봉지에 그림, 창밖 산책, 불꽃 구경
    voice: 처음에는 존대, 나이를 안 뒤 동생에게 반말. 큰 꿈보다 갈 수 있는 장소를 말한다
  민재엄마:
    name: 민재 어머니
    age: 성인
    assetIds:
      - 엄마
    speakerNames: []
    role: 생선 가게를 하는 어머니
    desire: 아들에게 먹이고 치료를 이어 간다
    fear: 돈 때문에 아들을 포기해야 하는 것
    contradiction: 상태를 이미 들었어도 밥부터 주며 괜찮은 척한다
    dailyLife: 새벽 경매, 가시 발라 낸 도시락, 가게 보증금
    voice: 아들에게 반말, 의사에게 존대. 금액과 시간을 묻고 네를 반복한다
  의사:
    name: 담당 의사
    age: 성인
    assetIds:
      - 의사
    speakerNames: []
    role: 치료 선택과 한계를 설명하는 사람
    desire: 치료의 불확실성과 비용 절차를 전한다
    fear: 결과를 보장하는 것
    contradiction: 설명은 분명해도 가족의 결정을 대신하지 못한다
    dailyLife: 동의서와 검사 결과를 짚는다
    voice: 어머님, 존대. 돈과 예후 질문에 아는 범위를 먼저 답한다
  지안:
    name: 서지안
    age: 34세→79세
    assetIds:
      - 지안
    speakerNames: []
    role: 녹취 작가
    desire: 들은 말을 정확히 남기고 자기 일로 살고 싶다
    fear: 자기가 답해야 할 관계에 붙잡히는 것
    contradiction: 남의 머뭇거림은 찾지만 엄마의 답장은 미룬다
    dailyLife: 타임코드, 접힌 종이, 쓰다 지운 문자
    voice: 성인 제보자에게 존대, 아이에게 짧고 쉬운 말. 자기 일은 다음으로 미룬다
  지안엄마:
    name: 지안 어머니
    age: 성인→노년
    assetIds:
      - 지안어머니
    speakerNames: []
    role: 딸의 방문을 기다리는 어머니
    desire: 함께 밥을 먹고 방송을 본다
    fear: 딸에게 오라는 말을 부담으로 만드는 것
    contradiction: 기다리면서도 먼저 수화기를 내린다
    dailyLife: 김치통과 빈 통, 딸의 끼니
    voice: 지안아, 반말. 짧은 문자와 다음에 함께 할 일
  차피디:
    name: 차윤희
    age: 성인
    assetIds:
      - 차피디
    speakerNames: []
    role: 제작 책임자
    desire: 프로그램과 계약을 성사시킨다
    fear: 일정과 판권을 잃는 것
    contradiction: 지안의 솜씨를 알지만 목소리의 주인보다 방송의 결과를 먼저 본다
    dailyLife: 제목, 타임코드, 계약서의 서명 칸
    voice: 지안 씨와 업무 존대. 불편한 질문에는 조건과 권한을 답한다
  문호:
    name: 오문호
    age: 68
    assetIds:
      - 문호
    speakerNames: []
    role: 기억을 제보한 은퇴 사업가
    desire: 자기가 기억하는 일을 믿어 주길 바란다
    fear: 듣는 사람이 자기를 틀렸다고 하는 것
    contradiction: 자기 기억의 생생함을 남의 삶을 아는 권한으로 넓힌다
    dailyLife: 운산 지도, 아들의 공부와 연락 끊긴 해를 센다
    voice: 아가씨, 하오체. 반박받으면 자기가 확실히 기억하는 얘기로 돌아간다
  다온:
    name: 박다온
    age: 8세→53세
    assetIds:
      - 다온
      - 어른다온
    speakerNames: []
    role: 기억을 말하는 아이, 훗날 지안의 방문자
    desire: 본 것을 말하고 아는 사람을 알아본다
    fear: 어른이 자기 말의 뜻을 먼저 정하는 것
    contradiction: 아이일 때 거침없는 말이 어른이 되어서는 기다려 주는 말로 바뀐다
    dailyLife: 색연필, 책과 사인, 매달 방문 약속
    voice: 여덟 살에는 아줌마와 반말. 어른이 된 뒤에는 선생님과 존대
  다온엄마:
    name: 다온 어머니
    age: 성인
    assetIds:
      - 다온엄마
    speakerNames: []
    role: 인터뷰에 동의한 보호자
    desire: 아이를 보호하며 대화를 돕는다
    fear: 아이가 이상한 아이로 취급되는 것
    contradiction: 아이 말을 가볍게 넘기면서도 기록을 남길 허락은 준다
    dailyLife: 커피를 권하고 아이 옆을 비켜 준다
    voice: 지안에게 선생님과 존대, 다온에게 반말
  겨울보호자:
    name: 겨울의 보호자
    age: 성인
    assetIds: []
    speakerNames: []
    role: 1809년의 보호자
    desire: 곡식을 얻어 아이를 먹인다
    fear: 같이 얼음 위에 올랐다가 아이까지 빠지는 것
    contradiction: 남아도 떠나도 아이를 잃을까 두렵다
    dailyLife: 좁쌀, 재, 이불, 강 건너 마을
    voice: 기억의 내레이션. 아이가 할 수 없는 말을 대신 만들지 않는다
  겨울아이:
    name: 겨울의 아이
    age: 어린아이
    assetIds: []
    speakerNames: []
    role: 보호자가 두고 나간 아이
    desire: 먹고 따뜻한 곁에 있고 싶다
    fear: 홀로 남는 것
    contradiction: 울음이 멎은 것을 어른이 괜찮음으로 오해한다
    dailyLife: 이불과 아궁이 옆
    voice: 대사를 새로 지어 깨달음을 말하지 않는다
relationships:
  - id: granary_family
    participants:
      - 만석
      - 끝순
    history: 한집의 부녀
    perspectives:
      만석:
        seesOtherAs: 혼수와 밥을 챙길 딸
        address: 반말, 수량과 명령
      끝순:
        seesOtherAs: 도와 달라고 설득할 아버지
        address: 아버지, 존대와 생활 농담
    friction: 딸을 위한다는 셈과 딸의 실제 바람이 다르다
  - id: granary_work
    participants:
      - 만석
      - 봉구
    history: 객주와 살림을 오래 맡긴다
    perspectives:
      만석:
        seesOtherAs: 믿고 지시할 서기
        address: 봉구야, 지시
      봉구:
        seesOtherAs: 주인의 선택에 제한을 말할 사람
        address: 주인어른, 보고 존대
    friction: 봉구의 수결은 주인의 수결과 같은 권한이 아니다
  - id: granary_home
    participants:
      - 봉구
      - 끝순
    history: 한집에서 지낸 오라버니 같은 사이
    perspectives:
      봉구:
        seesOtherAs: 현실적인 한계를 알려 줄 아이
        address: 오래 본 아이에게 반말
      끝순:
        seesOtherAs: 쌀과 약을 구할 오라버니
        address: 오라버니, 존대
    friction: 핀잔을 해도 부탁의 뜻을 숫자 말장난으로 흘리지 않는다
  - id: stall_hope
    participants:
      - 순임
      - 기호
    history: 물건을 대며 왕래한 장사 상대
    perspectives:
      순임:
        seesOtherAs: 함께 새 살림도 할 수 있을 사람
        address: 최 통역, 존대
      기호:
        seesOtherAs: 거래와 호감을 함께 내미는 사람
        address: 아주머니, 또렷한 하오체
    friction: 좋아한다는 말이 거래 조건의 확인을 대신하게 된다
  - id: stall_place
    participants:
      - 순임
      - 복례
    history: 같은 좌판을 기다린 사람들
    perspectives:
      순임:
        seesOtherAs: 미안하지만 자리를 내줄 수 없는 이웃
        address: 아주머니, 존대
      복례:
        seesOtherAs: 먼저 돈을 낸 이웃
        address: 순임이, 하오체와 반말
    friction: 자리 규칙이 관계의 미안함을 없애 주지는 않는다
  - id: harbor_wait
    participants:
      - 순임
      - 시어머니
    history: 함께 피란 온 며느리와 시어머니
    perspectives:
      순임:
        seesOtherAs: 함께 아들을 키울 어른
        address: 어머이, 존대
      시어머니:
        seesOtherAs: 기다리는 아들을 대신해 손자를 키우는 식구
        address: 짧은 반말과 고향 어미
    friction: 떠나자는 부탁이 아들을 버리라는 말로 들린다
  - id: refugee_family
    participants:
      - 순임
      - 영호
    history: 피란의 좌판에서 공장의 셋방까지
    perspectives:
      순임:
        seesOtherAs: 먹이고 학교 보낼 아들
        address: 어린 아들에게 반말
      영호:
        seesOtherAs: 언제나 일하는 엄마
        address: 어릴 때 반말, 청년 때 존대
    friction: 아이가 전달할 수 있는 정보와 성인의 약속을 구분한다
  - id: ward_friends
    participants:
      - 민재
      - 수경
    history: 낯선 옆 침대 환자→누나와 동생
    perspectives:
      민재:
        seesOtherAs: 병동을 아는 누나
        address: 처음 존대→누나와 존대
      수경:
        seesOtherAs: 함께 밖을 볼 수 있는 동생
        address: 처음 존대→나이 확인 후 반말
    friction: 환자인 상대를 멘토나 미래를 보장하는 안내자로 쓰지 않는다
  - id: ward_family
    participants:
      - 민재
      - 민재엄마
    history: 돌봄을 받으며 동시에 엄마 가게를 걱정한다
    perspectives:
      민재:
        seesOtherAs: 돈과 시간을 잃는 엄마
        address: 평소 존대, 고백 때 어린 반말
      민재엄마:
        seesOtherAs: 겁날 텐데 괜찮다고 하는 아들
        address: 민재야, 반말
    friction: 엄마는 상태를 알아도 밥부터 주며 입을 열기를 기다린다
  - id: treatment
    participants:
      - 민재엄마
      - 의사
    history: 진료 설명을 듣는 보호자
    perspectives:
      민재엄마:
        seesOtherAs: 비용과 가능성을 물을 전문가
        address: 선생님, 존대
      의사:
        seesOtherAs: 한계를 설명해야 할 가족
        address: 어머님, 존대
    friction: 돈의 요청에 성공률만 되풀이하지 않는다
  - id: production
    participants:
      - 지안
      - 차피디
    history: 제작을 함께 하지만 계약 권한이 다르다
    perspectives:
      지안:
        seesOtherAs: 작업을 평가하고 고용을 결정할 사람
        address: 피디님, 업무 존대
      차피디:
        seesOtherAs: 녹취를 잘 다루는 작가
        address: 지안 씨, 업무 존대
    friction: 정규직 제안과 원본 양도는 별개 동의라는 갈등이 있다
  - id: testimony
    participants:
      - 지안
      - 문호
    history: 기억을 받는 작가와 제보자
    perspectives:
      지안:
        seesOtherAs: 자기 기억을 생생히 말하는 사람
        address: 선생님, 존대
      문호:
        seesOtherAs: 자기를 믿어 줬으면 하는 청자
        address: 아가씨, 하오체
    friction: 자기 기억을 존중하는 것과 남의 삶에 대한 단정을 믿는 것은 다르다
  - id: child_witness
    participants:
      - 지안
      - 다온
    history: 녹음했던 아이→수십 년 뒤의 방문자
    perspectives:
      지안:
        seesOtherAs: 말을 기다려야 할 어린 제보자
        address: 아이에게 쉬운 반말
      다온:
        seesOtherAs: 어디서 본 것 같은 어른
        address: 아이 때 아줌마, 어른 때 선생님
    friction: 아이의 대답에 어른의 철학을 덧씌우지 않는다
  - id: adult_daughter
    participants:
      - 지안
      - 지안엄마
    history: 김치통과 미룬 방문으로 이어진 모녀
    perspectives:
      지안:
        seesOtherAs: 꼭 다음에 가겠다고 하는 엄마
        address: 엄마, 생활 존대
      지안엄마:
        seesOtherAs: 바쁘다는 말을 먼저 들어 주는 딸
        address: 지안아, 반말
    friction: 답을 못 하는 금기와 자기가 미루는 행동은 장면에서 구분한다
  - id: child_guardian
    participants:
      - 다온
      - 다온엄마
    history: 처음부터 같이 사는 모녀
    perspectives:
      다온:
        seesOtherAs: 자기 말을 먼저 정리하는 엄마
        address: 반말
      다온엄마:
        seesOtherAs: 아이가 낯선 사람에게 보일 인상이 걱정된다
        address: 인사를 권하는 반말
    friction: 본 말을 취소시키지 않고 녹취 사용에는 보호자 동의를 구한다
  - id: first_winter
    participants:
      - 겨울보호자
      - 겨울아이
    history: 함께 지낸 한겨울
    perspectives:
      겨울보호자:
        seesOtherAs: 살리려고 두고 떠난 아이
        address: 내레이션
      겨울아이:
        seesOtherAs: 이불을 덮어 준 곁
        address: 대사 없음
    friction: 다섯 삶의 진실은 이 겨울을 보기 전까지 당사자가 모른다
scenes:
  0/yard:
    participants:
      - 만석
      - 끝순
      - 봉구
    relations:
      - granary_family
      - granary_work
      - granary_home
    before: 셋은 이미 한집 사람이다. 대문 밖 사정은 봉구와 끝순이 더 가까이 본다
    exchange: 밥과 기침→구경과 엿→쌀 수량
    avoid: 초면의 설명처럼 가족 관계와 직업을 서로 읊지 않는다
    gesture: 딸은 엿을 조르며 아버지가 셈을 멈추길 기다린다
  1/stall:
    participants:
      - 순임
      - 기호
      - 영호
    relations:
      - stall_hope
      - refugee_family
    before: 기호는 왕래하며 아이가 초콜릿을 좋아함을 안다
    exchange: 물건을 놓을 자리→초콜릿 농담→점방 제안
    avoid: 첫 만남부터 연애를 고백한 것으로 쓰지 않는다
    gesture: 물건을 건네며 아이와 친해진 호감을 어머니에게 돌린다
  1/seoul:
    participants:
      - 순임
      - 영호
    relations:
      - refugee_family
      - harbor_wait
    before: 열네 해가 흘렀다. 영호는 편지와 약을 맡는 청년이다
    exchange: 휴강과 약→답장→사진을 돌려받을 수 있는지 질문
    avoid: 일곱 살 말투나 엄마가 듣고 싶은 확답만 주지 않는다
    gesture: 회신 종이를 다 펴 어머니가 읽게 한다
    referenced:
      - 시어머니
  2/opening_day:
    participants:
      - 민재
      - 수경
    relations:
      - ward_friends
    before: 서로 이름과 나이를 모르는 첫 대화
    exchange: TV 소리 부탁→학생인지 확인→나이와 이름→입원 생활
    avoid: 누나라고 부르기 전에 알게 되는 단계를 보인다
    gesture: TV 음량을 줄이고 링거 줄에서 힘을 뺀다
  3/daon:
    participants:
      - 지안
      - 다온
      - 다온엄마
    relations:
      - child_witness
      - child_guardian
    before: 지안과 다온은 녹음 때 만났다. 지안은 자기 전생을 모른다
    exchange: 낯익다는 아이 말→엄마의 완화→엄마가 자리를 비운 뒤 다른 답
    avoid: 전생의 의미를 지안이 이미 아는 것처럼 답하지 않는다
    gesture: 색연필은 손에 둔 채 낯선 얼굴을 오래 본다
  3/contract:
    participants:
      - 지안
      - 차피디
    relations:
      - production
    before: 작업을 함께해 왔다. 이번 계약에서 원본 양도 조건을 처음 확인한다
    exchange: 원본 질문→판권 사유→고용 조건이 묶였는지 답한다
    avoid: 제작 관행을 합의나 당사자 동의와 같은 뜻으로 말하지 않는다
    gesture: 서명 칸을 손가락으로 짚어 압박을 드러낸다
    branches:
      - when:
          var: last_taken
          op: eq
          value: live
        fact: 이전 삶을 기억하지 못한 채 자리를 떠나는 동작이 막힌다.
      - when:
          var: last_taken
          op: eq
          value: dare
        fact: 이전 삶을 기억하지 못한 채 앉아 있는 동작이 막힌다.
  3/glass:
    participants:
      - 지안
      - 지안엄마
    relations:
      - adult_daughter
    before: 시간 제한이 있는 면회. 어머니는 딸이 바쁘다는 것을 안다
    exchange: 밥→방송 날짜→지안이 미룬 말
    avoid: 엄마가 혼자 외로움의 원인을 심리 분석해 설명하지 않는다
    gesture: 먼저 수화기를 내려놓는 쪽과 남은 숫자를 보여 준다
  3/munho_home:
    participants:
      - 지안
      - 문호
    relations:
      - testimony
    before: 지안은 문호의 갱 붕괴 녹취를 여러 번 들었고 자기에게 한 전생 해석은 의심한다
    exchange: 아들과 연락이 끊긴 사정→녹취 동의→지안의 전생 주장→근거 질문
    avoid: 자기 기억이 생생하다는 사실이 남의 전생을 아는 능력의 증거는 아니다
    gesture: 문호는 몸을 기울이고 지안은 거실 액자를 본다
