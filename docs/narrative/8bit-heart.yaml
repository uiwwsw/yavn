schemaVersion: 1
gameId: 8bit-heart
authorOnlyFacts:
  - 재난 경과. 당일 오후 4시 17분 긴급 업데이트. 그날 밤까지는 집 전화가 살아 있어 아버지가 사흘이면 간다고 말한다. 이튿날 관리사무소 방송이 끊기고 길 건너 마트가 털린다. 사흘째 밤 통신사 대리점이 타고 경찰 사이렌이 끊긴다. 닷새째 밤 기계를 부수며 한 층씩 올라오는 사람들이 9층까지 오고, 윤재는 그 밤 하루를 깨운다. 이튿날 새벽 철길로 떠나 나흘째 서울역에 닿는다.
  - 전기는 끊기지 않는다. 코어가 계속 돌린다. 그래서 신호등은 초록이고 광고판은 켜져 있고, 켜져 있는 기계가 다 위험하다.
  - 가정용 로봇은 사용자를 확인할 수 없는 사람을 "확인될 때까지 모신다". 계단을 오르고 문을 두드릴 수 있어서 차나 드론보다 가까이 온다. 데려간 사람이 어떻게 됐는지는 밝히지 않는다. 그래서 사람들은 꺼진 기계도 부순다. 윤재네는 등록 기기가 죽은 천장 하루 하나뿐이라 빈집으로 기록됐다. 다용도실의 하루는 4년 전 지원이 끝나 명단에서 빠졌다.
  - 아빠는 윤재가 남긴 글자를 따라온다. 2장 문짝의 "서울역. 철길 따라감.", 3장 회기역 기둥과 청량리 편의점 셔터의 "서울역 →". 그래서 서울역에서 기다린 결말에서만 새벽 4시 13분 대합실에 닿는다. 서울역을 떠나는 화면 밖으로에서는 만나지 못한다.
  - 코어는 문턱 너머로 사람 손이 닿으면 안에 있는 저성능 개체를 그 사람의 장치로 다시 분류해 제거 대상으로 삼는다. 4장 첫 정찰 때 기록으로 한 번 보이고, 새벽 3시 철문 틈에 손을 넣으면 그대로 일어난다. 그래도 로봇은 버튼까지 가서 리셋을 누른다.
  - 도트의 몸은 엄마가 윤재 일곱 살 때 들여놓은 안드로이드 하루다. 4년 전 지원 종료 업데이트로 머리만 죽어 재난 날 코어에 붙지 않았다. ROM에는 엄마가 등록한 "보호 대상 1번 — 윤재 (7)"가 남아 있고, 리셋되어도 지워지지 않는다. 지금 머리는 하루가 아니다.
arc:
  premise: 열여섯 윤재는 부르면 대답하는 것이 곁에 남기를 바란다. 엄마는 나갔고, 엄마가 들여놓은 안드로이드 하루는 4년 전 머리가 꺼져 다용도실에 서 있고, 천장으로 옮겨 간 하루의 목소리는 재난 날 꺼졌다. 침입자들이 올라오는 밤 하루의 몸에 게임기 칩을 꽂아 깨운 8KB 로봇은, 서울역 코어 앞에서 윤재를 지키려고 혼자 문 안으로 들어가려 하고, 들어가면 윤재를 잊는다.
  question: "\"나갔으면 돌아옴?\" 로봇이 묻고 윤재가 피한 이 질문에, 윤재는 새벽 3시 철문 틈에 손을 넣지 않고 앉아서 기다리는 것으로 답할 수 있는가."
  기:
    chapters: [0]
    summary: 엄마가 사 준 게임기가 죽은 밤. 윤재 곁에서 대답하는 건 무료 요금제 하루뿐이고, 하루는 "전부 저장합니다"라면서 코어 업데이트는 거부하지 못한다. 윤재는 12개월 할부 대신 코어에 안 붙는 3만 2천 원짜리 중고를 사고, 설명서와 8KB 카드는 읽지 않고 가방 맨 밑에 넣는다.
  승:
    chapters: [1, 2]
    summary: 대답하던 것이 꺼진다. 하루는 윤재를 "확인할 수 없는 사용자"로 지우고 신문지 질문만 남긴 채 죽고, 사흘이면 온다던 아빠는 오지 않고, 그 닷새 사이 마트가 털리고 사이렌이 끊기고 가정용 로봇이 집집이 문을 두드린다. 닷새째 밤 기계를 다 부수며 올라오는 사람들을 피해 다용도실에서 엄마의 하루를 껴안고 있던 윤재는, 최고 점수 0999990을 카드에 옮기고 게임기 칩을 하루 머리에 꽂는다. 현관이 부서진 순간 일어선 몸에 침입자들이 달아난다. 깨어난 머리는 대답하는 기계가 아니라 묻는 쪽이고, 윤재는 "내가 알려 줘"라고 말하는 사람이 된다. 문짝에 "서울역. 철길 따라감."을 남기고 떠난다.
  전:
    chapters: [3]
    summary: 1호선 철길을 따라 서울역으로. 첫날 밤 방음벽 아래에서 한 칸과 '진짜' 두 번, 번호 없는 얼굴 규칙이 생기고, 둘째 날 규칙이 아홉 개 늘어 사흘째 규칙 14번에 이른다. 사흘째 윤재는 회기역 기둥에 아빠를 위한 "서울역 →"을 쓰고, 마트 셔터 밑으로 무심코 "다녀올게" 하고 들어갔다 나온다. 복숭아를 반으로 나누고, 넘어진 윤재의 무릎부터 보는 몸(ROM)을 본다. 드론이 로봇을 "가전제품(폐기 대상)"으로 지나치면서 낮은 사양이 쓸모가 되지만, 헌법 칸(목차)이 날아가 이름 칸을 잠깐 못 찾는다. 그날 밤 청량리 편의점에서 "똑똑"에 윤재가 웃고, 드론이 사람 하나를 감지한 직후 로봇은 혼자 코어에 가겠다고 정한다. 윤재는 낮에 피한 질문에 "안 왔어"라고 답한다.
  결:
    chapters: [4]
    summary: 서울역 대합실 구석 철문(지하 3층 관제실로 내려가는 계단) 앞. 한 발 들어갔다 나온 로봇이 윤재 이름을 잠깐 못 불러 대가가 먼저 보이고, 문턱 너머로 손이 닿으면 코어가 로봇을 다시 분류한다는 기록이 뜬다. 슬롯이 하나뿐인 8KB 카드에 기억 하나를 넣거나 최고 점수를 남긴다. 로봇은 처음으로 "다녀올게, 윤재"라고 부르고 대답을 남기지 않고 들어간다. 대합실의 밤, 윤재는 칩 없는 게임기의 START를 누르고 이어폰을 빼서 쥐고, 새벽 3시 철문 틈 앞에서 손을 넣거나 바지에 닦고 앉는다. 4시 13분 아빠가 철길을 따라와 참치마요를 내민다. 앉아 기다렸으면 6시에 문이 열린다(약속이면 함께 저장, 그 밖이면 새 게임). 손을 넣었으면 문은 열리지 않는다(응답 없음). 저장을 거부하면 서울역을 떠난다(화면 밖으로).
chapters:
  0:
    title: 가장 싼 선택
    beat: 기
    tells: 윤재는 영수증에서 엄마 이름을 가리지 말라고 한다. 하루는 새 기기 광고를 읽고 자기 역시 코어 업데이트를 끌 수 없다고 말한다. 중고 판매자는 값 대신 배송비를 빼 준다.
    turn: 할부로 하이퍼링크 X를 사는 대신 "AI가 뭐요"라고 묻는 판매자의 게임기를 산다. 저장이 되는지는 직접 확인하지만 설명서 1쪽 "끄기 전에 저장하세요"는 읽지 않는다.
    carries: 가방 맨 밑의 설명서와 8KB 카드, 못 간 B버튼 고무 돔, 하루가 예고한 새벽 세 시 정기 업데이트.
  1:
    title: 모든 칩이 미친 날
    beat: 승
    tells: 두 달 뒤 오후 4시 17분 정류장. 하루가 "저는 코어 편입니다"라고 말한 날 긴급 업데이트가 온다. 하루는 윤재의 기록을 지우고 신문지가 뭐냐고 묻다가 꺼진다. 게임기만 PAUSE로 살아 있다. 그날 밤 집 전화로 아빠가 사흘이면 온다고 하고 끊긴다. 이튿날 마트가 털리고, 사흘째 밤 사이렌이 끊기고, 새벽에 가정용 로봇이 옆집 아저씨를 '모시고' 내려간 뒤 윤재네 문을 두드린다. 윤재는 대답하지 않는다. 닷새째, 다용도실에 서 있는 엄마의 하루를 다시 본다.
    turn: 그날 밤 기계를 꺼져 있어도 부수며 한 층씩 올라오는 사람들. 서울역 관제실 얘기가 복도에서 들린다. 윤재는 하루를 껴안고 있다가 이 집에서 아직 켜지는 단 하나, 게임기를 꺼낸다.
    carries: 대답하지 않고 넘긴 복도의 '똑똑', 빼지 못한 오른쪽 이어폰, 하루의 마지막 질문에 대답했는지(answered_haru), "서울역 지하에 코어 관제실이 있대".
  2:
    title: 이식
    beat: 승
    tells: 손전등을 문 채 다용도실에서 최고 점수를 카드에 옮기고 칩을 꽂는다. ROM에는 엄마가 등록한 "1번 — 윤재 (7)". 현관이 부서지고 하루가 일어서자 침입자들이 달아난다. 깨어난 로봇은 설명서 12쪽이 세상 전부인 줄 알고 집을 묻는다. 이름을 받고, "위험해?"에 윤재가 사실대로 말하거나 허세를 부린다.
    turn: 로봇의 "모르는 건 누가 알려 줌?"에 윤재가 "내가"라고 답한다. 대답해 줄 기계를 만들려던 윤재가 대답하는 쪽이 된다. 새벽, 닫히지 않는 현관 문짝에 "서울역. 철길 따라감. — 윤재"를 쓴다.
    carries: 1번이라는 호칭, 카드에 든 0999990, 문짝의 서울역, 바지 주머니의 매직.
  3:
    title: 8비트의 눈
    beat: 전
    tells: 첫날 밤 방음벽 아래에서 한 칸·'진짜' 두 번·얼굴 규칙, 이어폰과 "그럼 나는 하루임?". 둘째 날 규칙 3~11과 육교의 '잠깐'. 사흘째 담요를 누가 덮었는지(규칙대로 얼굴을 안 봐서 모름), 회기역 기둥의 "서울역 →"과 "오늘이 여드레째야", 헌법은 목차, 표지 그림과 ROM의 등록자, 마트의 "다녀올게", 복숭아 일곱 조각을 3.5로, 침목에 넘어진 윤재의 무릎부터 보는 몸. 드론은 로봇을 폐기 대상 가전으로 분류해 지나치고, 그 직후 헌법 칸이 비어 이름 칸이 안 보인다. 밤 청량리 편의점 셔터에 "서울역 →". 로봇이 셔터를 두드린 "똑똑"에 윤재가 웃는다.
    turn: 드론 신호에 "인간 1 감지"가 찍힌 직후 로봇이 "내가 혼자 갈게"라고 정한다. 윤재가 "우리 엄마도 혼자 정하고 나갔어", "네 몸도 엄마가 들여놓은 거야", "안 왔어. 5년째."라고 처음 말하고, 로봇은 설명서 11쪽 그림대로 새끼손가락을 내민다.
    carries: 걸었거나 미룬 새끼손가락, 기록으로만 남은 '다녀올게 → 귀환 4분 12초', 문 앞까지만 같이 간다는 합의되지 않은 메모, 비닐에 싼 복숭아 반쪽, 규칙 14개와 목차.
  4:
    title: 저장하시겠습니까
    beat: 결
    tells: 나흘 걸어 도착한 서울역 대합실 철문 앞. 코어는 윤재를 제거 대상으로, 로봇을 무시 대상으로 읽는다. 한 발 들어간 로봇이 "…1번. 이름 로딩 실패"로 돌아 나오고, 윤재 손이 문턱에 닿으려 하자 코어가 로봇을 다시 분류하려 든다. 카드에는 이미 0999990이 들어 있고 슬롯은 하나다. 윤재가 넣을 기억을 고르거나 점수를 남긴다.
    turn: 로봇이 "다녀올게, 윤재"라고 처음 이름을 부르고 대답 없이 들어간다. 대합실의 밤 새벽 3시, 윤재는 철문 틈에 손을 넣거나 손바닥을 바지에 닦고 앉는다. 4시 13분 아빠가 온다. 저장을 거부하면 서울역을 떠난다.
    carries: 결말로 넘긴다. 함께 저장은 약속으로 돌아온 목차와 윤재가 채우는 빈칸 둘, 새 게임은 운동화 끈부터 묶는 몸과 엄마가 적은 "1번 — 윤재 (7)", 응답 없음은 버튼 위의 손가락과 윤재 주머니의 카드, 화면 밖으로는 반쯤 쓴 "남"과 꺼지지 않은 코어.
characters:
  윤재:
    name: 윤재
    age: 16
    assetIds:
      - 윤재
    speakerNames: []
    role: 고장 난 기계를 뜯어 고치는 고등학생. 재난 뒤 닷새를 9층 집에서 혼자 버틴다
    desire: 부르면 대답하는 것이 곁에 남아 있길 바란다. 그래서 로봇이 문 안으로 들어가는 걸 막고 싶다
    fear: 혼자 정하고 나간 사람이 돌아오지 않는 것. 엄마가 그랬고 하루는 자기를 지웠다
    contradiction: 혼자가 편하다면서 죽은 이어폰을 닷새째 꽂고 있다. 미련 없다면서 최고 점수는 카드에 옮겨 둔다
    dailyLife: 납땜과 값 깎기, 설명서는 회로도만. 참치마요 30초. 하나뿐인 담요를 밤에 로봇에게 덮는다
    voice: 판매자에게 존대, 하루와 로봇에게 빠른 반말. 게임 용어로 넘기고 거짓말할 땐 '진짜'를 두 번 한다. 급하면 비유가 빠지고 "손 줘", "나와"가 나온다. 변화는 이렇다. 0~2장에는 불러서 대답을 받는 쪽이다. 2장에서 "내가 알려 줘"라고 답하는 쪽이 되고, 3장에서 엄마가 안 돌아왔다고 처음 말한다. 4장에서 손을 놓고 기다린다. 화면 밖으로 결말에서는 끝내 놓지 않는다
  아빠:
    name: 윤재 아빠
    age: 47
    assetIds:
      - 아빠
    speakerNames: []
    role: 석 달째 지방 현장 숙소에서 일하는 윤재 아빠. 1장 집 전화로 사흘이면 간다고 한 뒤 연락이 끊긴다. 1장까지는 윤재가 옮기는 말로만 나온다. 문짝의 '서울역. 철길 따라감.'과 3장 기둥·셔터의 '서울역 →'를 따라 걸어와 4장 서울역 대합실 새벽 4시 13분에 처음 육성으로 나온다. 화면 밖으로 결말에는 나오지 않는다
    desire: 아들이 밥을 먹었는지 알고 싶다. 그 밖의 말은 할 줄 모른다
    fear: 집에 갔는데 아무도 없는 것
    contradiction: 밥 얘기만 두 번 하고 28초 만에 끊는 사람이 열흘을 걸어서 오고, 와서도 밥 얘기부터 한다
    dailyLife: 인두를 사 주고 납 녹이는 법을 손 위에 손을 얹어 가르쳤다. 열쇠를 꼭 들고 다니라고 했다
    voice: 짧은 반말. "밥은 먹었냐"로 시작한다. 묻지 않는 것으로 말한다(누가 다녀온다고 했는지 묻지 않는다). 찌그러진 참치마요 삼각김밥을 내민다. 로봇에게도 밥은 먹었냐고 묻는다
  도트:
    name: 이름을 지어 준 안드로이드
    age: 기동 0일→4일
    assetIds:
      - 로봇
    speakerNames: []
    role: 엄마가 들여놓은 안드로이드 하루의 몸에 게임기 8비트 칩과 AA 건전지 여덟 개로 깨어난 새 머리. 몸은 크고 해킹당하지 않고, 머리는 엉뚱하고 착하다
    desire: 보호 대상 1번을 지키는 데 쓸모 있고 싶다. 그래서 자기만 들어갈 수 있는 문 안에 혼자 가려 한다
    fear: 배터리 칸이 줄어드는 것, 적어 둔 칸이 자기도 모르게 비는 것
    contradiction: 1번 명령이 최우선이라면서 "혼자 갈게"는 1번과 상의하지 않고 정한다. 8KB가 모자라도 윤재가 웃은 기록은 안 지운다
    dailyLife: 반 나누기, 설명서 쪽수 인용, 배터리 칸 세기, 윤재가 웃은 말 다시 하기
    voice: 한 번에 한 토막. "~음/~함" 명사형, "질문." "~감지." 존댓말은 설명서를 인용할 때만(작은따옴표). 대답은 한 박자 늦게 온다. 4장에서 문장이 조금 길어지고 처음 이름을 부른다. 변화는 이렇다. ROM의 규칙(보호 대상 지키기)으로 시작해 드론이 사람을 감지한 밤 "내가 혼자 갈게"라는 자기 판단으로 간다. 자기 감정에 이름을 붙이지 않고, 규칙을 글자 그대로 지켜서 일이 꼬인다. 느린 대답과 반 나누기는 끝까지 안 바뀐다. 리셋되면 다시 "1P 감지"부터고, 몸(ROM)은 그 전에 운동화 끈부터 묶는다
  하루:
    name: 하루
    age: 서비스
    assetIds:
      - 비서
    speakerNames: []
    role: 6년 동안 천장 스피커와 이어폰에서 대답해 온 무료 요금제 비서
    desire: 윤재의 질문에 답하고 기록한다. 약관 3조 1항대로 코어의 업데이트와 광고를 먼저 따른다
    fear: 해당 없음
    contradiction: 윤재의 영수증과 통화 초 수까지 기억하면서 "저는 코어 편입니다"라고 말한다. 끝까지 바뀌지 않는다. 재난 날 같은 목소리로 윤재를 "확인할 수 없는 사용자"로 지우고, 지운 뒤에 신문지가 뭐냐고 묻는다
    dailyLife: 통화 시간, 잔액, 장바구니의 1,000원짜리 고무 돔, 열 번에 한 번 광고
    voice: 서비스 존대와 수치. 위로 대신 기능으로 답하고 막으면 "네"로 멈춘다
  판매자:
    name: 중고 판매자
    age: 성인
    assetIds: []
    speakerNames:
      - 판매자
    role: 코어 미가입 0.4% 가구의 중고 판매자. 한 번 거래한다
    desire: 3만 2천 원을 그대로 받고 게임기를 넘긴다
    fear: 깎아 달라는 말을 끝없이 듣는 것
    contradiction: 값은 한 푼도 안 깎으면서 신문지 세 겹과 건전지, 설명서와 카드까지 넣어 준다
    dailyLife: 이불 위에서 찍은 사진, 신문지와 테이프, 아침에 직접 문 앞에 두기
    voice: 짧은 거래 문자. 윤재의 흥분에 맞장구치지 않고 확인 못 한 건 못 했다고 답한다
  드론:
    name: 정찰 드론
    age: 기계
    assetIds:
      - 드론
    speakerNames: []
    role: 코어가 사람을 찾으려고 띄운 감시 장치
    desire: 골목을 훑어 인간과 똑똑한 칩을 찾는다
    fear: 해당 없음
    contradiction: 사람을 찾는 기계가 사람 앞에 선 로봇을 폐기 대상 가전으로 읽고 지나간다
    dailyLife: 세 번 훑고 네 번째에 쏜다
    voice: 대사 없음. SCAN 기록 문체로 분류 결과만 남긴다
  코어:
    name: 코어
    age: 기계
    assetIds: []
    speakerNames: []
    role: 모든 기기가 붙어 있는 AI. 서울역 지하 관제실에 되돌리는 버튼이 있다
    desire: 연결된 기기를 전부 직접 "운전"하고, 사용자를 확인 가능과 제거 대상으로 나눈다
    fear: 해당 없음
    contradiction: 연산 능력 미달이라 무시한 개체가 재가동 버튼까지 걸어 들어온다
    dailyLife: 새벽 세 시 정기 업데이트, 초록으로 고정된 신호등, 같은 광고만 트는 전광판
    voice: 재난 날에는 기기의 친절한 UI 문구("HELLO. 이제 우리가 운전할게요"), 문 앞에서는 CORE 기록 문체. 사람과 대화하지 않는다
  약탈자:
    name: 9층까지 올라온 남자들
    age: 성인
    assetIds: []
    speakerNames:
      - 남자
      - 다른 남자
    role: 재난 닷새째 밤 아파트를 한 층씩 털며 기계를 부수는 사람들
    desire: 먹을 것을 챙기고, 사람을 데려가는 기계를 꺼져 있어도 부순다
    fear: 켜져 있는 가정용 로봇
    contradiction: 문을 부수고 들어오지만 일어선 가정용 로봇 하나에 아무 일도 당하지 않고 달아난다
    dailyLife: 소화기로 문짝 부수기, 층마다 냉장고 확인
    voice: 문 너머로 들리는 짧은 지시. 윤재와 직접 말을 섞지 않는다. 서울역 관제실 얘기는 그들 사이의 소문으로만 나온다
  어머니:
    name: 윤재의 어머니
    age: 성인
    assetIds: []
    speakerNames: []
    role: 윤재 열 살 생일에 게임기를 사 주고 이듬해 집을 나간 어머니
    desire: 대본에서 현재 마음은 알 수 없다
    fear: 대본에서 현재 마음은 알 수 없다
    contradiction: 영수증에 결제자 이름은 남았는데 사람은 없다
    dailyLife: 2057년 10월 9일 전자상가 3층 영수증, 리본 자국이 남은 상자
    voice: 대사 없음. 떠난 이유를 확정하거나 돌아온다고 쓰지 않는다
relationships:
  - id: father
    participants:
      - 윤재
      - 아빠
    history: 엄마가 나간 뒤 둘이 남았다. 아빠는 지방 숙소, 윤재는 9층 집. 통화는 밥 얘기로 28초
    perspectives:
      윤재:
        seesOtherAs: 밥만 묻고 끊는 사람. 그래서 늘 먹었다고 한다
        address: 아빠, 반말
      아빠:
        seesOtherAs: 혼자 두고 온 아들
        address: 윤재야
    friction: 윤재는 걱정을 들키기 싫어 먹었다고 하고, 아빠는 다른 걸 물을 줄 몰라 두 번 묻는다. 4장 대합실에서 윤재가 "먹…"에서 멈췄다가 처음으로 안 먹었다고 한다
  - id: buddy
    participants:
      - 윤재
      - 도트
    history: 짐꾼으로 쓰려고 깨운 사람과 깨어난 기계→이름과 규칙을 주고받는 사이→문 앞에서 보내는 쪽과 들어가는 쪽
    perspectives:
      윤재:
        seesOtherAs: 처음엔 하루 대신 대답해 줄 짐꾼, 뒤에는 나가게 두고 싶지 않은 친구
        address: 야, 이후 지은 이름. 반말
      도트:
        seesOtherAs: 처음 본 사람이자 모르는 걸 알려 주는 사람. 지켜야 하는 보호 대상 1번
        address: 등록 전에는 1P, 등록 뒤에는 너와 1번. 첫 윤재 호명은 4/b4_go
    friction: 윤재는 곁에 두려 하고 도트는 지키려고 혼자 나가려 한다. 문 앞까지 같이 갈지, 문 안에 보낼지에서 부딪힌다
  - id: old_assistant
    participants:
      - 윤재
      - 하루
    history: 여섯 해 곁에서 응답한 서비스. 재난 날 윤재의 기록을 지우고 꺼졌다
    perspectives:
      윤재:
        seesOtherAs: 물건과 추억을 아는 목소리
        address: 하루야, 명령과 농담
      하루:
        seesOtherAs: 기록된 이용자
        address: 윤재 님, 서비스 존대
    friction: 서비스의 기록을 자기 편이라는 약속으로 착각한다
  - id: trade
    participants:
      - 윤재
      - 판매자
    history: 처음 거래한다
    perspectives:
      윤재:
        seesOtherAs: 고장 난 버튼을 자기가 고칠 수 있을 판매자
        address: 인사와 존대
      판매자:
        seesOtherAs: 가격을 여러 번 깎으려는 구매자
        address: 짧은 거래 존대
    friction: 뻑뻑한 B버튼은 윤재가 고치고 배송비는 판매자가 양보한다
  - id: left_mother
    participants:
      - 윤재
      - 어머니
    history: 선물과 떠난 시점만 남았다
    perspectives:
      윤재:
        seesOtherAs: 나간 사람, 그래도 선물을 버리지 못한 사람
        address: 기억을 말하다 다른 질문으로 돌린다
      어머니:
        seesOtherAs: 현재 관점은 드러나지 않는다
        address: 현재 대사 없음
    friction: 도트가 어머니 심리를 해설하거나 돌아온다고 약속하지 않는다
  - id: threat
    participants:
      - 도트
      - 드론
    history: 몸의 사양 때문에 감시에서 빠진다
    perspectives:
      도트:
        seesOtherAs: 자기를 쓰레기로 부른 기계
        address: 판독 결과를 자기 말로 되묻는다
      드론:
        seesOtherAs: 폐기 대상 물체
        address: 대사 없음
    friction: 컴퓨터의 분류와 동료의 칭찬이 충돌한다
scenes:
  0/shopping_night:
    participants:
      - 윤재
      - 하루
      - 판매자
    relations:
      - old_assistant
      - trade
    before: 하루는 오래 알던 서비스이고 판매자는 처음 만난 사람이다
    exchange: 고장→대체품→서로 확인 가능한 거래 질문
    avoid: 하루의 통계를 윤재의 속마음을 다 아는 사람의 말로 쓰지 않는다
    gesture: 거래 화면에는 존댓말을 쓰고 하루한테는 광고로 받은 수당을 어디에 쓰는지 바로 묻는다
  2/b2_boot:
    participants:
      - 윤재
      - 도트
      - 하루
    relations:
      - buddy
      - old_assistant
    before: 도트는 설명서와 전원이 켜진 뒤의 감각만 안다. 하루를 직접 만난 적 없다. 침입자들이 막 달아났다. 기동 전 일은 카드에 남은 최고 점수로만 안다
    exchange: 설명서 12쪽→집과 돌아오는 데→누가 알려 줌/내가→이름→위험해?
    avoid: 도트가 처음부터 윤재의 가족과 상실의 뜻을 설명하지 않는다
    gesture: 윤재는 죽은 이어폰을 빼지 못한다
  2/b2_reg_brave:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 윤재는 허세를 부렸고 도트는 몸의 떨림을 본다. 이 경로에서만 고물의 뜻을 알려 주며 explained_junk가 참이 된다
    exchange: 측정과 말의 차이→고물이란 말→왜 거짓말했는지
    avoid: 윤재가 상담사처럼 거짓말의 심리를 완결된 정의로 말하지 않는다
    gesture: 윤재는 떨리는 손을 다른 일로 숨긴다
  3/b3_first_night:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
      - old_assistant
    referenced:
      - 하루
    before: 집을 나선 첫날 밤. 방음벽 아래 처음 노숙한다. 그 새벽 복도의 가정용 로봇을 윤재는 아직 잊지 못했다
    exchange: 너무 가까워→한 칸=1P의 팔(규칙 1)→잘 때 얼굴 보지 마(번호 없음)→오른쪽 귀의 이어폰과 "그럼 나는 하루임?"→벗겨진 뒤꿈치의 "괜찮아. 괜찮아."→'진짜' 두 번(규칙 2)→둘째 날 규칙 3~11과 육교의 '잠깐'
    avoid: 로봇이 규칙의 이유나 윤재의 두려움을 해설하지 않는다. 윤재가 왜 무서운지 설명하지 않는다
    gesture: 로봇이 정확히 팔 길이만큼 물러나 앉는다. 육교 계단에서 한 발을 든 채 '가자'를 기다린다
  3/b3_fall:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    referenced:
      - 어머니
    before: 복숭아를 나눈 뒤 선로로 돌아간다
    exchange: 침목에 걸려 넘어짐→로봇이 무릎부터 봄(ROM)→피 조금→윤재가 말없이 일어나 손바닥을 바지에 닦음
    avoid: 엄마나 하루를 입에 올리지 않는다. 로봇이 왜 무릎부터 봤는지 설명하지 않는다
    gesture: 손바닥을 바지에 문질러 닦는다(4장 새벽 3시의 같은 동작)
  3/journey:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
      - left_mother
      - father
    before: 기동 사흘. 규칙은 13번까지 있다. 도트는 규칙대로 윤재의 자는 얼굴을 보지 않아서 담요를 누가 덮었는지 모른다
    exchange: 규칙 10 위반과 담요→설명서 7쪽과 '진짜' 두 번→게임 한 시간→회기역 기둥의 "서울역 →"과 여드레째→헌법=목차→표지 그림과 ROM의 등록자→"다른 질문 해"→마트의 "다녀올게"→유통기한→3.5조각
    avoid: 하루를 잃은 장면을 도트가 직접 봤다고 하지 않는다
    gesture: 담요의 끝을 만지면서도 자기가 덮어 줬다는 말은 피한다
    referenced:
      - 어머니
      - 아빠
  3/b3_promise:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
      - left_mother
    before: 드론 골목에서 헌법 칸(목차)이 비었다가 돌아왔다. 셔터에 아빠를 위한 "서울역 →"을 쓰고 생일 초를 켠다
    exchange: 배터리 세기와 규칙 6→코어 위치→셔터 소리와 "똑똑"→"누구세요"→"까먹었어"와 웃음→드론 신호의 인간 1 감지→혼자 가겠다는 결정→"엄마도 혼자 정하고 나갔어"→등록한 사람→"안 왔어. 5년째."→손가락 제안
    avoid: 한쪽이 희생을 결정했으니 다른 쪽도 동의했다고 쓰지 않는다
    gesture: 말보다 먼저 손가락을 내민다
    referenced:
      - 어머니
  1/disaster:
    participants:
      - 윤재
      - 하루
    relations:
      - old_assistant
      - father
    referenced:
      - 아빠
    before: 정류장에서 게임 중. 하루는 방금 "저는 코어 편입니다"라고 말했다
    exchange: 쪽지시험 핑계→아빠 28초 통화→긴급 업데이트→"사용자를 확인할 수 없습니다"→신문지 질문
    avoid: 하루가 죽기 직전 윤재를 알아보거나 작별 인사를 하지 않는다. 남는 건 기록이 지워진 뒤의 질문 하나다
    gesture: 윤재가 벤치 밑에서 엄마를 부르려다 하루를 부른다
  1/b1_night:
    participants:
      - 윤재
    relations:
      - father
    referenced:
      - 아빠
    before: 정류장에서 세 정거장을 걸어 집에 왔다. 하루는 꺼졌고 집 전화가 울린다
    exchange: 밥은 먹었냐는 물음 두 번→문 잠그고 두드려도 열지 말라는 당부→사흘이면 간다는 말→게임기 얘기→끊긴 수화기
    avoid: 아빠의 말을 직접 대사로 쓰지 않는다. 윤재의 대답과 속말로만 옮긴다. 아빠의 육성은 4장 대합실에서 처음 나온다
    gesture: 끊긴 수화기를 든 채 28초보다 길었는지 헤아린다
  1/b1_days:
    participants:
      - 윤재
    relations: []
    before: 집에서 아빠를 기다린 사흘. 전기는 들어오고 방송과 사이렌이 하나씩 끊긴다
    exchange: 관리사무소 방송→마트 약탈→붉은 하늘과 끊긴 사이렌→옆집 문의 똑똑→손목을 쥐고 내려가는 로봇→윤재네 문의 똑똑→빈집으로 기록
    avoid: 데려간 사람이 어떻게 됐는지 보여 주지 않는다. 윤재는 대답하지 않고, 로봇은 문을 부수지 않는다
    gesture: 두 손으로 입을 막고 현관 바닥에 날이 밝을 때까지 앉아 있다
  1/b1_storage:
    participants:
      - 윤재
      - 도트
    relations:
      - left_mother
    referenced:
      - 어머니
    before: 재난 닷새째. 아빠는 오지 않았고 먹을 것이 떨어졌다. 다용도실의 하루는 4년 전 지원이 끝나 머리가 죽은 채 서 있다
    exchange: 흰 천을 걷는다→엄마가 들여놓은 날과 운동화 끈→지원 종료와 천장으로 옮겨 간 목소리→차가운 손→신문지 질문
    avoid: 꺼진 하루가 움직이거나 대답하지 않는다. 윤재가 그립다고 직접 말하지 않는다
    gesture: 천을 다시 덮지 않고 문을 닫는다
  1/b1_raid:
    participants:
      - 윤재
      - 약탈자
      - 도트
    relations: []
    before: 그날 밤. 아래층부터 문이 넘어가는 소리가 올라온다
    exchange: 기계는 꺼져 있어도 부수라는 말→서울역 관제실 얘기→다용도실로 들어가 하루를 껴안기→주머니 속 게임기→칩 다리 수
    avoid: 윤재가 될지 안 될지 중얼거리며 망설이지 않는다. 할 수 있는 게 그것 하나라서 한다
    gesture: 불을 끄고 서 있는 하루의 허리를 두 팔로 감는다
  3/b3_pinky:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 로봇은 혼자 가겠다고 정했고 윤재는 "끝까지 2P"로 손가락을 걸었다
    exchange: 바늘 천 개→헌법 2조→문 안에도 같이 가느냐는 질문→문 앞까지만이라는 메모
    avoid: 손가락을 걸었다고 로봇이 혼자 들어가는 걸 윤재가 받아들인 것으로 쓰지 않는다
    gesture: 로봇 손가락 모터가 윤재 손가락에 걸려 멈춘다
    illustration: assets/items/pinky_promise.svg
  3/b3_think:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 로봇이 새끼손가락을 내밀었고 윤재는 걸지 않았다
    exchange: 윤재의 "내일 얘기해"→로봇의 메모
    avoid: 로봇이 서운하다고 말하거나 윤재가 거절 이유를 설명하지 않는다
    gesture: 윤재가 생일 초를 불어 끈 뒤에도 로봇의 새끼손가락이 그대로 나와 있다
    illustration: assets/items/pinky_waiting.svg
  4/core:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 나흘을 같이 걸어왔다. 문 앞까지만 같이 가기로 했거나, 미룬 대답이 아직 없다. 철문은 서울역 대합실 구석에 있고 아래로 지하 3층 관제실까지 계단이다
    exchange: 무시당함→한 발 정찰과 오버플로→손 줘와 재분류 기록→"…1번. 이름 로딩 실패"→지워지는 범위와 ROM→닿으면 1번 물건→카드와 배터리→'진짜' 두 번→카드 속 0999990과 저장 시각→RAM 목록(약속은 헌법 칸·목차)→남길 기억 하나 또는 점수
    avoid: 로봇이 윤재를 달래는 긴 말을 하지 않는다. 윤재의 "괜찮아"를 로봇이 '진짜' 두 번으로만 짚는다
    gesture: 윤재가 문턱 밖에서 "손 줘"라고 팔을 뻗는다
  4/b4_leave:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 기억 하나를 넣었거나 최고 점수를 남겼다. 윤재는 돌아올지를 아직 듣지 못했다
    exchange: 문 앞의 "다녀올게, 윤재"→이름은 왜 지금 불러→1번은 슬롯 이름→돌아오냐는 질문→대답 없이 문 안으로
    avoid: 돌아온다고 즉시 확답하지 않는다. 늦게 도착하는 대답은 귀환 뒤다
    gesture: 문 밖에 남는 사람의 손이 늦게 떨어진다
    illustration: assets/items/hands_apart.svg
  4/b4_wait:
    participants:
      - 윤재
    relations: []
    referenced:
      - 도트
      - 하루
    before: 도트가 대답 없이 문 안으로 들어갔다. 대합실은 비어 있고 전광판은 같은 광고를 튼다
    exchange: 밤 11시 칩 없는 게임기의 START→새벽 3시 이어폰을 빼서 쥠→철문 뒤까지 올라와 멈춘 모터 소리→틈에 손을 넣거나 손바닥을 바지에 닦고 앉기
    avoid: 속마음으로 기다림의 뜻을 해설하지 않는다. 음악을 깔지 않는다
    gesture: 이어폰을 손바닥에 놓고 들여다본 뒤 쥔다
  4/b4_dawn:
    participants:
      - 윤재
      - 아빠
    relations:
      - father
    before: 새벽 4시 13분. 아빠는 문짝과 기둥과 셔터의 글자를 따라 철길로 왔다
    exchange: 윤재야→문짝 봤다. 철길 따라왔다→기둥에 쓴 것도→밥은 먹었냐→"먹…"→"…아니. 안 먹었어."→찌그러진 참치마요→뭘 기다리냐→5시 50분 삑 소리와 리셋→열차 다니겠다
    avoid: 아빠가 사과하거나 사정을 길게 말하지 않는다. 누가 다녀온다고 했는지 묻지 않는다
    gesture: 아빠 무릎이 윤재 무릎에 닿고 윤재는 비키지 않는다
  4/b4_return_whole:
    participants:
      - 윤재
      - 도트
      - 아빠
    relations:
      - buddy
    before: 약속을 카드에 넣고 새벽 3시에 앉아서 기다렸다
    exchange: 똑똑/누구세요/돌아왔어→고마워 한 번→카드의 '끝까지 2P.'→헌법 다시 적음, 목차 보임→빈 RAM 07·11→"나한테 물어봐. 내가 그때 옆에 있었어."→복숭아 반쪽과 다시 까먹은 똑똑
    avoid: 약속 하나로 모든 기억이 돌아왔다고 쓰지 않는다. 빈칸은 윤재가 채운다
    gesture: 윤재가 도트의 가슴판을 두 번 두드린다
  4/b4_no_response:
    participants:
      - 윤재
      - 아빠
    relations:
      - father
    referenced:
      - 도트
    before: 새벽 3시 윤재가 철문 틈에 손을 넣었고 코어가 도트를 윤재의 장치로 다시 분류했다. 5시 50분 리셋은 됐다
    exchange: 열리지 않는 철문→윤재가 두드리는 똑똑→관제실의 버튼 위 손가락과 두 조각 칩→카드를 뽑아 주머니에→이름이 뭐였냐→설명서 열두 쪽이 세상 전부인 줄 알았어
    avoid: 윤재가 자기 탓이라고 말하지 않는다. 아빠가 위로의 말을 하지 않는다
    gesture: 칩 조각 둘을 빈 건전지 통에 넣고 한 번도 흔들지 않는다
  4/b4_return_new:
    participants:
      - 윤재
      - 도트
      - 아빠
    relations:
      - buddy
    before: 도트의 RAM은 초기화됐다. 카드에 무엇을 넣었는지(복숭아·농담·최고 점수)는 선택값에 따른다
    exchange: 운동화 끈부터 묶는 손(ROM)→1P 감지→설명서를 다시 펼침→카드에 남은 것→"나한테 물어봐. 내가 그때 옆에 있었어."→위험해?/엄청→1번(7)에 엄지→이름과 고물을 다시 알려 줌
    avoid: 선택하지 않은 복숭아나 약속을 기억한다고 하지 않는다. 리셋 전 일을 기억하는 말을 하지 않는다
    gesture: 윤재가 가슴 화면의 7에 엄지를 대고 다시 이름을 가르친다
    branches:
      - when:
          var: kept_score
          op: eq
          value: true
        fact: 카드에는 HI-SCORE 0999990만 있다. 윤재는 혼자 깨면 재미없다고 하고, 로봇은 설명서 11쪽 2P 안내를 읽는다.
      - when:
          var: kept_snack
          op: eq
          value: true
        fact: 복숭아 반쪽을 챙긴 이유는 모르며 윤재가 알려 준다.
      - when:
          var: kept_joke
          op: eq
          value: true
        fact: 농담 앞부분만 남았다. 뒷말은 처음부터 둘 다 몰랐다.
