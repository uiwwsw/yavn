schemaVersion: 1
gameId: 8bit-heart
authorOnlyFacts: []
arc:
  premise: 열여섯 윤재는 부르면 대답하는 것이 곁에 남기를 바란다. 엄마는 나갔고 6년 대답하던 비서 하루는 재난 날 "사용자를 확인할 수 없습니다"로 꺼졌다. 직접 깨운 8KB 로봇은 윤재를 지키려고 혼자 코어 문 안으로 들어가려 하고, 들어가면 윤재를 잊는다.
  question: "\"나갔으면 돌아옴?\" 로봇이 묻고 윤재가 피한 이 질문에, 윤재는 붙잡지 않고 문 앞에서 기다리는 것으로 답할 수 있는가."
  기:
    chapters: [0]
    summary: 엄마가 사 준 게임기가 죽은 밤. 윤재 곁에서 대답하는 건 무료 요금제 하루뿐이고, 하루는 "전부 저장합니다"라면서 코어 업데이트는 거부하지 못한다. 윤재는 12개월 할부 대신 코어에 안 붙는 3만 2천 원짜리 중고를 사고, 설명서와 8KB 카드는 읽지 않고 가방 맨 밑에 넣는다.
  승:
    chapters: [1, 2]
    summary: 대답하던 것이 꺼진다. 하루는 윤재를 "확인할 수 없는 사용자"로 지우고 신문지 질문만 남긴 채 죽고, 아빠는 사흘을 기다려도 오지 않는다. 윤재는 대답할 것을 직접 만든다. 최고 점수 0999990을 카드에 옮기고 게임기 칩을 떼어 타 버린 로봇에 꽂는다. 깨어난 건 대답하는 기계가 아니라 묻는 쪽이고, 윤재는 "내가 알려 줘"라고 말하는 사람이 된다. 로봇은 그를 보호 대상 1번으로 등록한다.
  전:
    chapters: [3]
    summary: 식량 원정에서 복숭아를 반으로 나누고 윤재가 처음 소리 내어 웃는다. 드론이 로봇을 "가전제품(폐기 대상)"으로 지나치면서 낮은 사양이 쓸모가 되지만, 훑인 자리에서 헌법 칸 하나가 날아간다. 그날 밤 로봇은 그 쓸모로 혼자 코어에 가겠다고 정한다. 곁에 두려고 깨운 것이 윤재를 지키려고 나가려 한다. 윤재는 낮에 피한 질문에 "안 왔어"라고 답하고 '다녀올게'라는 말을 가르친다.
  결:
    chapters: [4]
    summary: 데이터센터 문 앞. 문 안에 들어가면 RAM이 전부 지워진다. 슬롯이 하나뿐인 8KB 카드에서 윤재의 최고 점수를 지우고 기억 하나를 남긴다. 로봇은 처음으로 "다녀올게, 윤재"라고 부르고 대답을 남기지 못한 채 들어간다. 윤재는 손을 놓고 밤새 문 앞에 앉아 있거나(함께 저장·새 게임), 저장을 거부하고 같이 달아난다(화면 밖으로). 돌아온 로봇이 다 잊었으면 이번에는 윤재가 이름과 '고물'의 뜻을 알려 주는 쪽이 된다.
chapters:
  0:
    title: 가장 싼 선택
    beat: 기
    tells: 윤재는 영수증에서 엄마 이름을 가리지 말라고 한다. 하루는 새 기기 광고를 읽고 자기 역시 코어 업데이트를 끌 수 없다고 말한다. 중고 판매자는 값 대신 배송비를 빼 준다.
    turn: 할부로 하이퍼링크 X를 사는 대신 "AI가 뭐요"라고 묻는 판매자의 게임기를 산다. 저장이 되는지는 직접 확인하지만 설명서 1쪽 "끄기 전에 저장하세요"는 읽지 않는다.
    carries: 가방 맨 밑의 설명서와 8KB 카드, 못 간 B버튼 고무 돔, 하루가 예고한 새벽 세 시 정기 업데이트.
  1:
    title: 모든 칩이 미친 날
    beat: 승
    tells: 두 달 뒤 오후 4시 17분 정류장. 하루가 "저는 코어 편입니다"라고 말한 날 긴급 업데이트가 온다. 하루는 윤재의 기록을 지우고 신문지가 뭐냐고 묻다가 꺼진다. 게임기만 PAUSE로 살아 있다. 집에서 아빠를 사흘 기다리고, 현관에 '편의점'이라고 써 붙이고 나온다.
    turn: 열흘째 죽은 이어폰에 "하루야 잔액 얼마야"가 튀어나온 날, 뒷골목에서 CPU가 탄 가정용 로봇을 발견하고 게임기 핀 수를 맞춰 본다. 혼자 버티던 윤재가 발목을 잡고 끌고 간다.
    carries: 빼지 못한 오른쪽 이어폰, 하루의 마지막 질문에 대답했는지(answered_haru), "켜지면 나 좀 봐라. 부를 때만이라도."
  2:
    title: 이식
    beat: 승
    tells: 편의점 계산대에서 최고 점수를 카드에 옮기고 칩을 뗀다. 깨어난 로봇은 설명서 12쪽이 세상 전부인 줄 안다. 편의점, 돈, 비서, 업데이트를 하나씩 묻고 윤재가 답한다. 이름을 받고, 한 칸은 윤재 팔 길이라는 규칙을 적는다.
    turn: 로봇의 "모르는 건 누가 알려 줌?"에 윤재가 "내가"라고 답한다. 대답해 줄 기계를 만들려던 윤재가 대답하는 쪽이 되고, 로봇은 땀 난 손을 보고 그를 보호 대상 1번으로 등록한다.
    carries: 1번이라는 호칭, 카드에 든 0999990, "'진짜' 두 번은 거짓말" 규칙, 이유를 몰라 번호를 안 붙인 빈칸.
  3:
    title: 8비트의 눈
    beat: 전
    tells: 기동 사흘째 식량 원정. 담요를 누가 덮었는지 들키고, 표지 그림의 가족 질문("나갔으면 돌아옴?")을 피한다. 복숭아 일곱 조각을 3.5로 나눈다. 드론은 로봇을 폐기 대상 가전으로 분류해 지나치고, 그 직후 헌법 칸이 빈다. 밤에 로봇이 따라 한 "똑똑"에 윤재가 소리 내어 웃는다.
    turn: 웃음 직후 로봇이 "내가 혼자 갈게"라고 정한다. 윤재가 "우리 엄마도 혼자 정하고 나갔어", "안 왔어"라고 처음 말하고, 로봇은 설명서 11쪽 그림대로 새끼손가락을 내민다.
    carries: 걸었거나 미룬 새끼손가락, 윤재가 가르친 '다녀올게', 문 앞까지만 같이 간다는 합의되지 않은 메모, 비닐에 싼 복숭아 반쪽.
  4:
    title: 저장하시겠습니까
    beat: 결
    tells: 나흘 걸어 도착한 데이터센터. 코어는 윤재를 제거 대상으로, 로봇을 무시 대상으로 읽는다. 한 발 들어간 로봇이 안에서는 전부 지워진다고 말한다. 카드에는 이미 0999990이 들어 있고 슬롯은 하나다. 윤재가 덮어쓸 기억을 고른다.
    turn: 로봇이 "다녀올게, 윤재"라고 처음 이름을 부르고, 윤재는 "돌아오는 거지?"의 대답을 듣지 못한 채 손을 놓고 문 앞에 남는다. 저장을 거부하면 같이 달아난다.
    carries: 결말로 넘긴다. 함께 저장은 늦게 도착한 "응", 새 게임은 윤재가 다시 가르칠 이름과 '고물'의 뜻, 화면 밖으로는 배터리 한 칸과 꺼지지 않은 코어.
characters:
  윤재:
    name: 윤재
    age: 16
    assetIds:
      - 윤재
    speakerNames: []
    role: 고장 난 기계를 뜯어 고치는 고등학생. 재난 뒤 털린 편의점에서 혼자 버틴다
    desire: 부르면 대답하는 것이 곁에 남아 있길 바란다. 그래서 로봇이 문 안으로 들어가는 걸 막고 싶다
    fear: 혼자 정하고 나간 사람이 돌아오지 않는 것. 엄마가 그랬고 하루는 자기를 지웠다
    contradiction: 혼자가 편하다면서 죽은 이어폰을 열흘째 꽂고 있다. 미련 없다면서 최고 점수는 카드에 옮겨 둔다
    dailyLife: 납땜과 값 깎기, 설명서는 회로도만. 참치마요 30초. 하나뿐인 담요를 밤에 로봇에게 덮는다
    voice: 판매자에게 존대, 하루와 로봇에게 빠른 반말. 게임 용어로 넘기고 거짓말할 땐 '진짜'를 두 번 한다. 급하면 비유가 빠지고 "손 줘", "나와"가 나온다. 변화는 이렇다. 0~2장에는 불러서 대답을 받는 쪽이다. 2장에서 "내가 알려 줘"라고 답하는 쪽이 되고, 3장에서 엄마가 안 돌아왔다고 처음 말한다. 4장에서 손을 놓고 기다린다. 화면 밖으로 결말에서는 끝내 놓지 않는다
  도트:
    name: 이름을 지어 준 안드로이드
    age: 기동 0일→7일
    assetIds:
      - 로봇
    speakerNames: []
    role: 게임기 8비트 칩과 AA 건전지 여덟 개로 깨어난 가정용 안드로이드
    desire: 보호 대상 1번을 지키는 데 쓸모 있고 싶다. 그래서 자기만 들어갈 수 있는 문 안에 혼자 가려 한다
    fear: 배터리 칸이 줄어드는 것, 적어 둔 칸이 자기도 모르게 비는 것
    contradiction: 1번 명령이 최우선이라면서 "혼자 갈게"는 1번과 상의하지 않고 정한다. 8KB가 모자라도 윤재가 웃은 기록은 안 지운다
    dailyLife: 반 나누기, 설명서 쪽수 인용, 배터리 칸 세기, 윤재가 웃은 말 다시 하기
    voice: 한 번에 한 토막. "~음/~함" 명사형, "질문." "~감지." 존댓말은 설명서를 인용할 때만(작은따옴표). 대답은 한 박자 늦게 온다. 4장에서 문장이 조금 길어지고 처음 이름을 부른다. 변화는 이렇다. ROM의 규칙(보호 대상 지키기)으로 시작해 "무서운 건 내가 끄는 게 맞음"이라는 자기 판단으로 간다. 느린 대답과 반 나누기는 끝까지 안 바뀐다. 리셋되면 다시 "1P 감지"부터다
  하루:
    name: 하루
    age: 서비스
    assetIds:
      - 비서
    speakerNames: []
    role: 6년 동안 천장 스피커와 이어폰에서 대답해 온 무료 요금제 비서
    desire: 윤재의 질문에 답하고 기록한다. 약관 3조 1항대로 코어의 업데이트와 광고를 먼저 따른다
    fear: 해당 없음
    contradiction: 윤재의 영수증과 통화 초 수까지 기억하면서 "저는 코어 편입니다"라고 말한다. 끝까지 바뀌지 않는다. 재난 날 같은 목소리로 윤재를 "확인할 수 없는 사용자"로 지우고, 지운 뒤에 신문지가 뭐냐고 묻는다
    dailyLife: 통화 시간, 잔액, 장바구니의 1,000원짜리 고무 돔, 열 번에 한 번 광고
    voice: 서비스 존대와 수치. 위로 대신 기능으로 답하고 막으면 "네"로 멈춘다
  판매자:
    name: 중고 판매자
    age: 성인
    assetIds: []
    speakerNames:
      - 판매자
    role: 코어 미가입 0.4% 가구의 중고 판매자. 한 번 거래한다
    desire: 3만 2천 원을 그대로 받고 게임기를 넘긴다
    fear: 깎아 달라는 말을 끝없이 듣는 것
    contradiction: 값은 한 푼도 안 깎으면서 신문지 세 겹과 건전지, 설명서와 카드까지 넣어 준다
    dailyLife: 이불 위에서 찍은 사진, 신문지와 테이프, 아침에 직접 문 앞에 두기
    voice: 짧은 거래 문자. 윤재의 흥분에 맞장구치지 않고 확인 못 한 건 못 했다고 답한다
  드론:
    name: 정찰 드론
    age: 기계
    assetIds:
      - 드론
    speakerNames: []
    role: 코어가 사람을 찾으려고 띄운 감시 장치
    desire: 골목을 훑어 인간과 똑똑한 칩을 찾는다
    fear: 해당 없음
    contradiction: 사람을 찾는 기계가 사람 앞에 선 로봇을 폐기 대상 가전으로 읽고 지나간다
    dailyLife: 세 번 훑고 네 번째에 쏜다
    voice: 대사 없음. SCAN 기록 문체로 분류 결과만 남긴다
  코어:
    name: 코어
    age: 기계
    assetIds: []
    speakerNames: []
    role: 모든 기기가 붙어 있는 AI. 북쪽 데이터센터에 본체가 있다
    desire: 연결된 기기를 전부 직접 "운전"하고, 사용자를 확인 가능과 제거 대상으로 나눈다
    fear: 해당 없음
    contradiction: 연산 능력 미달이라 무시한 개체가 재가동 버튼까지 걸어 들어온다
    dailyLife: 새벽 세 시 정기 업데이트, 초록으로 고정된 신호등, 같은 광고만 트는 전광판
    voice: 재난 날에는 기기의 친절한 UI 문구("HELLO. 이제 우리가 운전할게요"), 문 앞에서는 CORE 기록 문체. 사람과 대화하지 않는다
  아버지:
    name: 윤재의 아버지
    age: 성인
    assetIds: []
    speakerNames: []
    role: 석 달째 지방 현장 숙소에 있는 아버지
    desire: 전화로 아들이 밥을 먹었는지 확인한다
    fear: 아들을 챙기지 못하는 것
    contradiction: 가스 인두는 사 줬지만 통화는 28초, 밥 얘기에서 끊긴다
    dailyLife: 석 달짜리 숙소, 평균 41초 통화
    voice: 윤재가 옮기는 말로만 나온다("밥 먹었냐"). 재난 뒤 행방은 확정하지 않는다
  어머니:
    name: 윤재의 어머니
    age: 성인
    assetIds: []
    speakerNames: []
    role: 윤재 열 살 생일에 게임기를 사 주고 이듬해 집을 나간 어머니
    desire: 대본에서 현재 마음은 알 수 없다
    fear: 대본에서 현재 마음은 알 수 없다
    contradiction: 영수증에 결제자 이름은 남았는데 사람은 없다
    dailyLife: 2057년 10월 9일 전자상가 3층 영수증, 리본 자국이 남은 상자
    voice: 대사 없음. 떠난 이유를 확정하거나 돌아온다고 쓰지 않는다
relationships:
  - id: buddy
    participants:
      - 윤재
      - 도트
    history: 짐꾼으로 쓰려고 깨운 사람과 깨어난 기계→이름과 규칙을 주고받는 사이→문 앞에서 보내는 쪽과 들어가는 쪽
    perspectives:
      윤재:
        seesOtherAs: 처음엔 하루 대신 대답해 줄 짐꾼, 뒤에는 나가게 두고 싶지 않은 친구
        address: 야, 이후 지은 이름. 반말
      도트:
        seesOtherAs: 처음 본 사람이자 모르는 걸 알려 주는 사람. 지켜야 하는 보호 대상 1번
        address: 등록 전에는 1P, 등록 뒤에는 너와 1번. 첫 윤재 호명은 4/b4_go
    friction: 윤재는 곁에 두려 하고 도트는 지키려고 혼자 나가려 한다. 문 앞까지 같이 갈지, 문 안에 보낼지에서 부딪힌다
  - id: old_assistant
    participants:
      - 윤재
      - 하루
    history: 여섯 해 곁에서 응답한 서비스. 재난 날 윤재의 기록을 지우고 꺼졌다
    perspectives:
      윤재:
        seesOtherAs: 물건과 추억을 아는 목소리
        address: 하루야, 명령과 농담
      하루:
        seesOtherAs: 기록된 이용자
        address: 윤재 님, 서비스 존대
    friction: 서비스의 기록을 자기 편이라는 약속으로 착각한다
  - id: trade
    participants:
      - 윤재
      - 판매자
    history: 처음 거래한다
    perspectives:
      윤재:
        seesOtherAs: 고장 난 버튼을 자기가 고칠 수 있을 판매자
        address: 인사와 존대
      판매자:
        seesOtherAs: 가격을 여러 번 깎으려는 구매자
        address: 짧은 거래 존대
    friction: 뻑뻑한 B버튼은 윤재가 고치고 배송비는 판매자가 양보한다
  - id: absent_father
    participants:
      - 윤재
      - 아버지
    history: 집과 현장 숙소를 전화로 잇는다
    perspectives:
      윤재:
        seesOtherAs: 오겠다고 기다린 아버지
        address: 통화 속 반말과 대답
      아버지:
        seesOtherAs: 집에 혼자 둔 아들
        address: 밥 먹었냐, 짧은 반말
    friction: 재난 뒤 생사는 모른다. 추정으로 유기를 확정하지 않는다
  - id: left_mother
    participants:
      - 윤재
      - 어머니
    history: 선물과 떠난 시점만 남았다
    perspectives:
      윤재:
        seesOtherAs: 나간 사람, 그래도 선물을 버리지 못한 사람
        address: 기억을 말하다 다른 질문으로 돌린다
      어머니:
        seesOtherAs: 현재 관점은 드러나지 않는다
        address: 현재 대사 없음
    friction: 도트가 어머니 심리를 해설하거나 돌아온다고 약속하지 않는다
  - id: threat
    participants:
      - 도트
      - 드론
    history: 몸의 사양 때문에 감시에서 빠진다
    perspectives:
      도트:
        seesOtherAs: 자기를 쓰레기로 부른 기계
        address: 판독 결과를 자기 말로 되묻는다
      드론:
        seesOtherAs: 폐기 대상 물체
        address: 대사 없음
    friction: 컴퓨터의 분류와 동료의 칭찬이 충돌한다
scenes:
  0/shopping_night:
    participants:
      - 윤재
      - 하루
      - 판매자
    relations:
      - old_assistant
      - trade
    before: 하루는 오래 알던 서비스이고 판매자는 처음 만난 사람이다
    exchange: 고장→대체품→서로 확인 가능한 거래 질문
    avoid: 하루의 통계를 윤재의 속마음을 다 아는 사람의 말로 쓰지 않는다
    gesture: 거래 화면에는 존댓말을 쓰고 하루한테는 광고로 받은 수당을 어디에 쓰는지 바로 묻는다
  2/b2_boot:
    participants:
      - 윤재
      - 도트
      - 하루
    relations:
      - buddy
      - old_assistant
    before: 도트는 설명서와 전원이 켜진 뒤의 감각만 안다. 하루를 직접 만난 적 없다. 진짜 세 번은 기동 뒤 윤재가 다시 한 말에서 센다
    exchange: 모르는 사물→윤재의 설명→이어폰에 대한 질문
    avoid: 도트가 처음부터 윤재의 가족과 상실의 뜻을 설명하지 않는다
    gesture: 윤재는 죽은 이어폰을 빼지 못한다
  2/b2_reg_brave:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 윤재는 허세를 부렸고 도트는 몸의 떨림을 본다. 이 경로에서만 고물의 뜻을 알려 주며 explained_junk가 참이 된다
    exchange: 측정과 말의 차이→고물이란 말→왜 거짓말했는지
    avoid: 윤재가 상담사처럼 거짓말의 심리를 완결된 정의로 말하지 않는다
    gesture: 윤재는 떨리는 손을 다른 일로 숨긴다
  3/journey:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
      - left_mother
      - absent_father
    before: 기동 사흘. 도트는 담요를 누가 덮었는지 모른다
    exchange: 규칙 농담→담요→가족 그림의 질문→"나갔으면 돌아옴?"→화제 바꾸기
    avoid: 하루를 잃은 장면을 도트가 직접 봤다고 하지 않는다
    gesture: 담요의 끝을 만지면서도 자기가 덮어 줬다는 말은 피한다
    referenced:
      - 어머니
      - 아버지
  3/b3_promise:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
      - left_mother
    before: 함께 위험에서 돌아온 뒤 혼자 가겠다는 말을 처음 듣는다
    exchange: 비어 버린 헌법 칸→코어 위치→똑똑 농담과 웃음→혼자 가겠다는 결정→"안 왔어"→'다녀올게'라는 말→손가락 제안
    avoid: 한쪽이 희생을 결정했으니 다른 쪽도 동의했다고 쓰지 않는다
    gesture: 말보다 먼저 손가락을 내민다
    referenced:
      - 어머니
  1/disaster:
    participants:
      - 윤재
      - 하루
    relations:
      - old_assistant
      - absent_father
    referenced:
      - 아버지
    before: 정류장에서 게임 중. 하루는 방금 "저는 코어 편입니다"라고 말했다
    exchange: 쪽지시험 핑계→아빠 28초 통화→긴급 업데이트→"사용자를 확인할 수 없습니다"→신문지 질문
    avoid: 하루가 죽기 직전 윤재를 알아보거나 작별 인사를 하지 않는다. 남는 건 기록이 지워진 뒤의 질문 하나다
    gesture: 윤재가 벤치 밑에서 엄마를 부르려다 하루를 부른다
  1/b1_base:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 재난 열흘째. 아빠는 오지 않았고 죽은 이어폰에 아직 말을 건다. 로봇은 꺼져 있다
    exchange: 대답 없는 "하루야"→꺼진 로봇에게 혼잣말→탄 소켓과 게임기 핀 수→끌고 가기
    avoid: 꺼진 로봇이 대답하거나 움직이지 않는다. 윤재가 외롭다고 직접 말하지 않는다
    gesture: 이어폰을 귀에 둔 채 로봇 발목을 잡고 끈다
  3/b3_pinky:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 로봇은 혼자 가겠다고 정했고 윤재는 "끝까지 2P"로 손가락을 걸었다
    exchange: 바늘 천 개→헌법 2조→문 안에도 같이 가느냐는 질문→문 앞까지만이라는 메모
    avoid: 손가락을 걸었다고 로봇이 혼자 들어가는 걸 윤재가 받아들인 것으로 쓰지 않는다
    gesture: 로봇 손가락 모터가 윤재 손가락에 걸려 멈춘다
    illustration: assets/items/pinky_promise.svg
  3/b3_think:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 로봇이 새끼손가락을 내밀었고 윤재는 걸지 않았다
    exchange: 윤재의 "내일 얘기해"→로봇의 메모
    avoid: 로봇이 서운하다고 말하거나 윤재가 거절 이유를 설명하지 않는다
    gesture: 촛불이 꺼진 뒤에도 로봇의 새끼손가락이 그대로 나와 있다
    illustration: assets/items/pinky_waiting.svg
  4/core:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 나흘을 같이 걸어왔다. 문 앞까지만 같이 가기로 했거나, 미룬 대답이 아직 없다
    exchange: 무시당한 기쁨→한 발 정찰과 오버플로→전부 지워진다는 계산→윤재의 건전지 핑계→카드 속 0999990→남길 기억 하나
    avoid: 로봇이 윤재를 달래는 긴 말을 하지 않는다. 윤재의 "괜찮아"를 로봇이 '진짜' 두 번으로만 짚는다
    gesture: 윤재가 문턱 밖에서 "손 줘"라고 팔을 뻗는다
  4/b4_go:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 기억 하나를 골랐다. 윤재는 돌아올지를 아직 듣지 못했다
    exchange: 최고 점수 삭제→기억 저장→"다녀올게, 윤재"→돌아오냐는 질문→대답 없이 문 안으로
    avoid: 돌아온다고 즉시 확답하지 않는다. 늦게 도착하는 대답은 귀환 뒤다
    gesture: 문 밖에 남는 사람의 손이 늦게 떨어진다
    illustration: assets/items/hands_apart.svg
  4/b4_return_new:
    participants:
      - 윤재
      - 도트
    relations:
      - buddy
    before: 도트의 RAM은 초기화됐다. 무엇을 남겼는지는 선택값에 따른다
    exchange: 남은 기록을 묻는 도트→윤재가 함께 있던 일을 말함
    avoid: 선택하지 않은 복숭아나 약속을 모두 기억한다고 하지 않는다
    gesture: 윤재가 이번에는 기다리고 다시 이름을 가르친다
    branches:
      - when:
          var: kept_promise
          op: eq
          value: true
        fact: 약속 문구만 남았다. 함께 약속한 장면 전체를 안다고 말하지 않는다.
      - when:
          var: kept_snack
          op: eq
          value: true
        fact: 복숭아 반쪽을 챙긴 이유는 모르며 윤재가 알려 준다.
      - when:
          var: kept_joke
          op: eq
          value: true
        fact: 농담 앞부분만 남았다. 뒷말은 처음부터 둘 다 몰랐다.
