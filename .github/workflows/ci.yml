name: CI

on:
  # Not on every commit: run by hand when needed, plus once a week.
  workflow_dispatch:
  schedule:
    - cron: '29 1 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/narrative-context.mjs --check
      - run: pnpm test
      - run: pnpm build
