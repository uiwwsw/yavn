# assets:
#   characters:
#     detective:
#       base: assets/char/detective.webp
#       placement: prompt-top # 인물별 에셋 기준선. 생략 시 stage-bottom
#       facing: left # 원본 시선. 좌우 배치에서는 상대를 향하도록 자동 반전
#       defaultDelivery: deduction # 평상시 리듬, say.delivery/표정이 우선
#       calibration: { scale: 1.06, y: -2, spacing: 0.95 } # spacing은 PC 다인 구도의 최대 간격 보정
#   sfx:
#     alarm: root:/game-list/conan/assets/sfx/thunder.wav
# scene actions:
#   - camera: wide # 장소와 등장인물 전체를 보여 주는 설정 숏
#   - char: { id: detective, position: center, enter: none } # 아무 전환 없이 즉시 등장하고 기존 배우 자리도 cut
#   - char: { id: detective, position: center, enter: popIn } # 효과 문자열 단축형
#   - char:
#       id: witness
#       position: right
#       enter:
#         effect: slideLeft # none | fadeIn | wipeLeft | scaleIn | popIn | slideUp | slideDown | slideLeft | slideRight | wipeCenterX | wipeCenterY | blurIn | rotateIn
#         layout: push # push: 기존 인물도 자연스럽게 자리를 내줌, cut: 최종 자리로 즉시 변경
#         duration: 520 # 0..3000ms
#         easing: cubic-bezier(0.2, 0.72, 0.24, 1)
#         delay: 80 # 0..5000ms
#   - say: { char: detective, camera: medium, text: "보고할 게 있어." }
#   - camera: { shot: reaction, target: detective, transition: pan, duration: 460 }
#   - choice: { char: detective, camera: close, prompt: "문이 잠긴다. 뛸까?", options: [...] }

script:
  - scene: safety_choice
  - scene: all_done_check
  - scene: all_done_item_get
  - scene: all_done_after_item
  - scene: route_select
  - scene: early_exit_confirm
  - scene: penalty_branch
  - scene: penalty_3
  - scene: penalty_2
  - scene: penalty_1
  - scene: move_to_conclusion

inventory:
  clue_note:
    name: "현장 메모"
    description: "탐문 중 확인한 단서를 정리한 메모다."
    image: assets/bg/case_board.avif
    category: "수사자료"
    order: 10

scenes:
  safety_choice:
    actions:
      - choice:
          key: sample_safety_choice
          prompt: "붉은 경보등이 켜졌다. 어느 스위치를 누를까?"
          options:
            - text: "전원을 차단한다"
              goto: all_done_check
            - text: "경보를 무시하고 문을 연다"
              gameOver:
                title: "GAME OVER"
                message: "잠금 장치가 작동했다. 저장한 시점이나 현재 챕터의 시작점에서 다시 시도하자."
                recoverToChoice: sample_safety_choice

  all_done_check:
    actions:
      - say:
          when: { var: clue_note, op: eq, value: true }
          channel: record
          text: "확보한 현장 메모의 시간이 다음 판단과 맞물립니다."
      - branch:
          cases:
            - when:
                var: clue_note
                op: eq
                value: true
              goto: all_done_after_item
          default: all_done_item_get

  all_done_item_get:
    actions:
      - get: clue_note
      - say:
          channel: record
          text: "현장 메모가 사건 기록에 추가되었습니다."
      - sticker:
          id: clue_note_popup
          image: case_board
          width: 22
          y: 30
          inputLockMs: 500
      - effect:
          name: focus
          wait: true # 연출이 끝난 뒤 다음 액션으로 진행
      - effect:
          name: inkstamp
          wait: true
      - wait: 3000
      - clearSticker: clue_note_popup
      - goto: all_done_after_item

  all_done_after_item:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: move_to_conclusion
          default: route_select

  route_select:
    actions:
      - choice:
          key: sample_route_select
          prompt: "다음으로 대면할 인물을 고르자."
          timeoutMs: 7000
          timeoutOptionIndex: 0
          options:
            - text: "세이지"
              goto: /routes/seiji/1.yaml
            - text: "레이코"
              goto: /routes/reiko/1.yaml
            - text: "켄지"
              goto: /routes/kenji/1.yaml
            - text: "하루오"
              goto: /routes/haruo/1.yaml
            - text: "수집한 현장 메모를 공개한다"
              when: { var: clue_note, op: eq, value: true }
              goto: early_exit_confirm
            - text: "중간 정리 회의로 이동"
              goto: early_exit_confirm

  early_exit_confirm:
    actions:
      - say:
          delivery: nervous
          text: "<speed=26>지금 결론으로 가면 빈틈이 생겨.</speed> <speed=54>그래도 바로 이동할까?</speed>"
          wait: 900
          unskippable: true # 타이핑이 끝나기 전에는 클릭/Enter/Space로 넘길 수 없음
          autoAdvance: 2400
      - choice:
          key: sample_early_exit
          prompt: "지금 정리 회의로 넘어갈까?"
          forgiveOnceDefault: true
          forgiveMessage: "성급해. 이번 한 번은 정정할 기회를 줄게."
          options:
            - text: "아직 더 탐문한다"
              forgiveOnce: false
              goto: route_select
            - text: "지금 이동한다"
              forgiveMessage: "리스크가 커. 정말 지금 이동할지 다시 골라."
              set:
                early_exit_taken: true
              goto: penalty_branch

  penalty_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 3
              goto: penalty_3
            - when:
                var: investigation_count
                op: gte
                value: 2
              goto: penalty_2
          default: penalty_1

  penalty_3:
    actions:
      - add:
          final_confidence: -1
      - goto: move_to_conclusion

  penalty_2:
    actions:
      - add:
          deduction_score: -1
          final_confidence: -2
      - goto: move_to_conclusion

  penalty_1:
    actions:
      - add:
          deduction_score: -2
          final_confidence: -3
          trust: -1
          mistake_count: 1
      - goto: move_to_conclusion

  move_to_conclusion:
    actions:
      - use: clue_note
      - goto: /conclusion/1.yaml
