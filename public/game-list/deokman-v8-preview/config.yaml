  hidden_name:
    title: "장 끝 — 공주는 죽고, 덕만은 살았습니다"
    message: "덕만은 소화와 함께 별궁을 빠져나왔습니다. 공식 기록에는 죽은 사람으로 남은 채, 자신을 죽이려 한 사람을 찾기 시작합니다."
  marked_survivor:
    title: "또 다른 결말 — 열린 문, 드러난 얼굴"
