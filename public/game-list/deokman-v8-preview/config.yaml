  ash_witness:
    title: "또 다른 결말 — 불길 속에서 지킨 증거"
    message: "덕만은 거짓 사망 기록을 진평왕에게 건네 증거를 지켰습니다. 하지만 칠숙도 왕과 덕만이 함께 이 비밀을 지킨다는 사실을 알게 되었습니다."
