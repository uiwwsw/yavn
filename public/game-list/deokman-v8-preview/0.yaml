script:
  - scene: opening_record

scenes:
  opening_record:
    actions:
      - bg: peony_court
      - camera: wide
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(210px, 28%, 420px)"
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          channel: record
          delivery: calm
          wait: 600
          unskippable: true
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤."
      - say:
          channel: narration
          delivery: calm
          text: "누군가 덕만을 죽이기도 전에 사망 기록부터 만들어 두었습니다."
      - clearSticker:
          id: opening_death_register
          leave: fadeOut
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "전하께서 몰래 부르셨습니다. 사람들이 눈치채기 전에 돌아가야 합니다."
      - say:
          char: 어린 덕만
          camera: close
          with: [소화]
          text: "나를 찾는 사람이 궁 안에 있어?"
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "네. 그러니 제 곁에서 떨어지지 마세요."
      - goto: peony_arrives

  peony_arrives:
    actions:
      - say:
          channel: narration
          text: "덕만을 부른 사람은 진평왕이었습니다. 왕은 시종들을 물리고 호위 둘만 문밖에 남긴 뒤, 당나라 황제가 보낸 모란 그림을 펼쳤습니다."
      - sticker:
          id: peony_painting_view
          image: peony_painting_sticker
          x: 50
          y: 27
          width: "clamp(180px, 22%, 360px)"
          anchorX: center
          anchorY: center
          rotate: -1.5
          zIndex: 12
          enter: fadeIn
          inputLockMs: 320
      - get: peony_painting
      - char: { id: 진평왕, position: center }
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "덕만아, 이 그림에서 이상한 점을 찾아보아라."
      - choice:
          key: c1_peony_observation
          prompt: "모란 그림에서 무엇을 먼저 살피겠습니까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "그림에 없는 것을 찾는다"
              goto: observe_absence
            - text: "그림 뒤와 족자 축을 살핀다"
              goto: observe_back
            - text: "그림보다 방 안의 사람들과 바깥길을 살핀다"
              set: { observed_left_waterway: true }
              goto: observe_waterway

  observe_absence:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "꽃은 많은데 벌과 나비가 한 마리도 없습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "왜 그게 이상하지?"
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "꽃에 향기가 있다면 벌이나 나비가 찾아왔을 테니까요."
      - goto: king_question

  observe_back:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - say:
          channel: narration
          text: "덕만은 족자 아래쪽 나무축이 제대로 닫히지 않은 것을 발견했습니다. 축을 열자 접힌 문서와 반쯤 마른 붉은 도장 자국이 드러났습니다."
      - sticker:
          id: death_register_view
          image: death_register_sticker
          x: 51
          y: 29
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 2
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          channel: record
          delivery: deduction
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "전하, 제가 오늘 밤 죽는다고 적혀 있습니다. 전하의 도장도 있습니다."
      - clearSticker:
          id: death_register_view
          leave: fadeOut
      - goto: king_question

  observe_waterway:
    actions:
      - camera: wide
      - say:
          channel: narration
          text: "덕만은 그림보다 열린 창과 병사들의 움직임을 살폈습니다. 왼쪽 담 아래 배수로 덮개가 비뚤어져 있었습니다."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "왼쪽 배수로는 아이가 지나갈 만큼 열려 있습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그림을 보라 했는데 나갈 길부터 찾았구나."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "저를 찾는 사람이 궁 안에 있다고 들었습니다."
      - goto: king_question

  king_question:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - bg: peony_court
      - camera: medium
      - char: { id: 어린 덕만, position: left }
      - char: { id: 진평왕, position: center }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "이 모란에 향기가 있겠느냐?"
      - choice:
          key: c1_answer_king
          prompt: "왕에게 무엇을 대답하겠습니까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "벌과 나비가 없으니 향기도 없을 것입니다"
              set: { spoke_truth_to_king: true }
              goto: answer_scent
            - text: "꽃보다 먼저, 족자 뒤에서 찾은 제 사망 기록을 보여 드리겠습니다"
              when: { var: death_register, op: eq, value: true }
              set: { spoke_truth_to_king: true }
              goto: answer_record
            - text: "그림일 뿐이라 실제 향기는 알 수 없습니다"
              goto: answer_literal

  answer_scent:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "벌과 나비가 없으니 향기도 없을 것입니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "맞다. 당나라 황제는 향기 없는 모란으로, 신라에 왕위를 이을 아들이 없다는 사실을 비웃었다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "네가 그림에 숨긴 조롱을 알아보는지 보고 싶었다."
      - goto: king_warning

  answer_record:
    actions:
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "누가 제가 오늘 밤 죽는다고 적고 전하의 도장을 찍은 겁니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내가 만든 기록이 아니다. 누군가 내 도장을 훔쳐 네 죽음을 미리 적었다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "오늘 저를 죽여 이 문서를 진짜로 만들려는 거군요."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그래. 반드시 살아남아라."
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - goto: king_warning

  answer_literal:
    actions:
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그림일 뿐이라 실제 향기는 알 수 없습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그림의 냄새를 묻는 게 아니다. 벌과 나비가 없는 이유를 생각해 보아라."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "신라에 왕위를 이을 아들이 없다는 걸 빗댄 겁니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "그래. 당나라 황제는 그걸 조롱한 것이다."
      - goto: king_warning

  king_warning:
    actions:
      - camera: medium
      - char: { id: 진평왕, position: center }
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내게 아들이 없자 귀족들은 네 쌍둥이 언니 천명과 너를 서로 다른 후계자로 내세웠다."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그래서 저를 숨기셨습니까?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "두 편이 충돌하는 걸 막고 너를 살리려 했다. 하지만 누군가 네 존재를 알아냈다."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그 사람이 사망 기록도 만들었군요."
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래. 오늘 밤 너를 죽이고 기록을 사실로 만들 생각이다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [진평왕, 어린 덕만]
          text: "전하, 서쪽 처마에서 기름 냄새가 납니다."
      - say:
          char: 진평왕
          camera: close
          with: [소화, 어린 덕만]
          text: "소화, 덕만을 데리고 나가라."
      - goto: fire_breaks

  fire_breaks:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          channel: narration
          camera: medium
          delivery: nervous
          wait: 450
          unskippable: true
          text: "불붙은 들보가 덕만의 바로 앞에 떨어졌습니다. 불길이 마루를 가르며 출구를 하나씩 삼키기 시작했습니다."
      - say:
          channel: narration
          delivery: nervous
          autoAdvance: 900
          text: "연기가 내려앉습니다. 오래 생각할 시간이 없습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "불이 꺼지면 공주는 열병으로 죽었고 시신은 불탔다고 기록하겠습니다."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [칠숙]
          text: "당신이 제 사망 기록을 만든 겁니까?"
      - say:
          char: 칠숙
          camera: close
          with: [어린 덕만]
          text: "오늘 밤이 지나면 아무도 그 기록을 거짓이라고 말할 수 없을 겁니다."
      - char: { id: 소화, position: center, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          wait: 350
          unskippable: true
          text: "아기씨, 몸을 낮추세요. 불꽃보다 연기가 먼저 사람을 쓰러뜨립니다. 움직여야 합니다."
      - say:
          channel: narration
          text: "소화는 옷깃 안에 숨겨 둔 청동 모란패를 꺼내 덕만의 손에 쥐여 주었습니다."
      - sticker:
          id: peony