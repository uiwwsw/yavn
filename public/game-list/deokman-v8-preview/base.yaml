    category: "왕실 물품"
    order: 10
  death_register:
    name: "위조된 덕만의 사망 기록"
    description: "덕만의 이름을 왕실 족보에 처음 올리면서 사망 시각을 오늘 밤으로 적은 위조 문서입니다. 아래에는 진평왕의 도장이 찍혀 있습니다."
    image: root:/game-list/deokman-v8-preview/assets/items/death-register.svg
    category: "금지된 기록"
    order: 20
  peony_token:
    name: "청동 모란패"
    description: "왕실 안쪽 문을 통과할 수 있는 표식입니다. 문을 열 수 있지만, 보여 주는 순간 덕만이 왕실 사람이라는 사실도 드러납니다."
    image: root:/game-list/deokman-v8-preview/assets/items/peony-token.svg
    category: "신분 표식"
    order: 30
