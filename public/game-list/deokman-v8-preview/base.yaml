inventory:
  peony_painting:
    name: "향기 없는 모란도"
    description: "꽃은 가득하지만 벌과 나비는 한 마리도 그려지지 않은 모란 그림입니다. 진평왕은 덕만이 빠진 것을 알아보는지 확인하려 했습니다."
