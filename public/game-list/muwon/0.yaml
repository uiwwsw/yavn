chapterTitle: "우물 속 신부"

script:
  - scene: well_opening
  - scene: name_entry
  - scene: night_call
  - scene: chart_intro

scenes:
  well_opening:
    title: "우물가"
    actions:
      - bg: { id: well_night, transition: cut }
      - music: night_well
      - say:
          channel: action
          with: []
          text: "한밤중에 한성부에서 사람이 왔다. 우물에서 건진 여인을 살펴 달라고 했다. 우물가에 닿으니 등잔 아래 거적이 보인다."
          continueLabel: "거적을 걷는다"
      - effect: focus
      - sticker: { id: first_thread, image: thread_sticker, x: 50, y: 34, width: "clamp(160px, 22%, 280px)", enter: fadeIn }
      - say:
          channel: action
          with: []
          sound: well_rope
          text: "거적을 들추자 젖은 손이 드러난다. 손톱 밑에 남빛 실 한 올이 끼어 있다."
      - clearSticker: { id: first_thread, leave: fadeOut }

  name_entry:
    title: "우물가의 신고서"
    actions:
      - bg: { id: well_night, transition: cut }
      - say:
          channel: record
          with: []
          camera: wide
          sound: paper
          text: "정조 십육년 구월 스무하루. 한성 남부 훈도방. 분이, 열아홉. 익사로 신고됨."
      - char: { id: 서연, position: left }
      - say:
          channel: thought
          with: [서연]
          text: "혜민서 의녀가 된 지 한 달이다. 밤중에 불려 나온 건 오늘이 처음이다."
      - say:
          channel: action
          with: [서연]
          text: "신고서 옆에 초검 기록을 펼친다. 죽은 까닭을 적는 칸에 붓을 대려다 멈춘다."
      - wait: 250
  night_call:
    title: "혼례 전날 밤"
    actions:
      - bg: { id: well_night, transition: fade, duration: 900 }
      - music: night_well
      - place: "한성 남부 훈도방 · 혼례 전날 밤"
      - say:
          channel: action
          with: []
          camera: wide
          text: "담 너머에서 누가 내일 혼례는 어쩌느냐고 묻는다. 아무도 대답하지 않는다."
      - wait: 250
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          with: [서연]
          text: "거적은 잠깐 덮어 둬요. 판관 나리 오시면 다시 걷을 거요."
      - say:
          char: 막쇠
          with: [서연]
          text: "난 오작인 막쇠요. 의녀가 오면 같이 보라더군."
      - say:
          char: 서연
          with: [막쇠]
          text: "혜민서 의녀 {{player_name|이라}} 합니다."
      - say:
          char: 막쇠
          with: [서연]
          text: "나이가 어찌 되우? 열일곱쯤 됐나."
      - say:
          char: 서연
          with: [막쇠]
          text: "열여덟입니다."
      - say:
          char: 막쇠
          with: [서연]
          text: "속이 안 좋으면 담 밖으로 나가요. 우물 안엔 말고."
      - say:
          char: 서연
          with: [막쇠]
          text: "괜찮습니다. 등잔은 여기 두셔도 돼요."
      - say:
          char: 서연
          with: [막쇠]
          text: "우물에 빠진 사람을 어떻게 살피는지는 읽어 뒀어요."
      - say: { char: 막쇠, with: [서연], text: "뭘 읽어 왔수?" }
      - say:
          channel: action
          with: []
          text: "품에서 책을 꺼낸다. 한문 옆에 한글이 빼곡한 『무원록 언해』."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "허. 그게 한글로 나왔다더니 진짜네."
      - say:
          char: 막쇠
          with: [서연]
          text: "난 사십 년을 그림만 봤는데."
      - char: { id: 도원, position: center }
      - say:
          char: 도원.stern
          with: [서연, 막쇠]
          text: "한성부 판관 김도원이오."
      - say:
          char: 도원.stern
          with: [서연, 막쇠]
          text: "마을 사람들은 분이가 혼례를 겁내 우물에 몸을 던졌다고 하더군."
      - say:
          char: 도원.stern
          with: [서연]
          text: "날이 밝기 전에 시장을 올려야 하오. 시신을 살핀 기록 말이오."
      - say:
          char: 도원.stern
          with: [서연]
          text: "의녀는 몸만 확인해 주시오. 죽은 까닭은 내가 적겠소."
      - say: { char: 서연, with: [도원], text: "…네." }
      - say:
          char: 서연
          with: [도원, 막쇠]
          text: "나리, 손톱 밑에 남빛 실이 있습니다. 다른 데도 마저 살핀 뒤 말씀드리겠습니다."
      - say:
          channel: action
          with: []
          continueLabel: "시형도를 펼친다"
          text: "막쇠가 등잔을 낮춘다. 몸의 앞모습을 그려 둔 종이를 꺼낸다."

  chart_intro:
    title: "시형도"
    actions:
      - bg: { id: sihyeongdo, transition: dissolve, duration: 720 }
      - music: inquest
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          channel: record
          text: "몸을 그린 이 종이가 시형도다. 살핀 곳에 본 것을 적는다."
      - say:
          char: 막쇠
          with: [서연]
          text: "물에서 건진 송장은 우선 세 군데부터 봐요."
      - say:
          char: 막쇠
          with: [서연]
          text: "입이랑 코, 손톱, 목."
      - goto: c1_examine

  c1_examine:
    title: "분이의 몸"
    actions:
      - choice:
          key: c1_examine
          presentation: explore
          prompt: "열아홉 살 분이. 어디부터 볼까?"
          with: []
          camera: wide
          options:
            - text: "입과 코"
              at: { x: 62, y: 9 }
              when: { var: c1_mouth, op: eq, value: false }
              goto: c1_mouth_scene
            - text: "손톱"
              at: { x: 30, y: 92 }
              when: { var: c1_nails, op: eq, value: false }
              goto: c1_nails_scene
            - text: "목"
              at: { x: 66, y: 22 }
              when: { var: c1_neck, op: eq, value: false }
              goto: c1_neck_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c1_mouth, op: eq, value: true }
                  - { var: c1_nails, op: eq, value: true }
                  - { var: c1_neck, op: eq, value: true }
              goto: c1_reasoning

  c1_mouth_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "입을 살짝 벌리고 콧속도 들여다본다. 물기는 있는데 거품은 없다."
      - say:
          char: 막쇠
          with: [서연]
          text: "산 채로 빠지면 숨을 들이켜요."
      - say:
          char: 막쇠
          with: [서연]
          text: "그럼 입이고 코고 흰 거품이 몽글몽글 올라와."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "그럼 산 채로 물에 빠졌다고 단정할 순 없겠네요."
      - set: { c1_mouth: true }
      - goto: c1_examine

  c1_nails_scene:
    actions:
      - sticker:
          id: c1_thread
          image: thread_sticker
          x: 50
          y: 34
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "등잔을 낮춰 오른손을 본다. 실이 낀 손톱과 그 옆 손톱이 뿌리 가까이 부러져 있다."
      - say:
          char: 막쇠
          with: [서연]
          text: "어. 할퀸 거요."
      - say:
          char: 막쇠
          with: [서연]
          text: "살을 긁었으면 그놈 손등이나 팔에 자국이 남았을 거고."
      - say:
          channel: thought
          with: []
          text: "몇 시진을 물에 있었는데 실이 안 빠졌다."
      - get: blue_thread
      - clearSticker: { id: c1_thread, leave: fadeOut }
      - set: { c1_nails: true }
      - goto: c1_examine

  c1_neck_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "고개를 옆으로 돌려 목을 본다. 살은 물에 불었고, 겉으로 보이는 자국은 없다."
      - say:
          channel: thought
          with: []
          text: "언해 서른두 장. 맨눈에 안 보이는 멍은 술지게미와 식초로 드러낼 수 있다."
      - say:
          char: 서연
          with: [막쇠]
          text: "막쇠 아저씨. 주막에서 술지게미하고 식초를 좀 얻어 주실래요?"
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "송장 살피는 데 쓴다 하면 주모가 놀라겠구먼."
      - say:
          channel: action
          with: []
          continueLabel: "지게미를 덮고 기다린다"
          text: "젖은 천 위로 시큼한 지게미를 고루 펴 바른다. 등불 심지를 한 번 자른다."
      - effect: focus
      - say:
          channel: action
          with: []
          text: "천을 걷는다. 목 앞쪽에 엄지 자국이 있고, 양옆으로 손가락 자국이 드러났다."
      - say:
          char: 막쇠
          with: [서연]
          text: "허."
      - say:
          char: 막쇠
          with: [서연]
          text: "엄지가 앞에 있네. 마주 보고 조른 거요."
      - get: first_sijang
      - set: { c1_neck: true }
      - goto: c1_examine

  c1_reasoning:
    title: "죽음의 까닭"
    actions:
      - bg: { id: well_night, transition: dissolve, duration: 620 }
      - music: night_well
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.stern
          with: [서연]
          text: "말해 보시오. 이 여인은 어찌 죽었소."
      - choice:
          key: c1_cause
          prompt: "분이의 죽음을 시장에 어떻게 적을까?"
          char: 도원
          with: [서연, 도원]
          options:
            - text: "발을 헛디뎌 빠져 죽었다"
              goto: c1_cause_wrong_fall
            - text: "목이 졸린 뒤 우물에 던져졌다"
              goto: c1_cause_right
            - text: "스스로 몸을 던졌다"
              goto: c1_cause_wrong_self

  c1_cause_wrong_fall:
    actions:
      - say:
          char: 막쇠
          with: [서연]
          text: "입에 거품이 있었수, 아가씨? 물에 빠져 숨을 못 쉰 흔적부터 봐야지."
      - say:
          channel: thought
          text: "없었다. 다시 생각하자."
      - goto: c1_reasoning

  c1_cause_wrong_self:
    actions:
      - say:
          char: 도원
          with: [서연]
          text: "그럼 목의 손자국은 누가 낸 것이오? 제 손으로는 저리 못 조르오."
      - say:
          channel: thought
          text: "목에 남은 엄지 자국을 다시 본다."
      - goto: c1_reasoning

  c1_cause_right:
    actions:
      - add: { trust_dowon: 1 }
      - say:
          char: 서연.resolve
          with: [도원]
          text: "입과 코에 거품이 없고, 목에는 손자국이 있습니다. 죽인 뒤에 던졌습니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…허."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…자진으로 올리면 오늘 밤 일이 끝났을 텐데."
      - say:
          char: 도원
          with: [서연]
          text: "좋소."
      - say:
          char: 도원
          with: [서연]
          text: "그렇게 쓰겠소. 누가 죽였는지는 더 밝혀야 하오."
      - goto: c1_brother

  c1_brother:
    title: "오라비"
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 강치수, position: right }
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "포도청 포교 강치수요."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "범인은 잡았소. 죽은 년 오라비요."
      - say:
          char: 강치수
          with: [서연, 도원]
          text: "노름빚 갚는다고 분이 혼수 비단을 팔자다가 저녁에 크게 싸웠답디다."
      - say:
          char: 강치수
          with: [서연, 도원]
          text: "동네가 다 들었소."
      - say:
          channel: narration
          text: "포졸 둘이 사내 하나를 끌고 온다. 짚신 한 짝이 벗겨진 채, 사내는 소매로 눈가를 문지르고 있다."
      - say:
          channel: thought
          with: [강치수]
          text: "걷힌 소매 아래로 팔뚝이 드러난다. 손등과 팔에 긁힌 자국이 없다."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "판관 나리, 이놈 곤장 열 대면 다 불 거요. 데려가겠소."
      - choice:
          key: c1_accuse
          prompt: "포교가 오라비를 끌고 가려 한다."
          char: 강치수
          with: [서연, 도원, 강치수]
          options:
            - text: "오라비의 손을 확인한다"
              saveText: "오라비의 손을 보여 달라고 한다"
              goto: c1_show_hands
            - text: "오라비를 포도청에 넘긴다"
              goto: c1_bad_brother
            - text: "실의 출처를 조사한다"
              saveText: "실의 출처부터 쫓겠다고 한다"
              goto: c1_follow_thread

  c1_bad_brother:
    actions:
      - bg: { id: jail, transition: fade, duration: 800 }
      - music: pressure
      - say:
          channel: narration
          text: "이튿날 아침, 오라비는 곤장 열두 대 끝에 누이를 죽였다고 말했다."
      - say:
          channel: narration
          text: "손등에 긁힌 자국이 있는지 공초에는 한 줄도 없었다."
      - say:
          channel: record
          text: "포도청 공초. 훈도방 김가, 누이 분이를 목 졸라 우물에 던졌다고 자복함."
      - say:
          channel: thought
          with: []
          text: "분이 손톱 밑의 실은 이 사람 옷에서 나온 게 아니었다."
      - gameOver:
          title: "곤장 아래의 자백"
          message: "분이의 손톱은 부러졌는데 오라비의 손등과 팔에는 생채기 하나 없었다."
          recoverToChoice: c1_accuse

  c1_show_hands:
    actions:
      - add: { trust_dowon: 1 }
      - say:
          char: 서연
          with: [강치수, 도원]
          text: "포교 나리."
      - say:
          char: 서연
          with: [강치수, 도원]
          text: "저 사람 손을 앞으로 내밀게 해 주세요."
      - say:
          channel: action
          with: [강치수]
          text: "사내가 떨리는 손을 내민다. 손등, 손목, 팔뚝까지 생채기 하나 없다."
      - say:
          char: 서연.resolve
          with: [강치수, 도원]
          text: "분이 손톱이 두 개나 부러졌습니다. 이 사람 손등과 팔에는 긁힌 데가 없어요."
      - say:
          char: 강치수
          with: [서연]
          text: "…뭐."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "…계집이 시장 한 장 들고 포도청 일을 가르치려 드네."
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "의녀가 손부터 보자고 한 것이오. 포교, 오늘은 놓아주시오."
      - set: { c1_brother: true }
      - goto: c1_follow_thread

  c1_follow_thread:
    title: "남빛 실"
    actions:
      - char: { id: 서연, position: left }
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "좋소. 나리 고집대로 하시오."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "사흘이오. 그 안에 범인 못 내놓으면 이놈 다시 데려가오."
      - sticker:
          id: c1_thread_end
          image: thread_sticker
          x: 50
          y: 34
          width: "clamp(150px, 20%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "가만. 그 실 좀 봅시다."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "이 짙은 색은 쪽을 여러 번 들여야 나오는 감청이오."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "육의전 비단전에 그런 실이 있어요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "내가 아는 데 중엔 여금이네만 이 색을 팔아요."
      - say:
