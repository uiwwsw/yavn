title: "무원 — 한성 검안록"
pov: "의녀 {{player_name}}"
author:
  name: "uiwwsw"
version: "1.2.0"
seo:
  description: "1792년 한성. 혜민서 의녀 서연이 한글로 풀어 쓴 검시 지침서를 따라 세 죽음의 까닭을 좇습니다. 시형도에서 시신의 흔적을 살피고, 찾아낸 증거로 포도청의 자백을 뒤집는 5장 추리극입니다. 결말은 네 가지입니다."
  keywords:
    - "조선 추리"
    - "검시"
    - "무원록"
    - "역사 비주얼노벨"
    - "추리 게임"
    - "선택형 이야기"
  image: "assets/share/og.png"
  imageAlt: "기와지붕과 등잔이 보이는 밤의 우물가"
textSpeed: 30
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: paper-stage
startScreen:
  enabled: true
  music: assets/music/night-well.flac
  image: assets/bg/title.svg
  imagePosition: "50% 50%"
  mobileImagePosition: "77% 50%"
  showTitle: true
  titleColor: "#f0d9a8"
  startButtonText: "검안 시작"
  buttonPosition: bottom-left
  eyebrow: "1792 한성 · 검시 추리극 · 5장 · 결말 4종"
  subtitle: "혼례를 앞둔 분이가 우물에서 건져졌다. 신고서에는 벌써 익사라고 적혀 있다."
  scene:
    layout: split
    motion: drift
    duration: 26000
    parallax: 12
    particles: dust
    intensity: 0.5
    fog: true
    light: breathe
    accent: "#bf8156"
endings:
  muwon:
    title: "무원(無冤)"
    message: "형조가 한명재에게 죄를 물었다. 덕구는 다시 지게를 졌고, 판결문에는 오작인 막쇠의 이름이 올랐다."
    epilogue: "그해 겨울부터 한성부 검안에는 의녀 한 사람의 이름이 함께 적혔다."
    background: dawn_gate
    music: dawn
    tone: hopeful
  late_muwon:
    title: "늦은 무원"
    message: "판결문이 돌았다. 이 소식을 함께 듣고 싶던 사람은 성문이 열릴 때도 오지 않았다."
    epilogue: "{{player_name|은}} 시장 맨 아래 칸을 비워 두었다. 거기 쓸 이름은 한동안 잊지 못했다."
    background: dawn_gate
    music: dawn
    tone: tragic
  covered_ledger:
    title: "덮인 장부"
    message: "증거가 모자랐다. 한명재는 웃으며 형조를 나섰고, {{player_name|은}} 혜민서 명부에서 지워졌다."
    epilogue: "{{player_name|은}} 그날 밤 시장 석 장을 베껴 언해 뒷장에 끼워 두었다."
    background: alley_night
    music: night_well
    tone: mystery
  price_of_silence:
    title: "침묵의 값"
    message: "덕구는 풀려났고 관아는 더 조사하지 않았다. 다음 장날에도 가짜 청심원이 팔렸다."
    epilogue: "{{player_name|은}} 그 뒤로 감청 주머니를 볼 때마다 걸음을 멈췄다."
    background: hyeminseo
    music: night_well
    tone: tragic
defaultEnding: covered_ledger
