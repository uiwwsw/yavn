chapterTitle: "무원"

script:
  - scene: trial_open
  - scene: standing

scenes:
  trial_open:
    title: "형조 대청"
    actions:
      - bg: { id: hyeongjo_hall, transition: fade, duration: 900 }
      - music: pressure
      - set: { credibility: 3, truth: 0 }
      - say:
          channel: record
          text: "시월 초하루. 형조 대청. 피고 전의감 의관 한명재. 고발인 한성부 판관 김도원."
      - say:
          channel: action
          with: []
          camera: wide
          text: "도원이 보낸 고발장이 대청 한가운데 놓여 있다. 피고는 그 너머 자리에 앉았다. 버선 앞코에 흙 한 점 묻지 않았다."
      - char: { id: 서연, position: left }
      - char: { id: 한명재, position: right }
      - say:
          char: 한명재
          with: [서연]
          text: "전의감 의관 한명재입니다. 판관께서 고발하셨으니 묻는 말에 답하겠습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "다만 하나만 여쭙겠습니다. 저 아이가 올해 몇 살입니까?"
      - say:
          char: 한명재.cold
          with: [서연]
          text: "열여덟 의녀와 오작인의 말을 근거로 저를 고발하셨다지요?"
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그들이 형조 대청에서 증언할 자격이 있습니까?"
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: true }
          with: []
          text: "막쇠가 신을 벗어 마루 아래 내려놓는다. 포졸이 앞을 막자 흙마당에 그대로 서 있다."
      - say:
          channel: thought
          with: []
          text: "의녀는 의관에게 말을 올리지 못한다. 판관을 통해야 한다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀께서 여러 날 애쓰셨다더군요."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "혜민서에서 사람을 얼마나 살리셨는지는 아직 들어 보지 못했습니다만."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "참의 나리. 이 의녀의 말만으로 저를 살인범이라 부르실 셈입니까?"
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "제가 살핀 시신이 셋입니다. 그 기록을 보시지요."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "허."
      - say:
          char: 한명재
          motion: laugh
          with: [서연]
          text: "참의 나리, 저 아이가 올린 것이 판관의 검안 기록으로 통하는 겁니까?"
      - say:
          channel: record
          text: "품에서 베껴 쓴 『신주무원록』 한 권을 꺼낸다. 접어 둔 귀퉁이는 손때로 까맣다."
      - say:
          channel: thought
          with: []
          text: "스승이 물려준 책이다. 빈 곳마다 내가 알아본 것을 적었다."
      - goto: standing

  standing:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - branch:
          cases:
            - when: { var: struck_deal, op: eq, value: true }
              goto: standing_deal
          default: standing_trust

  standing_deal:
    actions:
      - char: { id: 강치수, position: right }
      - say:
          char: 한명재
          with: [서연, 강치수]
          text: "참의 나리, 포도청에서 이미 조사를 끝낸 일입니다."
      - say:
          char: 강치수.angry
          with: [서연, 한명재]
          text: "박씨 약방은 실화로 처리했고, 분이는 범인을 찾지 못했습니다. 의녀도 그 자리에 있었습니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "덕구를 풀어 주면 따르겠다고 하셨지요."
      - say:
          char: 강치수
          with: [서연]
          text: "…참."
      - say:
          channel: thought
          with: []
          text: "덕구는 살았다. 그 뒤에도 장에는 남빛 약주머니가 나왔다."
      - say:
          char: 서연
          with: [한명재]
          text: "예. 그때는 덕구를 살리려고 더 묻지 않았습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "오늘은 물어야겠습니다. 그 뒤에도 같은 약주머니가 나왔습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "그날과 오늘 말이 다르니, 어느 쪽을 믿을지는 참의 나리께서 정하시겠지요."
      - add: { credibility: -1 }
      - say:
          channel: record
          text: "앞서 한 말과 달라 증언의 신뢰가 1 줄었다."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "아가씨."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "나도 틀렸다고 뒤늦게 말한 적이 많수. 오늘 본 대로 얘기해요."
      - goto: standing_trust

  standing_trust:
    actions:
      - branch:
          cases:
            - when: { var: trust_dowon, op: gte, value: 2 }
              goto: standing_vouched
          default: standing_doubted

  standing_vouched:
    actions:
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "내가 초검관으로 검안에 함께했소."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "의녀가 본 것은 내 눈으로 다 확인했소. 내 이름으로 증언하겠소."
      - say:
          channel: thought
          with: [도원]
          text: "우물가에서 몸만 확인하라던 사람이 직접 나섰다."
      - goto: round1

  standing_doubted:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 도원.troubled
          with: [서연, 한명재]
          text: "…의녀의 검안이 틀린 적은 없었소. 그 이상은 장담하지 못하겠소."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "판관께서도 확신이 없으시군요. 그럼 의녀의 말은 반만 듣지요."
      - say:
          channel: record
          text: "판관이 증언을 보증하지 않아 신뢰가 1 줄었다."
      - goto: round1

  round1:
    title: "첫째 죽음"
    actions:
      - say:
          char: 한명재
          with: [서연, 한명재]
          text: "비단전 침모 분이가 혼례가 두려워 제 발로 우물에 뛰어들었다고 들었습니다."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "저와 무슨 상관입니까."
      - choice:
          key: t1
          prompt: "분이가 스스로 들어가지 않았다는 증좌는?"
          char: 한명재
          options:
            - text: "분이의 시장 — 거품 없음, 목의 손자국"
              goto: round1_right
            - text: "은비녀 — 검게 변하지 않았다"
              goto: round1_wrong
            - text: "얼음 출납부 — 열 덩이 반출"
              goto: round1_wrong

  round1_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "은비녀요? 얼음이요? 우물 이야기를 하고 있습니다만."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round1_retry

  round1_retry:
    actions:
      - choice:
          key: t1_retry
          prompt: "다시 살펴보자. 분이의 사인을 밝힐 증좌는?"
          char: 한명재
          options:
            - text: "분이의 시장 — 거품 없음, 목의 손자국"
              goto: round1_right
            - text: "주머니 주문서 — 감청 주머니 삼백"
              goto: round1_lost

  round1_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "주문서는 장사 문서지요. 사람이 어찌 죽었는지는 말해 주지 않습니다."
      - say:
          channel: thought
          with: [한명재]
          text: "분이의 몸에서 본 것을 먼저 내놓았어야 했다."
      - goto: round2

  round1_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_sijang
          image: sijang_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "입과 코에 거품이 없었습니다. 산 채로 물에 빠졌다고 보기 어렵습니다."
      - say:
          char: 서연
          text: "검안 때 목에 손가락 자국이 드러났습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "엄지 자국이 목 앞에 있었습니다. 누군가 마주 보고 목을 조른 겁니다."
      - say:
          char: 한명재
          with: [서연]
          text: "그래서요."
      - clearSticker: { id: t_sijang, leave: fadeOut }
      - say:
          char: 한명재
          with: [서연]
          text: "설령 누가 목을 졸랐다고 해도, 그게 저라는 증거가 있습니까?"
      - goto: round2

  round2:
    title: "감청 주머니"
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "분이 손톱 밑에 감청 실이 있었다지요. 육의전 물건은 누구든 살 수 있습니다."
      - choice:
          key: t2
          prompt: "그 주머니를 산 사람을 가리킬 증좌는?"
          char: 한명재
          options:
            - text: "상처 탁본 — 폭 한 치"
              goto: round2_wrong
            - text: "주머니 주문서 — 붉은 표식"
              goto: round2_right
            - text: "덕구의 낫 — 날 폭 두 치"
              goto: round2_wrong

  round2_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "의녀께서 주머니와 칼을 헷갈리시는군요."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round2_retry

  round2_retry:
    actions:
      - choice:
          key: t2_retry
          prompt: "다시. 주머니를 주문한 집은?"
          char: 한명재
          options:
            - text: "주머니 주문서 — 붉은 표식"
              goto: round2_right
            - text: "가짜 청심원 — 속이 석회"
              goto: round2_lost

  round2_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "약이 가짜라 해도 누가 주문했는지는 모르지 않습니까."
      - goto: round3

  round2_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_slip
          image: order_slip_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "분이가 저고리 안섶에 꿰매 둔 주문서입니다. 감청 주머니 삼백 개. 주문한 집란엔 붉은 표식이 있습니다."
      - char: { id: 여금, position: center }
      - say:
          char: 여금
          when: { var: trust_yeogeum, op: gte, value: 1 }
          with: [서연, 한명재]
          text: "제가 주머니를 전의감 약고에 가져다줬어요. 약고 문에도 똑같은 표식이 달려 있었고요."
      - say:
          char: 여금.wary
          when: { var: trust_yeogeum, op: lte, value: 0 }
          with: [서연, 한명재]
          text: "주문은 받았어요. 누가 맡겼는지는 묻지 마세요. 나도 살아야 하니까."
      - say:
          char: 서연
          when: { var: trust_yeogeum, op: lte, value: 0 }
          with: [한명재]
          text: "이 표식, 전의감 약고 문에 걸린 것과 같습니다. 판관 나리가 오늘 아침 확인했습니다."
      - clearSticker: { id: t_slip, leave: fadeOut }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "전의감에는 의관이 열이 넘습니다. 그중 왜 저입니까."
      - goto: round3

  round3:
    title: "둘째 죽음"
    actions:
      - say:
          channel: action
          with: []
          camera: wide
          text: "한명재가 처음으로 자리를 고쳐 앉는다. 소매를 한 번 쓸어내린다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀께 묻겠습니다. 그 책, 누가 주셨습니까."
      - say:
          char: 서연
          with: [한명재]
          text: "혜민서에 계셨던 박 의녀님입니다. 재작년에 돌아가셨어요."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그분 손에서 아이가 둘 죽었습니다. 기록에 있습니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그분이 베껴 준 책을 들고 와서 제 검안이 틀렸다 하시는군요."
      - say:
          char: 서연.shock
          with: [한명재]
          text: "두 아이는 혜민서에 업혀 왔을 때 이미 숨이 가빴습니다."
      - say:
          char: 서연.shock
          with: [한명재]
          text: "기록 다음 장에 적혀 있습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "다음 기록도 읽어 보셨군요. 그럼 제 말도 끝까지 들어 주시지요."
      - say:
          char: 도원.troubled
          when: { var: trust_dowon, op: lte, value: 1 }
          with: [서연, 한명재]
          text: "의관, 박 의녀의 진료를 따지는 자리가 아니오. 박씨 약방 이야기로 돌아갑시다."
      - say:
          char: 도원.stern
          when: { var: trust_dowon, op: gte, value: 2 }
          with: [서연, 한명재]
          text: "의관. 그 책은 내가 빌려 읽었소."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "누가 베낀 책이든, 의녀가 내놓은 증거부터 봅시다."
      - say:
          char: 한명재
          with: [서연]
          text: "박씨는 약방에 불이 나서 죽었습니다. 짐꾼도 불을 질렀다고 자복했고요."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "저와는 무관합니다."
      - choice:
          key: t3
          prompt: "박씨가 불이 나기 전에 죽었다는 증좌는?"
          char: 한명재
          options:
            - text: "감청 실 — 비단전 물건"
              goto: round3_wrong
            - text: "윤길이 베껴 쓴 문서 · 붉게 표시한 이름"
              saveText: "윤길의 베껴 쓴 장 — 붉은 동그라미"
              goto: round3_wrong
            - text: "닭 실험 기록 · 독살의 단서"
              saveText: "닭 실험 기록 — 불 전에 독"
              goto: round3_right

  round3_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그건 불과 아무 상관이 없군요."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round3_retry

  round3_retry:
    actions:
      - choice:
          key: t3_retry
          prompt: "다시. 박씨는 어떻게 죽었나?"
          char: 한명재
          options:
            - text: "닭 실험 기록 · 독살의 단서"
              saveText: "닭 실험 기록 — 불 전에 독"
              goto: round3_right
            - text: "탄 장부 조각 — 청심원 삼백 환"
              goto: round3_lost

  round3_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "장부에 '한' 자 하나. 한성에 한씨가 몇이나 되는지 아십니까."
      - goto: round4

  round3_right:
    actions:
      - add: { truth: 1 }
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "박씨 콧속엔 그을음이 없었습니다. 독이 있는지 알아보려던 검시에서는 닭이 쓰러졌고요."
      - say:
          char: 서연
          text: "처음에는 은비녀에 아무 변화가 없었습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "그 비녀만 보고 노환이라고 적었으면 독이 든 줄도 모르고 넘겼겠지요."
      - say:
          char: 덕구
          when: { var: deokgu_saved, op: eq, value: true }
          with: [한명재]
          text: "저, 저는 약이라곤 사 본 적도 없어요. 낫도 풀 벨 때만 썼고요."
      - say:
          channel: thought
          when: { var: deokgu_saved, op: eq, value: false }
          with: [한명재]
          text: "덕구가 했다는 말은 공초에 남아 있다. 이제 듣고 싶은 건 그 종이 바깥에 있는 말인데."
      - goto: round4

  round4:
    title: "셋째 죽음"
    actions:
      - say:
          char: 한명재.cold
          with: [서연]
          text: "서리 윤길은 얼음 곳간에 혼자 갔다지요."
      - say:
          char: 한명재.cold
          with: [서연, 도원]
          text: "출납부에 제 이름이 있습니까? 없을 겁니다."
      - choice:
          key: t4
          prompt: "얼음을 받아 간 사람이 한명재라는 걸 무엇으로 밝힐까?"
          char: 한명재
          timeoutMs: 15000
          timeoutOptionIndex: 0
          options:
            - text: "분이의 시장 — 목의 손자국"
              goto: round4_wrong
            - text: "전의감 도장 — 깨진 모서리"
              goto: round4_right
            - text: "은비녀 — 검게 변하지 않았다"
              goto: round4_wrong

  round4_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "의녀께서 지치셨나 봅니다. 증좌가 다 뒤섞이는군요."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round4_retry

  round4_retry:
    actions:
      - choice:
          key: t4_retry
          prompt: "마지막. 출납부의 붉은 도장은 누구의 것인가?"
          char: 한명재
          options:
            - text: "전의감 도장 — 깨진 모서리"
              goto: round4_right
            - text: "얼음 출납부 — 열 덩이 반출"
              goto: round4_lost

  round4_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "얼음 열 덩이. 약재를 차게 두는 데 쓰지요."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "전의감은 늘 얼음을 씁니다."
      - goto: final_link

  round4_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_seal
          image: seal_mark_sticker
          x: 38
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
      - sticker:
          id: t_ice
          image: ice_ledger_sticker
          x: 64
          y: 30
          width: "clamp(160px, 22%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - char: { id: 도원, position: center }
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "출납부와 가짜 청심원 상자의 도장을 보십시오. 오른쪽 아래가 똑같이 깨졌습니다."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "전의감에서 도장을 찍어 둔 장부와 대 보았소."
      - say:
          char: 도원.stern
          with: [한명재]
          text: "저 도장을 받아 간 사람은 의관 한명재요."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 도원]
          text: "어이구."
      - clearSticker: { id: t_seal, leave: fadeOut }
      - clearSticker: { id: t_ice, leave: fadeOut }
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [한명재]
          text: "그리고 의관 나리 하인 말이오."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 한명재]
          text: "정강이에 헝겊을 감았더이다. 서빙고엔 어쩐 일로 다녀왔답디까?"
      - goto: final_link

  final_link:
    title: "세 죽음을 잇는 사람"
    actions:
      - say:
          channel: action
          with: []
          camera: wide
          text: "참의가 붓을 내려놓는다. 옆에 앉은 서리도 손을 멈춘다."
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "분이와 박씨와 윤길은 서로 다른 곳에서 일했습니다."
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "분이가 남긴 주문서를 박씨 약방 장부 곁에 놓아 보십시오."
      - say:
          char: 서연
          with: [한명재]
          text: "분이가 꿰맨 주머니는 삼백 개입니다. 주문서에 남아 있습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "박씨 장부에는 청심원 삼백 환이 적혀 있습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "두 사람의 검안 기록을 베낀 윤길은 그 기록을 빌려 간 이름을 따로 적어 뒀습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "그래서 누구를 가리키는 겁니까. 참의 나리도 들으셔야지요."
      - choice:
          key: t_final
          prompt: "주문서와 장부, 윤길이 표시한 이름은 누구를 가리킬까?"
          with: [서연, 한명재]
          options:
            - text: "포교 강치수"
              forgiveOnce: true
              forgiveMessage: "강치수는 사건을 덮었을 뿐이다. 주머니를 주문하지도, 약을 짓지도 않았다."
              goto: final_wrong
            - text: "의관 한명재"
              goto: final_right
            - text: "행수 여금"
              forgiveOnce: true
              forgiveMessage: "여금은 주머니를 팔았을 뿐이다. 안에 무엇이 들었는지 몰랐다."
              goto: final_wrong

  final_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재
          with: [서연]
          text: "보십시오."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "참의 나리, 방금 의녀께서 지목한 이름도 적어 두시지요."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: final_link

  final_right:
    actions:
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "전의감 약재를 빼돌리고 석회로 환을 빚었습니다. 분이가 만든 주머니에 담아 청심원으로 팔았고요."
      - say:
          char: 서연
          text: "분이는 주머니를 만들었고, 박씨는 약재 장부를 봤습니다. 윤길은 시장을 빌려 간 사람을 알아냈습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "세 사람이 모두 한명재 의관을 가리킵니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "찾아온 사람들은 그 약을 먹고 나았다고 하던데요."
      - say:
          char: 서연.shock
          text: "제게 업혀 온 아이들은 일어나지도 못했습니다. 그 집에서 다시 약을 사러 올 수 있었겠습니까?"
      - branch:
          cases:
            - when: { var: truth, op: lte, value: 3 }
              goto: verdict_weak
          default: verdict_strong

  verdict_weak:
    actions:
      - say:
          channel: narration
          text: "참의는 같은 장을 몇 번이나 다시 읽었다. 옆자리 서리가 한동안 붓을 들지 못했다."
      - say:
          channel: thought
          with: []
          text: "판관 앞에 내밀었던 증거 가운데 몇 장은 상 위에 올라가지도 못했다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀가 아무리 오래 말해도 그게 증좌가 되지는 않습니다."
      - goto: trial_collapse

  trial_collapse:
    actions:
      - say:
          channel: record
          text: "형조 판결. 증좌 불충분. 피고 한명재 방면. 의녀 {{player_name|은}} 혜민서에서 내친다."
      - say:
          channel: action
          with: []
          text: "한명재가 옷깃을 여미고 일어난다. 나가는 길에 서연 앞에서 한 번 멈춘다."
      - say:
          char: 한명재
          with: [서연]
          text: "다음에는 의녀가 몸에서 직접 본 것부터 말씀하십시오. 적어도 그 대목엔 제가 토를 달 수 없으니까요."
      - say:
          channel: thought
          with: []
          text: "대꾸하려다 그만두었다. 품에 아직 펼쳐 보이지 못한 종이가 남아 있었다."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "아가씨, 우리가 쓴 시장은 남았수."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "올해 관아에서 안 받으면 내년에 다시 가져가지요."
      - say:
          channel: thought
          with: []
          text: "나는 상 위에 남은 문서부터 한 장씩 주워 모았다."
      - say:
          channel: record
          text: "그해 겨울, 감청 주머니는 장에서 값이 두 배가 되었다. 사는 사람이 줄지 않았다."
      - ending: covered_ledger

  verdict_strong:
    actions:
      - effect: { name: inkstamp, wait: true }
      - say:
          channel: record
          text: "형조 판결. 한명재의 가짜 약 제조와 살인 세 건 인정. 전의감 약고를 봉하고 남은 약주머니를 거둔다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "삼백 개 중에 몇 개나 찾아낼 수 있겠습니까?"
      - say:
          char: 서연
          with: [한명재]
          text: "거두어들인 주머니부터 세겠습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "그래야 아직 돌아오지 않은 수를 알 테니까요."
      - say:
          char: 한명재
          with: [서연]
          text: "못 찾은 수를 알아서 어디에 쓰시려고요?"
      - say:
          char: 서연
          with: [한명재]
          text: "장부에 남겨야지요."
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "다음에 어디서 감청 주머니가 나오면, 이번에 못 찾은 것부터 대조할 수 있게요."
      - mood: { tone: warm, level: 1 }
      - say:
          channel: record
          text: "책 첫 장. 원(冤), 억울함이 없게 하라."
      - say:
          channel: thought
          with: []
          text: "스승은 ‘원’ 자를 한 번 더 적었다. 먹이 번져 종이 뒷면에까지 자국이 있다."
      - music: dawn
      - bg: { id: dawn_gate, transition: fade, duration: 1200 }
      - branch:
          cases:
            - when:
                all:
                  - { var: deokgu_saved, op: eq, value: true }
                  - { var: makssoe_alive, op: eq, value: true }
              goto: epilogue_full
          default: epilogue_late

  epilogue_full:
    actions:
      - mood: off
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.grin
          text: "아가씨, 오늘 판결문에 ‘오작인 막쇠 입회’라고 있습디다. 내 이름이 거기 올라간 건 처음이오."
      - say:
          char: 서연
          with: [막쇠]
          text: "다음 시장에는 아저씨 이름부터 쓸게요."
      - say:
          channel: narration
          text: "성문이 열리고 짐꾼들이 줄지어 나간다. 맨 앞에서 덕구가 오른손으로 지게 끈을 고쳐 맸다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 책 빈칸에 분이부터 적으려고요. 우물에서 건졌을 때 입과 코에 거품이 없었다고."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그건 내가 먼저 가르쳐 줬지요. 지게미 덮고 기다리는 건 책에서 찾았고."
      - say:
          char: 서연
          with: [막쇠]
          text: "네. 그래서 아저씨 이름이 먼저예요."
      - say:
          channel: narration
          text: "책 맨 뒷장에 빈칸이 아직 많다. 오늘 채운 줄은 네 줄이다."
      - ending: muwon

  epilogue_late:
    actions:
      - mood: off
      - say:
          channel: thought
          when: { var: makssoe_alive, op: eq, value: false }
          with: []
          text: "판결문에 막쇠의 이름이 없다. 우물가에서 등잔을 든 사람부터 쓰고 싶었다."
      - say:
          channel: thought
          when: { var: deokgu_saved, op: eq, value: false }
          with: []
          text: "덕구의 낫은 아직 형조 창고에 있다. 찾아갈 사람이 없다."
      - say:
          channel: narration
          text: "성문이 열렸다. {{player_name|은}} 품에서 언해를 꺼내 맨 뒷장을 폈다. 빈칸이 많았다."
      - say:
          channel: thought
          with: []
          text: "네 줄을 적고 붓을 멈췄다. 문이 열리면 같이 나가고 싶었던 사람이 생각났다."
      - say:
          channel: thought
          with: []
          text: "붓 끝을 벼루에 대고 한동안 망설였다."
      - say:
          channel: narration
          text: "빈칸 옆에 한 줄을 적었다. 억울함이 없게 하라."
      - ending: late_muwon
