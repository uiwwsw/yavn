chapterTitle: "무원"

script:
  - scene: trial_open
  - scene: standing

scenes:
  trial_open:
    title: "형조 대청"
    actions:
      - bg: { id: hyeongjo_hall, transition: fade, duration: 900 }
      - place: { text: "10월 1일 · 형조 대청", presentation: center }
      - music: pressure
      - set: { credibility: 3, truth: 0 }
      - say:
          channel: record
          text: "10월 1일. 형조 대청. 피고 전의감 의관 한명재. 고발인 한성부 판관 김도원."
      - say:
          channel: action
          with: []
          camera: wide
          text: "고발장이 대청 한가운데 펼쳐져 있다. 피고는 그 너머에 앉았다. 버선 앞코에 흙 한 점 없다."
      - say:
          channel: thought
          with: []
          text: "저 버선을 본 적이 있다. 분이를 살핀 이튿날 아침, 약재실 문간이다."
      - char: { id: 서연, position: left }
      - char: { id: 한명재, position: right }
      - say:
          char: 한명재
          with: [서연]
          text: "전의감 의관 한명재입니다. 판관께서 고발하셨으니 묻는 말에 답하겠습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "다만 고발장 끝에 이름이 둘 더 있더군요. 의녀와 오작인."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "참의 나리, 그들이 형조 대청에서 증언할 자격이 있습니까?"
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: true }
          with: []
          text: "막쇠가 신을 벗어 마루 아래 내려놓는다. 포졸이 앞을 막자 흙마당에 그대로 선다."
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: false }
          with: []
          text: "고발장의 ‘오작인 막쇠’ 옆에 누가 잔글씨로 ‘사(死)’라고 써넣었다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀께 하나만 묻지요. 몇 사건이나 검안하셨습니까?"
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "세 사건입니다. 죽은 세 사람의 기록을 가져왔습니다."
      - say:
          char: 한명재
          motion: laugh
          with: [서연]
          text: "세 사건."
      - say:
          char: 막쇠
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "허. 난 마흔 해요."
      - say:
          char: 한명재
          with: [서연]
          text: "참의 나리, 세 사건 본 눈을 판관의 검안으로 치시겠습니까?"
      - sticker: { id: t_book, image: eonhae_sticker, x: 50, y: 32, width: "clamp(180px, 26%, 340px)", enter: fadeIn }
      - say:
          channel: action
          with: []
          text: "품에서 『무원록 언해』를 꺼내 기록 옆에 놓는다. 접어 둔 귀퉁이가 손때로 까맣다."
      - say:
          channel: thought
          with: []
          text: "빈칸에는 아직 스승의 글씨뿐이다."
      - clearSticker: { id: t_book, leave: fadeOut }
      - goto: standing

  standing:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - branch:
          cases:
            - when: { var: struck_deal, op: eq, value: true }
              goto: standing_deal
          default: standing_trust

  standing_deal:
    actions:
      - char: { id: 강치수, position: right }
      - say:
          char: 한명재
          with: [서연, 강치수]
          text: "참의 나리, 포도청에서 이미 조사를 끝낸 일입니다."
      - say:
          char: 강치수.angry
          with: [서연, 한명재]
          text: "박씨 약방은 실화로 처리했고, 분이는 범인을 찾지 못했습니다. 의녀도 그 자리에 있었습니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "덕구를 풀어 주면 따르겠다고 하셨지요."
      - say:
          char: 강치수
          with: [서연]
          text: "…참."
      - say:
          channel: thought
          with: []
          text: "덕구는 살았다. 그 뒤에도 장에는 남빛 약주머니가 나왔다."
      - say:
          char: 서연
          with: [한명재]
          text: "예. 그때는 덕구를 살리려고 더 묻지 않았습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "오늘은 물어야겠습니다. 그 뒤에도 같은 약주머니가 나왔습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "그날과 오늘 말이 다르니, 어느 쪽을 믿을지는 참의 나리께서 정하시겠지요."
      - add: { credibility: -1 }
      - say:
          channel: record
          text: "앞서 한 말과 달라 증언의 신뢰가 1 줄었다."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "아가씨."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "나도 틀렸다고 뒤늦게 말한 적이 많수. 오늘 본 대로 얘기해요."
      - goto: standing_trust

  standing_trust:
    actions:
      - branch:
          cases:
            - when: { var: trust_dowon, op: gte, value: 2 }
              goto: standing_vouched
          default: standing_doubted

  standing_vouched:
    actions:
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "내가 초검관으로 검안에 함께했소."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "의녀가 본 것은 내 눈으로도 다 보았소. 그 이름은 내가 적었소."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "본 사람 입으로 듣는 것이 옳소. 의녀, 직접 답하시오."
      - say:
          channel: thought
          with: [도원]
          text: "우물가에서는 사인은 자기가 쓰겠다던 사람이다."
      - goto: round1

  standing_doubted:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 도원.troubled
          with: [서연, 한명재]
          text: "…의녀의 검안이 틀린 적은 없었소. 이름은 적었으나, 그 이상은 장담하지 못하겠소."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "이름을 적은 분도 확신이 없으시군요. 그럼 의녀의 말은 반만 듣지요."
      - say:
          channel: record
          text: "판관이 증언을 보증하지 않아 신뢰가 1 줄었다."
      - goto: round1

  round1:
    title: "첫째 죽음"
    actions:
      - say:
          char: 한명재
          with: [서연, 한명재]
          text: "비단전 침모는 혼례가 두려워 제 발로 우물에 들었다고 들었습니다."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "저와 무슨 상관입니까."
      - choice:
          key: t1
          prompt: "한명재는 분이가 제 발로 우물에 들어갔다고 한다. 무엇을 펼칠까?"
          char: 한명재
          options:
            - text: "분이의 초검 기록"
              saveText: "분이의 시장 — 거품 없음, 목의 손자국"
              goto: round1_right
            - text: "분이 손톱 밑의 감청 실"
              goto: round1_wrong
            - text: "분이가 간직한 주머니 주문서"
              goto: round1_wrong

  round1_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그 물건을 지녔다는 건 알겠습니다. 우물에 들어갈 때도 살아 있었는지가 지금 묻는 바입니다."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round1_retry

  round1_retry:
    actions:
      - choice:
          key: t1_retry
          prompt: "분이의 몸을 살핀 밤을 떠올린다. 그때 무엇을 적어 뒀지?"
          char: 한명재
          options:
            - text: "분이의 시장 — 거품 없음, 목의 손자국"
              goto: round1_right
            - text: "주머니 주문서 — 감청 주머니 삼백"
              goto: round1_lost

  round1_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "주문서는 장사 문서지요. 사람이 어찌 죽었는지는 말해 주지 않습니다."
      - say:
          channel: thought
          with: [한명재]
          text: "분이의 몸에서 본 것을 먼저 내놓았어야 했다."
      - goto: round2

  round1_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_sijang
          image: sijang_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "입과 코에 거품이 없었습니다. 산 채로 물에 빠졌다고 보기 어렵습니다."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "지게미를 덮었더니 목 앞에 엄지 자국이 드러났습니다. 마주 보고 조른 겁니다."
      - say:
          char: 한명재
          with: [서연]
          text: "지게미."
      - clearSticker: { id: t_sijang, leave: fadeOut }
      - say:
          char: 한명재
          with: [서연]
          text: "누가 졸랐다고 칩시다. 그 침모가 저를 만났다는 증좌는 있습니까?"
      - goto: round2

  round2:
    title: "감청 주머니"
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "분이 손톱 밑에 감청 실이 있었다지요. 육의전 물건은 누구든 살 수 있습니다."
      - choice:
          key: t2
          prompt: "한명재는 누구나 그 실을 살 수 있다고 한다. 어디부터 맞춰 볼까?"
          char: 한명재
          options:
            - text: "분이 손톱 밑의 감청 실"
              goto: round2_wrong
            - text: "분이가 간직한 주머니 주문서"
              saveText: "주머니 주문서 — 붉은 표식"
              goto: round2_right
            - text: "약방에서 건진 장부 조각"
              goto: round2_wrong

  round2_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "색이 같고 수가 같으면 다 제가 가져간 겁니까? 누가 주문했는지는 어느 줄에 있습니까?"
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round2_retry

  round2_retry:
    actions:
      - choice:
          key: t2_retry
          prompt: "다시. 주머니를 주문한 집은?"
          char: 한명재
          options:
            - text: "주머니 주문서 — 붉은 표식"
              goto: round2_right
            - text: "가짜 청심원 — 속이 석회"
              goto: round2_lost

  round2_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "약이 가짜라 해도 누가 주문했는지는 모르지 않습니까."
      - goto: round3

  round2_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_slip
          image: order_slip_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "분이가 저고리 안섶에 꿰매 둔 주문서입니다. 감청 주머니 삼백 개. 주문한 집란엔 붉은 표식이 있습니다."
      - char: { id: 여금, position: center }
      - say:
          char: 여금
          when: { var: trust_yeogeum, op: gte, value: 1 }
          with: [서연, 한명재]
          text: "삼백 개를 제가 전의감 약고에 가져다줬어요. 약고 문에 똑같은 표식이 달려 있었고요."
      - say:
          char: 여금
          when: { var: trust_yeogeum, op: gte, value: 1 }
          with: [서연, 한명재]
          text: "가게에 돌아가면 주문이 끊겨 있겠지요. 분이한테 마지막으로 한 말도 잔금 받으라는 말이었어요."
      - say:
          char: 여금.wary
          when: { var: trust_yeogeum, op: lte, value: 0 }
          with: [서연, 한명재]
          text: "주문은 받았어요. 누가 맡겼는지는 묻지 마세요. 나도 가게가 있어요."
      - say:
          char: 서연
          when: { var: trust_yeogeum, op: lte, value: 0 }
          with: [한명재]
          text: "이 표식, 전의감 약고 문에 걸린 것과 같습니다. 판관 나리가 오늘 아침 확인했습니다."
      - clearSticker: { id: t_slip, leave: fadeOut }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "전의감에는 의관이 열이 넘습니다. 그중 왜 저입니까."
      - goto: round3

  round3:
    title: "둘째 죽음"
    actions:
      - say:
          channel: action
          with: []
          camera: wide
          text: "한명재가 처음으로 자리를 고쳐 앉는다. 소매를 한 번 쓸어내린다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀께 묻겠습니다. 그 책, 누가 주셨습니까."
      - say:
          char: 서연
          with: [한명재]
          text: "혜민서에 계셨던 박 의녀님입니다. 재작년에 돌아가셨습니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그분 손에서 아이 둘이 죽었지요. 혜민서 기록에 있습니다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "아이 둘을 놓친 분이 베껴 준 책으로 의관의 약을 따지시는군요."
      - say:
          char: 서연.shock
          with: [한명재]
          text: "…두 아이는 업혀 왔을 때 이미 숨이 가빴습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "박 의녀님이 그 기록을 지우지 않고 남기셨습니다. 그래서 제가 읽었습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "읽으셨군요. 그럼 제 말도 끝까지 들으시지요."
      - say:
          char: 도원.troubled
          when: { var: trust_dowon, op: lte, value: 1 }
          with: [서연, 한명재]
          text: "의관, 박 의녀를 따지는 자리가 아니오. 약방 이야기로 돌아갑시다."
      - say:
          char: 도원.stern
          when: { var: trust_dowon, op: gte, value: 2 }
          with: [서연, 한명재]
          text: "의관. 그 책은 내가 빌려 읽었소."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "누가 베낀 책이든, 의녀가 내놓은 증거부터 봅시다."
      - say:
          char: 한명재
          with: [서연]
          text: "박씨는 약방에 불이 나서 죽었습니다. 짐꾼도 불을 질렀다고 자복했고요."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "저와는 무관합니다."
      - choice:
          key: t3
          prompt: "불이 날 때까지 박씨가 살아 있었다는 말에 무엇을 내밀까?"
          char: 한명재
          options:
            - text: "박씨의 목 상처 탁본"
              goto: round3_wrong
            - text: "약방에서 건진 장부 조각"
              goto: round3_wrong
            - text: "약방에서 건진 밥의 실험 기록"
              saveText: "닭 실험 기록 — 불 전에 독"
              goto: round3_right

  round3_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "불이 나기 전에 박씨가 죽었다고 하셨지요. 그 기록으로 죽은 때를 어찌 아십니까?"
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round3_retry

  round3_retry:
    actions:
      - choice:
          key: t3_retry
          prompt: "다시. 박씨는 어떻게 죽었나?"
          char: 한명재
          options:
            - text: "닭 실험 기록 · 독살의 단서"
              saveText: "닭 실험 기록 — 불 전에 독"
              goto: round3_right
            - text: "탄 장부 조각 — 청심원 삼백 환"
              goto: round3_lost

  round3_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "장부에 '한' 자 하나. 한성에 한씨가 몇이나 되는지 아십니까."
      - goto: chisu_called

  round3_right:
    actions:
      - add: { truth: 1 }
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "박씨 콧속엔 그을음이 없었습니다. 독이 있는지 알아보려던 검시에서는 닭이 쓰러졌고요."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "은비녀는 변하지 않았습니다. 비녀가 못 잡는 독이 있다고 한 사람은 오작인입니다."
      - say:
          char: 덕구
          when: { var: deokgu_saved, op: eq, value: true }
          with: [한명재]
          text: "저, 저는 약이라곤 사 본 적도 없어요. 낫도 풀만…"
      - say:
          channel: thought
          when: { var: deokgu_saved, op: eq, value: false }
          with: [한명재]
          text: "덕구는 9월 26일 새남터에서 처형됐다. 공초에는 덕구가 한 말만 적혔지, 낫을 놓친 손은 적히지 않았다."
      - goto: chisu_called

  chisu_called:
    title: "포교의 대답"
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "그 자복을 받은 포교 강치수도 불렀소."
      - say:
          char: 도원.stern
          with: [강치수]
          text: "포교. 옥에서 의녀에게 감청 주머니 얘기를 먼저 꺼냈다지. 누구에게 들었소."
      - say:
          char: 강치수
          with: [도원]
          text: "…"
      - say:
          channel: action
          with: [강치수]
          text: "강치수가 피고 쪽으로 고개를 돌리다 만다. 발끝으로 마룻바닥의 옹이를 민다."
      - say:
          char: 강치수
          with: [도원]
          text: "막내가 아직 젖니도 안 빠졌습니다, 나리."
      - say:
          char: 도원.troubled
          with: [강치수]
          text: "묻는 말은 그게 아니오."
      - say:
          char: 강치수
          with: [도원]
          text: "…기억나지 않습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "포교가 기억 못 하는 일까지 제 이름 밑에 적으시렵니까."
      - goto: round4

  round4:
    title: "셋째 죽음"
    actions:
      - say:
          char: 한명재.cold
          with: [서연]
          text: "서리 윤길은 얼음 곳간에 혼자 갔다지요."
      - say:
          char: 한명재.cold
          with: [서연, 도원]
          text: "출납부에 제 이름이 있습니까? 없을 겁니다."
      - choice:
          key: t4
          prompt: "출납부에 한명재 이름은 없다. 출납부 곁에 무엇을 놓을까?"
          char: 한명재
          timeoutMs: 15000
          timeoutOptionIndex: 0
          options:
            - text: "윤길이 베껴 남긴 문서"
              goto: round4_wrong
            - text: "청심원 상자에 찍힌 인장"
              saveText: "전의감 도장 — 깨진 모서리"
              goto: round4_right
            - text: "분이가 간직한 주머니 주문서"
              goto: round4_wrong

  round4_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재.cold
          with: [서연]
          text: "그 종이가 출납부의 어느 줄과 이어집니까? 얼음을 제가 받아 갔다는 대목을 읽어 주시오."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: round4_retry

  round4_retry:
    actions:
      - choice:
          key: t4_retry
          prompt: "출납부의 이름 칸엔 도장만 찍혀 있다. 어느 증거와 대조할까?"
          char: 한명재
          options:
            - text: "전의감 도장 — 깨진 모서리"
              goto: round4_right
            - text: "얼음 출납부 — 열 덩이 반출"
              goto: round4_lost

  round4_lost:
    actions:
      - say:
          char: 한명재
          with: [서연]
          text: "얼음 열 덩이. 약재를 차게 두는 데 쓰지요."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "열 덩이를 가져갔다는 기록이지요. 어느 의관이 가져갔다는 겁니까?"
      - goto: final_link

  round4_right:
    actions:
      - add: { truth: 1 }
      - sticker:
          id: t_seal
          image: seal_mark_sticker
          x: 26
          y: 38
          width: "clamp(108px, 18%, 240px)"
          enter: fadeIn
      - sticker:
          id: t_ice
          image: ice_ledger_sticker
          x: 74
          y: 38
          width: "clamp(118px, 22%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - char: { id: 도원, position: center }
      - effect: focus
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "출납부와 가짜 청심원 상자의 도장을 보십시오. 오른쪽 아래가 똑같이 깨졌습니다."
      - say:
          char: 도원.stern
          with: [서연, 한명재]
          text: "전의감 인장 대장과 대 보았소."
      - say:
          char: 도원.stern
          with: [한명재]
          text: "저 인장은 한명재 몫으로 올라 있소."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 도원]
          text: "어이구."
      - clearSticker: { id: t_seal, leave: fadeOut }
      - clearSticker: { id: t_ice, leave: fadeOut }
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [한명재]
          text: "그리고 의관 나리 하인 말이오."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 한명재]
          text: "정강이에 헝겊을 감았더이다. 왼손잡이고. 서빙고에 떨어뜨린 칼은 날이 한 치요."
      - goto: final_link

  final_link:
    title: "세 죽음을 잇는 사람"
    actions:
      - say:
          channel: action
          with: []
          camera: wide
          text: "참의가 붓을 내려놓는다. 옆에 앉은 서리도 손을 멈춘다."
      - say:
          char: 서연.resolve
          with: [한명재, 도원]
          text: "참의 나리. 죽은 세 사람이 종이를 한 장씩 남겼습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "분이는 주문서 뒤에 ‘약 냄새 없음. 박씨에게 확인’이라고 적어 안섶에 꿰맸습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "박씨는 장부에 청심원 삼백 환과 받아 간 사람의 성을 적어 궤짝에 넣었습니다."
      - say:
          char: 서연
          with: [한명재]
          text: "윤길은 분이의 시장을 빌려 간 이름에 붉은 동그라미를 쳐 소매에 넣고 다녔습니다."
      - say:
          char: 한명재
          with: [서연]
          text: "그래서 누구를 가리키는 겁니까. 참의 나리도 들으셔야지요."
      - choice:
          key: t_final
          prompt: "주문서와 장부, 윤길이 표시한 이름은 누구를 가리킬까?"
          with: [서연, 한명재]
          options:
            - text: "포교 강치수"
              forgiveOnce: true
              forgiveMessage: "강치수는 사건을 덮었을 뿐이다. 주머니를 주문하지도, 약을 짓지도 않았다."
              goto: final_wrong
            - text: "의관 한명재"
              goto: final_right
            - text: "행수 여금"
              forgiveOnce: true
              forgiveMessage: "여금은 주머니를 팔았을 뿐이다. 안에 무엇이 들었는지 몰랐다."
              goto: final_wrong

  final_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 한명재
          with: [서연]
          text: "보십시오."
      - say:
          char: 한명재
          with: [서연, 도원]
          text: "참의 나리, 방금 의녀께서 지목한 이름도 적어 두시지요."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: trial_collapse
          default: final_link

  final_right:
    actions:
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "의관 나리께 여쭙니다."
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "분이가 죽은 이튿날, 비단전 침모의 시장을 왜 빌려 가셨습니까."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "…"
      - say:
          char: 한명재.cold
          with: [서연]
          text: "의관이 검안 기록을 읽는 것도 죄입니까."
      - say:
          char: 서연
          with: [한명재, 도원]
          text: "얼음을 받아 간 도장도, 석회 환 상자의 도장도 나리 것입니다. 그 곳간에서 윤길이 나왔습니다."
      - say:
          channel: action
          with: [한명재]
          text: "한명재가 소매를 쓸어내리려다 손을 무릎에 얹는다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "저를 찾아온 사람들은 그 약을 먹고 나았다고 하던데요."
      - say:
          char: 서연
          with: [한명재]
          text: "나은 사람만 나리를 다시 찾아갑니다. 안 나은 아이는 혜민서로 업혀 옵니다."
      - branch:
          cases:
            - when: { var: truth, op: lte, value: 3 }
              goto: verdict_weak
          default: verdict_strong

  verdict_weak:
    actions:
      - say:
          channel: narration
          text: "참의는 같은 장을 몇 번이나 다시 읽었다. 옆자리 서리가 한동안 붓을 들지 못했다."
      - say:
          channel: thought
          with: []
          text: "내밀었던 종이 가운데 몇 장은 참의의 상 위에 올라가지도 못했다."
      - say:
          char: 한명재
          with: [서연]
          text: "의녀께서 오래 말씀하셨습니다만, 말이 길다고 증좌가 되지는 않습니다."
      - goto: trial_collapse

  trial_collapse:
    actions:
      - say:
          channel: record
          text: "형조 판결. 증좌 불충분. 피고 한명재 방면. 의녀 {{player_name|은}} 혜민서에서 내친다."
      - say:
          channel: action
          with: []
          text: "한명재가 옷깃을 여미고 일어난다. 나가는 길에 내 앞에서 한 번 멈춘다."
      - say:
          char: 한명재
          with: [서연]
          text: "참의 나리께서 들으실 말은 다 들으셨겠지요. 혜민서에는 제가 전하겠습니다."
      - say:
          channel: thought
          with: []
          text: "대꾸하려다 그만두었다. 품에 아직 펼쳐 보이지 못한 종이가 남아 있었다."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "아가씨, 우리가 본 건 종이에 남았수."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연]
          text: "올해 관아에서 안 받으면 내년에 다시 가져가지요."
      - say:
          channel: thought
          with: []
          text: "나는 상 위에 남은 문서부터 한 장씩 주워 모았다."
      - say:
          channel: record
          text: "그해 겨울, 감청 주머니는 장에서 값이 두 배가 되었다. 사는 사람이 줄지 않았다."
      - ending: covered_ledger

  verdict_strong:
    actions:
      - effect: { name: inkstamp, wait: true }
      - say:
          channel: record
          text: "형조 판결. 한명재의 가짜 약 제조와 세 사람의 살인 지시 인정. 전의감 약고를 봉하고 남은 약주머니를 거둔다."
      - say:
          char: 한명재.cold
          with: [서연]
          text: "삼백 개 중에 몇 개나 찾아낼 수 있겠습니까?"
      - say:
          char: 서연
          with: [한명재]
          text: "열한 개가 상자에 없었습니다. 벌써 어느 집에 들어갔겠지요."
      - say:
          char: 서연
          with: [한명재]
          text: "거둬들이는 동안 혜민서에도 알릴 겁니다. 아이를 데려올 때 주머니도 가져오라고요."
      - say:
          char: 한명재
          with: [서연]
          text: "그걸 의녀 한 사람이 다 하시겠다?"
      - say:
          char: 서연
          with: [한명재]
          text: "혼자 못 하면 사람을 더 부르겠습니다."
      - say:
          char: 서연.resolve
          with: [한명재]
          text: "아픈 아이 어미한테 무슨 약을 먹였는지 묻고도, 그 손에 든 것은 안 봤습니다. 다음엔 보겠습니다."
      - mood: { tone: warm, level: 1 }
      - say:
          channel: record
          text: "책 첫 장. 원(冤), 억울함이 없게 하라."
      - say:
          channel: thought
          with: []
          text: "스승은 ‘원’ 자를 한 번 더 적었다. 먹이 번져 종이 뒷면에까지 자국이 있다."
      - music: dawn
      - bg: { id: dawn_gate, transition: fade, duration: 1200, place: "새벽 · 관아 문 앞" }
      - branch:
          cases:
            - when:
                all:
                  - { var: deokgu_saved, op: eq, value: true }
                  - { var: makssoe_alive, op: eq, value: true }
              goto: epilogue_full
          default: epilogue_late

  epilogue_full:
    actions:
      - mood: off
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.grin
          text: "판결문에도 ‘오작인 막쇠 입회’라고 있답디다. 서리한테 두 번 읽어 달랬수."
      - say:
          char: 서연
          with: [막쇠]
          text: "다음엔 종이를 아저씨 쪽으로 놓을게요. 이름 쓰는 것부터 같이 봐요."
      - say:
          char: 막쇠
          with: [서연]
          text: "닭 값은 이제 관에서 내라 하고."
      - say:
          channel: narration
          text: "성문이 열리고 짐꾼들이 줄지어 나간다. 맨 앞에서 덕구가 오른손으로 지게 끈을 고쳐 맨다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 책 빈칸에 처음으로 적으려고요. 분이부터요. 입과 코에 거품이 없었다고."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그건 내가 먼저 가르쳐 줬지요. 지게미는 책에서 찾았고."
      - say:
          char: 서연
          with: [막쇠]
          text: "네. 그래서 아저씨 이름이 먼저예요."
      - sticker:
          id: ep_book
          image: eonhae_filled_sticker
          x: 50
          y: 32
          width: "clamp(190px, 28%, 360px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: narration
          text: "스승의 글씨 옆에 네 줄이 생겼다. 빈칸은 아직 많다."
      - clearSticker: { id: ep_book, leave: fadeOut }
      - ending: muwon

  epilogue_late:
    actions:
      - mood: off
      - say:
          channel: thought
          when: { var: makssoe_alive, op: eq, value: false }
          with: []
          text: "판결문에 막쇠의 이름은 없다. 죽은 오작인은 입회로 치지 않는다고 했다."
      - say:
          channel: thought
          when: { var: deokgu_saved, op: eq, value: false }
          with: []
          text: "덕구의 낫은 아직 형조 창고에 있다. 찾아갈 사람이 없다."
      - say:
          channel: narration
          text: "재판이 끝난 이튿날 새벽, 성문이 열렸다. {{player_name|은}} 품에서 언해를 꺼내 맨 뒷장을 폈다."
      - say:
          channel: thought
          with: []
          text: "스승의 글씨 옆에 네 줄을 적고 붓을 멈췄다."
      - say:
          channel: narration
          when: { var: makssoe_alive, op: eq, value: false }
          text: "다섯째 줄에 적었다. ‘오작인 막쇠. 나이 모름. 우물가에서 등잔을 든 사람.’"
      - say:
          channel: narration
          when: { var: deokgu_saved, op: eq, value: false }
          text: "그 아래 한 줄을 더 적었다. ‘짐꾼 덕구. 왼손으로는 낫을 쥐지 못함.’"
      - ending: late_muwon
