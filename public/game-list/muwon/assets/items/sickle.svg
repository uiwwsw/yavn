    <path d="M250 120 L276 116 L300 352 L272 356 Z" fill="url(#art-ink-0)" stroke="#2f221a" stroke-width="3"/>
    <path d="M266 124 L276 122 L298 346 L286 348 Z" fill="#896133"/>
