      <text x="170" y="282" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="30" font-weight="700" fill="#1d1a17" text-anchor="middle">두 치</text>
      <path d="M142 250 h40" stroke="#b8432b" stroke-width="3"/>
    </g>
  </g>
</svg>
