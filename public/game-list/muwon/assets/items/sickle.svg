<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><!-- art direction edition -->
<defs><linearGradient id="art-ink-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#caa265"/><stop offset="0.55" stop-color="#c59959"/><stop offset="0.553" stop-color="#9f7e4d"/><stop offset="1" stop-color="#9f7e4d"/></linearGradient><linearGradient id="art-ink-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#797a79"/><stop offset="0.55" stop-color="#666b70"/><stop offset="0.553" stop-color="#555a5f"/><stop offset="1" stop-color="#555a5f"/></linearGradient><linearGradient id="art-ink-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c9e9d"/><stop offset="0.55" stop-color="#8f959b"/><stop offset="0.553" stop-color="#757b81"/><stop offset="1" stop-color="#757b81"/></linearGradient><linearGradient id="art-ink-3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4c5c1"/><stop offset="0.55" stop-color="#bec2c4"/><stop offset="0.553" stop-color="#999ea1"/><stop offset="1" stop-color="#999ea1"/></linearGradient><linearGradient id="art-ink-4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd4bb"/><stop offset="0.55" stop-color="#dbd3bd"/><stop offset="0.553" stop-color="#b0ab9b"/><stop offset="1" stop-color="#b0ab9b"/></linearGradient></defs>
  <g transform="rotate(-8 200 200)" stroke-linecap="round" stroke-linejoin="round">
