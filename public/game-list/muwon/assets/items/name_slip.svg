<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><!-- 약 싸는 종이에 서연이 써 준 '막쇠'. 두 번 접혔던 자국 -->
  <g transform="rotate(-5 200 200)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 86 L308 80 L314 316 L98 322 Z" fill="#e3d5b5" stroke="#2f221a" stroke-width="3"/>
    <!-- fold creases -->
    <path d="M200 82 L204 320 M96 200 L312 196" stroke="#c4b18c" stroke-width="2.5"/>
    <path d="M96 200 L312 196" stroke="#f0e6cf" stroke-width="1" transform="translate(0 3)"/>
    <!-- herb dust stain in one corner -->
    <path d="M262 270 c14 -8 30 2 26 16 c-4 14 -24 16 -32 6 c-6 -8 -2 -18 6 -22 z" fill="#b88a4a" opacity="0.35"/>
    <!-- the name, written large so he can see its shape -->
    <text x="200" y="182" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="78" font-weight="800" fill="#1d1a17" text-anchor="middle">막</text>
    <text x="200" y="282" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="78" font-weight="800" fill="#1d1a17" text-anchor="middle">쇠</text>
    <!-- grain -->
    <g stroke="#c6b083" stroke-width="1.2" opacity="0.6"><path d="M120 110 l12 1 M270 120 l10 0 M120 300 l14 -1 M280 300 l10 1"/></g>
  </g>
</svg>
