<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><!-- 무원록 언해: sijang.svg의 접힌 한지 두 장과 몸 그림을 펼친 책으로 옮김 · 빈칸에 네 줄을 더함 -->
<defs><linearGradient id="art-ink-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfcba5"/><stop offset="0.55" stop-color="#ddc9a4"/><stop offset="0.553" stop-color="#b2a388"/><stop offset="1" stop-color="#b2a388"/></linearGradient><linearGradient id="art-ink-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd4bb"/><stop offset="0.55" stop-color="#dbd3bd"/><stop offset="0.553" stop-color="#b0ab9b"/><stop offset="1" stop-color="#b0ab9b"/></linearGradient><linearGradient id="art-ink-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9734f"/><stop offset="0.55" stop-color="#c46240"/><stop offset="0.553" stop-color="#9e533a"/><stop offset="1" stop-color="#9e533a"/></linearGradient></defs>
