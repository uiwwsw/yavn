      <path d="M252 160 V280" stroke="#2f221a" stroke-width="5.5" stroke-dasharray="7 3 5 6" stroke-linecap="butt" fill="none"/>
      <path d="M262 160 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10" stroke="#2f221a" stroke-width="1.6" fill="none"/>
