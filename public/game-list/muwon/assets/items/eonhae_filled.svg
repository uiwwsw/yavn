      <path d="M162 100 c-2.5 4 2.5 7 0 11 c2.5 4 -2.5 7 0 11 c-2.5 4 2.5 7 0 11 c2.5 4 -2.5 7 0 11 c-2.5 1 2.5 1 0 2"/>
      <path d="M144 100 c-2.5 4 2.5 7 0 11 c2.5 4 -2.5 7 0 11 c-2.5 4 2.5 7 0 11 c2.5 2 -2.5 3 0 5"/>
      <path d="M126 100 c-2.5 4 2.5 7 0 11 c2.5 4 -2.5 7 0 11 c-2.5 4 2.5 7 0 11 c2.5 4 -2.5 7 0 11 c-2.5 1 2.5 1 0 2"/>
    </g>

    <!-- paper grain -->
    <g stroke="#c6b083" stroke-width="1.2" opacity="0.6">
      <path d="M60 120 l14 1 M92 136 l10 -1 M256 138 l12 0 M280 110 l9 1 M70 292 l12 0 M300 292 l10 0"/>
