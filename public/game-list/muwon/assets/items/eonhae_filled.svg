    <g>
      <text x="180" y="108" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="13" font-weight="800" fill="#1d1a17" text-anchor="middle">막</text>
      <text x="180" y="122" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="13" font-weight="800" fill="#1d1a17" text-anchor="middle">쇠</text>
    </g>
    <g fill="none" stroke="#1d1a17" stroke-width="2.8">
