      <path d="M136 160 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10 c-2 3 2 7 0 10 c2 3 -2 7 0 10" stroke="#2f221a" stroke-width="1.6" fill="none"/>
