<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g transform="rotate(-6 200 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- pouch body -->
    <path d="M110 150 C80 200 76 290 120 320 C160 344 236 340 262 312 C292 280 280 196 250 150 Z" fill="#1f3552" stroke="#1d1a17" stroke-width="3"/>
    <path d="M232 160 C262 200 270 280 246 310 C232 324 210 332 188 334 C230 316 248 260 222 160 Z" fill="#162740"/>
    <!-- open mouth -->
    <path d="M100 148 C120 126 236 124 262 148 C240 170 122 172 100 148 Z" fill="#1f3552" stroke="#1d1a17" stroke-width="3"/>
    <path d="M118 148 C140 136 222 136 244 148 C222 160 140 160 118 148 Z" fill="#141c26"/>
    <!-- gathered folds -->
    <g stroke="#2e4a62" stroke-width="2.5">
      <path d="M130 172 l-6 30 M162 176 l-2 34 M196 176 l2 30 M228 170 l8 28"/>
    </g>
    <!-- drawstring -->
    <path d="M108 160 C150 174 214 174 256 160" fill="none" stroke="#b88a4a" stroke-width="4"/>
    <path d="M256 160 C276 170 284 190 278 214 M256 160 C286 160 300 176 304 198" fill="none" stroke="#b88a4a" stroke-width="4"/>
    <circle cx="278" cy="216" r="5" fill="#b88a4a" stroke="#1d1a17" stroke-width="2"/>
    <circle cx="305" cy="200" r="5" fill="#b88a4a" stroke="#1d1a17" stroke-width="2"/>
    <!-- simple stitch pattern -->
    <path d="M150 300 l8 -6 l8 6 l8 -6 l8 6 l8 -6" fill="none" stroke="#2e4a62" stroke-width="2"/>
    <!-- whole pill -->
    <circle cx="300" cy="286" r="22" fill="#3b2a20" stroke="#1d1a17" stroke-width="3"/>
    <path d="M286 296 a18 18 0 0 0 30 -2" fill="none" stroke="#24180f" stroke-width="5"/>
    <path d="M290 276 q6 -6 12 -6" fill="none" stroke="#6a5240" stroke-width="2.5"/>
    <!-- broken pill: two halves -->
    <g>
      <path d="M236 340 A22 22 0 0 0 280 340 Z" fill="#3b2a20" stroke="#1d1a17" stroke-width="3"/>
      <path d="M242 340 L250 334 L258 340 L266 333 L274 340 Z" fill="#ece6d8" stroke="#1d1a17" stroke-width="2"/>
    </g>
    <g transform="rotate(-24 340 330)">
      <path d="M318 330 A22 22 0 0 1 362 330 Z" fill="#3b2a20" stroke="#1d1a17" stroke-width="3" transform="rotate(180 340 330)"/>
      <ellipse cx="340" cy="330" rx="20" ry="7" fill="#ece6d8" stroke="#1d1a17" stroke-width="2"/>
      <g fill="#b9a983"><circle cx="332" cy="330" r="1.8"/><circle cx="344" cy="328" r="1.8"/><circle cx="350" cy="332" r="1.5"/></g>
    </g>
    <!-- chalk crumbs -->
    <g fill="#ece6d8" stroke="#1d1a17" stroke-width="1.5">
      <circle cx="296" cy="346" r="3"/><circle cx="308" cy="356" r="2.5"/>
    </g>
  </g>
</svg>
