<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><!-- art direction edition -->
<defs><linearGradient id="art-ink-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdbebb"/><stop offset="0.55" stop-color="#b6babd"/><stop offset="0.553" stop-color="#93989b"/><stop offset="1" stop-color="#93989b"/></linearGradient><linearGradient id="art-ink-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b1b4b2"/><stop offset="0.55" stop-color="#a8aeb3"/><stop offset="0.553" stop-color="#888e94"/><stop offset="1" stop-color="#888e94"/></linearGradient></defs>
  <g transform="rotate(-38 210 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- shaft -->
    <path d="M86 192 L330 196 Q360 200 372 200 Q360 202 330 206 L86 210 Z" fill="url(#art-ink-0)" stroke="#2f221a" stroke-width="3"/>
    <path d="M90 204 L330 202 Q356 201 366 200" fill="none" stroke="#8a9097" stroke-width="3"/>
    <path d="M110 196 L300 198" stroke="#e7e7e0" stroke-width="2.5"/>
