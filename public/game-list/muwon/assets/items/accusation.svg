<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><!-- 고발장: sijang.svg의 한지·먹선·인장을 이어 그림 -->
<defs><linearGradient id="art-ink-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfcba5"/><stop offset="0.55" stop-color="#ddc9a4"/><stop offset="0.553" stop-color="#b2a388"/><stop offset="1" stop-color="#b2a388"/></linearGradient><linearGradient id="art-ink-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd4bb"/><stop offset="0.55" stop-color="#dbd3bd"/><stop offset="0.553" stop-color="#b0ab9b"/><stop offset="1" stop-color="#b0ab9b"/></linearGradient><linearGradient id="art-ink-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9734f"/><stop offset="0.55" stop-color="#c46240"/><stop offset="0.553" stop-color="#9e533a"/><stop offset="1" stop-color="#9e533a"/></linearGradient></defs>
  <g transform="rotate(3 200 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- single leaf of hanji -->
    <path d="M70 44 L334 50 L330 356 L66 352 Z" fill="url(#art-ink-1)" stroke="#2f221a" stroke-width="3"/>
    <g stroke="#c6b083" stroke-width="1.2" opacity="0.6">
      <path d="M90 80 l14 1 M300 330 l12 0 M84 250 l10 0 M250 66 l12 -1 M310 180 l9 1 M150 338 l12 1"/>
    </g>
    <!-- title -->
    <text x="282" y="92" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="28" font-weight="700" fill="#2f221a" text-anchor="middle">고발장</text>
    <path d="M244 104 L320 105" stroke="#2f221a" stroke-width="2"/>
    <!-- the charge, brushed in columns -->
    <g fill="none" stroke="#2f221a" stroke-width="3">
      <path d="M308 124 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 1 -3 3 0 4"/>
      <path d="M284 124 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 2 -3 4 0 6"/>
      <path d="M260 124 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 4 -3 8 0 12 c-3 4 3 8 0 12 c3 2 -3 4 0 6"/>
    </g>
    <!-- first name: the examiner of record, with his seal -->
    <g>
      <text x="212" y="142" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="21" font-weight="700" fill="#2f221a" text-anchor="middle">판</text>
      <text x="212" y="167" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="21" font-weight="700" fill="#2f221a" text-anchor="middle">관</text>
      <text x="212" y="217" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="21" font-weight="700" fill="#2f221a" text-anchor="middle">김</text>
      <text x="212" y="242" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="21" font-weight="700" fill="#2f221a" text-anchor="middle">도</text>
      <text x="212" y="267" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="21" font-weight="700" fill="#2f221a" text-anchor="middle">원</text>
    </g>
    <g transform="rotate(-4 212 296)">
      <rect x="190" y="274" width="44" height="44" fill="url(#art-ink-2)" stroke="#863623" stroke-width="2"/>
      <rect x="195" y="279" width="34" height="34" fill="none" stroke="#dbd3bd" stroke-width="2"/>
      <path d="M201 287 h9 v8 h-9 z M216 285 v20 M221 289 h5 M221 297 h5 M201 301 h11 M206 297 v12" fill="none" stroke="#dbd3bd" stroke-width="2"/>
    </g>
    <!-- two names added afterwards, ink still wet and darker -->
    <g>
      <text x="160" y="142" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">의</text>
      <text x="160" y="169" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">녀</text>
      <path d="M160 176 c-4 5 4 9 0 14 c4 5 -4 9 0 14 c-4 5 4 9 0 14 c4 5 -4 9 0 14 c-4 5 4 9 0 14" fill="none" stroke="#1d1a17" stroke-width="4"/>
      <text x="112" y="142" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">오</text>
      <text x="112" y="169" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">작</text>
      <text x="112" y="196" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">인</text>
      <text x="112" y="250" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">막</text>
      <text x="112" y="277" font-family="AppleMyungjo, 'Nanum Myeongjo', serif" font-size="23" font-weight="800" fill="#1d1a17" text-anchor="middle">쇠</text>
    </g>
    <!-- the brush, laid down beside the last name -->
    <g transform="translate(-4 22)">
      <path d="M118 286 L52 370" stroke="#2f221a" stroke-width="11"/>
      <path d="M118 286 L52 370" stroke="#b88a4a" stroke-width="6"/>
      <path d="M66 352 l8 6" stroke="#2f221a" stroke-width="2.5"/>
      <path d="M112 294 L124 278 L140 262 L128 282 L120 300 Z" fill="#1d1a17" stroke="#1d1a17" stroke-width="2"/>
    </g>
  </g>
