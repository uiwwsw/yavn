<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g transform="rotate(-3 200 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- cover edges beneath -->
    <path d="M34 92 L200 100 L366 92 L370 318 L200 330 L30 318 Z" fill="#2e4a62" stroke="#1d1a17" stroke-width="3"/>
    <!-- left page -->
    <path d="M44 84 Q120 76 198 96 L200 318 Q120 300 46 308 Z" fill="#efe6d2" stroke="#1d1a17" stroke-width="3"/>
    <!-- right page -->
    <path d="M202 96 Q280 76 356 84 L354 308 Q280 300 200 318 Z" fill="#efe6d2" stroke="#1d1a17" stroke-width="3"/>
    <!-- gutter shade -->
    <path d="M176 92 Q190 94 198 96 L200 318 Q190 312 178 308 Z" fill="#d9ccb0"/>
    <path d="M222 92 Q210 94 202 96 L200 318 Q210 312 222 308 Z" fill="#d9ccb0"/>
