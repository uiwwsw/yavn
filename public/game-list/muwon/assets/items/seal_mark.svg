<path d="M104 105h191v153l-13 12-1 15-11 11H104z" fill="#ad4c34"/>
      <path d="M116 117h167v138l-12 10-2 15-5 5H116z M199 120v162" fill="none" stroke="#e5d7b6" stroke-width="5"/>
