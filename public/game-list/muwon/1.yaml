chapterTitle: "타 버린 약방"

script:
  - scene: silk_merchant
  - scene: c2_meet

scenes:
  silk_merchant:
    title: "비단전 행수"
    actions:
      - bg: { id: hyeminseo, transition: fade, duration: 800 }
      - place: { text: "9월 22일 아침 · 한성 혜민서", presentation: center }
      - music: inquest
      - say:
          channel: record
          text: "9월 22일 진시. 혜민서 약재실."
      - say:
          channel: action
          with: []
          camera: wide
          text: "새벽에 업혀 온 아이가 구석 평상에 누워 있다. 다섯 살 계집아이다. 어미는 점순이라고 부른다."
      - sticker:
          id: c2_plain_pouch
          image: pouch_plain_sticker
          x: 50
          y: 34
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "어미는 빈 약주머니 끈을 검지에 두 번 감은 채 졸고 있다."
      - clearSticker: { id: c2_plain_pouch, leave: fadeOut }
      - say:
          channel: thought
          with: []
          text: "청심원 한 환을 다 먹였다는데 열이 그대로다. 물수건만 간다."
      - say:
          channel: action
          with: []
          text: "약재실 문간으로 처음 보는 의관 하나가 지나간다. 담 옆 박씨 약방 쪽에서 나오는 길이다."
      - sticker:
          id: c2_socks
          image: socks_sticker
          x: 50
          y: 36
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "평상의 아이를 한 번 보고도 걸음을 늦추지 않는다. 버선 앞코에 흙 한 점 없다."
      - get: doorway_socks
      - clearSticker: { id: c2_socks, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "분이의 몸은 새벽에 막쇠가 혜민서 뒷방으로 옮겨 두었다. 문을 나서기 전에 비단전에서 사람이 먼저 왔다."
      - char: { id: 서연, position: left }
      - char: { id: 여금, position: right }
      - say:
          char: 여금.wary
          with: [서연]
          speakerName: "비단전에서 온 여자"
          text: "비단전 여금이에요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "분이는 우리 가게 침모고."
      - say:
          char: 여금.wary
          with: [서연]
          text: "어젯밤 검안하신 의녀님이세요?"
      - say:
          char: 서연
          with: [여금]
          text: "네. 오작인과 함께 살폈습니다. 목이 졸린 뒤에 우물에 던져졌습니다."
      - say:
          channel: action
          with: [여금]
          text: "여금이 장옷 끈을 꼭 쥔다. 짧게 다듬은 손톱이 눈에 들어온다. 손등은 깨끗하다."
      - say:
          char: 여금.wary
          with: [서연]
          text: "…목이 졸렸다고요."
      - say:
          char: 서연
          with: [여금]
          text: "네."
      - say:
          char: 여금
          with: [서연]
          text: "혼수 비단을 내가 골라 줬어요. 붉은 건 얼굴이 죽는다고 했더니 끝내 노란 걸 가져갔어요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "동네에선 그 애가 혼례가 겁나서 우물에 들었다는데, 나는 안 믿어요."
      - say:
          channel: action
          with: []
          text: "여금이 장옷 끈을 놓는다. 한참 아무 말도 하지 않는다."
      - goto: c2_meet

  c2_meet:
    actions:
      - choice:
          key: c2_yeogeum
          prompt: "여금에게 무엇을 먼저 꺼낼까?"
          char: 여금
          with: [서연, 여금]
          options:
            - text: "감청 실을 보여 준다"
              saveText: "손톱 밑에서 나온 감청 실을 보여 준다"
              goto: c2_show_thread
            - text: "어젯밤 어디 있었는지 다그친다"
              saveText: "분이와 다툰 적이 있는지 따진다"
              goto: c2_press

  c2_show_thread:
    actions:
      - add: { trust_yeogeum: 1 }
      - sticker:
          id: c2_thread
          image: thread_sticker
          x: 50
          y: 34
          width: "clamp(150px, 20%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 여금.wary
          with: [서연]
          text: "우리 실이네요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "이 실을 쓴 건 작은 약주머니뿐이에요."
      - say:
          char: 여금
          with: [서연]
          text: "지난달 삼백 개요. 분이가 밤까지 남아서 혼자 꿰맸어요."
      - say:
          char: 여금
          with: [서연]
          text: "납품하는 날 분이가 따라갔어요. 전의감 약고요."
      - say:
          char: 여금
          with: [서연]
          text: "하인들이 환을 주머니에 담고 있었는데, 오는 길에 그 애가 그래요. 약고에 약 냄새가 하나도 안 난다고."
      - say:
          char: 여금
          with: [서연]
          text: "나는 잔금부터 받으라고 했어요. 그 애가 약 냄새를 안다고, 웃기나 했지."
      - clearSticker: { id: c2_thread, leave: fadeOut }
      - say:
          char: 여금
          with: [서연]
          text: "노란 거 입혀서 보낼게요. 뒷방이 어디예요?"
      - say:
          channel: action
          with: []
          text: "여금은 뒷방에 한참 있었다. 나올 때 손에 접힌 종이가 들려 있다. 귀퉁이에 실밥이 붙어 있다."
      - say:
          char: 여금
          with: [서연]
          text: "저고리 안섶에 꿰매져 있었어요. 여기만 바늘땀이 이렇게 촘촘해요."
      - say:
          char: 여금
          with: [서연]
          text: "어제 저녁엔 가게 일 일찍 끝내고 혜민서 옆 약방에 들렀다 간다 했어요."
      - say:
          char: 여금
          with: [서연]
          text: "박씨 약방이 전의감 청심원을 받아 파는 건 이 동네가 다 알아요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "그게 마지막이에요."
      - say:
          char: 서연
          with: [여금]
          text: "…네."
      - say:
          char: 여금.wary
          with: [서연]
          text: "내가 드렸다는 말은 밖에서 하지 말아요. 납품이 걸려 있어요."
      - get: order_slip
      - goto: c2_fire_alarm

  c2_press:
    actions:
      - say:
          char: 서연.resolve
          with: [여금]
          text: "행수님. 어젯밤엔 어디 계셨습니까."
      - say:
          char: 서연.resolve
          with: [여금]
          text: "분이와 다투신 적 있습니까. 혼수 비단 값 때문에라도요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "…다퉜냐고요?"
      - say:
          char: 여금.wary
          with: [서연]
          text: "의녀가 포교 흉내를 내네. 내 가게 아이를 내가 왜 죽여요."
      - say:
          channel: action
          with: [여금]
          text: "소매로 가던 여금의 손이 멈춘다. 장옷 끈을 도로 단단히 맨다."
      - say:
          char: 여금.wary
          with: [서연]
          text: "할 말 없어요. 장례 날짜나 알려 줘요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "사람 불러서 데려갈게요."
      - say:
          channel: action
          with: []
          text: "여금이 문간에서 한 번 돌아본다. 그냥 나간다."
      - say:
          channel: action
          with: []
          text: "뒷방에서 분이의 저고리를 여민다. 안섶 한쪽만 바늘땀이 유난히 촘촘하다."
      - say:
          channel: action
          with: []
          text: "실을 뜯으니 접힌 종이가 나온다."
      - get: order_slip
      - goto: c2_fire_alarm

  c2_fire_alarm:
    title: "불"
    actions:
      - sticker:
          id: c2_slip
          image: order_slip_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "‘감청 주머니 삼백.’ 주문한 집 자리에 이름 대신 붉은 도장. 오른쪽 아래 모서리가 깨져 비었다."
      - say:
          channel: action
          with: []
          text: "뒷면에는 분이 글씨로 ‘약 냄새 없음. 박씨에게 확인’."
      - say:
          channel: thought
          with: []
          text: "약 냄새 없음. 어디서 본 말이다. 생각이 그리로 가다가 멈춘다."
      - clearSticker: { id: c2_slip, leave: fadeOut }
      - mood: { tone: dread, level: 1 }
      - say:
          channel: narration
          text: "담 너머로 종소리가 들렸다. 혜민서 옆 박씨 약방에서 불이 났다고 누가 외쳤다."
      - effect: { name: embers, wait: true }
      - bg: { id: apothecary_burnt, transition: fade, duration: 700, place: "혜민서 옆 박씨 약방" }
      - music: pressure
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨! 박 약방 영감이 아직 안에 있대!"
      - say:
          channel: action
          with: [막쇠]
          text: "연기 사이로 쓰러진 사람의 발이 보인다. 그 옆 궤짝 뚜껑에 ‘장부’라고 적혀 있다. 대들보에서 우지끈 소리가 난다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨는 들어오지 마요! 연기가 아래로 깔렸어!"
      - say:
          channel: action
          with: []
          text: "문틀이 뜨겁다. 서까래에서 흙이 떨어지고, 불은 궤짝 쪽으로 번지고 있다."
      - say:
          channel: thought
          with: []
          text: "막쇠가 영감을 업고 두 걸음도 못 옮겼다. 분이가 확인하려던 게 저 궤짝에 있을지 모른다."
      - choice:
          key: c2_rescue
          prompt: "대들보가 내려앉는다. 무엇을 먼저 잡을까?"
          with: [서연, 막쇠]
          timeoutMs: 8000
          timeoutOptionIndex: 0
          options:
            - text: "장부 궤짝을 끌어낸다"
              set: { makssoe_hurt: true, ledger_whole: true }
              goto: c2_chest
            - text: "막쇠를 끌어낸다"
              saveText: "막쇠의 허리띠를 잡아 끌어낸다"
              goto: c2_pull_makssoe

  c2_chest:
    actions:
      - effect: rumble
      - mood: off
      - say:
          channel: action
          with: []
          text: "궤짝을 문턱 밖으로 끌어내다가 함께 넘어진다. 바로 뒤에서 대들보가 떨어진다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "끄윽… 다리. 다리에 걸렸어."
      - say:
          channel: narration
          text: "이웃들이 대들보를 들어 올렸다. 막쇠는 왼발에 힘을 주려다 주저앉았다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아가씨, 손 펴요. 그 고리 뜨거워. 다 나왔수."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "영감은 업을 때부터 숨이 끊겼었소. 아, 내 다리 좀 받쳐 줘요."
      - sticker:
          id: c2_ledger_page
          image: ledger_page_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "궤짝 속 장부는 한 장이 통째로 남았다. ‘청심원 삼백 환. 구월 열아흐레 받음. 한.’"
      - say:
          channel: action
          with: []
          text: "그 아래 붙여 둔 영수 쪽지에 붉은 도장. 오른쪽 아래 모서리가 비었다."
      - say:
          channel: thought
          with: []
          text: "분이의 주문서에 찍힌 도장도 같은 자리가 비어 있었다."
      - get: ledger_page
      - clearSticker: { id: c2_ledger_page, leave: fadeOut }
      - goto: c2_after_fire

  c2_pull_makssoe:
    actions:
      - effect: rumble
      - mood: off
      - say:
          channel: action
          with: []
          text: "허리띠를 잡아당긴다. 막쇠가 영감을 업은 채 넘어진 자리로 대들보가 떨어진다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨, 이제 내 허리띠 놔도 돼요."
      - sticker:
          id: c2_ledger
          image: ledger_burnt_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: narration
          text: "불이 잦아든 뒤에야 궤짝을 꺼냈다. 장부는 거의 다 탔다."
      - say:
          channel: action
          with: []
          text: "그을린 한 장에 ‘청심원 삼백 환’, 그 뒤에 ‘한’ 자 하나만 남았다."
      - get: burnt_ledger
      - clearSticker: { id: c2_ledger, leave: fadeOut }
      - goto: c2_after_fire

  c2_after_fire:
    title: "불 속의 시신"
    actions:
      - say:
          channel: action
          with: []
          text: "도원이 와서 마당을 비우게 하고 박씨의 몸을 거적 위에 눕힌다."
      - say:
          channel: thought
          with: []
          text: "삼백. 주머니도 삼백이었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "약방 주인이 불을 끄려다 연기에 숨이 막혔다 하오. 의녀, 이번에도 보겠소?"
      - say:
          char: 서연.resolve
          with: [도원]
          text: "보겠습니다. 불이 붙을 때 숨을 쉬고 있었는지부터요."
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - goto: c2_examine

  c2_examine:
    title: "박씨의 몸"
    actions:
      - choice:
          key: c2_examine
          presentation: explore
          prompt: "약방 주인 박씨. 예순둘."
          with: []
          camera: wide
          options:
            - text: "콧속"
              at: { x: 62, y: 9 }
              when: { var: c2_nose, op: eq, value: false }
              goto: c2_nose_scene
            - text: "손과 팔"
              at: { x: 30, y: 92 }
              when: { var: c2_hands, op: eq, value: false }
              goto: c2_hands_scene
            - text: "목의 상처"
              at: { x: 66, y: 22 }
              when: { var: c3_wound, op: eq, value: false }
              goto: c2_wound_scene
            - text: "본 것을 정리한다"
              requires:
                all:
                  - { var: c2_nose, op: eq, value: true }
                  - { var: c2_hands, op: eq, value: true }
                  - { var: c3_wound, op: eq, value: true }
              lockedText: "아직 살펴보지 않은 곳이 있다."
              goto: c2_poison

  c2_nose_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "젖은 종이 심지를 콧속에 넣었다 뺀다. 하얗다."
      - say:
          char: 막쇠
          with: [서연]
          text: "불 속에서 숨을 쉬었으면 콧구멍이 시커메지요. 목구멍까지."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "불이 나기 전에 죽었을 수 있겠네요."
      - say:
          char: 막쇠
          with: [서연]
          text: "더 봐야지. 목에도 자국이 있던데."
      - set: { c2_nose: true }
      - goto: c2_examine

  c2_hands_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "두 손이 가지런하다. 덴 데도, 문을 두드린 멍도 없다."
      - say:
          char: 막쇠
          with: [서연]
          text: "허. 불 끄던 손이 아니네."
      - set: { c2_hands: true }
      - goto: c2_examine

  c2_wound_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "목 왼쪽에 얕게 그은 자국. 살이 오므라들지 않았고 피도 거의 맺히지 않았다."
      - say:
          char: 막쇠
          with: [서연]
          text: "산 사람을 그으면 살이 말려들고 피가 엉겨요."
      - say:
          char: 막쇠
          with: [서연]
          text: "이건 숨 끊어진 뒤에 그은 거요."
      - say:
          char: 막쇠
          with: [서연]
          text: "가만. 종이 대고 먹 문질러 떠 둡시다."
      - say:
          char: 막쇠
          with: [서연]
          text: "살은 썩어도 종이는 남으니까. 방향하고 폭을 나중에도 봐요."
      - say:
          char: 서연
          with: [막쇠]
          text: "네. 종이는 제가 받칠게요."
      - sticker:
          id: c2_rubbing
          image: wound_rubbing_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "먹을 입힌 종이에 하얀 자국이 남았다. 오른쪽 위에서 왼쪽 아래로 비스듬하다. 폭은 한 치다."
      - get: wound_rubbing
      - clearSticker: { id: c2_rubbing, leave: fadeOut }
      - set: { c3_wound: true }
      - goto: c2_examine

  c2_poison:
    title: "은비녀"
    actions:
      - sticker:
          id: c2_pin
          image: silver_pin_sticker
          x: 50
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "은비녀를 혀 밑에 넣고 한참 뒤 뺀다. 은빛 그대로다."
      - get: silver_pin
      - clearSticker: { id: c2_pin, leave: fadeOut }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원
          with: [서연, 막쇠]
          text: "독은 아니란 말이오? 그럼 불이 붙기 전에 어째서 숨이 멎었소?"
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "저, 나리. 비녀가 멀쩡해도 독이 없었다고는 못 합니다요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "은빛을 안 바꾸는 독도 봤습니다."
      - say:
          char: 도원
          with: [막쇠]
          text: "…허."
      - choice:
          key: c2_poison
          prompt: "은비녀는 깨끗하다. 어떻게 할까?"
          with: [서연, 도원, 막쇠]
          options:
            - text: "노환으로 기록한다"
              saveText: "독은 아니다. 늙어 숨이 멎은 것으로 적는다"
              forgiveOnce: true
              forgiveMessage: "막쇠가 고개를 젓는다. '숨이 멎은 송장 목을 누가 그어요?'"
              goto: c2_bad_close
            - text: "닭에게 밥을 먹여 독을 확인한다"
              saveText: "입에 밥을 물렸다가 닭에게 먹여 본다"
              goto: c2_chicken

  c2_bad_close:
    actions:
      - say:
          channel: record
          text: "초검 시장. 박씨, 노환으로 숨이 멎은 뒤 화재로 시신이 손상됨. 범죄 흔적 없음."
      - say:
          channel: narration
          text: "시장이 올라가자 포도청은 불을 낸 사람만 찾았다. 짐꾼 하나가 잡혀 왔다."
      - say:
          channel: narration
          text: "약방 주인의 목에 난 상처는 아무도 설명하지 않았다."
      - say:
          channel: thought
          with: []
          text: "목의 상처를 적은 종이 위로 비녀를 내려놓았다."
      - gameOver:
          title: "닫힌 검안"
          message: "비녀가 검게 변하지 않았어도 독을 배제할 수 없다. 『무원록』에는 다른 검시법도 들어 있다."
          recoverToChoice: c2_poison

  c2_chicken:
    actions:
      - say:
          channel: action
          with: []
          text: "찬밥 한 덩이를 망자 입에 물렸다가 두 식경 뒤 꺼내, 마당의 닭에게 던진다."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "이거 옛 어른들이 쓰던 건데. 책에 진짜 있수?"
      - say:
          char: 서연
          with: [막쇠]
          text: "서른아홉 장이요. 아저씨 말씀 듣고 찾아봤어요. 닭 그림도 있어요."
      - wait: 0
      - say: { channel: card, with: [], text: "잠시 뒤", autoAdvance: 1300 }
      - say:
          channel: narration
          text: "반 식경도 안 되어 닭이 비틀거렸다. 날개를 한 번 퍼덕이고 쓰러졌다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아이고, 닭아."
      - sticker:
          id: c2_note
          image: poison_note_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - get: poison_note
      - clearSticker: { id: c2_note, leave: fadeOut }
      - say:
          char: 도원.stern
          with: [서연]
          text: "…독을 먹이고, 목을 긋고, 불을 질렀소. 강도 짓으로 보이게."
      - say:
          char: 서연.think
          with: [도원]
          text: "장부에는 청심원 삼백 환, 분이 주문서에는 약주머니 삼백 개라고 적혀 있습니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "분이가 박씨를 찾아가려 했다는 말이군. 그래도 수가 같다는 것만으로는 시장에 못 쓰오."
      - say:
          char: 서연
          with: [도원]
          text: "네."
      - say:
          char: 막쇠.grin
          with: [서연, 도원]
          text: "아가씨, 이거 옆집 닭인데 값은 누가 물어 주우?"
      - say:
          char: 서연
          with: [막쇠]
          text: "닭 값은 나중에요. 아저씨도 불 속에 들어갔잖아요. 데인 데는 없으세요?"
      - say:
          char: 막쇠
          with: [서연]
          text: "데인 건 수염 끝뿐이오."
      - say:
          char: 막쇠
          with: [서연]
          text: "마흔 해 만에 책에 적힌 대로 해 본 건 처음이오. 닭 값쯤은 내가 내야지."
      - say:
          channel: thought
          with: []
          text: "주문서는 소매에 넣어 둔다. 붉은 도장이 누구 것인지 모르고는 내밀 데가 없다."
      - goto: c2_arrest

  c2_arrest:
    title: "잡혀 온 짐꾼"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 700, place: "9월 22일 해 질 녘 · 한성부 마당" }
      - music: pressure
      - say:
          channel: narration
          text: "해 질 녘 한성부 마당. 포졸이 달려와 판관에게 무언가 아뢰었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "포도청에서 약방 주인을 죽이고 불을 지른 자를 잡았다 하오."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "짐꾼 덕구. 낫을 들고 약방 뒤에 있었다고."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…이미 곤장 열 대에 자복했다는군."
      - say:
          char: 서연.shock
          with: [도원]
          text: "벌써요?"
      - say:
          char: 도원.troubled
          with: [서연]
          text: "포교 강치수가 올린 거요."
      - say:
          char: 서연
          with: [도원]
          text: "박씨 목의 상처는 포도청에서 알고 있습니까?"
      - say:
          char: 도원.troubled
          with: [서연]
          text: "내가 쓴 시장도 아직 서랍에 있소. 읽어 보겠다 온 사람 하나 없더군."
      - say:
          channel: action
          with: []
          text: "마루 끝에서 분이의 시장을 베끼던 젊은 서리가 붓을 든 채 고개를 든다."
      - say:
          channel: dialogue
          speakerName: "서리 윤길"
          with: [서연]
          text: "의녀님. 지게미는 덮고 얼마나 둡니까? 베끼는 김에 적어 두려고요."
      - say:
          char: 서연
          with: [도원]
          text: "등잔 심지 한 번 자를 동안이요."
      - say:
          channel: dialogue
          speakerName: "서리 윤길"
          with: [서연]
          text: "심지 한 번. …적었습니다."
      - say:
          channel: dialogue
          speakerName: "서리 윤길"
          with: [도원]
          text: "나리, 낮에 전의감 의관 한 분이 이 시장을 빌려 가셨다가 방금 돌려주셨습니다."
      - say:
          channel: dialogue
          speakerName: "서리 윤길"
          with: [도원]
          text: "대출 장부에 도장도 받아 뒀고요. 침모 송장 기록을 의관이 뭐 하러 봅니까?"
      - say:
          channel: action
          with: [도원]
          text: "도원은 대답하지 않는다."
      - say:
          char: 도원
          with: [서연]
          text: "윤길, 오늘은 그만 들어가 보게."
      - say:
          channel: thought
          with: [도원]
          text: "열 대."
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "다리만 성했으면 포도청 담이라도 넘을 텐데."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "어차피 옥엔 오작인을 안 들여요. 아가씨가 가요."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: false }
          with: [서연, 도원]
          text: "포도청 옥엔 오작인을 산 사람 보러는 안 들여요. 아가씨가 가요."
      - goto: /2.yaml
