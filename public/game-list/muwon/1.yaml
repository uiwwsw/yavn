chapterTitle: "타 버린 약방"

script:
  - scene: silk_merchant
  - scene: c2_meet

scenes:
  silk_merchant:
    title: "비단전 행수"
    actions:
      - bg: { id: hyeminseo, transition: fade, duration: 800 }
      - place: { text: "이튿날 아침 · 한성 혜민서", presentation: center }
      - music: inquest
      - say:
          channel: record
          text: "이튿날 진시. 혜민서 약재실."
      - say:
          channel: thought
          with: []
          camera: wide
          text: "육의전에 가려던 참에 비단전에서 사람이 찾아왔다. 분이의 시신을 거두러 왔다고 한다."
      - char: { id: 서연, position: left }
      - char: { id: 여금, position: right }
      - say:
          char: 여금.wary
          with: [서연]
          speakerName: "비단전에서 온 여자"
          text: "비단전 여금이에요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "분이는 우리 가게 침모예요. 장례 치를 돈은 챙겨 왔어요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "어젯밤 검안하신 의녀님이세요?"
      - say:
          char: 서연
          with: [여금]
          text: "네. 제가 살폈습니다. 분이는 목이 졸린 뒤 우물에 던져진 걸로 보입니다."
      - say:
          channel: action
          with: [여금]
          text: "여금이 장옷 끈을 꼭 쥔다. 짧게 다듬은 손톱이 눈에 들어온다. 손등은 깨끗하다."
      - say:
          char: 여금.wary
          with: [서연]
          text: "…목이 졸렸다고요."
      - say:
          char: 서연
          with: [여금]
          text: "네."
      - say:
          char: 여금
          with: [서연]
          text: "오늘 혼례를 치르기로 했어요. 혼수 비단도 내가 골라 줬고."
      - say:
          char: 서연
          with: [여금]
          text: "그 비단은 분이가 집에 가져갔습니까?"
      - say:
          char: 여금.wary
          with: [서연]
          text: "가져갔죠. 동네에선 그 애가 혼례가 겁나서 우물에 들었다는데, 난 그 말이 안 믿겨요."
      - say:
          char: 서연
          with: [여금]
          text: "입에도 코에도 거품이 없었습니다. 그보다 목에 손자국이 남아 있었지요."
      - say:
          channel: action
          with: []
          text: "여금이 장옷 끈을 놓는다. 한참 아무 말도 하지 않는다."
      - say:
          char: 여금
          with: [서연]
          text: "…그 말, 포교 나리 앞에서도 했어요?"
      - say:
          char: 서연
          with: [여금]
          text: "포교도 들으셨습니다. 오늘부터 사흘 안에 다른 범인을 못 찾으면 오라비를 다시 잡아간답니다."
      - goto: c2_meet

  c2_meet:
    actions:
      - choice:
          key: c2_yeogeum
          prompt: "여금에게 무엇을 먼저 꺼낼까?"
          char: 여금
          with: [서연, 여금]
          options:
            - text: "감청 실을 보여 준다"
              saveText: "손톱 밑에서 나온 감청 실을 보여 준다"
              goto: c2_show_thread
            - text: "분이와 다퉜는지 묻는다"
              saveText: "분이와 다툰 적이 있는지 따진다"
              goto: c2_press

  c2_show_thread:
    actions:
      - add: { trust_yeogeum: 1 }
      - sticker:
          id: c2_thread
          image: thread_sticker
          x: 50
          y: 34
          width: "clamp(150px, 20%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 여금.wary
          with: [서연]
          text: "우리 가게 실이네요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "이 실을 쓴 건 작은 약주머니뿐이에요."
      - say:
          char: 여금
          with: [서연]
          text: "지난달 삼백 개요. 분이가 밤까지 남아서 혼자 꿰맸어요."
      - say:
          char: 여금
          with: [서연]
          text: "납품할 때 분이가 검수하러 따라왔어요. 오는 길에 주머니는 다 찼는데 약 냄새가 안 나더라고 하더군요."
      - clearSticker: { id: c2_thread, leave: fadeOut }
      - say:
          channel: action
          with: [여금]
          text: "여금이 소매에서 접힌 종이를 꺼낸다. 귀퉁이에 실밥이 붙어 있다."
      - say:
          char: 여금
          with: [서연]
          text: "어젯밤 분이 저고리를 여며 주다가 안섶에서 찾았어요. 거기 꿰매져 있었어요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "의녀님한테 드렸다는 말은 밖에서 하지 말아요."
      - get: order_slip
      - goto: c2_fire_alarm

  c2_press:
    actions:
      - say:
          char: 여금.wary
          with: [서연]
          text: "다퉜냐고요?"
      - say:
          char: 여금.wary
          with: [서연]
          text: "의녀가 포교 흉내를 내네. 내 가게 아이를 내가 왜 죽여요."
      - say:
          char: 여금.wary
          with: [서연]
          text: "할 말 없어요. 장례 날짜나 알려 줘요."
      - say:
          channel: action
          with: []
          text: "여금이 나간 뒤, 분이의 저고리를 펼친다. 안섶 한쪽에 끝이 풀린 실밥이 보인다."
      - say:
          channel: action
          with: []
          text: "그 둘레만 유난히 촘촘하게 꿰맸다. 실을 뜯으니 접힌 종이가 나온다."
      - get: order_slip
      - goto: c2_fire_alarm

  c2_fire_alarm:
    title: "불"
    actions:
      - sticker:
          id: c2_slip
          image: order_slip_sticker
          x: 50
          y: 30
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "‘감청 주머니 삼백.’ 주문한 집 이름 자리에 붉은 표식이 있고, 뒤에는 분이 글씨로 ‘약 냄새 없음. 박씨에게 확인’이라고 적혀 있다."
      - clearSticker: { id: c2_slip, leave: fadeOut }
      - mood: { tone: dread, level: 1 }
      - say:
          channel: narration
          text: "담 너머로 종소리가 들렸다. 혜민서 옆 박씨 약방에서 불이 났다고 누가 외쳤다."
      - effect: { name: embers, wait: true }
      - bg: { id: apothecary_burnt, transition: fade, duration: 700, place: "혜민서 옆 박씨 약방" }
      - music: pressure
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨! 박 약방 영감이 아직 안에 있대요!"
      - say:
          channel: action
          with: [막쇠]
          text: "연기 사이로 쓰러진 사람의 발. 그 옆에 쇠 장식 궤짝이 하나 있고, 대들보가 신음한다."
      - say:
          channel: thought
          with: []
          text: "영감은 움직이지 않는다. 막쇠는 벌써 업으려고 들어갔다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨는 들어오지 마요! 연기가 아래로 깔렸어!"
      - say:
          channel: action
          with: []
          text: "문틀이 뜨겁다. 서까래에서 흙이 떨어지고, 불은 궤짝 쪽으로 번지고 있다."
      - say:
          channel: thought
          with: []
          text: "막쇠가 영감을 업고 두 걸음도 못 옮겼다. 궤짝에는 장부가 들었을지도 모른다."
      - choice:
          key: c2_rescue
          prompt: "대들보가 내려앉는다. 무엇을 먼저 잡을까?"
          with: [서연, 막쇠]
          timeoutMs: 8000
          timeoutOptionIndex: 0
          options:
            - text: "장부 궤짝을 끌어낸다"
              set: { makssoe_hurt: true }
              goto: c2_chest
            - text: "막쇠를 끌어낸다"
              saveText: "막쇠의 허리띠를 잡아 끌어낸다"
              goto: c2_pull_makssoe

  c2_chest:
    actions:
      - effect: rumble
      - mood: off
      - say:
          channel: action
          with: []
          text: "궤짝을 문턱 밖으로 끌어내다가 함께 넘어진다. 바로 뒤에서 대들보가 떨어진다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "끄윽… 다리. 다리에 걸렸어."
      - say:
          channel: narration
          text: "이웃들이 대들보를 들어 올렸다. 막쇠는 왼발에 힘을 주려다 주저앉았다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아가씨, 그 고리 놓으세요. 다 나왔수."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "영감은 업을 때부터 숨이 끊겼었소. 아, 내 다리 좀 받쳐 줘요."
      - goto: c2_after_fire

  c2_pull_makssoe:
    actions:
      - effect: rumble
      - mood: off
      - say:
          channel: action
          with: []
          text: "허리띠를 잡아당긴다. 막쇠가 영감을 업은 채 넘어진 자리로 대들보가 떨어진다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨, 이제 내 허리띠 놔도 돼요."
      - say:
          channel: narration
          text: "불이 잦아든 뒤에야 궤짝을 꺼냈다. 뚜껑을 열어 보니 그을린 장부 한 장이 남아 있었다."
      - goto: c2_after_fire

  c2_after_fire:
    title: "불 속의 시신"
    actions:
      - sticker:
          id: c2_ledger
          image: ledger_burnt_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "그을린 장부에 ‘청심원 삼백 환’, 그 뒤에 ‘한’ 자 하나가 남아 있다."
      - say:
          channel: thought
          with: []
          text: "삼백. 주머니도 삼백이었다."
      - get: burnt_ledger
      - clearSticker: { id: c2_ledger, leave: fadeOut }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "약방 주인이 불을 끄려다가 연기에 숨이 막혔다 하오. 검안 기록을 쓰겠소?"
      - say:
          char: 서연.resolve
          with: [도원]
          text: "쓰겠습니다. 불이 붙을 때 숨을 쉬고 있었는지부터 보겠습니다."
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - goto: c2_examine

  c2_examine:
    title: "박씨의 몸"
    actions:
      - choice:
          key: c2_examine
          presentation: explore
          prompt: "약방 주인 박씨. 예순둘."
          with: []
          camera: wide
          options:
            - text: "콧속"
              at: { x: 62, y: 9 }
              when: { var: c2_nose, op: eq, value: false }
              goto: c2_nose_scene
            - text: "손과 팔"
              at: { x: 30, y: 92 }
              when: { var: c2_hands, op: eq, value: false }
              goto: c2_hands_scene
            - text: "목의 상처"
              at: { x: 66, y: 22 }
              when: { var: c3_wound, op: eq, value: false }
              goto: c2_wound_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c2_nose, op: eq, value: true }
                  - { var: c2_hands, op: eq, value: true }
                  - { var: c3_wound, op: eq, value: true }
              goto: c2_poison

  c2_nose_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "젖은 종이 심지를 콧속에 넣었다 뺀다. 하얗다."
      - say:
          char: 막쇠
          with: [서연]
          text: "불 속에서 숨을 쉬었으면 콧구멍이 시커메지요. 목구멍까지."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "불이 나기 전에 이미 숨을 안 쉬었다는 거네요."
      - set: { c2_nose: true }
      - goto: c2_examine

  c2_hands_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "두 손이 가지런하다. 화상도, 문을 두드린 멍도 없다."
      - say:
          channel: thought
          text: "불을 끄려 했다는데 손에는 그을음도 상처도 없다."
      - set: { c2_hands: true }
      - goto: c2_examine

  c2_wound_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "목 왼쪽에 얕게 그은 자국. 살이 오므라들지 않았고 피도 거의 맺히지 않았다."
      - say:
          char: 막쇠
          with: [서연]
          text: "산 사람을 그으면 살이 말려들고 피가 엉겨요."
      - say:
          char: 막쇠
          with: [서연]
          text: "숨이 끊어진 뒤에 난 상처 같소. 강도 짓으로 꾸며 놓은 거요."
      - say:
          char: 막쇠
          with: [서연]
          text: "가만. 종이 대고 먹 문질러 떠 둡시다."
      - say:
          char: 막쇠
          with: [서연]
          text: "그러면 자국이 난 방향하고 폭을 나중에도 볼 수 있어요."
      - say:
          char: 서연
          with: [막쇠]
          text: "네. 종이는 제가 받칠게요."
      - sticker:
          id: c2_rubbing
          image: wound_rubbing_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "먹을 입힌 종이에 하얀 자국이 남았다. 오른쪽 위에서 왼쪽 아래로 비스듬하다. 폭은 한 치다."
      - get: wound_rubbing
      - clearSticker: { id: c2_rubbing, leave: fadeOut }
      - set: { c3_wound: true }
      - goto: c2_examine

  c2_poison:
    title: "은비녀"
    actions:
      - sticker:
          id: c2_pin
          image: silver_pin_sticker
          x: 50
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "은비녀를 혀 밑에 넣고 한참 뒤 뺀다. 은빛 그대로다."
      - get: silver_pin
      - clearSticker: { id: c2_pin, leave: fadeOut }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원
          with: [서연, 막쇠]
          text: "독은 아니란 말이오? 그럼 불이 붙기 전에 어째서 숨이 멎었겠소?"
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "비녀가 멀쩡해도 독이 없었다고는 못 해요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "은빛을 바꾸지 않는 독도 있어요."
      - say:
          char: 도원
          with: [막쇠]
          text: "…허."
      - choice:
          key: c2_poison
          prompt: "은비녀는 깨끗하다. 어떻게 할까?"
          with: [서연, 도원, 막쇠]
          options:
            - text: "노환으로 기록한다"
              saveText: "독은 아니다. 늙어 숨이 멎은 것으로 적는다"
              forgiveOnce: true
              forgiveMessage: "막쇠가 고개를 젓는다. '숨이 멎은 송장 목을 누가 그어요?'"
              goto: c2_bad_close
            - text: "닭에게 밥을 먹여 독을 확인한다"
              saveText: "입에 밥을 물렸다가 닭에게 먹여 본다"
              goto: c2_chicken

  c2_bad_close:
    actions:
      - say:
          channel: record
          text: "초검 시장. 박씨, 노환으로 숨이 멎은 뒤 화재로 시신이 손상됨. 범죄 흔적 없음."
      - say:
          channel: narration
          text: "시장이 올라가자 포도청은 불을 낸 사람만 찾았다. 짐꾼 하나가 잡혀 왔다."
      - say:
          channel: narration
          text: "약방 주인의 목에 난 상처는 아무도 설명하지 않았다."
      - say:
          channel: thought
          with: []
          text: "목의 상처를 적은 종이 위로 비녀를 내려놓았다."
      - gameOver:
          title: "닫힌 검안"
          message: "비녀가 검게 변하지 않았어도 독을 배제할 수 없다. 『무원록』에는 다른 검시법도 들어 있다."
          recoverToChoice: c2_poison

  c2_chicken:
    actions:
      - say:
          channel: action
          with: []
          text: "찬밥 한 덩이를 망자 입에 물렸다가 두 식경 뒤 꺼내, 마당의 닭에게 던진다."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "이거 옛 어른들이 쓰던 건데. 책에 진짜 있수?"
      - say:
          char: 서연
          with: [막쇠]
          text: "서른아홉 장이요. 아저씨 말씀 듣고 찾아봤어요. 닭 그림도 있어요."
      - wait: 0
      - say: { channel: card, with: [], text: "잠시 뒤", autoAdvance: 1300 }
      - say:
          channel: narration
          text: "반 식경도 안 되어 닭이 비틀거렸다. 날개를 한 번 퍼덕이고 쓰러졌다."
      - sticker:
          id: c2_note
          image: poison_note_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 280px)"
          enter: fadeIn
          inputLockMs: 300
      - get: poison_note
      - clearSticker: { id: c2_note, leave: fadeOut }
      - add: { trust_dowon: 1 }
      - say:
          char: 도원.stern
          with: [서연]
          text: "…독을 먹이고, 목을 긋고, 불을 질렀다. 강도 짓으로 보이게."
      - say:
          char: 서연.think
          with: [도원]
          text: "장부에는 청심원 삼백 환, 분이 주문서에는 약주머니 삼백 개라고 적혀 있습니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "분이가 박씨를 찾아가려 했다는 말이군. 그래도 수가 같다는 것만으로 같은 물건이라 할 수는 없소."
      - say:
          char: 서연
          with: [도원]
          text: "네. 장부에 남은 ‘한’ 자가 누구를 가리키는지부터 알아보겠습니다."
      - say:
          char: 막쇠.grin
          with: [서연, 도원]
          text: "아가씨, 이거 옆집 닭인데 값은 누가 물어 주우?"
      - say:
          char: 서연
          with: [막쇠]
          text: "…제 삯에서 드릴게요."
      - say:
          char: 막쇠
          with: [서연]
          text: "농이오. 내가 물지."
      - say:
          char: 막쇠
          with: [서연]
          text: "40년 일하면서 책에 적힌 대로 해 본 건 처음이오. 이 정도는 내가 내야지."
      - goto: c2_arrest

  c2_arrest:
    title: "잡혀 온 짐꾼"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 700, place: "해 질 녘 · 한성부 마당" }
      - music: pressure
      - say:
          channel: narration
          text: "해 질 녘 한성부 마당. 포졸이 달려와 판관에게 무언가 아뢰었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "포도청에서 약방 주인을 죽이고 불을 지른 자를 잡았다 하오."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "짐꾼 덕구. 낫을 들고 약방 뒤에 있었다고."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…이미 곤장 열 대에 자복했다는군."
      - say:
          char: 서연.shock
          with: [도원]
          text: "오늘 잡혔는데 벌써 자복했다고요?"
      - say:
          char: 서연
          with: [도원]
          text: "검안 기록도 안 갔는데 매부터 들었군요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그렇다 하오. 포교 강치수가 올린 거요."
      - say:
          char: 서연
          with: [도원]
          text: "박씨 목의 상처는 포도청에서 알고 있습니까?"
      - say:
          char: 도원.troubled
          with: [서연]
          text: "내가 쓴 시장도 아직 서랍에 있소. 읽어 보겠다 온 사람 하나 없더군."
      - say:
          channel: thought
          with: [도원]
          text: "열 대. 분이 오라비가 받을 뻔한 것과 같은 수다."
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "다리만 성했으면 포도청 담이라도 넘을 텐데."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "아가씨, 내 몫까지 가요."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: false }
          with: [서연, 도원]
          text: "포도청 옥에 넣으면 사흘 안에 끝장이오. 가 봅시다, 아가씨."
      - goto: /2.yaml
