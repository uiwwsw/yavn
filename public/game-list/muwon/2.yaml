chapterTitle: "곤장 아래 자백"

script:
  - scene: jail_visit
  - scene: c3_look

scenes:
  jail_visit:
    title: "포도청 옥"
    actions:
      - bg: { id: jail, transition: fade, duration: 800 }
      - music: pressure
      - say:
          channel: record
          text: "9월 23일. 포도청 남옥. 약방에 불을 지르고 주인을 죽였다는 혐의로 짐꾼 덕구가 갇혀 있다."
      - say:
          channel: action
          with: []
          camera: wide
          text: "창살 너머 짚더미 위에 사내가 모로 누워 있다. 바지 엉덩이 쪽이 검붉게 굳었다."
      - char: { id: 서연, position: left }
      - char: { id: 덕구, position: center }
      - say:
          char: 덕구.scared
          with: [서연]
          text: "제, 제가 했어요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "했다니까요. 그만 때려요…"
      - say:
          char: 서연
          with: [덕구]
          text: "때리러 온 게 아니에요. 의녀예요."
      - say:
          char: 서연
          with: [덕구]
          text: "맞은 데부터 볼게요. 옆으로 누워 있어요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…짐꾼 덕구예요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "지게만 졌어요. 불은 구경도 못 했는데…"
      - say:
          channel: action
          with: [덕구]
          text: "바지를 내리자 살이 터져 짚이 들러붙어 있다. 떼면 또 터지니 물을 적셔 불린다."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "아, 아아."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…아니에요. 괜찮아요. 하세요."
      - say:
          char: 서연
          with: [덕구]
          text: "손 뗄게요. 천천히 숨 쉬어요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…예."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "아프다고 하면… 더 때려요."
      - say:
          channel: thought
          with: []
          text: "약 묻은 손을 거두니 덕구가 한참 뒤에야 숨을 내쉰다."
      - say:
          char: 서연
          with: [덕구]
          text: "덕구야, 포교가 맨 처음에 뭐라 하던가요?"
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…어."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "불을… 제가 질렀냐고요."
      - say:
          char: 서연
          with: [덕구]
          text: "어디에 불을 붙였는지도 묻던가요?"
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…그건 안 물어봤어요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "질렀냐고만 물어봤어요."
      - say:
          channel: thought
          with: []
          text: "공초를 다시 봐야겠다. 어디에 불을 붙였는지는 빠져 있을 것이다."
      - say:
          channel: action
          with: [덕구]
          text: "고약을 펴 바르는 동안 덕구는 오른손으로 창살을 꽉 쥐고 있다. 손바닥 굳은살이 두껍다."
      - char: { id: 강치수, position: right }
      - say:
          char: 강치수.angry
          with: [서연, 덕구]
          text: "의녀가 죄인 엉덩이까지 돌보나. 판관 나리를 등에 업으니 겁날 게 없소?"
      - say:
          char: 강치수
          with: [서연]
          text: "자백은 받았소. 흉기도 찾았소."
      - say:
          char: 강치수
          with: [서연]
          text: "사흘 뒤면 끝날 일이오."
      - goto: c3_look

  c3_look:
    actions:
      - choice:
          key: c3_look
          presentation: explore
          prompt: "포교가 지켜본다. 무엇을 확인할까?"
          with: [서연, 강치수, 덕구]
          options:
            - text: "덕구의 낫"
              saveText: "흉기라는 낫"
              at: { x: 30, y: 55 }
              when: { var: c3_sickle, op: eq, value: false }
              goto: c3_sickle_scene
            - text: "덕구의 손"
              at: { x: 70, y: 45 }
              when: { var: c3_hand, op: eq, value: false }
              goto: c3_hand_scene
            - text: "포교와 이야기한다"
              when:
                all:
                  - { var: c3_sickle, op: eq, value: true }
                  - { var: c3_hand, op: eq, value: true }
              goto: c3_offer

  c3_sickle_scene:
    actions:
      - sticker:
          id: c3_sickle
          image: sickle_sticker
          x: 50
          y: 34
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "형틀 옆에 세워 둔 낫을 살핀다. 날이 두껍고 너비가 두 치를 넘는다."
      - say:
          channel: thought
          with: []
          text: "탁본에 남은 자국은 한 치였다. 이 낫의 날은 그 두 배가 넘는다."
      - say:
          char: 서연
          with: [강치수]
          text: "나리. 이 낫은 어디서 찾았습니까."
      - say:
          char: 강치수
          with: [서연]
          text: "뭐요."
      - say:
          char: 강치수
          with: [서연]
          text: "덕구 지게에 꽂혀 있었소. 풀 베는 낫이오."
      - say:
          char: 서연
          with: [강치수]
          text: "날에 피가 묻은 곳이 없습니다. 녹은 그대로고요."
      - say:
          char: 강치수.angry
          with: [서연]
          text: "닦았겠지."
      - say:
          char: 서연
          with: [강치수]
          text: "녹 사이까지 닦았다면 닦은 자리가 남았을 겁니다."
      - say:
          char: 강치수
          with: [서연]
          text: "…쯧."
      - say:
          channel: action
          with: []
          text: "강치수가 발끝으로 낫 아래 짚을 헤집는다. 입은 열지 않는다."
      - get: deokgu_sickle
      - clearSticker: { id: c3_sickle, leave: fadeOut }
      - set: { c3_sickle: true }
      - goto: c3_look

  c3_hand_scene:
    actions:
      - say:
          char: 서연
          with: [덕구]
          text: "덕구야."
      - say:
          char: 서연
          with: [덕구]
          text: "이 물동이 좀 들어 봐요. 아무 손으로나."
      - say:
          channel: action
          with: [덕구]
          text: "덕구가 오른손으로 동이를 든다. 왼손은 손잡이 가까이 갔다가 내려온다."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "왼손은 어릴 때 짐수레에 깔려서…"
      - say:
          char: 덕구.scared
          with: [서연]
          text: "숟가락도 겨우 들어요."
      - say:
          channel: thought
          with: []
          text: "탁본의 자국은 오른쪽 위에서 왼쪽 아래로 비스듬하다. 왼손으로 그은 흔적이었다."
      - say:
          char: 서연
          with: [덕구]
          text: "왼손으로 이 낫 들어 볼 수 있어요?"
      - say:
          channel: action
          with: [덕구]
          text: "덕구가 왼손으로 낫을 잡으려 한다. 손가락이 제대로 오므라들지 않아 낫을 떨어뜨린다."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…죄송해요. 죄송해요."
      - say:
          char: 서연
          with: [덕구]
          text: "됐어요. 줍지 말고 그대로 둬요."
      - say:
          char: 덕구.scared
          with: [서연]
          text: "…네?"
      - say:
          char: 강치수.angry
          with: [서연, 덕구]
          text: "오른손으로 그었을 수도 있지."
      - say:
          char: 서연
          with: [강치수]
          text: "마주 보고 오른손을 썼다면 탁본과 방향이 반대일 겁니다."
      - set: { c3_hand: true }
      - goto: c3_look

  c3_offer:
    title: "포교의 셈"
    actions:
      - say:
          char: 강치수
          with: [서연, 덕구]
          text: "다 봤소?"
      - say:
          char: 강치수
          with: [서연]
          text: "그럼 내 말도 들어 보시오. 의녀 혼자 들을 말이오."
      - say:
          channel: action
          with: [강치수]
          text: "강치수가 옥문 밖 그늘로 나를 데려가 목소리를 낮춘다."
      - say:
          char: 강치수
          with: [서연]
          text: "박씨는 불이 나서 죽었다고 올리고, 덕구는 증좌가 모자라 풀어 줍시다. 의녀한테도 그게 낫소."
      - say:
          char: 강치수
          with: [서연]
          text: "대신 감청 주머니 얘기는 그만하시오. 그 약을 누가 뒤에서 대는지 모를 테니."
      - say:
          channel: thought
          with: []
          text: "나는 아직 아무 데서도 주머니 얘기를 하지 않았다."
      - say:
          char: 서연
          with: [강치수]
          text: "나리. 저는 주머니 얘기를 한 적이 없습니다."
      - say:
          char: 강치수
          with: [서연]
          text: "…비단전 행수가 말했겠지."
      - say:
          char: 서연
          with: [강치수]
          text: "여금에게 들으셨다면, 왜 그 주머니 얘기만은 덮으라 하십니까?"
      - say:
          char: 강치수.angry
          with: [서연]
          text: "의녀. 지금 포교를 떠보는 거요?"
      - say:
          char: 서연
          with: [강치수]
          text: "아닙니다. 어디까지 아시는지 여쭌 겁니다."
      - say:
          char: 강치수
          with: [서연]
          text: "나도 집에 아들 둘이 있소. 막내는 아직 젖니도 안 빠졌고."
      - say:
          char: 강치수
          with: [서연]
          text: "의녀라고 그 어린것들까지 어찌할 순 없지 않소."
      - say:
          channel: thought
          with: []
          text: "옥 안에서 덕구가 몸을 뒤척인다. 이 말을 저 사람에게 들려줘도 될까."
      - choice:
          key: c3_deal
          prompt: "덕구를 풀어 주는 대신, 더 캐묻지 말라고 한다."
          char: 강치수
          with: [서연, 강치수]
          options:
            - text: "거래를 받아들인다"
              set: { struck_deal: true }
              goto: c3_silence
            - text: "거래를 거절하고 판관에게 간다"
              saveText: "거절하고 판관 앞에서 따지자고 한다"
              goto: c3_confront_intro

  c3_silence:
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 800 }
      - music: night_well
      - say:
          channel: narration
          text: "이튿날 덕구는 풀려났다. 박씨 약방은 실화로 처리했고, 분이의 시장엔 끝내 범인 이름을 적지 않았다."
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨 덕에 덕구는 집에 갔수. 오늘 장에 나가니 보입디다."
      - say:
          char: 막쇠
          with: [서연]
          text: "근데 그 주머니, 오늘도 장에 나왔습디다."
      - say:
          char: 막쇠
          with: [서연]
          text: "에이."
      - say:
          channel: thought
          with: [막쇠]
          text: "장터에 갔더니 감청 주머니가 약방 처마에 걸려 있었다."
      - ending: price_of_silence

  c3_confront_intro:
    title: "대질"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 700 }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - char: { id: 강치수, position: right }
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "덕구도 이리 데려와 뜰 아래에 세웠소. 포교의 보고와 의녀가 옥에서 확인한 것을 대조하겠소. 자복부터 살펴봅시다."
      - say:
          char: 도원
          with: [서연]
          text: "의녀. 내 앞에서는 증좌로만 말하시오."
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "증좌 없는 고발은 무고죄요. 알겠소?"
      - say:
          channel: record
          text: "포교의 말을 반박할 증거를 고른다. 엉뚱한 증거를 내면 판관의 신뢰가 떨어진다."
      - set: { credibility: 3 }
      - goto: c3_r1

  c3_r1:
    actions:
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "덕구가 그 낫으로 영감 목을 그었소."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "흉기와 자복이 다 있는데 뭘 더 바라오?"
      - choice:
          key: c3_r1
          prompt: "낫으로 그었다는 말과 맞지 않는 증좌는?"
          char: 강치수
          options:
            - text: "상처 탁본 — 폭이 한 치"
              when: { var: wound_rubbing, op: eq, value: true }
              goto: c3_r1_right
            - text: "은비녀 — 검게 변하지 않았다"
              goto: c3_r1_wrong
            - text: "감청 실 — 비단전 물건"
              goto: c3_r1_wrong
            - text: "주머니 주문서 — 삼백 개"
              goto: c3_r1_wrong

  c3_r1_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 강치수
          with: [서연, 도원]
          text: "그게 낫이랑 무슨 상관이오? 판관 나리, 의녀가 장난을 칩니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…의녀. 낫 이야기를 하고 있소."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: c3_collapse
          default: c3_r1

  c3_r1_right:
    actions:
      - sticker:
          id: c3_rub
          image: wound_rubbing_sticker
          x: 35
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
      - sticker:
          id: c3_sk
          image: sickle_sticker
          x: 65
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.resolve
          with: [도원, 강치수]
          text: "상처 자국의 너비는 한 치입니다. 이 낫의 날은 두 치가 넘습니다."
      - say:
          char: 서연.resolve
          with: [도원, 강치수]
          text: "이 낫이 흉기라면 탁본에 남은 자국부터 달라야 합니다."
      - clearSticker: { id: c3_rub, leave: fadeOut }
      - clearSticker: { id: c3_sk, leave: fadeOut }
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "칼은 버렸겠지."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "그럼 불은? 덕구가 약방 뒤에 있었소. 불 질러 놓고 지켜본 거요."
      - say:
          char: 도원.troubled
          with: [강치수]
          text: "포교, 공초에는 어디에 불을 붙였는지가 없소. 왜 묻지 않았소?"
      - say:
          char: 강치수
          with: [도원]
          text: "…물어볼 겨를이 없었습니다. 그놈이 먼저 했다고 했으니."
      - say:
          char: 도원.stern
          with: [강치수]
          text: "포교가 먼저 곤장을 쳤소, 덕구가 먼저 자복했소?"
      - say:
          char: 강치수
          with: [도원]
          text: "…나리. 그건 어느 옥에서나 하는 겁니다."
      - say:
          channel: thought
          with: []
          text: "도원은 받아 적던 붓을 내려놓고 포교의 대답을 기다린다."
      - goto: c3_r2

  c3_r2:
    actions:
      - choice:
          key: c3_r2
          prompt: "불 속에서 죽었다는 말과 맞지 않는 증좌는?"
          char: 강치수
          options:
            - text: "감청 실 — 비단전 물건"
              goto: c3_r2_wrong
            - text: "덕구의 낫 — 날 폭 두 치"
              goto: c3_r2_wrong
            - text: "닭 실험 기록 · 독살의 단서"
              saveText: "닭 실험 기록 — 불 전에 독"
              when: { var: poison_note, op: eq, value: true }
              goto: c3_r2_right
            - text: "분이의 시장 — 목의 손자국"
              goto: c3_r2_wrong

  c3_r2_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 강치수
          with: [서연, 도원]
          text: "엉뚱한 소리. 불 얘기를 하랬더니."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: c3_collapse
          default: c3_r2

  c3_r2_right:
    actions:
      - say:
          char: 서연.resolve
          with: [도원, 강치수]
          text: "박씨 콧속에는 그을음이 없었습니다. 입에 물렸던 밥을 먹은 닭이 죽었고요."
      - say:
          char: 서연
          with: [도원, 강치수]
          text: "불이 나기 전에 독을 먹은 것으로 보입니다. 덕구에게서 독을 찾았다는 말은 못 들었습니다."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "그래도 제 입으로 했다고 했소! 그 자복을 뒤집겠다는 거요?"
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "포교가 못 찾았다는 말로는 자복을 뒤집을 수 없소. 다른 증좌가 있소?"
      - goto: c3_r3

  c3_r3:
    actions:
      - choice:
          key: c3_r3
          prompt: "자백을 뒤집을 마지막 한 가지는?"
          char: 강치수
          options:
            - text: "포교를 공범으로 지목한다"
              saveText: "포교가 범인과 한패라고 외친다"
              goto: c3_accuse_chisu
            - text: "덕구가 왼손을 못 쓴다는 점을 밝힌다"
              saveText: "덕구는 왼손을 못 쓴다 — 상처는 왼손잡이의 것"
              when: { var: c3_hand, op: eq, value: true }
              goto: c3_r3_right
            - text: "은비녀 — 검게 변하지 않았다"
              goto: c3_r3_wrong

  c3_r3_wrong:
    actions:
      - add: { credibility: -1 }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그 비녀는 독을 가려내지 못하지 않았소. 자복이 틀렸다는 증좌를 대시오."
      - branch:
          cases:
            - when: { var: credibility, op: lte, value: 0 }
              goto: c3_collapse
          default: c3_r3

  c3_accuse_chisu:
    actions:
      - say:
          char: 서연.shock
          with: [강치수, 도원]
          text: "포교 나리는 주머니를 알고 있었습니다! 범인과 한패예요!"
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "들으셨소, 판관 나리. 증좌 하나 없이 관원을 살인 공범으로 몰았소."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…무고는 무고요. 내가 경고했소."
      - say:
          channel: narration
          text: "그날 밤 {{player_name|은}} 포도청 여옥에 갇혔다. 덕구의 처결은 예정대로 사흘 뒤였다."
      - gameOver:
          title: "증좌 없는 고발"
          message: "도원은 증거로 말하라고 했다. 덕구가 왼손으로 낫을 들어 보이려던 일을 떠올린다."
          recoverToChoice: c3_r3

  c3_collapse:
    actions:
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그만하시오. 의녀의 말은 더 들을 수 없소. 자복대로 처결하겠소."
      - say:
          channel: narration
          text: "옥졸이 덕구를 다시 데려간다. 처결은 9월 26일, 새남터다."
      - say:
          channel: thought
          with: []
          text: "덕구는 끌려가다 오른손으로 풀어진 짚신 끈을 쥐었다. 옥에서 낫을 놓쳤던 건 그 반대쪽 손이다."
      - set: { deokgu_saved: false }
      - goto: c3_after

  c3_r3_right:
    actions:
      - say:
          char: 서연.resolve
          with: [도원, 강치수]
          text: "덕구는 왼손으로 숟가락도 겨우 든다고 했습니다. 옥에서 낫을 쥐게 했더니 놓치더군요."
      - say:
          char: 서연
          with: [도원, 강치수]
          text: "탁본의 방향을 보면 마주 보고 왼손을 쓴 사람의 자국입니다."
      - say:
          channel: action
          with: [도원]
          text: "도원이 탁본을 다시 살핀다. 손가락으로 베인 자국을 한 번 따라 그어 본다."
      - say:
          char: 도원.stern
          with: [서연, 강치수]
          text: "자복은 곤장 아래서 받은 것이니 믿지 않겠소. 덕구를 풀어 주시오."
      - say:
          char: 강치수.angry
          with: [서연, 도원]
          text: "…판관 나리가 후회하실 거요."
      - add: { trust_dowon: 1 }
      - set: { deokgu_saved: true }
      - char: { id: 덕구, position: right }
      - effect: heal
      - say:
          char: 덕구
          with: [서연, 도원]
          text: "지금 나가도 됩니까? …지게는 어디 가서 받으면 돼요?"
      - goto: c3_after

  c3_after:
    title: "사라진 서리"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 700 }
      - music: night_well
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "의녀, 검안 기록을 베껴 쓰던 서리 윤길이 이틀째 관아에 안 나오오."
      - say:
          char: 도원
          with: [서연]
          text: "마지막으로 봤을 때 묻더군. 전의감에서 왜 우리 시장을 빌려 갔느냐고."
      - say:
          channel: thought
          with: [도원]
          text: "전의감. 임금의 약을 짓는 관청. 청심원을 만드는 곳."
      - say:
          channel: narration
          text: "9월 25일 밤, 서빙고지기가 한성부 문을 두드렸다. 얼음 사이에서 사람이 나왔다고."
      - goto: /3.yaml
