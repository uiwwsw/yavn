        full: { scale: 1 }
      defaultDelivery: calm
      emotions:
        grin: assets/char/makssoe-grin.svg
        hurt: assets/char/makssoe-hurt.svg
    강치수:
      name: "포교 강치수"
      placement: prompt-top
      base: assets/char/chisu.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
      defaultDelivery: angry
      emotions:
        angry: assets/char/chisu-angry.svg
    여금:
      name: "행수 여금"
      placement: prompt-top
      base: assets/char/yeogeum.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
      defaultDelivery: calm
