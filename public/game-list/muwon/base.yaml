  characters:
    서연:
      name: "의녀 {{player_name}}"
      placement: prompt-top
      base: assets/char/seoyeon.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
      defaultDelivery: calm
      emotions:
        think: assets/char/seoyeon-think.svg
        shock: assets/char/seoyeon-shock.svg
        resolve: assets/char/seoyeon-resolve.svg
    도원:
      name: "판관 김도원"
      placement: prompt-top
      base: assets/char/dowon.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
      defaultDelivery: neutral
      emotions:
        stern: assets/char/dowon-stern.svg
        troubled: assets/char/dowon-troubled.svg
    막쇠:
