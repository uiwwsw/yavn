      placement: prompt-top
      base: assets/char/deokgu.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
      defaultDelivery: nervous
      emotions:
        scared: assets/char/deokgu-scared.svg
    곰보:
      name: "복면 사내"
      placement: prompt-top
      base: assets/char/gombo.svg
      facing: front
      defaultFraming: portrait
      framings:
        portrait: { scale: 1, cropBottom: 0.3 }
        full: { scale: 1 }
