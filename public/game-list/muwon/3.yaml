chapterTitle: "서빙고의 얼음"

script:
  - scene: ice_vault
  - scene: c4_body

scenes:
  ice_vault:
    title: "얼음 사이"
    actions:
      - bg: { id: seobinggo, transition: fade, duration: 900 }
      - music: night_well
      - say:
          channel: record
          text: "구월 스무닷새 밤. 한강 변 서빙고. 한성부 서리 윤길, 얼음 더미 사이에서 발견."
      - say:
          channel: action
          with: []
          camera: wide
          text: "입김이 하얗다. 짚 아래 얼음 덩이가 층층이 쌓였고, 왼쪽 더미 하나가 비스듬히 기울었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - char: { id: 막쇠, position: right }
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기 말로는 오늘 저녁에 발견했다 하오. 몸이 돌처럼 굳었소. 죽은 지 오래요."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "다리 끌고 왔수. 이건 내 눈으로 봐야 해서. 아가씨, 몸부터 봐요."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: false }
          with: [서연, 도원]
          text: "얼음 곳간에서 굳은 송장은 속여요. 굳은 게 죽은 시각을 다 말해 주진 않거든."
      - say:
          char: 서연.think
          with: [도원, 막쇠]
          text: "나리. 윤길은 한성부 서리입니다. 서빙고에 올 일이 있는 사람입니까."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "없소. 얼음 출납은 공조 소관이오. 서리가 여기 와서 볼 문서가 없소."
      - say:
          char: 서연
          with: [도원]
          text: "…올 일이 없는데 와 있네요."
      - say:
          channel: thought
          with: []
          text: "윤길은 내 시장을 베껴 간 사람이다. 베끼면서 뭘 봤는지 물어볼 참이었다. 사흘 늦었다."
      - say:
          channel: action
          with: []
          text: "얼음지기는 곳간 밖 짚더미에 앉아 있다. 올 때부터 그 자리였다고 한다."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기는 오늘 낮에 사람이 둘 왔다 했소. 하나는 얼음을 받아 갔고, 하나는 안 나갔다 하오."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "안 나간 쪽이 저기 누워 있는 게지. 받아 간 쪽 이름은 들었수?"
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기는 글을 모르오. 도장을 받았다고만 하오."
      - say:
          channel: thought
          with: []
          text: "글 모르는 사람한테는 도장만 보여 주면 된다. 이름은 안 써도 된다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨. 이 곳간은 겨울에 강 얼음을 떠다 짚에 묻어 두는 데요. 여름까지 안 녹아요."
      - say:
          char: 막쇠
          with: [서연]
          text: "그 짚이 송장도 그만큼 오래 붙들어 놔요. 날짜를 못 믿게 돼."
      - goto: c4_body

  c4_body:
    actions:
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - choice:
          key: c4_body
          presentation: explore
          prompt: "서리 윤길. 스물넷. 무엇이 맞지 않는가?"
          with: []
          camera: wide
          options:
            - text: "등과 엉덩이의 시반"
              at: { x: 68, y: 50 }
              when: { var: c4_lividity, op: eq, value: false }
              goto: c4_lividity_scene
            - text: "굳은 팔다리"
              at: { x: 30, y: 92 }
              when: { var: c4_stiff, op: eq, value: false }
              goto: c4_stiff_scene
            - text: "소매 속"
              at: { x: 70, y: 92 }
              when: { var: register_page, op: eq, value: false }
              goto: c4_sleeve_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c4_lividity, op: eq, value: true }
                  - { var: c4_stiff, op: eq, value: true }
                  - { var: register_page, op: eq, value: true }
              goto: c4_reason

  c4_lividity_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "몸을 모로 돌린다. 등에 핏빛 얼룩이 연하게 번져 있다. 손가락으로 누르자 하얗게 빠진다."
      - say:
          char: 막쇠
          with: [서연]
          text: "시반이 아직 눌리면 빠진다? 그럼 죽은 지 한나절이 안 된 거요."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "하루 지나면 눌러도 안 빠집니다."
      - say:
          channel: action
          with: []
          text: "같은 자리를 다시 누르고 손가락을 뗀다. 하얗게 빠진 자리가 천천히 다시 붉어진다."
      - say:
          char: 서연
          with: [막쇠]
          text: "열 셀 동안 돌아왔어요. 반나절. 더는 안 됐습니다."
      - say:
          channel: thought
          with: []
          text: "언해 둘째 장. 시반은 등과 엉덩이에 앉고, 앉은 자리가 몸이 눕힌 자리를 말한다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 등에 앉았어요. 죽고 나서 등 대고 누워 있었다는 거예요."
      - say:
          char: 막쇠
          with: [서연]
          text: "얼음 더미 사이에 끼어 있던 건 모로 누운 모양이었수. 그럼 누가 옮긴 거요."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "네. 어디 반나절 눕혀 놓고 여기로 들고 왔어요."
      - set: { c4_lividity: true }
      - goto: c4_body

  c4_stiff_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "팔꿈치를 굽히려 해도 꿈쩍 않는다. 살갗이 얼음처럼 차다. 겉이 언 것이다."
      - say:
          channel: thought
          with: []
          text: "굳은 게 아니라 얼었다. 얼리면 오래 죽은 몸처럼 보인다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "아저씨, 턱을 봐 주세요. 굳는 건 턱에서 시작해 아래로 내려갑니다."
      - say:
          char: 막쇠
          with: [서연]
          text: "턱은… 움직이오. 아래턱이 아직 무르네. 그런데 손목은 돌처럼 굳었어."
      - say:
          char: 서연
          with: [막쇠]
          text: "거꾸로예요. 턱이 먼저 굳어야 맞는데."
      - say:
          channel: action
          with: []
          text: "손등을 손가락으로 눌러 본다. 자리가 움푹 들어가 그대로 남는다. 살이 아니라 언 것이 들어간 자리다."
      - say:
          char: 막쇠
          with: [서연]
          text: "눌린 자리가 안 돌아오네. 이건 얼린 고기요. 사십 년 봤는데 이건 고기요."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "열 덩이면 사람 하나 반나절 덮습니다. 겉만 얼어도 이렇게 돼요."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "…그러면 얼음지기가 '죽은 지 오래'라고 한 것도 그대로 적으면 안 되는 거요?"
      - say:
          char: 서연
          with: [도원]
          text: "안 됩니다. 얼음지기는 본 대로 말한 거예요. 그렇게 보이게 해 놓은 사람이 따로 있습니다."
      - set: { c4_stiff: true }
      - goto: c4_body

  c4_sleeve_scene:
    actions:
      - sticker:
          id: c4_page
          image: register_page_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "소매 안쪽에 접힌 종이. 우리 시장을 옮겨 적은 장이다. 한 이름에 붉은 동그라미."
      - say:
          channel: thought
          with: []
          text: "시장을 빌려 간 사람의 이름. '전의감 의관 한명재.'"
      - say:
          channel: action
          with: []
          text: "종이는 네 번 접혀 있고 접힌 자리가 닳았다. 여러 번 펴 본 종이다."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "…제 시장이에요. 분이 것. 이걸 품에 넣고 다녔네요."
      - say:
          char: 막쇠
          with: [서연]
          text: "베껴 가는 게 서리 일이오. 품에 넣고 다니는 건 서리 일이 아니지."
      - say:
          channel: thought
          with: []
          text: "대출 기록에는 이름 옆에 날짜가 있다. 분이가 죽은 이튿날이다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "분이 죽은 이튿날에 의관이 빌려 갔어요. 적은 사람이 윤길이고요."
      - say:
          char: 막쇠
          with: [서연]
          text: "적은 놈이 그걸 들고 다녔으면, 적은 다음에 뭘 알아챈 거요."
      - say:
          char: 서연
          with: [막쇠]
          text: "알아챘으면 물어봤겠죠. 누구한테 물어봤을까요."
      - get: register_page
      - clearSticker: { id: c4_page, leave: fadeOut }
      - goto: c4_body

  c4_reason:
    actions:
      - bg: { id: seobinggo, transition: dissolve, duration: 620 }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 서연.think
          with: [도원]
          text: "윤길은 오늘 낮에 죽었습니다. 범인이 얼음에 묻어 며칠 된 송장처럼 만들었어요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그럼 범인은 오늘 낮에 이 곳간에 들어왔다는 말이군. 얼음 출납을 보면…"
      - say:
          char: 서연
          with: [도원]
          text: "낮에 다른 데서 죽었습니다. 거기 반나절 누워 있었고요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그동안 범인은?"
      - say:
          char: 서연
          with: [도원]
          text: "얼음을 받아 갔습니다. 약재 보관용으로요."
      - say:
          char: 도원
          with: [서연]
          text: "…그걸로 겉을 얼렸다는 말이오?"
      - say:
          char: 서연
          motion: nod
          with: [도원]
          text: "네. 그리고 저녁에 여기 끼워 뒀습니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "사흘 된 송장이면 그날은 딴 데 있었다고 하겠군. 얼음으로 날짜를 산 거요."
      - say:
          char: 서연
          with: [도원]
          text: "오늘 얼음 받아 간 사람만 알면 됩니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…의녀. 형조에서 그 말을 하면 얼음이 사람 죽였다는 소리로 들리오."
      - say:
          char: 서연.resolve
          with: [도원]
          text: "날짜를 속인 건 얼음이고, 목을 조른 건 손입니다. 따로 적습니다."
      - goto: c4_storeroom

  c4_storeroom:
    actions:
      - choice:
          key: c4_storeroom
          presentation: explore
          prompt: "곳간 안. 얼음지기의 물건들."
          with: []
          camera: wide
          options:
            - text: "출납부"
              at: { x: 66, y: 40 }
              when: { var: c4_ledger, op: eq, value: false }
              goto: c4_ledger_scene
            - text: "짚 아래 상자"
              at: { x: 34, y: 62 }
              when: { var: c4_box, op: eq, value: false }
              goto: c4_box_scene
            - text: "막쇠를 찾는다"
              when:
                all:
                  - { var: c4_ledger, op: eq, value: true }
                  - { var: c4_box, op: eq, value: true }
              goto: c4_missing

  c4_ledger_scene:
    actions:
      - sticker:
          id: c4_ledger
          image: ice_ledger_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "오늘 날짜 아래 '얼음 열 덩이 반출, 약재 보관용'. 받은 사람 이름 대신 붉은 도장."
      - say:
          channel: action
          with: []
          text: "위로 넘겨 본다. 지난달에도 열 덩이. 그 앞 달에도 열 덩이. 같은 도장이 달마다 한 번씩 찍혀 있다."
      - say:
          channel: thought
          with: []
          text: "달마다 열 덩이. 오늘이 처음이 아니다."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리, 약재를 차게 두려면 달마다 열 덩이씩 쓰는 게 맞습니까."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "전의감 약고가 그만큼 크지 않소. 많소. 서너 덩이면 될 것을."
      - say:
          char: 서연
          with: [도원]
          text: "남는 일곱 덩이는 어디에 쓴 걸까요."
      - get: ice_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - set: { c4_ledger: true }
      - goto: c4_storeroom

  c4_box_scene:
    actions:
      - sticker:
          id: c4_pill
          image: fake_pill_sticker
          x: 40
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
      - sticker:
          id: c4_seal
          image: seal_mark_sticker
          x: 62
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "짚 아래 나무 상자. 감청 주머니가 빼곡하다. 환약 하나를 쪼갠다. 속이 하얀 석회다."
      - say:
          channel: action
          with: []
          text: "상자 뚜껑의 도장. 출납부의 도장과 같다. 오른쪽 아래 모서리가 깨진 것까지."
      - say:
          channel: action
          with: []
          text: "주머니를 세어 본다. 열씩 끈으로 엮어 놓은 줄이 스물여덟. 끝에 낱개로 아홉."
      - say:
          channel: thought
          with: []
          text: "이백여든아홉. 삼백에서 열하나가 빠졌다."
      - say:
          char: 서연.shock
          with: []
          text: "…열하나는 이미 나갔네."
      - say:
          channel: action
          with: []
          text: "환약을 혀끝에 대 본다. 쓴맛이 없다. 청심원은 쓰다. 이건 아무 맛도 없다."
      - say:
          channel: thought
          with: []
          text: "맛이 없으니 아이도 뱉지 않는다. 사 간 사람은 약이 순하다고 했을 것이다."
      - say:
          channel: thought
          with: []
          text: "얼음 일곱 덩이는 이 상자 밑에 있다. 짚 아래가 아직 차다."
      - get: fake_pill
      - get: seal_mark
      - clearSticker: { id: c4_pill, leave: fadeOut }
      - clearSticker: { id: c4_seal, leave: fadeOut }
      - set: { c4_box: true }
      - goto: c4_storeroom

  c4_missing:
    title: "곳간 안쪽"
    actions:
      - music: pressure
      - say:
          channel: thought
          with: []
          text: "막쇠가 없다. 아까 안쪽 더미를 보러 간다고 했다."
      - say:
          channel: action
          with: []
          text: "등불을 들고 안쪽으로 간다. 기울어진 얼음 더미 너머에서 무언가 끌리는 소리."
      - say:
          char: 막쇠.hurt
          with: []
          text: "아가씨… 오지 마! 왼손에 칼—"
      - attack:
          attacker: 곰보
          target: player
          from: left
          style: slash
          strength: heavy
          anticipation: 700
          caption: "기울어진 얼음 더미 그늘에서 복면이 튀어나온다. 왼손에 짧은 칼."
      - choice:
          key: c4_ambush
          prompt: "복면이 다시 칼을 든다!"
          char: 곰보
          with: [곰보]
          timeoutMs: 7000
          timeoutOptionIndex: 2
          options:
            - text: "기울어진 얼음 더미를 밀어 넘어뜨린다"
              goto: c4_push_ice
            - text: "막쇠를 부르며 곧장 안쪽으로 뛴다"
              goto: c4_run_in
            - text: "등불을 던지고 물러선다"
              goto: c4_throw_lantern

  c4_run_in:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠 쪽으로 뛴다. 복면은 비켜서지 않는다. 왼손이 낮게 들어온다."
      - effect: { name: impact, wait: true }
      - say:
          channel: narration
          text: "얼음 바닥에 등불이 굴렀다. 불빛이 꺼지기 전에 본 것은 자기 저고리에 번지는 검은 얼룩이었다."
      - say:
          channel: thought
          with: []
          text: "더미가 기울어 있었는데. 그걸 쓸 생각을 못 했다."
      - say:
          channel: narration
          text: "이튿날 서빙고에서 두 사람이 더 나왔다. 시장에는 '실족'이라 적혔다."
      - gameOver:
          title: "얼음 곳간의 어둠"
          message: "맨몸으로 칼 앞에 뛰어들었다. 곳간에는 이미 기울어진 얼음 더미가 있었다."
          recoverToChoice: c4_ambush

  c4_push_ice:
    actions:
      - effect: { name: shake, wait: true }
      - say:
          channel: action
          with: []
          text: "어깨로 더미를 민다. 얼음 덩이들이 굴러 복면과 나 사이로 쏟아진다."
      - say:
          channel: narration
          text: "복면은 얼음에 정강이를 맞고 비틀거리다 뒷문으로 달아났다. 왼손의 칼이 바닥에 떨어졌다."
      - branch:
          cases:
            - when: { var: makssoe_hurt, op: eq, value: true }
              goto: c4_too_late
          default: c4_saved

  c4_throw_lantern:
    actions:
      - say:
          channel: action
          with: []
          text: "등불을 복면 얼굴로 던진다. 짚에 불이 붙는다. 복면이 물러선다. 나도 물러선다."
      - say:
          channel: narration
          text: "불길이 짚을 타고 안쪽으로 번졌다. 복면은 그 틈에 사라졌다."
      - say:
          channel: narration
          text: "불을 끄고 안쪽에 닿았을 때, 막쇠는 얼음에 등을 기댄 채 눈을 감고 있었다."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_too_late:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠에게 달려간다. 다친 다리 때문에 피하지 못했다. 옆구리가 젖어 있다."
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다리만 안 다쳤어도… 하, 궤짝 건진 값이네. 아가씨 잘못 아니유."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_farewell:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아가씨 책… 한글이라 다행이오. 나 같은 놈도 읽겠더라고."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "말 하지 마세요. 손 떼지 말고 누르고 계세요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "…사십 년을 송장만 봤는데, 내 차례는 영 안 익숙하네."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다음 송장은… 아가씨가 먼저 읽어 줘요. 남이 글 써 놓기 전에."
      - say:
          char: 서연
          with: [막쇠]
          text: "…네."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "대답 빨리 하네. 그거 좋수."
      - say:
          channel: narration
          text: "오작인의 시신은 관에서 거두지 않는다. {{player_name|은}} 그 밤 시장 한 장을 따로 썼다."
      - say:
          channel: record
          text: "시장. 오작인 막쇠. 나이 모름. 왼쪽 옆구리 자상 하나. 깊이 두 치. 왼손잡이의 칼."
      - say:
          channel: thought
          with: []
          text: "이름 말고는 적을 게 없었다. 나이도 몰랐다. 사십 년을 같이 일한 사람도 없었다."
      - goto: c4_seal_owner

  c4_saved:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아이고, 늙은이 얼음에 묻힐 뻔했네. 아가씨 어깨 하나는 장정이오."
      - say:
          char: 서연
          with: [막쇠]
          text: "피 나요. 가만있어요. 지혈부터 해요."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그놈 왼손잡이요. 칼을 왼손으로 쥐고 덤볐어. 약방 영감 목 그은 놈이 그놈이야."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "박씨 목의 상처가 왼쪽에서 오른쪽으로 비껐습니다. 맞아요."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨. 저 칼 두고 갔수. 저거 챙겨요. 날 폭 재 두고."
      - say:
          channel: action
          with: []
          text: "칼은 날 폭 한 치. 분이 목의 손자국 옆에 났던 얕은 자리와 맞는다."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "복면은 심부름꾼이오. 심부름꾼한테 칼 쥐여 보내는 사람이 윗사람이지."
      - goto: c4_seal_owner

  c4_seal_owner:
    title: "깨진 도장"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 800 }
      - music: inquest
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 도원.stern
          with: [서연]
          text: "출납부와 상자의 도장을 전의감 인부와 대 보았소. 의관 한명재의 사인이오."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "형조에 고발하겠소. 다만 한명재는 의녀와 오작인의 말은 증언이 아니라 할 거요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…그리고 하나 더 말해 두겠소. 내가 고발하면 내 자리도 흔들리오."
      - say:
          char: 서연
          with: [도원]
          text: "그럼 안 하셔도 됩니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "하겠다고 했소. 흔들린다고 했지 안 한다고는 안 했소."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - say:
          char: 서연.resolve
          with: [도원]
          text: "제 말은 안 믿어도 됩니다. 몸이 남긴 걸 내놓습니다. 분이, 박씨, 윤길. 셋 다요."
      - goto: /4.yaml
