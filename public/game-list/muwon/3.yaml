chapterTitle: "서빙고의 얼음"

script:
  - scene: ice_vault
  - scene: c4_body

scenes:
  ice_vault:
    title: "얼음 사이"
    actions:
      - bg: { id: seobinggo, transition: fade, duration: 900, place: "9월 25일 밤 · 한강 변 서빙고" }
      - music: night_well
      - say:
          channel: record
          text: "9월 25일 밤. 한강 변 서빙고. 한성부 서리 윤길, 얼음 더미 사이에서 발견."
      - say:
          channel: action
          with: []
          camera: wide
          text: "입김이 하얗다. 짚 아래 얼음 덩이가 층층이 쌓였고, 왼쪽 더미 하나가 비스듬히 기울었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - char: { id: 막쇠, position: right }
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기 말로는 오늘 저녁에 발견했다 하오."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "몸이 돌처럼 굳었으니 죽은 지 오래된 거라 하더군."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "다리 끌고 왔수."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "창고에서 나온 몸은 직접 봐야겠어서 왔수. 아가씨, 같이 봅시다."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: false }
          with: [서연, 도원]
          text: "얼음 곳간에 있으면 죽은 지 얼마 안 된 송장도 굳어요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "다른 데도 살펴봐야 죽은 지 얼마나 됐는지 알지요."
      - say:
          char: 서연.think
          with: [도원, 막쇠]
          text: "나리."
      - say:
          char: 서연.think
          with: [도원]
          text: "윤길은 한성부 서리입니다. 서빙고에 올 일이 있는 사람입니까."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "없소."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "얼음 출납은 공조 소관이오. 서리가 여기 와서 볼 문서가 없소."
      - say:
          char: 서연
          with: [도원]
          text: "…그럼 일 보러 온 게 아니라 사람을 만나러 온 걸까요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "그렇지."
      - say:
          channel: thought
          with: []
          text: "마지막으로 본 날 윤길이 베낀 시장을 가지고 있었는데. 그때 더 물어볼 걸 그랬다."
      - say:
          channel: action
          with: []
          text: "얼음지기는 곳간 밖 짚더미에 앉아 있다. 우리가 도착한 뒤로 꼼짝도 하지 않았다."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기는 오늘 낮에 사람이 둘 왔다 했소."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "한 명은 얼음을 받아 갔고, 나머지 한 명은 나가는 걸 못 봤다 하오."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "안 나간 쪽이 저기 누워 있는 게지."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "받아 간 쪽 이름은 들었수?"
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기는 글을 못 읽소. 장부에 찍힌 도장은 알아보더군."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "허. 도장만."
      - say:
          channel: thought
          with: []
          text: "출납부엔 이름이 없어도 도장 자국은 남았겠다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨."
      - say:
          char: 막쇠
          with: [서연]
          text: "겨울에 강에서 떠 온 얼음을 짚으로 덮어 두는 곳이오. 여름까지도 안 녹아요."
      - say:
          char: 막쇠
          with: [서연]
          text: "여긴 이리 추우니, 겉만 봐서는 언제 숨이 끊어졌는지 모르지요."
      - goto: c4_body

  c4_body:
    actions:
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - choice:
          key: c4_body
          presentation: explore
          prompt: "서리 윤길. 스물넷. 무엇이 맞지 않는가?"
          with: []
          camera: wide
          options:
            - text: "등과 엉덩이의 시반"
              at: { x: 68, y: 50 }
              when: { var: c4_lividity, op: eq, value: false }
              goto: c4_lividity_scene
            - text: "굳은 팔다리"
              at: { x: 30, y: 92 }
              when: { var: c4_stiff, op: eq, value: false }
              goto: c4_stiff_scene
            - text: "소매 속"
              at: { x: 70, y: 92 }
              when: { var: register_page, op: eq, value: false }
              goto: c4_sleeve_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c4_lividity, op: eq, value: true }
                  - { var: c4_stiff, op: eq, value: true }
                  - { var: register_page, op: eq, value: true }
              goto: c4_reason

  c4_lividity_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "몸을 모로 돌린다. 등에 번진 붉은 얼룩을 누르자 그 자리만 하얗게 변한다."
      - say:
          char: 막쇠
          with: [서연]
          text: "어? 눌렀더니 아직 옅어지네."
      - say:
          char: 막쇠
          with: [서연]
          text: "이러면 죽은 지 한나절은 안 됐겠소."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "오래됐으면 이렇게 눌러도 옅어지지 않아요."
      - say:
          char: 막쇠
          with: [서연]
          text: "음."
      - say:
          channel: action
          with: []
          text: "손을 떼자 하얘진 자리에 붉은빛이 천천히 돌아온다."
      - say:
          char: 서연
          with: [막쇠]
          text: "열까지 세기도 전에 붉은빛이 돌아왔어요."
      - say:
          char: 서연
          with: [막쇠]
          text: "며칠씩 여기 있었다는 말은 들어맞지 않습니다."
      - say:
          channel: thought
          with: []
          text: "언해 둘째 장. 시반이 남은 곳을 보면 사람이 죽은 뒤 어느 쪽으로 누워 있었는지 알 수 있다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 시반이 등에 남았어요. 죽고 나서 한동안 등을 대고 누워 있었던 거예요."
      - say:
          char: 막쇠
          with: [서연]
          text: "끼어 있던 건 모로 누운 모양이었수."
      - say:
          char: 막쇠
          with: [서연]
          text: "그럼 누가 옮긴 거요."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "등을 대고 누워 있던 몸이 저렇게 옆으로 끼어 있진 않았을 거예요."
      - set: { c4_lividity: true }
      - goto: c4_body

  c4_stiff_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "팔꿈치를 굽히려 해도 꿈쩍 않고, 살갗이 얼음처럼 차다."
      - say:
          channel: thought
          with: []
          text: "옷자락부터 딱딱하게 얼어 있다. 팔만 굳은 게 아니다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "아저씨, 턱을 봐 주세요. 굳는 건 턱에서 시작해 아래로 내려갑니다."
      - say:
          char: 막쇠
          with: [서연]
          text: "턱은… 움직이오."
      - say:
          char: 막쇠
          with: [서연]
          text: "아래턱이 아직 무르네. 그런데 손목은 돌처럼 굳었어."
      - say:
          char: 서연
          with: [막쇠]
          text: "거꾸로예요. 턱이 먼저 굳어야 맞는데."
      - say:
          char: 막쇠
          with: [서연]
          text: "가만."
      - say:
          channel: action
          with: []
          text: "손등을 눌러 본다. 움푹 들어간 자리가 그대로 남는다."
      - say:
          char: 막쇠
          with: [서연]
          text: "눌린 자리가 안 돌아오네."
      - say:
          char: 막쇠
          with: [서연]
          text: "얼어붙은 고기가 딱 이렇수. 보시오, 겉은 굳었는데 턱은 아직 움직이잖소."
      - say:
          char: 서연
          with: [막쇠]
          text: "…고기요?"
      - say:
          char: 서연.think
          with: [막쇠]
          text: "속까지 얼진 않았어요. 턱은 움직이는데 팔다리 겉만 단단합니다."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "…그러면 얼음지기가 '죽은 지 오래'라고 한 것도 그대로 적으면 안 되는 거요?"
      - say:
          char: 서연
          with: [도원]
          text: "안 됩니다. 얼음지기는 본 대로 말한 거예요."
      - say:
          char: 서연
          with: [도원]
          text: "누가 얼음 곁에 두었는지 출납부터 봐야겠어요."
      - set: { c4_stiff: true }
      - goto: c4_body

  c4_sleeve_scene:
    actions:
      - sticker:
          id: c4_page
          image: register_page_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "소매 안에서 검안 기록을 베낀 종이가 나온다. 이름 석 자에 붉은 동그라미가 쳐져 있다."
      - say:
          channel: thought
          with: []
          text: "붉게 표시한 이름은 시장을 빌려 간 전의감 의관 한명재다."
      - say:
          channel: action
          with: []
          text: "네 번 접힌 자리가 희게 닳았다."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "…분이의 시장이에요. 제가 쓴 걸 베꼈어요."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "이걸 품에 넣고 다녔네요."
      - say:
          char: 막쇠
          with: [서연]
          text: "베껴 쓰는 게 서리 일이오. 이 종이만 따로 챙겨 다닌 데는 까닭이 있겠지."
      - say:
          channel: thought
          with: []
          text: "빌려 간 사람의 이름 옆에 날짜가 적혀 있다. 분이가 죽은 이튿날이다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "분이 죽은 이튿날에 의관이 빌려 갔어요."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "이 날짜와 이름을 옮겨 적은 건 윤길이고요."
      - say:
          char: 막쇠
          with: [서연]
          text: "딱 한 사람 이름에만 표시했잖소. 그걸 품에 넣고 갈 곳이 있었겠지."
      - say:
          char: 서연
          with: [막쇠]
          text: "네."
      - say:
          char: 서연
          with: [막쇠]
          text: "윤길이 이 종이를 들고 누구를 만나려 했는지 알아봐야겠어요."
      - get: register_page
      - clearSticker: { id: c4_page, leave: fadeOut }
      - goto: c4_body

  c4_reason:
    actions:
      - bg: { id: seobinggo, transition: dissolve, duration: 620 }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 서연.think
          with: [도원]
          text: "서빙고에서 방금 살핀 몸을 다시 보십시오. 윤길이 죽은 건 오늘 낮으로 보입니다."
      - say:
          char: 서연.think
          with: [도원]
          text: "몸을 얼려 둔 탓에 죽은 지 며칠 된 것처럼 보였어요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그럼 범인은 오늘 낮에 이 곳간에 들어왔다는 말이군."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "얼음 출납을 보면…"
      - say:
          char: 서연
          with: [도원]
          text: "한동안 등을 대고 누워 있었던 건 확실합니다. 발견된 자리에선 모로 누워 있었고요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그동안 범인은?"
      - say:
          char: 서연
          with: [도원]
          text: "얼음을 가져간 사람이 윤길을 옮겼는지부터 알아봐야겠어요."
      - say:
          char: 도원
          with: [서연]
          text: "…그걸로 겉을 얼렸다는 말이오?"
      - say:
          char: 서연
          motion: nod
          with: [도원]
          text: "그럴 수 있습니다. 시반을 보면 한동안 다른 곳에 눕혀 뒀으니까요."
      - say:
          char: 도원.stern
          with: [서연]
          text: "사흘 된 송장이면 그날은 딴 데 있었다고 하겠군."
      - say:
          char: 도원.stern
          with: [서연]
          text: "그 말을 믿으면 오늘 얼음을 받아 간 사람은 의심에서 벗어나는 거요."
      - say:
          char: 서연
          with: [도원]
          text: "오늘 얼음을 누가 받아 갔는지, 그 사람이 윤길과 마주쳤는지부터 확인하겠습니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "형조에선 얼음을 가져간 사람이 왜 윤길을 죽였다고 보느냐고 물을 거요."
      - say:
          channel: action
          with: []
          text: "도원이 얼음지기를 만나러 나간다. 막쇠는 얼음 더미 안쪽을 살피겠다며 등잔을 들고 간다."
      - goto: c4_storeroom

  c4_storeroom:
    actions:
      - choice:
          key: c4_storeroom
          presentation: explore
          prompt: "얼음지기가 쓰는 곳간이다. 무엇을 살필까?"
          with: []
          camera: wide
          options:
            - text: "출납부"
              at: { x: 66, y: 40 }
              when: { var: c4_ledger, op: eq, value: false }
              goto: c4_ledger_scene
            - text: "짚 아래 상자"
              at: { x: 34, y: 62 }
              when: { var: c4_box, op: eq, value: false }
              goto: c4_box_scene
            - text: "막쇠를 찾는다"
              when:
                all:
                  - { var: c4_ledger, op: eq, value: true }
                  - { var: c4_box, op: eq, value: true }
              goto: c4_missing

  c4_ledger_scene:
    actions:
      - sticker:
          id: c4_ledger
          image: ice_ledger_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "오늘 날짜 아래 '얼음 열 덩이 반출, 약재 보관용'. 받은 사람 이름 대신 붉은 도장."
      - say:
          channel: action
          with: []
          text: "앞장을 넘겨 본다. 지난달에도, 지지난달에도 같은 도장으로 열 덩이씩 받아 갔다."
      - say:
          channel: thought
          with: []
          text: "한 번 더 넘긴다. 지난여름에도 같은 도장이다."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리, 약재를 차게 두려면 달마다 열 덩이씩 쓰는 게 맞습니까."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "전의감 약고에는 세 덩이면 충분하오. 열 덩이는 너무 많소."
      - say:
          char: 서연
          with: [도원]
          text: "남는 일곱 덩이는 어디에 쓴 걸까요."
      - get: ice_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - set: { c4_ledger: true }
      - goto: c4_storeroom

  c4_box_scene:
    actions:
      - sticker:
          id: c4_pill
          image: fake_pill_sticker
          x: 40
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
      - sticker:
          id: c4_seal
          image: seal_mark_sticker
          x: 62
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "짚 아래 나무 상자에 감청 주머니가 가득하다. 주머니에서 꺼낸 환을 쪼개니 속이 석회다."
      - say:
          channel: action
          with: []
          text: "상자 뚜껑에 붉은 도장이 찍혀 있다. 오른쪽 아래 모서리만 깨진 듯 비어 있다."
      - say:
          channel: action
          with: []
          text: "열 개씩 꿰어 놓은 주머니가 스물여덟 줄이다. 맨 끝엔 낱개로 아홉 개."
      - say:
          channel: thought
          with: []
          text: "이백여든아홉. 삼백에서 열하나가 빠졌다."
      - say:
          char: 서연.shock
          with: []
          text: "…열하나는 이미 나갔네."
      - say:
          channel: action
          with: []
          text: "청심원이라면 약재 냄새가 날 텐데 이 환은 아무 냄새가 나지 않는다."
      - say:
          channel: thought
          with: []
          text: "약이 들었어야 할 주머니 열한 개엔 이것이 들어 있었을까."
      - say:
          channel: thought
          with: []
          text: "상자 밑의 짚을 젖힌다. 얼음 일곱 덩이가 아직 녹지 않고 남아 있다."
      - get: fake_pill
      - get: seal_mark
      - clearSticker: { id: c4_pill, leave: fadeOut }
      - clearSticker: { id: c4_seal, leave: fadeOut }
      - set: { c4_box: true }
      - goto: c4_storeroom

  c4_missing:
    title: "곳간 안쪽"
    actions:
      - music: pressure
      - say:
          channel: thought
          with: []
          text: "막쇠가 없다. 아까 안쪽 더미를 보러 간다고 했다."
      - say:
          channel: action
          with: []
          sound: ice_movement
          text: "등불을 들고 안쪽으로 간다. 기울어진 얼음 더미 너머에서 무언가 끌리는 소리."
      - say:
          char: 막쇠.hurt
          with: []
          text: "아가씨… 오지 마! 왼손에 칼—"
      - attack:
          attacker: 곰보
          target: player
          from: left
          style: slash
          strength: heavy
          anticipation: 700
          caption: "기울어진 얼음 더미 그늘에서 복면이 튀어나온다. 왼손에 짧은 칼."
      - choice:
          key: c4_ambush
          prompt: "복면을 쓴 자가 다시 칼을 든다!"
          char: 곰보
          with: [곰보]
          timeoutMs: 7000
          timeoutOptionIndex: 2
          options:
            - text: "얼음 더미를 밀어 넘어뜨린다"
              saveText: "기울어진 얼음 더미를 밀어 넘어뜨린다"
              goto: c4_push_ice
            - text: "막쇠를 부르며 안쪽으로 뛴다"
              saveText: "막쇠를 부르며 곧장 안쪽으로 뛴다"
              goto: c4_run_in
            - text: "등불을 던지고 물러선다"
              goto: c4_throw_lantern

  c4_run_in:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠 아저씨! 부르며 달려가는데 복면을 쓴 자가 가로막는다."
      - effect: { name: damage, wait: true }
      - say:
          channel: narration
          text: "등잔이 얼음 위를 구른다. 불이 꺼지기 직전, 저고리에 검붉은 얼룩이 번진다."
      - say:
          channel: thought
          with: []
          text: "더미가 기울어 있었는데. 그걸 쓸 생각을 못 했다."
      - say:
          channel: narration
          text: "이튿날 서빙고에서 시신 두 구가 더 나왔다. 시장에는 ‘실족’이라 적혔다."
      - gameOver:
          title: "얼음 곳간의 어둠"
          message: "맨몸으로 칼 앞에 뛰어들었다. 곳간에는 이미 기울어진 얼음 더미가 있었다."
          recoverToChoice: c4_ambush

  c4_push_ice:
    actions:
      - effect: rumble
      - say:
          channel: action
          with: []
          text: "어깨로 더미를 민다. 얼음 덩이들이 굴러 복면과 나 사이로 쏟아진다."
      - say:
          channel: narration
          text: "복면은 얼음에 정강이를 맞고 비틀거리다 뒷문으로 달아났다. 왼손의 칼이 바닥에 떨어졌다."
      - branch:
          cases:
            - when: { var: makssoe_hurt, op: eq, value: true }
              goto: c4_too_late
          default: c4_saved

  c4_throw_lantern:
    actions:
      - say:
          channel: action
          with: []
          text: "등불을 복면 얼굴로 던진다. 짚에 불이 붙는다. 복면이 물러선다. 나도 물러선다."
      - say:
          channel: narration
          text: "불길이 짚을 타고 안쪽으로 번졌다. 복면은 그 틈에 사라졌다."
      - say:
          channel: narration
          text: "불길을 잡고 돌아오니 막쇠가 얼음에 기대 있었다. 왼쪽 옆구리를 누른 손 사이로 피가 흘렀다."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_too_late:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠에게 달려간다. 다친 다리 때문에 피하지 못했다. 옆구리가 젖어 있다."
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아가씨. 다리는 건드리지 말고, 여기 잠깐 앉아 봐요."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_farewell:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - mood: { tone: grief, level: 2 }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "그 책 있잖소. 처음엔 닭 그림만 봤수. 나중엔 그 밑에 글도 읽어 봤고."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "책은 여기 있어요. 나중에 같이 읽어요. 지금은 가만 계세요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아가씨, 내 말 좀 들어 봐요. 그때 우물에서 손톱 밑 실을 먼저 봤잖소."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다음에도 그렇게 해요. 먼저 보고 나중에 적어요."
      - say:
          char: 서연
          with: [막쇠]
          text: "…듣고 있어요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "그래. 처음보다 목소리가 커졌수."
      - say:
          channel: narration
          text: "관에서는 막쇠의 죽음을 따로 살피지 않았다. 그날 밤 {{player_name|은}} 제 손으로 시장을 썼다."
      - say:
          channel: record
          text: "시장. 오작인 막쇠. 나이 모름. 왼쪽 옆구리 자상 하나. 깊이 두 치. 왼손잡이의 칼."
      - say:
          channel: thought
          with: []
          text: "나이 모름. 몇 살이오, 하고 내게 먼저 물어본 사람인데."
      - goto: c4_seal_owner

  c4_saved:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아이고, 늙은이 얼음에 묻힐 뻔했네. 아가씨 어깨 하나는 장정이오."
      - say:
          char: 서연
          with: [막쇠]
          text: "피가 나요. 아저씨, 잠깐 가만 계세요."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그놈이 왼손에 칼을 쥐었소. 약방 영감 목에 난 칼자국 있잖소."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "오른쪽 위에서 왼쪽 아래로 난 상처였죠. 그때도 왼손으로 그은 줄 알았어요."
      - say:
          char: 막쇠
          with: [서연]
          text: "저놈이 칼을 떨어뜨리고 갔수. 챙겨요. 날 너비를 재 봅시다."
      - say:
          channel: action
          with: []
          text: "칼날의 너비는 한 치다. 박씨 목에 난 상처를 뜬 탁본과 너비가 같다."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "저놈 혼자 약고 문을 열고 다녔을 리는 없수."
      - goto: c4_seal_owner

  c4_seal_owner:
    title: "깨진 도장"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 800, place: "한성부 마당" }
      - music: inquest
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - mood: off
      - say:
          char: 도원.stern
          with: [서연]
          text: "출납부와 상자의 도장을 전의감 장부와 대 봤소. 한명재의 인장이오. 약고를 봉하고 장부도 거뒀소."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "형조에 고발하겠소. 한명재는 의녀나 오작인의 말 따위는 증언이 못 된다 하겠지."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "내가 고발했다가 틀리면, 판관 자리를 내놓으라 할 수도 있소."
      - say:
          char: 서연
          with: [도원]
          text: "나리 이름을 빼면, 제 시장만으로 고발할 수는 없습니까?"
      - say:
          char: 도원.stern
          with: [서연]
          text: "초검관이 나였소. 내 이름으로 올리겠소. 같이 갑시다."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - say:
          char: 서연.resolve
          with: [도원]
          text: "분이와 박씨와 윤길에게서 본 걸 가져가겠습니다. 제가 본 순서대로 말씀드리지요."
      - goto: /4.yaml
