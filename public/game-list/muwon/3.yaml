chapterTitle: "서빙고의 얼음"

script:
  - scene: ice_vault
  - scene: c4_body

scenes:
  ice_vault:
    title: "얼음 사이"
    actions:
      - bg: { id: seobinggo, transition: fade, duration: 900, place: "9월 25일 밤 · 한강 변 서빙고" }
      - music: night_well
      - say:
          channel: record
          text: "9월 25일 밤. 한강 변 서빙고. 한성부 서리 윤길, 얼음 더미 사이에서 발견."
      - say:
          channel: action
          with: []
          camera: wide
          text: "입김이 하얗다. 짚 아래 얼음 덩이가 층층이 쌓였고, 왼쪽 더미 하나가 비스듬히 기울었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - char: { id: 막쇠, position: right }
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기가 오늘 저녁에 찾았다 하오. 몸이 돌처럼 굳었으니 죽은 지 오래라더군."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "문밖에서 아가씨 이름 듣고 따라왔수. 이번에도 등잔은 내가 들 테니."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "허. 여기 두면 방금 죽은 송장도 굳어요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "굳은 것만 갖고는 몰라."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리. 윤길은 서빙고에 올 일이 있는 사람입니까."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "없소."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "얼음 출납은 공조 소관이오. 한성부 서리가 여기서 볼 문서가 없소."
      - say:
          char: 서연
          with: [도원]
          text: "…그럼 사람을 만나러 온 걸까요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "그건 송장 보고 나서."
      - say:
          channel: action
          with: []
          text: "얼음지기는 곳간 밖 짚더미에 앉아 있다. 우리가 온 뒤로 꼼짝도 않는다."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "오늘 낮에 사람이 둘 왔다 하오. 하나는 얼음을 받아 갔고, 하나는 나가는 걸 못 봤다고."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "받아 간 쪽 이름은 들었수?"
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "글을 못 읽는다 하오. 장부에 찍힌 도장만 알아본다더군."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "도장만."
      - say:
          char: 막쇠
          with: [서연]
          text: "나하고 같네. 아가씨, 봅시다."
      - goto: c4_body

  c4_body:
    actions:
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - choice:
          key: c4_body
          presentation: explore
          prompt: "서리 윤길. 스물넷. 무엇이 맞지 않는가?"
          with: []
          camera: wide
          options:
            - text: "등과 엉덩이의 시반"
              at: { x: 68, y: 50 }
              when: { var: c4_lividity, op: eq, value: false }
              goto: c4_lividity_scene
            - text: "굳은 팔다리"
              at: { x: 30, y: 92 }
              when: { var: c4_stiff, op: eq, value: false }
              goto: c4_stiff_scene
            - text: "소매 속"
              at: { x: 70, y: 92 }
              when: { var: register_page, op: eq, value: false }
              goto: c4_sleeve_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c4_lividity, op: eq, value: true }
                  - { var: c4_stiff, op: eq, value: true }
                  - { var: register_page, op: eq, value: true }
              goto: c4_reason

  c4_lividity_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "옷깃을 풀자 목에 깊은 끈 자국이 드러난다. 몸을 모로 돌려 등에 번진 붉은 얼룩을 누른다."
      - say:
          char: 막쇠
          with: [서연]
          text: "누른 데가 하얘지네. 손 떼 봐요."
      - say:
          char: 막쇠
          with: [서연]
          text: "오래된 송장에선 이렇게 쉽게 안 빠져요. 다만 여긴 추우니 때를 딱 잘라 말하긴 어렵소."
      - say:
          channel: action
          with: []
          text: "손을 뗀다. 열을 세기 전에 붉은빛이 돌아온다."
      - say:
          char: 서연
          with: [막쇠]
          text: "며칠씩 여기 있었다는 말은 안 맞아요."
      - say:
          channel: thought
          with: []
          text: "언해 둘째 장. 시반은 죽은 뒤 바닥에 닿아 있던 쪽에 생긴다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 얼룩이 등에만 있어요. 죽고 나서 한동안 등을 대고 누워 있었던 거예요."
      - say:
          char: 막쇠
          with: [서연]
          text: "얼음 사이엔 모로 끼어 있었수."
      - say:
          char: 막쇠
          with: [서연]
          text: "누가 옮겼구먼."
      - set: { c4_lividity: true }
      - goto: c4_body

  c4_stiff_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "팔꿈치를 굽히려 해도 꿈쩍 않는다. 옷자락까지 딱딱하게 얼었다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "아저씨, 턱 좀 봐 주세요. 굳는 건 턱에서 시작해 아래로 내려간다고 적혀 있어요."
      - say:
          char: 막쇠
          with: [서연]
          text: "턱은… 움직이오."
      - say:
          char: 막쇠
          with: [서연]
          text: "아래턱이 아직 무르네. 손목은 돌이고."
      - say:
          char: 서연
          with: [막쇠]
          text: "거꾸로예요. 턱이 먼저 굳어야 맞는데."
      - say:
          char: 막쇠
          with: [서연]
          text: "가만."
      - say:
          channel: action
          with: []
          text: "막쇠가 윤길의 손등을 엄지로 누른다. 움푹 들어간 자리가 그대로 남는다."
      - say:
          char: 막쇠
          with: [서연]
          text: "겨울에 처마에 걸어 둔 고기가 딱 이렇수. 겉만 언 거요."
      - say:
          char: 서연
          with: [막쇠]
          text: "…고기요?"
      - say:
          char: 막쇠
          with: [서연]
          text: "아, 미안하우. 서리 양반."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "…그러면 ‘죽은 지 오래’라는 얼음지기 말은 시장에 적으면 안 되는 거요?"
      - say:
          char: 서연
          with: [도원]
          text: "예. 굳은 것은 얼어서입니다. 죽은 때는 다른 데서 봐야 합니다."
      - set: { c4_stiff: true }
      - goto: c4_body

  c4_sleeve_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "소매 안에서 네 번 접은 종이가 나온다. 접힌 자리가 희게 닳았다."
      - sticker:
          id: c4_page
          image: register_page_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "…분이의 시장이에요. 우물가에서 본 게 그대로 베껴져 있어요."
      - say:
          channel: action
          with: []
          text: "끝에 한 줄이 덧붙었다. ‘9월 22일 전의감 의관 한명재 빌려 감.’ 이름에 붉은 동그라미."
      - say:
          char: 막쇠
          with: [서연]
          text: "뭐라 적혔수?"
      - say:
          char: 서연.think
          with: [막쇠]
          text: "분이 죽은 이튿날 전의감 의관이 이 시장을 빌려 갔대요. 이름이 한명재."
      - say:
          char: 막쇠
          with: [서연]
          text: "한."
      - say:
          char: 막쇠
          with: [서연]
          text: "약방 궤짝에서 나온 종이에도 그 글자가 있다 했잖소."
      - say:
          char: 서연
          with: [막쇠]
          text: "네. 그땐 한씨가 누군지 몰랐어요."
      - say:
          char: 막쇠
          with: [서연]
          text: "의관이 침모 송장 적은 종이는 뭐 하러 본답디까."
      - get: register_page
      - clearSticker: { id: c4_page, leave: fadeOut }
      - goto: c4_body

  c4_reason:
    actions:
      - bg: { id: seobinggo, transition: dissolve, duration: 620 }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 서연.think
          with: [도원]
          text: "목에는 끈으로 조른 자국이 있습니다. 죽은 때는 오늘 낮으로 추정하지만, 추위 때문에 오차가 있을 겁니다."
      - say:
          char: 서연
          with: [도원]
          text: "등을 대고 누워 있다가 옮겨졌고, 겉만 얼었습니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "얼음으로 오래된 송장처럼 보이게 했다는 말이오?"
      - say:
          char: 서연
          motion: nod
          with: [도원]
          text: "그럴 수 있습니다. 누가 그랬는지는 몸에 없습니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "사흘 된 송장으로 적히면 오늘 낮에 여기 온 사람은 빠지겠군."
      - say:
          char: 도원.stern
          with: [서연]
          text: "오늘 낮에 온 사람은 둘이오. 하나는 저기 누웠소."
      - say:
          char: 도원
          with: [서연]
          text: "…시장엔 추정한 때와 까닭을 함께 쓰겠소. 사흘 됐다는 얼음지기 말만 믿어선 안 되겠군."
      - say:
          channel: action
          with: []
          text: "도원이 얼음지기를 앞세워 곳간 문을 연다. 막쇠는 안쪽 더미를 보겠다며 등잔을 들고 간다."
      - goto: c4_storeroom

  c4_storeroom:
    actions:
      - choice:
          key: c4_storeroom
          presentation: explore
          prompt: "얼음지기가 쓰는 곳간이다. 무엇을 살필까?"
          with: []
          camera: wide
          options:
            - text: "출납부"
              at: { x: 66, y: 40 }
              when: { var: c4_ledger, op: eq, value: false }
              goto: c4_ledger_scene
            - text: "짚 아래 상자"
              at: { x: 34, y: 62 }
              when: { var: c4_box, op: eq, value: false }
              goto: c4_box_scene
            - text: "막쇠를 찾는다"
              when:
                all:
                  - { var: c4_ledger, op: eq, value: true }
                  - { var: c4_box, op: eq, value: true }
              goto: c4_missing

  c4_ledger_scene:
    actions:
      - sticker:
          id: c4_ledger
          image: ice_ledger_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "오늘 날짜 아래 '얼음 열 덩이 반출, 약재 보관용'. 받은 사람 이름 대신 붉은 도장."
      - say:
          channel: action
          with: []
          text: "앞장을 넘겨 본다. 지난달에도, 지지난달에도 같은 도장으로 열 덩이씩 받아 갔다."
      - say:
          channel: thought
          with: []
          text: "한 번 더 넘긴다. 지난여름에도 같은 도장이다."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리, 약재를 차게 두는 데 달마다 열 덩이씩 씁니까."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "전의감 약고면 세 덩이로 족하오."
      - say:
          char: 서연
          with: [도원]
          text: "남는 일곱 덩이는 어디에 쓴 걸까요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…모르겠소."
      - get: ice_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - set: { c4_ledger: true }
      - goto: c4_storeroom

  c4_box_scene:
    actions:
      - sticker:
          id: c4_pill
          image: fake_pill_sticker
          x: 40
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
      - sticker:
          id: c4_seal
          image: seal_mark_sticker
          x: 62
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "짚 아래 나무 상자에 감청 주머니가 가득하다. 하나를 열어 환을 쪼갠다. 속이 희다. 석회다."
      - say:
          channel: action
          with: []
          text: "약재 냄새가 안 난다."
      - say:
          channel: action
          with: []
          text: "상자 뚜껑에 붉은 도장이 찍혀 있다. 오른쪽 아래 모서리만 깨진 듯 비어 있다."
      - say:
          channel: action
          with: []
          text: "열 개씩 꿴 주머니가 스물여덟 줄. 맨 끝에 낱개로 아홉."
      - say:
          char: 서연.shock
          with: []
          text: "…열하나가 비어요."
      - say:
          channel: thought
          with: []
          text: "혜민서 평상의 아이 어미도 약주머니를 쥐고 있었다. 불을 끄고 돌아오니 가고 없었다."
      - say:
          channel: thought
          with: []
          text: "무슨 색이었는지 나는 보지 않았다."
      - say:
          channel: action
          with: []
          text: "상자 밑의 짚을 젖힌다. 약고로 가야 할 얼음 일곱 덩이가 석회 환을 받치고 있다. 가짜를 진짜 약처럼 보관했다."
      - get: fake_pill
      - get: seal_mark
      - clearSticker: { id: c4_pill, leave: fadeOut }
      - clearSticker: { id: c4_seal, leave: fadeOut }
      - set: { c4_box: true }
      - goto: c4_storeroom

  c4_missing:
    title: "곳간 안쪽"
    actions:
      - music: pressure
      - say:
          channel: action
          with: []
          text: "도원은 출납부를 들고 얼음지기에게 따지러 나갔다. 곳간이 조용하다."
      - say:
          channel: thought
          with: []
          text: "막쇠의 등잔 불빛이 안 보인다."
      - say:
          channel: action
          with: []
          sound: ice_movement
          text: "등불을 들고 안쪽으로 간다. 기울어진 얼음 더미 너머에서 무언가 끌리는 소리."
      - say:
          channel: action
          with: []
          text: "발밑에 물이 고였다. 얼음 녹은 물인 줄 알았다. 등불을 낮추니 붉다."
      - say:
          channel: thought
          with: []
          text: "숨을 쉬면 입김이 등불을 가린다. 숨을 참는다."
      - say:
          char: 막쇠.hurt
          with: []
          text: "아가씨… 오지 마! 왼손에 칼—"
      - attack:
          attacker: 곰보
          target: player
          from: left
          style: slash
          strength: heavy
          anticipation: 700
          caption: "기울어진 얼음 더미 그늘에서 복면이 튀어나온다. 왼손에 짧은 칼."
      - choice:
          key: c4_ambush
          prompt: "복면을 쓴 자가 다시 칼을 든다!"
          char: 곰보
          with: [곰보]
          timeoutMs: 7000
          timeoutOptionIndex: 2
          options:
            - text: "얼음 더미를 밀어 넘어뜨린다"
              saveText: "기울어진 얼음 더미를 밀어 넘어뜨린다"
              goto: c4_push_ice
            - text: "막쇠를 부르며 안쪽으로 뛴다"
              saveText: "막쇠를 부르며 곧장 안쪽으로 뛴다"
              goto: c4_run_in
            - text: "등불을 던지고 물러선다"
              goto: c4_throw_lantern

  c4_run_in:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠 아저씨! 부르며 달려가는데 복면을 쓴 자가 가로막는다."
      - effect: { name: damage, wait: true }
      - say:
          channel: narration
          text: "등잔이 얼음 위를 구른다. 불이 꺼지기 직전, 저고리에 검붉은 얼룩이 번진다."
      - say:
          channel: thought
          with: []
          text: "더미가 기울어 있었는데. 그걸 쓸 생각을 못 했다."
      - say:
          channel: narration
          text: "이튿날 서빙고에서 시신 두 구가 더 나왔다. 시장에는 ‘실족’이라 적혔다."
      - gameOver:
          title: "얼음 곳간의 어둠"
          message: "맨몸으로 칼 앞에 뛰어들었다. 곳간에는 이미 기울어진 얼음 더미가 있었다."
          recoverToChoice: c4_ambush

  c4_push_ice:
    actions:
      - effect: rumble
      - say:
          channel: action
          with: []
          text: "어깨로 더미를 민다. 저고리가 얼음에 붙었다 뜯긴다. 얼음 덩이들이 굴러 복면과 나 사이로 쏟아진다."
      - say:
          channel: narration
          text: "복면은 얼음에 정강이를 맞고 비틀거리다 뒷문으로 달아났다. 왼손의 칼이 바닥에 떨어졌다."
      - branch:
          cases:
            - when: { var: makssoe_hurt, op: eq, value: true }
              goto: c4_too_late
          default: c4_saved

  c4_throw_lantern:
    actions:
      - say:
          channel: action
          with: []
          text: "등불을 복면 얼굴로 던진다. 짚에 불이 붙고, 복면이 물러선다. 나도 물러선다."
      - say:
          channel: narration
          text: "불길이 짚을 타고 안쪽으로 번졌다. 복면은 그 틈에 사라졌다."
      - say:
          channel: narration
          text: "불길을 잡고 돌아오니 막쇠가 얼음에 기대 있었다. 왼쪽 옆구리를 누른 손 사이로 피가 흘렀다."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_too_late:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠에게 달려간다. 약방에서 다친 다리를 뻗은 채 앉아 있다. 옆구리가 젖었다."
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다리 때문에 피하질 못했수. 아가씨, 여기 잠깐 앉아 봐요."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_farewell:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - mood: { tone: grief, level: 2 }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "그 책 말이오. 아가씨가 읽어 주니 그림 밑에 뭐라 적혔는지도 알겠더군."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "책은 내일도 읽어 드릴게요. 아저씨, 여기 눌러요. 제 손 위에. 같이 눌러요."
      - wait: 1000
      - say:
          char: 막쇠.hurt
          with: [서연]
          wait: 2400
          unskippable: true
          delivery: "whisper"
          text: "손에 힘이 안 들어가네. 아가씨, 우물에서 그 실 보던 때처럼 봐요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다음에도 등잔 낮춰 달라 해요. 멀리 들면 안 보이니."
      - say:
          char: 서연
          with: [막쇠]
          text: "…듣고 있어요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "그래. 처음보다 목소리가 커졌수."
      - say:
          channel: narration
          text: "오작인의 죽음에는 검관이 나오지 않았다. 그날 밤 {{player_name|은}} 제 손으로 시장을 썼다."
      - say:
          channel: record
          sound: paper
          text: "시장. 오작인 막쇠. 나이 모름. 왼쪽 옆구리 자상 하나. 깊이 두 치. 검안 의녀 {{player_name}}."
      - say:
          channel: thought
          with: []
          text: "마흔 해 일했다는 말만 들었다. 등잔 든 손이 시리냐고도 못 물었다."
      - goto: c4_seal_owner

  c4_saved:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아이고, 늙은이 얼음에 묻힐 뻔했네. 아가씨 어깨 하나는 장정이오."
      - say:
          char: 서연
          with: [막쇠]
          text: "피가 나요. 아저씨, 잠깐 가만 계세요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아야, 살살."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그놈, 왼손에 칼을 쥐었소. 약방 영감 목 그은 것도 왼손이랬지."
      - say:
          char: 막쇠
          with: [서연]
          text: "칼 떨어뜨리고 갔수. 내 피 닦기 전에 그것부터 챙겨요."
      - say:
          channel: action
          with: []
          text: "한 손으로 상처를 누른 채 다른 손으로 칼을 집는다. 날 너비가 한 치. 탁본과 같다."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "먼저 보고 나중에 적는 거요. 아가씨는 우물에서부터 그랬수."
      - goto: c4_seal_owner

  c4_seal_owner:
    title: "깨진 도장"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 800, place: "이튿날 · 한성부 마당" }
      - music: inquest
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - mood: off
      - say: { channel: action, with: [서연, 도원], text: "뜰 아래에 하인 하나가 묶여 있다. 정강이에 헝겊이 감겨 있다. 얼음지기가 그를 가리킨다." }
      - say:
          char: 도원.stern
          with: [서연]
          text: "출납부와 상자의 도장을 전의감 인장 대장과 대 봤소. 한명재의 인장이오."
      - say: { char: 도원, with: [서연], text: "얼음지기에게 전의감 하인들을 대 보였소. 한명재의 하인을 짚더군. 어제 얼음을 받아 간 자라고. 형조에도 부르겠소." }
      - say:
          char: 도원.troubled
          with: [서연]
          text: "형조에 고발하겠소. 의관은 의녀나 오작인의 말은 증언이 못 된다 하겠지."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "틀리면 나는 판관 자리를 내놓아야 하오."
      - say:
          char: 서연
          with: [도원]
          text: "제 이름으로 올릴 수는 없습니까. 나리 이름은 빼고요."
      - say:
          char: 도원
          with: [서연]
          text: "의녀 이름으로는 형조 문턱도 못 넘소."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - say:
          char: 도원.stern
          with: [서연]
          text: "우물가 시장에 나는 내 이름만 적었소. 본 사람은 따로 있었는데."
      - sticker:
          id: c4_accusation
          image: accusation_sticker
          x: 50
          y: 32
          width: "clamp(180px, 26%, 340px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: [도원]
          sound: paper
          text: "도원이 고발장 끝에 수결한다. 붓을 다시 먹에 적셔 그 옆에 두 줄을 더 쓴다."
      - say:
          char: 도원
          with: [서연]
          text: "검안 의녀 {{player_name}}. 입회 오작인 막쇠."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 도원]
          text: "가만. 어느 게 내 이름이오? 생긴 거나 좀 봅시다."
      - say:
          char: 도원.troubled
          when: { var: makssoe_alive, op: eq, value: false }
          with: [서연]
          text: "죽은 사람 이름이라고 형조가 지우라 하겠지. 그래도 적어 두겠소."
      - clearSticker: { id: c4_accusation, leave: fadeOut }
      - say:
          char: 서연.resolve
          with: [도원]
          text: "분이와 박씨와 윤길에게서 본 것을 가져가겠습니다. 본 순서대로 말씀드리겠습니다."
      - say:
          char: 도원.stern
          with: [서연]
          text: "같이 갑시다."
      - goto: /4.yaml
