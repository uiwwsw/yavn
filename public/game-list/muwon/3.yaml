chapterTitle: "서빙고의 얼음"

script:
  - scene: ice_vault
  - scene: c4_body

scenes:
  ice_vault:
    title: "얼음 사이"
    actions:
      - bg: { id: seobinggo, transition: fade, duration: 900, place: "9월 25일 밤 · 한강 변 서빙고" }
      - music: night_well
      - say:
          channel: record
          text: "9월 25일 밤. 한강 변 서빙고. 한성부 서리 윤길, 얼음 더미 사이에서 발견."
      - say:
          channel: action
          with: []
          camera: wide
          text: "입김이 하얗다. 짚 아래 얼음 덩이가 층층이 쌓였고, 왼쪽 더미 하나가 비스듬히 기울었다."
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - char: { id: 막쇠, position: right }
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "얼음지기가 오늘 저녁에 찾았다 하오. 몸이 돌처럼 굳었으니 죽은 지 사흘은 됐다더군."
      - say:
          char: 막쇠
          when: { var: makssoe_hurt, op: eq, value: true }
          with: [서연, 도원]
          text: "부목 댄 다리로도 등잔은 들우. 걱정 마요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "허. 여기 두면 방금 죽은 송장도 굳어요."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "굳은 것만 갖고는 몰라."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리. 윤길이 베끼던 게 여기 얼음 출납 사본이었지요."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "그렇소."
      - say:
          channel: action
          with: []
          text: "얼음지기는 곳간 밖 짚더미에 앉아 있다. 우리가 온 뒤로 꼼짝도 않는다."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "그저께 새벽에 한성부 서리가 출납부를 보자고 왔다 하오. 들여보냈는데 나가는 건 못 봤다고."
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "오늘 낮엔 늘 오는 하인이 도장을 내밀고 얼음을 받아 갔고."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "받아 간 쪽 이름은 들었수?"
      - say:
          char: 도원.troubled
          with: [서연, 막쇠]
          text: "글을 못 읽는다 하오. 장부에 찍힌 도장만 알아본다더군."
      - say:
          char: 막쇠
          with: [서연, 도원]
          text: "도장만."
      - say:
          char: 막쇠
          with: [서연]
          text: "나하고 같네. 아가씨, 봅시다."
      - goto: c4_body

  c4_body:
    actions:
      - bg: { id: sihyeongdo, transition: dissolve, duration: 620 }
      - music: inquest
      - choice:
          key: c4_body
          presentation: explore
          prompt: "서리 윤길. 스물넷. 무엇이 맞지 않는가?"
          with: []
          camera: wide
          options:
            - text: "등과 엉덩이의 시반"
              at: { x: 68, y: 50 }
              when: { var: c4_lividity, op: eq, value: false }
              goto: c4_lividity_scene
            - text: "굳은 팔다리"
              at: { x: 30, y: 92 }
              when: { var: c4_stiff, op: eq, value: false }
              goto: c4_stiff_scene
            - text: "소매 속"
              at: { x: 70, y: 92 }
              when: { var: register_page, op: eq, value: false }
              goto: c4_sleeve_scene
            - text: "본 것을 정리한다"
              when:
                all:
                  - { var: c4_lividity, op: eq, value: true }
                  - { var: c4_stiff, op: eq, value: true }
                  - { var: register_page, op: eq, value: true }
              goto: c4_reason

  c4_lividity_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "옷깃을 풀자 목에 깊은 끈 자국이 드러난다. 몸을 모로 돌려 등에 번진 붉은 얼룩을 누른다."
      - say:
          char: 막쇠
          with: [서연]
          text: "누른 데가 하얘지네. 손 떼 봐요."
      - say:
          channel: action
          with: []
          text: "손을 뗀다. 열을 세기 전에 붉은빛이 돌아온다."
      - say:
          char: 서연
          with: [막쇠]
          text: "아저씨, 얼룩이 등에만 있어요. 죽고 나서 한동안 반듯이 누워 있었어요."
      - say:
          char: 막쇠
          with: [서연]
          text: "얼음 사이엔 모로 끼어 있었수. 누가 옮겼구먼."
      - say:
          char: 막쇠
          with: [서연]
          text: "어젯밤 내가 뭐랬수. 추우면 더디다고."
      - say:
          char: 막쇠
          with: [서연]
          text: "이것만 갖고는 하루인지 사흘인지 몰라."
      - set: { c4_lividity: true }
      - goto: c4_body

  c4_stiff_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "팔꿈치를 굽히려 해도 꿈쩍 않는다. 옷자락까지 딱딱하게 얼었다."
      - say:
          char: 서연.think
          with: [막쇠]
          text: "아저씨, 턱 좀 봐 주세요. 굳는 건 턱에서 시작해 아래로 내려간다고 적혀 있어요."
      - say:
          char: 막쇠
          with: [서연]
          text: "턱은… 움직이오."
      - say:
          char: 막쇠
          with: [서연]
          text: "아래턱이 아직 무르네. 손목은 돌이고."
      - say:
          char: 서연
          with: [막쇠]
          text: "거꾸로예요."
      - say:
          char: 막쇠
          with: [서연]
          text: "가만."
      - say:
          channel: action
          with: []
          text: "막쇠가 윤길의 손등을 엄지로 누른다. 움푹 들어간 자리가 그대로 남는다."
      - say:
          char: 막쇠
          with: [서연]
          text: "겨울에 처마에 걸어 둔 고기가 딱 이렇수. 겉만 언 거요."
      - say:
          char: 서연
          with: [막쇠]
          text: "…고기요?"
      - say:
          char: 막쇠
          with: [서연]
          text: "아, 미안하우. 서리 양반."
      - say:
          channel: action
          with: []
          text: "손목에 끈 자국이 두 줄 있다. 살이 쓸려 있다."
      - music: null
      - say:
          channel: action
          with: []
          continueLabel: "빈칸에 적는다"
          text: "언해를 편다. 둘째 장 시반 옆, 아무것도 없는 빈칸에 붓을 댄다."
      - sticker: { id: c4_first_line, image: eonhae_note_sticker, x: 50, y: 32, width: "clamp(180px, 26%, 340px)", enter: fadeIn, inputLockMs: 600 }
      - say:
          channel: record
          wait: 1200
          text: "얼음에 든 송장. 시반은 더디 앉는다. 팔다리는 얼어 굳고 턱은 무르다."
      - say:
          channel: record
          wait: 1200
          text: "손등을 눌러 자국이 남으면 겉만 언 것. 오작인 막쇠가 눌러 봄."
      - say:
          channel: action
          with: [막쇠]
          text: "막쇠가 등잔을 내 손 가까이 내린다."
      - say:
          char: 막쇠
          with: [서연]
          text: "아가씨 글씨 처음 보우. 뭐라 썼수?"
      - say:
          channel: action
          with: []
          text: "읽어 준다."
      - say:
          char: 막쇠
          with: [서연]
          text: "막쇠는 어디요?"
      - say:
          channel: action
          with: [막쇠]
          text: "끝을 짚는다. 막쇠가 머릿수건에서 어젯밤 종이를 꺼내 나란히 대 본다."
      - say:
          char: 막쇠.grin
          with: [서연]
          wait: 900
          text: "이거하고 같네."
      - clearSticker: { id: c4_first_line, leave: fadeOut }
      - music: inquest
      - set: { c4_stiff: true }
      - goto: c4_body

  c4_sleeve_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "소매 안에서 네 번 접은 종이가 나온다. 접힌 자리가 희게 닳았다."
      - sticker:
          id: c4_page
          image: register_page_sticker
          x: 50
          y: 32
          width: "clamp(160px, 22%, 300px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "…분이의 시장이에요. 우물가에서 본 게 그대로 베껴져 있어요."
      - say:
          channel: action
          with: []
          text: "끝에 한 줄이 덧붙었다. ‘9월 22일 전의감 의관 한명재 빌려 감.’ 이름에 붉은 동그라미."
      - say:
          channel: action
          with: []
          text: "옆에 도장 자리를 먹으로 떠 둔 쪽지가 붙어 있다. 오른쪽 아래 모서리가 비었다."
      - say:
          char: 막쇠
          with: [서연]
          text: "뭐라 적혔수?"
      - say:
          char: 서연.think
          with: [막쇠]
          text: "분이 죽은 이튿날 전의감 의관이 이 시장을 빌려 갔대요. 이름이 한명재요."
      - say:
          char: 막쇠
          with: [서연]
          text: "한."
      - say:
          char: 막쇠
          with: [서연]
          text: "약방 궤짝에서 나온 종이에도 그 글자가 있었잖소."
      - get: register_page
      - clearSticker: { id: c4_page, leave: fadeOut }
      - goto: c4_match

  c4_match:
    actions:
      - choice:
          key: c4_match
          prompt: "먹으로 뜬 도장, 무엇과 대 볼까?"
          with: [서연, 도원]
          options:
            - text: "감청 실"
              goto: c4_match_wrong
            - text: "주머니 주문서"
              goto: c4_match_right
            - text: "박씨 장부 한 장"
              when: { var: ledger_page, op: eq, value: true }
              goto: c4_match_right
            - text: "상처 탁본"
              goto: c4_match_wrong

  c4_match_wrong:
    actions:
      - say:
          channel: thought
          with: []
          text: "도장이 찍힌 종이가 아니다. 소매에 넣어 둔 것 중에 붉은 도장이 있었다."
      - goto: c4_match

  c4_match_right:
    actions:
      - sticker: { id: c4_slip, image: order_slip_sticker, x: 34, y: 34, width: "clamp(140px, 20%, 260px)", enter: fadeIn }
      - sticker: { id: c4_rub_seal, image: register_page_sticker, x: 66, y: 34, width: "clamp(140px, 20%, 260px)", enter: fadeIn, inputLockMs: 300 }
      - say:
          channel: action
          with: []
          text: "소매에서 꺼내 나란히 댄다. 오른쪽 아래, 같은 자리가 비어 있다."
      - say:
          channel: action
          with: [도원]
          text: "도원이 두 종이를 번갈아 본다. 주문서는 그제야 도원에게 건넨다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "대출 장부에서 도장을 떠 들고, 원본 출납부와 대 보러 온 거요."
      - clearSticker: { id: c4_slip, leave: fadeOut }
      - clearSticker: { id: c4_rub_seal, leave: fadeOut }
      - goto: c4_body

  c4_reason:
    actions:
      - bg: { id: seobinggo, transition: dissolve, duration: 620 }
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - say:
          char: 서연.think
          with: [도원]
          text: "목에 끈으로 조른 자국이 있습니다. 등을 대고 누워 있다가 옮겨졌고, 겉만 얼었습니다."
      - say:
          char: 서연
          with: [도원]
          text: "손목은 묶인 채 하루 넘게 버틴 손목입니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그저께 새벽에 들어와서 오늘 낮에 죽었으면, 이틀을 어디 묶여 있었다는 거요."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "누구한테 무슨 말을 했는지 물었겠지."
      - say:
          char: 도원.stern
          with: [서연]
          text: "오늘 낮이라고 못 박아 줄 수 있소? 그래야 얼음지기 말이 깨지고 고발장이 서오."
      - choice:
          key: c4_time
          prompt: "윤길이 죽은 때를 시장에 어떻게 적을까?"
          char: 도원
          with: [서연, 도원]
          options:
            - text: "오늘 낮이라고 못 박는다"
              set: { time_fixed: true }
              goto: c4_time_fixed
            - text: "오늘 낮, 오차를 함께 적는다"
              add: { trust_dowon: 1 }
              goto: c4_time_honest

  c4_time_fixed:
    actions:
      - say:
          char: 서연.resolve
          with: [도원]
          text: "오늘 낮입니다. 그렇게 적어 주십시오."
      - say:
          char: 도원
          with: [서연]
          text: "좋소."
      - get: yungil_sijang
      - goto: c4_storeroom_intro

  c4_time_honest:
    actions:
      - say:
          char: 서연
          with: [도원]
          text: "오늘 낮입니다. 다만 얼음 탓에 한두 시진은 틀릴 수 있어요."
      - say:
          char: 서연
          with: [도원]
          text: "그렇게 적겠습니다."
      - say:
          channel: action
          with: [도원]
          text: "도원이 나를 한참 보다가 시장에 그대로 적는다. 추정한 때와 까닭을 함께. 손목의 끈 자국도."
      - get: yungil_sijang
      - goto: c4_storeroom_intro

  c4_storeroom_intro:
    actions:
      - say:
          channel: action
          with: []
          text: "도원이 얼음지기를 앞세워 곳간 문을 연다. 막쇠는 짚이 안쪽으로 끌린 자국이 있다며 등잔을 들고 더미 뒤로 간다."
      - goto: c4_storeroom

  c4_storeroom:
    actions:
      - choice:
          key: c4_storeroom
          presentation: explore
          prompt: "얼음지기가 쓰는 곳간이다. 무엇을 살필까?"
          with: []
          camera: wide
          options:
            - text: "출납부"
              at: { x: 66, y: 40 }
              when: { var: c4_ledger, op: eq, value: false }
              goto: c4_ledger_scene
            - text: "짚 아래 상자"
              at: { x: 34, y: 62 }
              when: { var: c4_box, op: eq, value: false }
              goto: c4_box_scene
            - text: "막쇠를 찾는다"
              when:
                all:
                  - { var: c4_ledger, op: eq, value: true }
                  - { var: c4_box, op: eq, value: true }
              goto: c4_missing

  c4_ledger_scene:
    actions:
      - sticker:
          id: c4_ledger
          image: ice_ledger_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "오늘 날짜 아래 '얼음 열 덩이 반출, 약재 보관용'. 받은 사람 이름 대신 붉은 도장."
      - say:
          channel: action
          with: []
          text: "모서리가 빈 그 도장이다."
      - say:
          channel: action
          with: []
          text: "앞장을 넘겨 본다. 지난달에도, 지지난달에도, 지난여름에도 같은 도장으로 열 덩이씩이다."
      - say:
          char: 서연.think
          with: [도원]
          text: "나리, 약재를 차게 두는 데 달마다 열 덩이씩 씁니까."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "전의감 약고면 세 덩이로 족하오."
      - say:
          char: 서연
          with: [도원]
          text: "남는 일곱 덩이는요?"
      - say:
          char: 도원.troubled
          with: [서연]
          text: "…모르겠소."
      - get: ice_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - set: { c4_ledger: true }
      - goto: c4_storeroom

  c4_box_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "곳간 맨 안쪽 빙실 하나는 전의감이 빌려 쓴다고 얼음지기가 말한다. 자물쇠가 따로 달려 있다."
      - say:
          channel: action
          with: [도원]
          sound: ice_movement
          text: "도원이 자물쇠를 부수게 한다."
      - sticker:
          id: c4_pill
          image: fake_pill_sticker
          x: 40
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
      - sticker:
          id: c4_seal
          image: seal_mark_sticker
          x: 62
          y: 32
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          text: "짚 아래 나무 상자에 감청 주머니가 가득하다. 하나를 열어 환을 쪼갠다. 속이 희다. 석회다."
      - say:
          channel: action
          with: []
          text: "약재 냄새가 안 난다."
      - say:
          channel: action
          with: []
          text: "상자 뚜껑에 붉은 도장이 찍혀 있다. 오른쪽 아래 모서리만 깨진 듯 비어 있다."
      - say:
          channel: action
          with: []
          text: "열 개씩 꿴 주머니가 스물여덟 줄. 맨 끝에 낱개로 아홉."
      - say:
          char: 서연.shock
          with: []
          text: "…열하나가 비어요."
      - say:
          channel: action
          with: []
          text: "소매에서 점순 어미의 주머니를 꺼내 아홉 옆에 놓는다. 바늘땀이 같다."
      - clearSticker: { id: c4_pill, leave: fadeOut }
      - clearSticker: { id: c4_seal, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "상자 밑의 짚을 걷는다. 얼음 일곱 덩이 위에 기름종이로 싼 단지가 있다."
      - say:
          char: 도원
          with: [서연]
          text: "허."
      - say:
          char: 도원
          with: [서연]
          text: "우황이오. 이 한 단지면 쌀 쉰 섬은 되오."
      - say:
          char: 도원.stern
          with: [서연]
          text: "청심원에 들어갈 우황을 빼서 여기 쟁이고, 주머니엔 석회를 넣었군."
      - get: fake_pill
      - get: seal_mark
      - set: { c4_box: true }
      - goto: c4_storeroom

  c4_missing:
    title: "곳간 안쪽"
    actions:
      - music: pressure
      - say:
          channel: action
          with: []
          text: "도원은 출납부를 들고 얼음지기에게 따지러 나갔다. 곳간이 조용하다."
      - say:
          channel: thought
          with: []
          text: "막쇠의 등잔 불빛이 안 보인다."
      - say:
          channel: action
          with: []
          sound: ice_movement
          text: "등불을 들고 안쪽으로 간다. 기울어진 얼음 더미 너머에서 무언가 끌리는 소리."
      - say:
          channel: action
          with: []
          text: "발밑에 물이 고였다. 얼음 녹은 물인 줄 알았다. 등불을 낮추니 붉다."
      - say:
          channel: thought
          with: []
          text: "숨을 쉬면 입김이 등불을 가린다. 숨을 참는다."
      - say:
          char: 막쇠.hurt
          with: []
          text: "아가씨… 오지 마! 왼손에 칼—"
      - attack:
          attacker: 곰보
          target: player
          from: left
          style: slash
          strength: heavy
          anticipation: 700
          caption: "기울어진 얼음 더미 그늘에서 복면이 튀어나온다. 왼손에 짧은 칼."
      - choice:
          key: c4_ambush
          prompt: "복면을 쓴 자가 다시 칼을 든다!"
          char: 곰보
          with: [곰보]
          timeoutMs: 7000
          timeoutOptionIndex: 2
          options:
            - text: "얼음 더미를 밀어 넘어뜨린다"
              saveText: "기울어진 얼음 더미를 밀어 넘어뜨린다"
              goto: c4_push_ice
            - text: "막쇠를 부르며 안쪽으로 뛴다"
              saveText: "막쇠를 부르며 곧장 안쪽으로 뛴다"
              goto: c4_run_in
            - text: "등불을 던지고 물러선다"
              goto: c4_throw_lantern

  c4_run_in:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠 아저씨! 부르며 달려가는데 복면을 쓴 자가 가로막는다."
      - effect: { name: damage, wait: true }
      - say:
          channel: narration
          text: "등잔이 얼음 위를 구른다. 불이 꺼지기 직전, 저고리에 검붉은 얼룩이 번진다."
      - say:
          channel: narration
          text: "이튿날 서빙고에서 시신 두 구가 더 나왔다. 시장에는 ‘실족’이라 적혔다."
      - gameOver:
          title: "얼음 곳간의 어둠"
          message: "맨몸으로 칼 앞에 뛰어들었다. 곳간에는 이미 기울어진 얼음 더미가 있었다."
          recoverToChoice: c4_ambush

  c4_push_ice:
    actions:
      - effect: rumble
      - say:
          channel: action
          with: []
          text: "어깨로 더미를 민다. 저고리가 얼음에 붙었다 뜯긴다. 얼음 덩이들이 굴러 복면과 나 사이로 쏟아진다."
      - say:
          channel: narration
          text: "복면은 얼음에 정강이를 맞고 비틀거리다 뒷문으로 달아났다. 왼손의 칼이 바닥에 떨어졌다."
      - branch:
          cases:
            - when: { var: makssoe_hurt, op: eq, value: true }
              goto: c4_too_late
          default: c4_saved

  c4_throw_lantern:
    actions:
      - say:
          channel: action
          with: []
          text: "등불을 복면 얼굴로 던진다. 짚에 불이 붙고, 복면이 물러선다. 나도 물러선다."
      - say:
          channel: narration
          text: "불길이 짚을 타고 안쪽으로 번졌다. 복면은 그 틈에 사라졌다."
      - say:
          channel: narration
          text: "불길을 잡고 돌아오니 막쇠가 얼음에 기대 있었다. 왼쪽 옆구리를 누른 손 사이로 피가 흘렀다."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_too_late:
    actions:
      - say:
          channel: action
          with: []
          text: "막쇠에게 달려간다. 약방에서 다친 다리를 뻗은 채 앉아 있다. 옆구리가 젖었다."
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "다리 때문에 피하질 못했수. 아가씨, 여기 잠깐 앉아 봐요."
      - set: { makssoe_alive: false }
      - goto: c4_farewell

  c4_farewell:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - music: null
      - mood: { tone: grief, level: 2 }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "거기 내 이름 적었수? 아까."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "네. 아저씨가 눌러 봤다고요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "어디. 생긴 것 좀 봅시다."
      - say:
          channel: action
          with: []
          text: "책을 펴서 들이댄다. 막쇠가 고개를 젓는다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          delivery: "whisper"
          text: "멀리 들면 안 보이니… 등잔 낮춰요."
      - say:
          channel: action
          with: []
          wait: 2000
          unskippable: true
          text: "등잔을 책 바로 옆에 내린다. 막쇠는 제 이름을 한참 본다."
      - say:
          char: 막쇠.hurt
          with: [서연]
          wait: 2400
          unskippable: true
          delivery: "whisper"
          text: "손에 힘이 안 들어가네. 아가씨, 우물에서 그 실 보던 때처럼 봐요."
      - say:
          char: 서연.shock
          with: [막쇠]
          text: "여기 눌러요. 제 손 위에. 같이 눌러요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          delivery: "whisper"
          text: "…듣고 있수."
      - say:
          char: 막쇠.hurt
          with: [서연]
          delivery: "whisper"
          text: "처음보다 목소리가 커졌네."
      - wait: 1600
      - say:
          channel: narration
          text: "오작인의 죽음에는 검관이 나오지 않았다. 그날 밤 {{player_name|은}} 처음으로 제 손으로 시장을 썼다."
      - say:
          channel: record
          sound: paper
          text: "시장. 오작인 막쇠. 나이 모름. 왼쪽 옆구리 자상 하나. 깊이 두 치. 검안 의녀 {{player_name}}."
      - sticker: { id: c4_slip_kept, image: name_slip_sticker, x: 50, y: 34, width: "clamp(150px, 20%, 260px)", enter: fadeIn, inputLockMs: 300 }
      - say:
          channel: action
          with: []
          text: "머릿수건을 풀자 두 번 접은 약 싸는 종이가 나온다."
      - say:
          channel: action
          with: []
          text: "그 종이를 언해 둘째 장, 막쇠의 이름이 적힌 자리에 끼운다."
      - clearSticker: { id: c4_slip_kept, leave: fadeOut }
      - say:
          channel: thought
          with: []
          text: "마흔 해 일했다는 말만 들었다. 등잔 든 손이 시리냐고도 못 물었다."
      - goto: c4_seal_owner

  c4_saved:
    actions:
      - char: { id: 서연, position: left }
      - char: { id: 막쇠, position: right }
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아이고, 늙은이 얼음에 묻힐 뻔했네. 아가씨 어깨 하나는 장정이오."
      - say:
          char: 서연
          with: [막쇠]
          text: "피가 나요. 아저씨, 잠깐 가만 계세요."
      - say:
          char: 막쇠.hurt
          with: [서연]
          text: "아야, 살살."
      - say:
          char: 막쇠.grin
          with: [서연]
          text: "그놈, 왼손에 칼을 쥐었소. 약방 영감 목 그은 것도 왼손이랬지."
      - say:
          char: 막쇠
          with: [서연]
          text: "그 칼부터 재요. 내 옆구리는 그다음."
      - say:
          channel: action
          with: []
          text: "한 손으로 상처를 누른 채 다른 손으로 칼을 집는다. 날 너비가 한 치. 탁본과 같다."
      - goto: c4_seal_owner

  c4_seal_owner:
    title: "깨진 도장"
    actions:
      - bg: { id: hanseongbu_yard, transition: fade, duration: 800, place: "9월 26일 아침 · 한성부 마당" }
      - music: inquest
      - char: { id: 서연, position: left }
      - char: { id: 도원, position: center }
      - mood: off
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: false }
          with: [서연]
          text: "막쇠의 등잔을 들고 왔다. 기름은 반쯤 남았다."
      - say: { channel: action, with: [서연, 도원], text: "뜰 아래에 하인 하나가 묶여 있다. 왼손이 자꾸 묶인 끈을 만진다." }
      - say:
          char: 도원.stern
          with: [서연]
          text: "새벽에 얼음지기를 데리고 전의감에 가서 하인들을 세워 봤소. 이 자를 짚더군."
      - say:
          char: 도원.stern
          with: [서연]
          text: "출납부와 상자의 도장을 전의감 인장 대장과 대 봤소. 한명재 몫으로 올라 있소."
      - say:
          char: 도원
          with: [서연]
          text: "한성부 대출 장부에 찍힌 것도 같은 도장이오."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "형조에 고발하겠소. 틀리면 나는 판관 자리를 내놓아야 하오."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "저자를 포도청에 넘기면 강치수가 하루면 받아 올 거요. 주인 이름도, 장에 나간 열하나가 어디 갔는지도."
      - say:
          char: 도원
          with: [서연]
          text: "곤장 열 대면."
      - say:
          channel: thought
          with: []
          text: "덕구 살에 들러붙어 있던 짚이 생각난다. 열하나 중 하나는 내 소매에 있다. 나머지 열은 지금 누군가의 손에 있다."
      - choice:
          key: c4_servant
          prompt: "하인을 포도청에 넘길까?"
          char: 도원
          with: [서연, 도원]
          options:
            - text: "곤장은 안 된다고 한다"
              goto: c4_no_beating
            - text: "하인을 포도청에 넘긴다"
              set: { servant_beaten: true }
              goto: c4_beating

  c4_no_beating:
    actions:
      - say:
          char: 서연
          with: [도원]
          text: "저 사람 정강이는 제가 보겠습니다. 곤장은 안 됩니다."
      - say:
          char: 도원.troubled
          with: [서연]
          text: "그럼 나머지 열은 어떻게 찾을 거요."
      - say:
          char: 서연
          with: [도원]
          text: "혜민서에 오는 어미들한테 주머니를 가져오라고 하겠습니다. 장에도 나가 보고요."
      - say:
          channel: action
          with: [도원]
          text: "도원은 한참 말이 없다가 하인을 형조 옥으로 보내라고 한다."
      - goto: c4_accusation

  c4_beating:
    actions:
      - say:
          char: 서연
          with: [도원]
          text: "…넘기십시오. 열이 지금 누구 손에 있는지 알아야 합니다."
      - say:
          char: 도원
          with: [서연]
          text: "알겠소."
      - say:
          channel: action
          with: []
          text: "포졸들이 하인을 끌고 나간다. 하인이 문간에서 한 번 돌아본다."
      - goto: c4_accusation

  c4_accusation:
    actions:
      - say:
          char: 서연
          with: [도원]
          text: "제 이름으로 올릴 수는 없습니까. 나리 이름은 빼고요."
      - say:
          char: 도원
          with: [서연]
          text: "의녀 이름으로는 형조 문턱도 못 넘소."
      - say:
          char: 서연
          with: [도원]
          text: "…네."
      - sticker:
          id: c4_accusation
          image: accusation_sticker
          x: 50
          y: 32
          width: "clamp(180px, 26%, 340px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: [도원]
          sound: paper
          text: "도원이 고발장 끝에 수결한다. 붓을 다시 먹에 적셔 그 옆에 두 줄을 더 쓴다."
      - say:
          char: 도원
          with: [서연]
          text: "검안 의녀 {{player_name}}. 입회 오작인 막쇠."
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 도원]
          text: "막쇠가 옆구리를 싸맨 채 고발장 위로 몸을 숙인다. 한참 들여다보다가 손가락으로 짚는다."
      - say:
          char: 막쇠.grin
          when: { var: makssoe_alive, op: eq, value: true }
          with: [서연, 도원]
          text: "이거네. 이건 알아."
      - say:
          char: 도원.troubled
          when: { var: makssoe_alive, op: eq, value: false }
          with: [서연]
          text: "죽은 사람 이름이라고 형조가 지우라 하겠지. 그래도 적어 두겠소."
      - say:
          channel: action
          when: { var: makssoe_alive, op: eq, value: false }
          with: [서연, 도원]
          text: "막쇠의 등잔을 고발장 옆에 내려놓는다. 도원은 두 줄을 다 쓰고 붓을 씻는다."
      - clearSticker: { id: c4_accusation, leave: fadeOut }
      - say:
          char: 도원.stern
          with: [서연]
          text: "같이 갑시다."
      - goto: /4.yaml
