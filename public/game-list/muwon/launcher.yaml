summary: "1792년 한성. 혼례 전날 밤, 분이가 우물에서 건져진다. 혜민서 의녀 서연은 분이의 손톱 밑에서 남빛 실 한 올을 발견한다. 시신과 문서에 남은 흔적을 살피고 관아에서 증거를 내놓는 검시 추리극. 5장, 결말 네 가지."
