chapterTitle: "고시원 304호"

script:
  - scene: second_interview
  - scene: interview_end
  - scene: forum
  - scene: corridor
  - scene: room
  - scene: dev_talk
  - scene: door
  - scene: leave

scenes:
  second_interview:
    title: "2차 진술"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900 }
      - music: bleed
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.21 10:15 · 중랑경찰서 · 정해수(31) · 2차 · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물은 그냥 놔 둘게요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "증거가 자꾸 바뀌어서 남은 걸로 다시 봤어요. 주차 정산 기록. 그날 새벽 B2에 차 세워 둔 직원이 하나 있어요. 변상혁 씨. 같이 사시죠."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "3층 손님 일도 있고. 오늘 오후에 집으로 갈 거예요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "정해수 씨. 접수증, 연필, 죽기 전날 고객센터 앞에 한 시간 서 있던 피해자. 다 정해수 씨를 가리켜요. 근데 정해수 씨는 그 시간에 집 밖에 안 나왔어요."
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "빌라 현관 CCTV를 세 번 돌려 봤어요. 세 번 다 안 나와요."
      - say:
          char: 은숙
          with: [해수]
          text: "한 번은 배속으로, 한 번은 실시간으로, 한 번은 거꾸로 돌렸어요. 거꾸로 돌리면 가끔 보여요."
      - say:
          char: 은숙
          with: [해수]
          text: "안 보여요. 정해수 씨는 그날 밤 열한 시에 들어가서 아침 여섯 시 사십에 나왔어요."
      - say:
          char: 해수
          with: [은숙]
          text: "…네. 맞습니다."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "맞다고 하면 안 되는데요. 그러면 정해수 씨는 아무것도 못 한 거예요."
      - say:
          char: 은숙
          with: [해수]
          text: "그런데 하나씩 보면 다 정해수 씨예요. 접수증 필체. 비품 연필. 피해자가 죽기 전날 고객센터 앞에 한 시간 서 있던 것."
      - say:
          char: 은숙
          with: [해수]
          text: "그 한 시간, 뭐 하셨어요."
      - say:
          char: 해수
          with: [은숙]
          text: "접수증을 써 드렸습니다. 세 번 다시 썼습니다. 고객님이 글씨가 작다고 하셔서요."
      - say:
          char: 은숙
          with: [해수]
          text: "…세 번."
      - say:
          char: 은숙
          with: [해수]
          text: "그 접수증 원본이 우리한테 있어요. 세 번 쓴 거 중에 두 번째가요."
      - say:
          char: 해수
          with: [은숙]
          text: "두 번째는 버렸는데요."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "네. 저도 그게 이상해요."
      - say:
          channel: action
          with: []
          text: "은숙이 볼펜으로 책상을 한 번 두드린다. 종이에는 아직 아무것도 안 적혀 있다."
      - say:
          char: 은숙
          with: [해수]
          text: "열일곱 해 했어요, 이 일. 증거가 많아서 못 쓰는 건 처음이에요."
      - say:
          char: 은숙
          with: [해수]
          text: "보통은 하나가 부족해요. 이건 하나가 남아요. 남은 걸 어디 갖다 붙여야 할지 모르겠어요."
      - choice:
          key: t3_tell
          prompt: "녹음기 빨간 불. 은숙이 볼펜 뚜껑을 닫는다."
          char: 해수
          motion: freeze
          options:
            - text: "\"모르겠습니다. 죄송합니다.\""
              goto: tell_nothing
            - text: "\"레플라에서 찔렀습니다.\" 그대로 말한다"
              set: { told_truth: true }
              add: { honest: 1 }
              goto: tell_truth
            - text: "\"상혁이는 아니에요. 그날 방에 있었어요.\""
              when: { var: tampered, op: gt, value: 0 }
              add: { sh_care: 1 }
              goto: tell_cover

  tell_nothing:
    actions:
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "모르겠습니다. 죄송합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "정해수 씨 오늘만 죄송하다고 일곱 번 했어요. 세 봤어요."
      - emote: { id: 해수, motion: bow }
      - goto: interview_end

  tell_truth:
    actions:
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "레플라에서요. 튜토리얼 3단계에서. 연필로 찔렀습니다. 지하 2층, C-14 옆에서요."
      - move: { id: 은숙, toward: 해수, style: retreat }
      - say:
          char: 은숙
          with: [해수]
          text: "레플라에서 사람 찔렀다고 자수하러 오는 사람, 한 달에 열 명쯤 와요. 다 술 먹고 와요."
      - say:
          char: 은숙
          with: [해수]
          text: "저는 안 해요, 레플라. 딸이 해요. 중학생인데 거기선 반장이래요. 여기선 아니고."
      - say:
          char: 해수
          with: [은숙]
          text: "저는 술 안 마셔요."
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "알아요. 술 냄새가 안 나요."
      - say:
          channel: record
          with: []
          text: "진술 요지 · 레플라 튜토리얼 3/5에서 연필로 피해자를 찔렀다고 함 · 장소 B2 C-14 · 본인은 그 시간 자택에 있었음"
      - say:
          char: 은숙
          with: [해수]
          text: "적어는 둘게요. 어디에 넣을지는 모르겠지만."
      - goto: interview_end

  tell_cover:
    actions:
      - say:
          char: 해수
          with: [은숙]
          text: "상혁이는 아니에요. 그날 방에 있었어요. 제가 들었어요. 웃는 소리."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "민지영 주임님 얘기는 다르던데요. 정해수 씨가 그날 밤 변상혁 씨 방에 없었다고 했다고. 차에 있었다고."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "웃는 소리로는 알리바이가 안 돼요. 그래도 적을게요."
      - move: { id: 해수, toward: 은숙, style: flinch }
      - goto: interview_end

  interview_end:
    actions:
      - move: { id: 은숙, style: reset }
      - say:
          char: 은숙
          with: [해수]
          text: "기태민이라는 사람 알아요? 레플라 초기에 만든 사람 중 하나래요. 이런 사건 비슷한 거 날 때마다 경찰서에 전화해요. 자기 얘기 좀 들어 달라고."
      - say:
          char: 은숙
          with: [해수]
          text: "아무도 안 들어 줘요. 저도 안 들었고. 그냥 생각나서요."

  forum:
    title: "주소"
    actions:
      - bg: { id: cs_desk, transition: cut }
      - place: "4월 21일 오후 · 고객센터"
      - char: { id: 해수, position: left, emotion: service }
      - say:
          channel: action
          with: []
          text: "번호표 없이 온 남자 손님이 창구에 팔꿈치를 올리고 영수증을 흔든다."
      - say:
          char: 해수.service
          motion: lean_in
          with: []
          text: "번호표 뽑고 기다리세요, 고객님."
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "주임님 혹시 기태민이라는 사람 아세요?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "레플라 갤 고닉. 왜"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "서버 없이 돌아간다고 글 쓰다가 영구 차단당한 사람"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "망우동 그린고시원 304호. 갤에 자기 주소를 올렸었어 와서 확인하라고"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 마"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 감사합니다 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 말라니까"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수야"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "내가 체험권 준 거 때문이면 그거 내가 미안해"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "아니에요 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "그럼 내일 마감 바꿔 줘 그걸로 갚아"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 바꿔 드릴게요"

  corridor:
    title: "그린고시원"
    actions:
      - bg: { id: goshiwon, transition: fade, duration: 900 }
      - place: "밤 9:00 · 망우동 그린고시원 304호"
      - char: { id: 태민, position: right }
      - char: { id: 해수, position: left }
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민
          with: [해수]
          text: "경찰이에요?"
      - say:
          char: 해수
          motion: bow
          with: [태민]
          text: "아니요. 그린마트 상봉점 고객센터에서 일합니다."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "…그걸 왜 말해요."
      - say:
          char: 해수
          with: [태민]
          text: "죄송합니다. 어디서 왔냐고 물으시는 줄 알고요."
      - say:
          char: 태민
          with: [해수]
          text: "몇 단계예요."
      - say:
          char: 해수
          with: [태민]
          text: "네?"
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "튜토리얼. 여기 오는 사람은 다 그거 물어보러 와요. 근데 다 2단계야. 소리 한번 지르고 무서워서 와."
      - say:
          char: 해수
          when: { var: tampered, op: gt, value: 0 }
          with: [태민]
          text: "4단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "3단계 했습니다. 4단계는 열어만 봤어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "……들어와요. 신발은 신고. 컵라면 용기는 밟지 말고."
      - say:
          channel: thought
          with: []
          text: "304호다. 내 방도 304호다. 고시원은 다르다."
      - say:
          channel: thought
          with: []
          text: "삼 층 네 번째 방이면 어디나 304호다. 그런데 오늘은 그게 걸린다."
      - say:
          channel: action
          with: []
          text: "방은 내 방보다 좁다. 창이 없고, 벽 한 면이 종이로 덮여 있다."
      - move: { id: 태민, style: reset }

  room:
    actions:
      - choice:
          key: t3_room
          presentation: explore
          prompt: "모니터 세 대 중 한 대만 켜져 있다."
          with: [태민]
          camera: wide
          options:
            - text: "벽에 붙은 그래프"
              at: { x: 28, y: 36 }
              when: { var: seen_graph, op: eq, value: false }
              goto: see_graph
            - text: "책상 위 출입 카드"
              at: { x: 66, y: 62 }
              when: { var: seen_card, op: eq, value: false }
              goto: see_card
            - text: "\"이게 어떻게 돌아가는 건데요.\""
              when:
                all:
                  - { var: seen_graph, op: eq, value: true }
                  - { var: seen_card, op: eq, value: true }
              goto: dev_talk

  see_graph:
    actions:
      - say:
          channel: record
          with: []
          text: "레플라 동시 접속자 · 2029.11.03 서버 전원 전부 차단 · 이후 1,104,331명 (변동 없음)"
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "서버 마흔두 대. 회계팀이 비용 줄이라고 해서 절반만 끄려고 했어요. 절반 껐는데 숫자가 안 떨어져. 그래서 다 껐어요. 안 떨어져. 지금까지."
      - say:
          char: 해수
          with: [태민]
          text: "숫자가 한 명도 안 줄었어요?"
      - say:
          char: 태민
          with: [해수]
          text: "한 명도. 백십만 사천삼백서른하나. 이 숫자 이 년 반 동안 그대로예요."
      - say:
          char: 해수
          with: [태민]
          text: "사람이 죽기도 하잖아요. 이쪽에서요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "…그래서 안 줄어드는 게 더 무서운 거예요."
      - say:
          channel: action
          with: []
          text: "그래프는 손으로 그린 것이다. 모눈종이를 여섯 장 이어 붙였고, 끝에서 선이 자처럼 곧다."
      - say:
          channel: thought
          with: []
          text: "맨 왼쪽에 점 하나가 선 밖에 떨어져 있다. 거기만 연필로 동그라미를 세 번 쳤다."
      - say:
          char: 해수
          with: [태민]
          text: "이 점은 왜 혼자 있어요."
      - say:
          char: 태민
          with: [해수]
          text: "그게 제일 오래된 거예요. 선에 안 붙어요. 붙일 데가 없어요. 서버를 안 쓰니까."
      - set: { seen_graph: true }
      - goto: room

  see_card:
    actions:
      - sticker: { id: keycard, image: keycard_sticker, x: 64, y: 34, width: "260px", rotate: 6, enter: popIn }
      - say:
          char: 태민
          with: [해수]
          text: "그거 아직 열려요. 회사는 없어졌는데 문은 안 없어졌어. 가산동, 지하 1층."
      - say:
          channel: action
          with: []
          text: "출입증 사진 칸이 비어 있다. 이름 칸에는 글자가 아니라 번호가 찍혀 있다."
      - say:
          channel: record
          with: []
          text: "레플라 가산 R&D · 출입증 · 사진 (없음) · USER 0001"
      - say:
          char: 해수
          with: [태민]
          text: "이거 불량이에요?"
      - say:
          char: 태민
          with: [해수]
          text: "…모르겠어요. 사진 칸에 넣을 사진을 못 찾았대요. 인사팀이 두 번 찾아봤대요."
      - clearSticker: { id: keycard, leave: fadeOut }
      - set: { seen_card: true }
      - goto: room

  dev_talk:
    title: "서버 없이"
    actions:
      - say:
          char: 태민
          with: [해수]
          text: "똑같이 만들면요. 진짜로 똑같이. 원자 하나까지. 그러면 그건 계산을 안 해도 돼요. 그냥 있어. 우리처럼. 누가 돌려 주는 게 아니라."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 서버는요?"
      - say:
          char: 태민
          with: [해수]
          text: "처음에 문 열 때만 필요했어요. 지금은 문만 남았어요. 가산동 지하에 PC 한 대. 첫 빌드 돌린 거. 그게 두 쪽을 붙잡고 있어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 건물 2029년에 전기 끊겼어요. 한전에 전화해서 확인했어요. 세 번. 근데 모니터가 켜져 있어."
      - say:
          char: 해수
          with: [태민]
          text: "그거 끄면 어떻게 돼요?"
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "그쪽은 그쪽대로 가고, 이쪽은 이쪽대로 가요. 못 건너가. 그쪽에 애인 있는 사람, 그쪽에 집 산 사람, 그쪽에 죽은 엄마 살려 놓은 사람. 다 못 가요. 백십만 명."
      - say:
          char: 해수
          with: [태민]
          text: "건너가요? 그쪽에서 한 게, 이쪽으로요?"
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "처음엔 작은 거. 컵 위치. 문 잠근 거. 그쪽에서 누가 소리를 지르면 이쪽에서 누가 그 소리를 들어요. 귀에서. 그건 몇 년 됐어요."
      - say:
          char: 태민
          motion: lean_in
          with: [해수]
          text: "근데 지난주에 누가 큰 걸 했어요. 처음으로."
      - say:
          char: 해수
          with: [태민]
          text: "…큰 거요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "사람이 죽었어요. 이쪽에서. 그쪽에서 한 게 이쪽으로 넘어와서."
      - say:
          char: 태민
          with: [해수]
          text: "컵 위치는 몇 년 됐는데, 사람은 처음이에요. 그래서 나 지금 잠을 못 자요."
      - say:
          char: 해수
          with: [태민]
          text: "그거 어떻게 아세요."
      - say:
          char: 태민
          with: [해수]
          text: "접속자 숫자는 안 변했는데, 지난주에 세션 하나가 단계가 올라갔어요. 이 년 반 만에 처음."
      - say:
          char: 태민
          with: [해수]
          text: "올라간 게 그 점이에요. 선 밖에 있는 점."
      - say:
          channel: thought
          with: []
          text: "주차장이었다. 지하 2층, C-14. 세 걸음이었다."
      - say:
          char: 해수
          with: [태민]
          text: "…그 사람은 그걸 알까요."
      - say:
          char: 태민
          with: [해수]
          text: "몰라요. 거기선 다 진짜예요. 진짜니까 모르죠."
      - say:
          char: 해수
          with: [태민]
          text: "저기요. 혹시 그 사람이 자기가 그걸 했다고 경찰에 말하면요."
      - say:
          char: 태민.laugh
          with: [해수]
          text: "안 믿어요. 나도 안 믿어 줬어요, 사 년 동안."
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 오른손, 주머니에 좀 넣어 줄래요. 그냥요."
      - say:
          char: 해수
          with: [태민]
          text: "튜토리얼은 누가 만들었어요?"
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "아무도요. 첫 빌드 켜니까 이미 있었어요. 1/5부터 5/5까지. 문구까지 그대로. 우리는 글씨체만 바꿨어. 넘기기 버튼도 우리가 단 거고."
      - say:
          char: 태민
          with: [해수]
          text: "근데 어떤 사람한테는 그 버튼이 안 떠요. 버그 리포트에 딱 한 건 있었어요. 사용자 번호가 이상하게 찍혀서 다들 테스트 계정인 줄 알았고."
      - say:
          char: 해수
          with: [태민]
          text: "5단계는 뭐예요?"
      - say:
          char: 태민
          with: [해수]
          text: "몰라요. 아무도 거기까지 안 갔으니까."
      - get: keycard
      - say:
          char: 태민
          with: [해수]
          text: "받아요. …아, 놓쳤네. 바닥에 있어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "가져가요. 나는 못 가요. 무서워서."
      - move: { id: 태민, style: reset }
      - say:
          char: 태민
          motion: perk
          with: [해수]
          text: "…그린마트 직원 할인 돼요? 컵라면. 박스로."

