      - say:
          channel: message
          side: them
          char: 엄마
          with: []
          text: "0411은 뭐야 그거"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "제 입사일이에요 외우기 쉬워서요"
      - say:
          channel: message
          side: them
          char: 엄마
          with: []
          text: "그걸 비번으로 쓰니"
      - say:
          channel: message
          side: them
          char: 엄마
          with: []
