chapterTitle: "고시원 304호"

script:
  - scene: second_interview
  - scene: interview_end
  - scene: forum
  - scene: corridor
  - scene: room
  - scene: dev_talk
  - scene: door
  - scene: leave

scenes:
  second_interview:
    title: "2차 진술"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900 }
      - music: bleed
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.21 10:15 · 중랑경찰서 · 정해수(31) · 2차 · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물은 그냥 놔 둘게요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "증거가 자꾸 바뀌어서 남은 걸로 다시 봤어요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "주차 기록을 봤어요. 그날 새벽 지하 2층에 차를 댄 직원이 한 명이더라고요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "변상혁 씨. 같이 사시죠."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "3층 손님 일도 있고. 오늘 오후에 집으로 갈 거예요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "정해수 씨. 접수증, 연필, 죽기 전날 고객센터 앞에 한 시간 서 있던 피해자."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "다 정해수 씨를 가리켜요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "근데 정해수 씨는 그 시간에 집 밖에 안 나왔어요."
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "빌라 현관 CCTV를 세 번 돌려 봤어요. 세 번 다 안 나와요."
      - say:
          char: 은숙
          with: [해수]
          text: "빨리 감아도 보고 한 장씩 넘겨도 봤어요. 나가는 모습이 찍혔나 해서요."
      - say:
          char: 은숙
          with: [해수]
          text: "안 보여요. 정해수 씨는 그날 밤 열한 시에 들어가서 아침 여섯 시 사십에 나왔어요."
      - say:
          char: 해수
          with: [은숙]
          text: "…네. 맞습니다."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "그러면 수사 보고서에 정해수 씨가 현장에 갔다고 쓸 수 없어요."
      - say:
          char: 은숙
          with: [해수]
          text: "그런데 연필이든 접수증이든 자꾸 해수 씨 이름이 나와요."
      - say:
          char: 은숙
          with: [해수]
          text: "접수증 필체. 비품 연필."
      - say:
          char: 은숙
          with: [해수]
          text: "피해자가 죽기 전날 고객센터 앞에 한 시간 서 있던 것."
      - say:
          char: 은숙
          with: [해수]
          text: "그 한 시간, 뭐 하셨어요."
      - say:
          char: 해수
          with: [은숙]
          text: "접수증을 써 드렸습니다."
      - say:
          char: 해수
          with: [은숙]
          text: "세 번 다시 썼습니다."
      - say:
          char: 해수
          with: [은숙]
          text: "고객님이 글씨가 작다고 하셔서요."
      - say:
          char: 은숙
          with: [해수]
          text: "…세 번."
      - say:
          char: 은숙
          with: [해수]
          text: "그 접수증 원본이 우리한테 있어요. 세 번 쓴 거 중에 두 번째가요."
      - say:
          char: 해수
          with: [은숙]
          text: "두 번째는 버렸는데요."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "네. 저도 그게 이상해요."
      - say:
          channel: action
          with: []
          text: "은숙이 볼펜으로 책상을 한 번 두드린다. 종이에는 아직 아무것도 안 적혀 있다."
      - say:
          char: 은숙
          with: [해수]
          text: "정해수 씨 말씀대로라면 저희는 그 종이를 갖고 있을 수가 없어요."
      - say:
          char: 은숙
          with: [해수]
          text: "버리신 건 확실하죠?"
      - say:
          char: 은숙
          with: [해수]
          text: "제가 가져온 이 접수증은 어디서 나온 걸까요."
      - choice:
          key: t3_tell
          prompt: "녹음기 빨간 불. 은숙이 볼펜 뚜껑을 닫는다."
          char: 해수
          motion: freeze
          options:
            - text: "모른다고 답한다"
              saveText: "\"모르겠습니다. 죄송합니다.\""
              goto: tell_nothing
            - text: "레플라에서 한 일을 털어놓는다"
              saveText: "\"레플라에서 찔렀습니다.\" 그대로 말한다"
              set: { told_truth: true }
              add: { honest: 1 }
              goto: tell_truth
            - text: "상혁이 방에 있었다고 말한다"
              saveText: "\"상혁이는 아니에요. 그날 방에 있었어요.\""
              when: { var: tampered, op: gt, value: 0 }
              add: { sh_care: 1 }
              goto: tell_cover

  tell_nothing:
    actions:
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "모르겠습니다."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "죄송합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "사과는 됐어요. 어디서 봤는지만 말해 주세요."
      - emote: { id: 해수, motion: bow }
      - goto: interview_end

  tell_truth:
    actions:
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "레플라에서요."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "튜토리얼 3단계에서."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "연필로 찔렀습니다."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "지하 2층, C-14 옆에서요."
      - move: { id: 은숙, toward: 해수, style: retreat }
      - say:
          char: 은숙
          with: [해수]
          text: "레플라에서 사람 찔렀다고 자수하러 오는 사람, 한 달에 열 명쯤 와요. 다 술 먹고 와요."
      - say:
          char: 은숙
          with: [해수]
          text: "저는 안 해요, 레플라."
      - say:
          char: 은숙
          with: [해수]
          text: "딸이 해요. 중학생인데 거기선 반장이래요. 여기선 아니고."
      - say:
          char: 해수
          with: [은숙]
          text: "저는 술 안 마셔요."
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "알아요. 술 냄새가 안 나요."
      - say:
          channel: record
          with: []
          text: "진술 요지 · 레플라 튜토리얼 3/5에서 연필로 피해자를 찔렀다고 함 · 장소 B2 C-14 · 본인은 그 시간 자택에 있었음"
      - say:
          char: 은숙
          with: [해수]
          text: "일단 말씀하신 대로 적을게요."
      - goto: interview_end

  tell_cover:
    actions:
      - say:
          char: 해수
          with: [은숙]
          text: "상혁이는 아니에요."
      - say:
          char: 해수
          with: [은숙]
          text: "그날 방에 있었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "제가 들었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "웃는 소리."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "민지영 주임님 얘기는 다르던데요."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "그날 밤에는 방에 없었다면서요. 차에 있었다는 말도 하셨고요."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "웃는 소리로는 알리바이가 안 돼요. 그래도 적을게요."
      - move: { id: 해수, toward: 은숙, style: flinch }
      - goto: interview_end

  interview_end:
    actions:
      - move: { id: 은숙, style: reset }
      - say:
          char: 은숙
          with: [해수]
          text: "기태민이라는 사람 알아요?"
      - say:
          char: 은숙
          with: [해수]
          text: "레플라 초기에 만든 사람 중 하나래요."
      - say:
          char: 은숙
          with: [해수]
          text: "비슷한 일이 터질 때마다 경찰서에 전화해요."
      - say:
          char: 은숙
          with: [해수]
          text: "자기 얘기 좀 들어 달라고."
      - say:
          char: 은숙
          with: [해수]
          text: "아무도 안 들어 줘요."
      - say:
          char: 은숙
          with: [해수]
          text: "저도 안 들었고. 그냥 생각나서요."
      - say:
          char: 해수
          with: [은숙]
          text: "…그 사람은 뭐라고 하는데요."
      - say:
          char: 은숙
          with: [해수]
          text: "서버를 다 껐는데 접속자가 그대로라고요. 껐다는 날부터 그 말만 해요."
      - say:
          char: 은숙
          with: [해수]
          text: "숫자부터 알아듣기 힘들어서 진술로 받은 적은 없어요."

  forum:
    title: "주소"
    actions:
      - bg: { id: cs_desk, transition: cut }
      - place: "4월 21일 오후 · 고객센터"
      - char: { id: 해수, position: left, emotion: service }
      - say:
          channel: action
          with: []
          text: "번호표 없이 온 남자 손님이 창구에 팔꿈치를 올리고 영수증을 흔든다."
      - say:
          char: 해수.service
          motion: lean_in
          with: []
          text: "번호표 뽑고 기다리세요, 고객님."
      - say:
          channel: action
          with: []
          text: "손님은 번호표 기계를 보고 다시 창구를 본다. 팔꿈치는 창구 위에 그대로 얹고 있다."
      - say:
          char: 해수.service
          with: []
          text: "제가 뽑아 드릴까요?"
      - say:
          char: 해수.service
          with: []
          text: "052번이세요."
      - say:
          char: 해수.service
          with: []
          text: "지금 기다리는 분 없으니까 바로 불러 드릴게요."
      - say:
          channel: action
          with: []
          text: "띵동 소리가 나고, 해수가 같은 손님을 같은 자리에서 다시 맞는다."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "052번 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "영수증 확인해 드릴게요."
      - say:
          channel: thought
          with: []
          text: "이 절차를 건너뛰면 그날치 접수 건수가 안 맞는다. 안 맞으면 월말에 내가 설명해야 한다."
      - say:
          channel: action
          with: []
          text: "영수증을 받은 손은 창구 위에 두고, 앞치마 주머니에서 몰래 휴대폰을 꺼낸다."
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "주임님 혹시 기태민이라는 사람 아세요?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "레플라 갤 고닉. 왜"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "서버 없이 돌아간다고 글 쓰다가 영구 차단당한 사람"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "망우동 그린고시원 304호. 갤에 자기 주소를 올렸었어 와서 확인하라고"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 마"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 감사합니다 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 말라니까"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수야"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "내가 체험권 준 거 때문이면 그거 내가 미안해"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "아니에요 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "그럼 내일 마감 바꿔 줘 그걸로 갚아"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 바꿔 드릴게요"

  corridor:
    title: "그린고시원"
    actions:
      - bg: { id: goshiwon, transition: fade, duration: 900 }
      - place: "밤 9:00 · 망우동 그린고시원 304호"
      - char: { id: 태민, position: right }
      - char: { id: 해수, position: left }
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민
          with: [해수]
          text: "경찰이에요?"
      - say:
          char: 해수
          motion: bow
          with: [태민]
          text: "아니요. 그린마트 상봉점 고객센터에서 일합니다."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "…그걸 왜 말해요."
      - wait: 600
      - say:
          char: 해수
          with: [태민]
          text: "죄송합니다."
      - say:
          char: 해수
          with: [태민]
          text: "어디서 왔냐고 물으시는 줄 알고요."
      - say:
          char: 태민
          with: [해수]
          text: "몇 단계예요."
      - say:
          char: 해수
          with: [태민]
          text: "네?"
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "튜토리얼. 여기 오는 사람은 다 그거 물어보러 와요."
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "대개 2단계에서 와요. 소리 좀 질러 보고 겁나서."
      - say:
          char: 해수
          when: { var: tampered, op: gt, value: 0 }
          with: [태민]
          text: "4단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "3단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "4단계는 들어가기만 했습니다."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "……들어와요. 신발은 신고."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "컵라면 용기는 밟지 말고."
      - say:
          channel: thought
          with: []
          text: "304호. 우리가 사는 빌라도 304호인데."
      - say:
          channel: thought
          with: []
          text: "흔한 호수인데 두 번 보고서야 문을 두드린다."
      - say:
          channel: action
          with: []
          text: "방은 내 방보다 좁다. 창이 없고, 벽 한 면이 종이로 덮여 있다."
      - say:
          channel: action
          with: []
          text: "날짜만 다른 같은 표가 벽을 덮고 있다. 종이마다 맨 아래 줄에 형광펜을 그어 뒀다."
      - say:
          char: 해수
          with: [태민]
          text: "이거 다 같은 거 아니에요?"
      - say:
          char: 태민
          with: [해수]
          text: "같아요. 그게 이상한 거예요."
      - say:
          char: 태민
          with: [해수]
          text: "일 년 반 동안 숫자가 그대로예요. 말이 안 되잖아요."
      - say:
          char: 태민
          with: [해수]
          text: "매주 월요일에 뽑아요."
      - say:
          char: 태민
          with: [해수]
          text: "월요일 말고 다른 날에는 출력 안 해요."
      - say:
          char: 태민
          with: [해수]
          text: "같은 조건이어야 하니까."
      - say:
          channel: thought
          with: []
          text: "일흔 장이 넘는다. 월요일마다 한 장씩 붙인 거다."
      - say:
          char: 해수
          with: [태민]
          text: "회사는 문 닫았잖아요."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 이거 누구한테 보여 주려고요."
      - say:
          char: 태민
          with: [해수]
          text: "…경찰서요. 처음엔 보여 줬어요."
      - say:
          char: 태민
          with: [해수]
          text: "지금은 안 받아 줘요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "계속 뽑아 둬요. 한 번 거르면 꼭 그날 숫자가 바뀔 것 같아서요."
      - move: { id: 태민, style: reset }

  room:
    actions:
      - choice:
          key: t3_room
          presentation: explore
          prompt: "모니터 세 대 중 한 대만 켜져 있다."
          with: [태민]
          camera: wide
          options:
            - text: "벽에 붙은 그래프"
              at: { x: 28, y: 36 }
              when: { var: seen_graph, op: eq, value: false }
              goto: see_graph
            - text: "책상 위 출입 카드"
              at: { x: 66, y: 62 }
              when: { var: seen_card, op: eq, value: false }
              goto: see_card
            - text: "레플라가 어떻게 작동하는지 묻는다"
              saveText: "\"이게 어떻게 돌아가는 건데요.\""
              when:
                all:
                  - { var: seen_graph, op: eq, value: true }
                  - { var: seen_card, op: eq, value: true }
              goto: dev_talk

  see_graph:
    actions:
      - say:
          channel: record
          with: []
          text: "레플라 동시 접속자 · 2029.11.03 서버 전원 전부 차단 · 이후 1,104,331명 (변동 없음)"
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "서버 마흔두 대. 회계팀이 비용 줄이라고 해서 절반만 끄려고 했어요."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "절반 껐는데 숫자가 안 떨어져."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "그래서 다 껐어요. 안 떨어져. 지금까지."
      - say:
          char: 해수
          with: [태민]
          text: "아무도 접속을 끊지 않았다고요?"
      - say:
          char: 태민
          with: [해수]
          text: "한 명도. 백십만 사천삼백서른하나."
      - say:
          char: 태민
          with: [해수]
          text: "일 년 반 동안 숫자가 그대로예요."
      - say:
          char: 해수
          with: [태민]
          text: "사람이 죽기도 하잖아요."
      - say:
          char: 해수
          with: [태민]
          text: "이쪽에서요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "…그래서 안 줄어드는 게 더 무서운 거예요."
      - say:
          channel: action
          with: []
          text: "모눈종이 여섯 장을 이어 붙여 그린 그래프다. 서버를 끈 날부터 선이 수평이다."
      - say:
          channel: thought
          with: []
          text: "맨 왼쪽에 점 하나가 선 밖에 떨어져 있다. 거기만 연필로 동그라미를 세 번 쳤다."
      - say:
          char: 해수
          with: [태민]
          text: "이 점은 왜 혼자 있어요."
      - say:
          char: 태민
          with: [해수]
          text: "그게 제일 오래된 거예요."
      - say:
          char: 태민
          with: [해수]
          text: "그 점은 원래 서버에 연결되지 않은 세션이에요."
      - set: { seen_graph: true }
      - goto: room

  see_card:
    actions:
      - say:
          char: 태민
          with: [해수]
          text: "개발 초기에 만든 출입증이에요. 한번 뒤집어 보세요."
          continueLabel: "출입증을 뒤집어 본다"
      - sticker: { id: keycard, image: user_0001_card_sticker, x: 64, y: 34, width: "280px", rotate: 4, enter: popIn }
      - say:
          channel: action
          with: []
          text: "뒤집어 보니 사진 칸이 비어 있다. 오른쪽에 사용자 번호만 찍혀 있다."
      - say:
          channel: record
          with: []
          text: "레플라 가산 R&D · 출입증 · 사진 (없음) · USER 0001"
      - say:
          char: 해수
          with: [태민]
          text: "이거 불량이에요?"
      - say:
          char: 태민
          with: [해수]
          text: "…모르겠어요. 사진 칸에 넣을 사진을 못 찾았대요."
      - say:
          char: 태민
          with: [해수]
          text: "가산동 서버실에 있던 거예요. 제 카드는 아직 거기서 먹혀요."
      - clearSticker: { id: keycard, leave: fadeOut }
      - set: { seen_card: true }
      - goto: room

  dev_talk:
    title: "서버 없이"
    actions:
      - say:
          char: 태민
          with: [해수]
          text: "서버를 끄면 화면이 비어야 되잖아요."
      - say:
          char: 태민
          with: [해수]
          text: "다 끄고 레플라에 다시 들어가 봤어요. 아까 두고 나온 컵이 책상 위에 그대로 있었어요."
      - say:
          char: 태민
          with: [해수]
          text: "나올 땐 김이 났거든요. 돌아가서 만져 보니 미지근했어요."
      - say:
          char: 태민
          with: [해수]
          text: "물이 식는 것까지 서버에서 계산하던 건데요. 서버가 없는데도 식었어요."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 서버는요?"
      - say:
          char: 태민
          with: [해수]
          text: "처음 접속할 땐 서버를 거쳐야 했어요."
      - say:
          char: 태민
          with: [해수]
          text: "이제는 접속하는 통로 하나만 남았고요."
      - say:
          char: 태민
          with: [해수]
          text: "가산동 지하에 PC 한 대."
      - say:
          char: 태민
          with: [해수]
          text: "레플라를 처음 돌려 본 컴퓨터예요. 그게 아직 양쪽을 연결하고 있어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 건물 2029년에 전기 끊겼어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "한전에 전화해서 확인했어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "세 번. 근데 모니터가 켜져 있어."
      - say:
          char: 해수
          with: [태민]
          text: "그거 끄면 어떻게 돼요?"
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "거기 있는 게 없어지진 않아요. 여기서 못 들어갈 뿐이지."
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "내가 아는 분은 매일 밤 돌아가신 어머니 집에 가요. 그럼 그날부터 못 가는 거죠."
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "다 못 가요. 백십만 명."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 거기서 여기로 올 수도 있어요?"
      - say:
          char: 해수
          with: [태민]
          text: "…거기서 한 일이 여기서도 일어나냐고요."
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "처음엔 컵이 다른 자리에 가 있는 정도였어요."
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "거기서 잠근 문이 여기서도 잠겨 있거나, 여기까지 소리가 들리기도 하고요."
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "밤중에 없는 사람이 말하는 것처럼 들려요. 그건 몇 년 됐어요."
      - say:
          char: 태민
          motion: lean_in
          with: [해수]
          text: "지난주에는 처음으로 일이 크게 났고요."
      - say:
          char: 해수
          with: [태민]
          text: "…큰 거요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "사람이 죽었어요. 이쪽에서."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그날 접속 기록에 뉴스에 나온 마트가 찍혀 있더라고요. 지하 2층, C-14까지요."
      - say:
          char: 태민
          with: [해수]
          text: "그 뒤로 잠들기 전에 기록을 몇 번이고 다시 열어 봐요."
      - say:
          char: 해수
          with: [태민]
          text: "그거 어떻게 아세요."
      - say:
          char: 태민
          with: [해수]
          text: "접속자 수는 그대로인데 한 세션만 다음 단계로 넘어갔어요. 서버 끈 뒤 처음이에요."
      - say:
          char: 태민
          with: [해수]
          text: "그 세션이 저 점이에요. 선 밖에 혼자 떨어진 점."
      - say:
          channel: thought
          with: []
          text: "주차장이었다. 지하 2층, C-14. 세 걸음이었다."
      - say:
          char: 해수
          with: [태민]
          text: "…그 사람은 그걸 알까요."
      - say:
          char: 태민
          with: [해수]
          text: "모를걸요. 나도 처음엔 컵 내려놓은 자리를 잘못 본 줄 알았어요."
      - say:
          char: 해수
          with: [태민]
          text: "저기요. 혹시 그 사람이 자기가 그걸 했다고 경찰에 말하면요."
      - say:
          char: 태민.laugh
          with: [해수]
          text: "안 믿어요. 나도 처음 연락했을 때부터 아무도 안 믿어 줬어요."
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 오른손, 주머니에 좀 넣어 줄래요. 그냥요."
      - say:
          char: 해수
          with: [태민]
          text: "튜토리얼은 누가 만들었어요?"
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "아무도요. 첫 빌드 켜니까 이미 있었어요."
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "1/5부터 5/5까지."
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "문구까지 그대로. 우리는 글씨체만 바꿨어."
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "넘기기 버튼도 우리가 단 거고."
      - say:
          char: 태민
          with: [해수]
          text: "근데 어떤 사람한테는 그 버튼이 안 떠요."
      - say:
          char: 태민
          with: [해수]
          text: "버그 리포트에 딱 한 건 있었어요."
      - say:
          char: 태민
          with: [해수]
          text: "사용자 번호가 이상하게 찍혀서 다들 테스트 계정인 줄 알았고."
      - say:
          char: 해수
          with: [태민]
          text: "5단계는 뭐예요?"
      - say:
          char: 태민
          with: [해수]
          text: "몰라요. 아무도 거기까지 안 갔으니까."
      - say:
          char: 태민
          with: [해수]
          text: "이건 제 출입증이에요. 받으세요. …아, 바닥에 떨어졌네요."
          continueLabel: "태민의 출입증을 줍는다"
      - get: keycard
      - say:
          char: 태민.afraid
          with: [해수]
          text: "가져가요. 나는 못 가요. 무서워서."
      - move: { id: 태민, style: reset }
      - say:
          char: 태민
          motion: perk
          with: [해수]
          text: "…그린마트 직원 할인 돼요? 컵라면. 박스로."

  door:
    title: "1, 2, 7, 0"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
      - place: "4월 22일 밤 11:00 · 집"
      - say:
          char: 해수
          with: []
          text: "상혁아. 배달 봉지 세 개, 사흘째 그대로야. 물도."
      - say:
          char: 해수
          with: []
          text: "오늘 화요일이라 내 차례야."
      - say:
          char: 해수
          with: []
          text: "네 것도 해 놨어."
      - say:
          char: 해수
          with: []
          text: "식어도 괜찮으니까 나중에 데워 먹어."
      - say:
          char: 해수
          with: []
          text: "문은 좀 열어."
      - say:
          channel: action
          with: []
          text: "문 안쪽에서 의자가 끌리는 소리가 난다. 그게 전부다. 문은 안 열린다."
      - say:
          channel: thought
          with: []
          text: "사흘 전 봉지는 아직 손잡이에 걸려 있다. 비닐 안에 물이 고였다."
      - say:
          char: 해수
          with: [상혁]
          text: "상혁아. 목소리만."
      - say:
          char: 해수
          with: [상혁]
          text: "한 마디만 해 봐."
      - say:
          channel: action
          when: { var: sh_care, op: gte, value: 2 }
          with: []
          text: "문이 손가락 두 마디쯤 열린다. 안은 어둡고 모니터 불빛만 세 줄이다."
      - effect: heal
      - say:
          char: 상혁
          when: { var: sh_care, op: gte, value: 2 }
          with: [해수]
          delivery: whisper
          text: "…밥 고맙다. 네 차례 아니었잖아. 지난주도 네가 했어."
      - say:
          channel: action
          when: { var: sh_care, op: lt, value: 2 }
          with: []
          text: "대답이 없다. 의자가 한 번 더 끌린다."
      - say:
          channel: record
          when: { var: tampered, op: gt, value: 0 }
          with: []
          text: "문틈에 낀 명함 · 중랑경찰서 강력팀 경위 차은숙 · 뒷면 볼펜 메모: 4/21 15:40 방문, 응답 없음"
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "해수야. 걔가 왔었어. 진짜로. 이불에 냄새가 남아 있어. 너도 맡아 봐. 아니, 들어오지 마."
      - choice:
          key: t3_door
          prompt: "도어락 숫자판에 손때 묻은 1, 2, 7, 0."
          char: 해수
          options:
            - text: "상혁에게 외출을 알린다"
              saveText: "\"상혁아, 나 잠깐 어디 좀 다녀올게.\""
              goto: door_leave
            - text: "상혁이 어머니께 전화한다"
              set: { called_mom: true }
              add: { sh_care: 1, honest: 1 }
              goto: door_mom

  door_leave:
    actions:
      - say:
          char: 상혁
          with: []
          text: "어. 어디 가는데."
      - say:
          char: 해수
          with: []
          text: "가산동."
      - say:
          char: 상혁
          with: []
          text: "…거기 뭐 있다고."
      - say:
          char: 해수
          with: [상혁]
          text: "레플라 처음 만든 데야."
      - say:
          char: 해수
          with: [상혁]
          text: "지금은 빈 건물이고."
      - say:
          char: 상혁
          with: [해수]
          text: "…거기 가면 걔 찾을 수 있어?"
      - say:
          char: 해수
          with: [상혁]
          text: "모르겠어."
      - say:
          char: 상혁
          with: [해수]
          text: "모르겠으면 왜 가."
      - say:
          char: 해수
          with: [상혁]
          text: "…가면 거기서 무슨 일이 있었는지 확인할 수 있을지도 몰라."
      - say:
          channel: action
          with: []
          text: "문 안에서 한참 아무 소리도 없다. 그러다 도어락 숫자판에 불이 한 번 들어온다."
      - say:
          char: 상혁
          with: [해수]
          text: "…해수야. 방문 비번 있잖아. 1270."
      - say:
          char: 상혁
          with: [해수]
          text: "그냥 그거 써. 바꾸려다 말았어."
      - goto: leave

  door_mom:
    actions:
      - say:
          channel: system
          with: []
          text: "상혁 어머니 · 연결되지 않았습니다"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "어머니 저 해수예요. 늦게 죄송합니다"
      - say:
          channel: message
          side: them
          char: 엄마
          with: []
          text: "해수야 왜 무슨 일 있어"
      - say:
          channel: message
          side: me
