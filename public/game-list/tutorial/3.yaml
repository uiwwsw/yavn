  dev_talk:
    title: "서버 없이"
    actions:
      - wait: 0
      - say:
          char: 태민
          with: [해수]
          text: "다 끄고 다시 들어가 봤어요. 아까 두고 나온 컵부터 만져 봤죠. 나올 땐 김이 났는데 미지근하더라고요."
      - wait: 0
      - say:
          char: 태민
          with: [해수]
          text: "서버에서 그 물 온도까지 계산했거든요. 다 껐는데도 물은 식었어요."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 서버는요?"
      - wait: 0
      - say:
          char: 태민
          with: [해수]
          text: "남은 건 가산동 지하에 PC 한 대예요. 그걸로 접속해요."
      - wait: 0
      - say:
          char: 태민
          with: [해수]
          text: "레플라 처음 돌려 본 컴퓨터요. 그게 지금도 켜져 있어요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 건물 전기는 2029년에 끊겼어요. 제가 한전에 물어봤어요."
      - wait: 0
      - wait: 0
      - say:
          char: 해수
          with: [태민]
          text: "그거 끄면 어떻게 돼요?"
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "거기 있는 게 없어지진 않아요. 여기서 못 들어갈 뿐이지."
      - say:
          char: 태민
          motion: slump
          with: [해수]
          text: "백십만 명이 못 들어가요. 매일 밤 돌아가신 어머니 집에 가는 분도 있어요."
      - wait: 0
      - wait: 0
      - say:
          char: 해수
          with: [태민]
          text: "그럼 거기서 한 일이 여기서도 일어나요?"
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "처음엔 컵이 다른 자리에 가 있는 정도였어요."
      - say:
          char: 태민.afraid
          motion: shiver
          with: [해수]
          text: "거기서 잠근 문이 여기서도 잠겨요. 거기서 한 말이 현실에서 들린 지도 몇 년 됐고요."
      - wait: 0
      - say:
          char: 태민
          motion: lean_in
          with: [해수]
          text: "지난주에는 처음으로 일이 크게 났고요."
      - wait: 0
      - say:
          char: 태민.afraid
          with: [해수]
          text: "사람이 죽었어요. 이쪽에서."
          wait: 850
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그날 접속 기록에 뉴스에 나온 마트가 찍혀 있더라고요. 지하 2층, C-14까지요."
      - wait: 0
      - wait: 0
      - say:
          char: 태민
          with: [해수]
          text: "접속자 수는 그대로인데 한 세션만 다음 단계로 넘어갔어요. 서버 끈 뒤 처음이에요."
      - say:
          char: 태민
          with: [해수]
          text: "그 세션이 저 점이에요. 선 밖에 혼자 떨어진 점."
      - say:
          channel: thought
          with: []
          text: "주차장이었다. 지하 2층, C-14. 세 걸음이었다."
          wait: 850
      - say:
          char: 해수
          with: [태민]
          text: "…그 사람은 그걸 알까요."
      - say:
          char: 태민
          with: [해수]
          text: "모를걸요. 나도 처음엔 컵 내려놓은 자리를 잘못 본 줄 알았어요."
      - say:
          char: 해수
          with: [태민]
          text: "저기요. 혹시 그 사람이 자기가 그걸 했다고 경찰에 말하면요."
      - say:
          char: 태민.laugh
          with: [해수]
          text: "안 믿어요. 나도 처음 연락했을 때부터 아무도 안 믿어 줬어요."
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민.afraid
          with: [해수]
          text: "그 오른손, 주머니에 좀 넣어 줄래요. 그냥요."
      - say:
          char: 해수
          with: [태민]
          text: "튜토리얼은 누가 만들었어요?"
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "아무도요. 첫 빌드를 켰을 때 1단계부터 5단계까지 문구도 그대로 있었어요."
      - wait: 0
      - wait: 0
      - say:
          char: 태민.laugh
          motion: laugh
          with: [해수]
          text: "넘기기 버튼도 우리가 단 거고."
      - say:
          char: 태민
          with: [해수]
          text: "딱 한 사람한테 그 버튼이 안 떴어요. 테스트 계정인 줄 알았죠."
      - wait: 0
      - wait: 0
      - say:
          char: 해수
          with: [태민]
          text: "5단계는 뭐예요?"
      - say:
          char: 태민
          with: [해수]
          text: "몰라요. 아무도 거기까지 안 갔으니까."
      - say:
          char: 태민
          with: [해수]
          text: "제 출입증 있어요. 이거 찍으면 돼요. 아, 잠깐만요."
          continueLabel: "태민의 출입증을 줍는다"
      - get: keycard
      - say:
          char: 태민.afraid
          with: [해수]
          text: "가져가세요. 전 거기 다시 못 가겠어요."
      - move: { id: 태민, style: reset }
      - say:
          char: 태민
          motion: perk
          with: [해수]
          text: "…그린마트 직원 할인 돼요? 컵라면. 박스로."

  door:
    title: "1, 2, 7, 0"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
