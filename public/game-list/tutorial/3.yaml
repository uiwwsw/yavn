      - say:
          char: 해수
          with: []
          text: "가산동."
      - say:
          char: 상혁
          with: []
          text: "…거기 뭐 있다고."
      - say:
          char: 해수
          with: [상혁]
          text: "레플라 처음 만든 데야."
      - say:
          char: 해수
          with: [상혁]
          text: "지금은 빈 건물이고."
      - say:
          char: 상혁
          with: [해수]
          text: "…거기 가면 걔 찾을 수 있어?"
      - say:
          char: 해수
