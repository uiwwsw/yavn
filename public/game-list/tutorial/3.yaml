chapterTitle: "고시원 304호"

script:
  - scene: second_interview
  - scene: interview_end
  - scene: forum
  - scene: corridor
  - scene: room
  - scene: dev_talk
  - scene: door
  - scene: leave

scenes:
  second_interview:
    title: "2차 진술"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900, place: "4월 21일 오전 · 중랑경찰서" }
      - music: bleed
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.21 10:15 · 중랑경찰서 · 정해수(31) · 2차 · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물은 그냥 놔 둘게요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "어제 있던 게 오늘은 없더라고요. 남은 것부터 다시 봤어요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "주차 기록을 봤어요. 그날 새벽 지하 2층에 차를 댄 직원이 한 명이더라고요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "변상혁 씨. 같이 사시죠."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "3층 손님 일도 있고. 오늘 오후에 집으로 갈 거예요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "정해수 씨. 접수증, 연필, 죽기 전날 고객센터 앞에 한 시간 서 있던 피해자."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "다 정해수 씨를 가리켜요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "근데 정해수 씨는 그 시간에 집 밖에 안 나왔어요."
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "빌라 현관 CCTV를 세 번 돌려 봤어요. 세 번 다 안 나와요."
      - wait: 0
      - say:
          char: 은숙
          with: [해수]
          text: "안 보여요. 정해수 씨는 그날 밤 11시에 들어가서 다음 날 오전 6시 40분에 나왔어요."
      - say:
          char: 해수
          with: [은숙]
          text: "…네. 맞습니다."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "그럼 해수 씨가 나갔다고는 제가 쓸 수 없어요."
      - say:
          char: 은숙
          with: [해수]
          text: "그런데 전날엔 오광철 씨가 창구 앞에 한 시간이나 서 있었다면서요."
      - wait: 0
      - wait: 0
      - say:
          char: 은숙
          with: [해수]
          text: "뭘 그렇게 오래 기다리셨대요?"
      - say:
          char: 해수
          with: [은숙]
          text: "글씨가 작다고 하셔서 접수증을 세 번 썼습니다."
      - wait: 0
      - wait: 0
      - say:
          char: 은숙
          with: [해수]
          text: "…세 번."
      - say:
          char: 은숙
          with: [해수]
          text: "저희가 갖고 있는 게 그중 두 번째예요. 원본이고요."
      - say:
          char: 해수
          with: [은숙]
          text: "두 번째는 버렸는데요."
          wait: 800
      - wait: 0
      - say:
          channel: action
          with: []
          text: "은숙이 볼펜으로 책상을 한 번 두드린다. 종이에는 아직 아무것도 안 적혀 있다."
      - wait: 0
      - wait: 0
      - say:
          char: 은숙
          with: [해수]
          text: "버린 게 맞으면 이건 어디서 나왔을까요?"
      - choice:
          key: t3_tell
          prompt: "녹음기 빨간 불. 은숙이 볼펜 뚜껑을 닫는다."
          char: 해수
          motion: freeze
          options:
            - text: "모른다고 답한다"
              saveText: "\"모르겠습니다. 죄송합니다.\""
              goto: tell_nothing
            - text: "레플라에서 한 일을 털어놓는다"
              saveText: "\"레플라에서 찔렀습니다.\" 그대로 말한다"
              set: { told_truth: true }
              add: { honest: 1 }
              goto: tell_truth
            - text: "상혁이 방에 있었다고 말한다"
              saveText: "\"상혁이는 아니에요. 그날 방에 있었어요.\""
              when: { var: tampered, op: gt, value: 0 }
              add: { sh_care: 1 }
              goto: tell_cover

  tell_nothing:
    actions:
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "모르겠습니다."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "죄송합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "사과는 됐어요. 어디서 봤는지만 말해 주세요."
      - emote: { id: 해수, motion: bow }
      - goto: interview_end

  tell_truth:
    actions:
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "레플라에서요."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "튜토리얼 3단계에서."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "연필로 찔렀습니다."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "지하 2층, C-14 옆에서요."
      - move: { id: 은숙, toward: 해수, style: retreat }
      - say:
          char: 은숙
          with: [해수]
          text: "레플라에서 사람 찔렀다고 자수하러 오는 사람, 한 달에 열 명쯤 와요. 다 술 먹고 와요."
      - say:
          char: 은숙
          with: [해수]
          text: "저는 안 해요, 레플라."
      - say:
          char: 은숙
          with: [해수]
          text: "딸이 해요. 중학생인데 거기선 반장이래요. 여기선 아니고."
      - say:
          char: 해수
          with: [은숙]
          text: "저는 술 안 마셔요."
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "알아요. 술 냄새가 안 나요."
      - say:
          channel: record
          with: []
          text: "진술 요지 · 레플라 튜토리얼 3/5에서 연필로 피해자를 찔렀다고 함 · 장소 B2 C-14 · 본인은 그 시간 자택에 있었음"
      - say:
          char: 은숙
          with: [해수]
          text: "일단 말씀하신 대로 적을게요."
      - goto: interview_end

  tell_cover:
    actions:
      - say:
          char: 해수
          with: [은숙]
          text: "상혁이는 아니에요."
      - say:
          char: 해수
          with: [은숙]
          text: "그날 방에 있었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "제가 들었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "웃는 소리."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "민지영 주임님 얘기는 다르던데요."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "그날 밤에는 방에 없었다면서요. 차에 있었다는 말도 하셨고요."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "웃는 소리로는 알리바이가 안 돼요. 그래도 적을게요."
      - move: { id: 해수, toward: 은숙, style: flinch }
      - goto: interview_end

  interview_end:
    actions:
      - move: { id: 은숙, style: reset }
      - say:
          char: 은숙
          with: [해수]
          text: "기태민이라는 사람 알아요?"
      - say:
          char: 은숙
          with: [해수]
          text: "레플라 초기에 만든 사람 중 하나래요."
      - say:
          char: 은숙
          with: [해수]
          text: "비슷한 일이 터질 때마다 경찰서에 전화해요."
      - say:
          char: 은숙
          with: [해수]
          text: "자기 얘기 좀 들어 달라고."
      - say:
          char: 은숙
          with: [해수]
          text: "아무도 안 들어 줘요."
      - say:
          char: 은숙
          with: [해수]
          text: "저도 안 들었고. 그냥 생각나서요."
      - say:
          char: 해수
          with: [은숙]
          text: "…그 사람은 뭐라고 하는데요."
      - say:
          char: 은숙
          with: [해수]
          text: "서버를 다 껐는데 접속자가 그대로라고요. 껐다는 날부터 그 말만 해요."
      - say:
          char: 은숙
          with: [해수]
          text: "숫자부터 알아듣기 힘들어서 진술로 받은 적은 없어요."

  forum:
    title: "주소"
    actions:
      - bg: { id: cs_desk, transition: cut }
      - place: { text: "4월 21일 오후 · 고객센터", presentation: center }
      - char: { id: 해수, position: left, emotion: service }
      - say:
          channel: action
          with: []
          text: "조사실에서 들은 기태민 이름을 잊기 전에 물어보려고 휴대폰을 꺼낸다. 그때 번호표 없이 온 손님이 창구에 팔꿈치를 올리고 영수증을 흔든다."
      - say:
          char: 해수.service
          motion: lean_in
          with: []
          text: "번호표 뽑고 기다리세요, 고객님."
      - say:
          channel: action
          with: []
          text: "손님은 번호표 기계를 보고 다시 창구를 본다. 팔꿈치는 창구 위에 그대로 얹고 있다."
      - say:
          char: 해수.service
          with: []
          text: "제가 뽑아 드릴까요?"
      - say:
          char: 해수.service
          with: []
          text: "052번이세요."
      - say:
          char: 해수.service
          with: []
          text: "지금 기다리는 분 없으니까 바로 불러 드릴게요."
      - say:
          channel: action
          with: []
          text: "띵동 소리가 나고, 해수가 같은 손님을 같은 자리에서 다시 맞는다."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "052번 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "영수증 확인해 드릴게요."
      - say:
          channel: thought
          with: []
          text: "이 절차를 건너뛰면 그날치 접수 건수가 안 맞는다. 안 맞으면 월말에 내가 설명해야 한다."
      - say:
          channel: action
          with: []
          text: "영수증을 받은 손은 창구 위에 두고, 앞치마 주머니에서 몰래 휴대폰을 꺼낸다."
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "주임님 혹시 기태민이라는 사람 아세요?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "레플라 갤 고닉. 왜"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "서버 없이 돌아간다고 글 쓰다가 영구 차단당한 사람"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "망우동 그린고시원 304호. 갤에 자기 주소를 올렸었어 와서 확인하라고"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 마"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 감사합니다 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "가지 말라니까"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수야"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "내가 체험권 준 거 때문이면 그거 내가 미안해"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "아니에요 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "그럼 내일 마감 바꿔 줘 그걸로 갚아"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 바꿔 드릴게요"

  corridor:
    title: "그린고시원"
    actions:
      - bg: { id: goshiwon, transition: fade, duration: 900 }
      - place: { text: "4월 21일 밤 9:00 · 망우동 그린고시원 304호", presentation: center }
      - char: { id: 태민, position: right }
      - char: { id: 해수, position: left }
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민
          speakerName: "문 안의 남자"
          with: [해수]
          text: "경찰이에요?"
      - say:
          char: 해수
          motion: bow
          with: [태민]
          text: "아니요. 그린마트 상봉점 고객센터에서 일합니다. 기태민 씨 맞으세요?"
      - say:
          char: 태민
          speakerName: "문 안의 남자"
          motion: sway
          with: [해수]
          text: "…기태민 맞는데, 마트에서 왜 왔어요?"
      - wait: 600
      - say:
          char: 해수
          with: [태민]
          text: "죄송합니다."
      - say:
          char: 해수
          with: [태민]
          text: "회사에서 보낸 건 아니에요. 제가 물어볼 게 있어서요."
      - say:
          char: 태민
          with: [해수]
          text: "몇 단계예요."
      - say:
          char: 해수
          with: [태민]
          text: "네?"
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "튜토리얼. 여기 오는 사람은 다 그거 물어보러 와요."
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "대개 2단계에서 와요. 소리 좀 질러 보고 겁나서."
      - say:
          char: 해수
          when: { var: tampered, op: gt, value: 0 }
          with: [태민]
          text: "4단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "3단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "4단계는 들어가기만 했습니다."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "……들어와요. 신발은 신고."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "컵라면 용기는 밟지 말고."
      - say:
          channel: thought
          with: []
          text: "304호. 우리가 사는 빌라도 304호인데."
      - say:
          channel: thought
          with: []
          text: "흔한 호수인데 두 번 보고서야 문을 두드린다."
      - say:
          channel: action
          with: []
          text: "방은 내 방보다 좁다. 창이 없고, 벽 한 면이 종이로 덮여 있다."
      - say:
          channel: action
          with: []
          text: "날짜만 다른 같은 표가 벽을 덮고 있다. 종이마다 맨 아래 줄에 형광펜을 그어 뒀다."
      - say:
          char: 해수
          with: [태민]
          text: "이거 다 같은 거 아니에요?"
      - say:
          char: 태민
          with: [해수]
          text: "같아요. 그게 이상한 거예요."
      - say:
          char: 태민
          with: [해수]
          text: "1년 반 동안 숫자가 그대로예요. 말이 안 되잖아요."
      - say:
          char: 태민
          with: [해수]
          text: "매주 월요일에 뽑아요."
      - say:
          char: 태민
          with: [해수]
          text: "월요일 말고 다른 날에는 출력 안 해요."
      - say:
          char: 태민
          with: [해수]
          text: "같은 조건이어야 하니까."
      - say:
          channel: thought
          with: []
          text: "일흔 장이 넘는다. 월요일마다 한 장씩 붙인 거다."
      - say:
          char: 해수
          with: [태민]
          text: "회사는 문 닫았잖아요."
      - say:
          char: 해수
          with: [태민]
          text: "그럼 이거 누구한테 보여 주려고요."
      - say:
          char: 태민
          with: [해수]
          text: "…경찰서요. 처음엔 보여 줬어요."
      - say:
          char: 태민
          with: [해수]
          text: "지금은 안 받아 줘요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "계속 뽑아 둬요. 한 번 거르면 꼭 그날 숫자가 바뀔 것 같아서요."
      - move: { id: 태민, style: reset }

  room:
    actions:
      - choice:
          key: t3_room
          presentation: explore
          prompt: "태민이 문을 더 열어 준다. 문턱을 넘으니 모니터 세 대 중 한 대만 켜져 있다."
          with: [태민]
          camera: wide
          options:
            - text: "벽에 붙은 그래프"
              at: { x: 28, y: 36 }
              when: { var: seen_graph, op: eq, value: false }
              goto: see_graph
            - text: "책상 위 출입 카드"
              at: { x: 66, y: 62 }
              when: { var: seen_card, op: eq, value: false }
              goto: see_card
            - text: "레플라가 어떻게 작동하는지 묻는다"
              saveText: "\"이게 어떻게 돌아가는 건데요.\""
              when:
                all:
                  - { var: seen_graph, op: eq, value: true }
                  - { var: seen_card, op: eq, value: true }
              goto: dev_talk

  see_graph:
    actions:
      - say:
          channel: record
          with: []
          text: "레플라 동시 접속자 · 2029.11.03 서버 전원 전부 차단 · 이후 1,104,331명 (변동 없음)"
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "서버 마흔두 대. 회계팀이 비용 줄이라고 해서 절반만 끄려고 했어요."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "절반 껐는데 숫자가 안 떨어져."
      - say:
          char: 태민
          motion: sway
          with: [해수]
          text: "그래서 다 껐어요. 안 떨어져. 지금까지."
      - say:
          char: 해수
          with: [태민]
          text: "아무도 접속을 끊지 않았다고요?"
      - say:
          char: 태민
          with: [해수]
          text: "한 명도. 백십만 사천삼백서른하나."
      - say:
          char: 태민
          with: [해수]
          text: "1년 반 동안 숫자가 그대로예요."
      - say:
          char: 해수
          with: [태민]
          text: "사람이 죽기도 하잖아요."
      - say:
          char: 해수
          with: [태민]
          text: "이쪽에서요."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "…그래서 안 줄어드는 게 더 무서운 거예요."
      - say:
          channel: action
          with: []
          text: "모눈종이 여섯 장을 이어 붙여 그린 그래프다. 서버를 끈 날부터 선이 수평이다."
      - say:
          channel: thought
          with: []
          text: "맨 왼쪽에 점 하나가 선 밖에 떨어져 있다. 거기만 연필로 동그라미를 세 번 쳤다."
      - say:
          char: 해수
          with: [태민]
          text: "이 점은 왜 혼자 있어요."
      - say:
          char: 태민
          with: [해수]
          text: "그게 제일 오래된 거예요."
      - say:
          char: 태민
          with: [해수]
          text: "그 점은 원래 서버에 연결되지 않은 세션이에요."
      - set: { seen_graph: true }
      - goto: room

  see_card:
    actions:
      - say:
          char: 태민
          with: [해수]
          text: "개발 초기에 만든 출입증이에요. 한번 뒤집어 보세요."
          continueLabel: "출입증을 뒤집어 본다"
      - sticker: { id: keycard, image: user_0001_card_sticker, x: 64, y: 34, width: "280px", rotate: 4, enter: popIn }
      - say:
          channel: action
          with: []
          text: "뒤집어 보니 사진 칸이 비어 있다. 오른쪽에 사용자 번호만 찍혀 있다."
      - say:
          channel: record
          with: []
          text: "레플라 가산 R&D · 출입증 · 사진 (없음) · USER 0001"
      - say:
          char: 해수
          with: [태민]
          text: "이거 불량이에요?"
      - say:
          char: 태민
          with: [해수]
          text: "…모르겠어요. 사진 칸에 넣을 사진을 못 찾았대요."
      - say:
          char: 태민
          with: [해수]
          text: "가산동 서버실에 있던 거예요. 제 카드는 아직 거기서 먹혀요."
      - clearSticker: { id: keycard, leave: fadeOut }
