          text: "문이 손가락 두 마디쯤 열린다. 안은 어둡고 모니터 불빛만 세 줄이다."
      - effect: heal
      - say:
          char: 상혁
          when: { var: sh_care, op: gte, value: 2 }
          with: [해수]
          delivery: whisper
          text: "…밥 고맙다. 네 차례 아니었잖아. 지난주도 네가 했어."
      - say:
          channel: action
          when: { var: sh_care, op: lt, value: 2 }
