chapterTitle: "고시원 304호"

script:
  - scene: second_interview
  - scene: interview_end
  - scene: forum
  - scene: corridor
  - scene: room
  - scene: dev_talk
  - scene: door
  - scene: leave

scenes:
  second_interview:
    title: "2차 진술"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900, place: "4월 21일 오전 · 중랑경찰서" }
      - music: bleed
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.21 10:15 · 중랑경찰서 · 정해수(31) · 2차 · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물은 그냥 놔 둘게요."
      - say:
          char: 은숙
          with: [해수]
          text: "빌라 현관 영상을 세 번 돌려 봤어요."
      - say:
          char: 은숙
          with: [해수]
          text: "정해수 씨는 그날 밤 11시 전에 들어갔어요. 아침에 쓰레기 내놓으러 나올 때까지 다시 안 잡히고요."
      - say:
          char: 해수
          with: [은숙]
          text: "…네. 맞습니다."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "그럼 정해수 씨가 나갔다고는 제가 못 써요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "복사해 둔 증거가 원본이랑 또 달라졌어요. 그대로인 건 주차 정산 기록 하나예요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "그날 새벽 지하 2층에 들어간 직원 차가 한 대 있어요."
      - say:
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "변상혁 씨. 같이 사시죠."
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "3층 손님 일도 있고요. 오늘 오후에 댁으로 갈 거예요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "접수증, 연필, 전날 창구 앞에 한 시간 서 있던 피해자."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "셋 다 정해수 씨 쪽이에요. 그런데 정해수 씨는 집에 있었고요."
      - say:
          char: 은숙
          with: [해수]
          text: "그날 밤엔 주무셨다고 하셨죠."
      - say:
          char: 해수
          with: [은숙]
          text: "네."
      - say:
          char: 은숙
          with: [해수]
          text: "레플라는 하세요?"
      - say:
          char: 해수
          with: [은숙]
          text: "…체험판만요."
      - say:
          char: 은숙
          with: [해수]
          text: "접속한 시간이 휴대폰에 남는다던데요. 볼 수 있을까요."
      - say:
          channel: action
          with: []
          text: "해수가 휴대폰을 꺼낸다. 잠금을 풀고, 화면이 은숙 쪽을 보게 돌려서 내려놓는다."
      - say:
          channel: record
          with: []
          text: "레플라 접속 기록 · 4/18 01:32–04:12 · 레플라 상봉점 지하 2층 주차장 · 튜토리얼 3/5"
          wait: 850
      - say:
          char: 은숙
          with: [해수]
          text: "…사망 추정이 1시 반에서 2시 반이에요."
      - say:
          channel: action
          with: []
          text: "은숙이 볼펜으로 책상을 한 번 두드린다. 종이는 아직 비어 있다."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙
          with: [해수]
          text: "거기 주차장에서는 뭐 하셨어요?"
      - choice:
          key: t3_tell
          prompt: "녹음기 빨간 불. 은숙이 볼펜 뚜껑을 닫는다."
          char: 해수
          motion: freeze
          options:
            - text: "모른다고 답한다"
              saveText: "\"모르겠습니다. 죄송합니다.\""
              goto: tell_nothing
            - text: "레플라에서 한 일을 털어놓는다"
              saveText: "\"레플라에서 찔렀습니다.\" 그대로 말한다"
              set: { told_truth: true }
              add: { honest: 1 }
              goto: tell_truth
            - text: "상혁이 방에 있었다고 말한다"
              saveText: "\"상혁이는 아니에요. 그날 방에 있었어요.\""
              when: { var: tampered, op: gt, value: 0 }
              add: { sh_care: 1 }
              goto: tell_cover

  tell_nothing:
    actions:
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "모르겠습니다."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "죄송합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "사과하실 건 아니고요."
      - say:
          char: 은숙
          with: [해수]
          text: "두 시간 사십 분이에요. 모르기엔 길어요."
      - emote: { id: 해수, motion: bow }
      - goto: interview_end

  tell_truth:
    actions:
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "튜토리얼 3단계였습니다."
      - say:
          char: 해수
          with: [은숙]
          text: "손에 쥔 물건을 써 보라고 했어요."
      - say:
          char: 해수
          with: [은숙]
          text: "연필이었습니다."
      - say:
          char: 해수
          motion: nod
          with: [은숙]
          text: "C-14 옆에서 찔렀습니다."
      - move: { id: 은숙, toward: 해수, style: retreat }
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "C-14는 어디서 들으셨어요."
      - say:
          char: 해수
          with: [은숙]
          text: "거기 기둥에 써 있었습니다."
          wait: 700
      - say:
          char: 은숙
          with: [해수]
          text: "그런 말씀 하러 오시는 분이 한 달에 열 분쯤 돼요. 대개 술 드시고요."
      - say:
          char: 해수
          with: [은숙]
          text: "저는 술 안 마셔요."
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "알아요. 취하셨다는 얘기는 아니에요."
      - say:
          char: 은숙
          with: [해수]
          text: "딸애가 그걸 해요. 튜토리얼은 다들 넘긴다던데."
      - say:
          char: 해수
          with: [은숙]
          text: "저는 넘기기가 안 떠서요."
      - say:
          channel: record
          with: []
          text: "진술 요지 · 레플라 튜토리얼 3/5에서 연필로 피해자를 찔렀다고 함 · 장소 B2 C-14 · 본인은 그 시간 자택에 있었음"
      - say:
          char: 은숙
          with: [해수]
          text: "일단 말씀하신 대로 적을게요."
      - goto: interview_end

  tell_cover:
    actions:
      - say:
          char: 해수
          with: [은숙]
          text: "상혁이는 아니에요."
      - say:
          char: 해수
          with: [은숙]
          text: "그날 방에 있었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "제가 들었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "웃는 소리."
      - say:
          char: 은숙
          with: [해수]
          text: "제가 여쭌 건 정해수 씨예요."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "민지영 주임님 얘기는 다르던데요."
      - say:
          char: 은숙
          when: { var: sh_night, op: eq, value: true }
          with: [해수]
          text: "정해수 씨가 주임님께 그날 밤엔 방에 없었고 차에 있었다고 하셨다면서요."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "웃는 소리로는 알리바이가 안 돼요. 그래도 적을게요."
      - move: { id: 해수, toward: 은숙, style: flinch }
      - goto: interview_end

  interview_end:
    actions:
      - move: { id: 은숙, style: reset }
      - say:
          char: 은숙
          with: [해수]
          text: "레플라 얘기가 나와서 드리는 말인데요."
      - say:
          char: 은숙
          with: [해수]
          text: "기태민이라는 사람이 있어요. 초기에 그걸 만든 사람 중 하나래요."
      - say:
          char: 은숙
          with: [해수]
          text: "비슷한 일이 터질 때마다 서에 전화해요. 자료 좀 봐 달라고."
      - say:
          char: 은숙
          with: [해수]
          text: "매번 같은 표라서 저도 끝까지는 안 읽었어요."
      - say:
          char: 해수
          with: [은숙]
          text: "…그 사람은 뭐라고 하는데요."
      - say:
          char: 은숙
          with: [해수]
          text: "서버를 다 껐는데 접속자가 그대로래요. 끈 날부터 기록한 표를 계속 보내요."
      - say:
          char: 은숙
          with: [해수]
          text: "이번엔 읽어 보려고요."

  forum:
    title: "주소"
    actions:
      - bg: { id: cs_desk, transition: cut }
      - place: { text: "4월 21일 오후 · 고객센터", presentation: center }
      - char: { id: 해수, position: left, emotion: service }
      - say:
          channel: action
          with: []
          text: "창구에 돌아와 앉자마자 번호표 없이 온 손님이 팔꿈치를 올리고 영수증을 흔든다."
      - say:
          char: 해수.service
          motion: lean_in
          with: []
          text: "번호표 뽑고 기다리세요, 고객님."
      - say:
          channel: action
          with: []
          text: "손님이 번호표 기계를 보고 다시 창구를 본다. 팔꿈치는 그대로다."
      - say:
          char: 해수.service
          with: []
          text: "번호표는 제가 뽑아 드릴게요."
      - say:
          char: 해수.service
          with: []
          text: "052번이세요."
      - say:
          char: 해수.service
          with: []
          text: "지금 기다리는 분 없으니까 바로 불러 드릴게요."
      - say:
          channel: action
          with: []
          text: "띵동 소리가 나고, 해수가 같은 손님을 같은 자리에서 다시 맞는다."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "052번 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "영수증 확인해 드릴게요."
      - say:
          channel: thought
          with: []
          text: "이 절차를 건너뛰면 그날치 접수 건수가 안 맞는다. 안 맞으면 월말에 내가 설명해야 한다."
      - say:
          channel: action
          with: []
          text: "환불을 마치고 영수증을 돌려준다. 손님이 떠나자 휴대폰을 꺼낸다. 매장 지원을 나간 지영에게 톡을 보낸다."
      - say:
          channel: message
          thread: "지영"
          side: me
          char: 해수
          with: []
          text: "주임님 혹시 기태민이라는 사람 아세요?"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "레플라 갤 고닉. 왜"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "서버 없이 돌아간다고 글 쓰다가 영구 차단당한 사람"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "망우동 그린고시원 304호. 갤에 자기 주소를 올렸었어 와서 확인하라고"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "가지 마"
      - say:
          channel: message
          thread: "지영"
          side: me
          char: 해수
          with: []
          text: "네 감사합니다 주임님"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "가지 말라니까"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "해수야"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "내가 체험권 준 거 때문이면 그거 내가 미안해"
      - say:
          channel: message
          thread: "지영"
          side: me
          char: 해수
          with: []
          text: "아니에요 주임님"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "내일은 마감으로 와 내가 오픈할게 잠 좀 자"
      - say:
          channel: message
          thread: "지영"
          side: me
          char: 해수
          with: []
          text: "…감사합니다 주임님"

  corridor:
    title: "그린고시원"
    actions:
      - bg: { id: goshiwon, transition: fade, duration: 900 }
      - place: { text: "4월 21일 밤 9:00 · 망우동 그린고시원 304호", presentation: center }
      - char: { id: 태민, position: right }
      - char: { id: 해수, position: left }
      - move: { id: 태민, toward: 해수, style: retreat }
      - say:
          char: 태민
          speakerName: "문 안의 남자"
          with: [해수]
          text: "경찰이에요?"
      - say:
          char: 해수
          motion: bow
          with: [태민]
          text: "아니요. 그린마트에서 일하는 정해수입니다. 기태민 씨 맞으세요?"
      - say:
          char: 태민
          speakerName: "문 안의 남자"
          motion: sway
          with: [해수]
          text: "…기태민 맞는데, 마트에서 왜 왔어요?"
      - wait: 600
      - say:
          char: 해수
          with: [태민]
          text: "죄송합니다."
      - say:
          char: 해수
          with: [태민]
          text: "회사에서 보낸 건 아니에요. 제가 물어볼 게 있어서요."
      - say:
          char: 태민
          with: [해수]
          text: "몇 단계예요."
      - say:
          char: 해수
          with: [태민]
          text: "네?"
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "튜토리얼. 여기 오는 사람은 다 그거 물어보러 와요."
      - say:
          char: 태민
          motion: laugh
          with: [해수]
          text: "대개 2단계에서 와요. 소리 좀 질러 보고 겁나서."
      - say:
          char: 해수
          when: { var: tampered, op: gt, value: 0 }
          with: [태민]
          text: "4단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "3단계 했습니다."
      - say:
          char: 해수
          when: { var: tampered, op: eq, value: 0 }
          with: [태민]
          text: "4단계는 들어가기만 했습니다."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "……들어와요. 신발은 신고."
      - say:
          char: 태민.afraid
          with: [해수]
          text: "컵라면 용기는 밟지 말고."
      - say:
          channel: action
          with: []
          text: "창이 없다."
      - say:
          channel: action
          with: []
          text: "벽에 날짜만 다른 같은 표가 붙어 있다. 해수가 가까이 가자 태민이 허리를 펴다 말고 목 뒤를 문지른다."
      - say:
          char: 해수
          with: [태민]
          text: "이거 다 같은 거 아니에요?"
      - say:
          char: 태민
          with: [해수]
          text: "같아요. 그게 이상한 거예요."
      - say:
          char: 태민
          with: [해수]
          text: "1년 반 동안 숫자가 그대로예요. 말이 안 되잖아요."
      - say:
          char: 태민
          with: [해수]
          text: "매주 월요일에 뽑아요."
      - say:
          char: 태민
          with: [해수]
          text: "같은 조건이어야 하니까."
      - say:
          char: 해수
          with: [태민]
          text: "일흔일곱 장이네요."
      - say:
          char: 태민
          motion: startle
          with: [해수]
          text: "…세셨어요?"
      - say:
          char: 해수
          motion: bow
          with: [태민]
          text: "죄송합니다. 버릇이라."
      - say:
          char: 해수
          with: [태민]
          text: "이걸 누구한테 보여 주시는데요."
      - say:
          char: 태민
          with: [해수]
          text: "…경찰서요. 처음엔 보여 줬어요."
      - say:
          char: 태민
          with: [해수]
          text: "지금은 안 받아 줘요."
      - say:
