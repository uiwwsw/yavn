      - wait: 0
      - wait: 0
      - say:
          char: 해수
          with: []
          text: "문은 좀 열어."
      - say:
          channel: action
          with: []
          text: "문 안쪽에서 의자가 끌리는 소리가 난다. 그게 전부다. 문은 안 열린다."
