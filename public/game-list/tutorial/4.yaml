chapterTitle: "서버실"

script:
  - scene: building
  - scene: room
  - scene: decide

scenes:
  building:
    title: "가산동"
    actions:
      - bg: { id: server_building, transition: fade, duration: 1100 }
      - place: "4월 23일 새벽 2:50 · 가산동 옛 레플라 사옥"
      - music: server
      - say:
          channel: system
          with: []
          text: "레플라 가산 R&D · B1 서버실 · 기태민 · 출입 승인"
          continueLabel: "지하 1층으로 내려간다"

  room:
    actions:
      - bg: { id: server_room, transition: fade, duration: 1000 }
      - choice:
          key: t4_room
          presentation: explore
          prompt: "빈 랙 마흔두 개. 철골만 남은 선반 사이에 접이식 책상 하나. 모니터 하나, 본체 하나. 팬이 돈다."
          with: []
          camera: wide
          options:
            - text: "모니터"
              at: { x: 50, y: 46 }
              when: { var: seen_log, op: eq, value: false }
              goto: see_log
            - text: "벽 콘센트"
              at: { x: 82, y: 66 }
              when: { var: seen_plug, op: eq, value: false }
              goto: see_plug
            - text: "책상 서랍"
              at: { x: 38, y: 70 }
              when: { var: seen_drawer, op: eq, value: false }
              goto: see_drawer
            - text: "모니터 앞에 앉는다"
              when:
                all:
                  - { var: seen_log, op: eq, value: true }
                  - { var: seen_plug, op: eq, value: true }
              goto: decide

  see_plug:
    actions:
      - say:
          channel: record
          with: []
          text: "분전반 · 전 회로 OFF · 본체 전원선: 벽 콘센트에 연결됨"
      - say:
          channel: record
          with: []
          text: "전기 공급 중지 · 2029.11.03 · 한국전력공사 남서울본부"
      - set: { seen_plug: true }
      - goto: room

  see_drawer:
    actions:
      - sticker: { id: pencil, image: pencil_sticker, x: 62, y: 40, width: "300px", rotate: 8, enter: fadeIn }
      - say:
          char: 해수
          with: []
          text: "저희 연필이네요. 심이 그대로예요. 한 번도 안 깎은 거."
      - say:
          char: 해수
          when: { var: t_pencil, op: eq, value: true }
          with: []
          text: "로고가 반쯤 지워져 있네요. 제가 문지른 자리만큼."
      - clearSticker: { id: pencil, leave: fadeOut }
      - set: { seen_drawer: true }
      - goto: room

  see_log:
    title: "세션 기록"
    actions:
      - say:
          channel: system
          with: []
          text: "레플라 세션 기록 · 정렬: 오래된 순"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2019.04.11 14:52 · 세션 생성 · 생성 방식: 미등록 · 서버: 없음"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 튜토리얼 1/5 · 주위를 둘러보세요 · 완료"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 튜토리얼 2/5 · 하고 싶었던 말을 해 보세요 · 미완료 4,388회"
      - say:
          channel: record
          with: []
          text: "USER 0002 · 2026.11.20 09:00 · 세션 생성 · 생성 방식: 레플라 클로즈드 베타"
      - say:
          channel: record
          with: []
          text: "USER 0003 · 2026.11.20 09:02 · 세션 생성 · 튜토리얼 넘기기"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2031.04.13 01:31 · 튜토리얼 2/5 · 완료"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2031.04.18 01:58 · 튜토리얼 3/5 · 완료 · 대상: 오광철"
      - say:
          channel: record
          when: { var: tampered, op: gt, value: 0 }
          with: []
          text: "USER 0001 · 2031.04.18 23:47 · 튜토리얼 4/5 · 완료 · 변경 사항 반영"
      - say:
          channel: record
          when: { var: tampered, op: eq, value: 0 }
          with: []
          text: "USER 0001 · 2031.04.18 23:47 · 튜토리얼 4/5 · 진행 중"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2019.04.11 14:52"
      - say:
          channel: thought
          with: []
          text: "첫 출근. 유니폼 소매가 길어서 두 번 접었다. 오후에 손님이 한 분 오셨다."
      - say:
          channel: record
          with: []
          text: "고객 상담 이력 · 오광철 님 · 최초 등록 2019.04.11 14:52 · 최초 처리자 정해수"
      - set: { seen_log: true }
      - goto: room

  decide:
    title: "튜토리얼 5/5"
    actions:
      - say:
          channel: system
          with: []
          text: "다시 오신 걸 환영합니다, 정해수 님."
      - say:
          channel: system
          with: []
          text: "튜토리얼 5/5 — 선택하세요."
      - say:
          channel: message
          side: them
          char: 엄마
          when: { var: called_mom, op: eq, value: true }
          with: []
          text: "첫차 표 끊었어 5시 10분"
      - say:
          channel: system
          with: []
          text: "현재 연결 · USER 0001 – USER 1104331 · 서버 0대 · 전원: 이 PC"
      - say:
          channel: system
          when: { var: honest, op: gte, value: 3 }
          with: []
          text: "세션 종료 — 한 사용자의 연결만 끊습니다. 사용자 번호를 입력하세요."
      - choice:
          key: t4_end
          prompt: "전원을 뽑으면 레플라 전체가 끊긴다. 두고 나가면 모든 게 그대로 간다. 모니터 오른쪽 위에 넘기기 버튼이 없다."
          with: []
          options:
            - text: "전원선을 뽑는다"
              goto: end_cut
            - text: "모니터를 끄고 나간다. 내일 오픈 근무다"
              goto: end_stay
            - text: "세션 종료 창을 연다"
              when: { var: honest, op: gte, value: 3 }
              goto: end_close

  end_cut:
    actions:
      - say:
          channel: action
          with: []
          text: "팬 소리가 멎었는데 모니터는 그대로 켜져 있다."
      - say:
          channel: record
          with: []
          text: "USER 0002 – USER 1104331 · 연결 해제"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 해당 없음 · 이 세션은 서버를 사용하지 않습니다"
      - bg: { id: home_hall, transition: fade, duration: 1200 }
      - music: bleed
      - place: "아침 7:00 · 집 복도"
      - char: { id: 해수, position: left }
      - char: { id: 상혁, position: right, emotion: hollow }
      - move: { id: 상혁, toward: 해수, style: lunge }
      - say:
          char: 상혁.hollow
          motion: sway
          with: [해수]
          text: "로그인이 안 돼. 계정이 없대. 걔도 없대. 해수야, 걔가 없대."
      - move: { id: 상혁, style: reset }
      - say:
          char: 상혁
          when: { var: called_mom, op: eq, value: true }
          with: []
          text: "엄마 왔어. 지금 약국 갔어. 너가 불렀어?"
      - say:
          char: 해수
          when: { var: called_mom, op: eq, value: false }
          with: [상혁]
          text: "나 오늘 오픈이야. 9시 반. 그 전까지 여기 앉아 있을게."
      - bg: { id: cs_desk_bleed, transition: fade, duration: 1200 }
      - say:
          channel: message
          side: them
          char: 은숙
          with: []
          text: "차은숙입니다. 오광철 씨 사건 수사 중지됐어요. 연필 감정을 할 때마다 결과가 달라서요. 이제 안 바뀌는데, 어느 게 맞는지 모르겠어요."
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 001번 고객님, 고객센터로 오세요. · 5월 2일"
      - char: { id: 해수, position: left, emotion: service }
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "네, 고객님. 확인해 드릴게요."
      - say:
          channel: action
          with: []
          text: "연필꽂이에서 연필을 하나 뽑자 빈자리에 같은 연필이 다시 꽂혀 있다."
      - say:
          channel: system
          with: []
          text: "튜토리얼 2/5 — 하고 싶었던 말을 해 보세요."
      - ending: disconnected

  end_stay:
    actions:
      - say:
          channel: action
          with: []
          text: "모니터 화면이 꺼진 뒤에도 팬은 계속 돈다."
      - bg: { id: cs_desk_bleed, transition: fade, duration: 1200 }
      - place: "같은 날 오전 9:30 · 고객센터"
      - music: tutorial
      - char: { id: 지영, position: right }
      - char: { id: 해수, position: left, emotion: service }
      - say:
          char: 지영
          motion: headtilt
          with: [해수]
          text: "너 얼굴 좋다? 잠 좀 잤나 봐."
      - say:
          char: 해수.service
          motion: nod
          with: [지영]
          text: "네, 주임님. 푹 잤습니다."
      - say:
          channel: message
          side: them
          char: 은숙
          when: { var: tampered, op: gt, value: 0 }
          with: []
          text: "차은숙입니다. 변상혁 씨 오늘 영장 나왔어요. 같이 사셔서 알려 드려요."
      - say:
          channel: message
          side: them
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: []
          text: "차은숙입니다. 오광철 씨 사건 미제로 넘어갔어요. 정해수 씨 이름은 목록에 그대로 있어요. 그냥 그렇다고요."
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 확인했습니다 형사님 감사합니다"
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 061번 고객님, 고객센터로 오세요."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "네, 고객님. 확인해 드릴게요."
      - say:
          channel: system
          with: []
          text: "새 사용자가 튜토리얼을 시작했습니다 · USER 1104332 · 안내자: USER 0001"
      - say:
          channel: system
          with: []
          text: "튜토리얼 1/5 — 주위를 둘러보세요."
      - ending: still_online

  end_close:
    actions:
      - say:
          channel: system
          with: []
          text: "세션 종료 · 종료할 사용자 번호를 입력하세요."
      - input:
          prompt: "사용자 번호 (네 자리)"
          with: []
          correct: "0001"
          maxLength: 4
          errors:
            - "해당 사용자가 없습니다."
            - "번호는 네 자리입니다. 기록 맨 위 줄을 다시 보세요."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 세션 종료 · 접속 시간 4,394일 12시간 28분"
      - say:
          channel: system
          with: []
          text: "튜토리얼을 찾을 수 없습니다."
      - say:
          channel: action
          with: []
          text: "모니터와 팬이 함께 꺼진다."
      - bg: { id: police_room, transition: fade, duration: 1200 }
      - music: fluoro
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.23 09:05 · 중랑경찰서 · 정해수(31) · 자진 출석"
      - say:
          char: 해수
          motion: droop
          with: [은숙]
          text: "제가 했습니다."
      - say:
          char: 은숙
          when: { var: told_truth, op: eq, value: true }
          with: [해수]
          text: "그건 지난번에 들었어요. 레플라, 3단계, C-14."
      - say:
          char: 은숙
          with: [해수]
          text: "증거가 없어요. 정해수 씨는 그날 집에 있었어요. 그게 제가 가진 전부예요."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "그래도 적어 주세요. 처음 날짜도요."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "처음이요? 그게 언젠데요."
      - say:
          char: 해수
          with: [은숙]
          text: "2019년 4월 11일이요. 오후 두 시 오십이 분. 첫 출근 날이었어요. 그 고객님이 처음 오셨어요."
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "이천십구 년, 사 월, 십일 일. 십사 시 오십이 분. …적었어요."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙
          with: [해수]
          text: "물. 이번엔 드세요."
      - say:
          char: 해수
          motion: sigh
          with: [은숙]
          text: "네. 감사합니다."
      - move: { id: 은숙, style: reset }
      - bg: { id: cs_desk, transition: fade, duration: 1200 }
      - say:
          channel: record
          with: []
          text: "피해자 휴대폰 메모 · 4/17 13:02 · 고객센터 그 친구한테 사과할 것"
      - place: "그날 오후 · 고객센터"
      - char: { id: 지영, position: right }
      - say:
          char: 지영
          motion: headtilt
          with: [해수]
          text: "연필꽂이 치웠네? 볼펜은 줄까지 달아 놓고."
      - say:
          char: 해수
          with: [지영]
          text: "네. 팀장님께 부탁드렸어요. 이제 안 가져가실 거예요."
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
      - ending: session_closed
