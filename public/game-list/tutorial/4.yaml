chapterTitle: "서버실"

script:
  - scene: building

scenes:
  building:
    title: "가산동"
    actions:
      - bg: { id: server_building, transition: fade, duration: 1100 }
      - place: { text: "4월 23일 새벽 2:50 · 가산동 옛 레플라 사옥", presentation: center }
      - music: server
      - say:
          channel: action
          with: []
          text: "1층 로비에 안내 데스크가 있었던 자리만 바닥 색이 다르다. 유리문은 손으로 밀면 열린다."
      - say:
          channel: message
          thread: "태민"
          side: me
          char: 해수
          with: []
          text: "도착했습니다 1층 유리문은 열려 있네요"
      - say:
          channel: message
          thread: "태민"
          side: them
          char: 태민
          with: []
          text: "같이 못 가서 미안해요. 카드 찍으면 제 이름으로 기록이 남을 거예요"
      - say:
          channel: message
          thread: "태민"
          side: them
          char: 태민
          with: []
          text: "제 카드로는 지하 1층만 갈 수 있어요"
      - say:
          channel: message
          thread: "태민"
          side: me
          char: 해수
          with: []
          text: "네 감사합니다 다녀와서 연락드릴게요"
      - say:
          channel: message
          thread: "태민"
          side: them
          char: 태민
          with: []
          text: "정해수 씨"
      - say:
          channel: message
          thread: "태민"
          side: them
          char: 태민
          with: []
          text: "그래프에서 선 밖에 있던 세션 번호가 0001이에요. PC가 켜져 있으면 그 번호부터 확인해 봐요"
      - say:
          channel: thought
          when: { var: seen_graph, op: eq, value: true }
          text: "그래프에 서버가 끊긴 날이 표시돼 있었다. 맨 왼쪽에만 선에 닿지 않은 점이 있었다."
      - say:
          channel: thought
          when: { var: seen_graph, op: eq, value: false }
          text: "태민 씨가 선 밖에 점이 하나 있다고 했다. 이 컴퓨터에도 그 번호가 뜨는지 보자."
      - say:
          channel: action
          with: []
          text: "엘리베이터의 광고 액자에는 종이 한 장 없다. 텅 빈 액자 유리에 얼굴이 비친다."
      - say:
          channel: thought
          with: []
          text: "유니폼에서 명찰을 떼 주머니에 넣는다. 태민 씨가 답장을 보내고 있다. 내가 나올 때까지 안 잘 모양이다."
      - say:
          channel: system
          with: []
          text: "레플라 가산 R&D · B1 서버실 · 기태민 · 출입 승인"
          continueLabel: "지하 1층으로 내려간다"
          at: { x: 54, y: 47 }
      - goto: room

  room:
    actions:
      - bg: { id: server_room, transition: fade, duration: 1000 }
      - say:
          channel: action
          with: []
          text: "출입 승인등이 초록색으로 바뀌고, 지하 서버실 문틈으로 더운 바람이 발목에 닿는다. 로비는 입김이 날 만큼 추웠다."
      - goto: room_look

  room_look:
    actions:
      - choice:
          key: t4_room
          presentation: explore
          prompt: "빈 서버 랙이 마흔두 개다. 그 사이 접이식 책상 아래에서 PC의 팬이 돈다."
          with: []
          camera: wide
          options:
            - text: "모니터"
              at: { x: 50, y: 46 }
              when: { var: seen_log, op: eq, value: false }
              goto: see_log
            - text: "벽 콘센트"
              at: { x: 82, y: 66 }
              when: { var: seen_plug, op: eq, value: false }
              goto: see_plug
            - text: "책상 서랍"
              at: { x: 38, y: 70 }
              when: { var: seen_drawer, op: eq, value: false }
              goto: see_drawer
            - text: "모니터 앞에 앉는다"
              when:
                all:
                  - { var: seen_log, op: eq, value: true }
                  - { var: seen_plug, op: eq, value: true }
              goto: decide

  see_plug:
    actions:
      - say:
          channel: action
          with: []
          text: "전원선 끝이 벽 콘센트에 꽂혀 있다. 불이 들어온 다른 기기는 없다."
      - say:
          channel: record
          with: []
          text: "분전반 · 전 회로 OFF · 본체 전원선: 벽 콘센트에 연결됨"
      - say:
          channel: record
          with: []
          text: "전기 공급 중지 · 2029.11.03 · 한국전력공사 남서울본부"
      - say:
          channel: thought
          with: []
          text: "1년 반 전에 끊었다. 그런데 팬이 돈다."
      - say:
          channel: action
          with: []
          text: "팬 소리가 날 때마다 전원선이 아주 조금 떨린다. 벽에 붙인 점검표에는 ‘전기 끊김’이라고 적혀 있다."
      - say:
          char: 해수.blank
          with: []
          text: "…이러면 안 되는 건데."
      - say:
          channel: thought
          with: []
          text: "포스기가 죽으면 저런 소리부터 멎는다. 여기선 팬이 더 빨리 돈다."
      - set: { seen_plug: true }
      - goto: room_look

  see_drawer:
    actions:
      - say:
          channel: action
          with: []
          text: "서랍은 손잡이가 없어서 홈에 손가락을 넣어 당긴다. 안에 연필 하나가 굴러다닌다."
      - sticker: { id: pencil, image: pencil_sticker, x: 62, y: 40, width: "300px", rotate: 8, enter: fadeIn }
      - say:
          char: 해수
          with: []
          text: "저희 연필이네요."
      - say:
          char: 해수
          with: []
          text: "심이 그대로예요."
      - say:
          char: 해수
          with: []
          text: "한 번도 안 깎은 거."
      - say:
          char: 해수
          when: { var: t_pencil, op: eq, value: true }
          with: []
          text: "로고가 반쯤 지워져 있네요."
      - say:
          channel: thought
          when: { var: t_pencil, op: eq, value: true }
          text: "그날 밤 레플라에서 문지른 게 여기 서랍에 있다. 이 건물엔 오늘 처음 왔다."
      - say:
          channel: thought
          when: { var: t_pencil, op: eq, value: false }
          text: "스무 자루 전부 심이 그대로였다. 아무도 쓰지 않는데 매주 스무 자루가 들어온다."
      - say:
          channel: action
          with: []
          text: "해수는 연필을 제자리에 놓고 서랍을 닫는다. 닫히기 전에 다시 열어 각을 맞춘다."
      - say:
          channel: thought
          with: []
          text: "늘 창구에서 하던 대로 로고를 바깥으로 돌려 놓았다."
      - clearSticker: { id: pencil, leave: fadeOut }
      - set: { seen_drawer: true }
      - goto: room_look

  see_log:
    title: "세션 기록"
    actions:
      - say:
          channel: action
          with: []
          text: "모니터에는 창 하나만 띄워져 있다. 마우스를 건드리자 절전이 풀린다. 로그인 화면이 없다."
      - say:
          channel: system
          with: []
          text: "레플라 세션 기록 · 정렬: 오래된 순"
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2019.04.11 14:52 · 세션 생성 · 생성 방식: 미등록 · 서버: 없음"
      - say:
          channel: thought
          with: []
          text: "바로 아래 세션에는 가입 경로가 있는데 맨 위 0001만 미등록이다."
      - say:
          channel: record
          with: []
          text: "USER 0002 · 2026.11.20 09:00 · 세션 생성 · 생성 방식: 레플라 클로즈드 베타"
      - say:
          channel: record
          with: []
          text: "USER 0003 · 2026.11.20 09:02 · 세션 생성 · 튜토리얼 넘기기"
      - say:
          channel: thought
          with: []
          text: "0002는 베타 가입, 0003은 튜토리얼 넘기기. 그보다 훨씬 위의 0001 날짜를 읽자 첫 출근 날이 생각난다."
      - goto: log_steps

  log_steps:
    actions:
      - say:
          channel: action
          with: []
          text: "해수는 0001 줄을 눌러 본다. 아래로 항목이 펼쳐진다. 다섯 개다."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 튜토리얼 1/5 · 주위를 둘러보세요 · 완료"
      - say:
          channel: record
          when: { var: look_ticket, op: eq, value: true }
          with: []
          text: "└ 확인한 항목 · 번호표 발급기 · 2031.04.13 00:56"
      - say:
          channel: record
          when: { var: look_pencil, op: eq, value: true }
          with: []
          text: "└ 확인한 항목 · 연필꽂이 (비품) · 2031.04.13 00:56"
      - wait: 0
      - wait: 0
      - say:
          channel: record
          with: []
          text: "USER 0001 · 튜토리얼 2/5 · 하고 싶었던 말을 해 보세요 · 미완료 4,388회"
      - wait: 0
      - say:
          channel: thought
          with: []
          text: "광철이 돌아간 뒤 빈 창구를 닦다가 혼자 입을 달싹인 날들이 있었다. 그것도 세고 있었나."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2031.04.13 01:31 · 튜토리얼 2/5 · 완료"
      - say:
          channel: record
          when: { var: tried_polite, op: eq, value: true }
          with: []
          text: "└ 발화 · \"네, 고객님. 영수증 확인해 드릴게요.\" · 음량 보통 · 다시 하기 1회"
      - say:
          channel: record
          when: { var: rage, op: eq, value: 1 }
          with: []
          text: "└ 발화 · 음량 초과 · 주변 좌석 3석에서 돌아봄"
      - say:
          channel: record
          when: { var: rage, op: gte, value: 2 }
          with: []
          text: "└ 발화 · 음량 초과 · 대상의 식사량 언급 · 주변 좌석 7석에서 돌아봄"
      - say:
          channel: thought
          when: { var: tried_polite, op: eq, value: true }
          text: "영수증을 달라고 했을 때는 다시 하라고 떴다. 그 문장도 실패 횟수에 들어갔나 보다."
      - say:
          channel: thought
          when: { var: rage, op: gte, value: 2 }
          text: "그날 한 말을 다 기억한다. 음량까지 적어 둘 줄은 몰랐다."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2031.04.18 01:58 · 튜토리얼 3/5 · 완료 · 대상: 오광철"
          wait: 850
      - say:
          channel: record
          when: { var: hesitated, op: eq, value: true }
          with: []
          text: "└ 시도 1 · 중단 (거리 3 → 0) · 소요 41초"
      - say:
          channel: record
          when: { var: logged_out, op: eq, value: true }
          with: []
          text: "└ 세션 일시 이탈 · 11초 · 복귀 후 재시도"
      - say:
          channel: thought
          when: { var: hesitated, op: eq, value: true }
          text: "41초. 숫자를 읽자 손바닥에 다시 그 연필이 닿는 것 같다."
      - say:
          channel: thought
          when: { var: hesitated, op: eq, value: false }
          text: "시작과 완료 사이에 중단 기록이 없다. 그날 한 번에 끝냈다."
      - goto: log_steps_two

  log_steps_two:
    actions:
      - say:
          channel: record
          when: { var: tampered, op: gt, value: 0 }
          with: []
          text: "USER 0001 · 2031.04.18 23:47 · 튜토리얼 4/5 · 완료 · 변경 사항 반영"
      - say:
          channel: record
          when: { var: t_form, op: eq, value: true }
          with: []
          text: "└ 수정 · 고객의 소리 용지 1부"
      - say:
          channel: record
          when: { var: t_pencil, op: eq, value: true }
          with: []
          text: "└ 수정 · 비품 연필 1자루 (표면)"
      - say:
          channel: record
          when: { var: t_cctv, op: eq, value: true }
          with: []
          text: "└ 수정 · B2-C 녹화 구간 00:12"
      - say:
          channel: thought
          when: { var: tampered, op: gte, value: 2 }
          text: "두 개 이상 손댔다. 뭘 먼저 눌렀는지까지 여기에 남아 있다."
      - say:
          channel: thought
          when: { var: tampered, op: eq, value: 1 }
          text: "하나만 손댔다. 하나면 모를 거라고 생각했다."
      - say:
          channel: record
          when: { var: tampered, op: eq, value: 0 }
          with: []
          text: "USER 0001 · 2031.04.18 23:47 · 튜토리얼 4/5 · 진행 중"
      - say:
          channel: thought
          when: { var: tampered, op: eq, value: 0 }
          text: "진행 중. 아무것도 안 고쳤으니 안 끝난 거다. 나흘째 진행 중이다."
      - say:
          channel: record
          when: { var: doubt, op: gte, value: 1 }
          with: []
          text: "└ 참고 · 외부 진술 1건 · 위치 불일치 (형사 차은숙)"
      - say:
          channel: record
          when: { var: told_truth, op: eq, value: true }
          with: []
          text: "└ 참고 · 외부 진술 1건 · 자진 진술 (형사 차은숙) · 미채택"
      - say:
          channel: thought
          when: { var: told_truth, op: eq, value: true }
          text: "미채택. 다 말했는데 받아 주지 않았다. 여기서는 그걸 한 줄로 적어 놓는다."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 튜토리얼 5/5 · 대기"
      - say:
          char: 해수.shaken
          motion: freeze
          with: []
          text: "…다섯 개네."
      - goto: log_me

  log_me:
    actions:
      - say:
          channel: action
          with: []
          text: "해수는 스크롤을 맨 위로 올린다. 날짜 하나를 다시 읽는다."
      - say:
          channel: record
          with: []
          text: "USER 0001 · 2019.04.11 14:52"
      - say:
          channel: thought
          with: []
          text: "첫 출근. 유니폼 소매가 길어서 두 번 접었다. 오후에 손님이 한 분 오셨다."
      - say:
          channel: action
          with: []
          text: "옆 창에서 사내 상담 이력을 열어 오광철을 검색한다. 한 줄이 뜬다."
      - say:
          channel: record
          with: []
          text: "고객 상담 이력 · 오광철 님 · 최초 등록 2019.04.11 14:52 · 최초 처리자 정해수"
      - effect: focus
      - say:
          char: 해수
          with: []
          delivery: whisper
          text: "…제가 0001이네요."
          wait: 1100
      - say:
          channel: system
          with: []
          text: "튜토리얼 1/5 — 주위를 둘러보세요 · 완료"
      - say:
          char: 해수.shaken
          motion: recoil
          with: []
          text: "…아니요."
      - say:
          char: 해수.shaken
          motion: recoil
          with: []
          text: "그건 그냥 둘러본 거예요."
      - say:
          channel: thought
          with: []
          text: "첫 출근 날부터 오늘까지 내 이름 아래 남은 항목이 다섯 개다."
      - say:
          channel: thought
          when: { var: knocked, op: eq, value: true }
          text: "상혁이 방문은 두드렸다. 두드린 건 어디에도 없다."
      - say:
          channel: thought
          when: { var: paid_diff, op: eq, value: true }
          text: "포스기에 안 찍히는 차액은 내 지갑에서 냈다. 그것도 없다."
      - say:
          channel: thought
          when: { var: took_coupon, op: eq, value: true }
          text: "체험권은 주머니에 넣었다. 그건 적어 둘 줄 알았는데 그것도 없다."
      - say:
          channel: thought
          when: { var: sh_care, op: gte, value: 3 }
          text: "상혁이 문 앞에 물 두 병 둔 건 어디에 적어야 하지."
      - set: { seen_log: true }
      - goto: room_look

  decide:
    title: "튜토리얼 5/5"
    actions:
      - say:
          channel: action
          with: []
          text: "접이식 의자를 펴고 앉는다. 모니터 받침을 고칠 필요가 없다."
      - say:
          channel: system
          with: []
          text: "다시 오신 걸 환영합니다, 정해수 님."
          wait: 850
      - wait: 0
      - say:
          channel: system
          with: []
          text: "튜토리얼 5/5 — 선택하세요."
      - wait: 0
      - say:
          channel: system
          with: []
          text: "이 단계는 건너뛸 수 없습니다."
      - say:
          channel: thought
          with: []
          text: "0003 옆에는 ‘튜토리얼 넘기기’라고 써 있었다."
      - say:
          channel: message
          thread: "상혁 어머니"
          side: them
          char: 엄마
          when: { var: called_mom, op: eq, value: true }
          with: []
          text: "첫차 표 끊었어 5시 10분"
      - say:
          channel: message
          thread: "상혁 어머니"
          side: them
          char: 엄마
          when: { var: called_mom, op: eq, value: true }
          with: []
          text: "역에서 택시 타고 갈게 상혁이한테는 말 안 했어"
      - say:
          channel: thought
          when: { var: called_mom, op: eq, value: true }
          text: "5시 10분 첫차면 내가 돌아와 있을 때 어머님이 오겠네."
      - say:
          channel: thought
          when: { var: called_mom, op: eq, value: false }
          text: "상혁이 방문 앞에서 어머님께 전화하려다 말았다. 지금 전화해도 받으실까."
      - say:
          channel: system
          with: []
