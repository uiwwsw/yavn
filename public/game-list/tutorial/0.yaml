  home:
    title: "우편함"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
      - place: { text: "밤 10:40 · 상봉동 빌라", presentation: center }
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…응. 나도. 아니, 진짜로. 너밖에 없어."
          wait: 750
      - sticker: { id: bill, image: bill_sticker, x: 64, y: 36, width: "280px", rotate: 3, enter: slideDown }
      - say:
          channel: record
          with: []
          text: "봉투 창에 비친 요금 안내 · 변상혁 님 · 4월 청구 409,000원 (무제한 219,000원 + 프라이빗 확장팩 190,000원) · 3월분 미납"
      - choice:
          key: t0_mail
          prompt: "신발장 위에 뜯지 않은 지난달 봉투가 하나 더 있다."
          char: 해수
          options:
            - text: "봉투를 상혁의 방문 밑에 넣는다"
              saveText: "상혁이 방문 밑으로 밀어 넣는다"
              goto: mail_door
            - text: "문을 두드려 우편이 왔다고 알린다"
              saveText: "\"상혁아, 우편 왔어.\" 문을 두 번 두드린다"
              set: { knocked: true }
              add: { sh_care: 1 }
              goto: mail_knock

  mail_door:
    actions:
      - clearSticker: { id: bill, leave: fadeOut }
      - say:
          char: 해수
          with: []
          text: "상혁아, 나 들어왔어."
      - say:
          char: 해수
          with: []
          text: "현관 불 켜 놓고 자지 마."
      - say:
          channel: action
          with: []
          text: "해수는 신발장에 있던 지난달 봉투까지 포개어 상혁의 방문 밑으로 밀어 넣는다."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "잠깐만. 누구 왔나 봐. …아니야, 아무도. 계속해."
      - goto: room

  mail_knock:
    actions:
      - clearSticker: { id: bill, leave: fadeOut }
      - say:
          char: 해수
          with: []
          sound: door_knock
          text: "상혁아, 우편 왔어."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…아, 해수야? 고마워. 거기 놔 줘. 내일 볼게."
      - say:
          char: 해수
          with: []
          text: "상혁아. 밥은 먹었어?"
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "먹었어."
      - say:
          char: 해수
          with: []
          text: "뭐 먹었는데."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…먹었다니까."
      - say:
          char: 해수
          with: []
          text: "라면 물 올려놓을게."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "안 먹어."
      - say:
          char: 해수
          with: []
          text: "그럼 불 끌게."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…끓여 놔. 계란은 두 개."
      - say:
          char: 해수
          with: []
          text: "하나야. 어제 네가 두 개 먹었어."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "해수. 내 친구. 같이 살아. …응, 인사해."
      - goto: room

  room:
