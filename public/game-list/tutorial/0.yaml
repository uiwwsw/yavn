chapterTitle: "근무표"

script:
  - scene: chat
  - scene: counter
  - scene: coupon
  - scene: ticket
  - scene: lunch
  - scene: home
  - scene: room

scenes:
  chat:
    title: "단톡방"
    actions:
      - bg: { id: home_hall, transition: cut }
      - place: "2031년 4월 11일 금요일 · 상봉동"
      - music: fluoro
      - say:
          channel: system
          with: []
          text: "레플라 REPLA — 지금 사는 도시를 하나 더. 거리도, 가게도, 사람도 그대로입니다. 귀 뒤에 밴드를 붙이고 앉으면 바로 그곳입니다."
      - say:
          channel: system
          with: []
          text: "어제 거기 둔 물건은 오늘도 거기 있습니다. · 라이트 월 39,000원 · 지금 접속 중 1,104,331명"
      - say:
          channel: system
          with: []
          text: "상봉점 고객센터 (3) · 2031년 4월 11일 금요일 오전 8:12"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수야 혹시 오늘 마감 나랑 바꿔 줄 수 있어?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "레플라 점검이 7시에 끝나는데 끝나자마자 들어가야 대기 안 걸려ㅠ"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 저번 주에도 마감 바꿔 달라고 하셨잖아요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "저번 주는 윤 주임한테 물어봤고 걔는 안 바꿔 줬어"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수는 어차피 퇴근하고 할 것도 없잖아 레플라도 안 하고"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "형 오늘 오전 아니에요? 아까 창고에서 봤는데요"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "오전인데 괜찮습니다"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "봐 괜찮대"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 바꿔 드릴게요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "역시ㅠㅠ 커피 살게"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "괜찮습니다 주임님"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "괜찮다고 하면 진짜 안 사는 수가 있어"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "그럼 아이스로 부탁드립니다"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "ㅋㅋㅋㅋㅋ"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "저도요"
      - say:
          channel: system
          with: []
          text: "근무표가 변경되었습니다 · 4월 11일(금) 정해수 11:00–22:00 마감"
      - say:
          channel: record
          with: []
          text: "메모 · 4월 4일 휴지 · 4월 11일 우유"

  counter:
    title: "고객센터"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 700 }
      - place: "그린마트 상봉점 · 1층 고객센터"
      - say:
          channel: system
          with: []
          text: "레플라 — 오늘을 한 번 더. 지금 가입하면 첫 달 무료 · 프리미엄 월 129,000원 · 무제한 월 219,000원"
      - char: { id: 해수, position: left }
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          with: [해수]
          text: "형, 저 TV 소리 좀 줄이면 안 돼요? 아침부터 저것만 나와요."
      - say:
          char: 해수
          with: [경준]
          text: "저거 본사에서 트는 거라 리모컨이 없어."
      - say:
          char: 경준
          motion: perk
          with: [해수]
          text: "아, 형. 이거 한번 해 봐요. 제가 손님 할게요."
      - say:
          char: 경준
          motion: stomp
          with: [해수]
          text: "\"이거 어제 샀는데 오늘 세일이잖아. 차액 내놔.\""
      - say:
          char: 해수.service
          motion: bow
          with: [경준]
          text: "고객님, 행사 시작 전 구매 건은 차액 환급이 어려우세요. 대신 확인해 드릴게요."
      - say:
          char: 경준
          motion: recoil
          with: [해수]
          text: "……형 지금 진짜 목소리 나왔어요."
      - say:
          char: 해수
          with: [경준]
          text: "그게 편해."
      - say:
          char: 경준
          with: [해수]
          text: "무섭다고요, 그게."
      - say:
          char: 경준
          with: [해수]
          text: "형은 하루에 저 광고 몇 번 들어요?"
      - say:
          char: 해수
          with: [경준]
          text: "세어 본 적은 없는데. 한 시간에 네 번."
      - say:
          char: 경준.laugh
          with: [해수]
          text: "세었네."
      - say:
          char: 경준
          motion: bounce
          with: [해수]
          text: "형 진짜 레플라 안 해요? 우리 매장에 안 하는 사람 형이랑 시식 코너 이모님밖에 없어요."
      - say:
          char: 경준
          with: [해수]
          text: "형 같은 사람이 해야 돼요. 거기선 손님한테 고개 안 숙여도 되거든요."
      - say:
          char: 해수.service
          motion: bow
          with: [경준]
          text: "고개는 괜찮아. 목 운동 돼."
      - say:
          char: 경준
          motion: recoil
          with: [해수]
          text: "……네."

  coupon:
    title: "체험권"
    actions:
      - char: { id: 지영, position: right }
      - say:
          channel: action
          with: [지영]
          text: "지영이 아이스커피 한 잔을 해수 앞에 내려놓는다."
      - say:
          char: 경준
          motion: perk
          with: [지영]
          text: "주임님, 제 건요?"
      - say:
          char: 지영
          with: [경준]
          text: "넌 마감 안 바꿔 줬잖아."
      - say:
          char: 지영
          with: [해수]
          text: "마감 고마워. 그리고 너 오늘 12년 됐지? 인사팀에서 근속 메일 왔더라. 2019년 4월 11일 입사."
      - say:
          char: 해수
          with: [지영]
          text: "아, 오늘이에요? 몰랐어요."
      - say:
          char: 해수
          with: [경준]
          text: "네가 들어왔을 때 내가 벌써 10년 차였어."
      - say:
          char: 경준
          with: [해수]
          text: "그거 자랑이에요, 슬픈 얘기예요?"
      - say:
          char: 해수
          with: [경준]
          text: "자랑은 아니지."
      - say:
          char: 지영.smirk
          motion: headtilt
          with: [해수]
          text: "본인이 모르는 게 제일 무섭다. 자, 선물."
      - sticker: { id: coupon, image: coupon_sticker, x: 62, y: 34, width: "240px", rotate: -4, enter: popIn }
      - say:
          char: 지영
          with: [해수]
          text: "레플라 7일 체험권. 내 추천 코드로 가입하면 나 한 달 공짜야. 너 위해서 주는 거 아니고."
      - say:
          char: 경준
          with: [지영]
          text: "주임님 이번 달에 몇 명째예요, 추천."
      - say:
          char: 지영
          with: [경준]
          text: "너까지 셋."
      - say:
          char: 경준
          motion: gasp
          with: [지영]
          text: "저 그거 모르고 쓴 건데요."
      - say:
          char: 지영
          with: [경준]
          text: "알고 썼으면 안 줬지."
      - choice:
          key: t0_coupon
          prompt: "체험권 모서리가 커피 컵 물기에 조금 젖었다."
          char: 해수
          options:
            - text: "앞치마 주머니에 넣는다"
              set: { took_coupon: true }
              goto: coupon_pocket
            - text: "\"경준이 주세요. 저는 괜찮아요.\""
              goto: coupon_refuse

  coupon_pocket:
    actions:
      - get: coupon
      - clearSticker: { id: coupon, leave: fadeOut }
      - say:
          char: 해수
          motion: bow
          with: [지영]
          text: "감사합니다, 주임님. 쓸지는 모르겠는데요."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "다들 그렇게 말해. 나도 그랬어."
      - say:
          char: 지영
          with: [해수]
          text: "나도 처음엔 점심시간에만 했어. 딱 사십 분씩."
      - say:
          char: 해수
          with: [지영]
          text: "지금은요?"
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "묻지 마."
      - say:
          char: 지영
          with: [해수]
          text: "할 거면 오늘 해. 7일짜리라 하루 지나면 하루 날아가."
      - say:
          char: 해수
          with: [지영]
          text: "생각해 볼게요."
      - say:
          char: 지영
          with: [해수]
          text: "생각하면 안 하는 거야, 너는."
      - goto: ticket

  coupon_refuse:
    actions:
      - say:
          char: 경준
          with: [해수, 지영]
          text: "저 이미 라이트라 체험권 못 써요. 기존 회원은 안 돼요."
      - say:
          char: 지영
          motion: headtilt
          with: [경준]
          text: "그걸 왜 네가 먼저 알아봤어."
      - say:
          char: 경준
          with: [지영]
          text: "저번에 저도 누구 주려고 알아봤거든요."
      - say:
          char: 지영
          with: [경준]
          text: "누구."
      - say:
          char: 경준
          motion: droop
          with: [지영]
          text: "…안 받았어요."
      - clearSticker: { id: coupon, leave: fadeOut }
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "그럼 계산대 밑 둘째 서랍에 둔다. 영수증 상자 위. 너 그 서랍 하루에 서른 번은 열잖아. 버리든가."
      - goto: ticket

  ticket:
    title: "027번"
    actions:
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
      - char: { id: 해수, position: left }
      - char: { id: 지영, position: center }
      - char: { id: 광철, position: right }
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "오광철 고객님, 오셨어요."
      - say:
          char: 광철
          with: [해수]
          text: "오늘 왜 이렇게 추워. 사월인데."
      - say:
          char: 해수.service
          with: [광철]
          text: "아침에 바람이 좀 불었어요."
      - say:
          char: 광철
          with: [해수]
          text: "주차장에 차를 대려는데 엘리베이터 쪽은 맨날 자리가 없어."
      - say:
          char: 해수.service
          with: [광철]
          text: "금요일에는 손님이 좀 많으세요."
      - say:
          char: 광철
          with: [해수]
          text: "나는 거기 아니면 못 세워. 기둥 옆에 늘 대."
      - say:
          char: 해수.service
          with: [광철]
          text: "지정 자리는 따로 없어서요, 고객님."
      - say:
          char: 광철
          with: [해수]
          text: "그건 알아. 그냥 말해 본 거지."
      - say:
          char: 광철
          motion: headtilt
          with: [해수]
          text: "저 형광등은 언제부터 저래. 눈이 아파서 못 보겠어."
      - say:
          char: 해수.service
          with: [광철]
          text: "3월부터요. 시설팀에 말씀드렸습니다."
      - say:
          char: 광철
          with: [해수]
          text: "말만 하면 뭐 해. 나는 집 전구도 내가 갈아. 의자 놓고 올라가서."
      - say:
          char: 해수.service
          with: [광철]
          text: "조심하셔야 돼요, 고객님."
      - say:
          char: 광철
          with: [해수]
          text: "갈 사람이 나밖에 없는데 어떡해."
      - say:
          char: 광철
          motion: puff
          with: [해수]
          text: "…아니, 그게 중요한 게 아니고."
      - say:
          char: 광철
          with: [해수]
          text: "이거 환불."
      - say:
          char: 해수.service
          with: [광철]
          text: "즉석밥 열두 개 묶음이요. 영수증 확인해 드릴게요."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "확인은 뭘 확인해. 어제 여기서 산 거 몰라? 맨날 보면서."
      - say:
          char: 해수.service
          motion: nod
          with: [광철]
          text: "네, 알고 있습니다. 시스템에 찍어야 해서요."
      - say:
          channel: record
          with: []
          text: "고객 상담 이력 · 오광철 님 · 누적 41건 · 최초 등록 2019.04.11 14:52 · 최초 처리자 정해수"
      - say:
          char: 지영
          motion: lean_in
          with: [해수, 광철]
          delivery: whisper
          text: "마흔한 건. 최초 등록 2019년 4월 11일 두 시 오십이 분. …야, 오늘이네. 너 첫날 첫 손님이 이분이야?"
      - say:
          char: 광철
          with: [지영, 해수]
          text: "남의 기록을 왜 소리 내서 읽어."
      - say:
          char: 광철
          with: [지영]
          text: "마흔한 번 왔으면 뭐. 장 보러 온 걸 왜 세."
      - say:
          char: 지영
          with: [광철]
          text: "장 보신 건 안 세요, 고객님. 상담만 세는 거예요."
      - say:
          char: 광철
          motion: droop
          with: [지영]
          text: "…그럼 더 나쁘네."
      - say:
          char: 광철
          with: [해수]
          text: "하나 먹었는데 맛이 이상해. 나머지 열한 개도 똑같을 거 아니야."
      - say:
          char: 해수.service
          with: [광철]
          text: "어떻게 이상하셨어요?"
      - say:
          char: 광철
          with: [해수]
          text: "냄새가 나. 쉰 냄새는 아니고. 물 냄새 같은 게."
      - say:
          char: 해수.service
          motion: nod
          with: [광철]
          text: "제조일자부터 확인해 드릴게요."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "확인, 확인. 확인밖에 할 줄 몰라?"
      - say:
          char: 해수
          with: [광철]
          text: "개봉하신 상품은 원래 환불이 좀 어려우신데요, 고객님…"
      - move: { id: 광철, toward: 해수, style: lunge }
      - say:
          char: 광철.shout
          with: [해수]
          text: "어렵다는 게 된다는 거야, 안 된다는 거야? 말을 똑바로 해! 몇 년째 거기 앉아 있으면서 아직도 말을 그따위로 해?"
      - say:
          char: 광철
          with: [해수]
          text: "혼자 사는 사람한테 열두 개씩 묶어 파는 것도 웃기지. 내가 이걸 언제 다 먹어."
      - choice:
          key: t0_kwang
          prompt: "포스기 화면에 '개봉 상품 — 관리자 승인 필요'가 떠 있다."
          char: 해수
          options:
            - text: "\"확인해 드릴게요.\" 뜯은 하나만 빼고 환불한다"
              goto: kwang_rule
            - text: "전액 환불한다. 모자란 1,580원은 내 지갑에서 채운다"
              set: { paid_diff: true }
              goto: kwang_pay
            - text: "\"고객님, 뒤에 기다리시는 분이 계셔서요. 목소리만 조금…\""
              goto: kwang_voice

  kwang_rule:
    actions:
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "열한 개 환불해 드렸습니다. 카드 영수증 확인해 주세요."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "하나는 내가 먹고 이상하다는데 그걸 빼? 그래, 하나는 내가 먹었지. 다음에 또 오지."
      - goto: kwang_after

  kwang_pay:
    actions:
      - say:
          char: 광철
          motion: puff
          with: [해수]
          text: "진작 이렇게 하면 될 걸."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "너 또 지갑 열었지. 1,580원. 10원짜리 없어서 동전 통에서 30원 빌린 것까지 봤어. 그거 다 합치면 너 지금쯤 차 한 대 뽑았어."
      - goto: kwang_after

  kwang_voice:
    actions:
      - move: { id: 광철, toward: 해수, style: approach }
      - say:
          char: 광철.shout
          motion: stomp
          with: [해수]
          text: "내가 지금 소리 질렀어? 이게 소리 지른 거야? 소리 지르는 게 뭔지 보여 줘?"
      - say:
          char: 광철
          motion: lean_in
          with: [해수]
          text: "이름 뭐야. …정해수. 기억해 둔다."
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "죄송합니다, 고객님. 열한 개 환불해 드릴게요."
      - goto: kwang_after

  kwang_after:
    actions:
      - move: { id: 광철, style: reset }
      - say:
          char: 광철
          with: [해수]
          text: "뜯은 건 내가 가져간다. 내 거니까."
      - say:
          char: 광철
          with: [해수]
          text: "…봉지 하나 줘. 큰 걸로."
      - say:
          char: 해수.service
          with: [광철]
          text: "네, 고객님. 여기 있습니다."
      - say:
          char: 광철
          motion: puff
          with: [해수]
          text: "얼마야. 공짜로 받는 거 아니야, 나는."
      - sticker: { id: pencil, image: pencil_sticker, x: 66, y: 40, width: "300px", rotate: 12, enter: slideUp }
      - say:
          channel: record
          with: []
          text: "접수 대장 · 027 / 즉석밥 / 처리 완료"
      - say:
          char: 지영
          with: [해수]
          text: "연필 세 봐. 저 아저씨 볼펜 둘 때는 올 때마다 하나씩 들고 갔잖아."
      - say:
          char: 지영
          with: [해수]
          text: "저번 달엔 테이프도 들고 갔어. 창구 테이프."
      - say:
          char: 해수
          with: [지영]
          text: "그건 제가 드린 거예요. 차에 싣는데 박스가 터져서요."
      - say:
          char: 지영.smirk
          motion: sigh
          with: [해수]
          text: "너 진짜. 그 아저씨가 너한테 소리 지른 게 오늘로 몇 번째인데."
      - say:
          char: 해수
          with: [지영]
          text: "박스는 박스대로 터진 거니까요."
      - say:
          char: 해수
          with: [지영]
          text: "스무 자루 다 있어요."
      - say:
          char: 지영
          with: [해수]
          text: "볼펜 없앤 보람이 있네."
      - clearSticker: { id: pencil, leave: fadeOut }
      - goto: lunch

  lunch:
    title: "휴게실"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 700 }
      - char: { id: 지영, position: left }
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: perk
          with: [지영]
          text: "주임님, 전자레인지 순번표 또 누가 지웠어요. 제가 아침에 써 놨는데."
      - say:
          char: 지영
          with: [경준]
          text: "그거 쓰는 사람이 너밖에 없어서 그래."
      - say:
          char: 경준
          with: [지영]
          text: "순번이 있어야 공평하죠."
      - say:
          char: 지영
          with: [경준]
          text: "네 명 쓰는 데 순번이 왜 필요해."
      - say:
          char: 경준
          with: [지영]
          text: "다섯 명이요. 시식 코너 이모님도 쓰세요."
      - say:
          char: 지영
          with: [경준]
          text: "이모님은 1번이야. 영원히."
      - say:
          char: 경준
          motion: nod
          with: [지영]
          text: "…납득이 되는 게 더 짜증 나요."
      - say:
          char: 경준
          with: [지영]
          text: "주임님, 상혁 씨 요새 여기서 자요? 아까 물류창고 박스 위에서 자던데요."
      - say:
          char: 지영
          with: [경준]
          text: "집에서 안 자니까 여기서 자지. 무제한에 확장팩까지 질렀대."
      - say:
          char: 경준
          motion: bounce
          with: [지영]
          text: "확장팩이면… 집 넓혀 주는 거요? 형이랑 같이 사니까 형은 알겠네."
      - say:
          char: 지영
          with: [경준]
          text: "해수가 그런 거 말하는 거 봤어? 넌 몰라도 돼."
      - say:
          char: 경준
          motion: perk
          with: [지영]
          text: "왜요."
      - say:
          char: 지영.smirk
          with: [경준]
          text: "그냥 몰라도 돼. 밥 먹어."
      - char: { id: 상혁, position: center }
      - move: { id: 상혁, toward: 경준, style: approach }
      - emote: { id: 경준, motion: startle }
      - say:
          char: 상혁.grin
          motion: lean_in
          with: [지영, 경준]
          text: "뭐야. 내 얘기 했지. 들어오는데 조용해지더라."
      - say:
          char: 지영
          with: [상혁]
          text: "상혁 씨 얼굴 얘기 했어. 사람 얼굴이 아니야."
      - say:
          char: 상혁
          motion: laugh
          with: [지영]
          text: "주임님은 어제 몇 시에 로그아웃했는데요."
      - say:
          char: 지영
          motion: sigh
          with: [상혁]
          text: "……밥 먹어."
      - say:
          char: 경준
          motion: gasp
          with: [상혁]
          text: "상혁 씨 그거 반칙이에요."
      - say:
          char: 상혁
          with: [경준]
          text: "뭐가."
      - say:
          char: 경준
          with: [상혁]
          text: "주임님한테 그렇게 말할 수 있는 사람 상혁 씨밖에 없잖아요."
      - say:
          char: 지영
          with: [경준]
          text: "해 봐. 다음 달 근무표 내가 짜."
      - say:
          char: 경준
          motion: recoil
          with: [지영]
          text: "안 할래요."
      - move: { id: 상혁, style: reset }
      - say:
          char: 지영
          when: { var: took_coupon, op: eq, value: true }
          with: [상혁]
          text: "아까 해수한테 체험권 줬어. 상혁 씨가 옆에서 좀 꼬셔 봐. 걔 가입하면 나 한 달 공짜야."
      - say:
          char: 지영
          when: { var: took_coupon, op: eq, value: false }
          with: [상혁]
          text: "아까 해수한테 체험권 줬더니 안 받더라. 상혁 씨가 말 좀 해 봐. 걔 가입하면 나 한 달 공짜야."
      - char: { id: 해수, position: left }
      - say:
          char: 지영
          when: { var: paid_diff, op: eq, value: true }
          with: [해수]
          text: "해수는 오늘 컵라면이야. 점심값을 손님한테 줘서."
      - say:
          char: 상혁
          with: [해수]
          text: "야, 너 어제 밥 안 했지."
      - say:
          char: 해수
          with: [상혁]
          text: "네 차례였어."
      - say:
          char: 상혁
          motion: headtilt
          with: [해수]
          text: "내 차례였어?"
      - say:
          char: 해수
          with: [상혁]
          text: "월, 수, 금 네 차례야. 3년째."
      - say:
          char: 상혁
          with: [해수]
          text: "어제 목요일이잖아."
      - say:
          char: 해수
          with: [상혁]
          text: "어제 수요일이었어."
      - say:
          char: 상혁
          motion: slump
          with: [해수]
          text: "…아."
      - say:
          char: 상혁
          with: [해수]
          text: "그럼 오늘 내가 두 번 하면 되겠네."
      - say:
          char: 해수
          with: [상혁]
          text: "오늘 금요일이라 어차피 네 차례야."
      - say:
          char: 상혁
          with: [해수]
          text: "너 그거 머릿속에서 어떻게 세고 있냐."
      - say:
          char: 해수
          with: [상혁]
          text: "안 세. 그냥 알지."
      - say:
          char: 경준
          motion: bounce
          with: [상혁, 해수]
          text: "두 분 진짜 같이 살아요? 저 소문인 줄 알았어요."
      - say:
          char: 상혁
          with: [경준]
          text: "고등학교 때부터 붙어 다녔어. 3학년 때 같은 반."
      - say:
          char: 해수
          with: [상혁]
          text: "2학년 때도 같은 반이었어."
      - say:
          char: 상혁
          with: [해수]
          text: "2학년 때는 네가 옆 반이었지."
      - say:
          char: 해수
          with: [상혁]
          text: "7반. 너 6반."
      - say:
          char: 상혁
          motion: sigh
          with: [해수]
          text: "…그래. 비슷하잖아."
      - say:
          char: 경준
          with: [해수]
          text: "형은 그런 걸 왜 다 기억해요?"
      - say:
          char: 상혁.grin
          with: [경준]
          text: "쟤는 숫자만 기억해. 사람 얼굴은 못 외워."
      - say:
          char: 해수
          with: [상혁]
          text: "얼굴도 기억해."
      - say:
          char: 상혁
          motion: lean_in
          with: [해수]
          text: "내 생일 언제야."
      - say:
          char: 해수
          with: [상혁]
          text: "11월 9일."
      - say:
          char: 상혁
          with: [해수]
          text: "…그것도 숫자잖아."
      - say:
          char: 지영
          with: [상혁]
          text: "분리수거는 누가 해?"
      - say:
          char: 상혁
          with: [지영]
          text: "쟤가."
      - say:
          char: 해수
          with: [지영]
          text: "상혁이도 해요. 내놓는 건 상혁이가 해요."
      - say:
          char: 상혁
          with: [지영]
          text: "내가 내놓고 쟤가 묶어."
      - say:
          char: 지영
          motion: sigh
          with: [상혁]
          text: "그게 쟤가 다 하는 거야, 상혁 씨."
      - say:
          char: 해수
          with: [상혁]
          text: "참, 어머니 전화 오셨어. 어제 저녁에."
      - say:
          char: 상혁
          motion: freeze
          with: [해수]
          text: "…뭐래."
      - say:
          char: 해수
          with: [상혁]
          text: "네가 전화를 안 받는다고."
      - say:
          char: 상혁
          with: [해수]
          text: "바빴어."
      - say:
          char: 해수
          with: [상혁]
          text: "두부 보내셨대. 아버님이 콩 거두셨다고. 아이스박스에 넣으셨대."
      - say:
          char: 상혁
          with: [해수]
          text: "두부를 왜 택배로 보내."
      - say:
          char: 상혁
          with: [해수]
          text: "…알았어. 내가 전화할게."
      - say:
          char: 상혁
          motion: headtilt
          with: [해수]
          text: "근데 너 왜 우리 엄마랑 나보다 통화를 오래 해."
      - say:
          char: 해수
          with: [상혁]
          text: "어머님이 길게 하셔."
      - say:
          char: 상혁
          with: [해수]
          text: "야, 해수. 집에 우편 오면 내 건 건드리지 마. 내가 뜯을게."
      - say:
          char: 해수
          with: [상혁]
          text: "응. 원래 안 뜯어."
      - say:
          char: 상혁
          with: [해수]
          text: "알아. 그냥 말하는 거야."
      - say:
          char: 해수
          with: [상혁]
          text: "리모컨은 소파 밑에 있었어. 어제 네가 찾던 거."
      - say:
          char: 상혁
          with: [해수]
          text: "거기를 왜 봐."
      - say:
          char: 해수
          with: [상혁]
          text: "늘 거기 있잖아."
      - say:
          char: 상혁
          motion: sigh
          with: [해수]
          text: "…고맙다."
      - say:
          char: 상혁
          when: { var: took_coupon, op: eq, value: true }
          with: [해수]
          text: "주임님이 체험권 줬다며. 해 봐. 거기는 다 맞춰 줘. 내가 무슨 말을 해도."
      - say:
          char: 상혁
          when: { var: took_coupon, op: eq, value: false }
          with: [해수]
          text: "체험권 안 받았다며. 바보야. 거기는 다 맞춰 줘. 내가 무슨 말을 해도."
      - say:
          char: 해수
          motion: headtilt
          with: [상혁]
          text: "누가?"
      - say:
          char: 상혁.hollow
          with: [해수]
          text: "…있어. 걔는 내 번호 차단 안 해."

  home:
    title: "우편함"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
      - place: "밤 10:40 · 상봉동 빌라"
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…응. 나도. 아니, 진짜로. 너밖에 없어."
      - sticker: { id: bill, image: bill_sticker, x: 64, y: 36, width: "280px", rotate: 3, enter: slideDown }
      - say:
          channel: record
          with: []
          text: "변상혁 님 · 레플라 이용요금 안내 · 4월 청구 409,000원 (무제한 219,000원 + 프라이빗 확장팩 190,000원) · 3월분 미납"
      - choice:
          key: t0_mail
          prompt: "신발장 위에 뜯지 않은 지난달 봉투가 하나 더 있다."
          char: 해수
          options:
            - text: "상혁이 방문 밑으로 밀어 넣는다"
              goto: mail_door
            - text: "\"상혁아, 우편 왔어.\" 문을 두 번 두드린다"
              set: { knocked: true }
              add: { sh_care: 1 }
              goto: mail_knock

  mail_door:
    actions:
      - clearSticker: { id: bill, leave: fadeOut }
      - say:
          char: 해수
          with: []
          text: "상혁아, 나 들어왔어."
      - say:
          char: 해수
          with: []
          text: "현관 불 켜 놓고 자지 마. 지난달 고지서 많이 나왔어."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "잠깐만. 누구 왔나 봐. …아니야, 아무도. 계속해."
      - goto: room

  mail_knock:
    actions:
      - clearSticker: { id: bill, leave: fadeOut }
      - say:
          char: 상혁
          with: []
          delivery: angry
          text: "놓고 가."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…아, 해수야? 고마워. 거기 놔 줘. 내일 볼게."
      - say:
          char: 해수
          with: []
          text: "상혁아. 밥은 먹었어?"
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "먹었어."
      - say:
          char: 해수
          with: []
          text: "뭐 먹었는데."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…먹었다니까."
      - say:
          char: 해수
          with: []
          text: "냄비에 물 올려 놓을게. 라면."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "안 먹어."
      - say:
          char: 해수
          with: []
          text: "그럼 불 끌게."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "…끓여 놔. 계란은 두 개."
      - say:
          char: 해수
          with: []
          text: "하나야. 어제 네가 두 개 먹었어."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "해수. 내 친구. 같이 살아. …응, 인사해."
      - goto: room

  room:
    actions:
      - bg: { id: haesu_room, transition: dissolve, duration: 600 }
      - say:
          channel: system
          with: []
          text: "알람 · 오전 9:30"
      - say:
          channel: thought
          with: []
          text: "휴지. 우유. 또 안 샀다."
