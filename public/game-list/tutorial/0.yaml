chapterTitle: "근무표"

script:
  - scene: ticket_opening
  - scene: chat
  - scene: counter
  - scene: coupon
  - scene: ticket
  - scene: lunch
  - scene: home
  - scene: room

scenes:
  ticket_opening:
    title: "호출 대기"
    actions:
      - bg: { id: cs_desk, transition: cut }
      - music: fluoro
      - place: "4월 11일 금요일 · 그린마트 상봉점 고객센터"
      - say:
          channel: action
          with: []
          text: "고객센터 직원 정해수. 번호표 027번 손님을 부를 차례다."
          continueLabel: "027번을 호출한다"
      - set: { t0_refund_first: true }
      - goto: ticket

  chat:
    title: "단톡방"
    actions:
      - bg: { id: home_hall, transition: cut }
      - place: { text: "그날 아침, 출근 전 · 오전 8:12 · 집", presentation: center }
      - music: fluoro
      - say:
          channel: system
          with: []
          text: "레플라 REPLA · 밴드 하나로 현실과 똑같은 공간에 접속하세요.\n지금 접속 중 1,104,331명"
          autoAdvance: 2400
      - wait: 0
      - say:
          channel: system
          with: []
          text: "상봉점 고객센터 (3) · 2031년 4월 11일 금요일 오전 8:12"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수야 혹시 오늘 마감 나랑 바꿔 줄 수 있어?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "레플라 점검이 7시에 끝나는데 끝나자마자 들어가야 대기 안 걸려ㅠ"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 저번 주에도 마감 바꿔 달라고 하셨잖아요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수는 퇴근하고 레플라 안 하잖아. 오늘만 바꿔 줘"
      - wait: 0
      - wait: 0
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 바꿔 드릴게요. 커피는 아이스로 부탁드립니다"
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          channel: system
          with: []
          text: "근무표 변경 · 정해수 11:00–22:00 마감"
      - say:
          channel: record
          with: []
          text: "메모 · 4월 4일 휴지 · 4월 11일 우유"

  counter:
    title: "고객센터"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 700 }
      - place: { text: "027번 호출 전 · 그린마트 상봉점 고객센터", presentation: center }
      - wait: 0
      - char: { id: 해수, position: left }
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          with: [해수]
          text: "형, TV 광고에서 레플라에 우리 매장도 나온대요."
      - wait: 0
      - say:
          char: 경준
          motion: perk
          with: [해수]
          text: "아, 형. 이거 한번 해 봐요. 제가 손님 할게요."
      - say:
          char: 경준
          motion: stomp
          with: [해수]
          text: "\"이거 어제 샀는데 오늘 세일이잖아. 차액 내놔.\""
      - say:
          char: 해수.service
          motion: bow
          with: [경준]
          text: "고객님, 행사 전에 사신 상품은 차액을 돌려드리기 어렵습니다."
      - wait: 0
      - say:
          char: 경준
          motion: recoil
          with: [해수]
          text: "방금 진짜 손님한테 하는 목소리 나왔어요."
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 경준
          motion: bounce
          with: [해수]
          text: "형 진짜 레플라 안 해요? 우리 매장에 안 하는 사람 형이랑 시식 코너 이모님밖에 없어요."
      - say:
          char: 경준
          with: [해수]
          text: "거기선 우리가 손님으로 들어갈 수도 있어요. 형도 고개 숙이는 거 말고 다른 거 해 봐요."
      - wait: 0
      - say:
          char: 해수.service
          motion: bow
          with: [경준]
          text: "숙이는 거야 뭐. 목 운동 돼."
      - wait: 0

  coupon:
    title: "체험권"
    actions:
      - char: { id: 지영, position: right }
      - say:
          channel: action
          with: [지영]
          text: "지영이 아이스커피 한 잔을 해수 앞에 내려놓는다."
      - say:
          char: 경준
          motion: perk
          with: [지영]
          text: "주임님, 제 건요?"
      - say:
          char: 지영
          with: [경준]
          text: "넌 마감 안 바꿔 줬잖아."
      - say:
          char: 지영
          with: [해수]
          text: "마감 고마워. 너 여기 온 지 딱 12년이더라. 인사팀 메일에 써 있었어. 2019년 4월 11일 입사."
      - sticker: { id: coupon, image: coupon_sticker, x: 62, y: 34, width: "240px", rotate: -4, enter: popIn }
      - say: { char: 해수, with: [지영], text: "오늘이었어요?" }
      - say:
          char: 지영
          with: [해수]
          text: "레플라 7일 체험권이야. 내 추천 코드로 가입하면 나도 한 달 공짜라서."
      - say:
          char: 경준
          with: [지영]
          text: "이번 달에 몇 명 추천했어요, 주임님?"
      - say:
          char: 지영
          with: [경준]
          text: "너까지 셋."
      - say:
          char: 경준
          motion: gasp
          with: [지영]
          text: "저 그거 모르고 쓴 건데요."
      - say:
          char: 지영
          with: [경준]
          text: "알았으면 네가 안 써 줬겠지."
      - choice:
          key: t0_coupon
          prompt: "체험권 모서리가 커피 컵 물기에 조금 젖었다."
          char: 해수
          options:
            - text: "앞치마 주머니에 넣는다"
              set: { took_coupon: true }
              goto: coupon_pocket
            - text: "체험권을 경준에게 양보한다"
              saveText: "\"경준이 주세요. 저는 괜찮아요.\""
              goto: coupon_refuse

  coupon_pocket:
    actions:
      - get: coupon
      - clearSticker: { id: coupon, leave: fadeOut }
      - say:
          char: 해수
          motion: bow
          with: [지영]
          text: "감사합니다, 주임님."
      - say:
          char: 해수
          motion: bow
          with: [지영]
          text: "쓸지는 모르겠는데요."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "다들 그렇게 말해. 나도 그랬어."
      - say:
          char: 지영
          with: [해수]
          text: "나도 처음엔 점심시간에만 했어. 딱 사십 분씩."
      - say:
          char: 해수
          with: [지영]
          text: "지금은요?"
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "묻지 마."
      - say:
          char: 지영
          with: [해수]
          text: "할 거면 오늘 해. 너 미뤄 두면 까먹잖아."
      - say:
          char: 해수
          with: [지영]
          text: "생각해 볼게요."
      - say:
          char: 지영
          with: [해수]
          text: "생각하면 안 하는 거야, 너는."
      - goto: after_coupon

  coupon_refuse:
    actions:
      - say:
          char: 경준
          with: [해수, 지영]
          text: "저 이미 라이트라 체험권 못 써요. 기존 회원은 안 돼요."
      - say:
          char: 지영
          motion: headtilt
          with: [경준]
          text: "그걸 왜 네가 먼저 알아봤어."
      - say:
          char: 경준
          with: [지영]
          text: "저번에 저도 누구 주려고 알아봤거든요."
      - say:
          char: 지영
          with: [경준]
          text: "누구."
      - say:
          char: 경준
          motion: droop
          with: [지영]
          text: "…안 받았어요."
      - clearSticker: { id: coupon, leave: fadeOut }
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "둘째 서랍에 둘게. 네가 내일 영수증 꺼내다가 버려."
      - goto: after_coupon

  after_coupon:
    actions:
      - branch:
          cases:
            - when: { var: t0_refund_first, op: eq, value: true }
              goto: lunch
          default: ticket

  ticket:
    title: "027번"
    actions:
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
          wait: 420
      - char: { id: 해수, position: left }
      - char: { id: 지영, position: center }
      - char: { id: 광철, position: right }
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "오광철 고객님, 오셨어요."
      - say: { char: 광철, with: [해수], text: "이거 환불해 줘. 어제 여기서 산 거 알지?" }
      - say: { char: 해수.service, with: [광철], text: "이거 열두 개들이죠. 영수증 좀 주시겠어요?" }
      - wait: 0
      - say:
          char: 해수.service
          with: [광철]
          text: "환불하려면 영수증을 찍어야 해서요."
          continueLabel: "영수증을 찍는다"
      - sound: snap
      - effect: focus
      - say:
          channel: record
          with: []
          text: "고객 상담 이력 · 오광철 님 · 누적 41건 · 최초 등록 2019.04.11 14:52 · 최초 처리자 정해수"
      - say:
          char: 지영
          motion: lean_in
          with: [해수, 광철]
          delivery: whisper
          text: "4월 11일. 오늘이네. 딱 12년 전이야. 해수야, 첫날 받은 손님이 이분이었어?"
      - say:
          char: 광철
          with: [지영, 해수]
          text: "남의 기록을 왜 소리 내서 읽어."
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 광철
          with: [해수]
          text: "하나 뜯었는데 물 냄새가 나. 나머지도 환불해 줘."
      - wait: 0
      - wait: 0
      - say:
          char: 해수.service
          motion: nod
          with: [광철]
          text: "제조일자부터 확인해 드릴게요."
      - wait: 0
      - say:
          char: 해수
          with: [광철]
          text: "개봉하신 하나는 바로 환불해 드리기 어려운데요…"
      - move: { id: 광철, toward: 해수, style: lunge }
      - effect: rumble
      - say:
          char: 광철.shout
          with: [해수]
          text: "그래서 된다는 거야, 안 된다는 거야? 여기 몇 년을 앉아서 아직 말을 그렇게 해?"
          wait: 0
      - say:
          char: 광철
          with: [해수]
          text: "혼자 사는 사람한테 열두 개씩 묶어 파는 것도 웃기지. 내가 이걸 언제 다 먹어."
      - choice:
          key: t0_kwang
          prompt: "포스기 화면에 '개봉 상품 — 관리자 승인 필요'가 떠 있다."
          char: 해수
          options:
            - text: "개봉한 상품을 빼고 환불한다"
              saveText: "\"확인해 드릴게요.\" 뜯은 하나만 빼고 환불한다"
              goto: kwang_rule
            - text: "내 돈을 보태 전액 환불한다"
              saveText: "전액 환불한다. 모자란 1,580원은 내 지갑에서 채운다"
              set: { paid_diff: true }
              goto: kwang_pay
            - text: "목소리를 낮춰 달라고 한다"
              saveText: "\"고객님, 뒤에 기다리시는 분이 계셔서요. 목소리만 조금…\""
              goto: kwang_voice

  kwang_rule:
    actions:
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "열한 개 환불해 드렸습니다."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "카드 영수증 확인해 주세요."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "맛이 이상하니까 가져왔지. 뜯었으니 돈 못 준다는 게 말이 돼? …됐어. 나 내일 또 올 거야."
      - goto: kwang_after

  kwang_pay:
    actions:
      - say:
          char: 광철
          motion: puff
          with: [해수]
          text: "진작 이렇게 하면 될 걸."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "너 또 지갑 열었지. 1,580원. 모자라니까 동전 통에서 30원 꺼내고. 내 앞에서 서랍을 그렇게 살살 닫으면 내가 몰라?"
      - goto: kwang_after

  kwang_voice:
    actions:
      - move: { id: 광철, toward: 해수, style: approach }
      - say:
          char: 광철.shout
          motion: stomp
          with: [해수]
          text: "내가 지금 소리 질렀어? 이게 소리 지른 거야? 소리 지르는 게 뭔지 보여 줘?"
          wait: 800
      - say:
          char: 광철
          motion: lean_in
          with: [해수]
          text: "이름 뭐야. …정해수. 기억해 둔다."
      - wait: 600
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "죄송합니다, 고객님."
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "열한 개 환불해 드릴게요."
      - goto: kwang_after

  kwang_after:
    actions:
      - move: { id: 광철, style: reset }
      - say:
          char: 광철
          with: [해수]
          text: "뜯은 건 내가 가져간다. 내 거니까."
      - say:
          char: 광철
          with: [해수]
          text: "큰 봉지 하나 줘. …얼마야. 공짜로 받는 거 아니야."
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - sticker: { id: pencil, image: pencil_sticker, x: 66, y: 40, width: "300px", rotate: 12, enter: slideUp }
      - say:
          channel: record
          with: []
          text: "접수 대장 · 027 / 즉석밥 / 처리 완료"
      - say:
          char: 지영
          with: [해수]
          text: "연필 세 봐. 볼펜 꽂아 놨을 땐 저 아저씨가 올 때마다 하나씩 가져갔잖아."
      - wait: 0
      - say:
          char: 해수
          with: [지영]
          text: "테이프는 제가 드린 거예요. 차에 싣다가 박스가 터졌거든요."
      - wait: 0
      - say:
          char: 지영.smirk
          motion: sigh
          with: [해수]
          text: "너 그 아저씨한테 소리 듣고도 그렇게까지 해 줘?"
      - wait: 0
      - say:
          char: 해수
          with: [지영]
          text: "스무 자루 다 있어요."
      - wait: 0
      - clearSticker: { id: pencil, leave: fadeOut }
      - branch:
          cases:
            - when: { var: t0_refund_first, op: eq, value: true }
              goto: chat
          default: lunch

  lunch:
    title: "휴게실"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 700 }
      - place: "같은 날 점심 · 027번 응대 뒤 · 휴게실"
      - char: { id: 지영, position: left }
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: perk
          with: [지영]
          text: "주임님, 점심 교대요. 제가 붙인 전자레인지 순번표 또 없어졌어요."
      - say:
          char: 지영
          with: [경준]
          text: "그거 쓰는 사람이 너밖에 없어서 그래."
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 경준
          with: [지영]
          text: "근데 상혁 씨 요새 창고에서 자요? 아까 박스 위에서 자던데요."
      - say:
          char: 지영
          with: [경준]
          text: "집에서 안 자니까 여기서 자지. 무제한에 확장팩까지 질렀대."
      - say:
          char: 경준
          motion: bounce
          with: [지영]
          text: "확장팩이면… 집 넓혀 주는 거요? 형이랑 같이 사니까 형은 알겠네."
      - wait: 0
      - wait: 0
      - wait: 0
      - char: { id: 상혁, position: center }
      - move: { id: 상혁, toward: 경준, style: approach }
      - emote: { id: 경준, motion: startle }
      - say:
          char: 상혁.grin
          motion: lean_in
          with: [지영, 경준]
          text: "뭐야. 내 얘기 했지. 들어오는데 조용해지더라."
      - say:
          char: 지영
          with: [상혁]
          text: "상혁 씨 얼굴 얘기 했어. 눈 밑이 시커멓더라."
      - say:
          char: 상혁
          motion: laugh
          with: [지영]
