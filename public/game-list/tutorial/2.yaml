chapterTitle: "C-14"

script:
  - scene: news
  - scene: bathroom
  - scene: tape
  - scene: interview
  - scene: interview_rest
  - scene: tamper
  - scene: changed
  - scene: rumor
  - scene: new_lock

scenes:
  news:
    title: "단톡방"
    actions:
      - bg: { id: haesu_room, transition: cut }
      - music: bleed
      - say:
          channel: system
          with: []
          text: "속보 · 4월 18일 오전 7:30 · 서울 중랑구 대형마트 지하주차장서 50대 남성 숨진 채 발견 · 새벽 5시 10분 주차 관리원 신고 · 경찰 타살 가능성 수사"
      - say:
          channel: system
          with: []
          text: "상봉점 고객센터 (3) · 4월 18일 금요일 오전 7:41"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 형 뉴스 봤어요??? 우리 지하주차장"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "경찰차 네 대 와 있어요 저 지금 버스정류장인데 다 보여요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "오픈 11시로 미룬대 본사 공지 옴"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 그럼 저 11시까지 가면 돼요? 지금 버스 안인데"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "내려서 집에 갔다 와 두 정거장이잖아"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "집에 가면 다시 못 나와요 저는"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "즉석밥 아저씨래요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "확실하지도 않은 거 단톡에 쓰지 마"
      - wait: 600
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "죄송합니다"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "근데 맞대. 지하 주차장 내려갔던 보안팀 김 기사님이 봤대"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          erase: true
          text: "주차장 어디쯤이요"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 알겠습니다 11시까지 가겠습니다"

  bathroom:
    title: "칫솔"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 700 }
      - place: "오전 7:58 · 집"
      - char: { id: 해수, position: left }
      - char: { id: 상혁, position: right }
      - say:
          char: 상혁.grin
          with: [해수]
          text: "아, 깼어?"
      - say:
          char: 해수
          with: [상혁]
          text: "너 어제 밥 안 먹었지."
      - say:
          char: 해수
          with: [상혁]
          text: "냄비 그대로야."
      - say:
          char: 상혁
          with: [해수]
          text: "먹었어. 냄비 씻어 둔 거야."
      - say:
          char: 해수
          with: [상혁]
          text: "어제 라면 끓이려고 받아 둔 물이 그대로야."
      - say:
          char: 상혁.grin
          with: [해수]
          text: "너는 아침부터 냄비를 왜 봐."
      - say:
          char: 해수
          with: [상혁]
          text: "어디 갔다 와?"
      - say:
          char: 상혁
          with: [해수]
          text: "편의점."
      - say:
          char: 해수
          with: [상혁]
          text: "뭐 샀는데."
      - say:
          char: 상혁
          with: [해수]
          text: "…생각해 보니까 살 게 없더라고."
      - say:
          char: 해수
          with: [상혁]
          text: "아무것도 안 샀네."
      - say:
          char: 해수
          with: [상혁]
          text: "…세면대 컵에 칫솔이 세 개야."
      - say:
          char: 해수
          with: [상혁]
          text: "방문은 열려 있고."
      - say:
          char: 상혁
          motion: laugh
          with: [해수]
          text: "아, 머리끈도 봤어? 걔 거야. 놓고 갔네."
      - say:
          char: 해수
          with: [상혁]
          text: "누구?"
      - say:
          char: 상혁.grin
          with: [해수]
          text: "…아. 너는 모르지. 됐어."
      - say:
          char: 해수
          with: [상혁]
          text: "물기 있는 건 내 것뿐이야."
      - say:
          char: 상혁.grin
          with: [해수]
          text: "안 쓴 거지. 새 거 꺼내 놨어."
      - say:
          char: 해수
          with: [상혁]
          text: "너 칫솔 새로 산 적 없잖아."
      - say:
          char: 해수
          with: [상혁]
          text: "내가 사 와."
      - say:
          char: 상혁
          with: [해수]
          text: "…그럼 걔가 사 왔나 보지."
      - say:
          channel: thought
          with: []
          text: "세면대 아래 쓰레기통에 칫솔 포장이 없다. 영수증도 없다."
      - say:
          channel: thought
          with: []
          text: "두 개는 어디서 왔는지 모르겠고, 하나는 삼 년째 내가 쓰던 거다."
      - choice:
          key: t2_sh
          prompt: "상혁이 머리끈을 집어 손목에 낀다."
          char: 해수
          options:
            - text: "모른 척하고 신발을 신는다"
              goto: sh_shoes
            - text: "어젯밤 어디에 있었는지 묻는다"
              saveText: "\"너 어젯밤에 어디 있었어?\""
              set: { sh_night: true }
              goto: sh_where
            - text: "오늘은 레플라에 접속하지 말라고 한다"
              saveText: "\"오늘 하루만 하지 마. 그거.\""
              add: { sh_care: 1, honest: 1 }
              goto: sh_stop

  sh_shoes:
    actions:
      - say:
          channel: action
          with: []
          text: "해수가 운동화 끈을 묶는 동안 등 뒤에서 상혁의 방문이 닫힌다."
      - goto: tape

  sh_where:
    actions:
      - say:
          char: 상혁
          with: [해수]
          text: "집에 있었어. 계속."
      - move: { id: 해수, toward: 상혁, style: approach }
      - say:
          char: 해수
          with: [상혁]
          text: "방에 없던데. 새벽에."
      - move: { id: 상혁, toward: 해수, style: retreat }
      - say:
          char: 상혁.hollow
          with: [해수]
          text: "…걔랑 있었어. 차에 있었나. 요샌 자꾸 헷갈려."
      - move: { id: 해수, style: reset }
      - move: { id: 상혁, style: reset }
      - goto: tape

  sh_stop:
    actions:
      - say:
          char: 상혁
          with: [해수]
          text: "너도 하잖아."
      - say:
          char: 해수
          motion: nod
          with: [상혁]
          text: "응. 나도 오늘은 안 할게."
      - say:
          char: 상혁.hollow
          with: [해수]
          text: "…생각해 볼게. 진짜로. 생각은 해 볼게."
      - goto: tape

  tape:
    title: "노란 테이프"
    actions:
      - bg: { id: parking_real, transition: fade, duration: 900 }
      - place: "오전 10:40 · B2 내려가는 계단참"
      - char: { id: 경준, position: left }
      - char: { id: 해수, position: center }
      - char: { id: 은숙, position: right }
      - say:
          char: 경준
          motion: lean_in
          with: [해수]
          delivery: whisper
          text: "형. 가림막 때문에 아래가 하나도 안 보여요. 아저씨 차 맨날 여기 세웠잖아요. 엘리베이터 가까운 데."
      - say:
          char: 은숙
          with: [경준]
          text: "실례합니다. 중랑경찰서 차은숙 경위입니다."
      - say:
          char: 은숙
          with: [경준]
          text: "고객센터 분 계세요? 정해수 씨."
      - say:
          char: 경준
          motion: startle
          with: []
          delivery: whisper
          text: "…형 이름을 왜 알아요?"
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙
          with: [해수]
          text: "피해자분 일로 몇 가지 여쭤볼게요."
      - say:
          char: 은숙
          with: [해수]
          text: "참고인 조사예요. 경찰서까지 같이 가 주시겠어요?"
      - emote: { id: 해수, motion: nod, wait: true }
      - say:
          char: 경준
          with: []
          delivery: whisper
          text: "형, 앞치마 주세요. 제가 사물함에 넣어 놓을게요. 주임님한테는 형 화장실 갔다고 할게요."
      - say:
          char: 해수
          with: [경준]
          text: "화장실은 안 돼."
      - say:
          char: 해수
          with: [경준]
          text: "주임님이 찾으면 거짓말이 길어져."
      - say:
          char: 해수
          with: [경준]
          text: "경찰서 갔다고 해."
      - say:
          char: 해수
          with: [경준]
          text: "참고인이라고."
      - say:
          char: 해수
          with: [경준]
          text: "그렇게만 말해."
      - say:
          char: 경준
          with: [해수]
          text: "…그렇게 말하면 애들이 딴 생각 할 텐데요."
      - say:
          char: 해수
          with: [경준]
          text: "그냥 들은 대로 말해 줘."
      - say:
          char: 해수
          with: [경준]
          text: "내가 돌아와서 다시 설명할게."
      - say:
          channel: action
          with: []
          text: "해수가 앞치마를 벗어 접는다. 접는 자리가 늘 같아서 선이 났다."
      - say:
          char: 은숙
          with: [해수, 경준]
          text: "정해수 씨. 사십 분쯤 걸려요."
      - say:
          char: 은숙
          with: [해수, 경준]
          text: "차는 저쪽에 세워 뒀어요."
      - say:
          char: 해수
          with: [은숙]
          text: "…B2로는 안 내려가도 되는 거죠."
      - say:
          char: 은숙
          with: [해수]
          text: "오늘은 안 내려가요."
      - say:
          channel: thought
          with: []
          text: "가림막 밑으로 찬 바람이 올라온다. 젖은 콘크리트 냄새가 난다."

  interview:
    title: "진술 녹화실"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900 }
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.18 14:02 · 중랑경찰서 · 참고인 정해수(31) · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물 드릴까요."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "아, 괜찮습니다."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "감사합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "그냥 드릴게요. 다들 중간에 달라고 해서."
      - say:
          char: 은숙
          with: [해수]
          text: "오광철 씨 아시죠."
      - say:
          char: 해수
          with: [은숙]
          text: "네. 저희 고객님이세요."
      - say:
          char: 은숙
          with: [해수]
          text: "고객이셨죠. 어제도 마트에 들르셨고요."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "…죄송합니다."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "됐어요. 어제 몇 시에 퇴근하셨어요?"
      - say:
          char: 해수
          with: [은숙]
          text: "열 시 십 분이요."
      - say:
          char: 해수
          with: [은숙]
          text: "마감 정산하고 나왔습니다."
      - say:
          char: 은숙
          with: [해수]
          text: "그다음은."
      - say:
          char: 해수
          with: [은숙]
          text: "집에 가서 잤습니다."
      - say:
          char: 은숙
          with: [해수]
          text: "피해자분이 어디서 발견됐는지는 들으셨어요?"
      - move: { id: 은숙, toward: 해수, style: approach }
      - choice:
          key: t2_where
          prompt: "은숙 앞의 녹음기에 빨간 불이 켜져 있다."
          char: 해수
          options:
            - text: "들은 장소만 말한다"
              saveText: "\"지하 주차장이라고만 들었습니다.\""
              goto: where_safe
            - text: "C-14라고 말한다"
              saveText: "\"C-14 기둥 쪽… 아닌가요?\""
              gameOver:
                title: "아무도 말하지 않은 번호"
                message: "“C-14라고 하셨어요?” 은숙이 묻는다. 그 번호는 현장 보고서에만 있었다."
                recoverToChoice: t2_where
            - text: "단톡방을 못 봤다고 둘러댄다"
              saveText: "\"단톡방을 안 봐서요. 잘 모릅니다.\""
              add: { doubt: 1 }
              goto: where_lie

  where_safe:
    actions:
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "네. 지하 2층이에요."
      - goto: interview_rest

  where_lie:
    actions:
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "단톡방은 경준 씨가 보여 줬어요."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "정해수 씨가 아침에 '11시까지 가겠습니다' 답장했던데요."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "지하 주차장 얘기 바로 밑에."
      - say:
          char: 해수
          motion: droop
          with: [은숙]
          text: "…지하 주차장이라고는 봤습니다."
      - say:
          char: 해수
          motion: droop
          with: [은숙]
          text: "죄송합니다."
      - goto: interview_rest

  interview_rest:
    actions:
      - say:
          channel: record
          with: []
          text: "그린마트 상봉점 지하 2층 C-14 기둥 옆 · 사망 추정 4/18 01:30–02:30 · 발견 05:10 (주차 관리원) · 흉기: 그린마트 로고가 찍힌 연필 1자루"
      - move: { id: 은숙, style: reset }
      - sticker: { id: pencil, image: pencil_sticker, x: 64, y: 36, width: "300px", rotate: -18, enter: fadeIn }
      - say:
          char: 은숙
          with: [해수]
          text: "이 연필. 고객센터에 있는 거 맞죠."
      - say:
          char: 해수
          with: [은숙]
          text: "네. 연필꽂이에 있는 거랑 같아요."
      - say:
          char: 해수
          with: [은숙]
          text: "스무 자루 둬요."
      - say:
          char: 은숙
          with: [해수]
          text: "어제 마감 때 몇 자루였어요?"
      - say:
          char: 해수
          with: [은숙]
          text: "스무 자루요."
      - say:
          char: 해수
          with: [은숙]
          text: "마감할 때 세거든요."
      - say:
          char: 은숙
          with: [해수]
          text: "오늘 아침에는 열아홉 자루였대요."
      - say:
          char: 은숙
          with: [해수]
          text: "민지영 주임님이 세 봤어요. 제가 부탁해서."
      - say:
          char: 해수
          with: [은숙]
          text: "…그럼 하나가 없네요."
      - say:
          char: 은숙
          with: [해수]
          text: "한 자루가 부족해요. 피해자분한테서 나온 연필이 같은 종류고요."
      - say:
          char: 은숙
          with: [해수]
          text: "마감할 때 세신다고 하셨죠. 왜 세세요?"
      - say:
          char: 해수
          with: [은숙]
          text: "손님들이 가져가셔서요."
      - say:
          char: 해수
          with: [은숙]
          text: "스무 자루 맞춰 놓는 게 제 업무예요."
      - say:
          char: 은숙
          with: [해수]
          text: "열두 해 동안 매일요?"
      - say:
          char: 해수
          with: [은숙]
          text: "네."
      - say:
          char: 은숙
          with: [해수]
          text: "그러면 어제 스무 자루였다는 걸 확인하신 분은 해수 씨뿐이네요."
      - say:
          channel: thought
          with: []
          text: "마감표에는 연필 자루 수를 적지 않는다. 세는 모습을 본 사람도 없다."
      - emote: { id: 해수, motion: shiver }
      - clearSticker: { id: pencil, leave: fadeOut }
      - say:
          char: 은숙
          with: [해수]
          text: "하나 더. 오광철 씨가 지난 일주일 동안 112에 세 번 전화했어요."
      - say:
          char: 은숙
          with: [해수]
          text: "밤마다 누가 소리를 지른다고."
      - say:
          char: 은숙
          with: [해수]
          text: "혼자 사는 집에서. 출동하면 아무도 없고."
      - say:
          channel: record
          when: { var: rage, op: eq, value: 1 }
          with: []
          text: "112 접수 요지 · 4/16 01:52 · 신고자 진술 \"무슨 말인지는 모르겠고 계속 지르기만 한다\""
      - say:
          channel: record
          when: { var: rage, op: gte, value: 2 }
          with: []
          text: "112 접수 요지 · 4/16 01:52 · 신고자 진술 \"혼자 다 먹지도 못하면서 왜 사느냐고 한다\""
      - say:
          char: 은숙.sharp
          when: { var: rage, op: gte, value: 2 }
          with: [해수]
          text: "신고할 때 저 말을 그대로 따라 했대요. 해수 씨는 어디서 들어 본 적 없으세요?"
      - say:
          char: 해수.shaken
          when: { var: rage, op: gte, value: 2 }
          with: [은숙]
          text: "…그러네요."
      - say:
          char: 은숙
          with: [해수]
          text: "그리고 어제 낮에 이 마트 고객센터 앞에 한 시간 서 있었대요."
      - say:
          char: 은숙
          with: [해수]
          text: "아무것도 안 사고. 귀를 자꾸 누르면서."
      - say:
          channel: record
          with: []
          text: "피해자 휴대폰 메모 · 4/17 13:02 · 고객센터 그 친구한테 사과할 것"
      - say:
          char: 은숙
          with: [해수]
          text: "그 친구가 정해수 씨예요?"
      - move: { id: 해수, toward: 은숙, style: flinch }
      - say:
          char: 해수.shaken
          with: [은숙]
          text: "…어제는 제가 그 시간에 창구에 앉아 있었어요."
      - sticker: { id: complaint, image: complaint_sticker, x: 64, y: 32, width: "260px", rotate: 2, enter: fadeIn }
      - say:
          char: 은숙
          with: [해수]
          text: "지난 토요일에 낸 민원에도 정해수 씨 이름을 쓰셨더라고요."
      - say:
          char: 은숙
          with: [해수]
          text: "‘고객의 소리’ 원본은 가져갈게요."
      - clearSticker: { id: complaint, leave: fadeOut }
      - say:
          char: 은숙
          with: [해수]
          text: "또 연락드릴게요. 휴대폰 꺼 두지 마세요. 물 안 드셨네."

  tamper:
    title: "튜토리얼 4/5"
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 800 }
      - place: "4월 18일 밤 11:30 · 해수의 방"
      - bg: { id: sim_desk, transition: wipeRight, duration: 900 }
      - music: tutorial
      - say:
          channel: system
          with: []
          text: "레플라 · 모의 녹화실\n튜토리얼 4/5 — 바꿔 보세요."
      - say:
          channel: system
          with: []
          text: "물건을 바꾸면 변경 사항이 자동으로 저장됩니다."
      - say:
          channel: action
          with: []
          text: "녹화실 책상에 낮에 은숙이 가져간 접수증이 놓여 있다. 접었다 편 자국까지 같다."
      - say:
          channel: thought
          with: []
          text: "눈만 감으면 그 차 문이 열렸다. 한 번만 다시 보고 끄려고 밴드를 붙였다."
      - say:
          char: 해수
          with: []
          text: "…이게 왜 여기 있어."
      - say:
          channel: system
          with: []
          text: "오늘 근무 중 취급한 물품이 이 방에 배치됩니다. 사용자 편의 기능입니다."
      - say:
          channel: thought
          with: []
          text: "접수증 위에 놓인 연필을 보고 나도 모르게 손을 등 뒤로 뺐다."
      - say:
          channel: thought
          with: []
          text: "3단계 때 세 걸음이었다. 여기서는 손을 뻗으면 닿는다."
      - say:
          channel: action
          with: []
          text: "용지 귀퉁이가 손끝에 걸린다. 힘을 주자 종이에 자국이 났다."
      - say:
          channel: thought
          with: []
          text: "창구에서 받은 용지를 쥘 때도 이랬다."
      - goto: tamper_pick

  tamper_pick:
    actions:
      - choice:
          key: t2_tamper
          presentation: explore
          prompt: "낮에 본 고객의 소리 용지, 연필꽂이, 주차장 CCTV 화면이 그대로다."
          with: []
          camera: wide
          options:
            - text: "고객의 소리 용지"
              at: { x: 30, y: 60 }
              when: { var: t_form, op: eq, value: false }
              set: { t_form: true }
              add: { tampered: 1 }
              goto: tamper_form
            - text: "연필꽂이"
              at: { x: 70, y: 58 }
              when: { var: t_pencil, op: eq, value: false }
              set: { t_pencil: true }
              add: { tampered: 1 }
              goto: tamper_pencil
            - text: "CCTV 모니터"
              at: { x: 52, y: 22 }
              when: { var: t_cctv, op: eq, value: false }
              set: { t_cctv: true }
              add: { tampered: 1 }
              goto: tamper_cctv
            - text: "아무것도 건드리지 않고 로그아웃한다"
              when: { var: tampered, op: eq, value: 0 }
              add: { honest: 1 }
              goto: no_tamper
            - text: "로그아웃한다"
              when: { var: tampered, op: gt, value: 0 }
              goto: tamper_done

  tamper_form:
    actions:
      - say:
          channel: action
          with: []
          text: "‘대상 직원’ 칸에서 내 이름을 문지르니 검은 글씨가 종이에서 벗겨진다."
      - say:
          channel: record
          with: []
          erase: true
          text: "정해수"
      - say:
          channel: system
          with: []
          text: "변경 사항이 저장되었습니다."
      - say:
          channel: thought
          with: []
          text: "손을 떼자 칸이 비었다. 사원증에는 아직 정해수라고 적혀 있다."
      - goto: tamper_pick

  tamper_pencil:
    actions:
      - say:
          channel: record
          with: []
          erase: true
          text: "그린마트 연필 20 · 초록 로고"
      - say:
          channel: action
          with: []
          text: "연필 스무 자루 중 하나를 집어 로고를 엄지로 문지른다. 세 번 문지르자 초록이 없어진다."
      - say:
          channel: thought
          with: []
          text: "로고가 지워지니 한 자루를 골라 바꿔 놔도 내 눈에 안 띌 것 같다."
      - say:
          channel: system
          with: []
          text: "변경 사항이 저장되었습니다."
      - goto: tamper_pick

  tamper_cctv:
    actions:
      - sticker: { id: cctv, image: cctv_sticker, x: 64, y: 30, width: "320px", enter: wipeCenterX }
      - say:
          channel: record
          with: []
          text: "B2-C 카메라 · 4/18 01:40–02:20 · 등장 인물 2명"
      - say:
          channel: record
          with: []
          erase: true
          text: "01:58 · C-14 · 인물 2명 접근"
      - say:
          channel: action
          with: []
          text: "재생 막대를 옮겨 두 사람이 다가오는 구간을 고른다. 한 사람의 걷는 모습이 낯익다."
      - say:
          channel: thought
          with: []
          text: "재생 막대를 옮기자 같은 차 문이 한 번 더 열린다."
          continueLabel: "두 사람이 나온 구간을 비운다"
      - say:
          channel: system
          with: []
          text: "구간을 다시 저장했습니다 · 등장 인물 0명"
      - clearSticker: { id: cctv, leave: fadeOut }
      - goto: tamper_pick

  no_tamper:
    actions:
      - say:
          char: 해수
          motion: bow
          with: []
          text: "괜찮습니다."
      - say:
          char: 해수
          motion: bow
          with: []
          text: "그대로 둘게요."
      - say:
          channel: system
          with: []
          text: "튜토리얼 4/5는 건너뛸 수 없습니다. 다음 접속 시 다시 시작합니다."
      - goto: changed

  tamper_done:
    actions:
      - say:
          channel: system
          with: []
          text: "튜토리얼 4/5 완료. 잘하셨습니다."
      - goto: changed

  changed:
    title: "바뀐 것"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 800 }
      - music: bleed
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - place: "다음 날, 4월 19일 오후 · 그린마트 고객센터"
      - say:
          char: 해수.service
          motion: bow
          with: [은숙]
          text: "고객님, 번호표를 먼저…"
      - say:
          char: 은숙
          with: [해수]
          text: "손님 아니에요."
      - say:
          char: 은숙
          when: { var: t_form, op: eq, value: true }
          with: [해수]
          text: "접수증 원본을 다시 봤는데요."
      - say:
          char: 은숙
          when: { var: t_form, op: eq, value: true }
          with: [해수]
          text: "대상 직원 칸이 비어 있어요."
      - say:
          char: 은숙
          when: { var: t_form, op: eq, value: true }
          with: [해수]
          text: "제가 어제 찍은 사진에도 비어 있고."
      - say:
          char: 은숙
          when: { var: t_form, op: eq, value: true }
          with: [해수]
          text: "찍을 때는 분명히 이름이 있었거든요."
      - say:
          char: 은숙
          when: { var: t_pencil, op: eq, value: true }
          with: [해수]
          text: "감식 결과가 나왔는데요. 흉기에서 로고가 안 보인대요."
      - say:
          char: 은숙
          when: { var: t_pencil, op: eq, value: true }
          with: [해수]
          text: "그린마트 거 아니래요."
      - say:
          char: 은숙
          when: { var: t_pencil, op: eq, value: true }
          with: [해수]
          text: "제가 이 눈으로 봤는데."
      - say:
          char: 은숙
          when: { var: t_cctv, op: eq, value: true }
          with: [해수]
          text: "C구역 카메라 3월부터 고장이었잖아요."
      - say:
          char: 은숙
          when: { var: t_cctv, op: eq, value: true }
          with: [해수]
          text: "근데 그날 새벽 1시 40분부터 40분짜리 영상이 생겼어요."
      - say:
          char: 은숙
          when: { var: t_cctv, op: eq, value: true }
          with: [해수]
          text: "아무도 안 나와요. 차 한 대만 서 있고."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "전산 기록이면 누가 수정했을 수도 있죠."
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "근데 제 휴대폰에 있는 사진까지 바뀌었어요."
      - mood: { tone: dread, level: 1 }
      - say:
          char: 은숙
          with: [해수]
          text: "제 폰으로 찍었어요. 어제 녹화실에서."
      - say:
          char: 해수.service
          with: [은숙]
          text: "…저는 그런 건 잘 몰라서요, 고객님."
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "고객님 아니에요. 아까도 말했어요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "접수증은 그대로예요. 대상 직원 정해수."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "연필도 그대로, 로고도 그대로."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "오광철 씨가 죽기 전날 이 창구에 한 시간이나 서 있었어요. 해수 씨를 찾아왔고요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "빌라 현관 CCTV를 보면 그날 밤 집에 들어간 뒤 아침까지 안 나왔어요."
      - say:
          char: 해수.blank
          motion: nod
          with: [은숙]
          text: "다시 한번 확인해 보시겠어요?"
      - move: { id: 은숙, style: reset }
      - sound: chime
      - say:
          channel: system
          with: []
          text: "번호표 · 052번 · 대기 0명"
      - mood: off
      - say:
          char: 은숙
          with: [해수]
          text: "뽑았어요. 다음엔 이걸로 올게요."

      - emote: { id: 해수, motion: bow, wait: true }
  rumor:
    title: "3층"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 600 }
      - char: { id: 지영, position: left, emotion: worried }
      - char: { id: 경준, position: right }
      - move: { id: 경준, toward: 지영, style: approach }
      - say:
          char: 경준
          motion: lean_in
          with: [지영]
          delivery: whisper
          text: "어제 상혁 씨 때문에 3층에서 일 났대요."
      - say:
          char: 지영
          with: [경준]
          text: "쉿."
      - say:
          char: 경준
          motion: bounce
          with: [지영]
          delivery: whisper
          text: "화장품 코너 손님을 따라갔대요. 주차장까지. 이름 부르면서. 아는 사람이라고."
      - say:
          char: 지영.worried
          motion: sigh
          with: [경준]
          text: "손님은 상혁 씨를 처음 본대. 신고도 들어왔고. 일단 출근하지 말랬어."
      - move: { id: 경준, style: reset }
      - char: { id: 해수, position: center }
      - say:
          char: 지영
          with: [해수]
          text: "해수야. 집에서 상혁이 어떻게 지내?"
      - say:
          char: 해수
          with: [지영]
          text: "방에 있어요."
      - say:
          char: 해수
          with: [지영]
          text: "문 잠그고."
      - say:
          char: 해수
          when: { var: sh_night, op: eq, value: true }
          with: [지영]
          text: "그저께 밤에는 방에 없었어요."
      - say:
          char: 해수
          when: { var: sh_night, op: eq, value: true }
          with: [지영]
          text: "차에 있었대요."
      - say:
          char: 지영
          with: [해수]
          text: "이름까지 불렀다잖아. 손님은 모르는데 상혁 씨는 아는 이름이었던 거야."
      - say:
          char: 지영.worried
          with: [해수]
          text: "레플라에서 만났다고 생각하나 봐."
      - say:
          char: 해수
          with: [지영]
          text: "…거기서 만난 사람이 여기서도 자기 알아볼 줄 알았나 봐요."
      - say:
          char: 지영
          with: [해수]
          text: "아직도 그 손님한테 왜 자기를 모른다고 하느냐고 따진대."
      - say:
          char: 지영
          with: [해수]
          text: "밥은 먹고 다녀?"
      - say:
          char: 해수
          with: [지영]
          text: "네. 먹었어요."
      - say:
          char: 지영
          with: [해수]
          text: "뭐 먹었는데."
      - say:
          char: 해수
          with: [지영]
          text: "…있는 거 먹었어요."
      - say:
          char: 지영.worried
          motion: headtilt
          with: [해수]
          text: "너도 요새 얼굴이 안 좋아. 잠은 자?"

  new_lock:
    title: "도어락"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
      - say:
          channel: action
          with: []
          text: "그날 밤 집에 돌아오니 상혁의 방문에 새 도어락이 달려 있다. 숫자 1, 2, 7, 0 자리만 손때가 묻어 있다."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "해수야? 해수 맞지."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "걔가 나 모른대. 여기서는 나를 모른대. 거기서는 아는데."
      - say:
          char: 해수
          with: []
          text: "물 두 병 문 앞에 둘게."
      - say:
          channel: thought
          with: []
          text: "생수는 샀다. 휴지는 또 못 샀다."
