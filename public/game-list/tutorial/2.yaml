chapterTitle: "C-14"

script:
  - scene: news
  - scene: bathroom
  - scene: tape
  - scene: interview
  - scene: interview_rest
  - scene: tamper
  - scene: changed
  - scene: rumor
  - scene: new_lock

scenes:
  news:
    title: "단톡방"
    actions:
      - bg: { id: haesu_room, transition: cut }
      - music: bleed
      - say:
          channel: system
          with: []
          text: "속보 · 오전 7:30 · 서울 중랑구 대형마트 지하주차장서 50대 남성 숨진 채 발견 · 새벽 5시 10분 주차 관리원 신고 · 경찰 타살 가능성 수사"
      - say:
          channel: system
          with: []
          text: "상봉점 고객센터 (3) · 4월 18일 금요일 오전 7:41"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 형 뉴스 봤어요??? 우리 지하주차장"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "경찰차 네 대 와 있어요 저 지금 버스정류장인데 다 보여요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "오픈 11시로 미룬대 본사 공지 옴"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "주임님 그럼 저 11시까지 가면 돼요? 지금 버스 안인데"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "내려서 집에 갔다 와 두 정거장이잖아"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "집에 가면 다시 못 나와요 저는"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "즉석밥 아저씨래요"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "확실하지도 않은 거 단톡에 쓰지 마"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "죄송합니다"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "근데 맞대. 보안팀 김 기사님이 봤대. 지하 주차장"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          erase: true
          text: "어디쯤이요"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "네 알겠습니다 11시까지 가겠습니다"

  bathroom:
    title: "칫솔"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 700 }
      - place: "오전 7:58 · 집"
      - char: { id: 해수, position: left }
      - char: { id: 상혁, position: right }
      - say:
          char: 상혁.grin
          with: [해수]
          text: "아, 깼어?"
      - say:
          char: 해수
          with: [상혁]
          text: "너 어제 밥 안 먹었지. 냄비 그대로야."
      - say:
          char: 상혁
          with: [해수]
          text: "먹었어. 씻어 놓은 거야."
      - say:
          char: 해수
          with: [상혁]
          text: "물이 그대로 있어."
      - say:
          char: 상혁.grin
          with: [해수]
          text: "너는 아침부터 냄비를 왜 봐."
      - say:
          char: 해수
          with: [상혁]
          text: "어디 갔다 와?"
      - say:
          char: 상혁
          with: [해수]
          text: "편의점."
      - say:
          char: 해수
          with: [상혁]
          text: "뭐 샀는데."
      - say:
          char: 상혁
          with: [해수]
          text: "…생각해 보니까 살 게 없더라고."
      - say:
          char: 해수
          with: [상혁]
          text: "아무것도 안 샀네. …세면대 컵에 칫솔이 세 개야. 방문은 열려 있고."
      - say:
          char: 상혁
          motion: laugh
          with: [해수]
          text: "아, 머리끈도 봤어? 걔 거야. 놓고 갔네."
      - say:
          char: 해수
          with: [상혁]
          text: "누구?"
      - say:
          char: 상혁.grin
          with: [해수]
          text: "…아. 너는 모르지. 됐어."
      - choice:
          key: t2_sh
          prompt: "상혁이 머리끈을 집어 손목에 낀다."
          char: 해수
          options:
            - text: "모른 척하고 신발을 신는다"
              goto: sh_shoes
            - text: "\"너 어젯밤에 어디 있었어?\""
              set: { sh_night: true }
              goto: sh_where
            - text: "\"오늘 하루만 하지 마. 그거.\""
              add: { sh_care: 1, honest: 1 }
              goto: sh_stop

  sh_shoes:
    actions:
      - say:
          channel: action
          with: []
          text: "해수가 운동화 끈을 묶는 동안 등 뒤에서 상혁의 방문이 닫힌다."
      - goto: tape

  sh_where:
    actions:
      - say:
          char: 상혁
          with: [해수]
          text: "집. 계속 집."
      - move: { id: 해수, toward: 상혁, style: approach }
      - say:
          char: 해수
          with: [상혁]
          text: "방에 없던데. 새벽에."
      - move: { id: 상혁, toward: 해수, style: retreat }
      - say:
          char: 상혁.hollow
          with: [해수]
          text: "…있었어. 걔랑. 차에 있었나. 기억이 섞여, 요새."
      - move: { id: 해수, style: reset }
      - move: { id: 상혁, style: reset }
      - goto: tape

  sh_stop:
    actions:
      - say:
          char: 상혁
          with: [해수]
          text: "너도 하잖아."
      - say:
          char: 해수
          motion: nod
          with: [상혁]
          text: "응. 나도 오늘은 안 할게."
      - say:
          char: 상혁.hollow
          with: [해수]
          text: "…생각해 볼게. 진짜로. 생각은 해 볼게."
      - goto: tape

  tape:
    title: "노란 테이프"
    actions:
      - bg: { id: parking_real, transition: fade, duration: 900 }
      - place: "오전 10:40 · B2 내려가는 계단참"
      - char: { id: 경준, position: left }
      - char: { id: 해수, position: center }
      - char: { id: 은숙, position: right }
      - say:
          char: 경준
          motion: lean_in
          with: [해수]
          delivery: whisper
          text: "형. 가림막 때문에 아래가 하나도 안 보여요. 아저씨 차 맨날 여기 세웠잖아요. 엘리베이터 가까운 데."
      - say:
          char: 은숙
          with: [경준]
          text: "실례합니다. 중랑경찰서 차은숙 경위입니다. 고객센터 분 계세요? 정해수 씨."
      - say:
          char: 경준
          motion: startle
          with: []
          delivery: whisper
          text: "…형 이름을 왜 알아요?"
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙
          with: [해수]
          text: "피해자분 일로 몇 가지 여쭤볼게요. 참고인으로요. 서까지 같이 가 주시겠어요?"
      - emote: { id: 해수, motion: nod, wait: true }
      - say:
          char: 경준
          with: []
          delivery: whisper
          text: "형, 앞치마 주세요. 제가 사물함에 넣어 놓을게요. 주임님한테는 형 화장실 갔다고 할게요."

  interview:
    title: "진술 녹화실"
    actions:
      - bg: { id: police_room, transition: fade, duration: 900 }
      - say:
          channel: record
          with: []
          text: "진술 녹화 · 2031.04.18 14:02 · 중랑경찰서 · 참고인 정해수(31) · 조사관 차은숙 경위"
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - say:
          char: 은숙
          with: [해수]
          text: "물 드릴까요."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "아, 괜찮습니다. 감사합니다."
      - say:
          char: 은숙
          with: [해수]
          text: "그냥 드릴게요. 다들 중간에 달라고 해서."
      - say:
          char: 은숙
          with: [해수]
          text: "오광철 씨 아시죠."
      - say:
          char: 해수
          with: [은숙]
          text: "네. 저희 고객님이세요."
      - say:
          char: 은숙
          with: [해수]
          text: "이셨죠."
      - say:
          char: 해수
          motion: bow
          with: [은숙]
          text: "…죄송합니다."
      - say:
          char: 은숙
          motion: headtilt
          with: [해수]
          text: "제가 사과받을 일은 아니고요. 어제 몇 시에 퇴근하셨어요?"
      - say:
          char: 해수
          with: [은숙]
          text: "열 시 십 분이요. 마감 정산하고 나왔습니다."
      - say:
          char: 은숙
          with: [해수]
          text: "그다음은."
      - say:
          char: 해수
          with: [은숙]
          text: "집에 가서 잤습니다."
      - say:
          char: 은숙
          with: [해수]
          text: "피해자분이 어디서 발견됐는지는 들으셨어요?"
      - move: { id: 은숙, toward: 해수, style: approach }
      - choice:
          key: t2_where
          prompt: "은숙 앞의 녹음기에 빨간 불이 켜져 있다."
          char: 해수
          options:
            - text: "\"지하 주차장이라고만 들었습니다.\""
              goto: where_safe
            - text: "\"C-14 기둥 쪽… 아닌가요?\""
              gameOver:
                title: "아무도 말하지 않은 번호"
                message: "C-14는 아직 현장 보고서에만 있던 기둥 번호였다. 단톡방에도, 계단참에도 없었다. 차은숙 경위는 녹화를 멈추지 않았다. 그 번호를 어디서 봤는지 떠올려 보자."
                recoverToChoice: t2_where
            - text: "\"단톡방을 안 봐서요. 잘 모릅니다.\""
              add: { doubt: 1 }
              goto: where_lie

  where_safe:
    actions:
      - say:
          char: 은숙
          motion: nod
          with: [해수]
          text: "네. 지하 2층이에요."
      - goto: interview_rest

  where_lie:
    actions:
      - say:
          char: 은숙.sharp
          with: [해수]
          text: "단톡방은 경준 씨가 보여 줬어요. 정해수 씨가 아침에 '11시까지 가겠습니다' 답장했던데요. 지하 주차장 얘기 바로 밑에."
      - say:
          char: 해수
          motion: droop
          with: [은숙]
          text: "…지하 주차장이라고는 봤습니다. 죄송합니다."
      - goto: interview_rest

  interview_rest:
    actions:
      - say:
          channel: record
          with: []
          text: "현장 · 그린마트 상봉점 B2 C-14 기둥 옆 · 사망 추정 4/18 01:30–02:30 · 발견 05:10 (주차 관리원) · 흉기: 연필 1자루, 끝에 그린마트 로고"
      - move: { id: 은숙, style: reset }
      - sticker: { id: pencil, image: pencil_sticker, x: 64, y: 36, width: "300px", rotate: -18, enter: fadeIn }
      - say:
          char: 은숙
          with: [해수]
          text: "이 연필. 고객센터에 있는 거 맞죠."
      - say:
          char: 해수
          with: [은숙]
          text: "네. 연필꽂이에 있는 거랑 같아요. 스무 자루 둬요."
      - say:
          char: 은숙
          with: [해수]
          text: "어제 마감 때 몇 자루였어요?"
      - say:
          char: 해수
          with: [은숙]
          text: "스무 자루요. 마감할 때 세거든요."
      - say:
          char: 은숙
          with: [해수]
          text: "오늘 아침에는 열아홉 자루였대요. 민지영 주임님이 세 봤어요. 제가 부탁해서."
      - emote: { id: 해수, motion: shiver }
      - clearSticker: { id: pencil, leave: fadeOut }
      - say:
          char: 은숙
          with: [해수]
          text: "하나 더. 오광철 씨가 지난 일주일 동안 112에 세 번 전화했어요. 밤마다 누가 소리를 지른다고. 혼자 사는 집에서. 출동하면 아무도 없고."
      - say:
          char: 은숙
          with: [해수]
          text: "그리고 어제 낮에 이 마트 고객센터 앞에 한 시간 서 있었대요. 아무것도 안 사고. 귀를 자꾸 누르면서."
      - say:
          channel: record
          with: []
          text: "피해자 휴대폰 메모 · 4/17 13:02 · 고객센터 그 친구한테 사과할 것"
      - say:
          char: 은숙
          with: [해수]
          text: "그 친구가 정해수 씨예요?"
      - move: { id: 해수, toward: 은숙, style: flinch }
      - say:
          char: 해수.shaken
          with: [은숙]
          text: "…저희 고객센터에 저랑 주임님밖에 없어서요."
      - sticker: { id: complaint, image: complaint_sticker, x: 64, y: 32, width: "260px", rotate: 2, enter: fadeIn }
      - say:
          char: 은숙
          with: [해수]
          text: "지난주 토요일에는 정해수 씨 이름으로 민원을 넣으셨고. 고객의 소리. 이거 원본 저희가 가져가요."
      - clearSticker: { id: complaint, leave: fadeOut }
      - say:
          char: 은숙
          with: [해수]
          text: "또 연락드릴게요. 휴대폰 꺼 두지 마세요. 물 안 드셨네."

  tamper:
    title: "튜토리얼 4/5"
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 800 }
      - place: "4월 18일 밤 11:30 · 해수의 방"
      - bg: { id: sim_desk, transition: wipeRight, duration: 900 }
      - music: tutorial
      - say:
          channel: system
          with: []
          text: "튜토리얼 4/5 — 바꿔 보세요."
      - say:
          channel: system
          with: []
          text: "레플라 안의 물건은 바꾼 대로 자동 저장됩니다."
      - goto: tamper_pick

  tamper_pick:
    actions:
      - choice:
          key: t2_tamper
          presentation: explore
          prompt: "고객의 소리 용지, 스무 자루 연필, B2-C 카메라 화면. 오늘 녹화실에서 나온 것들이다."
          with: []
          camera: wide
          options:
            - text: "고객의 소리 용지"
              at: { x: 30, y: 60 }
              when: { var: t_form, op: eq, value: false }
              set: { t_form: true }
              add: { tampered: 1 }
              goto: tamper_form
            - text: "연필꽂이"
              at: { x: 70, y: 58 }
              when: { var: t_pencil, op: eq, value: false }
              set: { t_pencil: true }
              add: { tampered: 1 }
              goto: tamper_pencil
            - text: "CCTV 모니터"
              at: { x: 52, y: 22 }
              when: { var: t_cctv, op: eq, value: false }
              set: { t_cctv: true }
              add: { tampered: 1 }
              goto: tamper_cctv
            - text: "아무것도 건드리지 않고 로그아웃한다"
              when: { var: tampered, op: eq, value: 0 }
              add: { honest: 1 }
              goto: no_tamper
            - text: "로그아웃한다"
              when: { var: tampered, op: gt, value: 0 }
              goto: tamper_done

  tamper_form:
    actions:
      - say:
          channel: record
          with: []
          erase: true
          text: "대상 직원: 정해수"
      - say:
          channel: system
          with: []
          text: "변경 사항이 저장되었습니다."
      - goto: tamper_pick

  tamper_pencil:
    actions:
      - say:
          channel: record
          with: []
          erase: true
          text: "그린마트 연필 20 · 초록 로고"
      - say:
          channel: system
          with: []
          text: "변경 사항이 저장되었습니다."
      - goto: tamper_pick

  tamper_cctv:
    actions:
      - sticker: { id: cctv, image: cctv_sticker, x: 64, y: 30, width: "320px", enter: wipeCenterX }
      - say:
          channel: record
          with: []
          text: "B2-C 카메라 · 4/18 01:40–02:20 · 등장 인물 2명"
      - say:
          channel: record
          with: []
          erase: true
          text: "01:58 · C-14 · 인물 2명 접근"
      - say:
          channel: system
          with: []
          text: "구간을 다시 저장했습니다 · 등장 인물 0명"
      - clearSticker: { id: cctv, leave: fadeOut }
      - goto: tamper_pick

  no_tamper:
    actions:
      - say:
          char: 해수
          motion: bow
          with: []
          text: "괜찮습니다. 그대로 둘게요."
      - say:
          channel: system
          with: []
          text: "튜토리얼 4/5는 건너뛸 수 없습니다. 다음 접속 시 다시 시작합니다."
      - goto: changed

  tamper_done:
    actions:
      - say:
          channel: system
          with: []
          text: "튜토리얼 4/5 완료. 잘하셨습니다."
      - goto: changed

  changed:
    title: "바뀐 것"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 800 }
      - music: bleed
      - char: { id: 해수, position: left }
      - char: { id: 은숙, position: right }
      - place: "4월 19일 오후 · 고객센터"
      - say:
          char: 해수.service
          motion: bow
          with: [은숙]
          text: "고객님, 번호표를 먼저…"
      - say:
          char: 은숙
          with: [해수]
          text: "손님 아니에요."
      - say:
          char: 은숙
          when: { var: t_form, op: eq, value: true }
          with: [해수]
          text: "접수증 원본을 다시 봤는데요. 대상 직원 칸이 비어 있어요. 제가 어제 찍은 사진에도 비어 있고. 찍을 때는 분명히 이름이 있었거든요."
      - say:
          char: 은숙
          when: { var: t_pencil, op: eq, value: true }
          with: [해수]
          text: "흉기 연필, 감식에서 로고가 없대요. 그린마트 거 아니래요. 제가 이 눈으로 봤는데."
      - say:
          char: 은숙
          when: { var: t_cctv, op: eq, value: true }
          with: [해수]
          text: "C구역 카메라 3월부터 고장이었잖아요. 근데 그날 새벽 1시 40분부터 40분짜리 영상이 생겼어요. 아무도 안 나와요. 차 한 대만 서 있고."
      - move: { id: 은숙, toward: 해수, style: approach }
      - say:
          char: 은숙.sharp
          when: { var: tampered, op: gt, value: 0 }
          with: [해수]
          text: "기록이 바뀌는 건 봤어요. 사람이 바꾸는 거. 사진이 바뀌는 건 처음 봐요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "접수증은 그대로예요. 대상 직원 정해수. 연필도 그대로, 로고도 그대로. 정해수 씨는 계속 제 목록 맨 위에 있어요."
      - say:
          char: 은숙
          when: { var: tampered, op: eq, value: 0 }
          with: [해수]
          text: "근데 정해수 씨 빌라 현관 CCTV에는 그날 밤 정해수 씨가 한 번도 안 나와요. 들어간 것만 있고."
      - say:
          char: 해수.blank
          motion: nod
          with: [은숙]
          text: "다시 한번 확인해 보시겠어요?"
      - move: { id: 은숙, style: reset }
      - sound: chime
      - say:
          channel: system
          with: []
          text: "번호표 · 052번 · 대기 0명"
      - say:
          char: 은숙
          with: [해수]
          text: "뽑았어요. 다음엔 이걸로 올게요."

      - emote: { id: 해수, motion: bow, wait: true }
  rumor:
    title: "3층"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 600 }
      - char: { id: 지영, position: left, emotion: worried }
      - char: { id: 경준, position: right }
      - move: { id: 경준, toward: 지영, style: approach }
      - say:
          char: 경준
          motion: lean_in
          with: [지영]
          delivery: whisper
          text: "상혁 씨 어제 3층에서 일 났대요."
      - say:
          char: 지영
          with: [경준]
          text: "쉿."
      - say:
          char: 경준
          motion: bounce
          with: [지영]
          delivery: whisper
          text: "화장품 코너 손님을 따라갔대요. 주차장까지. 이름 부르면서. 아는 사람이라고."
      - say:
          char: 지영.worried
          motion: sigh
          with: [경준]
          text: "손님은 처음 보는 사람이래. 신고 들어갔어. 상혁 씨 오늘부터 안 나와. 무기한."
      - move: { id: 경준, style: reset }
      - char: { id: 해수, position: center }
      - say:
          char: 지영
          with: [해수]
          text: "해수야. 너네 집에서 걔 괜찮아?"
      - say:
          char: 해수
          with: [지영]
          text: "방에 있어요. 문 잠그고."
      - say:
          char: 해수
          when: { var: sh_night, op: eq, value: true }
          with: [지영]
          text: "그저께 밤에는 방에 없었어요. 차에 있었대요."
      - say:
          char: 지영
          with: [해수]
          text: "밥은 먹고 다녀?"
      - say:
          char: 해수
          with: [지영]
          text: "네. 먹었어요."
      - say:
          char: 지영
          with: [해수]
          text: "뭐 먹었는데."
      - say:
          char: 해수
          with: [지영]
          text: "…있는 거 먹었어요."
      - say:
          char: 지영.worried
          motion: headtilt
          with: [해수]
          text: "너도 얼굴이 그래. 둘 다 그래."

  new_lock:
    title: "도어락"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 900 }
      - say:
          channel: action
          with: []
          text: "상혁의 방문에 새 도어락이 달려 있다. 숫자판 1, 2, 7, 0에만 손때가 묻어 있다."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "해수야? 해수 맞지."
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "걔가 나 모른대. 여기서는 나를 모른대. 거기서는 아는데."
      - say:
          char: 해수
          with: []
          text: "물 두 병 문 앞에 둘게."
      - say:
          channel: thought
          with: []
          text: "생수는 샀다. 휴지는 또 못 샀다."
