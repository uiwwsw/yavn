title: "튜토리얼"
pov: "정해수"
author:
  name: "uiwwsw"
version: "1.6.2"
seo:
  description: "마트 고객센터에서 12년째 일하는 정해수가 현실을 복제한 레플라에 접속한다. 체험판에서 손님에게 처음으로 화를 낸 뒤, 가상 매장에서 한 말과 행동이 현실로 새어 나오기 시작한다. 5장 SF 미스터리, 결말 4종."
  keywords:
    - "SF 미스터리"
    - "비주얼노벨"
    - "시뮬레이션"
    - "반전"
  image: "assets/bg/title.svg"
  imageAlt: "마트 고객센터가 오른쪽에서 청색 도면으로 이어지는 그림"
textSpeed: 34
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: paper-stage
legalNotices:
  - id: content-warning
    title: "내용 안내"
    text: "이 작품에는 고객의 폭언, 살인 사건과 죽음, 경찰 조사, 중독과 집착(성적 묘사 없음)이 나옵니다. 폭력 장면은 화면 밖에서 소리로만 처리합니다."
startScreen:
  enabled: true
  music: assets/music/fluoro.flac
  image: assets/bg/title.svg
  imagePosition: "50% 50%"
  mobileImagePosition: "60% 50%"
  showTitle: true
  titleColor: "#f2fbf5"
  startButtonText: "튜토리얼 시작"
  buttonPosition: bottom-left
  eyebrow: "근미래 · SF 미스터리 · 5장 · 결말 4종"
  subtitle: "퇴근하고 체험판을 켰다. 고객센터였다. 낮에 보던 번호표 호출기에 027이 떠 있었다."
  scene:
    layout: split
    motion: drift
    duration: 28000
    parallax: 8
    particles: none
    intensity: 0.3
    fog: false
    light: breathe
    accent: "#7bafcb"
endings:
  disconnected:
    title: "연결 해제"
    message: "USER 0002부터 USER 1104331까지 연결 해제. USER 0001 — 해당 없음."
    epilogue: "그린마트 상봉점 고객센터 연필꽂이에는 오늘도 연필이 스무 자루 꽂혀 있다."
    background: cs_desk_bleed
    music: bleed
    tone: tragic
  still_online:
    title: "접속 유지"
    message: "새 사용자 USER 1104332 · 튜토리얼 안내자 USER 0001 · 최초 접속 2019.04.11 14:52"
    epilogue: "오늘도 레플라 신규 가입자는 튜토리얼 1/5부터 시작한다. 넘기기 버튼은 오른쪽 위에 있다."
    background: cs_desk_bleed
    music: tutorial
    tone: mystery
  session_closed:
    title: "세션 종료"
    message: "USER 0001 · 2019.04.11 14:52 접속 · 2031.04.23 03:20 종료."
    epilogue: "다음번에 마감을 바꿔 달라는 문자가 왔을 때, 해수는 어렵다고 답했다. 지영은 알았다고 했다. 해수는 답장을 한 번 더 읽고 휴대폰을 넣었다."
    background: cs_desk
    music: fluoro
    tone: hopeful
  demo_left:
    title: "체험 중단"
    message: "튜토리얼 3/5 · 기기 연결 끊김"
    epilogue: "아침에 상혁이 나가며 현관문을 두드렸다. 해수는 밴드를 돌려주러 가는 길에 같이 아침이나 먹자고 했다."
    background: haesu_room
    music: fluoro
    tone: hopeful
defaultEnding: disconnected
