chapterTitle: "체험판"

script:
  - scene: complaint
  - scene: breakroom
  - scene: night
  - scene: onboarding
  - scene: tutorial_one
  - scene: tutorial_two
  - scene: sessions
  - scene: hallway
  - scene: quiet_customer
  - scene: tutorial_three
  - scene: morning

scenes:
  complaint:
    title: "031번"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 700, place: "4월 12일 오후 · 그린마트 고객센터" }
      - music: fluoro
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 031번 고객님, 고객센터로 오세요. · 4월 12일 토요일 오후 3:04"
          wait: 400
      - char: { id: 해수, position: left }
      - char: { id: 광철, position: right }
      - say:
          char: 광철
          with: [해수]
          text: "비 온다더니 안 오네."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "저녁에 온다고 들었습니다, 고객님."
      - say:
          char: 광철
          with: [해수]
          text: "자네 저녁까지 있어?"
      - say:
          char: 해수.service
          with: [광철]
          text: "네. 오늘은 열 시까지 합니다."
      - say:
          char: 광철
          with: [해수]
          text: "밤엔 잘 안 나와. 바깥에 갔다 와도 집에 불 켜 줄 사람이 없으니까."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "그래서 낮에 오지. 근데 낮에 와서 그런 소리나 듣고."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "고객의 소리 용지 줘. 아니, 두 장."
      - wait: 600
      - say:
          char: 해수.service
          with: [광철]
          text: "네, 고객님."
      - say:
          char: 해수.service
          with: [광철]
          text: "어떤 내용이신지 여쭤봐도…"
      - say:
          char: 광철
          with: [해수]
          text: "쓰면 알아."
      - say:
          char: 광철
          with: [해수]
          text: "연필 줘. 볼펜도 없어? …뒤에 줄 선 사람들도 좀 들어 봐."
      - say:
          char: 광철
          motion: lean_in
          with: [해수]
          text: "직원 태도 불량. 개봉 상품 핑계로 고객을 무시함. 말투가 비아냥거림. 대상 직원, 정. 해. 수."
          wait: 750
      - move: { id: 광철, toward: 해수, style: lunge }
      - say:
          char: 광철.shout
          with: [해수]
          text: "사과해. 여기서. 사람들 보는 데서 고개 숙이고."
          wait: 800
      - choice:
          key: t1_bow
          prompt: "줄이 고객센터 밖 카트 보관대까지 늘어났다."
          char: 해수
          options:
            - text: "고개를 숙인다"
              saveText: "고개를 숙인다. 한 번 더 숙인다"
              set: { bowed: true }
              goto: bow_down
            - text: "응대를 그만둔다"
              saveText: "\"죄송합니다. 여기까지만 하겠습니다, 고객님.\""
              goto: bow_stop

  bow_down:
    actions:
      - wait: 600
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "죄송합니다, 고객님."
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "제가 말씀을 잘못 드렸습니다."
      - emote: { id: 해수, motion: bow, wait: true }
      - say:
          char: 광철
          with: [해수]
          text: "거기까지밖에 안 숙여져? 허리 아파?"
      - goto: snap

  bow_stop:
    actions:
      - say:
          char: 광철.shout
          motion: stomp
          with: [해수]
          text: "내 말 안 들려? 여기 책임자 불러. 지금 당장."
          wait: 800
      - goto: snap

  snap:
    actions:
      - move: { id: 광철, style: reset }
      - sound: snap
      - get: complaint
      - sticker: { id: complaint, image: complaint_sticker, x: 64, y: 32, width: "260px", rotate: -3, enter: slideUp }
      - say:
          channel: record
          with: []
          text: "고객의 소리 접수 · 2031.04.12 15:07 · 대상 직원: 정해수 · 내용: 태도 불량, 고객 무시 · 처리: 팀장 면담 예정"
      - clearSticker: { id: complaint, leave: fadeOut }
      - goto: breakroom

  breakroom:
    title: "휴게실"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 600 }
      - char: { id: 지영, position: right }
      - char: { id: 해수, position: left }
      - say:
          char: 지영
          with: [해수]
          text: "들었어. 31번."
      - say:
          char: 해수
          with: [지영]
          text: "괜찮습니다."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "괜찮냐고 안 물어봤어."
      - say:
          char: 지영
          when: { var: bowed, op: eq, value: false }
          with: [해수]
          text: "팀장님은 상품권만 주고 들어가셨대. 그 뒤에 또 네가 응대하고."
      - say:
          char: 지영
          with: [해수]
          text: "팀장님이 너한테는 뭐라셔?"
      - say:
          char: 해수
          when: { var: bowed, op: eq, value: false }
          with: [지영]
          text: "다음부터는 처음부터 숙이라고 하셨어요."
      - say:
          char: 해수
          when: { var: bowed, op: eq, value: true }
          with: [지영]
          text: "숙일 거면 한 번에 깊이 숙이라고 하셨어요."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "그 양반은 창구에 한 번을 안 앉아 봤어."
      - say:
          char: 해수
          with: [지영]
          text: "앉으시면 금방 아실 거예요."
      - say:
          char: 지영
          with: [해수]
          text: "또 그 양반 걱정이네. 해수야, 너 얘기 좀 해."
      - say:
          char: 지영
          with: [해수]
          text: "이거 마셔. 자판기가 두 개 뱉었어."
      - say:
          char: 해수
          with: [지영]
          text: "…두 개 뱉은 거 맞아요?"
      - say:
          char: 지영
          with: [해수]
          text: "맞아."
      - say:
          char: 해수
          with: [지영]
          text: "지난번에도 두 개 뱉었어요."
      - say:
          char: 해수
          with: [지영]
          text: "그 자판기."
      - say:
          char: 지영.smirk
          with: [해수]
          text: "고장 났나 보지."
      - say:
          char: 해수
          motion: bow
          with: [지영]
          text: "…감사합니다."
      - say:
          char: 지영
          with: [해수]
          text: "레플라 가면 우리 매장도 나와. 깜빡이는 형광등까지 똑같아."
      - say:
          char: 지영
          with: [해수]
          text: "그 아저씨도 와. 여기서 하는 짓 그대로 해."
      - say:
          char: 지영
          with: [해수]
          text: "거기선 한마디 해도 돼. 다치는 사람 없잖아."
      - say:
          char: 해수
          with: [지영]
          text: "주임님은 거기서 뭐 하세요?"
      - say:
          char: 지영.smirk
          motion: headtilt
          with: [해수]
          text: "나? 거기선 내가 손님이야."
      - say:
          char: 지영
          with: [해수]
          text: "창구에 네가 앉아 있는데 내가 뭘 들고 가도 다 해 줘. 너한테 떼쓰는 건 재미없어서 요샌 경준이한테 가."
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: bounce
          with: [지영, 해수]
          text: "주임님 거기서 환불 진짜 많이 하세요. 저 봤어요."
      - say:
          char: 지영
          with: [경준]
          text: "넌 왜 우리 매장에 들어와 있는데."
      - say:
          char: 경준
          motion: droop
          with: [지영]
          text: "…구경이요."
      - say:
          char: 지영
          when: { var: took_coupon, op: eq, value: false }
          with: [해수]
          text: "둘째 서랍에 그거 아직 있다. 영수증 상자 위."

  night:
    title: "밴드"
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 900 }
      - place: { text: "4월 13일 0:49 · 해수의 방", presentation: center }
      - say: { channel: action, with: [], when: { var: took_coupon, op: eq, value: true }, text: "퇴근길에 주머니의 체험권을 꺼내 시연용 밴드 대여란에 이름을 썼다. 지금은 그 밴드를 책상에 올려놓고 있다." }
      - say: { channel: action, with: [], when: { var: took_coupon, op: eq, value: false }, text: "퇴근 전에 둘째 서랍을 다시 열었다. 체험권을 챙겨 시연용 밴드를 빌렸다. 집에 와서도 한참 포장을 만지작거렸다." }
      - get: coupon
      - say:
          channel: record
          with: []
          text: "레플라 체험용 밴드 · 매장 시연품 · 앉은 상태에서 귀 뒤 뼈 위에 붙이세요. · 접속 중에는 잠든 상태가 유지됩니다. · 체험 기간 7일, 총 14시간"
          continueLabel: "밴드를 붙인다"
          at: { x: 52, y: 43 }
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "하하. …아니, 너 말고. 옆방."

  onboarding:
    title: "온보딩"
    actions:
      - bg: { id: sim_void, transition: fade, duration: 1200 }
      - music: tutorial
      - say:
          channel: system
          with: []
          text: "레플라 체험판에 연결합니다."
          autoAdvance: 750
      - say:
          channel: system
          with: []
          text: "다시 오신 걸 환영합니다, 정해수 님."
          wait: 900
      - char: { id: 해수, position: center }
      - mood: { tone: dread, level: 1 }
      - say:
          char: 해수
          motion: headtilt
          with: []
          text: "아, 저 처음인데요."
      - wait: 0
      - say:
          char: 해수
          motion: bow
          with: []
          text: "네. 감사합니다."
      - say:
          channel: system
          with: []
          text: "이어서 진행합니다 · 튜토리얼 1/5 — 주위를 둘러보세요."

  tutorial_one:
    actions:
      - bg: { id: sim_desk, transition: wipeRight, duration: 900, place: "레플라 · 그린마트 고객센터" }
      - choice:
          key: t1_look
          presentation: explore
          prompt: "출입구 쪽 형광등이 두 번 깜빡이고 잠잠해진다. 매장에서도 꼭 저 박자였다."
          with: []
          camera: wide
          options:
            - text: "번호표 기계"
              at: { x: 24, y: 44 }
              when: { var: look_ticket, op: eq, value: false }
              goto: look_ticket
            - text: "연필꽂이"
              at: { x: 70, y: 58 }
              when: { var: look_pencil, op: eq, value: false }
              goto: look_pencil
            - text: "다음 단계로"
              when:
                all:
                  - { var: look_ticket, op: eq, value: true }
                  - { var: look_pencil, op: eq, value: true }
              goto: tutorial_two

  look_ticket:
    actions:
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
          wait: 700
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
          wait: 700
      - say:
          char: 해수
          with: []
          text: "종이는 안 나오네요."
      - say: { channel: action, with: [], text: "기계 옆면에 테이프 자국이 있다. 지난달에 ‘고장’ 종이를 붙였다 뗀 자리다. 그걸 붙인 건 나다." }
      - say:
          char: 해수
          with: []
          text: "027번…"
      - set: { look_ticket: true }
      - goto: tutorial_one

  look_pencil:
    actions:
      - get: pencil
      - say: { channel: action, with: [], text: "연필 끝을 손톱으로 눌러 본다. 자국이 난다. 손톱 밑에 흑연이 묻는다." }
      - say: { channel: action, with: [], text: "옆에 있는 바코드 스캐너를 들어 본다. 무게가 없다. 내려놓아도 소리가 안 난다." }
      - say:
          char: 해수
          motion: nod
          with: []
          text: "열여덟, 열아홉, 스무 자루. 맞네요."
      - say:
          channel: action
          with: []
          text: "한 자루를 뽑자 빈자리에 같은 연필이 다시 꽂혀 있다."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "그럼 이건 제가 가져갈게요."
      - set: { look_pencil: true }
      - goto: tutorial_one

  tutorial_two:
    actions:
      - mood: off
      - say:
          channel: system
          with: []
          text: "튜토리얼 2/5 — 하고 싶었던 말을 해 보세요."
      - char: { id: 광철, position: right, emotion: wire }
      - move: { id: 광철, toward: camera, style: approach }
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - choice:
          key: t1_say
          prompt: "윤곽선만 보이는 즉석밥 열두 개. 하나는 포장이 뜯겨 있다."
          char: 해수
          options:
            - text: "영수증을 확인한다"
              saveText: "\"네, 고객님. 영수증 확인해 드릴게요.\""
              when: { var: tried_polite, op: eq, value: false }
              set: { tried_polite: true }
              goto: say_polite
            - text: "소리 지르지 말라고 한다"
              saveText: "\"소리 지르지 마세요.\""
              add: { rage: 1 }
              goto: say_loud
            - text: "왜 그렇게 많이 사냐고 쏘아붙인다"
              saveText: "\"혼자 다 드시지도 못하는 걸 왜 사세요.\""
              add: { rage: 2 }
              goto: say_cruel

  say_polite:
    actions:
      - wait: 600
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "네, 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "영수증 확인해 드릴게요."
      - say:
          channel: system
          with: []
          text: "다시 해 보세요."
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - move: { id: 광철, style: reset }
      - goto: tutorial_two

  say_loud:
    actions:
      - say:
          char: 해수
          motion: tremble
          with: [광철]
          delivery: shout
          text: "소리 지르지 마세요. 소리 지르지 마시라고요!"
      - goto: said

  say_cruel:
    actions:
      - say:
          char: 해수
          motion: lean_in
          with: [광철]
          delivery: shout
          text: "혼자 다 드시지도 못하는 걸 왜 사세요! 맨날 와서, 맨날!"
      - goto: said

  said:
    actions:
      - move: { id: 광철, style: reset, wait: true }
      - move: { id: 광철, toward: camera, style: approach }
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - say:
          char: 해수
          motion: stomp
          with: [광철]
          delivery: shout
          text: "안 된다고요!"
      - say: { channel: action, with: [], text: "소리가 천장에 맞고 돌아온다. 줄 선 사람도 옆 창구도 없다. 목이 따갑다. 목은 진짜로 따갑다." }
      - say:
          channel: system
          with: []
          text: "잘하셨습니다. 튜토리얼 2/5 완료."
          autoAdvance: 900
      - move: { id: 광철, style: reset }
      - say:
          channel: system
          with: []
          text: "체험판 이용 중 · 남은 시간을 모두 써도 튜토리얼은 계속할 수 있습니다"
          autoAdvance: 1200
      - goto: sessions

  sessions:
    title: "접속 기록"
    actions:
      - bg: { id: haesu_room, transition: cut }
      - music: fluoro
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/13 00:49–01:31 · 레플라 상봉점 고객센터"
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/14 00:12–04:04 · 레플라 상봉점 고객센터 · 튜토리얼 2/5 다시 하기 11회"
      - say:
          channel: message
          thread: "지영"
          side: them
          char: 지영
          with: []
          text: "해수 너 오늘 오픈인데 9시 41분이야"
      - say:
          channel: message
          thread: "지영"
          side: me
          char: 해수
          with: []
          text: "아 졸아서요 죄송합니다"
      - say:
          channel: message
          thread: "경준"
          side: me
          char: 해수
          with: []
          text: "경준아 너 튜토리얼 2단계 해 봤어?"
      - say:
          channel: message
          thread: "경준"
          side: them
          char: 경준
          with: []
          text: "저는 못 하겠던데요. 혼자 소리 지르는 게 부끄러워서 그냥 넘겼어요"
      - say:
          channel: message
          thread: "경준"
          side: them
          char: 경준
          with: []
