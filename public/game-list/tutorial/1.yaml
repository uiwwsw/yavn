chapterTitle: "체험판"

script:
  - scene: complaint
  - scene: breakroom
  - scene: night
  - scene: onboarding
  - scene: tutorial_one
  - scene: tutorial_two
  - scene: sessions
  - scene: hallway
  - scene: quiet_customer
  - scene: tutorial_three
  - scene: morning

scenes:
  complaint:
    title: "031번"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 700 }
      - music: fluoro
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 031번 고객님, 고객센터로 오세요. · 4월 12일 토요일 오후 3:04"
          wait: 700
      - char: { id: 해수, position: left }
      - char: { id: 광철, position: right }
      - say:
          char: 광철
          with: [해수]
          text: "비 온다더니 안 오네."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "저녁에 온다고 들었습니다, 고객님."
      - say:
          char: 광철
          with: [해수]
          text: "자네 저녁까지 있어?"
      - say:
          char: 해수.service
          with: [광철]
          text: "네. 오늘은 열 시까지 합니다."
      - say:
          char: 광철
          with: [해수]
          text: "밤엔 잘 안 나와. 바깥에 갔다 와도 집에 불 켜 줄 사람이 없으니까."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "그래서 낮에 오지. 근데 낮에 와서 그런 소리나 듣고."
      - say:
          char: 광철
          motion: stomp
          with: [해수]
          text: "고객의 소리 용지 줘. 아니, 두 장."
      - wait: 600
      - say:
          char: 해수.service
          with: [광철]
          text: "네, 고객님."
      - say:
          char: 해수.service
          with: [광철]
          text: "어떤 내용이신지 여쭤봐도…"
      - say:
          char: 광철
          with: [해수]
          text: "쓰면 알아."
      - say:
          char: 광철
          with: [해수]
          text: "연필 줘. 볼펜도 없어? …뒤에 줄 선 사람들도 좀 들어 봐."
      - say:
          char: 광철
          motion: lean_in
          with: [해수]
          text: "직원 태도 불량. 개봉 상품 핑계로 고객을 무시함. 말투가 비아냥거림. 대상 직원, 정. 해. 수."
      - move: { id: 광철, toward: 해수, style: lunge }
      - say:
          char: 광철.shout
          with: [해수]
          text: "사과해. 여기서. 사람들 보는 데서 고개 숙이고."
          wait: 800
      - choice:
          key: t1_bow
          prompt: "줄이 고객센터 밖 카트 보관대까지 늘어났다."
          char: 해수
          options:
            - text: "고개를 숙인다"
              saveText: "고개를 숙인다. 한 번 더 숙인다"
              set: { bowed: true }
              goto: bow_down
            - text: "응대를 그만둔다"
              saveText: "\"죄송합니다. 여기까지만 하겠습니다, 고객님.\""
              goto: bow_stop

  bow_down:
    actions:
      - wait: 600
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "죄송합니다, 고객님."
      - say:
          char: 해수
          motion: bow
          with: [광철]
          text: "제가 말씀을 잘못 드렸습니다."
      - emote: { id: 해수, motion: bow, wait: true }
      - say:
          char: 광철
          with: [해수]
          text: "거기까지밖에 안 숙여져? 허리 아파?"
      - goto: snap

  bow_stop:
    actions:
      - say:
          char: 광철.shout
          motion: stomp
          with: [해수]
          text: "내 말 안 들려? 여기 책임자 불러. 지금 당장."
          wait: 800
      - goto: snap

  snap:
    actions:
      - move: { id: 광철, style: reset }
      - sound: snap
      - get: complaint
      - sticker: { id: complaint, image: complaint_sticker, x: 64, y: 32, width: "260px", rotate: -3, enter: slideUp }
      - say:
          channel: record
          with: []
          text: "고객의 소리 접수 · 2031.04.12 15:07 · 대상 직원: 정해수 · 내용: 태도 불량, 고객 무시 · 처리: 팀장 면담 예정"
      - clearSticker: { id: complaint, leave: fadeOut }
      - goto: breakroom

  breakroom:
    title: "휴게실"
    actions:
      - bg: { id: breakroom, transition: dissolve, duration: 600 }
      - char: { id: 지영, position: right }
      - char: { id: 해수, position: left }
      - say:
          char: 지영
          with: [해수]
          text: "들었어. 31번."
      - say:
          char: 해수
          with: [지영]
          text: "괜찮습니다."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "괜찮냐고 안 물어봤어."
      - say:
          char: 지영
          when: { var: bowed, op: eq, value: false }
          with: [해수]
          text: "팀장님이 상품권 5,000원 드리고 세 번 숙였다며. 너한테는 '그냥 숙이지 그랬어' 하고."
      - say:
          char: 지영
          with: [해수]
          text: "팀장님이 너한테 뭐라셨어?"
      - say:
          char: 해수
          with: [지영]
          text: "다음부터는 처음부터 숙이라고 하셨어요."
      - say:
          char: 지영
          motion: sigh
          with: [해수]
          text: "그 양반은 창구에 한 번을 안 앉아 봤어."
      - say:
          char: 해수
          with: [지영]
          text: "앉으시면 금방 아실 거예요."
      - say:
          char: 지영
          with: [해수]
          text: "너 그 소리 12년째야. 안 괜찮을 때도 기어이 괜찮다고 해."
      - say:
          char: 지영
          with: [해수]
          text: "이거 마셔. 자판기가 두 개 뱉었어."
      - say:
          char: 해수
          with: [지영]
          text: "…두 개 뱉은 거 맞아요?"
      - say:
          char: 지영
          with: [해수]
          text: "맞아."
      - say:
          char: 해수
          with: [지영]
          text: "지난번에도 두 개 뱉었어요."
      - say:
          char: 해수
          with: [지영]
          text: "그 자판기."
      - say:
          char: 지영.smirk
          with: [해수]
          text: "고장 났나 보지."
      - say:
          char: 해수
          motion: bow
          with: [지영]
          text: "…감사합니다."
      - say:
          char: 지영
          with: [해수]
          text: "레플라 가면 우리 매장도 나와. 깜빡이는 형광등까지 똑같아. 그 아저씨도 와서 현실에서 하는 짓 그대로 해."
      - say:
          char: 해수
          with: [지영]
          text: "주임님은 거기서 뭐 하세요?"
      - say:
          char: 지영.smirk
          motion: headtilt
          with: [해수]
          text: "나? 거기선 내가 손님이야."
      - say:
          char: 지영
          with: [해수]
          text: "창구에 네가 앉아 있는데 내가 뭘 들고 가도 다 해 줘. 너한테 떼쓰는 건 재미없어서 요샌 경준이한테 가."
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: bounce
          with: [지영, 해수]
          text: "주임님 거기서 환불 진짜 많이 하세요. 저 봤어요."
      - say:
          char: 지영
          with: [경준]
          text: "넌 왜 우리 매장에 들어와 있는데."
      - say:
          char: 경준
          motion: droop
          with: [지영]
          text: "…구경이요."
      - say:
          char: 지영
          when: { var: took_coupon, op: eq, value: false }
          with: [해수]
          text: "둘째 서랍에 그거 아직 있다. 영수증 상자 위."

  night:
    title: "밴드"
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 900 }
      - place: "4월 13일 0:49 · 해수의 방"
      - get: coupon
      - say:
          channel: record
          with: []
          text: "레플라 체험용 밴드 · 매장 시연품 · 앉은 상태에서 귀 뒤 뼈 위에 붙이세요. · 접속은 30초 이내, 접속 중에는 잠든 상태가 유지됩니다."
          continueLabel: "밴드를 붙인다"
      - say:
          char: 상혁
          with: []
          delivery: whisper
          text: "하하. …아니, 너 말고. 옆방."

  onboarding:
    title: "온보딩"
    actions:
      - bg: { id: sim_void, transition: fade, duration: 1200 }
      - music: tutorial
      - say:
          channel: system
          with: []
          text: "레플라 체험판에 연결합니다."
          autoAdvance: 1410
      - say:
          channel: system
          with: []
          text: "다시 오신 걸 환영합니다, 정해수 님."
      - char: { id: 해수, position: center }
      - mood: { tone: dread, level: 1 }
      - say:
          char: 해수
          motion: headtilt
          with: []
          text: "아, 저 처음인데요."
      - say:
          channel: system
          with: []
          text: "튜토리얼을 이어서 진행합니다."
          autoAdvance: 1444
      - say:
          char: 해수
          motion: bow
          with: []
          text: "네. 감사합니다."
      - say:
          channel: system
          with: []
          text: "튜토리얼 1/5 — 주위를 둘러보세요."

  tutorial_one:
    actions:
      - bg: { id: sim_desk, transition: wipeRight, duration: 900 }
      - choice:
          key: t1_look
          presentation: explore
          prompt: "출입구 쪽 형광등이 두 번 깜빡이고 잠잠해진다. 매장에서도 꼭 저 박자였다."
          with: []
          camera: wide
          options:
            - text: "번호표 기계"
              at: { x: 24, y: 44 }
              when: { var: look_ticket, op: eq, value: false }
              goto: look_ticket
            - text: "연필꽂이"
              at: { x: 70, y: 58 }
              when: { var: look_pencil, op: eq, value: false }
              goto: look_pencil
            - text: "다음 단계로"
              when:
                all:
                  - { var: look_ticket, op: eq, value: true }
                  - { var: look_pencil, op: eq, value: true }
              goto: tutorial_two

  look_ticket:
    actions:
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
          wait: 700
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 027번 고객님, 고객센터로 오세요."
          wait: 700
      - say:
          char: 해수
          with: []
          text: "종이는 안 나오네요."
      - say:
          char: 해수
          with: []
          text: "027번…"
      - set: { look_ticket: true }
      - goto: tutorial_one

  look_pencil:
    actions:
      - get: pencil
      - say:
          char: 해수
          motion: nod
          with: []
          text: "열여덟, 열아홉, 스무 자루. 맞네요."
      - say:
          channel: action
          with: []
          text: "한 자루를 뽑자 빈자리에 같은 연필이 다시 꽂혀 있다."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "그럼 이건 제가 가져갈게요."
      - set: { look_pencil: true }
      - goto: tutorial_one

  tutorial_two:
    actions:
      - mood: off
      - say:
          channel: system
          with: []
          text: "튜토리얼 2/5 — 하고 싶었던 말을 해 보세요."
      - char: { id: 광철, position: right, emotion: wire }
      - move: { id: 광철, toward: camera, style: approach }
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - choice:
          key: t1_say
          prompt: "윤곽선만 보이는 즉석밥 열두 개. 하나는 포장이 뜯겨 있다."
          char: 해수
          options:
            - text: "영수증을 확인한다"
              saveText: "\"네, 고객님. 영수증 확인해 드릴게요.\""
              when: { var: tried_polite, op: eq, value: false }
              set: { tried_polite: true }
              goto: say_polite
            - text: "소리 지르지 말라고 한다"
              saveText: "\"소리 지르지 마세요.\""
              add: { rage: 1 }
              goto: say_loud
            - text: "왜 그렇게 많이 사냐고 쏘아붙인다"
              saveText: "\"혼자 다 드시지도 못하는 걸 왜 사세요.\""
              add: { rage: 2 }
              goto: say_cruel

  say_polite:
    actions:
      - wait: 600
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "네, 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "영수증 확인해 드릴게요."
      - say:
          channel: system
          with: []
          text: "다시 해 보세요."
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - move: { id: 광철, style: reset }
      - goto: tutorial_two

  say_loud:
    actions:
      - say:
          char: 해수
          motion: tremble
          with: [광철]
          delivery: shout
          text: "소리 지르지 마세요. 소리 지르지 마시라고요!"
      - goto: said

  say_cruel:
    actions:
      - say:
          char: 해수
          motion: lean_in
          with: [광철]
          delivery: shout
          text: "혼자 다 드시지도 못하는 걸 왜 사세요! 맨날 와서, 맨날!"
      - goto: said

  said:
    actions:
      - move: { id: 광철, style: reset, wait: true }
      - move: { id: 광철, toward: camera, style: approach }
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "이거 환불."
      - say:
          char: 해수
          motion: stomp
          with: [광철]
          delivery: shout
          text: "안 된다고요!"
      - say:
          channel: system
          with: []
          text: "잘하셨습니다. 튜토리얼 2/5 완료."
          autoAdvance: 1580
      - move: { id: 광철, style: reset }
      - say:
          channel: system
          with: []
          text: "체험 시간 00:42:17 사용 · 체험판은 7일 동안 14시간까지 이용할 수 있습니다"
          autoAdvance: 2532
      - goto: sessions

  sessions:
    title: "접속 기록"
    actions:
      - bg: { id: haesu_room, transition: cut }
      - music: fluoro
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/13 00:49–01:31 · 레플라 상봉점 고객센터"
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/14 00:12–04:04 · 레플라 상봉점 고객센터 · 튜토리얼 2/5 다시 하기 11회"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "해수 너 오늘 오픈인데 9시 41분이야"
      - say:
          channel: message
          side: me
          char: 해수
          with: []
          text: "아 졸아서요 죄송합니다"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "너도 하는구나ㅋㅋ 내 코드 썼지?"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "형 어디까지 갔어요? 저 2단계에서 넘겼는데"
      - say:
          channel: message
          side: them
          char: 경준
          with: []
          text: "그거 할 말 하라는 거 너무 부끄럽지 않아요?"
      - say:
          channel: message
          side: them
          char: 지영
          with: []
          text: "넌 할 말이 없어서 못 한 거겠지"
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/15 23:40–04:44 · 레플라 상봉점 고객센터 · 튜토리얼 2/5 다시 하기 23회"
      - bg: { id: cs_desk, transition: cut }
      - place: "4월 16일 오후 · 고객센터"
      - char: { id: 해수, position: left }
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "우산 손잡이가 빠졌다고요."
      - say:
          char: 해수.service
          motion: bow
          with: []
          text: "네, 확인해 드릴게요."
      - say:
          char: 해수.blank
          motion: nod
          with: []
          text: "손잡이 안쪽에 드라이버 자국이 새로 났는데요."
      - say:
          char: 해수.blank
          motion: nod
          with: []
          text: "근데 이건 고객님이 빼신 거잖아요."
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: gasp
          with: [해수]
          delivery: whisper
          text: "…형?"
      - say:
          char: 해수.service
          with: []
          text: "…죄송합니다."
      - say:
          char: 해수.service
          with: []
          text: "새 걸로 교환해 드릴게요."
      - say:
          char: 경준
          motion: lean_in
          with: [해수]
          delivery: whisper
          text: "형 방금 그 말, 손님한테 한 거예요?"
      - say:
          char: 해수
          with: [경준]
          text: "…나도 내가 한 말인가 싶어."
      - emote: { id: 해수, motion: bow, wait: true }
      - say:
          channel: record
          with: []
          text: "접속 기록 · 4/16 23:58–04:20 · 레플라 상봉점 고객센터 · 튜토리얼 2/5 다시 하기 31회"

  hallway:
    title: "새벽 네 시"
    actions:
      - bg: { id: home_hall, transition: fade, duration: 700 }
      - char: { id: 해수, position: left }
      - char: { id: 상혁, position: right }
      - place: "4월 17일 새벽 4:22 · 집 복도"
      - say:
          char: 상혁.grin
          with: [해수]
          text: "어. 너도?"
      - say:
          char: 해수
          with: [상혁]
          text: "응."
      - say:
          char: 상혁
          with: [해수]
          text: "어디까지 갔어."
      - say:
          char: 해수
          with: [상혁]
          text: "튜토리얼 2단계."
      - say:
          char: 상혁.grin
          motion: laugh
          with: [해수]
          text: "튜토리얼? 야, 그걸 왜 해. 넘기기 눌러. 오른쪽 위에 있잖아. 다들 넘겨."
      - say:
          char: 해수
          with: [상혁]
          text: "없던데."
      - say:
          char: 상혁
          with: [해수]
          text: "있어. 체험판이라 그런가. 아 몰라."
      - say:
          char: 상혁
          with: [해수]
          text: "야, 우리 고3 때 독서실 기억나냐. 너 맨날 이 시간까지 앉아 있었잖아."
      - say:
          char: 해수
          with: [상혁]
          text: "너는 자러 왔었고."
      - say:
          char: 상혁.grin
          motion: laugh
          with: [해수]
          text: "나는 분위기 때문에 간 거야. 공부하는 분위기."
      - say:
          char: 해수
          with: [상혁]
          text: "그 얘기 백 번째야."
      - say:
          char: 상혁
          with: [해수]
          text: "백 번 할 만하니까 하지."
      - say:
          char: 해수
          with: [상혁]
          text: "라면 끓일까."
      - say:
          char: 상혁
          with: [해수]
          text: "…아니. 들어갈 거야."
      - say:
          char: 해수
          with: [상혁]
          text: "두부 왔어."
      - say:
          char: 해수
          with: [상혁]
          text: "어머니가 보내신 거."
      - say:
          char: 해수
          with: [상혁]
          text: "냉장고 둘째 칸."
      - say:
          char: 상혁
          with: [해수]
          text: "어."
      - say:
          char: 해수
          with: [상혁]
          text: "전화는 했어?"
      - say:
          char: 상혁
          motion: sigh
          with: [해수]
          text: "할게. 주말에."
      - say:
          char: 해수
          with: [상혁]
          text: "물은 왜 두 병이야?"
      - say:
          char: 상혁.grin
          motion: lean_in
          with: [해수]
          text: "목말라서. 너 귀 뒤에 자국이나 가려. 고등학교 애들이 보면 네가 그렇게 하지 말라던 밤샘을 다 한다고 웃겠네."
      - say:
          channel: action
          with: []
          text: "상혁이 문을 닫는다. 도어락에서 잠기는 소리가 나고, 안에서 손잡이를 한 번 더 당긴다."

  quiet_customer:
    title: "044번"
    actions:
      - bg: { id: cs_desk, transition: fade, duration: 600 }
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 044번 고객님, 고객센터로 오세요. · 4월 17일 목요일 오전 11:40"
          wait: 700
      - char: { id: 해수, position: left }
      - char: { id: 광철, position: right, emotion: lost }
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "오광철 고객님."
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "오늘은 영수증 없으세요?"
      - say:
          char: 해수.service
          motion: bow
          with: [광철]
          text: "무엇을 확인해 드릴까요."
      - say:
          char: 광철.lost
          with: [해수]
          text: "오늘은 아무것도 안 샀어."
      - wait: 600
      - say:
          char: 해수.service
          with: [광철]
          text: "네, 고객님."
      - say:
          char: 광철.lost
          with: [해수]
          text: "장 볼 게 없어. 냉장고에 지난주 거 아직 있어."
      - say:
          char: 광철.lost
          with: [해수]
          text: "근데 집에 있으면 하루가 안 가. 여기 오면 한 시간은 가거든."
      - say:
          char: 해수.service
          with: [광철]
          text: "오늘은 날이 좋아서 그런지 손님이 많네요."
      - say:
          char: 광철.lost
          with: [해수]
          text: "아까부터 저기 서 있었어. 한 시간쯤."
      - say:
          char: 광철.lost
          motion: droop
          with: [해수]
          text: "자네가 사람들한테 말하는 거 보고 있었어. 똑같이 말하더라, 다 똑같이."
      - say:
          char: 광철.lost
          with: [해수]
          text: "…자네. 여기 오래 있었지."
      - say:
          char: 해수
          motion: nod
          with: [광철]
          text: "네. 12년 됐습니다."
      - say:
          char: 광철.lost
          motion: shiver
          with: [해수]
          text: "요 며칠, 밤마다 누가 나한테 소리를 질러. 집에서. 나 혼자 사는데. 경찰도 불렀는데 아무도 없대."
      - say:
          char: 광철.lost
          when: { var: rage, op: eq, value: 1 }
          with: [해수]
          text: "소리만 지르는 줄 알았어. 듣다 보니까 나한테 지르지 말라는 거야. 지르는 사람이."
      - say:
          char: 광철.lost
          when: { var: rage, op: gte, value: 2 }
          with: [해수]
          text: "말도 해. 혼자 다 먹지도 못하면서 왜 사느냐고. 그 소리를 밤새 해."
      - move: { id: 광철, toward: 해수, style: approach }
      - say:
          char: 광철.lost
          with: [해수]
          text: "그 연필 좀 내려놓고 들어 봐. 그 목소리가 어디서 들은 목소리 같아서."
      - emote: { id: 해수, motion: freeze }
      - say:
          char: 광철.lost
          when: { var: rage, op: gte, value: 2 }
          with: [해수]
          text: "…틀린 말은 아니더라. 혼자 그걸 다 먹을 수는 없지."
      - move: { id: 광철, toward: 해수, style: retreat }
      - say:
          char: 광철.lost
          motion: droop
          with: [해수]
          text: "아니야. 됐어."
      - say:
          char: 광철
          with: [해수]
          text: "그 즉석밥 있잖아. 환불 안 받은 건 마저 먹었어. 먹을 만하더라."
      - say:
          char: 해수.service
          with: [광철]
          text: "…그러셨어요."
      - say:
          char: 광철
          with: [해수]
          text: "환불 안 했으면 열한 개 다 먹었을 텐데. 괜히 들고 왔어."
      - say:
          char: 해수.service
          with: [광철]
          text: "다시 사시면 됩니다, 고객님."
      - say:
          char: 광철
          motion: droop
          with: [해수]
          text: "…그러면 되지. 그러면 되는데."
      - say:
          char: 광철
          motion: bow
          with: [해수]
          text: "이거. 마셔. …수고하고."
      - move: { id: 광철, style: reset }
      - char: { id: 경준, position: right }
      - say:
          char: 경준
          motion: bounce
          with: [해수]
          text: "형, 그 아저씨가 저한테도 수고하래요. 얼떨결에 네, 하고 인사할 뻔했어요."
      - say:
          char: 해수
          with: [경준]
          text: "존댓말로 대답해야지."
      - say:
          char: 경준
          motion: perk
          with: [해수]
          text: "아, 그러네요."

  tutorial_three:
    title: "튜토리얼 3/5"
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 800 }
      - place: "4월 18일 새벽 1:32 · 해수의 방"
      - say:
          channel: system
          with: []
          text: "체험 시간 14시간을 모두 사용했습니다. 레플라 라이트로 계속하시겠습니까? 월 39,000원"
          autoAdvance: 2634
      - say:
          channel: system
          with: []
          text: "완료하지 않은 튜토리얼이 있습니다. 튜토리얼은 무료입니다."
          continueLabel: "네, 이어서 할게요"
      - bg: { id: sim_parking, transition: wipeRight, duration: 900 }
      - music: tutorial
      - say:
          channel: system
          with: []
          text: "레플라 · 모의 주차장\n튜토리얼 3/5 — 손에 쥔 물건을 사용해 보세요."
      - goto: parking

  parking:
    actions:
      - place: "레플라 · 그린마트 상봉점 B2 · C-14"
      - char: { id: 해수, position: left }
      - char: { id: 광철, position: right, emotion: wire }
      - say:
          char: 광철.wire
          motion: nod
          with: [해수]
          text: "번호표 뽑고 기다려."
      - say:
          channel: system
          with: []
          text: "손에 쥔 물건 · 그린마트 연필 1"
      - choice:
          key: t1_pencil
          prompt: "기둥에 C-14. 광철이 차 문을 잡고 서 있다."
          with: [광철]
          timeoutMs: 9000
          timeoutOptionIndex: 0
          options:
            - text: "연필을 든 채 다가간다"
              saveText: "연필을 쥔다"
              goto: stab
            - text: "연필을 내려놓는다"
              set: { hesitated: true }
              add: { honest: 1 }
              goto: put_down

  put_down:
    actions:
      - say:
          channel: system
          with: []
          text: "손에 쥔 물건 · 그린마트 연필 1"
      - say:
          channel: system
          with: []
          text: "튜토리얼 3/5를 완료하지 않았습니다. 처음부터 다시 진행합니다."
      - say:
          char: 광철.wire
          motion: nod
          with: []
          text: "번호표 뽑고 기다려."
      - choice:
          key: t1_pencil_again
          prompt: "기둥에는 또 C-14. 운전석 문도 아까처럼 열린다."
          with: [광철]
          options:
            - text: "연필을 든 채 다가간다"
              saveText: "연필을 쥔다"
              goto: stab
            - text: "귀 뒤의 밴드를 뗀다"
              set: { logged_out: true }
              goto: band_off

  band_off:
    actions:
      - bg: { id: haesu_room, transition: cut }
      - say:
          channel: action
          with: []
          text: "해수는 밴드를 책상에 엎어 놓고 불을 끈 채 눕는다."
      - place: "4월 18일 새벽 1:50 · 해수의 방"
      - bg: { id: sim_parking, transition: cut }
      - mood: { tone: dread, level: 2 }
      - say:
          channel: system
          with: []
          text: "자동 접속되었습니다. 튜토리얼 3/5를 이어서 진행합니다. · 손에 쥔 물건 · 그린마트 연필 1"
          autoAdvance: 2736
      - goto: stab

  stab:
    actions:
      - char: { id: 해수, position: left }
      - char: { id: 광철, position: right, emotion: wire }
      - move: { id: 해수, toward: 광철, style: approach, wait: true }
      - bg: { id: sim_void, transition: cut }
      - move: { id: 해수, style: reset }
      - sound: chime
      - say:
          channel: system
          with: []
          text: "띵동 — 028번 고객님, 고객센터로 오세요."
          wait: 1400
      - say:
          channel: system
          with: []
          text: "튜토리얼 3/5 완료. 잘하셨습니다."
      - mood: off
      - say:
          channel: system
          with: []
          text: "다음 접속 때 4단계를 시작합니다."
      - goto: morning

  morning:
    actions:
      - bg: { id: haesu_room, transition: fade, duration: 1200 }
      - music: fluoro
      - place: "4월 18일 04:12 · 해수의 방"
      - say:
          channel: thought
          with: []
          text: "손을 펴려다 멈춘다. 아직 연필을 쥔 것 같다. 오늘은 9시 반까지 출근해야 한다."
      - say:
          channel: action
          with: []
          text: "의자에 걸린 앞치마 주머니를 뒤집자 영수증 한 장과 고무줄 하나만 나온다."
