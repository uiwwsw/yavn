script:
  - scene: first_scan
  - scene: residue_focus
  - scene: residue_claim_correct
  - scene: residue_claim_wrong
  - scene: timeline_gate
  - scene: timeline_input_gate
  - scene: reconstruction_choice
  - scene: reconstruction_claim_correct
  - scene: reconstruction_claim_wrong
  - scene: deduction_branch
  - scene: stable_frame
  - scene: shaky_frame
  - scene: lounge_handoff

scenes:
  first_scan:
    actions:
      - bg: tea_room
      - music: reasoning
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 코난.serious
          text: "<speed=28>란 누나, 다들 같은 차를 마셨는데 하루오 씨만 쓰러졌어요.</speed> <speed=21>주전자보다 2번 잔을 먼저 봐야 해요.</speed>"
      - say:
          char: 란.worried
          text: '<speed=25>쓰러질 때도 잔을 놓지 않았어.</speed> <speed=19>그 "2R"을 꼭 남기려 했던 것 같아.</speed>'

  residue_focus:
    actions:
      - effect: zoom
      - sticker:
          id: rim_focus
          image: clue_cup
          x: 50
          y: 40
          width: 62
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.think
          text: "<speed=18>(R은 누군가 문지른 흔적이야.</speed> <speed=27>글자보다 잔에 남은 걸 먼저 확인하자.)</speed>"
      - choice:
          key: residue_focus_choice
          prompt: "가장 먼저 확인할 흔적은?"
          options:
            - text: "2번 잔의 안쪽과 가장자리를 비교한다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: residue_claim_correct
            - text: "\"2R\"의 글씨 모양부터 해석한다"
              add:
                mistake_count: 1
                trust: -1
              goto: residue_claim_wrong
            - text: "주전자 뚜껑에 독이 있었다고 본다"
              add:
                mistake_count: 1
              goto: residue_claim_wrong

  residue_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=23>역시.</speed> <speed=19>잔 안쪽은 아무 반응이 없어요.</speed> <speed=37>입이 닿는 바깥쪽만 변했어요.</speed>"
      - choice:
          key: residue_commit_choice
          prompt: "시약 반응이 뜻하는 것은?"
          options:
            - text: "마시기 직전 가장자리에 묻었다"
              goto: timeline_gate
            - text: "주전자 오염 가능성도 남긴다"
              add:
                final_confidence: -1
              goto: timeline_gate

  residue_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(글자만 보고 사람부터 정하면 범인이 바라는 대로야.)</speed>"
      - choice:
          key: residue_rebuttal_choice
          prompt: "어느 쪽을 다시 볼까?"
          options:
            - text: "잔의 반응부터 다시 확인한다"
              goto: timeline_gate
            - text: "메시지 해석을 우선한다"
              add:
                trust: -1
              goto: timeline_gate

  timeline_gate:
    actions:
      - clearSticker:
          id: rim_focus
          leave:
            effect: fadeOut
      - goto: timeline_input_gate

  timeline_input_gate:
    actions:
      - say:
          char: 코난
          text: "<speed=25>란 누나, 비명 전에 천둥이 쳤을 때 복도 시계를 봤죠?</speed> <speed=19>긴 바늘이 어디 있었는지 기억나요?</speed>"
      - input:
          prompt: "비명이 난 시각은? (24시간 형식)"
          correct: "21:30"
          saveAs: timeline_answer
          errors:
            - "시계 바늘을 떠올려. 긴 바늘은 6을 가리켰어."
            - "힌트: 밤 9시 30분."
            - "복도 시계가 가리킨 시각은 21:30이었다."
          routes:
            - equals: "21:30"
              add:
                deduction_score: 2
                trust: 1
              goto: reconstruction_choice
            - equals: "21:20"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_choice
            - equals: "22:00"
              add:
                mistake_count: 1
              goto: reconstruction_choice

  reconstruction_choice:
    actions:
      - bg: case_board
      - music: mystery
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=25>첫 번째 소리에 하루오 씨가 말렸고, 두 번째 소리에 모두가 주전자를 봤어요.</speed> <speed=19>그 짧은 순간, 보이지 않게 된 곳은 하나예요.</speed>"
      - choice:
          key: reconstruction_choice
          prompt: "두 번 누른 동작의 목적은?"
          options:
            - text: "주전자 안에 독을 넣을 기회"
              add:
                mistake_count: 1
              goto: reconstruction_claim_wrong
            - text: "2번 잔을 아무도 보지 않는 짧은 틈"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: reconstruction_claim_correct
            - text: "향을 고르게 퍼뜨리려는 평범한 습관"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_claim_wrong

  reconstruction_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=25>네.</speed> <speed=19>뚜껑은 수단이 아니라 시선 유도였어요.</speed> <speed=37>진짜 손은 2번 잔으로 갔어요.</speed>"
      - choice:
          key: reconstruction_commit_choice
          prompt: "9시 29분에 가려진 장면은?"
          options:
            - text: "주전자를 보는 사이 2번 잔에 손이 닿았다"
              goto: deduction_branch
            - text: "아직 다른 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: deduction_branch

  reconstruction_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(주전자엔 아무 반응이 없었어.</speed> <speed=27>다시 2번 잔을 보자.)</speed>"
      - choice:
          key: reconstruction_rebuttal_choice
          prompt: "어디로 시선을 돌릴까?"
          options:
            - text: "2번 잔으로 시선을 돌린다"
              goto: deduction_branch
            - text: "주전자 가설을 유지한다"
              add:
                trust: -1
              goto: deduction_branch

  deduction_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: deduction_score
                    op: gte
                    value: 4
                  - var: trust
                    op: gte
                    value: 0
                  - var: clue_double_press_decoy
                    op: eq
                    value: true
              goto: stable_frame
          default: shaky_frame

  stable_frame:
    actions:
      - effect: zoom
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: right
          emotion: serious
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=24>두 번째 소리가 나자 나도 주전자를 봤어.</speed> <speed=19>그때 2번 잔은 아무도 안 보고 있었고.</speed>"
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: "<speed=28>네.</speed> <speed=21>그 틈을 만들고 바로 손을 뻗은 사람이 있어요.</speed>"
      - add:
          final_confidence: 1
      - goto: lounge_handoff

  shaky_frame:
    actions:
      - effect: tilt
      - say:
          char: 코난.think
          text: "<speed=18>(놓친 장면이 있어.</speed> <speed=27>비명이 나기 직전부터 다시 맞춰 보자.)</speed>"
      - add:
          mistake_count: 1
      - goto: lounge_handoff

  lounge_handoff:
    actions:
      - bg: case_board
      - char:
          id: 코난
          position: left
          emotion: think
      - effect: focus
      - say:
          char: 코난.think
          text: "<speed=22>(다실 안에선 모두가 주전자를 봤어.</speed> <speed=18>문밖에 있던 사람은 뭘 봤을까?)</speed>"
      - goto: /routes/hub/1.yaml
