script:
  - scene: first_scan
  - scene: residue_focus
  - scene: residue_claim_correct
  - scene: residue_claim_wrong
  - scene: timeline_gate
  - scene: timeline_input_gate
  - scene: reconstruction_choice
  - scene: reconstruction_claim_correct
  - scene: reconstruction_claim_wrong
  - scene: deduction_branch
  - scene: stable_frame
  - scene: shaky_frame
  - scene: lounge_handoff

scenes:
  first_scan:
    actions:
      - bg: tea_room
      - music: reasoning
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 코난.serious
          text: "<speed=28>란 누나, 네 잔은 같은 주전자에서 나왔어.</speed> <speed=21>그런데 하루오 씨는 목보다 2번 잔을 먼저 붙잡았어. 그 선택부터 믿어 보자.</speed>"
      - say:
          char: 란.worried
          text: '<speed=25>마지막까지 그 잔을 놓지 않았어.</speed> <speed=19>어젯밤엔 누구 이름도 빼지 않겠다고 했는데... "2R"도 누군가 지우지 못하게 남긴 거겠지.</speed>'

  residue_focus:
    actions:
      - effect: zoom
      - sticker:
          id: rim_focus
          image: clue_cup
          x: 50
          y: 40
          width: 62
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.think
          text: "<speed=18>(R만 번진 방향이 달라.</speed> <speed=27>이름을 고르기 전에, 같은 손이 잔에도 닿았는지 보자.)</speed>"
      - choice:
          key: residue_focus_choice
          prompt: "사람 이름보다 먼저 고정해야 할 흔적은?"
          options:
            - text: "2번 잔의 안쪽과 가장자리를 비교한다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: residue_claim_correct
            - text: "\"2R\"의 글씨 모양부터 해석한다"
              add:
                mistake_count: 1
                trust: -1
              goto: residue_claim_wrong
            - text: "주전자 뚜껑에 독이 있었다고 본다"
              add:
                mistake_count: 1
              goto: residue_claim_wrong

  residue_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=23>잔 안쪽은 깨끗해.</speed> <speed=19>차에 섞였다면 안쪽부터 반응해야 해.</speed> <speed=37>변한 건 입술이 닿는 바깥 가장자리뿐이야.</speed>"
      - choice:
          key: residue_commit_choice
          prompt: "안쪽은 음성, 바깥쪽만 양성. 언제 묻었을까?"
          options:
            - text: "마시기 직전 가장자리에 묻었다"
              goto: timeline_gate
            - text: "주전자 오염 가능성도 남긴다"
              add:
                final_confidence: -1
              goto: timeline_gate

  residue_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(불완전한 글자에 이름부터 붙이면, 지운 사람이 만든 결론을 따라가.)</speed>"
      - choice:
          key: residue_rebuttal_choice
          prompt: "어느 쪽을 다시 볼까?"
          options:
            - text: "잔의 반응부터 다시 확인한다"
              goto: timeline_gate
            - text: "메시지 해석을 우선한다"
              add:
                trust: -1
              gameOver:
                title: "감식 실패"
                message: "잔의 반응을 외면한 채 글자에 매달려 핵심 시료를 놓쳤다. 마지막 저장에서 2번 잔의 안쪽과 가장자리를 다시 비교하자."

  timeline_gate:
    actions:
      - clearSticker:
          id: rim_focus
          leave:
            effect: fadeOut
      - goto: timeline_input_gate

  timeline_input_gate:
    actions:
      - say:
          char: 코난
          text: "<speed=25>란 누나, 아저씨를 부르러 문 쪽을 봤을 때 복도 시계도 보였지?</speed> <speed=19>천둥이 친 순간 긴 바늘이 어디 있었어?</speed>"
      - input:
          prompt: "란이 본 비명 순간의 시각은? (24시간 형식)"
          correct: "21:30"
          saveAs: timeline_answer
          errors:
            - "시계 바늘을 떠올려. 긴 바늘은 6을 가리켰어."
            - "힌트: 밤 9시 30분."
            - "복도 시계가 가리킨 시각은 21:30이었다."
          routes:
            - equals: "21:30"
              add:
                deduction_score: 2
                trust: 1
              goto: reconstruction_choice
            - equals: "21:20"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_choice
            - equals: "22:00"
              add:
                mistake_count: 1
              goto: reconstruction_choice

  reconstruction_choice:
    actions:
      - bg: case_board
      - music: mystery
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=25>첫 소리엔 하루오 씨가 레이코 씨를 봤어.</speed> <speed=19>둘째 소리엔 나까지 주전자를 봤고. 그 순간 화면에서 사라진 건 2번 잔 하나야.</speed>"
      - choice:
          key: reconstruction_choice
          prompt: "두 번째 뚜껑 소리가 모두에게 시킨 일은?"
          options:
            - text: "주전자 안에 독을 넣을 기회"
              add:
                mistake_count: 1
              goto: reconstruction_claim_wrong
            - text: "2번 잔을 아무도 보지 않는 짧은 틈"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: reconstruction_claim_correct
            - text: "향을 고르게 퍼뜨리려는 평범한 습관"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_claim_wrong

  reconstruction_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=25>뚜껑에 뭘 넣은 게 아니야.</speed> <speed=19>두 번째 소리가 사람들의 눈을 한곳에 묶었고, 소리 내지 않은 손은 2번 잔으로 갔어.</speed>"
      - choice:
          key: reconstruction_commit_choice
          prompt: "비명 직전, 모두의 시야에서 잘린 장면은?"
          options:
            - text: "주전자를 보는 사이 2번 잔에 손이 닿았다"
              goto: deduction_branch
            - text: "아직 다른 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: deduction_branch

  reconstruction_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(주전자는 네 잔 모두 음성.</speed> <speed=27>소리 난 곳이 아니라 안 보였던 곳으로.)</speed>"
      - choice:
          key: reconstruction_rebuttal_choice
          prompt: "어디로 시선을 돌릴까?"
          options:
            - text: "2번 잔으로 시선을 돌린다"
              goto: deduction_branch
            - text: "주전자 가설을 유지한다"
              add:
                trust: -1
              gameOver:
                title: "재구성 실패"
                message: "반응이 없는 주전자만 의심하는 사이 9시 29분의 빈틈이 닫혔다. 챕터 시작점에서 모두의 시선을 다시 재구성하자."

  deduction_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: deduction_score
                    op: gte
                    value: 4
                  - var: trust
                    op: gte
                    value: 0
                  - var: clue_double_press_decoy
                    op: eq
                    value: true
              goto: stable_frame
          default: shaky_frame

  stable_frame:
    actions:
      - effect: zoom
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: right
          emotion: serious
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=24>탁구공이 두 번 튀었을 때처럼 나도 소리 난 쪽을 봤어.</speed> <speed=19>그때 2번 잔만 모두의 시선 밖에 있었어.</speed>"
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: "<speed=28>응.</speed> <speed=21>우연히 생긴 틈이 아니야. 그 1초를 만들고, 미리 고른 잔으로 손을 뻗은 사람이 있어.</speed>"
      - add:
          final_confidence: 1
      - goto: lounge_handoff

  shaky_frame:
    actions:
      - effect: tilt
      - say:
          char: 코난.think
          text: "<speed=18>(시각은 잡았는데 손이 비어 있어.</speed> <speed=27>비명 직전, 문밖에서 본 눈이 필요해.)</speed>"
      - add:
          mistake_count: 1
      - goto: lounge_handoff

  lounge_handoff:
    actions:
      - bg: case_board
      - char:
          id: 코난
          position: left
          emotion: think
      - effect: focus
      - say:
          char: 코난.think
          text: "<speed=22>(다실 안의 기억은 같은 소리에 잘렸어.</speed> <speed=18>문밖에 있던 사람만 장면 전체를 봤을 거야.)</speed>"
      - goto: /routes/hub/1.yaml
