script:
  - scene: tea_invitation
  - scene: temperature_lesson
  - scene: tea_helper_choice
  - scene: tea_helper_finish
  - scene: record_keeper
  - scene: guest_arrival
  - scene: blind_tasting
  - scene: shared_table
  - scene: tea_name_choice
  - scene: tea_name_finish
  - scene: storm_news
  - scene: closing_preparation

scenes:
  tea_invitation:
    actions:
      - bg: ryokan_hall
      - music: rain
      - sound: door
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 란
          position: right
      - say:
          char: 레이코.smile
          with:
            - 란
          text: "<speed=27>쉬시는 중에 죄송합니다.</speed> <speed=23>다실에서 아버지가 남긴 배합의 마지막 시음을 합니다. 하루오 씨가 낯선 손님의 첫인상도 꼭 듣고 싶다고 해서요.</speed>"
      - say:
          char: 란
          with:
            - 레이코.smile
          text: "<speed=29>저희가 가도 돼요?</speed> <speed=24>좋아요. 저녁도 정말 맛있었고, 차 이야기도 듣고 싶었어요.</speed>"
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=36>전문가의 평가가 필요하다면 사양하지 않겠습니다.</speed> <speed=25>혀와 코는 이미 준비됐습니다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>아빠, 아까 빈 잔에서도 향이 난다고 했잖아요.</speed> <speed=23>차가 들어오기 전이었는데.</speed>"
      - say:
          char: 레이코.smile
          text: "<speed=26>그럼 더 좋습니다.</speed> <speed=23>아는 척하지 않는 손님이 첫 향은 가장 솔직하게 말하거든요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=25>아는 척하지 않는 전문가라... 칭찬 맞겠지?</speed>"

  temperature_lesson:
    actions:
      - bg: tea_room
      - music: intro
      - sound: cup_clink
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>가까이 와도 괜찮아.</speed> <speed=22>다만 손잡이만 잡으렴. 뚜껑은 소리도 크고, 지금 열면 첫 향이 달아나.</speed>"
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=27>온도계가 88도를 찍으면 바로 불을 끄는 거예요?</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>그래.</speed> <speed=21>그보다 뜨거우면 아버님의 향이 날아가고, 늦으면 떫은맛이 앞서지. 이 1도가 오늘 맛을 바꿔.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>그럼 제가 숫자를 보고 알려 드릴게요.</speed> <speed=23>사람은 놓쳐도 온도계는 시각까지 남기니까.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>부탁하마.</speed> <speed=21>차는 기다리는 시간도 맛의 일부야. 서두른 손은 나중에 잔에 꼭 흔적을 남기거든.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>네. 88도, 숫자가 바뀌는 순간 바로 말할게요.</speed>"

  tea_helper_choice:
    actions:
      - sound: cup_clink
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=26>코난 군, 다음 잔은 네가 도와줄래?</speed> <speed=22>누가 보지 않아도 같은 맛이 나게 하는 순서, 기억하고 있지?</speed>"
      - choice:
          key: tea_service_memory
          prompt: "마지막 잔에도 지켜야 할 하루오의 순서는?"
          options:
            - text: "손잡이만 잡고 88도가 될 때까지 기다린다"
              set:
                remembered_tea_order: true
              add:
                trust: 1
              goto: tea_helper_correct
            - text: "향이 퍼지도록 뚜껑을 두 번 누른다"
              goto: tea_helper_lid
            - text: "코고로에게 먼저 한 모금 부탁한다"
              goto: tea_helper_kogoro

  tea_helper_correct:
    actions:
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=27>손잡이만 잡고, 88도가 되는 순간 불을 꺼요.</speed> <speed=22>사람들 시선이 가는 뚜껑은 그대로 두고요.</speed>"
      - say:
          char: 하루오.smile
          text: "<speed=25>잘 들었네.</speed> <speed=21>오늘 마지막 네 잔도 같은 순서로 낼 거야. 잔 번호까지 내가 직접 확인하고.</speed>"
      - goto: tea_helper_finish

  tea_helper_lid:
    actions:
      - say:
          char: 코난.smile
          text: "<speed=28>뚜껑을 두 번 눌러서 향을 퍼뜨리면...</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=26>그러면 차보다 사람들이 먼저 그 소리를 보겠는데.</speed> <speed=22>향은 기다리면 올라와. 뚜껑은 그냥 두자.</speed>"
      - goto: tea_helper_finish

  tea_helper_kogoro:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=28>아저씨가 먼저 마셔 보는 건 어때요?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=38>훌륭한 조수로군!</speed>"
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코고로.proud
          text: "<speed=26>88도까지 손부터 참으시면 첫 잔을 드리죠.</speed> <speed=22>순서가 먼저입니다.</speed>"
      - goto: tea_helper_finish

  tea_helper_finish:
    actions:
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>좋아. 뜨겁다고 서두르지만 않으면 돼.</speed> <speed=21>온도는 기록에, 잔 번호는 내 눈에 남겨 둘 테니까.</speed>"

  record_keeper:
    actions:
      - sound: notebook_flip
      - char:
          id: 세이지
          position: left
          emotion: cold
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=25>첫 향을 맡은 시각, 오후 8시 34분.</speed> <speed=23>나중에 기억이 달라지지 않도록, 감상은 지금 한 단어로 말씀해 주십시오.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 세이지.cold
          text: "<speed=31>깊고, 우아하며, 범상치 않은...</speed>"
      - say:
          char: 세이지.cold
          text: "<speed=26>벌써 세 단어입니다.</speed> <speed=22>나중에 바꾸실 수 없게 하나만 남겨 주시죠.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=34>명품!</speed>"
      - char:
          id: 세이지
          position: left
          emotion: amused
      - say:
          char: 세이지.amused
          text: "<speed=24>‘명품이라고 주장함.’</speed> <speed=22>말씀하신 시각과 함께 그대로 기록하겠습니다.</speed>"
      - char:
          id: 란
          position: center
      - say:
          char: 란
          with:
            - 세이지.amused
          text: "<speed=28>세이지 씨, 방금 웃으신 거 맞죠?</speed> <speed=23>그것도 지금 기록해야 나중에 안 바뀌는데.</speed>"
      - say:
          char: 세이지.amused
          text: "<speed=24>기록할 필요가 없는 일입니다.</speed> <speed=22>이미 목격자가 둘이나 있으니까요.</speed>"

  guest_arrival:
    actions:
      - sound: door
      - char:
          id: 켄지
          position: left
          emotion: smile
      - char:
          id: 코고로
          position: right
          emotion: proud
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=32>이야, 손님이 먼저 맛보고 계셨군.</speed> <speed=25>하세가와 켄지입니다. 이 차를 세상에 내놓을 돈과 판로를 맡고 있죠.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 켄지.smile
          text: "<speed=31>모리 코고로입니다.</speed> <speed=25>좋은 물건과 수상한 계약을 알아보는 눈이라면 저도 뒤지지 않죠.</speed>"
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=30>그럼 혀부터 시험해 봅시다.</speed> <speed=24>재료 셋 중 둘을 맞히면 내일 아침 특식은 제가 내죠.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=38>좋습니다!</speed> <speed=27>대신 제가 맞히면 사인도 한 장 받아 가시죠.</speed>"
      - say:
          char: 켄지.smile
          text: "<speed=28>사인할 종이와 돈 낼 사람은 결과를 보고 정합시다.</speed> <speed=23>계약도 내기도 마지막 줄까지 봐야 하니까.</speed>"
      - say:
          char: 코난
          text: "<speed=25>둘 다 벌써 이긴 얼굴인데요.</speed> <speed=22>진 사람 이름은 기록에서 빼면 안 돼요.</speed>"

  blind_tasting:
    actions:
      - bg: tea_room
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 레이코.smile
          with:
            - 하루오.smile
          text: "<speed=26>첫 번째는 향만 맡아 주세요.</speed> <speed=22>아버지가 시작하고, 하루오 씨와 저희가 열 해 동안 고친 배합이에요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 레이코.smile
          text: "<speed=25>정답을 먼저 말하면 안 되지.</speed> <speed=22>아버님 이름보다 오늘 이 잔에서 나는 향을 먼저 듣자고.</speed>"
      - char:
          id: 란
          position: center
      - say:
          char: 란
          text: "<speed=27>처음엔 달콤한데, 뒤에는 젖은 나무 향이 나요.</speed> <speed=23>비가 그친 운동장처럼 익숙한데 조금 쓸쓸하고.</speed>"
      - say:
          char: 레이코.smile
          with:
            - 란
          text: "<speed=27>그 표현, 아버지가 좋아하셨을 거예요.</speed> <speed=22>완성된 맛보다 그 뒤에 남는 느낌을 더 오래 물으셨거든요.</speed>"
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          char: 코고로.proud
          with:
            - 켄지.smile
          text: "<speed=32>나는 알겠군.</speed> <speed=25>벚꽃, 산초, 그리고 최고급 녹차!</speed>"
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=30>셋 중 하나도 없소.</speed> <speed=24>그래도 자신감만큼은 만점이군.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=40>내가 모르는 재료만 골랐으니 문제에 함정이 너무 많잖소!</speed>"

  shared_table:
    actions:
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          text: "<speed=24>잠시 뒤 정답이 공개되자 다실에는 웃음이 터졌다.</speed> <speed=22>코고로가 확실히 맞힌 것은 뜨거운 물뿐이었고, 세이지는 그 답까지 시각 옆에 적었다.</speed>"
      - say:
          char: 켄지.smile
          with:
            - 하루오.smile
          text: "<speed=28>하루오 씨, 이 정도 반응이면 팔립니다.</speed> <speed=23>이제 이름과 권리만 정리하면 돼요. 그 고집도 오늘은 끝냅시다.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 켄지.smile
          text: "<speed=25>끝낼 고집이 아닙니다.</speed> <speed=22>이건 레이코 씨 아버님이 시작하고 우리 넷이 이어 온 맛이에요. 이름 하나라도 빠지면 다른 차가 됩니다.</speed>"
      - char:
          id: 레이코
          position: center
          emotion: smile
      - say:
          char: 레이코.smile
          text: "<speed=25>그래서 오늘 다 같이 이름을 정했으면 해요.</speed> <speed=22>마지막 잔을 마시고, 계약서 원본도 함께 확인한 뒤에요.</speed>"
      - say:
          char: 켄지.smile
          text: "<speed=27>맛보다 이름이 더 비싼 순간이 오죠.</speed> <speed=22>그 이름을 누가 소유하느냐는 더 비싸고.</speed>"
      - say:
          char: 하루오.smile
          text: "<speed=25>그래도 맛보다 먼저 소유자를 정하면 안 됩니다.</speed> <speed=21>사람 이름도 마찬가지고요.</speed>"

  tea_name_choice:
    actions:
      - bg: tea_room
      - music: intro
      - sound: notebook_flip
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 레이코.smile
          with:
            - 하루오.smile
          text: "<speed=26>그럼 후보만 받아 둘까요?</speed> <speed=22>오늘 이 차를 처음 기억해 준 손님들의 말도 첫 장에 남기고 싶어요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 레이코.smile
          text: "<speed=25>코난 군도 한 표.</speed> <speed=22>방금 맡은 향을 떠올려 봐.</speed>"
      - choice:
          key: tea_name_vote
          prompt: "오늘의 향과 이 차를 만든 사람들까지 남길 이름은?"
          options:
            - text: "비가 그친 뒤의 산길"
              set:
                tea_name_vote: "rain"
              goto: tea_name_rain
            - text: "네 사람의 찻잔"
              set:
                tea_name_vote: "people"
              add:
                trust: 1
              goto: tea_name_people
            - text: "명탐정 모리 특선"
              set:
                tea_name_vote: "detective"
              goto: tea_name_detective

  tea_name_rain:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=28>‘비가 그친 뒤의 산길’.</speed> <speed=23>아까 란 누나가 찍은 곳처럼, 달라져도 같은 자리인 걸 알아볼 수 있게요.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>좋다.</speed> <speed=22>내일 같은 자리에서 꼭 한 장 더 찍자. 이 차도 창가에서 같이 찍고.</speed>"
      - goto: tea_name_finish

  tea_name_people:
    actions:
      - char:
          id: 코난
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=28>‘네 사람의 찻잔’은 어때요?</speed> <speed=23>한 사람이 시작했어도 네 사람이 지켜 온 차라고 했잖아요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>마음에 드는구나.</speed> <speed=21>그 이름이면 누구 하나 작게 쓰거나 마지막 줄에서 뺄 수도 없겠어.</speed>"
      - goto: tea_name_finish

  tea_name_detective:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=28>명탐정 모리 특선!</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=40>역시 조수는 보는 눈이 있구나!</speed>"
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=29>그 이름은 모델료부터 협상해야겠는데요.</speed>"
      - goto: tea_name_finish

  tea_name_finish:
    actions:
      - char:
          id: 레이코
          position: left
          emotion: smile
