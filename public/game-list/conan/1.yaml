script:
  - scene: tea_invitation
  - scene: temperature_lesson
  - scene: tea_helper_choice
  - scene: tea_helper_finish
  - scene: record_keeper
  - scene: guest_arrival
  - scene: blind_tasting
  - scene: shared_table
  - scene: tea_name_choice
  - scene: tea_name_finish
  - scene: storm_news
  - scene: closing_preparation

scenes:
  tea_invitation:
    actions:
      - bg: ryokan_hall
      - music: rain
      - sound: door
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 란
          position: right
      - say:
          char: 레이코.smile
          with:
            - 란
          text: "<speed=27>쉬시는 중에 죄송합니다.</speed> <speed=23>다실에서 새 차를 시험하고 있는데, 괜찮으시면 함께 맛봐 주시겠어요?</speed>"
      - say:
          char: 란
          with:
            - 레이코.smile
          text: "<speed=29>저희가 가도 돼요?</speed> <speed=24>저녁도 정말 맛있었어요.</speed>"
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=36>전문가의 평가가 필요하다면 사양하지 않겠습니다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>아빠, 아까 빈 잔에서 향이 난다고 했잖아요.</speed>"
      - say:
          char: 레이코.smile
          text: "<speed=26>그럼 더 좋습니다.</speed> <speed=23>선입견 없는 손님이 가장 솔직하거든요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=25>그건 칭찬... 맞겠지?</speed>"

  temperature_lesson:
    actions:
      - bg: tea_room
      - music: intro
      - sound: cup_clink
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>가까이 와도 괜찮아.</speed> <speed=22>하지만 손잡이만 잡으렴. 아직 아주 뜨겁거든.</speed>"
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=27>88도가 되면 불을 끄는 거예요?</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>그래.</speed> <speed=21>그보다 뜨거우면 향이 날아가고, 너무 식으면 떫은맛이 세져.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>그럼 제가 숫자를 보고 알려 드릴게요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>부탁하마.</speed> <speed=21>차는 기다리는 시간도 맛의 일부거든.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>네. 88도 되면 바로 말할게요.</speed>"

  tea_helper_choice:
    actions:
      - sound: cup_clink
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=26>코난 군, 다음 잔은 네가 도와줄래?</speed> <speed=22>아까 말한 순서, 기억하고 있지?</speed>"
      - choice:
          key: tea_service_memory
          prompt: "하루오가 알려 준 시음 준비는?"
          options:
            - text: "손잡이만 잡고 88도가 될 때까지 기다린다"
              set:
                remembered_tea_order: true
              add:
                trust: 1
              goto: tea_helper_correct
            - text: "향이 퍼지도록 뚜껑을 두 번 누른다"
              goto: tea_helper_lid
            - text: "코고로에게 먼저 한 모금 부탁한다"
              goto: tea_helper_kogoro

  tea_helper_correct:
    actions:
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=27>손잡이만 잡고, 88도가 될 때 불을 꺼요.</speed> <speed=22>뚜껑은 그대로 두고요.</speed>"
      - say:
          char: 하루오.smile
          text: "<speed=25>잘 들었네.</speed> <speed=21>오늘 마지막 잔도 똑같이 낼 거야.</speed>"
      - goto: tea_helper_finish

  tea_helper_lid:
    actions:
      - say:
          char: 코난.smile
          text: "<speed=28>뚜껑을 두 번 눌러서 향을...</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=26>그러면 차보다 사람들이 먼저 놀라겠는데.</speed> <speed=22>뚜껑은 그냥 두자.</speed>"
      - goto: tea_helper_finish

  tea_helper_kogoro:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=28>아저씨가 먼저 마셔 보는 건 어때요?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=38>훌륭한 조수로군!</speed>"
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코고로.proud
          text: "<speed=26>88도까지 참으시면 첫 잔을 드리죠.</speed>"
      - goto: tea_helper_finish

  tea_helper_finish:
    actions:
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>좋아. 뜨겁다고 서두르지만 않으면 돼.</speed> <speed=21>잔 번호는 내가 다시 확인할 테고.</speed>"

  record_keeper:
    actions:
      - sound: notebook_flip
      - char:
          id: 세이지
          position: left
          emotion: cold
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=25>첫 향을 맡은 시각, 오후 8시 34분.</speed> <speed=23>감상은 짧게 말씀해 주십시오.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 세이지.cold
          text: "<speed=31>깊고, 우아하며, 범상치 않은...</speed>"
      - say:
          char: 세이지.cold
          text: "<speed=26>세 단어를 쓰셨습니다.</speed> <speed=22>하나만 남겨 주시죠.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=34>명품!</speed>"
      - char:
          id: 세이지
          position: left
          emotion: amused
      - say:
          char: 세이지.amused
          text: "<speed=24>'명품이라고 주장함.'</speed> <speed=22>그대로 기록하겠습니다.</speed>"
      - char:
          id: 란
          position: center
      - say:
          char: 란
          with:
            - 세이지.amused
          text: "<speed=28>세이지 씨, 웃으신 거 맞죠?</speed>"
      - say:
          char: 세이지.amused
          text: "<speed=24>기록할 필요가 없는 일입니다.</speed>"

  guest_arrival:
    actions:
      - sound: door
      - char:
          id: 켄지
          position: left
          emotion: smile
      - char:
          id: 코고로
          position: right
          emotion: proud
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=32>이야, 손님이 먼저 맛보고 계셨군.</speed> <speed=25>하세가와 켄지입니다. 이 차가 세상에 나가도록 돈을 대는 사람이고요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 켄지.smile
          text: "<speed=31>모리 코고로입니다.</speed> <speed=25>좋은 물건을 알아보는 눈이라면 저도 뒤지지 않죠.</speed>"
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=30>그럼 내기 하나 합시다.</speed> <speed=24>재료 셋 중 둘을 맞히면 내일 아침 특식을 제가 내죠.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=38>좋습니다!</speed> <speed=27>대신 제가 맞히면 사인도 한 장 받아 가시죠.</speed>"
      - say:
          char: 켄지.smile
          text: "<speed=28>누가 누구에게 하는 사인인지는 결과를 보고 정합시다.</speed>"
      - say:
          char: 코난
          text: "<speed=25>둘 다 벌써 이긴 얼굴인데요.</speed>"

  blind_tasting:
    actions:
      - bg: tea_room
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 레이코.smile
          with:
            - 하루오.smile
          text: "<speed=26>첫 번째는 향만 맡아 주세요.</speed> <speed=22>아버지가 산벚꽃이 피던 계절에 만든 배합이에요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 레이코.smile
          text: "<speed=25>정답을 먼저 말하면 안 되지.</speed> <speed=22>오늘은 손님들의 코를 믿어 보자고.</speed>"
      - char:
          id: 란
          position: center
      - say:
          char: 란
          text: "<speed=27>달콤한데 나무 향도 나요.</speed> <speed=23>비 온 뒤 운동장 같은 냄새도 조금.</speed>"
      - say:
          char: 레이코.smile
          with:
            - 란
          text: "<speed=27>그 표현, 아버지가 좋아하셨을 거예요.</speed>"
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          char: 코고로.proud
          with:
            - 켄지.smile
          text: "<speed=32>나는 알겠군.</speed> <speed=25>벚꽃, 산초, 그리고 최고급 녹차!</speed>"
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=30>셋 중 하나도 없소.</speed> <speed=24>그래도 자신감만큼은 만점이군.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=40>문제에 함정이 너무 많잖소!</speed>"

  shared_table:
    actions:
      - char:
          id: 하루오
          position: left
          emotion: smile
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          text: "<speed=24>잠시 뒤 정답이 공개되자 다실에는 웃음이 터졌다.</speed> <speed=22>코고로가 맞힌 것은 뜨거운 물뿐이었다.</speed>"
      - say:
          char: 켄지.smile
          with:
            - 하루오.smile
          text: "<speed=28>하루오 씨, 이 정도 반응이면 팔립니다.</speed> <speed=23>이번엔 정말 당신 고집이 맞았어요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 켄지.smile
          text: "<speed=25>내 고집이 아니라 우리 넷이 만든 맛입니다.</speed> <speed=22>레이코 씨 아버님 때부터 이어진 거니까요.</speed>"
      - char:
          id: 레이코
          position: center
          emotion: smile
      - say:
          char: 레이코.smile
          text: "<speed=25>다 같이 이름을 정했으면 해요.</speed> <speed=22>오늘 마지막 잔을 마신 뒤에.</speed>"
      - say:
          char: 켄지.smile
          text: "<speed=27>이름이라.</speed> <speed=22>그건 제일 비싼 문제가 되겠군.</speed>"
      - say:
          char: 하루오.smile
          text: "<speed=25>그래도 맛보다 먼저 정하면 안 됩니다.</speed>"

  tea_name_choice:
    actions:
      - bg: tea_room
      - music: intro
      - sound: notebook_flip
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 레이코.smile
          with:
            - 하루오.smile
          text: "<speed=26>그럼 후보만 받아 둘까요?</speed> <speed=22>오늘 이 차를 처음 마신 손님들의 이름도 남기고 싶어요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 레이코.smile
          text: "<speed=25>코난 군도 한 표.</speed> <speed=22>방금 맡은 향을 떠올려 봐.</speed>"
      - choice:
          key: tea_name_vote
          prompt: "새 차에 어울리는 이름은?"
          options:
            - text: "비가 그친 뒤의 산길"
              set:
                tea_name_vote: "rain"
              goto: tea_name_rain
            - text: "네 사람의 찻잔"
              set:
                tea_name_vote: "people"
              add:
                trust: 1
              goto: tea_name_people
            - text: "명탐정 모리 특선"
              set:
                tea_name_vote: "detective"
              goto: tea_name_detective

  tea_name_rain:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=28>비가 그친 뒤의 산길.</speed> <speed=23>아까 란 누나가 찍은 사진처럼.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>좋다.</speed> <speed=22>내일 같은 자리에서 꼭 한 장 더 찍자.</speed>"
      - goto: tea_name_finish

  tea_name_people:
    actions:
      - char:
          id: 코난
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 하루오.smile
          text: "<speed=28>네 사람의 찻잔은 어때요?</speed> <speed=23>한 사람이 만든 차가 아니라고 했잖아요.</speed>"
      - say:
          char: 하루오.smile
          with:
            - 코난.smile
          text: "<speed=25>마음에 드는구나.</speed> <speed=21>그 이름이면 누구 하나 작게 적을 일도 없겠어.</speed>"
      - goto: tea_name_finish

  tea_name_detective:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=28>명탐정 모리 특선!</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=40>역시 조수는 보는 눈이 있구나!</speed>"
      - char:
          id: 켄지
          position: right
          emotion: smile
      - say:
          char: 켄지.smile
          with:
            - 코고로.proud
          text: "<speed=29>그 이름은 모델료부터 협상해야겠는데요.</speed>"
      - goto: tea_name_finish

  tea_name_finish:
    actions:
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 하루오
          position: right
          emotion: smile
      - say:
          text: "<speed=24>레이코는 세 후보를 나란히 적었다.</speed> <speed=21>하루오는 종이 아래에 차를 만든 네 사람의 이름을 같은 크기로 덧붙였다.</speed>"
      - say:
          char: 레이코.smile
          with:
            - 하루오.smile
          text: "<speed=26>아버지 이름만 크게 쓰지 않아도 될까요?</speed>"
      - say:
          char: 하루오.smile
          with:
            - 레이코.smile
          text: "<speed=25>그분도 그러길 바라실 겁니다.</speed> <speed=21>함께 만든 차니까요.</speed>"
      - char:
          id: 세이지
          position: left
          emotion: amused
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 세이지.amused
          with:
            - 코고로.proud
          text: "<speed=24>명탐정 특선은 괄호 안에 적었습니다.</speed> <speed=21>검토 보류라는 뜻입니다.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 세이지.amused
          text: "<speed=36>왜 내 후보만 보류요!</speed>"
      - char:
          id: 레이코
          position: left
          emotion: smile
      - char:
          id: 란
          position: right
      - say:
          char: 란
          with:
            - 레이코.smile
          text: "<speed=27>어떤 이름이 되든, 내일 아침에 한 잔 더 마셔도 돼요?</speed>"
      - say:
          char: 레이코.smile
          with:
            - 란
          text: "<speed=26>물론이죠.</speed> <speed=22>비가 잦아들면 창가에 자리를 준비할게요.</speed>"
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=36>아침 특식 내기도 잊으면 안 됩니다!</speed>"
      - say:
          text: "<speed=24>다실에 다시 웃음이 번졌다.</speed> <speed=21>그때까지만 해도 종이 위 네 이름은 나란히 놓여 있었다.</speed>"

  storm_news:
    actions:
      - bg: rain_corridor
      - music: rain
      - sound: thunder
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 란
          position: right
          emotion: worried
      - say:
          char: 레이코.nervous
          with:
            - 란.worried
