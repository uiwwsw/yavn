title: "명탐정 코난 외전: 다실의 비밀"
author:
  name: "uiwwsw"
  contacts:
    - "Email: creator@yavn.dev"
    - label: "Homepage"
      value: "yavn.vercel.app"
      href: "https://yavn.vercel.app"
    - label: "LinkedIn"
      value: "linkedin.com/in/uiwwsw"
      href: "https://linkedin.com/in/uiwwsw"
version: "9.4"
seo:
  description: "폭우에 고립된 료칸에서 네 인물의 성격에 맞춰 심문하고, 지워지다 만 2R과 사라진 1분을 추적하는 코난풍 분기 미스터리."
  keywords:
    - "명탐정 코난"
    - "추리 게임"
    - "비주얼노벨"
    - "미스터리"
    - "분기 시나리오"
    - "캐릭터 심문"
  image: "assets/bg/title_storm-v2.avif"
  imageAlt: "폭우로 고립된 산악 료칸의 밤"
textSpeed: 38
autoSave: true
clickToInstant: true
ui:
  template: cinematic-noir
startScreen:
  enabled: true
  image: "assets/bg/title_storm-v2.avif"
  music: "assets/music/intro.mp3"
  showTitle: true
  startButtonText: "시작하기"
  buttonPosition: "bottom-center"
endingScreen:
  image: "assets/bg/mountain_rain-v2.avif"
endings:
  true_end:
    title: "TRUE END"
    message: "지워지다 만 2R과 사라진 1분을 연결해 다실 사건의 수법과 동기를 모두 밝혔다."
  normal_end:
    title: "NORMAL END"
    message: "2번 잔에 손댄 범인은 밝혔지만 계약서와 연구 노트의 진실은 경찰 조사로 남았다."
  bad_end:
    title: "BAD END"
    message: "결정적인 1분을 증명하지 못한 채 범인은 침묵 속에 숨었다."
endingRules:
  - when:
      all:
        - var: culprit_answer
          op: eq
          value: "레이코"
        - var: deduction_score
          op: gte
          value: 10
        - var: mistake_count
          op: lte
          value: 2
        - var: trust
          op: gte
          value: 2
        - var: final_confidence
          op: gte
          value: 6
        - var: clue_rim_reagent
          op: eq
          value: true
        - var: clue_haruo_wipe
          op: eq
          value: true
        - var: clue_order_note
          op: eq
          value: true
        - var: reiko_motive_open
          op: eq
          value: true
    ending: true_end
  - when:
      all:
        - var: culprit_answer
          op: eq
          value: "레이코"
        - var: deduction_score
          op: gte
          value: 6
        - var: final_confidence
          op: gte
          value: 3
        - var: mistake_count
          op: lte
          value: 5
    ending: normal_end
defaultEnding: bad_end
