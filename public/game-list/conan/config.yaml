title: "명탐정 코난 외전: 폭우의 2번 찻잔"
author:
  name: "uiwwsw"
  contacts:
    - "Email: creator@yavn.dev"
    - label: "Homepage"
      value: "yavn.vercel.app"
      href: "https://yavn.vercel.app"
    - label: "LinkedIn"
      value: "linkedin.com/in/uiwwsw"
      href: "https://linkedin.com/in/uiwwsw"
version: "10.8.0"
legalNotices:
  - id: "detective-conan-noncommercial-fan-demo"
    title: "비공식·비상업적 팬 데모"
    copyright: "명탐정 코난 관련 명칭·캐릭터와 원작 요소의 권리는 각 권리자에게 있습니다."
    text: "이 작품은 YAVN 엔진 기능 검증을 위해 제작된 비공식·비상업적 팬 데모입니다. 데모 자체는 판매·유료 기능·광고·후원 유도 등으로 수익화하지 않으며, 원작자·출판사·제작사·배급사 등 권리자와 제휴하거나 승인받은 공식 작품이 아닙니다. ‘비상업적’ 표시는 이용 허락을 대신하지 않습니다. 권리자의 요청이 있으면 공개를 중단하고 관련 자산을 제거합니다."
seo:
  description: "평온한 가족 여행이 폭우 속 밀실 사건으로 뒤집힌다. 코난과 란, 코고로가 2번 찻잔과 사라진 1분을 추적하는 캐릭터 중심 분기 미스터리."
  keywords:
    - "명탐정 코난"
    - "추리 게임"
    - "비주얼노벨"
    - "미스터리"
    - "분기 시나리오"
    - "캐릭터 심문"
  image: "assets/bg/title_storm-social.jpg"
  imageAlt: "폭우로 고립된 산악 료칸의 밤"
textSpeed: 32
autoSave: true
clickToInstant: true
ui:
  template: cinematic-noir
startScreen:
  enabled: true
  image: "assets/bg/title_storm-v2.avif"
  music: "assets/music/intro.mp3"
  showTitle: true
  startButtonText: "시작하기"
  buttonPosition: "bottom-center"
  eyebrow: "비가 멎기 전에, 진실을 찾아라"
  subtitle: "모든 증언에는 빈틈이 있다. 당신은 무엇을 믿을 것인가."
  scene:
    layout: split
    motion: push
    duration: 32000
    parallax: 10
    particles: rain
    intensity: 0.85
    fog: true
    light: lightning
    accent: "#a4c6e8"
    transition: { type: iris, duration: 1100 }
endingScreen:
  image: "assets/bg/mountain_rain-v2.avif"
endings:
  true_end:
    title: "진엔딩 — 끝까지 들은 문장"
    background: mountain_rain
    music: rain
    tone: hopeful
    epilogue: "산길이 다시 열린 아침, 란은 같은 자리에서 사진을 한 장 더 찍었다. 코난은 두 사진 사이에 남은 밤을 오래 바라봤다."
    message: "지워지다 만 2R과 사라진 1분을 되살려, 하루오가 끝까지 남기려 한 진실을 밝혔다."
  normal_end:
    title: "엔딩 — 비 속에 남은 이름"
    background: rain_corridor
    music: confession
    tone: mystery
    epilogue: "돌아가는 차 안에서 수첩이 한 번 더 펼쳐졌다. 범인의 이름 아래에는 아직 묻지 못한 질문이 남아 있었다."
    message: "2번 잔에 손댄 범인은 밝혔지만 계약서와 연구 노트의 진실은 경찰 조사로 남았다."
  bad_end:
    title: "미해결 — 사라진 1분"
    background: tea_room
    music: mystery
    tone: tragic
    epilogue: "다실에는 새 컵받침이 놓였다. 비가 그친 뒤에도, 지워진 획이 있던 자리만은 끝내 마르지 않았다."
    message: "결정적인 1분을 증명하지 못한 채 범인은 침묵 속에 숨었다."
endingRules:
  - when:
      all:
        - var: culprit_answer
          op: eq
          value: "레이코"
        - var: deduction_score
          op: gte
          value: 10
        - var: mistake_count
          op: lte
          value: 2
        - var: trust
          op: gte
          value: 2
        - var: final_confidence
          op: gte
          value: 6
        - var: clue_rim_reagent
          op: eq
          value: true
        - var: clue_haruo_wipe
          op: eq
          value: true
        - var: clue_order_note
          op: eq
          value: true
        - var: reiko_motive_open
          op: eq
          value: true
        - var: clue_double_press_decoy
          op: eq
          value: true
        - var: clue_kenji_rejected_deal
          op: eq
          value: true
    ending: true_end
  - when:
      all:
        - var: culprit_answer
          op: eq
          value: "레이코"
        - var: deduction_score
          op: gte
          value: 6
        - var: final_confidence
          op: gte
          value: 3
        - var: mistake_count
          op: lte
          value: 5
    ending: normal_end
defaultEnding: bad_end
