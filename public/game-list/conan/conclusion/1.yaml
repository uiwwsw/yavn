script:
  - scene: final_intro
  - scene: sleeping_kogoro
  - scene: reasoning_tone_branch
  - scene: sharp_reasoning
  - scene: cautious_reasoning
  - scene: coverage_branch
  - scene: full_coverage_line
  - scene: partial_coverage_line
  - scene: early_exit_line
  - scene: final_accuse_gate
  - scene: accuse_confirm_reiko
  - scene: accuse_confirm_other
  - scene: wrong_answer_check
  - scene: comeback_gate
  - scene: verdict_branch
  - scene: true_epilogue
  - scene: true_coda
  - scene: true_coda_finish
  - scene: normal_epilogue
  - scene: bad_epilogue

scenes:
  final_intro:
    actions:
      - bg: case_board
      - music: tension
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          char: 코난.think
          text: "<speed=18>(잔 가장자리와 R에 같은 섬유가 남았고, 온도계는 9시 29분에 멈췄어.)</speed>"
      - wait: 300
      - say:
          char: 코난.think
          text: "<speed=18>(하루오 씨가 남긴 순서대로 되짚으면 돼.</speed> <speed=27>아저씨, 잠깐 빌릴게.)</speed>"
      - goto: sleeping_kogoro

  sleeping_kogoro:
    actions:
      - bg: tea_room
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 코난.think
          text: "<speed=39>자, 전부 다실로!</speed> <speed=25>이 모리 코고로가 10분 안에 끝내 주지.</speed> <speed=35>범인이 누구인지까지!</speed>"
      - effect: flash
      - say:
          char: 코난.think
          with:
            - 코고로.proud
          text: "<speed=18>(그 10분이면 충분해.)</speed>"
      - say:
          text: "<speed=48>퓻.</speed> <speed=21>코고로의 말이 끊기고, 몸이 벽기둥에 기대어 천천히 내려앉았다.</speed>"
      - effect: pulse
      - say:
          char: 코고로.proud
          text: "<speed=25>...그 전에, 눈앞에서 두 번이나 벌어졌는데 아무도 보지 못한 일을 말씀드리죠.</speed>"
      - add:
          final_confidence: 1
      - goto: reasoning_tone_branch

  reasoning_tone_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: final_confidence
                    op: gte
                    value: 5
                  - var: trust
                    op: gte
                    value: 2
              goto: sharp_reasoning
          default: cautious_reasoning

  sharp_reasoning:
    actions:
      - music: reasoning
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=28>범행 도구는 주전자가 아닙니다.</speed> <speed=21>안에 뭔가 있었다면 1번부터 4번까지 모두 같은 반응이 나왔어야 하니까요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=25>반응은 2번 잔의 바깥 가장자리뿐.</speed> <speed=19>범인은 물기를 닦는 한 번의 동작으로, 하루오 씨 입이 닿을 곳에만 물질을 남겼습니다.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=21>감식 결과와 일치합니다.</speed> <speed=18>주전자는 네 잔 모두 아무 반응이 없었고요.</speed>"
      - goto: coverage_branch

  cautious_reasoning:
    actions:
      - music: reasoning
      - effect: darken
      - say:
          char: 코고로.proud
          text: "<speed=25>확실한 것부터 갑시다.</speed> <speed=19>누군가 하루오 씨의 2번 잔, 그중에서도 입이 닿는 바깥쪽만 닦았습니다.</speed>"
      - say:
          char: 란.worried
          with:
            - 코고로.proud
          text: "<speed=23>그 손수건이 쓰러진 뒤엔 컵받침으로 갔어요.</speed> <speed=18>하루오 씨가 남긴 R을 지우려고요.</speed>"
      - goto: coverage_branch

  coverage_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: full_coverage_line
          default: partial_coverage_line

  full_coverage_line:
    actions:
      - say:
          char: 코고로.proud
          text: "<speed=25>배정표는 2번 잔을, 통화 기록은 문밖을, 온도계는 9시 29분을 가리킵니다.</speed> <speed=19>감식 결과가 그 셋을 한 장의 손수건으로 잇고요.</speed>"
      - goto: final_accuse_gate

  partial_coverage_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(빈 진술이 있어.</speed> <speed=30>잔의 흔적부터.)</speed>"
      - branch:
          cases:
            - when:
                var: early_exit_taken
                op: eq
                value: true
              goto: early_exit_line
          default: final_accuse_gate

  early_exit_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(빈칸은 있어도 손수건은 하나야.)</speed>"
      - goto: final_accuse_gate

  final_accuse_gate:
    actions:
      - bg: tea_room
      - music: solvethecase
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=28>9시 29분.</speed> <speed=19>두 번째 뚜껑 소리에 모두가 주전자를 본 순간, 손수건을 2번 잔에 댄 사람은 단 한 명입니다.</speed>"
      - choice:
          key: final_accuse
          prompt: "9시 29분, 2번 잔을 닦은 사람은?"
          options:
            - text: "레이코"
              set:
                culprit_answer: "레이코"
              add:
                final_confidence: 1
              goto: accuse_confirm_reiko
            - text: "세이지"
              set:
                culprit_answer: "세이지"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other
            - text: "켄지"
              set:
                culprit_answer: "켄지"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other
            - text: "하루오의 자작극이었다"
              set:
                culprit_answer: "하루오"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other

  accuse_confirm_reiko:
    actions:
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=30>레이코 씨.</speed> <speed=19>온도계 기록에서 잘라 낸 그 1분 동안, 당신은 2번 잔을 닦았습니다.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코고로.proud
          text: "<speed=18>시음 책임자가 흘린 물기를 닦은 게...</speed> <speed=16>그게 살인의 증거라도 된다는 건가요?</speed>"
      - choice:
          key: final_accuse_confirm_reiko
          prompt: "손수건의 두 동작을 이을 증거는?"
          options:
            - text: "잔의 시료 카드와 9시 29분 메모를 겹친다"
              goto: verdict_branch
            - text: "잔과 손수건의 섬유를 한 번 더 확인한다"
              add:
                final_confidence: -1
              goto: final_accuse_gate

  accuse_confirm_other:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(그 손이 9시 29분에 잔까지 갔나?)</speed>"
      - say:
          char: 란.worried
          with:
            - 코난.think
          text: "<speed=21>잠깐, 코난.</speed> <speed=18>그 사람이라면 2번 잔과 R에 남은 같은 섬유는 어떻게 설명해?</speed>"
      - choice:
          key: final_accuse_confirm_other
          prompt: "그 지목으로 손수건의 두 동작이 이어질까?"
          options:
            - text: "잔과 섬유를 다시 확인한다"
              add:
                final_confidence: -1
              goto: final_accuse_gate
            - text: "이 사람이 범인이라고 주장한다"
              goto: wrong_answer_check

  wrong_answer_check:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(아니야.</speed> <speed=30>이름부터 골랐어.)</speed>"
      - branch:
          cases:
            - when:
                all:
                  - var: comeback_chance
                    op: gte
                    value: 1
                  - var: deduction_score
                    op: gte
                    value: 5
                  - var: mistake_count
                    op: lte
                    value: 4
              goto: comeback_gate
          default: bad_epilogue

  comeback_gate:
    actions:
      - set:
          comeback_chance: 0
      - say:
          char: 코난.serious
          text: "<speed=23>(쓴 순서대로.)</speed> <speed=18>2, R, 그리고 9시 29분.</speed>"
      - choice:
          key: final_comeback
          prompt: "세 흔적을 한 손으로 이을 사람은?"
          options:
            - text: "레이코"
              set:
                culprit_answer: "레이코"
              add:
                deduction_score: 1
                trust: 1
                final_confidence: 1
              goto: verdict_branch
            - text: "세이지"
              set:
                culprit_answer: "세이지"
              add:
                mistake_count: 1
              goto: bad_epilogue
            - text: "켄지"
              set:
                culprit_answer: "켄지"
              add:
                mistake_count: 1
              goto: bad_epilogue
            - text: "하루오의 자작극"
              set:
                culprit_answer: "하루오"
              add:
                mistake_count: 1
              goto: bad_epilogue

  verdict_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 10
                  - var: mistake_count
                    op: lte
                    value: 2
                  - var: trust
                    op: gte
                    value: 2
                  - var: final_confidence
                    op: gte
                    value: 6
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: clue_haruo_wipe
                    op: eq
                    value: true
                  - var: clue_order_note
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: true
              goto: true_epilogue
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 6
                  - var: final_confidence
                    op: gte
                    value: 3
                  - var: mistake_count
                    op: lte
                    value: 5
              goto: normal_epilogue
          default: bad_epilogue

  true_epilogue:
    actions:
      - bg: tea_room
      - music: solvethecase
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=25>배정표를 본 당신은 하루오 씨가 2번 잔을 고른 걸 알고 있었습니다.</speed> <speed=19>그리고 9시 29분, 뚜껑을 두 번 울려 모두의 눈을 주전자로 불렀죠.</speed>"
      - use: tea_residue_report
      - use: reiko_statement_note
      - say:
          char: 코고로.proud
          text: "<speed=23>그 순간 손수건으로 2번 잔의 물기를 닦았습니다.</speed> <speed=18>그리고 하루오 씨가 쓰러지자, 같은 손수건으로 이번엔 컵받침의 R을 문질렀습니다.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=21>두 곳의 섬유는 같은 손수건.</speed> <speed=18>온도계는 그 손이 움직인 9시 29분에 멈췄습니다.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=25>하루오 씨가 쓴 순서는 '2번 잔', 그리고 '레이코'.</speed> <speed=19>당신이 지우려 한 R은 마지막 고발이었습니다.</speed>"
      - music: confession
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=18>그날 저녁, 복도에서 들었어요.</speed> <speed=16>하루오 씨가 '원본은 회사에 넘긴다'고...</speed> <speed=16>아버지 이름까지 팔아 버리는 줄 알았어요.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=16>빼앗기기 전에 막아야 한다고...</speed> <speed=16>그 생각만 했어요.</speed> <speed=33>겁만 주려 했다는 말은 못 해요.</speed> <speed=16>2번 잔을 알고 준비했으니까.</speed>"
      - say:
          char: 켄지.angry
          with:
            - 레이코.nervous
            - 코고로.proud
          text: "<speed=26>당신은 뒷말을 못 들었어.</speed> <speed=19>하루오는 내 제안을 거절했다.</speed> <speed=33>'만든 사람 이름 하나라도 빼면 거래는 없다'고.</speed>"
      - say:
          char: 레이코.nervous
          delivery: whisper
          with:
            - 켄지.angry
          text: "<speed=16>거절...</speed> <speed=16>했다고요?</speed>"
      - say:
          char: 란.worried
          with:
            - 레이코.nervous
          text: "<speed=23>하루오 씨는 쓰러지면서도 2번 잔부터 붙잡았어요.</speed> <speed=18>끝까지 그 차와 이름을 지키려 했던 거예요.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 란.worried
          text: "<speed=16>왜...</speed> <speed=16>왜 나한테 말하지 않았어...</speed> <speed=16>아니.</speed> <speed=16>내가 한 번도 묻지 않았구나.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=25>두려웠다면 더더욱 물었어야 합니다.</speed> <speed=19>당신은 배합을 지킨 게 아니라, 그 사람의 대답을 영원히 빼앗은 겁니다.</speed>"
      - goto: true_coda

  true_coda:
    actions:
      - bg: mountain_rain
      - music: rain
      - effect: blur
      - say:
          text: "<speed=21>새벽 2시 10분.</speed> <speed=18>빗줄기가 가늘어질 무렵, 산길 아래에서 구조대 불빛이 올라왔다.</speed>"
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: center
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: think
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=30>으음...</speed> <speed=37>뭐야, 벌써 다 끝난 거냐?</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=26>아빠가 다 해결하셨잖아요.</speed> <speed=21>또 본인이 한 추리만 기억 안 나시죠?</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 란
          text: "<speed=40>무, 무슨 소리냐!</speed> <speed=25>진짜 명추리는 머리가 아니라 몸이 기억하는 법이야!</speed>"
      - branch:
          cases:
            - when:
                var: souvenir_choice
                op: eq
                value: "paddle"
              goto: true_coda_paddle
            - when:
                var: souvenir_choice
                op: eq
                value: "tea"
              goto: true_coda_tea
          default: true_coda_postcard

  true_coda_paddle:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=25>아빠 가방에 라켓 열쇠고리 달아 놨어요.</speed> <speed=21>오늘 진 사람이 갖기로 했잖아요.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=36>그건 내일 결승 우승 상품이라니까!</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          text: "<speed=27>삼세판은 어젯밤에 끝났어요.</speed>"
      - goto: true_coda_finish

  true_coda_tea:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=24>향주머니는 챙겼어.</speed> <speed=21>아침 차는 못 마셨지만, 이 향은 오래 남겠지.</speed>"
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=26>다음에 다시 와서 마시면 돼.</speed> <speed=22>그땐 신이치 형도 같이.</speed>"
      - say:
          char: 란
          text: "<speed=25>그래. 다음엔 도망 못 가게 미리 잡아 둬야겠다.</speed>"
      - goto: true_coda_finish

  true_coda_postcard:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=24>엽서랑 같은 자리에서 사진 찍기로 했는데, 오늘은 어렵겠네.</speed>"
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=26>다음에 다시 오면 돼.</speed> <speed=22>그땐 아저씨도 눈 안 감게 찍자.</speed>"
      - say:
          char: 란
          text: "<speed=26>좋아. 셋 다 웃는 걸로.</speed>"
      - goto: true_coda_finish

  true_coda_finish:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 란
          position: right
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=29>다음 여행은 비 안 오는 곳으로 가자.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=27>탁구대 있는 곳으로요?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=32>그 얘기는 이제 그만해!</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          text: "<speed=25>다음 여행은 정말 아무 일도 없으면 좋겠어요.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
