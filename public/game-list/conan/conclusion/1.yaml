script:
  - scene: final_intro
  - scene: sleeping_kogoro
  - scene: reasoning_tone_branch
  - scene: sharp_reasoning
  - scene: cautious_reasoning
  - scene: coverage_branch
  - scene: full_coverage_line
  - scene: partial_coverage_line
  - scene: early_exit_line
  - scene: final_accuse_gate
  - scene: accuse_confirm_reiko
  - scene: accuse_confirm_other
  - scene: wrong_answer_check
  - scene: comeback_gate
  - scene: verdict_branch
  - scene: true_epilogue
  - scene: normal_epilogue
  - scene: bad_epilogue

scenes:
  final_intro:
    actions:
      - bg: case_board
      - music: reasoning
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          char: 코난.think
          text: "<speed=24>(2번 잔, 멈춘 온도계, 손수건 섬유, 그리고 지워지다 만 R.)</speed>"
      - wait: 300
      - say:
          char: 코난.think
          text: "<speed=22>(이제 범인이 숨긴 1분을 되돌려 놓기만 하면 돼.)</speed> <speed=48>아저씨, 잠깐만 빌릴게.</speed>"
      - goto: sleeping_kogoro

  sleeping_kogoro:
    actions:
      - bg: ryokan_hall
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 코난.think
          text: "<speed=44>자, 다들 주목!</speed> <speed=28>이 모리 코고로가 사건의 진상을...</speed>"
      - effect: flash
      - say:
          char: 코난.think
          with:
            - 코고로.proud
          text: "<speed=22>(미안, 아저씨.)</speed>"
      - say:
          text: "<speed=54>퓻-!</speed> <speed=26>작은 소리 뒤에 코고로의 어깨가 툭 내려앉았다.</speed>"
      - effect: pulse
      - say:
          char: 코고로.proud
          text: "<speed=30>...그 전에, 여러분이 잘못 보고 있던 것부터 바로잡겠습니다.</speed>"
      - add:
          final_confidence: 1
      - goto: reasoning_tone_branch

  reasoning_tone_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: final_confidence
                    op: gte
                    value: 5
                  - var: trust
                    op: gte
                    value: 2
              goto: sharp_reasoning
          default: cautious_reasoning

  sharp_reasoning:
    actions:
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=34>독은 주전자 안에 없었습니다.</speed> <speed=26>그랬다면 같은 차를 마신 네 사람이 모두 쓰러졌어야 하죠.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=28>반응이 나온 곳은 2번 잔의 바깥 가장자리뿐.</speed> <speed=24>범인은 손수건으로 물기를 닦는 척하며 그곳에 물질을 옮겼습니다.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=26>그래서 주전자와 나머지 잔에서는 아무 반응도 나오지 않았군요.</speed>"
      - goto: coverage_branch

  cautious_reasoning:
    actions:
      - effect: darken
      - say:
          char: 코고로.proud
          text: "<speed=30>한 가지는 분명합니다.</speed> <speed=24>하루오 씨가 마신 2번 잔의 가장자리만 누군가 손댔다는 것.</speed>"
      - say:
          char: 란.worried
          with:
            - 코고로.proud
          text: "<speed=28>그리고 그 손수건이...</speed> <speed=22>하루오 씨가 남긴 글자에도 닿았던 거구나.</speed>"
      - goto: coverage_branch

  coverage_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: full_coverage_line
          default: partial_coverage_line

  full_coverage_line:
    actions:
      - say:
          char: 코고로.proud
          text: "<speed=30>잔 배정표와 통화 기록, 온도계, 감식 결과.</speed> <speed=24>네 기록이 모두 같은 1분을 가리킵니다.</speed>"
      - goto: final_accuse_gate

  partial_coverage_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(아직 확인하지 못한 진술이 있어.)</speed> <speed=46>수법부터 흔들리지 않게 말해야 해.</speed>"
      - branch:
          cases:
            - when:
                var: early_exit_taken
                op: eq
                value: true
              goto: early_exit_line
          default: final_accuse_gate

  early_exit_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(빈칸은 남았지만, 2번 잔에 닿은 손은 하나뿐이야.)</speed>"
      - goto: final_accuse_gate

  final_accuse_gate:
    actions:
      - bg: tea_room
      - music: reasoning
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=34>9시 29분, 모두의 시선이 주전자에 쏠린 순간.</speed> <speed=24>2번 잔에 손수건을 댄 사람은 단 한 명입니다.</speed>"
      - choice:
          key: final_accuse
          prompt: "하루오의 2번 잔에 손댄 사람은?"
          options:
            - text: "레이코"
              set:
                culprit_answer: "레이코"
              add:
                final_confidence: 1
              goto: accuse_confirm_reiko
            - text: "세이지"
              set:
                culprit_answer: "세이지"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other
            - text: "켄지"
              set:
                culprit_answer: "켄지"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other
            - text: "하루오의 자작극이었다"
              set:
                culprit_answer: "하루오"
              add:
                mistake_count: 1
                trust: -1
              goto: accuse_confirm_other

  accuse_confirm_reiko:
    actions:
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=34>레이코 씨.</speed> <speed=24>온도계에서 눈을 뗀 그 1분 동안, 당신은 2번 잔을 닦았습니다.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코고로.proud
          text: "<speed=22>제가 물기를 닦은 게 살인의 증거라도 되나요?</speed>"
      - choice:
          key: final_accuse_confirm_reiko
          prompt: "레이코의 반박에 무엇을 내놓을까?"
          options:
            - text: "시료 카드와 진술 메모를 나란히 펼친다"
              goto: verdict_branch
            - text: "아직 연결이 부족하다"
              add:
                final_confidence: -1
              goto: final_accuse_gate

  accuse_confirm_other:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(그 사람이라면 9시 29분에 2번 잔에 닿을 수 있었을까?)</speed>"
      - say:
          char: 란.worried
          with:
            - 코난.think
          text: "<speed=26>잠깐...</speed> <speed=22>그럼 손수건 섬유와 비어 있는 1분은 어떻게 설명하지?</speed>"
      - choice:
          key: final_accuse_confirm_other
          prompt: "이 지목으로 수법까지 설명할 수 있을까?"
          options:
            - text: "모순을 인정하고 다시 생각한다"
              add:
                final_confidence: -1
              goto: final_accuse_gate
            - text: "이 사람이 범인이라고 주장한다"
              goto: wrong_answer_check

  wrong_answer_check:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(아니야. 이 추리로는 2번 잔의 흔적이 설명되지 않아.)</speed>"
      - branch:
          cases:
            - when:
                all:
                  - var: comeback_chance
                    op: gte
                    value: 1
                  - var: deduction_score
                    op: gte
                    value: 5
                  - var: mistake_count
                    op: lte
                    value: 4
              goto: comeback_gate
          default: bad_epilogue

  comeback_gate:
    actions:
      - set:
          comeback_chance: 0
      - say:
          char: 코난.serious
          text: "<speed=28>(처음부터 다시.)</speed> <speed=22>잔 번호 2, 지워지다 만 R, 9시 29분의 빈칸.</speed>"
      - choice:
          key: final_comeback
          prompt: "세 단서가 함께 가리키는 사람은?"
          options:
            - text: "레이코"
              set:
                culprit_answer: "레이코"
              add:
                deduction_score: 1
                trust: 1
                final_confidence: 1
              goto: verdict_branch
            - text: "세이지"
              set:
                culprit_answer: "세이지"
              add:
                mistake_count: 1
              goto: bad_epilogue
            - text: "켄지"
              set:
                culprit_answer: "켄지"
              add:
                mistake_count: 1
              goto: bad_epilogue
            - text: "하루오의 자작극"
              set:
                culprit_answer: "하루오"
              add:
                mistake_count: 1
              goto: bad_epilogue

  verdict_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 10
                  - var: mistake_count
                    op: lte
                    value: 2
                  - var: trust
                    op: gte
                    value: 2
                  - var: final_confidence
                    op: gte
                    value: 6
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: clue_haruo_wipe
                    op: eq
                    value: true
                  - var: clue_order_note
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: true
              goto: true_epilogue
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 6
                  - var: final_confidence
                    op: gte
                    value: 3
                  - var: mistake_count
                    op: lte
                    value: 5
              goto: normal_epilogue
          default: bad_epilogue

  true_epilogue:
    actions:
      - bg: mountain_rain
      - music: solvethecase
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=30>세이지 씨의 배정표로 당신은 하루오 씨가 2번 잔을 쓴다는 걸 알고 있었습니다.</speed> <speed=24>그리고 9시 29분, 뚜껑을 두 번 눌러 모두의 눈을 돌렸죠.</speed>"
      - use: tea_residue_report
      - use: reiko_statement_note
      - say:
          char: 코고로.proud
          text: "<speed=28>그 틈에 손수건으로 2번 잔을 닦는 척하며 물질을 옮겼습니다.</speed> <speed=22>하루오 씨가 쓰러진 뒤에는 같은 손수건으로 R을 지우려 했고요.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=26>R 끝과 잔 가장자리에서 나온 섬유가 같은 이유...</speed> <speed=22>그거였군요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=30>하루오 씨가 남긴 2R은 '2번 잔, 레이코'.</speed> <speed=24>당신이 지우려 한 마지막 고발입니다.</speed>"
      - music: confession
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=22>아버지가 평생 만든 배합이었어요.</speed> <speed=18>그런데 하루오 씨는 원본 노트를 켄지 씨 회사에 넘기고 돈을 받겠다고 했어요.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=20>빼앗기기 전에 막아야 한다는 생각뿐이었어요.</speed> <speed=18>겁만 주려 했다는 말도 못 하겠네요...</speed> <speed=42>2번 잔을 알고 준비했으니까.</speed>"
      - say:
          char: 켄지.angry
          with:
            - 레이코.nervous
            - 코고로.proud
          text: "<speed=34>돈으로 몰아붙인 건 나야.</speed> <speed=24>그래도 사람을 죽여서 지킬 이름이 어디 있어!</speed>"
      - music: solvethecase
      - say:
          char: 란.worried
          with:
            - 레이코.nervous
          text: "<speed=28>지키고 싶었다면 하루오 씨에게 먼저 물었어야죠.</speed> <speed=22>그 차를 정말 누가 빼앗으려 했는지.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 란.worried
          text: "<speed=18>묻기가 무서웠어요.</speed> <speed=16>아니...</speed> <speed=18>대답을 듣기가 무서웠어요.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 레이코.nervous
          text: "<speed=34>무슨 사정이 있어도 피해자가 말할 기회까지 빼앗을 권리는 없습니다!</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(비는 곧 그치겠지.)</speed> <speed=18>하지만 한 잔의 차에 남은 죄까지 씻어 주진 못해.</speed>"
      - ending: true_end

  normal_epilogue:
    actions:
      - bg: mountain_rain
      - music: reasoning
      - effect: blur
      - say:
          char: 코고로.proud
          text: "<speed=30>2번 잔에 손댄 수법과 범인은 밝혀졌습니다.</speed> <speed=24>남은 동기와 계약서 문제는 경찰 감식이 채워 줄 겁니다.</speed>"
      - say:
          text: "<speed=26>산길이 열린 뒤 레이코는 경찰과 함께 료칸을 떠났다.</speed> <speed=22>몇 가지 의문은 빗소리 속에 남았다.</speed>"
      - ending: normal_end

  bad_epilogue:
    actions:
      - bg: mountain_rain
      - music: reasoning
      - sound: thunder
      - effect: shake
      - say:
          char: 코난.think
          text: "<speed=22>(서로의 진술만 흔들었을 뿐, 2번 잔에 닿은 손을 증명하지 못했어.)</speed>"
      - say:
          text: "<speed=26>경찰이 도착할 때까지 범인은 끝내 입을 열지 않았다.</speed>"
      - ending: bad_end
