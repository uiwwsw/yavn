script:
  - scene: final_intro
  - scene: sleeping_kogoro
  - scene: reasoning_tone_branch
  - scene: sharp_reasoning
  - scene: cautious_reasoning
  - scene: coverage_branch
  - scene: full_coverage_line
  - scene: partial_coverage_line
  - scene: early_exit_line
  - scene: final_accuse_gate
  - scene: accuse_confirm_reiko
  - scene: verdict_branch
  - scene: true_epilogue
  - scene: true_coda
  - scene: true_coda_finish
  - scene: normal_epilogue
  - scene: bad_epilogue

scenes:
  final_intro:
    actions:
      - bg: case_board
      - music: tension
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          when:
            all:
              - { var: clue_haruo_wipe, op: eq, value: true }
              - { var: clue_rim_reagent, op: eq, value: true }
          char: 코난.think
          text: "<speed=18>(같은 천이 9시 29분엔 잔을, 비명 뒤엔 R을 닦았어.)</speed>"
      - say:
          when:
            not:
              all:
                - { var: clue_haruo_wipe, op: eq, value: true }
                - { var: clue_rim_reagent, op: eq, value: true }
          char: 코난.think
          text: "<speed=18>(2번 잔의 반응은 있어.</speed> <speed=27>하지만 R까지 같은 손이라고 말할 섬유가 비어 있어.)</speed>"
      - wait: 300
      - say:
          char: 코난.think
          text: "<speed=18>(추측 말고 하루오 씨가 남긴 순서로.</speed> <speed=27>아저씨, 목소리 좀 빌릴게.)</speed>"
      - goto: sleeping_kogoro

  sleeping_kogoro:
    actions:
      - bg: tea_room
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 코난.think
          text: "<speed=39>자, 전부 다실로!</speed> <speed=25>이 모리 코고로가 잘려 나간 1분을 원래 자리에 돌려놓지.</speed> <speed=35>범인의 손까지!</speed>"
      - effect: flash
      - say:
          char: 코난.think
          with:
            - 코고로.proud
          text: "<speed=18>(좋아. 모두가 같은 탁자를 보게 됐어.)</speed>"
      - say:
          text: "<speed=48>퓻.</speed> <speed=21>코고로의 말이 끊기고, 몸이 벽기둥에 기대어 천천히 내려앉았다.</speed>"
      - effect: pulse
      - say:
          char: 코고로.proud
          text: "<speed=25>...먼저, 모두 눈앞에 있었지만 소리 때문에 보지 못한 두 번의 손동작부터 말씀드리죠.</speed>"
      - add:
          final_confidence: 1
      - goto: reasoning_tone_branch

  reasoning_tone_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: final_confidence
                    op: gte
                    value: 5
                  - var: trust
                    op: gte
                    value: 2
              goto: sharp_reasoning
          default: cautious_reasoning

  sharp_reasoning:
    actions:
      - music: reasoning
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=28>주전자는 범행 도구가 아닙니다.</speed> <speed=21>차에 독이 섞였다면 네 잔의 안쪽에서 같은 반응이 나와야 하니까요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=25>반응은 2번 잔의 바깥 가장자리뿐.</speed> <speed=19>범인은 물기를 닦는 자연스러운 동작으로, 하루오 씨 입술이 닿을 한곳에만 물질을 남겼습니다.</speed>"
      - say:
          when: { var: remembered_tea_order, op: eq, value: true }
          char: 코고로.proud
          text: "<speed=25>하루오 씨는 88도 전엔 뚜껑을 그대로 두라고 가르쳤습니다.</speed> <speed=19>두 번의 소리는 차를 위한 절차가 아니라, 두 번째 순간 모두의 눈을 빌리는 장치였죠.</speed>"
      - char:
          id: 세이지
          position: right
          emotion: cold
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=21>감식 결과도 같습니다.</speed> <speed=18>주전자와 네 잔 안쪽은 모두 음성, 2번 바깥쪽만 양성입니다.</speed>"
      - goto: coverage_branch

  cautious_reasoning:
    actions:
      - music: reasoning
      - effect: darken
      - char:
          id: 란
          position: right
          emotion: worried
      - say:
          char: 코고로.proud
          text: "<speed=25>모르는 부분은 남겨 두고 확실한 것부터 갑시다.</speed> <speed=19>누군가 하루오 씨의 2번 잔, 입이 닿는 바깥쪽만 닦았습니다.</speed>"
      - say:
          when: { var: mistake_count, op: gte, value: 3 }
          char: 란.worried
          with:
            - 코고로.proud
          text: "<speed=23>사람 이름부터 고르지 말아요.</speed> <speed=18>하루오 씨는 쓰러질 때 목이 아니라 2번 잔을 붙잡았어요.</speed>"
      - say:
          char: 란.worried
          with:
            - 코고로.proud
          text: "<speed=23>그리고 같은 천이 쓰러진 뒤에는 컵받침으로 갔어요.</speed> <speed=18>하루오 씨가 2 다음에 남긴 R을 지우려고요.</speed>"
      - goto: coverage_branch

  coverage_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: clue_order_note, op: eq, value: true }
                  - { var: clue_haruo_wipe, op: eq, value: true }
                  - { var: clue_rim_reagent, op: eq, value: true }
                  - { var: clue_double_press_decoy, op: eq, value: true }
                  - { var: clue_kenji_rejected_deal, op: eq, value: true }
                  - { var: reiko_motive_open, op: eq, value: true }
              goto: full_coverage_line
          default: partial_coverage_line

  full_coverage_line:
    actions:
      - say:
          char: 코고로.proud
          text: "<speed=25>배정표는 사건 전의 2번, 통화 기록은 문밖의 눈, 온도계는 9시 29분을 고정합니다.</speed> <speed=19>잔과 R의 같은 섬유가 흩어진 세 장면을 한 손으로 잇고요.</speed>"
      - say:
          when: { var: clue_kenji_rejected_deal, op: eq, value: true }
          char: 코고로.proud
          text: "<speed=25>켄지 씨에게는 레이코 씨가 돌아선 뒤의 문장도 남았습니다.</speed> <speed=19>하루오 씨의 대답은 분명했죠. ‘이름 하나라도 빼면 거래는 없다.’</speed>"
      - goto: final_accuse_gate

  partial_coverage_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(빈 진술이 있어.</speed> <speed=30>잔의 흔적부터.)</speed>"
      - branch:
          cases:
            - when:
                var: early_exit_taken
                op: eq
                value: true
              goto: early_exit_line
          default: final_accuse_gate

  early_exit_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(빈칸은 있어도 손수건은 하나야.)</speed>"
      - goto: final_accuse_gate

  final_accuse_gate:
    actions:
      - bg: tea_room
      - music: solvethecase
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=28>9시 29분.</speed> <speed=19>두 번째 뚜껑 소리로 모두의 눈이 주전자에 묶인 순간, 2번 잔을 닦을 위치에 있던 사람은 단 한 명입니다.</speed>"
      - choice:
          key: final_accuse
          prompt: "9시 29분, 2번 잔을 닦은 사람은?"
          options:
            - text: "레이코"
              set:
                culprit_answer: "레이코"
              add:
                final_confidence: 1
              goto: accuse_confirm_reiko
            - text: "세이지"
              set:
                culprit_answer: "세이지"
              add:
                mistake_count: 1
                trust: -1
              gameOver:
                title: "추리 실패"
                message: "배정표의 2와 손수건의 R을 잘못 이었다. 마지막 저장에서 9시 29분의 손을 다시 찾자."
            - text: "켄지"
              set:
                culprit_answer: "켄지"
              add:
                mistake_count: 1
                trust: -1
              gameOver:
                title: "추리 실패"
                message: "통화 기록이 증명한 7분을 놓치고 엉뚱한 사람을 지목했다. 마지막 저장에서 알리바이를 다시 맞추자."
            - text: "하루오의 자작극이었다"
              set:
                culprit_answer: "하루오"
              add:
                mistake_count: 1
                trust: -1
              gameOver:
                title: "추리 실패"
                message: "피해자가 남긴 순서와 범인이 지운 흔적을 뒤섞었다. 챕터 시작점에서 2와 R의 순서를 다시 보자."

  accuse_confirm_reiko:
    actions:
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=30>레이코 씨.</speed> <speed=19>온도계가 멈춘 뒤 진술에서 잘라 낸 그 1분, 당신은 준비한 천으로 2번 잔을 닦았습니다.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코고로.proud
          text: "<speed=18>시음 책임자가 잔의 물기를 닦은 게...</speed> <speed=16>그 평범한 동작 하나를 살인이라고 부를 수 있나요?</speed>"
      - choice:
          key: final_accuse_confirm_reiko
          prompt: "비명 전의 잔과 비명 뒤의 R을 같은 천으로 이을 증거는?"
          options:
            - text: "잔의 시료 카드와 9시 29분 메모를 겹친다"
              goto: verdict_branch
            - text: "잔과 손수건의 섬유를 한 번 더 확인한다"
              add:
                final_confidence: -1
              goto: final_accuse_gate

  verdict_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 10
                  - var: mistake_count
                    op: lte
                    value: 2
                  - var: trust
                    op: gte
                    value: 2
                  - var: final_confidence
                    op: gte
                    value: 6
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: clue_haruo_wipe
                    op: eq
                    value: true
                  - var: clue_order_note
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: true
                  - var: clue_double_press_decoy
                    op: eq
                    value: true
                  - var: clue_kenji_rejected_deal
                    op: eq
                    value: true
              goto: true_epilogue
            - when:
                all:
                  - var: culprit_answer
                    op: eq
                    value: "레이코"
                  - var: deduction_score
                    op: gte
                    value: 6
                  - var: final_confidence
                    op: gte
                    value: 3
                  - var: mistake_count
                    op: lte
                    value: 5
              goto: normal_epilogue
          default: bad_epilogue

  true_epilogue:
    actions:
      - bg: tea_room
      - music: solvethecase
      - effect: zoom
      - say:
          char: 코고로.proud
          text: "<speed=25>배정표를 본 당신은 하루오 씨가 2번 잔을 고른 걸 사건 전에 알고 있었습니다.</speed> <speed=19>9시 29분, 첫 소리로 하루오 씨를 멈추고 두 번째 소리로 모두의 눈을 주전자에 모았죠.</speed>"
      - use: tea_residue_report
      - use: reiko_statement_note
      - say:
          char: 코고로.proud
          text: "<speed=23>그때 물질을 묻힌 천으로 2번 잔 가장자리를 한 번 훑었습니다.</speed> <speed=18>하루오 씨가 쓰러진 뒤에는 같은 천으로 컵받침의 R을 반대 방향으로 문질렀고요.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코고로.proud
          text: "<speed=21>잔과 R에 남은 섬유는 같은 천입니다.</speed> <speed=18>온도계는 첫 번째 동작이 일어난 9시 29분을 그대로 남겼고요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=25>하루오 씨는 다음 사람이 마시지 않도록 ‘2번 잔’을 먼저, 그다음 ‘레이코’를 쓰려 했습니다.</speed> <speed=19>당신은 자기 이름으로 이어지는 R만 지우려 했죠.</speed>"
      - music: confession
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=18>저녁에 복도에서 들었어요.</speed> <speed=16>하루오 씨가 켄지에게 ‘원본을 회사에 넘기는 거래는...’이라고.</speed> <speed=16>그 뒤는 듣지 않았어요. 아버지 이름까지 팔아 버릴 거라고 이미 정해 버렸으니까.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 코고로.proud
          text: "<speed=16>또 제 이름이 지워질 거라고 생각했어요.</speed> <speed=16>빼앗기기 전에 그 사람을 멈춰야 한다고.</speed> <speed=33>실수였다는 말은 하지 않을게요.</speed> <speed=16>2번 잔을 미리 알고, 돌아오지 못하게 할 양을 준비했으니까.</speed>"
      - char:
          id: 켄지
          position: right
          emotion: angry
      - say:
          char: 켄지.angry
          with:
            - 레이코.nervous
            - 코고로.proud
          text: "<speed=26>당신은 문장 중간에 돌아섰어.</speed> <speed=19>하루오는 내 제안을 거절했다.</speed> <speed=33>‘만든 사람 이름 하나라도 빼면 거래는 없다’고.</speed>"
      - say:
          char: 레이코.nervous
          delivery: whisper
          with:
            - 켄지.angry
          text: "<speed=16>그 뒷말을...</speed> <speed=16>왜 나는 한 번도 확인하지 않았지...</speed>"
      - char:
          id: 란
          position: right
          emotion: worried
      - say:
          char: 란.worried
          with:
            - 레이코.nervous
          text: "<speed=23>하루오 씨는 쓰러지면서도 2번 잔부터 붙잡았어요.</speed> <speed=18>다음 사람을 살리고, 당신 이름까지 빠지지 않게 하려던 거예요.</speed>"
      - say:
          char: 레이코.nervous
          delivery: sad
          with:
            - 란.worried
          text: "<speed=16>나는 또 지워질까 봐 무서웠어.</speed> <speed=16>그래서 그 사람 말을 먼저 잘라 버렸어.</speed> <speed=16>말하지 않은 게 아니야.</speed> <speed=16>내가 끝까지 듣지 않았어.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 레이코.nervous
          text: "<speed=25>누군가 내 이름을 지울까 두려웠다면, 문장 끝까지 들었어야 합니다.</speed> <speed=19>당신은 배합을 지킨 게 아니라 하루오 씨의 대답과, 다시 물을 기회를 영원히 빼앗았습니다.</speed>"
      - goto: true_coda

  true_coda:
    actions:
      - bg: mountain_rain
      - music: rain
      - effect: blur
      - say:
          text: "<speed=21>새벽 2시 10분.</speed> <speed=18>빗줄기가 가늘어질 무렵 구조대 불빛이 산길을 올라왔다. 낮에 찍은 사진과 같은 길인데도 전혀 다른 밤처럼 보였다.</speed>"
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: center
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: think
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=30>으음...</speed> <speed=37>뭐야, 다들 왜 그런 얼굴이야? 사건은... 벌써 끝난 거냐?</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=26>아빠가 다 해결하셨잖아요.</speed> <speed=21>또 본인이 한 추리만 기억 안 나시죠? 이번엔 웃을 때까지 조금 기다려 드릴게요.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          with:
            - 란
          text: "<speed=40>무, 무슨 소리냐!</speed> <speed=25>진짜 명추리는 머리가 아니라 몸이 기억하는 법이야. 그러니까 그런 얼굴들 하지 마!</speed>"
      - branch:
          cases:
            - when:
                var: souvenir_choice
                op: eq
                value: "paddle"
              goto: true_coda_paddle
            - when:
                var: souvenir_choice
                op: eq
                value: "tea"
              goto: true_coda_tea
          default: true_coda_postcard

  true_coda_paddle:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=25>아빠 가방에 라켓 열쇠고리 달아 놨어요.</speed> <speed=21>오늘 진 사람이 갖기로 했잖아요.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=36>그건 내일 결승 우승 상품이라니까!</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          text: "<speed=27>삼세판은 어젯밤에 끝났어요.</speed>"
      - goto: true_coda_finish

  true_coda_tea:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 란
          with:
            - 코난.smile
