script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: crime_scene_item_gate
  - scene: crime_scene_item_get
  - scene: crime_scene_item_already_owned
  - scene: approach_probe
  - scene: approach_intent
  - scene: approach_initial
  - scene: approach_discard
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_haruo
                    op: eq
                    value: true
                  - any:
                      - var: clue_haruo_wipe
                        op: eq
                        value: false
                      - var: clue_rim_reagent
                        op: eq
                        value: false
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: recovered_haruo_clue
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_haruo
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: tea_room
      - set:
          recovered_haruo_clue: true
          clue_haruo_wipe: true
          clue_rim_reagent: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - sticker:
          id: haruo_followup_lid
          image: clue_lid
          x: 56
          y: 42
          width: 52
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=25>두 감식 카드를 겹쳐 봐.</speed> <speed=19>2번 잔의 가장자리와 R의 꼬리에서 나온 섬유가 이어져.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(새로 쓴 게 아니야.</speed> <speed=30>R을 지우다 멈췄어.)</speed>"
      - clearSticker:
          id: haruo_followup_lid
          leave:
            effect: fadeOut
      - goto: outro

  revisit_notice:
    actions:
      - bg: tea_room
      - char:
          id: 코난
          position: left
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(섬유는 확보했어.</speed> <speed=30>왜 2가 먼저였지?)</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: tea_room
      - music: mystery
      - effect: darken
      - set:
          visited_haruo: true
      - add:
          investigation_count: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - sticker:
          id: haruo_lid
          image: clue_lid
          x: 51
          y: 44
          width: 56
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: '<speed=25>"2"는 한 번에 그었어.</speed> <speed=19>그런데 R의 꼬리만 반대쪽으로 끌렸어.</speed> <speed=33>두 번째 손이 닿은 거야.</speed>'
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>하루오 씨가 겨우 남긴 말을...</speed> <speed=18>바로 옆에서 누군가 지우려 한 거야?</speed>"

  crime_scene_item_gate:
    actions:
      - branch:
          cases:
            - when:
                var: tea_residue_report
                op: eq
                value: true
              goto: crime_scene_item_already_owned
          default: crime_scene_item_get

  crime_scene_item_get:
    actions:
      - get: tea_residue_report
      - sticker:
          id: item_popup_tea_residue_report
          image: item_tea_residue_report
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          text: "<speed=23>면봉 두 개의 색은 달랐다.</speed> <speed=18>잔 안쪽은 그대로, 입이 닿는 바깥 가장자리만 변했다.</speed>"
      - clearSticker:
          id: item_popup_tea_residue_report
          leave:
            effect: fadeOut
      - goto: approach_probe

  crime_scene_item_already_owned:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(잔의 반응은 있어.</speed> <speed=30>이제 R에 닿은 손.)</speed>"
      - goto: approach_probe

  approach_probe:
    actions:
      - choice:
          key: haruo_approach
          prompt: "하루오의 마지막 행동부터 읽으려면?"
          options:
            - text: "이름보다 그가 붙잡은 2번 잔부터 본다"
              set:
                rapport_haruo: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_intent
            - text: "R로 시작하는 사람을 먼저 지목한다"
              goto: approach_initial
            - text: "흔들린 글씨라며 증거에서 제외한다"
              add:
                trust: -1
              goto: approach_discard

  approach_intent:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>쓰러질 때 하루오 씨는 목이 아니라 잔을 붙잡았어.</speed> <speed=18>자기 고통보다 2번 잔에 남은 걸 먼저 알리려 한 거야.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(두려운 게 아니었어.</speed> <speed=30>원본을 남기려 한 거야.)</speed>"
      - goto: first_probe

  approach_initial:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=21>하지만 R은 이미 다른 손이 문질렀어.</speed> <speed=18>한 글자로 사람부터 정하면, 지운 사람 뜻대로 되는 거야.</speed>"
      - goto: first_probe

  approach_discard:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=21>완전하지 않아도 하루오 씨가 남긴 말이야.</speed> <speed=18>버리기 전에 누가 끊었는지부터 봐야 해.</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=23>R이 누구인지는 나중이야.</speed> <speed=18>먼저 그 꼬리를 끌어당긴 손을 찾아야 해.</speed>"
      - choice:
          key: haruo_first_probe
          prompt: "하루오 뒤에 닿은 두 번째 손의 흔적은?"
          options:
            - text: "반대로 끌린 R 꼬리와 손수건 섬유"
              set:
                clue_haruo_wipe: true
              add:
                deduction_score: 2
                trust: 1
              goto: first_claim_correct
            - text: "글씨 모양만 보고 작성자를 단정한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "비명 소리가 컸던 사람을 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=25>물기는 바깥으로 퍼졌는데 R의 꼬리만 안으로 끌렸어.</speed> <speed=19>하루오 씨가 쓴 뒤, 반대편 손이 닿았어.</speed>"
      - choice:
          key: haruo_first_commit
          prompt: "지워지다 만 2R의 순서는?"
          options:
            - text: "하루오가 남기고, 다른 사람이 R을 지웠다"
              goto: success_line
            - text: "잔의 흔적과 한 번 더 비교한다"
              goto: second_probe

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(글씨는 흉내 내도, 젖은 획의 순서는 못 바꿔.)</speed>"
      - choice:
          key: haruo_first_rebuttal
          prompt: "어떤 흔적을 다시 겹칠까?"
          options:
            - text: "닦임 방향과 섬유를 확인한다"
              goto: retry_notice
            - text: "글씨 모양을 계속 믿는다"
              add:
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(그 손수건, 먼저 2번 잔에도 닿았나?)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: haruo_second_probe
          prompt: "컵받침과 2번 잔을 잇는 것은?"
          options:
            - text: "같은 손수건 섬유가 R과 잔에 남았다"
              set:
                clue_haruo_wipe: true
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "2R만으로 바로 범인을 정한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "오염됐으니 모든 흔적을 버린다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=23>R의 꼬리와 잔 가장자리에서 같은 섬유가 나왔어.</speed> <speed=18>한 장의 손수건이 범행 전후에 두 곳을 닦았어.</speed>"
      - say:
          char: 코난.serious
          text: '<speed=25>"2R"은 하루오 씨가 남긴 순서가 맞아.</speed> <speed=19>범인은 그중 자기 이름으로 이어지는 R만 없애려 했어.</speed>'
      - choice:
          key: haruo_second_commit
          prompt: "두 흔적을 어떻게 보존할까?"
          options:
            - text: "2번 잔과 R의 섬유를 한 묶음으로 남긴다"
              goto: success_line
            - text: "오염 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(글자만 보면 안 돼.</speed> <speed=30>두 손의 순서야.)</speed>"
      - choice:
          key: haruo_second_rebuttal
          prompt: "컵받침 봉인을 마칠까?"
          options:
            - text: "감식 결과만 챙기고 돌아간다"
              goto: fail_line
            - text: "2R만으로 범인을 정한다"
              add:
                trust: -1
              gameOver:
                title: "증거 불충분"
                message: "글자 하나만으로 지목한 탓에 손수건의 두 동작을 입증하지 못했다. 챕터 시작점에서 흔적의 순서를 다시 맞추자."

  success_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.serious
          text: "<speed=25>하루오 씨는 잔 번호를 먼저, 이름의 첫 글자를 다음에 남겼어.</speed> <speed=19>범인은 자기에게 닿는 두 번째 글자만 지우려 했고.</speed>"
      - add:
          final_confidence: 1
      - goto: outro

  fail_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.think
          text: "<speed=18>(두 번째 손은 있어.</speed> <speed=30>이름을 붙일 증거가 없어.)</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_haruo
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>이걸 그냥 다잉 메시지라고 부르지 말자.</speed> <speed=18>하루오 씨가 마지막까지 지키려 한 말이잖아.</speed>"
      - say:
          char: 코난
          text: "<speed=25>응.</speed> <speed=19>지워진 한 획까지 전부 돌려놓을게.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=25>란 누나, 컵받침은 이 각도 그대로 봉인하자.</speed> <speed=19>R이 끌린 방향도 하루오 씨가 남긴 말이니까.</speed>"
      - goto: /routes/hub/1.yaml
