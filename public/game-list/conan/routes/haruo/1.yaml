script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: crime_scene_item_gate
  - scene: crime_scene_item_get
  - scene: crime_scene_item_already_owned
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_haruo
                    op: eq
                    value: true
                  - var: clue_haruo_wipe
                    op: eq
                    value: false
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: recovered_haruo_clue
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_haruo
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: tea_room
      - set:
          recovered_haruo_clue: true
          clue_haruo_wipe: true
          clue_rim_reagent: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - sticker:
          id: haruo_followup_lid
          image: clue_lid
          x: 56
          y: 42
          width: 52
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=30>감식 카드를 겹치면 선이 이어져.</speed> <speed=24>잔 가장자리와 R의 끝을 닦은 건 같은 손수건이야.</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(2R은 조작된 메시지가 아니야.)</speed> <speed=48>범인이 R만 지우다 멈춘 거야.</speed>"
      - clearSticker:
          id: haruo_followup_lid
          leave:
            effect: fadeOut
      - goto: outro

  revisit_notice:
    actions:
      - bg: tea_room
      - char:
          id: 코난
          position: left
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=24>(컵받침과 손수건 섬유는 이미 확인했어.)</speed> <speed=46>다른 사람의 말과 맞춰 보자.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: tea_room
      - music: reasoning
      - effect: darken
      - set:
          visited_haruo: true
      - add:
          investigation_count: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - sticker:
          id: haruo_lid
          image: clue_lid
          x: 51
          y: 44
          width: 56
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: '<speed=30>"2"는 손가락이 한 번에 움직였는데, R의 꼬리만 옆으로 번졌어.</speed> <speed=24>쓴 사람과 문지른 사람의 방향이 달라.</speed>'
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=28>그럼 하루오 씨가 남긴 말을...</speed> <speed=22>누군가 지우려 했다는 거야?</speed>"

  crime_scene_item_gate:
    actions:
      - branch:
          cases:
            - when:
                var: tea_residue_report
                op: eq
                value: true
              goto: crime_scene_item_already_owned
          default: crime_scene_item_get

  crime_scene_item_get:
    actions:
      - get: tea_residue_report
      - sticker:
          id: item_popup_tea_residue_report
          image: item_tea_residue_report
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          text: "<speed=28>면봉 감식 결과가 나왔다.</speed> <speed=22>잔 안쪽은 음성, 입이 닿는 바깥 가장자리만 양성이었다.</speed>"
      - clearSticker:
          id: item_popup_tea_residue_report
          leave:
            effect: fadeOut
      - goto: first_probe

  crime_scene_item_already_owned:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=22>(2번 잔 감식 결과는 이미 확인했어.)</speed> <speed=46>이제 2R 주변 흔적을 보자.</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=28>글자의 뜻보다 먼저, 누가 이 컵받침에 손댔는지 알아내야 해.</speed>"
      - choice:
          key: haruo_first_probe
          prompt: "2R 주변에서 다른 손길을 보여 주는 것은?"
          options:
            - text: "R 끝에 남은 닦임 방향과 손수건 섬유"
              set:
                clue_haruo_wipe: true
              add:
                deduction_score: 2
                trust: 1
              goto: first_claim_correct
            - text: "글씨 모양만 보고 작성자를 단정한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "비명 소리가 컸던 사람을 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=30>컵받침의 물기는 바깥으로 번졌는데 R의 꼬리만 안쪽으로 끌렸어.</speed> <speed=24>다른 손이 닿은 흔적이야.</speed>"
      - choice:
          key: haruo_first_commit
          prompt: "2R을 어떻게 해석할까?"
          options:
            - text: "하루오가 쓴 뒤 누군가 지우려 했다"
              goto: success_line
            - text: "잔의 흔적과 한 번 더 비교한다"
              goto: second_probe

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>글씨 모양은 얼마든지 흉내 낼 수 있어.</speed> <speed=48>하지만 물기가 끌린 방향은 꾸밀 수 없어.</speed>"
      - choice:
          key: haruo_first_rebuttal
          prompt: "흔적을 다시 볼까?"
          options:
            - text: "닦임 방향과 섬유를 확인한다"
              goto: retry_notice
            - text: "글씨 모양을 계속 믿는다"
              add:
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(R이 번진 순간과 잔 가장자리가 닦인 순간은 같았을까?)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: haruo_second_probe
          prompt: "컵받침과 2번 잔에 함께 남은 흔적은?"
          options:
            - text: "같은 손수건이 R 끝과 잔 가장자리에 닿았다"
              set:
                clue_haruo_wipe: true
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "2R만으로 바로 범인을 정한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "오염됐으니 모든 흔적을 버린다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=28>R 끝과 잔 가장자리에서 같은 섬유가 나왔다.</speed> <speed=22>한 장의 손수건이 두 곳에 닿았다.</speed>"
      - say:
          char: 코난.serious
          text: '<speed=30>"2R"은 가짜가 아니야.</speed> <speed=24>하루오 씨가 남겼고, 범인이 R만 지우려 했어.</speed>'
      - choice:
          key: haruo_second_commit
          prompt: "이 흔적을 어떻게 남길까?"
          options:
            - text: "손수건과 2R을 함께 증거로 남긴다"
              goto: success_line
            - text: "오염 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>메시지만 믿어도, 전부 버려도 범인이 남긴 손길을 놓쳐.</speed>"
      - choice:
          key: haruo_second_rebuttal
          prompt: "현장 조사를 마칠까?"
          options:
            - text: "감식 결과만 챙기고 돌아간다"
              goto: fail_line
            - text: "2R만으로 범인을 정한다"
              add:
                trust: -1
              goto: fail_line

  success_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.serious
          text: "<speed=30>하루오 씨는 마지막 힘으로 잔 번호와 이름의 첫 글자를 남겼어.</speed> <speed=24>범인은 그중 R을 지우려 했고.</speed>"
      - add:
          final_confidence: 1
      - goto: outro

  fail_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.think
          text: "<speed=22>(2R에 다른 손이 닿은 건 분명해.)</speed> <speed=46>하지만 누구 손인지는 다른 증거가 필요해.</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - say:
          char: 코난
          text: "<speed=30>란 누나, 이 컵받침은 그대로 두자.</speed> <speed=24>하루오 씨가 남긴 마지막 말이니까.</speed>"
      - goto: /routes/hub/1.yaml
