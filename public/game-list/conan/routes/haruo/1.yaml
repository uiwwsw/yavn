script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: crime_scene_item_gate
  - scene: crime_scene_item_get
  - scene: crime_scene_item_already_owned
  - scene: approach_probe
  - scene: approach_intent
  - scene: approach_initial
  - scene: approach_discard
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_haruo
                    op: eq
                    value: true
                  - any:
                      - var: clue_haruo_wipe
                        op: eq
                        value: false
                      - var: clue_rim_reagent
                        op: eq
                        value: false
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: recovered_haruo_clue
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_haruo
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: tea_room
      - set:
          recovered_haruo_clue: true
          clue_haruo_wipe: true
          clue_rim_reagent: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - sticker:
          id: haruo_followup_lid
          image: clue_lid
          x: 56
          y: 42
          width: 52
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=25>두 감식 카드를 겹치면 같은 섬유가 두 번 나타나.</speed> <speed=19>먼저 2번 잔 가장자리, 하루오 씨가 쓰러진 뒤에는 R의 꼬리.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(범인이 글자를 보탠 게 아니야.</speed> <speed=30>자기 쪽으로 이어진 R만 지우다 멈췄어.)</speed>"
      - clearSticker:
          id: haruo_followup_lid
          leave:
            effect: fadeOut
      - goto: outro

  revisit_notice:
    actions:
      - bg: tea_room
      - char:
          id: 코난
          position: left
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(섬유는 확보했어.</speed> <speed=30>하루오 씨가 이름보다 잔 번호를 먼저 남긴 이유는?)</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: tea_room
      - music: mystery
      - effect: darken
      - set:
          visited_haruo: true
      - add:
          investigation_count: 1
      - char:
          id: 코난
          position: right
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - sticker:
          id: haruo_lid
          image: clue_lid
          x: 51
          y: 44
          width: 56
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: '<speed=25>"2"는 쓰러진 방향으로 한 번에 그었어.</speed> <speed=19>R의 꼬리만 반대편으로 끌렸고.</speed> <speed=33>하루오 씨 뒤에 다른 손이 문장을 고치려 했어.</speed>'
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>어젯밤엔 이름을 하나도 빼지 않겠다고 했는데...</speed> <speed=18>마지막 말에서도 누군가 자기 이름만 빼려 한 거야?</speed>"

  crime_scene_item_gate:
    actions:
      - branch:
          cases:
            - when:
                var: tea_residue_report
                op: eq
                value: true
              goto: crime_scene_item_already_owned
          default: crime_scene_item_get

  crime_scene_item_get:
    actions:
      - get: tea_residue_report
      - sticker:
          id: item_popup_tea_residue_report
          image: item_tea_residue_report
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          text: "<speed=23>면봉 두 개의 색은 달랐다.</speed> <speed=18>차가 닿은 안쪽은 그대로였고, 하루오의 입술이 닿은 바깥 가장자리만 변했다.</speed>"
      - clearSticker:
          id: item_popup_tea_residue_report
          leave:
            effect: fadeOut
      - goto: approach_probe

  crime_scene_item_already_owned:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(첫 번째 손은 잔에 흔적을 남겼어.</speed> <speed=30>쓰러진 뒤 R에 닿은 같은 손을 찾자.)</speed>"
      - goto: approach_probe

  approach_probe:
    actions:
      - choice:
          key: haruo_approach
          prompt: "불완전한 글자보다 하루오가 끝까지 지키려 한 것을 읽으려면?"
          options:
            - text: "이름보다 그가 붙잡은 2번 잔부터 본다"
              set:
                rapport_haruo: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_intent
            - text: "R로 시작하는 사람을 먼저 지목한다"
              goto: approach_initial
            - text: "흔들린 글씨라며 증거에서 제외한다"
              add:
                trust: -1
              goto: approach_discard

  approach_intent:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>쓰러질 때 하루오 씨는 목이 아니라 2번 잔부터 붙잡았어.</speed> <speed=18>자기를 살려 달라는 손보다, 다음 사람이 같은 잔을 마시지 못하게 하는 손이 먼저였어.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(마지막까지 사람과 증거를 같이 지키려 했어.</speed> <speed=30>2부터 읽자.)</speed>"
      - goto: first_probe

  approach_initial:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=21>하지만 R은 이미 다른 손이 문질렀어.</speed> <speed=18>한 글자로 이름부터 고르면, 하루오 씨가 아니라 지운 사람이 만든 문장을 읽게 돼.</speed>"
      - goto: first_probe

  approach_discard:
    actions:
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=21>완전하지 않아도 하루오 씨가 목숨 끝에 남긴 말이야.</speed> <speed=18>버리는 건 누가 문장을 끊었는지 확인한 다음이어야 해.</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=23>R로 시작하는 이름은 나중이야.</speed> <speed=18>먼저 젖은 획을 반대로 끌고 간 두 번째 손부터 증명해야 해.</speed>"
      - choice:
          key: haruo_first_probe
          prompt: "하루오 뒤에 닿은 두 번째 손의 흔적은?"
          options:
            - text: "반대로 끌린 R 꼬리와 손수건 섬유"
              set:
                clue_haruo_wipe: true
              add:
                deduction_score: 2
                trust: 1
              goto: first_claim_correct
            - text: "글씨 모양만 보고 작성자를 단정한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "비명 소리가 컸던 사람을 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=25>컵받침 물기는 바깥으로 퍼졌는데 R의 꼬리만 안으로 끌렸어.</speed> <speed=19>하루오 씨가 쓴 뒤, 맞은편 손이 천으로 눌렀어.</speed>"
      - choice:
          key: haruo_first_commit
          prompt: "지워지다 만 2R의 순서는?"
          options:
            - text: "하루오가 남기고, 다른 사람이 R을 지웠다"
              goto: success_line
            - text: "잔의 흔적과 한 번 더 비교한다"
              goto: second_probe

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(글씨 모양은 흉내 내도, 먼저 번진 물기와 나중에 끌린 획의 순서는 못 바꿔.)</speed>"
      - choice:
          key: haruo_first_rebuttal
          prompt: "어떤 흔적을 다시 겹칠까?"
          options:
            - text: "닦임 방향과 섬유를 확인한다"
              goto: retry_notice
            - text: "글씨 모양을 계속 믿는다"
              add:
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(R을 누른 천이 비명 전에는 2번 잔을 닦았나?)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: haruo_second_probe
          prompt: "컵받침과 2번 잔을 잇는 것은?"
          options:
            - text: "같은 손수건 섬유가 R과 잔에 남았다"
              set:
                clue_haruo_wipe: true
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "2R만으로 바로 범인을 정한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "오염됐으니 모든 흔적을 버린다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=23>R의 꼬리와 2번 잔 가장자리에서 같은 섬유가 나왔어.</speed> <speed=18>한 장의 천이 비명 전에는 독을 남기고, 비명 뒤에는 이름을 지웠어.</speed>"
      - say:
          char: 코난.serious
          text: '<speed=25>하루오 씨의 순서는 "2", 그리고 "R"이 맞아.</speed> <speed=19>범인은 잔 번호는 놔두고 자기 이름으로 이어지는 두 번째 글자만 없애려 했어.</speed>'
      - choice:
          key: haruo_second_commit
          prompt: "두 흔적을 어떻게 보존할까?"
          options:
            - text: "2번 잔과 R의 섬유를 한 묶음으로 남긴다"
              goto: success_line
            - text: "오염 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(글자만 보면 안 돼.</speed> <speed=30>두 손의 순서야.)</speed>"
      - choice:
          key: haruo_second_rebuttal
          prompt: "컵받침 봉인을 마칠까?"
          options:
            - text: "감식 결과만 챙기고 돌아간다"
              goto: fail_line
            - text: "2R만으로 범인을 정한다"
              add:
                trust: -1
              gameOver:
                title: "증거 불충분"
                message: "글자 하나만으로 지목한 탓에 손수건의 두 동작을 입증하지 못했다. 챕터 시작점에서 흔적의 순서를 다시 맞추자."

  success_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.serious
          text: "<speed=25>하루오 씨는 다음 피해자를 막으려고 잔 번호를 먼저 남겼어.</speed> <speed=19>그다음 범인의 이름을 쓰려 했고, 범인은 자기에게 닿는 글자만 지우려 했어.</speed>"
      - add:
          final_confidence: 1
      - goto: outro

  fail_line:
    actions:
      - clearSticker:
          id: haruo_lid
          leave:
            effect: fadeOut
      - say:
          char: 코난.think
          text: "<speed=18>(두 번째 손은 있어.</speed> <speed=30>이름을 붙일 증거가 없어.)</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_haruo
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=23>이걸 그냥 다잉 메시지라고만 부르지 말자.</speed> <speed=18>하루오 씨가 다음 사람과 네 사람의 이름을 끝까지 지키려 한 행동이잖아.</speed>"
      - say:
          char: 코난
          text: "<speed=25>응.</speed> <speed=19>범인이 잘라 낸 한 획까지, 하루오 씨가 남긴 순서대로 돌려놓을게.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=25>란 누나, 컵받침은 이 각도 그대로 봉인하자.</speed> <speed=19>R이 끌린 방향도 하루오 씨가 남긴 말이니까.</speed>"
      - goto: /routes/hub/1.yaml
