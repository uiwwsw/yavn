script:
  - scene: lounge_intro
  - scene: all_done_check
  - scene: all_done_bonus
  - scene: route_select
  - scene: early_exit_confirm
  - scene: early_exit_penalty_branch
  - scene: early_exit_penalty_3
  - scene: early_exit_penalty_2
  - scene: early_exit_penalty_1
  - scene: move_to_conclusion_gate
  - scene: move_to_conclusion_ready
  - scene: move_to_conclusion_blocked

scenes:
  lounge_intro:
    actions:
      - bg: ryokan_hall
      - music: reasoning
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=24>(경찰이 도착하기까지 오래 걸릴 거야.)</speed> <speed=50>한 사람씩 다시 만나 보자.</speed>"
      - goto: all_done_check

  all_done_check:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: all_done_bonus
          default: route_select

  all_done_bonus:
    actions:
      - set:
          early_exit_taken: false
      - add:
          deduction_score: 1
          final_confidence: 1
          trust: 1
      - say:
          char: 코난.serious
          text: "<speed=30>이제 됐어.</speed> <speed=24>네 사람의 말이 모두 같은 30초를 가리키고 있어.</speed>"
      - goto: move_to_conclusion_gate

  route_select:
    actions:
      - say:
          char: 코난.think
          text: "<speed=26>거짓말은 다른 단서 앞에 세우면 흔들려.</speed> <speed=46>누구의 말부터 확인할까?</speed>"
      - choice:
          key: route_select
          prompt: "누구의 말부터 다시 확인할까?"
          options:
            - text: "세이지에게 잔 배정표를 보여 달라고 한다"
              goto: /routes/seiji/1.yaml
            - text: "레이코의 온도 기록을 확인한다"
              goto: /routes/reiko/1.yaml
            - text: "켄지의 통화 기록과 동선을 맞춘다"
              goto: /routes/kenji/1.yaml
            - text: "하루오가 남긴 2R을 다시 살핀다"
              goto: /routes/haruo/1.yaml
            - text: "모두를 다실에 모은다"
              goto: early_exit_confirm

  early_exit_confirm:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>(아직 확인하지 않은 말이 있어.)</speed> <speed=50>지금 모두를 모으면 범인이 그 빈틈을 파고들 거야.</speed>"
      - choice:
          key: early_exit_confirm
          prompt: "그래도 지금 추리를 시작할까?"
          options:
            - text: "남은 진술을 더 확인한다"
              goto: route_select
            - text: "지금 가진 단서로 시작한다"
              set:
                early_exit_taken: true
              goto: early_exit_penalty_branch

  early_exit_penalty_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 3
              goto: early_exit_penalty_3
            - when:
                var: investigation_count
                op: gte
                value: 2
              goto: early_exit_penalty_2
          default: early_exit_penalty_1

  early_exit_penalty_3:
    actions:
      - add:
          final_confidence: -1
      - say:
          char: 코난.think
          text: "<speed=24>(한 사람의 말은 비어 있지만, 큰 흐름은 보여.)</speed> <speed=48>반박이 나오면 현장에서 메워야 해.</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_2:
    actions:
      - add:
          deduction_score: -1
          final_confidence: -2
      - say:
          char: 코난.think
          text: "<speed=24>(아직 서로 맞지 않는 진술이 두 개나 남았어.)</speed> <speed=50>조심해서 시작해야 해.</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_1:
    actions:
      - add:
          deduction_score: -2
          final_confidence: -3
          trust: -1
          mistake_count: 1
      - say:
          char: 코난.think
          text: "<speed=22>(너무 서둘렀어.)</speed> <speed=48>지금 떠오른 건 추리라기보다 추측에 가까워.</speed>"
      - goto: move_to_conclusion_gate

  move_to_conclusion_gate:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: reiko_statement_note
                    op: eq
                    value: true
              goto: move_to_conclusion_ready
          default: move_to_conclusion_blocked

  move_to_conclusion_ready:
    actions:
      - say:
          char: 코난
          text: "<speed=34>란 누나, 모두를 다실로 불러 줘.</speed> <speed=26>하루오 씨가 남긴 말을 이제 읽을 수 있을 것 같아.</speed>"
      - goto: /conclusion/1.yaml

  move_to_conclusion_blocked:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>아직 2번 잔의 감식 결과와 레이코의 진술 시각을 나란히 놓지 못했어.</speed> <speed=48>둘부터 확보하자.</speed>"
      - goto: route_select
