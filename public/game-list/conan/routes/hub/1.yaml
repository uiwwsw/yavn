script:
  - scene: lounge_intro
  - scene: all_done_check
  - scene: all_done_bonus
  - scene: rapport_bonus_check
  - scene: rapport_bonus
  - scene: rapport_bonus_missed
  - scene: route_select
  - scene: early_exit_confirm
  - scene: early_exit_penalty_branch
  - scene: early_exit_penalty_3
  - scene: early_exit_penalty_2
  - scene: early_exit_penalty_1
  - scene: move_to_conclusion_gate
  - scene: move_to_conclusion_ready
  - scene: move_to_conclusion_blocked

scenes:
  lounge_intro:
    actions:
      - bg: ryokan_hall
      - music: rain
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=19>(두 시간.</speed> <speed=17>진술이 섞이기 전에 따로 듣자.)</speed>"
      - goto: all_done_check

  all_done_check:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: all_done_bonus
          default: route_select

  all_done_bonus:
    actions:
      - set:
          early_exit_taken: false
      - add:
          deduction_score: 1
          final_confidence: 1
          trust: 1
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: right
          emotion: serious
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=24>이상해.</speed> <speed=19>넷 다 9시 29분을 말하는데, 본 장면은 조금씩 달라.</speed>"
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: "<speed=26>누군가는 본 걸 말했고, 누군가는 자기가 한 일을 빼 버렸어.</speed>"
      - goto: rapport_bonus_check

  rapport_bonus_check:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_score
                op: gte
                value: 3
              goto: rapport_bonus
          default: rapport_bonus_missed

  rapport_bonus:
    actions:
      - add:
          final_confidence: 1
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 란.worried
          with:
            - 코난.think
          text: "<speed=23>세이지 씨는 종이를, 켄지 씨는 조건을 먼저 봤어.</speed> <speed=18>레이코 씨만 순서를 말할 때 한 동작을 빼먹었고.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(레이코 씨가 뺀 동작 하나.</speed> <speed=30>아저씨 목소리로 다시 묻자.)</speed>"
      - goto: move_to_conclusion_gate

  rapport_bonus_missed:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(진술은 엉켜도 잔의 흔적은 그대로야.)</speed>"
      - goto: move_to_conclusion_gate

  route_select:
    actions:
      - say:
          char: 코난.think
          text: "<speed=21>(누구부터지?)</speed>"
      - choice:
          key: route_select
          prompt: "누구의 9시 29분부터 확인할까?"
          options:
            - text: "기록 보관실: 세이지의 원본 배정표"
              goto: /routes/seiji/1.yaml
            - text: "관리실: 레이코의 멈춘 온도계"
              goto: /routes/reiko/1.yaml
            - text: "폭우 복도: 켄지의 7분 통화"
              goto: /routes/kenji/1.yaml
            - text: "봉인된 다실: 하루오의 지워진 2R"
              goto: /routes/haruo/1.yaml
            - text: "모두를 다실에 모은다"
              goto: early_exit_confirm

  early_exit_confirm:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(아직 안 들은 사람이 있어.</speed> <speed=30>지금 부르면 놓쳐.)</speed>"
      - choice:
          key: early_exit_confirm
          prompt: "지금 모두를 다실에 모을까?"
          options:
            - text: "아직 만나지 않은 사람에게 간다"
              goto: route_select
            - text: "빈틈을 감수하고 추리를 시작한다"
              set:
                early_exit_taken: true
              goto: early_exit_penalty_branch

  early_exit_penalty_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 3
              goto: early_exit_penalty_3
            - when:
                var: investigation_count
                op: gte
                value: 2
              goto: early_exit_penalty_2
          default: early_exit_penalty_1

  early_exit_penalty_3:
    actions:
      - add:
          final_confidence: -1
      - say:
          char: 코난.think
          text: "<speed=19>(한 사람만 더.</speed> <speed=30>손수건을 누가 봤는지 들어야 해.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_2:
    actions:
      - add:
          deduction_score: -1
          final_confidence: -2
      - say:
          char: 코난.think
          text: "<speed=19>(목격과 기록이 어긋나.</speed> <speed=30>이대로는 못 몰아.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_1:
    actions:
      - add:
          deduction_score: -2
          final_confidence: -3
          trust: -1
          mistake_count: 1
      - say:
          char: 코난.think
          text: "<speed=18>(근거가 모자라.</speed> <speed=30>지금 나가면 범인이 버텨.)</speed>"
      - goto: move_to_conclusion_gate

  move_to_conclusion_gate:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: reiko_statement_note
                    op: eq
                    value: true
              goto: move_to_conclusion_ready
          default: move_to_conclusion_blocked

  move_to_conclusion_ready:
    actions:
      - say:
          char: 코난
          text: "<speed=28>란 누나, 모두를 다실로 불러 줘.</speed> <speed=21>하루오 씨가 지키려던 2번 잔, 이제 읽을 수 있어.</speed>"
      - goto: /conclusion/1.yaml

  move_to_conclusion_blocked:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(잔의 반응, 멈춘 온도계.</speed> <speed=30>둘 다 필요해.)</speed>"
      - goto: route_select
