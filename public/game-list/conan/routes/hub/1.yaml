script:
  - scene: lounge_intro
  - scene: all_done_check
  - scene: all_done_bonus
  - scene: rapport_bonus_check
  - scene: rapport_bonus
  - scene: rapport_bonus_missed
  - scene: route_select
  - scene: early_exit_confirm
  - scene: early_exit_penalty_branch
  - scene: early_exit_penalty_3
  - scene: early_exit_penalty_2
  - scene: early_exit_penalty_1
  - scene: move_to_conclusion_gate
  - scene: move_to_conclusion_ready
  - scene: move_to_conclusion_blocked

scenes:
  lounge_intro:
    actions:
      - bg: ryokan_hall
      - music: rain
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=22>(구조대는 빨라도 두 시간.</speed> <speed=18>그 전에 말이 서로 닮아 버리면 끝이야.)</speed> <speed=44>한 사람씩 따로 만나자.</speed>"
      - goto: all_done_check

  all_done_check:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: all_done_bonus
          default: route_select

  all_done_bonus:
    actions:
      - set:
          early_exit_taken: false
      - add:
          deduction_score: 1
          final_confidence: 1
          trust: 1
      - say:
          char: 코난.serious
          text: "<speed=28>맞았어.</speed> <speed=22>네 사람은 서로 다른 걸 숨겼지만, 시각만은 모두 9시 29분에 멈춰 있어.</speed>"
      - goto: rapport_bonus_check

  rapport_bonus_check:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_score
                op: gte
                value: 3
              goto: rapport_bonus
          default: rapport_bonus_missed

  rapport_bonus:
    actions:
      - add:
          final_confidence: 1
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 란.worried
          with:
            - 코난.think
          text: "<speed=26>세이지 씨는 종이를, 켄지 씨는 조건을 먼저 봤어.</speed> <speed=20>레이코 씨만 순서를 말할 때 한 동작을 빼먹었고.</speed>"
      - say:
          char: 코난.think
          text: "<speed=20>(숨긴 말은 달라도, 감춘 1분은 하나야.</speed> <speed=44>이제 아저씨 목소리로 되돌려 주면 돼.)</speed>"
      - goto: move_to_conclusion_gate

  rapport_bonus_missed:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(말의 틈까지 다 보진 못했어.</speed> <speed=44>그럼 잔과 시각만으로도 무너지지 않게 세운다.)</speed>"
      - goto: move_to_conclusion_gate

  route_select:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>(각자 자기 물건 앞에 서면 말투가 달라져.</speed> <speed=42>누구부터 만날까?)</speed>"
      - choice:
          key: route_select
          prompt: "누구의 9시 29분부터 확인할까?"
          options:
            - text: "기록 보관실: 세이지의 원본 배정표"
              goto: /routes/seiji/1.yaml
            - text: "관리실: 레이코의 멈춘 온도계"
              goto: /routes/reiko/1.yaml
            - text: "폭우 복도: 켄지의 7분 통화"
              goto: /routes/kenji/1.yaml
            - text: "봉인된 다실: 하루오의 지워진 2R"
              goto: /routes/haruo/1.yaml
            - text: "모두를 다실에 모은다"
              goto: early_exit_confirm

  early_exit_confirm:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(아직 비어 있는 30초가 있어.</speed> <speed=46>지금 시작하면 범인은 바로 그 틈을 물고 늘어질 거야.)</speed>"
      - choice:
          key: early_exit_confirm
          prompt: "지금 모두를 다실에 모을까?"
          options:
            - text: "아직 만나지 않은 사람에게 간다"
              goto: route_select
            - text: "빈틈을 감수하고 추리를 시작한다"
              set:
                early_exit_taken: true
              goto: early_exit_penalty_branch

  early_exit_penalty_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 3
              goto: early_exit_penalty_3
            - when:
                var: investigation_count
                op: gte
                value: 2
              goto: early_exit_penalty_2
          default: early_exit_penalty_1

  early_exit_penalty_3:
    actions:
      - add:
          final_confidence: -1
      - say:
          char: 코난.think
          text: "<speed=22>(한 사람의 30초가 비었어.</speed> <speed=44>반박이 나오기 전에 잔의 흔적으로 눌러야 해.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_2:
    actions:
      - add:
          deduction_score: -1
          final_confidence: -2
      - say:
          char: 코난.think
          text: "<speed=22>(서로 맞지 않는 시각이 두 개.</speed> <speed=46>한 번만 순서를 틀려도 레이코 씨가 입을 닫을 거야.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_1:
    actions:
      - add:
          deduction_score: -2
          final_confidence: -3
          trust: -1
          mistake_count: 1
      - say:
          char: 코난.think
          text: "<speed=20>(너무 빨라.</speed> <speed=42>지금 아저씨를 재우면, 깨우기 전에 내가 먼저 막힐 거야.)</speed>"
      - goto: move_to_conclusion_gate

  move_to_conclusion_gate:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: reiko_statement_note
                    op: eq
                    value: true
              goto: move_to_conclusion_ready
          default: move_to_conclusion_blocked

  move_to_conclusion_ready:
    actions:
      - say:
          char: 코난
          text: "<speed=32>란 누나, 모두를 다실로 불러 줘.</speed> <speed=24>하루오 씨가 지키려던 2번 잔, 이제 읽을 수 있어.</speed>"
      - goto: /conclusion/1.yaml

  move_to_conclusion_blocked:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(잔 가장자리의 반응과 멈춘 온도계.</speed> <speed=44>그 둘이 없으면 9시 29분은 아직 추측이야.)</speed>"
      - goto: route_select
