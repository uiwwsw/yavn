script:
  - scene: lounge_intro
  - scene: all_done_check
  - scene: all_done_bonus
  - scene: rapport_bonus_check
  - scene: rapport_bonus
  - scene: rapport_bonus_missed
  - scene: route_select
  - scene: early_exit_confirm
  - scene: early_exit_penalty_branch
  - scene: early_exit_penalty_3
  - scene: early_exit_penalty_2
  - scene: early_exit_penalty_1
  - scene: move_to_conclusion_gate
  - scene: move_to_conclusion_ready
  - scene: move_to_conclusion_blocked

scenes:
  lounge_intro:
    actions:
      - bg: ryokan_hall
      - music: rain
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=19>(구조대까지 두 시간.</speed> <speed=17>기억이 섞이기 전에 네 사람을 따로 듣자.)</speed>"
      - goto: all_done_check

  all_done_check:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: investigation_count
                    op: gte
                    value: 4
                  - any:
                      - { var: clue_order_note, op: eq, value: false }
                      - { var: clue_haruo_wipe, op: eq, value: false }
                      - { var: clue_rim_reagent, op: eq, value: false }
                      - { var: clue_double_press_decoy, op: eq, value: false }
                      - { var: clue_kenji_rejected_deal, op: eq, value: false }
                      - { var: reiko_motive_open, op: eq, value: false }
              goto: route_select
            - when:
                var: investigation_count
                op: gte
                value: 4
              goto: all_done_bonus
          default: route_select

  all_done_bonus:
    actions:
      - set:
          early_exit_taken: false
      - add:
          deduction_score: 1
          final_confidence: 1
          trust: 1
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: right
          emotion: serious
      - say:
          char: 란.worried
          with:
            - 코난.serious
          text: "<speed=24>넷의 말이 이제 같은 시각에 모였어.</speed> <speed=19>그런데 9시 29분에 본 것만 한 조각씩 달라.</speed>"
      - say:
          char: 코난.serious
          with:
            - 란.worried
          text: "<speed=26>한 사람은 종이를, 한 사람은 문밖을 봤어.</speed> <speed=19>그리고 한 사람은 자기 손이 움직인 한 줄만 비워 뒀고.</speed>"
      - goto: rapport_bonus_check

  rapport_bonus_check:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_score
                op: gte
                value: 3
              goto: rapport_bonus
          default: rapport_bonus_missed

  rapport_bonus:
    actions:
      - add:
          final_confidence: 1
      - char:
          id: 란
          position: left
          emotion: worried
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 란.worried
          with:
            - 코난.think
          text: "<speed=23>세이지 씨는 틀릴까 봐 종이에 숨고, 켄지 씨는 잘릴까 봐 조건부터 말했어.</speed> <speed=18>레이코 씨만 순서를 말할수록 한 동작에서 멈췄고.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(레이코 씨가 말하지 못한 손 하나.</speed> <speed=30>모두 앞에서 증거의 순서로 묻자.)</speed>"
      - goto: move_to_conclusion_gate

  rapport_bonus_missed:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(사람의 기억은 섞였어도 잔에 닿은 두 손의 순서는 안 바뀌어.)</speed>"
      - goto: move_to_conclusion_gate

  route_select:
    actions:
      - say:
          when:
            any:
              - { var: tea_residue_report, op: eq, value: false }
              - { var: reiko_statement_note, op: eq, value: false }
          char: 코난.think
          text: "<speed=18>(모두 앞에서 말하려면 2번 잔 감식과 9시 29분 진술 메모는 꼭 있어야 해.)</speed>"
      - say:
          when:
            all:
              - { var: investigation_count, op: gte, value: 4 }
              - any:
                  - { var: clue_order_note, op: eq, value: false }
                  - { var: clue_haruo_wipe, op: eq, value: false }
                  - { var: clue_rim_reagent, op: eq, value: false }
                  - { var: clue_double_press_decoy, op: eq, value: false }
                  - { var: clue_kenji_rejected_deal, op: eq, value: false }
                  - { var: reiko_motive_open, op: eq, value: false }
          char: 코난.think
          text: "<speed=18>(넷의 첫말은 들었어.</speed> <speed=29>잘려 나간 뒷말과 두 번째 손은 다시 찾을 수 있어.)</speed>"
      - say:
          char: 코난.think
          text: "<speed=21>(누구부터지?)</speed>"
      - choice:
          key: route_select
          prompt: "비어 있는 9시 29분, 누구의 시선부터 이어 볼까?"
          options:
            - text: "기록 보관실: 세이지의 원본 배정표"
              goto: /routes/seiji/1.yaml
            - text: "관리실: 레이코의 멈춘 온도계"
              goto: /routes/reiko/1.yaml
            - text: "폭우 복도: 켄지의 7분 통화"
              goto: /routes/kenji/1.yaml
            - text: "봉인된 다실: 하루오의 지워진 2R"
              goto: /routes/haruo/1.yaml
            - text: "모두를 다실에 모은다"
              when:
                all:
                  - { var: tea_residue_report, op: eq, value: true }
                  - { var: reiko_statement_note, op: eq, value: true }
              goto: early_exit_confirm

  early_exit_confirm:
    actions:
      - say:
          char: 코난.think
          text: "<speed=19>(아직 혼자일 때만 할 말이 남은 사람이 있어.</speed> <speed=30>지금 모으면 다시 입을 맞춰.)</speed>"
      - choice:
          key: early_exit_confirm
          prompt: "지금 모두를 다실에 모을까?"
          options:
            - text: "아직 만나지 않은 사람에게 간다"
              goto: route_select
            - text: "2번 잔 감식과 9시 29분 메모로 추리를 시작한다"
              when:
                all:
                  - { var: tea_residue_report, op: eq, value: true }
                  - { var: reiko_statement_note, op: eq, value: true }
              set:
                early_exit_taken: true
              goto: early_exit_penalty_branch

  early_exit_penalty_branch:
    actions:
      - branch:
          cases:
            - when:
                var: investigation_count
                op: gte
                value: 3
              goto: early_exit_penalty_3
            - when:
                var: investigation_count
                op: gte
                value: 2
              goto: early_exit_penalty_2
          default: early_exit_penalty_1

  early_exit_penalty_3:
    actions:
      - add:
          final_confidence: -1
      - say:
          char: 코난.think
          text: "<speed=19>(한 사람만 더.</speed> <speed=30>흰 천이 두 번 움직인 걸 본 눈이 필요해.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_2:
    actions:
      - add:
          deduction_score: -1
          final_confidence: -2
      - say:
          char: 코난.think
          text: "<speed=19>(시각은 있는데 장면이 끊겨.</speed> <speed=30>이대로 지목하면 R 한 글자에 매달리게 돼.)</speed>"
      - goto: move_to_conclusion_gate

  early_exit_penalty_1:
    actions:
      - add:
          deduction_score: -2
          final_confidence: -3
          trust: -1
          mistake_count: 1
      - say:
          char: 코난.think
          text: "<speed=18>(잔과 시각만으론 동작이 하나 비어.</speed> <speed=30>범인은 그 빈칸 안에서 버틸 거야.)</speed>"
      - goto: move_to_conclusion_gate

  move_to_conclusion_gate:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: tea_residue_report
                    op: eq
                    value: true
                  - var: reiko_statement_note
                    op: eq
                    value: true
              goto: move_to_conclusion_ready
          default: move_to_conclusion_blocked

  move_to_conclusion_ready:
    actions:
      - say:
          char: 코난
          text: "<speed=28>란 누나, 모두를 다실로 불러 줘.</speed> <speed=21>하루오 씨가 지키려던 2번 잔과, 누군가 지우려 한 뒷말을 이제 같은 순서로 보여 줄 수 있어.</speed>"
      - goto: /conclusion/1.yaml

  move_to_conclusion_blocked:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(잔의 흔적은 있지만 시각이 없어.</speed> <speed=27>레이코 씨의 온도 기록부터 이어야 해.)</speed>"
      - goto: route_select
