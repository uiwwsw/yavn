script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: approach_probe
  - scene: approach_record
  - scene: approach_speculation
  - scene: approach_accusation
  - scene: first_input
  - scene: first_hit_review
  - scene: first_miss_review
  - scene: retry_notice
  - scene: second_input
  - scene: second_hit_review
  - scene: second_miss_review
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_seiji
                    op: eq
                    value: true
                  - var: clue_order_note
                    op: eq
                    value: false
                  - var: recovered_order_note
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_seiji
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: records_lounge
      - set:
          recovered_order_note: true
          clue_order_note: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 코난
          position: left
          emotion: serious
      - sound: notebook_flip
      - effect: focus
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=30>원본 아래 장에도 같은 위치에 2가 눌려 있어요.</speed> <speed=24>사건 뒤에 고친 숫자가 아니라는 뜻이죠.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=28>이제야 기록을 기록답게 보시는군요.</speed> <speed=22>그 장도 함께 가져가세요.</speed>"
      - goto: outro

  revisit_notice:
    actions:
      - bg: records_lounge
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 세이지.cold
          with:
            - 코난.think
          text: "<speed=30>배정표 원본은 아까 보여 드렸습니다.</speed> <speed=24>제 필체가 의심스럽다면 눌린 자국도 확인해 보세요.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: records_lounge
      - music: reasoning
      - sound: notebook_flip
      - set:
          visited_seiji: true
      - add:
          investigation_count: 1
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 세이지
          position: right
          emotion: cold
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=30>배정표 작성은 9시 18분.</speed> <speed=24>하루오 씨가 직접 2번을 지정했고, 저는 받아 적었습니다.</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(종이 아래 눌린 자국도 2야.)</speed> <speed=48>사건 뒤에 고쳐 쓴 건 아니네.</speed>"

  approach_probe:
    actions:
      - choice:
          key: seiji_approach
          prompt: "기록을 중시하는 세이지에게 어떻게 물을까?"
          options:
            - text: "기억 대신 원본과 눌린 자국을 함께 보여 달라고 한다"
              set:
                rapport_seiji: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_record
            - text: "누가 범인 같냐고 의견부터 묻는다"
              goto: approach_speculation
            - text: "배정표를 고친 것 아니냐고 몰아붙인다"
              add:
                trust: -1
              goto: approach_accusation

  approach_record:
    actions:
      - sound: notebook_flip
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=28>좋습니다.</speed> <speed=22>제 기억은 빼고, 원본과 바로 아래 장만 보시죠.</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(이 사람은 추측보다 검증을 먼저 꺼내야 움직여.)</speed>"
      - goto: first_input

  approach_speculation:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=28>제 의견은 증거가 아닙니다.</speed> <speed=22>시간, 필체, 눌린 자국. 셋 중 하나를 물으세요.</speed>"
      - goto: first_input

  approach_accusation:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=26>결론부터 정하셨군요.</speed> <speed=22>그럼 종이가 어느 쪽을 반박하는지 확인하시죠.</speed>"
      - goto: first_input

  first_input:
    actions:
      - input:
          prompt: "배정표에서 하루오의 이름 옆에 적힌 숫자는? (1~4)"
          correct: "2"
          errors:
            - "1~4 중 하나다. 이름 옆의 눌린 자국을 다시 보자."
            - "하루오 씨는 두 번째 잔을 직접 중앙에 놓았다."
            - "배정표에 적힌 숫자는 2다."
          routes:
            - equals: "2"
              set:
                clue_order_note: true
              add:
                deduction_score: 2
                final_confidence: 1
                trust: 1
              goto: first_hit_review
            - equals: "1"
              add:
                mistake_count: 1
              goto: first_miss_review
            - equals: "3"
              add:
                mistake_count: 1
              goto: first_miss_review
            - equals: "4"
              add:
                mistake_count: 1
              goto: first_miss_review

  first_hit_review:
    actions:
      - say:
          text: "<speed=28>잉크와 그 아래 눌린 자국이 같은 숫자를 가리킨다.</speed>"
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=32>2번은 하루오 씨가 고른 자기 잔이었어.</speed> <speed=24>이 배정표라면 증거로 쓸 수 있어.</speed>"
      - choice:
          key: shinichi_first_commit
          prompt: "배정표를 어떻게 확인할까?"
          options:
            - text: "원본과 눌린 자국을 함께 보관한다"
              goto: success_line
            - text: "자리 배치를 다시 묻는다"
              goto: retry_notice

  first_miss_review:
    actions:
      - say:
          char: 코난.think
          with:
            - 세이지.cold
          text: "<speed=24>그 숫자라면 하루오 씨가 중앙에 놓은 잔과 맞지 않아.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코난.think
          text: "<speed=28>제 기억 말고 종이를 보세요.</speed> <speed=24>하루오 씨 이름 옆입니다.</speed>"
      - choice:
          key: shinichi_first_rebuttal
          prompt: "배정표를 다시 볼까?"
          options:
            - text: "눌린 자국까지 다시 확인한다"
              goto: retry_notice
            - text: "내 기억을 더 믿는다"
              add:
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: '<speed=22>("2R"의 2가 잔 번호라면, 이 종이가 기준이야.)</speed>'
      - goto: second_input

  second_input:
    actions:
      - input:
          prompt: "다시 확인한 하루오의 잔 번호는? (1~4)"
          correct: "2"
          errors:
            - "하루오 씨가 중앙에 놓은 잔과 배정표를 함께 보자."
            - "이름 옆에는 2가 적혀 있다."
            - "확인된 잔 번호는 2다."
          routes:
            - equals: "2"
              set:
                clue_order_note: true
              add:
                deduction_score: 1
                trust: 1
              goto: second_hit_review
            - equals: "1"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review
            - equals: "3"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review
            - equals: "4"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review

  second_hit_review:
    actions:
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=30>역시 2번.</speed> <speed=24>사건 뒤에 바뀐 숫자가 아니라는 것도 확인됐어.</speed>"
      - choice:
          key: shinichi_second_commit
          prompt: "이 기록을 증거로 남길까?"
          options:
            - text: "배정표를 증거로 보관한다"
              goto: success_line
            - text: "진술만 참고한다"
              add:
                final_confidence: -1
              goto: fail_line

  second_miss_review:
    actions:
      - say:
          char: 코난.think
          with:
            - 세이지.cold
          text: "<speed=24>기억과 기록이 자꾸 엇갈려.</speed> <speed=48>이 상태로는 2R의 2를 설명할 수 없어.</speed>"
      - choice:
          key: shinichi_second_rebuttal
          prompt: "배정표 조사를 마칠까?"
          options:
            - text: "기록만 챙기고 돌아간다"
              goto: fail_line
            - text: "처음 기억을 고집한다"
              add:
                trust: -1
              goto: fail_line

  success_line:
    actions:
      - say:
          char: 코난.serious
          text: '<speed=30>"2"는 레이코의 표식이 아니라 하루오 씨의 잔 번호였어.</speed> <speed=24>그럼 이제 R이 남아.</speed>'
      - goto: outro

  fail_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(배정표를 완전히 믿긴 어려워.)</speed> <speed=48>다른 흔적으로 2의 의미를 보강해야 해.</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_seiji
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=28>원본과 아래 장, 둘 다 봉투에 넣겠습니다.</speed> <speed=22>한 장만 떼면 기록이 아니라 주장이 되니까요.</speed>"
      - say:
          char: 코난
          text: "<speed=30>네.</speed> <speed=24>경찰이 오면 봉인한 시각까지 같이 적어 주세요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=32>고마워요, 세이지 씨.</speed> <speed=24>배정표는 경찰이 올 때까지 제가 볼게요.</speed>"
      - goto: /routes/hub/1.yaml
