script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: approach_probe
  - scene: approach_record
  - scene: approach_speculation
  - scene: approach_accusation
  - scene: first_input
  - scene: first_hit_review
  - scene: first_miss_review
  - scene: retry_notice
  - scene: second_input
  - scene: second_hit_review
  - scene: second_miss_review
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_seiji
                    op: eq
                    value: true
                  - var: clue_order_note
                    op: eq
                    value: false
                  - var: recovered_order_note
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_seiji
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: records_lounge
      - set:
          recovered_order_note: true
          clue_order_note: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 코난
          position: left
          emotion: serious
      - sound: notebook_flip
      - effect: focus
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=25>원본을 넘겨 봐요.</speed> <speed=19>바로 아래 장에도 같은 자리에 2가 눌려 있어요.</speed> <speed=33>나중에 덧쓴 숫자는 아니에요.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=23>한 장만 보지 않는군요.</speed> <speed=18>좋습니다. 아래 장까지 한 봉투에 넣으세요.</speed>"
      - goto: outro

  revisit_notice:
    actions:
      - bg: records_lounge
      - char:
          id: 세이지
          position: right
          emotion: cold
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 세이지.cold
          with:
            - 코난.think
          text: "<speed=25>제 말은 이미 끝났습니다.</speed> <speed=19>의심이 남았다면 원본 밑의 눌린 자국을 보세요.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: records_lounge
      - music: mystery
      - sound: notebook_flip
      - set:
          visited_seiji: true
      - add:
          investigation_count: 1
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 세이지
          position: right
          emotion: cold
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=25>작성 시각 9시 18분.</speed> <speed=19>하루오 씨가 '2번'이라고 말했고, 저는 그대로 적었습니다.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(압흔도 2.</speed> <speed=30>사건 전부터였어.)</speed>"

  approach_probe:
    actions:
      - choice:
          key: seiji_approach
          prompt: "세이지가 봉투를 열게 하려면?"
          options:
            - text: "원본과 바로 아래 장을 함께 확인한다"
              set:
                rapport_seiji: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_record
            - text: "누가 거짓말하는지 의견을 묻는다"
              goto: approach_speculation
            - text: "배정표를 조작했다고 몰아붙인다"
              add:
                trust: -1
              goto: approach_accusation

  approach_record:
    actions:
      - sound: notebook_flip
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=23>그 순서라면 답할 수 있습니다.</speed> <speed=18>제 기억은 빼고, 종이 두 장만 보죠.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(사람보다 기록을 건드려야 입을 열겠어.)</speed>"
      - goto: first_input

  approach_speculation:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=23>제 기분은 기록하지 않았습니다.</speed> <speed=18>시각, 필체, 압흔. 묻고 싶은 걸 고르세요.</speed>"
      - goto: first_input

  approach_accusation:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=21>결론을 먼저 적으셨군요.</speed> <speed=18>그럼 종이가 당신과 저 중 누구를 지우는지 보죠.</speed>"
      - goto: first_input

  first_input:
    actions:
      - input:
          prompt: "하루오 이름 옆의 잔 번호는? (1~4)"
          correct: "2"
          errors:
            - "1~4 중 하나다. 이름 옆의 눌린 자국을 다시 보자."
            - "하루오 씨는 두 번째 잔을 직접 중앙에 놓았다."
            - "배정표에 적힌 숫자는 2다."
          routes:
            - equals: "2"
              set:
                clue_order_note: true
              add:
                deduction_score: 2
                final_confidence: 1
                trust: 1
              goto: first_hit_review
            - equals: "1"
              add:
                mistake_count: 1
              goto: first_miss_review
            - equals: "3"
              add:
                mistake_count: 1
              goto: first_miss_review
            - equals: "4"
              add:
                mistake_count: 1
              goto: first_miss_review

  first_hit_review:
    actions:
      - say:
          text: "<speed=23>검은 잉크의 2와, 다음 장에 눌린 2가 정확히 겹친다.</speed>"
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=26>2번은 하루오 씨가 직접 고른 잔.</speed> <speed=19>종이 두 장이 그 말을 뒷받침해요.</speed>"
      - choice:
          key: shinichi_first_commit
          prompt: "이 기록을 어떻게 보존할까?"
          options:
            - text: "원본과 아래 장을 함께 봉인한다"
              goto: success_line
            - text: "자리 배치를 다시 묻는다"
              goto: retry_notice

  first_miss_review:
    actions:
      - say:
          char: 코난.think
          with:
            - 세이지.cold
          text: "<speed=19>(그 번호는 잔 배치와 안 맞아.)</speed>"
      - say:
          char: 세이지.cold
          with:
            - 코난.think
          text: "<speed=23>저를 보지 말고 종이를 보세요.</speed> <speed=18>하루오 씨 이름 바로 오른쪽입니다.</speed>"
      - choice:
          key: shinichi_first_rebuttal
          prompt: "어느 쪽을 다시 믿을까?"
          options:
            - text: "눌린 자국까지 다시 확인한다"
              goto: retry_notice
            - text: "다실의 자리 기억을 고집한다"
              add:
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: '<speed=18>(2가 잔 번호라면, 이 종이를 보고 썼어.)</speed>'
      - goto: second_input

  second_input:
    actions:
      - input:
          prompt: "다시 확인한 하루오의 잔 번호는? (1~4)"
          correct: "2"
          errors:
            - "하루오 씨가 중앙에 놓은 잔과 배정표를 함께 보자."
            - "이름 옆에는 2가 적혀 있다."
            - "확인된 잔 번호는 2다."
          routes:
            - equals: "2"
              set:
                clue_order_note: true
              add:
                deduction_score: 1
                trust: 1
              goto: second_hit_review
            - equals: "1"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review
            - equals: "3"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review
            - equals: "4"
              add:
                mistake_count: 1
                trust: -1
              goto: second_miss_review

  second_hit_review:
    actions:
      - say:
          char: 코난.serious
          with:
            - 세이지.cold
          text: "<speed=25>2번.</speed> <speed=19>잉크도 압흔도 사건 전부터 같은 숫자였어요.</speed>"
      - choice:
          key: shinichi_second_commit
          prompt: "경찰에게 어떤 상태로 넘길까?"
          options:
            - text: "배정표를 증거로 보관한다"
              goto: success_line
            - text: "진술만 참고한다"
              add:
                final_confidence: -1
              goto: fail_line

  second_miss_review:
    actions:
      - say:
          char: 코난.think
          with:
            - 세이지.cold
          text: "<speed=19>(자리가 아니라 종이야.</speed> <speed=30>다시.)</speed>"
      - choice:
          key: shinichi_second_rebuttal
          prompt: "배정표 봉투를 닫을까?"
          options:
            - text: "기록만 챙기고 돌아간다"
              goto: fail_line
            - text: "처음 기억을 고집한다"
              add:
                trust: -1
              goto: fail_line

  success_line:
    actions:
      - say:
          char: 코난.serious
          text: '<speed=25>"2"는 사람을 가리킨 게 아니라 하루오 씨의 잔 번호.</speed> <speed=19>이제 지워지다 만 R만 남았어요.</speed>'
      - goto: outro

  fail_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(종이를 놓쳤어.</speed> <speed=30>다른 흔적으로 2부터.)</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_seiji
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 세이지.cold
          with:
            - 코난.serious
          text: "<speed=23>원본과 아래 장, 둘 다 넣겠습니다.</speed> <speed=18>둘을 떼는 순간 압흔은 증거가 아니라 제 주장이 되니까요.</speed>"
      - say:
          char: 코난
          text: "<speed=25>네.</speed> <speed=19>9시 46분, 코난 군 입회 아래 봉인.</speed> <speed=32>그 시각도 적겠습니다.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=26>고마워요, 세이지 씨.</speed> <speed=19>봉투는 그대로 두고 경찰이 올 때 같이 열어요.</speed>"
      - goto: /routes/hub/1.yaml
