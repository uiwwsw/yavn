script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: intro_item_get
  - scene: intro_item_already_owned
  - scene: approach_probe
  - scene: approach_procedure
  - scene: approach_personal
  - scene: approach_accusation
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: motive_branch
  - scene: motive_open_line
  - scene: motive_half_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_reiko
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: false
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: recovered_reiko_motive
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_reiko
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: manager_office
      - set:
          recovered_reiko_motive: true
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: right
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=28>2번 잔 가장자리와 지워진 R에서 같은 섬유가 나왔어요.</speed> <speed=22>그 손수건을 쥔 채, 9시 29분에 뭘 했어요?</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=20>그건...</speed> <speed=16>하루오 씨가 연구 노트와 같이 숨긴 건가요?</speed>"
      - goto: motive_open_line

  revisit_notice:
    actions:
      - bg: manager_office
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 레이코.nervous
          with:
            - 코난.think
          text: "<speed=24>온도 기록은 드렸습니다.</speed> <speed=18>같은 질문을 반복하면... 없는 기억까지 만들게 돼요.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: manager_office
      - music: tension
      - effect: focus
      - set:
          visited_reiko: true
      - add:
          investigation_count: 1
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: serious
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=26>88도.</speed> <speed=20>아버지는 그 온도를 한 번도 넘기지 않았어요.</speed> <speed=18>저도 비명이 날 때까지 온도계에서 눈을 떼지 않았습니다.</speed>"
      - say:
          char: 코난.think
          text: "<speed=20>(눈을 떼지 않았다면서, 쓰러지자마자 2번 잔의 물기부터 봤어.</speed> <speed=44>말한 순서를 그대로 적자.)</speed>"
      - branch:
          cases:
            - when:
                var: reiko_statement_note
                op: eq
                value: true
              goto: intro_item_already_owned
          default: intro_item_get

  intro_item_get:
    actions:
      - get: reiko_statement_note
      - sticker:
          id: item_popup_reiko_statement_note
          image: item_reiko_statement_note
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - say:
          text: "<speed=26>코난은 레이코가 말한 동작을 한 줄씩 적었다.</speed> <speed=20>9시 29분 다음 줄만 비어 있었다.</speed>"
      - clearSticker:
          id: item_popup_reiko_statement_note
          leave:
            effect: fadeOut
      - goto: approach_probe

  intro_item_already_owned:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(말한 순서는 이미 적어 뒀어.</speed> <speed=42>이번엔 멈춘 온도계 옆에 놓아 보자.)</speed>"
      - goto: approach_probe

  approach_probe:
    actions:
      - choice:
          key: reiko_approach
          prompt: "레이코가 끝까지 말하게 하려면?"
          options:
            - text: "시음 책임자의 절차를 처음부터 듣는다"
              set:
                rapport_reiko: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_procedure
            - text: "하루오와의 개인적인 관계부터 묻는다"
              goto: approach_personal
            - text: "손수건을 쓴 범인이라고 단정한다"
              add:
                trust: -1
              goto: approach_accusation

  approach_procedure:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=24>온도계를 소독하고, 주전자를 올리고, 88도에서 불을 끕니다.</speed> <speed=18>그다음 잔 번호를 확인하고...</speed> <speed=16>그날도 같았어요.</speed>"
      - say:
          char: 코난.think
          text: "<speed=20>(절차를 외울 때만 숨이 고르게 돌아와.</speed> <speed=42>그래서 빠진 한 동작이 더 크게 들려.)</speed>"
      - goto: first_probe

  approach_personal:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=22>직원이었고, 아버지 때부터 이곳을 지킨 사람이에요.</speed> <speed=18>그 이상을 지금 설명해야 하나요?</speed>"
      - goto: first_probe

  approach_accusation:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=20>그 말은 질문이 아니라 결론이네요.</speed> <speed=16>아이의 결론엔 답하지 않겠습니다.</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=28>온도계는 자동으로 시각을 남기죠?</speed> <speed=22>사람 기억보다 그 숫자가 먼저일 것 같아요.</speed>"
      - choice:
          key: reiko_first_probe
          prompt: "멈춘 온도계와 맞춰 볼 것은?"
          options:
            - text: "88도 도달 시각과 비명 시각을 겹친다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
              goto: first_claim_correct
            - text: "목소리가 떨린 순간을 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "켄지와 다퉜다는 이유만으로 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=26>온도계는 9시 29분, 88도에서 멈췄어요.</speed> <speed=20>비명은 9시 30분.</speed> <speed=38>그 사이 한 줄이 비었어요.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=20>고작 1분이에요.</speed> <speed=16>천둥 때문에 초침을 잘못 봤을 수도 있잖아요.</speed>"
      - choice:
          key: reiko_first_commit
          prompt: "그 1분과 겹치는 흔적은?"
          options:
            - text: "2번 잔 가장자리의 반응과 겹친다"
              goto: motive_branch
            - text: "같은 질문을 다시 반복한다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=22>(사람은 누구나 떨 수 있어.</speed> <speed=44>목소리는 9시 29분에 무슨 일이 있었는지 남기지 못해.)</speed>"
      - choice:
          key: reiko_first_rebuttal
          prompt: "말 대신 무엇을 볼까?"
          options:
            - text: "온도계와 감식 기록을 비교한다"
              goto: retry_notice
            - text: "말투를 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(표정은 숨길 수 있어도, 88도에서 멈춘 숫자는 움직일 수 없어.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: reiko_second_probe
          prompt: "9시 29분과 바로 겹치는 것은?"
          options:
            - text: "온도 기록과 2번 잔의 반응을 맞춘다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "흔들린 말투만으로 결론 낸다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong
            - text: "다실 분위기만으로 판단한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=26>온도계가 멈춘 9시 29분.</speed> <speed=20>바로 그때 2번 잔의 가장자리만 닦였어.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=28>레이코 씨가 말에서 빼 버린 1분과 정확히 겹쳐요.</speed>"
      - choice:
          key: reiko_second_commit
          prompt: "이 빈칸을 어떻게 남길까?"
          options:
            - text: "진술에서 빠진 동작으로 표시한다"
              goto: motive_branch
            - text: "우연일 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: motive_half_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=22>(표정만 보다가 숫자를 놓쳤어.</speed> <speed=44>지금 더 밀면 레이코 씨는 절차 뒤로 숨을 거야.)</speed>"
      - choice:
          key: reiko_second_rebuttal
          prompt: "진술 메모를 덮을까?"
          options:
            - text: "메모만 챙기고 돌아간다"
              goto: motive_half_line
            - text: "말투를 근거로 계속 추궁한다"
              add:
                trust: -1
              goto: motive_half_line

  motive_branch:
    actions:
      - branch:
          cases:
            - when:
                var: clue_rim_reagent
                op: eq
                value: true
              goto: motive_open_line
          default: motive_half_line

  motive_open_line:
    actions:
      - sound: notebook_flip
      - effect: zoom
      - say:
          char: 코난.serious
          text: "<speed=30>수정 계약서엔 배합 이름을 켄지 씨 회사로 넘기는 조항이 있어요.</speed> <speed=22>그런데 원본 연구 노트는 하루오 씨가 숨겼죠.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=20>그 노트는...</speed> <speed=42>누가 숨겼다고 했죠?</speed>"
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=26>난 '숨겼다'고 말하지 않았어요.</speed> <speed=20>레이코 씨가 먼저 알고 있었네요.</speed>"
      - set:
          reiko_motive_open: true
      - add:
          deduction_score: 2
          final_confidence: 1
          trust: 1
      - goto: outro

  motive_half_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(감춘 1분은 찾았지만, 연구 노트까지 입을 열게 하진 못했어.)</speed>"
      - add:
          mistake_count: 1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_reiko
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=20>그 메모...</speed> <speed=16>제가 틀리게 말한 시각도 지우지 말아 주세요.</speed>"
      - say:
          char: 코난
          text: "<speed=28>안 지워요.</speed> <speed=22>나중에 누구 기억이 달라져도, 지금 말은 그대로 남게요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=28>말해 줘서 고마워요.</speed> <speed=22>메모는 손대지 않고 경찰에게 보여 줄게요.</speed>"
      - goto: /routes/hub/1.yaml
