script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: intro_item_get
  - scene: intro_item_already_owned
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: motive_branch
  - scene: motive_open_line
  - scene: motive_half_line
  - scene: outro

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_reiko
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: false
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: recovered_reiko_motive
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_reiko
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: manager_office
      - set:
          recovered_reiko_motive: true
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: right
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=30>2번 잔 가장자리와 R 끝에서 같은 손수건 섬유가 나왔어요.</speed> <speed=24>이제 온도계가 멈춘 1분을 다시 설명해 주세요.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=22>그걸... 어디서 확인했죠?</speed> <speed=18>하루오 씨가 노트까지 보여 준 건가요?</speed>"
      - goto: motive_open_line

  revisit_notice:
    actions:
      - bg: manager_office
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 레이코.nervous
          with:
            - 코난.think
          text: "<speed=26>말씀드릴 건 다 말씀드렸어요.</speed> <speed=22>계속 이러시면 제 기억까지 틀릴 것 같아요.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: manager_office
      - music: reasoning
      - effect: focus
      - set:
          visited_reiko: true
      - add:
          investigation_count: 1
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: serious
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=28>이 차는 88도를 넘으면 향이 죽어요.</speed> <speed=22>그래서 저는 비명이 날 때까지 온도계만 보고 있었어요.</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(온도계만 봤다면서 2번 잔의 물기까지 먼저 닦으려 했어.)</speed> <speed=48>시각부터 적어 두자.</speed>"
      - branch:
          cases:
            - when:
                var: reiko_statement_note
                op: eq
                value: true
              goto: intro_item_already_owned
          default: intro_item_get

  intro_item_get:
    actions:
      - get: reiko_statement_note
      - sticker:
          id: item_popup_reiko_statement_note
          image: item_reiko_statement_note
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - say:
          text: "<speed=28>레이코의 진술을 온도와 시각 순서로 메모했다.</speed> <speed=24>몇몇 문장이 서로 맞지 않았다.</speed>"
      - clearSticker:
          id: item_popup_reiko_statement_note
          leave:
            effect: fadeOut
      - goto: first_probe

  intro_item_already_owned:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>(진술 시각은 이미 적어 뒀어.)</speed> <speed=46>이번엔 기록과 맞춰 보면 돼.</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=30>온도계 기록은 남아 있죠.</speed> <speed=24>말보다 그쪽이 정확할 거예요.</speed>"
      - choice:
          key: reiko_first_probe
          prompt: "레이코의 말에서 기록으로 확인할 수 있는 것은?"
          options:
            - text: "88도 도달 시각과 잔의 반응 시각을 맞춘다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
              goto: first_claim_correct
            - text: "목소리가 떨렸다는 사실을 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "켄지와 다퉜다는 이유만으로 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=28>온도계 기록은 9시 29분에 멈췄어요.</speed> <speed=22>그런데 비명은 9시 30분에 났죠.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=24>1분 정도는...</speed> <speed=20>시계를 잘못 봤을 수도 있잖아요.</speed>"
      - choice:
          key: reiko_first_commit
          prompt: "비어 있는 1분을 더 확인할까?"
          options:
            - text: "잔의 반응 시각과 대조한다"
              goto: motive_branch
            - text: "레이코에게 다시 묻는다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=24>사람은 긴장하면 누구나 떨 수 있어.</speed> <speed=48>그것만으로는 비어 있는 1분을 설명할 수 없어.</speed>"
      - choice:
          key: reiko_first_rebuttal
          prompt: "무엇을 다시 확인할까?"
          options:
            - text: "온도계와 감식 기록을 비교한다"
              goto: retry_notice
            - text: "말투를 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(레이코의 표정이 아니라, 멈춘 온도계가 거짓말을 가려 줄 거야.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: reiko_second_probe
          prompt: "기록으로 바로 대조할 수 있는 것은?"
          options:
            - text: "88도 기록과 2번 잔 반응 시각을 맞춘다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "흔들린 말투만으로 결론 낸다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong
            - text: "다실 분위기만으로 판단한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=28>온도계가 멈춘 9시 29분.</speed> <speed=22>2번 잔 가장자리에 물질이 옮겨진 시각도 그 무렵이다.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=30>레이코 씨가 온도계에서 눈을 뗀 1분과 정확히 겹쳐요.</speed>"
      - choice:
          key: reiko_second_commit
          prompt: "이 1분을 사건과 연결할까?"
          options:
            - text: "진술의 모순으로 남긴다"
              goto: motive_branch
            - text: "우연일 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: motive_half_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=24>표정만 좇다 보니 기록의 빈칸을 놓쳤어.</speed> <speed=48>지금은 더 밀어붙이기 어렵다.</speed>"
      - choice:
          key: reiko_second_rebuttal
          prompt: "레이코의 진술 조사를 마칠까?"
          options:
            - text: "메모만 챙기고 돌아간다"
              goto: motive_half_line
            - text: "말투를 근거로 계속 추궁한다"
              add:
                trust: -1
              goto: motive_half_line

  motive_branch:
    actions:
      - branch:
          cases:
            - when:
                var: clue_rim_reagent
                op: eq
                value: true
              goto: motive_open_line
          default: motive_half_line

  motive_open_line:
    actions:
      - sound: notebook_flip
      - effect: zoom
      - say:
          char: 코난.serious
          text: "<speed=32>수정 계약서에는 블렌드 권리를 켄지 씨 회사로 넘긴다는 조항이 있었어요.</speed> <speed=24>원본 연구 노트는 하루오 씨가 보관하고 있었고요.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=22>그 노트 얘기를...</speed> <speed=44>누구한테 들었죠?</speed>"
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=28>방금 전까지는 노트가 있는지도 모른다고 했잖아요.</speed>"
      - set:
          reiko_motive_open: true
      - add:
          deduction_score: 2
          final_confidence: 1
          trust: 1
      - goto: outro

  motive_half_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(레이코가 감춘 1분은 찾았지만, 연구 노트와 이어지는 말은 끌어내지 못했어.)</speed>"
      - add:
          mistake_count: 1
      - goto: outro

  outro:
    actions:
      - say:
          char: 코난
          text: "<speed=30>말해 줘서 고마워요.</speed> <speed=24>진술 메모는 경찰에게 그대로 보여 줄게요.</speed>"
      - goto: /routes/hub/1.yaml
