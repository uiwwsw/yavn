script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: intro_item_get
  - scene: intro_item_already_owned
  - scene: approach_probe
  - scene: approach_procedure
  - scene: approach_personal
  - scene: approach_accusation
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: motive_branch
  - scene: motive_open_line
  - scene: motive_half_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_reiko
                    op: eq
                    value: true
                  - var: reiko_motive_open
                    op: eq
                    value: false
                  - var: clue_rim_reagent
                    op: eq
                    value: true
                  - var: recovered_reiko_motive
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_reiko
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: manager_office
      - set:
          recovered_reiko_motive: true
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: right
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=25>2번 잔 바깥에서만 반응이 나왔고, 온도계는 9시 29분에 멈췄어요.</speed> <speed=19>아버지의 순서를 한 번도 어긴 적 없다던 그 1분에, 어느 손을 움직였어요?</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=18>그건...</speed> <speed=16>그래서 하루오 씨가 원본 연구 노트를 따로 숨긴 건가요?</speed>"
      - goto: motive_open_line

  revisit_notice:
    actions:
      - bg: manager_office
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 레이코.nervous
          with:
            - 코난.think
          text: "<speed=21>온도 기록은 드렸습니다.</speed> <speed=16>같은 말을 계속 시키면... 결국 당신이 원하는 기억을 제가 만들어 내게 돼요.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: manager_office
      - music: tension
      - effect: focus
      - set:
          visited_reiko: true
      - add:
          investigation_count: 1
      - char:
          id: 레이코
          position: left
          emotion: nervous
      - char:
          id: 코난
          position: center
          emotion: serious
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=23>88도.</speed> <speed=18>아버지는 그 숫자를 한 번도 넘기지 않았어요.</speed> <speed=16>저도 그분 방식을 지키려고... 비명이 날 때까지 온도계만 봤습니다.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(사람 얘기만 나오면 숫자로 돌아가.</speed> <speed=30>숨을 고르는 절차부터 듣자.)</speed>"
      - branch:
          cases:
            - when:
                var: reiko_statement_note
                op: eq
                value: true
              goto: intro_item_already_owned
          default: intro_item_get

  intro_item_get:
    actions:
      - get: reiko_statement_note
      - sticker:
          id: item_popup_reiko_statement_note
          image: item_reiko_statement_note
          x: 50
          y: 30
          width: 22
          enter:
            effect: popIn
          inputLockMs: 500
      - wait: 3000
      - say:
          text: "<speed=23>코난은 레이코의 말을 동작과 시각으로 나눠 적었다.</speed> <speed=18>88도를 기록한 9시 29분 뒤, 비명까지의 한 줄만 비었다.</speed>"
      - clearSticker:
          id: item_popup_reiko_statement_note
          leave:
            effect: fadeOut
      - goto: approach_probe

  intro_item_already_owned:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(진술은 있어.</speed> <speed=30>온도계와 맞춰 보자.)</speed>"
      - goto: approach_probe

  approach_probe:
    actions:
      - choice:
          key: reiko_approach
          prompt: "숫자 뒤에 숨은 레이코가 스스로 다음 동작을 말하게 하려면?"
          options:
            - text: "시음 책임자의 절차를 처음부터 듣는다"
              set:
                rapport_reiko: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_procedure
            - text: "하루오와의 개인적인 관계부터 묻는다"
              goto: approach_personal
            - text: "손수건을 쓴 범인이라고 단정한다"
              add:
                trust: -1
              goto: approach_accusation

  approach_procedure:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=21>온도계를 소독하고, 주전자를 올리고, 88도에서 불을 끕니다.</speed> <speed=16>잔 번호를 확인한 다음 물기까지 닦고...</speed> <speed=16>아니, 그날은 달랐어요.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(‘물기를 닦고’에서 처음 순서가 바뀌었어.</speed> <speed=30>그 손이 간 잔은?)</speed>"
      - goto: first_probe

  approach_personal:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=19>하루오 씨는 아버지의 마지막 동료였어요.</speed> <speed=16>아버지가 돌아가신 뒤에도 이 차와 제 자리를 지켜 준 사람이고요. 그 이상을 지금 말해야 하나요?</speed>"
      - goto: first_probe

  approach_accusation:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=18>그 말은 질문이 아니라 이미 완성한 이야기네요.</speed> <speed=16>하루오 씨도 제 말을 끝까지 안 들었는데, 당신도 그러겠다는 건가요?</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=25>온도계는 88도가 된 시각을 자동으로 남기죠?</speed> <speed=19>레이코 씨가 기억을 고치기 전에, 그 숫자부터 놓고 이야기해요.</speed>"
      - choice:
          key: reiko_first_probe
          prompt: "멈춘 온도계와 맞춰 볼 것은?"
          options:
            - text: "88도 도달 시각과 비명 시각을 겹친다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
              goto: first_claim_correct
            - text: "목소리가 떨린 순간을 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "켄지와 다퉜다는 이유만으로 의심한다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=23>온도계는 9시 29분, 정확히 88도에서 멈췄어요.</speed> <speed=18>란 누나가 본 비명은 9시 30분.</speed> <speed=33>레이코 씨 절차에서 그 1분만 사라졌어요.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=18>고작 1분이에요.</speed> <speed=16>그 1분으로 아버지의 차도, 제가 지켜 온 시간도 전부 살인으로 만들 셈이에요?</speed>"
      - choice:
          key: reiko_first_commit
          prompt: "그 1분과 겹치는 흔적은?"
          options:
            - text: "2번 잔 가장자리의 반응과 겹친다"
              goto: motive_branch
            - text: "같은 질문을 다시 반복한다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=19>(상처받은 목소리는 시각을 바꾸지 않아.</speed> <speed=30>9시 29분으로.)</speed>"
      - choice:
          key: reiko_first_rebuttal
          prompt: "말 대신 무엇을 볼까?"
          options:
            - text: "온도계와 감식 기록을 비교한다"
              goto: retry_notice
            - text: "말투를 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(표정은 흔들려도 88도와 9시 29분은 움직이지 않아.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - choice:
          key: reiko_second_probe
          prompt: "9시 29분과 바로 겹치는 것은?"
          options:
            - text: "온도 기록과 2번 잔의 반응을 맞춘다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 1
              goto: second_claim_correct
            - text: "흔들린 말투만으로 결론 낸다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong
            - text: "다실 분위기만으로 판단한다"
              add:
                mistake_count: 1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=23>온도계가 멈춘 9시 29분.</speed> <speed=18>‘물기를 닦았다’고 말한 손이 바로 그때 2번 잔 가장자리에 닿았어.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=25>레이코 씨가 절차에서 지운 한 동작과 시각이 정확히 겹쳐요.</speed>"
      - choice:
          key: reiko_second_commit
          prompt: "이 빈칸을 어떻게 남길까?"
          options:
            - text: "진술에서 빠진 동작으로 표시한다"
              goto: motive_branch
            - text: "우연일 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: motive_half_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 레이코.nervous
          text: "<speed=19>(사람을 먼저 몰아 숫자를 놓쳤어.</speed> <speed=30>더 밀면 진짜 기억도 닫혀.)</speed>"
      - choice:
          key: reiko_second_rebuttal
          prompt: "진술 메모를 덮을까?"
          options:
            - text: "메모만 챙기고 돌아간다"
              goto: motive_half_line
            - text: "말투를 근거로 계속 추궁한다"
              add:
                trust: -1
              gameOver:
                title: "진술 중단"
                message: "기록 없이 몰아붙이자 레이코가 진술을 거부했다. 마지막 저장에서 9시 29분의 숫자부터 다시 잇자."

  motive_branch:
    actions:
      - branch:
          cases:
            - when:
                var: clue_rim_reagent
                op: eq
                value: true
              goto: motive_open_line
          default: motive_half_line

  motive_open_line:
    actions:
      - sound: notebook_flip
      - effect: zoom
      - say:
          char: 코난.serious
          text: "<speed=26>수정 계약서엔 배합 이름을 켄지 씨 회사로 넘기는 조항이 있어요.</speed> <speed=19>그런데 원본 연구 노트는 그날 사라졌죠. 레이코 씨가 가장 두려워한 건 그 노트까지 넘어가는 일이었고요.</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=18>그 노트는...</speed> <speed=37>하루오 씨가 어디에 숨겼다고 했죠?</speed>"
      - say:
          char: 코난.serious
          with:
            - 레이코.nervous
          text: "<speed=23>난 '숨겼다'고 말하지 않았어요.</speed> <speed=18>레이코 씨는 사라지기 전부터 하루오 씨가 원본을 따로 뒀다는 걸 알고 있었네요.</speed>"
      - set:
          reiko_motive_open: true
      - add:
          deduction_score: 2
          final_confidence: 1
          trust: 1
      - goto: outro

  motive_half_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(지운 1분은 찾았어.</speed> <speed=30>하지만 왜 하루오 씨를 막으려 했는지는 아직 비어 있어.)</speed>"
      - add:
          mistake_count: 1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_reiko
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=18>그 메모...</speed> <speed=16>제가 고쳐 말한 부분도 처음 말한 부분도 지우지 말아 주세요. 또 제 편한 대로 기억할까 봐 무서워요.</speed>"
      - say:
          char: 코난
          text: "<speed=25>안 지워요.</speed> <speed=19>틀린 말까지 남겨야 어디서 기억이 바뀌었는지 알 수 있으니까요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=25>말해 줘서 고마워요.</speed> <speed=19>메모는 손대지 않고 경찰에게 보여 줄게요.</speed>"
      - goto: /routes/hub/1.yaml
