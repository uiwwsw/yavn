script:
  - scene: entry_guard
  - scene: revisit_notice
  - scene: intro
  - scene: approach_probe
  - scene: approach_deal
  - scene: approach_tone
  - scene: approach_accusation
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                var: visited_kenji
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  revisit_notice:
    actions:
      - bg: rain_corridor
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 켄지.angry
          with:
            - 코난.think
          text: "<speed=28>통화 내역도, 거래 조건도 다 넘겼어.</speed> <speed=22>더 필요하면 경찰하고 정식으로 얘기해.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: rain_corridor
      - music: tension
      - sound: thunder
      - effect: focus
      - set:
          visited_kenji: true
      - add:
          investigation_count: 1
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 코고로
          position: right
          emotion: angry
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=40>그래, 하루오와 돈 얘기했다!</speed> <speed=24>원본 노트를 넘기면 기존 투자금에 웃돈을 얹겠다고 내가 먼저 제안했어.</speed>"
      - say:
          char: 코고로.angry
          with:
            - 켄지.angry
          text: "<speed=32>그 제안, 경찰 앞에서도 한 글자 빼지 마.</speed> <speed=24>지금은 9시 30분에 네 발이 어디 있었는지부터다.</speed>"

  approach_probe:
    actions:
      - choice:
          key: kenji_approach
          prompt: "켄지에게서 거래 전부를 들으려면?"
          options:
            - text: "통화 기록과 계약 진술을 한 묶음으로 남긴다"
              set:
                rapport_kenji: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_deal
            - text: "먼저 목소리를 낮추라고 요구한다"
              goto: approach_tone
            - text: "웃돈 제안이 곧 살인 동기라고 단정한다"
              add:
                trust: -1
              goto: approach_accusation

  approach_deal:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=32>좋아, 그 조건이면 말하지.</speed> <speed=22>통화 내역을 먼저 확인해.</speed> <speed=38>대신 계약 얘기도 전부 적어. 유리한 부분만 자르지 말고.</speed>"
      - say:
          char: 코난.think
          text: "<speed=20>(화를 내면서도 교환 조건부터 세워.</speed> <speed=42>그 조건을 지키면 허세 대신 사실이 나오겠어.)</speed>"
      - goto: first_probe

  approach_tone:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=44>사람이 죽었는데 예의부터 따질 셈이야?</speed> <speed=22>묻고 싶은 걸 묻든가, 비켜.</speed>"
      - goto: first_probe

  approach_accusation:
    actions:
      - say:
          char: 켄지.angry
          delivery: shout
          with:
            - 코난.serious
          text: "<speed=48>가격을 불렀다고 사람까지 샀다는 거야?</speed> <speed=22>거래와 살인을 같은 줄에 적지 마!</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=28>비명 직전 7분 동안, 켄지 씨 휴대전화는 복도 기지국에 잡혔죠?</speed>"
      - choice:
          key: kenji_first_probe
          prompt: "복도에 있었다는 걸 확인할 것은?"
          options:
            - text: "21:24~21:31 통화 내역과 수신 위치"
              add:
                deduction_score: 1
              goto: first_claim_correct
            - text: "화가 났으니 범행했다고 본다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "큰소리를 냈으니 오히려 결백하다고 본다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=28>9시 24분 연결, 31분 종료.</speed> <speed=22>비명이 난 30분에도 통화는 끊기지 않았어요.</speed>"
      - choice:
          key: kenji_first_commit
          prompt: "이 7분이 증명하는 것은?"
          options:
            - text: "비명 때 복도에 있었다는 진술을 인정한다"
              goto: second_probe
            - text: "통화 중 움직였는지 더 묻는다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=22>(화를 낸 건 이유가 될 수 있어도 기회는 아니야.</speed> <speed=42>그 7분엔 2번 잔까지 갈 수 없어.)</speed>"
      - choice:
          key: kenji_first_rebuttal
          prompt: "무엇으로 7분을 다시 확인할까?"
          options:
            - text: "통화 시작과 종료 시각을 확인한다"
              goto: retry_notice
            - text: "말다툼만 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(큰 목소리가 아니라 끊기지 않은 7분을 봐야 해.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=28>통화하며 다실 문까지 돌아왔을 때였어.</speed> <speed=22>하루오가 '건드리지 마'라고 했는데, 레이코가 보란 듯 뚜껑을 두 번 눌렀지.</speed>"
      - choice:
          key: kenji_second_probe
          prompt: "문밖의 켄지만 볼 수 있었던 것은?"
          options:
            - text: "두 번째 소리에 모두가 주전자를 본 순간"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
                trust: 1
              goto: second_claim_correct
            - text: "켄지가 화가 났으니 진술은 모두 거짓이다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "통화 기록보다 첫인상을 믿는다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=26>켄지는 문밖이라 다실 전체를 봤어.</speed> <speed=20>안에 있던 사람들은 두 번째 소리에 주전자만 봤고.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=28>켄지 씨 손은 그때 휴대전화에 있었어요.</speed> <speed=22>하지만 문밖에서 본 '모두의 시선'은 남겨야 해요.</speed>"
      - choice:
          key: kenji_second_commit
          prompt: "그 목격을 어떻게 보존할까?"
          options:
            - text: "통화 내역과 목격 시각을 함께 남긴다"
              goto: success_line
            - text: "참고만 하고 보류한다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=22>(거친 말투가 기록까지 거짓으로 만들진 않아.</speed> <speed=44>사람과 7분을 따로 봐야 해.)</speed>"
      - choice:
          key: kenji_second_rebuttal
          prompt: "켄지의 통화 내역을 덮을까?"
          options:
            - text: "기록만 챙기고 돌아간다"
              goto: fail_line
            - text: "켄지를 계속 범인으로 의심한다"
              add:
                trust: -1
              goto: fail_line

  success_line:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=28>(켄지 씨에겐 돈도 분노도 있었어.</speed> <speed=22>하지만 9시 29분에 2번 잔을 만질 손은 없었어.)</speed>"
      - goto: outro

  fail_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=20>(7분은 확보했지만 문에서 본 장면이 흐려.</speed> <speed=42>다른 사람의 시선과 맞춰야 해.)</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_kenji
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=28>통화 내역은 가져가.</speed> <speed=22>대신 거래 제안도 전부 적어.</speed> <speed=20>하루오는 만든 사람 이름을 하나라도 빼면 안 판다고 거절했어.</speed>"
      - say:
          char: 코난
          text: "<speed=28>통화도 거래도, 말한 순서 그대로 남길게요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=28>통화 내역은 지우지 마세요.</speed> <speed=22>경찰이 오면 9시 24분부터 그대로 보여 줘요.</speed>"
      - goto: /routes/hub/1.yaml
