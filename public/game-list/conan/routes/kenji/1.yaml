script:
  - scene: entry_guard
  - scene: evidence_followup
  - scene: revisit_notice
  - scene: intro
  - scene: approach_probe
  - scene: approach_deal
  - scene: approach_tone
  - scene: approach_accusation
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: visited_kenji
                    op: eq
                    value: true
                  - any:
                      - var: clue_kenji_rejected_deal
                        op: eq
                        value: false
                      - var: clue_double_press_decoy
                        op: eq
                        value: false
                  - var: recovered_kenji_deal
                    op: eq
                    value: false
              goto: evidence_followup
            - when:
                var: visited_kenji
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  evidence_followup:
    actions:
      - bg: rain_corridor
      - set:
          clue_kenji_rejected_deal: true
          clue_double_press_decoy: true
          recovered_kenji_deal: true
      - add:
          deduction_score: 1
          final_confidence: 1
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: right
          emotion: serious
      - sound: notebook_flip
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=25>통화 내역만 보지 마.</speed> <speed=19>문밖에서 보니 두 번째 뚜껑 소리에 안쪽 사람들 시선이 전부 주전자로 쏠렸어.</speed>"
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=25>그리고 내가 하루오와 나눈 거래 얘기도 끝까지 적어.</speed> <speed=19>레이코는 앞부분만 들었어.</speed> <speed=18>하루오는 이름 하나라도 빼면 거래하지 않겠다고 내 제안을 거절했어.</speed>"
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=25>두 번의 소리와 거절한 뒷말.</speed> <speed=19>통화 시각과 거래 진술, 둘 다 잘리지 않게 경찰에게 넘길게요.</speed>"
      - goto: /routes/hub/1.yaml

  revisit_notice:
    actions:
      - bg: rain_corridor
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 켄지.angry
          with:
            - 코난.think
          text: "<speed=25>통화 내역도, 거래 조건도 다 넘겼어.</speed> <speed=19>더 필요하면 경찰하고 정식으로 얘기해.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: rain_corridor
      - music: tension
      - sound: thunder
      - effect: focus
      - set:
          visited_kenji: true
      - add:
          investigation_count: 1
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 코고로
          position: right
          emotion: angry
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=35>그래, 하루오와 돈 얘기했다!</speed> <speed=21>원본 노트를 넘기면 기존 투자금에 웃돈을 얹겠다고 내가 먼저 제안했어.</speed>"
      - say:
          char: 코고로.angry
          with:
            - 켄지.angry
          text: "<speed=28>그 제안, 경찰 앞에서도 한 글자 빼지 마.</speed> <speed=21>지금은 9시 30분에 네 발이 어디 있었는지부터다.</speed>"

  approach_probe:
    actions:
      - choice:
          key: kenji_approach
          prompt: "켄지에게서 거래 전부를 들으려면?"
          options:
            - text: "통화 기록과 계약 진술을 한 묶음으로 남긴다"
              set:
                rapport_kenji: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_deal
            - text: "먼저 목소리를 낮추라고 요구한다"
              goto: approach_tone
            - text: "웃돈 제안이 곧 살인 동기라고 단정한다"
              add:
                trust: -1
              goto: approach_accusation

  approach_deal:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=28>좋아, 그 조건이면 말하지.</speed> <speed=19>통화 내역을 먼저 확인해.</speed> <speed=33>대신 계약 얘기도 전부 적어. 유리한 부분만 자르지 말고.</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(화가 나도 조건부터 말해.</speed> <speed=30>그 방식으로 묻자.)</speed>"
      - goto: first_probe

  approach_tone:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=39>사람이 죽었는데 예의부터 따질 셈이야?</speed> <speed=19>묻고 싶은 걸 묻든가, 비켜.</speed>"
      - goto: first_probe

  approach_accusation:
    actions:
      - say:
          char: 켄지.angry
          delivery: shout
          with:
            - 코난.serious
          text: "<speed=42>가격을 불렀다고 사람까지 샀다는 거야?</speed> <speed=19>거래와 살인을 같은 줄에 적지 마!</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=25>비명 직전 7분 동안, 켄지 씨 휴대전화는 복도 기지국에 잡혔죠?</speed>"
      - choice:
          key: kenji_first_probe
          prompt: "복도에 있었다는 걸 확인할 것은?"
          options:
            - text: "21:24~21:31 통화 내역과 수신 위치"
              add:
                deduction_score: 1
              goto: first_claim_correct
            - text: "화가 났으니 범행했다고 본다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "큰소리를 냈으니 오히려 결백하다고 본다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=25>9시 24분 연결, 31분 종료.</speed> <speed=19>비명이 난 30분에도 통화는 끊기지 않았어요.</speed>"
      - choice:
          key: kenji_first_commit
          prompt: "이 7분이 증명하는 것은?"
          options:
            - text: "비명 때 복도에 있었다는 진술을 인정한다"
              goto: second_probe
            - text: "통화 중 움직였는지 더 묻는다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=19>(분노와 기회는 달라.</speed> <speed=30>그 7분을 보자.)</speed>"
      - choice:
          key: kenji_first_rebuttal
          prompt: "무엇으로 7분을 다시 확인할까?"
          options:
            - text: "통화 시작과 종료 시각을 확인한다"
              goto: retry_notice
            - text: "말다툼만 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(목소리 말고, 끊기지 않은 7분.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=25>통화하며 다실 문까지 돌아왔을 때였어.</speed> <speed=19>하루오가 '건드리지 마'라고 했는데, 레이코가 보란 듯 뚜껑을 두 번 눌렀지.</speed>"
      - choice:
          key: kenji_second_probe
          prompt: "문밖의 켄지만 볼 수 있었던 것은?"
          options:
            - text: "두 번째 소리에 모두가 주전자를 본 순간"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
                trust: 1
              goto: second_claim_correct
            - text: "켄지가 화가 났으니 진술은 모두 거짓이다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "통화 기록보다 첫인상을 믿는다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=23>켄지는 문밖이라 다실 전체를 봤어.</speed> <speed=18>안에 있던 사람들은 두 번째 소리에 주전자만 봤고.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=25>켄지 씨 손은 그때 휴대전화에 있었어요.</speed> <speed=19>하지만 문밖에서 본 '모두의 시선'은 남겨야 해요.</speed>"
      - choice:
          key: kenji_second_commit
          prompt: "그 목격을 어떻게 보존할까?"
          options:
            - text: "통화 내역과 목격 시각을 함께 남긴다"
              goto: success_line
            - text: "참고만 하고 보류한다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=19>(말투에 끌렸어.</speed> <speed=30>7분만 다시.)</speed>"
      - choice:
          key: kenji_second_rebuttal
          prompt: "켄지의 통화 내역을 덮을까?"
          options:
            - text: "기록만 챙기고 돌아간다"
              goto: fail_line
            - text: "켄지를 계속 범인으로 의심한다"
              add:
                trust: -1
              gameOver:
                title: "수사 실패"
                message: "통화 기록보다 선입견을 고집하는 사이 진범이 증거를 정리했다. 마지막 저장에서 기록을 다시 확인하자."

  success_line:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=22>(동기는 있어도 기회가 없어.</speed> <speed=19>9시 29분엔 불가능해.)</speed>"
      - goto: outro

  fail_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=18>(7분은 맞아.</speed> <speed=30>문 앞 장면이 비었어.)</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_kenji
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - set:
          clue_kenji_rejected_deal: true
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=25>통화 내역은 가져가.</speed> <speed=19>대신 거래 제안도 전부 적어.</speed> <speed=18>하루오는 만든 사람 이름을 하나라도 빼면 안 판다고 거절했어.</speed>"
      - say:
          char: 코난
          text: "<speed=25>통화도 거래도, 말한 순서 그대로 남길게요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=25>통화 내역은 지우지 마세요.</speed> <speed=19>경찰이 오면 9시 24분부터 그대로 보여 줘요.</speed>"
      - goto: /routes/hub/1.yaml
