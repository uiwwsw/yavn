script:
  - scene: entry_guard
  - scene: revisit_notice
  - scene: intro
  - scene: approach_probe
  - scene: approach_deal
  - scene: approach_tone
  - scene: approach_accusation
  - scene: first_probe
  - scene: first_claim_correct
  - scene: first_claim_wrong
  - scene: retry_notice
  - scene: second_probe
  - scene: second_claim_correct
  - scene: second_claim_wrong
  - scene: success_line
  - scene: fail_line
  - scene: outro
  - scene: outro_open
  - scene: outro_closed

scenes:
  entry_guard:
    actions:
      - branch:
          cases:
            - when:
                var: visited_kenji
                op: eq
                value: true
              goto: revisit_notice
          default: intro

  revisit_notice:
    actions:
      - bg: rain_corridor
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 켄지.angry
          with:
            - 코난.think
          text: "<speed=30>통화 기록까지 보여 줬잖아.</speed> <speed=24>더 물을 거면 경찰이 온 뒤에 해.</speed>"
      - goto: /routes/hub/1.yaml

  intro:
    actions:
      - bg: rain_corridor
      - music: reasoning
      - sound: thunder
      - effect: focus
      - set:
          visited_kenji: true
      - add:
          investigation_count: 1
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 코고로
          position: right
          emotion: angry
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=44>하루오와 말다툼한 건 인정해.</speed> <speed=26>그 자가 원본 노트를 넘기는 조건으로 돈을 더 요구했으니까!</speed>"
      - say:
          char: 코고로.angry
          with:
            - 켄지.angry
          text: "<speed=34>돈 얘기는 경찰 앞에서도 다시 해.</speed> <speed=26>우선 비명 전후에 어디 있었는지부터.</speed>"

  approach_probe:
    actions:
      - choice:
          key: kenji_approach
          prompt: "거래에 익숙한 켄지에게 어떤 순서로 물을까?"
          options:
            - text: "통화 알리바이를 확인하면 계약 진술도 빠짐없이 기록하겠다고 한다"
              set:
                rapport_kenji: true
              add:
                rapport_score: 1
                trust: 1
              goto: approach_deal
            - text: "목소리부터 낮추라고 한다"
              goto: approach_tone
            - text: "돈 때문에 하루오를 죽였다고 단정한다"
              add:
                trust: -1
              goto: approach_accusation

  approach_deal:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=34>좋아, 순서대로 하지.</speed> <speed=24>통화 기록을 확인하고, 그다음 계약서 얘기를 전부 적어.</speed>"
      - say:
          char: 코난.think
          text: "<speed=22>(흥분해도 조건과 순서는 놓치지 않아.)</speed> <speed=46>기록부터 맞추면 허세가 빠지겠어.</speed>"
      - goto: first_probe

  approach_tone:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=46>사람이 죽었는데 목소리 크기가 중요해?</speed> <speed=24>확인할 게 있으면 바로 물어.</speed>"
      - goto: first_probe

  approach_accusation:
    actions:
      - say:
          char: 켄지.angry
          delivery: shout
          with:
            - 코난.serious
          text: "<speed=50>돈 얘기를 했다고 살인범이야?</speed> <speed=24>증거도 없이 거래와 살인을 한 줄에 쓰지 마!</speed>"
      - goto: first_probe

  first_probe:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=30>비명 직전, 켄지 씨는 다실에 없었죠?</speed>"
      - choice:
          key: kenji_first_probe
          prompt: "켄지의 동선을 확인할 기록은?"
          options:
            - text: "21:24~21:31 복도 통화 기록을 확인한다"
              add:
                deduction_score: 1
              goto: first_claim_correct
            - text: "화가 났으니 범행했다고 본다"
              add:
                mistake_count: 1
                trust: -1
              goto: first_claim_wrong
            - text: "큰소리를 냈으니 오히려 결백하다고 본다"
              add:
                mistake_count: 1
              goto: first_claim_wrong

  first_claim_correct:
    actions:
      - say:
          char: 코난.serious
          with:
            - 켄지.angry
          text: "<speed=30>통화는 9시 24분에 시작해서 31분에 끝났어요.</speed> <speed=24>비명이 난 시각도 통화 중이었고요.</speed>"
      - choice:
          key: kenji_first_commit
          prompt: "이 통화 기록을 어떻게 볼까?"
          options:
            - text: "복도에 있었다는 진술을 인정한다"
              goto: second_probe
            - text: "통화 중 움직였는지 더 묻는다"
              goto: retry_notice

  first_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=24>화를 냈다는 사실은 동기가 될 수 있어도, 그가 잔에 손댄 순간을 만들진 못해.</speed>"
      - choice:
          key: kenji_first_rebuttal
          prompt: "켄지의 동선을 다시 확인할까?"
          options:
            - text: "통화 시작과 종료 시각을 확인한다"
              goto: retry_notice
            - text: "말다툼만 계속 추궁한다"
              add:
                mistake_count: 1
                trust: -1
              goto: retry_notice

  retry_notice:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(켄지의 성격이 아니라, 휴대전화에 남은 7분을 봐야 해.)</speed>"
      - goto: second_probe

  second_probe:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=30>통화를 끝내고 문으로 돌아왔을 때 봤어.</speed> <speed=24>레이코가 하루오의 만류를 무시하고 뚜껑을 두 번 누르더군.</speed>"
      - choice:
          key: kenji_second_probe
          prompt: "켄지가 본 행동에서 중요한 점은?"
          options:
            - text: "모두의 시선이 뚜껑으로 향한 순간이었다"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
                trust: 1
              goto: second_claim_correct
            - text: "켄지가 화가 났으니 진술은 모두 거짓이다"
              add:
                mistake_count: 1
              goto: second_claim_wrong
            - text: "통화 기록보다 첫인상을 믿는다"
              add:
                mistake_count: 1
                trust: -1
              goto: second_claim_wrong

  second_claim_correct:
    actions:
      - say:
          text: "<speed=28>켄지는 다실 밖에서 그 동작을 봤다.</speed> <speed=24>안에 있던 사람들은 모두 주전자만 보고 있었다.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=30>켄지 씨가 범행 순간 잔에 손댈 수는 없었어요.</speed> <speed=24>대신 문에서 본 장면은 중요한 증언이 돼요.</speed>"
      - choice:
          key: kenji_second_commit
          prompt: "켄지의 목격을 증언으로 남길까?"
          options:
            - text: "통화 기록과 함께 남긴다"
              goto: success_line
            - text: "참고만 하고 보류한다"
              add:
                final_confidence: -1
              goto: fail_line

  second_claim_wrong:
    actions:
      - say:
          char: 코난.think
          with:
            - 켄지.angry
          text: "<speed=24>그건 켄지가 싫다는 이유일 뿐이야.</speed> <speed=48>기록과 목격 장면은 따로 봐야 해.</speed>"
      - choice:
          key: kenji_second_rebuttal
          prompt: "켄지 조사를 마칠까?"
          options:
            - text: "기록만 챙기고 돌아간다"
              goto: fail_line
            - text: "켄지를 계속 범인으로 의심한다"
              add:
                trust: -1
              goto: fail_line

  success_line:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=30>켄지 씨에겐 화낼 이유가 있었지만, 그 1분에 잔을 만질 기회는 없었어.</speed>"
      - goto: outro

  fail_line:
    actions:
      - say:
          char: 코난.think
          text: "<speed=22>(통화 기록과 그의 목격을 완전히 이어 놓진 못했어.)</speed> <speed=48>다른 진술이 필요해.</speed>"
      - add:
          final_confidence: -1
      - goto: outro

  outro:
    actions:
      - branch:
          cases:
            - when:
                var: rapport_kenji
                op: eq
                value: true
              goto: outro_open
          default: outro_closed

  outro_open:
    actions:
      - say:
          char: 켄지.angry
          with:
            - 코난.serious
          text: "<speed=30>통화 기록은 가져가.</speed> <speed=24>대신 내 말도 잘라 쓰지 마. 난 하루오와 거래하려 했지, 죽이려 한 게 아니야.</speed>"
      - say:
          char: 코난
          text: "<speed=30>기록과 말이 맞으면 자를 이유도 없어요.</speed>"
      - goto: /routes/hub/1.yaml

  outro_closed:
    actions:
      - say:
          char: 코난
          text: "<speed=30>경찰이 오면 통화 기록을 그대로 보여 주세요.</speed> <speed=24>지우면 오히려 더 의심받을 테니까요.</speed>"
      - goto: /routes/hub/1.yaml
