script:
  - scene: calm_arrival
  - scene: tea_joke
  - scene: host_preview
  - scene: tension_seed
  - scene: handoff

scenes:
  calm_arrival:
    actions:
      - bg: ryokan_hall
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: center
      - char:
          id: 코고로
          position: right
          emotion: proud
      - sound: door
      - say:
          char: 란
          text: "<speed=50>비 냄새 좋다.</speed> <speed=34>이런 곳이라면 아빠도 얌전히 쉴 수 있겠지?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=66>물론이지!</speed> <speed=40>오늘 일정은 온천, 저녁, 그리고 이 료칸의 명물 차.</speed> <speed=58>사건은 절대 사절이다!</speed>"
      - say:
          char: 코난.think
          text: "<speed=28>(아저씨가 저 말을 하면 꼭 불길하단 말이지...)</speed>"

  tea_joke:
    actions:
      - bg: tea_room
      - sound: cup_clink
      - say:
          char: 코고로.proud
          text: "<speed=58>오, 이 향!</speed> <speed=38>마시기도 전에 머리가 맑아지는군.</speed>"
      - say:
          char: 란
          text: "<speed=46>아빠, 아직 시음 전이야.</speed> <speed=34>혼자 먼저 마시면 또 민망해진다?</speed>"
      - say:
          char: 코난
          text: "<speed=34>잔은 네 개인데 자리표까지 있네.</speed> <speed=28>그냥 시음회치고는 꽤 엄격하다.</speed>"

  host_preview:
    actions:
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 레이코
          position: right
          emotion: nervous
      - char:
          id: 세이지
          position: center
          emotion: cold
      - say:
          char: 레이코.nervous
          with:
            - 켄지.angry
            - 세이지.cold
          text: "<speed=38>폭우 때문에 귀한 손님들 발이 묶였네요.</speed> <speed=30>그래도 시음은 예정대로 진행할게요.</speed>"
      - say:
          char: 켄지.angry
          with:
            - 레이코.nervous
            - 세이지.cold
          text: "<speed=52>예정대로?</speed> <speed=32>계약서에서 개발자 권리 조항이 바뀐 것부터 설명해.</speed>"
      - say:
          char: 세이지.cold
          with:
            - 켄지.angry
            - 레이코.nervous
          text: "<speed=34>원본은 제가 보관하고 있습니다.</speed> <speed=28>시음이 끝나면 수정본과 한 줄씩 대조하죠.</speed>"

  tension_seed:
    actions:
      - bg: rain_corridor
      - music: reasoning
      - effect: blur
      - sound: thunder
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=26>(창문이 울릴 만큼 비가 세졌어.)</speed> <speed=22>산길은 벌써 통제됐고...</speed>"
      - say:
          char: 코난.serious
          text: "<speed=24>(바뀐 계약서, 굳어 버린 레이코의 손, 그리고 네 개의 잔.)</speed> <speed=54>아무래도 휴가로 끝나진 않겠네.</speed>"

  handoff:
    actions:
      - effect: pulse
      - say:
          text: "<speed=34>그때는 아무도 몰랐다.</speed> <speed=26>저 네 개의 찻잔 중 하나가 곧 사건 현장이 되리라는 걸.</speed>"
