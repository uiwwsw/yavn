script:
  - scene: holiday_arrival
  - scene: room_lottery
  - scene: bath_return
  - scene: souvenir_corner
  - scene: souvenir_finish
  - scene: table_tennis
  - scene: table_tennis_finish
  - scene: dinner_time
  - scene: rain_window
  - scene: quiet_night
  - scene: quiet_night_finish

scenes:
  holiday_arrival:
    actions:
      - bg: mountain_rain
      - music: rain
      - sound: door
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=29>아빠, 우산 좀 안쪽으로 들어오세요.</speed> <speed=24>어깨가 다 젖었잖아요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=35>이 정도 비쯤이야!</speed> <speed=26>산속 온천은 비가 와야 운치가 사는 법이지.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=28>란 누나, 저기 봐.</speed> <speed=24>구름 아래로 강물이 생긴 것 같아.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>정말이네.</speed> <speed=23>사진 찍어 두자. 비가 그치면 같은 자리에서 한 장 더.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=33>사진은 나중이다.</speed> <speed=26>오늘 내 의뢰인은 온천, 저녁상, 그리고 낮잠이야!</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>셋 다 의뢰비는 아빠가 내는 거 아시죠?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=26>여행 첫날부터 돈 얘기는 하지 말자.</speed>"

  room_lottery:
    actions:
      - bg: guest_room
      - music: intro
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 란
          position: right
      - say:
          text: "<speed=24>방에는 유카타 세 벌과 작은 과자 바구니가 가지런히 놓여 있었다.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=34>창가 자리는 내가 맡지.</speed> <speed=25>명탐정은 경치를 보며 작전을 짜야 하니까.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>낮잠 작전이요?</speed> <speed=23>좋아요. 대신 코난 과자까지 집으면 창가 자리는 압수예요.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=28>아저씨 손에 벌써 두 개 있는데요?</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=38>이건 방 배정 수수료다!</speed>"
      - say:
          char: 란
          text: "<speed=27>그럼 창가 자리 사용료로 하나 돌려주세요.</speed>"
      - say:
          text: "<speed=23>코고로는 잠깐 고민하더니 더 작은 과자를 골라 바구니에 돌려놓았다.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>돌려놓은 게 더 작은데요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=31>세금 뗀 거다, 세금!</speed>"

  bath_return:
    actions:
      - bg: rain_corridor
      - sound: door
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          text: "<speed=24>노천탕에서 돌아온 코고로는 수건을 목에 걸고 복도를 성큼성큼 걸었다.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 코난.smile
          text: "<speed=32>봤지, 꼬마야?</speed> <speed=25>계곡을 내려다보며 온천에 앉아 있으면 세상 고민이 다 작아 보여.</speed>"
      - say:
          char: 코난.smile
          with:
            - 코고로.proud
          text: "<speed=27>아저씨 고민은 저녁에 다시 커질 것 같아요.</speed> <speed=23>목욕 전에 체중계 올라간 거 봤어요.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=38>그 기계가 습기를 먹은 거다!</speed>"
      - char:
          id: 란
          position: center
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>그럼 저녁 튀김은 제가 도와드릴게요.</speed> <speed=23>아빠 몫까지요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=35>란, 가족끼리 그렇게 차가우면 안 된다!</speed>"

  souvenir_corner:
    actions:
      - bg: souvenir_corner
      - music: intro
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          text: "<speed=24>휴게실로 가던 세 사람은 로비 한쪽의 작은 기념품 진열대 앞에서 걸음을 멈췄다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>아빠, 기념품을 의뢰 경비로 처리하면 안 돼요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=31>누가 그런 말을 했냐?</speed> <speed=24>나는 그냥 영수증이 있나 본 거다.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=27>탁구 라켓 열쇠고리도 있어.</speed> <speed=23>진짜 라켓보다 훨씬 작아.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=33>좋아. 오늘 탁구 우승자에게 하나 사 주지.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>그럼 지금 사도 제가 받겠네요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=30>경기도 안 했는데 기세만 국가대표군.</speed>"
      - choice:
          key: holiday_souvenir
          prompt: "코난은 무엇을 고를까?"
          options:
            - text: "작은 탁구 라켓 열쇠고리"
              set:
                souvenir_choice: "paddle"
              goto: souvenir_paddle
            - text: "찻잎 향이 나는 주머니"
              set:
                souvenir_choice: "tea"
              goto: souvenir_tea
            - text: "비 내리는 산길 엽서"
              set:
                souvenir_choice: "postcard"
              goto: souvenir_postcard

  souvenir_paddle:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 란
          position: right
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=28>그럼 이걸로 할래.</speed> <speed=23>오늘 진 사람 가방에 달아 주자.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>좋은 벌칙인데요?</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=37>승부도 전에 벌칙부터 정하지 마!</speed>"
      - goto: souvenir_finish

  souvenir_tea:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=27>이 향주머니, 방에 두면 비 냄새가 덜 나겠어.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>좋다.</speed> <speed=22>신이치 것까지 하나 살까?</speed>"
      - say:
          char: 코난.smile
          text: "<speed=28>하나는 꼭 남겨 둬.</speed> <speed=23>직접 주는 게 좋을 테니까.</speed>"
      - goto: souvenir_finish

  souvenir_postcard:
    actions:
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=27>아까 본 산길이랑 똑같아.</speed> <speed=23>이걸로 할래.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>내일 비가 그치면 실제 풍경이랑 나란히 찍자.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>엽서보다 사진이 더 예쁘게 나오면 좋겠어.</speed>"
      - goto: souvenir_finish

  souvenir_finish:
    actions:
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 란
          position: right
      - say:
          text: "<speed=23>코고로는 계산대에서 영수증을 반듯하게 접어 주머니에 넣었다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>다시 말하지만 경비 처리 안 돼요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=29>추억도 훌륭한 탐정 자산이다.</speed>"
      - say:
          char: 란
          text: "<speed=28>그 말도 녹음해 둘게요.</speed>"

  table_tennis:
    actions:
      - bg: recreation_room
      - music: intro
      - char:
          id: 란
          position: left
          emotion: determined
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          text: "<speed=24>첫 판이 끝나자 코고로는 탁구공을 주워 들고 아무 일도 없었다는 듯 헛기침했다.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란.determined
          text: "<speed=34>좋아, 딱 삼세판이다.</speed> <speed=25>먼저 두 판 가져가는 사람이 창가 자리까지 차지하는 거야!</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>첫 판은 제가 이겼으니까, 아빠는 이제 한 번도 못 지시겠네요.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=32>방금 건 몸풀기다!</speed> <speed=24>국제 규칙에도 몸풀기는 승부에 안 넣어.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          with:
            - 란.determined
          text: "<speed=28>그 국제 규칙, 방금 만든 거죠?</speed>"
      - char:
          id: 코고로
          position: right
          emotion: angry
      - say:
          char: 코고로.angry
          delivery: shout
          text: "<speed=38>꼬마는 심판이나 봐!</speed>"
      - choice:
          key: holiday_table_tennis
          prompt: "두 번째 판, 랠리가 길어지자 코난은?"
          options:
            - text: "란에게 백핸드 쪽을 알려 준다"
              goto: table_tennis_coach
            - text: "이번만큼은 조용히 선을 본다"
              goto: table_tennis_referee
            - text: "코고로에게 힘내라고 외친다"
              goto: table_tennis_cheer

  table_tennis_coach:
    actions:
      - say:
          char: 코난.smile
          with:
            - 란.determined
          text: "<speed=29>란 누나, 또 백핸드 쪽!</speed>"
      - say:
          char: 란.determined
          text: "<speed=31>알았어!</speed>"
      - say:
          char: 코고로.angry
          delivery: shout
          text: "<speed=37>코치가 왜 경기장 안에 들어와!</speed>"
      - goto: table_tennis_finish

  table_tennis_referee:
    actions:
      - say:
          char: 코난.smile
          with:
            - 코고로.angry
          text: "<speed=27>알았어요. 이번엔 선만 볼게요.</speed>"
      - say:
          text: "<speed=24>열두 번이나 이어진 공이 탁구대 모서리를 스치고 바닥으로 떨어졌다.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=30>인. 란 누나 점수예요.</speed>"
      - say:
          char: 코고로.angry
          text: "<speed=30>너, 어느 쪽 심판이냐?</speed>"
      - goto: table_tennis_finish

  table_tennis_cheer:
    actions:
      - say:
          char: 코난.smile
          with:
            - 코고로.angry
          text: "<speed=30>아저씨, 힘내요! 이번엔 진짜 한 점!</speed>"
      - char:
          id: 코고로
          position: right
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=35>좋아, 꼬마! 잘 보고 있어라!</speed>"
      - say:
          text: "<speed=23>응원에 신이 난 코고로는 공보다 먼저 몸을 한 바퀴 돌렸다.</speed>"
      - goto: table_tennis_finish

  table_tennis_finish:
    actions:
      - say:
          text: "<speed=23>코고로가 힘껏 휘두른 공은 라켓 모서리를 맞고 천장으로 높이 솟았다.</speed>"
      - char:
          id: 란
          position: left
      - char:
          id: 코고로
          position: right
          emotion: shocked
      - say:
          char: 란
          with:
            - 코고로.shocked
          text: "<speed=32>두 판 연속 제 승리예요.</speed> <speed=24>삼세판 끝났네요?</speed>"
      - say:
          char: 코고로.shocked
          text: "<speed=27>오늘은 팔이 덜 풀렸어.</speed> <speed=23>내일 아침에 진짜 결승을...</speed>"
      - say:
          char: 란
          text: "<speed=28>녹음 중이에요.</speed> <speed=23>'딱 삼세판'부터 아주 선명하게 들어갔어요.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          text: "<speed=27>국제 규칙도 같이 들어갔어요.</speed>"
      - char:
          id: 코고로
          position: right
          emotion: angry
      - say:
          char: 코고로.angry
          delivery: shout
          text: "<speed=38>그 부분은 지워!</speed>"

  dinner_time:
    actions:
      - bg: dining_room
      - music: rain
      - sound: cup_clink
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          text: "<speed=24>저녁상이 들어오자 탁구 이야기는 잠시 멈췄다.</speed> <speed=22>창밖의 빗소리가 뜨거운 냄비 끓는 소리에 섞였다.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>코난, 이 버섯 먹어 봐.</speed> <speed=23>여기서 직접 키운 거래.</speed>"
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=28>맛있어!</speed> <speed=23>씹을수록 향이 진해져.</speed>"
      - char:
          id: 코고로
          position: center
          emotion: proud
      - say:
          char: 코고로.proud
          text: "<speed=32>산나물 튀김도 훌륭하군.</speed> <speed=25>이 정도면 탁구 패배쯤은 너그럽게 잊어 주지.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>아빠가 진 걸 왜 제가 잊어드려요?</speed>"
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=27>내일 비 그치면 세 명이서 산책하자.</speed> <speed=23>아까 본 강도 가까이서 보고 싶어.</speed>"
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=27>응.</speed> <speed=22>아침 일찍 일어나는 사람이 둘을 깨우는 거야.</speed>"
      - say:
          char: 코고로.proud
          delivery: shout
          text: "<speed=36>그건 사실상 나만 빼고 가겠다는 말이잖아!</speed>"
      - say:
          text: "<speed=23>란은 대답 대신 코고로 앞의 튀김 접시를 자기 쪽으로 한 뼘 끌어당겼다.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=34>알람 다섯 개 맞춰 놓겠다!</speed>"

  rain_window:
    actions:
      - bg: rain_corridor
      - music: rain
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
      - say:
          text: "<speed=23>식사를 마친 뒤, 란과 코난은 유리창을 타고 흐르는 빗물을 한동안 바라보았다.</speed>"
      - say:
          char: 란
          with:
            - 코난
          text: "<speed=25>신이치도 이런 데 오면 좋았을 텐데.</speed> <speed=22>연락은 또 안 되고.</speed>"
      - say:
          char: 코난
          with:
            - 란
          text: "<speed=26>분명 아쉬워할 거야.</speed> <speed=22>란 누나가 찍은 사진도 다 보고 싶어 할걸.</speed>"
      - say:
          char: 란
          with:
            - 코난
          text: "<speed=26>그래?</speed> <speed=22>그럼 탁구 점수 사진부터 보내야겠다.</speed>"
      - say:
          char: 코난
          text: "<speed=28>그건 아저씨가 말릴 것 같은데.</speed>"
      - say:
          char: 란
          text: "<speed=25>신이치는 꼭 중요한 순간에만 없단 말이야.</speed>"
      - say:
          char: 코난
          text: "<speed=25>그래도 약속은 기억하고 있을 거야.</speed>"
      - say:
          char: 란
          with:
            - 코난
          text: "<speed=25>무슨 약속?</speed>"
      - say:
          char: 코난
          text: "<speed=25>다음엔 같이 오겠다는 약속.</speed>"
      - say:
          char: 란
          text: "<speed=24>...그랬으면 좋겠다.</speed>"
      - sound: door
      - char:
          id: 코고로
          position: center
          emotion: angry
      - say:
          char: 코고로.angry
          text: "<speed=34>란! 보내기 전에 그 점수 사진부터 지워라!</speed>"
      - say:
          char: 란
          text: "<speed=29>싫어요. 국제 규칙의 역사적인 증거예요.</speed>"

  quiet_night:
    actions:
      - bg: guest_room
      - music: intro
      - char:
          id: 코고로
          position: left
          emotion: proud
      - char:
          id: 란
          position: right
      - say:
          text: "<speed=23>방으로 돌아오자 코고로는 이불 세 채를 펴 놓고 누구보다 먼저 가운데에 누웠다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>아빠, 가운데는 코난 자리예요.</speed>"
      - say:
          char: 코고로.proud
          with:
            - 란
          text: "<speed=27>나는 오늘 가장 많이 움직인 사람이다.</speed> <speed=23>허리 펴려면 가운데가 딱이야.</speed>"
      - char:
          id: 코난
          position: center
          emotion: smile
      - say:
          char: 코난.smile
          text: "<speed=27>그럼 가위바위보로 정해요.</speed>"
      - branch:
          cases:
            - when:
                var: souvenir_choice
                op: eq
                value: "paddle"
              goto: quiet_night_paddle
            - when:
                var: souvenir_choice
                op: eq
                value: "tea"
              goto: quiet_night_tea
          default: quiet_night_postcard

  quiet_night_paddle:
    actions:
      - say:
          text: "<speed=23>코고로가 베개를 당기자 아래에 숨겨 둔 작은 라켓 열쇠고리가 달그락거렸다.</speed>"
      - say:
          char: 란
          text: "<speed=28>그거 오늘 진 사람 가방에 다는 거였죠?</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=30>내일 결승 우승 상품으로 보관 중이다.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>삼세판은 끝났는데요.</speed>"
      - goto: quiet_night_finish

  quiet_night_tea:
    actions:
      - say:
          text: "<speed=23>테이블 위 향주머니에서 은은한 찻잎 냄새가 퍼졌다.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=29>이 냄새, 야식 차가 나온 건가?</speed>"
      - say:
          char: 란
          text: "<speed=28>향주머니예요. 맡는 걸로 참으세요.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>체중계도 좋아하겠네요.</speed>"
      - goto: quiet_night_finish

  quiet_night_postcard:
    actions:
      - say:
          text: "<speed=23>란은 산길 엽서 뒷면에 날짜와 세 사람의 이름을 천천히 적었다.</speed>"
      - say:
          char: 코난.smile
          text: "<speed=27>내일 사진 찍을 자리도 남겨 둬.</speed>"
      - say:
          char: 란
          text: "<speed=26>당연하지.</speed> <speed=22>이번엔 아빠도 눈 안 감은 걸로 찍을 거야.</speed>"
      - say:
          char: 코고로.proud
          text: "<speed=29>나는 사진발이 아니라 실물로 승부하는 남자다.</speed>"
      - goto: quiet_night_finish

  quiet_night_finish:
    actions:
      - say:
          text: "<speed=23>세 사람은 가운데 자리를 걸고 가위바위보를 했다.</speed> <speed=22>코고로는 혼자 보를 냈다.</speed>"
      - say:
          char: 란
          with:
            - 코고로.proud
          text: "<speed=28>국제 규칙이면 다시 해야 하나요?</speed>"
      - char:
          id: 코고로
          position: left
          emotion: angry
      - say:
          char: 코고로.angry
          delivery: shout
          text: "<speed=36>오늘은 국제 규칙 금지다!</speed>"
      - say:
          text: "<speed=23>웃음소리가 잦아들고 나서도 빗소리는 한참 창문을 두드렸다.</speed>"
      - char:
          id: 란
          position: left
      - char:
          id: 코난
          position: right
          emotion: smile
      - say:
          char: 란
          with:
            - 코난.smile
          text: "<speed=25>내일 비 그치면 꼭 산책 가자.</speed>"
      - say:
          char: 코난.smile
          with:
            - 란
          text: "<speed=27>응. 셋이서.</speed>"
