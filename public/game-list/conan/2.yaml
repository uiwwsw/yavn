script:
  - scene: meeting_start
  - scene: four_way_tension
  - scene: service_order
  - scene: incident_trigger
  - scene: death_confirm
  - scene: contradiction_hook
  - scene: chapter_handoff

scenes:
  meeting_start:
    actions:
      - bg: tea_room
      - music: tension
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 세이지
          position: center
          emotion: cold
      - char:
          id: 레이코
          position: right
          emotion: nervous
      - say:
          char: 레이코.nervous
          text: "<speed=26>아버지가 마지막으로 남긴 배합입니다.</speed> <speed=19>오늘 맛을 확정하면, 이 이름으로 세상에 내놓을 생각이었어요.</speed>"
      - say:
          char: 켄지.angry
          text: "<speed=42>이 이름?</speed> <speed=25>투자금은 내가 대고, 권리는 당신 집안이 전부 갖겠다고?</speed>"
      - say:
          char: 세이지.cold
          text: "<speed=26>목소리를 높여도 원본은 바뀌지 않습니다.</speed> <speed=19>서명 뒤에 제 봉인을 열죠.</speed> <speed=30>그때 필체와 수정 시각을 확인하면 됩니다.</speed>"
      - branch:
          cases:
            - when:
                var: tea_name_vote
                op: eq
                value: "people"
              goto: meeting_name_memory
          default: four_way_tension

  meeting_name_memory:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(어젯밤 하루오 씨는 누구 이름도 빼지 않겠다고 했어.</speed> <speed=27>그런데 계약서엔 한 사람 이름이 없어.)</speed>"
      - add:
          final_confidence: 1
      - goto: four_way_tension

  four_way_tension:
    actions:
      - char:
          id: 하루오
          position: right
          emotion: scared
      - char:
          id: 코난
          position: center
          emotion: think
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 하루오.scared
          with:
            - 코난.think
          text: "<speed=23>잔은 표대로 두겠습니다.</speed> <speed=19>켄지 씨 1번, 제가 2번, 레이코 씨 3번, 세이지 씨 4번.</speed> <speed=16>오늘은... 바꾸면 안 됩니다.</speed>"
      - say:
          char: 란.worried
          text: "<speed=28>하루오 씨, 손 데이셨어요?</speed> <speed=21>아까부터 왼손을 계속 감추시던데.</speed>"
      - say:
          char: 코난.think
          text: "<speed=19>(손이 떨려.</speed> <speed=17>2번 잔을 놓을 때만 레이코 씨를 봤어.)</speed>"

  service_order:
    actions:
      - sound: notebook_flip
      - char:
          id: 세이지
          position: center
          emotion: cold
      - char:
          id: 하루오
          position: right
          emotion: scared
      - say:
          char: 세이지.cold
          with:
            - 하루오.scared
          text: "<speed=25>9시 18분 작성.</speed> <speed=19>하루오 씨가 직접 고른 번호는 2번, 맞습니다.</speed>"
      - sound: cup_clink
      - say:
          char: 하루오.scared
          with:
            - 세이지.cold
          text: "<speed=21>예, 2번은 제 잔입니다.</speed> <speed=18>레이코 씨, 88도가 될 때까진 뚜껑에 손대지 마세요.</speed> <speed=16>그분의 방식이니까.</speed>"
      - say:
          text: "<speed=19>레이코는 대답 대신 주전자 뚜껑을 눌렀다.</speed> <speed=51>한 번.</speed> <speed=55>그리고 또 한 번.</speed>"
      - branch:
          cases:
            - when:
                var: remembered_tea_order
                op: eq
                value: true
              goto: service_order_memory
          default: incident_trigger

  service_order_memory:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(하루오 씨는 뚜껑을 그대로 두랬어.</speed> <speed=30>레이코 씨는 왜 두 번이나...)</speed>"
      - add:
          deduction_score: 1
      - goto: incident_trigger

  incident_trigger:
    actions:
      - wait: 220
      - music: tension
      - sound: scream
      - effect: flash
      - wait: 140
      - effect: darken
      - wait: 180
      - effect: shake
      - sound: thunder
      - char:
          id: 란
          position: left
          emotion: surprised
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 레이코
          position: right
          emotion: nervous
      - say:
          char: 란.surprised
          with:
            - 코난.serious
            - 레이코.nervous
          text: "<speed=67>꺄악!</speed> <speed=35>하루오 씨, 정신 차리세요!</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=19>차가 흘렀어요.</speed> <speed=16>제가 닦을게요, 손수건을...</speed>"
      - say:
          text: "<speed=18>레이코가 내민 손수건은 입가가 아니라, 먼저 2번 잔의 가장자리로 향했다.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=60>안 돼요!</speed> <speed=25>그 잔, 만지면 안 돼요!</speed>"

  death_confirm:
    actions:
      - bg: tea_room
      - music: mystery
      - sticker:
          id: tape_lock
          image: police_tape
          x: 50
          y: 52
          width: 92
          anchorX: center
          anchorY: center
          zIndex: 5
          enter:
            effect: wipeCenterX
      - char:
          id: 코고로
          position: right
          emotion: shocked
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: determined
      - say:
          text: "<speed=23>코고로가 하루오의 기도를 열고 맥을 짚었다.</speed> <speed=18>장난기 어린 얼굴이 순식간에 굳었다.</speed>"
      - clearSticker:
          id: tape_lock
          leave:
            effect: wipeRight
      - wait: 240
      - say:
          char: 코고로.shocked
          with:
            - 코난.serious
            - 란.determined
          text: "<speed=28>란, 119부터.</speed> <speed=23>연결이 안 되면 료칸 무전기를 찾아!</speed> <speed=37>나머지는 벽에서 떨어져. 아무것도 만지지 마!</speed>"
      - say:
          char: 란.determined
          with:
            - 코고로.shocked
          text: "<speed=30>네.</speed> <speed=23>무전기부터 확인할게요!</speed>"
      - sticker:
          id: dying_hint
          image: clue_lid
          x: 51
          y: 44
          width: 58
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          text: '<speed=23>(손끝은 컵받침.</speed> <speed=18>2 다음에...)</speed> <speed=46>"R"?</speed>'
      - clearSticker:
          id: dying_hint
          leave:
            effect: fadeOut
      - wait: 240
      - say:
          char: 코난.think
          text: "<speed=17>(R의 번짐만 반대야.</speed> <speed=30>누가 건드렸어.)</speed>"
      - add:
          deduction_score: 1

  contradiction_hook:
    actions:
      - bg: case_board
      - music: reasoning
      - effect: zoom
      - say:
          char: 코난.serious
          text: "<speed=18>(같은 주전자에서 따른 차인데 하루오 씨만 쓰러졌어.</speed> <speed=27>독은 잔에 있었어.)</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(뚜껑 소리로 모두의 시선을 돌렸어.)</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(쓰러진 뒤엔 R을 지웠고.</speed> <speed=27>비어 있는 건 9시 29분의 1분.)</speed>"

  chapter_handoff:
    actions:
      - effect: pulse
      - say:
          char: 코난
          text: "<speed=23>(란 누나가 본 시계부터 확인하자.)</speed>"
