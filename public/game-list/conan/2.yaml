script:
  - scene: meeting_start
  - scene: four_way_tension
  - scene: service_order
  - scene: incident_trigger
  - scene: death_confirm
  - scene: contradiction_hook
  - scene: chapter_handoff

scenes:
  meeting_start:
    actions:
      - bg: tea_room
      - music: tension
      - char:
          id: 켄지
          position: left
          emotion: angry
      - char:
          id: 세이지
          position: center
          emotion: cold
      - char:
          id: 레이코
          position: right
          emotion: nervous
      - say:
          char: 레이코.nervous
          text: "<speed=26>아버지가 시작한 배합입니다.</speed> <speed=19>오늘 맛과 이름을 확정하고, 네 사람이 지켜 온 차로 세상에 내놓으려 했어요.</speed>"
      - say:
          char: 켄지.angry
          text: "<speed=42>‘네 사람’이라고?</speed> <speed=25>내 계약서에는 내 이름이 빠지고 권리는 당신 집안으로 넘어가. 웃으며 차 마실 일이 아니야.</speed>"
      - say:
          char: 세이지.cold
          text: "<speed=26>누가 크게 말했는지는 적지 않겠습니다.</speed> <speed=19>서명이 끝나면 제 봉인을 열고, 원본의 필체와 수정 시각만 보죠.</speed>"
      - branch:
          cases:
            - when:
                var: tea_name_vote
                op: eq
                value: "people"
              goto: meeting_name_memory
          default: four_way_tension

  meeting_name_memory:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(하루오 씨는 이름을 빼지 않겠댔어.</speed> <speed=27>그런데 셋은 서로 다른 이름이 지워졌다고 믿어.)</speed>"
      - add:
          final_confidence: 1
      - goto: four_way_tension

  four_way_tension:
    actions:
      - char:
          id: 하루오
          position: right
          emotion: scared
      - char:
          id: 코난
          position: center
          emotion: think
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 하루오.scared
          with:
            - 코난.think
          text: "<speed=23>잔은 제가 고른 표대로 두겠습니다.</speed> <speed=19>켄지 씨 1번, 제가 2번, 레이코 씨 3번, 세이지 씨 4번.</speed> <speed=16>오늘만큼은 누구도 자리를 바꾸지 마십시오.</speed>"
      - say:
          char: 란.worried
          text: "<speed=28>하루오 씨, 왼손 다치셨어요?</speed> <speed=21>2번 잔을 놓을 때부터 계속 소매 안에 감추고 계세요.</speed>"
      - say:
          char: 코난.think
          text: "<speed=19>(통증 때문만은 아니야.</speed> <speed=17>2번 잔을 놓을 때만 레이코 씨 표정을 확인했어.)</speed>"

  service_order:
    actions:
      - sound: notebook_flip
      - char:
          id: 세이지
          position: center
          emotion: cold
      - char:
          id: 하루오
          position: right
          emotion: scared
      - say:
          char: 세이지.cold
          with:
            - 하루오.scared
          text: "<speed=25>9시 18분 작성.</speed> <speed=19>하루오 씨가 직접 ‘2번’을 말했고, 아래 장 압흔도 같습니다.</speed>"
      - sound: cup_clink
      - say:
          char: 하루오.scared
          with:
            - 세이지.cold
          text: "<speed=21>예, 2번은 제 잔입니다.</speed> <speed=18>레이코 씨, 88도가 될 때까진 뚜껑에 손대지 마세요.</speed> <speed=16>아버님이 남긴 순서를 오늘 우리가 먼저 깨면 안 됩니다.</speed>"
      - say:
          text: "<speed=19>레이코는 하루오를 바라본 채 주전자 뚜껑을 눌렀다.</speed> <speed=51>한 번.</speed> <speed=55>모두가 고개를 들었을 때, 다시 한 번.</speed>"
      - branch:
          cases:
            - when:
                var: remembered_tea_order
                op: eq
                value: true
              goto: service_order_memory
          default: incident_trigger

  service_order_memory:
    actions:
      - char:
          id: 코난
          position: center
          emotion: think
      - say:
          char: 코난.think
          text: "<speed=18>(향을 위한 동작이 아니야.</speed> <speed=30>첫 소리는 하루오, 둘째 소리는 모두의 눈을 움직였어.)</speed>"
      - add:
          deduction_score: 1
      - goto: incident_trigger

  incident_trigger:
    actions:
      - wait: 220
      - music: tension
      - sound: scream
      - effect: flash
      - wait: 140
      - effect: darken
      - wait: 180
      - effect: shake
      - sound: thunder
      - char:
          id: 란
          position: left
          emotion: surprised
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 레이코
          position: right
          emotion: nervous
      - say:
          char: 란.surprised
          with:
            - 코난.serious
            - 레이코.nervous
          text: "<speed=67>하루오 씨!</speed> <speed=35>제 목소리 들려요? 코난, 아빠 불러!</speed>"
      - say:
          char: 레이코.nervous
          with:
            - 코난.serious
          text: "<speed=19>잔이 쓰러져요.</speed> <speed=16>증거가 아니라 뜨거운 차예요. 수건부터 가져올게요...</speed>"
      - say:
          text: "<speed=18>천둥에 등불이 꺼졌다 켜졌다.</speed> <speed=16>하루오를 붙잡는 손들이 탁자 위로 겹친 그 짧은 어둠 속에서, 흰 천 한 자락이 2번 잔과 컵받침 사이를 지나갔다.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=60>손 떼요!</speed> <speed=25>하루오 씨가 끝까지 잡은 잔이에요. 아무도 닦으면 안 돼요!</speed>"

  death_confirm:
    actions:
      - bg: tea_room
      - music: mystery
      - sticker:
          id: tape_lock
          image: police_tape
          x: 50
          y: 52
          width: 92
          anchorX: center
          anchorY: center
          zIndex: 5
          enter:
            effect: wipeCenterX
      - char:
          id: 코고로
          position: right
          emotion: shocked
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: determined
      - say:
          text: "<speed=23>코고로가 하루오의 기도를 열고 맥을 짚었다.</speed> <speed=18>온천과 내기만 말하던 얼굴에서 웃음이 지워졌다.</speed>"
      - clearSticker:
          id: tape_lock
          leave:
            effect: wipeRight
      - wait: 240
      - say:
          char: 코고로.shocked
          with:
            - 코난.serious
            - 란.determined
          text: "<speed=28>란, 119부터.</speed> <speed=23>끊기면 무전기, 직원에게 심장충격기도 물어!</speed> <speed=37>나머지는 벽으로 물러서. 잔도 종이도 손대지 마!</speed>"
      - say:
          char: 란.determined
          with:
            - 코고로.shocked
          text: "<speed=30>네.</speed> <speed=23>연결될 때까지 두 쪽 다 확인할게요!</speed>"
      - sticker:
          id: dying_hint
          image: clue_lid
          x: 51
          y: 44
          width: 58
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          text: '<speed=23>하루오의 손끝이 젖은 컵받침을 긁었다.</speed> <speed=18>먼저 2. 그 아래 한 획이 더 이어졌다.</speed> <speed=46>"R"...</speed>'
      - clearSticker:
          id: dying_hint
          leave:
            effect: fadeOut
      - wait: 240
      - say:
          char: 코난.think
          text: "<speed=17>(2는 손끝 방향 그대로.</speed> <speed=30>R의 꼬리만 반대로 번졌어. 뒤에 닿은 손이 있어.)</speed>"
      - add:
          deduction_score: 1

  contradiction_hook:
    actions:
      - bg: case_board
      - music: reasoning
      - effect: zoom
      - say:
          char: 코난.serious
          text: "<speed=18>(같은 주전자, 네 잔.</speed> <speed=27>하루오 씨만 쓰러졌다면 차보다 2번 잔을 봐야 해.)</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(두 번의 소리. 두 번째엔 아무도 2번 잔을 보지 않았어.)</speed>"
      - say:
          char: 코난.think
          text: "<speed=18>(쓰러진 뒤에는 R까지 지우려 했어.</speed> <speed=27>범행 전과 후, 같은 손이 두 번 움직였어.)</speed>"

  chapter_handoff:
    actions:
      - effect: pulse
      - say:
          char: 코난
          text: "<speed=23>(란 누나가 본 시각부터 고정하자. 그러면 첫 번째 손이 움직인 틈이 보여.)</speed>"
