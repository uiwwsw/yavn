script:
  - scene: first_scan
  - scene: residue_focus
  - scene: residue_claim_correct
  - scene: residue_claim_wrong
  - scene: timeline_gate
  - scene: timeline_input_gate
  - scene: reconstruction_choice
  - scene: reconstruction_claim_correct
  - scene: reconstruction_claim_wrong
  - scene: deduction_branch
  - scene: stable_frame
  - scene: shaky_frame
  - scene: lounge_handoff

scenes:
  first_scan:
    actions:
      - bg: tea_room
      - music: reasoning
      - char:
          id: 코난
          position: center
          emotion: serious
      - char:
          id: 란
          position: left
          emotion: worried
      - say:
          char: 코난.serious
          text: "<speed=36>하루오 씨만 쓰러졌어.</speed> <speed=28>공통 주전자가 아니라 2번 잔에만 뭔가 있었던 거야.</speed>"
      - say:
          char: 란.worried
          text: '<speed=30>그럼 "2R"은...</speed> <speed=24>하루오 씨가 범인을 알려 주려던 걸까?</speed>'

  residue_focus:
    actions:
      - effect: zoom
      - sticker:
          id: rim_focus
          image: clue_cup
          x: 50
          y: 40
          width: 62
          anchorX: center
          anchorY: center
          enter:
            effect: blurIn
      - say:
          char: 코난.think
          text: "<speed=22>(메시지에는 다른 손이 닿았어.)</speed> <speed=50>그렇다면 먼저 믿을 수 있는 건...</speed>"
      - choice:
          key: residue_focus_choice
          prompt: "첫 단서를 어디서 잡을까?"
          options:
            - text: "2번 잔의 안쪽과 가장자리를 비교한다"
              set:
                clue_rim_reagent: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: residue_claim_correct
            - text: "\"2R\"의 글씨 모양부터 해석한다"
              add:
                mistake_count: 1
                trust: -1
              goto: residue_claim_wrong
            - text: "주전자 뚜껑에 독이 있었다고 본다"
              add:
                mistake_count: 1
              goto: residue_claim_wrong

  residue_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=28>역시...</speed> <speed=24>잔 안쪽은 깨끗한데 입이 닿는 가장자리에서만 시약 색이 변했어.</speed>"
      - choice:
          key: residue_commit_choice
          prompt: "이 반응을 사건의 기준으로 삼을까?"
          options:
            - text: "가장자리에서 옮겨진 물질로 본다"
              goto: timeline_gate
            - text: "아직 단정하지 않는다"
              add:
                final_confidence: -1
              goto: timeline_gate

  residue_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>글씨는 이미 누군가 건드렸어.</speed> <speed=52>지금 믿으면 범인이 보여 주고 싶은 쪽으로 끌려가.</speed>"
      - choice:
          key: residue_rebuttal_choice
          prompt: "다시 현장을 볼까?"
          options:
            - text: "잔의 반응부터 다시 확인한다"
              goto: timeline_gate
            - text: "메시지 해석을 우선한다"
              add:
                trust: -1
              goto: timeline_gate

  timeline_gate:
    actions:
      - clearSticker:
          id: rim_focus
          leave:
            effect: fadeOut
      - goto: timeline_input_gate

  timeline_input_gate:
    actions:
      - say:
          char: 코난.think
          text: "<speed=28>란 누나, 비명 직전에 복도 시계를 봤지?</speed> <speed=22>그 시각이 모두의 진술을 맞출 기준이 돼.</speed>"
      - input:
          prompt: "복도 시계가 가리킨 시각은? (24시간 형식)"
          correct: "21:30"
          saveAs: timeline_answer
          errors:
            - "시계 바늘을 떠올려. 긴 바늘은 6을 가리켰어."
            - "힌트: 밤 9시 30분."
            - "복도 시계가 가리킨 시각은 21:30이었다."
          routes:
            - equals: "21:30"
              add:
                deduction_score: 2
                trust: 1
              goto: reconstruction_choice
            - equals: "21:20"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_choice
            - equals: "22:00"
              add:
                mistake_count: 1
              goto: reconstruction_choice

  reconstruction_choice:
    actions:
      - bg: case_board
      - char:
          id: 코난
          position: left
          emotion: serious
      - effect: focus
      - say:
          char: 코난.serious
          text: "<speed=30>레이코가 뚜껑을 두 번 누른 순간, 방 안의 모두가 같은 곳을 봤어.</speed>"
      - choice:
          key: reconstruction_choice
          prompt: "그 동작으로 범인이 얻은 것은?"
          options:
            - text: "주전자 안에 독을 넣을 기회"
              add:
                mistake_count: 1
              goto: reconstruction_claim_wrong
            - text: "2번 잔에서 시선을 떼게 할 짧은 틈"
              set:
                clue_double_press_decoy: true
              add:
                deduction_score: 2
                final_confidence: 1
              goto: reconstruction_claim_correct
            - text: "향을 고르게 퍼뜨리려는 평범한 습관"
              add:
                mistake_count: 1
                trust: -1
              goto: reconstruction_claim_wrong

  reconstruction_claim_correct:
    actions:
      - say:
          char: 코난.serious
          text: "<speed=32>그래.</speed> <speed=24>뚜껑은 독을 넣는 도구가 아니라, 2번 잔에 닿는 손을 감추는 연막이었어.</speed>"
      - choice:
          key: reconstruction_commit_choice
          prompt: "당시 장면을 이렇게 재구성할까?"
          options:
            - text: "모두의 시선이 뚜껑에 쏠렸다"
              goto: deduction_branch
            - text: "아직 다른 가능성을 남긴다"
              add:
                final_confidence: -1
              goto: deduction_branch

  reconstruction_claim_wrong:
    actions:
      - say:
          char: 코난.think
          text: "<speed=24>주전자 안에서는 아무 반응도 나오지 않았어.</speed> <speed=52>그 동작만으로는 하루오 씨만 쓰러진 이유를 설명할 수 없어.</speed>"
      - choice:
          key: reconstruction_rebuttal_choice
          prompt: "재구성을 바로잡을까?"
          options:
            - text: "2번 잔으로 시선을 돌린다"
              goto: deduction_branch
            - text: "주전자 가설을 유지한다"
              add:
                trust: -1
              goto: deduction_branch

  deduction_branch:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: deduction_score
                    op: gte
                    value: 4
                  - var: trust
                    op: gte
                    value: 0
                  - var: clue_double_press_decoy
                    op: eq
                    value: true
              goto: stable_frame
          default: shaky_frame

  stable_frame:
    actions:
      - effect: zoom
      - say:
          text: "<speed=28>잔 배정, 비명 시각, 모두의 시선이 쏠린 순간.</speed> <speed=50>세 조각이 하나로 이어졌다.</speed>"
      - say:
          char: 코난.serious
          text: "<speed=34>이제 잔이 아니라 사람을 볼 차례야.</speed> <speed=26>누가 그 짧은 틈을 알고 있었는지.</speed>"
      - add:
          final_confidence: 1
      - goto: lounge_handoff

  shaky_frame:
    actions:
      - effect: tilt
      - say:
          char: 코난.think
          text: "<speed=22>(아직 장면이 선명하지 않아.)</speed> <speed=50>그 방에 있던 사람들의 말부터 다시 맞춰 보자.</speed>"
      - add:
          mistake_count: 1
      - goto: lounge_handoff

  lounge_handoff:
    actions:
      - bg: case_board
      - char:
          id: 코난
          position: left
          emotion: think
      - effect: focus
      - say:
          char: 코난.think
          text: "<speed=38>같은 30초를 네 사람은 어떻게 기억하고 있을까.</speed>"
      - goto: /routes/hub/1.yaml
