chapterTitle: "셔터"

script:
  - scene: prologue
  - scene: studio

scenes:
  prologue:
    title: "시술실"
    pov: "???"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - say: { channel: card, with: [], text: "2016년 3월 29일 · 비", autoAdvance: 1500 }
      - say: { char: 의사, with: [], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요.", continueLabel: "동의서에 서명한다" }
      - sound: consent_pen
      - say: { channel: action, with: [], text: "펜을 쥔 손이 떨린다. 동의서 신청인 칸에 이름을 쓴다." }
      - bg: { id: consent_turn, transition: cut }
      - say: { channel: action, with: [], text: "“가방에 휴대폰이 있어요. 사진 한 장 남겨 놨는데, 그건 버리지 말아 주세요.”" }
      - say: { char: 의사, with: [], text: "네. 이제 눈 감으세요." }
      - say: { channel: action, with: [], text: "눈을 감기 전에 창 아래를 본다. 1층 유리문 앞에 우산 없이 서 있는 사람이 있다." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 520 }
      - music: null
      - say: { channel: card, with: [], text: "11년 뒤 · 결혼 D-29", autoAdvance: 1500 }
      - goto: studio

  studio:
    title: "셔터"
    actions:
      - bg: { id: photo_studio, transition: cut }
      - music: studio
      - place: "4월 2일 금요일 · 사진관"
      - char: { id: 지수, position: left }
      - char: { id: 서윤, position: right }
      - say: { char: 지수, with: [서윤], text: "실장님 아니세요?" }
      - char: { id: 어른아진, position: center }
      - say: { char: 어른아진, with: [지수, 서윤], text: "실장님 장염이세요. 정아진입니다." }
      - say: { char: 어른아진, with: [지수, 서윤], text: "오늘은 제가 찍어요." }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "인사가 끝나기도 전에 아진은 조명 높이부터 바꾼다." }
      - say: { char: 어른아진, with: [지수, 서윤], text: "신부님, 어깨 힘 빼시고요. 신랑님 보세요." }
      - say: { char: 지수, with: [서윤, 어른아진], text: "작가님 말고 나 봐." }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "지수가 서윤의 앞머리를 손끝으로 넘겨 준다. 서윤은 지수를 보다가 웃는다." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "웃으면 눈이 없어지는 얼굴이다. 이어지던 셔터 소리가 거기서 멈춘다." }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "아진은 카메라를 내리고 서윤을 한참 본다." }
      - say: { char: 지수, with: [서윤, 어른아진], text: "작가님?" }
      - say: { char: 어른아진.awkward, with: [지수, 서윤], text: "아, 죄송해요. 아는 사람이랑 웃는 게 닮아서요." }
      - say: { char: 어른아진, with: [지수, 서윤], text: "다시 갈게요." }
      - say: { char: 지수.warm, with: [서윤, 어른아진], text: "얘 웃으면 눈 없어지죠. 저 이거 보고 결혼해요." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "모니터에 오늘 찍은 컷이 줄지어 뜬다. 그중 하나에서 서윤은 눈을 아예 감은 채 웃고 있다." }
      - sticker:
          id: s0_cut
          image: closed_eye_cut_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 서윤, with: [지수, 어른아진], text: "이건 지워 주세요." }
      - say: { char: 지수, with: [서윤, 어른아진], text: "그것도 주세요. 저는 이게 제일 좋아요." }
      - say: { char: 지수.warm, with: [서윤, 어른아진], text: "청첩장은 이걸로 할게요." }
      - get: invitation
      - clearSticker: { id: s0_cut, leave: fadeOut }
      - say: { channel: action, with: [지수, 서윤, 어른아진], text: "아진은 그 컷을 오래 보고 있다." }
      - move: { id: 지수, style: exit }
      - say: { channel: action, with: [서윤, 어른아진], text: "지수가 화장실에 간 사이 아진이 계약서를 내민다. 원본 전달일, 앨범 매수, 보정 범위가 적힌 종이다." }
      - say: { channel: action, with: [서윤, 어른아진], text: "서윤이 이름을 쓰고 끝에 작은 점을 찍는다." }
      - sound: consent_pen
      - say: { channel: action, with: [서윤, 어른아진], text: "아진의 손이 계약서 위에서 멈춘다." }
      - music: null
      - wait: 900
      - say: { char: 어른아진, with: [서윤], text: "……하린아.", wait: 1800, unskippable: true, delivery: "whisper" }
      - say: { char: 서윤, with: [어른아진], text: "네?" }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진이 제 입을 막듯 손등을 댄다. 다른 손은 카메라 끈을 감고 있다." }
      - say: { char: 어른아진.awkward, with: [서윤], text: "죄송해요. 아는 사람이랑 이름 쓰는 게 똑같아서." }
      - say: { char: 서윤, with: [어른아진], text: "아니에요. 괜찮아요." }
      - say: { char: 어른아진, with: [서윤], text: "실례인 줄 아는데요." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진이 끈을 한 번 더 감는다." }
      - say: { char: 어른아진, with: [서윤], text: "혹시 고등학교 어디 나오셨어요?" }
      - choice:
          key: e1_school
          prompt: "아진이 카메라 끈을 쥔 채 기다린다."
          options:
            - text: "사실대로 말한다"
              set: { gap_told: true }
              goto: e1_school_true
            - text: "그 사람이 아니라고 한다"
              goto: e1_school_no

  e1_school_true:
    actions:
      - say: { char: 서윤, with: [어른아진], text: "검정고시요. 열여덟 전 일은 잘 기억이 안 나요." }
      - say: { char: 서윤, with: [어른아진], text: "사고가 있었대요." }
      - say: { char: 어른아진.awkward, with: [서윤], text: "……사고요." }
      - say: { char: 서윤, with: [어른아진], text: "죄송해요." }
      - say: { char: 어른아진, with: [서윤], text: "아니에요. 그게, 다행인지도 모르겠어요." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진은 계약서를 집어 클립에 끼운다." }
      - say: { char: 어른아진, with: [서윤], text: "원본은 다음 주 목요일까지 보내 드릴게요." }
      - goto: e1_home

  e1_school_no:
    actions:
      - say: { char: 서윤, with: [어른아진], text: "저는 하린이라는 사람이 아니에요. 잘못 보신 것 같아요." }
      - say: { char: 어른아진.awkward, with: [서윤], text: "네. 그렇겠죠." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진은 계약서를 집어 클립에 끼운다." }
      - say: { char: 어른아진, with: [서윤], text: "원본은 다음 주 목요일까지 보내 드릴게요." }
      - goto: e1_home

  e1_home:
    title: "하객 명단"
    actions:
      - move: { id: 어른아진, style: exit }
      - bg: { id: couple_home, transition: fade, duration: 600 }
      - place: "그날 밤 · 서윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [서윤, 지수], text: "지수가 식탁에 하객 명단과 좌석 배치표를 펼친다. 종이는 모서리부터 손바닥으로 누른다." }
      - say: { char: 지수, with: [서윤], text: "네 쪽은 열두 명. 다 회사 사람이네." }
      - say: { char: 서윤, with: [지수], text: "응." }
      - say: { char: 지수, with: [서윤], text: "혼주석은 어떻게 할까. 어머님 사진 올려 둘까?" }
      - say: { channel: narration, with: [], text: "엄마는 사 년 전 겨울에 돌아가셨다. 사고 얘기는 엄마한테 들은 게 전부다." }
      - say: { channel: narration, with: [], text: "엄마는 그 얘기만 나오면 텔레비전 소리를 키웠다." }
      - say: { char: 서윤, with: [지수], text: "그냥 비워 둬." }
      - say: { char: 지수, with: [서윤], text: "비워 두는 거 싫은데." }
      - say: { channel: action, with: [서윤, 지수], text: "지수가 볼펜 뚜껑을 문다." }
      - say: { char: 지수, with: [서윤], text: "열여덟 전 친구는 진짜 한 명도 없어?" }
      - say: { char: 서윤, with: [지수], text: "사고 났었잖아." }
      - say: { char: 지수, with: [서윤], text: "알아. 그래도 사진 한 장쯤은 있을 줄 알았어." }
      - sticker:
          id: s0_child
          image: gallery_photo_sticker
          x: 50
          y: 42
          width: "clamp(180px, 30%, 330px)"
          enter: fadeIn
      - say: { channel: action, with: [서윤, 지수], text: "서윤의 사진첩은 2016년 3월에서 시작한다. 그 아래에 날짜 정보가 없는 사진이 한 장 있다." }
      - say: { channel: action, with: [서윤, 지수], text: "미끄럼틀 꼭대기에서 일곱 살쯤 된 여자아이가 한 손을 흔들고 있다." }
      - say: { char: 지수.warm, with: [서윤], text: "이게 너야? 손 흔드는 것 좀 봐." }
      - say: { char: 서윤, with: [지수], text: "그런가 봐. 엄마한테 물어볼걸 그랬네." }
      - say: { channel: action, with: [서윤, 지수], text: "지수는 대답 대신 명단 맨 위 빈칸을 볼펜 끝으로 두드린다." }
      - say: { char: 지수.warm, with: [서윤], text: "그럼 이 애가 네 쪽 하객 1번이다." }
      - get: child_photo
      - clearSticker: { id: s0_child, leave: fadeOut }
      - move: { id: 지수, style: exit }
      - place: "밤 11시"
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "늦게 죄송해요. 정아진입니다."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "오늘 일은 다시 사과드려요. 원본은 말씀드린 대로 다음 주에 갑니다."
      - say:
          channel: message
          thread: 사진관
          side: me
          char: 서윤
          with: []
          text: "네."
      - say: { channel: action, with: [서윤], text: "서윤은 그 번호를 '사진관'으로 저장한다." }
      - goto: e1_lunch

  e1_lunch:
    title: "열한 해 전"
    pov: "유하린"
    actions:
      - say: { channel: card, with: [], text: "열한 해 전 · 3월 10일", autoAdvance: 1500 }
      - bg: { id: classroom, transition: cut }
      - music: neon
      - place: "점심시간 · 3학년 2반"
      - char: { id: 하린, position: left }
      - char: { id: 아진, position: center }
      - char: { id: 민재, position: right }
      - say: { char: 하린, with: [아진, 민재], text: "4교시에 체육 넣은 사람 누구야. 오늘 돈까스란 말이야." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "하린은 급식표를 찍어 두는 버릇이 있다. 돈까스 나오는 날을 세려고." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "점심은 책상을 붙여 먹는다. 아진은 배식 줄에 서기 전에 옆 의자에 가방부터 올려 둔다." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "옆 분단 애가 그 의자를 끌어가려 하자 아진이 가방을 툭 친다." }
      - say: { char: 아진, with: [하린, 민재], text: "사람 있어." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "하린이 식판을 들고 오자 아진이 가방을 무릎으로 내린다." }
      - say: { char: 아진, with: [하린, 민재], text: "너 오늘 것도 찍었지." }
      - say: { char: 하린, with: [아진, 민재], text: "찍었지. 다음에 두 개 받으면 하나 남겨 줘." }
      - say: { char: 민재, with: [아진], text: "어제 보낸 노래 들었어?" }
      - say: { char: 하린, with: [아진, 민재], text: "나도 보내 줘." }
      - say: { char: 민재, with: [하린, 아진], text: "너 이런 거 안 듣잖아." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "아진이 이어폰 한쪽을 빼서 내민다." }
      - say: { char: 하린, with: [아진, 민재], text: "됐어, 둘이 들어." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "하린이 웃는다. 눈이 없어지는 그 웃음을 아진이 휴대폰으로 찍는다." }
      - sound: shutter
      - say: { char: 아진, with: [하린, 민재], text: "웃지 마. 눈 없어져." }
      - say: { char: 하린, with: [아진, 민재], text: "찍지 마, 지워." }
      - say: { char: 아진, with: [하린, 민재], text: "안 지워." }
      - goto: /1.yaml
