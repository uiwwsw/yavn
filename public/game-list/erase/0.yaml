chapterTitle: "완성"

script:
  - scene: operating_room
  - scene: studio

scenes:
  operating_room:
    title: "수술실"
    actions:
      - bg: { id: surgery, transition: fade, duration: 1200 }
      - music: cold_room
      - say:
          channel: narration
          with: []
          camera: wide
          text: "수술대 위에 누군가 누워 있다. 시트가 얼굴까지 덮여 있고, 손목에 감긴 이름표는 뒤집혀 있다."
      - say:
          char: 의사
          with: []
          text: "숨 한 번 크게 쉬세요. 네. 잘하셨어요."
      - say:
          char: 의사
          with: []
          text: "숫자 세실 필요 없어요. 그냥 계시면 돼요."
      - say:
          char: 의사
          with: []
          text: "눈 뜨면… 새로 시작해요."
      - say:
          channel: card
          with: []
          text: "ERASE"
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29"

  studio:
    title: "청첩장 사진"
    actions:
      - bg: { id: photo_studio, transition: cut }
      - music: neon
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "그래서 식대가 일 인당 육만 팔천이고, 보증 인원이 이백이래. 이백 못 채우면 남는 자리 값은 그냥 내는 거고."
      - say:
          char: 도윤.smile
          with: [지수]
          text: "우리 쪽은 백 명 무조건 와. 우리 엄마 계모임만 해도—"
      - say:
          char: 지수
          with: [도윤]
          text: "어머님 계모임, 작년 칠순 때도 오십 명이라 그러셨는데 열두 분 오셨어."
      - say:
          char: 도윤
          with: [지수]
          text: "…그날은 비 왔잖아."
      - say:
          channel: action
          with: [지수, 도윤]
          text: "작가가 렌즈 너머에서 신랑님 턱 조금만, 하고 손짓한다. 도윤은 턱을 너무 많이 내린다."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "아니 그렇게 말고. 이리 와 봐. 넥타이도 돌아갔어."
      - say:
          channel: action
          with: [지수, 도윤]
          text: "지수가 매듭을 풀었다가 다시 맨다. 작가가 기다리는 동안 두 번 더 고친다."
      - say:
          char: 지수
          with: [도윤]
          text: "계약금 오늘까지야. 내가 넣을게. 넌 영수증만 보관해. 지난번처럼 알림 꺼 놓고 까먹지 말고."
      - say:
          char: 도윤
          with: [지수]
          text: "안 까먹어."
      - say:
          char: 지수
          with: [도윤]
          text: "그리고."
      - say:
          char: 지수
          with: [도윤]
          text: "우리 엄마 아빠처럼 사는 거 싫어. 밤에 서로 폰 몰래 보고, 다음 날 아무 일 없는 척 밥 먹고. 그런 거."
      - say:
          char: 지수
          with: [도윤]
          text: "뭐 있으면 지금 말해. 지금은 화 안 낼게. 나중엔 내."
      - choice:
          key: e0_studio
          prompt: "작가가 셔터에 손가락을 올리고 기다린다."
          char: 지수
          options:
            - text: "렌즈를 보면서 \"없어. 진짜 없어.\""
              goto: e0_studio_smile
            - text: "\"…카드값 좀 밀린 거?\""
              goto: e0_studio_joke
            - text: "대답 대신 지수 머리카락을 귀 뒤로 넘겨 준다"
              goto: e0_studio_avoid

  e0_studio_smile:
    actions:
      - say:
          char: 도윤.smile
          with: [지수]
          text: "없어. 진짜 없어."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "녹음해 둘걸."
      - goto: e0_flash

  e0_studio_joke:
    actions:
      - say:
          char: 도윤.smile
          with: [지수]
          text: "카드값? 이번 달 좀 밀렸는데."
      - say:
          char: 지수
          with: [도윤]
          text: "얼마."
      - say:
          char: 도윤
          with: [지수]
          text: "…사십?"
      - say:
          char: 지수.cold
          with: [도윤]
          text: "그런 걸 말하라는 거야. 웃기려고 하지 말고."
      - goto: e0_flash

  e0_studio_avoid:
    actions:
      - say:
          channel: action
          with: [지수, 도윤]
          text: "도윤이 지수 귀 뒤로 머리카락을 넘겨 준다. 작가가 오, 좋아요 그거, 하며 연달아 셔터를 누른다."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "뭐야. 대답을 해야지."
      - say:
          char: 도윤.smile
          with: [지수]
          text: "했잖아, 방금."
      - goto: e0_flash

  e0_flash:
    actions:
      - effect: { name: flash, wait: true }
      - sticker:
          id: e0_invite
          image: invitation_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: narration
          with: []
          text: "모니터에 방금 찍힌 컷이 뜬다. 작가가 이거 그대로 시안 들어가도 되겠다고 하자, 지수가 처음으로 크게 웃는다. 식까지는 한 달이 남았다."
      - get: invitation
      - clearSticker: { id: e0_invite, leave: fadeOut }
      - goto: e0_club

  e0_club:
    title: "클럽"
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이 생일ㅋㅋ 한잔만 하고 감 12시 전에 들어갈게"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅋ 대리 불러 운전 절대 xx"
      - bg: { id: club, transition: cut }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "열두 시 사십 분. 민석이는 화장실에 간 지 이십 분째고, 도윤은 테이블에 혼자 남아 지수의 마지막 메시지를 다시 연다."
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "라이터 있어요?"
      - say:
          char: 도윤
          with: [준성]
          text: "네?"
      - say:
          char: 준성
          with: [도윤]
          delivery: shout
          text: "라이터요!"
      - say:
          char: 도윤
          with: [준성]
          delivery: shout
          text: "안 피워요!"
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "나도요. 그냥 말 걸어 본 거예요."
      - say:
          char: 도윤.smile
          with: [준성]
          text: "…아, 네."
      - say:
          char: 준성
          with: [도윤]
          text: "아까부터 폰만 보던데. 누가 답장 안 해요?"
      - say:
          char: 도윤
          with: [준성]
          text: "아뇨, 했어요. 대리 부르래요."
      - say:
          char: 준성
          with: [도윤]
          text: "착하네. 누가요?"
      - say:
          char: 도윤
          with: [준성]
          text: "…다음 달에 결혼해요."
      - say:
          char: 준성
          with: [도윤]
          text: "와. 축하해요. 그럼 축하주는 내가 살게요. 모르는 사람이 사는 게 제일 부담 없잖아요."
      - choice:
          key: e0_junseong
          prompt: "준성이 잔 두 개를 들고 서 있다. 하나는 이미 도윤 쪽으로 기울어 있다."
          char: 준성
          options:
            - text: "잔을 받는다. \"한 잔만이요.\""
              goto: e0_night
            - text: "폰 화면을 흔들어 보인다. \"저 대리 불러 놨어요.\""
              goto: e0_night_hesitate

  e0_night_hesitate:
    actions:
      - say:
          char: 도윤.smile
          with: [준성]
          text: "저 진짜 가야 돼요. 대리 불러 놨어요."
      - say:
          char: 준성
          with: [도윤]
          text: "금요일 이 시간에요? 이십 분은 걸릴걸요."
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "이십 분 동안 그냥 서 있게요?"
      - say:
          channel: action
          with: [준성]
          text: "도윤은 대리 앱을 내렸다가, 잠깐 뒤에 호출 취소를 누른다."
      - goto: e0_night

  e0_night:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "좀 늦을듯 먼저 자"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅇ 물 마시고 자"
      - effect: { name: darken, wait: true }
      - goto: e0_dawn

  e0_dawn:
    title: "새벽"
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 1600 }
      - music: static
      - say:
          channel: narration
          with: []
          camera: wide
          text: "다섯 시 십 분. 모르는 방이다. 창밖은 아직 파랗고, 침대 반대편에서 누가 등을 돌린 채 자고 있다."
      - say:
          channel: thought
          with: []
          text: "메시지. 사진. 위치. 카드 내역은 월요일에."
      - goto: e0_erase

  e0_erase:
    actions:
      - choice:
          key: e0_erase
          presentation: explore
          prompt: "밝기를 끝까지 낮추고 휴대폰을 연다."
          with: []
          camera: wide
          options:
            - text: "메시지"
              at: { x: 30, y: 45 }
              when: { var: e0_messages, op: eq, value: false }
              goto: e0_erase_messages
            - text: "사진"
              at: { x: 55, y: 30 }
              when: { var: e0_photos, op: eq, value: false }
              goto: e0_erase_photos
            - text: "위치 기록"
              at: { x: 75, y: 55 }
              when: { var: e0_location, op: eq, value: false }
              goto: e0_erase_location
            - text: "신발을 손에 들고 나간다"
              when:
                all:
                  - { var: e0_messages, op: eq, value: true }
                  - { var: e0_photos, op: eq, value: true }
                  - { var: e0_location, op: eq, value: true }
              goto: e0_leave

  e0_erase_messages:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "번호 찍어 둘게요ㅎㅎ 뭐라고 저장해요?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "아무거나요"
      - add: { deleted: 2 }
      - set: { e0_messages: true }
      - goto: e0_erase

  e0_erase_photos:
    actions:
      - say:
          channel: action
          with: []
          text: "흔들린 사진이 네 장 있다. 세 장은 천장이고 한 장에만 손이 찍혔다. 네 장 다 길게 눌러 지우고, 최근 삭제된 항목에 들어가서 한 번 더 지운다."
      - add: { deleted: 1 }
      - set: { e0_photos: true }
      - goto: e0_erase

  e0_erase_location:
    actions:
      - say:
          channel: system
          with: []
          text: "타임라인 · 오전 1:42 · 이 동네\n위치 기록을 끄시겠습니까?"
      - say:
          channel: system
          with: []
          text: "지난 기록 전체 삭제 — 이 작업은 되돌릴 수 없습니다."
      - add: { deleted: 1 }
      - set: { e0_location: true }
      - goto: e0_erase

  e0_leave:
    actions:
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "들어왔어?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이네서 뻗었어 미안ㅠ 지금 감"
      - say:
          channel: action
          with: []
          text: "현관문이 아주 천천히 닫힌다. 걸쇠가 걸리는 소리까지 손으로 막는다."
      - wait: 1200
      - char: { id: 준성, position: center }
      - say:
          channel: action
          char: 준성.tired
          with: []
          text: "준성이 눈을 뜬다. 베개 옆에서 휴대폰을 집어 방금 저장한 번호를 본다."
      - say:
          char: 준성
          with: []
          delivery: whisper
          text: "…아무거나 씨."
      - goto: /1.yaml
