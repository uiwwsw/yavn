chapterTitle: "완성"

script:
  - scene: operating_room
  - scene: studio

scenes:
  operating_room:
    title: "수술실"
    actions:
      - bg: { id: surgery, transition: fade, duration: 1200 }
      - music: cold_room
      - say:
          char: 의사
          with: []
          camera: wide
          text: "마지막으로 한 번 더 읽어 드릴게요. 규정이라서요."
      - say:
          channel: record
          with: []
          text: "ERASE 시술 동의서\n1. 본 시술은 지난 삶의 기억과 이름, 얼굴을 지우고 새 신원으로 깨어나게 합니다.\n2. 지운 기억은 어떤 방법으로도 복구되지 않습니다.\n3. 본인이 정리하지 않은 휴대전화 기록(사진·메시지)은 그대로 남습니다."
      - say:
          char: 의사
          with: []
          text: "서명 확인했어요. 이름표는 뒤집어 둘게요. 깨어나실 때 헷갈리시지 않게."
      - say:
          char: 의사
          with: []
          text: "숨 한 번 크게 쉬세요. 네. 잘하셨어요."
      - say:
          char: 의사
          with: []
          text: "숫자 세실 필요 없어요. 그냥 계시면 돼요."
      - say:
          char: 의사
          with: []
          text: "눈 뜨면… 새로 시작해요."
      - say:
          channel: card
          with: []
          text: "ERASE"
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 한 달 전"

  studio:
    title: "청첩장 사진"
    actions:
      - bg: { id: photo_studio, transition: cut }
      - music: neon
      - place: "금요일 오후 · 청첩장 사진 촬영"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "그래서 식대가 일 인당 육만 팔천이고, 보증 인원이 이백이래. 이백 못 채우면 남는 자리 값은 그냥 내는 거고."
      - say:
          char: 도윤.smile
          motion: perk
          with: [지수]
          text: "우리 쪽은 백 명 무조건 와. 대학 동기들만 해도—"
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "우리 집들이 때도 서른 명 온다 그랬는데 일곱 명 왔어. 그중 셋은 민석 씨였고."
      - say:
          char: 도윤
          with: [지수]
          text: "…그날은 비 왔잖아."
      - say:
          char: 지수
          motion: headtilt
          with: [도윤]
          text: "작가님이 신랑님 턱 조금만 당기래. 조금만."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "아니 그렇게 말고. 이리 와 봐. 넥타이도 돌아갔어."
      - move: { id: 지수, toward: 도윤, style: approach }
      - say:
          char: 지수
          with: [도윤]
          text: "가만있어 봐. 한 번만 더. …아니 한 번만 더."
      - say:
          char: 지수
          with: [도윤]
          text: "계약금 오늘까지야. 내가 넣을게. 넌 영수증만 보관해. 지난번처럼 알림 꺼 놓고 까먹지 말고."
      - say:
          char: 도윤
          motion: nod
          with: [지수]
          text: "안 까먹어."
      - say:
          char: 지수
          with: [도윤]
          text: "그리고."
      - emote: { id: 도윤, motion: freeze }
      - say:
          char: 지수
          with: [도윤]
          text: "우리 엄마 아빠처럼 사는 거 싫어. 밤에 서로 폰 몰래 보고, 다음 날 아무 일 없는 척 밥 먹고. 그런 거."
      - say:
          char: 지수
          motion: lean_in
          with: [도윤]
          text: "뭐 있으면 지금 말해. 지금은 화 안 낼게. 나중엔 내."
      - choice:
          key: e0_studio
          prompt: "작가가 셔터에 손가락을 올리고 기다린다."
          char: 지수
          options:
            - text: "렌즈를 보면서 \"없어. 진짜 없어.\""
              goto: e0_studio_smile
            - text: "\"…카드값 좀 밀린 거?\""
              goto: e0_studio_joke
            - text: "대답 대신 지수 머리카락을 귀 뒤로 넘겨 준다"
              goto: e0_studio_avoid

  e0_studio_smile:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "없어. 진짜 없어."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "녹음해 둘걸."
      - goto: e0_flash

  e0_studio_joke:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "카드값? 이번 달 좀 밀렸는데."
      - say:
          char: 지수
          with: [도윤]
          text: "얼마."
      - say:
          char: 도윤
          with: [지수]
          text: "…사십?"
      - say:
          char: 지수.cold
          motion: puff
          with: [도윤]
          text: "그런 걸 말하라는 거야. 웃기려고 하지 말고."
      - goto: e0_flash

  e0_studio_avoid:
    actions:
      - move: { id: 도윤, toward: 지수, style: approach }
      - say:
          char: 지수.warm
          motion: laugh
          with: [도윤]
          text: "뭐야. 작가님 지금 셔터 엄청 누르신다. 대답을 해야지."
      - say:
          char: 도윤.smile
          with: [지수]
          text: "했잖아, 방금."
      - goto: e0_flash

  e0_flash:
    actions:
      - effect: { name: flash, wait: true }
      - move: { id: 지수, style: reset }
      - move: { id: 도윤, style: reset }
      - sticker:
          id: e0_invite
          image: invitation_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 도윤
          motion: bow
          with: [지수]
          text: "그 앞에 거 저 눈 감았어요. 그건 지워 주세요."
      - say:
          char: 지수.warm
          motion: lean_in
          with: [도윤]
          text: "이거 그대로 시안 들어가도 되겠대. 봐 봐, 너 이번엔 눈 떴어."
      - get: invitation
      - clearSticker: { id: e0_invite, leave: fadeOut }
      - goto: e0_club

  e0_club:
    title: "클럽"
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이 생일ㅋㅋ 한잔만 하고 감 12시 전에 들어갈게"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅋ 대리 불러 운전 절대 xx"
      - bg: { id: club, transition: cut }
      - place: "금요일 밤 12:40 · 클럽"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석아 화장실에서 자냐"
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          motion: lean_in
          with: [도윤]
          text: "라이터 있어요?"
      - say:
          char: 도윤
          motion: startle
          with: [준성]
          text: "네?"
      - move: { id: 준성, toward: 도윤, style: approach }
      - say:
          char: 준성
          with: [도윤]
          delivery: shout
          text: "라이터요!"
      - say:
          char: 도윤
          motion: shake
          with: [준성]
          delivery: shout
          text: "안 피워요!"
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "나도요. 그냥 말 걸어 본 거예요."
      - say:
          char: 도윤.smile
          with: [준성]
          text: "…아, 네."
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "아까부터 폰만 보던데. 누가 답장 안 해요?"
      - say:
          char: 도윤
          with: [준성]
          text: "아뇨, 했어요. 대리 부르래요."
      - say:
          char: 준성
          with: [도윤]
          text: "착하네. 누가요?"
      - say:
          char: 도윤
          with: [준성]
          text: "…다음 달에 결혼해요."
      - say:
          char: 준성
          motion: perk
          with: [도윤]
          text: "와. 축하해요. 그럼 축하주는 내가 살게요. 모르는 사람이 사는 게 제일 부담 없잖아요."
      - choice:
          key: e0_junseong
          prompt: "잔 두 개 중 하나가 이미 이쪽으로 기울어 있다."
          char: 준성
          options:
            - text: "잔을 받는다. \"한 잔만이요.\""
              goto: e0_night
            - text: "폰 화면을 흔들어 보인다. \"저 대리 불러 놨어요.\""
              goto: e0_night_hesitate

  e0_night_hesitate:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [준성]
          text: "저 진짜 가야 돼요. 대리 불러 놨어요."
      - say:
          char: 준성
          with: [도윤]
          text: "금요일 이 시간에요? 이십 분은 걸릴걸요."
      - say:
          char: 준성.smirk
          motion: lean_in
          with: [도윤]
          text: "이십 분 동안 그냥 서 있게요?"
      - say:
          channel: system
          with: []
          text: "대리운전 호출을 취소하시겠습니까?\n기사님이 배정되기 전입니다."
      - goto: e0_night

  e0_night:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "좀 늦을듯 먼저 자"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅇ 물 마시고 자"
      - effect: { name: darken, wait: true }
      - goto: e0_dawn

  e0_dawn:
    title: "새벽"
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 1600 }
      - music: static
      - place: "토요일 새벽 5:10 · 처음 보는 방"
      - say:
          channel: narration
          with: []
          camera: wide
          text: "클럽에서 잔을 건넨 남자가 침대 반대편에서 등을 돌린 채 자고 있다."
      - say:
          channel: thought
          with: []
          text: "메시지. 사진. 위치. 카드 내역은 월요일에."
      - goto: e0_erase

  e0_erase:
    actions:
      - choice:
          key: e0_erase
          presentation: explore
          prompt: "밝기를 끝까지 낮추고 휴대폰을 연다."
          with: []
          camera: wide
          options:
            - text: "메시지"
              at: { x: 30, y: 45 }
              when: { var: e0_messages, op: eq, value: false }
              goto: e0_erase_messages
            - text: "사진"
              at: { x: 55, y: 30 }
              when: { var: e0_photos, op: eq, value: false }
              goto: e0_erase_photos
            - text: "위치 기록"
              at: { x: 75, y: 55 }
              when: { var: e0_location, op: eq, value: false }
              goto: e0_erase_location
            - text: "신발을 손에 들고 나간다"
              when:
                all:
                  - { var: e0_messages, op: eq, value: true }
                  - { var: e0_photos, op: eq, value: true }
                  - { var: e0_location, op: eq, value: true }
              goto: e0_leave

  e0_erase_messages:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "번호 찍어 둘게요ㅎㅎ 뭐라고 저장해요?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "아무거나요"
      - say:
          channel: system
          with: []
          text: "대화방에서 나갔습니다.\n이 번호를 차단했습니다."
      - add: { deleted: 2 }
      - set: { e0_messages: true }
      - goto: e0_erase

  e0_erase_photos:
    actions:
      - say:
          channel: system
          with: []
          text: "사진 4장을 삭제하시겠습니까?"
      - say:
          channel: system
          with: []
          text: "최근 삭제된 항목 · 4장 영구 삭제\n이 작업은 되돌릴 수 없습니다."
      - add: { deleted: 1 }
      - set: { e0_photos: true }
      - goto: e0_erase

  e0_erase_location:
    actions:
      - say:
          channel: system
          with: []
          text: "타임라인 · 오전 1:42 · 이 동네\n위치 기록을 끄시겠습니까?"
      - say:
          channel: system
          with: []
          text: "지난 기록 전체 삭제 — 이 작업은 되돌릴 수 없습니다."
      - add: { deleted: 1 }
      - set: { e0_location: true }
      - goto: e0_erase

  e0_leave:
    actions:
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "들어왔어?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이네서 뻗었어 미안ㅠ 지금 감"
      - wait: 1200
      - char: { id: 준성, position: center, emotion: tired }
      - move: { id: 준성, toward: camera, style: approach }
      - say:
          channel: system
          with: []
          text: "새 연락처 저장 · 어젯밤 받은 번호\n이름:"
      - say:
          char: 준성
          with: []
          delivery: whisper
          text: "…아무거나 씨."
      - goto: /1.yaml
