chapterTitle: "완성"

script:
  - scene: operating_room
  - scene: studio

scenes:
  operating_room:
    title: "시술실"
    pov: "???"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - say: { char: 의사, with: [], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요. 괜찮으시면 여기 서명해 주세요.", continueLabel: "동의서에 서명한다" }
      - say: { channel: action, with: [], sound: consent_pen, text: "펜을 쥔 손이 떨린다. 나는 동의서 아래에 이름을 쓴다." }
      - bg: { id: consent_turn, transition: cut }
      - say: { char: 의사, with: [], text: "이제 눈 감으세요." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 520 }
      - music: null
      - say: { channel: card, with: [], text: "결혼식 4주 전 · 청첩장 촬영", autoAdvance: 1500 }

  studio:
    title: "청첩장 사진"
    actions:
      - bg: { id: photo_studio, transition: cut }
      - music: studio
      - place: "금요일 저녁 · 사진관"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { char: 지수, with: [도윤], text: "도윤아, 나 봐 봐. 작가님 말고 나." }
      - say: { char: 도윤.smile, with: [지수], text: "너 보면 웃음 나는데." }
      - move: { id: 지수, toward: 도윤, style: approach }
      - say: { char: 지수.warm, with: [도윤], text: "그럼 웃어. 나 네가 그렇게 웃는 거 좋아해." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 넥타이를 바로잡는다. 손끝이 차갑다. 도윤이 그 손을 잡아 준다." }
      - say: { char: 도윤, with: [지수], text: "아까부터 손이 이래. 끝나면 뜨거운 거 먹자. 칼국수 어때?" }
      - say: { char: 지수.warm, motion: laugh, with: [도윤], text: "좋아. 넌 곱빼기 시켜. 나 한 입만." }
      - say: { char: 도윤.smile, with: [지수], text: "알았어. 네 앞접시에 덜어 줄게." }
      - say: { channel: action, with: [지수, 도윤], text: "작가가 조명을 옮긴다. 지수는 붙잡은 손을 놓지 않은 채 목소리를 낮춘다." }
      - say: { char: 지수, with: [도윤], text: "식장 계약금 오늘까지잖아. 내 몫은 보냈어. 너도 오늘 보낼 수 있어?" }
      - say: { char: 도윤, with: [지수], text: "어. 이따가." }
      - say: { char: 지수, with: [도윤], text: "지난번에도 그렇게 말하고 혼자 돈 메웠잖아. 이번에도 빠듯하면 나한테 말해." }
      - choice:
          key: e0_studio
          prompt: "지수가 대답을 기다린다."
          char: 지수
          options:
            - text: "오늘 보낼 수 있다고 한다"
              saveText: '밥 먹기 전에 계약금을 보내겠다고 한다'
              goto: e0_studio_smile
            - text: "이번 달 카드값을 말한다"
              saveText: '카드값 43만 원이 밀렸다고 말한다'
              goto: e0_studio_joke
            - text: "촬영 얘기로 돌린다"
              saveText: "작가가 돌아오는 걸 보고 다시 손잡자고 한다"
              goto: e0_studio_avoid

  e0_studio_smile:
    actions:
      - say: { char: 도윤.smile, with: [지수], text: "응. 잠깐만. 지금 보낼게." }
      - say: { char: 지수.warm, with: [도윤], text: "왔어. 자, 손 다시 잡아. 이제 찍으신대." }
      - goto: e0_flash

  e0_studio_joke:
    actions:
      - say: { char: 도윤, with: [지수], text: "이번 달 카드값이 밀렸어. 43만 원." }
      - say: { char: 지수, with: [도윤], text: "그럼 네 몫도 내가 보낼게. 다음엔 빠듯하면 바로 얘기해 줘." }
      - say: { char: 도윤, with: [지수], text: "…고마워. 그럼 칼국수는 내가 사." }
      - goto: e0_flash

  e0_studio_avoid:
    actions:
      - move: { id: 도윤, toward: 지수, style: approach }
      - say: { char: 도윤, with: [지수], text: "아, 저기. 작가님 다시 오신다. 우리 아까처럼 손잡을까?" }
      - say: { char: 지수, with: [도윤], text: "응. 계약금은 내가 먼저 넣을게. 칼국수 먹을 때 다시 얘기하자." }
      - goto: e0_flash

  e0_flash:
    actions:
      - sound: shutter
      - effect: { name: flash, wait: true }
      - move: { id: 지수, style: reset }
      - move: { id: 도윤, style: reset }
      - say: { channel: action, with: [지수, 도윤], text: "촬영이 끝나고 두 사람은 모니터 앞에 앉는다. 작가가 청첩장에 들어갈 사진을 띄워 준다." }
      - sticker:
          id: e0_invite
          image: invitation_sticker
          x: 50
          y: 42
          width: "clamp(180px, 30%, 330px)"
          enter: fadeIn
      - say: { char: 도윤, with: [지수], text: "앞에 거 보셨어요? 저 눈 감은 건 빼 주세요." }
      - say: { char: 지수.warm, with: [도윤], text: "청첩장은 이걸로 할게요. 눈 감은 것도 한 장만 보내 주세요. 그건 제가 갖고 싶어요." }
      - say: { char: 도윤.smile, with: [지수], text: "그거까지 나 주면 안 돼? 나도 너 웃는 거 다시 보고 싶어." }
      - get: invitation
      - clearSticker: { id: e0_invite, leave: fadeOut }
      - goto: e0_club

  e0_club:
    title: "클럽"
    actions:
      - bg: { id: couple_home, transition: fade, duration: 570 }
      - place: { text: "그날 밤 · 도윤과 지수의 집", presentation: center }
      - say: { channel: action, with: [도윤], text: "도윤이 넥타이를 풀 때 휴대폰이 울린다. 민석이다." }
      - say:
          channel: message
          thread: 민석
          side: them
          speakerName: 민석
          with: []
          text: "우리 지금 클럽인데 올래? 유부남 되기 전에 얼굴 좀 보자ㅋㅋ"
      - say:
          channel: message
          thread: 민석
          side: me
          char: 도윤
          with: []
          text: "아직 유부남 아님ㅋㅋ 지금 갈게"
      - choice:
          key: e0_jisu_text
          prompt: "아, 잠깐. 지수한텐 뭐라고 하지?"
          promptHeight: 344
          with: [도윤]
          options:
            - text: "민석이 있는 클럽에 잠깐 갈게. 12시 전엔 들어갈게"
              set:
                e0_jisu_message: "민석이 있는 클럽에 잠깐 갈게. 12시 전엔 들어갈게"
                e0_jisu_reply: "클럽? ㅇㅋ 술 마시면 대리 불러"
            - text: "민석이 잠깐 보자네. 12시 전엔 들어갈게"
              set:
                e0_jisu_message: "민석이 잠깐 보자네. 12시 전엔 들어갈게"
                e0_jisu_reply: "ㅇㅋ 들어올 때 깨우진 마 ㅋㅋ"
            - text: "민석이 생일이래. 나갔다 올게. 늦으면 톡할게"
              set:
                e0_jisu_message: "민석이 생일이래. 나갔다 올게. 늦으면 톡할게"
                e0_jisu_reply: "ㅇㅋ 늦으면 나 먼저 잘게. 운전은 하지 말고"
      - say:
          channel: message
          thread: 지수
          side: me
          char: 도윤
          with: []
          text: "{{e0_jisu_message}}"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "{{e0_jisu_reply}}"
      - bg: { id: club, transition: cut }
      - music: neon
      - place: { text: "토요일 00:40 · 클럽", presentation: center }
      - char: { id: 도윤, position: left }
      - say: { channel: action, with: [도윤], text: "베이스에 바닥이 울린다. 화장실 간 민석이 아직 안 돌아왔다." }
      - say:
          channel: message
          thread: 민석
          side: me
          char: 도윤
          with: []
          text: "민석아 화장실에서 자냐"
      - char: { id: 준성, position: right }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "저기, 담배 하나만 빌릴 수 있어요?" }
      - say: { char: 도윤, with: [준성], text: "저 끊었어요. 라이터는 있는데." }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "라이터는 왜 갖고 다녀요?" }
      - say: { char: 도윤.smile, with: [준성], text: "그러게요. 벌써 석 달인데. 여기 앉으실래요? 일행이면 저쪽에 같이 앉아도 되고." }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "저 혼자예요. 아까 바에서 같이 있던 분은요?" }
      - say: { char: 도윤, with: [준성], text: "친구요. 오늘 걔 생일이에요. 왜요?" }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "제가 몇 번 봤는데요. 자꾸 이쪽 보시길래 아는 사람 있나 했죠." }
      - say: { char: 도윤, with: [준성], text: "그쪽도 몇 번 보셨나 보네요." }
      - say: { char: 준성.smirk, speakerName: "낯선 남자", with: [도윤], text: "네. 저랑 눈 마주치고 얼른 잔 드시던데요." }
      - say: { char: 도윤, with: [준성], text: "계속 쳐다보긴 좀 그렇잖아요. 여긴 제 친구도 있고." }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "저도 제 친구 있었으면 그냥 갔어요. 방금도 담배 얘기부터 했잖아요." }
      - say: { char: 도윤.smile, with: [준성], text: "진짜 담배 피우는 줄 알았어요." }
      - say: { channel: action, with: [도윤, 준성], text: "둘이 웃는다. 도윤이 지수한테 보낸 톡을 다시 보고 휴대폰을 뒤집는다." }
      - say: { char: 도윤, with: [준성], text: "저 다음 달에 결혼해요.", wait: 400 }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "…그럼 저 갈까요?" }
      - say: { char: 도윤, with: [준성], text: "조금 더 앉아 있어요. 친구 올 때까지만." }
      - say: { char: 준성, speakerName: "낯선 남자", with: [도윤], text: "그래요. 빈 잔 하나 더 있는데, 따라 드릴까요?" }
      - choice:
          key: e0_junseong
          prompt: "남자가 자기 잔을 들어 올린 채 기다린다."
          char: 준성
          options:
            - text: "잔을 받는다"
              saveText: "잔을 받는다. \"한 잔만이요.\""
              goto: e0_night_drink
            - text: "대리를 불렀다고 한다"
              saveText: "폰 화면을 흔들어 보인다. \"저 대리 불러 놨어요.\""
              goto: e0_night_hesitate

  e0_night_drink:
    actions:
      - say: { char: 도윤, with: [준성], text: "한 잔만요. 저도 곧 가야 돼서요." }
      - goto: e0_night

  e0_night_hesitate:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [준성]
          text: "저 진짜 가야 돼요. 대리 불러 놨어요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "아, 불렀어요? 기사 잡히면 얘기해요."
      - say:
          channel: action
          with: [도윤, 준성]
          text: "남자는 잔을 내려놓는다. 도윤이 다시 보니 호출 화면에는 아직 ‘기사 찾는 중’이라고 쓰여 있다."
      - say: { channel: action, with: [도윤], text: "도윤은 취소 버튼 위에서 잠깐 멈춘다. 준성이 자리에서 일어나려 하자 고개를 젓고 호출을 취소한다." }
      - say:
          channel: system
          with: []
          text: "대리운전 호출 · 취소됨\n배정된 기사 없음"
      - goto: e0_night

  e0_night:
    actions:
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "물 좀 마실래요? 아침에 일정 있으면 지금 그만 마시는 게 낫겠어요."
      - say:
          char: 도윤
          motion: laugh
          with: [준성]
          text: "네. 저 이제 진짜 일어나야 돼요."
      - say: { channel: action, with: [도윤], text: "도윤이 일어서다 다시 주저앉는다. 지수에게 보낸 외출 문자가 화면에 떠 있다. 도윤은 시각을 보고 나서야 답장 칸을 연다." }
      - say:
          channel: message
          thread: 지수
          side: me
          char: 도윤
          with: []
          text: "좀 늦을듯 먼저 자"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "ㅇㅇ 물 마시고 자"
      - wait: 0
      - goto: e0_dawn

  e0_dawn:
    title: "새벽"
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 1600 }
      - music: static
      - place: { text: "토요일 새벽 5:10 · 처음 보는 방", presentation: center }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "잔을 건네던 남자가 침대 반대편에 등을 돌리고 자고 있다. 엘리베이터 거울에 비친 두 사람은 생각난다. 몇 층에서 내렸는지, 그 뒤 무슨 말을 했는지는 기억이 나지 않는다."
      - say:
          channel: thought
          with: []
          text: "‘ㅇㅇ 물 마시고 자.’ 지수 톡을 보고 침대 옆을 더듬는다. 물컵이 두 개다."
      - goto: e0_erase

  e0_erase:
    actions:
      - choice:
          key: e0_erase
          presentation: explore
          prompt: "화면 밝기를 낮춘다. 돌아가기 전에 뭘 지울까?"
          with: []
          camera: wide
          options:
            - text: "메시지"
              at: { x: 30, y: 45 }
              when: { var: e0_messages, op: eq, value: false }
              goto: e0_erase_messages
            - text: "사진"
              at: { x: 55, y: 30 }
              when: { var: e0_photos, op: eq, value: false }
              goto: e0_erase_photos
            - text: "위치 기록"
              at: { x: 75, y: 55 }
              when: { var: e0_location, op: eq, value: false }
              goto: e0_erase_location
            - text: "방을 나간다"
              saveText: "신발을 손에 들고 나간다"
              goto: e0_leave

  e0_erase_messages:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          speakerName: "낯선 남자"
          with: []
          text: "번호 찍어 둘게요ㅎㅎ 뭐라고 저장해요?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          wait: 700
          text: "아무거나요"
      - say:
          channel: system
          with: []
          text: "이 기기에서 대화가 삭제되었습니다."
          wait: 900
      - add: { deleted: 2 }
      - set: { e0_messages: true }
      - goto: e0_erase

  e0_erase_photos:
    actions:
      - say: { channel: action, with: [], text: "흔들린 사진 세 장을 넘긴다. 마지막 한 장에서 멈춘다." }
      - sticker: { id: e0_club_photo, image: club_photo_sticker, x: 50, y: 45, width: "clamp(250px, 47%, 480px)", enter: blurIn, inputLockMs: 280 }
      - say:
          channel: thought
          with: []
          text: "둘 다 웃고 있네."
          continueLabel: "사진 4장을 삭제한다"
      - clearSticker: { id: e0_club_photo, leave: fadeOut }
      - say:
          channel: system
          with: []
          text: "최근 삭제된 항목 · 4장 영구 삭제\n이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - add: { deleted: 1 }
      - set: { e0_photos: true }
      - goto: e0_erase

  e0_erase_location:
    actions:
      - say:
          channel: system
          with: []
          text: "타임라인 · 오전 1:42 · 이 동네\n위치 기록을 끄시겠습니까?"
      - say:
          channel: system
          with: []
          text: "지난 기록 전체 삭제 — 이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - add: { deleted: 1 }
      - set: { e0_location: true }
      - goto: e0_erase

  e0_leave:
    actions:
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "폰에 5시 40분이 뜬다. 현관에 나가면 다시 폰을 켜지 말자."
      - say:
          channel: thought
          when: { var: e0_messages, op: eq, value: false }
          text: "번호를 저장하지 않으면 연락처에서는 안 뜬다. 그냥 나가자."
      - say:
          channel: thought
          when: { var: e0_photos, op: eq, value: false }
          text: "사진 네 장은 그대로 둔다. 지금은 보고 싶지 않다."
      - say:
          channel: thought
          when: { var: e0_location, op: eq, value: false }
