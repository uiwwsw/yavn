chapterTitle: "완성"

script:
  - scene: operating_room
  - scene: studio

scenes:
  operating_room:
    title: "수술실"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - say:
          char: 의사
          with: []
          text: "지금 쓰는 이름과 얼굴이 바뀝니다. 지금까지의 일도 기억하지 못하게 돼요. 설명 들으셨죠?"
      - say:
          char: 의사
          with: []
          text: "휴대전화는 돌려 드려요. 사진이랑 문자는 그대로 남습니다."
      - say:
          channel: action
          with: []
          sound: consent_pen
          text: "의사가 동의서 맨 아래에 펜을 놓는다. 내 이름이 인쇄돼 있다."
          continueLabel: "시술에 동의한다"
      - bg: { id: consent_turn, transition: cut }
      - say: { char: 의사, with: [], text: "서명 확인했어요. 이름표는 뒤집어 둘게요. 등이 차가울 거예요. 이제 눈 감으세요." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 640 }
      - wait: 180

  studio:
    title: "청첩장 사진"
    actions:
      - bg: { id: photo_studio, transition: fade, duration: 520 }
      - music: studio
      - place: "결혼식 한 달 전 · 청첩장 촬영"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { char: 지수, with: [도윤], text: "눈 떠. 아직 안 찍었어. 턱 좀 당겨 봐. 응, 거기." }
      - say: { char: 도윤, with: [지수], text: "그건 작가님이 시킨 거야, 네가 시키는 거야?" }
      - move: { id: 지수, toward: 도윤, style: approach }
      - say: { char: 지수.warm, with: [도윤], text: "내가. 넥타이 삐뚤어졌어. 잠깐만." }
      - say: { char: 도윤, with: [지수], text: "이거 처음 매 줬을 때 내가 목 조인다고 했잖아." }
      - say: { char: 지수.warm, motion: laugh, with: [도윤], text: "네가 갑자기 고개 숙여서 우리 이마 부딪혔잖아." }
      - say: { char: 도윤, with: [지수], text: "오늘 끝나고 뭐 먹을래? 너 아침에 커피만 마셨잖아." }
      - say: { char: 지수, with: [도윤], text: "칼국수. 네 거까지 곱빼기 시켜서 좀 뺏어 먹을래." }
      - say: { char: 도윤.smile, with: [지수], text: "그럼 네 걸 곱빼기로 시켜." }
      - say: { char: 지수, with: [도윤], text: "그러면 다 먹어야 되잖아." }
      - say: { channel: action, with: [지수, 도윤], text: "촬영 조명이 꺼진 틈에 지수가 휴대폰을 꺼낸다. 화면에 식장 계좌가 떠 있다." }
      - say: { char: 지수, with: [도윤], text: "아, 식장 계약금 오늘까지지. 지금 보낼게. 영수증 카톡으로 보내 줄 테니까 저장 좀 해 줘." }
      - say: { char: 도윤, with: [지수], text: "응. 내 몫은 이따 바로 보낼게." }
      - say: { char: 지수, with: [도윤], text: "지난번에도 이따 보낸다더니 내가 다시 물어봤잖아." }
      - say: { char: 도윤, with: [지수], text: "그땐 월급 들어오기 전이라 통장에 돈이 좀 모자랐어." }
      - say: { char: 지수, with: [도윤], text: "아, 그래서 그랬어? 그냥 말하지. 나는 잊어버린 줄 알았지." }
      - say: { char: 지수, with: [도윤], text: "혹시 또 그런 일 있어? 돈 모자라면 집에 가서 같이 보자." }
      - choice:
          key: e0_studio
          prompt: "작가가 카메라를 내린다. 지수는 아직 도윤의 팔을 잡고 있다."
          char: 지수
          options:
            - text: "숨기는 게 없다고 한다"
              saveText: "렌즈를 보면서 \"없어. 진짜 없어.\""
              goto: e0_studio_smile
            - text: "카드값 이야기로 넘긴다"
              saveText: "\"…카드값 좀 밀린 거?\""
              goto: e0_studio_joke
            - text: "대답을 피한다"
              saveText: "대답 대신 지수 머리카락을 귀 뒤로 넘겨 준다"
              goto: e0_studio_avoid

  e0_studio_smile:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "없어. 진짜 없어."
      - say:
          char: 지수.warm
          with: [도윤]
          text: "그래. 그럼 이따 영수증 오면 저장만 해 줘."
      - goto: e0_flash

  e0_studio_joke:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "카드값? 이번 달 좀 밀렸는데."
      - say:
          char: 지수
          with: [도윤]
          text: "얼마."
      - say:
          char: 도윤
          with: [지수]
          text: "…사십?"
      - say:
          char: 지수
          with: [도윤]
          text: "물음표 붙이지 마. 사십이야 오십이야."
      - say:
          char: 도윤
          with: [지수]
          text: "사십삼."
      - say:
          char: 지수.cold
          motion: puff
          with: [도윤]
          text: "사십삼. 알았어. 이따 밥 먹고 같이 보자."
      - goto: e0_flash

  e0_studio_avoid:
    actions:
      - move: { id: 도윤, toward: 지수, style: approach }
      - say:
          char: 지수.warm
          motion: laugh
          with: [도윤]
          text: "뭐야, 간지러워. 아, 작가님 다시 찍으신다."
      - say:
          char: 도윤.smile
          with: [지수]
          text: "잠깐만. 머리카락 하나 붙었었어."
      - goto: e0_flash

  e0_flash:
    actions:
      - effect: { name: flash, wait: true }
      - move: { id: 지수, style: reset }
      - move: { id: 도윤, style: reset }
      - sticker:
          id: e0_invite
          image: invitation_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          char: 도윤
          motion: bow
          with: [지수]
          sound: shutter
          text: "앞에 찍은 거요. 저 눈 감은 건 지워 주세요."
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "작가님 그냥 두세요. 쟤 원래 저래요."
      - say:
          char: 도윤
          with: [지수]
          text: "눈 감은 게 남아 있으면 신경 쓰이잖아."
      - say:
          char: 지수
          with: [도윤]
          text: "나중에 앨범 받으면 나 저 사진부터 볼 건데."
      - say:
          char: 지수.warm
          motion: lean_in
          with: [도윤]
          text: "이거 그대로 시안 들어가도 되겠대. 봐 봐, 너 이번엔 눈 떴어."
      - get: invitation
      - clearSticker: { id: e0_invite, leave: fadeOut }
      - goto: e0_club

  e0_club:
    title: "클럽"
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "민석: 유부남 되기 전에 마지막으로 얼굴 좀 보자ㅋㅋ"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "아직 유부남 아님"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이 생일ㅋㅋ 한잔만 하고 감 12시 전에 들어갈게"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅋ 대리 불러 운전 절대 xx"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "빨래는 내가 걷었다"
      - bg: { id: club, transition: cut }
      - place: "토요일 오전 0:40 · 클럽"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석아 화장실에서 자냐"
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          speakerName: "낯선 남자"
          motion: lean_in
          with: [도윤]
          text: "라이터 있어요?"
      - say:
          char: 도윤
          motion: startle
          with: [준성]
          text: "네?"
      - move: { id: 준성, toward: 도윤, style: approach }
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          delivery: shout
          text: "라이터요!"
      - say:
          char: 도윤
          motion: shake
          with: [준성]
          delivery: shout
          text: "안 피워요!"
      - say:
          char: 준성.smirk
          speakerName: "낯선 남자"
          motion: laugh
          with: [도윤]
          text: "나도요. 그냥 말 걸어 본 거예요."
      - say:
          char: 도윤.smile
          with: [준성]
          text: "…아, 네."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          motion: headtilt
          with: [도윤]
          text: "아까부터 폰만 보던데. 누가 답장 안 해요?"
      - say:
          char: 도윤
          with: [준성]
          text: "아뇨, 했어요. 대리 부르래요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "착하네. 누가요?"
      - say:
          char: 도윤
          with: [준성]
          text: "…다음 달에 결혼해요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          motion: perk
          with: [도윤]
          text: "와. 축하해요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "예비 신부가 보낸 거예요?"
      - say:
          char: 준성.smirk
          speakerName: "낯선 남자"
          motion: laugh
          with: [도윤]
          text: "아, 자꾸 캐묻네요. 그 얘긴 안 해도 돼요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "다음 달이면 얼마 안 남았네요. 축하주 한 잔 살게요. 저도 일행이 가서 혼자거든요."
      - say:
          char: 도윤
          with: [준성]
          text: "이름도 모르는데요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "이름은 그냥 모르고 마셔요. 오늘 또 볼 것도 아닌데."
      - choice:
          key: e0_junseong
          prompt: "남자가 자기 잔을 들어 올린 채 기다린다."
          char: 준성
          options:
            - text: "잔을 받는다"
              saveText: "잔을 받는다. \"한 잔만이요.\""
              goto: e0_night
            - text: "대리를 불렀다고 한다"
              saveText: "폰 화면을 흔들어 보인다. \"저 대리 불러 놨어요.\""
              goto: e0_night_hesitate

  e0_night_hesitate:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [준성]
          text: "저 진짜 가야 돼요. 대리 불러 놨어요."
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "금요일 이 시간에요? 이십 분은 걸릴걸요."
      - say:
          char: 준성.smirk
          speakerName: "낯선 남자"
          motion: lean_in
          with: [도윤]
          text: "이십 분 동안 그냥 서 있게요?"
      - say:
          channel: system
          with: []
          text: "대리운전 호출을 취소하시겠습니까?\n기사님이 배정되기 전입니다."
      - goto: e0_night

  e0_night:
    actions:
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: [도윤]
          text: "이제 물 마실래요? 내일 또 일정 있을 텐데."
      - say:
          char: 도윤
          motion: laugh
          with: [준성]
          text: "네. 저 이제 진짜 일어나야 돼요."
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "좀 늦을듯 먼저 자"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅇ 물 마시고 자"
      - effect: { name: darken, wait: true }
      - goto: e0_dawn

  e0_dawn:
    title: "새벽"
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 1600 }
      - music: static
      - place: "토요일 새벽 5:10 · 처음 보는 방"
      - say:
          channel: narration
          with: []
          camera: wide
          text: "잔을 건네던 남자가 침대 반대편에 등을 돌리고 자고 있다. 클럽에서 여기까지 어떻게 왔는지는 기억이 나지 않는다."
      - say:
          channel: thought
          with: []
          text: "‘ㅇㅇ 물 마시고 자.’ 지수 톡을 보고 침대 옆을 더듬는다. 물컵이 두 개다."
      - goto: e0_erase

  e0_erase:
    actions:
      - choice:
          key: e0_erase
          presentation: explore
          prompt: "화면 밝기를 낮춘다. 돌아가기 전에 뭘 지울까?"
          with: []
          camera: wide
          options:
            - text: "메시지"
              at: { x: 30, y: 45 }
              when: { var: e0_messages, op: eq, value: false }
              goto: e0_erase_messages
            - text: "사진"
              at: { x: 55, y: 30 }
              when: { var: e0_photos, op: eq, value: false }
              goto: e0_erase_photos
            - text: "위치 기록"
              at: { x: 75, y: 55 }
              when: { var: e0_location, op: eq, value: false }
              goto: e0_erase_location
            - text: "방을 나간다"
              saveText: "신발을 손에 들고 나간다"
              goto: e0_leave

  e0_erase_messages:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          speakerName: "낯선 남자"
          with: []
          text: "번호 찍어 둘게요ㅎㅎ 뭐라고 저장해요?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          wait: 700
          text: "아무거나요"
      - say:
          channel: system
          with: []
          text: "대화방에서 나갔습니다.\n이 번호를 차단했습니다."
          wait: 900
      - add: { deleted: 2 }
      - set: { e0_messages: true }
      - goto: e0_erase

  e0_erase_photos:
    actions:
      - say:
          channel: system
          with: []
          text: "사진 4장을 삭제하시겠습니까?"
      - say:
          channel: system
          with: []
          text: "최근 삭제된 항목 · 4장 영구 삭제\n이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - add: { deleted: 1 }
      - set: { e0_photos: true }
      - goto: e0_erase

  e0_erase_location:
    actions:
      - say:
          channel: system
          with: []
          text: "타임라인 · 오전 1:42 · 이 동네\n위치 기록을 끄시겠습니까?"
      - say:
          channel: system
          with: []
          text: "지난 기록 전체 삭제 — 이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - add: { deleted: 1 }
      - set: { e0_location: true }
      - goto: e0_erase

  e0_leave:
    actions:
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "폰에 5시 40분이 뜬다. 현관에 나가면 다시 폰을 켜지 말자."
      - say:
          channel: thought
          when: { var: e0_messages, op: eq, value: false }
          text: "번호를 저장하지 않으면 연락처에서는 안 뜬다. 그냥 나가자."
      - say:
          channel: thought
          when: { var: e0_photos, op: eq, value: false }
          text: "사진 네 장은 그대로 둔다. 어두워서 뭐가 찍혔는지도 모르겠다."
      - say:
          channel: thought
          when: { var: e0_location, op: eq, value: false }
          text: "위치 기록은 그대로 둔다. 그걸 누가 열어 본다고."
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "들어왔어?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "민석이네서 뻗었어 미안ㅠ 지금 감"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "물 사가지고 와 집에 없어"
      - wait: 1200
      - char: { id: 준성, position: center, emotion: tired }
      - move: { id: 준성, toward: camera, style: approach }
      - say:
          channel: system
          with: []
          text: "새 연락처 저장 · 어젯밤 받은 번호\n이름:"
      - say:
          char: 준성
          speakerName: "낯선 남자"
          with: []
          delivery: whisper
          text: "…아무거나 씨."
      - goto: /1.yaml
