chapterTitle: "같은 군대"

script:
  - scene: new_leader
  - scene: overtime
  - scene: rumor

scenes:
  new_leader:
    title: "새 팀장"
    actions:
      - place: "월요일 아침 · 출근길 지하철"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 새 팀장님 오늘 오신대요"
          autoAdvance: 1600
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 9시반 B회의실. 커피 사오지 말래 팀장님이 쏘신대"
          autoAdvance: 2080
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 오 첫날부터 점수 따시네ㅋㅋ"
          autoAdvance: 1664
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 또 ㅋㅋ만 치심"
          autoAdvance: 1632
      - bg: { id: office, transition: fade, duration: 500 }
      - music: neon
      - place: "월요일 9:20 · 영업2팀"
      - char: { id: 도윤, position: left }
      - say:
          char: 도윤
          with: []
          text: "네, 영업2팀 한도윤입니다."
      - char: { id: 준성, position: right }
      - say:
          channel: dialogue
          speakerName: "전화 속 남자"
          with: [도윤]
          text: "아, 이 번호 맞네요."
      - say:
          channel: dialogue
          speakerName: "전화 속 남자"
          with: [도윤]
          text: "고개 들어 봐요. 맞은편 자리요."
      - say:
          channel: system
          when: { var: e0_messages, op: eq, value: false }
          with: []
          text: "대화 · 저장되지 않은 번호\n마지막 메시지 · 3월 20일 오전 1:58"
      - say:
          channel: thought
          when: { var: e0_messages, op: eq, value: false }
          text: "토요일 새벽에 안 지운 그 방이다. 뒤 네 자리가 지금 울리는 번호와 같다."
      - move: { id: 도윤, toward: 준성, style: flinch }
      - say:
          char: 준성
          speakerName: "새 팀장"
          motion: bow
          with: [도윤]
          text: "사내 연락망에서 번호 보고 걸어 봤어요. 박준성입니다. 오늘부터 이 팀 맡습니다."
      - mood: { tone: dread, level: 1 }
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…네. 반갑습니다. 처음 뵙—"
      - say:
          char: 준성
          with: [도윤]
          text: "처음 뵙겠습니다."
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 두 분 인사 토씨 하나 안 틀리고 똑같으심ㅋㅋ 같은 군대 나오셨나"
          autoAdvance: 2336
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "그러게요. 우리 같은 군대잖아요. 그쵸, 한대리님?"
      - move: { id: 준성, toward: 도윤, style: approach }
      - emote: { id: 도윤, motion: recoil }
      - say:
          channel: action
          with: [준성, 도윤]
          text: "준성이 도윤 쪽으로 몸을 기울이더니 한쪽 눈을 찡긋한다."
      - say:
          char: 도윤.smile
          motion: laugh
          with: [준성]
          text: "…하하. 그러게요."
      - move: { id: 준성, style: reset }
      - mood: off
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "아, 그리고 저 프린터 어디예요? 아까 눌렀는데 아무 데서도 안 나와서."
      - say:
          char: 도윤
          with: [준성]
          text: "복도 끝이요. 근데 그거 양면 설정이 자꾸 풀려요."
      - say:
          char: 준성
          with: [도윤]
          text: "점심은 보통 어디로 가요?"
      - say:
          char: 도윤
          with: [준성]
          text: "…건너편 상가요. 월요일엔 김치찌개 집."
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "김치찌개 좋죠. 오늘 저도 같이 가도 돼요?"
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…그럼요."

  overtime:
    title: "야근"
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - place: "목요일 21:30 · 빈 사무실"
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "한대리님 아직 있었어요? 불 다 꺼진 줄 알고 깜짝 놀랐네."
      - say:
          char: 도윤
          with: [준성]
          text: "마감 자료만 보내고 가려고요."
      - say:
          char: 준성
          motion: sigh
          with: [도윤]
          text: "그 말 하는 사람들이 제일 오래 남아요. 나도 그랬고."
      - say:
          char: 준성
          with: [도윤]
          text: "아 맞다, 내일 열 시 회의요. 두 시로 미룰게요. 오전에 병원 들렀다 와야 해서."
      - say:
          char: 도윤
          with: [준성]
          text: "…네. 공유드릴게요."
      - say:
          char: 도윤
          with: [준성]
          text: "그 화분, 집에서 가져오신 거예요?"
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "네. 물은 종이컵으로 반 컵만 줘요. 지난번에 한 컵 줬더니 잎이 다 처지더라고요."
      - say:
          char: 준성
          with: [도윤]
          text: "이사 갈 때도 이거부터 쌌어요. 옷보다 먼저."
      - say:
          char: 도윤
          with: [준성]
          text: "팀장님. 잠깐 얘기 좀 해도 될까요."
      - say:
          char: 준성
          with: [도윤]
          text: "네. 앉아요."
      - move: { id: 도윤, toward: 준성, style: approach }
      - say:
          char: 도윤
          with: [준성]
          text: "그날… 그거요. 없던 걸로 하죠. 괜히 말 나오면 서로 좋을 거 없잖아요."
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "무슨 날이요?"
      - move: { id: 도윤, toward: 준성, style: retreat }
      - say:
          char: 도윤.panic
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "농담이에요. 난 말할 생각 없어요."
      - move: { id: 도윤, style: reset }
      - say:
          char: 준성
          with: [도윤]
          text: "회사 일로 연락할 땐 내선으로 할게요."
      - say:
          char: 도윤
          motion: droop
          with: [준성]
          text: "…네. 자리에 보통 있어요."
      - say:
          char: 준성
          with: [도윤]
          text: "알아요. 오늘도 이렇게 남아 있잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "그날 아침에 신발 들고 나가던데. 소리 안 나게."
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…깨어 계셨어요?"
      - say:
          char: 준성
          with: [도윤]
          text: "처음부터요."
      - say:
          char: 준성
          with: [도윤]
          text: "현관문 닫히는 소리 났어요. 그냥 누워 있었어요."
      - say:
          char: 준성.tired
          motion: nod
          with: [도윤]
          text: "나 이번 회사는 오래 다니고 싶어요. 그러니까 우리 그냥 일해요."
      - say:
          char: 도윤
          with: [준성]
          text: "…네."
      - emote: { id: 도윤, motion: bow }
      - say:
          char: 준성
          with: [도윤]
          text: "들어가요. 결혼 준비 바쁠 텐데."
  rumor:
    title: "소문"
    actions:
      - place: "금요일 저녁 · 퇴근길"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 팀장님 오전에 병원 다녀오셨대 회의 미뤄진 거 그거 때문"
          autoAdvance: 2176
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 팀장님 오늘도 도윤대리님만 찾으심ㅋㅋㅋ"
          autoAdvance: 1856
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
          autoAdvance: 1824
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 아 그 윙크ㅋㅋㅋㅋ 나 소름돋았잖아"
          autoAdvance: 1792
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: @한도윤 해명하세요"
          autoAdvance: 1504
      - choice:
          key: e1_rumor
          prompt: "‘입력 중’이 뜬다. 사라졌다가 다시 뜬다."
          with: []
          options:
            - text: "농담에 맞장구친다"
              saveText: "\"ㅋㅋ 군대 어디냐고 나도 물어봄\""
              goto: e1_laugh
            - text: "농담을 그만하라고 한다"
              saveText: "\"그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데\""
              add: { cruelty: 1 }
              goto: e1_deny
            - text: "답장하지 않는다"
              saveText: "읽기만 하고 폰을 엎어 둔다"
              goto: e1_ignore

  e1_laugh:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ군대 어디냐고 나도 물어봄"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: ㅋㅋㅋㅋ그래서요"
          autoAdvance: 1440
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "말 안해줌"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 내일 점심 뭐 먹냐"
          autoAdvance: 1504
      - goto: e1_home

  e1_deny:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 오…"
          autoAdvance: 1248
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 이상한 게 뭔데요??"
          autoAdvance: 1536
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 뭐 들은 거 있구나?"
          autoAdvance: 1536
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 읽씹ㅋㅋ 궁금하게 해놓고"
          autoAdvance: 1792
      - goto: e1_home

  e1_ignore:
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 읽고 튀셨다"
          autoAdvance: 1376
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 냅둬 결혼 준비 바쁘대"
          autoAdvance: 1568
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 그럼 더 수상한데ㅋㅋ"
          autoAdvance: 1536
      - goto: e1_home

  e1_home:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 900 }
      - place: "금요일 밤 · 도윤과 지수의 집"
      - say:
          channel: system
          with: []
          text: "나에게서 삭제 · 내 화면에서만 사라지며 다른 참여자에게는 그대로 보입니다."
      - say:
          channel: message
          side: them
          with: []
          erase: true
          wait: 700
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
          autoAdvance: 1824
      - add: { deleted: 1 }
      - say:
          char: 지수
          with: []
          text: "도윤아, 저녁 뭐 시킬까. 오늘은 나 진짜 밥 못 하겠어."
      - say:
          char: 도윤
          with: []
          text: "아무거나."
      - say:
          char: 지수
          with: []
          text: "아무거나 말고. 치킨, 국밥, 아니면 그냥 라면?"
      - say:
          char: 도윤
          with: []
          text: "국밥."
      - say:
          char: 지수
          with: []
          text: "국밥 먹고 싶었네. 바로 나오면서 아무거나래."
      - say:
          char: 지수
          with: []
          text: "아 맞다, 나 씻는다. 드레스 잔금 넣었어. 영수증 또 보냈으니까 그것도 지우지 마!"
      - say:
          char: 도윤
          motion: nod
          with: []
          text: "어. 안 지워."
      - say:
          char: 지수
          with: []
          text: "지금 저장해 줘. 너 그러고 나중에 또 보내 달라고 하잖아."
      - say:
          char: 도윤
          with: []
          text: "저장했어."
      - say:
          channel: card
          with: []
          text: "11년 전\n유하린 · 18세"
      - goto: e1_harin

  e1_harin:
    pov: "유하린"
    title: "하린"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - place: "점심시간 · 3학년 교실"
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "야야야 오늘 돈까스였잖아. 근데 4교시에 체육을 넣으면 어떡해."
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "체육 늦게 끝나는 날엔 뛰어 내려가도 끝에 작은 것만 남는다니까."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "이거 학교가 일부러 이러는 거야. 백 퍼야. 교장쌤이 돈까스 아껴서 그래."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아니 진짜래도? 작년에도 똑같았어. 내가 기록해 놨어 폰에."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "증거가 있어야 되잖아. 나중에 민원 넣을 거야."
      - say:
          char: 민재.laugh
          with: [하린, 아진]
          text: "아니 그니까 아까 그 얘기. 2반 걔가 식판을 엎었는데, 지가 안 엎었대. 국이 바닥에 다 있는데."
      - say:
          char: 아진
          motion: headtilt
          with: [하린, 민재]
          text: "근데 서민재, 너 여친 콩자반은 왜 니가 먹어."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "얘 콩 못 먹잖아. 아무튼 걔가—"
      - say:
          char: 하린
          motion: perk
          with: [민재, 아진]
          text: "나 그거 봤어! 나 진짜 바로 앞에 있었거든? 근데 걔 아니었어."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "옆에 있던 애가 팔꿈치로 이렇게 치고 가서—"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아진아 어제 보낸 노래 들었어?"
      - say:
          char: 아진
          with: [하린, 민재]
          text: "어, 듣다가 잠들었어. 좋아서 잠든 거야. 진짜로."
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "무슨 노래?"
      - say:
          char: 하린
          with: [민재, 아진]
          text: "컴백한 거? 티저 그거? 나 그거 알고리즘에 떴었는데."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아, 너 이런 거 안 듣잖아."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "…그치. 안 듣지."
      - say:
          channel: thought
          with: [민재, 아진]
          text: "나한텐 안 보냈네ㅋㅋ 아냐 괜찮아 어차피 안 들음 진짜로 안 들음"
      - say:
          char: 아진
          with: [하린, 민재]
          text: "아 맞다 하린아, 생윤 수행 그거 조 짰어?"
      - say:
          char: 하린
          motion: perk
          with: [아진, 민재]
          text: "아직! 나 그거 완전 까먹고 있었어. 야 우리 셋이 하자 셋이."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "나 아진이랑 이미 같은 조 했는데."
      - emote: { id: 하린, motion: freeze }
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 그래? 언제 짰어?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아까 쉬는 시간에."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "아 나 그때 화장실 갔었구나. 타이밍 봐 진짜ㅋㅋ"
      - say:
          char: 하린
          motion: shake
          with: [아진, 민재]
          text: "괜찮아. 아진아, 2반에 조 안 짠 애 누군지 알아?"
      - say:
          char: 아진.awkward
          motion: lean_in
          with: [하린, 민재]
          text: "하린아, 너도 들어 볼래? 한쪽."
      - choice:
          key: e1_harin
          prompt: "아진이 이어폰 한쪽을 내민다."
          char: 아진
          options:
            - text: "이어폰을 받지 않는다"
              saveText: "손사래를 친다. \"됐어 됐어, 둘이 들어.\""
              goto: e1_harin_smile
            - text: "민재에게 왜 안 보냈는지 묻는다"
              saveText: "웃으면서 묻는다. \"근데 민재야, 나한텐 왜 안 보냈어?\""
              goto: e1_harin_ask

  e1_harin_smile:
    pov: "유하린"
    actions:
      - say:
          char: 하린
          motion: shake
          with: [민재, 아진]
          text: "됐어 됐어. 나 그런 거 관심 없다니까. 둘이 들어."
      - say:
          char: 아진.awkward
          motion: nod
          with: [하린, 민재]
          text: "…응."
      - move: { id: 민재, toward: 아진, style: approach }
      - emote: { id: 하린, motion: freeze }
      - say:
          char: 민재
          with: [하린, 아진]
          text: "그럼 그거 나 줘."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "…어. 그래. 줘."
      - goto: e1_harin_night

  e1_harin_ask:
    pov: "유하린"
    actions:
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "민재야, 너 아진이한테 보낸 거 나도 좀 봐도 돼?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "너 관심 없다며. 맨날 그러잖아."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 맞다. 그랬지. ㅋㅋ 내가 그랬다."
      - emote: { id: 하린, motion: droop }
      - say:
          char: 아진.awkward
          motion: laugh
          with: [하린, 민재]
          text: "아… 내가 너한테도 보내 줄게. 지금 보낼까?"
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 종 친다. 나 먼저 들어간다?"
      - goto: e1_harin_night

  e1_harin_night:
    pov: "유하린"
    actions:
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - place: "그날 밤 · 하린의 방"
      - say:
          channel: message
          side: them
          with: []
          text: "♥ 정아진님이 서민재님의 스토리를 좋아합니다"
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "ㅋㅋㅋ이거 완전 너잖아 @정아진"
      - say:
          channel: action
          with: []
          text: "하린은 밝기를 끝까지 낮춘다. 불은 이미 꺼져 있다."
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "나도 봤는데ㅋㅋ 이거 웃기다 나도 껴줘"
      - goto: h1_type

  h1_type:
    pov: "유하린"
    actions:
      - choice:
          key: h1_send
          prompt: "하린은 보내기 버튼 위에 손가락을 올린 채 ‘나도 껴줘’를 다시 읽는다."
          with: []
          options:
            - text: "보낸다"
              set: { h1_sent: true }
              goto: h1_sent
            - text: "한 글자씩 지운다"
              add: { deleted: 1 }
              goto: h1_erased
            - text: "두 사람 사이를 묻는 말을 덧붙인다"
              saveText: "\"야 근데 둘이 요즘\"까지 더 쓴다"
              goto: h1_more

  h1_sent:
    pov: "유하린"
    actions:
      - say:
          channel: system
          with: []
          text: "읽음 2"
      - say:
          channel: action
          with: []
          text: "읽음 숫자가 바뀐다. 이름 옆에는 아무 표시도 뜨지 않는다."
      - say:
          channel: thought
          with: []
          text: "일 분, 이 분. 아무도 답을 안 한다."
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "ㅇㅇ"
      - say:
          channel: thought
          with: []
          text: "‘ㅇ’ 하나 치다가 지운다. 그래. 봤으면 됐지."
      - goto: h1_shots

  h1_erased:
    pov: "유하린"
    actions:
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          wait: 700
          text: "나도 봤는데ㅋㅋ 이거 웃기다 나도 껴줘"
      - say:
          channel: action
          with: []
          text: "뒤에서부터 한 글자씩 지운다. ‘나도’에서 잠깐 멈춘다."
      - say:
          channel: thought
          with: []
          text: "보낸 거 아님. 아무도 못 봤어."
      - goto: h1_shots

  h1_more:
    pov: "유하린"
    actions:
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          wait: 700
          text: "나도 봤는데ㅋㅋ 이거 웃기다 나도 껴줘"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          wait: 700
          text: "야 근데 둘이 요즘"
      - say:
          channel: action
          with: []
          text: "뒤에 쓴 말을 먼저 지운다. 그러고도 한참 ‘나도 껴줘’가 남아 있다."
      - add: { deleted: 2 }
      - say:
          channel: thought
          with: []
          text: "그거 물어보면 걔들이 나 빼놓은 얘기까지 해야 되잖아."
      - goto: h1_shots

  h1_shots:
    pov: "유하린"
    actions:
      - say:
          channel: system
          with: []
          text: "스크린샷 3장 · 최근 삭제된 항목에서 영구 삭제"
          wait: 800
      - add: { deleted: 3 }
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 자?"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "아니 야자 끝나고 지금 씻었어ㅋㅋ"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "오늘 생윤 조 그거 미안"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "뭐가 미안해 진짜 괜찮은데"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "나 혼자 하는 게 편해 걍"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "낼 할 얘기 있어"
      - goto: /2.yaml
