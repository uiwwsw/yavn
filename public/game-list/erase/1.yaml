chapterTitle: "같은 군대"

script:
  - scene: new_leader
  - scene: overtime
  - scene: rumor

scenes:
  new_leader:
    title: "새 팀장"
    actions:
      - bg: { id: couple_home, transition: cut }
      - place: { text: "월요일 아침 · 도윤과 지수의 집", presentation: center }
      - char: { id: 도윤, position: left }
      - say: { channel: action, with: [도윤], text: "신발을 신는데 회사 단톡이 울린다. 도윤이 잠깐 멈춰 화면을 확인한다." }
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "새 팀장님 오늘 오신대요"
          autoAdvance: 1600
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "9시반 B회의실. 커피 사오지 말래 팀장님이 쏘신대"
          autoAdvance: 2080
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "오 첫날부터 점수 따시네ㅋㅋ"
          autoAdvance: 1664
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "도윤대리님 또 ㅋㅋ만 치심"
          autoAdvance: 1632
      - bg: { id: office, transition: fade, duration: 500 }
      - music: neon
      - place: { text: "월요일 9:20 · 영업2팀", presentation: center }
      - char: { id: 도윤, position: left }
      - say: { channel: action, with: [도윤], text: "자리에 앉기도 전에 모르는 번호로 전화가 온다." }
      - say:
          char: 도윤
          with: []
          text: "네, 영업2팀 한도윤입니다."
      - char: { id: 준성, position: right }
      - say:
          channel: dialogue
          speakerName: "전화 속 남자"
          with: [도윤]
          text: "아, 이 번호 맞네요."
      - say:
          channel: dialogue
          speakerName: "전화 속 남자"
          with: [도윤]
          text: "고개 들어 봐요. 맞은편 자리요."
      - say:
          channel: system
          when: { var: e0_messages, op: eq, value: false }
          with: []
          text: "저장되지 않은 번호 · 마지막 대화 토요일 새벽 1:58"
      - say:
          channel: thought
          when: { var: e0_messages, op: eq, value: false }
          text: "토요일 새벽에 안 지운 대화다. 전화가 온 번호도 같은 번호였다."
      - move: { id: 도윤, toward: 준성, style: flinch }
      - say:
          char: 준성
          speakerName: "새 팀장"
          motion: bow
          with: [도윤]
          text: "사내 연락망에서 번호 보고 걸어 봤어요. 박준성입니다. 오늘부터 이 팀 맡습니다."
      - mood: { tone: dread, level: 1 }
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…네. 반갑습니다. 처음 뵙—"
      - say:
          char: 준성
          with: [도윤]
          text: "처음 뵙겠습니다."
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "두 분 인사 토씨 하나 안 틀리고 똑같으심ㅋㅋ 같은 군대 나오셨나"
          autoAdvance: 2336
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "그러게요. 우리 같은 군대잖아요. 그쵸, 한대리님?"
      - move: { id: 준성, toward: 도윤, style: approach }
      - emote: { id: 도윤, motion: recoil }
      - say:
          channel: action
          with: [준성, 도윤]
          text: "준성이 도윤 쪽으로 몸을 기울이더니 한쪽 눈을 찡긋한다."
      - say:
          char: 도윤.smile
          motion: laugh
          with: [준성]
          text: "…하하. 그러게요."
      - move: { id: 준성, style: reset }
      - mood: off
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "아, 그리고 저 프린터 어디예요? 아까 눌렀는데 아무 데서도 안 나와서."
      - say:
          char: 도윤
          with: [준성]
          text: "복도 끝이요. 근데 그거 양면 설정이 자꾸 풀려요."
      - say:
          char: 준성
          with: [도윤]
          text: "점심은 보통 어디로 가요?"
      - say:
          char: 도윤
          with: [준성]
          text: "…건너편 상가요. 월요일엔 김치찌개 집."
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "김치찌개 좋죠. 저도 끼워 줘요. 거기 어디에 시켜야 빨리 나오는지도 알려 주고요."
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…그럼요."

  overtime:
    title: "야근"
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - place: { text: "목요일 21:30 · 빈 사무실", presentation: center }
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "한대리님 아직 있었어요? 불 다 꺼진 줄 알고 깜짝 놀랐네."
      - say:
          char: 도윤
          with: [준성]
          text: "마감 자료만 보내고 가려고요."
      - say:
          char: 준성
          motion: sigh
          with: [도윤]
          text: "저도 그것만 보내고 간다고 앉았다가 막차 놓치고 그랬어요."
      - say:
          char: 준성
          with: [도윤]
          text: "아 맞다, 내일 열 시 회의요. 두 시로 미룰게요. 오전에 병원 들렀다 와야 해서."
      - say:
          char: 도윤
          with: [준성]
          text: "…네. 공유드릴게요."
      - say:
          char: 도윤
          with: [준성]
          text: "팀장님. 아까도 제 자리로 오시던데, 회사에서 그날 얘긴 안 하실 거죠?"
      - say:
          char: 도윤
          with: [준성]
          text: "월요일에 전화하셨을 때 제가 좀 놀랐어요."
      - say:
          char: 준성
          with: [도윤]
          text: "미안해요. 그땐 제가 먼저 인사하는 게 나을 줄 알았어요."
      - move: { id: 도윤, toward: 준성, style: approach }
      - say:
          char: 도윤
          with: [준성]
          text: "그날… 그거요. 없던 걸로 하죠. 괜히 말 나오면 서로 좋을 거 없잖아요."
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "연락망 번호 확인한다고 한 거, 그날 번호인 줄 알면서 건 거예요. 아침에 가 버려서 말을 못 했거든요."
      - move: { id: 도윤, toward: 준성, style: retreat }
      - say:
          char: 도윤.panic
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "회사에서 그 얘기 안 할게요. 한대리님도 그 얘기 하려고 남으신 거죠?"
      - move: { id: 도윤, style: reset }
      - say:
          char: 준성
          with: [도윤]
          text: "회사 일로 연락할 땐 내선으로 할게요."
      - say:
          char: 도윤
          motion: droop
          with: [준성]
          text: "…네. 자리에 보통 있어요."
      - say:
          char: 준성
          with: [도윤]
          text: "아까부터 저한테 할 말 있는 줄 알았는데."
      - say:
          char: 준성
          with: [도윤]
          text: "그날 아침에 신발 들고 나가던데. 소리 안 나게."
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…깨어 계셨어요?"
      - say:
          char: 준성
          with: [도윤]
          text: "처음부터요."
      - say:
          char: 준성
          with: [도윤]
          text: "문 닫히는 소리까지 들었어요. 그냥 누워 있었고요."
      - say:
          char: 준성.tired
          motion: nod
          with: [도윤]
          text: "저 여기 오래 다니고 싶어요. 회사에선 일 얘기만 해요, 우리."
      - say:
          char: 도윤
          with: [준성]
          text: "…네."
      - emote: { id: 도윤, motion: bow }
      - say:
          char: 준성.smirk
          motion: laugh
          with: [도윤]
          text: "저 이 화분 좀 봐줘요. 옮기다 잎이 꺾였는데, 새 잎은 나더라고요. 물은 종이컵 반 컵만요."
      - say:
          char: 준성
          with: [도윤]
          text: "제가 내일 늦으면 반 컵만 부탁해요."
      - say:
          char: 준성
          with: [도윤]
          text: "들어가요. 결혼 준비 바쁠 텐데."
  rumor:
    title: "소문"
    actions:
      - place: "금요일 저녁 · 퇴근길"
      - say: { channel: action, with: [도윤], text: "퇴근길에도 단톡이 쉴 새 없이 울린다. 도윤 이름을 부르는 알림에서 화면을 연다." }
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "팀장님 오전에 병원 다녀오셨대 회의 미뤄진 거 그거 때문"
          autoAdvance: 2176
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "팀장님 오늘도 도윤대리님만 찾으심ㅋㅋㅋ"
          autoAdvance: 1856
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
          autoAdvance: 1824
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "아 그 윙크ㅋㅋㅋㅋ 나 소름돋았잖아"
          autoAdvance: 1792
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "@한도윤 해명하세요"
          autoAdvance: 1504
      - choice:
          key: e1_rumor
          prompt: "‘입력 중’이 뜬다. 사라졌다가 다시 뜬다."
          with: []
          options:
            - text: "농담에 맞장구친다"
              saveText: "\"ㅋㅋ 군대 어디냐고 나도 물어봄\""
              goto: e1_laugh
            - text: "농담을 끊으려고 준성을 깎아내린다"
              saveText: "\"그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데\""
              add: { cruelty: 1 }
              goto: e1_deny
            - text: "답장하지 않는다"
              saveText: "읽기만 하고 폰을 엎어 둔다"
              goto: e1_ignore

  e1_laugh:
    actions:
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ군대 어디냐고 나도 물어봄"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "ㅋㅋㅋㅋ그래서요"
          autoAdvance: 1440
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "말 안해줌"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "내일 점심 뭐 먹냐"
          autoAdvance: 1504
      - goto: e1_home

  e1_deny:
    actions:
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "오…"
          autoAdvance: 1248
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "이상한 게 뭔데요??"
          autoAdvance: 1536
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "뭐 들은 거 있구나?"
          autoAdvance: 1536
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "도윤대리님 읽씹ㅋㅋ 궁금하게 해놓고"
          autoAdvance: 1792
      - goto: e1_home

  e1_ignore:
    actions:
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "읽고 튀셨다"
          autoAdvance: 1376
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "냅둬 결혼 준비 바쁘대"
          autoAdvance: 1568
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "그럼 더 수상한데ㅋㅋ"
          autoAdvance: 1536
      - goto: e1_home

  e1_home:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 600 }
      - place: { text: "금요일 밤 · 도윤과 지수의 집", presentation: center }
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { channel: action, with: [도윤], text: "집에 와서도 아까 단톡방이 마음에 걸린다. 도윤은 농담이 달린 메시지를 길게 누른다." }
      - say: { channel: system, with: [], text: "나에게서 삭제 · 이 기기에서만 숨깁니다." }
      - add: { deleted: 1 }
      - say: { char: 지수, with: [도윤], text: "어서 와. 오늘 표정 안 좋네. 무슨 일 있었어?" }
      - say: { char: 도윤, with: [지수], text: "별일 없었어. …너 국밥 먹을래? 내가 시킬게." }
      - say: { char: 지수.warm, with: [도윤], text: "응. 네 거엔 파 빼 달라고 해. 저번에도 네가 다 건져냈잖아." }
      - say: { char: 도윤.smile, with: [지수], text: "나는 네가 주는 건 먹는데." }
      - say: { char: 지수.warm, with: [도윤], text: "알아. 내가 네 그릇에 먼저 넣고 봤거든." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 어깨에 머리를 기대자 도윤이 휴대폰을 엎는다. 사진관에선 돈 얘기 꺼내기도 어려웠다. 지금은 어디서부터 말해야 할지 모르겠다." }
      - say: { channel: card, with: [], text: "11년 전 · 유하린", autoAdvance: 1550 }
      - goto: e1_harin

  e1_harin:
    pov: "유하린"
    title: "하린"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - place: "점심시간 · 3학년 교실"
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say: { char: 하린, with: [민재, 아진], text: "오늘 돈까스였잖아. 4교시에 체육 넣은 사람 진짜 너무해.", motion: bounce }
      - say: { char: 아진, with: [하린, 민재], text: "너 지난번에 그래서 급식표 찍어 뒀잖아. 증거라면서." }
      - say: { char: 하린, with: [민재, 아진], text: "오늘 것도 찍었지. 너 다음에 돈까스 두 개 받으면 하나 남겨 줘." }
      - say: { char: 민재, with: [하린, 아진], text: "아진아, 어제 보낸 노래 들었어?" }
      - say: { char: 아진, with: [하린, 민재], text: "응. 듣다가 잠들었어. 좋아서 잠든 거야." }
      - say: { char: 하린, with: [민재, 아진], text: "뭔데? 나한테도 보내 봐." }
      - say: { char: 민재, with: [하린, 아진], text: "너 이런 거 안 듣잖아." }
      - say: { char: 하린, with: [민재, 아진], text: "내가 언제 그랬어? …됐어. 야, 생윤 조는 우리 셋이 할까?" }
      - say: { char: 민재, with: [하린, 아진], text: "나 아진이랑 이미 냈는데. 아까 쉬는 시간에." }
      - say: { char: 하린, with: [민재, 아진], text: "아. 나 화장실 간 사이에?", motion: freeze }
      - say: { char: 아진.awkward, with: [하린, 민재], text: "하린아. 노래라도 같이 들을래? 한쪽 줄게." }
      - choice:
          key: e1_harin
          prompt: "아진이 이어폰 한쪽을 내민다."
          char: 아진
          options:
            - text: "이어폰을 받지 않는다"
              saveText: "손사래를 친다. \"됐어 됐어, 둘이 들어.\""
              goto: e1_harin_smile
            - text: "민재에게 왜 안 보냈는지 묻는다"
              saveText: "웃으면서 묻는다. \"근데 민재야, 나한텐 왜 안 보냈어?\""
              goto: e1_harin_ask

  e1_harin_smile:
    pov: "유하린"
    actions:
      - say:
          char: 하린
          motion: shake
          with: [민재, 아진]
          text: "됐어 됐어. 나 혼자 들을 것도 있어. 둘이 들어."
      - say:
          char: 아진.awkward
          motion: nod
          with: [하린, 민재]
          text: "…응."
      - move: { id: 민재, toward: 아진, style: approach }
      - emote: { id: 하린, motion: freeze }
      - say:
          char: 민재
          with: [하린, 아진]
          text: "그럼 그거 나 줘."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "…어. 그래. 줘."
      - goto: e1_harin_night

  e1_harin_ask:
    pov: "유하린"
    actions:
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "민재야, 그 노래 나한텐 왜 안 보냈어?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "너 관심 없다며. 맨날 그러잖아."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 맞다. 그랬지. ㅋㅋ 내가 그랬다."
      - emote: { id: 하린, motion: droop }
      - say:
          char: 아진.awkward
          motion: laugh
          with: [하린, 민재]
          text: "아… 내가 너한테도 보낼걸. 잠깐만, 지금 보낼게."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 종 친다. 나 먼저 들어간다?"
      - goto: e1_harin_night

  e1_harin_night:
    pov: "유하린"
    actions:
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - place: { text: "그날 밤 · 하린의 방", presentation: center }
      - say: { channel: action, with: [], text: "불을 끄고 누웠는데 셋이 쓰는 단톡이 울린다. 민재가 그 노래를 다시 올려 놨다." }
      - say: { char: "민재", channel: message, thread: 셋이 쓰는 방, side: them, speakerName: 서민재, with: [], text: "이거 1분 20초부터 들어봐 @아진" }
      - say: { char: "아진", channel: message, thread: 셋이 쓰는 방, side: them, speakerName: 정아진, with: [], text: "아 아까 이어폰 뺀 데부터네ㅋㅋ" }
      - say: { channel: action, with: [], text: "하린은 답장 칸에 ‘나도 봤는데ㅋㅋ 나도 껴줘’라고 써 본다." }
      - goto: h1_type

  h1_type:
    pov: "유하린"
    actions:
      - choice:
          key: h1_send
          prompt: "하린은 보내기 버튼 위에 손가락을 올린 채 ‘나도 껴줘’를 다시 읽는다."
          with: []
          options:
            - text: "보낸다"
              set: { h1_sent: true }
              goto: h1_sent
            - text: "한 글자씩 지운다"
              add: { deleted: 1 }
              goto: h1_erased
            - text: "두 사람 사이를 묻는 말을 덧붙인다"
              saveText: "\"야 근데 둘이 요즘\"까지 더 쓴다"
              goto: h1_more

  h1_sent:
    pov: "유하린"
    actions:
      - say: { channel: message, thread: 셋이 쓰는 방, side: me, char: 하린, with: [], text: "나도 봤는데ㅋㅋ 나도 껴줘" }
      - say: { channel: action, with: [], text: "말풍선 옆 숫자가 사라지는데 한동안 답이 없다." }
      - say: { char: "민재", channel: message, thread: 셋이 쓰는 방, side: them, speakerName: 서민재, with: [], text: "ㅇㅇ" }
      - goto: h1_shots

  h1_erased:
    pov: "유하린"
    actions:
      - say: { channel: action, with: [], text: "뒤에서부터 한 글자씩 지운다. ‘나도’에서 잠깐 멈춘다." }
      - say: { channel: thought, with: [], text: "보낸 거 아님. 아무도 못 봤어." }
      - goto: h1_shots

  h1_more:
    pov: "유하린"
    actions:
      - say: { channel: action, with: [], text: "‘야 근데 둘이 요즘’까지 붙여 쓴다. 잠깐 내려다보다 두 줄 다 지운다." }
      - add: { deleted: 2 }
      - say: { channel: thought, with: [], text: "내일 물어봐야지. 아진이 혼자 있을 때." }
      - goto: h1_shots

  h1_shots:
    pov: "유하린"
    actions:
      - say: { channel: action, with: [], text: "점심부터 캡처해 둔 대화가 세 장이다. 다시 읽다가 사진첩을 열어 세 장을 지운다." }
      - say: { channel: system, with: [], text: "스크린샷 3장 · 최근 삭제된 항목에서 영구 삭제", wait: 600 }
      - add: { deleted: 3 }
      - say: { channel: action, with: [], text: "화면을 끄려는데 아진이 개인 톡을 보낸다." }
      - say: { char: "아진", channel: message, thread: 아진, side: them, speakerName: 정아진, with: [], text: "하린아 오늘 생윤 조 그거 미안" }
      - say: { channel: message, thread: 아진, side: me, char: 하린, with: [], text: "뭐가 미안해 ㅋㅋ 나 혼자 하는 게 편해" }
      - say: { char: "아진", channel: message, thread: 아진, side: them, speakerName: 정아진, with: [], text: "낼 나랑 잠깐 얘기할래? 둘이서" }
      - goto: /2.yaml
