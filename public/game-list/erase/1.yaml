chapterTitle: "같은 군대"

script:
  - scene: new_leader
  - scene: rumor

scenes:
  new_leader:
    title: "새 팀장"
    actions:
      - bg: { id: office, transition: fade, duration: 800 }
      - music: neon
      - say:
          channel: narration
          with: []
          camera: wide
          text: "며칠 뒤. 월요일 아침 회의 직전, 부서에 새 팀장이 온다는 공지가 떴다."
      - say:
          channel: action
          with: []
          text: "도윤의 책상 전화가 울린다. 수화기를 든다."
      - say:
          char: 도윤
          with: []
          text: "네, 한도윤입니다. 여보세요."
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: []
          text: "여보세요."
      - say:
          channel: action
          with: [준성]
          text: "같은 목소리가 수화기와 등 뒤에서 동시에 들린다. 도윤은 천천히 돌아본다."
      - char: { id: 도윤, position: left }
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "이번에 온 박준성입니다. 우리… 아는 사이죠?"
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…처음 뵙는 것 같은데요."
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "그래요? 이상하다. 같은 군대잖아요."
      - say:
          channel: action
          with: [준성, 도윤]
          text: "윙크. 주변 사람들이 웃는다. 농담이니까. 도윤만 웃지 못한다."
      - say:
          channel: thought
          with: [준성]
          text: "그 밤이 끝나지 않았다는 신호다."

  rumor:
    title: "소문"
    actions:
      - bg: { id: office_night, transition: fade, duration: 800 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "그 주 내내 탕비실에서 소문이 돈다. 새 팀장 얘기. 그리고 한도윤 얘기."
      - say:
          channel: message
          side: them
          with: []
          text: "[단톡] 팀장님이 도윤 대리만 콕 집어 부르던데 ㅋㅋ 무슨 사이야?"
      - choice:
          key: e1_rumor
          prompt: "단톡방에 답할 차례다."
          with: []
          options:
            - text: "\"ㅋㅋ 같은 군대래. 나도 몰라\" 같이 웃는다"
              goto: e1_laugh
            - text: "\"그런 거 아니라고. 선 넘지 마\" 세게 부정한다"
              add: { cruelty: 1 }
              goto: e1_deny
            - text: "읽고 답하지 않는다"
              goto: e1_ignore

  e1_laugh:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ 같은 군대래. 나도 모름"
      - say:
          channel: thought
          with: []
          text: "솔직한 사람처럼 보이는 법. 먼저 웃으면 아무도 더 묻지 않는다."
      - goto: e1_home

  e1_deny:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "그런 거 아니라고. 선 넘지 마"
      - say:
          channel: message
          side: them
          with: []
          text: "[단톡] 헐 왜 정색함 ㅋㅋㅋ 찔리나"
      - say:
          channel: thought
          with: []
          text: "세게 부정할수록 소문은 단단해진다. 알면서도 손이 먼저 나갔다."
      - goto: e1_home

  e1_ignore:
    actions:
      - say:
          channel: narration
          with: []
          text: "읽음 표시 하나. 답은 없다. 침묵은 그 자리에 오래 남았다."
      - goto: e1_home

  e1_home:
    actions:
      - say:
          channel: action
          with: []
          text: "그날 밤 집. 도윤은 단톡방을 나가지 않고 대화만 하나씩 지운다. 내 화면에서만."
      - say:
          channel: message
          side: them
          with: []
          erase: true
          text: "[단톡] 무슨 사이야?"
      - add: { deleted: 1 }
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - goto: e1_harin

  e1_harin:
    title: "하린"
    actions:
      - bg: { id: classroom, transition: fade, duration: 900 }
      - music: cold_room
      - char: { id: 하린, position: center }
      - say:
          char: 하린
          with: []
          text: "야, 나 세상에 관심 없어. 생각하면 피곤하잖아."
      - char: { id: 민재, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 민재.laugh
          with: [하린, 아진]
          text: "아진아, 너 그 노래 들었어? 어제 내가 보낸 거."
      - say:
          char: 아진
          with: [하린, 민재]
          text: "응, 듣다가 잤어. 너무 좋아서 그런 거야, 화내지 마."
      - say:
          channel: thought
          with: [민재, 아진]
          text: "나한텐 안 보냈다. 괜찮아. 나 이런 거 신경 안 써."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "둘이 노래 취향 똑같다. 나만 음치네."
      - say:
          char: 아진.awkward
          with: [하린]
          text: "…하린아, 너도 들어 볼래?"
      - choice:
          key: e1_harin
          prompt: "아진이 이어폰 한쪽을 내민다."
          char: 아진
          options:
            - text: "\"아니, 됐어. 관심 없어.\" 웃는다"
              goto: e1_harin_smile
            - text: "\"민재가 왜 나한텐 안 보냈어?\" 묻는다"
              goto: e1_harin_ask

  e1_harin_smile:
    actions:
      - say:
          char: 하린
          with: [아진]
          text: "아니, 됐어. 관심 없어. 진짜로."
      - say:
          channel: thought
          with: []
          text: "내가 조용하면 다 괜찮아. 내가 조용하면… 완벽해 보여."
      - goto: e1_harin_night

  e1_harin_ask:
    actions:
      - say:
          char: 하린
          with: [민재]
          text: "민재야. 왜 나한텐 안 보냈어?"
      - say:
          char: 민재
          with: [하린]
          text: "너 이런 거 관심 없다며. 맨날 그러잖아."
      - say:
          channel: thought
          with: [민재]
          text: "내가 그랬다. 내가 만든 벽에 내가 부딪혔다."
      - goto: e1_harin_night

  e1_harin_night:
    actions:
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "밤. 방 안에서 빛나는 건 휴대폰 하나뿐이다. 하린은 끝없이 화면을 내린다."
      - say:
          channel: message
          side: them
          with: []
          text: "♥ 정아진 님이 서민재 님의 스토리를 좋아합니다"
      - say:
          channel: message
          side: them
          with: []
          text: "서민재: ㅋㅋㅋ 이거 완전 너잖아 @정아진"
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "아냐. 별일 아니야. 내가 예민한 거야."
      - say:
          channel: action
          with: []
          erase: true
          text: "캡처한 화면 세 장. 길게 누르고, 삭제. 본 적 없는 걸로."
      - add: { deleted: 3 }
      - say:
          channel: thought
          with: []
          text: "남을 속이려는 게 아니다. 내 마음이 아는 걸, 내가 견딜 수 없어서."
      - goto: /2.yaml
