chapterTitle: "같은 군대"

script:
  - scene: new_leader
  - scene: overtime
  - scene: rumor

scenes:
  new_leader:
    title: "새 팀장"
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 새 팀장님 오늘 오신대요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 9시반 B회의실. 커피 사오지 말래 팀장님이 쏘신대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 오 첫날부터 점수 따시네ㅋㅋ"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ"
      - bg: { id: office, transition: cut }
      - music: neon
      - say:
          channel: action
          with: []
          text: "아홉 시 이십 분. 책상 전화가 울린다. 내선이다."
      - char: { id: 도윤, position: left }
      - say:
          char: 도윤
          with: []
          text: "네, 영업2팀 한도윤입니다."
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "아, 이 번호 맞네요."
      - say:
          channel: action
          with: [준성, 도윤]
          text: "수화기에서 들리는 목소리가 등 뒤에서도 똑같이 들린다. 파티션 너머, 수화기를 든 남자가 도윤을 보고 있다."
      - say:
          char: 준성
          with: [도윤]
          text: "내선표 보고 하나씩 걸어 보는 중이었어요. 박준성입니다. 오늘부터 같이 일해요."
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…네. 반갑습니다. 처음 뵙—"
      - say:
          char: 준성
          with: [도윤]
          text: "처음 뵙겠습니다."
      - say:
          channel: narration
          with: [준성, 도윤]
          text: "옆자리 윤주임이 의자를 밀고 나오며, 두 분 목소리 완전 똑같다고, 혹시 군대 어디 나오셨냐고 끼어든다."
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "그러게요. 우리 같은 군대잖아요. 그쵸, 한대리님?"
      - say:
          channel: action
          with: [준성, 도윤]
          text: "준성이 한쪽 눈을 감았다 뜬다. 다들 웃는다. 도윤도 웃는다. 한 박자 늦게."

  overtime:
    title: "야근"
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - say:
          channel: narration
          with: []
          camera: wide
          text: "그 주 목요일, 아홉 시 반. 층에 남은 건 둘이다. 복사기가 혼자 절전 모드로 들어간다."
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 도윤
          with: [준성]
          text: "팀장님. 잠깐 얘기 좀 해도 될까요."
      - say:
          char: 준성
          with: [도윤]
          text: "네. 앉아요."
      - say:
          char: 도윤
          with: [준성]
          text: "그날… 그거요. 없던 걸로 하죠. 괜히 말 나오면 서로 좋을 거 없잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "무슨 날이요?"
      - say:
          char: 도윤.panic
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "농담이에요. 난 말할 생각 없어요."
      - say:
          char: 준성
          with: [도윤]
          text: "근데 내 번호는 왜 차단했어요? 회사 일로 연락할 수도 있는데."
      - say:
          char: 도윤
          with: [준성]
          text: "…풀어 놓을게요."
      - say:
          char: 준성
          with: [도윤]
          text: "안 풀어도 돼요. 내선 있으니까."
      - say:
          char: 준성
          with: [도윤]
          text: "들어가요. 결혼 준비 바쁠 텐데."

  rumor:
    title: "소문"
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 팀장님 오늘도 도윤대리님만 찾으심ㅋㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 아 그 윙크ㅋㅋㅋㅋ 나 소름돋았잖아"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: @한도윤 해명하세요"
      - choice:
          key: e1_rumor
          prompt: "입력 중… 표시가 떴다 사라지기를 세 번."
          with: []
          options:
            - text: "\"ㅋㅋ 군대 어디냐고 나도 물어봄\""
              goto: e1_laugh
            - text: "\"그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데\""
              add: { cruelty: 1 }
              goto: e1_deny
            - text: "읽기만 하고 폰을 엎어 둔다"
              goto: e1_ignore

  e1_laugh:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ군대 어디냐고 나도 물어봄"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: ㅋㅋㅋㅋ그래서요"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "말 안해줌"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 내일 점심 뭐 먹냐"
      - goto: e1_home

  e1_deny:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 오…"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 이상한 게 뭔데요??"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 읽씹ㅋㅋ 궁금하게 해놓고"
      - goto: e1_home

  e1_ignore:
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 읽고 튀셨다"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 냅둬 결혼 준비 바쁘대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 그럼 더 수상한데ㅋㅋ"
      - goto: e1_home

  e1_home:
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 900 }
      - say:
          channel: action
          with: []
          text: "그날 밤. 지수가 씻는 동안, 도윤은 단톡방을 위로 올리며 자기 이름이 나온 말풍선만 골라 '나에게서 삭제'를 누른다."
      - say:
          channel: message
          side: them
          with: []
          erase: true
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
      - add: { deleted: 1 }
      - say:
          char: 지수
          with: []
          text: "도윤아, 계약금 넣었어. 영수증 캡처해서 보냈으니까 그건 지우지 마!"
      - say:
          char: 도윤
          with: []
          text: "어. 안 지워."
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - goto: e1_harin

  e1_harin:
    title: "하린"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say:
          char: 민재.laugh
          with: [하린, 아진]
          text: "아니 그니까 걔가 식판을 엎었는데, 지가 안 엎었대. 국이 바닥에 다 있는데."
      - say:
          char: 아진
          with: [하린, 민재]
          text: "미쳤나 봐 진짜."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "나 그거 봤어. 근데 걔 아니었어, 옆에 있던 애가 팔꿈치로—"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아진아 어제 보낸 노래 들었어?"
      - say:
          char: 아진
          with: [하린, 민재]
          text: "어, 듣다가 잠들었어. 좋아서 잠든 거야. 진짜로."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "무슨 노래?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아, 너 이런 거 안 듣잖아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "…그치. 안 듣지."
      - say:
          channel: thought
          with: [민재, 아진]
          text: "나한텐 안 보냈네ㅋㅋ 아냐 괜찮아 어차피 안 들음 진짜로 안 들음"
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "하린아, 너도 들어 볼래? 한쪽."
      - choice:
          key: e1_harin
          prompt: "아진이 이어폰 한쪽을 내민다."
          char: 아진
          options:
            - text: "손사래를 친다. \"됐어 됐어, 둘이 들어.\""
              goto: e1_harin_smile
            - text: "웃으면서 묻는다. \"근데 민재야, 나한텐 왜 안 보냈어?\""
              goto: e1_harin_ask

  e1_harin_smile:
    actions:
      - say:
          char: 하린
          with: [민재, 아진]
          text: "됐어 됐어. 나 그런 거 관심 없다니까. 둘이 들어."
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "…응."
      - say:
          channel: action
          with: [하린, 민재, 아진]
          text: "아진이 이어폰을 자기 귀에 다시 꽂는다. 남은 한쪽은 민재가 가져간다."
      - goto: e1_harin_night

  e1_harin_ask:
    actions:
      - say:
          char: 하린
          with: [민재, 아진]
          text: "근데 민재야, 나한텐 왜 안 보냈어? 웃겨서 물어보는 거야."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "너 관심 없다며. 맨날 그러잖아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "아 맞다. 그랬지. ㅋㅋ 내가 그랬다."
      - say:
          channel: action
          with: [하린, 민재, 아진]
          text: "아진이 따라 웃다가, 혼자 너무 오래 웃는다."
      - goto: e1_harin_night

  e1_harin_night:
    actions:
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - say:
          channel: message
          side: them
          with: []
          text: "♥ 정아진님이 서민재님의 스토리를 좋아합니다"
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "ㅋㅋㅋ이거 완전 너잖아 @정아진"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          text: "나도 봤는데ㅋㅋ 이거 웃기다 나도 껴줘"
      - say:
          channel: action
          with: []
          text: "하린은 스토리를 캡처한다. 세 장. 확대해서 보고, 다시 보고, 세 장 다 지운다. 최근 삭제된 항목까지 들어가서."
      - add: { deleted: 3 }
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 자?"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "낼 할 얘기 있어"
      - goto: /2.yaml
