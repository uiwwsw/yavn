chapterTitle: "급식표"

script:
  - scene: e2_menu

scenes:
  e2_menu:
    title: "급식표"
    actions:
      - say: { channel: card, with: [], text: "결혼 D-26 · 월요일", autoAdvance: 1500 }
      - bg: { id: cafeteria, transition: cut }
      - music: static
      - place: "월요일 아침 · 회사 식당 앞"
      - char: { id: 서윤, position: right }
      - sound: shutter
      - say: { channel: action, with: [서윤], text: "서윤은 회사 식당 앞에 붙은 주간 메뉴를 찍는다. 월요일마다 하는 일이다." }
      - say: { char: 윤주임, with: [서윤], text: "대리님 그거 왜 맨날 찍어요?" }
      - say: { char: 서윤, with: [], text: "몰라요. 버릇이에요." }
      - say: { char: 윤주임, with: [서윤], text: "금요일 돈까스네. 대리님 돈까스 날엔 십 분 일찍 내려가시잖아요." }
      - say: { char: 윤주임, with: [서윤], text: "저 다 알아요." }
      - goto: e2_originals

  e2_originals:
    title: "원본"
    actions:
      - say: { channel: card, with: [], text: "결혼 D-23 · 목요일", autoAdvance: 1500 }
      - bg: { id: couple_home, transition: cut }
      - music: null
      - place: "밤 11시 · 서윤과 지수의 집"
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "원본 보내 드려요. 312장이고 보정 전이라 어두운 건 그대로예요."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "앨범 시안은 다음 주 수요일에 나옵니다."
      - say: { channel: action, with: [서윤], text: "압축 파일을 풀자 사진이 줄줄이 뜬다. 앞머리를 넘겨 주는 지수의 손, 반쯤 감긴 눈, 조명 스탠드가 걸려 버린 컷." }
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          media: { src: assets/items/harin_classroom_girl.svg, alt: "312번째 파일. 2016년 3월 10일, 교실 창가에서 교복 입은 여자아이가 책상에 팔을 괴고 웃는 사진" }
          text: "IMG_0312.jpg"
      - say: { channel: action, with: [서윤], text: "마지막 파일 하나만 색이 다르다. 교실 창가에서 교복 입은 여자아이가 책상에 팔을 괴고 웃고 있다." }
      - say: { channel: action, with: [서윤], text: "책상 위에 3월 급식표가 놓여 있다. 처음 보는 얼굴이다." }
      - say:
          channel: message
          thread: 사진관
          side: me
          char: 서윤
          with: []
          text: "마지막 건 뭐예요?"
      - say: { channel: action, with: [서윤], text: "보내자마자 옆의 1이 사라진다. 답은 한참 뒤에 온다." }
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "잘못 들어갔어요. 지워 주세요."
      - choice:
          key: e1_photo
          prompt: "손가락이 사진 위에 있다."
          options:
            - text: "사진을 지운다"
              set: { ajin_photo: deleted }
              goto: e1_photo_deleted
            - text: "남겨 둔다"
              set: { ajin_photo: kept }
              goto: e1_photo_kept
            - text: "누구냐고 묻는다"
              set: { ajin_photo: asked }
              goto: e1_photo_replied

  e1_photo_deleted:
    actions:
      - say: { channel: action, with: [서윤], text: "서윤은 사진을 지운다. 휴지통까지 비운다." }
      - say: { channel: action, with: [서윤], text: "생각하기 전에 손이 먼저 움직였다. 안방 쪽을 보니 지수는 자고 있다." }
      - goto: e2_playground

  e1_photo_kept:
    actions:
      - say: { channel: action, with: [서윤], text: "서윤은 그 사진을 남겨 둔다. 손가락 두 개로 벌려 보니 3월 10일 칸에 돈까스라고 적혀 있다." }
      - say: { channel: thought, with: [서윤], text: "얼굴은 끝까지 모르는 얼굴이다. 웃는 모양만 알 것 같다." }
      - goto: e2_playground

  e1_photo_replied:
    actions:
      - say:
          channel: message
          thread: 사진관
          side: me
          char: 서윤
          with: []
          text: "누구예요?"
      - say: { channel: action, with: [서윤], text: "한참 뒤에 한 줄이 온다." }
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          text: "같은 반 친구요. 오래전에요. 지워 주세요."
      - say: { channel: action, with: [서윤], text: "서윤은 답하지 않는다. 사진은 그대로 둔다." }
      - goto: e2_playground

  e2_playground:
    title: "놀이터"
    pov: "유하린"
    actions:
      - say: { channel: card, with: [], text: "열한 해 전 · 3월 14일", autoAdvance: 1500 }
      - bg: { id: playground, transition: cut }
      - music: neon
      - place: "하굣길 · 은행동"
      - char: { id: 하린, position: left }
      - char: { id: 아진, position: right }
      - say: { channel: action, with: [하린, 아진], text: "버스 정류장 광고판에 새 포스터가 붙어 있다. 흰 바탕에 글자 몇 줄뿐이다." }
      - say: { channel: record, with: [], text: "정림의원 3층 ERASE 상담실 · 지우고 싶은 기억이 있다면" }
      - say: { channel: action, with: [하린, 아진], text: "하린이 그걸 지하철 안내 방송 목소리로 읽는다." }
      - say: { char: 하린, with: [아진], text: "지우고 싶은 기억이 있다면. 이번 역은." }
      - say: { char: 아진, with: [하린], text: "저거 하면 모의고사도 지워지나." }
      - say: { char: 하린, with: [아진], text: "지워도 성적표는 집에 가." }
      - say: { channel: action, with: [하린, 아진], text: "아진네 동과 하린네 동 사이에 놀이터가 있다. 아진은 사진반에서 빌린 카메라를 목에 걸고 있다." }
      - say: { char: 아진, with: [하린], text: "인물 사진 과제, 금요일까지야. 모델 좀 해 줘. 떡볶이 살게." }
      - say: { char: 하린, with: [아진], text: "너 돈 있어?" }
      - say: { char: 아진, with: [하린], text: "사천 원." }
      - say: { char: 하린, with: [아진], text: "그럼 반은 내가 낼게." }
      - say: { channel: action, with: [하린, 아진], text: "하린은 미끄럼틀 꼭대기에 올라가 쪼그려 앉는다. 무릎이 난간 밖으로 삐져나온다." }
      - say: { channel: action, with: [하린, 아진], text: "아진은 카메라를 들었다가 셔터를 누르지 않고 내린다." }
      - say: { char: 아진, with: [하린], text: "너 일곱 살 때도 거기서 안 내려왔어. 엄마들이 밥 먹으라고 부를 때까지." }
      - say: { char: 하린, with: [아진], text: "기억 안 나." }
      - say: { char: 아진, with: [하린], text: "나는 나는데." }
      - say: { channel: action, with: [하린, 아진], text: "아진이 사진반 양식 한 장을 내민다. 초상 사용 동의서다." }
      - say: { channel: action, with: [하린, 아진], text: "하린은 아진의 공책을 받침 삼아 유하린이라고 쓰고, 끝에 작은 점을 찍는다." }
      - say: { char: 아진, with: [하린], text: "점은 왜 찍어." }
      - say: { char: 하린, with: [아진], text: "몰라. 버릇." }
      - say: { channel: action, with: [하린, 아진], text: "아진은 동의서를 접어 가방에 넣고 한참 카메라 끈만 만지작거린다." }
      - say: { char: 아진.awkward, with: [하린], text: "하린아. 나 할 말 있는데." }
      - say: { char: 하린, with: [아진], text: "길어?" }
      - say: { char: 아진, with: [하린], text: "안 길어." }
      - say: { char: 하린.blank, with: [아진], text: "그럼 더 나중에 해." }
      - say: { channel: action, with: [하린, 아진], text: "하린이 미끄럼틀을 타고 내려온다. 운동화 앞코가 모래에 박힌다." }
      - say: { char: 하린.blank, with: [아진], text: "너 사진과 가면 결혼사진 그런 거 찍어. 돈 많이 번대." }
      - say: { char: 아진, with: [하린], text: "그럼 너 결혼할 때 공짜로 찍어 줄게." }
      - say: { char: 하린.blank, with: [아진], text: "그럼 안 해야겠다. 공짜는 사진이 별로잖아." }
      - sound: shutter
      - say: { channel: action, with: [하린, 아진], text: "아진이 웃으면서 셔터를 누른다. 하린은 웃지 않은 얼굴로 찍힌다." }
      - goto: e2_album

  e2_album:
    title: "앨범 시안"
    actions:
      - move: { id: 하린, style: exit }
      - move: { id: 아진, style: exit }
      - say: { channel: card, with: [], text: "결혼 D-17 · 수요일", autoAdvance: 1500 }
      - bg: { id: photo_studio, transition: cut }
      - music: studio
      - place: "수요일 저녁 · 사진관"
      - char: { id: 어른아진, position: left }
      - char: { id: 서윤, position: right }
      - say: { channel: action, with: [서윤, 어른아진], text: "앨범 시안이 나왔다고 연락이 왔다. 지수는 야근이다." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진은 시안을 펼쳐 놓고 먼저 말하지 않는다. 서윤은 지수가 고른 문구를 찾으려고 사진첩을 연다." }
      - say: { channel: action, with: [서윤, 어른아진], text: "식당 메뉴판 사진이 줄줄이 지나간다. 월요일, 월요일, 월요일." }
      - say: { channel: action, with: [서윤, 어른아진], text: "시안을 다 넘기고 나서야 아진이 묻는다." }
      - say: { char: 어른아진, with: [서윤], text: "점심 메뉴, 찍으세요?" }
      - say: { channel: action, with: [서윤, 어른아진], text: "서윤의 손이 시안 위에서 멈춘다." }
      - say: { char: 서윤.panic, with: [어른아진], text: "어떻게 아세요." }
      - say: { char: 어른아진, with: [서윤], text: "아는 애가 그랬어요. 급식표를." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진은 거기서 말을 끊고 시안 한 장을 도로 넘긴다." }
      - say: { char: 어른아진, with: [서윤], text: "이 페이지 글씨는 신랑님 고르신 걸로 갈게요." }
      - choice:
          key: e2_listen
          prompt: "아진이 다음 장을 넘긴다."
          options:
            - text: "그 사람 얘기를 더 해 달라고 한다"
              set: { listened: true }
              goto: e2_listen_more
            - text: "왜 이런 얘기를 하느냐고 묻는다"
              goto: e2_listen_why
            - text: "앨범만 받고 일어난다"
              goto: e2_listen_leave

  e2_listen_more:
    actions:
      - say: { char: 서윤, with: [어른아진], text: "그 사람 얘기, 더 해 주세요." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진이 한참 서윤을 본다." }
      - say: { char: 어른아진, with: [서윤], text: "돈까스를 진짜 좋아했어요. 사천 원밖에 없으면서 떡볶이는 반 쏜다고 하고." }
      - say: { char: 어른아진, with: [서윤], text: "말은 맨날 됐어, 관심 없어, 그랬는데 다 듣고 있었어요." }
      - say: { char: 서윤, with: [어른아진], text: "아진 씨도 그 말 믿었어요?" }
      - say: { char: 어른아진.awkward, with: [서윤], text: "저요?" }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진이 웃는다. 손은 카메라 끈을 감고 있다." }
      - say: { char: 어른아진, with: [서윤], text: "시안 마저 보실래요?" }
      - say: { channel: action, with: [서윤, 어른아진], text: "서윤은 시안을 마저 본다. 마지막 장을 덮을 때 아진이 말한다." }
      - say: { char: 어른아진, with: [서윤], text: "걔가 학교 안 나오기 전날, 제가 옆자리 비워 둔다고 했거든요." }
      - say: { char: 어른아진, with: [서윤], text: "내일 같이 먹자고. 걔는 안 왔어요." }
      - goto: e2_home

  e2_listen_why:
    actions:
      - say: { char: 서윤, with: [어른아진], text: "저한테 왜 이런 얘기를 하세요." }
      - say: { char: 어른아진.awkward, with: [서윤], text: "그러게요." }
      - say: { channel: action, with: [서윤, 어른아진], text: "아진은 시안을 둔 채 뒤쪽 작업실로 들어간다. 한참 나오지 않는다." }
      - goto: e2_home

  e2_listen_leave:
    actions:
      - say: { channel: action, with: [서윤, 어른아진], text: "서윤은 앨범을 받아 들고 일어난다. 아진은 문까지 배웅하고 아무 말도 하지 않는다." }
      - goto: e2_home

  e2_home:
    title: "그날 밤"
    actions:
      - move: { id: 어른아진, style: exit }
      - bg: { id: couple_home, transition: fade, duration: 600 }
      - music: wind
      - place: "그날 밤 · 서윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { char: 지수, with: [서윤], text: "작가님, 너 아는 사람이랑 닮았다며. 오늘 또 만났어?" }
      - choice:
          key: e2_jisu
          prompt: "지수가 숟가락을 든 채 기다린다."
          options:
            - text: "사실대로 말한다"
              set: { told_first: true }
              goto: e2_jisu_true
            - text: "앨범 얘기만 했다고 한다"
              set: { number_deleted: true }
              goto: e2_jisu_album

  e2_jisu_true:
    actions:
      - say: { char: 서윤, with: [지수], text: "날 하린이라고 불러. 열여덟 전에 알던 사람일지도 몰라." }
      - say: { channel: action, with: [서윤, 지수], text: "지수가 숟가락을 내려놓는다." }
      - say: { char: 지수, with: [서윤], text: "하린이 누군데." }
      - say: { char: 서윤, with: [지수], text: "몰라." }
      - say: { char: 지수, with: [서윤], text: "……무서워?" }
      - say: { char: 서윤, with: [지수], text: "응." }
      - say: { char: 지수, with: [서윤], text: "그럼 나한테도 말해 줘. 그 사람한테만 말고." }
      - say: { channel: action, with: [서윤, 지수], text: "지수는 다시 숟가락을 든다. 국은 식어 있다." }
      - goto: e2_backdoor

  e2_jisu_album:
    actions:
      - say: { char: 서윤, with: [지수], text: "앨범 얘기만 했어." }
      - say: { char: 지수, with: [서윤], text: "알았어." }
      - say: { channel: action, with: [서윤, 지수], text: "지수는 더 묻지 않는다. 그날 밤 서윤은 연락처에서 '사진관'을 지운다." }
      - goto: e2_backdoor

  e2_backdoor:
    title: "뒷문"
    pov: "유하린"
    actions:
      - move: { id: 지수, style: exit }
      - move: { id: 서윤, style: exit }
      - say: { channel: card, with: [], text: "열한 해 전 · 3월 22일", autoAdvance: 1500 }
      - bg: { id: classroom, transition: cut }
      - music: neon
      - place: "점심시간 · 3학년 2반"
      - char: { id: 하린, position: left, emotion: blank }
      - char: { id: 아진, position: center }
      - char: { id: 민재, position: right }
      - say: { channel: action, with: [하린, 아진, 민재], text: "아진 옆 의자에 민재가 앉아 있다. 아진의 가방은 무릎 위에 있다." }
      - say: { channel: action, with: [하린, 아진, 민재], text: "하린은 맞은편에 식판을 놓는다." }
      - place: "방과 후"
      - say: { char: 하린.blank, with: [아진, 민재], text: "떡볶이 먹으러 가자. 사천 원밖에 없는데 반은 쏠게." }
      - say: { char: 민재, with: [하린, 아진], text: "나 뭐 좀 할 게 있어." }
      - say: { char: 아진, with: [하린, 민재], text: "이따가 둘이 얘기하자." }
      - move: { id: 아진, style: exit }
      - move: { id: 민재, style: exit }
      - say: { channel: action, with: [하린], text: "하린은 체육복을 가지러 먼저 교실로 돌아간다. 뒷문 유리에 시간표가 붙어 있어 안이 보이지 않는다." }
      - say: { channel: action, with: [하린], text: "문 밑 틈으로 실내화 두 켤레가 붙어 서 있다." }
      - say: { char: 아진, with: [하린], text: "오늘은 진짜 말하려고 했어. 우리 사귀는 거." }
