chapterTitle: "같은 군대"

script:
  - scene: new_leader
  - scene: overtime
  - scene: rumor

scenes:
  new_leader:
    title: "새 팀장"
    actions:
      - place: "월요일 아침 · 출근길 지하철"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 새 팀장님 오늘 오신대요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 9시반 B회의실. 커피 사오지 말래 팀장님이 쏘신대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 오 첫날부터 점수 따시네ㅋㅋ"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ"
      - bg: { id: office, transition: cut }
      - music: neon
      - place: "월요일 9:20 · 영업2팀"
      - char: { id: 도윤, position: left }
      - say:
          char: 도윤
          with: []
          text: "네, 영업2팀 한도윤입니다."
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "아, 이 번호 맞네요."
      - say:
          char: 준성
          with: [도윤]
          text: "고개 들어 봐요. 파티션 너머. 여기요."
      - move: { id: 도윤, toward: 준성, style: flinch }
      - say:
          char: 준성
          with: [도윤]
          text: "내선표 보고 하나씩 걸어 보는 중이었어요. 박준성입니다. 오늘부터 이 팀 맡게 됐어요."
      - say:
          char: 도윤.panic
          with: [준성]
          text: "…네. 반갑습니다. 처음 뵙—"
      - say:
          char: 준성
          with: [도윤]
          text: "처음 뵙겠습니다."
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 두 분 인사 토씨 하나 안 틀리고 똑같으심ㅋㅋ 같은 군대 나오셨나"
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "그러게요. 우리 같은 군대잖아요. 그쵸, 한대리님?"
      - move: { id: 준성, toward: 도윤, style: approach }
      - say:
          channel: action
          with: [준성, 도윤]
          text: "준성이 도윤에게만 보이게 한쪽 눈을 찡긋한다."
      - say:
          char: 도윤.smile
          with: [준성]
          text: "…하하. 그러게요."
      - move: { id: 준성, style: reset }

  overtime:
    title: "야근"
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - place: "목요일 21:30 · 빈 사무실"
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 도윤
          with: [준성]
          text: "그 화분, 집에서 가져오신 거예요?"
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "네. 사무실 공기가 별로라서요. 얘가 나보다 예민해요. 종이컵으로 반 컵, 그 이상 주면 삐져요."
      - say:
          char: 도윤
          with: [준성]
          text: "팀장님. 잠깐 얘기 좀 해도 될까요."
      - say:
          char: 준성
          with: [도윤]
          text: "네. 앉아요."
      - move: { id: 도윤, toward: 준성, style: approach }
      - say:
          char: 도윤
          with: [준성]
          text: "그날… 그거요. 없던 걸로 하죠. 괜히 말 나오면 서로 좋을 거 없잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "무슨 날이요?"
      - move: { id: 도윤, toward: 준성, style: retreat }
      - say:
          char: 도윤.panic
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "농담이에요. 난 말할 생각 없어요."
      - move: { id: 도윤, style: reset }
      - say:
          char: 준성
          with: [도윤]
          text: "근데 내 번호는 왜 차단했어요? 회사 일로 연락할 수도 있는데."
      - say:
          char: 도윤
          with: [준성]
          text: "…풀어 놓을게요."
      - say:
          char: 준성
          with: [도윤]
          text: "안 풀어도 돼요. 내선 있으니까."
      - say:
          char: 준성.tired
          with: [도윤]
          text: "나 이번 회사는 오래 다니고 싶어요. 그러니까 우리 그냥 일해요."
      - say:
          char: 준성
          with: [도윤]
          text: "들어가요. 결혼 준비 바쁠 텐데."

  rumor:
    title: "소문"
    actions:
      - place: "금요일 저녁 · 퇴근길"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 팀장님 오늘도 도윤대리님만 찾으심ㅋㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 아 그 윙크ㅋㅋㅋㅋ 나 소름돋았잖아"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: @한도윤 해명하세요"
      - choice:
          key: e1_rumor
          prompt: "팀원들이 해명을 기다린다. 입력 중… 표시가 떴다 사라지기를 세 번."
          with: []
          options:
            - text: "\"ㅋㅋ 군대 어디냐고 나도 물어봄\""
              goto: e1_laugh
            - text: "\"그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데\""
              add: { cruelty: 1 }
              goto: e1_deny
            - text: "읽기만 하고 폰을 엎어 둔다"
              goto: e1_ignore

  e1_laugh:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "ㅋㅋ군대 어디냐고 나도 물어봄"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: ㅋㅋㅋㅋ그래서요"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "말 안해줌"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 내일 점심 뭐 먹냐"
      - goto: e1_home

  e1_deny:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "그런 농담 하지 마요. 팀장님 좀 이상한 사람 같던데"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 오…"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 이상한 게 뭔데요??"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 읽씹ㅋㅋ 궁금하게 해놓고"
      - goto: e1_home

  e1_ignore:
    actions:
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 읽고 튀셨다"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 냅둬 결혼 준비 바쁘대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 그럼 더 수상한데ㅋㅋ"
      - goto: e1_home

  e1_home:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 900 }
      - place: "금요일 밤 · 도윤과 지수의 집"
      - say:
          channel: system
          with: []
          text: "나에게서 삭제 · 내 화면에서만 사라지며 다른 참여자에게는 그대로 보입니다."
      - say:
          channel: message
          side: them
          with: []
          erase: true
          text: "[영업2팀] 송과장: 둘이 진짜 아는 사이 아님? 군대ㅋㅋ"
      - add: { deleted: 1 }
      - say:
          char: 지수
          with: []
          text: "도윤아! 나 씻는다. 드레스 잔금 넣었어. 영수증 또 보냈으니까 그것도 지우지 마!"
      - say:
          char: 도윤
          with: []
          text: "어. 안 지워."
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - goto: e1_harin

  e1_harin:
    title: "하린"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - place: "점심시간 · 3학년 교실"
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say:
          char: 민재.laugh
          with: [하린, 아진]
          text: "아니 그니까 걔가 식판을 엎었는데, 지가 안 엎었대. 국이 바닥에 다 있는데."
      - say:
          char: 아진
          with: [하린, 민재]
          text: "미쳤나 봐 진짜. 근데 서민재, 너 여친 콩자반은 왜 니가 먹어."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "얘 콩 못 먹잖아. 아무튼 걔가—"
      - say:
          char: 하린
          with: [민재, 아진]
          text: "나 그거 봤어. 근데 걔 아니었어, 옆에 있던 애가 팔꿈치로—"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아진아 어제 보낸 노래 들었어?"
      - say:
          char: 아진
          with: [하린, 민재]
          text: "어, 듣다가 잠들었어. 좋아서 잠든 거야. 진짜로."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "무슨 노래?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "아, 너 이런 거 안 듣잖아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "…그치. 안 듣지."
      - say:
          channel: thought
          with: [민재, 아진]
          text: "나한텐 안 보냈네ㅋㅋ 아냐 괜찮아 어차피 안 들음 진짜로 안 들음"
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "하린아, 너도 들어 볼래? 한쪽."
      - choice:
          key: e1_harin
          prompt: "아진이 이어폰 한쪽을 내민다."
          char: 아진
          options:
            - text: "손사래를 친다. \"됐어 됐어, 둘이 들어.\""
              goto: e1_harin_smile
            - text: "웃으면서 묻는다. \"근데 민재야, 나한텐 왜 안 보냈어?\""
              goto: e1_harin_ask

  e1_harin_smile:
    actions:
      - say:
          char: 하린
          with: [민재, 아진]
          text: "됐어 됐어. 나 그런 거 관심 없다니까. 둘이 들어."
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "…응."
      - move: { id: 민재, toward: 아진, style: approach }
      - say:
          char: 민재
          with: [하린, 아진]
          text: "그럼 그거 나 줘."
      - goto: e1_harin_night

  e1_harin_ask:
    actions:
      - say:
          char: 하린
          with: [민재, 아진]
          text: "근데 민재야, 나한텐 왜 안 보냈어? 웃겨서 물어보는 거야."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "너 관심 없다며. 맨날 그러잖아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "아 맞다. 그랬지. ㅋㅋ 내가 그랬다."
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "아하하… 아 웃겨. 하린이 진짜 웃겨. 하하…"
      - goto: e1_harin_night

  e1_harin_night:
    actions:
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - place: "그날 밤 · 하린의 방"
      - say:
          channel: message
          side: them
          with: []
          text: "♥ 정아진님이 서민재님의 스토리를 좋아합니다"
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "ㅋㅋㅋ이거 완전 너잖아 @정아진"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          text: "나도 봤는데ㅋㅋ 이거 웃기다 나도 껴줘"
      - say:
          channel: system
          with: []
          text: "스크린샷 3장 · 최근 삭제된 항목에서 영구 삭제"
      - add: { deleted: 3 }
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 자?"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "낼 할 얘기 있어"
      - goto: /2.yaml
