<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>날짜 각인 약혼반지</title>
<g transform="rotate(-2 200 200)" stroke-linecap="round" stroke-linejoin="round">
<!-- 반지 상자 안감 -->
<rect x="62" y="58" width="276" height="220" rx="18" fill="#232a3b" stroke="#141823" stroke-width="4"/>
<path d="M92 210h216" stroke="#171c28" stroke-width="6"/>
