<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>서명한 동의서 위에 환자 이름표를 뒤집는 손</title>
  <defs>
    <linearGradient id="steel" x1=".2" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#657477"/>
      <stop offset=".45" stop-color="#465258"/>
      <stop offset="1" stop-color="#283038"/>
    </linearGradient>
    <radialGradient id="light" cx=".52" cy=".32" r=".66">
      <stop stop-color="#c7d3c6" stop-opacity=".28"/>
      <stop offset=".64" stop-color="#2c343b" stop-opacity="0"/>
      <stop offset="1" stop-color="#141820" stop-opacity=".73"/>
    </radialGradient>
    <linearGradient id="page" x1=".1" y1="0" x2="1" y2=".94" gradientUnits="objectBoundingBox">
      <stop stop-color="#e2dfd1"/>
      <stop offset=".61" stop-color="#bfc4bb"/>
      <stop offset="1" stop-color="#859595"/>
    </linearGradient>
    <linearGradient id="latex" x1="0" y1="0" x2=".58" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#dce7da"/>
      <stop offset=".53" stop-color="#a5b9b4"/>
      <stop offset="1" stop-color="#627c80"/>
    </linearGradient>
    <linearGradient id="label-back" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e4ddcb"/>
      <stop offset="1" stop-color="#adaea0"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="1" x2=".6" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#587c80"/>
      <stop offset="1" stop-color="#3a535e"/>
    </linearGradient>
    <pattern id="brushed" width="41" height="23" patternUnits="userSpaceOnUse">
      <path d="M0 7h41M5 13h31M19 20h16" fill="none" stroke="#d0d7ce" stroke-opacity=".06"/>
    </pattern>
    <pattern id="paper-grain" width="12" height="11" patternUnits="userSpaceOnUse">
      <path d="M2 1h2m2 4h4m-7 4h3" fill="none" stroke="#666c66" stroke-opacity=".12" stroke-width=".7"/>
    </pattern>
  </defs>
  <path fill="#202934" d="M0 0h1600v900H0z"/>
  <path fill="url(#steel)" d="M0 0h1600v798L0 883z"/>
  <path fill="url(#brushed)" d="M0 0h1600v798L0 883z"/>
  <path fill="url(#light)" d="M0 0h1600v900H0z"/>
