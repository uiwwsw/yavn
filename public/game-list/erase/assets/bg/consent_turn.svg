  <path d="M1600 54l-210 24-147 51-108 58-74 10-48 31-40 11-35 15-42-1-41 16c-17 7-20 20-9 28 7 7 23 3 34 0l36-10 29 1-35 23-35 12c-13 5-17 17-11 24 8 8 22 5 38 0l41-13 50-28 42-3 57-2c30-3 60-20 85-26l137-26 238 13z" fill="url(#latex)" stroke="#475b60" stroke-width="4.4" stroke-linejoin="round"/>
