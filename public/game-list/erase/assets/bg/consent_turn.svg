  <path d="M815 575c-5-8 36-40 53-36 10 1-21 31-12 30 15-2 43-43 54-43 14 0-15 31-8 33 6 1 30-22 45-21m-124 28c20 4 40-4 62-12" fill="none" stroke="#333c43" stroke-width="3.2" stroke-linecap="round"/>
