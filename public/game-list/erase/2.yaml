chapterTitle: "사고가 아니었다"

script:
  - scene: e3_clinic

scenes:
  e3_clinic:
    title: "상담실"
    actions:
      - say: { channel: card, with: [], text: "결혼 2주 전 · 화요일", autoAdvance: 1500 }
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - place: "ERASE 클리닉 3층 · 상담실"
      - char: { id: 도윤, position: right }
      - say: { channel: action, with: [도윤], text: "도윤에게는 서류가 한 장 있다. 2016년 3월 29일 자 퇴원 확인서. 발급처 ERASE 클리닉." }
      - say: { channel: thought, with: [], text: "열한 해 동안 사고 뒤 재활 병원 이름인 줄 알았다." }
      - char: { id: 상담사, position: left }
      - say: { char: 상담사, with: [도윤], text: "본인 확인됐습니다. 화면 보시겠어요?" }
      - say: { channel: record, with: [], text: "신청인 본인. 2016년 3월 29일 시술 완료. 시술 전 성명 유하린, 열여덟." }
      - bg: { id: surgery_reveal, transition: cut }
      - say: { channel: record, with: [], text: "동의서 사본 · 서명 유하린." }
      - say: { channel: action, with: [], text: "이름 끝에 작은 점이 있다. 도윤이 매번 찍는 자리다." }
      - say: { channel: thought, with: [], text: "사고가 아니었다. 내가 신청했다." }
      - say: { char: 상담사, with: [도윤], text: "저희 시술은 본인의 기억만 지웁니다. 다른 분들의 기억이나 기기 속 기록은 바뀌지 않아요." }
      - say: { char: 도윤.hollow, with: [상담사], text: "그럼 저를 기억하는 사람은요." }
      - say: { char: 상담사, with: [도윤], text: "그대로 기억하고 계시겠죠." }
      - say: { char: 상담사, with: [도윤], text: "같은 분이 두 번 받으시는 경우도 있어요. 원하시면 상담 날짜를 잡아 드릴게요." }
      - choice:
          key: e3_booking
          prompt: "상담사가 달력 화면을 연다."
          char: 상담사
          options:
            - text: "날짜를 잡는다"
              goto: e3_booked
            - text: "그냥 나온다"
              goto: e3_leave

  e3_booked:
    actions:
      - say: { char: 도윤, with: [상담사], text: "……잡아 주세요." }
      - say:
          channel: message
          thread: "ERASE 클리닉"
          side: them
          speakerName: "ERASE 클리닉"
          with: []
          text: "예약 완료 · 4월 27일(화) 오전 10시."
      - set: { booked: true }
      - goto: e3_school

  e3_leave:
    actions:
      - say: { channel: action, with: [도윤, 상담사], text: "도윤은 그냥 나온다." }
      - goto: e3_school

  e3_school:
    title: "3학년 2반"
    actions:
      - move: { id: 상담사, style: exit }
      - bg: { id: clinic_hall, transition: cut }
      - place: "1층 · 엘리베이터 앞"
      - say: { channel: action, with: [도윤], text: "엘리베이터에서 도윤은 아진에게 처음으로 먼저 메시지를 보낸다." }
      - say:
          channel: message
          thread: 정아진
          side: me
          char: 도윤
          with: []
          text: "하린이 다니던 학교, 어디예요?"
      - bg: { id: classroom, transition: fade, duration: 600 }
      - music: wind
      - place: "그날 밤 · 3학년 2반"
      - char: { id: 어른아진, position: left }
      - say: { channel: action, with: [어른아진], text: "아진은 교문 앞에 서 있었다. 그 학교 졸업 앨범을 해마다 아진이 찍는다고 했다. 경비 아저씨가 손을 흔들고 문을 열어 주었다." }
      - say: { channel: action, with: [어른아진], text: "창가 셋째 줄. 아진이 의자 하나를 끌어낸다." }
      - say: { char: 어른아진, with: [도윤], text: "여기가 걔 자리." }
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 앉지 않는다. 아진이 대신 옆자리에 앉는다." }
      - say: { char: 어른아진, with: [도윤], text: "그 주 목요일 밤에 반 단톡에 그게 올라왔어요. 유하린만 몰랐대. 뒷문에서 듣고 있었다던데. 해명하세요." }
      - say: { char: 어른아진, with: [도윤], text: "민재가 한 명한테만 말했대요. 그 한 명이 다 말했고요." }
      - say: { char: 어른아진, with: [도윤], text: "저는 그날 밤에 하린이한테 톡을 열한 개 보냈어요. 다 안 읽었어요. 다음 날 차단됐고요." }
      - say: { char: 도윤, with: [어른아진], text: "그리고요." }
      - say: { char: 어른아진, with: [도윤], text: "월요일에 하린이 어머니가 학교에 왔어요. 전학 간다고. 어디로 가냐고 물었더니 병원 이름을 알려 주셨어요." }
      - say: { char: 어른아진, with: [도윤], text: "다음 날 수업 빼고 갔어요. 비가 왔고요. 1층 유리문 밖에서 네 시간 기다렸어요. 처음 보는 사람이 나왔어요." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "근데 그 사람이 간호사 선생님 말을 듣고 웃더라고요. 눈이 없어지게. 그래서 알았어요." }
      - say: { char: 도윤.hollow, with: [어른아진], text: "……" }
      - say: { char: 어른아진, with: [도윤], text: "그 사람이 제 앞을 그냥 지나갔어요. 저를 안 봤어요. 우산 쓴 사람처럼 지나갔어요. 우산도 없으면서." }
      - say: { channel: action, with: [], text: "교실 시계가 한 칸 넘어간다." }
      - say: { char: 어른아진, with: [도윤], text: "원망하려고 하는 말 아니에요. 한 번은 말하고 싶었어요. 그 자리 비워 뒀다고." }
      - choice:
          key: e3_ajin
          prompt: "아진이 옆자리에 앉아 창밖을 본다."
          char: 어른아진
          options:
            - text: "미안하다고 한다"
              goto: e3_sorry
            - text: "그건 하린이라고 한다"
              goto: e3_not_me

  e3_sorry:
    actions:
      - say: { char: 도윤, with: [어른아진], text: "기억은 안 나요. 그래도, 미안해요." }
      - say: { channel: action, with: [어른아진], text: "아진이 웃는다. 이번엔 눈도 같이 웃는다." }
      - say: { char: 어른아진, with: [도윤], text: "기억 안 나는 사람이 왜 사과를 해." }
      - set: { sorry: true }
      - goto: e3_lab

  e3_not_me:
    actions:
      - say: { char: 도윤, with: [어른아진], text: "그건 제가 아니에요. 하린이죠." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "응. 맞아." }
      - say: { channel: action, with: [어른아진], text: "아진이 옆자리에서 일어선다. 의자는 제자리에 넣지 않는다." }
      - goto: e3_lab

  e3_lab:
    title: "과학실"
    pov: "유하린"
    actions:
      - move: { id: 어른아진, style: exit }
      - move: { id: 도윤, style: exit }
      - say: { channel: card, with: [], text: "열한 해 전 · 과학실", autoAdvance: 1500 }
      - bg: { id: science_room, transition: cut }
      - music: neon
      - char: { id: 하린, position: left }
      - char: { id: 아진, position: right }
      - sticker:
          id: e3_butterfly
          image: butterfly_sticker
          x: 50
          y: 45
          width: "clamp(200px, 35%, 400px)"
          enter: fadeIn
      - say: { channel: action, with: [하린], text: "하린은 나비 표본의 날개를 핀으로 고정하고 있다." }
      - say: { char: 아진, with: [하린], text: "그날 뒷문 앞에 있었어? 문이 움직였어." }
      - say: { char: 하린.blank, with: [아진], text: "배 아파서 먼저 갔어. 카레." }
      - say: { char: 아진, with: [하린], text: "그날 카레 안 나왔어. 닭볶음탕이었어. 너 급식표 찍어 두잖아." }
      - say: { channel: action, with: [하린], text: "핀이 날개 끝에서 미끄러진다." }
      - clearSticker: { id: e3_butterfly, leave: fadeOut }
      - say: { char: 아진.awkward, with: [하린], text: "내가 먼저 말했어야 했어. 미안해." }
      - say: { char: 하린, with: [아진], text: "뭐가 미안해. 너네 잘 어울려." }
      - say: { char: 아진, with: [하린], text: "내일 급식은 같이 먹자. 옆자리 비워 둘게. 민재는 따로 먹으라고 할게." }
      - move: { id: 아진, style: exit }
      - bg: { id: harin_room, transition: fade, duration: 600 }
      - place: "그날 밤 · 하린의 방"
      - sticker:
          id: e3_child_photo
          image: child_photo_sticker
          x: 50
          y: 45
          width: "clamp(180px, 32%, 350px)"
          enter: fadeIn
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 아진
          with: []
          text: "눈 없어질 때까지 웃는 거 아직도 똑같아. 너 저장해 둬. 지우지 말고."
      - say: { channel: action, with: [하린], text: "하린은 사진을 저장한다." }
      - clearSticker: { id: e3_child_photo, leave: fadeOut }
      - goto: /3.yaml
