chapterTitle: "소문"

script:
  - scene: count
  - scene: dig

scenes:
  count:
    title: "청첩장 수량"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 3주 전"
      - bg: { id: couple_home, transition: fade, duration: 900 }
      - music: static
      - say:
          channel: narration
          with: []
          text: "토요일 오전, 집. 지수는 웨딩홀 상담에 먼저 나갔고, 도윤은 식탁에 노트북을 펴 놓고 있다."
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "청첩장 수량 오늘까지 말해줘야 돼"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "실장님이 신랑님은 원래 상담 안 오세요? 이럼ㅋㅋ 원래 안 온다고 했어"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "150?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "회사는 몇 명인데"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "팀만 하면 열둘"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "새 팀장님도 드려? 인사는 해야지"
      - say:
          channel: system
          with: []
          text: "읽음"
      - wait: 1400

  dig:
    actions:
      - choice:
          key: e2_dig
          prompt: "노트북 검색창에 '박준성' 세 글자를 친다."
          with: []
          options:
            - text: "노트북을 덮고 지수한테 \"150장\"이라고 보낸다"
              goto: e2_elevator
            - text: "인스타를 맨 처음 게시물까지 내려 본다"
              when: { var: e2_sns, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_sns: true }
              goto: e2_dig_sns
            - text: "회의 때 팀장님 폰에 뜬 알림을 메모장에 적는다"
              when: { var: e2_hospital, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_hospital: true }
              goto: e2_dig_hospital
            - text: "단톡방에 \"팀장님 전 회사에서 왜 나왔는지 아는 사람?\""
              when: { var: e2_leaked, op: eq, value: false }
              add: { cruelty: 2 }
              set: { e2_leaked: true }
              goto: e2_dig_leak

  e2_dig_sns:
    actions:
      - say:
          channel: action
          with: []
          text: "준성의 인스타그램은 공개 계정이다. 게시물이 많지 않아 맨 처음까지 금방 내려간다."
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2019.08.02 · 이사 끝. 화분 셋, 사람 하나"
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2021.03.14 · 오늘도 약 잘 챙겨 먹은 나 칭찬해🙂"
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2023.11.30 · 반년 연속 굿. 선생님이 하이파이브 해줌"
      - say:
          channel: action
          with: []
          text: "하트를 누를 뻔한다. 도윤은 손가락을 화면에서 떼고, 방문 기록을 지운다."
      - goto: dig

  e2_dig_hospital:
    actions:
      - say:
          channel: action
          with: []
          text: "목요일 회의 때 테이블에 화면이 위로 놓인 팀장 폰이 한 번 켜졌었다. '감염내과 정기 진료 안내'. 옆자리 송과장도 고개를 돌렸었다. 도윤은 그 문구를 메모장에 그대로 적고, 메모 제목을 '장보기'로 바꾼다."
      - goto: dig

  e2_dig_leak:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "근데 팀장님 전 회사에서 왜 나왔는지 아는 사람?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 왜요??"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 뭐 들은 거 있어?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "아니 그냥 좀 이상한 얘기를 들어서"
      - say:
          channel: system
          with: []
          text: "삭제된 메시지입니다 · 읽은 사람 3"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 뭔데뭔데ㅔ 왜 지움"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 월요일 점심때 얘기해ㅋㅋ"
      - goto: dig

  e2_elevator:
    title: "엘리베이터"
    actions:
      - bg: { id: office_night, transition: cut }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "월요일 밤 아홉 시 넘어, 회사 엘리베이터 앞. 둘뿐이다. 13층에서 1층까지는 생각보다 길다."
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "결혼식 토요일이죠. 송과장님한테 들었어요."
      - say:
          char: 도윤
          with: [준성]
          text: "네."
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "이런 경우엔 축의금 얼마 해야 돼요? 인터넷에 안 나오던데."
      - say:
          char: 도윤
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "…재미없었네요. 미안해요."
      - say:
          char: 준성
          when: { var: e2_leaked, op: eq, value: true }
          with: [도윤]
          text: "오늘 점심시간에 내 얘기 많이 하던데요. 탕비실 벽이 얇아요."
      - choice:
          key: e2_threat
          prompt: "층수 표시가 7을 지난다."
          char: 도윤
          options:
            - text: "층수 표시만 본다"
              goto: e2_threat_silent
            - text: "\"형도 조심해요. 세상 좁아요.\""
              add: { cruelty: 2 }
              goto: e2_threat_said

  e2_threat_said:
    actions:
      - say:
          char: 도윤
          with: [준성]
          text: "형도 조심해요. 세상 좁아요."
      - say:
          char: 준성.tired
          with: [도윤]
          text: "…형?"
      - say:
          char: 준성
          with: [도윤]
          text: "그날은 형이라고 안 했잖아요."
      - say:
          channel: action
          with: [준성, 도윤]
          text: "1층. 문이 열리자 준성이 먼저 내린다. 돌아보지 않는다."
      - goto: e2_absent

  e2_threat_silent:
    actions:
      - say:
          channel: action
          with: [준성, 도윤]
          text: "4, 3, 2. 문이 열린다. 준성이 열림 버튼을 누른 채 기다린다."
      - say:
          char: 준성
          with: [도윤]
          text: "먼저 가요."
      - say:
          char: 도윤
          with: [준성]
          text: "…수고하셨습니다."
      - goto: e2_absent

  e2_absent:
    title: "결근"
    actions:
      - bg: { id: office, transition: fade, duration: 900 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "결혼을 두 주 앞둔 월요일, 준성이 출근하지 않았다. 화요일에도, 수요일에도. 모니터 옆 화분은 사흘째 아무도 물을 주지 않았다."
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 팀장님 오늘도 안 나오심?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 병가래요 인사팀 언니가 그러는데 기한 없대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 기한 없는 병가도 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 근데 그 병 있잖아… 아 아니다"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 뭔데요 그 병"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 회의 때 팀장님 폰에 감염내과 어쩌고 뜨는 거 봤어 나만 본 거 아님"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 헐 그럼 같이 밥 먹은 사람들 괜찮은 거임?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 밥 먹는 걸로는 안 옮아요 오대리님ㅋㅋ 검색 좀 하세요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 아 그래도 찝찝하잖아요"
      - say:
          channel: message
          side: them
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "[영업2팀] 윤주임: 근데 전 회사 얘기는 처음에 도윤대리님이 꺼낸 거 아니에요?"
      - say:
          channel: message
          side: them
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "[영업2팀] 송과장: 그건 그거고"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 도윤대리는 좀 알지 않아? 제일 많이 붙어 있었잖아"
      - char: { id: 도윤, position: center }
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "저도 그날 이후로는 연락을"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "저도 몰라요"
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - goto: e2_harin

  e2_harin:
    title: "체육복"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - say:
          channel: narration
          with: []
          camera: wide
          text: "며칠 뒤, 방과 후. 하린은 사물함에 두고 간 체육복을 가지러 계단을 두 칸씩 올라왔다. 뒷문이 한 뼘 열려 있다."
      - char: { id: 민재, position: left }
      - char: { id: 아진, position: right }
      - say:
          channel: action
          with: [민재, 아진]
          text: "문틈으로 빈 교실이 보인다. 민재와 아진이 책상 하나에 나란히 앉아 있다. 민재가 아진의 손가락을 하나씩 만지작거린다."
      - say:
          char: 아진.awkward
          with: [민재]
          delivery: whisper
          text: "오늘 하린이한테 말하려고 했는데… 우리 얘기. 못 했어."
      - say:
          char: 민재
          with: [아진]
          text: "뭘 말해. 걔 신경 안 쓸걸. 원래 아무 데도 관심 없잖아."
      - say:
          char: 아진
          with: [민재]
          text: "너는 걔를 몰라."
      - say:
          char: 민재
          with: [아진]
          text: "넌 알아?"
      - say:
          char: 아진.awkward
          with: [민재]
          text: "……"
      - say:
          channel: thought
          with: []
          text: "체육복 내일 가져가면 됨. 내일 해도 됨. 지금 아니어도 됨"
      - say:
          channel: action
          with: []
          text: "하린은 문고리에서 손을 뗀다. 복도 끝까지, 실내화를 끌지 않고 걷는다."
      - add: { deleted: 1 }
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - say:
          channel: narration
          with: []
          text: "그날 밤, 하린의 방."
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 오늘 왜 먼저 갔어"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "아 나 배아파서ㅋㅋ 급식 그 카레 뭔가 이상했음"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "할 얘기 있었는데"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "낼 해 낼!! 나 잔다 굿밤"
      - goto: /3.yaml
