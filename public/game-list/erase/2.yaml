chapterTitle: "소문"

script:
  - scene: count
  - scene: dig

scenes:
  count:
    title: "청첩장 수량"
    actions:
      - say:
          channel: card
          with: []
          text: "현재 · 결혼 3주 전\n도윤과 지수의 집"
      - bg: { id: couple_home, transition: cut }
      - music: static
      - place: "토요일 오전 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { char: 지수.warm, with: [도윤], text: "네 컵 씻어 놨어. 커피 아직 따뜻해." }
      - say: { char: 도윤, with: [지수], text: "오늘도 식장 가? 두 시?" }
      - say: { char: 지수, with: [도윤], text: "응. 청첩장 몇 장 찍을지 오늘까지 말해 줘야 된대." }
      - say: { char: 도윤, with: [지수], text: "나도 갈게." }
      - say: { char: 지수, with: [도윤], text: "진짜지? 지난번엔 나 혼자 앉혀 놓고 자꾸 신랑님은요, 신랑님은요 하더라." }
      - say: { char: 도윤.smile, with: [지수], text: "견적서 챙겨 놔. 내가 물어볼게." }
      - say: { char: 지수.warm, with: [도윤], text: "한 시 반에 나갈 거야. 회사 명단은 그 전에 적어 놔. 늦으면 나 먼저 간다." }
      - place: "같은 날 14:10 · 지수가 먼저 나간 집"
      - say: { channel: action, with: [도윤], text: "노트북에 회사 명단이 열려 있다. 맨 윗줄 ‘팀장 박준성’ 다음으로 한 줄도 못 적었다." }
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "나 먼저 식장 들어왔어. 수량 오늘까지 말해줘야 돼"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "실장님이 신랑님 오늘도 안 오시냐더라ㅋㅋ 다음엔 끌고 온다고 했어"
      - say:
          channel: message
          thread: 지수
          side: me
          char: 도윤
          with: []
          text: "150?"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "150장으로 해? 물음표 빼고 말해줘"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "회사는 몇 명인데"
      - say:
          channel: message
          thread: 지수
          side: me
          char: 도윤
          with: []
          text: "팀만 하면 열둘"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "새 팀장님도 드려? 인사는 해야지"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "식장에서 나도 인사드릴게. 프린터 못 찾는 분ㅋㅋ"
      - say:
          channel: system
          with: []
          text: "읽음"
      - wait: 1400

  dig:
    actions:
      - choice:
          key: e2_dig
          prompt: "‘새 팀장님도 드려?’에 아직 답을 못 했다. 도윤은 검색창에 ‘박준성’을 쳐 놓았다."
          with: []
          options:
            - text: "검색을 그만두고 지수에게 답장한다"
              saveText: "노트북을 덮고 지수한테 \"150장\"이라고 보낸다"
              goto: e2_answer_jisu
            - text: "준성의 첫 인스타 게시물을 찾는다"
              saveText: "인스타를 맨 처음 게시물까지 내려 본다"
              when: { var: e2_sns, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_sns: true }
              goto: e2_dig_sns
            - text: "준성의 휴대폰 알림을 메모한다"
              saveText: "회의 때 팀장님 폰에 뜬 알림을 메모장에 적는다"
              when: { var: e2_hospital, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_hospital: true }
              goto: e2_dig_hospital
            - text: "단톡방에 준성의 퇴사 이유를 묻는다"
              saveText: "단톡방에 \"팀장님 전 회사에서 왜 나왔는지 아는 사람?\""
              when: { var: e2_leaked, op: eq, value: false }
              add: { cruelty: 2 }
              set: { e2_leaked: true }
              goto: e2_dig_leak

  e2_answer_jisu:
    actions:
      - say: { channel: message, thread: 지수, side: me, char: 도윤, with: [], text: "150장. 팀장님 건 내가 물어볼게. 오늘 못 가서 미안" }
      - goto: e2_elevator

  e2_dig_sns:
    actions:
      - say:
          channel: message
          thread: "박준성 · 게시물"
          side: them
          char: 준성
          with: []
          text: "2019.08.02 · 이사 끝. 화분 셋, 사람 하나"
      - say:
          channel: message
          thread: "박준성 · 게시물"
          side: them
          char: 준성
          with: []
          text: "2021.03.14 · 오늘도 약 잘 챙겨 먹은 나 칭찬해🙂"
      - say:
          channel: message
          thread: "박준성 · 게시물"
          side: them
          char: 준성
          with: []
          text: "2023.11.30 · 반년 연속 굿. 선생님이 하이파이브 해줌"
      - say:
          channel: system
          with: []
          erase: true
          wait: 700
          text: "최근 검색 · 박준성 — 삭제됨"
      - goto: dig

  e2_dig_hospital:
    actions:
      - say:
          channel: record
          with: []
          text: "새 메모\n목 회의 · 팀장님 휴대폰 화면에서 봄\n‘감염내과 정기 진료 안내’\n송과장님도 봄"
      - say:
          channel: system
          with: []
          text: "메모 제목 변경 · 장보기"
      - goto: dig

  e2_dig_leak:
    actions:
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "근데 팀장님 전 회사에서 왜 나왔는지 아는 사람?"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "왜요??"
          autoAdvance: 1312
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "뭐 들은 거 있어?"
          autoAdvance: 1504
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          erase: true
          wait: 700
          text: "아니 그냥 좀 이상한 얘기를 들어서"
      - say:
          channel: system
          with: []
          text: "삭제된 메시지입니다 · 읽은 사람 3"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "뭔데뭔데ㅔ 왜 지움"
          autoAdvance: 1504
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "월요일 점심때 얘기해ㅋㅋ"
          autoAdvance: 1600
      - goto: dig

  e2_elevator:
    title: "엘리베이터"
    actions:
      - bg: { id: office_night, transition: cut }
      - place: { text: "아흐레 뒤 월요일 21:10 · 회사 13층 엘리베이터", presentation: center }
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "같이 타요. 문 잡아 줘서 고마워요."
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…네."
      - say:
          char: 준성
          with: [도윤]
          text: "보고 자료 잘 받았어요. 3페이지 숫자 두 개만 내일 다시 봐 줘요, 합계가 4페이지랑 안 맞아서."
      - say:
          char: 도윤
          with: [준성]
          text: "확인할게요."
      - say:
          char: 준성
          motion: headtilt
          with: [도윤]
          text: "요즘 제가 탕비실 들어가면 한대리님은 컵도 안 씻고 나가시더라고요."
      - say:
          char: 도윤
          with: [준성]
          text: "…우연이에요."
      - say:
          char: 준성
          with: [도윤]
          text: "그날 얘긴 회사에서 한 번도 안 했어요. 연락도 내선으로만 했고요."
      - say:
          char: 준성.tired
          with: [도윤]
          text: "그래도 인사는 하고 지낼 줄 알았어요."
      - say:
          char: 준성
          when: { var: e2_leaked, op: eq, value: true }
          with: [도윤]
          text: "단톡에 제 전 회사 물어보셨다면서요. 지난주 내내 점심마다 그 얘기던데, 저 탕비실에 있었어요."
      - move: { id: 도윤, toward: 준성, style: retreat }
      - say:
          char: 도윤
          motion: tremble
          with: [준성]
          text: "……"
      - mood: { tone: dread, level: 2 }
      - say:
          char: 준성
          with: [도윤]
          text: "송과장님이 청첩장 돌린다던데요. 저도 가도 되죠?"
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "팀장이 안 가면 그게 더 말 나와요. 밥은 안 먹고 올게요, 식대 비싸다면서요."
      - choice:
          key: e2_threat
          prompt: "7층 표시를 지나자 귀가 먹먹해진다."
          char: 도윤
          options:
            - text: "아무 말도 하지 않는다"
              saveText: "층수 표시만 본다"
              goto: e2_threat_silent
            - text: "준성에게 경고한다"
              saveText: "\"형도 조심해요. 세상 좁아요.\""
              add: { cruelty: 2 }
              goto: e2_threat_said

  e2_threat_said:
    actions:
      - move: { id: 도윤, toward: 준성, style: lunge, wait: true }
      - say:
          char: 도윤
          with: [준성]
          text: "형도 조심해요. 세상 좁아요."
      - say:
          char: 준성.tired
          motion: headtilt
          with: [도윤]
          text: "…형?"
      - say:
          char: 준성
          with: [도윤]
          text: "그날은 형이라고 안 했잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "…청첩장은 안 받을게요."
      - say:
          char: 도윤
          motion: tremble
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "3페이지 숫자, 내일 그것만 고쳐 줘요."
      - say:
          channel: system
          with: []
          text: "1층입니다. 문이 열립니다."
      - emote: { id: 도윤, motion: droop }
      - say:
          channel: action
          with: [도윤]
          text: "준성이 돌아보지 않고 먼저 내린다."
      - move: { id: 도윤, style: reset }
      - goto: e2_absent

  e2_threat_silent:
    actions:
      - say:
          char: 준성
          with: [도윤]
          text: "…대답은 천천히 해요. 어느 쪽으로 가요? 저는 요 앞 오피스텔이라 걸어가요."
      - say:
          char: 도윤
          with: [준성]
          text: "…저도 그쪽이에요."
      - say:
          char: 준성
          with: [도윤]
          text: "그렇구나. 조심히 들어가요."
      - say:
          channel: system
          with: []
          text: "1층입니다. 문이 열립니다."
      - say:
          char: 준성
          with: [도윤]
          text: "먼저 가요."
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…수고하셨습니다."
      - say:
          channel: action
          with: []
          text: "준성이 먼저 내린다. 도윤은 문이 닫힐 때까지 기다렸다가 열림 버튼을 누른다."
      - say:
          channel: system
          with: []
          text: "1층입니다. 문이 열립니다."
      - say:
          channel: action
          with: []
          text: "발소리가 안 들릴 때까지 서 있다가 내린다."
      - move: { id: 도윤, style: reset }
      - goto: e2_absent

  e2_absent:
    title: "결근"
    actions:
      - mood: off
      - bg: { id: office, transition: fade, duration: 900 }
      - place: { text: "수요일 오후 · 영업2팀", presentation: center }
      - say: { channel: action, with: [도윤], text: "준성의 자리가 오늘도 비어 있다." }
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "팀장님 오늘도 안 나오심? 어제부터 자리 비었네"
          autoAdvance: 1920
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "병가래요 인사팀 언니가 그러는데 기한 없대"
          autoAdvance: 1920
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "기한 없는 병가도 있어요?"
          autoAdvance: 1632
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "회의 때 폰에 감염내과 뜬 거 봤는데, 그거 때문인가"
          autoAdvance: 2400
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "오대리"
          side: them
          with: []
          text: "헐 그럼 같이 밥 먹은 사람들 괜찮은 거임?"
          autoAdvance: 1952
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "병원 이름만 봤잖아요. 밥 먹고 옮는다는 말은 어디서 나온 거예요"
          autoAdvance: 2144
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "근데 전 회사 얘기는 처음에 도윤대리님이 꺼낸 거 아니에요?"
          autoAdvance: 2240
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "도윤대리는 좀 알지 않아? 제일 많이 붙어 있었잖아"
          autoAdvance: 2080
      - char: { id: 도윤, position: center }
      - say:
          channel: action
          with: [도윤]
          text: "답장 칸에 ‘저도 그날 이후로는’까지 썼다가 전부 지운다."
      - emote: { id: 도윤, motion: droop }
      - say:
          channel: message
          thread: "영업2팀"
          side: me
          char: 도윤
          with: []
          text: "저도 몰라요"
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "팀장님 자리 화분은 제가 물 줄게요"
          autoAdvance: 1504
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "잎이 처져서요. 반 컵씩만 줄게요"
          autoAdvance: 1664
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "그런 거 왜 네가 해"
          autoAdvance: 1536
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "제 자리에서 제일 가까워서요"
          autoAdvance: 1664
      - say:
          channel: action
          with: []
          text: "도윤은 단톡방 알림을 끄고 사내 연락망에서 박준성을 찾는다."
      - say:
          channel: system
          with: []
          text: "박준성 팀장 · 휴대전화
통화 · 메시지"
      - say:
          channel: action
          with: []
          text: "통화 버튼 위에서 엄지가 멈춘다. 화면이 꺼진다."
      - say:
          channel: card
          with: []
          text: "11년 전\n유하린 · 18세"
      - goto: e2_harin

  e2_harin:
    pov: "유하린"
    title: "체육복"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - place: "며칠 뒤 청소시간 · 3학년 교실"
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "야 오늘 야자 째자. 나 오늘 진짜 못 하겠어."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "야, 떡볶이 먹으러 가자. 그 집 일곱 시에 닫잖아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "내가 쏠게. 아니다 내가 반 쏠게. 나 지금 사천 원 있어."
      - say:
          char: 아진
          motion: laugh
          with: [하린, 민재]
          text: "사천 원으로 뭘 반을 쏴ㅋㅋ"
      - say:
          char: 하린
