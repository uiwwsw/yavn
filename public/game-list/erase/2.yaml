chapterTitle: "흔적"

script:
  - scene: gone
  - scene: search

scenes:
  gone:
    title: "결근"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29"
      - bg: { id: office, transition: fade, duration: 800 }
      - music: static
      - say:
          channel: narration
          with: []
          camera: wide
          text: "준성의 자리가 사흘째 비어 있다. 모니터에 붙은 포스트잇이 바람에 들린다."
      - say:
          channel: message
          side: them
          with: []
          text: "[단톡] 팀장님 돌아가셨대… 병이었대. 그 병 있잖아"
      - say:
          channel: message
          side: them
          with: []
          text: "[단톡] 헐 그럼 도윤 대리는? ㅋㅋ 아 이건 아닌가"
      - char: { id: 도윤, position: center }
      - say:
          char: 도윤.panic
          with: []
          text: "…아니야."
      - say:
          channel: thought
          with: []
          text: "확인된 건 하나도 없다. 소문만 있다. 그런데 소문이 제일 빠르다."

  search:
    actions:
      - bg: { id: office_night, transition: fade, duration: 800 }
      - choice:
          key: e2_search
          presentation: explore
          prompt: "모두 퇴근했다. 무엇을 열까?"
          with: []
          camera: wide
          options:
            - text: "검색창"
              at: { x: 35, y: 40 }
              when: { var: e2_search, op: eq, value: false }
              goto: e2_search_scene
            - text: "사진첩"
              at: { x: 68, y: 50 }
              when: { var: e2_gallery, op: eq, value: false }
              goto: e2_gallery_scene
            - text: "집으로 간다"
              when:
                all:
                  - { var: e2_search, op: eq, value: true }
                  - { var: e2_gallery, op: eq, value: true }
              goto: e2_jisu

  e2_search_scene:
    actions:
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "HIV 증상 언제부터"
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "HIV 검사 익명 가능"
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "검색 기록 완전 삭제 방법"
      - say:
          channel: thought
          with: []
          text: "찾고, 지우고, 다시 찾는다. 손가락이 떨려서 오타가 난다. 오타도 지운다."
      - add: { deleted: 3 }
      - set: { e2_search: true }
      - goto: search

  e2_gallery_scene:
    actions:
      - sticker:
          id: e2_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: narration
          with: []
          text: "사진첩 맨 아래. 놀이터에서 웃고 있는 어린 아이. 언제 저장했는지 기억나지 않는다."
      - say:
          channel: thought
          with: []
          text: "이건… 지우면 안 되는 것 같다. 왜인지는 모르겠다."
      - choice:
          key: e2_photo
          prompt: "엄지가 '삭제' 위에서 멈춘다."
          with: []
          options:
            - text: "남겨 둔다"
              set: { kept_photo: true }
              goto: e2_photo_keep
            - text: "지운다"
              goto: e2_photo_delete

  e2_photo_keep:
    actions:
      - get: child_photo
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "도윤은 사진첩을 닫는다. 지우지 않은 것이 하나 생겼다. 이상하게 숨이 쉬어진다."
      - set: { e2_gallery: true }
      - goto: search

  e2_photo_delete:
    actions:
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: action
          with: []
          erase: true
          text: "아이의 웃음이 회색 사각형으로 바뀐다. 최근 삭제 항목. 영구 삭제."
      - add: { deleted: 1 }
      - set: { e2_gallery: true }
      - goto: search

  e2_jisu:
    title: "지수"
    actions:
      - bg: { id: dawn_room, transition: fade, duration: 800 }
      - music: cold_room
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "요즘 왜 이렇게 멀어? 밥 먹을 때도 폰만 보고. 화면은 꼭 엎어 두고."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "말했잖아. 숨기는 거 싫다고. 한 번만 물을게. 무슨 일 있어?"
      - choice:
          key: e2_jisu
          prompt: "지수가 휴대폰을 가리킨다."
          char: 지수
          options:
            - text: "\"일이 많아서.\" 웃는다"
              goto: e2_jisu_lie
            - text: "\"…회사에 일이 좀 있어. 나도 아직 정리가 안 됐어.\" 일부만 말한다"
              set: { told_jisu: 1 }
              goto: e2_jisu_part
            - text: "\"다 말할게. 듣고 나서 정해.\" 전부 말한다"
              set: { told_jisu: 2 }
              goto: e2_jisu_all

  e2_jisu_lie:
    actions:
      - say:
          char: 도윤.smile
          with: [지수]
          text: "일이 많아서 그래. 결혼 준비까지 겹쳐서."
      - say:
          char: 지수
          with: [도윤]
          text: "…그래. 그렇다고 해 둘게."
      - say:
          channel: thought
          with: [지수]
          text: "지수가 알면 끝이야. 완성되기 직전인데."
      - goto: e2_harin

  e2_jisu_part:
    actions:
      - say:
          char: 도윤
          with: [지수]
          text: "회사에 일이 좀 있어. 나랑 엮인 소문. 나도 아직 정리가 안 됐어."
      - say:
          char: 지수
          with: [도윤]
          text: "정리되면 말해 줘. 꼭 네 입으로. 남한테 듣는 건 못 견뎌."
      - say:
          channel: thought
          with: [지수]
          text: "처음으로 지우지 않고 남긴 문장. 반만큼이지만."
      - goto: e2_harin

  e2_jisu_all:
    actions:
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "클럽에서 만난 사람이 있었어. 남자야. 그 사람이 우리 팀장으로 왔고… 지금 없어졌어."
      - say:
          channel: action
          with: [지수]
          text: "지수는 한참 동안 아무 말도 하지 않는다. 손톱으로 반지를 돌린다."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "검사는 받았어?"
      - say:
          char: 도윤
          with: [지수]
          text: "…아니."
      - say:
          char: 지수
          with: [도윤]
          text: "받아. 그건 날 위해서가 아니라 너를 위해서야. 나머지는… 나도 생각할 시간이 필요해."
      - goto: e2_harin

  e2_harin:
    actions:
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - bg: { id: classroom, transition: fade, duration: 800 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "방과 후 빈 교실. 하린은 두고 간 체육복을 찾으러 돌아왔다. 문틈으로 두 사람이 보인다."
      - char: { id: 민재, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 아진.awkward
          with: [민재]
          delivery: whisper
          text: "하린이한테는… 언제 말할 거야?"
      - say:
          char: 민재
          with: [아진]
          text: "걔는 괜찮을걸. 원래 아무 데도 관심 없잖아."
      - char: { id: 하린, position: center }
      - say:
          char: 하린.cry
          with: []
          channel: thought
          text: "들어가면 끝난다. 안 들어가면… 아무 일도 없었던 거다."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "내가 조용하면… 완벽해 보여."
      - say:
          channel: action
          with: []
          erase: true
          text: "하린은 발소리를 죽이고 돌아선다. 방금 본 것을, 보지 않은 것으로 만든다."
      - add: { deleted: 1 }
      - goto: /3.yaml
