chapterTitle: "소문"

script:
  - scene: count
  - scene: dig

scenes:
  count:
    title: "청첩장 수량"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 3주 전"
      - bg: { id: couple_home, transition: fade, duration: 900 }
      - music: static
      - place: "토요일 오전 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "일어났어? 커피 내려놨어. 식었겠다."
      - say:
          char: 지수
          with: [도윤]
          text: "근데 양말은 왜 하나만 벗어 놓고 자. 이게 제일 이해가 안 돼."
      - say:
          char: 도윤.smile
          with: [지수]
          text: "그게 이해가 되면 나랑 결혼 안 했겠지."
      - say:
          char: 지수
          motion: puff
          with: [도윤]
          text: "말은 잘해. 설거지는 안 하고."
      - say:
          char: 도윤
          motion: perk
          with: [지수]
          text: "어제 했어. 새벽에."
      - say:
          char: 지수
          with: [도윤]
          text: "프라이팬 빼고 했지. 프라이팬은 불려 놨다 그럴 거지."
      - say:
          char: 도윤
          with: [지수]
          text: "…불려 놨어."
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "이틀째 불어 있어. 그 정도면 수영하는 거야."
      - say:
          char: 지수
          with: [도윤]
          text: "나 이따 두 시에 상담 가. 청첩장 수량 오늘까지 말해 줘야 돼."
      - say:
          char: 도윤
          with: [지수]
          text: "같이 갈까."
      - say:
          char: 지수
          with: [도윤]
          text: "…지금 말해?"
      - say:
          char: 도윤
          with: [지수]
          text: "가면 안 돼?"
      - say:
          char: 지수.warm
          with: [도윤]
          text: "되지. 되는데 너 두 시에 자고 있을걸."
      - say:
          char: 지수
          with: [도윤]
          text: "자면 깨우지도 않을 거야. 혼자 갔다 올게. 수량만 정해."
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "청첩장 수량 오늘까지 말해줘야 돼"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "실장님이 신랑님은 원래 상담 안 오세요? 이럼ㅋㅋ 원래 안 온다고 했어"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "150?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "물음표 좀 빼 결정을 해"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "회사는 몇 명인데"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "팀만 하면 열둘"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "새 팀장님도 드려? 인사는 해야지"
      - say:
          channel: system
          with: []
          text: "읽음"
      - wait: 1400

  dig:
    actions:
      - choice:
          key: e2_dig
          prompt: "노트북 검색창에 '박준성' 세 글자를 친다."
          with: []
          options:
            - text: "노트북을 덮고 지수한테 \"150장\"이라고 보낸다"
              goto: e2_elevator
            - text: "인스타를 맨 처음 게시물까지 내려 본다"
              when: { var: e2_sns, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_sns: true }
              goto: e2_dig_sns
            - text: "회의 때 팀장님 폰에 뜬 알림을 메모장에 적는다"
              when: { var: e2_hospital, op: eq, value: false }
              add: { cruelty: 1 }
              set: { e2_hospital: true }
              goto: e2_dig_hospital
            - text: "단톡방에 \"팀장님 전 회사에서 왜 나왔는지 아는 사람?\""
              when: { var: e2_leaked, op: eq, value: false }
              add: { cruelty: 2 }
              set: { e2_leaked: true }
              goto: e2_dig_leak

  e2_dig_sns:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2019.08.02 · 이사 끝. 화분 셋, 사람 하나"
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2021.03.14 · 오늘도 약 잘 챙겨 먹은 나 칭찬해🙂"
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "2023.11.30 · 반년 연속 굿. 선생님이 하이파이브 해줌"
      - say:
          channel: system
          with: []
          erase: true
          text: "최근 검색 · 박준성 — 삭제됨"
      - goto: dig

  e2_dig_hospital:
    actions:
      - say:
          channel: record
          with: []
          text: "새 메모\n목 회의 · 팀장님 폰(화면 위로 놓여 있었음)\n'감염내과 정기 진료 안내'\n송과장님도 봄"
      - say:
          channel: system
          with: []
          text: "메모 제목을 '장보기'(으)로 변경했습니다."
      - goto: dig

  e2_dig_leak:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "근데 팀장님 전 회사에서 왜 나왔는지 아는 사람?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 왜요??"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 뭐 들은 거 있어?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "아니 그냥 좀 이상한 얘기를 들어서"
      - say:
          channel: system
          with: []
          text: "삭제된 메시지입니다 · 읽은 사람 3"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 뭔데뭔데ㅔ 왜 지움"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 월요일 점심때 얘기해ㅋㅋ"
      - goto: dig

  e2_elevator:
    title: "엘리베이터"
    actions:
      - bg: { id: office_night, transition: cut }
      - place: "월요일 21:10 · 회사 엘리베이터 13층"
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: [도윤]
          text: "같이 타요. 문 잡아 줘서 고마워요."
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…네."
      - say:
          char: 준성
          with: [도윤]
          text: "오늘 프린터 또 걸렸던데요. 복도 끝에 사람들 줄 서 있더라고요."
      - say:
          char: 도윤
          with: [준성]
          text: "3번 트레이 쓰시면 돼요. 아무도 안 쓰는 트레이예요."
      - say:
          char: 준성
          with: [도윤]
          text: "내일 보고 자료 다 됐어요?"
      - say:
          char: 도윤
          with: [준성]
          text: "네. 메일 보내 뒀어요."
      - say:
          char: 준성
          with: [도윤]
          text: "봤어요. 숫자 두 개만 다시 봐 줘요. 3페이지 하단."
      - say:
          char: 도윤
          with: [준성]
          text: "…네."
      - say:
          char: 준성
          with: [도윤]
          text: "틀렸다는 건 아니고, 내가 이해가 안 돼서요."
      - say:
          char: 준성
          with: [도윤]
          text: "결혼식 토요일이죠. 송과장님한테 들었어요."
      - say:
          char: 도윤
          with: [준성]
          text: "네."
      - say:
          char: 준성.smirk
          motion: headtilt
          with: [도윤]
          text: "이런 경우엔 얼마 해야 돼요? 인터넷에 안 나오던데."
      - move: { id: 도윤, toward: 준성, style: retreat }
      - say:
          char: 도윤
          motion: tremble
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "…재미없었네요. 미안해요."
      - say:
          char: 준성
          when: { var: e2_leaked, op: eq, value: true }
          with: [도윤]
          text: "오늘 점심시간에 내 얘기 많이 하던데요. 탕비실 벽이 얇아요."
      - choice:
          key: e2_threat
          prompt: "층수 표시가 7을 지난다."
          char: 도윤
          options:
            - text: "층수 표시만 본다"
              goto: e2_threat_silent
            - text: "\"형도 조심해요. 세상 좁아요.\""
              add: { cruelty: 2 }
              goto: e2_threat_said

  e2_threat_said:
    actions:
      - move: { id: 도윤, toward: 준성, style: lunge, wait: true }
      - say:
          char: 도윤
          with: [준성]
          text: "형도 조심해요. 세상 좁아요."
      - say:
          char: 준성.tired
          motion: headtilt
          with: [도윤]
          text: "…형?"
      - say:
          char: 준성
          with: [도윤]
          text: "그날은 형이라고 안 했잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "그날은 아무것도 안 불렀죠. 이름도 안 물어봤고."
      - say:
          char: 도윤
          motion: tremble
          with: [준성]
          text: "……"
      - say:
          char: 준성.tired
          with: [도윤]
          text: "내일 3페이지 숫자, 그것만 고쳐 주면 돼요."
      - say:
          channel: system
          with: []
          text: "1층입니다. 문이 열립니다."
      - emote: { id: 도윤, motion: droop }
      - say:
          channel: action
          with: [도윤]
          text: "준성이 돌아보지 않고 먼저 내린다."
      - move: { id: 도윤, style: reset }
      - goto: e2_absent

  e2_threat_silent:
    actions:
      - say:
          char: 준성
          with: [도윤]
          text: "집이 어느 쪽이에요? 나 요 앞 오피스텔인데."
      - say:
          char: 도윤
          with: [준성]
          text: "…그 근처요."
      - say:
          char: 준성
          with: [도윤]
          text: "그럼 거의 이웃이네요. 세상 좁다."
      - say:
          channel: system
          with: []
          text: "1층입니다. 문이 열립니다."
      - say:
          char: 준성
          with: [도윤]
          text: "먼저 가요."
      - say:
          char: 도윤
          motion: bow
          with: [준성]
          text: "…수고하셨습니다."
      - move: { id: 도윤, style: reset }
      - goto: e2_absent

  e2_absent:
    title: "결근"
    actions:
      - bg: { id: office, transition: fade, duration: 900 }
      - place: "수요일 오후 · 영업2팀"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 팀장님 오늘도 안 나오심? 월화수 사흘째네"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 병가래요 인사팀 언니가 그러는데 기한 없대"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 기한 없는 병가도 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 근데 팀장님 화분 누가 물 좀 줘요 다 말라가요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 그거 종이컵으로 반 컵만 주라고 하셨는데"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 근데 그 병 있잖아… 아 아니다"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 뭔데요 그 병"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 회의 때 팀장님 폰에 감염내과 어쩌고 뜨는 거 봤어 나만 본 거 아님"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 헐 그럼 같이 밥 먹은 사람들 괜찮은 거임?"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 밥 먹는 걸로는 안 옮아요 오대리님ㅋㅋ 검색 좀 하세요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 아 그래도 찝찝하잖아요"
      - say:
          channel: message
          side: them
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "[영업2팀] 윤주임: 근데 전 회사 얘기는 처음에 도윤대리님이 꺼낸 거 아니에요?"
      - say:
          channel: message
          side: them
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "[영업2팀] 송과장: 그건 그거고"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 도윤대리는 좀 알지 않아? 제일 많이 붙어 있었잖아"
      - char: { id: 도윤, position: center }
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          erase: true
          text: "저도 그날 이후로는 연락을"
      - emote: { id: 도윤, motion: droop }
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "저도 몰라요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 화분은 제가 줄게요"
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - goto: e2_harin

  e2_harin:
    title: "체육복"
    actions:
      - bg: { id: classroom, transition: cut }
      - music: cold_room
      - place: "며칠 뒤 청소시간 · 3학년 교실"
      - char: { id: 민재, position: left }
      - char: { id: 하린, position: center }
      - char: { id: 아진, position: right }
      - say:
          char: 하린
          motion: bounce
          with: [민재, 아진]
          text: "야 오늘 야자 째자. 진짜로. 나 오늘 진짜 못 하겠어."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "아 몰라 안 할래. 야 우리 떡볶이 먹으러 가자. 그 집 7시에 닫아."
      - say:
          char: 하린
          with: [민재, 아진]
          text: "내가 쏠게. 아니다 내가 반 쏠게. 나 지금 사천 원 있어."
      - say:
          char: 아진
          motion: laugh
          with: [하린, 민재]
          text: "사천 원으로 뭘 반을 쏴ㅋㅋ"
      - say:
          char: 하린
          with: [아진, 민재]
          text: "국물은 공짜잖아. 국물만 네 그릇 시키면 돼."
      - say:
          char: 민재
          with: [하린, 아진]
          text: "나 오늘 안 돼. 좀 있다 가야 돼."
      - say:
          char: 하린
          motion: perk
          with: [민재, 아진]
          text: "어디? 학원?"
      - say:
          char: 민재
          with: [하린, 아진]
          text: "그냥 뭐 좀."
      - say:
          char: 하린
          motion: laugh
          with: [민재, 아진]
          text: "뭐 좀이 뭔데ㅋㅋ 서민재 요즘 진짜 수상해."
      - say:
          char: 아진.awkward
          with: [하린, 민재]
          text: "하린아 너 체육복 사물함에 있어. 아까 봤어."
      - say:
          char: 하린
          with: [아진, 민재]
          text: "아 맞다. 내일 체육이지. 아 귀찮아. 그냥 두고 갈까."
      - say:
          char: 아진
          with: [하린, 민재]
          text: "두고 가면 또 빌리러 다니잖아."
      - say:
          char: 하린
          motion: laugh
          with: [아진, 민재]
          text: "아 됐어 나 먼저 간다. 둘이 청소 마저 해."
      - say:
          char: 하린
          with: [아진, 민재]
          text: "아진아 떡볶이는 내일. 내일은 진짜 가는 거다?"
      - move: { id: 하린, toward: camera, style: retreat }
      - place: "십 분 뒤 · 3학년 교실 뒷문"
      - move: { id: 민재, toward: 아진, style: approach }
      - say:
          char: 아진.awkward
          with: [민재]
          delivery: whisper
          text: "오늘 하린이한테 말하려고 했는데… 우리 얘기. 못 했어."
      - say:
          char: 민재
