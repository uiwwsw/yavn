title: "ERASE"
pov: "한도윤"
author:
  name: "uiwwsw"
version: "1.3.0"
seo:
  description: "청첩장 사진을 찍은 도윤과 지수. 그날 밤 늦지 않겠다던 도윤은 낯선 방에서 아침을 맞는다. 다섯 장에 걸쳐 네 가지 결말로 이어지는 심리 드라마."
  keywords:
    - "심리 드라마"
    - "비주얼노벨"
    - "반전"
    - "현대극"
  image: "assets/bg/title.svg"
  imageAlt: "겹친 인화 사진 두 장과 오려 낸 얼굴의 빈자리"
textSpeed: 32
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: cinematic-noir
legalNotices:
  - id: content-warning
    title: "내용 안내"
    text: "이 작품에는 성적 긴장(묘사 없음), HIV에 대한 불안, 자기 파괴적 생각과 옥상 장면(결과·방법 묘사 없음)이 나옵니다. 힘든 마음이 들면 자살예방 상담전화 109(24시간)에 연락할 수 있습니다. HIV 검사는 가까운 보건소에서 익명·무료로 받을 수 있습니다."
startScreen:
  enabled: true
  music: assets/music/cold-room.flac
  image: assets/bg/title.svg
  imagePosition: "60% 50%"
  mobileImagePosition: "72% 50%"
  showTitle: true
  titleColor: "#e8eef2"
  startButtonText: "이야기 시작"
  buttonPosition: bottom-left
  eyebrow: "심리 드라마 · 5장 · 결말 4종"
  subtitle: "청첩장에 넣을 사진을 골랐다. 그날 밤까지는 결혼 준비가 잘되는 줄 알았다."
  scene:
    layout: split
    motion: drift
    duration: 30000
    parallax: 10
    particles: dust
    intensity: 0.35
    fog: true
    light: breathe
    accent: "#b05b67"
endings:
  erase_loop:
    title: "ERASE"
    message: "수술대 위의 얼굴은 열여덟의 하린이었다. 하린은 도윤이 되었고, 도윤은 다시 누군가가 된다."
    epilogue: "의사가 뒤집어 둔 이름표를 가져간다. 다음 환자의 이름을 부른다.\n\n도움이 필요할 때\n힘든 마음이 들면 109(자살예방 상담전화, 24시간)에 연락할 수 있습니다."
    background: surgery_reveal
    music: cold_room
    tone: tragic
  erased_name:
    title: "지워진 이름"
    message: "조직도에서 두 이름이 지워졌다. 소문을 누가 처음 냈는지는 아무도 기억하지 않는다."
    epilogue: "준성이 어디 있는지는 끝내 알려지지 않았다. 창가에 남은 화분에는 새 잎이 났다.\n\n도움이 필요할 때\n109(자살예방 상담전화)는 24시간 열려 있습니다."
    background: office_night
    music: static
    tone: mystery
  kept_photo:
    title: "남겨진 사진"
    message: "도윤은 지갑 안에서 보건소 번호표를 꺼낸다. 휴대폰에는 아직 놀이터에서 웃고 있는 아이 사진이 남아 있다."
    epilogue: "번호가 불린다. 도윤은 번호표를 쥔 채 상담실 문을 연다.\n\n검사와 치료 안내\nHIV 검사는 가까운 보건소에서 익명·무료로 받을 수 있고, 꾸준히 치료하면 일상생활이 가능합니다."
    background: clinic_hall
    music: wind
    tone: hopeful
  unfinished:
    title: "완성되지 않은 사람"
    message: "지수는 반지를 신발장 위에 두고 갔다. 도윤은 그 메시지들을 지우지 않았다."
    epilogue: "신발장 위 반지 옆에 지수가 두고 간 열쇠가 있었다. 도윤은 불을 켜고 다시 식탁에 앉았다.\n\n도움이 필요할 때\n109(자살예방 상담전화)는 24시간 열려 있습니다. HIV 검사는 가까운 보건소에서 익명·무료로 받을 수 있습니다."
    background: rooftop
    music: wind
    tone: mystery
defaultEnding: erase_loop
