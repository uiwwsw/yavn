title: "ERASE"
pov: "한도윤"
author:
  name: "uiwwsw"
version: "2.0.0"
seo:
  description: "청첩장 사진을 찍던 날, 처음 보는 사진작가가 도윤을 다른 이름으로 부른다. 도윤에게는 열여덟 전 기억이 없다. 지운 사람과 기억하는 사람의 5장 심리 드라마, 결말 5종."
  keywords:
    - "심리 드라마"
    - "비주얼노벨"
    - "반전"
    - "현대극"
  image: "assets/bg/title.svg"
  imageAlt: "겹친 인화 사진 두 장과 오려 낸 얼굴의 빈자리"
textSpeed: 32
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: cinematic-noir
legalNotices:
  - id: content-warning
    title: "내용 안내"
    text: "이 작품에는 단체 대화방 따돌림과 기억을 지우는 선택이 나옵니다. 힘든 마음이 들면 109(자살예방 상담전화, 24시간)에 전화할 수 있습니다."
startScreen:
  enabled: true
  music: assets/music/cold-room.flac
  image: assets/bg/title.svg
  imagePosition: "60% 50%"
  mobileImagePosition: "72% 50%"
  showTitle: true
  titleColor: "#e8eef2"
  startButtonText: "이야기 시작"
  buttonPosition: bottom-left
  eyebrow: "심리 드라마 · 5장 · 결말 5종"
  subtitle: "청첩장 사진을 찍던 날, 작가가 나를 모르는 이름으로 불렀다."
  scene:
    layout: split
    motion: drift
    duration: 30000
    parallax: 10
    particles: dust
    intensity: 0.35
    fog: true
    light: breathe
    accent: "#b05b67"
endings:
  side_seat:
    title: "옆자리"
    message: "옆자리 의자는 그날 이후로 치우지 않았다."
    epilogue: "그날 저녁 도윤은 지수에게 처음부터 다 말했다. 지수는 숟가락을 든 채로 끝까지 들었다."
    background: photo_studio
    music: studio
    tone: hopeful
  two_names:
    title: "두 이름"
    message: "지수는 두 이름을 다 불렀다. 도윤은 둘 다 대답했다."
    epilogue: "그날 저녁 식탁에는 밥그릇이 두 개였다. 도윤은 사진관에 전화해 원본을 한 장도 지우지 말아 달라고 했다."
    background: couple_home
    music: studio
    tone: hopeful
  unfinished:
    title: "완성되지 않은 사람"
    message: "반지는 신발장 위에 있다. 메시지는 지워지지 않았다."
    epilogue: "도윤은 불을 켜고 식탁에 앉았다. 하객 명단의 자기 쪽 맨 위에 이름 하나를 적었다. 정아진."
    background: couple_home
    music: wind
    tone: mystery
  erase_loop:
    title: "ERASE"
    message: "동의서에 적은 이름은 한도윤이다. 끝에 작은 점이 있다."
    epilogue: "유리문 밖에서 기다린 사람은 두 번째로 지나쳐졌다. 그 사람은 이번에도 사진을 지우지 않았다.\n\n도움이 필요할 때\n힘든 마음이 들면 109(자살예방 상담전화, 24시간)에 전화할 수 있습니다."
    background: surgery_reveal
    music: cold_room
    tone: tragic
  walked_past:
    title: "지나간 사람"
    message: "화환 리본에 적힌 이름을 도윤은 읽지 않았다."
    epilogue: "아진은 식이 끝날 때까지 로비에 있었다. 카메라는 들지 않았다."
    background: couple_home
    music: wind
    tone: mystery
defaultEnding: erase_loop
