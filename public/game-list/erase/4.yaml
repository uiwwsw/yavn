chapterTitle: "ERASE"

script:
  - scene: e5_lobby

scenes:
  # The last morning is a room to look around, not a list. The form names both erasures, the
  # phone carries the people who are waiting, and the glass door shows who is outside this time.
  # Each way out stays locked until the player has looked at what it costs.
  e5_lobby:
    title: "1층"
    actions:
      - say: { channel: card, with: [], text: "결혼 D-4 · 화요일", autoAdvance: 1800 }
      - bg: { id: clinic_hall, transition: cut }
      - music: cold_room
      - place: "오전 9시 40분 · 정림의원 1층 · 비"
      - char: { id: 서윤, position: center }
      - say:
          channel: action
          with: [서윤]
          when: { var: booked, op: eq, value: true }
          text: "접수대 직원이 서류철을 내민다. 원무과에서 찾은 동의서 사본도 같이 끼워 준다."
      - say:
          channel: action
          with: [서윤]
          when: { var: booked, op: eq, value: true }
          text: "위에서 부를 때까지 앉아 기다리라고 한다."
      - say:
          char: 원무과직원
          with: [서윤]
          when: { var: booked, op: eq, value: false }
          text: "동의서 사본 여기 있습니다. 두 건이에요."
      - say:
          char: 원무과직원
          with: [서윤]
          when: { var: booked, op: eq, value: false }
          text: "3층에서 연락 왔는데요, 오늘 오전에 취소 자리가 하나 났대요."
      - say:
          char: 원무과직원
          with: [서윤]
          when: { var: booked, op: eq, value: false }
          text: "상담 원하시면 서류철에 있는 신청서 쓰고 기다리시래요."
      - say: { channel: action, with: [서윤], text: "대기실 의자는 유리문을 향해 놓여 있다. 우산꽂이는 비어 있다." }
      - goto: e5_lobby_look

  e5_lobby_look:
    title: "대기실"
    actions:
      - choice:
          key: e5_lobby
          presentation: explore
          investigation: { width: 1600, height: 900 }
          prompt: "위에서 부를 때까지 시간이 있다."
          with: []
          options:
            - text: "서류철"
              at: { x: 38, y: 58 }
              when: { var: read_form, op: eq, value: false }
              goto: e5_form
            - text: "휴대폰"
              at: { x: 56, y: 60 }
              when: { var: read_phone, op: eq, value: false }
              goto: e5_phone
            - text: "유리문"
              at: { x: 80, y: 42 }
              when: { var: saw_door, op: eq, value: false }
              goto: e5_door
            - text: "3층으로 올라간다"
              requires: { var: read_form, op: eq, value: true }
              lockedText: "서류를 아직 읽지 않았다."
              goto: e5_erase
            - text: "유리문을 밀고 나간다"
              requires: { var: saw_door, op: eq, value: true }
              lockedText: "밖을 아직 보지 않았다."
              goto: e5_out
            - text: "사진관으로 간다"
              when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }
              requires: { var: read_phone, op: eq, value: true }
              lockedText: "휴대폰이 계속 울린다."
              goto: e5_side

  e5_form:
    title: "서류철"
    actions:
      - say:
          channel: record
          with: []
          when: { var: booked, op: eq, value: true }
          text: "시술 동의서 · 신청인 한서윤 · 지울 기간: 2027년 4월 2일부터 오늘까지"
      - say:
          channel: record
          with: []
          when: { var: booked, op: eq, value: false }
          text: "상담 신청서 · 신청인 한서윤 · 희망 기간: 비어 있음"
      - say:
          channel: action
          with: [서윤]
          when: { var: booked, op: eq, value: false }
          text: "서윤은 희망 기간 칸에 2027년 4월 2일부터, 라고 쓴다. 손이 먼저 쓴다."
      - say: { channel: record, with: [], text: "지워지는 것: 본인의 기억. 남는 것: 다른 사람의 기억, 기기 속 기록." }
      - say: { channel: action, with: [서윤], text: "신청서 밑에 사본 두 장이 끼워져 있다." }
      - say: { channel: record, with: [], text: "사본 1 · 2016년 3월 29일 · 신청인 유하린 · 보호자 한경숙" }
      - say: { channel: record, with: [], text: "사본 2 · 2024년 6월 20일 · 신청인 한서윤 · 지울 기간 6월 1일~6월 19일 · 동행인 이지수", continueLabel: "둘째 장을 끝까지 읽는다" }
      - say: { channel: action, with: [서윤], text: "동행인 칸의 이지수. 받침 ㅅ을 크게 쓰는 지수 글씨다.", wait: 1600 }
      - wait: 700
      - say: { channel: thought, with: [], text: "4월 2일. 사진관에 간 날이다." }
      - say: { channel: thought, with: [], text: "모니터 속에서 눈을 감고 웃던 컷. 저 이거 보고 결혼해요." }
      - say: { channel: thought, with: [], text: "세 번 접혀 봉투로 들어가던 기본증명서." }
      - say:
          channel: thought
          with: []
          when: { var: forgave, op: eq, value: true }
          text: "노란 1이 붙은 말풍선 열한 개."
      - say:
          channel: thought
          with: []
          when: { var: forgave, op: eq, value: false }
          text: "충전기 뽑히던 소리."
      - say: { channel: thought, with: [], text: "식탁 위의 반지 상자. 2024. 6. 2." }
      - say: { channel: action, with: [서윤], text: "위층에서 이름을 부른다. 한서윤 님." }
      - set: { read_form: true }
      - goto: e5_lobby_look

  e5_phone:
    title: "휴대폰"
    actions:
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "12시 반 가봉. 데리러 갈게."
      - say: { channel: action, with: [서윤], text: "보낸 시각 9시 12분. 서윤이 집을 나선 지 이 분 뒤다." }
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          media: { src: assets/items/child_photo_back.svg, alt: "인화한 놀이터 사진의 뒷면. 연필로 2005. 5. 5. 은행동 놀이터. 하린이랑 아진이." }
          text: "놀이터 사진, 인화한 거 엄마 집에서 찾았어요. 뒤에 이렇게 써 있어요."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          text: "오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          media: { src: assets/items/child_photo_back.svg, alt: "인화한 놀이터 사진의 뒷면. 연필로 2005. 5. 5. 은행동 놀이터. 하린이랑 아진이." }
          text: "놀이터 사진, 인화한 거 엄마 집에서 찾았어요. 뒤에 이렇게 써 있어요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
      - set: { read_phone: true }
      - goto: e5_lobby_look

  e5_door:
    title: "유리문"
    actions:
      - say: { channel: action, with: [서윤], text: "유리문에 빗물이 줄지어 흐른다." }
      - say: { channel: action, with: [서윤], text: "길 건너에 회색 차가 서 있다. 와이퍼가 한 번씩 돈다.", wait: 1400 }
      - say: { channel: action, with: [서윤], text: "지수 차다. 운전석의 지수는 내리지 않는다." }
      - say: { channel: thought, with: [], text: "데리러 갈게. 9시 12분." }
      - say: { channel: thought, with: [], text: "열한 해 전에는 저 자리에 아진이 서 있었다." }
      - set: { saw_door: true }
      - goto: e5_lobby_look

  # ---- Ending: ERASE. The third time. She comes down smiling and asks the man in the lobby
  # what he is doing there: the exact words he told her about at the table.
  e5_erase:
    title: "3층"
    actions:
      - say: { channel: action, with: [서윤], text: "서윤은 계단을 오른다." }
      - bg: { id: surgery, transition: fade, duration: 900 }
      - place: "3층 · 시술실"
      - char: { id: 상담사, position: left }
      - say: { char: 상담사, with: [서윤], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요.", continueLabel: "동의서에 서명한다" }
      - sound: consent_pen
      - say: { channel: action, with: [서윤, 상담사], text: "이번엔 손이 떨리지 않는다. 한서윤이라고 쓰고 끝에 작은 점을 찍는다." }
      - say: { char: 상담사, with: [서윤], text: "지난번에도 사진 한 장은 남겨 달라고 하셨어요. 이번에도 그러실래요?" }
      - say: { char: 서윤.hollow, with: [상담사], text: "네." }
      - say:
          channel: action
          with: [서윤]
          when: { var: ajin_photo, op: ne, value: deleted }
          text: "서윤은 휴대폰을 열어 한 장을 고른다. 교실 창가에서 웃는 여자아이."
      - say:
          channel: action
          with: [서윤]
          when: { var: ajin_photo, op: eq, value: deleted }
          text: "서윤은 휴대폰을 열어 한 장을 고른다. 눈을 감고 웃는 청첩장 컷."
      - bg: { id: eyes_closed, transition: dissolve, duration: 1200 }
      - music: null
      - wait: 2000
      - move: { id: 상담사, style: exit }
      - bg: { id: clinic_hall, transition: fade, duration: 1200 }
      - place: "오후 1시 · 정림의원 1층"
      - say: { channel: action, with: [서윤], text: "계단을 내려온다. 몸이 가볍다. 무엇 때문에 왔는지는 접수증에 적혀 있다." }
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 서윤], text: "유리문 쪽 의자에 지수가 앉아 있다. 젖은 우산이 하나, 우산꽂이에 꽂혀 있다." }
      - say: { char: 서윤.smile, with: [지수], text: "지수야? 여기서 뭐 해?", wait: 1800, unskippable: true }
      - wait: 1400
      - say: { char: 지수, with: [서윤], text: "……데리러 왔어.", delivery: "sad" }
      - place: "지수의 차 안"
      - say: { channel: action, with: [지수, 서윤], text: "지수가 조수석 서랍에서 청첩장 교정지를 꺼낸다." }
      - sticker:
          id: s5_proof
          image: closed_eye_cut_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 지수, with: [서윤], text: "이거. 네가 지워 달라던 거." }
      - say: { channel: action, with: [지수, 서윤], text: "교정지 속 서윤은 눈을 감고 웃고 있다." }
      - say: { char: 서윤, with: [지수], text: "이걸 언제 찍었지.", wait: 1800, unskippable: true }
      - clearSticker: { id: s5_proof, leave: fadeOut }
      - say: { channel: action, with: [지수, 서윤], text: "지수는 대답하지 않고 와이퍼를 켠다." }
      - say: { channel: action, with: [서윤], text: "그날 밤 서윤은 가방 안쪽에서 반지 상자를 찾는다. 2월에 받은 반지가 왜 가방에 들어 있는지는 모른다." }
      - say: { channel: card, with: [], text: "나흘 뒤 · 5월 1일", autoAdvance: 2000 }
      - bg: { id: couple_home, transition: fade, duration: 900 }
      - place: "결혼식 날 아침 · 서윤과 지수의 집"
      - say: { channel: action, with: [지수, 서윤], text: "서윤이 지수의 넥타이를 바로잡아 준다." }
      - say: { char: 지수, with: [서윤], text: "사진관에서 문자 왔어. 정아진 작가님 오늘 못 오신대." }
      - say: { char: 지수, with: [서윤], text: "다른 작가님 보낸대." }
      - say: { char: 서윤, with: [지수], text: "정아진? 누구였지." }
      - say: { channel: action, with: [지수, 서윤], text: "지수가 넥타이를 쥔 서윤의 손 위에 제 손을 얹는다." }
      - wait: 900
      - say:
          char: 지수.cold
          with: [서윤]
          when: { var: told_all, op: eq, value: true }
          wait: 2000
          unskippable: true
          delivery: "whisper"
          text: "…하린아."
      - say:
          char: 서윤
          with: [지수]
          when: { var: told_all, op: eq, value: true }
          text: "응? 누구?"
      - say: { char: 지수, with: [서윤], text: "아니야. 넥타이 됐어." }
      - say: { channel: action, with: [지수, 서윤], text: "식장 로비에 줄지어 선 화환 가운데 리본 하나에 정아진이라는 이름이 적혀 있다. 서윤은 그 앞을 지나간다." }
      - ending: erase_loop

  # ---- Ending: the seat she kept. She walks past the car that waited for her, the way Harin
  # walked past Ajin, and sits beside the one who remembers. The fitting is the cost.
  e5_side:
    title: "옆자리"
    actions:
      - say: { channel: action, with: [서윤], text: "서윤은 서류철을 접수대에 돌려주고 유리문을 밀고 나간다. 비가 얼굴에 닿는다." }
      - say: { channel: action, with: [서윤], text: "길 건너 회색 차 쪽은 보지 않는다. 서윤은 버스 정류장 쪽으로 걷는다.", wait: 1600, unskippable: true }
      - say:
          channel: message
          thread: 지수
          side: me
          char: 서윤
          with: []
          text: "먼저 갈 데가 있어. 저녁에 다 말할게."
      - say: { channel: action, with: [서윤], text: "1은 바로 사라진다. 길 건너에서 와이퍼가 멈춘다." }
      - say:
          channel: message
          thread: 정림의원
          side: them
          speakerName: 정림의원
          with: []
          when: { var: booked, op: eq, value: true }
          text: "예약이 취소되었습니다."
      - bg: { id: photo_studio, transition: fade, duration: 900 }
      - music: studio
      - place: "점심 · 사진관"
      - char: { id: 어른아진, position: left }
      - sticker:
          id: s5_lunch
          image: snack_lunch_sticker
          x: 50
          y: 40
          width: "clamp(200px, 32%, 360px)"
          enter: fadeIn
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 작업대에 떡볶이 1인분과 돈까스 한 접시를 풀어 놓았다. 맞은편이 아니라 옆자리에 의자가 하나 더 놓여 있다." }
      - say: { char: 서윤, with: [어른아진], text: "돈까스는 왜요." }
      - say: { char: 어른아진, with: [서윤], text: "그냥. 좋아했으니까." }
      - say: { channel: action, with: [어른아진, 서윤], text: "서윤은 옆자리에 앉는다." }
      - say: { char: 서윤, with: [어른아진], text: "아까 3층까지 갈 뻔했어요." }
      - say:
          char: 서윤
          with: [어른아진]
          when: { var: booked, op: eq, value: true }
          text: "예약해 둔 게 있었거든요."
      - say:
          char: 서윤
          with: [어른아진]
          when: { var: booked, op: eq, value: false }
          text: "자리가 하나 났다고 해서요."
      - say: { char: 어른아진.awkward, with: [서윤], text: "……" }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진은 나무젓가락을 쪼개 서윤 쪽에 놓는다." }
      - say: { char: 서윤, with: [어른아진], text: "기억은 안 날 거래요. 그래도 처음부터 들을게요." }
      - say: { char: 어른아진, with: [서윤], text: "처음부터면 길어요." }
      - say:
          char: 서윤.smile
          with: [어른아진]
          when: { var: listened, op: eq, value: true }
          text: "사천 원어치만요. 반은 제가 낼게요."
      - say:
          char: 서윤.smile
          with: [어른아진]
          when: { var: listened, op: eq, value: false }
          text: "점심시간만큼만요."
      - clearSticker: { id: s5_lunch, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 서랍에서 인화한 놀이터 사진을 꺼내 뒤집어 놓는다. 연필 글씨가 손때에 번져 있다." }
      - sticker:
          id: s5_back
          image: child_photo_back_sticker
          x: 50
          y: 40
          width: "clamp(180px, 28%, 320px)"
          enter: fadeIn
      - wait: 1200
      - clearSticker: { id: s5_back, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 앨범을 하나 더 꺼낸다. 표지에 2016이라고 매직으로 적혀 있다." }
      - sticker:
          id: s5_classroom
          image: harin_photo_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 어른아진, with: [서윤], text: "이게 3월 10일. 돈까스 나온 날." }
      - say: { char: 어른아진, with: [서윤], text: "급식표 찍고 나서 저렇게 웃었어요." }
      - clearSticker: { id: s5_classroom, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 한 장을 더 넘긴다." }
      - sticker:
          id: s5_slide
          image: harin_slide_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 어른아진, with: [서윤], text: "이건 3월 14일. 사진반 과제 낸 거." }
      - say: { char: 어른아진.awkward, with: [서윤], text: "이날은 안 웃었어요." }
      - clearSticker: { id: s5_slide, leave: fadeOut }
      - wait: 700
      - say: { channel: action, with: [어른아진, 서윤], text: "서윤은 그 사진을 오래 보다가 돈까스를 한 조각 집는다. 이번엔 먹는다." }
      - say: { char: 서윤, with: [어른아진], text: "지금도 점심 메뉴를 찍어요. 이번 주는 못 찍었지만." }
      - say: { char: 어른아진, with: [서윤], text: "다음 주엔 찍어요." }
      - place: "12시 41분"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "가봉은 나 혼자 갈게."
      - say: { channel: action, with: [어른아진, 서윤], text: "화면에 뜬 이름을 아진도 본다." }
      - say: { char: 어른아진, with: [서윤], text: "가 봐요." }
      - say: { channel: action, with: [어른아진, 서윤], text: "서윤은 일어나지 않는다." }
      - say: { channel: action, with: [서윤], text: "서윤은 답하지 않는다. 휴대폰을 작업대에 엎어 둔다." }
      - say: { char: 어른아진, with: [서윤], text: "토요일 촬영, 실장님한테 돌려 드릴까 했어요." }
      - say: { char: 어른아진, with: [서윤], text: "제가 찍어도 될까요?" }
      - say: { char: 서윤, with: [어른아진], text: "찍어 주세요. 돈은 드릴게요." }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 젓가락을 내려놓고 소리 내어 웃는다. 서윤은 아진이 왜 웃는지 모른다." }
      - say: { char: 서윤, with: [어른아진], text: "그리고 하객석에도 앉아 주세요." }
      - say: { char: 서윤.smile, with: [어른아진], text: "제 쪽에요. 제 쪽에 아직 열두 명뿐이라서." }
      - say: { channel: action, with: [어른아진, 서윤], text: "아진이 카메라를 들어 서윤을 찍는다." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { char: 어른아진, with: [서윤], text: "웃지 마요. 눈 없어져요." }
      - say: { char: 서윤.smile, with: [어른아진], text: "지워요." }
      - say: { char: 어른아진, with: [서윤], text: "안 지워요." }
      - goto: e5_side_evening

  e5_side_evening:
    actions:
      - move: { id: 어른아진, style: exit }
      - bg: { id: couple_home, transition: fade, duration: 1000 }
      - music: wind
      - place: "그날 저녁 · 서윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 서윤], text: "지수는 드레스 가방을 현관에 세워 두고 들어온다." }
      - say: { channel: action, with: [지수, 서윤], text: "서윤은 앨범과 놀이터 사진을 식탁에 올려놓고 처음부터 다 말한다. 아침의 계단, 1층 유리문, 노란 1 열한 개, 오늘 먹은 돈까스." }
      - say: { channel: action, with: [지수, 서윤], text: "지수는 숟가락을 든 채로 끝까지 듣는다." }
      - say: { char: 지수.cold, with: [서윤], text: "아침에 내 차 앞으로 지나갔지." }
      - say: { char: 서윤.hollow, with: [지수], text: "……응." }
      - say: { char: 지수, with: [서윤], text: "3년 전엔 내가 거기 있는 줄도 몰랐잖아. 오늘은 알았고.", wait: 1600 }
      - say:
          char: 지수
          with: [서윤]
          when: { var: told_first, op: eq, value: true }
          text: "그 사람한테만 말고, 라고 했잖아."
      - say:
          char: 서윤
          with: [지수]
          when: { var: told_first, op: eq, value: true }
          text: "응."
      - say:
          char: 지수
          with: [서윤]
          when: { all: [{ var: told_all, op: eq, value: true }, { var: told_first, op: eq, value: true }] }
          text: "근데 오늘은 그 사람한테 먼저 갔네."
      - say:
          char: 지수
          with: [서윤]
          when: { all: [{ var: told_all, op: eq, value: true }, { var: told_first, op: eq, value: false }] }
          text: "점심엔 그 사람이랑 있었네."
      - say:
          char: 서윤
          with: [지수]
          when: { var: told_all, op: eq, value: true }
          text: "응."
      - say:
          char: 지수
          with: [서윤]
          when: { var: told_all, op: eq, value: true }
          text: "가봉, 나 혼자 갔어."
      - say:
          char: 지수
          with: [서윤]
          when: { var: told_all, op: eq, value: true }
          text: "네 드레스, 나 혼자 봤어. 예쁘더라."
      - say:
          channel: action
          with: [지수, 서윤]
          when: { var: told_all, op: eq, value: true }
          text: "지수가 앨범을 넘긴다. 3월 10일에서 손이 멈춘다."
      - say:
          char: 지수.warm
          with: [서윤]
          when: { var: told_all, op: eq, value: true }
          text: "웃는 거 똑같네."
      - say:
          channel: action
          with: [지수, 서윤]
          when: { var: told_all, op: eq, value: true }
          text: "지수는 좌석 배치표를 끌어다 펼치고 신부 측 첫 줄 맨 앞 칸에 이름 하나를 적는다. 정아진."
      - say:
          channel: action
          with: [지수, 서윤]
          when: { var: told_all, op: eq, value: true }
          text: "혼주석 칸은 그대로 둔다."
      - say:
          char: 지수.cold
          with: [서윤]
          when: { var: told_all, op: eq, value: false }
          text: "나는 오늘 처음 듣는데. 그 사람은 점심에 들었네."
      - say:
          channel: action
          with: [지수, 서윤]
          when: { var: told_all, op: eq, value: false }
          text: "지수는 앨범을 열지 않는다. 좌석 배치표를 접어 서랍에 넣는다."
      - say:
          char: 지수
          with: [서윤]
          when: { var: told_all, op: eq, value: false }
          text: "명단은 내일 하자."
      - say:
          channel: action
          with: [서윤]
          when: { var: told_all, op: eq, value: false }
          text: "드레스 가방은 그날 밤 현관에 서 있다."
      - ending: side_seat

  # ---- She pushes the glass door this time and crosses to the car.
  e5_out:
    title: "유리문"
    actions:
      - say: { channel: action, with: [서윤], text: "서윤은 서류철을 접수대에 돌려준다. 유리문을 밀고 나간다.", continueLabel: "문을 민다" }
      - say:
          channel: message
