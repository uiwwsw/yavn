      - place: "정림의원 앞 · 비"
      - say: { channel: action, with: [서윤], text: "비가 얼굴에 닿는다. 길을 건넌다. 운전석 창문을 두 번 두드린다." }
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 서윤], text: "창문이 내려간다. 지수는 아무것도 묻지 않는다." }
      - say: { char: 서윤, with: [지수], text: "3년 전에도 여기 있었지." }
      - say: { char: 지수, with: [서윤], text: "응. 저 자리." }
      - say: { char: 서윤.hollow, with: [지수], text: "오늘은 안 올라갔어.", wait: 2000, unskippable: true }
      - say: { char: 서윤, with: [지수], text: "열여덟 살 때 이름은 유하린이었어. 기다리는 친구가 있었는데, 그 앞을 그냥 지나갔대." }
      - say: { char: 서윤, with: [지수], text: "3년 전엔 너를 지웠고. 오늘 또 지우려고 했어." }
      - wait: 900
      - branch:
          cases:
            - when: { var: told_all, op: eq, value: true }
              goto: e5_two_names
          default: e5_unfinished

  e5_two_names:
    actions:
      - say: { channel: action, with: [지수, 서윤], text: "지수가 조수석 문을 열어 준다. 서윤은 젖은 채로 탄다." }
      - say: { char: 지수, with: [서윤], text: "월요일에 네가 먼저 다 말해 줬잖아. 그래서 나도 말했고." }
      - say: { char: 지수, with: [서윤], text: "주민센터부터 치면 열하루야. 그동안 나는 두 이름을 다 들고 있었어." }
      - say: { char: 지수.warm, with: [서윤], text: "또 지웠으면, 나 혼자 그걸 다 들고 결혼할 뻔했네." }
      - say: { char: 지수.warm, with: [서윤], text: "그 이름으로도 한 번 불러 봐도 돼?" }
      - say: { char: 서윤, with: [지수], text: "응." }
      - say: { char: 지수.warm, with: [서윤], text: "하린아. 가봉 가자. 서윤이도 같이.", wait: 1600 }
      - say: { channel: action, with: [지수, 서윤], text: "서윤이 웃는다. 눈이 없어진다. 지수가 그 얼굴을 한 번 찍는다." }
      - sound: shutter
      - place: "가봉 가는 길"
      - say:
          channel: message
          thread: 사진관
          side: me
          char: 서윤
