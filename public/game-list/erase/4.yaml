          text: "메모 '장보기'\n목 회의 · 팀장님 폰(화면 위로 놓여 있었음)\n'감염내과 정기 진료 안내'\n송과장님도 봄"
      - say:
          channel: thought
          when: { var: e2_hospital, op: eq, value: true }
          text: "제목을 장보기로 바꿔 놓은 메모. 바꿀 생각을 할 만큼은 알았다는 뜻이다."
      - say:
          channel: record
          when: { var: e2_sns, op: eq, value: true }
