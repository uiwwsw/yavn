      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          text: "알았어요. 돈까스는 제가 먹을게요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: me
          char: 서윤
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "오늘은 못 가요. 토요일에 봐요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "알았어요. 돈까스는 제가 먹을게요."
      - ending: two_names

  e5_unfinished:
    actions:
      - say: { channel: action, with: [지수, 서윤], text: "지수는 오래 말하지 않는다. 와이퍼만 돈다." }
      - say: { char: 지수.cold, with: [서윤], text: "주민센터에서 그 이름 봤어. 그날부터 네가 말해 주길 기다렸어." }
      - say: { char: 지수.cold, with: [서윤], text: "월요일에도 넌 다 말하진 않았어. 오늘 비 맞으면서 처음 듣네." }
      - say: { char: 지수, with: [서윤], text: "3년 전에도 오늘도, 나는 저기서 기다렸어." }
      - say: { char: 지수, with: [서윤], text: "내려와서 문 두드린 건 처음이야. 고마워. 진짜로." }
      - wait: 900
      - say: { char: 지수, with: [서윤], text: "식은 미루자. 없던 일로 하자는 거 아니야." }
      - say: { char: 지수, with: [서윤], text: "나도 들은 걸 들고 있을 시간이 필요해." }
      - say: { char: 지수, with: [서윤], text: "반지는 네가 갖고 있어." }
      - say: { channel: action, with: [지수, 서윤], text: "창문이 올라간다. 회색 차가 먼저 떠난다." }
      - move: { id: 지수, style: exit }
      - say: { channel: system, with: [], text: "가봉 예약 취소 · 4월 27일(화) 12:30" }
      - say: { channel: action, with: [서윤], text: "서윤은 반지 상자를 쥔 채 빗속에 서 있다." }
      - ending: unfinished

