chapterTitle: "ERASE"

script:
  - scene: rooftop

scenes:
  rooftop:
    title: "옥상"
    actions:
      - bg: { id: rooftop, transition: fade, duration: 1400 }
      - music: wind
      - place: { text: "월요일 점심 · 회사 옥상", presentation: center }
      - char: { id: 도윤, position: center, emotion: hollow }
      - say: { channel: action, with: [도윤], text: "도윤은 점심을 사러 내려가지 않고 옥상으로 올라왔다." }
      - say:
          channel: message
          thread: 지수
          when: { var: told_jisu, op: eq, value: 0 }
          side: them
          char: 지수
          with: []
          text: "토요일에 네 옷은 내가 대신 찾아왔어. 옷장에 걸어놨어"
      - say:
          channel: message
          thread: 지수
          when: { var: told_jisu, op: eq, value: 0 }
          side: them
          char: 지수
          with: []
          text: "은행 일은 진짜 다 된 거지? 잔금이 금요일이야"
      - say:
          channel: message
          thread: 지수
          when: { var: told_jisu, op: eq, value: 1 }
          side: them
          char: 지수
          with: []
          text: "토요일 전에 말해 준다며. 나 혼자 입어 보고 왔어"
      - say:
          channel: message
          thread: 지수
          when: { var: told_jisu, op: eq, value: 1 }
          side: them
          char: 지수
          with: []
          text: "오늘 저녁엔 집에서 얘기해. 일곱 시"
      - say: { channel: action, with: [도윤], text: "회사 단톡이 울린다." }
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "송과장"
          side: them
          with: []
          text: "금요일 회식 투표 1.고깃집 2.횟집"
          autoAdvance: 1824
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "도윤대리님 결혼 전에 보는 거니까 대리님이 골라요 ㅋㅋ"
          autoAdvance: 2144
      - say:
          channel: message
          thread: "영업2팀"
          speakerName: "윤주임"
          side: them
          with: []
          text: "팀장님도 오시는 거 맞아요? 아직 자리 비어 있길래"
          autoAdvance: 2080
      - say:
          channel: system
          when: { var: told_jisu, op: eq, value: 2 }
          with: []
          text: "이지수 · 읽지 않은 메시지 4"
      - say: { channel: action, with: [도윤], text: "단톡을 닫으려는데 예약 알림이 새로 뜬다. 저장한 적 없는 이름이다." }
      - say: { thread: "ERASE 클리닉", speakerName: "ERASE 클리닉", channel: message, side: them, with: [], text: "내일 오전 10시 예약 확인. 신분증을 지참해 주세요." }
      - say:
          channel: system
          with: []
          text: "예약 신청 · 일요일 오전 3:02 · 신청자 본인"
      - say:
          channel: thought
          with: []
          text: "새벽에 상담 창을 열었던 건 기억난다. 예약까지 눌렀던가."
      - say: { channel: record, with: [], text: "예약자 메모 · 토요일 전에 상담받을 수 있나요? 전화 말고 문자로 부탁드립니다." }
      - say: { channel: thought, with: [], text: "‘마음 바뀌셨으면 지금 말씀하셔도 돼요.’ 누가 한 말이더라." }
      - say: { char: 도윤.hollow, motion: shiver, with: [], delivery: whisper, text: "여기 처음 예약하는 거잖아." }
      - goto: mismatch

  mismatch:
    title: "안 맞는 것"
    actions:
      - say:
          char: 도윤.hollow
          with: []
          delivery: whisper
          text: "일요일 새벽 3시 2분."
      - wait: 0
      - say:
          channel: thought
          with: []
          text: "토요일 밤에 소파에 누워 휴대폰을 켰다. 지수 방에 불이 꺼진 뒤였다."
      - say:
          channel: thought
          with: []
          text: "없던 일로 만들 수 있느냐고 검색했다. 그때 연 상담 창에 이 로고가 있었다."
      - wait: 0
      - say:
          channel: action
          with: []
          text: "도윤은 예약 문자를 길게 누른다. 삭제 메뉴를 닫고 발신자 이름을 누른다."
      - say:
          channel: system
          with: []
          text: "ERASE 클리닉 · 고객 조회\n본인 인증 완료 (한도윤)"
      - say:
          channel: system
          with: []
          text: "회원 가입 · 2016. 3.\n방문·예약 내역 · 2건"
      - say:
          char: 도윤.panic
          motion: startle
          with: []
          delivery: whisper
          text: "두 건?"
      - goto: mismatch_dig

  mismatch_dig:
    actions:
      - say: { channel: record, with: [], text: "방문 이력\n2016년 3월 · 시술 완료\n내일 오전 10시 · 예약" }
      - say: { channel: thought, with: [], text: "2016년이면 고3이다. 사진첩을 끝까지 내렸는데 교복 입은 내가 한 장도 없다." }
      - wait: 0
      - wait: 0
      - say: { channel: action, with: [], text: "휴대폰 옆에 신분증을 놓는다." }
      - say: { channel: record, with: [], text: "주민등록증 · 한도윤\n발급일 · 2016년 3월 28일" }
      - say: { channel: thought, with: [], text: "같은 달이다. 그 전에 찍은 증명사진이 어떻게 생겼는지 모르겠다." }
      - goto: mismatch_two

  mismatch_two:
    actions:
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: true }
          with: []
          text: "검색 기록에선 보건소를 찾아봤던 두 줄이 빠져 있다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: true }
          text: "나는 이걸 누구한테 배웠지."
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: false }
          with: []
          text: "검색 기록에서 클리닉 이름을 찾아본다. 이 이름을 검색한 기록이 없다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: false }
          text: "이번엔 검색하다 들어왔지만, 2016년에는 어떻게 이 병원을 찾았을까."
      - say:
          channel: action
          with: []
          text: "예약 내역에 동의서 파일이 붙어 있다. 도윤이 연다."
      - say:
          channel: record
          with: []
          text: "ERASE 시술 안내 · 본인의 기억을 지웁니다. 타인의 기억과 기기 속 메시지·사진은 바뀌지 않습니다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "그럼 내가 지운 것만 없어진 거야?"
      - say:
          channel: thought
          with: []
          text: "그때 내가 빠뜨린 게 있을 거야."
      - say:
          channel: system
          when: { var: e0_messages, op: eq, value: false }
          with: []
          text: "대화 · 저장되지 않은 번호 · 2027. 3. 20.\n보관됨"
      - say:
          channel: system
          when: { var: e0_photos, op: eq, value: false }
          with: []
          text: "사진 · 2027. 3. 20. 오전 2:06 · 4장\n보관됨"
      - say:
          channel: system
          when: { var: e0_location, op: eq, value: false }
          with: []
          text: "타임라인 · 2027. 3. 20. 오전 1:42\n보관됨"
      - say:
          channel: thought
          when:
            any:
              - { var: e0_messages, op: eq, value: false }
              - { var: e0_photos, op: eq, value: false }
              - { var: e0_location, op: eq, value: false }
          text: "3주 전 것도 안 지운 게 있다. 그건 내가 정리를 덜 한 거고, 그래서 남았다."
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "3주 전 새벽 것은 하나도 없다. 메시지도 사진도 위치도. 손이 알아서 했다."
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "삭제 화면을 닫기 전에 날짜 칸을 또 봤다. 방금도 본 곳이다."
      - goto: mismatch_photo

  mismatch_photo:
    actions:
      - branch:
          cases:
            - when:
                any:
                  - { var: kept_photo, op: eq, value: true }
                  - { var: e2_gallery, op: eq, value: false }
              goto: mismatch_photo_kept
          default: mismatch_photo_gone

  mismatch_photo_kept:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 1장\n날짜 정보 없음"
      - say:
          channel: action
          with: []
          when: { var: e2_gallery, op: eq, value: true }
          text: "사무실에서 휴지통을 안 누르고 닫은 그 사진이다. 아직 있다."
      - set: { kept_photo: true }
      - sticker:
          id: e4_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "미끄럼틀에서 눈이 안 보이게 웃고 있다. 어디서 본 얼굴 같은데."
      - say:
          channel: thought
          with: []
          text: "날짜가 없다. 찍은 폰이 날짜를 빼먹을 리는 없고."
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "누가 이걸 일부러 남겼어."
      - clearSticker: { id: e4_photo, leave: fadeOut }
      - goto: mismatch_name

  mismatch_photo_gone:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 항목 없음"
      - say:
          channel: action
          with: []
          text: "한 장 있었다. 수요일 밤에 휴지통까지 비웠다."
      - say:
          channel: thought
          with: []
          text: "미끄럼틀에서 웃느라 눈이 없어진 애였다. 사촌 동생인가 했다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…비울 때 손이 한 번 멈췄는데."
      - goto: mismatch_name

  mismatch_name:
    actions:
      - say:
          channel: action
          with: []
          text: "도윤은 검색창에 자기 이름을 치고 화면을 맨 아래까지 내린다."
      - say:
          channel: "system"
          with: []
          text: "한도윤 2016"
      - say:
          channel: "system"
          with: []
          text: "검색 결과 없음"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "졸업앨범 하나는 걸릴 줄 알았는데."
      - say:
          channel: thought
          with: []
          text: "졸업 사진. 반 단체 사진. 체육대회. 누가 올린 것 하나라도."
      - say:
          channel: action
          with: []
          text: "결과는 그대로다. 도윤은 검색창에 적힌 세 글자를 다시 본다."
      - effect: focus
      - say:
          char: 도윤.panic
          motion: shiver
          with: []
          delivery: whisper
          text: "2016년 전엔 이 이름을 안 썼던 걸까."
      - say:
          channel: thought
          with: []
          text: "교실은 희미하게 떠오른다. 누가 뒤에서 나를 불렀던 것 같은데 그때 들은 이름이 생각나지 않는다."
      - say:
          channel: action
          with: []
          text: "도윤은 난간을 잡는다. 손이 미끄러워서 한 번 다시 잡는다."
      - say:
          channel: action
          with: []
          text: "다른 손으로 방문 이력 첫 줄을 누른다."
      - say:
          channel: system
          with: []
          text: "2016년 3월 · 시술 완료\n시술 전 동의서 열람 · 본인 인증 완료"
      - wait: 0
      - goto: harin_morning

  harin_morning:
    pov: "유하린"
    title: "2016년 3월"
    actions:
      - say:
          channel: card
          with: []
          text: "11년 전\n유하린 · 18세"
      - bg: { id: harin_room, transition: cut }
      - music: static
      - place: "토요일 새벽 5:10 · 하린의 방"
      - char: { id: 하린, position: center, emotion: blank }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "교복은 의자 등받이에 걸어 두었다. 월요일 시간표대로 싼 가방은 발치에 그대로 있다."
      - say:
          channel: thought
          with: []
          text: "메시지. 사진. 위치. 오늘 안에 다."
      - say:
          channel: action
          with: []
          text: "방에는 아무도 없는데 휴대폰 밝기를 끝까지 낮춘다."
      - say: { channel: action, with: [], text: "셋이 쓰는 방이 또 울린다." }
      - say:
          channel: message
          thread: "셋이 쓰는 방"
          side: them
          char: 아진
          with: []
          text: "하린아 전화 좀 받아"
      - say:
          channel: message
          thread: "셋이 쓰는 방"
          side: them
          char: 아진
          with: []
          text: "내가 그날 문 봤다고 한 거 애들한테 말 안 했어 진짜 안 했어"
      - say:
          channel: message
          thread: "셋이 쓰는 방"
          side: them
          char: 민재
          with: []
          text: "아진한테만이라도 연락해. 어제부터 계속 기다려"
      - say:
          channel: message
          thread: "셋이 쓰는 방"
          side: them
          char: 아진
          when: { var: h1_sent, op: eq, value: true }
          with: []
          text: "너 그때 껴달라고 한 거 나 계속 생각나 그거 장난 아니었지"
      - say:
          channel: message
          thread: "셋이 쓰는 방"
          side: me
          char: 하린
          with: []
          erase: true
          wait: 700
          text: "월요일에 나 기다리지 마"
      - say:
          channel: system
          with: []
          text: "대화방에서 나갔습니다.\n이 번호를 차단했습니다."
          wait: 900
      - say:
          channel: system
          with: []
          text: "선택한 사진을 모두 삭제했습니다\n남은 사진 1장"
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "…이건 가져갈 거야."
      - say:
          channel: action
          with: []
          text: "하린은 남겨 둔 한 장을 연다. 미끄럼틀 위에서 웃고 있는 어린 자기다."
      - sticker:
          id: e4_slide
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          channel: system
          with: []
          text: "사진 정보 · 2005. 7. 12. · 중랑구\n날짜 및 위치 정보를 삭제하시겠습니까?"
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "네."
      - say:
          channel: system
          with: []
          text: "날짜와 위치 정보가 삭제되었습니다. 사진은 그대로 보관됩니다."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "날짜도 동네도 없으면 그냥 애기 사진이잖아."
      - clearSticker: { id: e4_slide, leave: fadeOut }
      - say:
          channel: system
          with: []
          text: "타임라인 · 지난 기록 전체 삭제\n이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - say:
          channel: action
          with: []
          text: "하린은 교복 이름표를 실밥째 뜯어 책상 서랍에 넣는다. 책상에 적어 둔 클리닉 주소만 주머니에 넣는다."
      - goto: reveal

  reveal:
    pov: "유하린"
    title: "시술대"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - place: { text: "그날 오전 · ERASE 클리닉", presentation: center }
      - char: { id: 하린, position: center }
      - say: { char: 의사, with: [], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요." }
      - say: { char: 하린, with: [], delivery: whisper, text: "전학도 생각했어요. 근데 거기 가서도 아침마다 애들 톡부터 볼 것 같아서요." }
      - say: { channel: action, with: [하린], sound: consent_pen, text: "하린은 소매로 손바닥을 닦는다. 동의서에 ‘유하린’이라고 쓰고 끝에 작은 점을 찍는다." }
      - say: { char: 하린, with: [], text: "가방에 휴대폰 있어요. 사진 한 장 남겨 놨는데, 그건 버리지 말아 주세요." }
      - say: { char: 의사, with: [], text: "네. 소지품에 손대지 않아요." }
      - bg: { id: surgery_reveal, transition: dissolve, duration: 760 }
      - char: { id: 하린, position: center, emotion: sleep }
      - say: { char: 의사, with: [], text: "이제 눈 감으세요.", wait: 580 }
      - say: { channel: record, with: [], sound: monitor, text: "ERASE 시술 기록 · 2016년 3월\n시술 전 · 유하린(18)\n새 신원 · 한도윤", wait: 800 }
      - say:
          channel: card
          with: []
          text: "현재 · 회사 옥상"
          autoAdvance: 1450
      - bg: { id: rooftop, transition: cut }
      - music: wind
      - char: { id: 도윤, position: center, emotion: panic }
      - move: { id: 도윤, toward: camera, style: flinch }
      - say:
          channel: record
          with: []
          text: "시술 전 동의서 · 2016년 3월\n서명 · 유하린"
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "유하린."
      - say:
          char: 도윤
          with: []
          delivery: whisper
