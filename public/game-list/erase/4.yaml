      - say:
          channel: record
          when: { var: e2_leaked, op: eq, value: true }
          with: []
          text: "단톡방 · 삭제된 메시지입니다 · 읽은 사람 3\n(원문) 근데 팀장님 전 회사에서 왜 나왔는지 아는 사람?"
      - say:
          channel: thought
          when: { var: e2_leaked, op: eq, value: true }
          text: "지웠는데 셋이 읽었다. 지운 뒤에 소문은 더 잘 돈다. 출처가 없어지니까."
      - say:
          channel: thought
          when: { var: e2_leaked, op: eq, value: true }
          text: "열여덟은 그걸 당한 쪽이었고, 나는 한 쪽이다. 같은 손으로 지웠다."
      - say:
          channel: thought
          when: { var: e2_leaked, op: eq, value: false }
