chapterTitle: "ERASE"

script:
  - scene: e5_lobby

scenes:
  e5_lobby:
    title: "1층"
    actions:
      - say: { channel: card, with: [], text: "결혼 나흘 전 · 화요일", autoAdvance: 1500 }
      - bg: { id: clinic_hall, transition: cut }
      - music: cold_room
      - place: "오전 9시 40분 · ERASE 클리닉 1층 · 비"
      - char: { id: 도윤, position: center }
      - say: { channel: action, with: [], text: "휴대폰이 울린다." }
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "오늘 저녁 같이 먹자. 내가 할게. 늦어도 돼."
      - say:
          channel: message
          thread: 정아진
          side: them
          char: 어른아진
          with: []
          text: "오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
          when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }] }
      - say: { channel: action, with: [], text: "3층으로 올라가는 계단이 보인다. 1층 유리문 밖은 비다." }
      - choice:
          key: e5_final
          prompt: "도윤은 계단과 유리문 사이에 서 있다."
          options:
            - text: "3층으로 올라간다"
              goto: e5_erase
            - text: "사진관으로 간다"
              goto: e5_side
              when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }] }
            - text: "지수에게 전화한다"
              goto: e5_call

  e5_side:
    title: "옆자리"
    actions:
      - say: { channel: action, with: [], text: "도윤은 유리문을 밀고 나간다." }
      - bg: { id: photo_studio, transition: fade, duration: 600 }
      - music: studio
      - place: "점심 · 사진관"
      - char: { id: 어른아진, position: left }
      - sticker:
          id: e5_two_bowls
          image: two_bowls_sticker
          x: 50
          y: 45
          width: "clamp(180px, 32%, 350px)"
          enter: fadeIn
      - say: { channel: action, with: [], text: "아진이 작업 테이블에 분식 포장을 풀어 놓았다. 떡볶이 1인분과 돈까스 한 접시. 맞은편이 아니라 옆자리에 의자가 하나 더 놓여 있다." }
      - say: { char: 도윤, with: [어른아진], text: "돈까스는 왜요." }
      - say: { char: 어른아진, with: [도윤], text: "그냥. 좋아했으니까." }
      - say: { channel: action, with: [], text: "도윤은 옆자리에 앉는다." }
      - say: { char: 도윤, with: [어른아진], text: "기억은 안 나요. 그래도 들을게요. 처음부터." }
      - say: { char: 어른아진, with: [도윤], text: "처음부터면 길어요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "사천 원어치만요. 반은 제가 낼게요." }
      - say: { channel: action, with: [], text: "아진이 젓가락을 내려놓고 웃는다. 이번엔 아진이 눈이 없어지게 웃는다. 그리고 카메라를 들어 도윤을 찍는다." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { char: 어른아진, with: [도윤], text: "웃지 마요. 눈 없어져요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "지워요." }
      - say: { char: 어른아진, with: [도윤], text: "안 지워요." }
      - clearSticker: { id: e5_two_bowls, leave: fadeOut }
      - ending: side_seat

  e5_erase:
    title: "3층"
    actions:
      - say: { channel: action, with: [], text: "도윤은 계단을 오른다." }
      - bg: { id: surgery, transition: fade, duration: 600 }
      - place: "3층 · 시술실"
      - char: { id: 상담사, position: left }
      - say: { char: 상담사, with: [도윤], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요." }
      - sound: consent_pen
      - say: { channel: action, with: [], text: "이번엔 손이 떨리지 않는다. 한도윤이라고 쓰고 끝에 작은 점을 찍는다." }
      - say: { char: 상담사, with: [도윤], text: "지난번에도 사진 한 장은 남겨 달라고 하셨어요. 이번에도 그러실래요?" }
      - say: { char: 도윤.hollow, with: [상담사], text: "네." }
      - say: { channel: thought, with: [], text: "어떤 사진을 남겼는지 생각나지 않는다." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 520 }
      - music: null
      - move: { id: 상담사, style: exit }
      - bg: { id: clinic_hall, transition: cut }
      - place: "오후 · 1층"
      - say: { channel: action, with: [], text: "유리문 밖에 우산 없는 사람이 서 있다. 처음 보는 사람이다." }
      - say: { channel: action, with: [], text: "도윤은 그 앞을 지나간다." }
      - ending: erase_loop

  e5_call:
    title: "전화"
    actions:
      - say: { channel: action, with: [], text: "도윤은 지수에게 전화한다. 신호가 가는 동안 할 말을 고른다." }
      - say: { channel: thought, with: [], text: "미안하다, 다 지우겠다. 그 말은 지운다." }
      - say: { channel: action, with: [], text: "지수가 받는다." }
      - say: { char: 도윤, with: [지수], text: "지수야. 나 열여덟 살 때 이름은 유하린이었어." }
      - say: { char: 도윤, with: [지수], text: "나 기다리는 친구가 있었는데, 안 갔어. 이번엔 안 지울게." }
      - branch:
          cases:
            - when: { var: told_jisu, op: gte, value: 2 }
              goto: e5_two_names
          default: e5_unfinished

  e5_two_names:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 600 }
      - music: studio
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수], text: "지수는 한참 말이 없다." }
      - say: { char: 지수.warm, with: [도윤], text: "그 이름으로도 한 번 불러 봐도 돼?" }
      - say: { char: 도윤, with: [지수], text: "응." }
      - say: { char: 지수.warm, with: [도윤], text: "하린아. 저녁 먹으러 와." }
      - ending: two_names

  e5_unfinished:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 600 }
      - music: wind
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "반지는 신발장 위에 뒀어."
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "안 지운다는 말은 믿어 볼게."
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "근데 나한테 처음 한 진짜 얘기가 오늘이라서, 좀 생각할게."
      - say: { channel: action, with: [], text: "도윤은 그 메시지를 지우지 않는다." }
      - ending: unfinished
