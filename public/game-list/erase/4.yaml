chapterTitle: "ERASE"

script:
  - scene: e5_lobby

scenes:
  # The last chapter makes the stake readable before the choice: the form lists exactly what a
  # second erasure takes, and each ending is followed to the wedding day so its cost is seen.
  e5_lobby:
    title: "1층"
    actions:
      - say: { channel: card, with: [], text: "결혼 나흘 전 · 화요일", autoAdvance: 1800 }
      - bg: { id: clinic_hall, transition: cut }
      - music: cold_room
      - place: "오전 9시 40분 · ERASE 클리닉 1층 · 비"
      - char: { id: 도윤, position: center }
      - say: { channel: action, with: [도윤], text: "접수대 직원이 이름을 확인하고 서류철을 내민다. 위에서 부를 때까지 앉아 기다리라고 한다." }
      - say: { channel: action, with: [도윤], text: "대기실 의자는 유리문을 향해 놓여 있다. 밖은 비다. 우산 꽂이에 우산이 하나도 없다." }
      - wait: 900
      - say: { channel: record, with: [], text: "시술 동의서 · 신청인 한도윤 · 지울 기간: 2027년 4월 2일부터 오늘까지" }
      - say: { channel: record, with: [], text: "지워지는 것: 본인의 기억. 남는 것: 다른 사람의 기억, 기기 속 기록." }
      - say: { channel: thought, with: [], text: "4월 2일. 사진관에 간 날이다." }
      - wait: 700
      - say: { channel: thought, with: [], text: "지우면 무엇이 없어지는지 하나씩 세어 본다." }
      - say: { channel: thought, with: [], text: "셔터가 멈추고 누가 모르는 이름을 불렀던 것." }
      - say: { channel: thought, with: [], text: "상담실 화면에 뜬 유하린이라는 이름과, 이름 끝의 점." }
      - say:
          channel: thought
          with: []
          when: { var: sorry, op: eq, value: true }
          text: "교실 창가 셋째 줄. 미안하다고 했더니 아진이 웃던 것."
      - say:
          channel: thought
          with: []
          when: { var: sorry, op: eq, value: false }
          text: "교실 창가 셋째 줄. 아진이 앉아 있던 옆자리."
      - say:
          channel: thought
          with: []
          when: { var: told_jisu, op: gte, value: 2 }
          text: "식탁에서 지수가 물었던 것. 나도 언젠가 지울 수 있는 거야."
      - say:
          channel: thought
          with: []
          when: { var: told_jisu, op: lt, value: 2 }
          text: "식탁 위에 놓여 있던 퇴원 확인서. 요즘 어디 다니느냐는 지수의 목소리."
      - wait: 800
      - say: { channel: thought, with: [], text: "지우면 이 넷은 나한테서만 없어진다. 아진은 그대로 안다. 지수가 들은 것도 그대로 남는다." }
      - say: { channel: thought, with: [], text: "열한 해 전에도 그랬을 것이다. 나만 가벼워졌고, 남은 사람은 그대로 들고 있었다." }
      - wait: 900
      - say: { channel: action, with: [도윤], text: "휴대폰이 울린다." }
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "오늘 저녁 같이 먹자. 내가 할게. 늦어도 돼."
      - say:
          channel: message
          thread: 정아진
          side: them
          char: 어른아진
          with: []
          when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }] }
          media: { src: assets/items/child_photo.svg, alt: "미끄럼틀 위에서 눈이 없어지게 웃는 일곱 살 아이의 사진 원본" }
          text: "엄마 집에서 원본을 찾았어요. 오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
      - say: { channel: action, with: [도윤], text: "위층에서 이름을 부른다. 한도윤 님." }
      - say: { channel: action, with: [도윤], text: "도윤은 서류철을 무릎에 올려놓은 채 일어선다. 3층으로 가는 계단과 1층 유리문이 같은 거리에 있다.", continueLabel: "일어선다" }
      - choice:
          key: e5_final
          prompt: "도윤은 계단과 유리문 사이에 서 있다."
          options:
            - text: "3층으로 올라간다"
              goto: e5_erase
            - text: "사진관으로 간다"
              goto: e5_side
              when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }] }
            - text: "지수에게 전화한다"
              goto: e5_call

  # ---- Ending: ERASE. The weight moves to the people who remember.
  e5_erase:
    title: "3층"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 계단을 오른다. 한 층에 열여덟 칸이다." }
      - bg: { id: surgery, transition: fade, duration: 900 }
      - place: "3층 · 시술실"
      - char: { id: 상담사, position: left }
      - say: { char: 상담사, with: [도윤], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요.", continueLabel: "동의서에 서명한다" }
      - sound: consent_pen
      - say: { channel: action, with: [도윤, 상담사], text: "이번엔 손이 떨리지 않는다. 한도윤이라고 쓰고 끝에 작은 점을 찍는다." }
      - say: { char: 상담사, with: [도윤], text: "지난번에도 사진 한 장은 남겨 달라고 하셨어요. 이번에도 그러실래요?" }
      - say: { char: 도윤.hollow, with: [상담사], text: "네." }
      - say: { channel: thought, with: [], text: "어떤 사진을 남겼는지 생각나지 않는다." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 1200 }
      - music: null
      - wait: 1600
      - move: { id: 상담사, style: exit }
      - say: { channel: card, with: [], text: "나흘 뒤 · 5월 1일", autoAdvance: 2000 }
      - bg: { id: couple_home, transition: fade, duration: 1200 }
      - music: wind
      - place: "결혼식 날 아침 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 넥타이를 바로잡아 준다. 도윤은 웃는다. 웃으면 눈이 없어진다." }
      - say: { char: 지수, with: [도윤], text: "사진관에서 문자 왔어. 정아진 작가님이 오늘 촬영은 못 오신대. 다른 작가님 보낸대." }
      - say: { char: 도윤, with: [지수], text: "정아진? 누구였지." }
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_jisu, op: gte, value: 2 }
          text: "지수가 넥타이에서 손을 떼지 않는다. 한참 도윤을 본다."
      - wait: 900
      - say:
          char: 지수.cold
          with: [도윤]
          when: { var: told_jisu, op: gte, value: 2 }
          wait: 2000
          unskippable: true
          delivery: "whisper"
          text: "…하린아."
      - say:
          char: 도윤
          with: [지수]
          when: { var: told_jisu, op: gte, value: 2 }
          text: "응? 누구?"
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_jisu, op: gte, value: 2 }
          text: "아니야. 넥타이 됐다."
      - say:
          channel: thought
          with: []
          when: { var: told_jisu, op: gte, value: 2 }
          text: "지수는 오늘 아침부터 그 이름을 혼자 들고 있다. 도윤은 모른다."
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_jisu, op: lt, value: 2 }
          text: "청첩장 사진 찍어 준 분. 너 웃는 거 보고 아는 사람 닮았다던."
      - say:
          char: 도윤
          with: [지수]
          when: { var: told_jisu, op: lt, value: 2 }
          text: "그랬나. 기억이 안 나네."
      - say: { channel: action, with: [지수, 도윤], text: "식장 로비에 화환이 줄지어 서 있다. 리본 하나에 정아진이라는 이름이 적혀 있다. 도윤은 그 앞을 지나간다." }
      - ending: erase_loop

  # ---- Ending: the seat she kept. The past comes back from the one who remembers it.
  e5_side:
    title: "옆자리"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 서류철을 접수대에 돌려준다. 유리문을 밀고 나간다. 비가 얼굴에 닿는다." }
      - say:
          channel: message
          thread: ERASE 클리닉
          side: them
          speakerName: ERASE 클리닉
          with: []
          text: "예약이 취소되었습니다."
      - bg: { id: photo_studio, transition: fade, duration: 900 }
      - music: studio
      - place: "점심 · 사진관"
      - char: { id: 어른아진, position: left }
      - sticker:
          id: s5_bowls
          image: two_bowls_sticker
          x: 50
          y: 40
          width: "clamp(180px, 28%, 320px)"
          enter: fadeIn
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 작업 테이블에 분식 포장을 풀어 놓았다. 떡볶이 1인분과 돈까스 한 접시. 맞은편이 아니라 옆자리에 의자가 하나 더 놓여 있다." }
      - say: { char: 도윤, with: [어른아진], text: "돈까스는 왜요." }
      - say: { char: 어른아진, with: [도윤], text: "그냥. 좋아했으니까." }
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 옆자리에 앉는다." }
      - say: { char: 도윤, with: [어른아진], text: "아까 3층까지 갈 뻔했어요. 예약해 둔 게 있었거든요." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "……" }
      - say: { char: 도윤, with: [어른아진], text: "기억은 안 나요. 앞으로도 안 날 거래요. 그래도 들을게요. 처음부터." }
      - say: { char: 어른아진, with: [도윤], text: "처음부터면 길어요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "사천 원어치만요. 반은 제가 낼게요." }
      - clearSticker: { id: s5_bowls, leave: fadeOut }
      - wait: 600
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 서랍에서 앨범 하나를 꺼낸다. 표지에 2016이라고 매직으로 적혀 있다." }
      - sticker:
          id: s5_classroom
          image: harin_photo_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 어른아진, with: [도윤], text: "이게 3월 10일. 돈까스 나온 날. 급식표 찍고 나서 저렇게 웃었어요." }
      - say: { char: 어른아진, with: [도윤], text: "말은 맨날 됐어, 관심 없어, 그랬어요. 근데 남들 얘기는 하나도 안 빼고 다 들었어요. 그래서 다들 걔가 괜찮은 줄 알았어요." }
      - say: { char: 도윤, with: [어른아진], text: "괜찮았어요?" }
      - say: { char: 어른아진.awkward, with: [도윤], text: "아니요. 저는 그걸 알았는데 말을 안 했어요." }
      - wait: 700
      - say: { char: 도윤, with: [어른아진], text: "지금도 점심 메뉴를 찍어요. 왜 찍는지도 모르고." }
      - say: { char: 어른아진, with: [도윤], text: "이제 알잖아요." }
      - clearSticker: { id: s5_classroom, leave: fadeOut }
      - say: { char: 어른아진, with: [도윤], text: "토요일 촬영, 원래 작가님한테 돌려 드릴까 했어요. 제가 찍어도 될까요?" }
      - say: { char: 도윤, with: [어른아진], text: "찍어 주세요. 그리고 하객석에도 앉아 주세요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "제 쪽에요. 제 쪽에 아직 열두 명뿐이라서." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 젓가락을 내려놓고 웃는다. 이번엔 아진이 눈이 없어지게 웃는다. 그리고 카메라를 들어 도윤을 찍는다." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { char: 어른아진, with: [도윤], text: "웃지 마요. 눈 없어져요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "지워요." }
      - say: { char: 어른아진, with: [도윤], text: "안 지워요." }
      - move: { id: 어른아진, style: exit }
      - bg: { id: couple_home, transition: fade, duration: 1000 }
      - place: "그날 저녁 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "도윤은 앨범을 식탁에 올려놓고 처음부터 다 말한다. 클리닉, 유하린, 교실, 오늘 아침의 계단." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 숟가락을 든 채로 끝까지 듣는다. 그리고 앨범을 넘긴다. 3월 10일에서 손이 멈춘다." }
      - say: { char: 지수.warm, with: [도윤], text: "웃는 거 똑같네." }
      - say: { char: 지수, with: [도윤], text: "하객 명단 다시 줘 봐. 네 쪽." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 도윤 쪽 맨 위 칸에 이름 하나를 적는다. 정아진." }
      - ending: side_seat

  # ---- Ending: the person he will live with hears it from him.
  e5_call:
    title: "전화"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 지수에게 전화한다. 신호가 가는 동안 할 말을 고른다." }
      - say: { channel: thought, with: [], text: "미안하다는 말부터 하려다 만다. 그 말로 또 끝낼 것 같아서." }
      - say: { channel: action, with: [도윤], text: "지수가 받는다." }
      - say: { char: 도윤, with: [], text: "지수야. 나 지금 ERASE 클리닉 1층이야. 위에서 나를 부르고 있어." }
      - say: { char: 도윤, with: [], text: "올라가기 전에 너한테 먼저 말하고 싶었어." }
      - say: { channel: action, with: [도윤], text: "전화가 끊긴다. 이십 분 뒤 유리문이 열린다. 지수가 회사 출입증을 목에 건 채 들어온다. 우산이 없다." }
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 도윤 옆자리에 앉는다. 서류철을 가져가 맨 위 줄을 읽는다. 지울 기간: 2027년 4월 2일부터 오늘까지." }
      - say: { char: 지수.cold, with: [도윤], text: "4월 2일이면, 나랑 청첩장 사진 찍은 날부터네." }
      - say: { char: 도윤.hollow, with: [지수], text: "응." }
      - say: { char: 도윤, with: [지수], text: "나 열여덟 살 때 이름은 유하린이었어. 기다리는 친구가 있었는데, 안 갔어." }
      - say: { char: 도윤, with: [지수], text: "그걸 알고 나서 너무 무거워서, 또 지우려고 했어. 이번엔 안 지울게." }
      - wait: 900
      - branch:
          cases:
            - when: { var: told_jisu, op: gte, value: 2 }
              goto: e5_two_names
          default: e5_unfinished

  e5_two_names:
    actions:
      - say: { channel: action, with: [지수, 도윤], text: "지수는 서류철을 덮어 접수대에 돌려준다. 오는 길에 다 생각해 왔다는 얼굴이다." }
      - say: { char: 지수, with: [도윤], text: "월요일에 네가 다 말해 줬잖아. 그날부터 나는 두 이름을 다 알고 있었어." }
      - say: { char: 지수.warm, with: [도윤], text: "지웠으면, 나 혼자 그걸 들고 결혼할 뻔했네." }
      - say: { char: 지수.warm, with: [도윤], text: "그 이름으로도 한 번 불러 봐도 돼?" }
      - say: { char: 도윤, with: [지수], text: "응." }
      - say: { char: 지수.warm, with: [도윤], text: "하린아. 저녁 먹으러 가자. 도윤이도 같이." }
      - say: { channel: action, with: [지수, 도윤], text: "도윤이 웃는다. 눈이 없어진다. 지수가 그 얼굴을 한 번 찍는다." }
      - ending: two_names

  e5_unfinished:
    actions:
      - say: { channel: action, with: [지수, 도윤], text: "지수는 오래 말하지 않는다. 서류철 맨 위 줄을 손가락으로 몇 번 짚는다." }
      - say: { char: 지수.cold, with: [도윤], text: "오늘 처음 들었어. 네가 지우려던 게 뭔지. 그 안에 나랑 찍은 사진관도 들어 있었다는 것도." }
      - say: { char: 지수, with: [도윤], text: "말해 줘서 고마워. 진짜로. 근데 나는 오늘 처음 들었어." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 반지를 빼서 서류철 위에 올려놓는다." }
      - say: { char: 지수, with: [도윤], text: "식은 미루자. 없던 일로 하자는 거 아니야. 나도 들은 걸 들고 있을 시간이 필요해." }
      - say: { char: 지수, with: [도윤], text: "반지는 네가 들고 있어. 지우지 말고." }
