chapterTitle: "ERASE"

script:
  - scene: rooftop

scenes:
  rooftop:
    title: "옥상"
    actions:
      - bg: { id: rooftop, transition: fade, duration: 1400 }
      - music: wind
      - place: "월요일 점심 · 회사 옥상"
      - char: { id: 도윤, position: center, emotion: hollow }
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 금요일 회식 투표 1.고깃집 2.횟집"
          autoAdvance: 1824
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 2"
          autoAdvance: 1216
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 1이요 저번에 횟집 가서 다들 배고프다 했잖아요"
          autoAdvance: 2016
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 결혼 축하 겸이니까 도윤대리님이 고르세요ㅋㅋ"
          autoAdvance: 2144
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 청첩장 아직 못 받았는데 저만 못 받았나요"
          autoAdvance: 1920
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 화분은 결국 제가 매일 주고 있습니다 반 컵씩"
          autoAdvance: 1984
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 팀장님 오시면 보여드려야 되는데 …오시긴 하시겠죠?"
          autoAdvance: 2080
      - say:
          channel: system
          when: { var: told_jisu, op: eq, value: 2 }
          with: []
          text: "이지수 · 읽지 않은 메시지 4"
      - say:
          channel: message
          side: them
          with: []
          text: "[ERASE 클리닉] 상담 예약이 확정되었습니다. 내일 오전 10:00. 신분증과 동의서를 지참해 주세요."
      - say:
          channel: system
          with: []
          text: "예약 신청 · 일요일 오전 3:02 · 신청자 본인"
      - say:
          channel: thought
          with: []
          text: "연락처 412개. 사진 8,031장. 계정 일곱 개. 지수 것부터."
      - say:
          char: 의사
          with: []
          text: "눈 뜨면… 새로 시작해요."
      - say:
          char: 도윤.hollow
          motion: shiver
          with: []
          delivery: whisper
          text: "…이거 어디서 들었더라."
      - say:
          char: 도윤.hollow
          with: []
          delivery: whisper
          text: "…상담 때 들은 건가. 아직 상담도 안 받았는데."
      - goto: mismatch

  mismatch:
    title: "안 맞는 것"
    actions:
      - say:
          char: 도윤.hollow
          with: []
          delivery: whisper
          text: "일요일 새벽 세 시 이 분."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "그 시간에 나 뭐 했지."
      - say:
          channel: thought
          with: []
          text: "토요일엔 지수랑 식장에 가서 좌석표를 봤고, 집에 와선 셔츠도 안 갈아입고 누웠다."
      - say:
          channel: thought
          with: []
          text: "다음에 생각나는 건 일요일 저녁, 다리미 앞에 서 있던 거다. 그사이에 내가 예약을 했다고?"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…술도 안 마셨는데."
      - say:
          channel: action
          with: []
          text: "도윤은 예약 문자를 길게 누른다. 삭제 메뉴를 닫고 발신자 이름을 누른다."
      - say:
          channel: system
          with: []
          text: "ERASE 클리닉 · 고객 조회\n본인 인증 완료 (한도윤)"
      - say:
          channel: system
          with: []
          text: "회원 가입 · 2016. 3.\n상담 이력 · 2건"
      - say:
          char: 도윤.panic
          motion: startle
          with: []
          delivery: whisper
          text: "두 건?"
      - goto: mismatch_dig

  mismatch_dig:
    actions:
      - say:
          channel: system
          with: []
          text: "1건 · 2016. 3. · 완료\n2건 · 내일 오전 10:00 · 예정"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "2016년 삼월에 나는 고3이었어. 열여덟."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "열여덟이 여기 뭘 상담하러 와."
      - say:
          channel: action
          with: []
          text: "도윤은 사진첩을 연다. 아래로 끌어내리는 손가락이 멈추지 않는다."
      - say:
          channel: system
          with: []
          text: "최근 항목 · 맨 아래로 이동\n2016년 3월 — 사진 1,204장"
      - say:
          channel: action
          when: { var: e2_gallery, op: eq, value: true }
          with: []
          text: "목요일 밤에도 여기까지 내려왔다. 그때는 사진 한 장만 보고 닫았다."
      - say:
          channel: thought
          with: []
          text: "그 아래가 없다. 여덟 달 전 사진도, 열 살 사진도, 초등학교 졸업식도."
      - say:
          channel: thought
          with: []
          text: "가장 오래된 사진이 전부 그해 3월에 몰려 있다. 천이백네 장이 한 달 치라고?"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "폰을 바꿨으니까. 옮기다 날린 거야. 그럴 수 있어."
      - say:
          channel: action
          with: []
          text: "도윤은 지갑을 꺼내 신분증을 본다. 내일 가져오라고 한 물건이다."
      - say:
          channel: record
          with: []
          text: "주민등록증 · 한도윤\n발급 · 2016. 3. 28."
      - say:
          channel: thought
          with: []
          text: "신분증 사진은 지금보다 어려 보인다. 발급 날짜는 열여덟 살 때다."
      - say:
          channel: thought
          with: []
          text: "그런데 그 전의 것이 하나도 없다. 사진도, 계정도, 번호도."
      - say:
          channel: system
          with: []
          text: "계정 관리 · 가입일\n메일 2016. 3. / 메신저 2016. 3. / 지도 2016. 3. / 사진 2016. 3."
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "일곱 개 다야."
      - goto: mismatch_two

  mismatch_two:
    actions:
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: true }
          with: []
          text: "검색 기록을 열자 ‘표시할 항목 없음’만 뜬다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: true }
          text: "나는 이걸 누구한테 배웠지."
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: false }
          with: []
          text: "검색 기록에는 ‘hiv 잠복기’, ‘보건소 익명검사 몇시’가 남아 있다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: false }
          text: "지우려면 손가락 한 번이면 되는데, 이건 아직 여기 있다."
      - say:
          channel: thought
          with: []
          text: "클리닉 문자에 '정리'라는 말이 있었다. 동의서 3번 항목."
      - say:
          channel: record
          with: []
          text: "ERASE 동의서 제3항\n본인이 직접 정리하지 않은 기록은 시술 후에도 그대로 남습니다. 클리닉은 외부 기록을 삭제하지 않습니다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "본인이 정리하지 않은 건 그대로 남는다."
      - say:
          channel: thought
          with: []
          text: "다른 데 남은 걸 찾아보자. 그때 빠뜨린 게 있을지도 몰라."
      - say:
          channel: system
          when: { var: e0_messages, op: eq, value: false }
          with: []
          text: "대화 · 저장되지 않은 번호 · 2027. 3. 20.\n보관됨"
      - say:
          channel: system
          when: { var: e0_photos, op: eq, value: false }
          with: []
          text: "사진 · 2027. 3. 20. 오전 2:06 · 4장\n보관됨"
      - say:
          channel: system
          when: { var: e0_location, op: eq, value: false }
          with: []
          text: "타임라인 · 2027. 3. 20. 오전 1:42\n보관됨"
      - say:
          channel: thought
          when:
            any:
              - { var: e0_messages, op: eq, value: false }
              - { var: e0_photos, op: eq, value: false }
              - { var: e0_location, op: eq, value: false }
          text: "삼 주 전 것도 안 지운 게 있다. 그건 내가 정리를 덜 한 거고, 그래서 남았다."
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "삼 주 전 새벽 것은 하나도 없다. 메시지도 사진도 위치도. 손이 알아서 했다."
      - say:
          channel: thought
          when:
            all:
              - { var: e0_messages, op: eq, value: true }
              - { var: e0_photos, op: eq, value: true }
              - { var: e0_location, op: eq, value: true }
          text: "삭제 화면을 닫기 전에 날짜 칸을 또 봤다. 방금도 본 곳이다."
      - goto: mismatch_photo

  mismatch_photo:
    actions:
      - branch:
          cases:
            - when: { var: kept_photo, op: eq, value: true }
              goto: mismatch_photo_kept
          default: mismatch_photo_gone

  mismatch_photo_kept:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 1장\n날짜 정보 없음"
      - say:
          channel: action
          with: []
          text: "목요일 밤에 엄지를 떼고 닫은 한 장이다. 아직 있다."
      - sticker:
          id: e4_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "미끄럼틀에서 눈이 안 보이게 웃던 애. 사촌 동생인 줄 알았어."
      - say:
          channel: thought
          with: []
          text: "찍은 날짜를 지워도 사진은 남는다. 이 사진도 누가 날짜만 지웠을까."
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "누가 이걸 일부러 남겼어."
      - clearSticker: { id: e4_photo, leave: fadeOut }
      - goto: mismatch_name

  mismatch_photo_gone:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 항목 없음"
      - say:
          channel: action
          with: []
          text: "한 장 있었다. 목요일 밤에 휴지통까지 비웠다."
      - say:
          channel: thought
          with: []
          text: "미끄럼틀에서 웃느라 눈이 없어진 애였다. 사촌 동생인가 했다."
      - say:
          channel: thought
          with: []
          text: "날짜가 없어서 언제 찍은 건지 보고 싶었는데. 이제 사진도 없다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…비울 때 손이 한 번 멈췄는데."
      - goto: mismatch_name

  mismatch_name:
    actions:
      - say:
          channel: action
          with: []
          text: "도윤은 검색창에 자기 이름을 치고 화면을 맨 아래까지 내린다."
      - say:
          channel: message
          side: me
          with: []
          text: "한도윤 2016"
      - say:
          channel: message
          side: them
          with: []
          text: "검색 결과 없음"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…없을 수가 없잖아. 고3이었는데."
      - say:
          channel: thought
          with: []
          text: "졸업 사진. 반 단체 사진. 체육대회. 누가 올린 것 하나라도."
      - say:
          channel: thought
          with: []
          text: "내가 정리한 게 아니면 남아 있어야 한다. 3번 항목이 그렇게 돼 있다."
      - say:
          channel: action
          with: []
          text: "결과는 그대로다. 도윤은 검색창에 적힌 세 글자를 다시 본다."
      - say:
          char: 도윤.panic
          motion: shiver
          with: []
          delivery: whisper
          text: "이름이 틀렸구나."
      - say:
          channel: thought
          with: []
          text: "그 반에 한도윤은 없었다. 2016년 삼월에 교실에 앉아 있던 애는 다른 이름이었다."
      - say:
          channel: thought
          with: []
          text: "일단 이름부터 쳐 보려다가 손을 뗐다. 성도 이름도 떠오르지 않는다."
      - say:
          channel: action
          with: []
          text: "옥상 바람이 셔츠 안으로 들어온다. 도윤은 난간을 잡는다. 손이 미끄러워서 한 번 다시 잡는다."
      - effect: { name: darken, wait: true }
      - goto: harin_morning

  harin_morning:
    pov: "유하린"
    title: "2016년 삼월"
    actions:
      - bg: { id: harin_room, transition: cut }
      - music: static
      - say:
          channel: card
          with: []
          text: "열한 해 전\n유하린 · 18"
      - place: "토요일 새벽 5:10 · 하린의 방"
      - char: { id: 하린, position: center, emotion: blank }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "교복은 의자 등받이에 걸어 두었다. 월요일 시간표대로 싼 가방은 발치에 그대로 있다."
      - say:
          channel: thought
          with: []
          text: "메시지. 사진. 위치. 오늘 안에 다."
      - say:
          channel: action
          with: []
          text: "방에는 아무도 없는데 휴대폰 밝기를 끝까지 낮춘다."
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 전화 좀 받아"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "내가 그날 문 봤다고 한 거 애들한테 말 안 했어 진짜 안 했어"
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "니가 한 거 아니면 아니라고 한 번만 더 말해줘 그러면 나 믿어"
      - say:
          channel: message
          side: them
          char: 아진
          when: { var: h1_sent, op: eq, value: true }
          with: []
          text: "너 그때 껴달라고 한 거 나 계속 생각나 그거 장난 아니었지"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          wait: 700
          text: "나 아니야"
      - say:
          channel: system
          with: []
          text: "대화방에서 나갔습니다.\n이 번호를 차단했습니다."
          wait: 900
      - say:
          channel: system
          with: []
          text: "사진 1,204장을 백업하시겠습니까?\n아니오 — 이 기기에만 보관됩니다."
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "…이건 가져갈 거야."
      - say:
          channel: action
          with: []
          text: "하린은 사진첩을 끝까지 내려간다. 맨 아래 한 장에서 멈춘다."
      - sticker:
          id: e4_slide
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          channel: system
          with: []
          text: "사진 정보 · 2005. 7. 12. · 중랑구\n날짜 및 위치 정보를 삭제하시겠습니까?"
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "네."
      - say:
          channel: system
          with: []
          text: "날짜와 위치 정보가 삭제되었습니다. 사진은 그대로 보관됩니다."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "날짜도 장소도 없으면 그냥 애기 사진이잖아. 나인 줄 아무도 모르고."
      - clearSticker: { id: e4_slide, leave: fadeOut }
      - say:
          channel: system
          with: []
          text: "타임라인 · 지난 기록 전체 삭제\n이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - say:
          channel: action
          with: []
          text: "하린은 교복 이름표를 실밥째 뜯어 봉투에 넣는다. 봉투는 책상 서랍에 둔다. 가져가지 않는다."
      - goto: reveal

  reveal:
    pov: "유하린"
    title: "수술대"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - char: { id: 하린, position: center }
      - say:
          char: 의사
          with: []
          text: "정말 하시겠어요? 한 번 지운 기억은 돌릴 수 없어요."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "네."
      - say:
          char: 의사
          with: []
          text: "지금 쓰는 이름도 바뀝니다. 깨고 나면 그 이름으로 살던 일도 기억 못 하실 거예요."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "네. 그거 하러 왔어요."
      - say:
          char: 의사
          with: []
