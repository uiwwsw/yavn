chapterTitle: "ERASE"

script:
  - scene: rooftop

scenes:
  rooftop:
    title: "옥상"
    actions:
      - bg: { id: rooftop, transition: fade, duration: 1400 }
      - music: wind
      - place: "월요일 점심 · 회사 옥상"
      - char: { id: 도윤, position: center, emotion: hollow }
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 송과장: 금요일 회식 투표 1.고깃집 2.횟집"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 오대리: 2"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 1이요 저번에 횟집 가서 다들 배고프다 했잖아요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 도윤대리님 결혼 축하 겸이니까 도윤대리님이 고르세요ㅋㅋ"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 청첩장 아직 못 받았는데 저만 못 받았나요"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 화분은 결국 제가 매일 주고 있습니다 반 컵씩"
      - say:
          channel: message
          side: them
          with: []
          text: "[영업2팀] 윤주임: 팀장님 오시면 보여드려야 되는데 …오시긴 하시겠죠?"
      - say:
          channel: system
          when: { var: told_jisu, op: eq, value: 2 }
          with: []
          text: "이지수 · 읽지 않은 메시지 4"
      - say:
          channel: message
          side: them
          with: []
          text: "[ERASE 클리닉] 상담 예약이 확정되었습니다. 내일 오전 10:00. 신분증과 동의서를 지참해 주세요."
      - say:
          channel: system
          with: []
          text: "예약 신청 · 일요일 오전 3:02 · 신청자 본인"
      - say:
          channel: thought
          with: []
          text: "연락처 412개. 사진 8,031장. 계정 일곱 개. 지수 것부터."
      - say:
          char: 의사
          with: []
          text: "눈 뜨면… 새로 시작해요."
      - say:
          char: 도윤.hollow
          motion: shiver
          with: []
          delivery: whisper
          text: "…이거 어디서 들었더라."
      - say:
          char: 도윤.hollow
          with: []
          delivery: whisper
          text: "…상담 때 들은 건가. 아직 상담도 안 받았는데."
      - goto: mismatch

  mismatch:
    title: "안 맞는 것"
    actions:
      - say:
          char: 도윤.hollow
          with: []
          delivery: whisper
          text: "일요일 새벽 세 시 이 분."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "그 시간에 나 뭐 했지."
      - say:
          channel: thought
          with: []
          text: "토요일에 지수랑 식장 2차 보고, 들어와서 누웠고, 일어나서 일요일 저녁에 넥타이 다렸고."
      - say:
          channel: thought
          with: []
          text: "새벽 세 시가 없다. 없는 게 아니라 안 떠오른다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…술도 안 마셨는데."
      - say:
          channel: action
          with: []
          text: "도윤은 예약 문자를 길게 누른다. 삭제가 아니라 상단의 발신자 이름을 누른다."
      - say:
          channel: system
          with: []
          text: "ERASE 클리닉 · 고객 조회\n본인 인증 완료 (한도윤)"
      - say:
          channel: system
          with: []
          text: "회원 가입 · 2016. 3.\n상담 이력 · 2건"
      - say:
          char: 도윤.panic
          motion: startle
          with: []
          delivery: whisper
          text: "두 건?"
      - goto: mismatch_dig

  mismatch_dig:
    actions:
      - say:
          channel: system
          with: []
          text: "1건 · 2016. 3. · 완료\n2건 · 내일 오전 10:00 · 예정"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "2016년 삼월에 나는 고3이었어. 열여덟."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "열여덟이 여기 뭘 상담하러 와."
      - say:
          channel: action
          with: []
          text: "도윤은 사진첩을 연다. 아래로 끌어내리는 손가락이 멈추지 않는다."
      - say:
          channel: system
          with: []
          text: "최근 항목 · 맨 아래로 이동\n2016년 3월 — 사진 1,204장"
      - say:
          channel: action
          when: { var: e2_gallery, op: eq, value: true }
          with: []
          text: "목요일 밤에도 여기까지 내려왔다. 그때는 사진 한 장만 보고 닫았다."
      - say:
          channel: thought
          with: []
          text: "그 아래가 없다. 여덟 달 전 사진도, 열 살 사진도, 초등학교 졸업식도."
      - say:
          channel: thought
          with: []
          text: "천이백네 장이 그 한 달에 몰려 있고, 그 한 달이 제일 오래된 달이다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "폰을 바꿨으니까. 옮기다 날린 거야. 그럴 수 있어."
      - say:
          channel: action
          with: []
          text: "도윤은 지갑을 꺼내 신분증을 본다. 클리닉이 내일 가져오라고 한 것이다."
      - say:
          channel: record
          with: []
          text: "주민등록증 · 한도윤\n발급 · 2016. 3. 28."
      - say:
          channel: thought
          with: []
          text: "열여덟에 받았으니 맞는 날짜다. 다들 그 나이에 받는다."
      - say:
          channel: thought
          with: []
          text: "그런데 그 전의 것이 하나도 없다. 사진도, 계정도, 번호도."
      - say:
          channel: system
          with: []
          text: "계정 관리 · 가입일\n메일 2016. 3. / 메신저 2016. 3. / 지도 2016. 3. / 사진 2016. 3."
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "일곱 개 다야."
      - goto: mismatch_two

  mismatch_two:
    actions:
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: true }
          with: []
          text: "검색 기록은 깨끗하다. 목요일 밤에 복구 안 되게 지웠다. 그 전에도 그랬고, 그 전에도 그랬다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: true }
          text: "나는 이걸 누구한테 배웠지."
      - say:
          channel: action
          when: { var: e2_search, op: eq, value: false }
          with: []
          text: "검색 기록이 남아 있다. hiv 잠복기. 보건소 익명검사 몇시. 지우지 않은 것이 이것뿐이다."
      - say:
          channel: thought
          when: { var: e2_search, op: eq, value: false }
          text: "지우는 게 손에 붙어 있는데 이것만 놔뒀다. 왜 이것만."
      - say:
          channel: thought
          with: []
          text: "클리닉 문자에 '정리'라는 말이 있었다. 동의서 3번 항목."
      - say:
          channel: record
          with: []
          text: "ERASE 동의서 제3항\n본인이 직접 정리하지 않은 기록은 시술 후에도 그대로 남습니다. 클리닉은 외부 기록을 삭제하지 않습니다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "본인이 정리하지 않은 건 그대로 남는다."
      - say:
          channel: thought
          with: []
          text: "그럼 남은 걸 찾으면 된다. 누가 정리하다 빠뜨린 것."
      - goto: mismatch_photo

  mismatch_photo:
    actions:
      - branch:
          cases:
            - when: { var: kept_photo, op: eq, value: true }
              goto: mismatch_photo_kept
          default: mismatch_photo_gone

  mismatch_photo_kept:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 1장\n날짜 정보 없음"
      - say:
          channel: action
          with: []
          text: "목요일 밤에 엄지를 떼고 닫은 한 장이다. 아직 있다."
      - sticker:
          id: e4_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "미끄럼틀에서 웃느라 눈이 없어진 애. 사촌 동생인가 했는데."
      - say:
          channel: thought
          with: []
          text: "날짜가 없다. 날짜 정보를 지우면 사진은 남는다. 그것만 남게 할 수 있다."
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "누가 이걸 일부러 남겼어."
      - clearSticker: { id: e4_photo, leave: fadeOut }
      - goto: mismatch_name

  mismatch_photo_gone:
    actions:
      - say:
          channel: system
          with: []
          text: "2016년 3월 아래 · 항목 없음"
      - say:
          channel: action
          with: []
          text: "한 장 있었다. 목요일 밤에 휴지통까지 비웠다."
      - say:
          channel: thought
          with: []
          text: "미끄럼틀에서 웃느라 눈이 없어진 애였다. 사촌 동생인가 했다."
      - say:
          channel: thought
          with: []
          text: "날짜가 없는 사진이었다. 왜 날짜가 없었는지는 이제 못 본다."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…비울 때 손이 한 번 멈췄는데."
      - goto: mismatch_name

  mismatch_name:
    actions:
      - say:
          channel: action
          with: []
          text: "도윤은 검색창에 자기 이름을 친다. 이름이 아니라 그 앞에 뭐가 있었는지를 찾는 사람처럼."
      - say:
          channel: message
          side: me
          with: []
          text: "한도윤 2016"
      - say:
          channel: message
          side: them
          with: []
          text: "검색 결과 없음"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…없을 수가 없잖아. 고3이었는데."
      - say:
          channel: thought
          with: []
          text: "졸업 사진. 반 단체 사진. 체육대회. 누가 올린 것 하나라도."
      - say:
          channel: thought
          with: []
          text: "내가 정리한 게 아니면 남아 있어야 한다. 3번 항목이 그렇게 돼 있다."
      - say:
          channel: action
          with: []
          text: "도윤은 손가락을 멈춘다. 찾는 방향이 틀렸다는 것을 알아차린 얼굴이다."
      - say:
          char: 도윤.panic
          motion: shiver
          with: []
          delivery: whisper
          text: "이름이 틀렸구나."
      - say:
          channel: thought
          with: []
          text: "그 반에 한도윤은 없었다. 2016년 삼월에 교실에 앉아 있던 애는 다른 이름이었다."
      - say:
          channel: thought
          with: []
          text: "그 애 이름을 지금 모른다. 지운 사람이 나니까."
      - say:
          channel: action
          with: []
          text: "옥상 바람이 셔츠 안으로 들어온다. 도윤은 난간을 잡는다. 손이 미끄러워서 한 번 다시 잡는다."
      - effect: { name: darken, wait: true }
      - goto: harin_morning

  harin_morning:
    title: "2016년 삼월"
    actions:
      - bg: { id: harin_room, transition: cut }
      - music: static
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - place: "토요일 새벽 5:10 · 하린의 방"
      - char: { id: 하린, position: center, emotion: blank }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "교복이 의자에 걸려 있다. 가방은 싸여 있지 않다. 월요일에 들고 갈 데가 없다."
      - say:
          channel: thought
          with: []
          text: "메시지. 사진. 위치. 오늘 안에 다."
      - say:
          channel: action
          with: []
          text: "밝기를 끝까지 낮춘다. 누가 볼 사람도 없는데 끝까지 낮춘다."
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "하린아 전화 좀 받아"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "내가 그날 문 봤다고 한 거 애들한테 말 안 했어 진짜 안 했어"
      - say:
          channel: message
          side: them
          char: 민재
          with: []
          text: "니가 한 거 아니면 아니라고 한 번만 더 말해줘 그러면 나 믿어"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          erase: true
          text: "나 아니야"
      - say:
          channel: system
          with: []
          text: "대화방에서 나갔습니다.\n이 번호를 차단했습니다."
      - say:
          channel: system
          with: []
          text: "사진 1,204장을 백업하시겠습니까?\n아니오 — 이 기기에만 보관됩니다."
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "…이건 가져갈 거야."
      - say:
          channel: action
          with: []
          text: "하린은 사진첩을 끝까지 내려간다. 맨 아래 한 장에서 멈춘다."
      - sticker:
          id: e4_slide
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 600
      - say:
          channel: system
          with: []
          text: "사진 정보 · 2003. 7. 12. · 중랑구\n날짜 및 위치 정보를 삭제하시겠습니까?"
      - say:
          char: 하린.blank
          with: []
          delivery: whisper
          text: "네."
      - say:
          channel: system
          with: []
          text: "날짜 정보가 삭제되었습니다. 사진은 그대로 보관됩니다."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "이건 날짜 없으면 그냥 애기 사진이야. 아무나 될 수 있어."
      - clearSticker: { id: e4_slide, leave: fadeOut }
      - say:
          channel: system
          with: []
          text: "타임라인 · 지난 기록 전체 삭제\n이 작업은 되돌릴 수 없습니다."
      - say:
          channel: action
          with: []
          text: "하린은 교복 이름표를 실밥째 뜯어 봉투에 넣는다. 봉투는 책상 서랍에 둔다. 가져가지 않는다."
      - goto: reveal

  reveal:
    title: "수술대"
    actions:
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - char: { id: 하린, position: center }
      - say:
          char: 의사
          with: []
          text: "확신하세요? 한번 지우면 돌아올 수 없어요."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "네."
      - say:
          char: 의사
          with: []
          text: "이름도, 얼굴도, 기억도요. 친구분들 번호도 다."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "네. 다요."
      - say:
          char: 의사
          with: []
          text: "미성년자는 보호자 동의가 필요한데, 서류는 들어왔어요. 한 번 더 물어볼게요. 누가 시킨 거 아니죠."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "아니에요. 제가 신청했어요. 새벽에요."
      - say:
          char: 의사
          with: []
          text: "3번 항목, 읽으셨죠. 본인이 정리하지 않은 건 그대로 남아요."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "다 지웠어요. 아침에 다."
      - say:
          char: 의사
          with: []
          text: "학교는요. 반 애들 사진첩에 있는 건 저희가 못 건드려요."
      - say:
          char: 하린.cry
          with: []
          delivery: whisper
          text: "거기엔 제가 안 나와요. 작년부터 단체 사진 뒤에 섰어요."
      - say:
          char: 의사
          with: []
          text: "…네."
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "…한 장 빼고요."
      - say:
          char: 의사
          with: []
          text: "그 한 장은요?"
      - say:
          char: 하린
          with: []
          delivery: whisper
          text: "그건 그냥 두세요. 날짜도 안 적혀 있어요."
      - say:
          char: 의사
          with: []
          text: "그러면 뭔지도 모르고 계속 들고 다니실 텐데요."
      - say:
          char: 하린
          motion: nod
          with: []
          delivery: whisper
          text: "그래도 괜찮아요. 하나는 있어야 돼요."
      - bg: { id: surgery_reveal, transition: fade, duration: 1600 }
      - char: { id: 하린, position: center, emotion: sleep }
      - say:
          char: 의사
          with: []
          text: "이름표는 뒤집어 둘게요. 깨어나실 때 헷갈리시지 않게."
      - say:
          channel: record
          with: []
          text: "환자 이름표 · 유하린 · 18세"
      - say:
          char: 의사
          with: []
