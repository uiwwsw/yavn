chapterTitle: "ERASE"

script:
  - scene: e5_lobby

scenes:
  # Before the choice the player reads exactly what a second erasure takes: the form, and the
  # list that starts with the day Jisu chose the photo she is marrying him for. No line here says
  # what the list means.
  e5_lobby:
    title: "1층"
    actions:
      - say: { channel: card, with: [], text: "결혼 D-4 · 화요일", autoAdvance: 1800 }
      - bg: { id: clinic_hall, transition: cut }
      - music: cold_room
      - place: "오전 9시 40분 · 정림의원 1층 · 비"
      - char: { id: 도윤, position: center }
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: true }
          text: "접수대 직원이 서류철을 내민다. 원무과에서 찾은 2016년 동의서 사본도 같이 끼워 준다."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: true }
          text: "위에서 부를 때까지 앉아 기다리라고 한다."
      - say:
          char: 원무과직원
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "2016년 동의서 사본 여기 있습니다."
      - say:
          char: 원무과직원
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "3층에서 연락 왔는데요, 오늘 오전에 취소 자리가 하나 났대요."
      - say:
          char: 원무과직원
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "상담 원하시면 이거 쓰고 기다리시래요."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "사본 봉투 위에 상담 신청서가 한 장 얹힌다. 희망 기간 칸이 비어 있다."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "도윤은 거기에 2027년 4월 2일부터, 라고 쓴다."
      - say: { channel: action, with: [도윤], text: "대기실 의자는 유리문을 향해 놓여 있다. 우산꽂이는 비어 있다." }
      - wait: 900
      - say:
          channel: record
          with: []
          when: { var: booked, op: eq, value: true }
          text: "시술 동의서 · 신청인 한도윤 · 지울 기간: 2027년 4월 2일부터 오늘까지"
      - say:
          channel: record
          with: []
          when: { var: booked, op: eq, value: false }
          text: "상담 신청서 · 신청인 한도윤 · 희망 기간: 2027년 4월 2일부터 오늘까지"
      - say: { channel: record, with: [], text: "지워지는 것: 본인의 기억. 남는 것: 다른 사람의 기억, 기기 속 기록." }
      - say: { channel: thought, with: [], text: "4월 2일. 사진관에 간 날이다." }
      - wait: 700
      - say: { channel: thought, with: [], text: "모니터 속에서 눈을 감고 웃던 컷. 저 이거 보고 결혼해요." }
      - say: { channel: thought, with: [], text: "셔터가 멈추고 누가 모르는 이름을 불렀던 것." }
      - say: { channel: thought, with: [], text: "세 번 접혀 봉투로 들어가던 기본증명서." }
      - say: { channel: thought, with: [], text: "상담실 화면의 유하린, 그 아래 길게 뺀 ㄱ." }
      - say:
          channel: thought
          with: []
          when: { var: sorry, op: eq, value: true }
          text: "교실 창가 셋째 줄. 끈으로 가지 않던 아진의 손."
      - say:
          channel: thought
          with: []
          when: { var: sorry, op: eq, value: false }
          text: "교실 창가 셋째 줄. 아진이 앉아 있던 옆자리."
      - say:
          channel: thought
          with: []
          when: { var: forgave, op: eq, value: true }
          text: "노란 1이 붙은 말풍선 열한 개."
      - say:
          channel: thought
          with: []
          when: { var: forgave, op: eq, value: false }
          text: "충전기 뽑히던 소리."
      - say:
          channel: thought
          with: []
          when: { var: told_all, op: eq, value: true }
          text: "개수대에서 오래 흐르던 물."
      - say:
          channel: thought
          with: []
          when: { var: told_all, op: eq, value: false }
          text: "봉투로 도로 들어가던 기본증명서."
      - wait: 800
      - say: { channel: action, with: [도윤], text: "휴대폰이 울린다." }
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "12시 반 가봉. 마지막이래. 늦으면 나 혼자 입는다."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          media: { src: assets/items/child_photo_back.svg, alt: "인화한 놀이터 사진의 뒷면. 연필로 2005. 5. 5. 은행동 놀이터. 하린이랑 아진이." }
          text: "놀이터 사진, 인화한 거 엄마 집에서 찾았어요. 뒤에 이렇게 써 있어요."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          text: "오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          media: { src: assets/items/child_photo_back.svg, alt: "인화한 놀이터 사진의 뒷면. 연필로 2005. 5. 5. 은행동 놀이터. 하린이랑 아진이." }
          text: "놀이터 사진, 인화한 거 엄마 집에서 찾았어요. 뒤에 이렇게 써 있어요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "오늘 점심 사진관으로 올래요? 옆자리 비워 둘게요."
      - say: { channel: action, with: [도윤], text: "위층에서 이름을 부른다. 한도윤 님." }
      - say: { channel: action, with: [도윤], text: "도윤은 서류철을 무릎에 올려놓은 채 일어선다. 3층으로 가는 계단과 1층 유리문이 같은 거리에 있다.", continueLabel: "일어선다" }
      - choice:
          key: e5_final
          prompt: "도윤은 계단과 유리문 사이에 서 있다."
          options:
            - text: "3층으로 올라간다"
              goto: e5_erase
            - text: "사진관으로 간다"
              goto: e5_side
              when: { any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }
            - text: "지수에게 전화한다"
              goto: e5_call

  # ---- Ending: ERASE. He keeps the wedding and loses the day she chose him; she notices.
  e5_erase:
    title: "3층"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 계단을 오른다." }
      - bg: { id: surgery, transition: fade, duration: 900 }
      - place: "3층 · 시술실"
      - char: { id: 상담사, position: left }
      - say: { char: 상담사, with: [도윤], text: "마음 바뀌셨으면 지금 말씀하셔도 돼요.", continueLabel: "동의서에 서명한다" }
      - sound: consent_pen
      - say: { channel: action, with: [도윤, 상담사], text: "이번엔 손이 떨리지 않는다. 한도윤이라고 쓰고 끝에 작은 점을 찍는다." }
      - say: { char: 상담사, with: [도윤], text: "지난번에도 사진 한 장은 남겨 달라고 하셨어요. 이번에도 그러실래요?" }
      - say: { char: 도윤.hollow, with: [상담사], text: "네." }
      - say:
          channel: action
          with: [도윤]
          when: { var: ajin_photo, op: ne, value: deleted }
          text: "도윤은 휴대폰을 열어 한 장을 고른다. 교실 창가에서 웃는 남자아이."
      - say:
          channel: action
          with: [도윤]
          when: { var: ajin_photo, op: eq, value: deleted }
          text: "도윤은 휴대폰을 열어 한 장을 고른다. 눈을 감고 웃는 청첩장 컷."
      - bg: { id: eyes_closed, transition: dissolve, duration: 1200 }
      - music: null
      - wait: 1600
      - move: { id: 상담사, style: exit }
      - say: { channel: action, with: [], text: "열두 시 반 가봉에 도윤은 가지 않는다. 어디야, 하는 지수의 메시지는 저녁까지 읽히지 않는다." }
      - goto: e5_erase_evening

  e5_erase_evening:
    actions:
      - bg: { id: couple_home, transition: fade, duration: 1200 }
      - music: wind
      - place: "그날 저녁 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 드레스 가방을 든 채 현관에 서 있다." }
      - say: { char: 지수.cold, with: [도윤], text: "왜 안 왔어." }
      - say: { char: 도윤, with: [지수], text: "뭘?" }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 가방에서 청첩장 교정지를 꺼낸다." }
      - sticker:
          id: s5_proof
          image: closed_eye_cut_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 지수, with: [도윤], text: "이거. 네가 지워 달라던 거." }
      - say: { channel: action, with: [지수, 도윤], text: "교정지 속 도윤은 눈을 감고 웃고 있다." }
      - say: { char: 도윤, with: [지수], text: "이걸 언제 찍었지.", wait: 1800, unskippable: true }
      - clearSticker: { id: s5_proof, leave: fadeOut }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 교정지를 가슴에 댄 채 한참 서 있다." }
      - say:
          channel: action
          with: [지수]
          when: { var: told_all, op: eq, value: false }
          text: "그날 밤 지수는 도윤의 재킷 안주머니에서 접힌 종이를 찾는다. 지울 기간: 2027년 4월 2일부터."
      - say:
          channel: action
          with: [지수]
          when: { var: told_all, op: eq, value: false }
          text: "지수는 그 종이를 다시 접어 같은 자리에 넣는다."
      - say: { channel: card, with: [], text: "나흘 뒤 · 5월 1일", autoAdvance: 2000 }
      - place: "결혼식 날 아침 · 도윤과 지수의 집"
      - say: { channel: action, with: [지수, 도윤], text: "지수가 넥타이를 바로잡아 준다." }
      - say: { char: 지수, with: [도윤], text: "사진관에서 문자 왔어. 정아진 작가님 오늘 못 오신대." }
      - say: { char: 지수, with: [도윤], text: "다른 작가님 보낸대." }
      - say: { char: 도윤, with: [지수], text: "정아진? 누구였지." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 넥타이에서 손을 떼지 않는다." }
      - wait: 900
      - say:
          char: 지수.cold
          with: [도윤]
          when: { var: told_all, op: eq, value: true }
          wait: 2000
          unskippable: true
          delivery: "whisper"
          text: "…하린아."
      - say:
          char: 도윤
          with: [지수]
          when: { var: told_all, op: eq, value: true }
          text: "응? 누구?"
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_all, op: eq, value: false }
          text: "지수의 손이 재킷 안주머니 위를 한 번 누르고 내려간다."
      - say: { char: 지수, with: [도윤], text: "아니야. 넥타이 됐다." }
      - say: { channel: action, with: [지수, 도윤], text: "식장 로비에 줄지어 선 화환 가운데 리본 하나에 정아진이라는 이름이 적혀 있다. 도윤은 그 앞을 지나간다." }
      - ending: erase_loop

  # ---- Ending: the seat she kept. He sits beside the one who remembers and misses the fitting.
  e5_side:
    title: "옆자리"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 서류철을 접수대에 돌려주고 유리문을 밀고 나간다. 비가 얼굴에 닿는다." }
      - say:
          channel: message
          thread: 정림의원
          side: them
          speakerName: 정림의원
          with: []
          when: { var: booked, op: eq, value: true }
          text: "예약이 취소되었습니다."
      - bg: { id: photo_studio, transition: fade, duration: 900 }
      - music: studio
      - place: "점심 · 사진관"
      - char: { id: 어른아진, position: left }
      - sticker:
          id: s5_lunch
          image: snack_lunch_sticker
          x: 50
          y: 40
          width: "clamp(200px, 32%, 360px)"
          enter: fadeIn
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 작업대에 떡볶이 1인분과 돈까스 한 접시를 풀어 놓았다. 맞은편이 아니라 옆자리에 의자가 하나 더 놓여 있다." }
      - say: { char: 도윤, with: [어른아진], text: "돈까스는 왜요." }
      - say: { char: 어른아진, with: [도윤], text: "그냥. 좋아했으니까." }
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 옆자리에 앉는다." }
      - say: { char: 도윤, with: [어른아진], text: "아까 3층까지 갈 뻔했어요." }
      - say:
          char: 도윤
          with: [어른아진]
          when: { var: booked, op: eq, value: true }
          text: "예약해 둔 게 있었거든요."
      - say:
          char: 도윤
          with: [어른아진]
          when: { var: booked, op: eq, value: false }
          text: "자리가 하나 났다고 해서요."
      - say: { char: 어른아진.awkward, with: [도윤], text: "……" }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진은 나무젓가락을 쪼개 도윤 쪽에 놓는다." }
      - say: { char: 도윤, with: [어른아진], text: "기억은 안 날 거래요. 그래도 처음부터 들을게요." }
      - say: { char: 어른아진, with: [도윤], text: "처음부터면 길어요." }
      - say:
          char: 도윤.smile
          with: [어른아진]
          when: { var: listened, op: eq, value: true }
          text: "사천 원어치만요. 반은 제가 낼게요."
      - say:
          char: 도윤.smile
          with: [어른아진]
          when: { var: listened, op: eq, value: false }
          text: "점심시간만큼만요."
      - clearSticker: { id: s5_lunch, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 서랍에서 인화한 놀이터 사진을 꺼내 뒤집어 놓는다. 연필 글씨가 손때에 번져 있다." }
      - sticker:
          id: s5_back
          image: child_photo_back_sticker
          x: 50
          y: 40
          width: "clamp(180px, 28%, 320px)"
          enter: fadeIn
      - wait: 1200
      - clearSticker: { id: s5_back, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 앨범을 하나 더 꺼낸다. 표지에 2016이라고 매직으로 적혀 있다." }
      - sticker:
          id: s5_classroom
          image: harin_photo_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 어른아진, with: [도윤], text: "이게 3월 10일. 돈까스 나온 날." }
      - say: { char: 어른아진, with: [도윤], text: "급식표 찍고 나서 저렇게 웃었어요." }
      - clearSticker: { id: s5_classroom, leave: fadeOut }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 한 장을 더 넘긴다." }
      - sticker:
          id: s5_slide
          image: harin_slide_sticker
          x: 50
          y: 40
          width: "clamp(220px, 36%, 420px)"
          enter: fadeIn
      - say: { char: 어른아진, with: [도윤], text: "이건 3월 14일. 사진반 과제 낸 거." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "이날은 안 웃었어요." }
      - clearSticker: { id: s5_slide, leave: fadeOut }
      - wait: 700
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 그 사진을 오래 보다가 돈까스를 한 조각 집는다. 이번엔 먹는다." }
      - say: { char: 도윤, with: [어른아진], text: "지금도 점심 메뉴를 찍어요. 이번 주는 못 찍었지만." }
      - say: { char: 어른아진, with: [도윤], text: "다음 주엔 찍어요." }
      - place: "12시 41분"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "어디야?"
      - say: { channel: action, with: [어른아진, 도윤], text: "화면에 뜬 이름을 아진도 본다." }
      - say: { char: 어른아진, with: [도윤], text: "가 봐요." }
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 일어나지 않는다." }
      - say:
          channel: message
          thread: 지수
          side: me
          char: 도윤
          with: []
          text: "미안. 저녁에 다 말할게."
      - say: { channel: action, with: [도윤], text: "1은 금방 사라지고 답은 오지 않는다." }
      - say: { char: 어른아진, with: [도윤], text: "토요일 촬영, 실장님한테 돌려 드릴까 했어요." }
      - say: { char: 어른아진, with: [도윤], text: "제가 찍어도 될까요?" }
      - say: { char: 도윤, with: [어른아진], text: "찍어 주세요. 돈은 드릴게요." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 젓가락을 내려놓고 소리 내어 웃는다. 도윤은 아진이 왜 웃는지 모른다." }
      - say: { char: 도윤, with: [어른아진], text: "그리고 하객석에도 앉아 주세요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "제 쪽에요. 제 쪽에 아직 열두 명뿐이라서." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 카메라를 들어 도윤을 찍는다." }
      - sound: shutter
      - effect: { name: flash, wait: true }
      - say: { char: 어른아진, with: [도윤], text: "웃지 마요. 눈 없어져요." }
      - say: { char: 도윤.smile, with: [어른아진], text: "지워요." }
      - say: { char: 어른아진, with: [도윤], text: "안 지워요." }
      - goto: e5_side_evening

  e5_side_evening:
    actions:
      - move: { id: 어른아진, style: exit }
      - bg: { id: couple_home, transition: fade, duration: 1000 }
      - music: wind
      - place: "그날 저녁 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 드레스 가방을 현관에 세워 두고 들어온다." }
      - say: { channel: action, with: [지수, 도윤], text: "도윤은 앨범과 놀이터 사진을 식탁에 올려놓고 처음부터 다 말한다. 아침의 계단, 1층 유리문, 노란 1 열한 개, 오늘 먹은 돈까스." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 숟가락을 든 채로 끝까지 듣는다." }
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_first, op: eq, value: true }
          text: "그 사람한테만 말고, 라고 했잖아."
      - say:
          char: 도윤
          with: [지수]
          when: { var: told_first, op: eq, value: true }
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          when: { all: [{ var: told_all, op: eq, value: true }, { var: told_first, op: eq, value: true }] }
          text: "근데 오늘은 그 사람한테 먼저 갔네."
      - say:
          char: 지수
          with: [도윤]
          when: { all: [{ var: told_all, op: eq, value: true }, { var: told_first, op: eq, value: false }] }
          text: "점심엔 그 사람이랑 있었네."
      - say:
          char: 도윤
          with: [지수]
          when: { var: told_all, op: eq, value: true }
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_all, op: eq, value: true }
          text: "가봉 혼자 했어."
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_all, op: eq, value: true }
          text: "예뻤는데. 너 못 봤어."
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_all, op: eq, value: true }
          text: "지수가 앨범을 넘긴다. 3월 10일에서 손이 멈춘다."
      - say:
          char: 지수.warm
          with: [도윤]
          when: { var: told_all, op: eq, value: true }
          text: "웃는 거 똑같네."
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_all, op: eq, value: true }
          text: "지수는 좌석 배치표를 끌어다 펼치고 신랑 측 첫 줄 맨 앞 칸에 이름 하나를 적는다. 정아진."
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_all, op: eq, value: true }
          text: "혼주석 칸은 그대로 둔다."
      - say:
          char: 지수.cold
          with: [도윤]
          when: { var: told_all, op: eq, value: false }
          text: "나는 오늘 처음 듣는데. 그 사람은 점심에 들었네."
      - say:
          channel: action
          with: [지수, 도윤]
          when: { var: told_all, op: eq, value: false }
          text: "지수는 앨범을 열지 않는다. 좌석 배치표를 접어 서랍에 넣는다."
      - say:
          char: 지수
          with: [도윤]
          when: { var: told_all, op: eq, value: false }
          text: "명단은 내일 하자."
      - say:
          channel: action
          with: [도윤]
          when: { var: told_all, op: eq, value: false }
          text: "드레스 가방은 그날 밤 현관에 서 있다."
      - ending: side_seat

  # ---- Ending: the person he will live with hears it from him first.
  e5_call:
    title: "전화"
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 지수에게 전화한다. 신호가 가는 동안 할 말을 고른다." }
      - say: { channel: action, with: [도윤], text: "지수가 받는다." }
      - say: { char: 도윤, with: [], text: "지수야. 나 지금 정림의원 1층이야." }
      - say: { char: 도윤, with: [], text: "위에서 나를 부르고 있어. 올라가기 전에 너한테 먼저 말하고 싶었어." }
      - say: { char: 지수, with: [], text: "거기 있어." }
      - wait: 900
      - say: { channel: action, with: [도윤], text: "이십 분 뒤 유리문이 열리고, 회사 출입증을 목에 건 지수가 우산도 없이 들어온다." }
      - char: { id: 지수, position: left }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 도윤 옆자리에 앉아 서류철 맨 위 줄을 읽는다." }
      - say: { char: 지수.cold, with: [도윤], text: "4월 2일이면, 나랑 청첩장 사진 찍은 날부터네." }
      - say: { char: 도윤.hollow, with: [지수], text: "응." }
      - say: { char: 도윤, with: [지수], text: "나 열여덟 살 때 이름은 유하린이었어. 기다리는 친구가 있었는데, 안 갔어." }
      - say: { char: 도윤, with: [지수], text: "그거 알고 나서, 또 지우려고 했어." }
      - wait: 900
      - branch:
          cases:
            - when: { var: told_all, op: eq, value: true }
              goto: e5_two_names
          default: e5_unfinished

  e5_two_names:
    actions:
      - say: { channel: action, with: [지수, 도윤], text: "지수는 서류철을 덮어 접수대에 돌려준다." }
      - say: { char: 지수, with: [도윤], text: "월요일에 네가 다 말해 줬잖아. 주민센터부터 치면 열하루야." }
      - say: { char: 지수, with: [도윤], text: "그동안 나는 두 이름을 다 들고 있었어." }
      - say: { char: 지수.warm, with: [도윤], text: "지웠으면, 나 혼자 그걸 들고 결혼할 뻔했네." }
      - say: { char: 지수.warm, with: [도윤], text: "그 이름으로도 한 번 불러 봐도 돼?" }
      - say: { char: 도윤, with: [지수], text: "응." }
      - say: { char: 지수.warm, with: [도윤], text: "하린아. 가봉 가자. 도윤이도 같이." }
      - say: { channel: action, with: [지수, 도윤], text: "도윤이 웃는다. 지수가 그 얼굴을 한 번 찍는다." }
      - place: "가봉 가는 택시 안"
      - say:
          channel: message
          thread: 사진관
          side: me
          char: 도윤
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          text: "오늘은 못 가요. 미안해요."
      - say:
          channel: message
          thread: 사진관
          side: them
          char: 어른아진
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: false }] }
          text: "알았어요. 돈까스는 제가 먹을게요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: me
          char: 도윤
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "오늘은 못 가요. 미안해요."
      - say:
          channel: message
          thread: "010-4418-2706"
          side: them
          speakerName: "010-4418-2706"
          with: []
          when: { all: [{ any: [{ var: listened, op: eq, value: true }, { var: sorry, op: eq, value: true }, { var: forgave, op: eq, value: true }] }, { var: number_deleted, op: eq, value: true }] }
          text: "알았어요. 돈까스는 제가 먹을게요."
      - ending: two_names

  e5_unfinished:
    actions:
      - say: { channel: action, with: [지수, 도윤], text: "지수는 오래 말하지 않는다. 서류철 맨 위 줄을 손가락으로 몇 번 짚는다." }
      - say: { char: 지수.cold, with: [도윤], text: "주민센터에서 그 이름 봤어. 그날부터 네가 말해 주길 기다렸어." }
      - say: { char: 지수.cold, with: [도윤], text: "오늘 처음 들었어. 네가 지우려던 게 뭔지." }
      - say: { char: 지수, with: [도윤], text: "그 안에 나랑 사진관 간 날도 들어 있었다는 것도." }
      - say: { char: 지수, with: [도윤], text: "말해 줘서 고마워. 진짜로." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 반지를 빼서 서류철 위에 올려놓는다." }
      - say: { char: 지수, with: [도윤], text: "식은 미루자. 없던 일로 하자는 거 아니야." }
      - say: { char: 지수, with: [도윤], text: "나도 들은 걸 들고 있을 시간이 필요해." }
      - say: { char: 지수, with: [도윤], text: "반지는 네가 갖고 있어." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 먼저 유리문 밖으로 나간다." }
      - move: { id: 지수, style: exit }
      - say: { channel: system, with: [], text: "가봉 예약 취소 · 4월 27일(화) 12:30" }
      - say: { channel: action, with: [도윤], text: "도윤은 반지를 쥔 채 서류철을 접수대에 돌려준다." }
      - ending: unfinished
