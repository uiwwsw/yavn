chapterTitle: "지우지 말고"

script:
  - scene: e4_chat

scenes:
  e4_chat:
    title: "반 단톡"
    pov: "유하린"
    actions:
      - say: { channel: card, with: [], text: "열한 해 전 · 그 목요일 밤", autoAdvance: 1500 }
      - bg: { id: harin_room, transition: cut }
      - music: static
      - place: "밤 11시 · 하린의 방"
      - char: { id: 하린, position: center, emotion: blank }
      - say:
          channel: message
          thread: "3학년 2반 (32)"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "서민재 정아진 사귄대"
      - say:
          channel: message
          thread: "3학년 2반 (32)"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "유하린만 몰랐대ㅋㅋ"
      - say:
          channel: message
          thread: "3학년 2반 (32)"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "몰랐던 게 아니라 뒷문에서 듣고 있었다던데"
      - say:
          channel: message
          thread: "3학년 2반 (32)"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "유하린 정아진 좋아했잖아ㅋㅋㅋ"
      - say:
          channel: message
          thread: "3학년 2반 (32)"
          side: them
          speakerName: "반 단톡"
          with: []
          unread: 32
          text: "@유하린 해명하세요ㅋㅋ"
      - say: { channel: action, with: [하린], text: "알림이 쌓이는 동안 하린의 엄지는 '뒷문'에 멈춰 있다." }
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 아진
          with: []
          text: "하린아 뒷문 얘기 그거 내가 민재한…"
      - say: { channel: action, with: [하린], text: "하린은 대화방을 길게 누른다. 차단." }
      - place: "금요일"
      - say: { channel: action, with: [하린], text: "금요일에 하린은 학교에 가지 않는다." }
      - place: "토요일 새벽 5시 10분"
      - say: { channel: action, with: [하린], text: "하린은 사진을 모두 지운다. 남은 건 미끄럼틀 위에서 손을 흔드는 일곱 살 한 장이다." }
      - sticker:
          id: e4_last
          image: child_photo_sticker
          x: 50
          y: 45
          width: "clamp(200px, 32%, 360px)"
          enter: fadeIn
      - say: { channel: action, with: [하린], text: "날짜와 위치 정보도 지운다." }
      - say: { channel: thought, with: [하린], text: "날짜도 동네도 없으면 그냥 애기 사진이잖아." }
      - clearSticker: { id: e4_last, leave: fadeOut }
      - say: { channel: action, with: [하린], text: "교복 이름표는 실밥째 뜯어 서랍에 넣는다." }
      - say: { channel: action, with: [하린], text: "토요일과 일요일, 엄마가 방문 앞에 놓아 둔 쟁반은 손대지 않은 채로 부엌에 돌아간다." }
      - place: "월요일 아침"
      - say: { char: 하린.blank, with: [], text: "엄마, 나 그 병원 갈래." }
      - say: { char: 엄마, with: [하린], text: "어느 병원." }
      - say: { char: 하린.blank, with: [], text: "정류장에 붙어 있는 데." }
      - say: { channel: action, with: [하린], text: "엄마는 식탁 의자에 걸린 교복 재킷을 본다. 이름표가 있던 가슴께에 실밥만 삐져나와 있다." }
      - say: { channel: action, with: [하린], text: "그날 엄마는 출근하지 않는다." }
      - bg: { id: clinic_hall, transition: fade, duration: 600 }
      - place: "화요일 · 비 · 정림의원 1층"
      - music: null
      - wait: 800
      - char: { id: 아진, position: right, emotion: awkward }
      - say: { channel: action, with: [아진], text: "1층 유리문 너머에 아진이 서 있다. 우산도 없이, 반납하지 않은 사진반 카메라를 목에 건 채다.", wait: 2200, unskippable: true }
      - say: { channel: action, with: [하린], text: "하린은 계단 쪽으로 몸을 돌린다." }
      - move: { id: 아진, style: exit }
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - place: "3층 · 시술실"
      - say: { char: 의사, with: [하린], text: "지우고 나면 그 친구들 얼굴도 모를 거예요. 길에서 마주쳐도 그냥 지나갈 거고요." }
      - say: { char: 하린.blank, with: [의사], text: "네. 그게 좋아요." }
      - say: { channel: action, with: [하린], text: "보호자 칸에는 엄마가 먼저 이름을 썼다." }
      - sound: consent_pen
      - say: { channel: action, with: [하린], text: "하린은 그 위에 유하린이라고 쓰고 끝에 작은 점을 찍는다.", continueLabel: "이름을 쓴다", wait: 1400 }
      - say: { char: 하린.blank, with: [의사], text: "가방에 휴대폰이 있어요. 사진 한 장 남겨 놨는데, 그건 버리지 말아 주세요." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 520 }
      - music: null
      - goto: e4_eleven

  e4_eleven:
    title: "열한 개"
    pov: "한도윤"
    actions:
      - move: { id: 하린, style: exit }
      - say: { channel: card, with: [], text: "결혼 D-9 · 목요일", autoAdvance: 1500 }
      - bg: { id: photo_studio, transition: cut }
      - music: wind
      - place: "밤 9시 · 문 닫은 사진관"
      - char: { id: 어른아진, position: left }
      - char: { id: 도윤, position: right }
      - say: { channel: action, with: [어른아진, 도윤], text: "조명이 반만 켜져 있다. 아진이 작업대 서랍에서 모서리가 깨진 흰 휴대폰을 꺼내 충전기를 꽂는다." }
      - say: { channel: action, with: [어른아진, 도윤], text: "화면이 켜질 때까지 둘은 할 말이 없다. 아진이 보리차를 두 잔 받아 오지만 도윤은 마시지 않는다." }
      - say: { char: 어른아진, with: [도윤], text: "켜졌다." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진은 휴대폰을 도윤 앞으로 밀어 놓고 충전기 줄을 손가락에 감는다." }
      - say: { channel: record, with: [], text: "(알 수 없음) · 2016년 3월 24일 밤 11시 4분부터 · 보낸 메시지 11 · 읽지 않음" }
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "하린아 뒷문 얘기 그거 내가 민재한테만 한 건데 걔가 다른 애한테 말했대"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "전화 받아"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "하린아"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "단톡 올린 애 누군지 알아 내일 말할게"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "나 단톡 나왔어"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "내일 학교 와"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "옆자리 비워 둘게 진짜로"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "민재랑 싸웠어"
      - say: { char: 도윤, with: [어른아진], text: "민재 씨는요?" }
      - say: { char: 어른아진, with: [도윤], text: "그해 여름 전에 헤어졌어요. 지금 애가 둘이래요." }
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "내일 급식 카레래 ㅋㅋ 진짜 카레"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "자?"
      - say:
          channel: message
          thread: "(알 수 없음)"
          side: me
          char: 아진
          with: []
          unread: true
          text: "너 나 좋아하는 것 같다고 민재한테 말한 것도 나야. 그 말은 하지 말걸"
      - wait: 900
      - say: { channel: action, with: [어른아진, 도윤], text: "새벽 2시 13분. 도윤은 마지막 말풍선 아래로 더 내려가지 않는다." }
      - say: { char: 어른아진, with: [도윤], text: "그거 쓰고 잤어요. 아침에 보니까 1이 그대로더라고요." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진은 감고 있던 줄을 풀었다가 다시 감는다." }
      - say: { char: 어른아진, with: [도윤], text: "읽어 달라는 거 아니었어요. 오늘도 그래요." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "근데 한 번은 누가 들었으면 했어요." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "미안하다는 거. 하린이 아니어도." }
      - say: { channel: action, with: [어른아진, 도윤], text: "보리차 잔에 김이 더 올라오지 않는다." }
      - say:
          char: 어른아진
          with: [도윤]
          when: { var: sorry, op: eq, value: true }
          text: "기억 안 나는 사람이 왜 사과를 하냐고, 제가 그랬죠."
      - say:
          char: 어른아진
          with: [도윤]
          when: { var: sorry, op: eq, value: false }
          text: "하린이 아니라고 하셨죠. 알아요."
      - choice:
          key: e4_accept
          prompt: "휴대폰 화면이 도윤 쪽을 보고 있다."
          char: 어른아진
          options:
            - text: "하린 대신 받는다"
              set: { forgave: true }
              goto: e4_accept_yes
            - text: "받지 않는다"
              goto: e4_accept_no

  e4_accept_yes:
    actions:
      - say: { channel: action, with: [어른아진, 도윤], text: "도윤은 휴대폰을 아진 쪽으로 돌려 놓는다." }
      - say: { char: 도윤, with: [어른아진], text: "기억 안 나는 사람이 받아도 돼요?" }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진의 손에서 줄이 풀린다." }
      - say: { char: 어른아진, with: [도윤], text: "……응.", wait: 1600, unskippable: true }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 휴대폰을 엎는다. 화면 불빛이 작업대 유리 밑으로 번졌다가 꺼진다." }
      - goto: e4_lunch

  e4_accept_no:
    actions:
      - say: { char: 도윤, with: [어른아진], text: "그건 하린이한테 하셔야죠. 저는 못 받아요." }
      - say: { char: 어른아진.awkward, with: [도윤], text: "……그렇죠." }
      - say: { channel: action, with: [어른아진, 도윤], text: "아진이 충전기를 뽑는다. 화면이 노란 1을 단 채로 꺼진다." }
      - goto: e4_lunch

  e4_lunch:
    title: "돈까스"
    actions:
      - move: { id: 어른아진, style: exit }
      - say: { channel: card, with: [], text: "결혼 D-8 · 금요일", autoAdvance: 1500 }
      - bg: { id: cafeteria, transition: cut }
      - music: static
      - place: "점심 · 회사 식당"
      - say: { char: 윤주임, with: [도윤], text: "대리님 이번 주는 메뉴 안 찍으셨더라고요. 그래서 제가 찍었어요." }
      - say: { char: 윤주임, with: [도윤], text: "금요일 돈까스." }
      - say: { channel: action, with: [도윤], text: "도윤의 식판에도 돈까스가 있다. 도윤은 그걸 젓가락으로 길게 자른다." }
      - say: { channel: action, with: [도윤], text: "한 줄 자르고, 또 한 줄." }
      - say: { char: 윤주임, with: [도윤], text: "축가는 결국 누구로 했어요?" }
      - say: { char: 도윤, with: [], text: "지수 사촌." }
      - say: { char: 윤주임, with: [도윤], text: "청첩장 받았는데 사진 완전 웃겨요. 대리님 눈이 하나도 없어." }
      - say: { char: 윤주임, with: [도윤], text: "안 드세요?" }
      - say: { char: 도윤, with: [], text: "드실래요?" }
      - say: { char: 윤주임, with: [도윤], text: "저 두 개 받았는데요." }
      - say: { channel: action, with: [도윤], text: "윤주임은 그래도 한 조각을 가져간다. 식판은 거의 그대로 반납구로 들어간다." }
      - place: "계단참"
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: true }
          text: "도윤은 정림의원 예약 페이지를 연다. 4월 27일(화) 10:00, 그 아래 회색 글씨로 변경 · 취소."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: true }
          text: "도윤은 그 글씨를 오래 보다가 화면을 끈다."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "도윤은 정림의원 예약 페이지를 연다. 날짜 칸 아래에 예약 버튼이 있다."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "도윤은 그 위에 엄지를 올렸다가 화면을 끈다."
      - goto: e4_table

  e4_table:
    title: "식탁"
    actions:
      - say: { channel: card, with: [], text: "결혼 D-5 · 월요일 밤", autoAdvance: 1500 }
      - bg: { id: couple_home, transition: cut }
      - music: wind
      - place: "도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { channel: action, with: [지수, 도윤], text: "냉장고 문에 지수 글씨로 메모가 붙어 있다." }
      - say: { channel: record, with: [], text: "27일 12:30 마지막 가봉. 늦으면 혼자 입음." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 식탁에 종이 두 장을 올려놓는다. 주민센터 봉투에서 꺼낸 기본증명서와, 베란다 상자 맨 위에 올라와 있던 퇴원 확인서다." }
      - say: { channel: action, with: [지수, 도윤], text: "그 밑에 좌석 배치표가 깔려 있다. 신랑 측 혼주석 칸은 비어 있다." }
      - say: { char: 지수.cold, with: [도윤], text: "요즘 어디 다녀? 회사 말고." }
      - choice:
          key: e4_tell
          prompt: "지수가 서류 위에 손을 얹는다."
          char: 지수
          options:
            - text: "전부 말한다"
              set: { told_all: true }
              goto: e4_tell_all
            - text: "옛날 친구를 만났다고만 한다"
              goto: e4_tell_some
            - text: "아무 일도 없다고 한다"
              goto: e4_tell_none

  e4_tell_all:
    actions:
      - say: { char: 도윤, with: [지수], text: "나 열여덟 살 때 이름이 유하린이었대. 사고가 아니었어." }
      - say: { char: 도윤, with: [지수], text: "내가 지워 달라고 했어. 엄마가 보호자로 서명했고." }
      - say: { char: 도윤, with: [지수], text: "그리고 나를 기억하는 사람이 있어. 사진관 작가님." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 오래 말하지 않는다. 식은 밥그릇을 손으로 감싸고 있다." }
      - say: { char: 지수, with: [도윤], text: "유하린." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 그 이름을 한 번 소리 내 읽는다." }
      - say: { char: 지수.cold, with: [도윤], text: "주민센터에서 봤어. 열흘 기다렸어." }
      - say: { char: 도윤.hollow, with: [지수], text: "……" }
      - say: { char: 지수.cold, with: [도윤], text: "나는? 나도 언젠가 지울 수 있는 거야?" }
      - say: { char: 도윤.hollow, with: [지수], text: "……모르겠어." }
      - say: { char: 지수, with: [도윤], text: "모르겠다는 말은 처음 듣네. 맨날 괜찮다고만 했잖아." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 밥그릇을 들고 일어난다. 개수대에서 물이 오래 흐르는 동안 지수는 돌아보지 않는다." }
      - goto: e4_night

  e4_tell_some:
    actions:
      - say: { char: 도윤, with: [지수], text: "옛날 친구를 만났어." }
      - say: { char: 지수, with: [도윤], text: "그 작가님?" }
      - say: { channel: action, with: [지수, 도윤], text: "도윤이 고개를 끄덕인다. 지수가 기본증명서를 봉투에 도로 넣는다." }
      - say: { char: 지수, with: [도윤], text: "말하고 싶을 때 말해. 근데 결혼식 전에." }
      - goto: e4_night

  e4_tell_none:
    actions:
      - say: { char: 도윤, with: [지수], text: "아무 일도 없어." }
      - say: { char: 지수.cold, with: [도윤], text: "알았어." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 기본증명서를 봉투에 도로 넣고 먼저 방에 들어간다. 방문은 닫히지 않았다." }
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: true }
          text: "도윤은 식탁에서 클리닉 문자를 지운다."
      - say:
          channel: action
          with: [도윤]
          when: { var: booked, op: eq, value: false }
          text: "도윤은 식탁에 남아 사진첩 맨 끝의 놀이터 사진을 내렸다 올렸다 한다."
      - goto: e4_night

  e4_night:
    title: "새벽 3시"
    actions:
      - move: { id: 지수, style: exit }
      - place: "새벽 3시"
      - branch:
          cases:
            - when: { var: booked, op: eq, value: true }
              goto: e4_reminder
          default: e4_copy_notice

  e4_reminder:
    actions:
      - say:
          channel: message
          thread: 정림의원
          side: them
          speakerName: 정림의원
          with: []
          text: "예약 확인 · 내일(화) 오전 10시. 취소하시려면 회신 주세요."
      - say: { channel: action, with: [도윤], text: "도윤은 깨어 있다. 답하지 않는다." }
      - goto: /4.yaml

  e4_copy_notice:
    actions:
      - say:
          channel: message
          thread: 정림의원
          side: them
          speakerName: 정림의원
          with: []
          text: "2016년 동의서 사본이 준비되었습니다. 1층 원무과 · 평일 오전 9시부터."
      - say: { channel: action, with: [도윤], text: "도윤은 깨어 있다. 휴대폰을 엎어 둔다." }
      - goto: /4.yaml
