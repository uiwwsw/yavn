chapterTitle: "흔적"

script:
  - scene: errand
  - scene: house

scenes:
  errand:
    title: "서류"
    actions:
      - say:
          channel: card
          with: []
          text: "현재 · 그 수요일 저녁\n영업2팀 사무실"
      - bg: { id: office, transition: cut }
      - place: "수요일 저녁 · 퇴근 직전"
      - char: { id: 도윤, position: left }
      - say: { channel: action, with: [도윤], text: "가방을 드는데 송과장한테 톡이 온다. 책상 위에 준성 앞으로 온 서류가 놓여 있다." }
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 잘됐다 도윤대리 팀장님 댁 그 근처지?"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 휴직 서류 우편함에만 넣어주면 돼. 주소 보낼게"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "연락은 아예 안 되세요?"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 전화는 꺼져있고 메일만 한번 왔어 쉬겠다고"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: [주소] 오피스텔 9층이야"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 넣고 연락드릴게요"
      - say: { channel: action, with: [도윤], text: "서류를 챙기고 내려가는 길에 지수에게서도 연락이 온다." }
      - say: { channel: message, thread: 지수, side: them, char: 지수, with: [], text: "몇 시에 와? 네 좋아하는 반찬 데워놨어" }
      - say: { channel: message, thread: 지수, side: me, char: 도윤, with: [], text: "서류 하나 전해주고 갈게. 먼저 먹어" }
      - say: { channel: message, thread: 지수, side: them, char: 지수, with: [], text: "응. 그래도 너무 늦지는 마. 내일 세 시에 옷 보러 같이 가는 거 알지" }
      - say: { channel: message, thread: 지수, side: me, char: 도윤, with: [], text: "알지. 달력에 넣었어" }

  house:
    title: "준성의 집"
    actions:
      - bg: { id: junseong_house, transition: fade, duration: 1100 }
      - music: cold_room
      - place: { text: "수요일 밤 · 오피스텔 9층 복도 끝", presentation: center }
      - char: { id: 도윤, position: center }
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "…여기였어?"
      - say:
          channel: system
          when: { var: e0_location, op: eq, value: false }
          with: []
          text: "타임라인 · 이 주소\n3월 20일 오전 1:42부터 약 4시간 머무름"
      - say:
          char: 도윤.panic
          when: { var: e0_location, op: eq, value: false }
          with: []
          delivery: whisper
          text: "…폰이 먼저 알아봤네."
      - say:
          channel: thought
          when: { var: e0_location, op: eq, value: true }
          text: "위치 기록은 지웠다. 그래도 현관 앞에 서니 그날 밤이 생각났다."
      - say:
          channel: narration
          with: []
          camera: wide
          text: "봉투를 넣고 가려다 현관문이 한 뼘쯤 열려 있는 걸 본다. 초인종을 눌러도 대답이 없다."
      - say:
          char: 도윤
          motion: lean_in
          with: []
          text: "팀장님?"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…준성 씨?"
      - goto: e3_room

  e3_room:
    actions:
      - choice:
          key: e3_room
          presentation: explore
          prompt: "준성은 대답이 없다. 서류는 우편함에 넣고 가면 된다. 반쯤 열린 문 너머로 식탁이 보인다."
          with: []
          camera: wide
          options:
            - text: "약국 봉투"
              at: { x: 40, y: 60 }
              when: { var: e3_bag, op: eq, value: false }
              goto: e3_bag_scene
            - text: "식탁 위 서류"
              at: { x: 62, y: 55 }
              when: { var: e3_papers, op: eq, value: false }
              goto: e3_papers_scene
            - text: "냉장고 달력"
              at: { x: 75, y: 25 }
              when: { var: e3_note, op: eq, value: false }
              goto: e3_note_scene
            - text: "서류를 우편함에 넣고 나온다"
              when:
                all:
                  - { var: e3_bag, op: eq, value: true }
                  - { var: e3_papers, op: eq, value: true }
                  - { var: e3_note, op: eq, value: true }
              goto: e3_house_leave

  e3_bag_scene:
    actions:
      - sticker:
          id: e3_bag
          image: pharmacy_bag_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: record
          with: []
          text: "조제약 봉투 · 1일 1회 · 30일분\n(볼펜) 밤 10시\n남은 약 15정"
      - get: pharmacy_bag
      - clearSticker: { id: e3_bag, leave: fadeOut }
      - set: { e3_bag: true }
      - goto: e3_room

  e3_papers_scene:
    actions:
      - say:
          channel: record
          with: []
          text: "감염내과 외래 기록 · HIV 치료 중\n혈중 바이러스: 미검출 (2023년부터 유지)\n‘미검출’에 형광펜. 옆에 연필로 ‘굿’."
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…‘굿’. 준성 씨가 직접 써 놓은 건가."
      - set: { e3_papers: true }
      - goto: e3_room

  e3_note_scene:
    actions:
      - say:
          channel: record
          with: []
          text: "냉장고 달력\n지난 목 ✓ 오늘 약 먹었음ㅋ\n금 · 토 · 일 · 월 · 화 · 수 (빈칸)\n다음 주 토 · 한대리 결혼식 — 축의금?"
      - set: { e3_note: true }
      - goto: e3_room

  e3_house_leave:
    actions:
      - say:
          channel: action
          with: []
          text: "안쪽에서 아무 소리도 안 난다. 도윤은 문을 그대로 두고 봉투만 우편함에 넣는다."
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 넣었어?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 아무도 안 계시던데요"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: ㅇㅋ 수고ㅋㅋ 낼 커피 내가"
      - goto: search

  search:
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - place: { text: "그날 밤 11시 40분 · 빈 사무실", presentation: center }
      - say: { channel: action, with: [도윤], text: "준성에게 직접 물어볼 수가 없었다. 도윤은 조용히 보건소를 찾아볼 생각으로 회사에 돌아왔다. 노트북을 켜는데 지수의 톡이 보인다." }
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: them
          char: 지수
          with: []
          text: "안 와?"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: me
          char: 도윤
          with: []
          text: "회사 다시 들어왔어 자료가 여기 있어서"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: them
          char: 지수
          with: []
          text: "뭐 먹었는데"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: me
          char: 도윤
          with: []
          text: "김밥"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: them
          char: 지수
          with: []
          text: "오이는 뺐어?"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: them
          char: 지수
          with: []
          text: "너 혼자 먹을 때도 꼭 빼달라 하잖아"
      - say:
          channel: message
          thread: 지수
          when:
            all:
              - { var: e2_search, op: eq, value: false }
              - { var: e2_gallery, op: eq, value: false }
          side: them
          char: 지수
          with: []
          text: "집에 오면 깨우지 마. 네 쪽 장판도 켜놨어"
      - choice:
          key: e2_search
          presentation: explore
          prompt: "지수는 장판을 켜 두겠다고 했다. 도윤은 보건소를 찾아볼지, 그날 밤 휴대폰에 뭐가 남았는지부터 확인할지 망설인다."
          with: []
          camera: wide
          options:
            - text: "검색창"
              at: { x: 35, y: 40 }
              when: { var: e2_search, op: eq, value: false }
              goto: e2_search_scene
            - text: "사진첩"
              at: { x: 68, y: 50 }
              when: { var: e2_gallery, op: eq, value: false }
              goto: e2_gallery_scene
            - text: "노트북을 덮는다"
              when:
                all:
                  - { var: e2_search, op: eq, value: true }
                  - { var: e2_gallery, op: eq, value: true }
              goto: e3_clinic_scene

  e2_search_scene:
    actions:
      - say:
          channel: action
          with: []
          text: "검색창에 ‘hiv 잠복기’를 치고, 이어 ‘보건소 익명검사 몇시’를 검색한다."
      - say:
          channel: record
          with: []
          text: "질병관리청 · 꾸준한 치료로 혈중 바이러스가 미검출로 유지되면 성관계를 통해 전파되지 않습니다."
      - say:
          channel: record
          with: []
          text: "질병관리청 · 노출이 걱정된다면 가까운 보건소에서 익명·무료로 검사받을 수 있습니다. 꾸준히 치료하면 일상생활이 가능합니다."
      - say:
          channel: action
          with: []
          text: "보건소 안내를 한 번 더 읽고 방금 검색한 두 줄을 기록에서 지운다."
      - add: { deleted: 3 }
      - set: { e2_search: true }
      - goto: search

  e2_gallery_scene:
    actions:
      - say: { channel: action, with: [], text: "휴대폰 사진첩에서 그날 밤을 찾다가 오래된 사진까지 내린다. 맨 끝에 날짜 없는 사진 한 장이 걸린다." }
      - sticker:
          id: e2_photo
          image: gallery_photo_sticker
          x: 50
          y: 32
          width: "clamp(230px, 32%, 380px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: system
          with: []
          text: "최근 항목 · 맨 아래로 이동\n2016년 3월 — 사진 1,204장\n그 아래 1장 · 날짜 정보 없음"
      - choice:
          key: e2_photo
          prompt: "손가락이 휴지통 아이콘 바로 위에 멈춘다."
          with: []
          options:
            - text: "사진을 남긴다"
              saveText: "엄지를 떼고 사진첩을 닫는다"
              set: { kept_photo: true }
              goto: e2_photo_keep
            - text: "사진을 완전히 삭제한다"
              saveText: "삭제를 누르고 최근 삭제된 항목까지 비운다"
              goto: e2_photo_delete

  e2_photo_keep:
    actions:
      - get: child_photo
      - wait: 0
      - say:
          channel: action
          with: []
          text: "엄지를 뗀다. 사진 모서리를 한 번 더 보고서야 화면을 닫는다."
      - set: { e2_gallery: true }
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - goto: search

  e2_photo_delete:
    actions:
      - sticker: { id: e2_photo, image: gallery_empty_sticker, enter: none }
      - say:
          channel: system
          with: []
          text: "최근 삭제된 항목 · 1장 영구 삭제\n이 작업은 되돌릴 수 없습니다."
          wait: 1100
      - add: { deleted: 1 }
      - set: { e2_gallery: true }
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - goto: search

  e3_clinic_scene:
    title: "보건소"
    actions:
      - bg: { id: clinic_hall, transition: fade, duration: 1000 }
      - music: cold_room
      - place: { text: "목요일 9:00 · 보건소", presentation: center }
      - say:
          channel: system
          with: []
          text: "근태 · 연차 1일 승인 (한도윤)"
      - say:
          channel: message
          thread: 지수
          side: them
          char: 지수
          with: []
          text: "오늘 3시 피팅이야. 도착하면 연락 줘"
      - char: { id: 도윤, position: center }
      - say:
          channel: record
          with: []
          text: "안내 · HIV 익명 검사는 이름 대신 번호로 불러 드립니다. 무료."
      - choice:
          key: e3_clinic
          prompt: "번호표 기계까지 세 걸음. 대기석에는 두 사람이 앉아 있다."
          char: 도윤
          motion: shiver
          options:
            - text: "번호표를 뽑는다"
              saveText: "번호표 버튼을 누른다"
              set: { went_to_clinic: true }
              goto: e3_ticket
            - text: "검사받지 않고 나온다"
              saveText: "모자를 눌러쓰고 자동문 쪽으로 돌아선다"
              goto: e3_turn

  e3_ticket:
    actions:
      - sticker:
          id: e3_ticket
          image: ticket_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - get: test_ticket
      - say:
          channel: system
          with: []
          text: "대기 번호 47 · 현재 호출 32"
      - say:
          channel: action
          with: []
          text: "한참 뒤, 47번이 깜빡인다. 불려 들어가 채혈을 마치고 팔 안쪽에 솜을 댄다."
      - say:
          channel: record
          with: []
          text: "채혈 완료 · 결과는 7일 뒤 본인이 직접 방문해 확인합니다."
      - say:
          char: 도윤
          with: []
          text: "…이름은 진짜 아무 데도 안 남는 거죠?"
      - clearSticker: { id: e3_ticket, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "도윤은 번호표를 지갑 카드 칸 맨 안쪽, 영수증 뒤에 넣는다."
      - goto: e3_harin

  e3_turn:
    actions:
      - say:
          channel: system
          with: []
          erase: true
          wait: 700
          text: "지도 · 최근 검색 '보건소' — 삭제됨"
      - add: { deleted: 1 }
      - goto: e3_harin

  e3_harin:
    pov: "유하린"
    actions:
      - say:
          channel: card
          with: []
          text: "11년 전\n유하린 · 18세"
      - bg: { id: science_room, transition: cut }
      - place: "며칠 뒤 · 과학실, 생물 수행평가"
      - char: { id: 하린, position: center, emotion: blank }
      - char: { id: 아진, position: right }
      - sticker:
          id: e3_butterfly
          image: butterfly_sticker
          x: 50
          y: 30
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          char: 아진
          with: [하린]
          text: "하린아, 나비 그거 핀 안 꽂아도 돼. 수행평가 그냥 사진으로 내도 된대."
      - say:
          char: 하린.blank
          with: [아진]
          text: "이렇게 두면 날개가 안 움직여."
      - say:
          char: 아진
          with: [하린]
          text: "너 오늘 급식도 안 먹었잖아. 돈까스 나오면 제일 먼저 뛰어가는 애가."
      - say:
          char: 하린.blank
          with: [아진]
          text: "그것도 옛날 얘기지."
      - say:
          char: 아진
          motion: headtilt
          with: [하린]
          text: "지난주잖아."
      - move: { id: 아진, toward: 하린, style: approach }
      - say:
          char: 아진.awkward
          with: [하린]
          text: "…그날 뒷문 앞에 너 있었지. 문이 움직였어."
      - move: { id: 하린, toward: 아진, style: flinch }
      - say:
          char: 하린
          with: [아진]
          text: "나 아니야. 나 그날 배 아파서 먼저 갔잖아. 카레."
      - say:
          char: 아진
          with: [하린]
          text: "그날 카레 안 나왔어. 그날 닭볶음탕이었어."
      - say:
          char: 하린
          with: [아진]
          text: "…그랬나."
      - say:
          char: 아진
          with: [하린]
          text: "내가 먼저 말했어야 했어. 네가 웃으니까 그냥 모른 척했어. 미안."
      - say:
          char: 하린
          motion: laugh
          with: [아진]
          text: "내가 왜?ㅋㅋ 나 원래 그런 거 관심 없잖아."
      - say:
          char: 하린
          with: [아진]
          text: "너네 잘 어울려. 진짜로."
      - say:
          char: 아진.awkward
          with: [하린]
          text: "내일 급식은 나랑 먹을래? 너 옆자리 비워 둘게."
      - say:
          char: 하린
          with: [아진]
          text: "…민재는?"
      - say:
          char: 아진
          with: [하린]
          text: "내일은 나 너랑 먹고 싶어."
      - say:
          char: 하린.blank
          with: [아진]
          text: "…핀 좀 줘. 날개 쪽."
      - emote: { id: 하린, motion: droop, wait: true }
      - move: { id: 아진, style: reset }
      - clearSticker: { id: e3_butterfly, leave: fadeOut }
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - place: { text: "그날 밤 · 하린의 방", presentation: center }
      - say: { channel: action, with: [하린], text: "하린이 책상에 앉아 교복 소매를 걷는다. 아진이한테 사진 한 장이 온다." }
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 정아진
          with: []
          text: "이거 너 일곱살때 놀이터ㅋㅋ 엄마 폰 정리하다 나옴"
      - say:
          channel: message
          thread: 아진
          side: me
          char: 하린
          with: []
          text: "아 지워 제발 얼굴 왜저럼"
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 정아진
          with: []
          text: "싫어 이때 너 엄청 웃잖아"
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 정아진
          with: []
          text: "눈 없어질때까지 웃는 거 아직도 똑같아"
      - say:
          channel: message
          thread: 아진
          side: them
          speakerName: 정아진
          with: []
          text: "너 저장해 둬. 지우지 말고"
      - sticker: { id: e3_playground, image: child_photo_sticker, x: 50, y: 44, width: "clamp(170px, 30%, 320px)", enter: fadeIn }
      - say: { channel: action, with: [], text: "하린이 사진을 크게 띄운다." }
      - say:
          channel: system
          with: []
          text: "사진을 저장했습니다."
      - clearSticker: { id: e3_playground, leave: fadeOut }
      - goto: e2_jisu

  e2_jisu:
    title: "지수"
    actions:
      - say:
          channel: card
          with: []
          text: "현재 · 결혼 9일 전\n도윤과 지수의 집"
      - bg: { id: couple_home, transition: cut }
      - music: static
      - place: "목요일 밤 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { char: 지수, with: [도윤], text: "왔어? 얼굴 좀 봐. 어디 아파?" }
      - say: { char: 도윤, with: [지수], text: "아니. 밥 안 먹고 기다렸어?" }
      - say: { char: 지수, with: [도윤], text: "응. 옷 보고 나서 같이 먹기로 했잖아." }
      - say: { char: 도윤, with: [지수], text: "미안. 회사에 일이 갑자기 생겨서." }
      - say: { char: 지수, with: [도윤], text: "회사에 전화했어. 송과장님이 너 오늘 연차랬어." }
      - move: { id: 도윤, toward: 지수, style: retreat }
      - say: { char: 도윤, with: [지수], text: "…회사에 전화했어?" }
      - say: { char: 지수, with: [도윤], text: "세 번이나 전화했는데 안 받더라. 무슨 일 난 줄 알았지." }
      - say: { char: 지수, with: [도윤], text: "피팅은 토요일에 다시 잡았어. 네 옷은 네가 입어 봐야 된대." }
      - say: { char: 도윤, with: [지수], text: "토요일엔 꼭 갈게." }
      - say: { char: 지수, with: [도윤], text: "오늘도 온다고 했잖아." }
      - sticker: { id: e3_invitation, image: invitation_sticker, x: 50, y: 43, width: "clamp(165px, 27%, 290px)", enter: fadeIn }
      - say: { channel: action, with: [], text: "식탁 한쪽에 사진관에서 고른 청첩장 시안이 있다. 지수는 그 종이를 밀어 두고 도윤을 본다." }
      - clearSticker: { id: e3_invitation, leave: fadeOut }
      - say: { char: 지수.cold, with: [도윤], text: "오늘 어디 갔어? 회사 말고." }
      - choice:
          key: e2_jisu
          prompt: "지수가 식탁 위에 휴대폰을 엎어 놓는다."
          char: 지수
          options:
            - text: "은행에 다녀왔다고 둘러댄다"
              saveText: "\"은행. 대출 서류 하나 빠졌대서.\""
              goto: e2_jisu_lie
            - text: "회사 소문만 이야기한다"
              saveText: "\"회사에 나랑 엮인 소문이 좀 있어. 정리되면 말할게.\""
              set: { told_jisu: 1 }
              goto: e2_jisu_part
            - text: "지수에게 전부 말한다"
              saveText: "\"다 말할게. 듣고 나서 네가 정해.\""
              set: { told_jisu: 2 }
              goto: e2_jisu_all

  e2_jisu_lie:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "은행. 대출 서류 하나 빠졌다고 해서. 말하면 너 또 신경 쓸까 봐."
      - say: { char: 지수, with: [도윤], text: "그래서 해결했어? 내가 떼 줄 건 없어?" }
      - say: { char: 도윤, with: [지수], text: "어. 다 했어." }
      - say: { char: 지수, with: [도윤], text: "…알았어. 밥은 식었어. 먹을 거면 네가 데워." }
      - move: { id: 지수, toward: 도윤, style: retreat }
      - goto: /4.yaml

  e2_jisu_part:
    actions:
      - say:
          char: 도윤
          with: [지수]
          text: "팀장님 일 때문에 회사에서 내 얘기도 나와."
      - say:
          char: 도윤
          with: [지수]
          text: "미안. 오늘은 어디부터 말해야 될지 모르겠어."
      - say:
          char: 지수
          with: [도윤]
          text: "소문 있는 건 알아."
      - move: { id: 도윤, toward: 지수, style: flinch }
      - say:
          char: 도윤.panic
          with: [지수]
          text: "…누구한테 들었어?"
      - say:
          char: 지수
          with: [도윤]
          text: "송과장님. 아까 전화했을 때 팀장님 일로 회사가 좀 시끄럽다고 하시더라."
      - say:
          char: 지수
          with: [도윤]
          text: "무슨 일인지는 안 물어봤어. 너한테 들을 거니까."
      - say:
          char: 도윤
          with: [지수]
          text: "…왜 안 물어봤어."
      - say:
          char: 지수
          with: [도윤]
          text: "네 얘기를 왜 남한테 먼저 물어봐. 네가 말해 줄 줄 알았어."
      - say:
          char: 지수
          motion: nod
          with: [도윤]
          text: "토요일 피팅 전에 얘기해 줘. 안 그러면 나 혼자 갈래."
      - goto: /4.yaml

  e2_jisu_all:
    actions:
      - say: { char: 도윤.hollow, with: [지수], text: "우리 사진 찍은 날 있잖아. 그날 밤에 클럽에서 만난 사람이랑 잤어.", wait: 650 }
      - say: { char: 지수.cold, with: [도윤], text: "청첩장 그 사진 골랐던 날? 나한테 민석이 만나러 간다고 했잖아." }
      - say: { char: 도윤, with: [지수], text: "…응. 그 사람이 준성 씨야. 우리 팀장님." }
      - say: { char: 지수.cold, with: [도윤], text: "그 뒤에도 만났어?" }
      - say: { char: 도윤, with: [지수], text: "그 뒤로는 회사에서만 봤어. 이번 주엔 출근도 안 하고 연락도 안 돼." }
      - say: { char: 도윤.hollow, with: [지수], text: "회사에서 그 사람 병 얘기가 돌기 시작했어. 겁이 나서 오늘 보건소에 갔어." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 도윤 쪽으로 밀어 두었던 밥그릇에서 손을 뗀다." }
      - mood: { tone: grief, level: 1 }
      - say: { char: 지수.cold, with: [도윤], text: "검사는 받았어?" }
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: true }
          with: [지수]
          text: "응. 결과는 다음 주에 나와."
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: false }
          with: [지수]
          text: "…입구까지 갔다가 그냥 나왔어."
      - say:
          char: 지수
          when: { var: went_to_clinic, op: eq, value: false }
          with: [도윤]
          text: "그럼 다시 가. 오늘처럼 돌아오지 말고."
      - say: { char: 지수, with: [도윤], text: "청첩장 숫자는 같이 세면서, 그 얘기는 나한테 언제 하려고 했어?" }
      - say: { char: 도윤.hollow, with: [지수], text: "그 얘기만 하면 우리 아직 결혼 준비하는 사람들 같았어. 네가 계속 날 그렇게 봐 줬으면 했어." }
      - say: { char: 지수, with: [도윤], text: "오늘 거울 앞에서 혼자 서 있었어. 네가 들어오면 이제 같이 고를 수 있겠다 싶어서 문만 보고 있었어.", wait: 550 }
      - say: { char: 도윤, with: [지수], text: "미안해." }
      - say: { char: 지수, with: [도윤], text: "토요일 피팅은 가지 마. 내일 식장에도 전화할 거야. 식을 미룰 수 있는지부터 물어볼게." }
      - say: { char: 도윤, with: [지수], text: "내가 전화할게." }
      - say: { char: 지수, with: [도윤], text: "내가 할게. 부탁이야. 오늘은 방에 들어가 있어." }
      - mood: off
      - goto: /4.yaml
