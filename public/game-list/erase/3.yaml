chapterTitle: "흔적"

script:
  - scene: errand
  - scene: house

scenes:
  errand:
    title: "서류"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 열흘 전"
      - place: "수요일 저녁 · 퇴근길"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 잘됐다 도윤대리 팀장님 댁 그 근처지?"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 휴직 서류 우편함에만 넣어주면 돼 인사팀이 급하대 ㅠ"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "연락은 아예 안 되세요?"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 전화는 꺼져있고 메일만 한번 왔어 쉬겠다고"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 주소 보냄"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 넣고 연락드릴게요"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "오늘 몇시에 와? 반찬 데워놨어"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "회사 심부름 하나만 하고"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "이 시간에 무슨 심부름"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "ㅇㅋ 내일 피팅 3시인 거 알지"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "달력에 넣었어 알림도 켜놨어 네 폰에"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "언제 내 폰을"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "아침에 충전하면서ㅋㅋ 비번은 안 쳤어 얼굴로 열었어"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "자는 사람 얼굴 들이대면 열리더라 그거 좀 무섭더라"

  house:
    title: "준성의 집"
    actions:
      - bg: { id: junseong_house, transition: fade, duration: 1100 }
      - music: cold_room
      - place: "수요일 밤 · 오피스텔 9층 복도 끝"
      - char: { id: 도윤, position: center }
      - say:
          char: 도윤.panic
          with: []
          delivery: whisper
          text: "…여기였어?"
      - say:
          channel: narration
          with: []
          camera: wide
          text: "초인종을 세 번 눌러도 대답이 없는데, 현관문은 한 뼘쯤 열려 있다."
      - say:
          char: 도윤
          motion: lean_in
          with: []
          text: "팀장님?"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…준성 씨?"
      - goto: e3_room

  e3_room:
    actions:
      - choice:
          key: e3_room
          presentation: explore
          prompt: "대답이 없다. 신발을 벗고 한 걸음 들어간다."
          with: []
          camera: wide
          options:
            - text: "약국 봉투"
              at: { x: 40, y: 60 }
              when: { var: e3_bag, op: eq, value: false }
              goto: e3_bag_scene
            - text: "식탁 위 서류"
              at: { x: 62, y: 55 }
              when: { var: e3_papers, op: eq, value: false }
              goto: e3_papers_scene
            - text: "냉장고 달력"
              at: { x: 75, y: 25 }
              when: { var: e3_note, op: eq, value: false }
              goto: e3_note_scene
            - text: "서류를 우편함에 넣고 나온다"
              when:
                all:
                  - { var: e3_bag, op: eq, value: true }
                  - { var: e3_papers, op: eq, value: true }
                  - { var: e3_note, op: eq, value: true }
              goto: e3_house_leave

  e3_bag_scene:
    actions:
      - sticker:
          id: e3_bag
          image: pharmacy_bag_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: record
          with: []
          text: "조제약 봉투 · 1일 1회 · 30일분\n(볼펜) 밤 10시\n남은 약 15정"
      - get: pharmacy_bag
      - clearSticker: { id: e3_bag, leave: fadeOut }
      - set: { e3_bag: true }
      - goto: e3_room

  e3_papers_scene:
    actions:
      - say:
          channel: record
          with: []
          text: "감염내과 외래 기록 · HIV 치료 중\n혈중 바이러스: 미검출 (2023년부터 유지)\n(미검출 줄에 형광펜. 여백에 연필로) 굿"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "이게 무슨 뜻인지도 모르면서 내가 뭘 한 거야."
      - set: { e3_papers: true }
      - goto: e3_room

  e3_note_scene:
    actions:
      - say:
          channel: record
          with: []
          text: "냉장고 달력\n지난 목 ✓ 오늘 약 먹었음ㅋ\n금 · 토 · 일 · 월 · 화 · 수 (빈칸)\n다음 주 토 · 한대리 결혼식 — 축의금?"
      - set: { e3_note: true }
      - goto: e3_room

  e3_house_leave:
    actions:
      - say:
          channel: action
          with: []
          text: "도윤은 소매로 손잡이를 감싸 쥐고, 현관문을 처음처럼 한 뼘 열어 둔다."
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 넣었어?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 아무도 안 계시던데요"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: ㅇㅋ 수고ㅋㅋ 낼 커피 내가"
      - goto: search

  search:
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - place: "수요일 23:40 · 빈 사무실"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "안 와?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "회사 다시 들어왔어 자료가 여기 있어서"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "뭐 먹었는데"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "김밥"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "오이 빼달라 했어?"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "너 혼자 먹으면서도 빼달라 하더라"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "전기장판 켜놓고 잘게 네 쪽도 켜놔"
      - choice:
          key: e2_search
          presentation: explore
          prompt: "집 대신 여기로 왔다. 불은 반만 켜 둔다."
          with: []
          camera: wide
          options:
            - text: "검색창"
              at: { x: 35, y: 40 }
              when: { var: e2_search, op: eq, value: false }
              goto: e2_search_scene
            - text: "사진첩"
              at: { x: 68, y: 50 }
              when: { var: e2_gallery, op: eq, value: false }
              goto: e2_gallery_scene
            - text: "노트북을 덮는다"
              when:
                all:
                  - { var: e2_search, op: eq, value: true }
                  - { var: e2_gallery, op: eq, value: true }
              goto: e3_clinic_scene

  e2_search_scene:
    actions:
      - say:
          channel: message
          side: me
          with: []
          text: "hiv 잠복기"
      - say:
          channel: message
          side: them
          with: []
          text: "질병관리청 · 꾸준한 치료로 혈중 바이러스가 미검출로 유지되면 성관계를 통해 전파되지 않습니다."
      - say:
          channel: message
          side: me
          with: []
          text: "보건소 익명검사 몇시"
      - say:
          channel: message
          side: them
          with: []
          text: "질병관리청 · 노출이 걱정된다면 가까운 보건소에서 익명·무료로 검사받을 수 있습니다. 꾸준히 치료하면 일상생활이 가능합니다."
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "크롬 검색기록 완전삭제 복구안되게"
      - add: { deleted: 3 }
      - set: { e2_search: true }
      - goto: search

  e2_gallery_scene:
    actions:
      - sticker:
          id: e2_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: system
          with: []
          text: "최근 항목 · 맨 아래로 이동\n2016년 3월 — 사진 1,204장\n그 아래 1장 · 날짜 정보 없음"
      - choice:
          key: e2_photo
          prompt: "엄지가 휴지통 아이콘 위에 있다."
          with: []
          options:
            - text: "엄지를 떼고 사진첩을 닫는다"
              set: { kept_photo: true }
              goto: e2_photo_keep
            - text: "삭제를 누르고 최근 삭제된 항목까지 비운다"
              goto: e2_photo_delete

  e2_photo_keep:
    actions:
      - get: child_photo
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "사진첩을 닫았다가 다시 열어, 맨 아래에 그대로 있는지 보고 닫는다."
      - set: { e2_gallery: true }
      - goto: search

  e2_photo_delete:
    actions:
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: system
          with: []
          erase: true
          text: "최근 삭제된 항목 · 1장 영구 삭제\n이 작업은 되돌릴 수 없습니다."
      - add: { deleted: 1 }
      - set: { e2_gallery: true }
      - goto: search

  e3_clinic_scene:
    title: "보건소"
    actions:
      - bg: { id: clinic_hall, transition: fade, duration: 1000 }
      - music: cold_room
      - place: "목요일 9:00 · 보건소"
      - say:
          channel: system
          with: []
          text: "근태 · 연차 1일 승인 (한도윤)"
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "오늘 드레스 2차 피팅 3시!! 늦으면 진짜 죽음"
      - char: { id: 도윤, position: center }
      - say:
          channel: record
          with: []
          text: "안내 · HIV 익명 검사는 이름 대신 번호로 불러 드립니다. 무료."
      - choice:
          key: e3_clinic
          prompt: "기계까지 세 걸음. 대기석에 두 사람이 앉아 있다."
          char: 도윤
          motion: shiver
          options:
            - text: "번호표 버튼을 누른다"
              set: { went_to_clinic: true }
              goto: e3_ticket
            - text: "모자를 눌러쓰고 자동문 쪽으로 돌아선다"
              goto: e3_turn

  e3_ticket:
    actions:
      - sticker:
          id: e3_ticket
          image: ticket_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - get: test_ticket
      - say:
          channel: system
          with: []
          text: "대기 번호 47 · 현재 호출 32"
      - say:
          channel: record
          with: []
          text: "채혈 완료 · 결과는 7일 뒤 본인이 직접 방문해 확인합니다."
      - say:
          char: 도윤
          motion: nod
          with: []
          text: "네, 네."
      - say:
          char: 도윤
          with: []
          text: "…이름은 진짜 아무 데도 안 남는 거죠?"
      - clearSticker: { id: e3_ticket, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "도윤은 번호표를 지갑 카드 칸 맨 안쪽, 영수증 뒤에 넣는다."
      - goto: e3_harin

  e3_turn:
    actions:
      - say:
          channel: system
          with: []
          erase: true
          text: "지도 · 최근 검색 '보건소' — 삭제됨"
      - add: { deleted: 1 }
      - goto: e3_harin

  e3_harin:
    actions:
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - bg: { id: science_room, transition: cut }
      - place: "며칠 뒤 · 과학실, 생물 수행평가"
      - char: { id: 하린, position: center, emotion: blank }
      - char: { id: 아진, position: right }
      - sticker:
          id: e3_butterfly
          image: butterfly_sticker
          x: 50
          y: 30
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          char: 아진
          with: [하린]
          text: "하린아, 나비 그거 핀 안 꽂아도 돼. 수행평가 그냥 사진으로 내도 된대."
      - say:
          char: 하린.blank
          with: [아진]
          text: "이게 더 쉬워. 가만히 있으니까."
      - say:
          char: 아진
          with: [하린]
          text: "너 오늘 급식도 안 먹었잖아. 돈까스 나오면 제일 먼저 뛰어가는 애가."
      - say:
          char: 하린.blank
          with: [아진]
          text: "그것도 옛날 얘기지."
      - say:
          char: 아진
          motion: headtilt
          with: [하린]
          text: "지난주잖아."
      - move: { id: 아진, toward: 하린, style: approach }
      - say:
          char: 아진.awkward
          with: [하린]
          text: "…그날 뒷문 앞에 너 있었지. 문이 움직였어."
      - move: { id: 하린, toward: 아진, style: flinch }
      - say:
          char: 하린
          with: [아진]
          text: "나 아니야. 나 그날 배 아파서 먼저 갔잖아. 카레."
      - say:
          char: 아진
          with: [하린]
          text: "그날 카레 안 나왔어. 그날 닭볶음탕이었어."
      - say:
          char: 하린
          with: [아진]
          text: "…그랬나."
      - say:
          char: 아진
          with: [하린]
          text: "하린아. 너 화내도 돼."
      - say:
          char: 하린
          motion: laugh
          with: [아진]
          text: "내가 왜?ㅋㅋ 나 원래 그런 거 관심 없잖아."
      - say:
          char: 하린
          with: [아진]
          text: "너네 잘 어울려. 진짜로."
      - say:
          char: 아진.awkward
          with: [하린]
          text: "그 말 하지 마. 그 말 할 때 네 목소리 이상해."
      - say:
          char: 하린
          with: [아진]
          text: "목소리가 뭐."
      - say:
          char: 아진
          with: [하린]
          text: "네 목소리 아니야. 남 목소리야."
      - say:
          char: 하린.blank
          with: [아진]
          text: "…핀 좀 줘. 날개 쪽."
      - emote: { id: 하린, motion: droop, wait: true }
      - move: { id: 아진, style: reset }
      - clearSticker: { id: e3_butterfly, leave: fadeOut }
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - place: "그날 밤 · 하린의 방"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "[사진]"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "이거 너 일곱살때 놀이터ㅋㅋ 엄마 폰 정리하다 나옴"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "아 지워 제발 얼굴 왜저럼"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "싫어 이때 너 엄청 웃잖아"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "눈 없어질때까지 웃는 거 아직도 똑같아"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "너 저장해 둬. 지우지 말고"
      - say:
          channel: system
          with: []
          text: "읽음"
      - say:
          channel: system
          with: []
          text: "사진을 저장했습니다."
      - goto: e2_jisu

  e2_jisu:
    title: "지수"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 아흐레 전"
      - bg: { id: couple_home, transition: cut }
      - music: static
      - place: "목요일 밤 · 도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "왔어? 신발 돌려놔. 그래야 아침에 안 넘어져."
      - say:
          char: 도윤
          with: [지수]
          text: "…어."
      - say:
          char: 지수
          with: [도윤]
          text: "사회는 민석 씨가 봐 주기로 했고, 축가는 빼자."
      - say:
          char: 지수
          with: [도윤]
          text: "우리 둘 다 아는 사람 중에 노래 되는 사람이 없어."
      - say:
          char: 도윤
          motion: nod
          with: [지수]
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          text: "답례품은 수건 말고 다른 거. 수건은 너무 성의 없어 보여."
      - say:
          char: 도윤
          with: [지수]
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          text: "'응'이 두 번째야. 뭐가 좋은지 하나만 골라 봐."
      - say:
          char: 도윤
          with: [지수]
          text: "…네가 고르는 게 나아."
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "내가 고르면 나중에 네 쪽에서 왜 그걸 했냐 소리 나와."
      - say:
          char: 도윤
          with: [지수]
          text: "내 쪽이 어딨어."
      - say:
          char: 지수
          with: [도윤]
          text: "…그러네. 미안."
      - say:
          char: 지수
          with: [도윤]
          text: "잔금은 식 사흘 전까지. 이백삼십 남았어."
      - say:
          char: 지수
          with: [도윤]
          text: "내 쪽에서 백삼십 낼게. 백은 네가."
      - say:
          char: 지수
          with: [도윤]
          text: "…근데 전기장판은 켜 놨더라. 내 쪽만."
      - say:
          char: 도윤
          with: [지수]
          text: "나올 때 켜 놓고 나왔어. 네가 발 시리다고 해서."
      - say:
          char: 지수
          with: [도윤]
          text: "…그러니까 더 화가 나."
      - say:
          char: 지수
          motion: headtilt
          with: [도윤]
          text: "오늘 피팅은 왜 안 왔어?"
      - say:
          char: 도윤
          with: [지수]
          text: "회사에 일이 갑자기—"
      - move: { id: 지수, toward: 도윤, style: approach }
      - say:
          char: 지수
          with: [도윤]
          text: "회사에 전화했어. 송과장님이 너 오늘 연차래."
      - move: { id: 도윤, toward: 지수, style: retreat }
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "네 폰 비번 알아. 내 생일인 거. 안 열었어. 우리 엄마처럼은 안 해."
      - say:
          char: 지수
          with: [도윤]
          text: "아침에 네 얼굴로 알림 켜 준 사람이 비번 몰라서 안 열었겠어?"
      - emote: { id: 도윤, motion: freeze }
      - say:
          char: 지수.cold
          with: [도윤]
          text: "어디 있었어?"
      - say:
          char: 지수
          with: [도윤]
          text: "밤에 자다가 깨서 네 쪽 보면 화면 불빛이 있어. 두 번 봤어. 안 물어봤고."
      - say:
          char: 지수.cold
          motion: puff
          with: [도윤]
          text: "사진 찍던 날 말했지. 지금은 화 안 낸다고. 그때가 지금이야. 아직은."
      - choice:
          key: e2_jisu
          prompt: "지수가 자기 휴대폰을 화면이 아래로 가게 식탁에 엎는다."
          char: 지수
          options:
            - text: "\"은행. 대출 서류 하나 빠졌대서.\""
              goto: e2_jisu_lie
            - text: "\"회사에 나랑 엮인 소문이 좀 있어. 정리되면 말할게.\""
              set: { told_jisu: 1 }
              goto: e2_jisu_part
            - text: "\"다 말할게. 듣고 나서 네가 정해.\""
              set: { told_jisu: 2 }
              goto: e2_jisu_all

  e2_jisu_lie:
    actions:
      - say:
          char: 도윤.smile
          motion: laugh
          with: [지수]
          text: "은행. 대출 서류 하나 빠졌다고 해서. 말하면 너 또 신경 쓸까 봐."
      - say:
          char: 지수
          with: [도윤]
          text: "…그래."
      - say:
          char: 지수
          motion: lean_in
          with: [도윤]
          text: "영수증 같은 건 있어?"
      - say:
          char: 도윤
          motion: perk
          with: [지수]
          text: "어? 그런 걸 왜 받아."
      - say:
          char: 지수
          with: [도윤]
          text: "그냥. 물어봤어."
      - say:
          char: 지수
          with: [도윤]
          text: "너 영수증 좋아하잖아. 계약금도 보관하라고 했더니 사진까지 찍어 놨더라."
      - say:
          char: 지수
          with: [도윤]
          text: "알았어. 밥이나 먹자. 반찬 두 번 데웠어."
      - move: { id: 지수, toward: 도윤, style: retreat }
      - goto: /4.yaml

  e2_jisu_part:
    actions:
      - say:
          char: 도윤
          with: [지수]
          text: "회사에 나랑 엮인 소문이 좀 있어. 팀장님 일이랑."
      - say:
          char: 도윤
          with: [지수]
          text: "나도 아직 정리가 안 돼서… 정리되면 말할게. 진짜로."
      - say:
          char: 지수
          with: [도윤]
          text: "소문 있는 건 알아."
      - move: { id: 도윤, toward: 지수, style: flinch }
      - say:
          char: 도윤.panic
          with: [지수]
          text: "…누구한테 들었어?"
      - say:
          char: 지수
          with: [도윤]
          text: "송과장님. 아까 전화했을 때 팀장님 일로 회사가 좀 시끄럽다고 하시더라."
      - say:
          char: 지수
          with: [도윤]
          text: "무슨 일인지는 안 물어봤어. 너한테 들을 거니까."
      - say:
          char: 도윤
          with: [지수]
          text: "…왜 안 물어봤어."
      - say:
          char: 지수
          with: [도윤]
          text: "남한테 내 사람 얘기 듣는 거, 그거 우리 집에서 제일 싫었던 거야."
      - say:
          char: 지수
          motion: nod
          with: [도윤]
          text: "식 전까지 기다릴게. 토요일까지. 네 입으로."
      - goto: /4.yaml

  e2_jisu_all:
    actions:
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "청첩장 찍은 날 밤에, 클럽에서 만난 사람이 있었어. 남자야."
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "그 사람이 우리 팀장으로 왔어. 월요일 아침에."
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "지금은 연락이 안 돼. 회사에선 그 사람 병 얘기가 돌고."
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "오늘은… 보건소에 갔었어."
      - say:
          channel: action
          with: [지수, 도윤]
          text: "지수는 반지를 손가락 마디까지 뺐다가 다시 끼운다."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "며칠 됐어. 그날부터 오늘까지."
      - say:
          char: 도윤
          with: [지수]
          text: "…스무 날."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "그걸 세고 있었구나."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "검사는."
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: true }
          with: [지수]
          text: "받았어. 결과는 다음 주."
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: false }
          with: [지수]
          text: "…앞까지만 갔어."
      - say:
          char: 지수
          when: { var: went_to_clinic, op: eq, value: false }
          with: [도윤]
          text: "내일 다시 가. 나 때문에 말고."
      - say:
          char: 지수
          with: [도윤]
          text: "그 팀장님은. 그 사람은 지금 괜찮은 거야?"
      - say:
          char: 도윤
          with: [지수]
          text: "…몰라."
      - say:
          char: 지수
          with: [도윤]
          text: "모르는 게 아니라 안 찾아본 거겠지."
      - say:
          char: 지수
          motion: sigh
          with: [도윤]
          text: "식장은 내일 내가 전화해 볼게. 미룰 수 있는지. 계약금이 어떻게 되는지도."
      - say:
          char: 도윤
          with: [지수]
          text: "…너 왜 그런 것까지 챙겨 줘."
      - say:
          char: 지수
          with: [도윤]
          text: "아직 정리가 안 돼서 그래. 미워하는 것도 순서가 있어."
      - say:
          char: 지수
          with: [도윤]
          text: "오늘은 내가 소파에서 잘게."
      - say:
          char: 도윤
          with: [지수]
          text: "내가 나갈게."
      - say:
          char: 지수
          with: [도윤]
          text: "나가지 마. 나가면 또 지울 거잖아."
      - goto: /4.yaml
