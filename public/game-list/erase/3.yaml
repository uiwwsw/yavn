chapterTitle: "지우지 말고"

script:
  - scene: e4_chat

scenes:
  e4_chat:
    title: "반 단톡"
    pov: "유하린"
    actions:
      - say: { channel: card, with: [], text: "열한 해 전 · 그 목요일 밤", autoAdvance: 1500 }
      - bg: { id: harin_room, transition: cut }
      - music: static
      - place: "밤 11시 · 하린의 방"
      - char: { id: 하린, position: center }
      - say:
          channel: message
          thread: "3학년 2반"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "서민재 정아진 사귄대. 유하린만 몰랐대ㅋㅋ"
      - say:
          channel: message
          thread: "3학년 2반"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "몰랐던 게 아니라 뒷문에서 듣고 있었다던데"
      - say:
          channel: message
          thread: "3학년 2반"
          side: them
          speakerName: "반 단톡"
          with: []
          text: "@유하린 해명하세요ㅋㅋ"
      - say: { channel: action, with: [하린], text: "금요일에 하린은 학교에 가지 않았다. 아진이 비워 둔다던 자리가 어땠는지는 모른다." }
      - say: { channel: action, with: [하린], text: "아진에게서 톡이 열한 개 왔다. 하린은 읽지 않고 차단했다." }
      - place: "토요일 새벽 5시 10분"
      - sticker:
          id: e4_phone_erased
          image: phone_erased_sticker
          x: 50
          y: 45
          width: "clamp(200px, 35%, 400px)"
          enter: fadeIn
      - say: { channel: action, with: [하린], text: "하린은 사진을 모두 지운다. 한 장만 남는다. 미끄럼틀 위에서 웃는 일곱 살." }
      - say: { channel: action, with: [하린], text: "날짜와 위치 정보를 지운다." }
      - say: { channel: thought, with: [하린], text: "날짜도 동네도 없으면 그냥 애기 사진이잖아." }
      - say: { channel: action, with: [하린], text: "교복 이름표를 실밥째 뜯어 서랍에 넣는다." }
      - clearSticker: { id: e4_phone_erased, leave: fadeOut }
      - place: "월요일 아침"
      - say: { char: 하린.blank, with: [], text: "엄마, 나 그 병원 갈래." }
      - bg: { id: clinic_hall, transition: fade, duration: 600 }
      - place: "화요일 · 비 · ERASE 클리닉 1층"
      - music: null
      - wait: 800
      - say: { channel: action, with: [하린], text: "1층 유리문 너머에 아진이 서 있다. 우산이 없다. 목에 카메라가 걸려 있다.", wait: 2200, unskippable: true }
      - say: { channel: action, with: [하린], text: "하린은 계단 쪽으로 몸을 돌린다." }
      - bg: { id: surgery, transition: cut }
      - music: cold_room
      - place: "3층 · 시술실"
      - say: { char: 의사, with: [하린], text: "지우고 나면 그 친구들 얼굴도 모를 거예요. 길에서 마주쳐도 그냥 지나갈 거고요." }
      - say: { char: 하린.blank, with: [의사], text: "네. 그게 좋아요." }
      - sound: consent_pen
      - say: { channel: action, with: [하린], text: "동의서에 유하린이라고 쓰고 끝에 작은 점을 찍는다.", continueLabel: "이름을 쓴다", wait: 1400 }
      - say: { char: 하린, with: [의사], text: "가방에 휴대폰이 있어요. 사진 한 장 남겨 놨는데, 그건 버리지 말아 주세요." }
      - bg: { id: eyes_closed, transition: dissolve, duration: 520 }
      - music: null
      - goto: e4_table

  e4_table:
    title: "식탁"
    pov: "한도윤"
    actions:
      - move: { id: 하린, style: exit }
      - say: { channel: card, with: [], text: "결혼 닷새 전 · 월요일 밤", autoAdvance: 1500 }
      - bg: { id: couple_home, transition: cut }
      - music: wind
      - place: "도윤과 지수의 집"
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 식탁에 서류 한 장을 올려놓는다. 2016년 퇴원 확인서. 도윤이 서랍에 넣어 둔 것이다." }
      - say: { char: 지수.cold, with: [도윤], text: "요즘 어디 다녀? 회사 말고." }
      - choice:
          key: e4_tell
          prompt: "지수가 서류 위에 손을 얹는다."
          char: 지수
          options:
            - text: "전부 말한다"
              goto: e4_tell_all
            - text: "옛날 친구를 만났다고만 한다"
              goto: e4_tell_some
            - text: "아무 일도 없다고 한다"
              goto: e4_tell_none

  e4_tell_all:
    actions:
      - say: { char: 도윤, with: [지수], text: "나 열여덟 살 때 이름이 유하린이었대. 사고가 아니었어. 내가 지워 달라고 했어." }
      - say: { char: 도윤, with: [지수], text: "그리고 나를 기억하는 사람이 있어. 사진관 작가님." }
      - say: { channel: action, with: [지수, 도윤], text: "지수는 오래 말하지 않는다. 식은 밥그릇을 손으로 감싼다." }
      - say: { char: 지수, with: [도윤], text: "그럼 그 사람은 십일 년 동안 너를 기억했고, 너는 몰랐던 거네." }
      - say: { char: 도윤, with: [지수], text: "응." }
      - say: { char: 지수.cold, with: [도윤], text: "나는? 나도 언젠가 지울 수 있는 거야?" }
      - say: { char: 도윤.hollow, with: [지수], text: "……모르겠어." }
      - say: { char: 지수, with: [도윤], text: "모르겠다는 말은 처음 듣네. 맨날 괜찮다고만 했잖아." }
      - say: { char: 지수.warm, with: [도윤], text: "그래도 오늘은 대답은 했네." }
      - add: { told_jisu: 2 }
      - goto: e4_night

  e4_tell_some:
    actions:
      - say: { char: 도윤, with: [지수], text: "옛날 친구를 만났어." }
      - say: { char: 지수, with: [도윤], text: "그 작가님?" }
      - say: { channel: action, with: [도윤], text: "도윤이 고개를 끄덕인다. 지수가 서류를 다시 서랍에 넣는다." }
      - say: { char: 지수, with: [도윤], text: "말하고 싶을 때 말해. 근데 결혼식 전에." }
      - add: { told_jisu: 1 }
      - goto: e4_night

  e4_tell_none:
    actions:
      - say: { char: 도윤, with: [지수], text: "아무 일도 없어." }
      - say: { char: 지수.cold, with: [도윤], text: "알았어." }
      - say: { channel: action, with: [지수, 도윤], text: "지수가 먼저 들어간다. 도윤은 식탁에서 통화 목록을 지운다." }
      - add: { deleted: 1 }
      - goto: e4_night

  e4_night:
    title: "새벽 3시"
    actions:
      - move: { id: 지수, style: exit }
      - place: "새벽 3시"
      - branch:
          cases:
            - when: { var: booked, op: eq, value: true }
              goto: e4_reminder
          default: e4_book

  e4_reminder:
    actions:
      - say:
          channel: message
          thread: "ERASE 클리닉"
          side: them
          speakerName: "ERASE 클리닉"
          with: []
          text: "예약 확인 · 내일(화) 오전 10시. 취소하시려면 회신 주세요."
      - say: { channel: action, with: [도윤], text: "도윤은 답하지 않는다." }
      - goto: /4.yaml

  e4_book:
    actions:
      - say: { channel: action, with: [도윤], text: "도윤은 깨어 있다. 휴대폰에 클리닉 예약 창이 열려 있다. 언제 열었는지 기억이 나지 않는다." }
      - say: { channel: action, with: [도윤], text: "손가락이 예약 버튼 위에 있다." }
      - say:
          channel: message
          thread: "ERASE 클리닉"
          side: them
          speakerName: "ERASE 클리닉"
          with: []
          text: "예약 완료 · 4월 27일(화) 오전 10시."
      - set: { booked: true }
      - goto: /4.yaml
