chapterTitle: "흔적"

script:
  - scene: errand
  - scene: house

scenes:
  errand:
    title: "서류"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 열흘 전"
      - say:
          channel: narration
          with: []
          text: "준성이 나오지 않은 지 사흘째인 수요일 저녁. 퇴근길에 송과장에게서 개인 톡이 온다."
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 도윤대리 팀장님 댁 그 근처지?"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 휴직 서류 우편함에만 넣어주면 돼 인사팀이 급하대 ㅠ"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 주소 보냄"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 넣고 연락드릴게요"

  house:
    title: "준성의 집"
    actions:
      - bg: { id: junseong_house, transition: fade, duration: 1100 }
      - music: cold_room
      - say:
          channel: narration
          with: []
          camera: wide
          text: "준성의 오피스텔, 9층 복도 끝. 현관문이 한 뼘쯤 열려 있다. 초인종을 두 번 누르고, 한 번 더 누르고, 그다음엔 그냥 서 있었다. 안쪽 바닥에 블라인드 그림자가 줄줄이 누워 있다."
      - char: { id: 도윤, position: center }
      - say:
          char: 도윤
          with: []
          text: "팀장님?"
      - say:
          char: 도윤
          with: []
          delivery: whisper
          text: "…형?"
      - goto: e3_room

  e3_room:
    actions:
      - choice:
          key: e3_room
          presentation: explore
          prompt: "대답이 없다. 신발을 벗고 한 걸음 들어간다."
          with: []
          camera: wide
          options:
            - text: "약국 봉투"
              at: { x: 40, y: 60 }
              when: { var: e3_bag, op: eq, value: false }
              goto: e3_bag_scene
            - text: "식탁 위 서류"
              at: { x: 62, y: 55 }
              when: { var: e3_papers, op: eq, value: false }
              goto: e3_papers_scene
            - text: "냉장고 달력"
              at: { x: 75, y: 25 }
              when: { var: e3_note, op: eq, value: false }
              goto: e3_note_scene
            - text: "서류를 우편함에 넣고 나온다"
              when:
                all:
                  - { var: e3_bag, op: eq, value: true }
                  - { var: e3_papers, op: eq, value: true }
                  - { var: e3_note, op: eq, value: true }
              goto: e3_house_leave

  e3_bag_scene:
    actions:
      - sticker:
          id: e3_bag
          image: pharmacy_bag_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: narration
          with: []
          text: "약국 봉투 겉면에 볼펜으로 '밤 10시'라고 적혀 있다. 한 달 치에서 절반쯤 남았다. 봉투 입구는 집게로 단단히 집혀 있다."
      - get: pharmacy_bag
      - clearSticker: { id: e3_bag, leave: fadeOut }
      - set: { e3_bag: true }
      - goto: e3_room

  e3_papers_scene:
    actions:
      - say:
          channel: record
          with: []
          text: "감염내과 외래 기록 · HIV 치료 중\n혈중 바이러스: 미검출 (6개월 연속)"
      - say:
          channel: narration
          with: []
          text: "미검출 줄에만 형광펜이 그어져 있다. 그 옆 여백에 연필로 작게, 굿."
      - set: { e3_papers: true }
      - goto: e3_room

  e3_note_scene:
    actions:
      - say:
          channel: narration
          with: []
          text: "냉장고 문의 달력. 날마다 작은 체크 표시가 있고, 지난 목요일 칸에는 '오늘 약 먹었음ㅋ'. 그다음 칸부터는 아무것도 없다."
      - say:
          channel: narration
          with: []
          text: "다음 주 토요일 칸에만 글씨가 하나 더 있다. '한대리 결혼식 — 축의금?'"
      - set: { e3_note: true }
      - goto: e3_room

  e3_house_leave:
    actions:
      - say:
          channel: action
          with: []
          text: "서류 봉투를 우편함에 밀어 넣는다. 현관문은 처음처럼 한 뼘 열어 둔다. 손잡이는 소매로 감싸 잡았다."
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: 넣었어?"
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "네 아무도 안 계시던데요"
      - say:
          channel: message
          side: them
          with: []
          text: "송과장: ㅇㅋ 수고ㅋㅋ 낼 커피 내가"
      - goto: search

  search:
    actions:
      - bg: { id: office_night, transition: fade, duration: 900 }
      - music: static
      - choice:
          key: e2_search
          presentation: explore
          prompt: "그날 밤, 도윤은 집에 가는 대신 빈 사무실로 돌아왔다. 불은 반만 켜 둔다."
          with: []
          camera: wide
          options:
            - text: "검색창"
              at: { x: 35, y: 40 }
              when: { var: e2_search, op: eq, value: false }
              goto: e2_search_scene
            - text: "사진첩"
              at: { x: 68, y: 50 }
              when: { var: e2_gallery, op: eq, value: false }
              goto: e2_gallery_scene
            - text: "노트북을 덮는다"
              when:
                all:
                  - { var: e2_search, op: eq, value: true }
                  - { var: e2_gallery, op: eq, value: true }
              goto: e3_clinic_scene

  e2_search_scene:
    actions:
      - say:
          channel: message
          side: me
          with: []
          text: "hiv 잠복기"
      - say:
          channel: message
          side: me
          with: []
          text: "hiv 초기증상 목 림프절 붓기"
      - say:
          channel: message
          side: me
          with: []
          text: "보건소 익명검사 몇시"
      - say:
          channel: message
          side: them
          with: []
          text: "질병관리청 · 노출이 걱정된다면 가까운 보건소에서 익명·무료로 검사받을 수 있습니다. 꾸준히 치료하면 일상생활이 가능합니다."
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "크롬 검색기록 완전삭제 복구안되게"
      - add: { deleted: 3 }
      - set: { e2_search: true }
      - goto: search

  e2_gallery_scene:
    actions:
      - sticker:
          id: e2_photo
          image: child_photo_sticker
          x: 50
          y: 32
          width: "clamp(170px, 24%, 320px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: narration
          with: []
          text: "그날 밤 사진이 정말 다 지워졌는지 확인하려고 사진첩을 끝까지 내렸다. 2016년보다 더 아래에 사진이 딱 한 장 있다. 놀이터 미끄럼틀 위에서 웃느라 눈이 없어진 아이. 날짜 정보가 비어 있다."
      - choice:
          key: e2_photo
          prompt: "엄지가 휴지통 아이콘 위에 있다."
          with: []
          options:
            - text: "엄지를 떼고 사진첩을 닫는다"
              set: { kept_photo: true }
              goto: e2_photo_keep
            - text: "삭제를 누르고 최근 삭제된 항목까지 비운다"
              goto: e2_photo_delete

  e2_photo_keep:
    actions:
      - get: child_photo
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "사진첩을 닫는다. 다시 연다. 맨 아래까지 내려서 그대로 있는지 보고, 닫는다."
      - set: { e2_gallery: true }
      - goto: search

  e2_photo_delete:
    actions:
      - clearSticker: { id: e2_photo, leave: fadeOut }
      - say:
          channel: action
          with: []
          erase: true
          text: "회색 사각형이 잠깐 자리를 지키다가, 그것도 없어진다."
      - add: { deleted: 1 }
      - set: { e2_gallery: true }
      - goto: search

  e3_clinic_scene:
    title: "보건소"
    actions:
      - bg: { id: clinic_hall, transition: fade, duration: 1000 }
      - music: cold_room
      - say:
          channel: narration
          with: []
          camera: wide
          text: "다음 날 목요일 아침, 회사에는 오전 반차를 냈다. 보건소는 아홉 시에 연다. 도윤은 여덟 시 사십 분부터 맞은편 편의점에서 삼각김밥 포장을 반쯤 뜯어 놓고 있었다."
      - say:
          channel: message
          side: them
          char: 지수
          with: []
          text: "오늘 드레스 2차 피팅 3시!! 늦으면 진짜 죽음"
      - char: { id: 도윤, position: center }
      - say:
          channel: narration
          with: []
          text: "번호표 기계 위에 안내문이 붙어 있다. 익명 검사는 이름 대신 번호로 불러 드립니다."
      - choice:
          key: e3_clinic
          prompt: "기계까지 세 걸음. 대기석에 두 사람이 앉아 있다."
          char: 도윤
          options:
            - text: "번호표 버튼을 누른다"
              set: { went_to_clinic: true }
              goto: e3_ticket
            - text: "모자를 눌러쓰고 자동문 쪽으로 돌아선다"
              goto: e3_turn

  e3_ticket:
    actions:
      - sticker:
          id: e3_ticket
          image: ticket_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - get: test_ticket
      - say:
          channel: narration
          with: []
          text: "47번. 전광판은 32번이다. 채혈은 생각보다 금방 끝났고, 간호사가 결과는 일주일 뒤에 직접 오셔야 한다고 말하자 도윤은 네, 네, 하고 두 번 대답했다."
      - clearSticker: { id: e3_ticket, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "번호표는 지갑 카드 칸 맨 안쪽에 넣는다. 영수증 뒤에."
      - goto: e3_harin

  e3_turn:
    actions:
      - say:
          channel: action
          with: []
          text: "자동문이 열렸다 닫힌다. 길을 건너자마자 도윤은 지도 앱을 열어 '보건소' 검색 기록부터 지운다."
      - add: { deleted: 1 }
      - goto: e3_harin

  e3_harin:
    actions:
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - bg: { id: science_room, transition: cut }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "며칠 뒤, 과학실. 생물 수행평가로 곤충 표본을 만드는 시간이다. 하린과 아진은 같은 조다."
      - char: { id: 하린, position: center, emotion: blank }
      - char: { id: 아진, position: right }
      - sticker:
          id: e3_butterfly
          image: butterfly_sticker
          x: 50
          y: 30
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          channel: action
          with: [아진]
          text: "하린이 배추흰나비 날개를 핀셋으로 편다. 핀 하나, 둘. 아진은 실험대 건너편에서 그걸 보고만 있다."
      - say:
          char: 아진
          with: [하린]
          text: "그거 수행평가 그냥 사진으로 내도 된대."
      - say:
          char: 하린.blank
          with: [아진]
          text: "이게 더 쉬워. 가만히 있으니까."
      - say:
          char: 아진.awkward
          with: [하린]
          text: "…그날 교실 앞에 너 있었지. 실내화 소리 났어."
      - say:
          char: 하린
          with: [아진]
          text: "나 아니야. 나 그날 배 아파서 먼저 갔잖아. 카레."
      - say:
          char: 아진
          with: [하린]
          text: "하린아. 너 화내도 돼."
      - say:
          char: 하린
          with: [아진]
          text: "내가 왜?ㅋㅋ 나 원래 그런 거 관심 없잖아. 너네 잘 어울려. 진짜로."
      - clearSticker: { id: e3_butterfly, leave: fadeOut }
      - bg: { id: harin_room, transition: fade, duration: 900 }
      - say:
          channel: narration
          with: []
          text: "그날 밤, 하린의 방. 아진에게서 사진 한 장이 온다."
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "[사진]"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "이거 너 일곱살때 놀이터ㅋㅋ 엄마 폰 정리하다 나옴"
      - say:
          channel: message
          side: me
          char: 하린
          with: []
          text: "아 지워 제발 얼굴 왜저럼"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "싫어 이때 너 엄청 웃잖아"
      - say:
          channel: message
          side: them
          char: 아진
          with: []
          text: "너 저장해 둬. 지우지 말고"
      - say:
          channel: system
          with: []
          text: "읽음"
      - goto: e2_jisu

  e2_jisu:
    title: "지수"
    actions:
      - say:
          channel: card
          with: []
          text: "현재\n한도윤 · 29 · 결혼 아흐레 전"
      - bg: { id: dawn_room, transition: cut }
      - music: static
      - say:
          channel: narration
          with: []
          text: "보건소에 간 그날 밤, 집. 지수가 식탁에 결혼 준비 목록을 펼쳐 놓고 기다리고 있다."
      - char: { id: 지수, position: left }
      - char: { id: 도윤, position: right }
      - say:
          char: 지수
          with: [도윤]
          text: "사회는 민석 씨가 봐 주기로 했고, 축가는 빼자. 우리 둘 다 아는 사람 중에 노래 되는 사람이 없어."
      - say:
          char: 도윤
          with: [지수]
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          text: "답례품은 수건 말고 다른 거. 수건은 너무 성의 없어 보여."
      - say:
          char: 도윤
          with: [지수]
          text: "응."
      - say:
          char: 지수
          with: [도윤]
          text: "오늘 피팅은 왜 안 왔어?"
      - say:
          char: 도윤
          with: [지수]
          text: "회사에 일이 갑자기—"
      - say:
          char: 지수
          with: [도윤]
          text: "회사에 전화했어. 송과장님이 너 반차 썼대."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "어디 있었어?"
      - say:
          char: 지수.cold
          with: [도윤]
          text: "사진 찍던 날 말했지. 지금은 화 안 낸다고. 그때가 지금이야. 아직은."
      - choice:
          key: e2_jisu
          prompt: "지수가 자기 휴대폰을 화면이 아래로 가게 식탁에 엎는다."
          char: 지수
          options:
            - text: "\"은행. 대출 서류 하나 빠졌대서.\""
              goto: e2_jisu_lie
            - text: "\"회사에 나랑 엮인 소문이 좀 있어. 정리되면 말할게.\""
              set: { told_jisu: 1 }
              goto: e2_jisu_part
            - text: "\"다 말할게. 듣고 나서 네가 정해.\""
              set: { told_jisu: 2 }
              goto: e2_jisu_all

  e2_jisu_lie:
    actions:
      - say:
          char: 도윤.smile
          with: [지수]
          text: "은행. 대출 서류 하나 빠졌다고 해서. 말하면 너 또 신경 쓸까 봐."
      - say:
          char: 지수
          with: [도윤]
          text: "…그래."
      - say:
          char: 지수
          with: [도윤]
          text: "영수증 같은 건 있어?"
      - say:
          char: 도윤
          with: [지수]
          text: "어? 그런 걸 왜 받아."
      - say:
          char: 지수
          with: [도윤]
          text: "그냥. 물어봤어."
      - say:
          channel: action
          with: [지수, 도윤]
          text: "지수가 휴대폰을 다시 뒤집는다. 아무것도 오지 않은 화면을 오래 본다."
      - goto: /4.yaml

  e2_jisu_part:
    actions:
      - say:
          char: 도윤
          with: [지수]
          text: "회사에 나랑 엮인 소문이 좀 있어. 팀장님 일이랑. 나도 아직 정리가 안 돼서… 정리되면 말할게. 진짜로."
      - say:
          char: 지수
          with: [도윤]
          text: "그 소문, 나도 대충 알아."
      - say:
          char: 도윤.panic
          with: [지수]
          text: "…누구한테 들었어?"
      - say:
          char: 지수
          with: [도윤]
          text: "윤주임님 인스타. 비공개도 아니던데."
      - say:
          char: 지수
          with: [도윤]
          text: "식 전까지 기다릴게. 토요일까지. 네 입으로."
      - goto: /4.yaml

  e2_jisu_all:
    actions:
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "청첩장 찍은 날 밤에, 클럽에서 만난 사람이 있었어. 남자야."
      - say:
          char: 도윤.hollow
          with: [지수]
          text: "그 사람이 우리 팀장으로 왔고, 지금은 연락이 안 돼. 회사에선 그 사람 병 얘기가 돌고. 오늘은… 보건소에 갔었어."
      - say:
          channel: action
          with: [지수, 도윤]
          text: "지수는 반지를 손가락 마디까지 뺐다가 다시 끼운다. 두 번."
      - say:
          char: 지수.cold
          with: [도윤]
          text: "검사는."
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: true }
          with: [지수]
          text: "받았어. 결과는 다음 주."
      - say:
          char: 도윤
          when: { var: went_to_clinic, op: eq, value: false }
          with: [지수]
          text: "…앞까지만 갔어."
      - say:
          char: 지수
          when: { var: went_to_clinic, op: eq, value: false }
          with: [도윤]
          text: "내일 다시 가. 나 때문에 말고."
      - say:
          char: 지수
          with: [도윤]
          text: "식장은 내일 내가 전화해 볼게. 미룰 수 있는지. 계약금이 어떻게 되는지도."
      - say:
          char: 지수
          with: [도윤]
          text: "오늘은 내가 소파에서 잘게."
      - goto: /4.yaml
