inventory:
  console_cheap:
    name: "싸구려 레트로 게임기"
    description: "버튼은 뻑뻑하고 화면은 작다. 코어에 연결할 수 없는 기종이다."
    image: assets/items/console_cheap.svg
    category: "부품"
    order: 10
  cpu_chip:
    name: "8비트 CPU"
    description: "하루의 머리에 넣으려고 게임기에서 떼어 낸 칩. 다리가 마흔 개다."
    image: assets/items/cpu_chip.svg
    category: "부품"
    order: 20
  battery:
    name: "건전지 묶음"
    description: "AA 건전지 여덟 개. 아빠가 싸 둔 비상 가방에 들어 있었다. 테이프를 두 번 감았다."
    image: assets/items/battery.svg
    category: "부품"
    order: 30
  memory_card:
    name: "8KB 메모리 카드"
    description: "세이브 파일을 하나만 담을 수 있는 메모리 카드."
    image: assets/items/memory_card.svg
    category: "부품"
    order: 40
