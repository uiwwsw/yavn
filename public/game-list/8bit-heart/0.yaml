chapterTitle: "가장 싼 선택"

script:
  - scene: shopping_night

scenes:
  shopping_night:
    title: "꺼진 게임기"
    actions:
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 0 · 2063년 밤 11시\n윤재의 방"
      - place: "윤재의 방"
      - char: { id: 윤재, position: left }
      - char: { id: 비서, position: right }
      - sticker: { id: s0_broken, image: console_old_sticker, x: 50, y: 37, width: "clamp(160px, 48%, 280px)", enter: fadeIn }
      - say:
          channel: action
          with: []
          text: "윤재가 전원 버튼을 눌렀다. 화면이 켜지지 않는다. 사진을 비서 하루에게 보내자 천장 스피커가 울린다."
      - sound: repair_switch
      - say: { char: 윤재, motion: puff, with: [비서], text: "아, 진짜. 하루야, 또 안 켜져. 어제 여기서 게임 껐는데." }
      - say: { char: 비서, with: [윤재], text: "사진에 모델 번호가 찍혔어요. 그걸로 찾아볼게요." }
      - say: { char: 비서, with: [윤재], text: "제조사 글에는 PC에 연결해서 복구 모드로 들어가래요. 최신 펌웨어부터 받으시고요." }
      - say: { char: 윤재, with: [비서], text: "복구 뭐? 컴퓨터 안 켜고 할 수 있는 거 없어?" }
      - say: { char: 비서, with: [윤재], text: "옛날 수리 게시판에 같은 글이 있네요. 건전지부터 뺐다 끼워 보래요." }
      - say:
          channel: action
          with: []
          text: "윤재가 뒷덮개를 열어 건전지를 뺐다 끼운다."
      - sound: repair_battery
      - effect: tilt
      - say:
          char: 비서
          with: [윤재]
          text: "아직 꺼져 있어요. 다음 댓글은 옆을 두 번 두드려 보래요. “살살”이래요."
      - sound: repair_tap
      - effect: shake
      - sticker: { id: s0_broken, image: console_old_line_sticker, enter: none }
      - say:
          char: 비서
          with: [윤재]
          text: "줄이 하나 떴어요. 글 맨 밑에는 ‘카트리지 빼서 후 불었더니 됨’이 있어요."
      - sound: repair_breath
      - effect: { name: focus, wait: true }
      - sticker: { id: s0_broken, image: console_old_sticker, enter: none }
      - say: { char: 윤재, motion: droop, with: [비서], text: "됐… 아. 줄도 꺼졌어." }
      - clearSticker: { id: s0_broken, leave: fadeOut }
      - say: { char: 윤재, with: [비서], text: "콘덴서 두 개나 갈았는데. 메인보드면 나도 못 살려." }
      - say: { char: 비서, with: [윤재], text: "다용도실에 제 옛날 몸이 있잖아요. 그 손이면 나사 정도는 풀어 드렸을 텐데요." }
      - say: { char: 윤재, with: [비서], text: "그 몸은 너 나가고 한 번도 안 켜졌어." }
      - say: { char: 비서, with: [윤재], text: "지원이 끝난 기종이라서요. 저는 그때 천장으로 이사 왔고요." }
      - say: { char: 비서, with: [윤재], text: "처음 산 영수증은 남아 있어요. 열 살 생일. 결제자 이름은 가릴까요?" }
      - say: { char: 윤재, with: [비서], text: "냅둬. 엄마가 사 준 거니까." }
      - say: { char: 비서, with: [윤재], text: "지금 게임기 상태도 기록해 드릴까요?" }
      - say: { char: 윤재, with: [비서], text: "그건 됐어. 중고 장터 열어 줘." }
      - sticker: { id: s0_premium, image: console_premium_sticker, x: 35, y: 30, width: "clamp(140px, 18%, 240px)", enter: popIn }
      - say: { char: 비서.ad, with: [윤재], text: "광고 듣고 가실게요. 하이퍼링크 X, 코어 상시 연결. 지금 결제하면 열두 달 무이자." }
      - say: { char: 윤재.excited, with: [비서], text: "이거 우리 반에 세 명이나 쓰는데. 너도 얘랑 같은 코어야?" }
      - say: { char: 비서, with: [윤재], text: "네. 둘 다 새벽 세 시에 자동으로 업데이트돼요." }
      - say:
          channel: system
          with: []
          text: "[속보] 코어 기기 일부에서 ‘사용자를 확인할 수 없음’ 오류. 업데이트는 예정대로 배포."
      - say: { char: 윤재, with: [비서], text: "오류 난다는데 오늘은 받지 마." }
      - say: { char: 비서, with: [윤재], text: "윤재 님, 이 요금제에서는 업데이트를 끌 수 없어요." }
      - sticker: { id: s0_cheap, image: console_cheap_sticker, x: 65, y: 30, width: "clamp(140px, 18%, 240px)", enter: popIn }
      - say: { char: 윤재, with: [비서], text: "잠깐. 이건 우리 집 거랑 같은 기판이네. 와이파이도 계정도 필요 없어." }
      - say: { channel: message, thread: 판매자, char: 윤재, side: me, with: [], text: "전원 켜지죠? AI 없고 버튼 다 눌려요?" }
      - say: { channel: message, thread: 판매자, speakerName: 판매자, side: them, with: [], text: "AI가 뭐요 전원 켜져요 B만 좀 뻑뻑하고요 3만 2천 원" }
      - say: { channel: message, thread: 판매자, char: 윤재, side: me, with: [], text: "배송비 빼 주시면 바로 살게요" }
      - say: { channel: message, thread: 판매자, speakerName: 판매자, side: them, with: [], text: "그럼 신문지로 싸서 내일 아침 문 앞에 놓을게요" }
      - say: { char: 비서, with: [윤재], text: "버튼 고무는 천 원이면 갈아요. 신형으로 사시면 저는 추천 수당을 받고요." }
      - say: { char: 윤재, with: [비서], text: "그걸로 뭐 해?" }
      - say: { char: 비서, with: [윤재], text: "광고 덜 틀어요." }
      - choice:
          key: b0_buy
          prompt: "하이퍼링크 X는 12개월 할부에 코어 자동 업데이트. 중고는 3만 2천 원에 B버튼 수리."
          char: 윤재
          motion: sway
          options:
            - text: "HYPERLINK X를 산다"
              saveText: "HYPERLINK X 결제. 미래의 내가 갚는다"
              set: { bought_premium: true }
              goto: b0_premium
            - text: "중고 게임기를 산다"
              saveText: "\"아저씨, B버튼 뻑뻑한 거 그거 주세요.\""
              set: { bought_premium: false }
              goto: b0_cheap

  b0_premium:
    actions:
      - clearSticker: { id: s0_cheap, leave: wipeLeft }
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "결제했어. …앞으로 열두 달이라니."
      - say:
          char: 비서.ad
          motion: perk
          with: [윤재]
          text: "결제됐어요. 내일 오전에 도착합니다."
      - clearSticker: { id: s0_premium, leave: fadeOut }
      - say: { channel: card, with: [], text: "다음 날 아침", autoAdvance: 1300 }
      - sticker: { id: s0_premium, image: console_premium_sticker, x: 50, y: 36, width: "clamp(160px, 38%, 280px)", enter: fadeIn }
      - say: { channel: action, with: [], text: "윤재가 상자를 열고 게임기를 켠다. 이름을 입력하기도 전에 화면에 ‘윤재 님’이 뜬다." }
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 안녕하세요, 윤재 님. 저는 이제 윤재 님에 대해 모든 걸 알게 될 거예요 :)"
      - say:
          char: 윤재.excited
          with: [비서]
          text: "어? 하루야, 얘 내가 누군지 알아."
      - say:
          char: 비서
          with: [윤재]
          text: "같은 코어 계정이니까요. 이제 게임할 땐 저쪽이 먼저 대답할 거예요."
      - say:
          char: 윤재
          with: [비서]
          text: "너는? 게임기 켜면 너 없어져?"
      - say:
          char: 비서
          with: [윤재]
          text: "저는 이어폰에 있죠. 윤재 님이 부르시면 돼요."
      - clearSticker: { id: s0_premium, leave: fadeOut }
      - goto: /1.yaml

  b0_cheap:
    actions:
      - clearSticker: { id: s0_premium, leave: wipeRight }
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          side: me
          with: []
          text: "입금했습니다! 확인 부탁드려요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "확인했어요 내일 아침에 둘게요"
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "샀어. 야, 앱 닫아 줘. 잔액은 읽지 말고."
      - wait: 0
      - clearSticker: { id: s0_cheap, leave: fadeOut }
      - wait: 0
      - say:
          channel: card
          with: []
          text: "다음 날 아침"
          autoAdvance: 1300
      - move: { id: 윤재, style: reset }
      - say:
          char: 비서
          motion: perk
          with: [윤재]
          text: "현관에 신문지로 싼 물건이 놓였어요. 택배로 등록된 건 없는데요."
      - say:
          char: 윤재.excited
          motion: hop
          with: [비서]
          text: "왔다! …진짜 신문지로만 쌌네. 상자는 없고."
      - get: console_cheap
      - say:
          char: 비서
          with: [윤재]
          text: "신문지가 뭔가요?"
      - say:
          char: 비서
          with: [윤재]
          text: "사실 알아요. 국내 마지막 종이신문은 2041년에 나왔죠."
      - say:
          char: 윤재
          with: [비서]
          text: "근데 왜 물어봐."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님이 설명하는 걸 좋아하셔서요."
      - sticker: { id: s0_boot, image: console_cheap_sticker, x: 50, y: 35, width: "clamp(160px, 42%, 280px)", enter: fadeIn }
      - say:
          char: 윤재
          motion: lean_in
          with: [비서]
          text: "그래도 잘 싸 줬네. 신문지 세 겹에 테이프까지 꼼꼼하게 붙였어."
      - say:
          channel: system
          with: []
          text: "삑— PRESS START"
      - say:
          char: 윤재.excited
          motion: gasp
          with: [비서]
          text: "켜졌다!!! 켜졌어! 화면도 깨끗해. 세로줄 하나 없어!"
      - clearSticker: { id: s0_boot, leave: fadeOut }
      - say:
          channel: thought
          with: []
          text: "켜질 때 나는 소리. 오랜만이다."
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "…아저씨 진짜. B 버튼만 뻑뻑하다며. START도 안 눌리잖아."
      - say:
          char: 윤재
          with: [비서]
          text: "이 정도야 뭐. 세게 누르면 되잖아. 버튼 밑 고무는 나중에 갈지 뭐."
      - say:
          char: 비서
          with: [윤재]
          text: "버튼 고무는 제가 찾아 뒀어요."
      - say:
          char: 윤재
          with: [비서]
          text: "지금은 켜지잖아. 부품은 나중에. …잔액 안 읽기로 했지."
      - say:
          char: 윤재
          with: [비서]
          text: "세이브 확인. 이게 제일 중요해."
      - say:
          char: 윤재
          with: [비서]
          text: "한 판 하고, 끄고, 다시 켜고…"
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "켰는데 남아 있어! 아저씨, 이걸 확인도 안 하고 파셨어요?"
      - say:
          char: 윤재
          motion: lean_in
          with: [비서]
          text: "어? 신문지 맨 밑에 뭐 더 있네. 접힌 설명서랑…"
      - say:
          char: 윤재
          with: [비서]
          text: "손톱만 한 거. 메모리 카드?"
      - say:
          char: 윤재
          with: [비서]
          text: "매직으로 '8KB'라고 써 놨어. 삐뚤빼뚤하게."
      - say:
          char: 비서
          with: [윤재]
          text: "8KB면 제 음성 인사 파일 하나도 못 넣겠네요."
      - say:
          char: 윤재
          with: [비서]
          text: "네 인사말이 긴 거야."
      - say:
          channel: system
          with: []
          text: "설명서 1쪽 · ※ 주의: 전원을 끄기 전에 반드시 저장하세요. 저장하지 않은 데이터는 사라집니다."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "누가 이런 걸 읽냐. 설명서는 회로도 볼 때나 펴는 거야. 맨 뒷장."
      - say:
          char: 윤재
          with: [비서]
          text: "설명서랑 카드는 가방 맨 밑에 넣어 두자."
      - say:
          char: 비서
          with: [윤재]
          text: "화면을 계속 보여 주려면 중계 어댑터가 필요해요. 주문할까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "안 해."
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "왜요?"
      - say:
          char: 윤재
          with: [비서]
          text: "게임기 하나에 케이블이 왜 또 필요해. 그냥 이대로 쓸래."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          char: 윤재
          with: [비서]
          text: "오늘은 한 판만 더 할게. 하루야, 밤 열한 시에 알려 줘."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 그리고 정기 업데이트는 평소처럼 새벽 세 시에 할게요."
      - clearSticker: { id: s0_cheap, leave: fadeOut }
      - goto: /1.yaml
