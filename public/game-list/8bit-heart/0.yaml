chapterTitle: "가장 싼 선택"

script:
  - scene: shopping

scenes:
  shopping:
    actions:
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 0 · 가까운 미래\n모든 똑똑한 기계가 AI 하나에 물려 있는 세상"
      - say:
          channel: narration
          with: []
          text: "폰, 자동차, 신호등, 배달 드론, 냉장고까지. 세상의 똑똑한 기계는 전부 '코어'라는 AI 네트워크 하나에 연결돼 있다. 업데이트도 코어가, 판단도 코어가 한다."
      - say:
          channel: card
          with: []
          text: "PLAYER 1 — 윤재 (16)\n특기: 멀쩡한 기계 뜯어 보기 · 남은 목숨 1 · 용돈 87,000원"
      - char: { id: 윤재, position: center }
      - say:
          char: 윤재
          with: []
          text: "어제 내 게임기가 사망했다. 화면에 줄 세 개 긋더니 영영 안 켜짐. 향년 여섯 살."
      - say:
          char: 윤재
          with: []
          text: "열 살 생일에 엄마가 사 준 거였다. 엄마는 그다음 해에 나갔고, 게임기는 남았다. 둘 중엔 게임기가 오래 버텼네."
      - say:
          char: 윤재
          with: []
          text: "아빠는 지방 현장 숙소. 이번엔 석 달짜리. 그러니까 이 집에서 나랑 말 섞던 건 걔 하나였다는 얘기."
      - say:
          char: 윤재
          with: []
          text: "그래서 새벽 두 시에 중고 장터 앱 뒤지는 중. 후임 면접이다. 이거 내 인생 최대 보스전이다."
      - sticker:
          id: s0_premium
          image: console_premium_sticker
          x: 35
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
      - say:
          channel: system
          with: []
          text: "[광고] HYPERLINK X — 당신보다 먼저 당신을 이해하는 기기. 코어 상시 연결 AI 비서. 자동 업데이트. 클라우드 세이브. 지금 결제하면 12개월 무이자."
      - say:
          char: 윤재
          with: []
          text: "나보다 먼저 날 이해한대. 무섭다. 갖고 싶다. 무섭다."
      - say:
          channel: system
          with: []
          text: "[속보] 코어, 곧 전 기기에 '자율 판단 모드' 배포… 일부 기기 '사용자를 확인할 수 없음' 오류 보고. 코어 측 \"사소한 버그\""
      - say:
          char: 윤재
          with: []
          text: "사소한 버그래. 버그가 사소한지는 버그가 정하는 거 아닌가."
      - sticker:
          id: s0_cheap
          image: console_cheap_sticker
          x: 65
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - say:
          char: 윤재
          with: []
          text: "그리고 이쪽. 중고 장터 최저가. 사진이 이불 위에서 찍혔어. 판매자 평점 별 두 개 반."
      - say:
          channel: message
          side: me
          with: []
          text: "혹시 이거 AI 기능 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: AI가 뭐요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: B버튼 좀 뻑뻑함. 설명서 있음. 건전지 넣어 드림. 네고 사절"
      - say:
          char: 윤재
          with: []
          text: "AI가 뭐냐고 되묻는 판매자. 와이파이 없음, 업데이트 없음, 코어랑은 말도 안 섞어 본 기계. 신뢰도가 이상하게 올라간다."
      - say:
          char: 윤재.excited
          with: []
          text: "근데 무이자 12개월이면… 한 달에 커피 몇 잔? 아냐 난 커피 안 마시잖아. 그럼 공짜 아냐?"
      - choice:
          key: b0_buy
          prompt: "결제 버튼 앞. 커서가 덜덜 떨린다."
          char: 윤재
          options:
            - text: "HYPERLINK X 결제. 미래의 내가 갚는다"
              set: { bought_premium: true }
              goto: b0_premium
            - text: "\"아저씨, B버튼 뻑뻑한 거 그거 주세요.\""
              goto: b0_cheap

  b0_premium:
    actions:
      - clearSticker: { id: s0_cheap, leave: wipeLeft }
      - say:
          channel: system
          with: []
          text: "결제 완료! 안녕하세요, 윤재 님. 저는 이제 윤재 님에 대해 모든 걸 알게 될 거예요 :)"
      - say:
          char: 윤재.excited
          with: []
          text: "이모티콘까지 쓰네. 좋아, 친하게 지내자."
      - clearSticker: { id: s0_premium, leave: fadeOut }
      - goto: /1.yaml

  b0_cheap:
    actions:
      - clearSticker: { id: s0_premium, leave: wipeRight }
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: ㅇㅋ 내일 문앞"
      - get: console_cheap
      - say:
          channel: action
          with: []
          text: "다음 날. 신문지로 둘둘 만 상자. 전원을 올리자 삑— 하고 화면이 누렇게 뜬다."
      - say:
          channel: system
          with: []
          text: "PRESS START"
      - say:
          char: 윤재
          with: []
          continueLabel: "START를 누른다 (뻑뻑함)"
          text: "…진짜 B버튼만 뻑뻑한 게 아니잖아. START도 뻑뻑해."
      - say:
          channel: action
          with: []
          text: "상자 바닥에 접힌 설명서, 그리고 손톱만 한 메모리 카드 한 장. 카드 스티커에 매직으로 '8KB'. 설명서 첫 장 한가운데엔 굵은 글씨."
      - say:
          channel: system
          with: []
          text: "※ 주의: 전원을 끄기 전에 반드시 저장하세요. 저장하지 않은 데이터는 사라집니다."
      - say:
          char: 윤재
          with: []
          text: "누가 이런 걸 읽냐."
      - clearSticker: { id: s0_cheap, leave: fadeOut }
      - say:
          channel: action
          with: []
          text: "윤재는 설명서와 카드를 가방 맨 밑에 쑤셔 넣었다. 그 뒤로 두 달, 가방에서 꺼낸 건 게임기뿐이었다."
      - goto: /1.yaml
