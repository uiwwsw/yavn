chapterTitle: "가장 싼 선택"

script:
  - scene: shopping

scenes:
  shopping:
    actions:
      - bg: { id: bedroom, transition: fade, duration: 800 }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 1\n가장 싼 선택"
      - say:
          channel: narration
          with: []
          camera: wide
          text: "새벽 두 시. 모니터에 탭이 열여섯 개. 윤재는 같은 비교표를 서른 번째 보고 있다."
      - char: { id: 윤재, position: center }
      - say:
          char: 윤재.excited
          with: []
          text: "왼쪽. 최신 휴대용. AI 업스케일, 클라우드 세이브, 음성 비서까지. 가격은… 내 일 년 용돈."
      - sticker:
          id: s0_premium
          image: console_premium_sticker
          x: 35
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
      - sticker:
          id: s0_cheap
          image: console_cheap_sticker
          x: 65
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: fadeIn
          inputLockMs: 400
      - say:
          char: 윤재
          with: []
          text: "오른쪽. 이름도 이상한 중국산 레트로 게임기. 리뷰: '버튼이 덜컥거림. 화면 누렇게 뜸. 그래도 정감 있음.'"
      - say:
          channel: thought
          with: []
          text: "후회할 걸 안다. 그런데 이 못생긴 게 자꾸 눈에 밟힌다."
      - choice:
          key: b0_buy
          prompt: "결제 버튼 위에 커서가 있다."
          char: 윤재
          options:
            - text: "최신 휴대용 기기를 산다"
              set: { bought_premium: true }
              goto: b0_premium
            - text: "싸구려 레트로 게임기를 산다"
              goto: b0_cheap

  b0_premium:
    actions:
      - clearSticker: { id: s0_cheap, leave: fadeOut }
      - say:
          char: 윤재.excited
          with: []
          text: "그래, 이왕 사는 거 좋은 걸로! 미래의 내가 고마워할 거야."
      - clearSticker: { id: s0_premium, leave: fadeOut }
      - goto: /1.yaml

  b0_cheap:
    actions:
      - clearSticker: { id: s0_premium, leave: fadeOut }
      - get: console_cheap
      - say:
          char: 윤재
          with: []
          text: "…결제했다. 미쳤나 봐. 근데 왠지 기분 좋아."
      - say:
          channel: narration
          with: []
          text: "열흘 뒤 도착한 상자에서는 플라스틱 냄새가 났다. 전원을 켜자 삑, 하고 8비트 소리가 났다."
      - clearSticker: { id: s0_cheap, leave: fadeOut }
      - say:
          channel: thought
          with: []
          text: "그 선택이 세상이 무너진 뒤 나를 살릴 유일한 우연이라는 걸, 그땐 몰랐다."
      - goto: /1.yaml
