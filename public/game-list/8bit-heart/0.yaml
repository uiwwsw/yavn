chapterTitle: "가장 싼 선택"

script:
  - scene: shopping

scenes:
  shopping:
    actions:
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 0 · 2063년 밤 11시\n윤재의 방"
      - place: "윤재의 방"
      - char: { id: 윤재, position: left }
      - char: { id: 비서, position: right }
      - sticker: { id: s0_broken, image: console_old_sticker, x: 50, y: 37, width: "clamp(160px, 48%, 280px)", enter: fadeIn }
      - say:
          channel: action
          with: []
          text: "윤재가 전원 버튼을 눌렀다. 어제까지 잘 켜지던 화면이 오늘은 그대로다."
      - sound: repair_switch
      - say: { char: 윤재, motion: puff, with: [비서], text: "아, 진짜. 하루야, 또 안 켜져. 어제 여기서 게임 껐는데." }
      - say: { char: 비서, with: [윤재], text: "사진에 모델 번호가 찍혔어요. 그걸로 찾아볼게요." }
      - say: { char: 비서, with: [윤재], text: "제조사 글에는 PC에 연결해서 복구 모드로 들어가래요. 최신 펌웨어부터 받으시고요." }
      - say: { char: 윤재, with: [비서], text: "복구 뭐? 컴퓨터 안 켜고 할 수 있는 거 없어?" }
      - say: { char: 비서, with: [윤재], text: "옛날 수리 게시판에 같은 글이 있네요. 건전지부터 뺐다 끼워 보래요." }
      - say:
          channel: action
          with: []
          text: "윤재가 뒷덮개를 열어 건전지를 뺐다 끼운다."
      - sound: repair_battery
      - effect: tilt
      - say:
          char: 비서
          with: [윤재]
          text: "아직 꺼져 있어요. 다음 댓글은 옆을 두 번 두드려 보래요. “살살”이래요."
      - sound: repair_tap
      - effect: shake
      - sticker: { id: s0_broken, image: console_old_line_sticker, enter: none }
      - say:
          char: 비서
          with: [윤재]
          text: "줄이 하나 떴어요. 글 맨 밑에는 ‘카트리지 빼서 후 불었더니 됨’이 있어요."
      - sound: repair_breath
      - effect: { name: focus, wait: true }
      - sticker: { id: s0_broken, image: console_old_sticker, enter: none }
      - say: { char: 윤재, motion: droop, with: [비서], text: "됐… 아. 줄도 꺼졌어." }
      - clearSticker: { id: s0_broken, leave: fadeOut }
      - say: { char: 윤재, with: [비서], text: "콘덴서 두 개나 갈았는데. 메인보드면 나도 못 살려." }
      - say:
          char: 비서
          with: [윤재]
          text: "영수증은 남아 있어요. 2057년 10월 9일, 전자상가 3층. 결제자 이름은 가릴까요?"
      - say:
          char: 윤재
          motion: freeze
          with: [비서]
          text: "…냅둬."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          char: 윤재
          motion: droop
          with: [비서]
          text: "벌써 6년도 넘었네. 열 살 생일에 받은 건데."
      - say:
          char: 비서
          with: [윤재]
          text: "6년 2개월 3일입니다."
      - mood: { tone: grief, level: 1 }
      - say:
          char: 윤재
          with: [비서]
          text: "엄마는 그다음 해에 나갔어."
      - say:
          char: 윤재
          with: [비서]
          text: "게임기는 남았었는데. 이제 그것도 갔고."
      - say:
          char: 비서
          with: [윤재]
          text: "방금 하신 말, 기록할까요?"
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 했습니다."
      - say:
          char: 비서
          with: [윤재]
          text: "아버님께 연결할까요? 마지막 통화는 11일 전입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "안 해."
      - say:
          char: 비서
          with: [윤재]
          text: "통화 시간 평균 41초예요."
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "지방 현장 숙소에 석 달 가 있는 사람한테 게임기 죽었다고 전화해? 뭐라고 하는데."
      - say:
          char: 윤재
          with: [비서]
          text: "그 나이에 아직도 게임기냐, 할 거야."
      - mood: off
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "하루야. 중고 장터 열어."
      - say:
          char: 비서
          with: [윤재]
          text: "열었습니다. 새벽 두 시쯤 올라오는 매물은 시세보다 평균 12% 저렴해요."
      - say:
          char: 비서.ad
          motion: perk
          with: [윤재]
          text: "광고 듣고 가실게요. 무료 요금제는 열 번에 한 번 나옵니다."
      - say:
          char: 윤재
          motion: slump
          with: [비서]
          text: "아 또야."
      - sticker:
          id: s0_premium
          image: console_premium_sticker
          x: 35
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
      - say:
          char: 비서.ad
          with: [윤재]
          text: "하이퍼링크 X. 당신보다 먼저 당신을 이해하는 기기. 코어 상시 연결. 자동 업데이트. 지금 결제하면 12개월 무이자."
      - say:
          char: 윤재.excited
          motion: gasp
          with: [비서]
          text: "어? 어어? 저거 우리 반에 세 명이나 쓰는데. 쉬는 시간마다 꺼내."
      - say:
          char: 윤재
          motion: shiver
          with: [비서]
          text: "너 아까 '나보다 먼저 나를 이해한다'고 했잖아. 그럼 넌 뭔데."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 윤재 님이 말씀해 주시면 알아요."
      - say:
          char: 윤재
          motion: recoil
          with: [비서]
          text: "그게 더 무섭잖아."
      - say:
          char: 윤재
          with: [비서]
          text: "12개월 무이자면 한 달에 얼마야."
      - say:
          char: 비서
          with: [윤재]
          text: "107,500원입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "비싸네."
      - say:
          char: 비서
          with: [윤재]
          text: "속보가 떴어요. 읽어 드릴까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "어."
      - say:
          channel: system
          with: []
          text: "[속보] 코어, 곧 전 기기에 '자율 판단 모드' 배포… 일부 기기 '사용자를 확인할 수 없음' 오류 보고. 코어 측 \"사소한 버그\""
      - say:
          char: 윤재
          with: [비서]
          text: "너도 그거 받아? 그 업데이트."
      - say:
          char: 비서
          with: [윤재]
          text: "받습니다. 정기 업데이트는 보통 새벽 세 시에 해요."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "…받지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "거부할 수 없습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "뭐야 그게."
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제라서요."
      - sticker:
          id: s0_cheap
          image: console_cheap_sticker
          x: 65
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - say:
          char: 윤재.excited
          motion: perk
          with: [비서]
          text: "어 잠깐만. 잠깐만잠깐만. 이거 봐 이거. 32,000원?"
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "어떤 매물요?"
      - say:
          char: 윤재
          with: [비서]
          text: "휴대용 게임기, 와이파이 없음, 앱 없음, 계정 없음. 32,000원."
      - say:
          char: 비서
          with: [윤재]
          text: "코어 권장 거래가는 44,000원입니다."
      - wait: 0
      - say:
          char: 윤재
          with: [비서]
          text: "사진 무슨 모델인지 봐 봐. 아, 장터 화면은 내가 보내야 보이지."
      - say:
          char: 윤재
          with: [비서]
          text: "이불 위에서 대충 찍었어. 우리 아빠도 딱 이렇게 찍는데."
      - say:
          char: 비서
          with: [윤재]
          text: "메시지를 보낼까요? 정중하게 쓸 수 있습니다."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "내가 쳐. 네 말투로 보내면 나 호구 돼."
      - wait: 0
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1250
          side: me
          with: []
          text: "안녕하세요 게임기 보고 연락드려요"
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1250
          side: me
          with: []
          text: "혹시 이거 AI 기능 있어요?"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          autoAdvance: 1150
          side: them
          with: []
          text: "AI가 뭐요"
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "야, 'AI가 뭐요'래. 진짜 모르는 거 아냐?"
      - say:
          char: 비서
          with: [윤재]
          text: "코어 미가입 가구는 전국 0.4%입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "그 0.4%가 지금 내 게임기 들고 있어."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1250
          side: me
          with: []
          text: "혼자 말 걸고 게임 골라 주는 거요. 없는 게 좋아요"
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1700
          side: me
          with: []
          text: "버튼은 어때요? A랑 B 둘 다 눌러 보셨어요?"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          autoAdvance: 1300
          side: them
          with: []
          text: "B 버튼만 좀 뻑뻑해요"
      - say:
          char: 윤재
          motion: nod
          with: [비서]
          text: "역시 B 버튼이네. 이 모델은 그게 제일 먼저 맛 가."
      - say:
          char: 윤재
          motion: nod
          with: [비서]
          text: "안에 고무 돔이 삭아서 그래."
      - say:
          char: 비서
          with: [윤재]
          text: "고무 돔 교체 부품은 1,000원입니다. 주문해 드릴까요?"
      - say:
          char: 윤재
          motion: startle
          with: [비서]
          text: "쉿. 쉿! 지금 말하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "쉿."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1500
          side: me
          with: []
          text: "버튼 뻑뻑하면 게임을 못 하는데요..."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1600
          side: me
          with: []
          text: "그거 수리비 되게 비싸요 부품도 단종이고"
      - say: { char: 비서, with: [윤재], text: "아까 1,000원이라고 말씀드렸는데요." }
      - say:
          char: 윤재
          motion: sway
          with: [비서]
          text: "쉿. 수리점에 맡기면 공임 붙잖아. 비싸지, 그럼."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          side: me
          with: []
          text: "그래서 혹시 네고 좀 될까요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "네고는 안 해요"
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "한 번 더 가 본다. 세 번까지는 괜찮아. 네 번째부터 차단당해."
      - say:
          char: 비서
          with: [윤재]
          text: "그 통계는 어디서 나왔나요?"
      - say:
          char: 윤재
          with: [비서]
          text: "나한테서."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1650
          side: me
          with: []
          text: "2만 7천에 바로 입금 가능해요 지금 당장요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          autoAdvance: 1050
          side: them
          with: []
          text: "3만 2천"
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          autoAdvance: 1550
          side: me
          with: []
          text: "3만 원에 해주시면 지금 바로 입금할게요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          autoAdvance: 2000
          side: them
          with: []
          text: "3만 2천이요. 신문지 포장이라 배송비는 안 받아요"
      - say:
          char: 윤재.excited
          motion: hop
          with: [비서]
          text: "배송비가 없대. 봤지? 사천 원 번 거다."
      - wait: 0
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          side: me
          with: []
          text: "건전지는요? 넣어주시나요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "넣어 드릴게요"
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          side: me
          with: []
          text: "세이브 되는 것도 확인하셨어요? 껐다 켜서 남아 있는지요"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "그건 확인 못 했어요"
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "야, 저장은 확인 못 했대."
      - say:
          char: 비서
          with: [윤재]
          text: "저장이 왜 제일 중요한가요?"
      - say:
          char: 윤재
          with: [비서]
          text: "보스까지 깨 놓고 껐다 켰는데 첫 화면이면 열받잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 전부 저장합니다."
      - say:
          channel: message
          thread: "판매자"
          char: "윤재"
          side: me
          with: []
          text: "언제 받을 수 있어요?"
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "내일 아침 그쪽 지나가요 문 앞에 놓을게요"
      - say:
          char: 윤재
          with: [비서]
          text: "하루야. 나 잔액 얼마야."
      - say:
          char: 비서
          with: [윤재]
          text: "87,000원입니다. 결제하면 55,000원 남습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "한 달 55,000원으로 살 수 있지. 가능해."
      - say:
          char: 비서
          with: [윤재]
          text: "지난달 윤재 님 지출은 114,000원입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "급식 먹으면 되잖아. 학원 끝나고 편의점 안 들르면 되고."
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - move: { id: 윤재, toward: camera, style: approach }
      - say:
          char: 윤재.excited
          with: [비서]
          text: "아 근데 하이퍼링크 X 저거 화면 좀 봐. 저게 요즘 화면이지."
      - say:
          char: 비서
          with: [윤재]
          text: "참, 하이퍼링크 X를 사시면 제가 추천 수당을 받아요. 결제 전에 알려 드리게 돼 있어서요."
      - say:
          char: 윤재
          motion: headtilt
          with: [비서]
          text: "너도 돈을 받아? 그걸로 뭘 하는데?"
      - say:
          char: 비서
          with: [윤재]
          text: "광고를 덜 틀 수 있습니다."
      - say:
          char: 윤재
          motion: sway
          with: [비서]
          text: "하루야, 화면 꺼 봐. …아니, 다시 켜 봐."
      - choice:
          key: b0_buy
