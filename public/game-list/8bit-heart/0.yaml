chapterTitle: "가장 싼 선택"

script:
  - scene: shopping

scenes:
  shopping:
    actions:
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 0 · 2063년 · 새벽 2시"
      - place: "윤재네 집 · 혼자 쓰는 방"
      - char: { id: 윤재, position: left }
      - char: { id: 비서, position: right }
      - sticker: { id: s0_broken, image: console_old_sticker, x: 50, y: 37, width: "clamp(160px, 48%, 280px)", enter: fadeIn }
      - say:
          channel: action
          with: []
          text: "엄지를 올린 전원 스위치는 닳아서 반질반질하다."
          continueLabel: "전원을 켠다"
      - sound: repair_switch
      - say: { char: 윤재, motion: puff, with: [비서], text: "아, 진짜. 하루야, 또 안 켜져. 어제 여기서 게임 껐는데." }
      - say: { char: 비서, with: [윤재], text: "아까 찍으신 사진에 모델 번호가 있어요. 찾아볼게요." }
      - say: { char: 비서, with: [윤재], text: "제조사 안내가 나왔어요. 최신 펌웨어를 내려받고, PC에 연결해서 복구 모드로 들어가래요." }
      - say: { char: 윤재, with: [비서], text: "잠깐. 복구 모드가 뭔데. 지금 손으로 해 볼 만한 거 없어?" }
      - say: { char: 비서, with: [윤재], text: "오래된 수리 게시판에도 같은 증상이 있어요. 건전지부터 뺐다 끼워 보래요." }
      - say:
          channel: action
          with: []
          text: "뒷덮개 틈에 손톱을 건다."
          continueLabel: "건전지를 뺐다 끼운다"
      - sound: repair_battery
      - effect: tilt
      - say:
          char: 비서
          with: [윤재]
          text: "그대로네요. 댓글에는 옆을 두 번 두드려 보래요. 그 밑에 ‘살살’이라고 적혀 있어요."
          continueLabel: "본체를 툭툭 친다"
      - sound: repair_tap
      - effect: shake
      - sticker: { id: s0_broken, image: console_old_line_sticker, enter: none }
      - say:
          char: 비서
          with: [윤재]
          text: "줄이 하나 떴어요. 글 맨 밑에는 ‘카트리지 빼서 후 불었더니 됨’이 있어요."
          continueLabel: "카트리지에 입김을 분다"
      - sound: repair_breath
      - effect: { name: focus, wait: true }
      - sticker: { id: s0_broken, image: console_old_sticker, enter: none }
      - say: { char: 윤재, motion: droop, with: [비서], text: "됐… 아. 줄도 꺼졌어." }
      - clearSticker: { id: s0_broken, leave: fadeOut }
      - say: { char: 윤재, with: [비서], text: "콘덴서 두 개나 갈았는데. 메인보드면 나도 못 살려." }
      - say:
          char: 비서
          with: [윤재]
          text: "영수증은 남아 있어요. 2057년 10월 9일, 전자상가 3층. 결제자 이름은 가릴까요?"
      - say:
          char: 윤재
          motion: freeze
          with: [비서]
          text: "…냅둬."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          char: 윤재
          motion: droop
          with: [비서]
          text: "벌써 6년도 넘었네. 열 살 생일에 받은 건데."
      - say:
          char: 비서
          with: [윤재]
          text: "여섯 해 두 달 삼 일입니다."
      - mood: { tone: grief, level: 1 }
      - say:
          char: 윤재
          with: [비서]
          text: "엄마는 그다음 해에 나갔어."
      - say:
          char: 윤재
          with: [비서]
          text: "게임기는 남았었는데. 이제 그것도 갔고."
      - say:
          char: 비서
          with: [윤재]
          text: "방금 하신 말, 기록할까요?"
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 했습니다."
      - say:
          char: 비서
          with: [윤재]
          text: "아버님께 연결할까요? 마지막 통화는 11일 전입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "안 해."
      - say:
          char: 비서
          with: [윤재]
          text: "통화 시간 평균 사십일 초예요."
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "지방 현장 숙소에 석 달 가 있는 사람한테 게임기 죽었다고 전화해? 뭐라고 하는데."
      - say:
          char: 윤재
          with: [비서]
          text: "그 나이에 아직도 게임기냐, 할 거야."
      - mood: off
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "하루야. 중고 장터 열어."
      - say:
          char: 비서
          with: [윤재]
          text: "열었습니다. 새벽 두 시쯤 올라오는 매물은 시세보다 평균 12% 저렴해요."
      - say:
          char: 비서.ad
          motion: perk
          with: [윤재]
          text: "광고 듣고 가실게요. 무료 요금제는 열 번에 한 번 나옵니다."
      - say:
          char: 윤재
          motion: slump
          with: [비서]
          text: "아 또야."
      - sticker:
          id: s0_premium
          image: console_premium_sticker
          x: 35
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
      - say:
          char: 비서.ad
          with: [윤재]
          text: "하이퍼링크 X. 당신보다 먼저 당신을 이해하는 기기. 코어 상시 연결. 자동 업데이트. 지금 결제하면 12개월 무이자."
      - say:
          char: 윤재.excited
          motion: gasp
          with: [비서]
          text: "어? 어어? 저거 우리 반에 세 명이나 쓰는데. 쉬는 시간마다 꺼내."
      - say:
          char: 윤재
          motion: shiver
          with: [비서]
          text: "너 아까 '나보다 먼저 나를 이해한다'고 했잖아. 그럼 넌 뭔데."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 윤재 님 뒤에서 이해합니다."
      - say:
          char: 윤재
          motion: recoil
          with: [비서]
          text: "그게 더 무섭잖아."
      - say:
          char: 윤재
          with: [비서]
          text: "십이 개월 무이자면 한 달에 얼마야."
      - say:
          char: 비서
          with: [윤재]
          text: "십만 칠천오백 원입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "비싸네."
      - say:
          char: 비서
          with: [윤재]
          text: "속보가 떴어요. 읽어 드릴까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "어."
      - say:
          channel: system
          with: []
          text: "[속보] 코어, 곧 전 기기에 '자율 판단 모드' 배포… 일부 기기 '사용자를 확인할 수 없음' 오류 보고. 코어 측 \"사소한 버그\""
      - say:
          char: 윤재
          with: [비서]
          text: "너도 그거 받아? 그 업데이트."
      - say:
          char: 비서
          with: [윤재]
          text: "받습니다. 오늘 새벽 세 시요."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "…받지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "거부할 수 없습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "뭐야 그게."
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제라서요."
      - sticker:
          id: s0_cheap
          image: console_cheap_sticker
          x: 65
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - say:
          char: 윤재.excited
          motion: perk
          with: [비서]
          text: "어 잠깐만. 잠깐만잠깐만. 이거 봐 이거. 삼만 이천 원?"
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "어떤 매물요?"
      - say:
          char: 윤재
          with: [비서]
          text: "휴대용 게임기, 와이파이 없음, 앱 없음, 계정 없음. 삼만 이천 원."
      - say:
          char: 비서
          with: [윤재]
          text: "코어 권장 거래가는 사만 사천 원입니다."
      - say:
          char: 윤재
          motion: bounce
          with: [비서]
          text: "거봐! 내가 두 달째 보고 있어서 알아."
      - say:
          char: 윤재
          with: [비서]
          text: "사진 봐 봐. 아, 내 화면은 못 보지."
      - say:
          char: 윤재
          with: [비서]
          text: "이불 위에서 대충 찍었어. 우리 아빠도 딱 이렇게 찍는데."
      - say:
          char: 비서
          with: [윤재]
          text: "메시지를 보낼까요? 정중하게 쓸 수 있습니다."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "내가 쳐. 네 말투로 보내면 나 호구 돼."
      - say:
          char: 윤재
          with: [비서]
          text: "떨지 마. 떨면 호구 되는 거야."
      - say:
          channel: message
          autoAdvance: 1250
          side: me
          with: []
          text: "안녕하세요 혹시 아직 있나요"
      - say:
          channel: message
          autoAdvance: 1250
          side: me
          with: []
          text: "혹시 이거 AI 기능 있어요?"
      - say:
          channel: message
          autoAdvance: 1150
          side: them
          with: []
          text: "판매자: AI가 뭐요"
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "야, 'AI가 뭐요'래. 진짜 모르는 거 아냐?"
      - say:
          char: 비서
          with: [윤재]
          text: "코어 미가입 가구는 전국 0.4%입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "그 0.4%가 지금 내 게임기 들고 있어."
      - say:
          channel: message
          autoAdvance: 1250
          side: me
          with: []
          text: "아니에요 없는 게 좋아요"
      - say:
          channel: message
          autoAdvance: 1700
          side: me
          with: []
          text: "버튼은 어때요? A랑 B 둘 다 눌러 보셨어요?"
      - say:
          channel: message
          autoAdvance: 1300
          side: them
          with: []
          text: "판매자: B 버튼 좀 뻑뻑함"
      - say:
          char: 윤재
          motion: nod
          with: [비서]
          text: "역시 B 버튼이네. 이 모델은 그게 제일 먼저 맛 가."
      - say:
          char: 윤재
          motion: nod
          with: [비서]
          text: "안에 고무 돔이 삭아서 그래."
      - say:
          char: 비서
          with: [윤재]
          text: "고무 돔 교체 부품은 천 원입니다. 주문해 드릴까요?"
      - say:
          char: 윤재
          motion: startle
          with: [비서]
          text: "쉿. 쉿! 지금 말하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "쉿."
      - say:
          channel: message
          autoAdvance: 1500
          side: me
          with: []
          text: "버튼 뻑뻑하면 게임을 못 하는데요..."
      - say:
          channel: message
          autoAdvance: 1600
          side: me
          with: []
          text: "그거 수리비 되게 비싸요 부품도 단종이고"
      - say: { char: 비서, with: [윤재], text: "아까 천 원이라고 말씀드렸는데요." }
      - say:
          char: 윤재
          motion: sway
          with: [비서]
          text: "쉿. 수리점에 맡기면 공임 붙잖아. 비싸지, 그럼."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          channel: message
          side: me
          with: []
          text: "그래서 혹시 네고 좀 될까요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 네고 사절"
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "한 번 더 가 본다. 세 번까지는 괜찮아. 네 번째부터 차단당해."
      - say:
          char: 비서
          with: [윤재]
          text: "그 통계는 어디서 나왔나요?"
      - say:
          char: 윤재
          with: [비서]
          text: "나한테서."
      - say:
          channel: message
          autoAdvance: 1650
          side: me
          with: []
          text: "2만 7천에 바로 입금 가능해요 지금 당장요"
      - say:
          channel: message
          autoAdvance: 1050
          side: them
          with: []
          text: "판매자: 3만 2천"
      - say:
          channel: message
          autoAdvance: 1550
          side: me
          with: []
          text: "3만에 해주시면 오늘 밤에 바로 보낼게요"
      - say:
          channel: message
          autoAdvance: 2000
          side: them
          with: []
          text: "판매자: 3만 2천. 신문지에 싸서 보내서 택배비도 내가 냄"
      - say:
          char: 윤재.excited
          motion: hop
          with: [비서]
          text: "택배비 빼면 이만 팔천이네. 봤지? 깎았다니까."
      - say:
          char: 비서
          with: [윤재]
          text: "축하드립니다."
      - say:
          char: 윤재
          motion: headtilt
          with: [비서]
          text: "진심이야 그거?"
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제에는 진심 기능이 없습니다."
      - say:
          char: 윤재
          motion: laugh
          with: [비서]
          text: "…야 너 그거 농담 맞잖아. 맞잖아!"
      - say:
          channel: message
          side: me
          with: []
          text: "건전지는요? 넣어주시나요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 넣어 드림"
      - say:
          channel: message
          side: me
          with: []
          text: "설명서도 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 있음"
      - say: { char: 윤재, with: [비서], text: "있대. 나 설명서는 안 읽는데." }
      - say:
          channel: message
          side: me
          with: []
          text: "세이브 되는 것도 확인하셨어요? 껐다 켜서 남아 있는지요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 안 해봄"
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "야, 안 해 봤대."
      - say:
          char: 비서
          with: [윤재]
          text: "저장이 왜 제일 중요한가요?"
      - say:
          char: 윤재
          with: [비서]
          text: "보스까지 깨 놓고 껐다 켰는데 첫 화면이면 열받잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 전부 저장합니다."
      - say:
          channel: message
          side: me
          with: []
          text: "택배 언제 와요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 내일 문 앞에 놓아 드림"
      - say:
          char: 윤재
          with: [비서]
          text: "하루야. 나 잔액 얼마야."
      - say:
          char: 비서
          with: [윤재]
          text: "팔만 칠천 원입니다. 결제하면 오만 오천 원 남습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "한 달 오만 오천으로 살 수 있지. 가능해."
      - say:
          char: 비서
          with: [윤재]
          text: "지난달 윤재 님 지출은 십일만 사천 원입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "급식 먹으면 되잖아. 학원 끝나고 편의점 안 들르면 되고."
      - say:
          char: 비서
          with: [윤재]
          text: "편의점은 지난달 열아홉 번 가셨습니다."
      - say:
          char: 윤재
          motion: startle
          with: [비서]
          text: "…열아홉 번?"
      - say:
          char: 윤재
          motion: stomp
          with: [비서]
          text: "안 들르면 되잖아!"
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - move: { id: 윤재, toward: camera, style: approach }
      - say:
          char: 윤재.excited
          with: [비서]
          text: "아 근데 하이퍼링크 X 저거 화면 좀 봐. 저게 요즘 화면이지."
      - say:
          char: 비서
          with: [윤재]
          text: "하이퍼링크 X를 고르시면 저한테 추천 수당이 들어옵니다. 말씀드려야 해서요."
      - say:
          char: 윤재
          motion: headtilt
          with: [비서]
