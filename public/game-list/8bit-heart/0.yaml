chapterTitle: "가장 싼 선택"

script:
  - scene: shopping

scenes:
  shopping:
    actions:
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "STAGE 0 · 2063년 · 새벽 2시"
      - place: "윤재네 집 · 혼자 쓰는 방"
      - char: { id: 윤재, position: left }
      - char: { id: 비서, position: right }
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 두 시 사 분이에요. 내일 1교시 수학이고요."
      - say:
          char: 윤재
          with: [비서]
          text: "알아."
      - say:
          char: 비서
          with: [윤재]
          text: "모의고사까지 서른한 밤 남았습니다."
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "그것도 알아. 하루야 좀."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          channel: card
          with: []
          text: "PLAYER 1 — 윤재 (16)\n남은 목숨 1 · 용돈 87,000원"
      - say:
          char: 윤재
          motion: sigh
          with: [비서]
          text: "안 켜져."
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "어떤 기기가요?"
      - say:
          char: 윤재
          with: [비서]
          text: "너 지금 내 손 보이지. 여기 들고 있는 거."
      - say:
          char: 비서
          with: [윤재]
          text: "손은 보여요. 손에 든 건 안 보입니다. 코어에 등록되지 않은 물건은 저한테 안 잡혀요."
      - say:
          char: 윤재
          with: [비서]
          text: "열 번째야 그 대답. 내가 세 봤어."
      - say:
          char: 비서
          with: [윤재]
          text: "제가 세 드릴까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "됐어."
      - say:
          char: 윤재
          with: [비서]
          text: "건전지 뺐다 끼웠어. 단자 닦았어. 후— 불었고."
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "불면 되나요?"
      - say:
          char: 윤재
          with: [비서]
          text: "옛날 사람들은 됐대."
      - say:
          char: 비서
          with: [윤재]
          text: "언제 사람들요?"
      - say:
          char: 윤재
          with: [비서]
          text: "몰라. 옛날. 아빠가 그랬어."
      - say:
          char: 윤재
          with: [비서]
          text: "뜯어도 봤어. 안에 부푼 콘덴서 두 개 갈았거든? 그래도 안 돼."
      - say:
          char: 비서
          with: [윤재]
          text: "납땜은 어디서 배우셨어요?"
      - say:
          char: 윤재
          with: [비서]
          text: "영상 보고."
      - say:
          char: 비서
          with: [윤재]
          text: "열다섯 살 아래 사용자에게는 인두 사용을 권장하지 않습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "나 열여섯이야."
      - say:
          char: 비서
          with: [윤재]
          text: "그럼 권장합니다."
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "…너 방금 그거 농담이야?"
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제에는 농담 기능이 없습니다."
      - say:
          char: 윤재
          motion: sigh
          with: [비서]
          text: "메인보드가 간 거야. 메인보드 가면 끝이야. 그건 나도 못 살려."
      - say:
          char: 비서
          with: [윤재]
          text: "영수증은 남아 있어요. 2057년 10월 9일, 전자상가 3층. 결제자 이름은 가릴까요?"
      - say:
          char: 윤재
          motion: freeze
          with: [비서]
          text: "…냅둬."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          char: 윤재
          motion: droop
          with: [비서]
          text: "여섯 살이네 그럼. 열 살 생일에 받았으니까."
      - say:
          char: 비서
          with: [윤재]
          text: "여섯 해 두 달 삼 일입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "엄마는 그다음 해에 나갔어. 게임기는 남았었는데. 이제 그것도 갔고."
      - say:
          char: 비서
          with: [윤재]
          text: "방금 하신 말, 기록할까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "뭘 기록해."
      - say:
          char: 비서
          with: [윤재]
          text: "가끔 기록해요. 나중에 찾으시는 분이 있어서요."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 했습니다."
      - say:
          char: 비서
          with: [윤재]
          text: "아버님께 연결할까요? 마지막 통화는 11일 전입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "안 해."
      - say:
          char: 비서
          with: [윤재]
          text: "통화 시간 평균 사십일 초예요."
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "지방 현장 숙소에 석 달 가 있는 사람한테 게임기 죽었다고 전화해? 뭐라고 하는데."
      - say:
          char: 윤재
          with: [비서]
          text: "그 나이에 아직도 게임기냐, 할 거야. 백 퍼센트. 안 해, 전화."
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "하루야. 중고 장터 열어."
      - say:
          char: 비서
          with: [윤재]
          text: "열었습니다. 새벽 두 시대 시세가 평균 12% 낮아요."
      - say:
          char: 윤재
          with: [비서]
          text: "그러니까 이 시간에 보는 거야. 다들 자니까."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님도 주무셔야 합니다."
      - say:
          char: 윤재
          with: [비서]
          text: "너부터 자."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 안 잡니다."
      - say:
          char: 비서.ad
          motion: perk
          with: [윤재]
          text: "광고 듣고 가실게요. 무료 요금제는 열 번에 한 번 나옵니다."
      - say:
          char: 윤재
          motion: slump
          with: [비서]
          text: "아 또야."
      - sticker:
          id: s0_premium
          image: console_premium_sticker
          x: 35
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
      - say:
          char: 비서.ad
          with: [윤재]
          text: "하이퍼링크 X. 당신보다 먼저 당신을 이해하는 기기. 코어 상시 연결. 자동 업데이트. 지금 결제하면 12개월 무이자."
      - say:
          char: 윤재.excited
          motion: gasp
          with: [비서]
          text: "어? 어어? 저거 우리 반에 세 명 있어. 쉬는 시간마다 꺼내."
      - say:
          char: 비서
          with: [윤재]
          text: "광고였습니다."
      - say:
          char: 윤재
          motion: shiver
          with: [비서]
          text: "너 아까 '나보다 먼저 나를 이해한다'고 했잖아. 그럼 넌 뭔데."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 윤재 님 뒤에서 이해합니다."
      - say:
          char: 윤재
          motion: recoil
          with: [비서]
          text: "그게 더 무섭잖아."
      - say:
          char: 윤재
          with: [비서]
          text: "십이 개월 무이자면 한 달에 얼마야."
      - say:
          char: 비서
          with: [윤재]
          text: "십만 칠천오백 원입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "비싸네."
      - say:
          char: 비서
          with: [윤재]
          text: "속보가 떴어요. 읽어 드릴까요?"
      - say:
          char: 윤재
          with: [비서]
          text: "어."
      - say:
          channel: system
          with: []
          text: "[속보] 코어, 곧 전 기기에 '자율 판단 모드' 배포… 일부 기기 '사용자를 확인할 수 없음' 오류 보고. 코어 측 \"사소한 버그\""
      - say:
          char: 윤재
          with: [비서]
          text: "사소하면 기사를 왜 써."
      - say:
          char: 비서
          with: [윤재]
          text: "모르겠습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "너도 그거 받아? 그 업데이트."
      - say:
          char: 비서
          with: [윤재]
          text: "받습니다. 오늘 새벽 세 시요."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "…받지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "거부할 수 없습니다."
      - say:
          char: 윤재
          with: [비서]
          text: "뭐야 그게."
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제라서요."
      - sticker:
          id: s0_cheap
          image: console_cheap_sticker
          x: 65
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - say:
          char: 윤재.excited
          motion: perk
          with: [비서]
          text: "어 잠깐만. 잠깐만잠깐만. 이거 봐 이거. 삼만 이천 원?"
      - say:
          char: 비서
          motion: headtilt
          with: [윤재]
          text: "어떤 매물요?"
      - say:
          char: 윤재
          with: [비서]
          text: "휴대용 게임기, 와이파이 없음, 앱 없음, 계정 없음. 삼만 이천 원."
      - say:
          char: 비서
          with: [윤재]
          text: "코어 권장 거래가는 사만 사천 원입니다."
      - say:
          char: 윤재
          motion: bounce
          with: [비서]
          text: "거봐! 내가 두 달째 보고 있어서 알아."
      - say:
          char: 윤재
          with: [비서]
          text: "사진 봐 봐. 아 못 보지. 이불 위에서 찍었어. 각도도 비뚤어. 어른이 찍은 거야 이거."
      - say:
          char: 비서
          with: [윤재]
          text: "메시지를 보낼까요? 정중하게 쓸 수 있습니다."
      - say:
          char: 윤재
          motion: shake
          with: [비서]
          text: "내가 쳐. 네 말투로 보내면 나 호구 돼."
      - say:
          char: 윤재
          with: [비서]
          text: "떨지 마. 떨면 호구 되는 거야."
      - say:
          channel: message
          side: me
          with: []
          text: "안녕하세요 혹시 아직 있나요"
      - say:
          channel: message
          side: me
          with: []
          text: "혹시 이거 AI 기능 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: AI가 뭐요"
      - say:
          char: 윤재.excited
          motion: bounce
          with: [비서]
          text: "와. 와와와. 'AI가 뭐요'래. 이 아저씨 코어랑 말도 안 섞어 본 사람이야."
      - say:
          char: 비서
          with: [윤재]
          text: "코어 미가입 가구는 전국 0.4%입니다."
      - say:
          char: 윤재
          with: [비서]
          text: "그 0.4%가 지금 내 게임기 들고 있어."
      - say:
          channel: message
          side: me
          with: []
          text: "아니에요 없는 게 좋아요"
      - say:
          channel: message
          side: me
          with: []
          text: "버튼은 어때요? A랑 B 둘 다 눌러 보셨어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: B버튼 좀 뻑뻑함"
      - say:
          char: 윤재
          motion: nod
          with: [비서]
          text: "나왔다. B버튼. 이 모델은 B가 제일 먼저 죽어. 안에 고무 돔이 삭아서 그래."
      - say:
          char: 비서
          with: [윤재]
          text: "고무 돔 교체 부품은 천 원입니다. 주문해 드릴까요?"
      - say:
          char: 윤재
          motion: startle
          with: [비서]
          text: "쉿. 쉿! 지금 말하지 마."
      - say:
          char: 비서
          with: [윤재]
          text: "쉿."
      - say:
          char: 윤재
          with: [비서]
          text: "따라 하지 말고."
      - say:
          channel: message
          side: me
          with: []
          text: "버튼 뻑뻑하면 게임을 못 하는데요..."
      - say:
          channel: message
          side: me
          with: []
          text: "그거 수리비 되게 비싸요 부품도 단종이고"
      - say:
          char: 비서
          with: [윤재]
          text: "방금 보내신 내용은 사실과 다릅니다. 정정해 드릴까요?"
      - say:
          char: 윤재
          motion: sway
          with: [비서]
          text: "비쌀 수도 있잖아. 비싼 데 가면 비싸. 진짜로."
      - say:
          char: 비서
          with: [윤재]
          text: "네."
      - say:
          char: 윤재
          with: [비서]
          text: "그 '네'는 또 뭐야."
      - say:
          channel: message
          side: me
          with: []
          text: "그래서 혹시 네고 좀 될까요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 네고 사절"
      - say:
          char: 윤재
          motion: perk
          with: [비서]
          text: "한 번 더 가 본다. 세 번까지는 괜찮아. 네 번째부터 차단당해."
      - say:
          char: 비서
          with: [윤재]
          text: "그 통계는 어디서 나왔나요?"
      - say:
          char: 윤재
          with: [비서]
          text: "나한테서."
      - say:
          channel: message
          side: me
          with: []
          text: "2만 7천에 바로 입금 가능해요 지금 당장요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 3만 2천"
      - say:
          channel: message
          side: me
          with: []
          text: "3만에 해주시면 오늘 밤에 바로 보낼게요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 3만 2천. 신문지에 싸서 보내서 택배비도 내가 냄"
      - say:
          char: 윤재.excited
          motion: hop
          with: [비서]
          text: "그럼 실질 이만 팔천이잖아. 내가 이겼네. 아무도 안 졌는데 내가 이겼어."
      - say:
          char: 비서
          with: [윤재]
          text: "축하드립니다."
      - say:
          char: 윤재
          motion: headtilt
          with: [비서]
          text: "진심이야 그거?"
      - say:
          char: 비서
          with: [윤재]
          text: "무료 요금제에는 진심 기능이 없습니다."
      - say:
          char: 윤재
          motion: laugh
          with: [비서]
          text: "…야 너 그거 농담 맞잖아. 맞잖아!"
      - say:
          channel: message
          side: me
          with: []
          text: "건전지는요? 넣어주시나요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 넣어 드림"
      - say:
          channel: message
          side: me
          with: []
          text: "설명서도 있어요?"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 있음"
      - say:
          char: 윤재
          with: [비서]
          text: "설명서 있대. 그거 나 안 읽어. 근데 있는 거랑 없는 거랑 시세가 달라."
      - say:
          channel: message
          side: me
          with: []
          text: "세이브 되는 것도 확인하셨어요? 껐다 켜서 남아 있는지요"
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: 안 해봄"
      - say:
          char: 윤재
          motion: puff
          with: [비서]
          text: "안 해 봤대. 제일 중요한 걸 안 해 봤대. 아저씨."
      - say:
          char: 비서
          with: [윤재]
          text: "저장이 왜 제일 중요한가요?"
      - say:
          char: 윤재
          with: [비서]
          text: "저장이 안 되면 한 게 없어지잖아. 그럼 안 한 거랑 똑같아."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 전부 저장합니다."
      - say:
          char: 윤재
          with: [비서]
