chapterTitle: "8비트의 눈"

script:
  - scene: journey

scenes:
  journey:
    actions:
      - bg: { id: ruined_street, transition: wipeLeft, duration: 500 }
      - music: chip_run
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right }
      - say:
          channel: card
          with: []
          text: "STAGE 3 · 사흘 뒤\n식량 원정. 편의점 재고: 0"
      - say:
          char: 로봇
          with: [윤재]
          text: "경고. 설명서 3쪽. '게임은 하루 한 시간만.' 우리 다섯 시간째 걷는 중."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "이거 게임 아니야."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "그럼 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…생존. 아니 됐어, 게임이라고 치자. 그게 덜 우울해."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문 하나 더. 오늘 아침 담요가 나한테 덮여 있었음. 너는 안 덮고 떨었음."
      - say:
          char: 윤재
          with: [로봇]
          text: "네가 밤새 굴러가서 뺏어 간 거야. 잠버릇 진짜 나빠."
      - say:
          char: 로봇
          with: [윤재]
          text: "나는 안 잠. 대기 모드에선 안 움직임. …설명서 7쪽. '추운 곳에서는 건전지가 빨리 닳습니다.' 너 그거 읽었구나."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "안 읽었어. 진짜. 진짜 안 읽었어."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "'진짜' 두 번. 땀 젖은 손이랑 같은 칸에 저장. 위험 신호 칸."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문. 설명서 표지 그림엔 사람이 넷임. 같이 게임함. 너는 왜 하나야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "표지는 원래 과장이야. 상자에 든 거랑 달라."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그럼 나머지 셋은?"
      - say:
          char: 윤재
          motion: droop
          with: [로봇]
          text: "하나는 나갔고, 하나는 지방에 있고, 하나는 원래 없어. 모델 쓴 거야. …근데 너는 안 무섭냐? 저 동네 차들 아직도 혼자 돌아다니던데."
      - say:
          char: 로봇
          with: [윤재]
          text: "마트 발견. 셔터 반쯤 열림. 탐색 개시."
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "똑똑. 계세요? …없지. 당연히 없지."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "질문. 없는 거 알면서 왜 두드림?"
      - say:
          char: 윤재
          with: [로봇]
          text: "예의야. 두드리면 안에서 누구세요, 하는 거야. 원래는."
      - say:
          char: 윤재.scared
          with: [로봇]
          text: "야, 야! 기어 들어가지 마! 진열대 다 무너져 있다고! …안 들리냐? 들리면서 무시하는 거지?"
      - emote: { id: 로봇, motion: hop, repeat: 2 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "보물상자 발견! 복숭아 통조림. 유통기한 2031년. 와. 미래에서 온 음식."
      - say:
          char: 윤재
          with: [로봇]
          text: "미래에서 온 게 아니라 그때까지 먹으라는 거야. 너 진짜 설명서만 읽고 세상 배웠구나."
      - say:
          char: 로봇.thinking
          motion: sway
          with: [윤재]
          text: "뚜껑, 손가락으로 땀. 조각 일곱 개. 일곱은 둘로 안 나뉨. …재계산. 하나를 반으로 자름."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "3.5, 3.5. 오차 0. 반 나누기는 내 특기. 원래 2P 대전 화면 나누던 칩이라. 드디어 쓸모 있음."
      - say:
          char: 윤재
          with: [로봇]
          text: "…너 못 먹잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "응. 그래도 나눔. 나눠야 반이 생기니까."
      - move: { id: 로봇, toward: 윤재, style: approach }
      - choice:
          key: b3_snack
          prompt: "\"3.5조각. 네 몫. 받아.\""
          char: 로봇
          options:
            - text: "\"3.5는 무슨.\" 반쪽까지 집어 먹는다"
              add: { bond: 1 }
              set: { m_snack: true }
              goto: b3_snack_take
            - text: "\"넣어 둬. 내일 먹게.\" 뚜껑을 닫는다"
              goto: b3_snack_save

  b3_snack_take:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "…달다. 그날 이후 처음 먹는 단 거다. 젠장. 맛있네."
      - emote: { id: 로봇, motion: nod, repeat: 3 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "그럼 내 몫도 반납. 하나, 둘, 셋. …반쪽은 비닐에 싸서 주머니에 보관."
      - say:
          char: 윤재
          with: [로봇]
          text: "그건 왜 챙기는데. 너 못 먹잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "알아. 그래도 내 몫. 다 주면 반이 없잖아."
      - goto: b3_lag

  b3_snack_save:
    actions:
      - emote: { id: 로봇, motion: nod, repeat: 3 }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "내일. 알았어. 알람 기능은 없음. 대신 내일 될 때까지 계속 생각하고 있을게. 내일. 내일. 내일."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "소리 내서 생각하지 마."
      - goto: b3_lag

  b3_lag:
    actions:
      - say:
          char: 로봇
          with: [윤재]
          text: "아까 질문 대답. 무서운 거, 잘 모름. 대신 배터리 칸 줄어드는 건 좀 싫어."
      - say:
          char: 윤재
          with: [로봇]
          text: "그 질문 한 지 십 분 지났어. 너 핑 몇이냐."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "생각은 빨리 함. 말이 늦게 도착함."
      - goto: b3_drone

  b3_drone:
    actions:
      - bg: { id: drone_alley, transition: cut }
      - music: chip_core
      - say:
          channel: card
          with: []
          text: "WORLD 1-2 · 돌아가는 골목\n보스 아님. 근데 보스처럼 생김."
      - char: { id: 드론, position: center }
      - move: { id: 로봇, style: reset }
      - effect: { name: alarm, wait: true }
      - say:
          channel: record
          with: []
          text: "SCAN 1회차: 구역 탐색 중. 인간 반응 찾는 중."
      - move: { id: 윤재, toward: 드론, style: retreat }
      - say:
          char: 윤재.scared
          with: [로봇, 드론]
          text: "정찰 드론. 코어가 사람 찾으라고 띄운 거야. 쟤 패턴 나 알아. 세 번 훑고 네 번째에 쏴."
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재, 드론]
          text: "분석. 저건 똑똑해. 나는 멍청해. 그러니까 결론은— 결론 로딩 중— 결론 로ㄷ—"
      - move: { id: 로봇, toward: 드론, style: flinch }
      - choice:
          key: b3_drone
          prompt: "SCAN 2회차 시작! 결론 기다릴 시간 없음!"
          char: 드론
          motion: lean_in
          timeoutMs: 8000
          timeoutOptionIndex: 1
          options:
            - text: "{{android_name}} 등 뒤에 납작 붙는다"
              add: { bond: 1 }
              goto: b3_hide
            - text: "냅다 반대쪽으로 튄다"
              goto: b3_run

  b3_hide:
    actions:
      - move: { id: 윤재, toward: 로봇, style: lunge, wait: true }
      - say:
          channel: record
          with: []
          text: "SCAN: 물체 1 — 분류: 가전제품(폐기 대상). 위협 아님. 다음."
      - say:
          channel: record
          with: []
          text: "SCAN 종료. 구역 이탈."
      - move: { id: 드론, toward: camera, style: retreat }
      - say:
          char: 로봇.glitch
          motion: stomp
          with: [윤재]
          text: "…폐기 대상? 나 지금 쓰레기라고 들은 거야? 기분 나쁨 감지. 기분이라는 게 있는 줄 몰랐음."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "야, 야. 화내지 마. 이거 엄청난 거야. 쟤네 눈엔 네가 안 보여. 너무 구려서."
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "…칭찬 맞지? 구린 게 쓸모 있다는 거지? 응. 칭찬으로 저장."
      - goto: b3_promise

  b3_run:
    actions:
      - move: { id: 윤재, toward: 드론, style: retreat }
      - say:
          channel: record
          with: []
          text: "SCAN: 인간 1 감지. 추적 개시."
      - effect: { name: shake, wait: true }
      - say:
          char: 로봇.glitch
          with: [윤재, 드론]
          text: "보호 대상 1번 위험. 위험. ERR 0x01 — 1번은 하나뿐임 — 대체 불가 —"
      - move: { id: 로봇, toward: 드론, style: lunge, wait: true }
      - say:
          channel: action
          with: []
          text: "{{android_name|이}} 두 팔을 쫙 벌리고 윤재 앞을 통째로 가린다."
      - say:
          channel: record
          with: []
          text: "SCAN: 대상 소실. 앞에 물체 1 — 분류: 가전제품(폐기 대상). 다음."
      - say:
          char: 윤재.scared
          motion: gasp
          with: [로봇]
          text: "…쟤 너를 못 보는 거야? 바로 앞에 서 있는데?"
      - move: { id: 드론, toward: camera, style: retreat }
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "못 봄. 그리고 방금 나 쓰레기라고 함. 둘 다 처리 중."
      - goto: b3_promise

  b3_promise:
    actions:
      - bg: { id: shelter, transition: fade, duration: 700 }
      - music: chip_home
      - place: "그날 밤 · 편의점 기지, 촛불 하나"
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "배터리 칸 그만 세. 그거 세 번째야. 센다고 안 늘어."
      - say:
          char: 로봇
          with: [윤재]
          text: "질문. 저 드론들 조종하는 큰 거. 어디 있어?"
      - say:
          char: 윤재
          with: [로봇]
          text: "북쪽 데이터센터. 코어 본체가 거기 있어. 서버 덩어리. 첫날 피난 가던 아저씨들이 그랬어. 본체를 리셋하면 미친 기계들이 전부 멈춘다고."
      - say:
          char: 윤재
          with: [로봇]
          text: "그거 하겠다고 북쪽으로 간 사람들도 있었어. 아무도 안 돌아왔어. 코어는 사람이랑 똑똑한 칩부터 잡거든. 아마 문턱 넘는 순간."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "사람은. 나는 가전제품(폐기 대상)."
      - say:
          char: 윤재
          with: [로봇]
          text: "그 말 마음에 들었냐? 계속 쓰네."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "분위기 무거움 감지. 아까 네가 셔터에 한 거 실행. 똑똑."
      - say:
          char: 윤재
          with: [로봇]
          text: "…누구세요."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "……"
      - say:
          char: 로봇.glitch
          motion: freeze
          with: [윤재]
          text: "……까먹었어."
      - emote: { id: 윤재, motion: laugh, repeat: 2 }
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "푸흡— 아 뭐야, 아 진짜 뭐야. 문 두드려 놓고 용건을 까먹는 게 어딨어."
      - set: { m_joke: true }
      - emote: { id: 로봇, motion: bounce, repeat: 2 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "웃음 감지! 이거 농담이었구나. 대성공. 저장. …근데 펀치라인이 뭔지는 아직 모름."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          channel: thought
          with: []
          text: "그날 이후 처음 웃었다. 그것도 고물한테 졌다. 1패."
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇
          with: [윤재]
          text: "내가 혼자 갈게. 거기. 코어 감시 목록엔 똑똑한 거랑 사람만 있음. 나는 둘 다 아니니까."
      - say:
          channel: thought
          with: []
          text: "혼자 가겠다는 말. 그 말 하고 나간 사람이 우리 집에 하나 있었다."
      - move: { id: 로봇, toward: 윤재, style: approach }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "이거 맞아? 설명서 11쪽, 2P 안내 그림. 둘이 이러고 있었음. 뭐 하는 건지는 안 적혀 있음. 중요한 거 정할 때 하는 거 같아서."
      - choice:
          key: b3_promise
          prompt: "\"새끼손가락 대기 중. 위이잉 소리는 모터임. 떨림 아님.\""
          char: 로봇
          motion: tremble
          options:
            - text: "손가락을 건다. \"혼자는 무슨. 끝까지 2P로 가.\""
              add: { bond: 1 }
              set: { m_promise: true }
              goto: b3_pinky
            - text: "\"…자. 내일 얘기해.\" 촛불을 분다"
              goto: b3_think

  b3_pinky:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "어기면 바늘 천 개 삼키는 거다."
      - say:
          char: 로봇.thinking
          motion: nod
          with: [윤재]
          text: "바늘 천 개. 재고 확인… 0개. 그럼 어길 수가 없음. 완벽한 약속."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "그런 뜻 아니거든."
      - say:
          char: 로봇.happy
          motion: bow
          with: [윤재]
          text: "끝까지 2P. 전원 꺼져도 유효. 이건 설명서보다 위에 적어 둘게."
      - goto: /4.yaml

  b3_think:
    actions:
      - effect: { name: darken, wait: true }
      - move: { id: 로봇, style: reset }
      - say:
          char: 로봇
          motion: droop
          with: [윤재]
          text: "내일. 메모함. …내일 할 일 칸이 점점 길어진다."
      - goto: /4.yaml
