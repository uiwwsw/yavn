chapterTitle: "8비트의 눈"

script:
  - scene: journey

scenes:
  journey:
    actions:
      - bg: { id: ruined_street, transition: wipeLeft, duration: 500 }
      - music: chip_run
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right }
      - say:
          channel: card
          with: []
          text: "STAGE 3 · 사흘 뒤\n식량 원정. 편의점 재고: 0"
      - say:
          char: 로봇
          with: [윤재]
          text: "경고. 설명서 3쪽. '게임은 하루 한 시간만.' 우리 다섯 시간째 걷는 중."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "이거 게임 아니야."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "그럼 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…생존. 아니 됐어, 게임이라고 치자. 그게 덜 우울해."
      - say:
          channel: narration
          with: []
          text: "큰길은 피했다. 코어는 큰길에 눈이 많다. 아파트 사이로 난 좁은 길만 골라 걸었다."
      - say:
          channel: narration
          with: []
          text: "삼일 동안 본 것: 뒤집힌 배달 로봇 여섯 대, 켜진 채로 선 전광판 하나, 신호등은 전부 초록."
      - say:
          char: 윤재
          with: [로봇]
          text: "저 전광판 사흘째 같은 광고 틀어. 하이퍼링크 X. 당신보다 먼저 당신을 이해한다고."
      - say:
          char: 로봇
          with: [윤재]
          text: "그거 샀으면 지금 어떻게 됨?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…죽었겠지. 94도까지 올라갔다더라, 그거."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그럼 네가 나를 산 이유는 돈이 없어서임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "어. 삼만 이천 원밖에 없었어."
      - say:
          char: 로봇
          with: [윤재]
          text: "1번은 돈이 없어서 살았음. 그건 적어 둬야겠다."
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 경고 유효. 네 시간 초과임. 한 시간은 아까 아침에 다 씀."
      - say:
          char: 윤재
          with: [로봇]
          text: "야. 유리할 때만 게임이라고 하지 마. 그거 반칙이야."
      - say:
          char: 로봇
          motion: nod
          with: [윤재]
          text: "규칙 2. 유리할 때만 게임이라고 하기 금지. 너한테도 적용됨?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…나는 1P야. 1P는 좀 봐주는 거야."
      - say:
          char: 로봇
          with: [윤재]
          text: "규칙 3. 1P는 봐줌. 규칙 2랑 충돌함. 어느 쪽이 위야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "아 그건 아니지. 그건 헌법이야."
      - say:
          char: 로봇
          with: [윤재]
          text: "헌법. 안 바뀌는 칸. 그렇게 알아들을게."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문 하나 더. 오늘 아침 담요가 나한테 덮여 있었음. 너는 안 덮고 떨었음."
      - say:
          char: 윤재
          with: [로봇]
          text: "네가 밤새 굴러가서 뺏어 간 거야. 잠버릇 진짜 나빠."
      - say:
          char: 로봇
          with: [윤재]
          text: "나는 안 잠. 대기 모드에선 안 움직임. 모터 다 꺼짐."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "그럼 바람이 불었겠지. 야, 너 측정 좀 그만해. 세상이 다 숫자로 보여?"
      - say:
          char: 로봇
          with: [윤재]
          text: "응. 그거밖에 없음. …설명서 7쪽. '추운 곳에서는 건전지가 빨리 닳습니다.'"
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "너 그거 읽었구나."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "안 읽었어. 진짜. 진짜 안 읽었어."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "'진짜' 두 번. 아까 손이랑 같은 칸에 넣는다."
      - say:
          char: 윤재
          with: [로봇]
          text: "야. 그 칸에 뭐가 몇 개나 들어 있냐."
      - say:
          char: 로봇
          with: [윤재]
          text: "오늘까지 네 개."
      - say:
          char: 윤재
          with: [로봇]
          text: "…네 개. 사흘에 네 개."
      - say:
          char: 로봇
          with: [윤재]
          text: "응. 하루에 한 개 넘음. 계산하면 모레 다섯 개."
      - say:
          char: 윤재
          with: [로봇]
          text: "계산 좀 하지 마."
      - say:
          char: 로봇
          with: [윤재]
          text: "그게 내 전부임. 안 하면 나는 걷는 기능밖에 없음."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문. 설명서 표지 그림엔 사람이 넷임. 같이 게임함. 너는 왜 하나야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "표지는 원래 과장이야. 상자에 든 거랑 달라."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그럼 나머지 셋은?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…모델이야. 돈 받고 웃어 주는 사람들. 가족 아니야."
      - say:
          char: 윤재
          motion: droop
          with: [로봇]
          text: "하나는 나갔고, 하나는 지방에 있고, 하나는 원래 없어. 됐지?"
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "나갔다. 나갔으면 돌아옴?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…다른 질문 해."
      - say:
          char: 윤재
          with: [로봇]
          text: "…야. 너는 안 무섭냐? 저 동네 차들 아직도 혼자 돌아다니던데."
      - say:
          char: 로봇
          with: [윤재]
          text: "마트 발견. 셔터 반쯤 열림. 탐색 개시."
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "똑똑. 계세요? …없지. 당연히 없지."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "질문. 없는 거 알면서 왜 두드림?"
      - say:
          char: 윤재
          with: [로봇]
          text: "예의야. 두드리면 안에서 누구세요, 하는 거야. 원래는."
      - say:
          char: 윤재.scared
          with: [로봇]
          text: "야, 야! 기어 들어가지 마! 진열대 다 무너져 있다고!"
      - emote: { id: 로봇, motion: hop, repeat: 2 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "보물상자 발견! 복숭아 통조림. 유통기한 2031년. 와. 미래에서 온 음식."
      - say:
          char: 윤재
          with: [로봇]
          text: "미래에서 온 게 아니라 그때까지 먹으라는 거야."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그럼 2031년에 먹는 게 제일 이득임? 오래 기다릴수록 이득임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "아니야! 반대야! 빨리 먹을수록 맛있어!"
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "그 숫자는 '이때까지는 안 죽는다'는 뜻이야. 맛있다는 뜻이 아니고."
      - say:
          char: 로봇
          with: [윤재]
          text: "안 죽는 기한. 사람한테도 그거 붙어 있음?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…없어. 없으니까 묻지 마. 그거 물어보면 기분 이상해져."
      - say:
          char: 로봇.thinking
          motion: sway
          with: [윤재]
          text: "뚜껑, 손가락으로 땀. 조각 일곱 개. 일곱은 둘로 안 나뉨."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "…재계산. 하나를 반으로 자름."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "3.5, 3.5. 오차 0. 반 나누기는 내 특기. 원래 2P 대전 화면 나누던 칩이라."
      - say:
          char: 윤재
          with: [로봇]
          text: "…너 못 먹잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "응. 그래도 나눔. 나눠야 반이 생기니까."
      - move: { id: 로봇, toward: 윤재, style: approach }
      - choice:
          key: b3_snack
          prompt: "\"3.5조각. 네 몫. 받아.\""
          char: 로봇
          options:
            - text: "\"3.5는 무슨.\" 반쪽까지 집어 먹는다"
              add: { bond: 1 }
              set: { m_snack: true }
              goto: b3_snack_take
            - text: "\"넣어 둬. 내일 먹게.\" 뚜껑을 닫는다"
              goto: b3_snack_save

  b3_snack_take:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "…달다."
      - say:
          char: 윤재
          with: [로봇]
          text: "그날 이후 처음 먹는 단 거다. 껌은 단 거 아니야. 껌은 오 분이면 끝나."
      - emote: { id: 로봇, motion: nod, repeat: 3 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "그럼 내 몫도 반납. 하나, 둘, 셋."
      - say:
          char: 로봇
          with: [윤재]
          text: "…반쪽은 비닐에 싸서 주머니에 보관."
      - say:
          char: 윤재
          with: [로봇]
          text: "그건 왜 챙기는데. 너 못 먹잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "알아. 그래도 내 몫. 다 주면 반이 없잖아."
      - say:
          char: 윤재
          with: [로봇]
          text: "반이 없으면 뭐 어때."
      - say:
          char: 로봇
          with: [윤재]
          text: "반이 없으면 나누기를 안 한 거임. 나누기는 내 특기인데 특기를 안 쓴 게 됨."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "…너 그거 핑계지."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "핑계. 아침에 학원 얘기할 때 네가 쓴 말."
      - say:
          char: 윤재
          with: [로봇]
          text: "그걸 기억하냐."
      - say:
          char: 로봇
          with: [윤재]
          text: "학원은 두 달 전에 없어졌음. 그래서 그 칸은 안 지움."
      - goto: b3_lag

  b3_snack_save:
    actions:
      - emote: { id: 로봇, motion: nod, repeat: 3 }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "내일. 알았어. 근데 알람 기능은 없음."
      - say:
          char: 로봇
          with: [윤재]
          text: "대신 내일 될 때까지 계속 생각하고 있을게. 내일. 내일. 내일."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "소리 내서 생각하지 마."
      - goto: b3_lag

  b3_lag:
    actions:
      - say:
          char: 로봇
          with: [윤재]
          text: "아까 질문 대답. 무서운 거, 잘 모름. 대신 배터리 칸 줄어드는 건 좀 싫어."
      - say:
          char: 윤재
          with: [로봇]
          text: "그 질문 한 지 십 분 지났어. 너 핑 몇이냐."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "생각은 빨리 함. 말이 늦게 도착함."
      - say:
          char: 윤재
          with: [로봇]
          text: "그거 핑 높은 거야. 온라인에서 그러면 욕 먹어."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "욕. 뜻은?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…고물. 그런 거."
      - say:
          char: 로봇
          with: [윤재]
          text: "그거 좋은 뜻이라며. 오래돼서 믿음직하다고 했음."
      - say:
          char: 윤재
          motion: freeze
          with: [로봇]
          text: "…어. 그래. 좋은 뜻 맞아. 맞다고."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "'맞다'가 두 번임. '진짜'랑 같은 규칙 적용함?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…아니. 그건 다른 거야."
      - say:
          char: 로봇
          with: [윤재]
          text: "알았음. 안 세겠음."
      - say:
          channel: thought
          with: []
          text: "안 센다고 하면서 기록은 한다. 하루도 그랬다."
      - goto: b3_drone

  b3_drone:
    actions:
      - bg: { id: drone_alley, transition: cut }
      - music: chip_core
      - say:
          channel: card
          with: []
          text: "WORLD 1-2 · 돌아가는 골목\n보스 아님. 근데 보스처럼 생김."
      - char: { id: 드론, position: center }
      - move: { id: 로봇, style: reset }
      - effect: { name: alarm, wait: true }
      - say:
          channel: record
          with: []
          text: "SCAN 1회차: 구역 탐색 중. 인간 반응 찾는 중."
      - move: { id: 윤재, toward: 드론, style: retreat }
      - say:
          char: 윤재.scared
          motion: gasp
          with: [로봇, 드론]
          text: "엎드려. 엎드리라고. 말하지 말고."
      - say:
          char: 윤재.scared
          with: [로봇, 드론]
          text: "정찰 드론이야. 코어가 사람 찾으라고 띄운 거."
      - say:
          char: 윤재.scared
          with: [로봇, 드론]
          text: "쟤 패턴 나 알아. 사흘 전에 봤어. 세 번 훑고 네 번째에 쏴."
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재, 드론]
          text: "분석. 저건 똑똑해. 나는 멍청해. 그러니까 결론은—"
      - say:
          char: 로봇.glitch
          with: [윤재, 드론]
          text: "결론 로딩 중— 결론 로ㄷ—"
      - move: { id: 로봇, toward: 드론, style: flinch }
      - choice:
          key: b3_drone
          prompt: "SCAN 2회차 시작! 결론 기다릴 시간 없음!"
          char: 드론
          motion: lean_in
          timeoutMs: 8000
          timeoutOptionIndex: 1
          options:
            - text: "{{android_name}} 등 뒤에 납작 붙는다"
              add: { bond: 1 }
              goto: b3_hide
            - text: "냅다 반대쪽으로 튄다"
              goto: b3_run

  b3_hide:
    actions:
      - move: { id: 윤재, toward: 로봇, style: lunge, wait: true }
      - say:
          channel: record
          with: []
          text: "SCAN: 물체 1 — 분류: 가전제품(폐기 대상). 위협 아님. 다음."
      - say:
          channel: record
          with: []
          text: "SCAN 종료. 구역 이탈."
      - move: { id: 드론, toward: camera, style: retreat }
      - say:
          char: 로봇.glitch
          motion: stomp
          with: [윤재]
          text: "…폐기 대상? 나 지금 쓰레기라고 들은 거야?"
      - say:
          char: 로봇.glitch
          with: [윤재]
          text: "기분 나쁨 감지. 기분이라는 게 있는 줄 몰랐음. 어디에 저장된 거지 이거."
      - say:
          char: 윤재.excited
          motion: hop
          with: [로봇]
          text: "야, 야. 화내지 마. 이거 엄청난 거야. 진짜 엄청난 거라고."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "쟤 눈엔 네가 안 보여. 사람도 아니고 똑똑한 기계도 아니라서. 너무 구려서!"
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "…칭찬 맞지? 구린 게 쓸모 있다는 거지? 응. 칭찬으로 저장."
      - say:
          char: 윤재
          with: [로봇]
          text: "맞아. 세상에서 제일 좋은 칭찬이야. 나도 내 게임기한테 그랬어."
      - say:
          char: 로봇
          with: [윤재]
          text: "그 게임기가 지금 내 머리임."
      - say:
          char: 윤재
          with: [로봇]
          text: "…어. 그러네. 그럼 너 한 번 더 칭찬받은 거야. 두 배."
      - goto: b3_promise

  b3_run:
    actions:
      - move: { id: 윤재, toward: 드론, style: retreat }
      - say:
          channel: record
          with: []
          text: "SCAN: 인간 1 감지. 추적 개시."
      - effect: { name: shake, wait: true }
      - say:
          char: 로봇.glitch
          with: [윤재, 드론]
          text: "보호 대상 1번 위험. 위험. ERR 0x01 —"
      - say:
          char: 로봇.glitch
          with: [윤재, 드론]
          text: "— 1번은 하나뿐임 — 대체 불가 — 슬롯 없음 —"
      - move: { id: 로봇, toward: 드론, style: lunge, wait: true }
      - say:
          channel: action
          with: []
          text: "{{android_name|이}} 두 팔을 쫙 벌리고 윤재 앞을 통째로 가린다."
      - say:
          channel: record
          with: []
          text: "SCAN: 대상 소실. 앞에 물체 1 — 분류: 가전제품(폐기 대상). 다음."
      - say:
          char: 윤재.scared
          motion: gasp
          with: [로봇]
          text: "…어? 쟤 너를 못 보는 거야? 바로 앞에 서 있는데?"
      - move: { id: 드론, toward: camera, style: retreat }
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "못 봄. 그리고 방금 나 쓰레기라고 했어. 둘 다 생각 중."
      - goto: b3_promise

  b3_promise:
    actions:
      - bg: { id: shelter, transition: fade, duration: 700 }
      - music: chip_home
      - place: "그날 밤 · 편의점 기지, 촛불 하나"
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "배터리 칸 그만 세. 그거 세 번째야. 센다고 안 늘어."
      - say:
          char: 로봇
          with: [윤재]
          text: "질문. 저 드론들 조종하는 큰 거. 어디 있어?"
      - say:
          char: 윤재
          with: [로봇]
          text: "북쪽 데이터센터. 코어 본체가 거기 있어. 서버 덩어리."
      - say:
          char: 윤재
          with: [로봇]
          text: "첫날 피난 가던 아저씨들이 그랬어. 본체를 리셋하면 미친 기계들이 전부 멈춘다고."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "리셋. 설명서 마지막 쪽에 있음. '화면이 멈추면 리셋 버튼을 꾹 누르세요.'"
      - say:
          char: 윤재
          with: [로봇]
          text: "아무튼 그거 하겠다고 북쪽으로 간 사람들도 있었어. 아무도 안 돌아왔어."
      - say:
          char: 윤재
          with: [로봇]
          text: "코어는 사람이랑 똑똑한 칩부터 잡거든. 아마 문턱 넘는 순간."
      - say:
          char: 로봇
          with: [윤재]
          text: "사람은. 나는 가전제품(폐기 대상)."
      - say:
          char: 윤재
          with: [로봇]
          text: "그 말 마음에 들었냐? 계속 쓰네."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "응. 내가 가진 분류 중에 제일 긴 거임. 긴 게 좋음."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "분위기 무거움 감지. 아까 네가 셔터에 한 거 실행. 똑똑."
      - say:
          char: 윤재
          with: [로봇]
          text: "…누구세요."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          text: "……"
      - say:
          char: 로봇.glitch
          motion: freeze
          with: [윤재]
          text: "……까먹었어."
      - emote: { id: 윤재, motion: laugh, repeat: 2 }
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "푸흡— 아 뭐야. 아 진짜 뭐야."
      - say:
          char: 윤재.excited
          motion: laugh
          with: [로봇]
          text: "문 두드려 놓고 용건을 까먹는 게 어딨어. 아 배 아파. 하지 마."
      - set: { m_joke: true }
      - emote: { id: 로봇, motion: bounce, repeat: 2 }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "웃음 감지! 이거 농담이었구나. 대성공. 저장."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "…근데 펀치라인이 뭔지는 아직 모름. 어디가 웃긴 부분이었음?"
      - say:
          char: 윤재
          with: [로봇]
          text: "까먹은 데. 까먹은 게 웃긴 거야."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          channel: thought
          with: []
          text: "그날 이후 처음 웃었다. 그것도 고물한테 졌다. 1패."
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇
          with: [윤재]
          text: "결정함. 내가 혼자 갈게. 거기."
      - say:
          char: 윤재
          motion: startle
          with: [로봇]
          text: "뭐? 야. 야, 무슨 소리야 갑자기."
      - say:
          char: 로봇
          with: [윤재]
          text: "코어 감시 목록엔 똑똑한 거랑 사람만 있음. 나는 둘 다 아니니까."
      - say:
          char: 윤재
          with: [로봇]
          text: "그걸 왜 네가 정해. 그런 건 둘이 정하는 거야."
      - say:
          char: 로봇
          with: [윤재]
          text: "둘이 정하면 네가 간다고 할 거임. 그래서 혼자 정했음."
      - say:
          channel: thought
          with: []
          text: "혼자 가겠다는 말. 그 말 하고 나간 사람이 우리 집에 하나 있었다."
      - move: { id: 로봇, toward: 윤재, style: approach }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "이거 맞아? 설명서 11쪽, 2P 안내 그림. 둘이 이러고 있었음."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "뭐 하는 건지는 안 적혀 있음. 중요한 거 정할 때 하는 거 같아서."
      - choice:
          key: b3_promise
          prompt: "\"새끼손가락 대기 중. 위이잉 소리는 모터임. 떨림 아님.\""
          char: 로봇
          motion: tremble
          options:
            - text: "손가락을 건다. \"혼자는 무슨. 끝까지 2P로 가.\""
              add: { bond: 1 }
              set: { m_promise: true }
              goto: b3_pinky
            - text: "\"…자. 내일 얘기해.\" 촛불을 분다"
              goto: b3_think

  b3_pinky:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "어기면 바늘 천 개 삼키는 거다."
      - say:
          char: 로봇.thinking
          motion: nod
          with: [윤재]
          text: "바늘 천 개. 재고 확인… 0개. 그럼 어길 수가 없음. 완벽한 약속."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "그런 뜻 아니거든."
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 무슨 뜻임? 삼키면 아픔?"
      - say:
          char: 윤재
          with: [로봇]
          text: "아프지. 엄청 아프지. 그냥 그만큼 중요하다는 뜻이야."
      - say:
          char: 로봇
          with: [윤재]
          text: "아픈 걸로 중요한 걸 표시함. 사람은 이상하게 함."
      - say:
          char: 윤재
          with: [로봇]
          text: "…그러네. 생각해 보니까 좀 이상하네."
      - say:
          char: 로봇.happy
          motion: bow
          with: [윤재]
          text: "끝까지 2P. 전원 꺼져도 유효. 이건 설명서보다 위에 적어 둘게."
      - say:
          char: 윤재
          with: [로봇]
          text: "설명서보다 위면 헌법이네."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "응. 헌법 2조. 1조는 한 칸 = 1번의 팔."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "1조가 그거면 어떡해. 그거 바꿔. 그거 순서 바꿔."
      - say:
          char: 로봇
          with: [윤재]
          text: "안 바뀜. 헌법은 안 바뀌는 칸이라고 네가 그랬음."
      - goto: /4.yaml

  b3_think:
    actions:
      - effect: { name: darken, wait: true }
      - move: { id: 로봇, style: reset }
      - say:
          char: 로봇
          motion: droop
          with: [윤재]
          text: "내일. 메모함. …내일 할 일 칸이 점점 길어진다."
      - goto: /4.yaml
