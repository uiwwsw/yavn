languages: [ko]
summary: "도시의 기계들이 일제히 멋대로 움직인다. 침입자들이 한 층씩 올라오는 밤, 윤재는 다용도실에 서 있던 엄마의 안드로이드에 중고 게임기 칩을 꽂는다. 몸은 크고 머리는 8KB. 둘은 코어가 있는 서울역까지 걷는다. 5장, 결말 4종."
