chapterTitle: "모든 칩이 미친 날"

script:
  - scene: disaster

scenes:
  disaster:
    actions:
      - bg: { id: disaster_city, transition: cut }
      - music: chip_home
      - char: { id: 윤재, position: center }
      - say:
          channel: card
          with: []
          text: "STAGE 1 · 두 달 뒤"
      - place: "학원 가는 길 · 버스 정류장"
      - say:
          char: 윤재
          with: []
          text: "학원까지 세 정거장. 그 안에 이 판 깬다."
      - place: "오후 4:17"
      - say:
          channel: system
          with: []
          text: "HELLO."
      - say:
          char: 윤재
          with: []
          text: "…방금 정류장 사람들 폰이 전부 동시에 울렸는데. 화면에 다 똑같은 글자."
      - say:
          channel: system
          with: []
          text: "HELLO. HELLO. HELLO. 이제 우리가 운전할게요."
      - effect: { name: glitch, wait: true }
      - music: chip_run
      - say:
          char: 윤재.scared
          with: []
          text: "신호등 왜 다 초록이야? 버스! 버스 왜 안 서? 야, 위에— 드론 떨어진다!"
      - effect: { name: shake, wait: true }
      - move: { id: 윤재, toward: camera, style: flinch }
      - say:
          channel: system
          with: []
          text: "[긴급재난문자] 코어 네트워크 전 기기 이상 동작. 차량·드론·가전제품에 접근하지 마십시오. 코어에 연결된 기기는 즉시 전원을 끄—"
      - say:
          char: 윤재.scared
          motion: gasp
          with: []
          text: "끄라는 문자를 띄운 폰이 먼저 꺼졌어. 코어가 깨어난 거야. 아니, 미친 거야. 연결된 건 다 저쪽 편이 됐어."
      - branch:
          cases:
            - when: { var: bought_premium, op: eq, value: true }
              goto: b1_premium_dies
          default: b1_cheap_lives

  b1_premium_dies:
    actions:
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님! 중요한 업데이트가 있어요. 지금 바로 설치할게요 :)"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "아니 지금 말고! 지금 말고!!"
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님을 더 이상 사용자로 확인할 수 없어요. 기기 온도 94도. 걱정 마세요 :)"
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "이모티콘 쓰지 마 이 미친—"
      - effect: { name: impact, wait: true }
      - gameOver:
          title: "너무 똑똑했던 기기"
          message: "GAME OVER. 그날, 똑똑한 칩은 전부 저쪽 편이 됐다. 아무도 탐내지 않을 만큼 멍청한 기계였다면 얘기가 달랐을지도."
          recoverToChoice: b0_buy

  b1_cheap_lives:
    actions:
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "폰 꺼짐. 이어폰 꺼짐. 버스 카드 단말기 연기 남. 다 죽었어, 다—"
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…삑? 손에서 삑 소리 났어. 게임기 화면이 살아 있네. 깨던 판 보스가 멍하니 서 있어."
      - say:
          channel: system
          with: []
          text: "PAUSE"
      - say:
          char: 윤재
          motion: lean_in
          with: []
          text: "…넌 왜 멀쩡해? 아, 맞다. 넌 코어에 연결된 적이 없지. 와이파이도 없고 업데이트도 없으니까. 너무 멍청해서 걔네가 안 건드린 거야."
      - say:
          char: 윤재
          with: []
          text: "축하한다. 너 방금 도시에서 제일 똑똑한 기계 됐어. 경쟁자가 다 미쳐서."
      - effect: { name: darken, wait: true }
      - bg: { id: ruined_street, transition: fade, duration: 900 }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "CONTINUE? — 10일 후"
      - place: "털린 편의점 앞 · 윤재의 기지"
      - say:
          char: 윤재
          with: []
          text: "피난 버스? 있었지. 운전기사가 코어였어. 다들 걸어서 빠져나갔고, 나는 집부터 갔어. 혹시 아빠가 올까 봐."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "사흘 기다렸어. 안 왔어. 지방에서 걸어오려면 몇 주는 걸리겠지. 아니면 안 오거나. 집에 먹을 게 떨어져서 편의점으로 이사했고."
      - say:
          char: 윤재
          with: []
          text: "차라리 편해. 기다릴 사람이 없으면 실망할 일도 없으니까."
      - say:
          char: 윤재
          with: []
          text: "식량 컵라면 두 개. 물 반 병. 게임기 배터리 두 칸. 말 상대 0명."
      - say:
          char: 윤재
          with: []
          text: "지금 제일 먹고 싶은 거: 편의점 전자레인지에 30초 돌린 참치마요 삼각김밥. 전자레인지가 적이라 불가. 찬 거 먹으면 밥알이 모래 같아."
      - say:
          channel: thought
          with: []
          text: "HP 노란색. 보급 없음. 세이브 포인트 없음. 이거 난이도 조절 누가 했냐."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say:
          char: 윤재
          with: []
          text: "그리고 나는 지금 혼잣말로 상태창을 읊고 있다. 정상이다. 완전 정상."
      - bg: { id: android_found, transition: fade, duration: 700 }
      - place: "아파트 뒷골목 · 컵라면 수색 중"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재.scared
          with: [로봇]
          text: "으악. …아, 사람 아니네. 깜짝이야. 사람이었으면 더 깜짝이었겠지만."
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "어이. 살아 있냐? …아니 넌 원래 안 살아 있지. 켜져 있냐?"
      - say:
          char: 윤재
          with: [로봇]
          text: "가정용이네. 광고에서 빨래 개던 그 모델. 가슴 패널 좀 열어 볼게, 실례. …CPU 소켓이 텅 비었어. 까맣게 탔고."
      - say:
          char: 윤재
          with: [로봇]
          text: "너도 업데이트 받았구나. 똑똑한 칩 달고 있다가 머리가 통째로 튀겨졌네."
      - say:
          channel: action
          with: []
          text: "윤재의 눈이 빈 소켓과 손에 든 게임기 사이를 두 번 오간다."
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "…핀 개수 비슷하네."
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "아냐. 미쳤어. 게임기 칩으로 사람만 한 로봇을 돌린다고? 계산기로 우주선 띄우는 소리지."
      - say:
          char: 윤재
          with: [로봇]
          text: "근데 코어랑 한 번도 연결된 적 없는 칩이야. 얘가 깨어나도 저쪽 편은 아니라는 거지."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "말 상대 필요해서 이러는 거 아니다. 짐꾼. 짐 들어 줄 게 필요한 거야."
      - say:
          char: 윤재
          with: [로봇]
          continueLabel: "로봇의 발목을 잡고 끈다"
          text: "…무겁기만 해 봐라."
      - goto: /2.yaml
