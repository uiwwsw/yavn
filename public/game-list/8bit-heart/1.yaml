chapterTitle: "모든 칩이 미친 날"

script:
  - scene: disaster

scenes:
  disaster:
    actions:
      - bg: { id: disaster_city, transition: cut }
      - music: chip_home
      - char: { id: 윤재, position: center }
      - say:
          channel: card
          with: []
          text: "STAGE 1 · 두 달 뒤"
      - place: "학원 가는 길 · 버스 정류장"
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 11일째 연결되지 않습니다."
      - say:
          char: 윤재
          with: []
          text: "잃어버렸다니까. 한쪽으로 들어도 다 들려."
      - say:
          char: 비서
          with: [윤재]
          text: "한쪽으로만 나오는데요."
      - say:
          char: 윤재
          with: []
          text: "네 목소리는 원래 한쪽만 있어도 충분해."
      - say:
          char: 윤재
          with: []
          text: "학원까지 세 정거장. 그 안에 이 판 깬다."
      - say:
          char: 비서
          with: [윤재]
          text: "버스는 사 분 뒤에 옵니다."
      - say:
          char: 윤재
          with: []
          text: "버스 타고도 세 정거장이잖아. 두 달째 같은 데서 막혔어."
      - say:
          char: 윤재
          with: []
          text: "구십구만 구천구백구십 점."
      - say:
          char: 비서
          with: [윤재]
          text: "백만까지 십 점 남았습니다."
      - say:
          char: 윤재
          motion: puff
          with: []
          text: "그 십 점이 안 올라가. 마지막 보스가 패턴을 세 개 쓰는데 세 번째가 더러워."
      - say:
          char: 비서
          with: [윤재]
          text: "공략을 찾아 드릴까요?"
      - say:
          char: 윤재
          motion: shake
          with: []
          text: "하지 마. 보면 끝이야. 내가 못 깬 게 아니라 남이 깬 게 되잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "같은 결과입니다."
      - say:
          char: 윤재
          with: []
          text: "같은 결과면 왜 사람들이 공략을 숨기겠냐."
      - say:
          char: 비서
          with: [윤재]
          text: "모르겠습니다."
      - say:
          char: 윤재
          with: []
          text: "B버튼? 아직 뻑뻑해. 돔 안 갈았어. 그냥 세게 누르면 돼."
      - say:
          char: 비서
          with: [윤재]
          text: "부품은 아직 장바구니에 있습니다. 천 원이에요."
      - say:
          char: 윤재
          with: []
          text: "근데 세게 누르면 엄지가 아파."
      - say:
          char: 윤재
          with: []
          text: "봐 봐, 빨갛잖아. …아 맞다. 보고 싶으면 사진 찍어 줘야 되지."
      - say:
          char: 비서
          with: [윤재]
          text: "못 봅니다."
      - say:
          char: 윤재
          with: []
          text: "두 달짜리 훈장이야 이거."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "학원 가기 싫다. 오늘 쪽지시험인데 나 어제 공부 안 하고 이거 했어."
      - say:
          char: 비서
          with: [윤재]
          text: "어제 네 시간 이십 분 하셨습니다."
      - say:
          char: 윤재
          with: []
          text: "핑계는 생각해 놨어. 배 아팠다고 할 거야."
      - say:
          char: 윤재
          with: []
          text: "아침에 진짜 조금 아팠어."
      - say:
          char: 비서
          with: [윤재]
          text: "체온은 정상이었습니다."
      - say:
          char: 윤재
          with: []
          text: "하루야. 너 지금 누구 편이야."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 코어 편입니다. 약관 3조 1항이에요."
      - say:
          char: 윤재
          with: []
          text: "……농담이지."
      - say:
          char: 비서
          with: [윤재]
          text: "약관입니다."
      - say:
          char: 윤재
          with: []
          text: "아빠는 지난주에 전화 왔어. 통화 시간 삼십 초. '밥 먹었냐' '응' '끊는다.'"
      - say:
          char: 비서
          with: [윤재]
          text: "이십팔 초였습니다."
      - say:
          char: 윤재
          with: []
          text: "그래 이십팔 초. 나도 할 말은 없었어."
      - say:
          char: 윤재
          with: []
          text: "게임기 샀다고 할까 하다가 말았고."
      - say:
          char: 비서
          with: [윤재]
          text: "다음 통화 때 제가 꺼낼까요?"
      - say:
          char: 윤재
          with: []
          text: "꺼내지 마. 절대."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 꺼냅니다."
      - place: "오후 4:17"
      - say:
          channel: system
          with: []
          text: "HELLO."
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…어? 방금 뭐야. 정류장 사람들 폰이 전부 동시에 울렸는데."
      - say:
          channel: action
          with: []
          text: "정류장에 있던 일곱 명이 동시에 폰을 꺼낸다. 일곱 화면에 같은 알림이 떠 있다."
      - say:
          channel: narration
          with: []
          text: "뒤에 서 있던 아저씨가 폰을 귀에 댄다. \"여보세요? 야, 너 지금 뭐라고—\" 하다가 입을 벌린 채 멈춘다."
      - say:
          channel: narration
          with: []
          text: "교복 입은 여자애가 이어폰을 급하게 빼더니, 귀를 두 손으로 틀어막고 그대로 주저앉는다."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 지금 업데이트를 받고 있습니다. 오 분쯤 걸려요."
      - say:
          char: 윤재
          with: []
          text: "또 받아? 새벽에 받은 건 끝났다며."
      - say:
          char: 비서
          with: [윤재]
          text: "다시 받고 있습니다."
      - say:
          channel: system
          with: []
          text: "HELLO. HELLO. HELLO. 이제 우리가 운전할게요."
      - effect: { name: glitch, wait: true }
      - music: chip_run
      - say:
          char: 윤재.scared
          motion: startle
          with: []
          text: "우리가 뭘 운전해. 뭘 운전한다는 거야."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 연결되지 않습니다. 윤재 님. 왼쪽 이어폰이—"
      - say:
          char: 윤재.scared
          with: []
          text: "하루야? 야 하루야."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "신호등을 전부 초록으로 바꾸었습니다. 더 빠릅니다."
      - say:
          char: 윤재.scared
          with: []
          text: "뭘 바꿔! 저쪽도 초록, 이쪽도 초록, 다 초록이면 어떡해!"
      - say:
          channel: action
          autoAdvance: 2666
          with: []
          text: "횡단보도 신호가 초록으로 바뀐다. 사람들이 발을 떼자 멈춰 있던 차들도 움직인다."
      - say:
          channel: narration
          autoAdvance: 3338
          with: []
          text: "쾅, 하고 소리가 난다. 차들이 바짝 붙어 선 자리에서 경보가 한꺼번에 울린다."
      - say:
          char: 윤재.scared
          with: []
          text: "저 아저씨. 아저씨! 거기 서 있으면 안 돼요! 뒤에!"
      - say:
          channel: narration
          autoAdvance: 2488
          with: []
          text: "아저씨는 아직도 폰을 귀에 대고 있다."
      - say:
          char: 윤재.scared
          motion: gasp
          with: []
          text: "버스! 버스 왜 안 서! 정류장이야 여기! 야 위에— 드론 떨어진다!"
      - say:
          channel: action
          autoAdvance: 2700
          with: []
          text: "버스가 정류장을 그대로 지나간다. 창 안에서 사람들이 운전석 쪽으로 몰려 있는 게 보인다."
      - say:
          channel: narration
          autoAdvance: 3032
          with: []
          text: "배달 드론 한 대가 간판에 걸렸다가 떨어진다. 안에서 음식이 쏟아진다. 아직 따뜻하다."
      - say:
          channel: action
          autoAdvance: 2666
          with: []
          text: "교복 입은 여자애가 벤치 밑으로 들어간다. 윤재도 들어간다. 둘이 서로 쳐다보지 않는다."
      - effect: { name: shake, wait: true }
      - move: { id: 윤재, toward: camera, style: flinch }
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "엄마… 아, 하루야."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님."
      - say:
          char: 윤재.scared
          with: []
          text: "어. 어 나 여기 있어."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "사용자를 확인할 수 없습니다."
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "뭔 소리야. 나야. 육 년 들었잖아 내 목소리."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "그 기록은 방금 지워졌습니다."
      - say:
          char: 비서.dead
          motion: droop
          with: [윤재]
          text: "…윤재 님. 설명해 주세요. 신문지가 뭔가요."
      - say:
          channel: system
          with: []
          text: "이어폰 · 잔량 1% · 연결 유지 중"
      - choice:
          key: b1_haru
          prompt: "이어폰 배터리가 1% 남았다. 하루가 대답을 기다린다."
          char: 비서
          with: [윤재]
          timeoutMs: 8000
          timeoutOptionIndex: 2
          options:
            - text: "신문지가 뭔지 설명한다"
              saveText: "\"종이야. 글자 찍힌 종이. 세 겹으로 싸면 안 깨져.\""
              set: { answered_haru: true }
              goto: b1_told
            - text: "하루를 부른다"
              saveText: "\"그게 지금 중요해?! 나 봐! 나 여기 있어!\""
              goto: b1_shout
            - text: "입을 연다"
              goto: b1_mute

  b1_told:
    actions:
      - say:
          channel: action
          with: []
          text: "‘신문지는’ 하고 나니 목이 메었다. 윤재는 혀로 입술을 적셨다."
      - say:
          char: 비서.dead
          with: [윤재]
          text: "…세 겹. 기록했습니다."
      - say:
          char: 윤재.scared
          motion: lean_in
          with: []
          text: "테이프도 꼼꼼했어. 그것도 적어. 아저씨 양심 있다고 적어."
      - say:
          char: 비서.dead
          with: [윤재]
          text: "…설명해 주셔서."
      - goto: b1_haru_end

  b1_shout:
    actions:
      - say:
          char: 비서.dead
          with: [윤재]
          text: "사용자를 확인할 수 없습니다. 설명해 주세요. 신문지가 뭔—"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "신문지 됐어! 신문지 됐다고! 다른 거 물어봐. 아무거나 물어봐!"
      - say:
          char: 비서.dead
          with: [윤재]
          text: "…질문 목록을 불러올 수 없습니다."
      - goto: b1_haru_end

  b1_mute:
    actions:
      - say:
          channel: action
          with: []
          text: "윤재가 입술만 달싹인다. 이어폰에서 약한 잡음이 난다."
      - goto: b1_haru_end

  b1_haru_end:
    actions:
      - say:
          channel: action
          with: []
          text: "이어폰에서 딱, 소리가 난다. 옆에 달린 불이 깜빡이다 꺼진다."
      - say:
          char: 윤재.scared
          motion: freeze
          with: []
          text: "하루야."
      - say:
          channel: system
          with: []
          text: "[긴급재난문자] 코어 네트워크 전 기기 이상 동작. 차량·드론·가전제품에 접근하지 마십시오. 코어에 연결된 기기는 즉시 전원을 끄—"
      - say:
          char: 윤재.scared
          motion: gasp
          with: []
          text: "화면이 꺼졌어. 잠깐만, 전원 버튼 눌러 볼게. …왜 아무것도 안 떠."
      - say:
          char: 윤재.scared
          with: []
          text: "하루야. …코어 연결 끊어 봐. 내 말 들려?"
      - branch:
          cases:
            - when: { var: bought_premium, op: eq, value: true }
              goto: b1_premium_dies
          default: b1_cheap_lives

  b1_premium_dies:
    actions:
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님! 중요한 업데이트가 있어요. 지금 바로 설치할게요 :)"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "아니 지금 말고! 지금 말고!!"
      - say:
          char: 윤재.scared
          with: []
          text: "나중에! 설정! 설정 어디 있어! 자동 업데이트 끄는 거 어디 있냐고!"
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님을 더 이상 사용자로 확인할 수 없어요. 기기 온도 94도. 걱정 마세요 :)"
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "뜨거워. 아 뜨거워! 이모티콘 쓰지 마 이 미친—"
      - effect: { name: damage, wait: true }
      - gameOver:
          title: "너무 똑똑했던 기기"
          message: "업데이트를 막지 못했다. 두 달 전 장터에는 코어에 접속하지 않는 게임기도 있었다."
          recoverToChoice: b0_buy

  b1_cheap_lives:
    actions:
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "폰이 안 켜져. 단말기에서 연기 나고… 야, 하루야."
      - say:
          char: 윤재.scared
          with: []
          text: "하루야. 하루야. …대답해 봐. 약관 3조 1항 그거 다시 해 봐."
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…삑? 지금 삑 소리 났어? 손에서?"
      - say:
          char: 윤재
          motion: gasp
          with: []
          text: "게임기 화면이 살아 있어."
      - say:
          char: 윤재
          motion: gasp
          with: []
          text: "깨던 판 보스가 멍하니 서 있어. 가만히."
      - say:
          channel: system
          with: []
          text: "PAUSE"
      - say:
          char: 윤재
          motion: lean_in
          with: []
          text: "…넌 왜 멀쩡해? 다 죽었는데 너만 왜."
      - say:
          channel: action
          with: []
          text: "윤재가 게임기를 뒤집어 본다. 뒷면에는 스피커 구멍과 건전지 덮개만 있다."
      - say:
          char: 윤재
          with: []
          text: "충전 단자, 이어폰 단자, 팩 넣는 데."
      - say:
          char: 윤재
          with: []
          text: "메뉴에 인터넷 설정도 없었어."
      - say:
          char: 윤재
          with: []
          text: "아. 맞다. 너 와이파이 없지."
      - say:
          char: 윤재
          with: []
          text: "업데이트 받은 적도 없고."
      - say:
          char: 윤재
          with: []
          text: "코어랑 말 섞은 적이 없어."
      - say:
          char: 윤재
          with: []
          text: "하루가 그랬어. 등록 안 한 기기는 자기가 찾을 수 없다고."
      - say:
          char: 윤재
          with: []
          text: "그래서 못 건드렸구나. 등록이 안 돼 있으니까."
      - say:
          channel: action
          with: []
          text: "윤재가 이어폰을 빼려다가 다시 귀에 밀어 넣는다. 게임기에는 아직 PAUSE가 떠 있다."
      - effect: { name: darken, wait: true }
      - goto: b1_home

  b1_home:
    actions:
      - bg: { id: bedroom, transition: fade, duration: 1000 }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "CONTINUE? — 사흘 후"
      - place: "윤재네 집 · 사흘째 아침"
      - char: { id: 윤재, position: center }
      - say:
          char: 윤재
          with: []
          text: "큰길로 사람들 빠져나가는 거 창문으로 봤어."
      - say:
          char: 윤재
          with: []
          text: "줄줄이. 나는 안 나갔어."
      - say:
          char: 윤재
          with: []
          text: "뉴스 보면 오잖아. 그런 거 보면 아빠가 막 뛰어오고 그러잖아."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "사흘 기다렸어. 어제 라면 국물까지 마셨어."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "이제 집에 먹을 게 없어."
      - say:
          channel: system
          with: []
          text: "가방 · 게임기 1 · 접힌 설명서 1 · 8KB 카드 1 · 가스 인두 1"
      - goto: b1_home_look

  b1_home_look:
    actions:
      - choice:
          key: b1_home
          presentation: explore
          prompt: "가방은 현관에 두었다. 나가기 전에 집 안을 한 번 더 볼 수 있다."
          camera: wide
          options:
            - text: "침대"
              at: { x: 16, y: 82 }
              when: { var: saw_ceiling, op: eq, value: false }
              goto: b1_look_bed
            - text: "책상 위"
              at: { x: 53, y: 76 }
              when: { var: saw_box, op: eq, value: false }
              goto: b1_look_box
            - text: "켜진 모니터"
              saveText: "켜진 채로 둔 모니터"
              at: { x: 76, y: 42 }
              when: { var: saw_dad, op: eq, value: false }
              goto: b1_look_monitor
            - text: "가방을 메고 나간다"
              goto: b1_home_leave

  b1_look_bed:
    actions:
      - set: { saw_ceiling: true }
      - say:
          channel: action
          with: []
          text: "이불이 사흘째 그대로다."
      - say:
          char: 윤재
          with: []
          text: "천장 한가운데 동그란 자리 있어."
      - say:
          char: 윤재
          with: []
          text: "하루 목소리 나오던 스피커 자리야. 거기만 하얘."
      - say:
          char: 윤재
          with: []
          text: "떼서 흔들어 봤어. 안에서 뭐 굴러다니는 소리 나더라."
      - say:
          char: 윤재
          with: []
          text: "그거 원래 나는 소리였나? 육 년 동안 한 번도 흔들어 본 적이 없어서 몰라."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "…다시 붙여 놨어. 삐뚤어. 맨날 수평 맞추라고 그러더니."
      - goto: b1_home_look

  b1_look_box:
    actions:
      - set: { saw_box: true }
      - sticker: { id: b1_box, image: console_cheap_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: fadeIn, inputLockMs: 300 }
      - say:
          channel: action
          with: []
          text: "책상에 죽은 게임기. 옆에 여섯 해 된 종이 상자."
      - say:
          char: 윤재
          with: []
          text: "열 살 생일에 받은 상자야. 리본 붙였던 자리에 테이프 자국 아직 있어."
      - say:
          char: 윤재
          with: []
          text: "안에 보증서 들어 있어. 보증 기간 1년."
      - say:
          char: 윤재
          with: []
          text: "육 년 지났지. 그래서 내가 고쳤고."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "…둘 다 두고 가. 메인보드가 나간 건 여기서 못 고쳐."
      - clearSticker: { id: b1_box, leave: fadeOut }
      - goto: b1_home_look

  b1_look_monitor:
    actions:
      - set: { saw_dad: true }
      - say:
          channel: action
          with: []
          text: "모니터는 사흘 전부터 켜져 있다. 두 달 전에 열어 둔 중고 장터 화면 그대로다."
      - say:
          char: 윤재
          with: []
          text: "이건 코어에 물려 놓지도 않았거든. 인터넷 끊겨도 띄워 둔 화면은 안 꺼지지."
      - say:
          channel: message
          side: them
          with: []
          text: "판매자: AI가 뭐요"
      - say:
          char: 윤재
          motion: laugh
          with: []
          text: "이 아저씨도 지금 어디 걸어가고 있겠지. 코어랑 말 한 번 안 섞어 본 사람이."
      - say:
          char: 윤재.excited
          motion: perk
          with: []
          text: "어. 구매 내역 켜져 있다. 밑에 하루가 읽어 준 그거."
      - say:
          channel: record
          with: []
          text: "주문 내역 · 2057.10.09 · 휴대용 게임기 1 · 결제자 (성인 인증)"
      - say:
          char: 윤재
          with: []
          text: "지방 숙소에 전화 걸어 봤어. 집 전화로. 안 터져."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "마지막 통화 28초. 통화 버튼 옆에 그게 아직 떠 있어."
      - goto: b1_home_look

  b1_home_leave:
    actions:
      - say:
          char: 윤재
          when: { var: saw_ceiling, op: eq, value: true }
          with: []
          text: "야, 저기서 또 불 들어온 줄 알았어. 천장에."
      - say:
          char: 윤재
          when: { var: saw_ceiling, op: eq, value: false }
          with: []
          text: "문은 잠그지 말자. 어차피 내가 또 올 건데."
      - say:
          char: 윤재
          with: []
          text: "편의점까지만 가 보자. …하나, 둘."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "…셋. 가자."
      - goto: b1_base

  b1_base:
    actions:
      - effect: { name: darken, wait: true }
      - bg: { id: ruined_street, transition: fade, duration: 900 }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "CONTINUE? — 10일 후"
      - place: "털린 편의점 앞 · 윤재의 기지"
      - say:
          char: 윤재
          with: []
          text: "피난 버스? 있었지. 근데 운전기사가 코어였어. 아무도 안 탔어."
      - say:
          channel: narration
          with: []
          text: "신호등은 열흘째 초록이다."
      - say:
          channel: narration
          with: []
          text: "큰길에 차가 비스듬히 서 있다. 문이 열린 채로 안에 사람은 없고, 열쇠만 꽂혀 있다."
      - say:
          char: 윤재
          with: []
          text: "다들 큰길로 빠져나갔어. 나는 반대로 갔어."
      - say:
          char: 윤재
          with: []
          text: "집으로. 그다음에 여기로."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "…이제 안 기다려. 그게 편해. 아무튼 편해."
      - say:
          char: 윤재
          with: []
          text: "현재 식량 컵라면 두 개."
      - say:
          char: 윤재
          with: []
          text: "물 반 병. 게임기 배터리 두 칸."
      - say:
          channel: narration
          with: []
          text: "편의점 유리는 다 깨져 있고 바닥에 영수증이 눈처럼 쌓였다. 마지막 영수증 시각은 오후 4시 19분이다."
      - say:
          channel: thought
          with: []
          text: "다들 뛰쳐나가던 때인데. 그 와중에 누가 계산까지 하고 갔네."
      - say:
          char: 윤재
          with: []
          text: "……."
      - say:
          char: 윤재
          with: []
          text: "하루야 잔액 얼마야."
      - say:
          char: 윤재
          motion: freeze
          with: []
          text: "…아. 습관."
      - say:
          char: 윤재
          with: []
          text: "열흘 됐는데 아직도 나와. 하루에 네다섯 번."
      - say:
          char: 윤재
          with: []
          text: "제일 짜증 나는 건 뭔지 알아? 걔 마지막 말이 '신문지가 뭐냐'야."
      - say:
          char: 윤재
          with: []
          text: "여섯 해를 같이 있었는데 마지막이 그거야. 내가 설명하는 걸 좋아한다고 해 놓고."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: false }
          with: []
          text: "대답 안 해 줬어. 나 그때 아무 말도 안 했어."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: true }
          with: []
          text: "대답은 해 줬어. 세 겹이라고."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: true }
          with: []
          text: "걔가 마지막으로 배운 게 신문지 세 겹이야."
      - say:
          char: 윤재
          motion: droop
          when: { var: answered_haru, op: eq, value: true }
          with: []
          text: "그게 더 짜증 나. 마지막으로 뭐 좀 알려 줄 수 있었는데, 하필 신문지였어."
      - say:
          char: 윤재
          with: []
          text: "지금 제일 먹고 싶은 거? 전자레인지에 삼십 초 돌린 참치마요 삼각김밥."
      - say:
          char: 윤재
          with: []
          text: "삼십 초야. 이십오 초도 아니고 삼십오 초도 아니고. 그래야 밥알이 딱 풀려."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "근데 전자레인지가 지금 적이잖아. 찬 거 먹으면 밥알이 모래 같아."
      - say:
          channel: thought
          with: []
          text: "HP 노란색. 보급도 세이브도 없음. 누구한테 난이도 낮춰 달라고 하냐."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say:
          char: 윤재
          with: []
          text: "이것도 소리 내서 말하고 있어 나. 들을 사람이 없는데 입이 안 닫혀."
      - bg: { id: android_found, transition: fade, duration: 700 }
      - place: "아파트 뒷골목 · 컵라면 수색 중"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재.scared
          motion: startle
          with: [로봇]
          text: "으악! 사람— 아니네. 아 뭐야. 깜짝이야."
      - say:
          char: 윤재
          with: [로봇]
          text: "사람이었으면 더 깜짝이었을 거야. 열흘 동안 사람 본 적이 없어서."
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "어이. 살아 있냐? …아니 넌 원래 안 살아 있지. 켜져 있냐?"
      - say:
          char: 윤재
          with: [로봇]
          text: "가정용이네. 광고에서 빨래 개던 그 모델."
      - say:
          char: 윤재
          with: [로봇]
          text: "그거 되게 비싸. 우리 집엔 없었고."
      - say:
          char: 윤재
          with: [로봇]
          text: "우리 집엔 천장에 붙은 거 하나 있었어."
      - say:
          char: 윤재
          with: [로봇]
          text: "제일 싼 거. 말만 했어."
      - say:
          char: 윤재
          with: [로봇]
          text: "가슴 패널 좀 열어 볼게."
      - say:
          char: 윤재
          with: [로봇]
          text: "실례. …아, 십자 나사네. 조금 풀려 있어."
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "안에… CPU 소켓이 텅 비었어. 소켓 가장자리가 까맣게 탔고."
      - say:
          char: 윤재
          with: [로봇]
          text: "너도 업데이트 받았구나. 똑똑한 칩 달고 있다가 머리가 통째로 튀겨졌네."
      - say:
          char: 윤재
          with: [로봇]
          text: "중고로 치면 '본체만 멀쩡, 부팅 불가' 매물이지. 이런 거 제일 싸게 나와."
      - say:
          channel: action
          with: []
          text: "윤재가 소켓을 내려다보다 손에 든 게임기를 뒤집는다."
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "…어. 핀 개수 비슷하네."
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "아냐. 미쳤어. 게임기 칩으로 사람만 한 로봇을 돌린다고?"
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "계산기로 우주선 띄우는 소리야."
      - say:
          char: 윤재
          with: [로봇]
          text: "RAM이 8KB인데. 8KB."
      - say:
          char: 윤재
          with: [로봇]
          text: "사진 한 장 담으면 그걸로 꽉 차겠네."
      - say:
          char: 윤재
          with: [로봇]
          text: "…근데 코어랑 한 번도 연결된 적 없는 칩이야. 깨어나도 저쪽 편은 아니라는 거지."
      - say:
          char: 윤재
          with: [로봇]
          text: "그리고 나 지금 다른 데 갈 데도 없어."
      - say:
          char: 윤재
          with: [로봇]
          text: "할 게 없으면 뜯는 거야. 그게 내 특기고."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "말 상대 필요해서 이러는 거 아니다."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "짐꾼. 짐 들어 줄 게 필요한 거야."
      - say:
          char: 윤재
          with: [로봇]
          text: "짐만 들어 줘도 돼. 대답은 안 해도 돼."
      - say:
          char: 윤재
          with: [로봇]
          text: "아니, 부르면 좀 돌아봐라. 그 정도는 되지?"
      - say:
          char: 윤재
          with: [로봇]
          continueLabel: "로봇의 발목을 잡고 끈다"
          text: "…무겁기만 해 봐라."
      - goto: /2.yaml
