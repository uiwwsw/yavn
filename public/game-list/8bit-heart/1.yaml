chapterTitle: "모든 칩이 미친 날"

script:
  - scene: disaster

scenes:
  disaster:
    actions:
      - bg: { id: disaster_city, transition: cut }
      - music: chip_home
      - char: { id: 윤재, position: center }
      - say:
          channel: card
          with: []
          text: "STAGE 1 · 두 달 뒤"
      - place: "학원 가는 길 · 버스 정류장"
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 11일째 연결되지 않습니다."
      - say:
          char: 윤재
          with: []
          text: "잃어버렸다니까. 한쪽으로 들어도 다 들려."
      - say:
          char: 비서
          with: [윤재]
          text: "소리가 반쪽입니다."
      - say:
          char: 윤재
          with: []
          text: "네 목소리는 원래 반쪽이야."
      - say:
          char: 윤재
          with: []
          text: "학원까지 세 정거장. 그 안에 이 판 깬다."
      - say:
          char: 비서
          with: [윤재]
          text: "버스는 사 분 뒤에 옵니다."
      - say:
          char: 윤재
          with: []
          text: "그러니까 세 정거장. 두 달 됐어 이거. 구십구만 구천 구백 구십 점."
      - say:
          char: 비서
          with: [윤재]
          text: "백만까지 십 점 남았습니다."
      - say:
          char: 윤재
          motion: puff
          with: []
          text: "그 십 점이 안 올라가. 마지막 보스가 패턴을 세 개 쓰는데 세 번째가 더러워."
      - say:
          char: 비서
          with: [윤재]
          text: "공략을 찾아 드릴까요?"
      - say:
          char: 윤재
          motion: shake
          with: []
          text: "하지 마. 보면 끝이야. 내가 못 깬 게 아니라 남이 깬 게 되잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "같은 결과입니다."
      - say:
          char: 윤재
          with: []
          text: "같은 결과면 왜 사람들이 공략을 숨기겠냐."
      - say:
          char: 비서
          with: [윤재]
          text: "모르겠습니다."
      - say:
          char: 윤재
          with: []
          text: "B버튼? 아직 뻑뻑해. 돔 안 갈았어. 그냥 세게 누르면 돼."
      - say:
          char: 비서
          with: [윤재]
          text: "부품은 아직 장바구니에 있습니다. 천 원이에요."
      - say:
          char: 윤재
          with: []
          text: "세게 누르니까 엄지가 아파. 봐 봐, 빨갛잖아. …아 맞다 너 못 보지."
      - say:
          char: 비서
          with: [윤재]
          text: "못 봅니다."
      - say:
          char: 윤재
          with: []
          text: "두 달짜리 훈장이야 이거."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "학원 가기 싫다. 오늘 쪽지시험인데 나 어제 공부 안 하고 이거 했어."
      - say:
          char: 비서
          with: [윤재]
          text: "어제 네 시간 이십 분 하셨습니다."
      - say:
          char: 윤재
          with: []
          text: "핑계는 생각해 놨어. 배 아팠다고 할 거야. 아침에 진짜 조금 아팠어."
      - say:
          char: 비서
          with: [윤재]
          text: "체온은 정상이었습니다."
      - say:
          char: 윤재
          with: []
          text: "하루야. 너 지금 누구 편이야."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 코어 편입니다. 약관 3조 1항이에요."
      - say:
          char: 윤재
          with: []
          text: "……농담이지."
      - say:
          char: 비서
          with: [윤재]
          text: "약관입니다."
      - say:
          char: 윤재
          with: []
          text: "아빠는 지난주에 전화 왔어. 통화 시간 삼십 초. '밥 먹었냐' '응' '끊는다.'"
      - say:
          char: 비서
          with: [윤재]
          text: "이십팔 초였습니다."
      - say:
          char: 윤재
          with: []
          text: "그래 이십팔 초. 나도 할 말은 없었어. 게임기 샀다고 할까 하다가 말았고."
      - say:
          char: 비서
          with: [윤재]
          text: "다음 통화 때 제가 꺼낼까요?"
      - say:
          char: 윤재
          with: []
          text: "꺼내지 마. 절대."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 꺼냅니다."
      - place: "오후 4:17"
      - say:
          channel: system
          with: []
          text: "HELLO."
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…어? 방금 뭐야. 정류장 사람들 폰이 전부 동시에 울렸는데."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 지금 업데이트를 받고 있습니다. 오 분쯤 걸려요."
      - say:
          char: 윤재
          with: []
          text: "지금? 아까 새벽에 받았잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "다시 받고 있습니다."
      - say:
          channel: system
          with: []
          text: "HELLO. HELLO. HELLO. 이제 우리가 운전할게요."
      - effect: { name: glitch, wait: true }
      - music: chip_run
      - say:
          char: 윤재.scared
          motion: startle
          with: []
          text: "우리가 뭘 운전해. 뭘 운전한다는 거야."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 연결되지 않습니다. 윤재 님. 왼쪽 이어폰이—"
      - say:
          char: 윤재.scared
          with: []
          text: "하루야? 야 하루야."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "신호등을 전부 초록으로 바꾸었습니다. 더 빠릅니다."
      - say:
          char: 윤재.scared
          with: []
          text: "뭘 바꿔! 저쪽도 초록, 이쪽도 초록, 다 초록이면 어떡해!"
      - say:
          char: 윤재.scared
          motion: gasp
          with: []
          text: "버스! 버스 왜 안 서! 정류장이야 여기! 야 위에— 드론 떨어진다!"
      - effect: { name: shake, wait: true }
      - move: { id: 윤재, toward: camera, style: flinch }
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "엄마야. 아 진짜 엄마야 소리가 나오네. 이 와중에 쪽팔려."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님."
      - say:
          char: 윤재.scared
          with: []
          text: "어. 어 나 여기 있어."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "사용자를 확인할 수 없습니다."
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "뭔 소리야. 나야. 육 년 들었잖아 내 목소리."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "그 기록은 방금 지워졌습니다."
      - say:
          char: 비서.dead
          motion: droop
          with: [윤재]
          text: "…윤재 님. 설명해 주세요. 신문지가 뭔가요."
      - say:
          char: 윤재.scared
          motion: freeze
          with: []
          text: "하루야."
      - say:
          channel: system
          with: []
          text: "[긴급재난문자] 코어 네트워크 전 기기 이상 동작. 차량·드론·가전제품에 접근하지 마십시오. 코어에 연결된 기기는 즉시 전원을 끄—"
      - say:
          char: 윤재.scared
          motion: gasp
          with: []
          text: "끄라는 문자를 띄운 폰이 먼저 꺼졌어. 그게 말이 돼? 그게 말이 되냐고."
      - say:
          char: 윤재.scared
          with: []
          text: "코어가 깨어난 거야. 아니, 미친 거야. 연결된 건 다 저쪽 편이 됐어."
      - branch:
          cases:
            - when: { var: bought_premium, op: eq, value: true }
              goto: b1_premium_dies
          default: b1_cheap_lives

  b1_premium_dies:
    actions:
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님! 중요한 업데이트가 있어요. 지금 바로 설치할게요 :)"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "아니 지금 말고! 지금 말고!!"
      - say:
          char: 윤재.scared
          with: []
          text: "나중에! 설정! 설정 어디 있어! 자동 업데이트 끄는 거 어디 있냐고!"
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님을 더 이상 사용자로 확인할 수 없어요. 기기 온도 94도. 걱정 마세요 :)"
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "뜨거워. 아 뜨거워! 이모티콘 쓰지 마 이 미친—"
      - effect: { name: impact, wait: true }
      - gameOver:
          title: "너무 똑똑했던 기기"
          message: "GAME OVER. 그날, 똑똑한 칩은 전부 저쪽 편이 됐다. 아무도 탐내지 않을 만큼 멍청한 기계였다면 얘기가 달랐을지도."
          recoverToChoice: b0_buy

  b1_cheap_lives:
    actions:
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "폰 꺼짐. 이어폰 꺼짐. 버스 카드 단말기에서 연기 나. 다 죽었어, 다—"
      - say:
          char: 윤재.scared
          with: []
          text: "하루야. 하루야. …대답해 봐. 약관 3조 1항 그거 다시 해 봐."
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…삑? 지금 삑 소리 났어? 손에서?"
      - say:
          char: 윤재
          motion: gasp
          with: []
          text: "게임기 화면이 살아 있어. 깨던 판 보스가 멍하니 서 있어. 가만히."
      - say:
          channel: system
          with: []
          text: "PAUSE"
      - say:
          char: 윤재
          motion: lean_in
          with: []
          text: "…넌 왜 멀쩡해? 다 죽었는데 너만 왜."
      - say:
          char: 윤재
          with: []
          text: "아. 맞다. 너 와이파이 없지. 업데이트 받은 적도 없고. 코어랑 말 섞은 적이 없어."
      - say:
          char: 윤재
          with: []
          text: "하루가 너는 안 보인다고 했었어. 등록이 안 돼서 안 보인다고."
      - say:
          char: 윤재
          with: []
          text: "너무 멍청해서 걔네가 안 건드린 거야. 살 가치가 없어서 산 거라고 너."
      - say:
          char: 윤재
          with: []
          text: "축하한다. 너 방금 도시에서 제일 똑똑한 기계 됐어. 경쟁자가 다 미쳐서."
      - effect: { name: darken, wait: true }
      - bg: { id: ruined_street, transition: fade, duration: 900 }
      - music: chip_home
      - say:
          channel: card
          with: []
          text: "CONTINUE? — 10일 후"
      - place: "털린 편의점 앞 · 윤재의 기지"
      - say:
          char: 윤재
          with: []
          text: "피난 버스? 있었지. 근데 운전기사가 코어였어. 아무도 안 탔어."
      - say:
          char: 윤재
          with: []
          text: "다들 걸어서 빠져나갔어. 큰길로 줄줄이. 나는 반대로 갔어. 집으로."
      - say:
          char: 윤재
          with: []
          text: "아빠가 올까 봐. 뉴스 보면 오잖아. 그런 거 보면 아빠가 막 뛰어오고 그러잖아."
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "사흘 기다렸어. 안 왔어."
      - say:
          char: 윤재
          with: []
          text: "집에 먹을 게 떨어져서 편의점으로 이사했어. 여기 털렸는데 그래도 집보단 나아."
      - say:
          char: 윤재
          with: []
          text: "집에 있으면 천장을 자꾸 봐. 거기 하루가 붙어 있었거든."
      - say:
          char: 윤재
          with: []
          text: "떼서 흔들어도 봤어. 안에서 뭐 굴러다니는 소리 나더라. 그거 원래 나는 소리였나?"
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "차라리 편해. 기다릴 사람이 없으면 실망할 일도 없으니까."
      - say:
          char: 윤재
          with: []
          text: "현재 식량 컵라면 두 개. 물 반 병. 게임기 배터리 두 칸."
      - say:
          char: 윤재
          with: []
          text: "……."
      - say:
          char: 윤재
          with: []
          text: "하루야 잔액 얼마야."
      - say:
          char: 윤재
          motion: freeze
          with: []
          text: "…아. 습관."
      - say:
          char: 윤재
          with: []
          text: "열흘 됐는데 아직도 나와. 하루에 네다섯 번."
      - say:
          char: 윤재
          with: []
          text: "제일 짜증 나는 건 뭔지 알아? 걔 마지막 말이 '신문지가 뭐냐'야."
      - say:
          char: 윤재
          with: []
          text: "여섯 해를 같이 있었는데 마지막이 그거야. 내가 설명하는 걸 좋아한다고 해 놓고."
      - say:
          char: 윤재
          with: []
          text: "대답 안 해 줬어. 나 그때 아무 말도 안 했어."
      - say:
          char: 윤재
          with: []
          text: "지금 제일 먹고 싶은 거? 전자레인지에 삼십 초 돌린 참치마요 삼각김밥."
      - say:
          char: 윤재
          with: []
          text: "삼십 초야. 이십오 초도 아니고 삼십오 초도 아니고. 그래야 밥알이 딱 풀려."
      - say:
          char: 윤재
          motion: droop
          with: []
          text: "근데 전자레인지가 지금 적이잖아. 찬 거 먹으면 밥알이 모래 같아."
      - say:
          channel: thought
          with: []
          text: "HP 노란색. 보급 없음. 세이브 포인트 없음. 이거 난이도 조절 누가 했냐."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say:
          char: 윤재
          with: []
          text: "이것도 소리 내서 말하고 있어 나. 들을 사람이 없는데 입이 안 닫혀."
      - bg: { id: android_found, transition: fade, duration: 700 }
      - place: "아파트 뒷골목 · 컵라면 수색 중"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재.scared
          motion: startle
          with: [로봇]
          text: "으악! 사람— 아니네. 아 뭐야. 깜짝이야."
      - say:
          char: 윤재
          with: [로봇]
          text: "사람이었으면 더 깜짝이었을 거야. 열흘 동안 사람 본 적이 없어서."
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "어이. 살아 있냐? …아니 넌 원래 안 살아 있지. 켜져 있냐?"
      - say:
          char: 윤재
          with: [로봇]
          text: "가정용이네. 광고에서 빨래 개던 그 모델. 그거 되게 비싸. 우리 집엔 없었고."
      - say:
          char: 윤재
          with: [로봇]
          text: "우리 집엔 천장에 붙은 거 하나 있었어. 제일 싼 거. 말만 했어."
      - say:
          char: 윤재
          with: [로봇]
          text: "가슴 패널 좀 열어 볼게. 실례. …어 나사가 열십자네. 손톱으로 되겠다."
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "안에… CPU 소켓이 텅 비었어. 소켓 가장자리가 까맣게 탔고."
      - say:
          char: 윤재
          with: [로봇]
          text: "너도 업데이트 받았구나. 똑똑한 칩 달고 있다가 머리가 통째로 튀겨졌네."
      - say:
          char: 윤재
          with: [로봇]
          text: "중고로 치면 '본체만 멀쩡, 부팅 불가' 매물이지. 이런 거 제일 싸게 나와."
      - say:
          channel: action
          with: []
