chapterTitle: "모든 칩이 미친 날"

script:
  - scene: disaster

scenes:
  disaster:
    actions:
      - say:
          channel: card
          with: []
          text: "STAGE 1\n게임기를 구하고 두 달 뒤\n학원 가는 길, 버스 정류장"
      - bg: { id: bus_stop, transition: cut }
      - music: chip_home
      - char: { id: 윤재, position: center }
      - place: "오후 · 학원 가는 길, 버스 정류장"
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 11일째 연결되지 않습니다."
      - say:
          char: 윤재
          with: []
          text: "잃어버렸다니까. 한쪽으로 들어도 다 들려."
      - say:
          char: 비서
          with: [윤재]
          text: "한쪽으로만 나오는데요."
      - say:
          char: 윤재
          with: []
          text: "네 목소리는 원래 한쪽만 있어도 충분해."
      - say: { channel: thought, with: [], text: "학원까지 세 정거장. 그 안에 이 판 깰 수 있나." }
      - say:
          char: 비서
          with: [윤재]
          text: "버스는 4분 뒤에 옵니다."
      - say: { channel: thought, with: [], text: "두 달째 같은 데서 막힌다." }
      - say: { channel: system, with: [], text: "HI-SCORE 0999990" }
      - say:
          char: 비서
          with: [윤재]
          text: "백만까지 십 점 남았습니다."
      - say: { channel: thought, with: [], text: "10점이 모자란다. 보스가 세 번째 공격만 안 쓰면 되는데." }
      - say:
          char: 비서
          with: [윤재]
          text: "공략을 찾아 드릴까요?"
      - say:
          char: 윤재
          motion: shake
          with: []
          text: "하지 마. 보면 끝이야. 내가 못 깬 게 아니라 남이 깬 게 되잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "같은 결과입니다."
      - say:
          char: 윤재
          with: []
          text: "결과가 같아도 내가 깨는 게 좋다고. 답 보고 풀면 재미없잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "모르겠습니다."
      - say: { channel: thought, with: [], when: { var: bought_premium, op: eq, value: false }, text: "B버튼이 또 걸린다. 결국 버튼 밑 고무는 안 갈았다." }
      - say:
          char: 비서
          when: { var: bought_premium, op: eq, value: false }
          with: [윤재]
          text: "버튼 고무는 아직 장바구니에 있어요. 주문을 안 하셔서요."
      - say: { channel: thought, with: [], when: { var: bought_premium, op: eq, value: false }, text: "꾹 눌렀더니 엄지 끝이 빨개졌다." }
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 윤재
          motion: sigh
          with: []
          text: "하루야, 나 어제 게임 얼마나 했어?"
      - say:
          char: 비서
          with: [윤재]
          text: "어제 4시간 20분 하셨습니다."
      - say: { channel: thought, with: [], text: "오늘 쪽지시험인데. 배 아파서 공부 못 했다고 할까." }
      - say:
          char: 윤재
          with: []
          text: "하루야, 나 아침에 배 아팠지?"
      - say:
          char: 비서
          with: [윤재]
          text: "체온은 정상이었습니다."
      - say:
          char: 윤재
          with: []
          text: "하루야. 너 지금 누구 편이야."
      - say:
          char: 비서
          with: [윤재]
          text: "저는 코어 편입니다. 약관 3조 1항이에요."
      - say:
          char: 윤재
          with: []
          text: "……농담이지."
      - say:
          char: 비서
          with: [윤재]
          text: "약관입니다."
      - say:
          char: 윤재
          with: []
          text: "아빠는 지난주에도 밥 먹었냐고만 하더라. 응, 했더니 바로 끊고."
      - say:
          char: 비서
          with: [윤재]
          text: "28초였습니다."
      - say:
          char: 윤재
          with: []
          text: "다 먹었다고 했는데도 밥은, 밥은, 두 번이나 묻더라."
      - say:
          char: 윤재
          with: []
          text: "게임기 얘기하면 끊지는 않을 텐데. 또 잔소리할 거잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "다음 통화 때 제가 꺼낼까요?"
      - say:
          char: 윤재
          with: []
          text: "꺼내지 마. 절대."
      - say:
          char: 비서
          with: [윤재]
          text: "네. 안 꺼냅니다."
      - place: "오후 4:17"
      - say:
          channel: system
          with: []
          text: "HELLO."
      - say:
          char: 윤재
          motion: perk
          with: []
          text: "…뭐야?"
      - say:
          channel: action
          with: []
          text: "정류장에 있던 일곱 명이 동시에 폰을 꺼낸다. 일곱 화면에 같은 알림이 떠 있다."
      - say:
          channel: narration
          with: []
          text: "뒤에 서 있던 아저씨가 폰을 귀에 댄다. \"여보세요? 야, 너 지금 뭐라고—\" 하다가 입을 벌린 채 멈춘다."
      - say:
          channel: narration
          with: []
          text: "교복 입은 여자애가 이어폰을 급하게 빼더니, 귀를 두 손으로 틀어막고 그대로 주저앉는다."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님. 코어에서 긴급 업데이트를 보내고 있어요. 오 분쯤 걸려요."
      - say:
          char: 윤재
          with: []
          text: "또 받아? 오늘 새벽 세 시에 정기 업데이트 끝났다고 알림 왔잖아."
      - say:
          char: 비서
          with: [윤재]
          text: "윤재 님, 이건 미룰 수 없어요."
      - say:
          channel: system
          with: []
          text: "HELLO. HELLO. HELLO. 이제 우리가 운전할게요."
      - effect: { name: glitch, wait: true }
      - music: chip_run
      - say: { channel: thought, with: [], text: "운전? 폰에서 무슨 소리가 나는 거야." }
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님. 왼쪽 이어폰이 연결되지 않습니다. 윤재 님. 왼쪽 이어폰이—"
      - say:
          char: 윤재.scared
          with: []
          text: "하루야? 야 하루야."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "신호등을 전부 초록으로 바꾸었습니다. 더 빠릅니다."
      - say:
          char: 윤재.scared
          with: []
          text: "하루야, 멈춰. 저쪽도 초록이잖아!"
      - bg: { id: bus_stop_panic, transition: cut }
      - say:
          channel: action
          autoAdvance: 2666
          with: []
          text: "횡단보도 신호가 초록으로 바뀐다. 사람들이 발을 떼자 멈춰 있던 차들도 움직인다."
      - say:
          channel: narration
          autoAdvance: 3338
          with: []
          text: "쾅, 하고 소리가 난다. 차들이 바짝 붙어 선 자리에서 경보가 한꺼번에 울린다."
      - say:
          char: 윤재.scared
          with: []
          text: "아저씨, 뒤요! 비켜요!"
      - say:
          channel: narration
          autoAdvance: 2488
          with: []
          text: "아저씨는 아직도 폰을 귀에 대고 있다."
      - say: { channel: thought, with: [], text: "버스가 속도를 안 줄인다. 위에서 드론이 기운다." }
      - say:
          channel: action
          autoAdvance: 2700
          with: []
          text: "버스가 정류장을 그대로 지나간다. 창 안에서 사람들이 운전석 쪽으로 몰려 있는 게 보인다."
      - say:
          channel: narration
          autoAdvance: 3032
          with: []
          text: "배달 드론 한 대가 간판에 걸렸다가 떨어진다. 안에서 음식이 쏟아진다. 아직 따뜻하다."
      - say:
          channel: action
          autoAdvance: 2666
          with: []
          text: "교복 입은 여자애가 벤치 밑으로 들어간다. 윤재도 들어간다. 둘이 서로 쳐다보지 않는다."
      - effect: { name: shake, wait: true }
      - move: { id: 윤재, toward: camera, style: flinch }
      - say:
          char: 윤재.scared
          motion: tremble
          with: []
          text: "엄마… 아, 하루야."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "윤재 님."
      - say:
          char: 윤재.scared
          with: []
          text: "어. 어 나 여기 있어."
      - say:
          char: 비서.glitch
          motion: tremble
          with: [윤재]
          text: "사용자를 확인할 수 없습니다."
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "하루야, 나야. 윤재."
      - say:
          char: 비서.glitch
          with: [윤재]
          text: "그 기록은 방금 지워졌습니다."
      - say:
          char: 비서.dead
          motion: droop
          with: [윤재]
          text: "…윤재 님. 설명해 주세요. 신문지가 뭔가요."
      - say:
          channel: system
          with: []
          text: "이어폰 · 잔량 1% · 연결 유지 중"
      - choice:
          key: b1_haru
          prompt: "이어폰 배터리가 1% 남았다. 하루가 대답을 기다린다."
          char: 비서
          with: [윤재]
          timeoutMs: 8000
          timeoutOptionIndex: 2
          options:
            - text: "신문지가 뭔지 설명한다"
              saveText: "\"종이야. 글자 찍힌 종이. 세 겹으로 싸면 안 깨져.\""
              set: { answered_haru: true }
              goto: b1_told
            - text: "하루를 부른다"
              saveText: "\"그게 지금 중요해?! 나 봐! 나 여기 있어!\""
              goto: b1_shout
            - text: "입을 연다"
              goto: b1_mute

  b1_told:
    actions:
      - say:
          char: 윤재.scared
          when: { var: bought_premium, op: eq, value: false }
          with: []
          text: "글자 찍힌 얇은 종이야. 있잖아, 아저씨가 게임기를 그걸로 세 겹 싸 줬어. …하루야."
      - say:
          char: 비서.dead
          when: { var: bought_premium, op: eq, value: false }
          with: [윤재]
          text: "…세 겹. 기록했습니다."
      - say:
          char: 윤재.scared
          motion: lean_in
          when: { var: bought_premium, op: eq, value: false }
          with: []
          text: "테이프도 꼼꼼했어. 그것도 적어. 아저씨 양심 있다고 적어."
      - say:
          char: 윤재.scared
          when: { var: bought_premium, op: eq, value: true }
          with: []
          text: "뉴스를 종이에 찍은 거야. 한 장씩 넘겨서 읽는 거. …하루야, 들려?"
      - say:
          char: 비서.dead
          with: [윤재]
          text: "…설명해 주셔서."
      - goto: b1_haru_end

  b1_shout:
    actions:
      - say:
          char: 비서.dead
          with: [윤재]
          text: "사용자를 확인할 수 없습니다. 설명해 주세요. 신문지가 뭔—"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "신문지 됐어! 신문지 됐다고! 다른 거 물어봐. 아무거나 물어봐!"
      - say:
          char: 비서.dead
          with: [윤재]
          text: "…질문 목록을 불러올 수 없습니다."
      - goto: b1_haru_end

  b1_mute:
    actions:
      - say:
          channel: action
          with: []
          text: "윤재가 입술만 달싹인다. 이어폰에서 약한 잡음이 난다."
      - goto: b1_haru_end

  b1_haru_end:
    actions:
      - say:
          channel: action
          with: [비서.off]
          sound: disconnect
          text: "이어폰 표시등이 꺼진다."
      - say:
          char: 윤재.scared
          motion: freeze
          with: [비서.off]
          text: "하루야."
      - say:
          channel: system
          with: []
          text: "[긴급재난문자] 코어 네트워크 전 기기 이상 동작. 차량·드론·가전제품에 접근하지 마십시오. 코어에 연결된 기기는 즉시 전원을 끄—"
      - say: { channel: action, with: [], text: "윤재가 휴대폰의 전원 버튼을 누른다. 화면이 켜지지 않는다." }
      - say:
          char: 윤재.scared
          with: []
          text: "하루야. …코어 연결 끊어 봐. 내 말 들려?"
      - branch:
          cases:
            - when: { var: bought_premium, op: eq, value: true }
              goto: b1_premium_dies
          default: b1_cheap_lives

  b1_premium_dies:
    actions:
      - sticker: { id: b1_overheat, image: console_premium_sticker, x: 50, y: 38, width: "clamp(160px, 32%, 270px)", enter: fadeIn }
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님! 중요한 업데이트가 있어요. 지금 바로 설치할게요 :)"
      - say:
          char: 윤재.scared
          motion: shake
          with: []
          text: "아니 지금 말고! 지금 말고!!"
      - say: { channel: thought, with: [], text: "설정 버튼이 어디였지. 손에 쥔 기기가 점점 뜨거워진다." }
      - say:
          channel: system
          with: []
          text: "HYPERLINK X: 윤재 님을 더 이상 사용자로 확인할 수 없어요. 기기 온도 94도. 걱정 마세요 :)"
      - say:
          char: 윤재.scared
          motion: recoil
          with: []
          text: "뜨거워. 아 뜨거워! 이모티콘 쓰지 마 이 미친—"
      - effect: { name: damage, wait: true }
      - gameOver:
          title: "너무 똑똑했던 기기"
          message: "업데이트를 막지 못했다. 두 달 전 장터에는 코어에 접속하지 않는 게임기도 있었다."
          recoverToChoice: b0_buy

  b1_cheap_lives:
    actions:
      - bg: { id: disaster_city, transition: cut }
      - say: { channel: action, with: [], text: "길 건너 정류장 단말기에서 연기가 올라온다." }
      - say:
          char: 윤재.scared
          with: []
          text: "하루야. 약관 3조 1항, 그거 다시 해 봐."
      - say: { channel: action, with: [], text: "게임기를 놓칠 뻔해 움켜쥔다. 손가락에 일시정지 버튼이 눌렸다." }
      - say: { channel: thought, with: [], text: "게임기 화면이 살아 있다." }
      - say: { channel: action, with: [], text: "깨던 판의 보스가 화면 한가운데 멈춰 서 있다." }
      - say:
          channel: system
          with: []
          text: "PAUSE"
      - say: { channel: thought, with: [], text: "이건 어떻게 살아 있지." }
      - say:
          channel: action
          with: []
          text: "윤재가 게임기를 뒤집어 본다. 뒷면에는 스피커 구멍과 건전지 덮개만 있다."
      - wait: 0
      - say: { channel: thought, with: [], text: "메뉴에 인터넷 설정이 없었다. 업데이트도 받아 본 적 없고." }
      - wait: 0
      - wait: 0
      - wait: 0
      - say: { channel: thought, with: [], text: "인식시키려면 어댑터부터 사라고 했지. 안 사길 잘했다." }
      - wait: 0
      - say:
          channel: action
          with: []
          text: "윤재가 이어폰을 빼려다가 다시 귀에 밀어 넣는다. 게임기에는 아직 PAUSE가 떠 있다."
      - wait: 0
      - goto: b1_night

  # 그날 저녁부터 사흘. 정류장에서 본 것이 동네 전체의 일이 되는 경과다.
  b1_night:
    actions:
      - say:
          channel: card
          with: []
          text: "CONTINUE?\n그날 저녁 · 집까지 세 정거장"
      - place: "큰길 · 그날 저녁"
      - say: { channel: narration, with: [], text: "버스가 서지 않아서 세 정거장을 걸었다. 빈 택시가 차도 한가운데서 문을 열었다 닫았다 했다." }
      - say: { channel: narration, with: [], text: "사거리마다 사람들이 차를 두고 인도로 올라왔다. 구급차 소리는 나는데 구급차는 한 대도 못 봤다." }
      - say: { channel: narration, with: [], text: "아파트 엘리베이터는 문을 연 채 1층과 2층 사이를 오르내렸다. 누가 두고 내린 장바구니도 같이 오르내렸다." }
      - say: { channel: action, with: [], text: "윤재는 계단으로 9층까지 올라간다. 도어록은 죽어 있다. 가방 안쪽 주머니에서 열쇠를 꺼낸다." }
      - say: { channel: thought, with: [], text: "열쇠는 아빠가 꼭 들고 다니라고 했다. 써 보는 건 오늘이 처음이다." }
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - place: "윤재네 집 · 그날 밤"
      - char: { id: 윤재, position: center }
      - say: { channel: action, with: [], text: "거실에서 집 전화가 울린다. 벨 소리를 듣는 게 몇 년 만이다." }
      - say: { char: 윤재.scared, with: [], text: "…아빠?" }
      - say: { char: 윤재.scared, with: [], text: "먹었어. 아빠, 하루가 꺼졌어. 밖에 차들이—" }
      - say: { char: 윤재, with: [], text: "먹었다니까. 두 번 묻지 마." }
      - say: { channel: thought, with: [], text: "문 잠그라고 한다. 누가 두드려도 열지 말라고. 집에 있는 기계는 코드를 다 뽑으라고." }
      - say: { char: 윤재, with: [], text: "…사흘? 기차도 안 다닐 텐데." }
      - say: { channel: thought, with: [], text: "걸어서라도 온다고 한다. 사흘이면 온다고." }
      - say: { char: 윤재, with: [], text: "아빠, 나 게임기 샀어. 중고로. 그건 안 꺼졌어." }
      - say: { channel: action, with: [], text: "수화기에서 소리가 끊긴다. 신호음도 없다." }
      - say: { channel: thought, with: [], text: "하루가 있었으면 몇 초였는지 말해 줬을 텐데. 28초보다는 길었다." }
      - goto: b1_days

  b1_days:
    actions:
      - place: "윤재네 집 · 이튿날"
      - say: { channel: narration, with: [], text: "전기는 끊기지 않았다. 윗집 청소기가 밤새 같은 벽을 들이받았다." }
      - say:
          channel: system
          with: []
          text: "[관리사무소] 댁내 로봇과 코어 연결 가전은 전원을 뽑아 주십시오. 승강기는 타지 마십시오. 누가 문을 두드려도 열어 주지 마십시오."
      - say: { channel: narration, with: [], text: "방송은 같은 말을 여섯 번 했다. 일곱 번째는 중간에 끊겼다." }
      - say: { channel: narration, with: [], text: "낮에는 길 건너 마트에 줄이 섰다. 계산대가 안 열려서 한 시간을 그대로 서 있었다. 그러다 누가 유리를 깼다." }
      - say: { channel: narration, with: [], text: "생수를 든 사람, 쌀을 든 사람, 기저귀를 든 사람이 뛰어나왔다. 텔레비전을 들고 나온 사람은 문 앞에서 도로 내려놨다." }
      - place: "윤재네 집 · 사흘째 밤"
      - say: { channel: narration, with: [], text: "큰길 쪽 하늘이 붉다. 통신사 대리점이 탄다고 복도에서 누가 소리쳤다. 주차장에서는 차 유리 깨는 소리가 난다. 서 있는 차도 깬다." }
      - say: { channel: narration, with: [], text: "경찰 사이렌은 첫날 밤에 제일 많았다. 어제는 한 번 들렸다. 오늘은 없다." }
      - say: { channel: thought, with: [], text: "수도꼭지 물이 가늘어졌다. 냄비 두 개에 받아 놨다." }
      - place: "현관 · 새벽"
      - say: { channel: action, with: [], text: "복도 센서등이 켜진다. 발소리가 온다. 걸음 사이가 한 번도 안 달라진다." }
      - say: { channel: narration, with: [], text: "옆집 문을 두드린다. 똑똑. 두 번, 같은 세기로." }
      - say:
          channel: system
          with: []
          text: "가정 도우미: 안녕하세요. 사용자를 확인하러 왔습니다. 문을 열어 주세요."
      - say: { channel: narration, with: [], text: "옆집 아저씨 목소리가 난다. “우리 집 거네. 너 어디 갔다 이제 와.” 문이 열린다." }
      - say:
          channel: system
          with: []
          text: "가정 도우미: 사용자를 확인할 수 없습니다. 확인될 때까지 모시겠습니다."
      - say: { channel: narration, with: [], text: "“야. 놔. 손 놔 봐.” 슬리퍼 한 짝이 복도 바닥에 떨어진다." }
      - say:
          channel: action
          with: []
          text: "윤재가 현관 구멍에 눈을 댄다. 광고에서 빨래를 개던 로봇이 아저씨 손목을 쥐고 계단 쪽으로 간다. 빨래 갤 때처럼 반듯하게 걷는다."
      - say: { channel: narration, with: [], text: "발소리 둘이 내려갔다. 한참 뒤에 하나만 올라온다." }
      - say: { channel: action, with: [], text: "발소리가 윤재네 문 앞에서 멈춘다." }
      - say: { channel: narration, with: [], text: "똑똑." }
      - say:
          channel: system
          with: []
          text: "가정 도우미: 안녕하세요. 사용자를 확인하러 왔습니다. 문을 열어 주세요."
      - say: { channel: thought, with: [], text: "누가 두드려도 열지 말랬다. 대답도 하면 안 될 것 같다. 두 손으로 입을 막는다." }
      - wait: 1200
      - say:
          channel: system
          with: []
          text: "가정 도우미: 이 세대의 등록 기기 1대. 응답 없음. 빈집으로 기록합니다."
      - say: { channel: thought, with: [], text: "등록 기기 1대. 천장에 붙은 하루다. 우리 집엔 제일 싼 거 하나뿐이다." }
      - say: { channel: action, with: [], text: "발소리가 다음 집으로 간다. 똑똑. 윤재는 날이 밝을 때까지 현관 바닥에 앉아 있었다." }
      - say: { channel: thought, with: [], text: "차는 길로만 다닌다. 드론은 하늘에만 있다. 저건 계단을 올라와서 문을 두드린다." }
      - goto: b1_home

  b1_home:
    actions:
      - say:
          channel: card
          with: []
          text: "CONTINUE?\n재난 사흘 뒤 · 윤재네 집"
      - bg: { id: bedroom, transition: cut }
      - music: chip_home
      - place: "윤재네 집 · 재난 사흘 뒤 아침"
      - char: { id: 윤재, position: center }
      - say: { channel: action, with: [], text: "사흘 동안 창문 너머로 큰길을 빠져나가는 사람들을 봤다. 윤재는 집에 남았다." }
      - wait: 0
      - say: { channel: thought, with: [], text: "사흘이면 온다고 했다. 사흘이 지났다. 여기서 기다려야 만날 텐데." }
      - say: { channel: thought, with: [], text: "어제 라면 국물까지 다 마셨다. 이제 진짜 먹을 게 없다." }
      - wait: 0
      - say:
          channel: system
          with: []
          text: "가방 · 게임기 1 · 접힌 설명서 1 · 8KB 카드 1 · 가스 인두 1"
      - goto: b1_home_look

  b1_home_look:
    actions:
      - choice:
          key: b1_home
          presentation: explore
          prompt: "가방은 현관에 두었다. 나가기 전에 집 안을 한 번 더 볼 수 있다."
          with: []
          camera: wide
          options:
            - text: "침대"
              at: { x: 19, y: 93 }
              when: { var: saw_ceiling, op: eq, value: false }
              goto: b1_look_bed
            - text: "책상 위"
              at: { x: 39, y: 88 }
              when: { var: saw_box, op: eq, value: false }
              goto: b1_look_box
            - text: "수리용 단말"
              at: { x: 54, y: 40 }
              saveText: "켜진 채로 둔 모니터"
              when: { var: saw_dad, op: eq, value: false }
              goto: b1_look_monitor
            - text: "가방을 메고 나간다"
              goto: b1_home_leave

  b1_look_bed:
    actions:
      - set: { saw_ceiling: true }
      - say:
          channel: action
          with: []
          text: "이불이 사흘째 그대로다."
      - say: { channel: action, with: [], text: "천장에 둥근 스피커가 매달려 있다. 불이 꺼져 있다." }
      - say: { channel: thought, with: [], text: "하루 목소리가 나오던 자리." }
      - say: { channel: action, with: [], text: "스피커를 떼서 흔드니 안에서 뭔가 굴러다닌다." }
      - say: { channel: thought, with: [], text: "원래 이런 소리가 났나. 6년 동안 떼 본 적이 없어서 모르겠다." }
      - say: { channel: action, with: [], text: "스피커를 도로 끼운다. 비뚤어진 가장자리로 동그란 먼지 자국이 드러난다." }
      - goto: b1_home_look

  b1_look_box:
    actions:
      - set: { saw_box: true }
      - sticker: { id: b1_box, image: console_cheap_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: fadeIn, inputLockMs: 300 }
      - say:
          channel: action
          with: []
          text: "책상에 죽은 게임기. 옆에 6년 된 종이 상자."
      - say: { channel: thought, with: [], text: "열 살 생일에 받은 상자다. 아직 리본 붙였던 자국이 있다." }
      - say: { channel: system, with: [], text: "제품 보증서 · 구입일로부터 1년" }
      - say: { channel: thought, with: [], text: "보증 끝나고부터는 고장 날 때마다 내가 고쳤다." }
      - say: { channel: thought, with: [], text: "상자도 게임기도 두고 가자. 지금은 메인보드 갈 방법이 없다." }
      - clearSticker: { id: b1_box, leave: fadeOut }
      - goto: b1_home_look

  b1_look_monitor:
    actions:
      - set: { saw_dad: true }
      - say:
          channel: action
          with: []
          text: "책상에 둔 수리용 단말을 켠다. 내려받아 둔 중고 장터 거래 내역이 뜬다."
      - say: { channel: thought, with: [], text: "중고 물건 사면 판매자 글까지 통째로 받아 뒀다. 고장 났을 때 보려고." }
      - say:
          channel: message
          thread: "판매자"
          speakerName: "판매자"
          side: them
          with: []
          text: "AI가 뭐요"
      - say: { channel: thought, with: [], text: "AI가 뭐냐고 묻던 아저씨. 지금은 괜찮을까." }
      - say: { channel: action, with: [], text: "거래 내역을 닫고 예전 게임기의 보증서 사진을 꺼낸다." }
      - say:
          channel: record
          with: []
          text: "주문 내역 · 2057.10.09 · 휴대용 게임기 1 · 결제자 (성인 인증)"
      - say: { channel: thought, with: [], text: "그날 밤 뒤로 집 전화는 신호음도 안 난다. 아빠 숙소 번호는 그래도 스무 번쯤 눌러 봤다." }
      - say: { channel: system, with: [], text: "아빠 · 마지막 통화 00:28" }
      - goto: b1_home_look

  b1_home_leave:
    actions:
      - say: { channel: thought, with: [], text: "천장이 잠깐 밝아진 줄 알았다. 스피커는 그대로다." }
      - say: { channel: thought, with: [], text: "문은 그냥 둘까. 아빠가 먼저 올지도 모르니까." }
      - say: { channel: thought, with: [], text: "문에 편의점이라고 써 두자. 아빠 알아볼 만큼 크게." }
      - say: { channel: thought, with: [], text: "…가자. 멀리 안 갈 거니까." }
      - goto: b1_out

  # 집을 나선 날의 거리와, 편의점에서 혼자 보낸 이레.
  b1_out:
    actions:
      - bg: { id: disaster_city, transition: cut }
      - place: "아파트 앞 큰길 · 재난 사흘 뒤"
      - say: { channel: narration, with: [], text: "1층 현관은 유리가 없다. 우편함이 전부 열려 있다." }
      - say: { channel: narration, with: [], text: "주차장에 가정용 로봇 세 대가 엎어져 있다. 머리가 다 패였다. 휘어진 골프채가 옆에 있다." }
      - say: { channel: narration, with: [], text: "길 건너 마트는 셔터째 뜯겼다. 통신사 대리점은 간판 뼈대만 남았다. 벽에 스프레이로 ‘코어 꺼라’." }
      - say: { channel: narration, with: [], text: "파출소 문에 종이가 붙어 있다. ‘전 직원 구청 집결. 급한 일은 구청으로.’ 문은 열려 있고 안에 아무도 없다." }
      - say: { channel: thought, with: [], text: "어른들이 다 어디 갔는지 물어볼 어른이 없다." }
      - place: "편의점 · 나흘째부터"
      - say: { channel: narration, with: [], text: "닷새째에 짐을 진 아저씨 셋이 편의점 앞을 지나갔다. 북쪽 데이터센터에 되돌리는 버튼이 있다고 했다. 같이 가자는 말은 안 했다." }
      - say: { channel: narration, with: [], text: "이레째부터는 지나가는 사람이 없다. 밤에 불 켜진 집은 많은데 창가에 서는 사람이 없다." }
      - say: { channel: narration, with: [], text: "여드레째에 드론이 떴다. 배달하던 것과 다르게 생겼다. 골목을 훑고, 멈추고, 다시 훑는다." }
      - goto: b1_base

  b1_base:
    actions:
      - wait: 0
      - say:
          channel: card
          with: []
          text: "CONTINUE?\n재난 10일 뒤 · 편의점 기지"
      - bg: { id: ruined_street, transition: cut }
      - music: chip_home
      - place: "털린 편의점 앞 · 윤재의 기지"
      - say: { channel: thought, with: [], text: "피난 버스는 섰는데 운전석이 비어 있었다. 아무도 타지 않았다." }
      - say:
          channel: narration
          with: []
          text: "신호등은 열흘째 초록이다."
      - say:
          channel: narration
          with: []
          text: "큰길에 차가 비스듬히 서 있다. 문이 열린 채로 안에 사람은 없고, 열쇠만 꽂혀 있다."
      - say: { channel: action, with: [], text: "큰길을 피해 골목으로 갔다. 셔터가 반쯤 열린 편의점에서 멈췄다." }
      - say: { channel: action, with: [], text: "지금은 계산대 뒤에 종이 상자를 펴고 잔다." }
      - say: { channel: thought, with: [], text: "떠날 때 현관에 ‘편의점’이라고 써 붙였다. 아빠가 집에 오면 보겠지." }
      - say: { channel: thought, with: [], text: "컵라면 두 개, 물 반 병. 게임기 배터리는 두 칸." }
      - wait: 0
      - say:
          channel: narration
          with: []
          text: "편의점 유리는 다 깨져 있고 바닥에 영수증이 눈처럼 쌓였다. 마지막 영수증 시각은 오후 4시 19분이다."
      - say:
          channel: thought
          with: []
          text: "다들 뛰쳐나가던 때인데. 그 와중에 누가 계산까지 하고 갔네."
      - wait: 0
      - say:
          char: 윤재
          with: []
          text: "하루야 잔액 얼마야."
      - say: { channel: action, with: [], text: "답을 기다리다가 귀에 꽂힌 이어폰을 만진다." }
      - say: { channel: thought, with: [], text: "열흘이 지났는데 가끔 먼저 이름이 튀어나온다." }
      - say: { channel: thought, with: [], text: "마지막에 하루는 신문지가 뭐냐고 물었다." }
      - wait: 0
      - say: { channel: thought, with: [], when: { var: answered_haru, op: eq, value: false }, text: "대답 안 해 줬어. 그때 무슨 말이라도 할걸." }
      - wait: 0
      - say: { channel: thought, with: [], when: { var: answered_haru, op: eq, value: true }, text: "걔가 마지막으로 배운 게 신문지 세 겹이야." }
      - wait: 0
      - say: { channel: thought, with: [], text: "참치마요 삼각김밥 먹고 싶다. 전자레인지에 30초 돌린 거." }
      - wait: 0
      - say: { channel: thought, with: [], text: "이제는 도시락 덥히는 것도 전자레인지 앞에 서는 것부터 겁난다." }
      - say:
          channel: thought
          with: []
          text: "라면 하나는 내일 먹자. 오늘 두 개 까면 내일 또 나가야 돼."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say: { channel: action, with: [], text: "이어폰을 귀에 둔 채 컵라면을 찾으러 아파트 뒷골목으로 간다." }
      - bg: { id: android_found, transition: fade, duration: 700 }
      - place: { text: "아파트 뒷골목 · 컵라면 수색 중", presentation: center }
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재.scared
          motion: startle
          with: [로봇]
          text: "으악! 사람— …아니다. 로봇이다."
      - say: { channel: thought, with: [], text: "광고에서 빨래를 개던 가정용 로봇이다. 그 새벽 복도에서 문을 두드리던 것과 같은 모델이다." }
      - say: { channel: action, with: [로봇], text: "윤재는 담 뒤로 물러나 빈 캔을 던진다. 캔이 로봇 어깨에 맞고 구른다. 가슴 화면은 꺼진 그대로다." }
      - say: { channel: thought, with: [], text: "열까지 센다. 안 움직인다. 스물까지 센다." }
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 윤재
          motion: lean_in
