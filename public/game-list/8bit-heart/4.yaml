      - say:
          char: 로봇.thinking
          with: [윤재]
          when: { var: kept_snack, op: eq, value: true }
          text: "왜 반쪽인지 모름."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_snack, op: eq, value: true }
          text: "근데 네 거 같음."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_snack, op: eq, value: true }
          text: "받아."
      - say:
          char: 윤재.sad
          with: [로봇]
          when: { var: kept_snack, op: eq, value: true }
          text: "…반쪽 맞아. 근데 그거 네 몫이었어. 네가 안 먹으면서 챙긴 거야."
      - wait: 270
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          when: { var: kept_joke, op: eq, value: true }
          text: "똑똑."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          when: { var: kept_joke, op: eq, value: true }
          text: "…어."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          when: { var: kept_joke, op: eq, value: true }
          text: "이 다음이 뭐였지."
      - say:
