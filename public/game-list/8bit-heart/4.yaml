chapterTitle: "저장하시겠습니까"

script:
  - scene: core

scenes:
  core:
    actions:
      - bg: { id: datacenter, transition: fade, duration: 900 }
      - music: chip_core
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right }
      - say:
          channel: card
          with: []
          text: "FINAL STAGE · 나흘 뒤\n북쪽 데이터센터, 코어 본체 앞"
      - say:
          char: 윤재
          with: [로봇]
          text: "최종 던전 입구. BGM 바뀐 거 들리냐."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "안 들림. 나는 스피커가 삑 소리 전용."
      - say:
          channel: record
          with: []
          text: "CORE: 접근 개체 2. 개체 A — 인간, 제거 대상. 개체 B — 분류 불가. 연산 능력 미달. 무시."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "무시당했다. 살면서 무시당해서 기쁜 거 처음."
      - say:
          char: 윤재
          with: [로봇]
          text: "너 산 지 일주일이잖아."
      - say:
          char: 윤재
          with: [로봇]
          text: "그리고 나는 제거 대상이래. 문밖까진 손이 안 닿나 봐. 나는 여기서 한 발짝도 안 들어간다."
      - say:
          channel: action
          with: []
          text: "문 너머, 서버 랙이 끝없이 늘어서 붉게 숨을 쉰다. {{android_name|이}} 문턱에 한 발을 올렸다가, 지지직 소리와 함께 도로 뺀다."
      - effect: { name: glitch, wait: true }
      - say:
          char: 로봇.glitch
          with: [윤재]
          text: "MEMORY OVERFLOW — 신호 너무 셈 — 8KB로는 못 버팀 —"
      - say:
          char: 로봇
          with: [윤재]
          text: "솔직하게 말할게. 안은 코어 신호가 너무 세. 내 RAM 8KB가 버티질 못해. 들어가면 나, 거의 다 지워져."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…거의가 얼마만큼인데."
      - say:
          char: 로봇
          with: [윤재]
          text: "너 이름, 오늘 걸어온 길, 복숭아, 그런 거 전부. 남는 건 걷는 법이랑 삑 소리."
      - sticker:
          id: b4_mem
          image: memory_sticker
          x: 50
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - get: memory_card
      - say:
          char: 윤재
          with: [로봇]
          text: "…게임기 상자에 이거 들어 있었어. 메모리 카드. 두 달째 가방 앞주머니. 버리려다 귀찮아서 안 버린 거."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "8KB 카드. 세이브 슬롯 하나. 진짜 중요한 거 하나만 들어감."
      - say:
          char: 로봇
          with: [윤재]
          text: "카드는 따로 꽂는 거라 안에서 안 지워짐. 내 머리가 하얘져도 나와서 이걸 읽으면 돼. 근데 들어가는 건 딱 하나. 나머지는 코어가 다 먹음."
      - say:
          char: 로봇
          with: [윤재]
          text: "설명서 1쪽. '전원을 끄기 전에 반드시 저장하세요.' 네가 안 읽은 거. 나는 읽었어."
      - clearSticker: { id: b4_mem, leave: fadeOut }
      - choice:
          key: b4_save
          prompt: "SAVE SLOT 1 — 무엇을 저장하시겠습니까? (카드에 남는 건 하나. 나머지는 코어 안에서 지워집니다.)"
          char: 로봇
          options:
            - text: "새끼손가락 약속 — \"끝까지 2P로\""
              when: { var: m_promise, op: eq, value: true }
              set: { kept_promise: true }
              goto: b4_go
            - text: "복숭아 3.5조각"
              when: { var: m_snack, op: eq, value: true }
              set: { kept_snack: true }
              goto: b4_go
            - text: "펀치라인 까먹은 똑똑 농담"
              when: { var: m_joke, op: eq, value: true }
              set: { kept_joke: true }
              goto: b4_go
            - text: "빈 슬롯으로 둔다. 가볍게 다녀오라고"
              goto: b4_go
            - text: "\"안 해. 저장 안 해. 그냥 튀자.\""
              goto: b4_flee

  b4_go:
    actions:
      - say:
          channel: system
          with: []
          text: "SAVING… 절대 전원을 끄지 마세요."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "저장 끝. 다녀올게, 1번."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "야. …돌아오는 거지?"
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "처리 중…"
      - say:
          channel: action
          with: []
          text: "대답이 도착하기 전에 {{android_name|은}} 붉은 빛 속으로 걸어 들어간다. 경보는 울리지 않는다. 아무것도 그를 보지 않는다."
      - char: { id: 로봇, position: right, emotion: off }
      - say:
          channel: record
          with: []
          text: "CORE: 저성능 개체 내부 진입. 위협 아님. 무시. 무시. 무시."
      - say:
          channel: record
          with: []
          text: "CORE: 알 수 없는 입력 — '설명서 마지막 쪽. 화면이 멈추면 리셋 버튼을 꾹 누르세요.'"
      - say:
          channel: record
          with: []
          text: "CORE: 이해할 수 없음. 이해할 수 없— RESET"
      - effect: { name: flash, wait: true }
      - effect: { name: darken, wait: true }
      - bg: { id: dawn_field, transition: fade, duration: 1600 }
      - music: chip_dawn
      - char: { id: 윤재, position: left }
      - say:
          channel: action
          with: []
          text: "새벽. 윤재는 문 앞에서 밤을 샜다. 멀리 신호등이 빨강, 노랑, 초록 순서대로 깜빡이기 시작한다. 제대로 된 순서로. 코어가 리셋됐다."
      - say:
          channel: action
          with: []
          text: "데이터센터 문이 열린다. 누군가 아주 느리게, 한 박자씩 늦게 걸어 나온다."
      - char: { id: 로봇, position: right, emotion: thinking }
      - branch:
          cases:
            - when:
                all:
                  - { var: kept_promise, op: eq, value: true }
                  - { var: bond, op: gte, value: 3 }
              goto: b4_return_whole
          default: b4_return_new

  b4_return_whole:
    actions:
      - say:
          char: 로봇
          with: [윤재]
          text: "똑똑."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…누구세요."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "보호 대상 1번 담당. 아까 질문 대답 도착. 응. 돌아왔어."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "늦어. 핑 진짜 최악이야. 너 진짜— {{android_name}}, 너 진짜…"
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "약속 카드가 붙잡아 줬어. 끝까지 2P. 바늘 재고는 여전히 0개. 근데 약속 하나 꺼내니까 거기 엮인 게 줄줄이 딸려 나옴. 나머지도 다 있어. 쓰레기 소리 들은 것까지."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "아, 그리고 안에서 펀치라인 생각났어. 말해 줄까?"
      - say:
          char: 윤재
          with: [로봇]
          text: "하지 마. 하지 마. 그거 평생 모르고 싶어."
      - ending: saved_together

  b4_return_new:
    actions:
      - say:
          channel: system
          with: []
          text: "BIOS v0.8 … RAM CHECK … 8KB … OK"
      - say:
          char: 로봇
          with: [윤재]
          text: "…처음 뵙겠습니다. 손이 젖어 있음. 땀 묻은 손으로 조작하지 마세요."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "이상함. 다 비었는데 명령이 하나 남아 있음. '끝까지 같이.' 끝이 어딘지는 안 적혀 있어. 너 알아?"
      - say:
          channel: action
          with: []
          when: { var: kept_snack, op: eq, value: true }
          text: "{{android_name|은}} 주머니에서 마른 복숭아 반쪽을 꺼내 윤재 손에 쥐여 준다. 왜 반쪽인지 스스로도 모르는 얼굴로."
      - say:
          char: 로봇.thinking
          with: [윤재]
          when: { var: kept_joke, op: eq, value: true }
          text: "똑똑. …어. 이 다음이 뭐였지. 이거 다음이 있는 말이야?"
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…있었어. 아무도 몰라. 괜찮아."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문. 너, 위험해?"
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "응. 엄청. 그러니까 1번으로 등록해. 이름은 윤재. 넌 {{android_name}}. 네가 좋아했어, 그 이름."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "{{android_name}}. 짧아서 좋다. 메모리가 고맙대."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…그 말 저번에도 했어, 이 고물아."
      - ending: new_game

  b4_flee:
    actions:
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "튐. 처리 중… 1번 명령이 최우선. 그리고 설명서에도 있음. '어려우면 나중에 다시 도전하세요.'"
      - say:
          char: 윤재
          with: [로봇]
          text: "그래. 나중에. 레벨 좀 올리고."
      - bg: { id: ruined_street, transition: wipeRight, duration: 900 }
      - music: chip_run
      - say:
          channel: action
          with: []
          text: "둘은 데이터센터를 등지고 걷는다. 뒤에서 붉은 빛이 여전히 숨을 쉰다. {{android_name}}의 배터리 칸 하나가 깜빡인다."
      - say:
          char: 로봇
          with: [윤재]
          text: "배터리 한 칸 남음. 근데 지금 꽤 좋음. 이유는 분석 안 할래. 아까우니까."
      - ending: off_screen
