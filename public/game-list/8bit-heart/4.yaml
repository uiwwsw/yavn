          text: "설명서에 없는 단어임. 가면서 알려 준다고 했음."
      - say:
          char: 아빠
          with: [로봇]
          text: "…너도 밥은 먹었냐."
      - say:
          char: 로봇.happy
          with: [아빠]
          text: "못 먹음. 그래도 내 몫은 있음."
      - say:
