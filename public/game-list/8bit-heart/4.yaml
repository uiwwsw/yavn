chapterTitle: "저장하시겠습니까"

script:
  - scene: core

scenes:
  core:
    actions:
      - say:
          channel: card
          with: []
          text: "FINAL STAGE\n집을 나선 지 나흘\n서울역 지하"
      - bg: { id: datacenter, transition: cut }
      - music: chip_core
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right }
      - place: "오후 6시 · 서울역 지하 3층 관제실 앞"
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_snack, op: eq, value: false }
          text: "가방 가벼움. 아껴 둔 복숭아도 다음 날 아침에 다 먹었고."
      - say:
          char: 윤재
          with: [로봇]
          text: "네가 말한 드론 신호가 여기서 나오는 거지? 최종 던전 입구네. 브금 한번 요란하다."
      - emote: { id: 윤재, motion: shiver }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "BGM 없음."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "들리는 거: 서버 팬 소리, 네 심장 소리."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "둘 다 너무 빠름."
      - say:
          char: 윤재
          with: [로봇]
          text: "심장 소리를 왜 들어. 그거 측정하지 말랬지."
      - say:
          channel: record
          with: []
          text: "CORE: 접근 개체 2. 개체 A — 인간, 제거 대상. 개체 B — 분류 불가. 연산 능력 미달. 무시."
      - wait: 270
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "무시당했다."
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "살면서 무시당해서 기쁜 거 처음."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "살면서래. 너 깨어난 지 나흘이야."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "나흘이 내 전부임."
      - say:
          char: 로봇
          with: [윤재]
          text: "전부 중에 처음이면 처음 맞음."
      - say:
          char: 윤재
          with: [로봇]
          text: "그리고 나는 제거 대상이래. 문밖까진 손이 안 닿나 봐."
      - say:
          char: 윤재
          with: [로봇]
          text: "나는 여기서 한 발짝도 안 들어간다. 한 발짝도."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_promise, op: eq, value: true }
          text: "적어 둔 대로임. 문 앞까지 1P 동행."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_promise, op: eq, value: false }
          text: "'내일 얘기해'는 나흘째 안 왔음."
      - say:
          char: 윤재
          with: [로봇]
          when: { var: m_promise, op: eq, value: false }
          text: "…네가 먼저 걸어갔잖아. 따라오면서 생각했어. 아직 생각 중이야."
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 정찰."
      - say:
          char: 로봇
          with: [윤재]
          text: "한 발만."
      - move: { id: 로봇, toward: camera, style: approach, wait: true }
      - effect: { name: glitch, wait: true }
      - move: { id: 로봇, style: reset }
      - say:
          char: 로봇.glitch
          with: [윤재]
          text: "MEMORY OVERFLOW — 신호 너무 셈 — 8KB로는 못 버팀 —"
      - effect: damage
      - mood: { tone: dread, level: 2 }
      - say:
          char: 윤재.scared
          motion: gasp
          with: [로봇]
          text: "나와! 나오라고! 손 줘, 손!"
      - wait: 460
      - say:
          char: 로봇
          with: [윤재]
          text: "솔직하게 말할게."
      - say:
          char: 로봇
          with: [윤재]
          text: "드론 한 대가 훑었을 때 헌법 한 칸 날아갔음."
      - say:
          char: 로봇
          with: [윤재]
          text: "안에는 그 신호가 전부 모여 있음."
      - say:
          char: 로봇
          with: [윤재]
          text: "인터넷에는 안 붙었는데도, 저 신호가 가까우면 기억을 읽을 수가 없어."
      - say:
          char: 로봇
          with: [윤재]
          text: "들어가면 나, 거의 다 지워져."
      - say:
          char: 윤재.sad
          motion: sway
          with: [로봇]
          text: "…얼마나 지워지는데."
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 로봇
          with: [윤재]
          text: "네 이름, 여기까지 걸어온 길, 복숭아, 그런 거 전부."
      - say:
          char: 로봇
          with: [윤재]
          text: "규칙 1번부터 14번까지 전부."
      - say:
          char: 로봇
          with: [윤재]
          text: "헌법도 포함."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "헌법은 못 고치는 칸이라며. 네가 그랬잖아."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "못 고침."
      - say:
          char: 로봇
          with: [윤재]
          text: "그래도 지워지긴 함. 한 번 봤잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "확실히 남는 건 본체에 처음부터 있던 기능. ROM이라고 함."
      - say:
          char: 로봇
          with: [윤재]
          text: "걷는 법이랑 삑 소리."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…그럼 네가 아니잖아. 걷는 거랑 삑 소리는 아무나 하는 거잖아."
      - sticker:
          id: b4_mem
          image: memory_sticker
          x: 50
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - get: memory_card
      - say:
          char: 윤재
          with: [로봇]
          text: "중고 게임기랑 같이 온 거야."
      - say:
          char: 윤재
          with: [로봇]
          text: "메모리 카드. 설명서랑 같이 처박아 둔 거."
      - wait: 460
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "8KB 카드."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "세이브 슬롯 하나."
      - mood: off
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "카드에 쓰고 나면 뺄 수 있음. 코어에 들어갈 동안 읽기 전용으로 잠가 둘게."
      - say:
          char: 윤재.excited
          motion: perk
          with: [로봇]
          text: "그럼 다 넣으면 되잖아. 전부 다. 8KB면 글자는 많이 들어가."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "문제는 배터리."
      - say:
          char: 로봇
          with: [윤재]
          text: "화면의 글자만 옮기는 게 아님. 그때 본 것하고 들은 것도 같이 옮겨야 함."
      - say:
          char: 로봇
          with: [윤재]
          text: "느림."
      - say:
          char: 로봇
          with: [윤재]
          text: "다 옮기면 안에 걸어 들어갈 힘이 안 남음."
      - say:
          char: 로봇
          with: [윤재]
          text: "옮길 수 있는 건 딱 하나."
      - wait: 0
      - say:
          char: 로봇
          with: [윤재]
          text: "나머지는 들어가면 못 읽게 됨. 남아 있는지조차 확인 못 함."
      - say:
          char: 윤재
          with: [로봇]
          text: "…그럼 건전지를 더 구하면 되잖아."
      - say:
          char: 윤재
          with: [로봇]
          text: "편의점 가면 또 있을 거야. 내가 뛰어갔다 올게."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "여기까지 나흘 걸렸음."
      - say:
          char: 로봇
          with: [윤재]
          text: "왕복 여드레."
      - say:
          char: 로봇
          with: [윤재]
          text: "그동안 코어는 계속 사람 찾음."
      - say:
          char: 윤재
          motion: slump
          with: [로봇]
          text: "…계산 좀 그만해. 그만하라고 좀."
      - wait: 460
      - say:
          char: 로봇
          with: [윤재]
          text: "설명서 1쪽."
      - say: { char: 로봇, with: [윤재], text: "'전원을 끄기 전에 반드시 저장하세요.'" }
      - say:
          char: 로봇
          with: [윤재]
          text: "네가 안 읽은 거."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say:
          char: 윤재
          with: [로봇]
          text: "…알았어. 괜찮아. 진짜. 진짜 괜찮아."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "…그 '진짜'가 두 번이야."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그 칸에 넣을게."
      - say:
          char: 윤재
          motion: stomp
          with: [로봇]
          text: "그 칸 지우라고 했잖아! 왜 안 지웠어!"
      - emote: { id: 윤재, motion: droop }
      - say:
          char: 로봇
          with: [윤재]
          text: "안 지웠어."
      - say:
          char: 로봇
          with: [윤재]
          text: "제일 자주 쓴 칸이라서."
      - say:
          char: 로봇
          with: [윤재]
          text: "그래도 갈 거야."
      - say:
          char: 로봇
          with: [윤재]
          text: "1번이 거짓말할 땐 1번이 무서운 거라서."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: true }
          with: [로봇]
          text: "…야. 들어가서 모르는 거 생기면 그냥 나와. 내가 알려 줄게."
      - wait: 270
      - say:
          char: 로봇.thinking
          when: { var: answered_haru, op: eq, value: true }
          with: [윤재]
          text: "믿어도 됨?"
      - say:
          char: 로봇.thinking
          when: { var: answered_haru, op: eq, value: true }
          with: [윤재]
          text: "저번엔 아니라고 했음."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: true }
          with: [로봇]
          text: "…이번엔 어."
      - say:
          char: 윤재
          when: { var: answered_haru, op: eq, value: false }
          with: [로봇]
          text: "…모르는 거 생기면 그냥 지나가. 대답 못 하는 것도 있어."
      - wait: 720
      - say:
          char: 로봇
          with: [윤재]
          text: "안 들어가면 계속 저 소리 남. 저건 내가 끌 수 있음."
          wait: 910
          unskippable: true
      - move: { id: 윤재, style: reset }
      - say: { char: 로봇, with: [윤재], text: "들어가기 전에 점검. 설명서 2쪽, 사용 전 확인 사항." }
      - say: { char: 윤재, with: [로봇], text: "설명서도 읽어 가면서 들어가냐." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "너 읽기 싫어하니까 내가 다 봐 뒀음." }
      - say: { char: 로봇, with: [윤재], text: "건전지 붙인 테이프, 아직 안 떨어짐. 네가 꾹꾹 눌러 붙였음." }
      - say: { char: 윤재, with: [로봇], text: "두 번 감았잖아. 문 안에서 떨어지면 안 되니까." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "문 안에서 전원이 끊기면 여기까지 못 돌아옴. 두 칸은 남겨 둘게." }
      - wait: 0
      - wait: 0
      - say: { char: 로봇, with: [윤재], text: "화면 모서리는 아직 안 나옴. 네가 밤새 붙였는데 거기만 안 됐음." }
      - say: { char: 윤재.sad, with: [로봇], text: "그건 나와서 고치자. 불 밝은 데 가서. 손전등도 있고." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "지금 글자 다 나옴. 나한테는 이만큼이면 됨." }
      - say: { char: 로봇.thinking, with: [윤재], text: "은박지 차폐도 아직 붙어 있음. 문 안에서 떨어지면 다시 눌러 볼게." }
      - say: { char: 윤재, with: [로봇], text: "어. 떨어지면 먼저 눌러 봐. 세게. 내가 했던 것처럼." }
      - wait: 270
      - wait: 0
      - wait: 0
      - say: { char: 윤재.sad, with: [로봇], text: "…이렇게 엉성해서 너만 들어갈 수 있는 거야." }
      - wait: 270
      - say: { char: 로봇.thinking, with: [윤재], text: "카드 점검. 빈 카드 아님. 이미 뭐가 들어 있음." }
      - say: { char: 윤재, motion: perk, with: [로봇], text: "…그거 아직 읽혀? 전원 끄기 직전에 눌러서 안 된 줄 알았는데." }
      - say: { channel: system, with: [], text: "SAVE SLOT 1\nHI-SCORE 0999990" }
      - say: { char: 윤재, motion: freeze, with: [로봇], text: "…" }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "구십구만 구천구백구십 점. 십 점 남음." }
      - say: { char: 윤재, with: [로봇], text: "…그거 왜 거기 있어." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "카드에 저장 시각이 남아 있음. 내가 켜지기 전임." }
      - say: { char: 로봇, with: [윤재], text: "칩 떼기 직전에 네가 넣은 거임. 나는 못 봤고, 카드가 봤음." }
      - say: { char: 윤재.sad, motion: droop, with: [로봇], text: "…미련 없는 줄 알았어." }
      - wait: 270
      - say: { char: 로봇.thinking, with: [윤재], text: "미련 없는 사람은 점수를 카드에 안 옮김. 설명서엔 없는데 그건 계산됨." }
      - say: { char: 윤재, motion: stomp, with: [로봇], text: "…계산 좀 그만하라니까." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "응." }
      - say: { channel: system, with: [], text: "슬롯이 하나입니다. 저장하면 기존 데이터를 덮어씁니다.\n덮어쓰시겠습니까?" }
      - say: { char: 윤재, with: [로봇], text: "하나밖에 없어? 하나?" }
      - wait: 460
      - say: { char: 로봇, with: [윤재], text: "8KB. 하나. 설명서 3쪽." }
      - say: { char: 윤재, with: [로봇], text: "…덮어써. 어차피 그 점수로 이어 할 일 없잖아." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "10년 뒤에 같은 게임을 해도 저 점수는 네 기록으로 남음." }
      - say: { char: 윤재.sad, with: [로봇], text: "네 머리에 꽂아 놨잖아. 그걸로 어떻게 다시 게임하냐." }
      - wait: 270
      - say: { char: 로봇.thinking, motion: freeze, with: [윤재], text: "…처리 중." }
      - say: { char: 로봇, with: [윤재], text: "맞음. 계산 끝. 덮어쓸 거 고르자." }
      - say: { char: 로봇, with: [윤재], text: "지금 RAM에 들어 있는 거 읽어 줄게. 들어가면 이 목록도 못 읽음." }
      - say:
          channel: record
          with: []
          when: { var: m_promise, op: eq, value: true }
          text: "RAM 03 · 새끼손가락 · \"끝까지 2P로\" · 바늘 재고 0개"
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_promise, op: eq, value: true }
          text: "이건 명령처럼 생겼는데 명령 칸에 안 들어감."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_promise, op: eq, value: true }
          text: "그래서 따로 둠."
      - say:
          channel: record
          with: []
          when: { var: m_snack, op: eq, value: true }
          text: "RAM 07 · 복숭아 3.5조각 · 오차 0 · 분배 완료"
      - wait: 460
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_snack, op: eq, value: true }
          text: "반 나누기는 ROM에 남음."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_snack, op: eq, value: true }
          text: "누구랑 나눴는지는 RAM에 있음."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_snack, op: eq, value: true }
          text: "그건 카드에 안 넣으면 다시 찾을 수 있을지 모름."
      - say:
          channel: record
          with: []
          when: { var: m_joke, op: eq, value: true }
          text: "RAM 11 · 똑똑 농담 · 앞부분만 · 펀치라인 없음"
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_joke, op: eq, value: true }
          text: "끝에 아무 말도 안 들어 있는데, 조회 횟수는 이게 1등임."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: m_joke, op: eq, value: true }
          text: "통계가 이상함."
      - say:
          char: 로봇
          with: [윤재]
          when:
            all:
              - { var: m_promise, op: eq, value: true }
              - { var: m_snack, op: eq, value: true }
              - { var: m_joke, op: eq, value: true }
          text: "8KB에 세 개가 겨우 들어감. 전부 네 거임."
      - say:
          char: 로봇
          with: [윤재]
          when:
            all:
              - { var: m_promise, op: eq, value: false }
              - { var: m_snack, op: eq, value: false }
              - { var: m_joke, op: eq, value: false }
          text: "따로 넣어 둘 만한 기록은 없음."
      - say:
          char: 윤재.sad
          with: [로봇]
          when:
            all:
              - { var: m_promise, op: eq, value: false }
              - { var: m_snack, op: eq, value: false }
              - { var: m_joke, op: eq, value: false }
          text: "…같이 뭐라도 좀 할걸. 맨날 걷기만 시켰네."
      - say:
          char: 로봇
          with: [윤재]
          when:
            all:
              - { var: m_promise, op: eq, value: false }
              - { var: m_snack, op: eq, value: false }
              - { var: m_joke, op: eq, value: false }
          text: "저장 안 해도 들어갈 수는 있음."
      - say: { char: 윤재, with: [로봇], text: "…하나만 고르라고. 하나만." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "고르는 건 1P. 그건 ROM에 있어서 못 지움." }
      - clearSticker: { id: b4_mem, leave: fadeOut }
      - choice:
          key: b4_save
          prompt: "SAVE SLOT 1\n카드를 준비하면 최고 점수는 지워진다. 새 기억은 하나만 남길 수 있다."
          char: 로봇
          options:
            - text: "새끼손가락 약속"
              saveText: "새끼손가락 약속 — \"끝까지 2P로\""
              when: { var: m_promise, op: eq, value: true }
              set: { kept_promise: true }
              goto: b4_go
            - text: "복숭아 3.5조각"
              when: { var: m_snack, op: eq, value: true }
              set: { kept_snack: true }
              goto: b4_go
            - text: "똑똑 농담"
              saveText: "펀치라인 까먹은 똑똑 농담"
              when: { var: m_joke, op: eq, value: true }
              set: { kept_joke: true }
              goto: b4_go
            - text: "슬롯을 비워 둔다"
              saveText: "빈 슬롯으로 둔다. 가볍게 다녀오라고"
              goto: b4_go
            - text: "저장을 그만두고 도망친다"
              saveText: "\"안 해. 저장 안 해. 그냥 튀자.\""
              goto: b4_flee

  b4_go:
    actions:
      - say:
          channel: system
          with: []
          text: "메모리 카드 준비 중… 전원을 끄지 마세요."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "카드 꽂음."
      - say:
          char: 로봇
          with: [윤재]
          text: "네가 껌 은박 감아 놓은 자리에 딱 맞음."
      - say:
          char: 로봇
          with: [윤재]
          text: "…슬롯 확인 중."
      - say:
          char: 로봇
          with: [윤재]
          text: "먼저 기존 기록을 지울게."
      - say:
          char: 로봇
          with: [윤재]
          text: "배터리 한 칸 씀."
      - say: { channel: system, with: [], text: "기존 데이터 삭제 중…\nHI-SCORE 0999990 — 삭제됨" }
      - say: { char: 윤재, motion: freeze, with: [로봇], text: "…" }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "지워졌음. 이제 최고 점수 칸 비었음." }
      - say: { char: 윤재, with: [로봇], text: "…어. 괜찮아." }
      - wait: 270
      - say: { char: 로봇.thinking, with: [윤재], text: "'진짜' 안 붙였음. 이번엔 믿을게." }
      - say: { channel: system, with: [], text: "카드 처리 중 ▓▓▓▓░░░░ 48%" }
      - say: { char: 윤재, with: [로봇], text: "야, 더 빨리 안 되냐. 반도 안 갔어." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "기록 칸을 하나씩 확인 중임. 잠깐만." }
      - say: { char: 윤재, with: [로봇], text: "틀리면 어떻게 되는데." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "틀린 채로 남음. 그게 제일 안 좋음." }
      - say:
          channel: system
          with: []
          when:
            any:
              - { var: kept_promise, op: eq, value: true }
              - { var: kept_snack, op: eq, value: true }
              - { var: kept_joke, op: eq, value: true }
          text: "기억 1건 저장 완료 ▓▓▓▓▓▓▓▓ 100%\n배터리 ▓▓░░ 2/4"
      - say:
          channel: system
          with: []
          when:
            all:
              - { var: kept_promise, op: eq, value: false }
              - { var: kept_snack, op: eq, value: false }
              - { var: kept_joke, op: eq, value: false }
          text: "슬롯 비어 있음 · 카드 준비 완료\n배터리 ▓▓░░ 2/4"
      - wait: 720
      - say:
          char: 로봇.happy
          motion: bow
          with: [윤재]
          text: "다 됐어. 다녀올게, 윤재."
          wait: 1170
          unskippable: true
      - say:
          char: 윤재.sad
          motion: recoil
          with: [로봇]
          text: "…이름은 왜 지금 불러. 1번이라며."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "1번은 슬롯 이름이고, 윤재는 네 이름임."
      - say:
          char: 로봇
          with: [윤재]
          text: "둘 다 맞음."
      - say:
          char: 로봇
          with: [윤재]
          text: "아껴 뒀음."
      - say:
          char: 로봇
          with: [윤재]
          text: "아무 때나 부르고 싶지 않았음."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "야. …돌아오는 거지?"
      - move: { id: 윤재, toward: 로봇, style: lunge }
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재]
          text: "처리 중…"
      - sticker:
          id: b4_hands
          image: hands_apart_sticker
          x: 50
          y: 32
          width: "clamp(200px, 32%, 410px)"
          enter: fadeIn
          inputLockMs: 300
      - say:
          channel: action
          with: []
          when: { var: m_promise, op: eq, value: false }
          text: "윤재가 그제야 새끼손가락을 내민다."
      - move: { id: 로봇, toward: camera, style: retreat, wait: true }
      - say:
          channel: action
          with: []
          text: "대답이 도착하기 전에 {{android_name|은}} 문 안으로 걸어 들어간다."
      - clearSticker: { id: b4_hands, leave: fadeOut }
      - char: { id: 로봇, position: right, emotion: off }
      - say:
          channel: record
          with: []
          text: "CORE: 저성능 개체 내부 진입. 위협 아님. 무시. 무시. 무시."
      - say:
          channel: record
          with: []
          text: "CORE: 현장 재가동 버튼 눌림. 1초… 2초…"
      - say:
          channel: record
          with: []
          text: "CORE: 3초. 최근 업데이트 삭제. 초기 상태 복원 중… 연결된 기기 정지."
      - wait: 0
      - say: { channel: card, with: [], text: "다음 날 새벽 · 서울역", autoAdvance: 1300 }
      - bg: { id: dawn_field, transition: cut }
      - music: chip_dawn
      - char: { id: 윤재, position: left }
      - place: "오전 6시 · 서울역 대합실"
      - say: { channel: thought, with: [], text: "밤새 문만 봤다. 손을 내밀면 바로 잡을 수 있게, 자꾸 손바닥을 바지에 닦았다." }
      - say: { channel: action, with: [], text: "대합실 전광판에서 같은 광고가 꺼진다. 한참 만에 첫 열차 시각이 뜬다." }
      - say: { channel: thought, with: [], text: "전광판이 돌아왔으면 집 전화도 신호가 갈까. 현관 문짝에는 ‘서울역’이라고 써 두고 왔다." }
      - say:
          channel: action
          with: []
          text: "문이 열린다. 발을 끄는 소리가 난다. 다음 발소리까지가 길다."
      - char: { id: 로봇, position: right, emotion: thinking }
      - move: { id: 로봇, toward: 윤재, style: approach, wait: true }
      - branch:
          cases:
            - when:
                all:
                  - { var: kept_promise, op: eq, value: true }
                  - { var: bond, op: gte, value: 3 }
              goto: b4_return_whole
          default: b4_return_new

  b4_return_whole:
    actions:
      - say:
          char: 로봇
          with: [윤재]
          text: "똑똑."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…누구세요."
      - wait: 270
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "보호 대상 1번 담당."
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "아까 질문 대답 도착."
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "응."
      - mood: { tone: warm, level: 2 }
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "돌아왔어."
      - say:
          char: 윤재.excited
          motion: sob
          with: [로봇]
          text: "늦어. 핑 진짜 최악이야. 열두 시간이야 열두 시간."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "너 진짜— {{android_name}}, 너 진짜…"
      - move: { id: 윤재, toward: 로봇, style: lunge }
      - say:
          char: 윤재
          motion: nod
          with: [로봇]
          text: "…고마워. 한 번만 말한다. 저장하든가."
          wait: 1040
          unskippable: true
      - wait: 720
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재]
          text: "잠깐. 한 칸 비움."
          wait: 780
          unskippable: true
      - say: { channel: system, with: [], text: "메모리 카드 읽기\nSAVE SLOT 1 · 데이터 있음" }
      - wait: 270
      - say: { char: 로봇.happy, with: [윤재], text: "카드 읽었음. 들어갈 때 넣은 거 그대로 있음. 글자 안 틀렸음." }
      - say: { char: 윤재, with: [로봇], text: "…하이스코어 자리에." }
      - wait: 270
      - say: { char: 로봇, with: [윤재], text: "응. 거기." }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "카드에 적힌 약속을 읽었어."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "끝까지 2P."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "바늘 재고는 여전히 0개."
      - say:
          char: 로봇
          with: [윤재]
          text: "그걸 읽으니까 새끼손가락에 네가 걸었던 힘부터 떠오름."
      - say:
          char: 로봇
          with: [윤재]
          text: "하나가 생각나니까 다른 것도 났음. 네가 손가락 거는 법 알려 준 거. 아프니까 중요하다고 한 거."
      - mood: off
      - say:
          char: 로봇
          with: [윤재]
          text: "쓰레기 소리 들은 것까지."
      - say:
          char: 윤재
          with: [로봇]
          text: "그건 좀 버려도 됐는데."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "안 버림."
      - say:
          char: 로봇
          with: [윤재]
          text: "그 소리 듣고 문 안에 들어갔음."
      - say:
          char: 로봇.thinking
          motion: lean_in
          with: [윤재]
          text: "아, 그리고 안에서 펀치라인 생각났어."
      - say:
          char: 로봇.thinking
          motion: lean_in
          with: [윤재]
          text: "지금 말해도 됨?"
      - emote: { id: 윤재, motion: shake, repeat: 2 }
      - say:
          char: 윤재
          with: [로봇]
          text: "하지 마. 하지 마. 그거 평생 모르고 싶어."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 안 함."
      - say:
          char: 로봇
          with: [윤재]
          text: "대신 안 쓴 칸에 넣어 둠."
      - say:
          char: 로봇
          with: [윤재]
          text: "언젠가 네가 물어볼 수도 있으니까."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "안 물어봐. 평생 안 물어봐. 진짜. 진짜 안 물어봐."
      - wait: 270
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "'진짜' 두 번."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - goto: b4_dad

