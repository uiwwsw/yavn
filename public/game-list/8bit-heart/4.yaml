      - say:
          char: 로봇
          motion: headtilt
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "기록이 거의 다 비었는데 이 말은 남아 있음."
      - say:
          char: 로봇
          motion: headtilt
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "'끝까지 2P.'"
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "끝이 어딘지는 안 적혀 있어."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "너 알아?"
      - say:
          char: 윤재.sad
          with: [로봇]
          when: { var: kept_promise, op: eq, value: true }
          text: "…응. 알아. 아직 멀었어."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
