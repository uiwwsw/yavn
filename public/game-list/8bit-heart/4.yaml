chapterTitle: "저장하시겠습니까"

script:
  - scene: core

scenes:
  core:
    actions:
      - bg: { id: datacenter, transition: fade, duration: 900 }
      - music: chip_core
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right }
      - say:
          channel: card
          with: []
          text: "FINAL STAGE · 나흘 뒤"
      - place: "북쪽 데이터센터 · 코어 본체 앞"
      - say:
          char: 윤재
          with: [로봇]
          text: "최종 던전 입구. BGM 바뀐 거 들리냐."
      - emote: { id: 윤재, motion: shiver }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "BGM 없음. 들리는 거: 서버 팬 소리, 네 심장 소리. 둘 다 너무 빠름."
      - say:
          char: 윤재
          with: [로봇]
          text: "심장 소리를 왜 들어. 그거 측정하지 말랬지."
      - say:
          channel: record
          with: []
          text: "CORE: 접근 개체 2. 개체 A — 인간, 제거 대상. 개체 B — 분류 불가. 연산 능력 미달. 무시."
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "무시당했다. 살면서 무시당해서 기쁜 거 처음."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "살면서래. 너 깨어난 지 일주일이야."
      - say:
          char: 로봇
          with: [윤재]
          text: "일주일이 내 전부임. 전부 중에 처음이면 처음 맞음."
      - say:
          char: 윤재
          with: [로봇]
          text: "그리고 나는 제거 대상이래. 문밖까진 손이 안 닿나 봐."
      - say:
          char: 윤재
          with: [로봇]
          text: "나는 여기서 한 발짝도 안 들어간다. 한 발짝도."
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 정찰. 한 발만."
      - move: { id: 로봇, toward: camera, style: approach, wait: true }
      - effect: { name: glitch, wait: true }
      - move: { id: 로봇, style: reset }
      - say:
          char: 로봇.glitch
          with: [윤재]
          text: "MEMORY OVERFLOW — 신호 너무 셈 — 8KB로는 못 버팀 —"
      - say:
          char: 윤재.scared
          motion: gasp
          with: [로봇]
          text: "나와! 나오라고! 손 줘, 손!"
      - say:
          char: 로봇
          with: [윤재]
          text: "솔직하게 말할게. 안은 코어 신호가 너무 세. 내 RAM 8KB가 버티질 못해."
      - say:
          char: 로봇
          with: [윤재]
          text: "들어가면 나, 거의 다 지워져."
      - say:
          char: 윤재.sad
          motion: sway
          with: [로봇]
          text: "…거의가 얼마만큼인데."
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 로봇
          with: [윤재]
          text: "네 이름, 여기까지 걸어온 길, 복숭아, 그런 거 전부."
      - say:
          char: 로봇
          with: [윤재]
          text: "규칙 1번부터 14번까지 전부. 헌법도 포함."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "헌법은 안 바뀌는 칸이라며. 네가 그랬잖아."
      - say:
          char: 로봇
          with: [윤재]
          text: "안 바뀜. 근데 지워지는 건 바뀌는 거랑 다름."
      - say:
          char: 로봇
          with: [윤재]
          text: "남는 건 본체 ROM. 걷는 법이랑 삑 소리."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…그럼 네가 아니잖아. 걷는 거랑 삑 소리는 아무나 하는 거잖아."
      - sticker:
          id: b4_mem
          image: memory_sticker
          x: 50
          y: 30
          width: "clamp(140px, 18%, 240px)"
          enter: popIn
          inputLockMs: 400
      - get: memory_card
      - say:
          char: 윤재
          with: [로봇]
          text: "게임기 상자에 이거 들어 있었어. 메모리 카드. 설명서랑 같이 처박아 둔 거."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "8KB 카드. 세이브 슬롯 하나. 카드는 RAM이랑 따로라서 안에서 안 지워짐."
      - say:
          char: 윤재.excited
          motion: perk
          with: [로봇]
          text: "그럼 다 넣으면 되잖아. 전부 다. 8KB면 글자는 많이 들어가."
      - say:
          char: 로봇
          with: [윤재]
          text: "문제는 배터리. 8비트라 한 글자씩 옮겨 적음. 느림."
      - say:
          char: 로봇
          with: [윤재]
          text: "다 옮기면 안에 걸어 들어갈 힘이 안 남음. 옮길 수 있는 건 딱 하나."
      - say:
          char: 로봇
          with: [윤재]
          text: "하나. 나머지는 코어가 다 먹음."
      - say:
          char: 윤재
          with: [로봇]
          text: "…그럼 건전지를 더 구하면 되잖아. 편의점 가면 또 있을 거야. 내가 뛰어갔다 올게."
      - say:
          char: 로봇
          with: [윤재]
          text: "여기까지 나흘 걸렸음. 왕복 여드레. 그동안 코어는 계속 사람 찾음."
      - say:
          char: 윤재
          motion: slump
          with: [로봇]
          text: "…계산 좀 그만해. 그만하라고 좀."
      - say:
          char: 로봇
          with: [윤재]
          text: "설명서 1쪽. '전원을 끄기 전에 반드시 저장하세요.' 네가 안 읽은 거."
      - emote: { id: 윤재, motion: nod, repeat: 2 }
      - say:
          char: 윤재
          with: [로봇]
          text: "…알았어. 괜찮아. 진짜. 진짜 괜찮아."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "'진짜' 두 번. 저장된 칸이랑 같음. 거짓말."
      - say:
          char: 윤재
          motion: stomp
          with: [로봇]
          text: "그 칸 지우라고 했잖아! 왜 안 지웠어!"
      - emote: { id: 윤재, motion: droop }
      - say:
          char: 로봇
          with: [윤재]
          text: "안 지웠어. 제일 자주 쓴 칸이라서."
      - say:
          char: 로봇
          with: [윤재]
          text: "그래도 갈 거야. 1번이 거짓말할 땐 1번이 무서운 거라서."
      - say:
          char: 로봇
          with: [윤재]
          text: "무서운 건 내가 끄는 게 맞음."
      - move: { id: 윤재, style: reset }
      - clearSticker: { id: b4_mem, leave: fadeOut }
      - choice:
          key: b4_save
          prompt: "SAVE SLOT 1 — 무엇을 저장하시겠습니까? (배터리로 옮길 수 있는 건 하나. 나머지는 코어 안에서 지워집니다.)"
          char: 로봇
          options:
            - text: "새끼손가락 약속 — \"끝까지 2P로\""
              when: { var: m_promise, op: eq, value: true }
              set: { kept_promise: true }
              goto: b4_go
            - text: "복숭아 3.5조각"
              when: { var: m_snack, op: eq, value: true }
              set: { kept_snack: true }
              goto: b4_go
            - text: "펀치라인 까먹은 똑똑 농담"
              when: { var: m_joke, op: eq, value: true }
              set: { kept_joke: true }
              goto: b4_go
            - text: "빈 슬롯으로 둔다. 가볍게 다녀오라고"
              goto: b4_go
            - text: "\"안 해. 저장 안 해. 그냥 튀자.\""
              goto: b4_flee

  b4_go:
    actions:
      - say:
          channel: system
          with: []
          text: "SAVING… 절대 전원을 끄지 마세요."
      - say:
          char: 로봇
          with: [윤재]
          text: "카드 꽂음. 네가 껌 은박 감아 놓은 자리에 딱 맞음."
      - say:
          char: 로봇
          with: [윤재]
          text: "…저장 중. 한 글자씩 가는 중. 배터리 한 칸 씀."
      - say:
          char: 로봇.happy
          motion: bow
          with: [윤재]
          text: "저장 끝. 다녀올게, 윤재."
      - say:
          char: 윤재.sad
          motion: recoil
          with: [로봇]
          text: "…이름은 왜 지금 불러. 1번이라며."
      - say:
          char: 로봇
          with: [윤재]
          text: "1번은 슬롯 이름이고, 윤재는 네 이름임. 둘 다 맞음."
      - say:
          char: 로봇
          with: [윤재]
          text: "아껴 뒀음. 일회용 농담처럼."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "야. …돌아오는 거지?"
      - move: { id: 윤재, toward: 로봇, style: lunge }
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재]
          text: "처리 중…"
      - move: { id: 로봇, toward: camera, style: retreat, wait: true }
      - say:
          channel: action
          with: []
          text: "대답이 도착하기 전에 {{android_name|은}} 문 안으로 걸어 들어간다."
      - char: { id: 로봇, position: right, emotion: off }
      - say:
          channel: record
          with: []
          text: "CORE: 저성능 개체 내부 진입. 위협 아님. 무시. 무시. 무시."
      - say:
          channel: record
          with: []
          text: "CORE: 알 수 없는 입력 — '설명서 마지막 쪽. 화면이 멈추면 리셋 버튼을 꾹 누르세요.'"
      - say:
          channel: record
          with: []
          text: "CORE: 이해할 수 없음. 이해할 수 없— RESET"
      - effect: { name: flash, wait: true }
      - effect: { name: darken, wait: true }
      - bg: { id: dawn_field, transition: fade, duration: 1600 }
      - music: chip_dawn
      - char: { id: 윤재, position: left }
      - place: "새벽 · 데이터센터 문 앞"
      - say:
          char: 윤재
          motion: gasp
          with: []
          text: "…신호등. 빨강, 노랑, 초록. 순서대로 깜빡여. 리셋됐다."
      - say:
          char: 윤재.scared
          motion: lean_in
          with: []
          text: "문 열린다. …뭐가 나와. 엄청 느리게. 한 박자씩 늦게 걷는 거."
      - char: { id: 로봇, position: right, emotion: thinking }
      - move: { id: 로봇, toward: 윤재, style: approach, wait: true }
      - branch:
          cases:
            - when:
                all:
                  - { var: kept_promise, op: eq, value: true }
                  - { var: bond, op: gte, value: 3 }
              goto: b4_return_whole
          default: b4_return_new

  b4_return_whole:
    actions:
      - say:
          char: 로봇
          with: [윤재]
          text: "똑똑."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…누구세요."
      - say:
          char: 로봇.happy
          motion: hop
          with: [윤재]
          text: "보호 대상 1번 담당. 아까 질문 대답 도착. 응. 돌아왔어."
      - say:
          char: 윤재.excited
          motion: sob
          with: [로봇]
          text: "늦어. 핑 진짜 최악이야. 열두 시간이야 열두 시간."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "너 진짜— {{android_name}}, 너 진짜…"
      - move: { id: 윤재, toward: 로봇, style: lunge }
      - say:
          char: 윤재
          motion: nod
          with: [로봇]
          text: "…고마워. 한 번만 말한다. 저장하든가."
      - say:
          char: 로봇.thinking
          motion: freeze
          with: [윤재]
          text: "…처리 중. 이거 처음 듣는 단어임. 칸 하나 새로 만들어야 함."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "약속 카드가 붙잡아 줬어. 끝까지 2P. 바늘 재고는 여전히 0개."
      - say:
          char: 로봇
          with: [윤재]
          text: "근데 약속 하나 꺼내니까 거기 엮인 게 줄줄이 딸려 나옴."
      - say:
          char: 로봇
          with: [윤재]
          text: "나머지도 다 있어. 쓰레기 소리 들은 것까지."
      - say:
          char: 윤재
          with: [로봇]
          text: "그건 좀 버려도 됐는데."
      - say:
          char: 로봇
          with: [윤재]
          text: "안 버림. 그날 네가 두 배 칭찬이라고 했음."
      - say:
          char: 로봇.thinking
          motion: lean_in
          with: [윤재]
          text: "아, 그리고 안에서 펀치라인 생각났어. 말해 줄까?"
      - emote: { id: 윤재, motion: shake, repeat: 2 }
      - say:
          char: 윤재
          with: [로봇]
          text: "하지 마. 하지 마. 그거 평생 모르고 싶어."
      - say:
          char: 로봇
          with: [윤재]
          text: "그럼 안 함. 대신 안 쓴 칸에 넣어 둠. 언젠가 네가 물어볼 수도 있으니까."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "안 물어봐. 평생 안 물어봐. 진짜. 진짜 안 물어봐."
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "'진짜' 두 번."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - ending: saved_together

  b4_return_new:
    actions:
      - say:
          channel: system
          with: []
          text: "BIOS v0.8 … RAM CHECK … 8KB … OK"
      - emote: { id: 윤재, motion: slump }
      - say:
          char: 로봇
          motion: tremble
          with: [윤재]
          text: "1P 감지. 안녕ㅎ— 안녕하ㅅ— …인사말 로딩 실패. 그냥 안녕."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…그 인사 안 고쳤네. 일주일 내내 안 고치더니."
      - say:
          char: 로봇
          motion: headtilt
          with: [윤재]
          text: "손이 젖어 있음. 설명서엔 '땀 묻은 손으로 조작하지 마세요'라고 돼 있음."
      - say:
          char: 로봇
          motion: headtilt
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "이상함. 다 비었는데 명령이 하나 남아 있음. '끝까지 2P.'"
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_promise, op: eq, value: true }
          text: "끝이 어딘지는 안 적혀 있어. 너 알아?"
      - say:
          char: 윤재.sad
          with: [로봇]
          when: { var: kept_promise, op: eq, value: true }
          text: "…응. 알아. 아직 멀었어."
      - say:
          char: 로봇.thinking
          with: [윤재]
          when: { var: kept_snack, op: eq, value: true }
          text: "주머니에 이거 있었음. 마른 복숭아 반쪽. 왜 반쪽인지 모름."
      - say:
          char: 로봇
          with: [윤재]
          when: { var: kept_snack, op: eq, value: true }
          text: "근데 네 거 같음. 받아."
      - say:
          char: 윤재.sad
          with: [로봇]
          when: { var: kept_snack, op: eq, value: true }
          text: "…반쪽 맞아. 근데 그거 네 몫이었어. 네가 안 먹으면서 챙긴 거야."
      - say:
          char: 로봇.thinking
          motion: headtilt
          with: [윤재]
          when: { var: kept_joke, op: eq, value: true }
          text: "똑똑. …어. 이 다음이 뭐였지. 이거 다음이 있는 말이야?"
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "…있었어. 아무도 몰라. 괜찮아."
          when: { var: kept_joke, op: eq, value: true }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문. 너, 위험해?"
      - move: { id: 윤재, toward: 로봇, style: approach }
      - say:
          char: 윤재.sad
          motion: nod
          with: [로봇]
          text: "응. 엄청. 그러니까 1번으로 등록해. 이름은 윤재. 두 글자."
      - say:
          char: 윤재.sad
          with: [로봇]
          text: "넌 {{android_name}}. 네가 좋아했어, 그 이름."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "{{android_name}}. 짧아서 좋다. 메모리가 고맙대."
      - say:
          char: 윤재.sad
          motion: laugh
          with: [로봇]
          text: "…그 말 저번에도 했어, 이 고물아."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "'고물'. 처음 듣는 단어임. 좋은 뜻임?"
      - say:
