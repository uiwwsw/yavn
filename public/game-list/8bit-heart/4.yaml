  b4_dad:
    actions:
      - char: { id: 아빠, position: left }
      - say:
          channel: action
          with: []
          text: "대합실 끝, 승강장으로 내려가는 계단에서 사람이 하나 올라온다. 운동화 밑창이 덜렁거린다."
