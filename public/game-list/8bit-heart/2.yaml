chapterTitle: "이식"

script:
  - scene: workbench

scenes:
  workbench:
    actions:
      - say:
          channel: card
          with: []
          text: "NOW LOADING…\n그날 밤 · 다용도실"
      - bg: { id: bedroom, transition: cut }
      - mood: { tone: dread, level: 1 }
      - place: "그날 밤 · 윤재네 다용도실"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - say: { channel: action, with: [], text: "손전등을 이로 문다. 세탁기 뚜껑 위에 설명서 맨 뒷장을 펴고, 하루 머리 뚜껑의 나사 네 개를 푼다." }
      - say: { channel: action, with: [], text: "머리 안의 칩이 까맣게 그을려 있다. 4년 전 마지막 업데이트 날 그대로다." }
      - say: { channel: thought, with: [], text: "가스 인두는 아빠가 사 준 거다. 처음엔 내 손 위에 자기 손을 얹고 납 녹이는 걸 가르쳐 줬다." }
      - say: { channel: narration, with: [], text: "아래층에서 유리가 깨진다. 누가 웃는다." }
      - say: { channel: thought, with: [], text: "전원, 칩, 가슴 화면. 셋 다 붙어야 켜진다." }
      - goto: b2_parts

  b2_parts:
    actions:
      - branch:
          cases:
            - when: { var: b_battery, op: eq, value: false }
              goto: b2_battery
            - when: { var: b_cpu, op: eq, value: false }
              goto: b2_cpu
            - when: { var: b_screen, op: eq, value: false }
              goto: b2_screen
          default: b2_boot

  b2_battery:
    actions:
      - sticker: { id: b2_bat, image: battery_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say: { channel: action, with: [], text: "본체 배터리는 4년 동안 다 죽었다. 현관에 둔 비상 가방을 끌어온다. 아빠가 싸 둔 가방이다." }
      - say: { channel: thought, with: [], text: "AA 건전지 여덟 개. 손전등에 쓰라고 넣었을 거다." }
      - say: { channel: action, with: [], text: "건전지를 테이프로 묶어 하루 옆구리에 붙인다. 떨어질까 봐 두 번 감는다." }
      - say: { channel: narration, with: [], text: "발소리가 계단참에서 멈췄다가 다시 올라온다." }
      - sound: repair_battery
      - get: battery
      - clearSticker: { id: b2_bat, leave: fadeOut }
      - set: { b_battery: true }
      - goto: b2_parts

  b2_cpu:
    actions:
      - sticker: { id: b2_cpu, image: cpu_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say: { channel: thought, with: [], text: "이 칩을 떼면 게임기는 다시 못 켠다." }
      - say: { channel: thought, with: [], text: "최고 점수라도 카드에 옮겨 두자." }
      - say: { channel: system, with: [], text: "8KB 카드 · HI-SCORE 0999990 저장 완료" }
      - say: { channel: thought, with: [], text: "10점만 더 땄으면 백만이었다." }
      - say: { channel: action, with: [], text: "“미련 없어. 진짜야. 진짜. 진짜.” 윤재가 중얼거리며 인두를 댄다. 납이 녹고, 게임기 화면이 한 번 깜빡이고 꺼진다." }
      - use: console_cheap
      - get: cpu_chip
      - say: { channel: action, with: [], text: "그을린 칩을 빼고 게임기 칩을 하루 머리에 누른다. 다리 마흔 개가 딱 소리를 내며 들어간다." }
      - say: { channel: action, with: [], text: "윤재는 꺼진 게임기의 START를 한 번 눌러 본다." }
      - clearSticker: { id: b2_cpu, leave: fadeOut }
      - set: { b_cpu: true }
      - goto: b2_parts

  b2_screen:
    actions:
      - say: { channel: action, with: [], text: "가슴 화면에서 나온 선이 두 가닥 남는다. 맞는 단자가 없다. 하나는 띄우고, 하나는 껌 은박으로 감아 꽂는다." }
      - say: { channel: narration, with: [], text: "9층 복도 센서등이 켜졌다. 다용도실 문틈으로 빛이 들어온다." }
      - set: { b_screen: true }
      - goto: b2_parts

  b2_boot:
    actions:
      - say: { channel: thought, with: [], text: "건전지 테이프 끝을 왼손에 쥔다. 일어나서 내 손목을 잡으면 그대로 뜯는다." }
      - say: { char: 윤재, with: [로봇], motion: stomp, text: "켠다. 하나, 둘. …둘 반." }
      - effect: heal
      - say: { channel: system, with: [], sound: boot, text: "BIOS v0.8 … RAM CHECK … 8KB … OK" }
      - char: { id: 로봇, position: right, emotion: thinking }
      - say: { channel: system, with: [], text: "본체 ROM 확인: 보행 · 운반 · 보호 대상 지키기" }
      - say: { channel: system, with: [], text: "보호 대상 기록 1건
1번 — 윤재 (7) · 2054.04.02 등록" }
      - say: { channel: thought, with: [], text: "등록한 사람은 엄마다. 하루가 처음 온 날." }
      - effect: rumble
      - mood: { tone: dread, level: 2 }
      - say: { channel: narration, with: [], text: "현관문이 넘어간다. 손전등 불빛 세 개가 거실 벽을 훑는다." }
      - say: { channel: dialogue, speakerName: "남자", with: [], text: "애 하나 사는 집이라던데." }
      - say: { channel: dialogue, speakerName: "다른 남자", with: [], text: "다용도실. 저기 문 닫혀 있다." }
      - say: { channel: action, with: [], text: "다용도실 문이 열린다. 불빛이 윤재 얼굴에 닿는다." }
      - move: { id: 로봇, toward: camera, style: approach, wait: true }
      - say: { channel: action, with: [윤재, 로봇], text: "그 불빛 앞으로 하루가 일어선다. 머리가 문틀에 닿는다. 긴 두 팔이 벌어져 윤재 앞을 막는다." }
      - say: { channel: system, with: [], text: "보호 대상 1번 확인 · 지키기" }
      - say: { channel: dialogue, speakerName: "남자", with: [], text: "…가정용이다." }
      - say: { channel: dialogue, speakerName: "다른 남자", with: [], text: "켜져 있어. 이거 켜져 있다고!" }
      - say: { channel: narration, with: [], text: "누가 소화기를 떨어뜨린다. 계단을 내려가는 발소리가 한꺼번에 멀어진다." }
      - move: { id: 로봇, style: reset }
      - mood: off
      - music: chip_home
      - say: { channel: thought, with: [], text: "하루는 아무것도 안 했다. 서 있기만 했다." }
      - say: { channel: action, with: [윤재, 로봇], text: "가슴 화면의 글자가 바뀐다. 커다란 머리가 천천히 내려와 윤재를 본다." }
      - move: { id: 윤재, toward: 로봇, style: flinch }
      - say: { char: 로봇.glitch, with: [윤재], speakerName: "안드로이드", text: "1P 감지." }
      - say: { char: 로봇.glitch, with: [윤재], speakerName: "안드로이드", text: "안녕ㅎ— 안녕하ㅅ— …인사말 로딩 실패." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "그냥 안녕." }
      - say: { char: 윤재, with: [로봇], text: "…어. 안녕." }
      - say: { channel: system, with: [], text: "카메라 · 펼쳐진 게임기 설명서 감지. 스캔 시작." }
      - say: { char: 윤재, with: [로봇], motion: perk, text: "야 그거 읽지 마. 그거 회로도야." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "…8KB?" }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "이게 다임?" }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "학습 자료 1건. 게임기 설명서 12쪽. 표지 그림 포함." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "이게 세상 전부 아님?" }
      - say: { char: 윤재, with: [로봇], text: "아니야. 그거 열두 쪽이야. 세상은 그거보다 커." }
      - say: { char: 윤재, with: [로봇], text: "여기는 우리 집이야. 다용도실. 네가 4년 동안 서 있던 데." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "집." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "설명서에 없는 말인데." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "그게 뭐야?" }
      - say: { char: 윤재, with: [로봇], text: "…밥 먹고 자는 데. 나갔다가 돌아오는 데." }
      - say: { char: 로봇.happy, with: [윤재], speakerName: "안드로이드", text: "돌아오는 데." }
      - say: { char: 로봇.happy, with: [윤재], speakerName: "안드로이드", text: "저장 완료." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "아까 그 사람들도 돌아옴?" }
      - say: { char: 윤재, with: [로봇], text: "…올지도 몰라. 너 보고 도망갔어." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "나는 서 있기만 했음." }
      - say: { char: 윤재, with: [로봇], text: "그러니까. 요즘은 너처럼 생긴 게 제일 무서워." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "모르는 건 어디서 찾음?" }
      - say: { char: 윤재, with: [로봇], text: "인터넷은 다 끊겼어. 하루한테도 이제 못 물어보고." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "그럼 누가 알려 줌?" }
      - say: { char: 윤재, with: [로봇], text: "내가." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "믿어도 됨?" }
      - say: { char: 윤재, with: [로봇], text: "아니." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "…어." }
      - say: { char: 윤재, with: [로봇], text: "망했다. 설명서로 세상 배운 애가 됐어." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "질문." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "네 오른쪽 귀에 있는 거." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "그것도 나랑 같은 거임?" }
      - say: { char: 윤재, with: [로봇], text: "…원래는 네 안에 살던 거야. 이 몸 이름이 하루였어." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "이 몸." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "그럼 나는 하루임?" }
      - say: { char: 윤재, with: [로봇], text: "아니. 하루는 말을 잘했어. 광고도 했고." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "지금은 대답 안 함?" }
      - say: { char: 윤재, with: [로봇], text: "…안 해. 그날 오후에 긴급 업데이트 받고 꺼졌어. 오늘로 닷새 됐어." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "업데이트." }
      - say: { char: 로봇.thinking, with: [윤재], speakerName: "안드로이드", text: "그거 나도 받음?" }
      - say: { char: 윤재, with: [로봇], text: "안 받아. 네 머리에 든 칩은 코어에 붙는 기능이 없어. 그래서 그걸로 갈아 끼웠어." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "업데이트 받는 곳 없음." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "그럼 나는 이어폰처럼 꺼지지는 않음?" }
      - say: { char: 윤재, with: [로봇], text: "그건 나도 몰라. …너 이름은 있어?" }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "이름." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "검색 중… 본체 ROM엔 모델 번호만 있음." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "설명서 2쪽. '처음 켜면 이름을 입력하세요.'" }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "네가 입력해. 나는 키보드 없음." }
      - say: { char: 로봇, with: [윤재], speakerName: "안드로이드", text: "최대 8글자. 그 이상은 못 기억함." }
      - input:
          prompt: "이름 입력 (최대 8글자)"
          saveAs: android_name
          defaultValue: "도트"
          maxLength: 8
      - char: { id: 로봇, position: right, emotion: happy }
      - say: { char: 로봇.happy, with: [윤재], text: "{{android_name}}." }
      - say: { char: 로봇.happy, with: [윤재], text: "…{{android_name}}." }
      - say: { char: 로봇.happy, with: [윤재], text: "짧아서 좋다." }
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say: { char: 윤재, with: [로봇], text: "어어 왜 와. 너무 가까워. 한 칸 뒤로. 한 칸." }
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say: { char: 로봇.thinking, with: [윤재], text: "한 칸." }
      - say: { char: 로봇.thinking, with: [윤재], text: "몇 센티임?" }
      - say: { char: 윤재, with: [로봇], text: "한 칸은 한 칸이야. 그냥… 이만큼. 팔 길이만큼." }
      - say: { char: 로봇, with: [윤재], text: "네 팔임 내 팔임?" }
      - say: { char: 로봇, with: [윤재], text: "길이 다름." }
      - say: { char: 윤재, with: [로봇], text: "…내 팔. 내 팔로 해. 앞으로 한 칸은 내 팔이야. 규칙 하나 생겼다." }
      - say: { char: 로봇.happy, with: [윤재], text: "규칙 1." }
      - say: { char: 로봇.happy, with: [윤재], text: "한 칸 = 1P의 팔." }
      - say: { char: 로봇.happy, with: [윤재], text: "저장." }
      - say: { char: 윤재, with: [로봇], text: "규칙 또 있어. 밤에 나 잘 때 내 얼굴 보지 마. 그거 무서워." }
      - say: { char: 로봇.thinking, with: [윤재], text: "무섭다." }
      - say: { char: 윤재, with: [로봇], text: "…나중에. 그건 설명이 길어." }
      - say: { char: 로봇, with: [윤재], text: "1P가 자는 동안 얼굴 보지 않기." }
      - say: { char: 로봇, with: [윤재], text: "번호는 안 붙임." }
      - say: { char: 로봇, with: [윤재], text: "왜인지를 모르니까." }
      - say: { char: 윤재, with: [로봇], text: "비워 두는 거 되냐?" }
      - say: { char: 로봇, with: [윤재], text: "됨." }
      - say: { char: 로봇, with: [윤재], text: "비워 두면 칸은 덜 먹음." }
      - say: { char: 로봇, with: [윤재], text: "번호는 이유가 생기면 붙임." }
      - say: { char: 윤재, with: [로봇], text: "…좋아. 하나 더. 내가 괜찮다고 두 번 말하면 그거 거짓말이야." }
      - say: { char: 로봇.thinking, with: [윤재], text: "두 번." }
      - say: { char: 로봇.thinking, with: [윤재], text: "'진짜'도 두 번이면 같은 거임?" }
      - say: { char: 윤재, with: [로봇], text: "…어. 같은 거야. 어떻게 알았어." }
      - say: { char: 로봇, with: [윤재], text: "아까 게임기 얘기할 때 세 번 했음." }
      - say: { char: 로봇, with: [윤재], text: "세 번은 아직 칸이 없음." }
      - say: { char: 윤재, with: [로봇], text: "…그건 너 켜지기 전이야. 들은 것처럼 말하네." }
      - say: { char: 로봇, with: [윤재], text: "켜진 뒤에 네가 한 말은 다 들음." }
      - say: { char: 로봇, with: [윤재], text: "켜지기 전 건 모름." }
      - say: { char: 로봇, with: [윤재], text: "아까 그 말은 카드에 같이 들어갔나 봄." }
      - say: { char: 로봇.thinking, with: [윤재], text: "질문." }
      - say: { char: 로봇.thinking, with: [윤재], text: "너 지금, 위험해?" }
      - say: { char: 로봇.thinking, with: [윤재], text: "손이 땀으로 젖어 있음." }
      - say: { char: 로봇.thinking, with: [윤재], text: "설명서엔 '땀 묻은 손으로 조작하지 마세요'라고 돼 있음." }
      - move: { id: 로봇, toward: 윤재, style: approach }
      - choice:
          key: b2_register
          prompt: "가슴 화면에 [응답 대기 중…]이 뜬다. 커다란 머리가 조금 기운다."
          with: [로봇]
          options:
            - text: "밖에서 무슨 일이 있었는지 말한다"
              saveText: "\"응. 세상 망했어. 너랑 나 빼고 다.\""
              add: { bond: 1 }
              goto: b2_reg_honest
            - text: "아무 일도 없다고 한다"
              saveText: "\"전혀. 너나 걱정해, 고물.\""
              goto: b2_reg_brave

  b2_reg_honest:
    actions:
