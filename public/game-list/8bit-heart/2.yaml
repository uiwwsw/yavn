  # 닫히지 않는 현관과 아빠에게 남기는 글자.
  b2_note:
    actions:
      - place: { text: "새벽 · 9층 현관", presentation: center }
      - music: chip_dawn
      - say: { channel: action, with: [], text: "현관문은 경첩 하나에 매달려 있다. 닫히지 않는다." }
      - say: { channel: thought, with: [], text: "그 사람들은 다시 온다. 이번엔 더 많이 데려올 거다." }
      - say: { channel: thought, with: [], text: "서울역 지하에 코어 관제실이 있다고 했다. 거기서 끄면 다 선다고." }
      - say: { channel: thought, with: [], text: "아빠가 걸어서 온다면 철길을 따라올 거다. 지방에서 올라오는 철길은 다 서울역으로 모인다." }
      - say: { channel: action, with: [], text: "윤재는 매직으로 문짝 안쪽에 크게 쓴다." }
      - say: { channel: record, with: [], text: "서울역. 철길 따라감. — 윤재" }
      - say: { char: 로봇.thinking, with: [윤재], text: "그거 무슨 글자임?" }
      - say: { char: 윤재, with: [로봇], text: "아빠한테 남기는 거. 우리 어디 갔는지." }
      - say: { char: 로봇, with: [윤재], text: "아빠." }
      - say: { char: 로봇, with: [윤재], text: "그것도 설명서에 없음." }
      - say: { char: 윤재, with: [로봇], text: "가면서 알려 줄게. 가방 들 수 있어?" }
      - say: { channel: action, with: [윤재, 로봇], text: "{{android_name|이}} 비상 가방을 손가락 하나에 걸어 든다. 윤재가 두 손으로 끌던 가방이다." }
      - goto: /3.yaml
