          with: [윤재]
          text: "…잠깐만."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "망했다는 건, 고장이랑 같음?"
      - say:
          char: 로봇.thinking
