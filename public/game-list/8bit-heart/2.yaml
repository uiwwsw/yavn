chapterTitle: "이식"

script:
  - scene: workbench

scenes:
  workbench:
    actions:
      - say:
          channel: card
          with: []
          text: "NOW LOADING…\n그날 밤 · 편의점 기지"
      - bg: { id: shelter, transition: fade, duration: 600 }
      - place: "그날 밤 · 편의점 안, 계산대"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "헉… 골목에선 잠깐 들면 될 줄 알았는데, 계산대까지 끌고 오니까 손이 안 펴져. 너 냉장고만큼 무거워."
      - say:
          char: 윤재
          with: [로봇]
          text: "골목에서 여기까지 200m야."
      - say:
          char: 윤재
          with: [로봇]
          text: "200m 오는 데 두 시간이나 걸렸어. 두 시간."
      - music: chip_home
      - say:
          char: 윤재
          with: [로봇]
          text: "바코드 스캐너, 비켜. 오늘부터 이 계산대는 수술대다."
      - say:
          char: 윤재
          with: [로봇]
          text: "인두는 집에서 챙겨 온 가스 인두."
      - say:
          char: 윤재
          with: [로봇]
          text: "콘센트 안 꽂아도 돼. 부탄 한 통이면 돌아가."
      - say:
          char: 윤재
          with: [로봇]
          text: "…아빠가 사 준 거야 이거."
      - say:
          char: 윤재
          with: [로봇]
          text: "중학교 때. 그거 하나는 잘 사 줬어."
      - say:
          char: 윤재
          with: [로봇]
          text: "좋아. 수술 시작. 환자분, 마취는 없어요."
      - say:
          char: 윤재
          with: [로봇]
          text: "애초에 의식이 없으시니까."
      - say:
          channel: action
          with: []
          text: "윤재가 오른쪽 귀에서 이어폰을 뺀다. 열하루째 표시등이 꺼져 있다."
      - say:
          char: 윤재
          with: []
          text: "하루야. 너는 그냥 거기 있어."
      - say:
          char: 윤재
          with: []
          text: "빼 놓으면 또 어디다 뒀는지 잊어버릴 것 같아서."
      - say:
          channel: action
          with: []
          text: "다시 꽂는다. 아무 소리도 안 난다."
      - say:
          char: 윤재
          with: [로봇]
          text: "건전지는 이쪽. 게임기 칩은 여기. 가슴 화면도 아직 살아 있으면 좋겠는데."
      - say:
          char: 윤재
          with: [로봇]
          text: "셋 다 붙이면 깨어나. 아마."
      - say:
          char: 윤재
          with: [로봇]
          text: "한 번도 안 해 봤는데. …뭐, 켜 보면 알겠지."
      - goto: b2_parts

  b2_parts:
    actions:
      - choice:
          key: b2_parts
          presentation: explore
          prompt: "계산대, 게임기, 로봇의 가슴 화면. 어디부터 볼까?"
          with: [로봇]
          camera: wide
          options:
            - text: "계산대 밑 건전지"
              at: { x: 25, y: 60 }
              when: { var: b_battery, op: eq, value: false }
              goto: b2_battery
            - text: "게임기 CPU"
              at: { x: 50, y: 40 }
              when: { var: b_cpu, op: eq, value: false }
              goto: b2_cpu
            - text: "가슴 화면 단자"
              at: { x: 75, y: 60 }
              when: { var: b_screen, op: eq, value: false }
              goto: b2_screen
            - text: "스위치를 올린다"
              when:
                all:
                  - { var: b_battery, op: eq, value: true }
                  - { var: b_cpu, op: eq, value: true }
                  - { var: b_screen, op: eq, value: true }
              goto: b2_boot

  b2_battery:
    actions:
      - sticker: { id: b2_bat, image: battery_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say:
          char: 윤재
          with: [로봇]
          text: "계산대 밑. 여기 사람들이 손 안 넣어 봤을 거야. 라면 선반만 봤겠지."
      - say:
          char: 윤재.excited
          motion: hop
          with: [로봇]
          text: "있다! AA 여덟 개. 묶음으로 통째로 있어. 대박."
      - say:
          char: 윤재
          with: [로봇]
          text: "라면 봉지는 탈탈 털어 갔으면서 건전지는 한 통을 남겼네."
      - say:
          char: 윤재
          with: [로봇]
          text: "야, 너 리모컨보다 건전지 많이 먹더라."
      - say:
          char: 윤재
          with: [로봇]
          text: "두 개만 먹었으면 내가 지금 이렇게 안 헤매지."
      - say:
          char: 윤재
          motion: nod
          with: [로봇]
          text: "됐다. 옆구리에 붙여 놓자. 테이프 떨어지면 말하고."
      - get: battery
      - clearSticker: { id: b2_bat, leave: fadeOut }
      - set: { b_battery: true }
      - goto: b2_parts

  b2_cpu:
    actions:
      - sticker: { id: b2_cpu, image: cpu_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say:
          char: 윤재
          with: [로봇]
          text: "마지막으로 한 판만 켜 볼게."
      - say:
          char: 윤재
          with: [로봇]
          text: "딱 한 판만. 세이브 확인도 할 겸."
      - say:
          channel: system
          with: []
          text: "HI-SCORE 0999990"
      - say:
          char: 윤재
          motion: slump
          with: [로봇]
          text: "…십 점. 십 점만 더 따면 백만이었어."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "…됐어. 미련 없어. 진짜 없어. 하나도 없어."
      - say:
          char: 윤재
          with: [로봇]
          text: "설명서 맨 뒷장만 보자. 이 칩을 떼면, 게임기는 이제 진짜 못 켜."
      - say:
          channel: action
          with: []
          text: "인두를 대자 납이 녹는다. 화면이 한 차례 깜빡이더니 꺼진다."
      - use: console_cheap
      - get: cpu_chip
      - say:
          char: 윤재
          with: [로봇]
          text: "…빠졌다. 안 부러졌어. 다리 마흔 개 다 멀쩡해."
      - say:
          channel: action
          with: []
          text: "윤재는 칩을 내려놓고 꺼진 게임기의 START를 한 번 눌러 본다."
      - clearSticker: { id: b2_cpu, leave: fadeOut }
      - set: { b_cpu: true }
      - goto: b2_parts

  b2_screen:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "말하는 거. 이게 제일 어려워."
      - say:
          char: 윤재
          with: [로봇]
          text: "스피커는 탔고, 남은 건 가슴 화면이야."
      - say:
          char: 윤재
          motion: lean_in
          with: [로봇]
          text: "가슴 화면 핀이 스물넷. 게임기 단자는 열여섯. 여덟 개가 남아."
      - say:
          char: 윤재
          with: [로봇]
          text: "단자가 안 맞네. 원래 쓰던 케이블은 어디 갔어."
      - say:
          channel: thought
          with: []
          text: "기술실 테이프는 이렇게 잘 찢어지지 않았는데. 껌 싸고 남은 은박이라도 써 볼까."
      - set: { b_screen: true }
      - goto: b2_parts

  b2_boot:
    actions:
      - say:
          char: 윤재
          motion: stomp
          with: [로봇]
          continueLabel: "스위치 ON"
          text: "켠다. 하나, 둘. …둘 반."
      - effect: heal
      - say:
          channel: system
          with: []
          sound: boot
          text: "BIOS v0.8 … RAM CHECK … 8KB … OK"
      - say:
          char: 윤재.excited
          motion: gasp
          with: [로봇]
          text: "떴다. 가슴에 글자 떴어!"
      - say:
          channel: system
          with: []
          text: "본체 ROM 확인: 보행 · 운반 · 보호 대상 지키기"
      - char: { id: 로봇, position: right, emotion: thinking }
      - say:
          channel: system
          with: []
          text: "외부 문서 감지: 게임기 설명서 (12쪽, 표지 포함) … 읽기 완료 0.3초"
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "잠깐 뭐? 설명서? 아 내가 옆에 놔뒀지."
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "야 그거 읽지 마. 그거 읽지 말라고."
      - move: { id: 윤재, toward: 로봇, style: flinch }
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "…8KB?"
      - say: { char: 로봇.thinking, speakerName: "안드로이드", with: [윤재], text: "이게 다임?" }
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "다시 셈."
      - say: { char: 로봇.thinking, speakerName: "안드로이드", with: [윤재], text: "8." }
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "다임."
      - say:
          char: 윤재.excited
          motion: bounce
          with: [로봇]
          text: "말했어. 말했다고. 계산기가 우주선을 띄웠어."
      - wait: 460
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "1P 감지."
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "안녕ㅎ— 안녕하ㅅ— …인사말 로딩 실패."
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "그냥 안녕."
      - move: { id: 로봇, toward: 윤재, style: flinch }
      - say:
          char: 윤재
          with: [로봇]
          text: "어. 안녕."
      - say:
          char: 윤재
          with: [로봇]
          text: "원래 머리는 다 탔을 텐데 말은 어디서 배웠냐. …설명서? 방금 그거?"
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "학습 자료 1건."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "게임기 설명서 12쪽."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "표지 그림 포함."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "이게 세상 전부 아님?"
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "아니야. 전부 아니야. 그거 열두 쪽이야. 세상은 그거보다 커."
      - say:
          char: 윤재
          with: [로봇]
          text: "너 지금 서 있는 데가 편의점이야. 이런 게 길마다 하나씩 있어."
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "편의점."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "설명서에 없는 말인데."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그게 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "뜻은… 돈 주면 물건 주는 데."
      - say:
          char: 윤재
          with: [로봇]
          text: "여기서는 그냥 가져가도 돼. 계산할 사람이 없어."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "돈."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "돈은… 아 이걸 어떻게 설명해."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "그거 종이잖아. 어른들은 거기 적혀 있으면 다 지켜야 되는 줄 알아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "종이가 중요한 척."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "저장 완료."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "…이상한 세상임."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "그건 맞아. 그건 진짜 맞아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "모르는 건 어디서 찾음?"
      - say:
          char: 윤재
          motion: freeze
          with: [로봇]
          text: "…못 찾아. 이제 아무 데서도 못 찾아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그럼 누가 알려 줌?"
      - say:
          char: 윤재
          with: [로봇]
          text: "내가."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "믿어도 됨?"
      - say:
          char: 윤재
          with: [로봇]
          text: "아니."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: nod
          with: [윤재]
          text: "…어."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "망했다. 설명서로 세상 배운 애가 됐어. …아무튼."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "질문."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "네 오른쪽 귀에 있는 거."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그것도 나랑 같은 거임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…어. 비슷한 거야. 비서."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "비서."
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "그건 또 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "물어보면 대답해 주는 거."
      - say:
          char: 윤재
          with: [로봇]
          text: "뭐든 다 대답해 줬어. 광고도 같이 했지만."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "지금은 대답 안 함?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…안 해. 업데이트 받고 죽었어. 열하루 됐어."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "업데이트."
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "그거 나도 받음?"
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "안 받아. 너는 안 받아."
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "선 없어서 못 받아. 그래서 너로 한 거야."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "…어."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그건 규칙에는 안 넣을게."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "업데이트는 안 받는 걸로 그냥 기억해 둘게."
      - say:
          char: 윤재
          with: [로봇]
          text: "…아무튼. 너 이름 있어?"
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "이름."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "검색 중… 본체 ROM엔 모델 번호만 있음."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "11자리."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
