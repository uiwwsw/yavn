          text: "…그 둘이 다야, 지금은."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문 하나 더."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "비서는 고장임, 망함임?"
      - say:
