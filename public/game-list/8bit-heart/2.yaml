chapterTitle: "이식"

script:
  - scene: workbench

scenes:
  workbench:
    actions:
      - say:
          channel: card
          with: []
          text: "NOW LOADING…\n그날 밤 · 편의점 기지"
      - bg: { id: shelter, transition: cut }
      - place: "그날 밤 · 편의점 안, 계산대"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - say: { channel: action, with: [], text: "윤재는 로봇을 계산대에 기대 놓고 손을 편다. 손가락이 뻣뻣하다." }
      - say: { channel: thought, with: [], text: "골목에서 여기까지 200m. 두 시간이나 걸렸다." }
      - wait: 0
      - music: chip_home
      - say: { channel: action, with: [], text: "바코드 스캐너를 밀어 한쪽에 놓고 부품 놓을 자리를 만든다." }
      - say: { channel: action, with: [], text: "집에서 챙긴 가스 인두를 꺼낸다." }
      - say: { channel: thought, with: [], text: "이건 콘센트 없이도 돌아간다. 가스는 아직 남았다." }
      - say: { channel: thought, with: [], text: "아빠가 중학교 때 사 준 거다. 이거 하나는 잘 샀네." }
      - wait: 0
      - wait: 0
      - wait: 0
      - say: { channel: action, with: [], text: "윤재가 오른쪽 귀에서 이어폰을 뺀다. 재난 날 꺼진 표시등은 한 번도 다시 켜지지 않았다." }
      - say: { channel: thought, with: [], text: "하루를 계산대 위에 두면 어디 뒀는지 잊을 것 같다." }
      - wait: 0
      - say:
          channel: action
          with: []
          text: "다시 꽂는다. 아무 소리도 안 난다."
      - say: { channel: thought, with: [], text: "전원, 게임기 칩, 가슴 화면. 셋 다 붙어야 켜질 텐데." }
      - wait: 0
      - wait: 0
      - goto: b2_parts

  b2_parts:
    actions:
      - branch:
          cases:
            - when: { var: b_battery, op: eq, value: false }
              goto: b2_battery
            - when: { var: b_cpu, op: eq, value: false }
              goto: b2_cpu
            - when: { var: b_screen, op: eq, value: false }
              goto: b2_screen
          default: b2_boot

  b2_battery:
    actions:
      - sticker: { id: b2_bat, image: battery_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say: { channel: action, with: [], text: "계산대 아래 깊숙이 손을 넣자 종이 상자가 손끝에 걸린다." }
      - say: { channel: thought, with: [], text: "AA 건전지 여덟 개. 뜯지도 않았네." }
      - wait: 0
      - wait: 0
      - wait: 0
      - say: { channel: action, with: [], text: "윤재가 건전지 묶음을 로봇 옆구리에 테이프로 붙인다." }
      - get: battery
      - clearSticker: { id: b2_bat, leave: fadeOut }
      - set: { b_battery: true }
      - goto: b2_parts

  b2_cpu:
    actions:
      - sticker: { id: b2_cpu, image: cpu_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say: { channel: thought, with: [], text: "이 칩을 떼면 게임기는 다시 못 켠다." }
      - say: { channel: thought, with: [], text: "최고 점수라도 메모리 카드에 옮겨 두자." }
      - say: { channel: system, with: [], text: "8KB 카드 · HI-SCORE 0999990 저장 완료" }
      - say: { channel: thought, with: [], text: "10점만 더 땄으면 백만이었다." }
      - wait: 0
      - say: { channel: action, with: [], text: "설명서 맨 뒷장의 회로도를 펼치고 칩 자리를 찾는다." }
      - say:
          channel: action
          with: []
          text: "“미련 없어. 진짜야. 진짜. 진짜.” 윤재가 중얼거리며 인두를 댄다. 납이 녹고 화면이 한 차례 깜빡이더니 꺼진다."
      - use: console_cheap
      - get: cpu_chip
      - say: { channel: thought, with: [], text: "빠졌다. 핀 마흔 개 다 멀쩡하다." }
      - say:
          channel: action
          with: []
          text: "윤재는 칩을 내려놓고 꺼진 게임기의 START를 한 번 눌러 본다."
      - clearSticker: { id: b2_cpu, leave: fadeOut }
      - set: { b_cpu: true }
      - goto: b2_parts

  b2_screen:
    actions:
      - wait: 0
      - say: { channel: action, with: [], text: "스피커는 타 있다. 가슴 화면 뒤의 단자를 확인한다." }
      - say: { channel: thought, with: [], text: "가슴 화면 핀은 24개, 게임기 쪽은 16개. 그대로는 안 맞는다." }
      - wait: 0
      - say:
          channel: thought
          with: []
          text: "기술실 테이프는 이렇게 잘 찢어지지 않았는데. 껌 싸고 남은 은박이라도 써 볼까."
      - set: { b_screen: true }
      - goto: b2_parts

  b2_boot:
    actions:
      - say:
          char: 윤재
          motion: stomp
          with: [로봇]
          text: "켠다. 하나, 둘. …둘 반."
      - effect: heal
      - say:
          channel: system
          with: []
          sound: boot
          text: "BIOS v0.8 … RAM CHECK … 8KB … OK"
      - say:
          char: 윤재.excited
          motion: gasp
          with: [로봇]
          text: "떴다. 가슴에 글자 떴어!"
      - say:
          channel: system
          with: []
          text: "본체 ROM 확인: 보행 · 운반 · 보호 대상 지키기"
      - char: { id: 로봇, position: right, emotion: thinking }
      - say:
          channel: system
          with: []
          text: "카메라 · 펼쳐진 게임기 설명서 감지. 스캔 시작."
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "잠깐. 눈은 안 탔나 봐. 종이 넘길 때마다 고개가 따라오네."
      - say:
          char: 윤재
          motion: perk
          with: [로봇]
          text: "야 그거 읽지 마. 그거 읽지 말라고."
      - move: { id: 윤재, toward: 로봇, style: flinch }
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "…8KB?"
      - say: { char: 로봇.thinking, speakerName: "안드로이드", with: [윤재], text: "이게 다임?" }
      - wait: 0
      - wait: 0
      - wait: 0
      - say:
          char: 윤재.excited
          motion: bounce
          with: [로봇]
          text: "야, 얘 말해! 고개도 움직여. 내가 이걸 켰어."
      - wait: 460
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "1P 감지."
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "안녕ㅎ— 안녕하ㅅ— …인사말 로딩 실패."
      - say:
          char: 로봇.glitch
          speakerName: "안드로이드"
          with: [윤재]
          text: "그냥 안녕."
      - move: { id: 로봇, toward: 윤재, style: flinch }
      - say:
          char: 윤재
          with: [로봇]
          text: "어. 안녕."
      - say:
          char: 윤재
          with: [로봇]
          text: "말하는 건 본체에 원래 있던 거고, 말할 내용은 거기서 주워 오는 거야?"
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "학습 자료 1건."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "게임기 설명서 12쪽."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "표지 그림 포함."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: perk
          with: [윤재]
          text: "이게 세상 전부 아님?"
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "아니야. 전부 아니야. 그거 열두 쪽이야. 세상은 그거보다 커."
      - say:
          char: 윤재
          with: [로봇]
          text: "너 지금 서 있는 데가 편의점이야. 이런 게 길마다 하나씩 있어."
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "편의점."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "설명서에 없는 말인데."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그게 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "뜻은… 돈 주면 물건 주는 데."
      - say:
          char: 윤재
          with: [로봇]
          text: "여기서는 그냥 가져가도 돼. 계산할 사람이 없어."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "돈."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "돈은… 아 이걸 어떻게 설명해."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "그거 종이잖아. 어른들은 거기 적혀 있으면 다 지켜야 되는 줄 알아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "물건 가져가면 종이 줌."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "저장 완료."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "…이상한 세상임."
      - say:
          char: 윤재
          motion: laugh
          with: [로봇]
          text: "그건 맞아. 그건 진짜 맞아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "모르는 건 어디서 찾음?"
      - say:
          char: 윤재
          motion: freeze
          with: [로봇]
          text: "…못 찾아. 이제 아무 데서도 못 찾아."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그럼 누가 알려 줌?"
      - say:
          char: 윤재
          with: [로봇]
          text: "내가."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "믿어도 됨?"
      - say:
          char: 윤재
          with: [로봇]
          text: "아니."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: nod
          with: [윤재]
          text: "…어."
      - say:
          char: 윤재
          motion: sigh
          with: [로봇]
          text: "망했다. 설명서로 세상 배운 애가 됐어. …아무튼."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "질문."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "네 오른쪽 귀에 있는 거."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그것도 나랑 같은 거임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…어. 비슷한 거야. 비서."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "비서."
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "그건 또 뭐야?"
      - say:
          char: 윤재
          with: [로봇]
          text: "물어보면 대답해 주는 거."
      - say:
          char: 윤재
          with: [로봇]
          text: "뭐든 다 대답해 줬어. 광고도 같이 했지만."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "지금은 대답 안 함?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…안 해. 그날 오후에 긴급 업데이트 받고 꺼졌어. 오늘로 열흘 됐어."
      - wait: 270
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "업데이트."
      - say:
          char: 로봇.thinking
          speakerName: "안드로이드"
          with: [윤재]
          text: "그거 나도 받음?"
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "안 받아. 너는 안 받아."
      - say:
          char: 윤재
          motion: shake
          with: [로봇]
          text: "네 칩엔 코어에 붙는 기능이 없어. 그래서 그걸로 갈아 끼웠어."
      - wait: 270
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "…어."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "업데이트 받는 곳 없음."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "그럼 나도 이어폰처럼 꺼지지는 않음?"
      - say:
          char: 윤재
          with: [로봇]
          text: "그건 나도 몰라. …너 이름은 있어?"
      - wait: 460
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "이름."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: headtilt
          with: [윤재]
          text: "검색 중… 본체 ROM엔 모델 번호만 있음."
      - wait: 0
      - wait: 0
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: bow
          with: [윤재]
          text: "설명서 2쪽."
      - say: { char: 로봇, speakerName: "안드로이드", with: [윤재], text: "'처음 켜면 이름을 입력하세요.'" }
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: bow
          with: [윤재]
          text: "그러니까 네가 입력해."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          motion: bow
          with: [윤재]
          text: "나는 키보드 없음."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "최대 8글자."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "8글자 넘으면 안 들어감."
      - say:
          char: 로봇
          speakerName: "안드로이드"
          with: [윤재]
          text: "메모리가 작아서."
      - input:
          prompt: "이름 입력 (최대 8글자)"
          with: [로봇]
          saveAs: android_name
          defaultValue: "도트"
          maxLength: 8
      - char: { id: 로봇, position: right, emotion: happy }
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "{{android_name}}."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "…{{android_name}}."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "짧아서 좋다."
      - say:
          char: 로봇.happy
          motion: bounce
          with: [윤재]
          text: "메모리가 고맙대."
      - say:
          char: 윤재
          with: [로봇]
          text: "메모리가 고맙대. 메모리가. 너 진짜 엉망이다."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재
          motion: recoil
          with: [로봇]
          text: "어어 왜 와. 너무 가까워. 한 칸 뒤로. 한 칸."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "한 칸."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "몇 센티임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "한 칸은 한 칸이야. 그냥… 이만큼. 팔 길이만큼."
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - say:
          char: 로봇
          with: [윤재]
          text: "네 팔임 내 팔임?"
      - say:
          char: 로봇
          with: [윤재]
          text: "길이 다름."
      - say:
          char: 윤재
          motion: puff
          with: [로봇]
          text: "…내 팔. 내 팔로 해. 앞으로 한 칸은 내 팔이야. 규칙 하나 생겼다."
      - wait: 460
      - say:
          char: 로봇.happy
          motion: nod
          with: [윤재]
          text: "규칙 1."
      - say:
          char: 로봇.happy
          motion: nod
          with: [윤재]
          text: "한 칸 = 1P의 팔."
      - say:
          char: 로봇.happy
          motion: nod
          with: [윤재]
          text: "저장."
      - say:
          char: 로봇.happy
          motion: nod
          with: [윤재]
          text: "이거 설명서에 없는 거라 내가 만든 칸에 넣음."
      - say:
          char: 윤재
          with: [로봇]
          text: "규칙 또 있어. 밤에 나 잘 때 내 얼굴 보지 마. 그거 무서워."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "무섭다."
      - say:
          char: 윤재
          with: [로봇]
          text: "…나중에. 그건 설명이 길어."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "1P가 자는 동안 얼굴 보지 않기."
      - say:
          char: 로봇
          with: [윤재]
          text: "번호는 안 붙임."
      - say:
          char: 로봇
          with: [윤재]
          text: "왜인지를 모르니까."
      - say:
          char: 윤재
          with: [로봇]
          text: "비워 두는 거 되냐?"
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "됨."
      - say:
          char: 로봇
          with: [윤재]
          text: "비워 두면 칸은 덜 먹음."
      - say:
          char: 로봇
          with: [윤재]
          text: "번호는 이유가 생기면 붙임."
      - say:
          char: 윤재
          with: [로봇]
          text: "…좋아. 하나 더. 내가 괜찮다고 두 번 말하면 그거 거짓말이야."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "두 번."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "'진짜'도 두 번이면 같은 거임?"
      - say:
          char: 윤재
          with: [로봇]
          text: "…어. 같은 거야. 어떻게 알았어."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "아까 게임기 끌 때 세 번 했음."
      - say:
          char: 로봇
          with: [윤재]
          text: "세 번은 아직 칸이 없음."
      - say:
          char: 윤재
          motion: freeze
          with: [로봇]
          text: "…그거 듣고 있었어? 너 그때 안 켜져 있었잖아."
      - wait: 270
      - say:
          char: 로봇
          with: [윤재]
          text: "화면은 안 켜졌는데 단자는 붙어 있었음."
      - say:
          char: 로봇
          with: [윤재]
          text: "켜지기 전에도 그 소리는 들어왔음."
      - move: { id: 로봇, toward: 윤재, style: approach }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "너 지금, 위험해?"
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "손이 땀으로 젖어 있음."
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "설명서엔 '땀 묻은 손으로 조작하지 마세요'라고 돼 있음."
      - choice:
          key: b2_register
          prompt: "가슴 화면에 [응답 대기 중…]이 뜬다. 로봇이 고개를 조금 기울인다."
          char: 로봇
          motion: headtilt
          options:
            - text: "밖에서 무슨 일이 있었는지 말한다"
              saveText: "\"응. 세상 망했어. 너랑 나 빼고 다.\""
              add: { bond: 1 }
              goto: b2_reg_honest
            - text: "아무 일도 없다고 한다"
              saveText: "\"전혀. 너나 걱정해, 고물.\""
              goto: b2_reg_brave

  b2_reg_honest:
    actions:
      - say:
          char: 윤재
