chapterTitle: "이식"

script:
  - scene: workbench

scenes:
  workbench:
    actions:
      - say:
          channel: card
          with: []
          text: "NOW LOADING…"
      - bg: { id: shelter, transition: fade, duration: 600 }
      - place: "같은 날 밤 · 털린 편의점"
      - char: { id: 윤재, position: left }
      - char: { id: 로봇, position: right, emotion: off }
      - say:
          char: 윤재
          with: [로봇]
          text: "헉… 헉… 너 몸무게가 냉장고야. 가정용이면 가정을 생각했어야지."
      - music: chip_home
      - say:
          char: 윤재
          with: [로봇]
          text: "바코드 스캐너, 비켜. 오늘부터 이 계산대는 수술대다. 인두는 집에서 챙겨 온 가스 인두. 부탄 한 통이면 돌아가니까 코어도 못 건드려."
      - say:
          char: 윤재
          with: [로봇]
          text: "좋아. 수술 시작. 환자분, 마취는 없어요. 애초에 의식이 없으시니까."
      - say:
          char: 윤재
          with: [로봇]
          text: "계획은 간단해. 전원은 건전지로, 머리는 게임기 CPU로, 말은 네 가슴 화면으로. 셋 다 붙이면 깨어난다. 아마. 기도하면."
      - goto: b2_parts

  b2_parts:
    actions:
      - choice:
          key: b2_parts
          presentation: explore
          prompt: "필요한 건 셋. 전원, 머리, 화면. 어디부터 뒤질까?"
          with: [로봇]
          camera: wide
          options:
            - text: "계산대 밑 건전지"
              at: { x: 25, y: 60 }
              when: { var: b_battery, op: eq, value: false }
              goto: b2_battery
            - text: "게임기 CPU"
              at: { x: 50, y: 40 }
              when: { var: b_cpu, op: eq, value: false }
              goto: b2_cpu
            - text: "가슴 화면 단자"
              at: { x: 75, y: 60 }
              when: { var: b_screen, op: eq, value: false }
              goto: b2_screen
            - text: "스위치를 올린다"
              when:
                all:
                  - { var: b_battery, op: eq, value: true }
                  - { var: b_cpu, op: eq, value: true }
                  - { var: b_screen, op: eq, value: true }
              goto: b2_boot

  b2_battery:
    actions:
      - sticker: { id: b2_bat, image: battery_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say:
          char: 윤재
          with: [로봇]
          text: "AA 여덟 개. 사람들이 라면이랑 생수는 싹 털어 가고 건전지는 놔뒀네. 다들 폰만 믿었지. 그 폰이 지금 적이고."
      - say:
          char: 윤재
          with: [로봇]
          text: "일렬로 세워서 청테이프 칭칭. 완성. 모양은 다이너마이트, 성능은 리모컨."
      - get: battery
      - clearSticker: { id: b2_bat, leave: fadeOut }
      - set: { b_battery: true }
      - goto: b2_parts

  b2_cpu:
    actions:
      - sticker: { id: b2_cpu, image: cpu_sticker, x: 50, y: 32, width: "clamp(140px, 18%, 240px)", enter: popIn, inputLockMs: 300 }
      - say:
          channel: system
          with: []
          text: "HI-SCORE 0999990"
      - say:
          char: 윤재
          with: [로봇]
          text: "십 점만 더 따면 백만이었는데. …됐어. 미련 없어. 진짜 없어. 하나도 없어."
      - say:
          char: 윤재
          with: [로봇]
          text: "회로도가 설명서 맨 뒷장에 있다고? …설명서 안 읽는다는 원칙, 오늘 한정 해제. 나사 네 개만 풀면 돼."
      - say:
          channel: action
          with: []
          text: "인두가 칩 다리를 하나 녹일 때마다 게임기 화면이 한 줄씩 꺼진다."
      - use: console_cheap
      - get: cpu_chip
      - say:
          char: 윤재
          with: [로봇]
          text: "이직 축하한다. 연봉은 없어."
      - clearSticker: { id: b2_cpu, leave: fadeOut }
      - set: { b_cpu: true }
      - goto: b2_parts

  b2_screen:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          text: "가슴 화면 핀 스물넷, 게임기 단자 핀 열여섯. 남는 여덟 개는… 기도로 연결한다."
      - say:
          char: 윤재
          with: [로봇]
          text: "전선 두 가닥 꼬아 붙이고, 그 위에 껌 포장지 은박 둘둘. 이게 공학이다."
      - say:
          channel: thought
          with: []
          text: "기술 선생님이 이거 보면 나 F. 근데 선생님 지금 어디 있는지 모름. 그럼 A."
      - set: { b_screen: true }
      - goto: b2_parts

  b2_boot:
    actions:
      - say:
          char: 윤재
          with: [로봇]
          continueLabel: "스위치 ON"
          text: "켜지면 기적. 안 켜지면 냉장고. 간다."
      - effect: { name: flash, wait: true }
      - say:
          channel: system
          with: []
          text: "BIOS v0.8 … RAM CHECK … 8KB … OK"
      - say:
          channel: system
          with: []
          text: "본체 ROM 확인: 보행 · 운반 · 보호 대상 지키기"
      - char: { id: 로봇, position: right, emotion: thinking }
      - say:
          channel: system
          with: []
          text: "외부 문서 감지: 게임기 설명서 (12쪽, 표지 포함) … 읽기 완료 0.3초"
      - move: { id: 윤재, toward: 로봇, style: flinch }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "…8KB? 이게 다임? 다시 셈. 8. …응. 다임."
      - say:
          char: 윤재.excited
          with: [로봇]
          text: "말했어. 말했다고. 계산기가 우주선을 띄웠어."
      - say:
          char: 로봇.glitch
          with: [윤재]
          text: "1P 감지. 안녕ㅎ— 안녕하ㅅ— …인사말 로딩 실패. 그냥 안녕."
      - move: { id: 로봇, toward: 윤재, style: flinch }
      - say:
          char: 윤재
          with: [로봇]
          text: "그래, 안녕. 원래 머리는 다 탔을 텐데, 말은 어디서 배웠냐. …설명서? 방금 그거? 그게 네 국어 교과서야?"
      - say:
          char: 로봇
          with: [윤재]
          text: "학습 자료 1건. 게임기 설명서 12쪽. 표지 그림 포함. 이게 세상 전부 아님?"
      - say:
          char: 윤재
          with: [로봇]
          text: "망했다. …아무튼. 너 이름 있어?"
      - say:
          char: 로봇
          with: [윤재]
          text: "설명서 2쪽. '처음 켜면 이름을 입력하세요.' 그러니까 네가 입력해. 나는 키보드 없음."
      - input:
          prompt: "이름 입력 (최대 8글자)"
          with: [로봇]
          saveAs: android_name
          defaultValue: "도트"
          maxLength: 8
      - char: { id: 로봇, position: right, emotion: happy }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "{{android_name}}. …{{android_name}}. 짧아서 좋다. 메모리가 고맙대."
      - move: { id: 로봇, toward: 윤재, style: lunge }
      - move: { id: 윤재, toward: 로봇, style: retreat }
      - say:
          char: 윤재
          with: [로봇]
          text: "메모리가 고맙대. 메모리가. 너 진짜 엉망이다. …그리고 너무 가까워. 한 칸 뒤로."
      - move: { id: 로봇, style: reset }
      - move: { id: 윤재, style: reset }
      - move: { id: 로봇, toward: 윤재, style: approach }
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "질문. 너 지금, 위험해? 손이 땀으로 젖어 있음. 설명서엔 '땀 묻은 손으로 조작하지 마세요'라고 돼 있음."
      - choice:
          key: b2_register
          prompt: "가슴 화면: [응답 대기 중…] 고개 기울기 15도."
          char: 로봇
          options:
            - text: "\"응. 세상 망했어. 너랑 나 빼고 다.\""
              add: { bond: 1 }
              goto: b2_reg_honest
            - text: "\"전혀. 너나 걱정해, 고물.\""
              goto: b2_reg_brave

  b2_reg_honest:
    actions:
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "세상. 망함. …처리 중. 처리 중. 큰일이다. 그럼 네가 남은 거 전부네."
      - say:
          channel: system
          with: []
          text: "보호 대상 등록: 1번 — 윤재"
      - say:
          char: 윤재
          with: [로봇]
          text: "1번이래. 2번은 누군데?"
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "없어. 슬롯 하나. 설명서 11쪽. '2P는 컨트롤러를 따로 구입하세요.'"
      - goto: /3.yaml

  b2_reg_brave:
    actions:
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "위험 아님. 근데 무릎이 떨림. 목소리도 떨림. 모순 발견. …설명서 9쪽. '떨림이나 이상한 소리가 나면 즉시 사용을 멈추세요.' 그러니까 위험임."
      - say:
          channel: system
          with: []
          text: "보호 대상 등록: 1번 — 고물한테 거짓말한 사람"
      - say:
          char: 윤재
          with: [로봇]
          text: "야 이름을 그렇게 저장하면 어떡해. 윤재야, 윤재."
      - move: { id: 로봇, toward: 윤재, style: flinch }
      - say:
          char: 로봇.happy
          with: [윤재]
          text: "수정 완료. 1번 — 윤재(거짓말함)."
      - goto: /3.yaml
