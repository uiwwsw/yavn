      - say: { char: 로봇, with: [윤재], text: "다시 해 보기." }
      - say: { char: 로봇, with: [윤재], text: "같이." }
      - say: { char: 로봇, with: [윤재], text: "설명서 빈칸에 적을게." }
      - say: { char: 윤재, with: [로봇], text: "그건 좀 괜찮다." }
      - say: { char: 로봇.happy, with: [윤재], text: "방금 웃었음." }
      - say: { char: 로봇.happy, with: [윤재], text: "그거 칸 두 개 먹는데 그냥 둘래." }
      - say: { char: 윤재, with: [로봇], text: "두 개나? 지워. 8KB밖에 없다며." }
      - say: { char: 로봇, with: [윤재], text: "안 지움." }
      - say: { char: 로봇, with: [윤재], text: "다른 거 지울 거 생기면 그때 생각함." }
