          text: "켜지면 코어부터 찾을걸. 그럼 또 업데이트 받겠지."
      - wait: 270
      - say:
          char: 로봇.thinking
          with: [윤재]
          text: "그럼 망함임."
      - say:
          char: 로봇.thinking
