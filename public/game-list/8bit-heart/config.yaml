title: "8비트 심장"
pov: "윤재"
author:
  name: "uiwwsw"
version: "3.0.0"
seo:
  description: "도시의 기계들이 한꺼번에 사람을 버린다. 집에 남은 건 코어에 붙지 않는 중고 게임기와, 엄마가 들여놓았다 4년 전 꺼진 안드로이드 하루의 몸. 윤재는 그 칩을 하루 머리에 꽂고 서울역까지 걷는다. 픽셀 아트 생존 비주얼노벨, 결말 4종."
  keywords:
    - "SF 비주얼노벨"
    - "레트로 게임기"
    - "안드로이드"
    - "픽셀 아트"
  image: "assets/bg/title.svg"
  imageAlt: "정전된 도시 위에 픽셀 하트가 켜진 휴대 게임기"
textSpeed: 34
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: neon-grid
startScreen:
  enabled: true
  music: assets/music/chip-home.flac
  image: assets/bg/title.svg
  imagePosition: "60% 50%"
  mobileImagePosition: "62% 50%"
  showTitle: true
  titleColor: "#ffec27"
  startButtonText: "PRESS START"
  buttonPosition: bottom-left
  eyebrow: "AI 재난 이후 · 생존극 · 5장 · 결말 4종"
  subtitle: "코어에 연결되지 않는 낡은 게임기는 아직 켜진다. 윤재가 그 칩을 로봇에 꽂자 가슴 화면에 글자가 뜬다. …8KB?"
  scene:
    layout: split
    motion: drift
    duration: 26000
    parallax: 12
    particles: dust
    intensity: 0.4
    fog: false
    light: breathe
    accent: "#f3ab62"
endings:
  saved_together:
    title: "함께 저장"
    message: "코어가 리셋되고 {{android_name|이}} 돌아왔다. 카드에 적어 둔 약속으로 목차를 다시 찾았다. 빈 칸 둘은 윤재가 채웠다."
    epilogue: "첫 열차가 남쪽으로 떠났다. 아빠는 표를 사려다 말고 윤재 옆에 앉았다. {{android_name|이}} 한 칸 떨어져 그 옆에 앉았다."
    background: dawn_field
    music: chip_dawn
    tone: hopeful
  new_game:
    title: "새 게임"
    message: "철문에서 나온 {{android_name|은}} 윤재를 몰랐다. 풀린 운동화 끈부터 묶었다."
    epilogue: "설명서 1쪽. 이번엔 윤재가 소리 내어 읽는다. 아빠가 옆에서 듣는다."
    background: dawn_field
    music: chip_dawn
    tone: tragic
  off_screen:
    title: "화면 밖으로"
    message: "코어는 아직 깨어 있다. 둘은 서울역을 등지고 철길을 걷는다. 광장 기둥에는 반쯤 쓴 '남'이 남았다."
    epilogue: "TO BE CONTINUED? — 참치마요를 찾아서."
    background: ruined_street
    music: chip_run
    tone: mystery
  no_response:
    title: "응답 없음"
    message: "철문은 열리지 않았다. 관제실 맨 안쪽, 손가락은 아직 버튼 위에 있었다."
    epilogue: "카드는 윤재 주머니에, 칩 조각 둘은 빈 건전지 통에 넣었다. 역을 나설 때 한 번도 통을 흔들지 않았다."
    background: datacenter
    music: chip_dawn
    tone: tragic
defaultEnding: off_screen
