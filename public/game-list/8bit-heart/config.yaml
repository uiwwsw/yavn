title: "8비트 심장"
author:
  name: "uiwwsw"
version: "1.0.0"
seo:
  description: "AI 재난으로 세상의 칩이 전부 미쳐 버린 날, 멀쩡한 건 싸구려 레트로 게임기 하나뿐. 소년 윤재는 그 CPU로 고장 난 안드로이드를 깨운다. 픽셀 아트 생존 비주얼노벨, 결말 3종."
  keywords:
    - "SF 비주얼노벨"
    - "레트로 게임기"
    - "안드로이드"
    - "픽셀 아트"
  image: "assets/bg/title.svg"
  imageAlt: "어두운 도시를 바라보는 소년과 안드로이드, 앞에 빛나는 레트로 게임기"
textSpeed: 34
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: neon-grid
startScreen:
  enabled: true
  music: assets/music/chip-home.flac
  image: assets/bg/title.svg
  imagePosition: "60% 50%"
  mobileImagePosition: "70% 50%"
  showTitle: true
  titleColor: "#ffec27"
  startButtonText: "PRESS START"
  buttonPosition: bottom-left
  eyebrow: "모든 칩이 미친 날, 살아남은 건 가장 싼 선택"
  subtitle: "세상에서 가장 멍청하고 귀여운 안드로이드와 살아남기."
  scene:
    layout: split
    motion: drift
    duration: 26000
    parallax: 12
    particles: dust
    intensity: 0.4
    fog: false
    light: breathe
    accent: "#ffa300"
endings:
  saved_together:
    title: "함께 저장"
    message: "코어는 리셋됐다. 8KB짜리 세이브 슬롯 하나가 {{android_name|을}} 통째로 붙잡아 두었다. 핑은 여전히 최악이다."
    epilogue: "SAVE COMPLETE — 2P 계속 플레이 중. 펀치라인은 아직 봉인."
    background: dawn_field
    music: chip_dawn
    tone: hopeful
  new_game:
    title: "새 게임"
    message: "도시는 돌아왔고, {{android_name|은}} 처음부터 다시 시작했다. 보호 대상 1번 슬롯에는 같은 이름이 한 번 더 들어갔다."
    epilogue: "NEW GAME. 윤재는 설명서를 처음부터 읽어 주기로 했다. 이번엔 자기가."
    background: dawn_field
    music: chip_dawn
    tone: tragic
  off_screen:
    title: "화면 밖으로"
    message: "코어는 아직 깨어 있다. 둘은 도시를 등지고 걷는다. 배터리 한 칸, 깜빡깜빡."
    epilogue: "TO BE CONTINUED? — 다음엔 더 싼 부품으로."
    background: ruined_street
    music: chip_run
    tone: mystery
defaultEnding: off_screen
