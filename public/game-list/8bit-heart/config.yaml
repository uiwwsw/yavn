title: "8비트 심장"
pov: "윤재"
author:
  name: "uiwwsw"
version: "1.6.0"
seo:
  description: "도시의 기계들이 한꺼번에 오작동을 일으킨다. 코어에 연결할 수 없는 중고 게임기는 살아남았다. 윤재는 그 칩을 떼어 고장 난 로봇을 깨운다. 픽셀 아트 생존 비주얼노벨, 결말 4종."
  keywords:
    - "SF 비주얼노벨"
    - "레트로 게임기"
    - "안드로이드"
    - "픽셀 아트"
  image: "assets/bg/title.svg"
  imageAlt: "정전된 도시 위에 픽셀 하트가 켜진 휴대 게임기"
textSpeed: 34
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: neon-grid
startScreen:
  enabled: true
  music: assets/music/chip-home.flac
  image: assets/bg/title.svg
  imagePosition: "60% 50%"
  mobileImagePosition: "62% 50%"
  showTitle: true
  titleColor: "#ffec27"
  startButtonText: "PRESS START"
  buttonPosition: bottom-left
  eyebrow: "AI 재난 이후 · 생존극 · 5장 · 결말 4종"
  subtitle: "코어에 연결되지 않는 낡은 게임기는 아직 켜진다. 윤재가 그 칩을 로봇에 꽂자 가슴 화면에 글자가 뜬다. …8KB?"
  scene:
    layout: split
    motion: drift
    duration: 26000
    parallax: 12
    particles: dust
    intensity: 0.4
    fog: false
    light: breathe
    accent: "#f3ab62"
endings:
  saved_together:
    title: "함께 저장"
    message: "코어가 리셋되고 {{android_name|이}} 돌아왔다. 8KB 메모리 카드에 적어 둔 약속도, 한 박자 늦는 대답도 그대로다."
    epilogue: "집에 먼저 가 보기로 했다. 현관에 붙인 ‘편의점’을 고치러. 이번엔 윤재 혼자 돌아가지 않는다."
    background: dawn_field
    music: chip_dawn
    tone: hopeful
  new_game:
    title: "새 게임"
    message: "신호등은 다시 제 색을 찾았다. 기동을 마친 {{android_name|은}} 보호 대상 1번에 윤재를 등록한다."
    epilogue: "설명서 1쪽. 이번엔 윤재가 소리 내어 읽는다."
    background: dawn_field
    music: chip_dawn
    tone: tragic
  off_screen:
    title: "화면 밖으로"
    message: "코어는 아직 깨어 있다. 둘은 도시를 등지고 걷는다. 남은 배터리 표시가 깜빡인다."
    epilogue: "TO BE CONTINUED? — 참치마요를 찾아서."
    background: ruined_street
    music: chip_run
    tone: mystery
  no_response:
    title: "응답 없음"
    message: "인사를 몇 번 더 불렀다. 가슴 화면이 켜지지 않았다."
    epilogue: "윤재는 칩 조각 둘을 빈 건전지 통에 넣었다. 골목을 나설 때 한 번도 통을 흔들지 않았다."
    background: drone_alley
    music: chip_dawn
    tone: tragic
defaultEnding: off_screen
