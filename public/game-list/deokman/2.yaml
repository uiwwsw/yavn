          text: "그날 밤, 덕만의 방문은 안에서 잠겨 있었습니다. 방 안에 아무도 없어야 했지만 창호지 너머로 무언가 끌리는 소리가 났고, 문 아래로 검붉은 피 한 줄이 번졌습니다."
