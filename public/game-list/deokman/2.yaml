script:
  - scene: secret_reunion

scenes:
  secret_reunion:
    actions:
      - bg: princess_chamber
      - camera: wide
      - say:
          channel: record
          text: "제3장 — 두 공주의 봄"
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          camera: medium
          text: "모란 온실의 비밀문이 닫혔습니다. 천명은 촛불을 들어 덕만의 얼굴을 오래 비췄습니다. 탁자 위에는 사망 기록과 서쪽 창고 운송표가 놓였지만, 누구도 먼저 종이를 보지 못했습니다."
      - say:
          when: { var: identity_mode, op: eq, value: public }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "장터에서 네 이름을 외쳤다는 소문이 궁보다 먼저 왔어. 기쁘면서도 화가 났어. 나한테 닿기도 전에 또 네 목을 걸었으니까."
      - say:
          when: { var: identity_mode, op: eq, value: borrowed }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "감찰관 이름까지 빌렸다며. 널 들이는 순간 저들은 네가 훔친 이름부터 재판하려 들 거야. 그 빚도 같이 갚자."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "네 얼굴을 믿고 싶어. 하지만 내가 믿는 순간 궁은 내일 가짜 덕만 열 명을 데려올 거야. 나를 의심하게 만들 증거를 줘."
      - choice:
          key: c3_proof
          prompt: "천명의 손이 떨린다. 무엇으로 십 년의 틈을 건널까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "그을린 사망 기록을 밀어 준다"
              when: { var: death_register, op: eq, value: true }
              add: { cheonmyeong_trust: 2, evidence: 1 }
              goto: proof_record
            - text: "아버지의 모란 질문을 되돌려 준다"
              add: { cheonmyeong_trust: 1, king_trust: 1, insight: 1 }
              goto: proof_memory
            - text: "언니가 숨기는 두려움을 먼저 꺼낸다"
              add: { cheonmyeong_trust: 2, mercy: 1 }
              goto: proof_sister

  proof_record:
    actions:
      - sticker: { id: c3_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(170px, 21%, 320px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "도장은 아버님 것이야. 그런데 이 획은 궁 서기관이 아니야. 왕의 손과 기록관의 손을 따로 훔쳤어."
      - clearSticker: { id: c3_record, leave: fadeOut }
      - goto: sister_oath

  proof_memory:
    actions:
      - say:
          char: 덕만
          text: "꽃엔 향기가 없었고, 왕에겐 명령을 옮길 손이 없었어. 아버지는 늘 있는 것보다 빠진 걸 보라고 했지."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아버님이 결정을 미룰 때마다 하던 말이야… 너, 정말 그 방에 있었구나."
      - goto: sister_oath

  proof_sister:
    actions:
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "내가 가짜라서 무서운 게 아니지. 진짜면 네가 십 년 동안 버틴 자리가 흔들릴까 봐 무서운 거야."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "맞아. 네가 살아서 기쁜데, 내 자리를 먼저 걱정했어. 그런 내가 네 언니라는 게 더 무서워."
      - goto: sister_oath

  sister_oath:
    actions:
      - say:
          channel: narration
          text: "천명이 두 번째 빗장까지 걸었습니다. 벽장을 열자 혼인 후보와 사병 수가 빼곡한 지도가 나왔습니다. 천명의 이름에는 붉은 혼례끈이 매여 있었습니다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "내일 네가 내 옆에 서면 사람들은 기뻐하기 전에 우리 중 누굴 왕으로 세울지 셀 거야. 그래도 설래?"
      - choice:
          key: c3_sisters_strategy
          prompt: "새벽 조회가 열린다. 두 자매는 어떤 모습으로 문을 열까?"
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "손을 맞잡고 두 공주로 들어선다"
              set: { sisters_public: true }
              add: { people_support: 2, cheonmyeong_trust: 1, fear: 1 }
              goto: public_sisters
            - text: "천명은 궁, 덕만은 시장을 맡는다"
              set: { sisters_public: false }
              add: { insight: 1, cheonmyeong_trust: 2, nobles_support: 1 }
              goto: divided_roles
            - text: "덕만이 시녀복을 입고 천명 뒤에 선다"
              set: { sisters_public: false, identity_mode: hidden }
              add: { evidence: 1, fear: 1 }
              goto: hidden_sister

  public_sisters:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "두 공주가 나란히 계단을 내려오자 궁문 밖에서 환호가 터졌습니다. 무릎 꿇은 귀족들은 고개를 숙인 채 서로의 손가락이 어느 쪽을 향하는지 살폈습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "오늘은 네 손이 따뜻했어. 내일부터는 저들이 이 손에 칼을 쥐여 주겠지."
      - goto: spring_ambush

  divided_roles:
    actions:
      - bg: moon_court
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "낮에는 천명이 회의의 거짓말을 적고, 덕만은 시장의 값을 외웠습니다. 밤마다 두 종이를 포개면 귀족 한 사람의 말이 어긋났습니다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "같은 거짓말을 양쪽에서 잡을 수 있어. 대신 네가 다치면… 난 늘 한발 늦겠지."
      - goto: spring_ambush

  hidden_sister:
    actions:
      - bg: shadow_corridor
      - char: { id: 덕만, position: left, emotion: attendant }
      - say:
          channel: narration
          text: "시녀복을 입은 덕만 앞에서 귀족들은 말을 삼키지 않았습니다. 찻잔을 내려놓는 손보다 먼저, 숨겨 둔 멸시와 계획이 쏟아졌습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "널 살리겠다고 또 네 이름을 숨겼어. 오래 끌면… 내가 칠숙 대신 네 기록을 쓰는 셈이야."
      - goto: spring_ambush

  spring_ambush:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 칠숙, position: right, emotion: angry }
      - char: { id: 천명, position: center, emotion: nervous }
      - say:
          channel: narration
          text: "봄 연회의 북이 멎는 순간, 꽃바구니 세 개에서 칼이 솟았습니다. 칠숙은 칼보다 먼저 호위병들의 눈이 어느 공주를 향하는지 확인했습니다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만, 천명]
          text: "공주가 둘이라 모두 망설이는군요. 제가 하나로 줄여 드리겠습니다."
      - choice:
          key: c3_ambush
          prompt: "꽃잎 사이로 칼이 번뜩인다. 첫 움직임은?"
          char: 덕만
          camera: reaction
          with: [천명, 칠숙]
          options:
            - text: "천명과 등을 맞대고 칼을 막는다"
              add: { cheonmyeong_trust: 2, people_support: 1, army_support: 1 }
              goto: survive_together
            - text: "피 묻은 뜰에서 계승권을 선포한다"
              goto: bad_early_crown
            - text: "퇴로를 열어 칠숙을 회랑으로 몬다"
              add: { evidence: 2, mercy: 1, fear: 1 }
              goto: capture_order

  survive_together:
    actions:
      - say:
          channel: narration
          text: "천명의 비녀가 칼끝을 흘렸고 덕만은 언니의 빈틈을 몸으로 막았습니다. 군사가 들이닥쳤을 때 두 사람은 같은 피를 소매에 묻힌 채 서 있었습니다."
      - goto: sisters_end

  capture_order:
    actions:
      - say:
          channel: narration
          text: "덕만이 일부러 동문을 비우자 칠숙은 미끼를 물었습니다. 좁은 회랑에서 옷자락이 찢겼고, 그 안에서 서쪽 창고 열쇠와 사병 명부가 떨어졌습니다."
      - goto: sisters_end

  sisters_end:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left, emotion: princess }
      - char: { id: 천명, position: right }
      - say:
          char: 천명
          text: "이 밀랍, 네가 국경에서 가져온 인장과 같아. 우리를 죽이는 칼도 백성이 먹을 곡식으로 샀다는 뜻이야."
      - say:
          char: 덕만
          text: "서쪽 창고에서 오늘 밤 수레가 나가. 칼잡이는 달아났지만, 칼을 먹인 수레는 바퀴 자국을 남겨."
      - say:
          channel: record
          text: "두 공주는 서로를 되찾았고, 암살자의 밀랍을 국경의 곡식길과 연결했습니다. 자매의 재회는 곧 첫 공동 수사로 바뀌었습니다."
      - goto: /3.yaml

  bad_early_crown:
    actions:
      - bg: council_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.princess_angry
          text: "언니와 떨어지면 저 칼이 원하는 대로 돼. 회랑부터 닫고 살아서 말해야 해."
      - say:
          channel: narration
          text: "피 묻은 뜰에서 덕만이 계승권을 외치는 순간 호위의 시선이 왕위 선언에 쏠렸습니다. 숨어 있던 두 번째 칼은 칠숙이 아니라 혼자 앞선 덕만을 향했습니다."
      - say:
          char: 천명.sad
          text: "덕만아, 돌아봐! 저 사람이 미끼야. 네 뒤에—"
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 회랑에서 자객을 추격하던 중 피살. 천명 공주 단독 계승을 귀족 회의가 즉시 승인함."
      - gameOver:
          title: "운명 — 갈라진 자매의 등"
          message: "암살자의 목적은 칠숙을 잡는 일도 왕위를 논하는 일도 아니었습니다. 두 공주를 떼어 놓는 순간 덕만은 두 번째 칼에 쓰러졌고, 살아남은 자의 기록만 왕위가 되었습니다."
