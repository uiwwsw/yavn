          text: "오지 않을 거라고 생각합니다. 그러니 누구도 제가 혼담을 거절했다고 말할 수 없겠지요."
      - say:
          char: 칠숙.smile
          camera: close
          text: "말 한마디로 세 집을 돌려보내셨군요. 다음에는 말로 끝나지 않을 겁니다."
      - say:
          char: 덕만
          camera: close
          text: "알고 있습니다. 그래서 다음 수를 준비하고 있습니다."
