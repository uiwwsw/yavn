script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제2장 — 붉은 혼인끈"
      - say:
          text: "누명을 벗은 다음 날, 청혼이 세 건 왔습니다."
      - say:
          with: [덕만, 칠숙]
          text: "신랑은 셋. 조건은 하나였습니다."
      - say:
          with: [덕만, 칠숙]
          text: "암살 누명으로 덕만을 꺾지 못한 귀족들이 이번에는 혼인으로 정치에서 밀어내려 한 것입니다."
      - say:
          with: [덕만]
          text: "혼인을 받아들이면 목숨은 안전해집니다. 대신 덕만의 말과 왕이 될 가능성은 남편의 것이 됩니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "혼인 뒤엔 남편이 대신 말합니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "제 입까지 혼수로 달라는군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "칼보다 비단이 보기 좋지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "목을 조르는 건 같습니다."
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "진운은 왕의 먼 친척이자, 세 가문이 남자 후계자로 밀어 올리는 젊은 왕족이었습니다."
      - say:
          with: [진운]
          text: "그러나 고개를 든 얼굴에는 신랑의 기대보다, 남의 뜻을 전하는 사람의 미안함이 먼저 보였습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "왕의 먼 친척, 진운입니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "저와 혼인하시면 안전합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "왜 사과하는 얼굴입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제 문장이 아니라서요."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "첫째 집은 군사를 받습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "둘째는 세금을, 셋째는 침묵을요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "사람 하나를 셋이 나눴군요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "동문에 말 두 필을 뒀습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "도망가라는 뜻입니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "길 하나는 남겨 두고 싶었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "도망칠지는 제가 정하죠."
      - say:
          with: [덕만]
          text: "진운은 혼인 뒤에 숨은 협박을 알고 있었습니다. 비담은 그 협박의 값을 좇고, 유신은 궁을 빠져나갈 길을 열어 두었습니다."
      - say:
          with: [덕만]
          text: "누구의 말부터 듣느냐에 따라 덕만은 귀족의 속내, 거래의 장부, 혹은 살아남을 길부터 보게 됩니다."
      - branch:
          cases:
            - when:
                var: sowon_trust
                op: gte
                value: 2
              goto: remembered_sowon_knot
            - when:
                var: bidam_trust
                op: gte
                value: 2
              goto: remembered_bidam_copy
          default: suitor_choice

  remembered_sowon_knot:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "소원은 세 혼담에 달린 붉은 끈을 나란히 놓았습니다. 덕만의 가짜 노리개와 같은 방식으로 매듭 하나가 비어 있었습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이것도 같은 손이 묶었어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "누명과 혼담이 한 계획이군."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "이번엔 먼저 알아봤죠?"
      - add: { insight: 1 }
      - goto: suitor_choice

  remembered_bidam_copy:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 거래 장부의 사본이 아니라 원본 한 장을 내밀었습니다. 덕만이 기록 창고에서 그를 믿고 등을 보인 일을 기억한 것입니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이번엔 진짜를 드립니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "대신 뭘 원합니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "나중에도 먼저 물어보시죠."
      - add: { insight: 1 }
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구 말부터 들을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "진운의 뜻을 묻는다"
              add: { nobles_support: 1 }
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add: { bidam_trust: 1, insight: 1 }
              goto: suitor_bidam
            - text: "유신과 떠난다"
              goto: go_12_warm_choice
            - text: "세 가문을 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "덕만은 사람을 물리고 진운과 단둘이 마주 앉았습니다. 청혼을 낸 사람의 뜻부터 확인하려 했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그대가 원한 혼인입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "아닙니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "거절하면 어머니가 다칩니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그래서 나를 가두겠다고요?"
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "그래서 먼저 말한 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그 용기는 기억하겠습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 혼인 합의서를 숨겨 둔 방으로 덕만을 이끌었습니다. 종이마다 약속받은 대가가 달랐습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내 침묵은 얼마였습니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "값도 없었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "당연히 딸려 온다고 봤지요."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "장부를 쓴 자를 찾아 주세요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이제야 제 일을 주시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          delivery: calm
          text: "그날 낮, 나인들이 혼례 비녀를 꽂았습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "싫다고 내가 말해 줄까?"
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "언니 뒤에 숨었다고 할 거야."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "잠깐 숨는 게 뭐 어때."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "매번 혼자 맞아야 강한 거야?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "이번엔 제가 말할래요."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "대신 이 비녀 좀 빼 줘요."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "그건 내가 제일 잘하지."
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "월명은 별의 움직임과 왕실 약방을 함께 살피는 사람이었습니다. 귀족들은 그의 해석을 하늘의 뜻처럼 들었습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별 그림과 빈 약봉지를 가져왔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "소문 하나도 준비했고요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "혼담을 깨면 누군가는 다칩니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "누가 덜 다칠지 고르는 날이군요."
      - say:
          with: [덕만]
          text: "별을 빌리면 월명이 위험해지고, 소문을 택하면 덕만과 비담의 이름이 함께 더러워집니다."
      - say:
          with: [덕만]
          text: "거짓 병이나 조롱은 빠르지만, 한 번 퍼진 말은 덕만이 진실을 밝혀도 되돌아오지 않을 수 있었습니다."
      - choice:
          key: c2_reputation
          prompt: "혼담을 어떻게 흔들까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "별의 흉조를 빌린다"
              add: { insight: 1 }
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add: { bidam_trust: 1 }
              goto: reputation_scandal
            - text: "후보들을 비웃는다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - bg: moon_court
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "달이 뜬 뒤, 덕만은 월명을 뜰로 불렀습니다. 별의 풀이로 혼례 날짜를 서로 어긋나게 만들 생각이었습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별을 핑계로 미루시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "세 가문에 다른 풀이를 주세요."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "거짓이 들키면 저도 죽습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "내일 제가 거짓이라 밝히겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "책임은 제 이름에 남기세요."
      - goto: throne_choice

  reputation_scandal:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "밤이 깊자 비담은 사람들이 가장 믿기 쉬운 거짓말을 골랐습니다. 덕만과 자신이 함께 있었다는 소문이었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "저와 밤을 보냈다는 소문이라."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "취향이 나쁘단 말은 듣겠군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그대 평판이 걱정됩니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "제 평판은 더 내려갈 곳이 없습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "내가 고른 소문은 내가 견딜게요."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          delivery: calm
          text: "해 질 무렵. 세 도장이 왕좌 앞에 놓였습니다."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [덕만]
          text: "<speed=20>싫다면 전부 찢고 싶구나.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [진평왕]
          text: "오늘만 아버지여야 했어요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "그러면 네 답을 빼앗게 된다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "왕은 참 나쁜 아버지네요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: sad
          text: "<speed=18>그래서 미안하구나.</speed>"
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "해가 졌습니다. 답하시지요."
      - say:
          with: [덕만]
          text: "합의를 요구하면 혼담은 늦어지지만 귀족들이 다시 뭉칠 수 있습니다. 전쟁을 핑계로 삼으면 덕만이 국경으로 밀려납니다."
      - say:
          with: [덕만, 칠숙]
          text: "밀약을 공개하면 세 가문을 갈라놓을 수 있지만, 칠숙에게 덕만이 가진 증거를 모두 보여 주게 됩니다."
      - choice:
          key: c2_throne
          prompt: "세 혼담에 무엇이라 답할까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "세 집의 합의를 요구한다"
              add: { nobles_support: 1, power: 1 }
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add: { army_support: 1 }
              goto: throne_delay
            - text: "밀약을 공개한다"
              add: { legitimacy: 1, insight: 1 }
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - char:
          id: 칠숙
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "세 가문이 한 사람에 합의하면 하죠."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "그런 날이 오겠습니까?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "안 오겠죠. 그래서 고른 답입니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "다음엔 말로 끝나지 않을 겁니다."
      - goto: chapter2_end

  throne_delay:
    actions:
      - char:
          id: 유신
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "전쟁 뒤로 미루는 답은 받았습니다."
