script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          wait: 800
          text: "제2장 — 빌린 이름"
      - say:
          delivery: calm
          text: "석 달이 흘러, 631년 늦여름이 되었습니다."
      - say:
          with: [진평왕, 덕만, 칠숙]
          text: "진평왕이 독의 후유증에서 벗어나기도 전에 귀족 여섯 집이 왕실 혼인 회의를 요구했습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "전하의 건강이 흔들린 뒤 나라가 불안합니다. 덕만공주와 진운공이 혼인하면 다툼도 끝납니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "누가 다투고 있느냐? 당사자 둘은 아직 입도 열지 않았다."
      - char: { id: 진운, position: center }
      - say:
          with: [진평왕, 덕만, 진운]
          text: "진운은 두 손으로 원고를 들고 회의장 가운데 섰습니다. 손가락에는 종이를 오래 쥔 자국이 붉게 남았습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [진평왕, 덕만]
          text: "왕실의 평안을 위해 덕만공주와 혼인하고, 두 가문의 뜻을……"
      - say:
          char: 진평왕
          camera: close
          with: [진운]
          text: "멈춰라. 그 글을 쓴 자는 누구냐?"
      - say:
          char: 진운.nervous
          camera: close
          with: [진평왕]
          text: "저는 받았을 뿐입니다."
      - say:
          char: 진평왕
          camera: medium
          with: [진운, 덕만]
          text: "남이 준 말로 혼인을 청하지 마라. 네 뜻을 찾은 뒤 다시 서라."
      - char: { id: 칠숙, position: center }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "진운공 한 사람의 뜻보다 여섯 집의 합의가 무겁습니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "여섯 집이 내 딸의 삶을 나눠 가진 적은 없다."
      - char: { id: 진운, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "진운공, 오늘 안에 제게 본인의 말을 들려주시겠습니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제가 무엇을 말해도 누군가는 어머니에게 대신 묻습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그렇다면 먼저 어머니께 무슨 일이 있는지 듣겠습니다."
      - choice:
          key: c2_jinun
          prompt: "남의 원고를 든 진운에게 어떻게 다가가겠습니까?"
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "둘만 말할 자리를 만든다"
              add: { rival_trust: 1, insight: 1 }
              goto: jinun_private
            - text: "원고를 끝까지 읽게 한다"
              add: { rival_trust: 1, legitimacy: 1 }
              goto: jinun_read
            - text: "꼭두각시라 몰아붙인다"
              goto: go_11_borrowed_shame
            - text: "진운부터 가둔다"
              goto: go_12_hostage_blood

  jinun_private:
    actions:
      - bg: moon_court
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          with: [덕만, 진운]
          text: "덕만은 호위를 뜰 밖에 세우고 진운에게 원고를 접어 두게 했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "먼저 묻겠습니다. 진운공은 왕이 되고 싶습니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          wait: 700
          text: "되고 싶습니다. 한 번도 허락받지 못한 말이라 저도 놀랐습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "저도 왕좌를 피하지 않겠습니다. 그렇다고 서로를 죽여야 하는 것은 아닙니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "제 어머니가 칠숙공의 서쪽 별채에 있습니다. 제가 원고를 거부하면 방을 옮긴답니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진운]
          text: "어머니 목숨과 왕좌를 같은 저울에 올렸군요."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "그러니 저를 불쌍히 여기지는 마십시오. 원고를 읽은 것도 제 선택입니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "불쌍히 여기지 않겠습니다. 대신 다음 선택은 진운공의 말로 들을 겁니다."
      - goto: original_notice

  jinun_read:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [진운, 칠숙]
          text: "진운공, 남이 쓴 글이라도 끝까지 읽어 주십시오. 숨긴 조건이 있는지 모두가 들어야 합니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "혼인 뒤 왕실 군사의 절반은 여섯 집이 고른 장수가 맡고……"
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "왕실 창고지기도 여섯 집의 동의를 받아 정합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "혼인 합의서가 아니라 왕의 손발을 나누는 문서군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "왕실이 귀족과 함께 나라를 지키자는 뜻입니다."
      - say:
          char: 진운.angry
          camera: medium
          with: [칠숙]
          text: "그렇다면 왜 제 어머니를 별채에 가두셨습니까?"
      - say:
          with: [덕만, 진운, 칠숙]
          wait: 750
          text: "회의장에 있던 서기관들의 붓이 한꺼번에 멈췄습니다."
      - goto: original_notice

  original_notice:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "그날 한낮, 비담이 합의서 사본과 서로 다른 봉인을 가져왔습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "우리 손에 있는 것은 사본입니다. 불리한 첫 장과 서명한 이름은 빠져 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "원본을 보관한 사람은 누구입니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "왕실 기록관입니다. 그는 사라진 곡식 장부도 함께 베꼈습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "그 사람을 몰아세우면 칠숙에게 먼저 알릴 겁니다. 스스로 원본을 내놓게 해야 합니다."
      - choice:
          key: c2_original
          prompt: "혼인 합의서 원본을 어떻게 확보하겠습니까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "왕명으로 공개 열람한다"
              add: { legitimacy: 1, nobles_support: 1 }
              goto: original_public
            - text: "봉인의 재료를 따라간다"
              add: { insight: 1, bidam_trust: 1 }
              goto: original_seal
            - text: "혼인을 약속해 받는다"
              goto: go_13_signed_bride
            - text: "밤에 기록방을 연다"
              goto: go_14_false_thief

  original_public:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [진평왕, 칠숙]
          text: "전하, 제 혼인을 논하려면 조건을 숨기지 말고 원본을 모두에게 읽게 해 주십시오."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "옳다. 혼인을 청한 여섯 집은 도장을 찍은 원본을 가져와라."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "가문의 사정까지 공개하라는 명령입니까?"
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "왕실의 이름을 쓴 문서다. 숨길 사정은 쓰지 말았어야 한다."
      - goto: compact_recovered

  original_seal:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "비담은 봉인에 섞인 푸른 모래를 따라 서쪽 종이 상인을 찾았습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "상인은 같은 봉인을 열두 개 만들고, 하나를 기록관에게 따로 건넸습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "기록관이 원본을 숨기려고 자기 봉인을 만들었군요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "그는 오늘 해 질 무렵 왕 앞에 내놓겠다고 했습니다. 겁은 났지만 끝까지 숨길 생각은 아닌 모양입니다."
      - goto: compact_recovered

  compact_recovered:
    actions:
      - bg: locked_room
      - camera: medium
      - effect: { name: focus, wait: true }
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          delivery: calm
          text: "해 질 무렵, 기록관은 원본 한 장을 덕만과 진운 앞에 펼쳤습니다."
      - say:
          with: [덕만, 진운]
          text: "첫 조항에는 혼인, 둘째에는 진운의 계승, 셋째에는 군사와 창고의 인사를 여섯 집이 정한다고 적혀 있었습니다."
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "제 이름은 있는데 제 도장은 없습니다. 어머니 도장을 대신 찍었습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "저도 동의한 적이 없습니다. 우리 둘을 묶어 놓고 나라의 열쇠를 나눴군요."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "회의에서 제가 직접 말하겠습니다. 왕좌를 원하지만 이 문서로 받지는 않겠다고요."
      - add: { rival_trust: 1, legitimacy: 1 }
      - goto: council_choice

  council_choice:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: center }
      - say:
          delivery: calm
          text: "다음 날, 혼인을 정하겠다는 귀족 회의가 다시 열렸습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 진운]
          text: "오늘은 원고를 받지 않는다. 두 사람이 자기 말로 답하라."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제가 먼저 말하면 어머니가 위험해질 수 있습니다. 그래도 더는 남의 글을 읽지 않겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "진운공의 어머니를 찾는 일과 이 문서를 거부하는 일을 함께 하겠습니다."
      - choice:
          key: c2_council
          prompt: "혼인 회의에서 무엇을 먼저 밝히겠습니까?"
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "숨은 세 조항을 읽는다"
              add: { legitimacy: 2, nobles_support: 1 }
              goto: council_clauses
            - text: "진운에게 먼저 말하게 한다"
              add: { rival_trust: 2, legitimacy: 1 }
              goto: council_jinun
            - text: "조건을 고쳐 혼인한다"
              goto: go_15_name_erased
            - text: "여섯 집을 모욕한다"
              add: { suspicion: 2 }
              goto: council_insult_cost

  council_clauses:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [진운, 칠숙]
          text: "혼인 뒤 진운공을 다음 왕으로 세우고, 장수와 창고지기를 여섯 집이 정한다고 적었습니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "이것은 두 사람의 혼인이 아니라 왕의 손발을 사는 계약입니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "왕 한 사람에게 모든 것을 맡기지 않겠다는 안전장치입니다."
      - say:
          char: 진운.angry
          camera: medium
          with: [칠숙]
          text: "그러면서 왕이 될 사람의 뜻은 한 줄도 묻지 않았군요."
      - goto: council_broken

  council_jinun:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만, 칠숙]
          wait: 850
          unskippable: true
          text: "<speed=18>저는 왕좌를 원합니다. 그러나 어머니의 목숨과 공주의 침묵으로 산 왕좌는 받지 않겠습니다.</speed>"
      - say:
          char: 칠숙.angry
          camera: close
          with: [진운]
          text: "한 사람의 두려움 때문에 여섯 집의 약속을 버리겠습니까?"
      - say:
          char: 진운.angry
          camera: close
          with: [칠숙]
          text: "두려워서 읽었습니다. 지금은 두려워도 제 말을 합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "이제야 경쟁할 사람이 제 앞에 섰군요."
      - goto: council_broken

  council_insult_cost:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만.angry
          camera: medium
          with: [진평왕, 칠숙]
          text: "여섯 집이 왕실의 혼인을 장사로 만들었습니다. 부끄러운 줄 아십시오."
      - say:
          char: 칠숙.angry
          camera: close
          with: [덕만]
          text: "우리 군사와 곡식이 없으면 왕실도 하루를 버티지 못합니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만, 칠숙]
          text: "둘 다 입을 다물어라. 모욕과 협박을 걷어 내고 문서로 말하라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "명심하겠습니다. 감정이 아니라 세 조항의 책임을 묻겠습니다."
      - goto: council_broken

  council_broken:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: center }
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 진운]
          text: "당사자 두 사람이 거부했다. 이 혼인 논의는 여기서 끝낸다."
      - say:
          char: 진평왕
          camera: close
          with: [진운]
          text: "진운의 어머니를 찾아 왕실 보호 아래 두어라."
      - say:
          char: 진운
          camera: close
          with: [진평왕]
          text: "전하, 저도 찾는 일에 참여하게 해 주십시오."
      - say:
          char: 진평왕
          camera: close
          with: [진운]
          text: "허락한다. 다만 복수하려 칼을 들면 그 칼부터 거둔다."
      - char: { id: 비담, position: center }
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "기록관이 원본 곡식 장부와 합의서의 첫 장을 작은 기록방에 숨겼답니다. 오늘 밤 직접 내놓겠다고 합니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "혼자 두지 마세요. 문서보다 그 사람부터 살아서 와야 합니다."
      - goto: chapter2_end

  chapter2_end:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: pulse
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          delivery: calm
          text: "궁이 조용해진 지 두 시간쯤 지난 뒤, 기록방 앞에서 아진이 덕만을 기다리고 있었습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "기록관에게 가지 마십시오. 오늘 밤 그 방에서 문서를 가져오라는 명령을 받았습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진은 아직 그 명령을 따르지 않았군요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "문을 열었을 때는 이미 늦었습니다."
      - say:
          with: [덕만, 아진]
          wait: 800
          text: "닫힌 문 아래로 피가 가느다랗게 흘러나왔습니다. 방 안에서는 무언가 쓰러지는 소리가 한 번 들렸습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [아진]
          text: "열쇠를 주세요. 살아 있는 사람이 있다면 문서보다 먼저 꺼냅니다."

  go_11_borrowed_shame:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만.angry
          camera: close
          with: [진운]
          text: "남이 써 준 글도 거부하지 못하면서 왕이 되겠다는 겁니까?"
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "공주님은 지킬 사람이 안전하니 그렇게 말할 수 있겠지요."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진운]
          text: "보십시오. 공주께서는 혼인이 아니라 진운공의 이름부터 모욕합니다."
      - effect: darken
      - say:
          text: "진운은 원고를 끝까지 읽었고, 모욕당한 왕족을 지키겠다며 여섯 집의 군사가 궁문에 모였습니다."
      - gameOver:
          title: "운명 11 — 빌린 수치"
          message: "덕만은 강요받는 사람을 적으로 만들었고, 진운은 자기 목소리를 찾기 전에 귀족 연합의 깃발이 되었습니다."

  go_12_hostage_blood:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "혼인 문서의 진위를 밝힐 때까지 진운공을 왕실 보호 아래 두겠습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "그 말을 듣는 순간 어머니를 죽일 겁니다."
      - say:
          with: [덕만, 진운]
          text: "해가 지기 전에 서쪽 별채에서 피 묻은 비녀가 도착했습니다."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "보호라는 말로 저를 가두고 어머니를 죽게 했습니다."
      - gameOver:
          title: "운명 12 — 보호 아래의 인질"
          message: "진운을 먼저 가두자 인질을 잡은 자들은 그의 어머니를 해쳤고, 진운은 덕만의 가장 완강한 적이 되었습니다."

  go_13_signed_bride:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "원본을 보여 주면 혼인 논의를 받아들이겠습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "논의만으로는 부족합니다. 먼저 이 약속에 도장을 찍으시지요."
      - say:
          with: [덕만, 칠숙]
          text: "덕만이 도장을 찍자 원본은 나오지 않고, 혼인을 받아들였다는 사본만 여섯 집으로 퍼졌습니다."
      - effect: darken
      - say:
          char: 칠숙
          camera: close
          with: [덕만]
          text: "이제 거부하시면 왕실이 약속을 깬 것이 됩니다."
      - gameOver:
