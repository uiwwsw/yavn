script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제2장 — 세 장의 청혼서"
      - say:
          delivery: calm
          wait: 700
          text: "석 달이 흘러, 631년 늦여름."
      - say:
          with: [덕만]
          wait: 650
          text: "그 석 달 동안 세 집안이 덕만에게 청혼서를 보냈습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "전하께서 석 달 동안 세 번 미루셨습니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "그래서 세 집이 무엇을 했습니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "곡식 수레와 호위를 하나씩 거뒀습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "제 혼인 답을 듣자고 궁을 멈춘 겁니까?"
      - char:
          id: 진평왕
          position: right
      - say:
          with: [진평왕, 덕만]
          wait: 650
          text: "진평왕은 약을 두 번 마신 뒤에야 회의장에 들어왔습니다."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [덕만]
          text: "내가 더 미루면 궁문부터 비게 된다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "그래서 오늘은 제가 막아야 합니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "아니다. 오늘은 네가 말할 시간을 사는 것이다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "혼인하시면 남편이 공주님 대신 말할 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "혼인하면 제 말도 남편 허락을 받아야 합니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "감옥도 겉만 화려하면 덜 무서워 보이니까요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "그래도 갇히는 건 똑같지요."
      - char:
          id: 진운
          position: right
      - say:
          with: [진운]
          wait: 650
          text: "진운은 청혼서를 펼쳤지만 끝내 고개를 들지 못했습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "진운이라 합니다. 왕실의 먼 친척입니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "저와 혼인하시면 목숨은 안전할 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그런데 왜 미안한 표정이죠?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          wait: 750
          text: "제가 원해서 하는 청혼이 아니니까요."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "진운공은 왕실의 남자입니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "혼인 뒤에는 공주님 대신 회의에 앉지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "그다음에는 왕좌에도 앉히시겠군요."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "그 문장도 제가 쓴 것이 아닙니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "한 집에는 군사를 약속했습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "한 집엔 세금을 깎고, 다른 집 비밀은 덮기로 했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "세 집이 나라와 제 선택까지 마음대로 나눠 가졌군요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "동문 밖에 말 두 필을 준비했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "저와 함께 도망가자는 뜻입니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          wait: 700
          text: "공주님이 직접 정할 일 하나는 남기고 싶었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그 선택을 할지는 제가 정합니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그럼 문서에 적힌 말 말고, 진짜 뜻을 듣죠."
      - branch:
          cases:
            - when:
                var: sowon_trust
                op: gte
                value: 2
              goto: remembered_sowon_knot
            - when:
                var: bidam_trust
                op: gte
                value: 2
              goto: remembered_bidam_copy
          default: suitor_choice

  remembered_sowon_knot:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "소원은 세 청혼서의 붉은 끈을 하나씩 풀어 나란히 놓았습니다."
      - say:
          with: [덕만, 소원]
          text: "세 끈 모두 가짜 노리개처럼 매듭 하나가 빠져 있었습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이 청혼서도 가짜 노리개를 만든 사람이 꾸민 거예요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "나한테 누명을 씌운 사람이 혼인까지 정했네."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "이번엔 제가 먼저 찾았죠?"
      - add: { insight: 1 }
      - goto: suitor_choice

  remembered_bidam_copy:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 품에서 거래 장부 원본을 꺼내 내밀었습니다."
      - say:
          with: [덕만, 비담]
          text: "대신 사본은 다시 자기 품에 챙겼습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이번에는 진짜를 드리지요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "대신 원하는 게 뭡니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "다음번에도 저부터 찾아 주십시오."
      - add: { insight: 1 }
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "먼저 각자가 정말 원하는 걸 확인해야 합니다."
          char: 덕만
          camera: close
          with: []
          options:
            - text: "진운의 뜻을 묻는다"
              add: { nobles_support: 1 }
              goto: suitor_jinun
            - text: "비담이 원하는 걸 묻는다"
              add: { bidam_trust: 1, insight: 1 }
              goto: suitor_bidam
            - text: "유신과 떠난다"
              goto: go_12_warm_choice
            - text: "세 집안을 공개적으로 비웃는다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          wait: 600
          text: "사람들이 나가자 방에는 펴지지 않은 청혼서만 남았습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "진운공도 이 혼인을 원합니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "아닙니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          wait: 850
          text: "제가 거절하면 어머니가 다칩니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그래서 대신 저를 가두겠다고요?"
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "그래서 적어도 먼저 말씀드렸습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "숨기지 않은 건 고맙습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담이 숨겨 둔 합의서에는 세 집에 약속한 대가가 각각 적혀 있었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "저를 입 다물게 하는 대가는 얼마였습니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "값조차 없었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "혼인만 시키면 저절로 조용해질 거라 생각했겠지요."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "누가 이 거래를 꾸몄는지 찾아 주세요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이제야 제게 먼저 일을 맡기시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          delivery: calm
          wait: 650
          text: "그날 한낮, 궁녀들이 덕만의 머리에 무거운 혼례 비녀를 꽂았습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "내가 싫다고 말해 버릴까?"
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "그러면 내가 언니 뒤에 숨었다 하겠지."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "잠깐쯤 내 뒤에 숨으면 어때."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "매번 혼자 맞아야만 강한 거야?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "이번 일은 내 입으로 말할래."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          wait: 750
          text: "대신 이 비녀부터 좀 빼 줘. 아파."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "그건 내가 어릴 때부터 잘했지."
      - say:
          with: [덕만, 천명]
          text: "문서 담당 관리가 지나가며 접은 쪽지 하나를 떨어뜨렸습니다."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "혼인 문서 원본을 찾았대."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "오늘 밤 너를 만나겠대?"
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "작은 서재 창틀에 숨겨 두겠대."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "직접 만나지 마. 소원에게 문을 잠그라 해."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "이제 언니가 나보다 더 조심하네."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          wait: 650
          text: "무섭다고 가만히 있지는 않을 거야."
      - char:
          id: 월명
          position: right
      - say:
          with: [월명]
          text: "별자리를 보는 월명이 말하면 귀족들은 잠시 조용해졌습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별자리 그림과 빈 약봉지를 가져왔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "저는 나쁜 소문 하나를 가져왔고요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "혼담을 깨는 순간 누군가는 다칩니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "이번에도 마음 편한 답은 없군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그럼 가장 덜 위험한 방법을 골라야죠."
      - choice:
          key: c2_reputation
          prompt: "오늘 안에 혼담을 끝낼 방법을 골라야 합니다."
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "별을 핑계로 미룬다"
              add: { insight: 1 }
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add: { bidam_trust: 1 }
              goto: reputation_scandal
            - text: "후보들을 비웃는다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - bg: moon_court
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "달이 뜬 뒤, 덕만은 비녀를 뺀 채 월명과 마주 섰습니다."
      - say:
          with: [덕만, 월명]
          text: "덕만은 별자리를 핑계로 세 집에 서로 다른 혼례 날짜를 알려 주려 했습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별자리를 핑계로 혼례를 미루시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "세 집에 서로 다른 날이 좋다고 알려 주세요."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "나중에 거짓말이 들키면 제가 먼저 죽겠군요."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "들키면 망설이지 말고 제 이름부터 대세요."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "제가 시켰다고 직접 말하겠습니다."
      - goto: throne_choice

  reputation_scandal:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "밤이 깊자 비담은 웃는 얼굴로 가장 독한 소문을 꺼냈습니다."
      - say:
          with: [덕만, 비담]
          text: "비담은 자신과 덕만이 밤을 함께 보냈다는 말을 퍼뜨리자 했습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "저와 밤을 보냈다는 소문이라니."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "사람들이 할 말이 많겠군요. 제 취향부터요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "비담 이름도 아깝습니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "제 이름은 더 떨어질 데도 없습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "제가 고른 소문이니, 제 이름도 제가 감당하겠습니다."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          delivery: calm
