script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제2장 — 혼인은 가장 아름다운 유배다"
      - say:
          char: 칠숙
          framing: full
          with:
            - 덕만
          text: "세 가문이 공주님의 손을 청했습니다. 어느 집을 고르셔도 왕실은 든든한 담장을 얻을 것입니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "담장이 셋이면 감옥이지요. 세 가문이 원하는 건 제 손입니까, 빈 왕좌입니까?"
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구부터 만날까?"
          char: 덕만
          framing: closeup
          options:
            - text: "진운에게 조건을 묻는다"
              add:
                rival_trust: 1
                legitimacy: 1
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add:
                bidam_trust: 1
                insight: 1
              goto: suitor_bidam
            - text: "유신과 달아난다"
              goto: go_12_warm_choice
            - text: "세 사자를 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운
          framing: full
          with:
            - 덕만
          text: "저와 혼인하면 공주께서는 삽니다. 대신 저는 왕이 되고, 공주께서는 왕이 될 필요가 없어지지요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "살려 줄 테니 필요 없는 사람이 되라. 그 말을 대신하는 그대도 자유롭지는 않군요."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담
          framing: bust
          with:
            - 덕만
          text: "첫 집은 군권, 둘째는 세금, 셋째는 공주님의 침묵을 받기로 했습니다. 신부 한 분을 세 번 파는 솜씨가 제법입니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "내 침묵에는 얼마를 매겼지? 적어도 군권보다는 비쌌으면 좋겠는데."
      - say:
          char: 비담
          framing: bust
          text: "유감스럽게도 덤이었습니다. 이 궁은 여자 입을 물건으로 세지도 않으니까요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "열한 살 때 혼례 비녀가 무겁다고 울었지. 그땐 내가 빼 줬어. 이번엔 어디까지 다칠 셈이니?"
      - choice:
          key: c2_reputation
          prompt: "혼담을 깨려면 무엇을 버릴까?"
          char: 덕만
          framing: closeup
          with:
            - 천명
          options:
            - text: "별의 흉조를 빌린다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add:
                bidam_trust: 1
                nobles_support: -1
              goto: reputation_scandal
            - text: "후보들을 조롱한다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명
          framing: bust
          text: "별은 입이 없습니다. 권세 있는 사람이 그 침묵에 자기 말을 얹지요. 흉조가 필요하시다면, 사흘 안에 만들어 드리겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "별을 믿지는 않지만, 별을 두려워하는 사람은 믿습니다. 사흘이면 충분해요."
      - add:
          insight: 1
      - goto: throne_choice

  reputation_scandal:
    actions:
      - say:
          char: 비담
          framing: bust
          text: "제 평판을 빌리시다니 안목이 나쁘십니다. 돌려주지 않으셔도 됩니다. 원래 주인이 버린 물건이라."
      - say:
          char: 덕만
          framing: bust
          text: "버린 물건치고는 값을 자주 묻는군요. 이번에는 내가 제대로 써 보지요."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          char: 진평왕
          framing: bust
          text: "아비는 네가 싫다고 하면 그만두고 싶다. 왕은 그 한마디로 나라를 흔들 수 없다. 덕만아, 어느 쪽의 답을 듣겠느냐?"
          wait: 750
      - choice:
          key: c2_throne
          prompt: "모두가 답을 기다린다. 무엇을 말할까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "한 사람만 고르겠다"
              add:
                insight: 1
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add:
                army_support: 1
              goto: throne_delay
            - text: "합의서를 펼친다"
              add:
                legitimacy: 2
                nobles_support: -1
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - say:
          char: 칠숙
          framing: bust
          text: "세 가문이 한 분께 합의할 때까지 기다리시겠다는 말씀이십니까? 참으로 공평한 조건입니다."
      - say:
          char: 덕만
          framing: bust
          text: "세 가문이 신라보다 먼저 하나가 되는 날을 보겠다는 뜻입니다. 그날은 제가 직접 축하드리지요."
      - goto: chapter2_end

  throne_delay:
    actions:
      - say:
          char: 유신
          framing: bust
          text: "삼 년을 버셨습니다. 대신 국경에서 삼 년을 갚으셔야 합니다. 전쟁은 구실로 쓴 사람을 기억합니다."
      - say:
          char: 덕만
          framing: bust
          text: "알아요. 방패 뒤에 숨으려고 든 것이 아니니까. 국경으로 갈 준비를 하세요."
      - goto: chapter2_end

  throne_reveal:
    actions:
      - effect: impact
      - say:
          char: 덕만
          framing: closeup
          delivery: angry
          text: "여기에는 제 이름이 세 번 적혀 있습니다. 군권의 값으로, 세금의 값으로, 침묵의 값으로. 어느 분의 신부부터 되어 드릴까요?"
          wait: 900
      - say:
          delivery: whisper
          text: "아무도 축하하지 않았다. 비단 소매 스치는 소리만 길게 이어졌고, 세 가문은 처음으로 서로의 얼굴을 보았다."
      - goto: chapter2_end

  chapter2_end:
    actions:
      - bg: locked_room
      - effect: focus
      - say:
          delivery: whisper
          text: "그날 밤, 합의서를 건넨 귀족이 덕만의 침상 앞에 엎드려 있었다. 피는 아직 따뜻했고, 문빗장은 안쪽에 걸려 있었다."
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "혼례방은 피했는데…… 누군가 내 방을 신방보다 완벽하게 꾸몄군. 신랑 대신 시체를 눕혀서."
      - say:
          text: "제2장 완료 — 덕만은 혼인의 자유를 얻는 대신, 세 가문의 원한을 샀다."

  go_12_warm_choice:
    actions:
      - gameOver:
          title: "운명 12 — 왕관보다 따뜻한 것"
          message: "덕만과 유신은 새벽 성문을 나섰다. 두 사람은 오래 살아 서로의 이름을 불렀을지도 모른다. 신라의 역사에서 덕만이라는 이름은 그날 이후 사라졌다."
  go_13_three_knives:
    actions:
      - gameOver:
          title: "운명 13 — 세 개의 칼"
          message: "세 가문은 처음으로 완벽히 합의했다. 덕만을 왕위에서 지워야 한다는 데에. 공주의 마차는 세 영지의 경계가 만나는 곳에서 발견되었다."
  go_14_barren_lie:
    actions:
      - gameOver:
          title: "운명 14 — 아이를 낳지 못한 거짓말"
          message: "거짓 진단은 혼담보다 먼저 왕위 계승권을 빼앗았다. 덕만은 건강하다는 것을 증명할수록 거짓말쟁이가 되었다. 그녀는 살아남았지만 후계자 명단에서 영원히 지워졌다."
  go_15_laughing_bride:
    actions:
      - gameOver:
          title: "운명 15 — 웃는 신부"
          message: "연회장은 웃음으로 가득 찼다. 다음 날 세 후보 중 누구도 청혼을 거두지 않았고, 모욕당한 가문들은 신부가 혼례날 웃지 못하게 만들었다."
  go_16_unmarried_crime:
    actions:
      - gameOver:
          title: "운명 16 — 혼인하지 않은 죄"
          message: "거부는 용감했지만 왕명을 거스른 죄가 되었다. 덕만은 탑에 유폐되어 창밖의 즉위 북소리를 들었다. 그 북은 다른 사람을 위해 울렸다."
