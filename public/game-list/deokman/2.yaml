          with:
            - 덕만
            - 소원
          delivery: whisper
          text: "대답 대신 문을 한 번 두드리는 소리가 났습니다. 이어 사람의 무게가 문짝에 기대어 천천히 미끄러졌습니다. 피가 덕만의 신발 끝에 닿는 순간, 방 안은 다시 조용해졌습니다."

