script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제2장 — 붉은 혼인끈"
      - say:
          delivery: calm
          text: "석 달 뒤, 631년 늦여름."
      - say:
          with: [덕만]
          text: "덕만의 누명은 벗겨졌지만, 이번에는 청혼서 세 장이 그 앞에 놓였습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "혼인 뒤엔 남편이 대신 말합니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "제 입까지 혼수로 달라는군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "칼보다 비단이 보기 좋지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "목을 조르는 건 똑같습니다."
      - char:
          id: 진운
          position: right
      - say:
          with: [진운]
          text: "진운은 준비된 청혼서를 펴면서도 덕만의 눈을 보지 못했습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "진운이라 합니다. 왕실과는 먼 친척입니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "저와 혼인하시면 안전합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "왜 사과하는 얼굴입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제가 쓴 말이 아니어서요."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "첫째 가문에는 군사를 주겠답니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "둘째에는 세금을 깎아 주고, 셋째에는 공주님의 침묵을요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "제 군사와 세금, 입까지 셋이 나눠 가졌군요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "동문에 말 두 필을 뒀습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "도망가라는 뜻입니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "길 하나는 남겨 두고 싶었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "도망칠지는 제가 정하죠."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "한 사람씩, 자기 말부터 듣죠."
      - branch:
          cases:
            - when:
                var: sowon_trust
                op: gte
                value: 2
              goto: remembered_sowon_knot
            - when:
                var: bidam_trust
                op: gte
                value: 2
              goto: remembered_bidam_copy
          default: suitor_choice

  remembered_sowon_knot:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "소원은 세 청혼서에 묶인 붉은 끈을 나란히 놓았습니다."
      - say:
          with: [덕만, 소원]
          text: "세 끈 모두 덕만의 가짜 노리개처럼 매듭 하나가 빠져 있었습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이것도 같은 손이 묶었어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "누명을 씌운 자와 혼담을 꾸민 자가 같은 편이군."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "이번엔 먼저 알아봤죠?"
      - add: { insight: 1 }
      - goto: suitor_choice

  remembered_bidam_copy:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 거래 장부의 사본이 아니라 원본을 내밀었습니다."
      - say:
          with: [덕만, 비담]
          text: "비담은 사본을 품에 도로 넣었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이번엔 진짜를 드립니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "대신 뭘 원합니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "다음에도 제게 먼저 물어봐 주십시오."
      - add: { insight: 1 }
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구 말부터 들을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "진운의 뜻을 묻는다"
              add: { nobles_support: 1 }
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add: { bidam_trust: 1, insight: 1 }
              goto: suitor_bidam
            - text: "유신과 떠난다"
              goto: go_12_warm_choice
            - text: "세 가문을 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "덕만은 다른 사람들을 물리고 진운과 단둘이 마주 앉았습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그대가 원한 혼인입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "아닙니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "거절하면 어머니가 다칩니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그래서 나를 가두겠다고요?"
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "그래서 먼저 말한 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "먼저 털어놓은 건 고맙습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 합의서를 감춘 방으로 덕만을 이끌었습니다. 같은 혼인인데도 약속한 대가는 제각각이었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내 침묵은 얼마였습니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "값도 없었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "당연히 딸려 온다고 봤지요."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "장부를 쓴 자를 찾아 주세요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이제야 제 일을 주시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          delivery: calm
          text: "그날 한낮, 궁녀들이 덕만의 머리에 혼례 비녀를 꽂았습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "싫다고 내가 말해 줄까?"
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "언니 뒤에 숨었다고 할 거야."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "잠깐 숨는 게 뭐 어때."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "매번 혼자 맞아야 강한 거야?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "이번엔 제가 말할래요."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "대신 이 비녀 좀 빼 줘요."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "그건 내가 제일 잘하지."
      - char:
          id: 월명
          position: right
      - say:
          with: [월명]
          text: "월명이 별을 읽으면 귀족들은 입을 다물었습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별자리 그림과 빈 약봉지를 가져왔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "소문 하나도 준비했고요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "혼담을 깨면 누군가는 다칩니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "어떤 수를 써도 누군가는 다치겠군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그럼 피해가 가장 적은 거짓말을 고르죠."
      - choice:
          key: c2_reputation
          prompt: "혼담을 어떻게 흔들까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "별을 핑계로 미룬다"
              add: { insight: 1 }
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add: { bidam_trust: 1 }
              goto: reputation_scandal
            - text: "후보들을 비웃는다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - bg: moon_court
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "달이 뜬 뒤, 덕만은 월명을 뜰로 불렀습니다."
      - say:
          with: [덕만, 월명]
          text: "덕만은 월명의 별자리 풀이를 빌려 세 혼례 날짜를 서로 어긋나게 만들려 했습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "별을 핑계로 미루시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "세 가문에 서로 다른 날이 길일이라 알려 주세요."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "거짓이 들키면 저도 죽습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "내일 제가 거짓이라 밝히겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "들키면 제가 시켰다고 하세요."
      - goto: throne_choice

  reputation_scandal:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "밤이 깊자 비담이 웃으며 뜻밖의 말을 꺼냈습니다."
      - say:
          with: [덕만, 비담]
          text: "비담이 고른 소문은 자신과 덕만이 밤을 함께 보냈다는 것이었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "저와 밤을 보냈다는 소문이라."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "취향이 나쁘단 말은 듣겠군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그대 평판이 걱정됩니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "제 평판은 더 내려갈 곳이 없습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "제가 허락한 소문이니, 제 몫은 제가 감당하겠습니다."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          delivery: calm
          text: "그날 해 질 무렵, 세 가문의 도장이 왕 앞에 놓였습니다."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [덕만]
          text: "<speed=20>싫다면 전부 찢고 싶구나.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [진평왕]
          text: "오늘만은 왕이 아니라 아버지여야 했어요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "그러면 네 답을 빼앗게 된다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "왕은 참 나쁜 아버지네요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: sad
          text: "<speed=18>그래서 미안하구나.</speed>"
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "해가 졌습니다. 답하시지요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "어느 답도 널 그대로 두진 않을 게다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그래도 제 입으로 고르겠습니다."
      - choice:
          key: c2_throne
          prompt: "세 혼담에 무엇이라 답할까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "세 집의 합의를 요구한다"
              add: { nobles_support: 1, power: 1 }
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add: { army_support: 1 }
              goto: throne_delay
            - text: "밀약을 공개한다"
              add: { legitimacy: 1, insight: 1 }
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - char:
          id: 칠숙
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "세 가문이 한 사람에 합의하면 하죠."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "그런 날이 오겠습니까?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "안 오겠죠. 그러니 혼인도 없어요."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "다음엔 말로 끝나지 않을 겁니다."
      - goto: chapter2_end

  throne_delay:
    actions:
      - char:
          id: 칠숙
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "전쟁이 끝날 때까지 미루겠다는 답, 잘 들었습니다."
      - say:
          char: 칠숙
          camera: close
          with: [덕만]
          text: "대신 국경으로 가셔야 합니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "처음부터 궁에서 보낼 셈이었군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "부디 살아서 돌아오시지요."
      - goto: chapter2_end

  throne_reveal:
    actions:
      - char:
          id: 칠숙
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          with: [덕만, 칠숙]
          text: "덕만이 세 가문의 밀약을 펼쳤습니다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [칠숙]
          text: "군사, 세금, 그리고 제 침묵."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "어느 약속이 진짜입니까?"
      - say:
          char: 칠숙.smile
          camera: medium
