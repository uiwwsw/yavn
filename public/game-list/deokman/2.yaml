script:
  - scene: secret_reunion

scenes:
  secret_reunion:
    actions:
      - bg: princess_chamber
      - camera: wide
      - say:
          channel: record
          text: "제3장 — 두 공주의 봄"
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          camera: medium
          text: "모란 온실의 비밀문이 닫혔습니다. 천명은 촛불을 들어 덕만의 얼굴을 오래 비췄습니다. 탁자 위에는 사망 기록과 서쪽 창고 운송표가 놓였지만, 누구도 먼저 종이를 보지 못했습니다."
      - say:
          when: { var: identity_mode, op: eq, value: public }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "장터에서 네 이름을 외쳤다는 소문이 네 편지보다 먼저 왔어. 살아 있다는 말에 웃었다가, 또 나한테 묻기도 전에 네 목을 걸었다는 데 화가 났어."
      - say:
          when: { var: identity_mode, op: eq, value: borrowed }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "감찰관 이름까지 빌렸다며. 네 진짜 이름을 확인하기도 전에 저들은 훔친 이름부터 재판하려 들 거야. 그 빚은 숨기지 말고 같이 갚자."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "당장 안고 싶지만 먼저 의심해야 해. 내가 얼굴만 믿으면 내일 이 궁은 가짜 덕만 열 명을 데려와. 내가 너를 밀어내도 다시 믿게 할 증거를 줘."
      - choice:
          key: c3_proof
          prompt: "천명의 손이 떨린다. 무엇으로 십 년의 틈을 건널까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "그을린 사망 기록을 밀어 준다"
              when: { var: death_register, op: eq, value: true }
              add: { cheonmyeong_trust: 2, evidence: 1 }
              goto: proof_record
            - text: "아버지의 모란 질문을 되돌려 준다"
              add: { cheonmyeong_trust: 1, king_trust: 1, insight: 1 }
              goto: proof_memory
            - text: "언니가 숨기는 두려움을 먼저 꺼낸다"
              add: { cheonmyeong_trust: 2, mercy: 1 }
              goto: proof_sister

  proof_record:
    actions:
      - sticker: { id: c3_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(170px, 21%, 320px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "도장은 아버님 것이지만 획은 궁 서기관 것이 아니야. 누군가 왕의 권위와 기록관의 손을 따로 훔쳐 한 장에서 만나게 했어."
      - clearSticker: { id: c3_record, leave: fadeOut }
      - goto: sister_oath

  proof_memory:
    actions:
      - say:
          char: 덕만
          text: "꽃에는 향기가 없었고, 아버지에게는 명령을 끝까지 지킬 손이 없었어. 그날 아버지는 그려진 것보다 먼저 빠진 걸 보라고 했지."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아버님이 결정을 미룰 때마다 하던 말이야… 너, 정말 그 방에 있었구나."
      - goto: sister_oath

  proof_sister:
    actions:
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "내가 가짜일까 봐만 무서운 게 아니지. 진짜 덕만이면 네가 혼자 십 년 버틴 자리와 이름이 작아질까 봐도 무서운 거야."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "맞아. 네가 살아 돌아왔는데 기쁨보다 내 자리를 먼저 셌어. 그 마음을 숨긴 채 네 언니인 척 안는 것이 더 무서워."
      - goto: sister_oath

  sister_oath:
    actions:
      - say:
          channel: narration
          text: "천명이 두 번째 빗장까지 걸었습니다. 벽장을 열자 혼인 후보와 사병 수가 빼곡한 지도가 나왔습니다. 천명의 이름에는 붉은 혼례끈이 매여 있었습니다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "내일 네가 내 옆에 서면 저들은 자매가 만났다고 울기 전에 어느 공주에게 몇 표가 갈지 셀 거야. 그 셈까지 견디며 설래?"
      - choice:
          key: c3_sisters_strategy
          prompt: "새벽 조회가 열린다. 두 자매는 어떤 모습으로 문을 열까?"
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "손을 맞잡고 두 공주로 들어선다"
              set: { sisters_public: true }
              add: { people_support: 2, cheonmyeong_trust: 1, fear: 1 }
              goto: public_sisters
            - text: "천명은 궁, 덕만은 시장을 맡는다"
              set: { sisters_public: false }
              add: { insight: 1, cheonmyeong_trust: 2, nobles_support: 1 }
              goto: divided_roles
            - text: "덕만이 시녀복을 입고 천명 뒤에 선다"
              set: { sisters_public: false, identity_mode: hidden }
              add: { evidence: 1, fear: 1 }
              goto: hidden_sister

  public_sisters:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "두 공주가 나란히 계단을 내려오자 궁문 밖에서 환호가 터졌습니다. 무릎 꿇은 귀족들은 고개를 숙인 채 서로의 손가락이 어느 쪽을 향하는지 살폈습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "오늘은 사람들이 우리가 잡은 손부터 봤어. 내일부터는 어느 쪽 손이 위였는지 따지고 그 사이에 칼을 끼우겠지."
      - goto: spring_ambush

  divided_roles:
    actions:
      - bg: moon_court
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "낮에는 천명이 회의의 거짓말을 적고, 덕만은 시장의 값을 외웠습니다. 밤마다 두 종이를 포개면 귀족 한 사람의 말이 어긋났습니다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "궁과 시장에서 같은 거짓말의 앞뒤를 잡을 수 있어. 대신 네가 다치면 나는 또 소문과 장부를 지나 한발 늦게 도착하겠지."
      - goto: spring_ambush

  hidden_sister:
    actions:
      - bg: shadow_corridor
      - char: { id: 덕만, position: left, emotion: attendant }
      - say:
          channel: narration
          text: "시녀복을 입은 덕만 앞에서 귀족들은 말을 삼키지 않았습니다. 찻잔을 내려놓는 손보다 먼저, 숨겨 둔 멸시와 계획이 쏟아졌습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "널 살리겠다고 또 네 이름을 시녀복 안에 숨겼어. 이 밤이 길어질수록 내가 칠숙 대신 ‘없는 덕만’을 쓰는 셈이야."
      - goto: spring_ambush

  spring_ambush:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 칠숙, position: right, emotion: angry }
      - char: { id: 천명, position: center, emotion: nervous }
      - say:
          channel: narration
          text: "봄 연회의 북이 멎는 순간, 꽃바구니 세 개에서 칼이 솟았습니다. 칠숙은 칼보다 먼저 호위병들의 눈이 어느 공주를 향하는지 확인했습니다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만, 천명]
          text: "공주가 둘이니 호위의 눈도 반으로 갈리는군요. 기록하기 쉽게 제가 한 분으로 줄여 드리겠습니다."
      - choice:
          key: c3_ambush
          prompt: "꽃잎 아래 첫 칼, 회랑 뒤 두 번째 발소리. 자매는 어떻게 떨어지지 않을까?"
          char: 덕만
          camera: reaction
          with: [천명, 칠숙]
          options:
            - text: "천명과 등을 맞대고 칼을 막는다"
              add: { cheonmyeong_trust: 2, people_support: 1, army_support: 1 }
              goto: survive_together
            - text: "피 묻은 뜰에서 계승권을 선포한다"
              goto: bad_early_crown
            - text: "퇴로를 열어 칠숙을 회랑으로 몬다"
              add: { evidence: 2, mercy: 1, fear: 1 }
              goto: capture_order

  survive_together:
    actions:
      - say:
          channel: narration
          text: "천명의 비녀가 칼끝을 흘렸고 덕만은 언니의 빈틈을 몸으로 막았습니다. 군사가 들이닥쳤을 때 두 사람은 같은 피를 소매에 묻힌 채 서 있었습니다."
      - goto: sisters_end

  capture_order:
    actions:
      - say:
          channel: narration
          text: "덕만이 일부러 동문을 비우자 칠숙은 미끼를 물었습니다. 좁은 회랑에서 옷자락이 찢겼고, 그 안에서 서쪽 창고 열쇠와 사병 명부가 떨어졌습니다."
      - goto: sisters_end

  sisters_end:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left, emotion: princess }
      - char: { id: 천명, position: right }
      - say:
          char: 천명
          text: "이 밀랍의 흠집이 네가 국경에서 가져온 붉은 인장과 같아. 우리를 죽일 칼값도 백성에게 갈 곡식에서 나왔다는 뜻이야."
      - say:
          char: 덕만
          text: "서쪽 창고에서 오늘 밤 마지막 수레가 나가. 칼잡이는 이름을 감췄어도, 칼을 먹인 곡식 수레는 길에 제 무게를 남겨."
      - say:
          channel: record
          text: "두 공주는 서로를 되찾았고, 암살자의 밀랍을 국경의 곡식길과 연결했습니다. 자매의 재회는 곧 첫 공동 수사로 바뀌었습니다."
      - goto: /3.yaml

  bad_early_crown:
    actions:
      - bg: council_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.princess_angry
          text: "피를 본 지금 선언하겠습니다. 제가 신라의 계승자입니다. 저 칼이 누구를 겨눠야 하는지도 똑똑히 보십시오."
      - say:
          channel: narration
          text: "피 묻은 뜰에서 덕만이 계승권을 외치는 순간 자매의 등이 떨어졌고, 호위의 시선은 왕위 선언에 쏠렸습니다. 숨어 있던 두 번째 칼은 미끼인 칠숙이 아니라 혼자 앞선 덕만을 향했습니다."
      - say:
          char: 천명.sad
          text: "덕만아, 돌아봐! 저 사람이 미끼야. 네 뒤에—"
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 회랑에서 자객을 추격하던 중 피살. 천명 공주 단독 계승을 귀족 회의가 즉시 승인함."
      - gameOver:
          title: "운명 — 갈라진 자매의 등"
          message: "암살자의 목적은 칠숙을 잡는 일도 왕위를 논하는 일도 아니었습니다. 두 공주를 떼어 놓는 순간 덕만은 두 번째 칼에 쓰러졌고, 살아남은 자의 기록만 왕위가 되었습니다."
