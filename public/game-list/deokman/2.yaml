script:
  - scene: secret_reunion

scenes:
  secret_reunion:
    actions:
      - bg: princess_chamber
      - camera: wide
      - say:
          channel: record
          text: "제3장 — 두 공주의 봄"
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          camera: medium
          text: "천명은 죽은 줄 알았던 쌍둥이의 얼굴을 한참 바라보았습니다. 두 사람 사이에는 십 년과 한 장의 사망 기록이 놓여 있었습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "얼굴만으로 믿으면 궁은 내일 열 명의 덕만을 데려올 거야. 네가 내 동생이라는 증거를 보여 줘."
      - choice:
          key: c3_proof
          prompt: "천명에게 무엇으로 자신을 증명하겠습니까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "위조된 사망 기록을 보여 준다"
              when: { var: death_register, op: eq, value: true }
              add: { cheonmyeong_trust: 2, evidence: 1 }
              goto: proof_record
            - text: "진평왕만 아는 모란 그림의 질문을 전한다"
              add: { cheonmyeong_trust: 1, king_trust: 1, insight: 1 }
              goto: proof_memory
            - text: "증거보다 천명이 감춘 두려움을 먼저 말한다"
              add: { cheonmyeong_trust: 2, mercy: 1 }
              goto: proof_sister

  proof_record:
    actions:
      - sticker: { id: c3_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(170px, 21%, 320px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "이 도장은 아버님의 것이지만 글씨는 왕실 서기관의 것이 아니야. 누군가 왕의 손과 기록관의 손을 따로 빌렸어."
      - clearSticker: { id: c3_record, leave: fadeOut }
      - goto: sister_oath

  proof_memory:
    actions:
      - say:
          char: 덕만
          text: "꽃에는 향기가 없고, 왕에게는 명령을 옮길 손이 없었습니다. 전하께서 제게 찾으라 한 것은 그림의 빈자리였어요."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아버님이 실패할 때마다 하시는 말이구나. 너는 그날 정말 그 방에 있었어."
      - goto: sister_oath

  proof_sister:
    actions:
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "너는 내가 가짜이길 바라는 게 아니야. 진짜라면 나 때문에 네가 얻은 자리까지 흔들릴까 봐 무서운 거지."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "맞아. 그리고 그 생각을 한 내가 네 언니라는 게 더 무서워."
      - goto: sister_oath

  sister_oath:
    actions:
      - say:
          channel: narration
          text: "천명은 문을 잠그고 궁의 세력 지도를 펼쳤습니다. 귀족들은 천명을 왕비로 세워 다른 왕을 만들 계획이었습니다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "우리가 함께 나타나면 왕실은 강해질 수도, 둘로 찢어질 수도 있어. 네 자리를 어떻게 만들겠니?"
      - choice:
          key: c3_sisters_strategy
          prompt: "두 공주의 존재를 어떻게 정치에 사용할까요?"
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "두 공주가 함께 살아 있다고 공식 선언한다"
              set: { sisters_public: true }
              add: { people_support: 2, cheonmyeong_trust: 1, fear: 1 }
              goto: public_sisters
            - text: "천명은 궁 안, 덕만은 궁 밖의 세력을 맡는다"
              set: { sisters_public: false }
              add: { insight: 1, cheonmyeong_trust: 2, nobles_support: 1 }
              goto: divided_roles
            - text: "덕만의 귀환을 숨기고 천명의 시녀로 들어간다"
              set: { sisters_public: false, identity_mode: hidden }
              add: { evidence: 1, fear: 1 }
              goto: hidden_sister

  public_sisters:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: narration
          text: "두 공주가 나란히 궁 뜰에 서자 백성은 환호했습니다. 귀족들은 웃으며 무릎을 꿇었지만 그날 밤 각자 어느 공주를 지지할지 계산했습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "오늘 우리는 서로의 방패였어. 내일부터는 사람들이 우리를 서로의 칼로 쓰려 할 거야."
      - goto: spring_ambush

  divided_roles:
    actions:
      - bg: moon_court
      - say:
          channel: narration
          text: "천명은 회의의 말을 모으고 덕만은 시장의 소문을 모았습니다. 두 정보가 만나는 밤마다 귀족의 거짓말 하나가 드러났습니다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "우리가 다른 곳에 서 있으니 같은 거짓말을 두 방향에서 볼 수 있어. 하지만 위험할 때 서로 늦게 도착하겠지."
      - goto: spring_ambush

  hidden_sister:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "덕만은 천명의 그림자처럼 회의실을 드나들었습니다. 비밀은 정보를 주었지만 시녀에게 모욕을 던지는 사람들의 진짜 얼굴도 보여 주었습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "동생을 살리려고 다시 이름을 빼앗고 있어. 이 선택이 오래가면 내가 칠숙과 무엇이 다를까."
      - goto: spring_ambush

  spring_ambush:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 칠숙, position: right, emotion: angry }
      - char: { id: 천명, position: center, emotion: nervous }
      - say:
          channel: narration
          text: "봄 연회 날, 꽃바구니를 든 악사 셋이 동시에 칼을 뽑았습니다. 칠숙은 군사보다 먼저 두 공주 중 누가 보호받는지 살폈습니다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만, 천명]
          text: "공주가 둘이면 왕실도 두 번 흔들립니다. 오늘 하나로 줄이겠습니다."
      - choice:
          key: c3_ambush
          prompt: "습격의 목적을 알아챈 순간, 무엇을 지시하겠습니까?"
          char: 덕만
          camera: reaction
          with: [천명, 칠숙]
          options:
            - text: "천명과 등을 맞대고 사람들 앞에서 싸운다"
              add: { cheonmyeong_trust: 2, people_support: 1, army_support: 1 }
              goto: survive_together
            - text: "칠숙을 살려 잡아 배후의 이름을 묻는다"
              add: { evidence: 2, mercy: 1, fear: 1 }
              goto: capture_order
            - text: "지금 혼란을 이용해 바로 왕좌를 요구한다"
              goto: bad_early_crown

  survive_together:
    actions:
      - say:
          channel: narration
          text: "천명은 덕만의 왼쪽을, 덕만은 천명의 오른쪽을 지켰습니다. 습격자들은 군사가 오기 전에 물러났지만 두 사람의 연대는 온 뜰이 보았습니다."
      - goto: sisters_end

  capture_order:
    actions:
      - say:
          channel: narration
          text: "덕만은 퇴로를 열어 주는 척 칠숙을 좁은 회랑으로 몰았습니다. 칠숙은 몸을 던져 빠져나갔지만 배후가 곡식 창고와 사병을 함께 가진 귀족임을 남겼습니다."
      - goto: sisters_end

  sisters_end:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          char: 천명
          text: "우리가 살아 있다는 사실만으로는 나라가 달라지지 않아. 다음에는 사람들이 무엇으로 살아가는지 보자."
      - say:
          char: 덕만
          text: "곡식이 어디서 사라지는지부터. 칼을 든 사람보다 칼을 먹이는 장부가 먼저야."
      - say:
          channel: record
          text: "두 공주는 서로를 되찾았습니다. 동시에 같은 왕실 안에서 다른 책임을 가진 경쟁자가 되었습니다."
      - goto: /3.yaml

  bad_early_crown:
    actions:
      - bg: council_hall
      - camera: close
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.angry
          text: "왕실을 지키려면 지금 내 계승권을 인정해야 합니다."
      - say:
          channel: narration
          text: "피가 마르기도 전에 나온 왕좌의 요구는 습격의 배후보다 자매의 야심을 더 큰 소문으로 만들었습니다."
      - say:
          char: 천명.sad
          text: "네가 옳을 수도 있어. 하지만 오늘 네 말을 지지하면 사람들은 내가 살려고 동생을 왕으로 팔았다고 믿을 거야."
      - say:
          channel: record
          text: "귀족 회의는 두 공주의 격리를 의결했습니다. 칠숙의 칼이 실패한 자리에 왕실의 의심이 들어섰습니다."
      - gameOver:
          title: "운명 — 너무 이른 왕관"
          message: "위기 속 정당한 요구도 준비되지 않은 순간에는 야심으로 읽힙니다. 덕만은 계승권을 말했지만 그것을 지킬 연합을 아직 만들지 못했습니다."
