          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "한 사람을 택하면 저는 나라일에서 사라집니다. 미루면 궁에서 쫓겨나고, 비밀 문서를 펼치면 아버지가 거짓말한 왕이 됩니다. 왕의 명령을 거부하면 모두가 저를 버릇없는 딸이라 부르겠지요."
