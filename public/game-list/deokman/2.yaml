      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "덕만과 비담은 밤에 기록방 자물쇠를 열었습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "문서함이 이미 비어 있습니다. 우리를 기다린 것 같습니다."
      - effect: impact
      - say:
          text: "밖에서 횃불이 켜지고, 기록관은 공주가 원본을 훔쳐 갔다고 외쳤습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "도둑을 잡으러 들어왔다가 도둑이 될 자리에 섰군요."
      - gameOver:
          title: "운명 14 — 열린 자물쇠"
          message: "정식 열람을 피한 밤, 빈 문서함과 부서진 자물쇠가 덕만의 절도 증거가 되었습니다."

  go_15_name_erased:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "군사와 창고 조항을 고친다면 혼인하겠습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "고친 문서에는 함께 다스린다고 적었습니다."
      - say:
          with: [덕만, 진운]
          text: "그러나 새 왕을 알리는 글에는 진운의 이름만 남고 덕만의 이름은 왕비 아래로 옮겨졌습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진운]
          text: "조건을 고쳤다고 생각했는데, 제 목소리부터 지웠군요."
      - effect: darken
      - gameOver:
          title: "운명 15 — 고쳐 쓴 혼인"
          message: "덕만은 문서의 조항을 고쳤지만 왕이 될 권리까지 혼인에 맡겼고, 그의 명령은 남편의 뜻으로 기록되었습니다."
