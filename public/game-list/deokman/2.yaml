chapterTitle: "두 공주의 봄"

script:
  - scene: secret_reunion

scenes:
  secret_reunion:
    actions:
      - bg: { id: princess_chamber, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제3장 — 두 공주의 봄"
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: action
          camera: medium
          text: "천명이 촛불을 들어 내 얼굴을 비춘다. 어릴 적 베개에서 맡던 향이 난다. 손을 뻗으려다 만다. 언니는 아직 나를 부르지 않았다."
      - say:
          when: { var: identity_mode, op: eq, value: public }
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "네가 살아 있다더라. 웃어야 할지, 그 말 전한 자를 꾸짖어야 할지 모르겠더구나."
      - say:
          when: { var: identity_mode, op: eq, value: borrowed }
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "궁의 이름까지 빌렸다지. 그 일은… 내가 알아볼게. 너는 여기 앉아."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "한 가지만 묻자. 아니, 네가 말해 줘. 우리밖에 모르는 일 하나만."
      - choice:
          key: c3_proof
          prompt: "언니가 내 얼굴에서 눈을 떼지 못한다."
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "아버지의 모란 질문을 되돌려 준다"
              add: { cheonmyeong_trust: 1, king_trust: 1, insight: 1 }
              goto: proof_memory
            - text: "그을린 사망 기록을 밀어 준다"
              when: { var: death_register, op: eq, value: true }
              add: { cheonmyeong_trust: 2, evidence: 1 }
              goto: proof_record
            - text: "언니가 숨기는 두려움을 먼저 꺼낸다"
              add: { cheonmyeong_trust: 2, mercy: 1 }
              goto: proof_sister

  proof_record:
    actions:
      - bg:
          id: "princess_chamber"
          transition: "dissolve"
          duration: 720
      - sticker:
          id: "c3_record"
          image: "death_register_sticker"
          x: 50
          "y": 28
          width: "clamp(170px, 21%, 320px)"
          anchorX: "center"
          anchorY: "center"
          enter: "fadeIn"
      - say:
          channel: "narration"
          text: "천명이 종이를 받았다. 탄 귀퉁이를 펴던 손이 덕만의 이름 위에서 멈췄다. 종이를 든 팔은 좀처럼 내려오지 않았다."
      - say:
          char: "천명.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "이 종이를 가진 사람이 꼭 너라는 법은 없잖니. 그렇지?"
      - say:
          char: "덕만.wanderer"
          camera: "medium"
          with:
            - "천명"
          text: "언니는 족자를 꼭 오른쪽부터 말았어. 내가 왼쪽을 구긴다고."
      - say:
          char: "천명.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "…그날 둘이 같이 혼났지. 이리 와. 문은 잠그고."
      - clearSticker:
          id: "c3_record"
          leave: "fadeOut"
      - say:
          channel: "narration"
          text: "천명이 종이 한쪽을 잡았다. 덕만도 다른 쪽을 잡았다. 어릴 적처럼 높이가 맞지 않아 종이가 비뚤어졌다. 천명은 그제야 웃었다."
      - add:
          evidence: 1
          cheonmyeong_trust: -1
      - say:
          channel: "record"
          text: "문밖의 경비가 물러났다. 자매가 한 방에 남은 것은 십 년 만이었다."
      - goto: "sister_oath"

  proof_memory:
    actions:
      - say:
          char: 덕만
          text: "꽃 말고 없는 것을 보라셨지. 벌도 나비도 없는 모란을 놓고."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "덕만아. …한 번만 더 말해 봐. 네 목소리 좀 듣게."
      - goto: sister_oath

  proof_sister:
    actions:
      - bg:
          id: "princess_chamber"
          transition: "dissolve"
          duration: 720
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "천명"
          text: "언니는 아직도 발소리를 세네. 나 잠들면 이불 밖으로 발 내놓고 듣곤 했잖아."
      - say:
          char: "천명.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "그건 누구나 할 수 있는 말이야. 나한테 그런 얼굴 하지 마."
      - say:
          char: "천명.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "너… 웃어 봐. 아니, 울지 말고. 왼쪽 볼에 접히던 데가…"
      - say:
          channel: "narration"
          text: "덕만이 언니의 손을 제 뺨에 가져다 댔다. 천명의 엄지가 젖은 뺨을 훔쳤다. 경비가 물러가는 소리에도 둘은 돌아보지 않았다."
      - add:
          cheonmyeong_trust: 1
          evidence: -1
      - say:
          channel: "record"
          text: "천명은 문을 열기 전 동생의 손을 다시 잡았다. 이번에는 이름을 묻지 않았다."
      - goto: "sister_oath"

  sister_oath:
    actions:
      - say:
          channel: action
          text: "언니가 두 번째 빗장을 건다. 벽장에는 궁 지도가 펼쳐져 있다. 붉은 혼례끈이 낯선 가문의 이름과 언니의 이름을 잇고 있다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "내일은 다들 네 언니인 척할 거야. 그래도 내 옆에 서 줄래?"
      - choice:
          key: c3_sisters_strategy
          prompt: "새벽 조회의 종이 울린다. 언니가 문 앞에 선다."
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "천명은 궁, 덕만은 시장을 맡는다"
              set: { sisters_public: false }
              add: { insight: 1, cheonmyeong_trust: 2, nobles_support: 1 }
              goto: divided_roles
            - text: "덕만이 시녀복을 입고 천명 뒤에 선다"
              set: { sisters_public: false, identity_mode: hidden }
              add: { evidence: 1, fear: 1 }
              goto: hidden_sister
            - text: "손을 맞잡고 두 공주로 들어선다"
              set: { sisters_public: true }
              add: { people_support: 2, cheonmyeong_trust: 1, fear: 1 }
              goto: public_sisters

  public_sisters:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          camera: wide
          channel: action
          text: "손을 잡고 계단을 내려간다. 귀족들의 인사가 한 박자 늦다. 언니 손이 차다. 나는 손가락 사이를 더 깊이 끼운다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "손이 다 젖었네. 내 손인가? …놓지 마. 조금만 더."
      - goto: spring_ambush

  divided_roles:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "천명은 궁에서 들은 말을, 덕만은 시장에서 본 것을 적었다. 밤마다 맞춰 보던 두 장의 종이는 어느 날부터 한 장씩 늦게 도착했다."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "언니는 궁을 맡아. 시장에선 내가 아는 얼굴이 많아. 밤에 만나면 되잖아."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "십 년 만에 왔으면서… 오늘 하루도 같이 못 있겠니?"
      - say:
          channel: narration
          text: "약속한 방에는 차 두 잔이 있었다. 덕만은 식어 가는 언니의 잔을 바꾸어 놓고 제 잔을 들었다. 문은 끝내 열리지 않았다."
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [천명]
          text: "언니 잔은… 그대로 둬. 누구도 마시게 하지 말고."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 진료 기록 — 덕만 공주, 시장 순행 뒤 급사. 천명 공주를 시기해 독을 준비하다 스스로 마셨다는 자백문이 발견됨."
      - gameOver:
          title: "운명 — 따로 놓인 두 잔"
          message: "천명이 도착했을 때 차는 모두 식어 있었다. 덕만의 손 밑에서 발견된 자백문에는, 자매가 서로를 죽이려 했다고 쓰여 있었다."
          recoverToChoice: c3_sisters_strategy

  hidden_sister:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - char: { id: 덕만, position: left, emotion: attendant }
      - say:
          channel: narration
          text: "덕만이 차를 따르는 동안 귀족들은 말을 멈추지 않았다. 공주 앞에서는 삼켰을 이름들이 찻물 소리 사이로 흘렀다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "덕만아. 그 잔 놓아. 아까 준 상궁이 어디 갔니?"
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [천명]
          text: "벌써 맛봤어. 내가 시녀니까… 내가 먼저 마셔야 하잖아."
      - say:
          channel: narration
          text: "덕만이 넘어지자 누군가 시녀를 치우라 했다. 천명이 동생의 이름을 외쳤다. 명부를 든 관원은 그런 이름이 없다고 고개를 저었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공주 처소 잡역부 한 명 독살. 신원 미상으로 장례 없이 매장. 왕실 계승과 무관함."
      - gameOver:
          title: "운명 — 이름 없는 독살"
          message: "천명은 덕만의 얼굴을 가리지 못하게 했다. 관원은 신원 미상이라고 적었다. 언니의 목소리는 그 한 줄을 고치지 못했다."
          recoverToChoice: c3_sisters_strategy

  spring_ambush:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 칠숙, position: right, emotion: angry }
      - char: { id: 천명, position: center, emotion: nervous }
      - say:
          camera: wide
          channel: action
          text: "연회 북이 뚝 멎는다. 꽃바구니 아래서 칼날이 번쩍인다. 오른손을 뻗는다. 언니의 손목이 잡힌다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만, 천명]
          text: "두 분이 함께 나오셨군요. 어느 분께 먼저 예를 올려야 할지."
      - choice:
          key: c3_ambush
          prompt: "언니의 등 뒤에도 칼이 있다. 손을 놓을 수 없다."
          char: 덕만
          camera: medium
          with: [천명, 칠숙]
          options:
            - text: "피 묻은 뜰에서 계승권을 선포한다"
              goto: bad_early_crown
            - text: "천명과 등을 맞대고 칼을 막는다"
              add: { cheonmyeong_trust: 2, people_support: 1, army_support: 1 }
              goto: survive_together
            - text: "퇴로를 열어 칠숙을 회랑으로 몬다"
              add: { evidence: 2, mercy: 1, fear: 1 }
              goto: capture_order

  survive_together:
    actions:
      - say:
          channel: action
          text: "언니가 비녀를 뽑아 칼을 받친다. 나는 그 아래로 어깨를 밀어 넣는다. 소매에 뜨거운 것이 밴다. 언니가 내 이름을 부른다. 대답 대신 등을 맞댄다."
      - goto: sisters_end

  capture_order:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - say:
          channel: narration
          text: "칠숙이 열린 동문으로 물러났다. 덕만이 뒤따라 회랑을 꺾자 문이 닫혔다. 천명의 발소리가 나무판 너머에서 멎었다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만, 칠숙]
          text: "덕만아, 가지 마! 저자가 너무 천천히 달아나잖아!"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "언니께서 영리하시군요. 공주님도 곁에 계셨으면 좋았을 것을."
      - say:
          channel: narration
          text: "칠숙이 칼끝으로 퇴로를 막았다. 머리 위에서 기와 부스러기가 떨어졌다. 덕만이 올려다보는 순간 칠숙이 다가왔다."
      - attack:
          attacker: 칠숙
          image: chilsuk_sword_cutin
          target: 덕만
          from: right
          style: slash
          anticipation: 620
          impact: 140
          recovery: 760
          caption: 앞에서 칠숙의 칼, 등 뒤의 그림자
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 자객을 단독 추격하다 피살. 칠숙은 도주함."
      - gameOver:
          title: "운명 — 열어 준 퇴로"
          message: "문 하나를 사이에 두고 천명이 동생을 불렀다. 안쪽에서 무언가 쓰러진 뒤로는 대답이 없었다."
          recoverToChoice: c3_ambush

  sisters_end:
    actions:
      - bg: { id: princess_chamber, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left, emotion: princess }
      - char: { id: 천명, position: right }
      - say:
          camera: medium
          char: 천명
          text: "이 밀랍, 네가 가져온 인장하고 같아. 우리를 찌른 칼값이 구휼미에서 나갔구나."
      - say:
          char: 덕만
          text: "서쪽 창고에서 오늘 밤 수레가 떠난대. 언니, 이번엔 같이 가자."
      - say:
          channel: thought
          text: "언니 소매의 피가 마르기도 전이다. 나는 손에 든 밀랍을 감싼다. 저 수레를 놓치면 또 누군가의 옷이 젖을지 모른다."
          with: []
          camera: wide
          continueLabel: 언니와 서쪽 곡식길을 따라간다
      - goto: /3.yaml

  bad_early_crown:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.princess_angry
          text: "다들 보시오! 왕의 딸이 여기 있소. 누구의 명으로 칼을 들었는지 밝히시오!"
      - say:
          channel: narration
          text: "덕만이 앞으로 나섰다. 호위들이 공주의 말을 들으려 고개를 돌렸다. 천명의 등에서 떨어진 그 한 걸음으로 두 사람 사이가 비었다."
      - say:
          char: 천명.sad
          text: "덕만아! 뒤야, 네 뒤—"
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 회랑에서 자객을 추격하던 중 피살. 천명 공주 단독 계승을 귀족 회의가 즉시 승인함."
      - gameOver:
          title: "운명 — 갈라진 자매의 등"
          message: "천명의 손이 허공을 움켜쥐었다. 계승을 선포하던 목소리는 끝나지 못했다. 귀족들은 살아남은 공주 앞에 무릎을 꿇었다."
