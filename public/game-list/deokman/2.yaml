          char: 덕만.angry
          camera: close
          delivery: angry
          text: "<speed=22>이 장부에는 제 혼인 조건이 세 가지로 적혀 있습니다. 한 집에는 군사, 한 집에는 세금, 한 집에는 제가 나라일에 입을 열지 않는다는 약속입니다.</speed> <speed=18>저는 물건이 아닙니다.</speed> <speed=21>세 분 중 누가 받은 약속이 진짜입니까?</speed>"
