script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 칠숙
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제2장 — 혼인은 가장 아름다운 유배다"
      - say:
          with:
            - 덕만
            - 칠숙
          delivery: calm
          text: "누명을 벗은 다음 날 아침. 밤새 세 가문의 수레가 차례로 궁문을 지났고, 날이 밝자 서로 다른 색의 혼인 문서가 같은 탁자에 놓였습니다."
      - say:
          with:
            - 덕만
            - 칠숙
          text: "칠숙은 색이 다른 혼인 문서 세 장을 덕만 앞에 펼쳤습니다. 신랑의 이름은 달랐지만 마지막 줄은 같았습니다. ‘혼인하면 공주는 나라일에 입을 열 수 없고 남편이 대신 말한다.’"
      - say:
          char: 칠숙.smile
          camera: wide
          with:
            - 덕만
          text: "세 가문이 혼인을 요구했습니다. 공주를 아내로 묶어 두면 다음 왕이 되지 못할 테니, 제게는 어느 집이든 상관없습니다. 한 사람을 골라 만나 보시지요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "어제까지 저를 암살범이라 부르던 집들입니다. 오늘은 모두 사위가 되고 싶다는군요."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "가족이라는 이름을 붙이면 공주께 입을 다물라고 하기 쉬워집니다. 제가 원하는 것도 그것입니다. 누구부터 만나시겠습니까?"
      - char:
          id: 진운
          position: center
      - say:
          char: 진운.nervous
          camera: medium
          with:
            - 덕만
          text: "먼저 인사드리겠습니다. 저는 왕의 먼 친척 진운입니다. 공주께서 저와 혼인하시면…… 공주께서는 더는 나라일에…… 죄송합니다. 저는 이 말을 끝까지 읽고 싶지 않습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "끝까지 읽으세요. 그대 입으로 들으면 그 문장이 누구 생각인지 알 것 같으니까."
      - say:
          char: 진운.nervous
          camera: close
          with:
            - 덕만
          text: "제 생각은 저 종이 안에 없습니다. 지금은 그렇게만 알아주십시오."
      - char:
          id: 비담
          position: center
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "세 가문의 문서 창고를 돌고 왔습니다. 첫째 집은 군사, 둘째 집은 세금, 셋째 집은 공주님의 침묵을 받기로 했더군요. 사람을 아내가 아니라 물건처럼 나눠 팔았습니다."
      - char:
          id: 유신
          position: center
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "동문에 말 두 필을 매어 두었습니다. 달아나시라는 명령은 못 드립니다. 다만 궁이 공주님의 선택을 모두 막았을 때도 길 하나는 남겨 두고 싶었습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "두 필이군요. 한 필만 준비했으면 충성이라 생각했을 텐데, 다른 한 필에는 누가 탑니까?"
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "궁을 버리는 길에는 공주의 장수로 따라갈 수 없습니다. 그래도 덕만이라는 사람 곁에 남으라 하시면, 제 이름으로 가겠습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "말 두 필은 이름이 있습니까?"
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "없습니다. 살아서 동문을 나가면 그때 공주께서 지어 주십시오."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "한 마리는 벌써 정했어요. ‘말 안 듣는 장수’로 하죠."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "그 이름에는 제가 타야 할 것 같습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "가족이 되려는 사람보다, 제가 왕위에서 멀어지길 바라는 사람부터 만나겠습니다. 아마 같은 사람이겠지만요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "한 사람은 남이 쓴 청혼을 읽고, 한 사람은 계약의 값을 훔쳐 왔고, 한 사람은 말부터 준비했군요. 좋아요. 제가 먼저 물을 사람은 직접 고르겠습니다."
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구부터 만날까?"
          char: 덕만
          camera: close
          with:
            - 칠숙
          options:
            - text: "진운에게 조건을 묻는다"
              add:
                rival_trust: 1
                legitimacy: 1
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add:
                bidam_trust: 1
                insight: 1
              goto: suitor_bidam
            - text: "유신과 달아난다"
              goto: go_12_warm_choice
            - text: "세 사자를 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.nervous
          camera: wide
          with:
            - 덕만
          text: "칠숙공이 시킨 말부터 하겠습니다. 저와 혼인하면 공주께서는 안전합니다. 저는 왕이 되고, 공주께서는 왕이 되지 않으셔도 됩니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "말하면서도 믿지 않는 얼굴이군요. 그대 생각은 다릅니까?"
      - say:
          char: 진운.nervous
          camera: medium
          with:
            - 덕만
          text: "제 생각을 말하면 어머니가 다칩니다. 지금은 그 말밖에 드릴 수 없습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "알겠습니다. 방금 한 말 중 처음부터 끝까지 그대가 고른 문장은 마지막 문장이었군요. 그건 기억해 두겠습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "첫째 집에는 군사를, 둘째 집에는 세금을, 셋째 집에는 공주님이 입을 다문다는 약속을 줬습니다. 같은 사람을 세 번 팔았군요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "내가 입을 다무는 값은 얼마였지?"
      - say:
          char: 비담.smirk
          camera: medium
          text: "값도 없습니다. 혼인하면 당연히 따라오는 조건이라 생각한 모양입니다."
      - say:
          char: 덕만.angry
          camera: close
          with:
            - 비담
          text: "그 장부, 누가 썼는지 확인해 줘. 혼담을 깨는 것보다 세 집이 서로를 못 믿게 만드는 게 빠르겠어."
      - say:
          char: 비담.smirk
          camera: medium
          text: "이제야 제가 잘하는 일을 시키시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - camera: wide
      - say:
          with:
            - 덕만
          delivery: calm
          text: "같은 날 · 정오. 첫 면담이 끝나자 신부 단장을 맡은 나인들이 들이닥쳤습니다. 덕만은 혼례 비녀를 꽂은 채, 혼담을 깨는 데 쓸 물건들을 기다렸습니다."
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.nervous
          camera: medium
          with:
            - 덕만
          text: "아까 읽지 못한 마지막 줄입니다. 제가 혼담을 거절하면 칠숙의 별채에 있는 어머니가 다칩니다. 제 입으로 청한 혼인이 아니라고 말하러 왔습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "그 말을 하면 내가 그대 어머니를 약점으로 쓸 수도 있습니다."
      - say:
          char: 진운.nervous
          camera: close
          with:
            - 덕만
          text: "압니다. 그래도 제 침묵 때문에 공주께서 저를 원수로만 기억하는 것보다는 낫습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "별을 읽은 표, 의원의 빈 약봉지, 저와 공주님 이름을 함께 쓴 거짓 고발문까지 준비했습니다. 혼인을 깨려면 누군가는 거짓말쟁이가 되어야 하니까요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "그대 이름도 부러질 수 있는데 웃음이 나와?"
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "제 이름은 원래 금이 가 있습니다. 공주님 이름은 아직 멀쩡해서, 손대기가 조금 아깝군요."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with:
            - 덕만
          text: "왕실에서 별을 읽고 약을 짓는 월명입니다. 비담공이 제 별점표와 약봉지를 같은 탁자에 올려 두셨더군요. 별을 거짓말에 쓰든 몸을 거짓말에 쓰든, 나중에는 공주께서 직접 값을 치르셔야 합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 월명
          text: "그래서 선생을 불렀습니다. 거짓말을 잘하는 사람이 아니라, 거짓말 뒤에 남을 상처를 말해 줄 사람이 필요했어요."
      - char:
          id: 천명
          position: right
      - say:
          char: 천명.nervous
          camera: medium
          with:
            - 덕만
          text: "열한 살 때 혼례 비녀가 무겁다고 울었지. 그때는 내가 빼 줬어. 이번에도 내가 아버지께 싫다고 말해 줄까?"
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 천명
          text: "언니가 말하면, 사람들은 내가 언니 뒤에 숨었다고 할 거야."
      - say:
          char: 천명.sad
          camera: medium
          with:
            - 덕만
          text: "숨으면 어때. 잠깐 숨었다가 다시 나오면 되지. 꼭 매번 혼자 맞아야 강한 건 아니잖아."
      - say:
          char: 덕만
          camera: close
          with:
            - 천명
          text: "이번에는 내가 말할게. 대신 끝나고 나면 비녀 좀 빼 줘. 오늘도 무겁다."
      - say:
          with:
            - 덕만
            - 천명
          text: "천명은 덕만의 머리에서 무거운 혼례 비녀를 빼 탁자에 내려놓았습니다. 비녀 끝이 별을 읽은 표와 약봉지, 비담의 거짓 고발문을 차례로 가리켰습니다."
      - say:
          char: 천명.sad
          camera: medium
          with:
            - 덕만
          text: "별을 고르면 월명이, 병을 고르면 네 몸이, 소문을 고르면 너와 비담의 이름이 다쳐. 저 사람들을 웃음거리로 만들면 세 집이 한꺼번에 칼을 갈 거고. 어느 상처가 가장 덜 오래갈까?"
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 천명
          text: "혼담을 깨는 값이 왜 늘 다른 사람 목숨이나 내 이름이어야 할까. 그래도 아무 값도 치르지 않고 빠져나갈 문은 없겠지."
      - choice:
          key: c2_reputation
          prompt: "혼담을 깨려면 무엇을 버릴까?"
          char: 덕만
          camera: close
          with:
            - 천명
          options:
            - text: "별의 흉조를 빌린다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add:
                bidam_trust: 1
                nobles_support: -1
              goto: reputation_scandal
            - text: "후보들을 조롱한다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          text: "별을 보고 혼인을 미루자는 말씀이시군요. 만들 수는 있습니다. 다만 나중에 거짓이라는 것이 밝혀지면 제 목도 함께 내놓아야 합니다."
      - say:
          char: 덕만
          camera: medium
          text: "선생의 목을 걸어 달라는 뜻은 아닙니다. 세 가문이 각자 다른 해석을 내놓게 할 수 있습니까?"
      - say:
          char: 월명.warning
          camera: medium
          text: "그건 별을 읽는 일보다 쉽습니다. 사람은 자기가 믿고 싶은 징조만 골라 보니까요. 두 시간쯤이면 됩니다."
      - say:
          char: 덕만
          camera: medium
          text: "내일 아침에는 제가 직접 거짓이라고 밝히겠습니다. 책임은 제 이름으로 남겨 주세요."
      - add:
          insight: 1
      - goto: throne_choice

  reputation_scandal:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          text: "저와 밤을 보냈다는 소문이라니, 취향이 나쁘다는 비난은 피하기 어렵겠습니다."
      - say:
          char: 덕만
          camera: medium
          text: "그대 평판이 상할까 걱정되면 지금 그만두죠."
      - say:
          char: 비담.smirk
          camera: close
          text: "이미 바닥인데 더 내려갈 곳이 있겠습니까. 다만 공주님 평판은 돌아오기 어렵습니다. 정말 괜찮으시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          text: "괜찮지는 않아. 그래도 남의 아내가 되는 것보다는 내가 고른 소문을 견디는 편이 낫겠어."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          delivery: calm
          text: "같은 날 · 해 질 무렵. 서쪽 창의 마지막 햇빛이 사라질 때까지 어느 혼인 문서에도 덕만의 도장은 찍히지 않았습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          with:
            - 칠숙
          text: "칠숙은 세 가문의 도장을 왕좌 앞에 나란히 놓았습니다. 하나를 고르면 나머지 두 집이 덕만의 적이 되고, 아무것도 고르지 않으면 왕의 명령을 모욕했다는 항의문이 올라올 판이었습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "세 집 모두 해가 지기 전 답을 원합니다. 아무 말도 하지 않아도 거절로 여기겠답니다. 공주께서는 어느 집의 도장을 왕께 올리시겠습니까?"
      - char:
          id: 진평왕
          position: right
      - say:
          char: 진평왕.sad
          camera: medium
          text: "<speed=22>네가 싫다면 아비인 나는 당장 없던 일로 하고 싶다. 네가 억지로 웃는 얼굴을 보는 것도 싫다.</speed> <speed=20>하지만 왕인 나는 세 가문에 답해야 한다. 네가 내 자리에 있다면 어떻게 하겠느냐?</speed>"
          wait: 750
      - say:
          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "딸에게 답을 떠넘기는 건 공평하지 않습니다."
