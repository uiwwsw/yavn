script:
  - scene: secret_reunion

scenes:
  secret_reunion:
    actions:
      - bg: princess_chamber
      - camera: wide
      - say:
          channel: record
          text: "제3장 — 두 공주의 봄"
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          camera: medium
          text: "모란 온실의 비밀문이 닫혔습니다. 천명은 촛불을 들어 덕만의 얼굴을 오래 비췄습니다. 탁자 위에는 사망 기록과 서쪽 창고 운송표가 놓였지만, 누구도 먼저 종이를 보지 못했습니다."
      - say:
          when: { var: identity_mode, op: eq, value: public }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "네 편지보다 소문이 먼저 왔어. 살아 있다니 웃음이 났다가… 왜 또 혼자 목을 걸었나 화가 났고."
      - say:
          when: { var: identity_mode, op: eq, value: borrowed }
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "감찰관 이름도 빌렸다며. 그 잘못까지 숨기진 말자. 이번엔 같이 갚아."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "당장 안고 싶은데… 먼저 확인해야 해. 미안해. 우리 둘만 아는 말을 해 줘."
      - choice:
          key: c3_proof
          prompt: "천명의 손이 떨립니다. 무엇으로 자신을 증명할까요?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "아버지의 모란 질문을 되돌려 준다"
              add: { cheonmyeong_trust: 1, king_trust: 1, insight: 1 }
              goto: proof_memory
            - text: "그을린 사망 기록을 밀어 준다"
              when: { var: death_register, op: eq, value: true }
              add: { cheonmyeong_trust: 2, evidence: 1 }
              goto: proof_record
            - text: "언니가 숨기는 두려움을 먼저 꺼낸다"
              add: { cheonmyeong_trust: 2, mercy: 1 }
              goto: proof_sister

  proof_record:
    actions:
      - bg: princess_chamber
      - sticker: { id: c3_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(170px, 21%, 320px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: narration
          text: "덕만이 그을린 사망 기록을 내밀자 천명은 종이보다 먼저 문밖의 경비를 불렀습니다. 그 문서는 십 년 동안 여러 사람의 손을 거친 공개된 수색 증거였습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "도장은 아버님 건데 글씨는 궁 서기관 것이 아니야. 서로 다른 손이 만든 종이야."
      - say:
          char: 덕만.wanderer
          camera: close
          with: [천명]
          text: "그걸 알아봤잖아. 나는 저 종이에서 살아 나온 덕만이야."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "아니. 이건 누가 덕만을 죽이려 했는지만 말해. 네가 내 동생인지는 말 못 해."
      - clearSticker: { id: c3_record, leave: fadeOut }
      - say:
          channel: narration
          text: "문이 열리자 매복해 있던 귀족 경비가 덕만을 위조 문서를 든 암살자로 묶었습니다. 천명이 명령을 거두려 했을 때는 칼끝이 이미 덕만의 목을 지나간 뒤였습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공주 처소 침입 사건 — 죽은 덕만 공주를 사칭한 여인, 위조 왕실 문서를 제시하다 현장에서 사살됨."
      - gameOver:
          title: "운명 — 누구나 훔칠 수 있는 증거"
          message: "사망 기록은 음모의 증거였지만 자매만 아는 신분 증명은 아니었습니다. 덕만은 종이가 자기 이름까지 말해 줄 것이라 믿었고, 천명의 경비는 그 침묵을 사칭의 증거로 바꿨습니다."
          recoverToChoice: c3_proof

  proof_memory:
    actions:
      - say:
          char: 덕만
          text: "아버지가 모란 그림을 보여 줬어. 꽃 말고 빠진 걸 보라고 했지. 벌도 나비도 없었어."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아버님이 우리한테만 하던 말이야… 덕만아. 정말 너구나."
      - goto: sister_oath

  proof_sister:
    actions:
      - bg: princess_chamber
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "내가 가짜라서만 무서운 게 아니지. 진짜면 언니 자리가 작아질까 봐 무서운 거잖아."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "맞아. 네가 살았는데 내 자리부터 셌어. 그런 마음으로 널 안는 게 더 무서웠어."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "하지만 궁 안 누구나 짐작할 마음이야. 우리만 아는 말을 해 줬어야지."
      - say:
          channel: narration
          text: "천명이 경비를 물리라고 입을 열었지만 문밖의 귀족 병사는 '가짜가 공주를 홀렸다'며 먼저 창을 찔렀습니다. 덕만은 천명의 팔 안에서 쓰러졌고, 자매의 기억은 끝내 확인되지 못했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공주 처소 침입 사건 — 천명 공주를 현혹한 덕만 사칭범 사살. 배후를 밝히지 못해 시신은 무명으로 처리함."
      - gameOver:
          title: "운명 — 마음만 맞힌 가짜"
          message: "천명의 두려움을 알아본 말은 위로였지만 신분을 증명하지 못했습니다. 둘만 공유한 모란의 기억 대신 누구나 짐작할 감정을 내민 순간 경비에게 덕만은 위험한 사칭범으로 남았습니다."
          recoverToChoice: c3_proof

  sister_oath:
    actions:
      - say:
          channel: narration
          text: "천명이 두 번째 빗장까지 걸었습니다. 벽장을 열자 혼인 후보와 사병 수가 빼곡한 지도가 나왔습니다. 천명의 이름에는 붉은 혼례끈이 매여 있었습니다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "내일 네가 옆에 서면 다들 웃으며 우리 표부터 셀 거야. 그래도 같이 들어갈래?"
      - choice:
          key: c3_sisters_strategy
          prompt: "새벽 조회가 열립니다. 두 자매는 어떻게 들어갈까요?"
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "천명은 궁, 덕만은 시장을 맡는다"
              set: { sisters_public: false }
              add: { insight: 1, cheonmyeong_trust: 2, nobles_support: 1 }
              goto: divided_roles
            - text: "덕만이 시녀복을 입고 천명 뒤에 선다"
              set: { sisters_public: false, identity_mode: hidden }
              add: { evidence: 1, fear: 1 }
              goto: hidden_sister
            - text: "손을 맞잡고 두 공주로 들어선다"
              set: { sisters_public: true }
              add: { people_support: 2, cheonmyeong_trust: 1, fear: 1 }
              goto: public_sisters

  public_sisters:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "두 공주가 나란히 계단을 내려오자 궁문 밖에서 환호가 터졌습니다. 무릎 꿇은 귀족들은 고개를 숙인 채 서로의 손가락이 어느 쪽을 향하는지 살폈습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "손에 땀났어. 그래도 네가 안 놓아서 버텼다. 내일부터 저 손을 떼려고 별짓을 다 하겠지."
      - goto: spring_ambush

  divided_roles:
    actions:
      - bg: moon_court
      - char: { id: 덕만, position: left, emotion: princess }
      - say:
          channel: narration
          text: "낮에는 천명이 회의의 거짓말을 적고, 덕만은 시장의 값을 외웠습니다. 밤마다 두 종이를 포개면 귀족 한 사람의 말이 어긋났습니다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니는 궁, 나는 시장을 볼게. 밤에 서로 들은 말을 맞춰 보자."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "덕만아, 오늘만은 같이 들어가면 안 돼? 저들이 바라는 대로 너무 쉽게 떨어지는 것 같아."
      - say:
          channel: narration
          text: "그날 밤 약속한 밀실에는 차 두 잔이 놓여 있었습니다. 천명의 잔은 식어 있었고, 먼저 도착한 덕만의 잔에만 꿀 냄새 아래 쓴 향이 감춰져 있었습니다."
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [천명]
          text: "언니가 안 마셔서 다행이야. 그런데… 왜 손끝이 안 움직이지?"
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 진료 기록 — 덕만 공주, 시장 순행 뒤 급사. 천명 공주를 시기해 독을 준비하다 스스로 마셨다는 자백문이 발견됨."
      - gameOver:
          title: "운명 — 따로 놓인 두 잔"
          message: "자매가 떨어지자 왕위를 질투한 귀족은 덕만의 잔만 골라 독을 넣고, 천명을 범인으로 보이게 할 자백문까지 남겼습니다. 둘이 함께 있었다면 바꿀 수 있던 기록은 덕만이 죽은 뒤 사실이 됐습니다."
          recoverToChoice: c3_sisters_strategy

  hidden_sister:
    actions:
      - bg: shadow_corridor
      - char: { id: 덕만, position: left, emotion: attendant }
      - say:
          channel: narration
          text: "시녀복을 입은 덕만 앞에서 귀족들은 말을 삼키지 않았습니다. 찻잔을 내려놓는 손보다 먼저, 숨겨 둔 멸시와 계획이 쏟아졌습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "덕만아, 그 잔 내려놔. 아까 널 보고 웃던 상궁이 갑자기 자리를 비웠어."
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [천명]
          text: "이미 마셨어. 시녀가 먼저 맛보는 게 이상하지 않아서… 아무도 말리지 않았어."
      - say:
          channel: narration
          text: "덕만이 쓰러지자 귀족들은 놀라기보다 시녀의 이름부터 물었습니다. 천명이 진짜 이름을 외쳤지만, 명부에는 처음부터 존재하지 않는 사람이었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공주 처소 잡역부 한 명 독살. 신원 미상으로 장례 없이 매장. 왕실 계승과 무관함."
      - gameOver:
          title: "운명 — 이름 없는 독살"
          message: "신분을 숨긴 덕만은 암살자에게 가장 처리하기 쉬운 시녀가 됐습니다. 천명이 동생이라 외쳐도 공식 이름이 없었기에 독살은 궁중 잡역부의 죽음으로 묻혔습니다."
          recoverToChoice: c3_sisters_strategy

  spring_ambush:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 칠숙, position: right, emotion: angry }
      - char: { id: 천명, position: center, emotion: nervous }
      - say:
          channel: narration
          text: "봄 연회의 북이 멎는 순간, 꽃바구니 세 개에서 칼이 솟았습니다. 칠숙은 칼보다 먼저 호위병들의 눈이 어느 공주를 향하는지 확인했습니다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만, 천명]
          text: "공주가 둘이니 호위의 눈도 갈리는군요. 기록하기 편하게 한 분으로 줄이겠습니다."
      - choice:
          key: c3_ambush
          prompt: "앞뒤에서 칼이 다가옵니다. 자매는 어떻게 함께 빠져나갈까요?"
          char: 덕만
          camera: reaction
          with: [천명, 칠숙]
          options:
            - text: "피 묻은 뜰에서 계승권을 선포한다"
              goto: bad_early_crown
            - text: "천명과 등을 맞대고 칼을 막는다"
              add: { cheonmyeong_trust: 2, people_support: 1, army_support: 1 }
              goto: survive_together
            - text: "퇴로를 열어 칠숙을 회랑으로 몬다"
              add: { evidence: 2, mercy: 1, fear: 1 }
              goto: capture_order

  survive_together:
    actions:
      - say:
          channel: narration
          text: "천명의 비녀가 칼끝을 흘렸고 덕만은 언니의 빈틈을 몸으로 막았습니다. 군사가 들이닥쳤을 때 두 사람은 같은 피를 소매에 묻힌 채 서 있었습니다."
      - goto: sisters_end

  capture_order:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "덕만이 동문을 열자 칠숙이 회랑으로 물러났습니다. 덕만이 뒤따라 모퉁이를 도는 순간 문이 닫혔고, 천명의 발소리는 반대편에 갇혔습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만, 칠숙]
          text: "덕만아, 쫓지 마! 저 사람은 도망가는 게 아니라 네가 혼자 올 때까지 기다리는 거야!"
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "언니 말씀을 한 걸음만 일찍 들으셨어도 살았을 겁니다."
      - say:
          channel: narration
          text: "회랑 천장에서 두 번째 자객이 내려왔습니다. 덕만이 칠숙의 칼을 막는 동안 뒤에서 들어온 칼이 갈비뼈 사이를 꿰뚫었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 자객을 단독 추격하다 피살. 칠숙은 도주함."
      - gameOver:
          title: "운명 — 열어 준 퇴로"
          message: "칠숙의 퇴로는 도망길이 아니라 자매를 떼어 놓는 미끼였습니다. 덕만은 증거를 잡으려 한 걸음 더 들어갔고, 언니의 손이 닿지 않는 회랑에서 죽었습니다."
          recoverToChoice: c3_ambush

  sisters_end:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left, emotion: princess }
      - char: { id: 천명, position: right }
      - say:
          char: 천명
          text: "이 밀랍 흠집, 네 인장과 같아. 우리를 죽일 돈을 구휼미에서 댔어."
      - say:
          char: 덕만
          text: "오늘 밤 서쪽 창고에서 마지막 수레가 나가. 이름은 지워도 바퀴 자국은 못 지워. 따라가자."
      - say:
          channel: record
          text: "두 공주는 서로를 되찾았고, 암살자의 밀랍을 국경의 곡식길과 연결했습니다. 자매의 재회는 곧 첫 공동 수사로 바뀌었습니다."
      - goto: /3.yaml

  bad_early_crown:
    actions:
      - bg: council_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.princess_angry
          text: "피를 본 지금 선언하겠습니다. 제가 신라의 계승자입니다. 저 칼이 누구를 겨눠야 하는지도 똑똑히 보십시오."
      - say:
          channel: narration
          text: "피 묻은 뜰에서 덕만이 계승권을 외치는 순간 자매의 등이 떨어졌고, 호위의 시선은 왕위 선언에 쏠렸습니다. 숨어 있던 두 번째 칼은 미끼인 칠숙이 아니라 혼자 앞선 덕만을 향했습니다."
      - say:
          char: 천명.sad
          text: "덕만아, 돌아봐! 저 사람이 미끼야. 네 뒤에—"
      - say:
          channel: record
          text: "봄 연회 피습 기록 — 덕만 공주, 회랑에서 자객을 추격하던 중 피살. 천명 공주 단독 계승을 귀족 회의가 즉시 승인함."
      - gameOver:
          title: "운명 — 갈라진 자매의 등"
          message: "암살자의 목적은 칠숙을 잡는 일도 왕위를 논하는 일도 아니었습니다. 두 공주를 떼어 놓는 순간 덕만은 두 번째 칼에 쓰러졌고, 살아남은 자의 기록만 왕위가 되었습니다."
