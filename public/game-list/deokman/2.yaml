script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제2장 — 혼인은 가장 아름다운 유배다"
      - say:
          char: 칠숙.smile
          framing: full
          with:
            - 덕만
          text: "세 가문이 공주의 손을 청했습니다. 어느 집을 고르셔도 왕실에는 든든한 담장이 생기겠지요. 문이 어느 쪽에 나는지만 다를 뿐."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "담장마다 문이 없다면 감옥이지요. 세 가문이 탐내는 것이 제 손인지, 제 뒤의 빈 왕좌인지부터 묻겠습니다."
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구부터 만날까?"
          char: 덕만
          framing: closeup
          options:
            - text: "진운에게 조건을 묻는다"
              add:
                rival_trust: 1
                legitimacy: 1
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add:
                bidam_trust: 1
                insight: 1
              goto: suitor_bidam
            - text: "유신과 달아난다"
              goto: go_12_warm_choice
            - text: "세 사자를 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.nervous
          framing: full
          with:
            - 덕만
          text: "저와 혼인하면 공주께서는 살아남습니다. 저는 왕이 되고, 공주께서는 왕이 될 까닭만 버리시면 됩니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "살려 줄 테니 스스로 필요 없는 사람이 되라. 남의 문장을 전하는 그대도, 그 문장만큼 갇혀 있군요."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "첫 집에는 군권, 둘째에는 세금, 셋째에는 공주의 침묵을 팔았습니다. 신부 한 분으로 장부 세 권을 채웠으니 혼례보다 장사가 먼저겠군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "내 침묵 값은 얼마였지? 군권보다 싸다면 조금 서운할 것 같은데."
      - say:
          char: 비담.smirk
          framing: bust
          text: "유감스럽게도 덤입니다. 이 궁에서는 여자의 입을 재산으로 세지도 않으니까요. 닫힌 뒤에야 값을 알겠지요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "열한 살 때 혼례 비녀가 무겁다고 울었지. 그때는 내가 빼 줬어. 이번 것은 네 목을 누르는데, 또 혼자 견딜 셈이니?"
      - choice:
          key: c2_reputation
          prompt: "혼담을 깨려면 무엇을 버릴까?"
          char: 덕만
          framing: closeup
          with:
            - 천명
          options:
            - text: "별의 흉조를 빌린다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add:
                bidam_trust: 1
                nobles_support: -1
              goto: reputation_scandal
            - text: "후보들을 조롱한다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: bust
          text: "별에는 입이 없습니다. 권세 있는 자가 그 침묵 위에 제 말을 올릴 뿐이지요. 흉조가 필요하다면 사흘이면 됩니다. 넷째 날엔 만든 자의 이름도 따라붙습니다."
      - say:
          char: 덕만
          framing: bust
          text: "별의 뜻은 믿지 않습니다. 별을 핑계 삼을 사람의 욕심은 믿지요. 사흘 안에 그 욕심을 서로 물게 하겠습니다."
      - add:
          insight: 1
      - goto: throne_choice

  reputation_scandal:
    actions:
      - say:
          char: 비담.smirk
          framing: bust
          text: "제 평판을 빌리시다니, 물건 보는 눈이 나쁘십니다. 돌려주지 않으셔도 됩니다. 원래 주인도 오래전에 버렸으니까."
      - say:
          char: 덕만
          framing: bust
          text: "버린 물건치고는 값이 궁금한 얼굴이군요. 이번에는 내가 값보다 쓸모를 먼저 보여 드리죠."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          char: 진평왕.sad
          framing: bust
          text: "아비는 네가 싫다 하면 이 혼담을 거두고 싶다. 왕은 딸의 한마디로 세 가문을 적으로 돌릴 수 없다. 덕만아, 지금 누구의 대답을 듣고 있느냐?"
          wait: 750
      - choice:
          key: c2_throne
          prompt: "모두가 답을 기다린다. 무엇을 말할까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "한 사람만 고르겠다"
              add:
                insight: 1
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add:
                army_support: 1
              goto: throne_delay
            - text: "합의서를 펼친다"
              add:
                legitimacy: 2
                nobles_support: -1
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - say:
          char: 칠숙.smile
          framing: bust
          text: "세 가문이 한 사람에게 합의할 때까지 기다리시겠다니, 누구도 거절하지 않고 모두를 모욕하는 공평한 답이군요."
      - say:
          char: 덕만
          framing: bust
          text: "세 가문이 제 몫보다 신라를 먼저 고르는 날까지 기다리겠다는 뜻입니다. 그날이 오면 제가 혼례상을 직접 차리지요."
      - goto: chapter2_end

  throne_delay:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "삼 년을 버셨습니다. 대가는 국경 삼 년입니다. 전쟁은 구실로 부른 사람보다, 늦게 도착한 사람을 오래 기억합니다."
      - say:
          char: 덕만
          framing: bust
          text: "압니다. 전쟁을 방패로 들었으니, 그 뒤에 숨지는 않겠습니다. 떠날 군량과 죽을 이름까지 함께 준비하세요."
      - goto: chapter2_end

  throne_reveal:
    actions:
      - effect: impact
      - say:
          char: 덕만.angry
          framing: closeup
          delivery: angry
          text: "이 장부에는 제 이름이 세 번 팔렸습니다. 군권의 값, 세금의 값, 침묵의 덤으로. 세 신랑 중 누가 먼저 남의 물건을 샀다고 자백하시겠습니까?"
          wait: 900
      - say:
          delivery: whisper
          text: "아무도 축하하지 않았다. 비단 소매 스치는 소리만 길게 이어졌고, 세 가문은 처음으로 서로의 얼굴을 보았다."
      - goto: chapter2_end

  chapter2_end:
    actions:
      - bg: locked_room
      - effect: focus
      - say:
          delivery: whisper
          text: "그날 밤, 합의서를 건넨 귀족이 덕만의 침상 앞에 엎드려 있었다. 피는 아직 따뜻했고, 문빗장은 안쪽에 걸려 있었다."
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "혼례방은 피했는데…… 누군가 내 침상을 신방보다 치밀하게 꾸몄군. 신랑 자리에는 시체를 눕히고."
      - say:
          text: "제2장 완료 — 덕만은 혼인의 자유를 얻는 대신, 세 가문의 원한을 샀다."

  go_12_warm_choice:
    actions:
      - gameOver:
          title: "운명 12 — 왕관보다 따뜻한 것"
          message: "덕만과 유신은 새벽 성문을 나섰다. 두 사람은 오래 살아 서로의 이름을 불렀을지도 모른다. 신라의 역사에서 덕만이라는 이름은 그날 이후 사라졌다."
  go_13_three_knives:
    actions:
      - gameOver:
          title: "운명 13 — 세 개의 칼"
          message: "세 가문은 처음으로 완벽히 합의했다. 덕만을 왕위에서 지워야 한다는 데에. 공주의 마차는 세 영지의 경계가 만나는 곳에서 발견되었다."
  go_14_barren_lie:
    actions:
      - gameOver:
          title: "운명 14 — 아이를 낳지 못한 거짓말"
          message: "거짓 진단은 혼담보다 먼저 왕위 계승권을 빼앗았다. 덕만은 건강하다는 것을 증명할수록 거짓말쟁이가 되었다. 그녀는 살아남았지만 후계자 명단에서 영원히 지워졌다."
  go_15_laughing_bride:
    actions:
      - gameOver:
          title: "운명 15 — 웃는 신부"
          message: "연회장은 웃음으로 가득 찼다. 다음 날 세 후보 중 누구도 청혼을 거두지 않았고, 모욕당한 가문들은 신부가 혼례날 웃지 못하게 만들었다."
  go_16_unmarried_crime:
    actions:
      - gameOver:
          title: "운명 16 — 혼인하지 않은 죄"
          message: "거부는 용감했지만 왕명을 거스른 죄가 되었다. 덕만은 탑에 유폐되어 창밖의 즉위 북소리를 들었다. 그 북은 다른 사람을 위해 울렸다."
