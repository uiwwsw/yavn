script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제2장 — 혼인은 가장 아름다운 유배다"
      - say:
          text: "덕만의 누명이 벗겨지자 계승동맹은 칼 대신 혼담을 내밀었습니다. 공주가 귀족 가문에 시집가면 목숨은 살지만, 그 뒤의 정사와 왕위 주장은 남편의 이름으로만 말할 수 있었습니다."
      - say:
          char: 칠숙.smile
          framing: full
          with:
            - 덕만
          text: "세 가문에서 혼담을 보내 왔습니다. 전하께서는 공주께서 직접 한 사람을 만나 보라 하셨습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "어제까지 저를 암살범이라 부르던 집들입니다. 오늘은 모두 사위가 되고 싶다는군요."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "혼인은 원래 어제의 원수를 내일의 가족으로 만드는 일이지요. 누굴 만나시겠습니까?"
      - say:
          char: 덕만
          framing: closeup
          with:
            - 칠숙
          text: "가족이 되려는 사람보다, 제가 왕위에서 멀어지길 바라는 사람부터 만나겠습니다. 아마 같은 사람이겠지만요."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "왕실 방계의 진운공은 혼인의 당사자이고, 비담은 세 가문의 계약서를 훔쳐본 자입니다. 유신공은 동문에 말 두 필을 준비했다지요. 누구를 만나든 공주께서 무엇을 지킬지는 분명해지겠군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "진운에게는 왜 제 남편이 되려는지 묻고, 비담에게는 혼담의 진짜 값을 묻겠습니다. 유신에게 가면 이 궁을 버릴 각오부터 물어야겠지요."
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구부터 만날까?"
          char: 덕만
          framing: closeup
          options:
            - text: "진운에게 조건을 묻는다"
              add:
                rival_trust: 1
                legitimacy: 1
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add:
                bidam_trust: 1
                insight: 1
              goto: suitor_bidam
            - text: "유신과 달아난다"
              goto: go_12_warm_choice
            - text: "세 사자를 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.nervous
          framing: full
          with:
            - 덕만
          text: "칠숙공이 시킨 말부터 하겠습니다. 저와 혼인하면 공주께서는 안전합니다. 저는 왕이 되고, 공주께서는 왕이 되지 않으셔도 됩니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "말하면서도 믿지 않는 얼굴이군요. 그대 생각은 다릅니까?"
      - say:
          char: 진운.nervous
          framing: bust
          with:
            - 덕만
          text: "제 생각을 말하면 어머니가 다칩니다. 지금은 그 말밖에 드릴 수 없습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "알겠습니다. 방금 한 말 중 처음부터 끝까지 그대가 고른 문장은 마지막 문장이었군요. 그건 기억해 두겠습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "첫째 집에는 군권, 둘째 집에는 세금, 셋째 집에는 공주님의 발언권을 약속했습니다. 같은 신부를 세 번 팔았군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "내가 입을 다무는 값은 얼마였지?"
      - say:
          char: 비담.smirk
          framing: bust
          text: "값도 없습니다. 혼인하면 당연히 따라오는 조건이라 생각한 모양입니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with:
            - 비담
          text: "그 장부, 누가 썼는지 확인해 줘. 혼담을 깨는 것보다 세 집이 서로를 못 믿게 만드는 게 빠르겠어."
      - say:
          char: 비담.smirk
          framing: bust
          text: "이제야 제가 잘하는 일을 시키시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - say:
          with:
            - 덕만
          text: "덕만은 사흘 동안 세 혼담의 당사자들을 차례로 만났습니다. 그중 진운은 진평왕의 먼 친족이자, 계승동맹이 남자 후계자로 세우려는 왕실 사람이었습니다. 그는 어머니가 칠숙의 손에 있어 혼담을 거부하지 못한다고 털어놓았습니다."
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "열한 살 때 혼례 비녀가 무겁다고 울었지. 그때는 내가 빼 줬어. 이번에도 내가 아버지께 싫다고 말해 줄까?"
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 천명
          text: "언니가 말하면, 사람들은 내가 언니 뒤에 숨었다고 할 거야."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "숨으면 어때. 잠깐 숨었다가 다시 나오면 되지. 꼭 매번 혼자 맞아야 강한 건 아니잖아."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          text: "이번에는 내가 말할게. 대신 끝나고 나면 비녀 좀 빼 줘. 오늘도 무겁다."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "별을 핑계로 대면 월명이 거짓말쟁이가 되고, 병을 꾸미면 네가 왕이 될 몸이 아니라고 할 거야. 비담과 소문을 내면 네 이름이 다치고, 후보들을 모욕하면 세 집이 한꺼번에 원수가 돼."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 천명
          text: "혼담을 깨는 값이 왜 늘 다른 사람 목숨이나 내 이름이어야 할까. 그래도 아무 값도 치르지 않고 빠져나갈 문은 없겠지."
      - choice:
          key: c2_reputation
          prompt: "혼담을 깨려면 무엇을 버릴까?"
          char: 덕만
          framing: closeup
          with:
            - 천명
          options:
            - text: "별의 흉조를 빌린다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add:
                bidam_trust: 1
                nobles_support: -1
              goto: reputation_scandal
            - text: "후보들을 조롱한다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: bust
          text: "별을 보고 혼인을 미루자는 말씀이시군요. 만들 수는 있습니다. 다만 나중에 거짓이라는 것이 밝혀지면 제 목도 함께 내놓아야 합니다."
      - say:
          char: 덕만
          framing: bust
          text: "선생의 목을 걸어 달라는 뜻은 아닙니다. 세 가문이 각자 다른 해석을 내놓게 할 수 있습니까?"
      - say:
          char: 월명.warning
          framing: bust
          text: "그건 별보다 쉽습니다. 사람은 자기가 원하는 징조만 골라 보니까요. 사흘이면 됩니다."
      - say:
          char: 덕만
          framing: bust
          text: "사흘 뒤에는 제가 직접 거짓이라고 밝히겠습니다. 책임은 제 이름으로 남겨 주세요."
      - add:
          insight: 1
      - goto: throne_choice

  reputation_scandal:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "저와 밤을 보냈다는 소문이라니, 취향이 나쁘다는 비난은 피하기 어렵겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "그대 평판이 상할까 걱정되면 지금 그만두죠."
      - say:
          char: 비담.smirk
          framing: closeup
          text: "이미 바닥인데 더 내려갈 곳이 있겠습니까. 다만 공주님 평판은 돌아오기 어렵습니다. 정말 괜찮으시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "괜찮지는 않아. 그래도 남의 아내가 되는 것보다는 내가 고른 소문을 견디는 편이 낫겠어."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - say:
          text: "사흘 뒤 왕좌전에는 혼담을 보낸 세 가문과 화백들이 모였습니다. 한 집만 택하면 나머지 두 집이 계승동맹으로 뭉치고, 모두 거절하면 왕명을 가볍게 여긴 공주라는 공격을 받을 자리였습니다."
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          char: 진평왕.sad
          framing: bust
          text: "네가 싫다고 하면 아비로서는 당장 거두고 싶다. 하지만 왕으로서는 세 가문에 답을 해야 한다. 네가 내 자리에 있다면 어떻게 하겠느냐?"
          wait: 750
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "딸에게 답을 떠넘기는 건 공평하지 않습니다."
      - say:
          char: 진평왕.sad
          framing: bust
          with:
            - 덕만
          text: "공평하지 않다. 그래도 왕이 되려면 불공평한 질문에도 답해야 한다. 모두가 기다리고 있다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "한 사람을 택하면 제가 사라지고, 전쟁 뒤로 미루면 궁에서 쫓겨납니다. 합의서를 펼치면 아버지 체면까지 다치고, 왕명을 거부하면 다시는 제 말을 듣지 않겠지요."
      - say:
          char: 진평왕.sad
          framing: closeup
          with:
            - 덕만
          text: "그래서 네가 무엇을 얻을지가 아니라, 무엇을 잃고도 감당할 수 있는지를 묻는 것이다."
      - choice:
          key: c2_throne
          prompt: "모두가 답을 기다린다. 무엇을 말할까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "한 사람만 고르겠다"
              add:
                insight: 1
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add:
                army_support: 1
              goto: throne_delay
            - text: "합의서를 펼친다"
              add:
                legitimacy: 2
                nobles_support: -1
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "세 가문이 같은 사람에게 합의하면 혼인하겠다…… 그런 날이 오리라 생각하십니까?"
      - say:
          char: 덕만
          framing: bust
          text: "오지 않을 거라고 생각합니다. 그러니 누구도 제가 혼담을 거절했다고 말할 수 없겠지요."
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "말 한마디로 세 집을 돌려보내셨군요. 다음에는 말로 끝나지 않을 겁니다."
      - say:
          char: 덕만
          framing: closeup
          text: "알고 있습니다. 그래서 다음 수를 준비하고 있습니다."
      - goto: chapter2_end

  throne_delay:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "전쟁이 끝날 때까지 혼인을 미루라는 답은 받아들여졌습니다. 대신 공주께서 직접 국경으로 가셔야 합니다."
      - say:
          char: 덕만
          framing: bust
          text: "처음부터 그 조건을 붙일 생각이었군요."
      - say:
          char: 유신
          framing: bust
          text: "예. 공주를 궁에서 떼어 놓으려는 자들도 찬성했습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "좋아요. 그들이 보내고 싶어 하는 곳에서, 돌아올 이유를 만들겠습니다. 출발 준비를 하세요."
      - goto: chapter2_end

  throne_reveal:
    actions:
      - effect: impact
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 덕만.angry
          framing: closeup
          delivery: angry
          text: "이 장부에는 제 혼인 조건이 세 가지로 적혀 있습니다. 한 집에는 군권, 한 집에는 세금, 한 집에는 제가 정사에 입을 열지 않는다는 약속입니다. 세 분 중 누가 받은 약속이 진짜입니까?"
          wait: 900
      - say:
          char: 칠숙.smile
          framing: bust
          text: "출처를 알 수 없는 문서입니다. 공주께서 혼담을 피하려 꾸민 것일 수도 있지요."
      - say:
          char: 덕만.angry
          framing: bust
          text: "그렇다면 세 가문이 각자 받은 원본을 내놓으면 됩니다. 지금 여기서 대조하지요."
      - say:
          delivery: whisper
          text: "아무도 문서를 내놓지 못했습니다. 대신 세 가문은 서로를 바라보기 시작했습니다."
      - goto: chapter2_end

  chapter2_end:
    actions:
      - bg: locked_room
      - effect: focus
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "그날 밤, 덕만의 방문은 안에서 잠겨 있었습니다. 인기척을 묻자 대답 대신 창호지 너머로 무언가 끌리는 소리가 났습니다."
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          with:
            - 소원
          delivery: whisper
          text: "소원이 옆방 창을 넘어 안으로 들어갔습니다. 빗장을 잡은 손이 멈췄고, 문은 손가락 두 마디만큼만 열렸습니다."
      - say:
          char: 소원.nervous
          framing: bust
          with: []
          delivery: nervous
          text: "공주님, 들어오지 마세요. 사람 하나가 침상 앞에 쓰러져 있어요. 아까 그 합의서를 가져온 귀족이에요."
      - say:
          char: 덕만
          framing: bust
          with: []
          delivery: nervous
          text: "살아 있어?"
      - say:
          char: 소원.nervous
          framing: closeup
          with: []
          delivery: sad
          text: "아니요. 피는 따뜻한데 숨을 안 쉬어요. 그리고…… 손에 공주님 옷고름을 쥐고 있어요."
      - say:
          char: 덕만
          framing: bust
          with: []
          delivery: nervous
          text: "아무것도 만지지 마. 문밖에 누가 있는지부터 봐. 이번에는 내가 아니라 이 방 전체가 함정이야."
      - say:
          with:
            - 덕만
