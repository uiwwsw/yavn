script:
  - scene: chapter2_open
  - scene: chapter2_end

scenes:
  chapter2_open:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제2장 — 혼인은 가장 아름다운 유배다"
      - say:
          with:
            - 덕만
            - 칠숙
          text: "칠숙은 색이 다른 혼서 세 장을 덕만 앞에 펼쳤습니다. 신랑의 이름은 달랐지만 마지막 줄은 같았습니다. ‘혼인 뒤 공주의 정사 발언은 지아비가 대신한다.’"
      - say:
          char: 칠숙.smile
          framing: full
          with:
            - 덕만
          text: "세 가문에서 혼담을 보내 왔습니다. 전하께서는 공주께서 직접 한 사람을 만나 보라 하셨습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "어제까지 저를 암살범이라 부르던 집들입니다. 오늘은 모두 사위가 되고 싶다는군요."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "혼인은 원래 어제의 원수를 내일의 가족으로 만드는 일이지요. 누굴 만나시겠습니까?"
      - char:
          id: 진운
          position: center
          framing: full
      - say:
          char: 진운.nervous
          framing: bust
          with:
            - 덕만
          text: "먼저 인사드리겠습니다. 저는 왕실 방계 진운입니다. 공주께서 저와 혼인하시면…… 공주께서는 더는 정사에……"
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "끝까지 읽으세요. 그대 입으로 들으면 그 문장이 누구 생각인지 알 것 같으니까."
      - say:
          char: 진운.nervous
          framing: closeup
          with:
            - 덕만
          text: "제 생각은 저 종이 안에 없습니다. 지금은 그렇게만 알아주십시오."
      - char:
          id: 비담
          position: center
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "세 가문 서고를 돌고 왔습니다. 첫째 집은 군권, 둘째 집은 세금, 셋째 집은 공주님의 침묵을 받기로 했더군요. 신부 한 분 값이 집마다 다릅니다."
      - char:
          id: 유신
          position: center
          framing: full
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "동문에 말 두 필을 매어 두었습니다. 달아나시라는 명령은 못 드립니다. 다만 궁이 공주님의 선택을 모두 막았을 때도 길 하나는 남겨 두고 싶었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 유신
          text: "두 필이군요. 한 필만 준비했으면 충성이라 생각했을 텐데, 다른 한 필에는 누가 탑니까?"
      - say:
          char: 유신
          framing: closeup
          with:
            - 덕만
          text: "궁을 버리는 길에는 공주의 장수로 따라갈 수 없습니다. 그래도 덕만이라는 사람 곁에 남으라 하시면, 제 이름으로 가겠습니다."
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 덕만
          framing: closeup
          with:
            - 칠숙
          text: "가족이 되려는 사람보다, 제가 왕위에서 멀어지길 바라는 사람부터 만나겠습니다. 아마 같은 사람이겠지만요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "한 사람은 남이 쓴 청혼을 읽고, 한 사람은 계약의 값을 훔쳐 왔고, 한 사람은 말부터 준비했군요. 좋아요. 제가 먼저 물을 사람은 직접 고르겠습니다."
      - goto: suitor_choice

  suitor_choice:
    actions:
      - choice:
          key: c2_suitor
          prompt: "누구부터 만날까?"
          char: 덕만
          framing: closeup
          with:
            - 칠숙
          options:
            - text: "진운에게 조건을 묻는다"
              add:
                rival_trust: 1
                legitimacy: 1
              goto: suitor_jinun
            - text: "비담에게 값을 묻는다"
              add:
                bidam_trust: 1
                insight: 1
              goto: suitor_bidam
            - text: "유신과 달아난다"
              goto: go_12_warm_choice
            - text: "세 사자를 모욕한다"
              goto: go_13_three_knives

  suitor_jinun:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.nervous
          framing: full
          with:
            - 덕만
          text: "칠숙공이 시킨 말부터 하겠습니다. 저와 혼인하면 공주께서는 안전합니다. 저는 왕이 되고, 공주께서는 왕이 되지 않으셔도 됩니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "말하면서도 믿지 않는 얼굴이군요. 그대 생각은 다릅니까?"
      - say:
          char: 진운.nervous
          framing: bust
          with:
            - 덕만
          text: "제 생각을 말하면 어머니가 다칩니다. 지금은 그 말밖에 드릴 수 없습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "알겠습니다. 방금 한 말 중 처음부터 끝까지 그대가 고른 문장은 마지막 문장이었군요. 그건 기억해 두겠습니다."
      - goto: reputation_choice

  suitor_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "첫째 집에는 군권, 둘째 집에는 세금, 셋째 집에는 공주님의 발언권을 약속했습니다. 같은 신부를 세 번 팔았군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "내가 입을 다무는 값은 얼마였지?"
      - say:
          char: 비담.smirk
          framing: bust
          text: "값도 없습니다. 혼인하면 당연히 따라오는 조건이라 생각한 모양입니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with:
            - 비담
          text: "그 장부, 누가 썼는지 확인해 줘. 혼담을 깨는 것보다 세 집이 서로를 못 믿게 만드는 게 빠르겠어."
      - say:
          char: 비담.smirk
          framing: bust
          text: "이제야 제가 잘하는 일을 시키시는군요."
      - goto: reputation_choice

  reputation_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.nervous
          framing: bust
          with:
            - 덕만
          text: "아까 읽지 못한 마지막 줄입니다. 제가 혼담을 거절하면 칠숙의 별채에 있는 어머니가 다칩니다. 제 입으로 청한 혼인이 아니라고 말하러 왔습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "그 말을 하면 내가 그대 어머니를 약점으로 쓸 수도 있습니다."
      - say:
          char: 진운.nervous
          framing: closeup
          with:
            - 덕만
          text: "압니다. 그래도 제 침묵 때문에 공주께서 저를 원수로만 기억하는 것보다는 낫습니다."
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "별점표, 의원의 빈 약봉지, 저와 공주님 이름을 나란히 쓴 투서까지 준비했습니다. 혼담 하나를 깨려면 누군가의 신용 하나는 부러져야 하니까요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "그대 이름도 부러질 수 있는데 웃음이 나와?"
      - say:
          char: 비담.smirk
          framing: closeup
          with:
            - 덕만
          text: "제 이름은 원래 금이 가 있습니다. 공주님 이름은 아직 멀쩡해서, 손대기가 조금 아깝군요."
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: bust
          with:
            - 덕만
          text: "왕실에서 별을 읽고 약을 짓는 월명입니다. 비담공이 제 별점표와 약봉지를 같은 탁자에 올려 두셨더군요. 별을 거짓말에 쓰든 몸을 거짓말에 쓰든, 나중에는 공주께서 직접 값을 치르셔야 합니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 월명
          text: "그래서 선생을 불렀습니다. 거짓말을 잘하는 사람이 아니라, 거짓말 뒤에 남을 상처를 말해 줄 사람이 필요했어요."
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "열한 살 때 혼례 비녀가 무겁다고 울었지. 그때는 내가 빼 줬어. 이번에도 내가 아버지께 싫다고 말해 줄까?"
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 천명
          text: "언니가 말하면, 사람들은 내가 언니 뒤에 숨었다고 할 거야."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "숨으면 어때. 잠깐 숨었다가 다시 나오면 되지. 꼭 매번 혼자 맞아야 강한 건 아니잖아."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          text: "이번에는 내가 말할게. 대신 끝나고 나면 비녀 좀 빼 줘. 오늘도 무겁다."
      - say:
          with:
            - 덕만
            - 천명
          text: "천명은 덕만의 머리에서 혼례 비녀를 빼 탁자에 내려놓았습니다. 비녀 끝이 별점표와 약봉지, 비담의 투서 위를 차례로 가리켰습니다."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "별을 고르면 월명이, 병을 고르면 네 몸이, 소문을 고르면 너와 비담의 이름이 다쳐. 저 사람들을 웃음거리로 만들면 세 집이 한꺼번에 칼을 갈 거고. 어느 상처가 가장 덜 오래갈까?"
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 천명
          text: "혼담을 깨는 값이 왜 늘 다른 사람 목숨이나 내 이름이어야 할까. 그래도 아무 값도 치르지 않고 빠져나갈 문은 없겠지."
      - choice:
          key: c2_reputation
          prompt: "혼담을 깨려면 무엇을 버릴까?"
          char: 덕만
          framing: closeup
          with:
            - 천명
          options:
            - text: "별의 흉조를 빌린다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: reputation_stars
            - text: "병을 꾸민다"
              goto: go_14_barren_lie
            - text: "비담과 소문을 낸다"
              add:
                bidam_trust: 1
                nobles_support: -1
              goto: reputation_scandal
            - text: "후보들을 조롱한다"
              goto: go_15_laughing_bride

  reputation_stars:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: bust
          text: "별을 보고 혼인을 미루자는 말씀이시군요. 만들 수는 있습니다. 다만 나중에 거짓이라는 것이 밝혀지면 제 목도 함께 내놓아야 합니다."
      - say:
          char: 덕만
          framing: bust
          text: "선생의 목을 걸어 달라는 뜻은 아닙니다. 세 가문이 각자 다른 해석을 내놓게 할 수 있습니까?"
      - say:
          char: 월명.warning
          framing: bust
          text: "그건 별보다 쉽습니다. 사람은 자기가 원하는 징조만 골라 보니까요. 사흘이면 됩니다."
      - say:
          char: 덕만
          framing: bust
          text: "사흘 뒤에는 제가 직접 거짓이라고 밝히겠습니다. 책임은 제 이름으로 남겨 주세요."
      - add:
          insight: 1
      - goto: throne_choice

  reputation_scandal:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "저와 밤을 보냈다는 소문이라니, 취향이 나쁘다는 비난은 피하기 어렵겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "그대 평판이 상할까 걱정되면 지금 그만두죠."
      - say:
          char: 비담.smirk
          framing: closeup
          text: "이미 바닥인데 더 내려갈 곳이 있겠습니까. 다만 공주님 평판은 돌아오기 어렵습니다. 정말 괜찮으시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "괜찮지는 않아. 그래도 남의 아내가 되는 것보다는 내가 고른 소문을 견디는 편이 낫겠어."
      - goto: throne_choice

  throne_choice:
    actions:
      - bg: throne_hall
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          with:
            - 칠숙
          text: "칠숙은 세 가문의 인장을 왕좌 앞에 나란히 놓았습니다. 하나를 들면 나머지 둘이 서로에게 붙을 것이고, 아무것도 들지 않으면 왕의 혼담을 모욕했다는 상소가 이미 준비돼 있었습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "세 집 모두 해가 지기 전 답을 원합니다. 침묵도 거절로 받아들이겠다고 했습니다. 공주께서는 어느 인장을 전하께 올리시겠습니까?"
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          char: 진평왕.sad
          framing: bust
          text: "네가 싫다고 하면 아비로서는 당장 거두고 싶다. 하지만 왕으로서는 세 가문에 답을 해야 한다. 네가 내 자리에 있다면 어떻게 하겠느냐?"
          wait: 750
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "딸에게 답을 떠넘기는 건 공평하지 않습니다."
      - say:
          char: 진평왕.sad
          framing: bust
          with:
            - 덕만
          text: "공평하지 않다. 그래도 왕이 되려면 불공평한 질문에도 답해야 한다. 모두가 기다리고 있다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "한 사람을 택하면 제가 사라지고, 전쟁 뒤로 미루면 궁에서 쫓겨납니다. 합의서를 펼치면 아버지 체면까지 다치고, 왕명을 거부하면 다시는 제 말을 듣지 않겠지요."
      - say:
          char: 진평왕.sad
          framing: closeup
          with:
            - 덕만
          text: "그래서 네가 무엇을 얻을지가 아니라, 무엇을 잃고도 감당할 수 있는지를 묻는 것이다."
      - choice:
          key: c2_throne
          prompt: "모두가 답을 기다린다. 무엇을 말할까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "한 사람만 고르겠다"
              add:
                insight: 1
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add:
                army_support: 1
              goto: throne_delay
            - text: "합의서를 펼친다"
              add:
                legitimacy: 2
                nobles_support: -1
              goto: throne_reveal
            - text: "왕명을 거부한다"
              goto: go_16_unmarried_crime

  throne_impossible:
    actions:
      - char:
          id: 칠숙
          position: right
