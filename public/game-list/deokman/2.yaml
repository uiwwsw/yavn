          camera: close
          with:
            - 덕만
          text: "그래서 네가 무엇을 얻을지가 아니라, 무엇을 잃고도 감당할 수 있는지를 묻는 것이다."
      - choice:
          key: c2_throne
          prompt: "모두가 답을 기다린다. 무엇을 말할까?"
          char: 덕만
          camera: close
          with:
            - 진평왕
          options:
            - text: "한 사람만 고르겠다"
              add:
                insight: 1
              goto: throne_impossible
            - text: "전쟁 뒤로 미룬다"
              add:
                army_support: 1
              goto: throne_delay
            - text: "합의서를 펼친다"
              add:
                legitimacy: 2
                nobles_support: -1
              goto: throne_reveal
            - text: "왕의 명령을 거부한다"
