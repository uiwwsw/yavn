chapterTitle: "칼과 장부"

script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: wide
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: action
          text: "곡식독을 기울인다. 쥐똥 몇 알이 구른다. 어제 배급을 마쳤다는 장부 위로 먼지가 내려앉는다. 방 안에 밥 지은 냄새는 없다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비가 곧 옵니다. 스무 명을 주시면 동트기 전에 창고 셋을 막겠습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "창고만 막으면 주인은 빠져나가겠지. 수레가 어디로 갔는지부터 보자."
      - choice:
          key: c4_investigation
          prompt: "먼 빗소리가 다가온다. 흔적이 지워지기 전에…"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "마을 사람들에게 수레 길을 묻는다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "바퀴 폭을 재고 야간 통행표를 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "유신의 기병으로 세 창고를 봉쇄한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: action
          text: "바퀴 홈에 손가락을 벌려 댄다. 통행표에 적힌 폭과 같다. 산길의 수레 위로 덮개가 바뀐다. 왕실 문양이 낯선 가문의 천 아래 사라진다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "같은 수레입니다. 덮개만 바꿨군요. 산길로 갔습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "아이 하나가 산 위의 집을 가리켰다. 그쪽에서 연기가 피자 노파가 아이 입을 막았다. 그리고 덕만의 소매를 잡아 돼지우리 뒤로 끌었다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "우리가 묻고 다닌 걸 알았어. 유신, 저쪽 길은 쓰지 마."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "노파가 뒷길을 안답니다. 인원을 줄여 따르겠습니다. 얼굴을 가리십시오."
      - say:
          channel: "narration"
          text: "지팡이가 진흙에 박힐 때마다 일행도 멈췄다. 진짜 창고에 닿았을 때 장부 첫 장은 검게 말려 있었다. 덕만은 재가 될까 손도 대지 못했다."
      - add:
          evidence: -1
      - say:
          channel: thought
          text: "노파는 끝내 이름을 말하지 않았다. 타 버린 장부에도 이름이 있었을 텐데. 남은 것이라도 가져가야 한다."
      - goto: "hidden_warehouse"

  surround_warehouse:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "두 창고에서 연기가 솟았다. 유신은 말 위에서 남은 한 곳을 보고 있었다. 그 창고 앞에서는 수레도 사람도 나오지 않았다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "불은 유인입니다. 세 번째 문이 조용합니다. 병력을 빼지 않겠습니다."
      - say:
          char: "덕만.princess_angry"
          camera: "medium"
          with:
            - "유신"
          text: "그 문을 지켜라. 우물로 가는 길은 터 주고. 사람까지 가두지는 마."
      - say:
          channel: "narration"
          text: "마지막 창고가 열렸다. 돌아가는 길에 덕만의 말이 불탄 집 앞에서 멎었다. 안에 있던 사람은 왕실 깃발을 보고 문을 닫았다."
      - add:
          people_support: -2
      - say:
          channel: thought
          text: "말에서 내려야 했는데. 무슨 말을 할지 몰라 그대로 지나왔다. 문 닫히는 소리가 아직 들린다."
      - goto: "hidden_warehouse"

  hidden_warehouse:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: fadeIn, layout: push, duration: 420 } }
      - say:
          camera: wide
          channel: action
          text: "문을 미니 기름 냄새가 난다. 쌀자루가 있어야 할 곳에 갑옷이 쌓였다. 그 위에 앉은 사내가 내 쪽으로 장부를 들어 보인다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "쌀 한 섬에 창 세 자루라. 백성은 굶어도 장사는 남겼군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내려와. 누구 허락으로 거기 앉았지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담이라 합니다. 허락받을 주인이 없기에, 쥐에게 물었습니다."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char:
          id: "유신"
          position: "right"
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "문이 오래 못 버팁니다. 쌀도 비를 맞고 있습니다. 지금 내주셔야 합니다."
      - choice:
          key: "c4_grain_policy"
          prompt: "문 너머에서 빈 그릇 부딪치는 소리가 난다."
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          options:
            - text: "장부를 벽에 붙이고 마을에 열쇠를 준다"
              set:
                grain_policy: "public_distribution"
              add:
                people_support: 3
                nobles_support: -1
                insight: 1
              goto: "public_distribution"
            - text: "왕실 깃발 아래 줄을 세워 배급한다"
              set:
                grain_policy: "royal_relief"
              add:
                king_trust: 1
                nobles_support: 1
                people_support: 1
              goto: "royal_relief"
            - text: "장부를 덮고 귀족에게 군량을 뜯어낸다"
              set:
                grain_policy: "bargain"
              add:
                army_support: 2
                evidence: 1
                fear: 1
              goto: "grain_bargain"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_ledger"

  public_distribution:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: action
          text: "자루마다 집 이름을 적는다. 손가락이 뻣뻣해질 때쯤 노파가 숯을 가져간다. 내 글씨 옆에 비뚤비뚤 제 이름을 쓴다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "다음엔 궁 창고도 열라 할 텐데요. 오늘처럼 웃으시겠습니까?"
      - say:
          char: 덕만
          text: "그때 닫으면 오늘 이 손에 열쇠를 준 게 거짓말이 되겠지."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "북이 울리자 줄이 잡혔다. 유신은 공주 몫이라며 따로 내민 그릇을 돌려보냈다. 병사와 백성의 죽이 같은 솥에서 나왔다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "해 지기 전엔 끝나겠습니다. 다만 명부에 없는 집이 셋 있습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "세 집 몫은 남겨 둬. 위치를 적어 줘. 내가 가져갈게."
      - say:
          channel: "narration"
          text: "마지막 세 집에 닿았을 때 죽은 식어 있었다. 덕만이 그릇을 내밀자 노파는 두 손으로 받았다. 고맙다는 말이 듣기 어려웠다."
      - add:
          people_support: -1
      - say:
          channel: thought
          text: "명부대로 다 줬다는 말을 믿을 뻔했다. 문 앞에 오지 못하는 사람은 어떻게 이름을 알릴까."
      - goto: "convoy_attack"

  grain_bargain:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "장부에 자물쇠가 채워졌다. 그제야 수레들이 나왔다. 비담은 축하주를 밀어 놓고 자루에 칼집을 냈다. 쌀이 쏟아졌다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "비담"
          text: "잔 치워. 밑에까지 같은 쌀인지 보고 가겠다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "속을 채워 왔군요. 이름을 감춰 드린 보람은 있습니다."
      - say:
          channel: "narration"
          text: "병사들 솥에 쌀이 들어갔다. 노파가 창고 주인 이름을 물었다. 덕만이 대답하지 않자 노파는 자기가 말을 잘못한 듯 고개를 숙였다."
      - add:
          people_support: -3
          bidam_trust: 1
      - say:
          channel: thought
          text: "고개를 숙일 사람은 나인데. 자물쇠 열쇠가 손바닥을 누른다. 지금이라도 꺼낼 수 있다. 그런데 손이 펴지지 않는다."
      - goto: "convoy_attack"

  convoy_attack:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: action
          text: "앞길에 바위가 굴러떨어진다. 돌아보자 뒤에서도 돌이 튄다. 절벽 위의 횃불들이 장부를 실은 수레 쪽으로 모인다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "앞은 뚫을 수 있습니다. 그동안 뒤 수레는 지키지 못합니다. 명을 주십시오."
      - choice:
          key: c4_convoy
          prompt: "수레를 멈추자 절벽 위에서 활시위가 당겨진다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "자루를 벽으로 쌓고 비를 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: bad_grain_wall
            - text: "유신 옆에서 정면을 뚫는다"
              goto: bad_charge
            - text: "빈 수레를 미끼로 매복 주인을 끌어낸다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: bait_ambush

  bait_ambush:
    actions:
      - say:
          channel: action
          text: "빈 수레를 비탈로 민다. 화살이 그쪽으로 쏟아진다. 불빛에 궁수의 팔이 드러난다. 내가 가리키기도 전에 유신이 말머리를 돌린다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "궁수들이 드러났습니다. 빈 수레 둘은 버리고 갑니다!"
      - goto: convoy_saved

  convoy_saved:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: medium
          channel: action
          text: "마을 어귀에서야 수레바퀴 소리가 고르게 들린다. 아이가 터진 자루 밑으로 손을 뻗는다. 나도 내려앉아 흙 묻은 쌀알을 줍는다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "끝 수레까지 들어왔습니다. …오늘은 한 명도 두고 오지 않았습니다."
      - say:
          char: 덕만
          text: "내가 앞만 보면 네가 불러 세워. 듣기 싫어해도 꼭 그래 줘."
      - say:
          channel: thought
          text: "자루 안쪽에서 당의 낙인이 나온다. 사흘 뒤 연회에 들고 갈 것이 늘었다. 사신이 이 자루를 알아볼까."
          with: []
          camera: wide
          continueLabel: 그을린 장부를 들고 연회장으로 간다
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "이 쌀을 팔아 산 칼이었구나. 연회에 가져가자. 사신 앞에서 펼쳐야겠어."
      - goto: /4.yaml

  bad_grain_wall:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "불이 붙습니다! 자루에 기름이 스며들고 있습니다, 공주님!"
      - say:
          char: 덕만.princess_angry
          text: "뒤 수레가 아직 못 나갔어. 젖은 천을 덮어. 조금만 더 버틴다."
      - say:
          channel: narration
          text: "비는 몇 방울 오다 말았다. 자루를 잇고 번진 불이 협곡을 막았다. 유신의 명령은 들렸지만 그가 어느 쪽에 있는지는 보이지 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 곡식 전량 소실. 덕만 공주와 호위 병력, 협곡 화재로 사망."
      - gameOver:
          title: "운명 — 곡식으로 쌓은 장작"
          message: "젖은 천 아래까지 불이 들었다. 군사들이 곡식을 끌어내려 했으나, 무너지는 자루가 퇴로를 덮었다."
          recoverToChoice: c4_convoy

  bad_charge:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "유신, 같이 간다. 저 활을 우리 쪽으로 돌려야 해."
      - say:
          char: 유신.angry
          text: "한 번 나가면 돌아설 곳이 없습니다. 뒤 수레도 함께 움직여야 합니다."
      - say:
          channel: narration
          text: "유신의 말이 협곡으로 뛰었다. 궁수들이 일어섰다. 앞을 향하던 불화살 몇이 방향을 바꾸어 뒤 수레에 꽂혔다. 돌아본 덕만의 얼굴로 열기가 밀려왔다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "길을 뚫고도 돌아갈 수 없었다. 장부를 실은 수레와 마을에 보낼 곡식이 같은 불에 탔다."

  evidence_ledger:
    actions:
      - sticker:
          id: desk_0
          image: grain_ledger_sticker
          x: 27
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - sticker:
          id: desk_1
          image: market_seal_sticker
          x: 73
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - say:
          channel: action
          text: "운송표를 장부 옆에 편다. 틈에서 쌀겨가 떨어진다. 손으로 쓸어 내자 먹으로 그은 자루 수가 드러난다."
          with: []
          camera: wide
      - goto: evidence_ledger_compare

  evidence_ledger_compare:
    actions:
      - choice:
          key: evidence_ledger_look
          presentation: explore
          prompt: "같은 날 나간 곡식이다. 어느 칸부터 볼까?"
          camera: wide
          with: []
          options:
            - text: 장부의 출발 칸
              at:
                x: 27
                "y": 75
              goto: evidence_ledger_detail_0
            - text: 운송표의 도착 칸
              at:
                x: 73
                "y": 75
              goto: evidence_ledger_detail_1
            - text: 살펴본 두 흔적을 대조한다
              when:
                all:
                  - var: evidence_ledger_seen_0
                    op: eq
                    value: true
                  - var: evidence_ledger_seen_1
                    op: eq
                    value: true
              goto: evidence_ledger_deduce
            - text: 물건을 챙기고 돌아간다
              goto: evidence_ledger_return


  evidence_ledger_retry:
    actions:
      - say:
          channel: thought
          text: "도장 크기는 수량이 아니야. 지워진 이름도 지금은 알 수 없어. 여섯이 나가서, 몇이 왔지?"
          with: []
          camera: wide
      - goto: evidence_ledger_compare

  evidence_ledger_solved:
    actions:
      - set:
          grain_verified: true
      - say:
          char: "덕만"
          text: "세 자루가 비었어. 누가 가져갔는지는 몰라도, 마을이 못 받은 몫은 이만큼이야."
      - goto: "evidence_ledger_return"


  evidence_ledger_return:
    actions:
      - clearSticker:
          id: "desk_0"
          leave: "fadeOut"
      - clearSticker:
          id: "desk_1"
          leave: "fadeOut"
      - goto: "grain_decision"

  evidence_ledger_deduce:
    actions:
      - choice:
          key: evidence_ledger
          prompt: "이 종이 두 장으로 분명히 말할 수 있는 것은?"
          camera: wide
          options:
            - text: 출발 여섯 자루와 도착 세 자루를 대조한다
              goto: evidence_ledger_solved
            - text: 가장 큰 붉은 도장만 범인으로 지목한다
              goto: evidence_ledger_retry
            - text: 지워진 이름을 짐작해 채운다
              goto: evidence_ledger_retry
            - text: 판단을 미루고 돌아간다
              goto: evidence_ledger_return
          with: []

  evidence_ledger_detail_0:
    actions:
      - say:
          channel: action
          text: "출발 칸에 여섯 줄이 그어져 있다. 마지막 줄은 먹이 번졌지만 지운 자국은 아니다. 나는 손톱을 대어 하나씩 센다."
          with: []
          camera: wide
      - set:
          evidence_ledger_seen_0: true
      - goto: evidence_ledger_compare

  evidence_ledger_detail_1:
    actions:
      - say:
          channel: action
          text: "도착 칸에는 세 줄뿐이다. 날짜는 같다. 붉은 도장 아래를 비춰 보아도 덧쓴 수량은 없다."
          with: []
          camera: wide
      - set:
          evidence_ledger_seen_1: true
      - goto: evidence_ledger_compare
