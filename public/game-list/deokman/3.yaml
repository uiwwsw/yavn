script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: wide
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: narration
          text: "서쪽 창고에서 나온 수레는 빈 마을을 세 번 지나고도 멈추지 않았습니다. 덕만이 한 집의 곡식독을 열자 바닥에서 마른 쥐똥만 굴렀습니다. 장부에는 이 집이 어제 쌀을 받았다고 적혀 있었습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비가 오면 자국이 지워집니다. 병사 스무 명이면 해 뜨기 전 창고 셋을 칠 수 있고요."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "문부터 부수면 하수인만 잡혀. 밤에 움직인 수레부터 찾자. 비 오기 전에."
      - choice:
          key: c4_investigation
          prompt: "비가 오기 전에 무엇부터 확인할까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "마을 사람들에게 수레 길을 묻는다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "바퀴 폭을 재고 야간 통행표를 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "유신의 기병으로 세 창고를 봉쇄한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: narration
          text: "낮 통행표의 바퀴 폭과 밤 진흙의 자국이 꼭 맞았습니다. 왕실 수레는 해가 지면 귀족 문장이 그려진 덮개만 갈아썼습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "맞습니다. 장부는 고쳐도 수레 폭은 못 바꿉니다. 왕실 수레가 산 위로 갔습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "아이들은 밤마다 수레 소리가 멎는 집을 말했습니다. 산등성이에서 연기가 나자 노파 하나가 덕만을 빈 돼지우리로 끌었습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "우리 질문이 먼저 샜어. 저 집으로 바로 올라가면 안 돼."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "노파가 뒷길을 압니다. 호위는 줄이겠습니다. 마을 사람들 얼굴부터 가리십시오."
      - say:
          channel: "narration"
          text: "빈 창고가 타는 동안 두 사람은 노파의 지팡이 뒤를 따랐습니다. 진짜 창고에 닿았을 때 장부의 첫 장은 이미 불에 탔습니다."
      - add:
          evidence: -1
      - say:
          channel: "record"
          text: "조사 결과 — 주민의 신뢰를 얻었습니다. 창고는 찾았지만 사라진 첫 장의 이름은 알 수 없습니다."
      - goto: "hidden_warehouse"

  surround_warehouse:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "기병이 세 창고의 길을 막았습니다. 빈 창고 두 곳에서 불이 났지만 유신은 말머리를 돌리지 않았습니다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "불을 끄면 포위가 뚫립니다. 남은 문에서만 수레가 안 나옵니다."
      - say:
          char: "덕만.princess_angry"
          camera: "medium"
          with:
            - "유신"
          text: "그 문을 지켜. 마을 우물은 내주고, 병사들은 담 밖에서 기다려."
      - say:
          channel: "narration"
          text: "진짜 창고의 빗장이 열렸습니다. 장부는 남았지만 불탄 빈 창고를 지켜보던 주민들은 왕실 깃발에 등을 돌렸습니다."
      - add:
          people_support: -2
      - say:
          channel: "record"
          text: "조사 결과 — 병력으로 장부를 확보했습니다. 마을에는 불탄 창고의 보상 약속이 남았습니다."
      - goto: "hidden_warehouse"

  hidden_warehouse:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: fadeIn, layout: push, duration: 420 } }
      - say:
          camera: wide
          channel: narration
          text: "문이 무너지자 곡식 냄새 대신 기름 먹인 갑옷 냄새가 쏟아졌습니다. 갑옷 더미 위에 한 사내가 누워 남의 장부를 소리 내 읽고 있었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "쌀 한 섬에 창 세 자루. 이름은 지우고 값은 꼼꼼히 적었군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "누구지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담입니다. 칼로 먹고사는데… 오늘 보니 장부가 더 잘 죽이더군요."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char:
          id: "유신"
          position: "right"
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "비는 들이치고 밖에선 문을 밉니다. 내일이면 쌀도 장부도 못 씁니다. 지금 정하십시오."
      - choice:
          key: "c4_grain_policy"
          prompt: "굶은 사람들이 창고 문을 밉니다. 무엇부터 내놓을까요?"
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          options:
            - text: "장부를 벽에 붙이고 마을에 열쇠를 준다"
              set:
                grain_policy: "public_distribution"
              add:
                people_support: 3
                nobles_support: -1
                insight: 1
              goto: "public_distribution"
            - text: "왕실 깃발 아래 줄을 세워 배급한다"
              set:
                grain_policy: "royal_relief"
              add:
                king_trust: 1
                nobles_support: 1
                people_support: 1
              goto: "royal_relief"
            - text: "장부를 덮고 귀족에게 군량을 뜯어낸다"
              set:
                grain_policy: "bargain"
              add:
                army_support: 2
                evidence: 1
                fear: 1
              goto: "grain_bargain"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_ledger"

  public_distribution:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "마을 대표들이 자루마다 숯으로 집 이름을 썼습니다. 줄은 느리게 줄었고 서로의 몫을 세는 목소리는 밤새 멈추지 않았습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "오늘 쌀을 센 사람들이 내일은 왕실 장부도 보자 할 겁니다. 그때도 여실 겁니까?"
      - say:
          char: 덕만
          text: "열어야지. 귀찮다고 닫으면 또 쌀부터 사라질 테니까."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "왕실 북이 울리자 줄이 빠르게 정리됐습니다. 유신은 따로 올린 그릇을 멈추고 모든 죽을 같은 솥에서 뜨게 했습니다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "오늘 안에 배급은 끝납니다. 다만 관리가 이름을 빠뜨린 집이 있습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "그 집은 내가 찾아갈게. 배급은 계속하고, 빠진 이름은 따로 남겨."
      - say:
          channel: "narration"
          text: "왕실 깃발 아래 자루가 빠르게 줄었습니다. 장터 끝의 세 집은 해가 진 뒤에야 자기 몫을 받았습니다."
      - add:
          people_support: -1
      - say:
          channel: "record"
          text: "통치의 대가 — 배급은 빨랐습니다. 백성은 덕만보다 왕실 관리의 명부를 먼저 찾게 됐습니다."
      - goto: "convoy_attack"

  grain_bargain:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "장부가 상자에 잠기자 군량 수레가 나왔습니다. 비담은 내민 축하주를 두고 봉인된 자루 하나를 직접 찢었습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "비담"
          text: "잔은 됐어. 자루 밑까지 세고 나서 문을 열어."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "군량은 맞습니다. 대신 저 가문의 이름을 제가 감춰 드리게 됐군요."
      - say:
          channel: "narration"
          text: "병사들의 솥에서 김이 올랐습니다. 창고 앞 노파는 도둑의 이름을 묻다 빈 손으로 돌아갔습니다."
      - add:
          people_support: -3
          bidam_trust: 1
      - say:
          channel: "record"
          text: "통치의 대가 — 군량을 얻었습니다. 장부를 감춘 빚은 비담과 굶은 마을에 남았습니다."
      - goto: "convoy_attack"

  convoy_attack:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: narration
          text: "마지막 수레가 협곡 그림자에 들어간 순간 앞뒤에서 바위가 굴렀습니다. 절벽 위 횃불들이 곡식 자루와 장부 상자를 동시에 겨눴습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "정면은 뚫습니다. 대신 뒤 수레가 탑니다. 적을 잡을지, 곡식을 보낼지 명령하십시오."
      - choice:
          key: c4_convoy
          prompt: "불화살이 장부와 마을 몫을 함께 노립니다. 무엇부터 지킬까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "자루를 벽으로 쌓고 비를 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: bad_grain_wall
            - text: "유신 옆에서 정면을 뚫는다"
              goto: bad_charge
            - text: "빈 수레를 미끼로 매복 주인을 끌어낸다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: bait_ambush

  bait_ambush:
    actions:
      - say:
          channel: narration
          text: "빈 수레가 협곡으로 구르자 첫 궁수들이 몸을 드러냈습니다. 비담이 불화살 하나를 낚아채 절벽 아래로 던졌고, 유신은 그 짧은 틈에 뒤 수레를 비탈길로 돌렸습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "매복한 자들은 봤습니다. 대신 빈 수레 둘을 버렸습니다. 그것도 보고에 적겠습니다."
      - goto: convoy_saved

  convoy_saved:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: medium
          channel: narration
          text: "해가 뜰 무렵, 그을린 수레바퀴가 마을 돌길을 밟았습니다. 아이들이 달려와 터진 자루에서 쌀알을 한 톨씩 주웠습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "오늘은 뒤 수레를 먼저 보셨습니다. 좋은 명령이었습니다."
      - say:
          char: 덕만
          text: "다음엔 내가 놓친 사람부터 말해 줘. 공주 앞에서 입 다무는 장수는 필요 없어."
      - say:
          channel: record
          text: "유신이 찢어진 자루를 뒤집자 당의 낙인이 드러났습니다. 비담은 장부 마지막 장을 찢어 덕만에게 건넸습니다. 사흘 뒤 모란 연회. 원조 손실을 해명하라는 당 사신의 글이었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "아이들 쌀을 창으로 바꾼 손이 당 사신과도 잔을 들었어. 이 장부를 들고 만나러 가자."
      - goto: /4.yaml

  bad_grain_wall:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "자루는 화살을 막아도 불은 못 막습니다. 비가 오기 전에 기름이 스며들면 곡식 전체가 장작이 됩니다."
      - say:
          char: 덕만.princess_angry
          text: "움직이면 뒤 수레가 맞아. 젖은 천을 덮고 조금만 버틴다."
      - say:
          channel: narration
          text: "첫 빗방울보다 불화살이 빨랐습니다. 쌓아 올린 자루는 사람을 가린 벽에서 협곡을 막는 불더미로 바뀌었고, 연기 속 군사들은 서로의 위치도 찾지 못했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 곡식 전량 소실. 덕만 공주와 호위 병력, 협곡 화재로 사망."
      - gameOver:
          title: "운명 — 곡식으로 쌓은 장작"
          message: "지켜야 할 곡식을 방벽으로 쓰자 불화살 한 발이 퇴로 전체를 태웠습니다. 비를 기다린 덕만과 유신은 불붙은 자루 사이에서 빠져나오지 못했습니다."
          recoverToChoice: c4_convoy

  bad_charge:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "곡식을 미끼로 던지든 정면을 뚫든, 저 불화살부터 우리 쪽으로 돌린다."
      - say:
          char: 유신.angry
          text: "수레가 움직이면 피할 벽도 사라집니다. 한 번 시작하면 사람과 곡식을 따로 빼낼 수 없습니다."
      - say:
          channel: narration
          text: "선두가 협곡으로 돌진하자 숨어 있던 궁수들이 일제히 몸을 드러냈습니다. 두 번째 불화살은 사람과 장부가 실린 뒤 수레에 꽂혔고, 너무 깊이 들어온 선두는 불붙은 퇴로 앞에서 멈췄습니다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "전술로 적을 끌어낼 수는 있었지만 협곡 전체를 전장으로 만들면 곡식과 사람도 미끼가 됩니다. 덕만과 유신은 불길 속에서 전사했고 구휼 장부도 함께 탔습니다."

  evidence_ledger:
    actions:
      - sticker:
          id: desk_0
          image: grain_ledger_sticker
          x: 27
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - sticker:
          id: desk_1
          image: market_seal_sticker
          x: 73
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - say:
          channel: narration
          camera: wide
          text: 한 줄에 자루 여섯, 도착 칸에는 셋. 나머지 셋 위로 붉은 인장이 덧찍혔습니다. 비담이 종이를 돌려 창빛에 비췄습니다.
          with: []
      - goto: evidence_ledger_compare

  evidence_ledger_compare:
    actions:
      - choice:
          key: evidence_ledger
          prompt: 장부에서 빠져나간 곡식은 어떻게 찾을까요?
          camera: wide
          options:
            - text: 출발 여섯 자루와 도착 세 자루를 대조한다
              goto: evidence_ledger_solved
            - text: 가장 큰 붉은 도장만 범인으로 지목한다
              goto: evidence_ledger_retry
            - text: 지워진 이름을 짐작해 채운다
              goto: evidence_ledger_retry
            - text: 판단을 미루고 돌아간다
              goto: evidence_ledger_return
          with: []

  evidence_ledger_retry:
    actions:
      - say:
          channel: narration
          text: 도장은 운송을 허락했을 뿐입니다. 출발과 도착의 자루 표시를 세면 사라진 몫을 누구나 확인할 수 있습니다.
          with: []
      - goto: evidence_ledger_compare

  evidence_ledger_solved:
    actions:
      - set:
          grain_verified: true
      - say:
          char: "덕만"
          text: "사라진 건 세 자루야. 이름을 추측하지 말고 이 수량부터 마을에 확인받자. 장부를 열든 거래하든 이 몫은 기억해."
      - goto: "evidence_ledger_return"


  evidence_ledger_return:
    actions:
      - clearSticker:
          id: "desk_0"
          leave: "fadeOut"
      - clearSticker:
          id: "desk_1"
          leave: "fadeOut"
      - goto: "grain_decision"
