      - gameOver:
          title: "운명 20 — 죽어 버린 진범"
          message: "진범은 죽었고 배후를 밝힐 증거는 남지 않았습니다. 덕만은 무고한 사람을 죽음으로 몰았다는 비난을 받았습니다."
  go_21_friendless_truth:
    actions:
