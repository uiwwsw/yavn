script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "제3장 — 잠긴 방의 시체"
      - say:
          text: "631년 늦여름, 같은 날 밤. 덕만의 방문 아래로 피가 흘렀다."
      - say:
          with: [덕만, 소원]
          wait: 700
          text: "혼례 비녀를 치운 지 두 시간도 지나지 않은 때였다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "제가 잠갔어요. 열쇠도 제 손에 있어요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "안에 누구야! 대답해!"
      - say:
          wait: 750
          text: "대답 대신 문 안에서 무거운 것이 쓰러지는 소리가 났다."
      - effect: { name: impact, wait: true }
      - say:
          text: "덕만이 문을 밀어젖히자, 기대어 있던 남자가 복도로 넘어졌다."
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "혼인 문서를 빼내 준 관리야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "손에 공주님 옷에서 뜯긴 끈을 쥐고 있어요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "죽은 뒤에 누가 쥐여 준 거야."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "그런데 빗장은 안에서 걸렸어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그럼 범인은 방에 들어오지도 않았어."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "이번에는 저도 공범으로 몰리겠네요."
      - say:
          char: 덕만.sad
          camera: medium
          with: [소원]
          text: "소원아, 넌 지금이라도 빠져."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "그 말 한 번만 더 해 보세요. 정말 화낼 거예요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          wait: 550
          text: "소원아."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          wait: 750
          text: "둘이 봤잖아요. 그러니 끝까지 같이 있어요."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "문을 열면 밖의 사람들도 다 보게 돼요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "안 열면 우리가 죽이고 숨겼다 하겠지."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "문밖의 발소리가 점점 늘어난다."
          char: 덕만
          camera: close
          with: [소원]
          options:
            - text: "문을 열어 공개한다"
              add: { legitimacy: 1 }
              goto: body_public
            - text: "침대 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "흔적부터 적는다"
              add: { insight: 1, sowon_trust: 1 }
              goto: body_record

  body_public:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "문을 열겠습니다. 모두 움직이지 말고 여기서 보십시오."
      - say:
          text: "사람들이 몰려들자 한 하인만 시신을 보기도 전에 뒤로 물러섰다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "저 하인은 시신이 무서운 모양입니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "아직 얼굴도 못 봤는데요?"
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "저 하인은 나가지 못하게 하세요."
      - goto: testimony_choice

  body_record:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "창밖 발판의 먼지만 닦여 있어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "누군가 밖에서 창을 열었어."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "제가 본 순서대로 적을게요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "서두르지 마. 틀리지 않게 적는 게 더 중요해."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "코에 먹물 묻었어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그건 좀 빨리 말해 주지."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          delivery: calm
          wait: 650
          text: "날이 밝기 직전, 세 사람이 찾은 흔적이 작은 탁자를 가득 채웠다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "창밖 흙에는 짚신 앞코만 찍혔어요."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "새로 만든 열쇠에는 녹인 초가 묻었습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "젖은 발자국은 여덟 개입니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "발자국 간격이 전부 똑같습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "세 흔적이 서로 다른 곳을 가리키네요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "세 흔적을 한꺼번에 쫓으면 범인이 먼저 움직입니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그럼 거짓말하기 어려운 흔적부터 보죠."
      - choice:
          key: c3_testimony
          prompt: "날이 밝기 전에 가장 수상한 흔적 하나를 확인한다."
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "창밖 발판의 먼지"
              add: { sowon_trust: 1, insight: 1 }
              goto: testimony_sowon
            - text: "본떠 만든 열쇠"
              add: { bidam_trust: 1, insight: 1 }
              goto: testimony_bidam
            - text: "젖은 발자국"
              add: { yushin_trust: 1, army_support: 1 }
              goto: testimony_yushin
            - text: "칠숙의 증언"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - char:
          id: 소원
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "발판에는 짚신 앞코만 눌렸어요."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "밧줄에 매달려 움직여서 땅을 밟지 않은 거예요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "창틈으로 독 묻은 실을 넣었군."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "나갈 때 그 실로 빗장도 당겼고요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "밖에서 죽인 뒤, 아무도 들어오지 않은 밀실처럼 꾸몄어."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "누군가 녹인 초로 공주님 열쇠 모양을 떴습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "제 열쇠를 만진 궁녀는 셋입니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "세 사람 모두 서로를 의심하고 있더군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "서로를 의심하게 만들려 했군요."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "이제 흔적보다 사람부터 의심하시네요."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "목격자들은 범인이 오른발을 절었다고 했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "그런데 발자국은 반듯합니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "아진이 일부러 절뚝거린 겁니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "데려오세요. 칼도 줄도 보이지 말고요."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          delivery: calm
          wait: 700
          text: "날이 밝을 무렵, 아진은 붙잡히기 전에 제 발로 찾아왔다."
      - say:
          with: [덕만, 아진]
          text: "그는 붉은 손목 매듭을 풀어 탁자 위에 놓았다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [아진]
          text: "전하의 술잔도, 제 방의 시신도 당신 짓입니까?"
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제가 한 일은 이미 아시겠지요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "다만 왜 했는지는 모르십니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "누가 당신 가족을 잡고 있습니까?"
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          wait: 850
          text: "그 이름을 말하면 제 가족이 죽습니다."
      - say:
          with: [덕만, 아진]
          wait: 750
          text: "아진은 품에서 아이 짚신 한 짝을 꺼냈다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제 동생이 신던 겁니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "명령을 따르지 않으면 동생 물건이 하나씩 옵니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [아진]
          text: "그래서 아직 당신 손을 묶지 않았습니다."
      - say:
          camera: close
          with:
            - 아진
          wait: 650
          text: "아진의 손이 아이 짚신 위에서 멈췄다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          wait: 900
          unskippable: true
          text: "<speed=19>당신도, 동생도 살아 있어야 진실을 말할 수 있습니다.</speed>"
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "당신을 가두면 명령한 사람은 또 숨겠지요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "풀어 두면 제가 공주를 다시 찌를 수도 있습니다."
      - choice:
          key: c3_culprit
          prompt: "아진은 묶이지 않은 두 손을 내밀었다."
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "칠숙의 명령을 가져오라 한다"
              add: { bidam_trust: 1 }
              goto: culprit_deal
            - text: "시신이 살아났다고 속인다"
              add: { insight: 1, legitimacy: 1 }
              goto: culprit_bait
            - text: "소원에게 죄를 씌운다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - char:
          id: 아진
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 아진.angry
          camera: medium
          with: [덕만]
          text: "명령서를 빼내는 순간 가족이 죽습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "그전에 우리가 가족부터 찾겠습니다."
      - say:
          char: 아진.angry
          camera: close
          with: [덕만]
          text: "공주님을 믿어서 하는 일이 아닙니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "지금 저를 믿으라는 말은 아닙니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          wait: 850
          text: "……제가 돌아온 뒤 저를 어떻게 할지 정하십시오."
      - goto: chapter3_end

  culprit_bait:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "‘죽었던 관리가 방금 눈을 떴다.’"
      - say:
          text: "소문이 퍼지자 하인 하나가 몰래 시신의 입을 벌려 봤다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "살아난 관리가 누구 이름을 말했다고 들었지?"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "겁먹은 하인이 헛소문에 넘어갔군요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "좋습니다. 그 하인 앞에서도 같은 말을 하세요."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - get: oath_fragment
      - set: { clue_oath_fragment: true }
      - add: { legitimacy: 1 }
      - say:
          wait: 650
          text: "아침이 밝자 찢긴 비밀 문서가 귀족들 앞에 펼쳐졌다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "남자 왕족을 다음 왕으로 세운다는 약속입니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "이번 누명도 벗으셨군요. 축하드립니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "그러니 이제 국경으로 가셔야지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "누명이 풀리자마자 저를 국경으로 보내시는 겁니까?"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "국경에서는 지금도 백성이 굶고 있습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님은 그 말을 거절하지 못하시겠지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "예. 그래서 가겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "다만 돌아오는 날은 제가 정하겠습니다."
      - say:
          wait: 850
          text: "칠숙은 이미 국경 지휘권이 적힌 나무패를 꺼내 들고 있었다."

  go_17_second_murder:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "두 사람은 피를 닦을 새도 없이 시신을 침대 밑으로 밀었다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "닦아도 피 냄새가 안 없어져요."
      - say:
          char: 덕만
          camera: medium
