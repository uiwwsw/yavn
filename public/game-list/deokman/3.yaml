script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: village
      - camera: wide
      - say:
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: narration
          text: "서쪽 창고에서 나온 수레는 빈 마을을 세 번 지나고도 멈추지 않았습니다. 덕만이 한 집의 곡식독을 열자 바닥에서 마른 쥐똥만 굴렀습니다. 장부에는 이 집이 어제 쌀을 받았다고 적혀 있었습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비가 오면 자국이 지워집니다. 병사 스무 명이면 해 뜨기 전 창고 셋을 칠 수 있고요."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "문부터 부수면 하수인만 잡혀. 밤에 움직인 수레부터 찾자. 비 오기 전에."
      - choice:
          key: c4_investigation
          prompt: "비가 오기 전에 무엇부터 확인할까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "마을 사람들에게 수레 길을 묻는다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "바퀴 폭을 재고 야간 통행표를 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "유신의 기병으로 세 창고를 봉쇄한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: narration
          text: "낮 통행표의 바퀴 폭과 밤 진흙의 자국이 꼭 맞았습니다. 왕실 수레는 해가 지면 귀족 문장이 그려진 덮개만 갈아썼습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "맞습니다. 장부는 고쳐도 수레 폭은 못 바꿉니다. 왕실 수레가 산 위로 갔습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "노파가 품삯 쌀을 소매에 넣고 지팡이로 산등성이를 가리켰습니다. 아이들은 밤마다 수레 소리가 멎는 집을 서로 다투어 말했습니다. 능선의 작은 창고 하나에서는 이미 연기가 났습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "저 연기, 우리가 묻기 시작한 뒤에 났어. 누군가 질문을 듣고 먼저 움직였어."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "마을로 돌아가야 합니다. 우리가 들른 집마다 같은 쌀자루가 놓였습니다."
      - say:
          channel: narration
          text: "두 사람이 돌아섰을 때 능선 양쪽에서 화살이 날아왔습니다. 공개된 질문은 답보다 먼저 창고 주인에게 닿아 매복할 시간을 벌어 주었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "서쪽 산적 토벌 기록 — 덕만 공주와 김유신, 주민 제보를 확인하던 중 매복으로 사망."
      - gameOver:
          title: "운명 — 비보다 빠른 밀고"
          message: "물어본 사람이 많을수록 소문도 빨랐습니다. 창고 주인은 증거를 태우고 거짓 길 끝에 궁수를 세웠고, 덕만과 유신은 답이 없는 능선에서 전사했습니다."
          recoverToChoice: c4_investigation

  surround_warehouse:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "기병의 횃불이 세 창고를 동시에 에워쌌습니다. 안쪽 빗장이 걸리는 소리와 함께, 담 너머에서 '왕실의 약탈'이라는 외침이 먼저 터졌습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "문은 부술 수 있습니다. 다만 장부보다 '공주가 창고를 털었다'는 소문이 먼저 달릴 겁니다."
      - say:
          char: 덕만.princess_angry
          camera: close
          with: [유신]
          text: "이미 에워쌌어. 지금 물러나면 겁먹었다고 할 거야. 문을 열어."
      - say:
          channel: narration
          text: "세 문이 동시에 부서지자 빈 창고 안의 기름통이 터졌습니다. 병력이 불을 끄러 흩어진 사이 진짜 수레를 지키던 궁수들이 덕만의 깃발을 향해 쐈습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 창고 강제 점검 중 화재 발생. 덕만 공주와 호위대 사망. 구휼 장부는 발견되지 않음."
      - gameOver:
          title: "운명 — 증거보다 먼저 닫힌 포위"
          message: "어느 창고가 진짜인지 확인하지 않은 봉쇄는 적에게 병력 위치만 알려 줬습니다. 불붙은 가짜 창고로 군사가 흩어졌고 덕만은 매복한 궁수의 표적이 됐습니다."
          recoverToChoice: c4_investigation

  hidden_warehouse:
    actions:
      - bg: locked_room
      - camera: wide
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: slideLeft, layout: push, duration: 520 } }
      - say:
          channel: narration
          text: "문이 무너지자 곡식 냄새 대신 기름 먹인 갑옷 냄새가 쏟아졌습니다. 갑옷 더미 위에 한 사내가 누워 남의 장부를 소리 내 읽고 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "쌀 한 섬에 창 세 자루. 이름은 지우고 값은 꼼꼼히 적었군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "누구지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담입니다. 칼로 먹고사는데… 오늘 보니 장부가 더 잘 죽이더군요."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비는 들이치고 밖에선 문을 밉니다. 내일이면 쌀도 장부도 못 씁니다. 지금 정하십시오."
      - choice:
          key: c4_grain_policy
          prompt: "굶은 사람들이 창고 문을 밉니다. 무엇부터 내놓을까요?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "장부를 벽에 붙이고 마을에 열쇠를 준다"
              set: { grain_policy: public_distribution }
              add: { people_support: 3, nobles_support: -1, insight: 1 }
              goto: public_distribution
            - text: "왕실 깃발 아래 줄을 세워 배급한다"
              set: { grain_policy: royal_relief }
              add: { king_trust: 1, nobles_support: 1, people_support: 1 }
              goto: royal_relief
            - text: "장부를 덮고 귀족에게 군량을 뜯어낸다"
              set: { grain_policy: bargain }
              add: { army_support: 2, evidence: 1, fear: 1 }
              goto: grain_bargain

  public_distribution:
    actions:
      - bg: village
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "마을 대표들이 자루마다 숯으로 집 이름을 썼습니다. 줄은 느리게 줄었고 서로의 몫을 세는 목소리는 밤새 멈추지 않았습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "오늘 쌀을 센 사람들이 내일은 왕실 장부도 보자 할 겁니다. 그때도 여실 겁니까?"
      - say:
          char: 덕만
          text: "열어야지. 귀찮다고 닫으면 또 쌀부터 사라질 테니까."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "왕실 북이 울리자 줄은 빠르게 정리됐습니다. 관리들은 자루를 건넬 때마다 '왕의 은혜'를 외쳤고 덕만의 이름은 한 번도 부르지 않았습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "공주님 몫이라며 따로 떠온 죽입니다. 잠깐, 배급 솥과 색이 다릅니다. 드시지 마십시오."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "내가 안 먹으면 저 줄의 누구에게 가겠지. 관리부터 불러. 이 그릇을 누가—"
      - say:
          channel: narration
          text: "덕만의 말이 끊기고 그릇이 바닥에 깨졌습니다. 왕실 깃발을 맡은 관리의 소매에서는 곡식 창고를 빼앗긴 가문의 표식과 독가루 주머니가 함께 나왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 구휼 기록 — 덕만 공주, 배급 현장에서 귀족 가문의 사주를 받은 관리에게 독살됨."
      - gameOver:
          title: "운명 — 왕의 은혜에 든 독"
          message: "배급을 왕실 관리에게만 맡기자 곡식을 잃은 귀족이 그 줄 안에 독을 숨겼습니다. 백성의 몫을 확인하지 못한 덕만은 자신에게 따로 올린 죽을 마시고 숨졌습니다."
          recoverToChoice: c4_grain_policy

  grain_bargain:
    actions:
      - bg: council_hall
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "장부가 상자에 잠기자 귀족 창고에서 군량 수레가 나왔습니다. 병사들의 솥에는 김이 올랐고, 마을 사람들은 도둑의 이름 대신 빈 자루만 바라봤습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "오늘은 저 군량이 필요해. 장부는 내가 쥐고 있으니 거래가 끝난 뒤 다시 열면 돼."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "저들도 계산했겠지요. 공주님만 사라지면 상자는 안 열린다고. 그 잔 놓으십시오."
      - say:
          channel: narration
          text: "덕만이 손을 떼기도 전에 손끝이 저렸습니다. 귀족들은 군량을 내준 잔치에서 장부의 열쇠와 그것을 열 사람을 한꺼번에 없앴습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "서쪽 창고 합의 기록 — 덕만 공주, 지병으로 급서. 구휼 장부는 화장 때 함께 소실됨."
      - gameOver:
          title: "운명 — 거래가 끝난 뒤의 잔"
          message: "도둑과 장부를 담보로 거래한 순간 덕만은 그들이 시간을 벌기 위해 살려 둔 증인이 됐습니다. 군량이 출발하자 귀족들은 독주로 증인과 장부를 함께 없앴습니다."
          recoverToChoice: c4_grain_policy

  convoy_attack:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "마지막 수레가 협곡 그림자에 들어간 순간 앞뒤에서 바위가 굴렀습니다. 절벽 위 횃불들이 곡식 자루와 장부 상자를 동시에 겨눴습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "정면은 뚫습니다. 대신 뒤 수레가 탑니다. 적을 잡을지, 곡식을 보낼지 명령하십시오."
      - choice:
          key: c4_convoy
          prompt: "불화살이 장부와 마을 몫을 함께 노립니다. 무엇부터 지킬까요?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "자루를 벽으로 쌓고 비를 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: bad_grain_wall
            - text: "유신 옆에서 정면을 뚫는다"
              goto: bad_charge
            - text: "빈 수레를 미끼로 매복 주인을 끌어낸다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: bait_ambush

  bait_ambush:
    actions:
      - say:
          channel: narration
          text: "빈 수레가 협곡으로 구르자 첫 궁수들이 몸을 드러냈습니다. 비담이 불화살 하나를 낚아채 절벽 아래로 던졌고, 유신은 그 짧은 틈에 뒤 수레를 비탈길로 돌렸습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "매복한 자들은 봤습니다. 대신 빈 수레 둘을 버렸습니다. 그것도 보고에 적겠습니다."
      - goto: convoy_saved

  convoy_saved:
    actions:
      - bg: village
      - camera: medium
      - say:
          channel: narration
          text: "해가 뜰 무렵, 그을린 수레바퀴가 마을 돌길을 밟았습니다. 아이들이 달려와 터진 자루에서 쌀알을 한 톨씩 주웠습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "오늘은 뒤 수레를 먼저 보셨습니다. 좋은 명령이었습니다."
      - say:
          char: 덕만
          text: "다음엔 내가 놓친 사람부터 말해 줘. 공주 앞에서 입 다무는 장수는 필요 없어."
      - say:
          channel: record
          text: "유신이 찢어진 자루를 뒤집자 당의 낙인이 드러났습니다. 비담은 장부 마지막 장을 찢어 덕만에게 건넸습니다. 사흘 뒤 모란 연회. 원조 손실을 해명하라는 당 사신의 글이었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "아이들 쌀을 창으로 바꾼 손이 당 사신과도 잔을 들었어. 이 장부를 들고 만나러 가자."
      - goto: /4.yaml

  bad_grain_wall:
    actions:
      - bg: frontier
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "자루는 화살을 막아도 불은 못 막습니다. 비가 오기 전에 기름이 스며들면 곡식 전체가 장작이 됩니다."
      - say:
          char: 덕만.princess_angry
          text: "움직이면 뒤 수레가 맞아. 젖은 천을 덮고 조금만 버틴다."
      - say:
          channel: narration
          text: "첫 빗방울보다 불화살이 빨랐습니다. 쌓아 올린 자루는 사람을 가린 벽에서 협곡을 막는 불더미로 바뀌었고, 연기 속 군사들은 서로의 위치도 찾지 못했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 곡식 전량 소실. 덕만 공주와 호위 병력, 협곡 화재로 사망."
      - gameOver:
          title: "운명 — 곡식으로 쌓은 장작"
          message: "지켜야 할 곡식을 방벽으로 쓰자 불화살 한 발이 퇴로 전체를 태웠습니다. 비를 기다린 덕만과 유신은 불붙은 자루 사이에서 빠져나오지 못했습니다."
          recoverToChoice: c4_convoy

  bad_charge:
    actions:
      - bg: frontier
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "곡식을 미끼로 던지든 정면을 뚫든, 저 불화살부터 우리 쪽으로 돌린다."
      - say:
          char: 유신.angry
          text: "수레가 움직이면 피할 벽도 사라집니다. 한 번 시작하면 사람과 곡식을 따로 빼낼 수 없습니다."
      - say:
          channel: narration
          text: "선두가 협곡으로 돌진하자 숨어 있던 궁수들이 일제히 몸을 드러냈습니다. 두 번째 불화살은 사람과 장부가 실린 뒤 수레에 꽂혔고, 너무 깊이 들어온 선두는 불붙은 퇴로 앞에서 멈췄습니다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "전술로 적을 끌어낼 수는 있었지만 협곡 전체를 전장으로 만들면 곡식과 사람도 미끼가 됩니다. 덕만과 유신은 불길 속에서 전사했고 구휼 장부도 함께 탔습니다."
