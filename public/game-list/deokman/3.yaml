script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: locked_room
      - effect: focus
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "제3장 — 한 사람만 거짓말한다"
      - say:
          with:
            - 덕만
            - 소원
          text: "죽은 사람은 혼인 합의서를 덕만에게 넘긴 귀족이었습니다. 누군가는 입을 막은 뒤 시체를 덕만의 잠긴 방에 넣고, 손에는 덕만의 옷고름까지 쥐여 놓았습니다. 암살 누명에서 벗어난 공주를 이번에는 살인범으로 만들려는 함정이었습니다."
      - say:
          char: 소원.nervous
          framing: full
          delivery: nervous
          text: "빗장은 안에서 걸려 있었고 창틀 먼지는 그대로예요. 그런데 문밖 사람들은 똑같은 말만 해요. ‘비명은 못 들었다, 아무도 드나들지 않았다.’"
      - say:
          char: 덕만
          framing: bust
          text: "누가 먼저 그렇게 말했대?"
      - say:
          char: 소원.nervous
          framing: bust
          with:
            - 덕만
          text: "다들 자기가 먼저 말했다고 해요. 그래서 더 이상해요."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 소원
          text: "그럼 사람들 말은 잠깐 잊자. 이 방에서 실제로 움직인 것부터 보자. 시체가 식기 전에."
      - say:
          char: 소원.nervous
          framing: bust
          with:
            - 덕만
          text: "문밖에는 벌써 칠숙의 사람들이 와 있어요. 문을 열면 흔적이 밟히고, 닫아 두면 공주님이 시체를 숨겼다고 할 거예요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 소원
          text: "시체를 옮기면 누군가에게 죄를 넘기는 사람이 되고, 너와 둘이 기록하면 네가 내 거짓말을 돕는 사람으로 몰리겠지. 이번 함정은 나 혼자만 잡으려는 게 아니야."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체가 식기 전, 무엇을 할까?"
          char: 덕만.angry
          framing: closeup
          with:
            - 소원
          options:
            - text: "모두 불러 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "소원과 흔적을 적는다"
              add:
                sowon_trust: 2
                insight: 1
              goto: body_record

  body_public:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: shout
          text: "문을 여세요. 들어와서 직접 보십시오. 제가 숨겼다는 말은 그 다음에 들을 테니, 지금 나가는 사람부터 잡으세요."
      - say:
          delivery: nervous
          text: "사람들이 시체를 보려 몰려드는 동안, 맨 뒤에 있던 칠숙의 하인이 한 걸음 물러섰습니다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "겁이 많은 아이라 그렇습니다. 시체를 보고 물러난 것까지 죄가 되지는 않겠지요."
      - say:
          char: 덕만
          framing: bust
          text: "아직 시체를 보지 않았습니다. 그런데 왜 물러났을까요? 그 아이는 따로 남겨 두세요."
      - goto: testimony_choice

  body_record:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "안쪽 먼지는 그대로인데, 창밖 발판만 손바닥만큼 닦였어요. 누가 밖에서 창을 밀었나 봐요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 범인은 방 안에 들어오지 않았을 수도 있어. 네가 발견한 순서대로 적어 줘. 나중에 누가 말을 바꿔도 흔적은 안 바뀌게."
      - say:
          char: 소원
          framing: bust
          text: "글씨가 느려도 괜찮죠? 하나도 빼먹고 싶지 않아요."
      - say:
          char: 덕만
          framing: bust
          text: "천천히 써. 오늘은 빠른 대답보다 틀리지 않은 기록이 필요해."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: council_hall
      - say:
          text: "해가 뜨기 전, 소원은 창밖 흔적을 가져왔고 비담은 복제된 열쇠를, 유신은 젖은 발자국의 치수를 가져왔습니다."
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: bust
          with:
            - 덕만
          text: "저는 공주님 편이라서 먼지를 고른 게 아니에요. 높은 분도 낮은 사람도 먼지한테는 거짓말을 시킬 수 없으니까요. 누가 밟았는지만 그대로 남아요."
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "열쇠는 세 벌입니다. 하나는 공주님 것, 하나는 죽은 자의 품, 나머지 하나는 어젯밤 급히 만든 흔적이 남았습니다."
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "저를 믿을 필요는 없습니다. 대신 열쇠를 만든 장인은 값을 받은 날짜를 거짓말하지 못합니다. 제가 공주님께 파는 건 믿음이 아니라 확인할 순서니까요."
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "창 아래 발자국은 여덟 개입니다. 비에 젖었지만 보폭은 일정합니다. 다친 사람의 걸음은 아닙니다."
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "제 단서대로면 용의자를 바로 잡아들일 수 있습니다. 하지만 틀리면 공주 호위가 죄 없는 사람에게 칼을 댄 일이 됩니다. 그래서 숫자만 보고드립니다. 판단은 공주께서 하십시오."
      - say:
          char: 덕만
          framing: bust
          text: "단서 셋이 서로 다른 사람을 가리키는 것처럼 보여. 하나부터 끝까지 따라가 보자."
      - choice:
          key: c3_testimony
          prompt: "누구의 단서를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "소원의 먼지"
              add:
                sowon_trust: 1
                insight: 1
              goto: testimony_sowon
            - text: "비담의 열쇠"
              add:
                bidam_trust: 1
                insight: 1
              goto: testimony_bidam
            - text: "유신의 발자국"
              add:
                yushin_trust: 1
                power: 1
              goto: testimony_yushin
            - text: "칠숙의 상처"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: bust
          text: "발판에 짚신 앞코만 찍혔어요. 밧줄에 몸을 기대고 창을 민 것 같아요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 소원
          text: "직접 들어오지 않고 어떻게 사람을 죽였지?"
      - say:
          char: 소원
          framing: closeup
          text: "창으로 뭘 건넸을 수도 있어요. 바닥에 약 냄새 나는 실이 떨어져 있었어요."
      - say:
          char: 덕만
          framing: bust
          text: "실로 문빗장을 당겼군. 살인은 방 안에서, 잠금은 방 밖에서 끝낸 거야."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "새 열쇠에는 밀랍이 묻어 있습니다. 공주님 열쇠 모양을 본떠 만든 겁니다."
      - say:
          char: 덕만
          framing: bust
          text: "누가 열쇠를 가져갔는지 알아낼 수 있어?"
      - say:
          char: 비담.smirk
          framing: bust
          text: "공주님 열쇠를 맡았던 나인 셋은 서로를 의심하고 있습니다. 범인은 그중에 없을 겁니다. 너무 잘 보이는 의심은 대개 누가 갖다 놓은 거라서요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 열쇠를 만든 장인부터 찾아. 누가 밀랍을 가져왔는지 물어보자."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "발자국은 여덟 개, 간격은 모두 두 자 반입니다. 그런데 용의자 한 명은 어젯밤부터 다리를 절었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "다친 척했다는 뜻이군요. 누굽니까?"
      - say:
          char: 유신
          framing: closeup
          text: "아진입니다. 공주께 들킨 뒤부터 왼쪽 다리를 절었습니다. 하지만 발자국은 양쪽 깊이가 같습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "그 사람은 얼굴을 숨겨도 걷는 속도는 못 숨겨. 데려오세요. 다만 아직 체포하지는 마세요."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          with:
            - 아진
          text: "끌려온 여자는 서쪽 회랑에서 칠숙과 왕의 죽음을 의논하던 아진이었습니다. 오른손의 붉은 매듭은 그날 덕만이 본 것과 같았고, 잠긴 방 창밖에서도 같은 실밥이 발견됐습니다."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "문까지 열한 걸음입니다. 공주께서 제 이름을 부르는 순간부터 세었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
          text: "달아날 생각이었나?"
      - say:
          char: 덕만.angry
          framing: bust
          with:
            - 아진
          text: "아버지 잔에도, 내 방의 시체에도 네 붉은 매듭이 남았어. 너는 칠숙의 칼이야. 그런데 칼을 쥔 손이 누구인지는 아직 증명하지 못했지."
      - say:
          char: 아진.nervous
          framing: bust
          text: "증거가 없으면 달아날 필요도 없습니다. 공주께서는 제가 했다는 것만 아십니다. 왜 했는지는 모르십니다."
      - say:
          char: 아진.nervous
          framing: closeup
          with:
            - 덕만
          text: "명령한 사람의 이름을 말하면 저보다 먼저 죽는 사람들이 있습니다. 제가 충성해서 입을 다무는 건 아닙니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래서 아직 잡지 않았어. 네가 누구 명령을 받았는지 말할 기회를 주는 거야."
      - choice:
          key: c3_culprit
          prompt: "아진이 눈앞에 있다. 어떻게 할까?"
          char: 덕만
          framing: closeup
          with:
            - 아진
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "문서를 가져오라 한다"
              add:
                power: 1
                suspicion: 2
              goto: culprit_deal
            - text: "죽은 자가 깼다 속인다"
              add:
                insight: 2
                nobles_support: -1
              goto: culprit_bait
            - text: "소원을 범인으로 몬다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - say:
          char: 아진.angry
          framing: bust
          delivery: neutral
          text: "문서를 가져오면 제 가족이 죽습니다. 다음 명령이 오면 저는 공주를 죽여야 합니다. 그래도 저를 보내시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "가족이 어디 있지?"
      - say:
          char: 아진.angry
          framing: closeup
          text: "그것까지 말하면 오늘 밤을 못 넘깁니다."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 말하지 마. 문서만 가져와. 그동안 내가 네 가족이 있는 곳부터 찾을게."
      - say:
          char: 아진.nervous
          framing: bust
          text: "공주를 믿는 게 아니라, 다른 길이 없어서 갑니다."
      - say:
          char: 덕만
          framing: bust
          text: "처음에는 그 정도면 돼. 돌아오면 그 다음을 정하자."
      - add:
          bidam_trust: 1
      - goto: chapter3_end

  culprit_bait:
    actions:
      - effect: focus
      - say:
          delivery: nervous
          text: "덕만은 죽은 귀족이 잠깐 의식을 되찾았다는 거짓 전갈을 보냈습니다. 반 시진 뒤, 칠숙의 하인이 방으로 돌아와 시체의 입을 확인하다 붙잡혔습니다."
      - say:
          char: 덕만
          framing: bust
          text: "죽은 사람이 무슨 말을 했다고 들었지?"
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "겁먹은 하인이 제멋대로 움직인 모양입니다. 제 사람이라고 모두 제 명령만 듣는 것은 아닙니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그 말은 하인 앞에서도 해 주세요. 품에서 나온 서약서와 함께 물어보겠습니다."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - get: oath_fragment
      - set:
          clue_oath_fragment: true
      - add:
          legitimacy: 1
      - say:
          text: "찢긴 서약서에는 왕실 남자를 후계자로 세우고, 덕만을 혼인이나 추방으로 왕경에서 떼어 놓겠다는 약속이 남아 있었습니다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "살인 혐의는 벗으셨습니다. 축하드립니다. 전하께서 공주께 국경 위무를 맡기셨으니, 떠날 준비를 하셔야겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "살인범을 잡은 날 바로 왕경을 떠나라니, 준비가 빠르시군요."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "국경의 백성이 굶고 있습니다. 공주께서도 그들을 오래 기다리게 하고 싶지는 않으시겠지요."
      - say:
          char: 덕만
          framing: closeup
          text: "가겠습니다. 대신 제가 그곳에서 누구를 만나고 무엇을 듣는지는 이곳에서 정하지 못할 겁니다."
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "궁 밖에서는 공주라는 이름도 생각보다 가볍습니다. 몸조심하십시오."
      - say:
          text: "덕만은 살인 누명을 벗고 계승동맹의 서약서를 얻었습니다. 그러나 그날 안에 국경으로 떠나라는 왕명을 받았습니다."

  go_17_second_murder:
    actions:
      - bg: locked_room
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "덕만과 소원은 시체를 침상 밑으로 밀어 넣고 바닥의 피를 닦았습니다. 문밖에서는 방을 수색하겠다는 호위의 목소리가 들렸습니다."
      - say:
          char: 소원.nervous
          framing: bust
          text: "피 냄새가 안 없어져요. 침상 휘장에도 묻었어요. 이제라도 문 열고 말해요."
      - say:
          char: 덕만
          framing: bust
          text: "지금 발견되면 설명할 틈도 없어. 먼저 이 사람이 왜 여기 왔는지 알아내야 해."
      - effect: alarm
      - say:
          text: "호위들은 왕명을 내세워 문을 부쉈습니다. 침상 아래에서는 시체뿐 아니라 피를 닦은 천과 덕만의 손자국이 함께 나왔습니다."
      - say:
          char: 소원.nervous
          framing: closeup
          with: []
          text: "공주님이 죽인 게 아니라고 제가 말할게요."
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "네가 본 건 우리가 시체를 숨긴 일이야. 이제 그 말도 나를 구하지 못해."
      - effect: darken
      - say:
          text: "살인 시각은 덕만이 시체를 발견하기 전이었지만, 진실을 숨긴 행동 때문에 모든 해명이 거짓으로 취급됐습니다."
          wait: 700
      - gameOver:
          title: "운명 17 — 침상 아래의 시체"
          message: "덕만은 살인과 증거 은폐 혐의로 체포되었습니다. 실제 범인은 수사 대상에서 빠졌습니다."
  go_18_borrowed_corpse:
    actions:
      - bg: shadow_corridor
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: center
          framing: full
      - say:
          with:
            - 덕만
            - 소원
          text: "덕만과 소원이 시체를 천에 싸서 회랑을 옮겼습니다. 발을 맞추지 못할 때마다 천 아래의 뒤꿈치가 바닥을 긁었고, 멀리서 야간 교대 종이 울렸습니다."
