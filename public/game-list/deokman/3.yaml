script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: locked_room
      - effect: focus
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "제3장 — 한 사람만 거짓말한다"
      - say:
          char: 소원.nervous
          framing: full
          delivery: nervous
          text: "빗장은 안에서 걸렸고, 창틀 먼지엔 손가락 한 줄 없어요. 그런데 문밖 사람들은 숨 쉬는 자리까지 똑같이 말해요. 본 게 아니라 외운 것처럼."
      - say:
          char: 덕만
          framing: bust
          text: "말끝과 숨까지 같다면 목격한 게 아니라 배운 거야. 마지막으로 외운 사람 말고, 처음 그 문장을 만든 사람부터 찾자."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체가 식기 전, 무엇을 할까?"
          char: 덕만.angry
          framing: closeup
          with:
            - 소원
          options:
            - text: "모두 불러 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "소원과 흔적을 적는다"
              add:
                sowon_trust: 2
                insight: 1
              goto: body_record

  body_public:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: shout
          text: "문을 여세요. 시체도 피도 먼저 보여 드리지요. 대신 지금 문밖으로 나가는 사람은, 이 방보다 숨길 것이 많은 자입니다."
      - say:
          text: "시선이 시체에서 문으로 돌아갔다. 맨 뒤에 선 칠숙의 하인이 뒤꿈치를 반 치 물렸다."
      - goto: testimony_choice

  body_record:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "안쪽 먼지는 그대로인데 바깥만 손바닥 하나만큼 닦였어요. 창을 연 손은 방 안으로 들어오지도 않았어요."
      - say:
          char: 덕만
          framing: bust
          text: "좋아. 사람 입은 서로 베끼지만 먼지는 그러지 않아. 네가 본 순서대로, 닦인 자리부터 적자."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: council_hall
      - say:
          text: "소원은 창밖 먼지를, 비담은 복제된 열쇠를, 유신은 젖은 발자국을 내놓았다. 칠숙만 엎드린 시체 아래의 상처를 보았다고 말했다."
      - choice:
          key: c3_testimony
          prompt: "누구의 단서를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "소원의 먼지"
              add:
                sowon_trust: 1
                insight: 1
              goto: testimony_sowon
            - text: "비담의 열쇠"
              add:
                bidam_trust: 1
                insight: 1
              goto: testimony_bidam
            - text: "유신의 발자국"
              add:
                yushin_trust: 1
                power: 1
              goto: testimony_yushin
            - text: "칠숙의 상처"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "발판에 짚신 앞코만 찍혔어요. 몸집 작은 사람이 밧줄에 매달려 창을 밀었어요. 시킨 자는 신발에 흙 한 점 묻히지 않았고요."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "잠긴 것은 둘입니다. 이 문 하나, ‘안에서 잠겼다’는 사람들 생각 하나. 쇠도 안 든 두 번째 자물쇠가 훨씬 비쌌겠군요."
      - say:
          char: 덕만
          framing: bust
          text: "문은 그대로 두고 이야기를 열죠. 열쇠를 본 자가 아니라, 아무도 묻기 전에 잠겼다고 말한 자부터."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "발자국은 여덟, 간격은 모두 두 자 반입니다. 상처 입은 자는 이렇게 걷지 못합니다. 어젯밤부터 일부러 절뚝인 사람은 한 명뿐입니다."
      - say:
          char: 덕만
          framing: bust
          text: "아진. 얼굴은 가렸어도 여덟 걸음은 숨기지 못했군. 그대는 위기에서도 보폭을 바꾸지 않지."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "문까지 열한 걸음. 공주께서 제 이름을 부른 순간, 달아날 거리는 사라졌습니다. 하지만 체포하기에는 한 걸음이 모자랍니다. 증거입니다."
      - choice:
          key: c3_culprit
          prompt: "아진이 눈앞에 있다. 어떻게 할까?"
          char: 덕만
          framing: closeup
          with:
            - 아진
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "문서를 가져오라 한다"
              add:
                power: 1
                suspicion: 2
              goto: culprit_deal
            - text: "죽은 자가 깼다 속인다"
              add:
                insight: 2
                nobles_support: -1
              goto: culprit_bait
            - text: "소원을 범인으로 몬다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - say:
          char: 아진.angry
          framing: bust
          delivery: neutral
          text: "다음 명령이 오면 저는 공주를 죽입니다. 칼날이 어디를 향할지 아시면서도 손잡이를 잡으시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "그대가 나를 죽이는 까닭은 미움이 아니라 명령이야. 그렇다면 그대를 꺾을 필요는 없어. 명령이 오는 길을 꺾으면 되지."
      - add:
          bidam_trust: 1
      - goto: chapter3_end

  culprit_bait:
    actions:
      - effect: focus
      - say:
          delivery: nervous
          text: "‘죽은 자가 깨어났다’는 전갈이 닿은 지 반 시진. 칠숙의 하인이 시체의 입을 다시 막으러 돌아왔다. 품에서는 찢긴 서약서가 떨어졌다."
      - say:
          char: 덕만
          framing: bust
          text: "죽은 입이 한 번 더 열릴까 두려워 돌아왔군. 이번에는 산 입으로, 누가 그 두려움을 시켰는지 말하게 하세요."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - get: oath_fragment
      - set:
          clue_oath_fragment: true
      - add:
          legitimacy: 1
      - say:
          text: "서약서에는 왕실 남자를 후계로 세운다는 계승동맹의 약속이 남아 있었다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "결백을 되찾으셨으니 온 왕경이 기뻐할 것입니다. 그 명망을 국경의 굶주린 백성과도 나누시지요. 아주 오래도록."
      - say:
          char: 덕만
          framing: bust
          text: "입으로는 위무라 하고, 길로는 추방을 명하시는군요. 가겠습니다. 궁의 증언은 고쳐 써도, 굶주린 사람이 받은 한 끼까지 지우지는 못할 테니."
      - say:
          text: "제3장 완료 — 덕만은 계승동맹의 증거를 얻는 대신, 왕경을 잃었다."

  go_17_second_murder:
    actions:
      - gameOver:
          title: "운명 17 — 두 번째 살인"
          message: "숨긴 시체는 덕만의 침상 아래에서 발견되었다. 첫 번째 살인은 남의 것이었지만, 진실을 숨긴 두 번째 살인은 덕만의 것이 되었다."
  go_18_borrowed_corpse:
    actions:
      - gameOver:
          title: "운명 18 — 빌린 시체"
          message: "시체를 옮기는 덕만의 모습은 열두 명이 보았다. 칠숙은 자신의 방에서 발견된 시체보다 공주의 손에 묻은 피를 증거로 삼았다. 함정은 주인만 바꾸어 닫혔다."
  go_19_last_witness:
    actions:
      - gameOver:
          title: "운명 19 — 마지막 증언"
          message: "칠숙은 상처를 보았다고 했지만 시체는 엎드려 있었다. 덕만이 그 모순을 깨달았을 때, 증언을 믿고 물린 호위는 이미 그녀의 목에 칼을 대고 있었다."
  go_20_correct_accusation:
    actions:
      - gameOver:
          title: "운명 20 — 증거 없는 정답"
          message: "아진은 진범이었다. 그러나 체포 명령이 떨어지기 전 독을 삼켰고, 남은 것은 공주가 고문으로 무고한 이를 죽였다는 소문뿐이었다. 정답은 다시 죄가 되었다."
  go_21_friendless_truth:
    actions:
      - gameOver:
          title: "운명 21 — 친구 없는 진실"
          message: "소원은 고문 끝에 원하는 자백을 했다. 덕만은 살인 혐의를 벗었지만, 마지막까지 곁을 지키던 사람을 잃었다. 훗날 반란의 밤, 그녀를 깨워 줄 사람은 없었다."
