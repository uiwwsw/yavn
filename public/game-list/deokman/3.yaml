script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: wide
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: action
          text: 빈집의 곡식독을 연다. 바닥을 긁자 쥐똥만 구른다. 장부에는 어제 배급했다고 적혔다. 이 집 사람은 뭘 먹었지?
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비가 오면 자국이 지워집니다. 병사 스무 명이면 해 뜨기 전 창고 셋을 칠 수 있고요."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "문부터 부수면 하수인만 잡혀. 밤에 움직인 수레부터 찾자. 비 오기 전에."
      - choice:
          key: c4_investigation
          prompt: "비가 오기 전에 무엇부터 확인할까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "마을 사람들에게 수레 길을 묻는다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "바퀴 폭을 재고 야간 통행표를 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "유신의 기병으로 세 창고를 봉쇄한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: action
          text: 바퀴 자국 옆에 통행표를 놓는다. 폭이 맞는다. 멀리 수레가 멎고, 왕실 덮개 위로 귀족 문장이 씌워진다.
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "맞습니다. 장부는 고쳐도 수레 폭은 못 바꿉니다. 왕실 수레가 산 위로 갔습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "아이들은 밤마다 수레 소리가 멎는 집을 말했습니다. 산등성이에서 연기가 나자 노파 하나가 덕만을 빈 돼지우리로 끌었습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "우리 질문이 먼저 샜어. 저 집으로 바로 올라가면 안 돼."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "노파가 뒷길을 압니다. 호위는 줄이겠습니다. 마을 사람들 얼굴부터 가리십시오."
      - say:
          channel: "narration"
          text: "빈 창고가 타는 동안 두 사람은 노파의 지팡이 뒤를 따랐습니다. 진짜 창고에 닿았을 때 장부의 첫 장은 이미 불에 탔습니다."
      - add:
          evidence: -1
      - say:
          channel: thought
          text: 노파가 길은 열어 줬어. 타 버린 첫 장의 이름은 끝내 못 읽었다. 남은 장부터 지키자.
      - goto: "hidden_warehouse"

  surround_warehouse:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "기병이 세 창고의 길을 막았습니다. 빈 창고 두 곳에서 불이 났지만 유신은 말머리를 돌리지 않았습니다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "불을 끄면 포위가 뚫립니다. 남은 문에서만 수레가 안 나옵니다."
      - say:
          char: "덕만.princess_angry"
          camera: "medium"
          with:
            - "유신"
          text: "그 문을 지켜. 마을 우물은 내주고, 병사들은 담 밖에서 기다려."
      - say:
          channel: "narration"
          text: "진짜 창고의 빗장이 열렸습니다. 장부는 남았지만 불탄 빈 창고를 지켜보던 주민들은 왕실 깃발에 등을 돌렸습니다."
      - add:
          people_support: -2
      - say:
          channel: thought
          text: 장부는 손에 있다. 불탄 집 앞의 사람은 내 깃발을 보고 문을 닫았다. 돌아와서 이 문도 두드려야 해.
      - goto: "hidden_warehouse"

  hidden_warehouse:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: fadeIn, layout: push, duration: 420 } }
      - say:
          camera: wide
          channel: action
          text: 문틈을 밀자 기름 냄새가 훅 끼친다. 곡식은 어디 있지? 갑옷 더미에서 누군가 내 쪽으로 장부를 흔든다.
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "쌀 한 섬에 창 세 자루. 이름은 지우고 값은 꼼꼼히 적었군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "누구지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담입니다. 칼로 먹고사는데… 오늘 보니 장부가 더 잘 죽이더군요."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char:
          id: "유신"
          position: "right"
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "비는 들이치고 밖에선 문을 밉니다. 내일이면 쌀도 장부도 못 씁니다. 지금 정하십시오."
      - choice:
          key: "c4_grain_policy"
          prompt: "굶은 사람들이 창고 문을 밉니다. 무엇부터 내놓을까요?"
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          options:
            - text: "장부를 벽에 붙이고 마을에 열쇠를 준다"
              set:
                grain_policy: "public_distribution"
              add:
                people_support: 3
                nobles_support: -1
                insight: 1
              goto: "public_distribution"
            - text: "왕실 깃발 아래 줄을 세워 배급한다"
              set:
                grain_policy: "royal_relief"
              add:
                king_trust: 1
                nobles_support: 1
                people_support: 1
              goto: "royal_relief"
            - text: "장부를 덮고 귀족에게 군량을 뜯어낸다"
              set:
                grain_policy: "bargain"
              add:
                army_support: 2
                evidence: 1
                fear: 1
              goto: "grain_bargain"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_ledger"

  public_distribution:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: action
          text: 자루에 집 이름을 쓴다. 숯이 부러질 때쯤에도 줄은 남아 있다. 할머니가 내 손에서 숯을 받아 자기 집 이름을 덧쓴다.
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "오늘 쌀을 센 사람들이 내일은 왕실 장부도 보자 할 겁니다. 그때도 여실 겁니까?"
      - say:
          char: 덕만
          text: "열어야지. 귀찮다고 닫으면 또 쌀부터 사라질 테니까."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "왕실 북이 울리자 줄이 빠르게 정리됐습니다. 유신은 따로 올린 그릇을 멈추고 모든 죽을 같은 솥에서 뜨게 했습니다."
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "오늘 안에 배급은 끝납니다. 다만 관리가 이름을 빠뜨린 집이 있습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "그 집은 내가 찾아갈게. 배급은 계속하고, 빠진 이름은 따로 남겨."
      - say:
          channel: "narration"
          text: "왕실 깃발 아래 자루가 빠르게 줄었습니다. 장터 끝의 세 집은 해가 진 뒤에야 자기 몫을 받았습니다."
      - add:
          people_support: -1
      - say:
          channel: thought
          text: 솥은 빨리 비었는데, 끝집 할머니는 해가 진 뒤에야 왔어. 이름을 불렀다는 관리의 말만 믿어도 될까?
      - goto: "convoy_attack"

  grain_bargain:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "장부가 상자에 잠기자 군량 수레가 나왔습니다. 비담은 내민 축하주를 두고 봉인된 자루 하나를 직접 찢었습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "비담"
          text: "잔은 됐어. 자루 밑까지 세고 나서 문을 열어."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "군량은 맞습니다. 대신 저 가문의 이름을 제가 감춰 드리게 됐군요."
      - say:
          channel: "narration"
          text: "병사들의 솥에서 김이 올랐습니다. 창고 앞 노파는 도둑의 이름을 묻다 빈 손으로 돌아갔습니다."
      - add:
          people_support: -3
          bidam_trust: 1
      - say:
          channel: thought
          text: 군사들은 먹었다. 노파가 물었던 도둑의 이름은 내가 상자에 가뒀다. 내일 그 사람 얼굴을 어떻게 보지.
      - goto: "convoy_attack"

  convoy_attack:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: action
          text: 수레 앞에서 바위가 떨어진다. 뒤에서도 같은 소리. 절벽 위 횃불이 장부 상자를 따라 움직인다.
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "정면은 뚫습니다. 대신 뒤 수레가 탑니다. 적을 잡을지, 곡식을 보낼지 명령하십시오."
      - choice:
          key: c4_convoy
          prompt: "불화살이 장부와 마을 몫을 함께 노립니다. 무엇부터 지킬까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "자루를 벽으로 쌓고 비를 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: bad_grain_wall
            - text: "유신 옆에서 정면을 뚫는다"
              goto: bad_charge
            - text: "빈 수레를 미끼로 매복 주인을 끌어낸다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: bait_ambush

  bait_ambush:
    actions:
      - say:
          channel: action
          text: 빈 수레를 민다. 화살이 쏟아진다. 불빛에 드러난 궁수를 향해 손을 뻗는다. “저기!” 유신의 말이 비탈을 꺾는다.
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "매복한 자들은 봤습니다. 대신 빈 수레 둘을 버렸습니다. 그것도 보고에 적겠습니다."
      - goto: convoy_saved

  convoy_saved:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: medium
          channel: action
          text: 돌길의 진동이 발바닥에 닿는다. 돌아왔구나. 아이 하나가 찢어진 자루 밑에서 쌀알을 줍는다. 나도 허리를 굽힌다.
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "오늘은 뒤 수레를 먼저 보셨습니다. 좋은 명령이었습니다."
      - say:
          char: 덕만
          text: "다음엔 내가 놓친 사람부터 말해 줘. 공주 앞에서 입 다무는 장수는 필요 없어."
      - say:
          channel: thought
          text: 자루 안쪽에 당의 낙인이 있다. 사흘 뒤 모란 연회라니… 이 쌀을 훔친 자와 내게 해명을 요구하는 자가 이어져 있을까?
          with: []
          camera: wide
          continueLabel: 그을린 장부를 들고 연회장으로 간다
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "아이들 쌀을 창으로 바꾼 손이 당 사신과도 잔을 들었어. 이 장부를 들고 만나러 가자."
      - goto: /4.yaml

  bad_grain_wall:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "자루는 화살을 막아도 불은 못 막습니다. 비가 오기 전에 기름이 스며들면 곡식 전체가 장작이 됩니다."
      - say:
          char: 덕만.princess_angry
          text: "움직이면 뒤 수레가 맞아. 젖은 천을 덮고 조금만 버틴다."
      - say:
          channel: narration
          text: "첫 빗방울보다 불화살이 빨랐습니다. 쌓아 올린 자루는 사람을 가린 벽에서 협곡을 막는 불더미로 바뀌었고, 연기 속 군사들은 서로의 위치도 찾지 못했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 곡식 전량 소실. 덕만 공주와 호위 병력, 협곡 화재로 사망."
      - gameOver:
          title: "운명 — 곡식으로 쌓은 장작"
          message: "지켜야 할 곡식을 방벽으로 쓰자 불화살 한 발이 퇴로 전체를 태웠습니다. 비를 기다린 덕만과 유신은 불붙은 자루 사이에서 빠져나오지 못했습니다."
          recoverToChoice: c4_convoy

  bad_charge:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "곡식을 미끼로 던지든 정면을 뚫든, 저 불화살부터 우리 쪽으로 돌린다."
      - say:
          char: 유신.angry
          text: "수레가 움직이면 피할 벽도 사라집니다. 한 번 시작하면 사람과 곡식을 따로 빼낼 수 없습니다."
      - say:
          channel: narration
          text: "선두가 협곡으로 돌진하자 숨어 있던 궁수들이 일제히 몸을 드러냈습니다. 두 번째 불화살은 사람과 장부가 실린 뒤 수레에 꽂혔고, 너무 깊이 들어온 선두는 불붙은 퇴로 앞에서 멈췄습니다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "전술로 적을 끌어낼 수는 있었지만 협곡 전체를 전장으로 만들면 곡식과 사람도 미끼가 됩니다. 덕만과 유신은 불길 속에서 전사했고 구휼 장부도 함께 탔습니다."

  evidence_ledger:
    actions:
      - sticker:
          id: desk_0
          image: grain_ledger_sticker
          x: 27
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - sticker:
          id: desk_1
          image: market_seal_sticker
          x: 73
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - say:
          channel: action
          text: 장부와 운송표를 내 앞으로 당긴다. 종이에서 곡식 먼지가 떨어진다. 어느 줄부터 봐야 하지?
          with: []
          camera: wide
      - goto: evidence_ledger_compare

  evidence_ledger_compare:
    actions:
      - choice:
          key: evidence_ledger_look
          presentation: explore
          prompt: 손에 닿는 흔적부터. 어느 쪽을 더 살펴볼까?
          camera: wide
          with: []
          options:
            - text: 장부의 출발 칸
              at:
                x: 27
                "y": 75
              goto: evidence_ledger_detail_0
            - text: 운송표의 도착 칸
              at:
                x: 73
                "y": 75
              goto: evidence_ledger_detail_1
            - text: 살펴본 두 흔적을 대조한다
              when:
                all:
                  - var: evidence_ledger_seen_0
                    op: eq
                    value: true
                  - var: evidence_ledger_seen_1
                    op: eq
                    value: true
              goto: evidence_ledger_deduce
            - text: 물건을 챙기고 돌아간다
              goto: evidence_ledger_return


  evidence_ledger_retry:
    actions:
      - say:
          channel: thought
          text: 도장이 크다고 곡식이 늘지는 않아. 읽은 두 칸의 자루 수부터 비교하자. 이름은 그다음이다.
          with: []
          camera: wide
      - goto: evidence_ledger_compare

  evidence_ledger_solved:
    actions:
      - set:
          grain_verified: true
      - say:
          char: "덕만"
          text: "사라진 건 세 자루야. 이름을 추측하지 말고 이 수량부터 마을에 확인받자. 장부를 열든 거래하든 이 몫은 기억해."
      - goto: "evidence_ledger_return"


  evidence_ledger_return:
    actions:
      - clearSticker:
          id: "desk_0"
          leave: "fadeOut"
      - clearSticker:
          id: "desk_1"
          leave: "fadeOut"
      - goto: "grain_decision"

  evidence_ledger_deduce:
    actions:
      - choice:
          key: evidence_ledger
          prompt: 장부에서 빠져나간 곡식은 어떻게 찾을까요?
          camera: wide
          options:
            - text: 출발 여섯 자루와 도착 세 자루를 대조한다
              goto: evidence_ledger_solved
            - text: 가장 큰 붉은 도장만 범인으로 지목한다
              goto: evidence_ledger_retry
            - text: 지워진 이름을 짐작해 채운다
              goto: evidence_ledger_retry
            - text: 판단을 미루고 돌아간다
              goto: evidence_ledger_return
          with: []

  evidence_ledger_detail_0:
    actions:
      - say:
          channel: action
          text: 출발 칸에 자루 표시 여섯 개. 먹이 번진 마지막 표시를 손톱으로 가리지 않고 다시 센다. 여섯이 맞다.
          with: []
          camera: wide
      - set:
          evidence_ledger_seen_0: true
      - goto: evidence_ledger_compare

  evidence_ledger_detail_1:
    actions:
      - say:
          channel: action
          text: 같은 날짜의 도착 칸은 셋. 붉은 도장 아래에도 다른 자루 표시는 없다. 출발 칸으로 시선이 돌아간다.
          with: []
          camera: wide
      - set:
          evidence_ledger_seen_1: true
      - goto: evidence_ledger_compare
