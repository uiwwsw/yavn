          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          text: "화백 앞에 선 칠숙은 시체를 처음 발견했을 때 본 것을 차분하게 증언했습니다."
      - say:
          char: 칠숙
