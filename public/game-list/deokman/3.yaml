script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: pulse
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          wait: 800
          text: "제3장 — 잠긴 기록방"
      - say:
          delivery: calm
          text: "631년 늦여름, 같은 날 밤이었습니다."
      - say:
          with: [덕만, 아진]
          text: "기록방 문 아래의 피는 천천히 넓어졌고, 방 안에서는 손톱으로 마루를 긁는 소리가 났습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "문을 연 사람은 따로 있습니다. 저는 복도 끝에서 그 사람이 나오는 것만 봤습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "얼굴은 봤습니까?"
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "천으로 가렸습니다. 칠숙공의 호위가 차는 붉은 매듭만 보였습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "그 말을 나중에도 할 수 있게 살아 있으세요. 열쇠는 어디 있습니까?"
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "제게 있습니다. 문서를 가져오라며 받은 열쇠입니다."
      - say:
          with: [덕만, 아진]
          text: "아진이 열쇠를 넣었지만, 안쪽에서 부러진 칼날이 문틈을 막고 있었습니다."
      - choice:
          key: c3_room
          prompt: "방 안의 숨소리가 약해집니다. 무엇부터 하겠습니까?"
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "문을 깨고 사람을 꺼낸다"
              add: { power: 1, people_support: 1 }
              goto: room_break
            - text: "월명을 부르며 문을 연다"
              add: { insight: 1, ajin_trust: 1 }
              goto: room_physician
            - text: "달아난 호위를 쫓는다"
              goto: go_16_last_breath
            - text: "피 묻은 문서를 태운다"
              goto: go_17_burning_proof

  room_break:
    actions:
      - bg: locked_room
      - camera: medium
      - effect: impact
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          with: [덕만, 아진]
          text: "덕만과 아진이 함께 문을 밀자 부러진 칼날이 튀며 문이 열렸습니다."
      - say:
          with: [덕만, 아진]
          text: "기록관은 책상 아래에 쓰러져 있었고, 한 손으로 찢긴 종이를 가슴에 누르고 있었습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진, 상처를 눌러 주세요. 저는 월명을 부르겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "저에게 등을 보이셔도 됩니까?"
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "지금 그 손은 칼이 아니라 상처를 막고 있습니다."
      - goto: recordkeepers_words

  room_physician:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - char: { id: 아진, position: center }
      - say:
          with: [덕만, 월명, 아진]
          text: "월명이 도착하자 아진은 문틈의 칼날을 맨손으로 잡아 뺐습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "이 문을 제가 열었어야 했습니다. 명령을 버릴지 망설이는 동안 늦었습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만, 아진]
          text: "후회는 나중에 하십시오. 지금은 등잔을 가까이 들고 피를 막아야 합니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "들었죠? 살아 있는 사람부터 돕습니다."
      - goto: recordkeepers_words

  recordkeepers_words:
    actions:
      - bg: locked_room
      - camera: close
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - say:
          char: 월명.sad
          camera: close
          with: [덕만]
          text: "칼이 깊이 들어갔습니다. 오래 붙잡을 수 없습니다. 묻고 싶은 말이 있으면 짧게 물으십시오."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "이름부터 듣겠습니다. 기록에 남겨야 합니다."
      - say:
          with: [덕만, 월명]
          wait: 650
          text: "기록관의 입술이 겨우 움직였습니다. 덕만은 들릴 듯 말 듯 한 이름, ‘무진’을 문서 조각 위에 적었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "무진, 이제 누가 문서를 가져갔는지 알려 주세요."
      - say:
          with: [덕만, 월명]
          wait: 800
          text: "무진은 말 대신 떨리는 손으로 북쪽을 가리킨 뒤, 가슴의 문서 조각을 덕만에게 밀었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "북쪽 운송 거점입니까? 원본 곡식 장부도 그곳에 있습니까?"
      - say:
          with: [덕만, 월명]
          text: "무진은 한 번 눈을 감았다 떴습니다. 그리고 아진을 가리킨 뒤 고개를 가로저었습니다."
      - char: { id: 아진, position: right }
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제가 찌른 사람이 아니라는 뜻입니다. 저를 살려 증언하게 하려는 겁니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [아진]
          text: "들었습니다. 그 뜻을 제가 기록하겠습니다."
      - effect: { name: darken, wait: true }
      - say:
          with: [덕만, 아진]
          wait: 900
          text: "무진은 덕만이 자기 이름과 증언을 함께 봉하는 모습을 확인한 뒤 숨을 거두었습니다."
      - goto: mujin_after

  mujin_after:
    actions:
      - bg: moon_court
      - camera: medium
      - effect: moonveil
      - char: { id: 덕만, position: center }
      - char: { id: 아진, position: left }
      - char: { id: 소원, position: right }
      - say:
          delivery: calm
          text: "기록방 밖 뜰에는 아직 새벽빛이 들지 않았습니다. 소원은 깨끗한 천과 빈 유품 상자를 가져왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "이름을 적은 종이는 얼굴 가까이에 둘까요? 나중에 가족이 찾으러 오면 먼저 볼 수 있게요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "그래. 무진이 지킨 문서는 증거 상자에, 무진의 이름은 사람에게 돌려보낼 상자에 넣어."
      - say:
          with: [덕만, 아진, 소원]
          text: "아진은 우물물로 손을 씻었습니다. 손바닥의 먹과 붉은 얼룩은 지워졌지만 손가락은 계속 떨렸습니다."
      - say:
          char: 소원.nervous
          camera: close
          with: [아진]
          text: "더 문지르면 살만 벗겨져요. 깨끗해지는 건 재판에서 할 말을 다 한 뒤예요."
      - say:
          char: 아진.nervous
          camera: close
          with: [소원]
          text: "저를 위로하지 마십시오. 제가 열쇠를 나르지 않았다면 이 문도 열리지 않았습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "위로가 아닙니다. 하지 않은 살인으로 손을 망가뜨리면, 한 일을 증언할 사람까지 잃습니다."
      - say:
          with: [덕만, 아진, 소원]
          text: "유품 상자에는 부러진 갈대붓과 작은 열쇠, 먹이 밴 소매끈 하나가 놓였습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "소매끈 안쪽에 짧은 선이 세 개 있어요. 장식으로 묶은 매듭은 아니에요."
      - say:
          char: 아진
          camera: close
          with: [소원]
          text: "북쪽 운송 거점의 셋째 창고 표시입니다. 제가 명령서를 나를 때 같은 표식을 봤습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "무진의 마지막 손짓, 소매끈의 표식, 아진의 기억을 세 줄로 나눠 적으세요. 서로 대신 증명하게 하지 않습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제 기억이 다른 증거와 어긋나면 어떻게 하시겠습니까?"
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "어긋난 자리도 지우지 않습니다. 이제 아진이 직접 한 일부터 처음 순서대로 말해 주세요."
      - say:
          with: [덕만, 아진, 소원]
          wait: 700
          text: "소원은 유품 상자의 뚜껑을 닫았고, 아진은 칼과 기록방 열쇠를 그 옆에 내려놓았습니다."
      - goto: ajin_confession

  ajin_confession:
    actions:
      - bg: moon_court
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          delivery: calm
          text: "날이 밝기 직전, 아진은 칼과 기록방 열쇠를 덕만 앞에 내려놓았습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "저는 인장을 나르고 기록방 열쇠를 받았습니다. 죽은 관리가 다칠 줄 알면서도 멈추지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진이 하지 않은 살인까지 짊어지지는 마세요. 대신 한 일은 숨기지 마십시오."
      - say:
          char: 아진.angry
          camera: close
          with: [덕만]
          text: "동생을 살리려면 무엇이든 해야 했습니다. 그 말을 핑계로 쓰고 싶지는 않습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "그러면 살아서 죄를 받고, 명령한 사람의 죄도 밝혀 주세요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제 동생은 북쪽 운송 거점에 끌려갔습니다. 제가 증언하면 먼저 죽일 겁니다."
      - choice:
          key: c3_ajin
          prompt: "아진의 증언과 인질을 어떻게 지키겠습니까?"
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "왕실 보호 아래 증언시킨다"
              add: { legitimacy: 1, ajin_trust: 2 }
              goto: ajin_protected
            - text: "북쪽 길의 안내를 맡긴다"
              add: { insight: 1, ajin_trust: 1 }
              goto: ajin_guide
            - text: "아진을 미끼로 내세운다"
              goto: go_18_cut_signal
            - text: "재판 없이 처형한다"
              goto: go_19_dead_testimony

  ajin_protected:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - char: { id: 아진, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [유신, 아진]
          text: "아진을 왕실 보호 아래 두고, 그가 한 일과 하지 않은 일을 따로 적으세요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "호위 둘을 붙이고 증언문은 세 벌로 나누겠습니다. 한 장이 사라져도 말이 남습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "동생을 구하기 전까지는 감옥도 달게 받겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "감옥이 아니라 증언할 자리입니다. 도망치면 그때 죄를 더 묻겠습니다."
      - goto: oath_revealed

  ajin_guide:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "북쪽 수레는 큰길을 쓰지 않습니다. 마른 개울을 따라 옛 초소로 갑니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진은 안내하고, 유신이 앞길을 확인합니다. 혼자 인질을 찾으러 가지 마세요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제 말을 믿으십니까?"
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "믿음은 길에서 확인하겠습니다. 그래도 말할 기회는 지금 드립니다."
      - goto: oath_revealed

  oath_revealed:
    actions:
      - bg: locked_room
      - camera: medium
      - effect: { name: focus, wait: true }
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "기록관이 지킨 문서 조각에는 혼인 합의서보다 오래된 약속이 남아 있었습니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "‘다음 왕은 남자 왕족으로 세우며, 장수와 창고지기는 서명한 집들이 정한다.’"
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "진운을 왕으로 세우려는 이유가 남자라서만은 아니었군요. 자기 명령을 들을 왕이 필요했던 겁니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "왕관은 진운에게, 열쇠는 자신들이 갖겠다는 약속입니다."
      - get: oath_fragment
      - set: { clue_oath_fragment: true }
      - add: { legitimacy: 1, insight: 1 }
      - goto: morning_council

  morning_council:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          delivery: calm
          text: "아침이 밝자 북쪽 성에서 봉화와 함께 긴급 보고가 도착했습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "구휼 곡식이 끊겨 병사와 백성이 서로 창고를 차지하려 합니다. 왕실의 누군가가 직접 가야 합니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "원본 장부와 아진의 동생도 그 길에 있습니다. 저를 수도에서 떼어 놓으려는 제안이군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "위험한 곳에서 공주의 능력을 증명할 기회입니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "국경을 상이라 부르지 마라. 굶는 사람과 지친 군사가 있는 곳이다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "덕만, 네가 간다. 군사와 창고를 함께 맡긴다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "저를 보내려는 칠숙의 뜻까지 아시면서 명하십니까?"
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "안다. 그래서 놈이 고른 길에 내 명령을 실어 보낸다."
      - choice:
          key: c3_command
          prompt: "북쪽으로 가져갈 왕명을 어떻게 받겠습니까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "군사와 창고를 함께 맡는다"
              add: { power: 2, legitimacy: 1 }
              goto: command_full
            - text: "유신과 권한을 나눈다"
              add: { yushin_trust: 1, army_support: 1 }
              goto: command_shared
            - text: "군사만 데려간다"
              goto: go_20_hungry_soldiers
            - text: "장부 공개를 왕명에 넣는다"
              add: { insight: 1, people_support: 1 }
              goto: command_ledger

  command_full:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "군량을 풀 권한과 병사를 움직일 책임을 함께 받겠습니다. 한쪽만 쥐고 다른 쪽 탓을 하지 않겠습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "좋다. 살린 사람과 잃은 것을 모두 같은 장부에 남겨라."
      - goto: chapter3_end

  command_shared:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "저는 곡식과 마을을 맡고, 유신은 성과 군사를 맡아 주세요. 결정은 서로 들은 뒤 내립니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "의견이 다르면 손실부터 말씀드리겠습니다. 마지막 명령은 공주님이 내리십시오."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "반대까지 듣고 제가 책임지겠습니다."
      - goto: chapter3_end

  command_ledger:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "곡식을 받은 사람과 내준 사람의 이름을 성문에 공개하겠습니다. 그 조항을 왕명에 넣어 주십시오."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "넣어라. 왕실 몫도 숨기지 마라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "제 몫부터 적겠습니다."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - bg: throne_hall
      - camera: medium
      - effect: focus
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          with: [진평왕, 덕만]
          text: "진평왕은 칠숙이 준비한 군사 명령서에서 빈 줄을 찾아 붉은 먹으로 글을 더했습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          wait: 900
          unskippable: true
          text: "<speed=18>이것은 네 자격을 시험하는 길이 아니다. 내 명령이 닿지 않은 곳을 바로잡는 일이다.</speed>"
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "군사와 창고를 함께 맡긴다. 결과는 네 이름으로 보고하라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "전하의 명령으로 가되, 제 판단의 결과는 제 이름으로 남기겠습니다."
      - say:
          with: [진평왕, 덕만]
          wait: 750
          text: "왕의 붉은 글 아래에는 곡식길을 되찾고 원본 장부와 인질을 함께 데려오라는 명령이 남았습니다."

  go_16_last_breath:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 피 묻은 발자국을 따라 복도 끝까지 달렸습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "담장 밖으로 말 한 필이 나갔습니다. 지금 쫓으면 잡을 수 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "끝까지 쫓습니다."
      - effect: darken
      - say:
          text: "범인은 빈 말을 버리고 사라졌습니다. 덕만이 돌아왔을 때 기록관의 숨도 문서 조각도 남지 않았습니다."
      - gameOver:
          title: "운명 16 — 돌아오지 않은 숨"
          message: "얼굴 없는 범인을 쫓는 동안 마지막 증인은 숨을 거두었고, 원본이 향한 길도 함께 사라졌습니다."

  go_17_burning_proof:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 덕만.sad
          camera: medium
          with: [아진]
          text: "피가 묻은 문서가 아진의 죄를 확정할 수 있습니다. 먼저 없애겠습니다."
      - say:
          char: 아진.angry
          camera: close
          with: [덕만]
          text: "제가 한 일을 지우면 명령한 사람의 흔적도 지워집니다."
      - effect: embers
      - say:
          text: "불길 속에서 계승 맹약의 도장과 북쪽 운송 거점의 이름이 함께 검게 말렸습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [아진]
          text: "사람을 살리려다 그 사람의 증언까지 태웠구나."
      - gameOver:
          title: "운명 17 — 재가 된 증언"
          message: "아진을 감싸려 태운 종이에는 그를 강요한 자의 도장도 있었습니다. 남은 것은 덕만의 은폐뿐이었습니다."

  go_18_cut_signal:
    actions:
      - bg: moon_court
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "명령을 따르는 척 북쪽 사람들을 불러내세요. 유신이 숨어 기다릴 겁니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "신호를 보내면 동생을 먼저 죽일 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "우리가 더 빨리 움직이면 됩니다."
      - effect: impact
      - say:
          text: "아진이 첫 신호를 올리자 멀리서 잘린 붉은 매듭과 동생의 피 묻은 소매가 날아왔습니다."
      - gameOver:
          title: "운명 18 — 먼저 끊긴 신호"
          message: "인질을 잡은 자들은 덕만의 매복보다 먼저 움직였습니다. 아진은 동생의 죽음을 본 뒤 증언을 거부했습니다."

  go_19_dead_testimony:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 덕만.angry
          camera: medium
          with: [아진]
          text: "왕의 인장을 옮기고 사람을 죽게 했습니다. 여기서 죄를 묻겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제가 죽으면 명령한 사람은 제 이름 뒤에 숨습니다."
      - effect: darken
      - say:
          text: "아진이 처형된 다음 날, 칠숙은 모든 문서 위조와 살인을 죽은 아진 한 사람의 짓으로 발표했습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "죄를 빨리 물으려다 더 큰 죄의 입을 닫아 버렸구나."
      - gameOver:
          title: "운명 19 — 죽은 사람의 죄"
          message: "아진이 죽자 살아 있는 권력자들은 모든 죄를 그에게 넘겼고, 덕만은 반박할 증언을 잃었습니다."

  go_20_hungry_soldiers:
    actions:
      - bg: fortress
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 군사를 움직일 권한만 받고 북쪽 성에 도착했습니다."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "창고지기가 왕실 도장이 없다며 곡식을 내주지 않습니다. 병사들은 이틀째 굶었습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "군사에게 명령할 수는 있는데 먹일 수는 없군요."
      - effect: pulse
      - say:
          text: "그날 밤 굶주린 병사들이 창고를 부쉈고, 성 안의 백성도 곡식 자루를 두고 칼을 들었습니다."
      - gameOver:
          title: "운명 20 — 먹이지 못한 명령"
          message: "군사권과 곡식 권한을 나누어 받은 결과, 덕만의 첫 명령은 굶주린 병사들의 폭동으로 끝났습니다."
