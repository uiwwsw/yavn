script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: locked_room
      - camera: wide
      - effect: focus
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "제3장 — 한 사람만 거짓말한다"
      - say:
          with:
            - 덕만
            - 소원
          delivery: calm
          text: "같은 밤 · 해가 진 지 얼마 안 된 때. 문 아래 핏자국은 아직 넓어지고 있었고, 야간 교대 종은 두 번 더 울리기 전이었습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
            - 소원
          text: "피가 아직 따뜻해요. 하지만 빗장은 안에서 걸렸고, 안쪽에서는 숨소리도 안 들려요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "뒤로 물러서. 내가 문을 부술게."
      - effect: impact
      - say:
          with:
            - 덕만
            - 소원
          text: "두 번째 어깨로 밀자 안쪽 빗장이 부러졌고 죽은 남자가 문밖으로 쓰러졌습니다. 손에는 덕만의 옷고름이 감겨 있었고, 손가락에는 혼인 합의서 원본과 같은 먹물이 묻어 있었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 소원
          text: "비담에게 합의서 원본을 넘긴 왕실 문서 담당자야. 오늘 만나면 이름부터 묻겠다고 했는데…… 누군가 그보다 먼저 내 옷고름을 쥐여 줬어."
      - say:
          char: 소원.nervous
          camera: close
          with:
            - 덕만
          text: "이 옷고름은 어제 제가 새로 달았어요. 시신이 이걸 쥐고 있으면 사람들은 공주님과 다퉜다고 믿을 거예요."
      - say:
          char: 소원.nervous
          camera: wide
          delivery: nervous
          text: "빗장은 안에서 걸려 있었고 창틀 먼지는 그대로예요. 그런데 문밖 사람들은 똑같은 말만 해요. ‘비명은 못 들었다, 아무도 드나들지 않았다.’"
      - say:
          char: 덕만
          camera: medium
          text: "누가 먼저 그렇게 말했대?"
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "다들 자기가 먼저 말했다고 해요. 그래서 더 이상해요."
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "그럼 사람들 말은 잠깐 잊자. 이 방에서 실제로 움직인 것부터 보자. 시체가 식기 전에."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "이번에도 제 이름이 같이 묻겠네요. 공주님 방에서, 공주님 옷고름을 쥔 시체를, 저와 공주님만 봤으니까요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "그래서 너한테 나가도 된다고 말하려 했어."
      - say:
          char: 소원.angry
          camera: close
          with:
            - 덕만
          text: "말해 보세요. 나가서 칠숙 사람들에게 공주님이 시체와 단둘이 있었다고 아주 크게 외칠 테니까."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "지금 나를 협박하는 거야?"
      - say:
          char: 소원.angry
          camera: medium
          with:
            - 덕만
          text: "잔소리예요. 둘이 본 건 둘이 끝까지 봐야죠. 그러니까 저 떼어 놓을 생각 말고, 뭘 볼지 정하세요."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체가 식기 전, 무엇을 할까?"
          char: 덕만.angry
          camera: close
          with:
            - 소원
          options:
            - text: "모두 불러 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "소원과 흔적을 적는다"
              add:
                sowon_trust: 2
                insight: 1
              goto: body_record

  body_public:
    actions:
      - say:
          char: 덕만
          camera: close
          delivery: shout
          text: "문을 여세요. 들어와서 직접 보십시오. 제가 숨겼다는 말은 그 다음에 들을 테니, 지금 나가는 사람부터 잡으세요."
      - say:
          delivery: nervous
          text: "사람들이 시체를 보려 몰려드는 동안, 맨 뒤에 있던 칠숙의 하인이 한 걸음 물러섰습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          text: "겁이 많은 아이라 그렇습니다. 시체를 보고 물러난 것까지 죄가 되지는 않겠지요."
      - say:
          char: 덕만
          camera: medium
          text: "아직 시체를 보지 않았습니다. 그런데 왜 물러났을까요? 그 아이는 따로 남겨 두세요."
      - goto: testimony_choice

  body_record:
    actions:
      - say:
          char: 소원
          camera: medium
          text: "안쪽 먼지는 그대로인데, 창밖 발판만 손바닥만큼 닦였어요. 누가 밖에서 창을 밀었나 봐요."
      - say:
          char: 덕만
          camera: medium
          text: "그럼 범인은 방 안에 들어오지 않았을 수도 있어. 네가 발견한 순서대로 적어 줘. 나중에 누가 말을 바꿔도 흔적은 안 바뀌게."
      - say:
          char: 소원
          camera: medium
          text: "글씨가 느려도 괜찮죠? 하나도 빼먹고 싶지 않아요."
      - say:
          char: 덕만
          camera: medium
          text: "천천히 써. 오늘은 빠른 대답보다 틀리지 않은 기록이 필요해."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "공주님 손에도 먹물이 묻었어요. 코는 만지지 마세요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "그 말을 조금만 일찍 하지 그랬어."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: council_hall
      - camera: wide
      - effect: focus
      - char:
          id: 덕만
          position: left
      - say:
          with:
            - 덕만
          delivery: calm
          text: "같은 밤 · 새벽 직전. 덕만은 빈 탁자 하나만 놓고 세 사람을 차례로 불렀습니다. 먼저 소원이 창틀 먼지를 종이에 눌러 찍은 자국을 펼쳤습니다."
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "저는 공주님 편이라서 먼지를 고른 게 아니에요. 높은 분도 낮은 사람도 먼지한테는 거짓말을 시킬 수 없으니까요. 누가 밟았는지만 그대로 남아요."
      - char:
          id: 비담
          position: right
      - say:
          with:
            - 비담
          text: "소원이 물러나자 비담은 열쇠 세 개를 같은 줄에 놓았습니다. 마지막 열쇠에만 아직 굳지 않은 밀랍이 묻어 손가락에 달라붙었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          text: "열쇠는 세 벌입니다. 하나는 공주님 것, 하나는 죽은 자의 품, 나머지 하나는 어젯밤 급히 만든 흔적이 남았습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "저를 믿을 필요는 없습니다. 대신 열쇠를 만든 장인은 값을 받은 날짜를 거짓말하지 못합니다. 제가 공주님께 파는 건 믿음이 아니라 확인할 순서니까요."
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 유신
          text: "마지막으로 유신은 젖은 짚신 한 켤레와 여덟 칸으로 묶은 노끈을 내려놓았습니다."
      - say:
          char: 유신
          camera: medium
          text: "창 아래 발자국은 여덟 개입니다. 비에 젖었지만 보폭은 일정합니다. 다친 사람의 걸음은 아닙니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "제 단서대로면 의심되는 사람을 바로 잡아들일 수 있습니다. 솔직히 지금이라도 달려가 잡고 싶습니다. 하지만 틀리면 죄 없는 사람에게 칼을 대게 됩니다. 그래서 숫자만 말씀드리겠습니다."
      - say:
          char: 덕만
          camera: medium
          text: "단서 셋이 서로 다른 사람을 가리키는 것처럼 보여. 하나부터 끝까지 따라가 보자."
      - choice:
          key: c3_testimony
          prompt: "누구의 단서를 믿을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "소원의 먼지"
              add:
                sowon_trust: 1
                insight: 1
              goto: testimony_sowon
            - text: "비담의 열쇠"
              add:
                bidam_trust: 1
                insight: 1
              goto: testimony_bidam
            - text: "유신의 발자국"
              add:
                yushin_trust: 1
                power: 1
              goto: testimony_yushin
            - text: "칠숙의 상처"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          text: "발판에 짚신 앞코만 찍혔어요. 밧줄에 몸을 기대고 창을 민 것 같아요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "직접 들어오지 않고 어떻게 사람을 죽였지?"
      - say:
          char: 소원
          camera: close
          text: "창으로 뭘 건넸을 수도 있어요. 바닥에 약 냄새 나는 실이 떨어져 있었어요."
      - say:
          char: 덕만
          camera: medium
          text: "실로 문빗장을 당겼군. 살인은 방 안에서, 잠금은 방 밖에서 끝낸 거야."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          text: "새 열쇠에는 밀랍이 묻어 있습니다. 공주님 열쇠 모양을 본떠 만든 겁니다."
      - say:
          char: 덕만
          camera: medium
          text: "누가 열쇠를 가져갔는지 알아낼 수 있어?"
      - say:
          char: 비담.smirk
          camera: medium
          text: "공주님 열쇠를 맡았던 나인 셋은 서로를 의심하고 있습니다. 범인은 그중에 없을 겁니다. 너무 잘 보이는 의심은 대개 누가 갖다 놓은 거라서요."
      - say:
          char: 덕만
          camera: medium
          text: "그럼 열쇠를 만든 장인부터 찾아. 누가 밀랍을 가져왔는지 물어보자."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          text: "발자국은 여덟 개, 간격은 모두 두 자 반입니다. 그런데 우리가 의심한 사람 하나는 어젯밤부터 다리를 절었습니다."
      - say:
          char: 덕만
          camera: medium
          text: "다친 척했다는 뜻이군요. 누굽니까?"
      - say:
          char: 유신
          camera: close
          text: "아진입니다. 공주께 들킨 뒤부터 왼쪽 다리를 절었습니다. 하지만 발자국은 양쪽 깊이가 같습니다."
      - say:
          char: 덕만.angry
          camera: medium
          text: "그 사람은 얼굴을 숨겨도 걷는 속도는 못 숨겨. 데려오세요. 다만 아직 체포하지는 마세요."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - say:
          with:
            - 덕만
          delivery: calm
          text: "동틀 무렵. 밤새 불려 다닌 증인들의 그림자가 짧아질 때, 덕만이 부르기도 전에 아진이 문밖에 섰습니다."
      - char:
          id: 아진
          position: right
      - say:
          with:
            - 아진
          text: "아진은 끌려오지 않고 제 발로 문을 열었습니다. 오른손의 붉은 매듭을 풀어 탁자 위에 놓자, 잠긴 방 창밖에서 나온 실밥과 끊어진 자리가 맞아떨어졌습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "문까지 열한 걸음입니다. 공주께서 제 이름을 부르는 순간부터 세었습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 아진
          text: "달아날 생각이었나?"
      - say:
          char: 덕만.angry
          camera: medium
          with:
            - 아진
          text: "아버지 잔에도, 내 방의 시체에도 네 붉은 매듭이 남았어. 너는 칠숙의 칼이야. 그런데 칼을 쥔 손이 누구인지는 아직 증명하지 못했지."
      - say:
          char: 아진.nervous
          camera: medium
          text: "증거가 없으면 달아날 필요도 없습니다. 공주께서는 제가 했다는 것만 아십니다. 왜 했는지는 모르십니다."
      - say:
          char: 아진.nervous
          camera: close
          with:
            - 덕만
          text: "명령한 사람의 이름을 말하면 저보다 먼저 죽는 사람들이 있습니다. 제가 충성해서 입을 다무는 건 아닙니다."
      - say:
          with:
            - 아진
          text: "아진은 품에서 아이의 작은 짚신 한 짝을 꺼냈습니다. 뒤축에는 칠숙의 별채를 뜻하는 검은 먹점이 찍혀 있었습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 덕만
          text: "제 동생이 신던 겁니다. 제가 명령을 거부할 때마다 저쪽에서 한 짝씩 보내옵니다. 이제 남은 건 한 짝뿐입니다."
      - say:
          char: 덕만
          camera: close
          text: "<speed=22>그래서 아직 널 묶지 않았어.</speed> <speed=19>나는 네 동생도 살리고, 너도 살리고 싶어.</speed> <speed=22>누구 명령을 받았는지 말할 기회를 주는 거야.</speed>"
      - choice:
          key: c3_culprit
          prompt: "아진이 눈앞에 있다. 어떻게 할까?"
          char: 덕만
          camera: close
          with:
            - 아진
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "문서를 가져오라 한다"
              add:
                power: 1
                suspicion: 2
              goto: culprit_deal
            - text: "죽은 자가 깼다 속인다"
              add:
                insight: 2
                nobles_support: -1
              goto: culprit_bait
            - text: "소원을 범인으로 몬다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - say:
          char: 아진.angry
          camera: medium
          delivery: neutral
          text: "문서를 가져오면 제 가족이 죽습니다. 다음 명령이 오면 저는 공주를 죽여야 합니다. 그래도 저를 보내시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          text: "가족이 어디 있지?"
      - say:
          char: 아진.angry
          camera: close
          text: "그것까지 말하면 오늘 밤을 못 넘깁니다."
      - say:
          char: 덕만
          camera: medium
          text: "그럼 지금은 말하지 마. 문서만 가져와. 그동안 내가 네 가족부터 찾을게. 너희를 살릴 방법이 있는데도 한 사람만 고르지는 않겠어."
      - say:
          char: 아진.nervous
          camera: medium
          text: "공주를 믿는 게 아니라, 다른 길이 없어서 갑니다."
      - say:
          char: 덕만
          camera: medium
          text: "처음에는 그 정도면 돼. 돌아오면 그 다음을 정하자."
      - add:
          bidam_trust: 1
      - goto: chapter3_end

  culprit_bait:
    actions:
      - effect: focus
      - say:
          delivery: nervous
          text: "덕만은 죽은 귀족이 잠깐 눈을 떴다는 거짓 전갈을 보냈습니다. 한 시간쯤 뒤, 칠숙의 하인이 방으로 돌아와 시체의 입을 확인하다 붙잡혔습니다."
      - say:
          char: 덕만
          camera: medium
          text: "죽은 사람이 무슨 말을 했다고 들었지?"
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          text: "겁먹은 하인이 제멋대로 움직인 모양입니다. 제 사람이라고 모두 제 명령만 듣는 것은 아닙니다."
      - say:
          char: 덕만
          camera: close
          text: "그 말은 하인 앞에서도 해 주세요. 품에서 나온 약속문과 함께 물어보겠습니다."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - get: oath_fragment
      - set:
          clue_oath_fragment: true
      - add:
          legitimacy: 1
      - say:
          delivery: calm
          text: "그날 아침 열린 귀족 회의에서 찢긴 약속문이 맞춰졌습니다. 왕실 남자를 다음 왕으로 세우고, 덕만을 혼인시키거나 수도 밖으로 쫓아내겠다는 내용이 남아 있었습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          text: "살인 누명은 벗으셨군요. 축하드립니다. 이제 전하께서 맡기신 국경으로 떠나셔야겠습니다."
      - say:
          char: 덕만
          camera: medium
          text: "살인범을 잡은 날 바로 수도를 떠나라니, 준비가 빠르시군요."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "국경의 백성이 굶고 있습니다. 공주께서는 사람을 그냥 두지 못하시니, 거절하지 못하실 겁니다."
      - say:
          char: 덕만
          camera: close
          text: "가겠습니다. 대신 제가 그곳에서 누구를 만나고 무엇을 듣는지는 이곳에서 정하지 못할 겁니다."
      - say:
          char: 칠숙.smile
          camera: close
          text: "궁 밖에서는 공주라는 이름도 가볍습니다. 돌아오지 못하셔도 저를 원망하지는 마십시오."
      - say:
          with:
            - 덕만
            - 칠숙
          delivery: calm
          text: "칠숙은 이미 국경 지휘관 패를 준비해 두고 있었습니다. 시종이 덕만 허리에서 수도 출입패를 풀자 칠숙의 입꼬리가 먼저 올라갔습니다. 덕만은 그 짧은 웃음을 보았습니다."

  go_17_second_murder:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "덕만과 소원은 시체를 침상 밑으로 밀어 넣고 바닥의 피를 닦았습니다. 문밖에서는 방을 수색하겠다는 호위의 목소리가 들렸습니다."
      - say:
          char: 소원.nervous
          camera: medium
          text: "피 냄새가 안 없어져요. 침상 휘장에도 묻었어요. 이제라도 문 열고 말해요."
      - say:
          char: 덕만
          camera: medium
          text: "지금 발견되면 설명할 틈도 없어. 먼저 이 사람이 왜 여기 왔는지 알아내야 해."
      - effect: alarm
      - say:
          text: "호위들은 왕의 명령이라며 문을 부쉈습니다. 침상 아래에서는 시체뿐 아니라 피를 닦은 천과 덕만의 손자국이 함께 나왔습니다."
      - say:
          char: 소원.nervous
          camera: close
          with: []
          text: "공주님이 죽인 게 아니라고 제가 말할게요."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "네가 본 건 우리가 시체를 숨긴 일이야. 이제 그 말도 나를 구하지 못해."
      - effect: darken
      - say:
          text: "살인 시각은 덕만이 시체를 발견하기 전이었지만, 진실을 숨긴 행동 때문에 모든 해명이 거짓으로 취급됐습니다."
          wait: 700
      - gameOver:
          title: "운명 17 — 침상 아래의 시체"
          message: "덕만은 살인과 증거 은폐 혐의로 체포되었습니다. 실제 범인은 수사 대상에서 빠졌습니다."
  go_18_borrowed_corpse:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: center
      - say:
          with:
            - 덕만
            - 소원
          text: "덕만과 소원이 시체를 천에 싸서 회랑을 옮겼습니다. 발을 맞추지 못할 때마다 천 아래의 뒤꿈치가 바닥을 긁었고, 멀리서 야간 교대 종이 울렸습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "사람들이 봤어요. 내려놓고 사실대로 말해요. 더 가면 정말 우리가 한 일이 돼요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "여기까지 왔어. 칠숙 방에서 발견되면 적어도 그 사람을 조사할 수 있어."
      - effect: focus
      - say:
          with:
            - 덕만
            - 소원
          text: "모퉁이를 돌자 칠숙의 방문만 활짝 열려 있었습니다. 그 문턱 너머에서 칼집 열둘이 동시에 부딪히는 소리가 났습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
            - 소원
          text: "제 방에 선물을 가져오셨군요. 공주 손에 묻은 피부터 기록하게 하겠습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: []
          text: "처음부터 우리가 여기로 오길 기다렸습니까?"
      - effect: alarm
      - say:
          text: "칠숙은 대답하지 않고 호위에게 체포를 명했습니다. 시체를 옮기는 모습을 본 열두 사람이 차례로 증언했습니다."
          wait: 700
      - gameOver:
          title: "운명 18 — 회랑의 목격자"
          message: "덕만은 시체 유기 현장에서 체포되었습니다. 칠숙의 방은 수색조차 받지 않았습니다."
  go_19_last_witness:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "귀족들 앞에 선 칠숙은 시체를 처음 발견했을 때 본 것을 차분하게 말했습니다."
      - say:
          char: 칠숙
          camera: medium
          text: "제가 방에 들어갔을 때 시체의 등에는 칼자국이 있었습니다. 공주는 그 옆에 서 계셨습니다."
      - say:
          char: 덕만
          camera: medium
          text: "저도 그 상처를 봤습니다. 칠숙공의 증언과 일치합니다."
      - effect: focus
      - say:
          text: "호위들이 칠숙의 증언을 기록하는 동안 소원이 시체를 바로 눕혔습니다. 칼자국은 가슴에 있었고 등에는 상처가 없었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "잠깐. 시체는 엎드려 있었어. 나는 가슴의 상처를 나중에 봤는데…… 칠숙은 어떻게 먼저 알았지?"
      - effect: alarm
      - say:
          char: 칠숙.smile
          camera: medium
          text: "공주께서 방금 제 증언이 맞다고 인정하셨습니다. 이제 말을 바꾸시는 겁니까?"
      - say:
          text: "모순을 설명하기 전에 호위의 칼이 덕만의 목에 닿았습니다. 칠숙의 첫 증언은 이미 열두 명의 서명을 받은 뒤였습니다."
          wait: 700
      - gameOver:
          title: "운명 19 — 뒤집힌 시체"
          message: "덕만은 거짓 증언에 동의한 사람으로 기록됐습니다. 뒤늦게 찾은 모순은 재판에서 받아들여지지 않았습니다."
  go_20_correct_accusation:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          text: "복제 열쇠와 젖은 발자국을 확인한 덕만은 아진을 방으로 불러 호위 앞에 세웠습니다."
      - say:
          char: 덕만.angry
          camera: medium
          text: "아진을 당장 체포해. 새 열쇠와 발자국이 모두 이 사람에게 닿아."
      - say:
          char: 아진
          camera: medium
          text: "증언은 있습니까? 제가 열쇠를 만들거나 이 방에 들어오는 모습을 본 사람 말입니다."
      - say:
          char: 덕만
          camera: medium
          text: "잡아 두면 찾을 수 있어. 그 전에 또 사람을 죽이게 둘 수는 없어."
      - effect: impact
      - say:
          text: "호위가 아진의 팔을 잡는 순간, 아진은 소매 안의 작은 약병을 깨물었습니다. 입가에서 검은 피가 흘렀습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: []
          text: "이제 공주께서 원한 대답은 제 입에서 나오지 않습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "뱉어. 누구 명령인지 말하고 죽어."
      - effect: darken
      - say:
          text: "아진은 이름을 말하지 못하고 죽었습니다. 칠숙은 고문을 피하려 자결한 무고한 호위라는 소문을 먼저 퍼뜨렸습니다."
          wait: 700
      - gameOver:
          title: "운명 20 — 죽어 버린 진범"
          message: "진범은 죽었고 뒤에서 명령한 사람을 밝힐 증거는 남지 않았습니다. 덕만은 죄 없는 사람을 죽음으로 몰았다는 비난을 받았습니다."
  go_21_friendless_truth:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 소원
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "덕만은 재판을 앞두고 자신의 방 열쇠를 맡아 온 소원을 증인석에 세웠습니다."
      - say:
          char: 덕만
          camera: medium
          text: "내 방 열쇠를 맡은 사람은 소원입니다. 심문하면 제가 모르는 출입을 밝혀낼 수 있습니다."
      - say:
          char: 소원.angry
          camera: medium
          text: "제가 아니라는 걸 알면서도 그렇게 말하는 거예요? 공주님이 살려면 제 이름 하나쯤 버려도 돼요?"
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "며칠만 버텨 줘. 진범을 찾으면 내가 직접 꺼내 줄게."
      - say:
          char: 소원
          camera: close
          with: []
          text: "꺼내 준 뒤에는요? 제가 다시 공주님을 믿어야 해요?"
      - effect: darken
      - say:
          text: "심문은 며칠이 아니라 스무 날 이어졌습니다. 소원은 매질을 멈추기 위해 시키는 대로 자백했고, 덕만은 살인 혐의에서 벗어났습니다."
      - say:
          with:
            - 덕만
          text: "몇 해 뒤 반란군이 궁문을 열던 밤, 덕만의 방문 밖에서는 급한 발소리가 한 번 멈췄다가 그대로 멀어졌습니다. 문을 두드려 깨울 사람은 없었습니다."
      - effect: alarm
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "소원아…… 그날 내가 네 말을 들었어야 했어."
          wait: 700
      - gameOver:
          title: "운명 21 — 소원의 자백"
          message: "덕만은 누명을 벗었지만 소원을 잃었습니다. 반란의 밤, 자기 방에서 빠져나오지 못했습니다."
