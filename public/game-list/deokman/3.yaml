          text: "제 방에 선물을 가져오셨군요. 공주 손에 묻은 피부터 기록하게 하겠습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with: []
          text: "처음부터 우리가 여기로 오길 기다렸습니까?"
      - effect: alarm
      - say:
          text: "칠숙은 대답하지 않고 호위에게 체포를 명했습니다. 시체를 옮기는 모습을 본 열두 사람이 차례로 증언했습니다."
