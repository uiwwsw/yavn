script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: locked_room
      - effect: focus
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "제3장 — 한 사람만 거짓말한다"
      - say:
          char: 소원
          framing: full
          delivery: nervous
          text: "빗장은 안쪽, 창틀엔 손자국도 없어요. 밖의 사람들은 똑같이 말해요. 꼭 외워 온 것처럼."
      - say:
          char: 덕만
          framing: bust
          text: "말끝까지 같다면 본 게 아니라 배운 거야. 그 문장을 처음 가르친 사람부터 찾자."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체가 식기 전, 무엇을 할까?"
          char: 덕만
          framing: closeup
          with:
            - 소원
          options:
            - text: "모두 불러 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "국산 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "소원과 흔적을 적는다"
              add:
                sowon_trust: 2
                insight: 1
              goto: body_record

  body_public:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: shout
          text: "모두 들어오세요. 시체도, 피도 숨기지 않겠습니다. 대신 지금 나가는 자를 잡으세요."
      - say:
          text: "시선이 시체에서 문으로 돌아갔다. 맨 뒤에 선 국산의 하인이 뒤꿈치를 반 치 물렸다."
      - goto: testimony_choice

  body_record:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "안쪽 먼지는 그대로인데 바깥만 손바닥 넓이로 닦였어요. 창을 연 사람이 방 안에 없었다는 뜻이에요."
      - say:
          char: 덕만
          framing: bust
          text: "좋아. 사람들 입은 잠시 닫아 두고, 네가 본 먼지부터 기록하자."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: council_hall
      - say:
          text: "소원은 창밖 먼지를, 비담은 복제된 열쇠를, 유신은 젖은 발자국을 내놓았다. 국산만 엎드린 시체 아래의 상처를 보았다고 말했다."
      - choice:
          key: c3_testimony
          prompt: "누구의 단서를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "소원의 먼지"
              add:
                sowon_trust: 1
                insight: 1
              goto: testimony_sowon
            - text: "비담의 열쇠"
              add:
                bidam_trust: 1
                insight: 1
              goto: testimony_bidam
            - text: "유신의 발자국"
              add:
                yushin_trust: 1
                power: 1
              goto: testimony_yushin
            - text: "국산의 상처"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "발판에 짚신 반쪽이 남았어요. 작은 사람이 밧줄에 매달려 창을 열었어요. 시킨 자는 방에도 오지 않았고요."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - say:
          char: 비담
          framing: bust
          text: "잠긴 것은 둘입니다. 하나는 이 문, 하나는 ‘안에서 잠겼다’는 사람들 머릿속. 두 번째 자물쇠가 훨씬 비싸군요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 문은 두고 이야기를 열죠. 열쇠를 본 사람이 아니라, 잠겼다고 먼저 말한 사람부터."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - say:
          char: 유신
          framing: bust
          text: "발자국 간격은 두 자 반으로 일정합니다. 다친 사람의 걸음이 아닙니다. 어젯밤부터 절뚝인 자는 한 명뿐입니다."
      - say:
          char: 덕만
          framing: bust
          text: "아진. 얼굴은 가렸지만 걸음의 길이까지 줄이지는 못했군."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "문에서 여기까지 열한 걸음입니다. 공주께서 저를 부른 순간 도망칠 거리는 사라졌습니다. 그래도 증거는 없습니다."
      - choice:
          key: c3_culprit
          prompt: "아진이 눈앞에 있다. 어떻게 할까?"
          char: 덕만
          framing: closeup
          with:
            - 아진
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "문서를 가져오라 한다"
              add:
                power: 1
                suspicion: 2
              goto: culprit_deal
            - text: "죽은 자가 깼다 속인다"
              add:
                insight: 2
                nobles_support: -1
              goto: culprit_bait
            - text: "소원을 범인으로 몬다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "명령이 떨어지면 저는 공주를 죽입니다. 그런 칼과 거래하시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "그대는 나를 미워해서 죽이는 사람이 아니야. 그렇다면 명령이 오는 길만 끊으면 돼."
      - add:
          bidam_trust: 1
      - goto: chapter3_end

  culprit_bait:
    actions:
      - effect: focus
      - say:
          delivery: nervous
          text: "‘죽은 자가 깨어났다’는 전갈이 닿은 지 반 시진. 국산의 하인이 시체의 입을 다시 막으러 돌아왔다. 품에서는 찢긴 서약서가 떨어졌다."
      - say:
          char: 덕만
          framing: bust
          text: "죽은 입을 두 번 막으러 왔군. 이번에는 산 입으로 누구의 명령인지 말하게 하세요."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - get: oath_fragment
      - set:
          clue_oath_fragment: true
      - add:
          legitimacy: 1
      - say:
          text: "서약서에는 왕실 남자를 후계로 세운다는 계승동맹의 약속이 남아 있었다."
      - say:
          char: 국산
          framing: bust
          text: "결백이 밝혀져 다행입니다. 이제 그 명망으로 국경의 굶주린 백성을 위무해 주시지요."
      - say:
          char: 덕만
          framing: bust
          text: "말은 위무이고 길은 추방이군요. 가겠습니다. 궁 안의 증언은 그대가 바꿔도, 굶주린 사람의 기억까지는 못 바꿀 테니."
      - say:
          text: "제3장 완료 — 덕만은 계승동맹의 증거를 얻는 대신, 왕경을 잃었다."

  go_17_second_murder:
    actions:
      - gameOver:
          title: "운명 17 — 두 번째 살인"
          message: "숨긴 시체는 덕만의 침상 아래에서 발견되었다. 첫 번째 살인은 남의 것이었지만, 진실을 숨긴 두 번째 살인은 덕만의 것이 되었다."
  go_18_borrowed_corpse:
    actions:
      - gameOver:
          title: "운명 18 — 빌린 시체"
          message: "시체를 옮기는 덕만의 모습은 열두 명이 보았다. 국산은 자신의 방에서 발견된 시체보다 공주의 손에 묻은 피를 증거로 삼았다. 함정은 주인만 바꾸어 닫혔다."
  go_19_last_witness:
    actions:
      - gameOver:
          title: "운명 19 — 마지막 증언"
          message: "국산은 상처를 보았다고 했지만 시체는 엎드려 있었다. 덕만이 그 모순을 깨달았을 때, 증언을 믿고 물린 호위는 이미 그녀의 목에 칼을 대고 있었다."
  go_20_correct_accusation:
    actions:
      - gameOver:
          title: "운명 20 — 증거 없는 정답"
          message: "아진은 진범이었다. 그러나 체포 명령이 떨어지기 전 독을 삼켰고, 남은 것은 공주가 고문으로 무고한 이를 죽였다는 소문뿐이었다. 정답은 다시 죄가 되었다."
  go_21_friendless_truth:
    actions:
      - gameOver:
          title: "운명 21 — 친구 없는 진실"
          message: "소원은 고문 끝에 원하는 자백을 했다. 덕만은 살인 혐의를 벗었지만, 마지막까지 곁을 지키던 사람을 잃었다. 훗날 반란의 밤, 그녀를 깨워 줄 사람은 없었다."
