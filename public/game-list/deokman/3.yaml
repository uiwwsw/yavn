script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "제3장 — 잠긴 방의 시체"
      - say:
          text: "같은 밤. 덕만의 방문 아래로 피가 흘렀습니다."
      - say:
          with: [덕만]
          text: "죽은 사람은 덕만에게 혼인 합의서를 건넨 관리였습니다. 누가 그 문서의 출처를 묻지 못하게 입을 막은 것입니다."
      - say:
          with: [덕만, 소원]
          text: "시체가 덕만의 방 안에서 발견되면, 막 벗은 살인 누명은 이번에는 진짜 피와 함께 돌아옵니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "제가 잠갔어요. 열쇠도 여기 있고요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "안에 누구냐!"
      - say:
          text: "대답 대신 문짝이 한 번 울렸습니다."
      - effect: impact
      - say:
          text: "덕만이 문을 부수자 남자가 쓰러졌습니다."
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "혼인 문서를 건넨 관리야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "손에 공주님 옷고름이 있어요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "누가 쥐여 줬어."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "빗장은 안에서 걸렸어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그럼 들어오지 않고 죽인 거야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "이번엔 저도 같이 묻히겠네요."
      - say:
          char: 덕만.sad
          camera: medium
          with: [소원]
          text: "넌 빠져도 돼."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "그 말 한 번만 더 해 보세요."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "둘이 봤으면 둘이 끝까지 봐요."
      - say:
          with: [덕만, 소원]
          text: "문을 열면 결백을 공개적으로 다툴 수 있지만 범인도 현장을 보게 됩니다. 흔적을 먼저 적으면 단서는 지키지만 시체를 숨겼다는 의심을 받습니다."
      - say:
          with: [덕만]
          text: "시체를 감추거나 다른 방으로 옮기는 순간, 덕만은 범인이 만든 이야기를 스스로 완성해 주게 됩니다."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체를 어떻게 할까?"
          char: 덕만
          camera: close
          with: [소원]
          options:
            - text: "문을 열어 공개한다"
              add: { legitimacy: 1 }
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "흔적부터 적는다"
              add: { insight: 1, sowon_trust: 1 }
              goto: body_record

  body_public:
    actions:
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "문을 여세요. 모두 직접 보십시오."
      - say:
          text: "사람들이 몰려들자 하인 하나가 물러섰습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "시체가 무서운 아이입니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "아직 보지도 않았는데요?"
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "저 아이만 남겨 두세요."
      - goto: testimony_choice

  body_record:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "창밖 발판만 닦였어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "밖에서 창을 민 거야."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "본 순서대로 쓸게요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "천천히. 틀리지 않는 게 먼저야."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "코에 먹물 묻었어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그건 조금 빨리 말하지."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          delivery: calm
          text: "새벽 직전. 단서 셋이 탁자에 놓였습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "창밖에 짚신 앞코가 찍혔어요."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "새 열쇠엔 밀랍이 묻었습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "발자국은 여덟 개입니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "걸음 간격도 모두 같습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "하나를 끝까지 따라가죠."
      - say:
          with: [덕만]
          text: "먼지는 범인이 드나든 길을, 밀랍은 열쇠를 훔친 손을, 발자국은 거짓말한 사람을 가리켰습니다."
      - say:
          with: [덕만]
          text: "셋을 한꺼번에 쫓으면 새벽이 끝납니다. 하나를 고르면 나머지 단서는 범인이 먼저 지울 수 있었습니다."
      - choice:
          key: c3_testimony
          prompt: "어느 단서를 좇을까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "창밖 먼지"
              add: { sowon_trust: 1, insight: 1 }
              goto: testimony_sowon
            - text: "복제 열쇠"
              add: { bidam_trust: 1, insight: 1 }
              goto: testimony_bidam
            - text: "젖은 발자국"
              add: { yushin_trust: 1, army_support: 1 }
              goto: testimony_yushin
            - text: "칠숙의 증언"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - char:
          id: 소원
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "발판엔 앞코만 찍혔어요."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "밧줄에 몸을 기댄 거예요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "창으로 독 묻은 실을 건넸군."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "실로 빗장도 당겼고요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "살인은 안에서. 잠금은 밖에서."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "밀랍으로 공주님 열쇠를 찍었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "열쇠를 맡은 나인은 셋입니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "셋이 서로를 너무 잘 의심하더군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "잘 보이는 의심은 미끼다?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "공주님도 제법 나빠지셨군요."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "의심받는 자는 다리를 접니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "발자국은 반듯하고요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "아진이 다친 척한 겁니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "데려오세요. 아직 묶지는 말고요."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          delivery: calm
          text: "동틀 무렵, 아진이 제 발로 찾아왔습니다."
      - say:
          with: [덕만, 아진]
          text: "그가 붉은 매듭을 탁자에 놓았습니다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [아진]
          text: "왕의 잔도, 이 시체도 당신 짓이죠."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "제가 한 일은 아십니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "왜 했는지는 모르시고요."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "칠숙의 명령입니까?"
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "이름을 말하면 가족이 죽습니다."
      - say:
          with: [덕만, 아진]
          text: "아진이 작은 짚신 한 짝을 꺼냈습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "동생이 신던 겁니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "거역할 때마다 한 짝씩 옵니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [아진]
          text: "그래서 아직 묶지 않았어요."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "<speed=19>당신과 동생, 둘 다 살릴 겁니다.</speed>"
      - say:
          with: [덕만, 아진]
          text: "아진은 범인이면서 동시에 가족을 인질로 잡힌 사람이었습니다. 그를 벌하는 일과 명령한 사람을 밝히는 일이 더는 같은 선택이 아니었습니다."
      - say:
          with: [덕만]
          text: "체포하면 오늘의 살인은 끝납니다. 이용하면 명령한 사람에게 닿을 수 있지만, 아진과 그의 가족을 다시 위험 속으로 돌려보내야 합니다."
      - choice:
          key: c3_culprit
          prompt: "아진을 어떻게 움직일까?"
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "명령서를 가져오라 한다"
              add: { bidam_trust: 1 }
              goto: culprit_deal
            - text: "시체가 깼다고 속인다"
              add: { insight: 1, legitimacy: 1 }
              goto: culprit_bait
            - text: "소원에게 죄를 씌운다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - char:
          id: 아진
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 아진.angry
          camera: medium
          with: [덕만]
          text: "명령서를 훔치면 가족이 죽습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "가족은 우리가 먼저 찾죠."
      - say:
          char: 아진.angry
          camera: close
          with: [덕만]
          text: "공주를 믿는 게 아닙니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "처음엔 그 정도면 됩니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "……돌아오면 다음을 정하죠."
      - goto: chapter3_end

  culprit_bait:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "‘죽은 관리가 눈을 떴다.’"
      - say:
          text: "거짓 전갈 뒤, 하인이 시체의 입을 살폈습니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "무슨 말을 했다고 들었지?"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "겁먹은 하인이 멋대로 움직였군요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "그 말, 하인 앞에서도 하세요."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - get: oath_fragment
      - set: { clue_oath_fragment: true }
      - add: { legitimacy: 1 }
      - say:
          text: "아침, 찢긴 약속문이 귀족들 앞에 놓였습니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "남자 왕족을 세우겠다는 약속입니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "누명은 벗으셨군요. 축하드립니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "이제 국경으로 가셔야지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "준비해 둔 추방입니까?"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "그곳 백성이 굶고 있습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주께선 거절 못 하시겠지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "맞습니다. 그래서 갑니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "대신 돌아오는 길은 제가 고르죠."
      - say:
          text: "칠숙은 이미 국경 지휘패를 준비해 뒀습니다."

  go_17_second_murder:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "두 사람은 시체를 침상 밑에 밀어 넣었습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "피 냄새가 안 없어져요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "먼저 이 사람이 왜 왔는지 봐야 해."
      - effect: impact
      - say:
          text: "호위가 문을 부쉈습니다."
      - say:
          text: "침상 아래엔 시체와 피 닦은 천이 있었습니다."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "제가 아니라고 말할게요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "네가 본 건 우리가 숨긴 일이야."
      - effect: darken
      - gameOver:
          title: "운명 17 — 침상 아래"
          message: "덕만은 살인과 증거 은폐 혐의로 붙잡혔습니다."

  go_18_borrowed_corpse:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          text: "두 사람은 시체를 천에 싸서 옮겼습니다."
      - say:
