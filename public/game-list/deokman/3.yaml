script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: village
      - camera: wide
      - say:
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: narration
          text: "서쪽 창고에서 나온 수레는 빈 마을을 세 번 지나고도 멈추지 않았습니다. 덕만이 한 집의 곡식독을 열자 바닥에서 마른 쥐똥만 굴렀습니다. 장부에는 이 집이 어제 쌀을 받았다고 적혀 있었습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "바퀴 자국은 산길에서 끊겼고 비가 남은 흔적도 지웁니다. 스무 명만 주십시오. 해 뜨기 전에 창고 문과 그 안의 사람을 붙잡겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "문부터 부수면 안에 남은 사람만 잡아. 곡식을 빼고 장부를 고친 손은 또 다른 문 뒤로 숨겠지. 비가 지우기 전에 거짓말이 지나온 길부터 잡자."
      - choice:
          key: c4_investigation
          prompt: "새벽비는 바퀴를, 굶주림은 증언을 지운다. 먼저 남길 것은?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "바퀴 폭을 재고 야간 통행표를 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "마을 사람들에게 수레 길을 묻는다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "유신의 기병으로 세 창고를 봉쇄한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: narration
          text: "낮 통행표의 바퀴 폭과 밤 진흙의 자국이 꼭 맞았습니다. 왕실 수레는 해가 지면 귀족 문장이 그려진 덮개만 갈아썼습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "장부 숫자는 밤새 고칠 수 있어도 수레 축 간격은 못 바꿉니다. 이 폭과 진흙 깊이, 왕실 수레가 산 위 창고까지 갔습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - say:
          channel: narration
          text: "노파가 품삯 쌀을 소매에 넣고 지팡이로 산등성이를 가리켰습니다. 아이들은 밤마다 수레 소리가 멎는 집을 서로 다투어 말했습니다. 능선의 작은 창고 하나에서는 이미 연기가 났습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "쌀값은 오늘 배를 채우고, 길값은 다음 수레를 막아. 대신 불탄 창고에서 끝내 말하지 못한 사람 몫까지 장부에 남겨."
      - goto: hidden_warehouse

  surround_warehouse:
    actions:
      - say:
          channel: narration
          text: "기병의 횃불이 세 창고를 동시에 에워쌌습니다. 안쪽 빗장이 걸리는 소리와 함께, 담 너머에서 '왕실의 약탈'이라는 외침이 먼저 터졌습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "문은 부술 수 있습니다. 하지만 왕실 기병이 먼저 칼을 뽑으면, 안의 장부보다 ‘공주가 창고를 빼앗았다’는 장면이 더 빨리 퍼집니다."
      - goto: hidden_warehouse

  hidden_warehouse:
    actions:
      - bg: locked_room
      - camera: wide
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "문이 무너지자 곡식 냄새 대신 기름 먹인 갑옷 냄새가 쏟아졌습니다. 갑옷 더미 위에 한 사내가 누워 남의 장부를 소리 내 읽고 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "쌀 한 섬이 창 세 자루, 아이 한 끼가 갑옷 못 열두 개. 사람 이름은 지워도 물건 값은 반듯하게 남겼군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "누구지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담입니다. 주인 없는 칼로 살았는데, 오늘은 칼을 뽑지 않은 이 숫자들이 사람을 더 많이 죽이는 걸 봤습니다."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "비는 안으로 들고 굶은 사람들은 밖에서 문을 밉니다. 내일까지 두면 쌀도 증거도 망가집니다. 누구에게 무엇부터 보여 줄지 지금 정해야 합니다."
      - choice:
          key: c4_grain_policy
          prompt: "문밖의 손들이 창고 문을 흔든다. 먼저 무엇을 내놓을까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "장부를 벽에 붙이고 마을에 열쇠를 준다"
              set: { grain_policy: public_distribution }
              add: { people_support: 3, nobles_support: -1, insight: 1 }
              goto: public_distribution
            - text: "왕실 깃발 아래 줄을 세워 배급한다"
              set: { grain_policy: royal_relief }
              add: { king_trust: 1, nobles_support: 1, people_support: 1 }
              goto: royal_relief
            - text: "장부를 덮고 귀족에게 군량을 뜯어낸다"
              set: { grain_policy: bargain }
              add: { army_support: 2, evidence: 1, fear: 1 }
              goto: grain_bargain

  public_distribution:
    actions:
      - bg: village
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "마을 대표들이 자루마다 숯으로 집 이름을 썼습니다. 줄은 느리게 줄었고 서로의 몫을 세는 목소리는 밤새 멈추지 않았습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "오늘 자기 이름 옆의 쌀을 센 사람은 내일 왕실 장부도 보여 달라 할 겁니다. 폐하가 되시면 그 문까지 열어 주실 겁니까?"
      - say:
          char: 덕만
          text: "두드리게 둬. 질문에 문이 상하는 값보다, 닫힌 문 안에서 사람과 쌀이 사라지는 값이 더 비싸."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "왕실 북이 울리자 줄은 빠르게 정리됐습니다. 관리들은 자루를 건넬 때마다 '왕의 은혜'를 외쳤고 덕만의 이름은 한 번도 부르지 않았습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘 밤은 먹입니다. 하지만 다음 창고가 비면 저 사람들은 우리 깃발이 올 때까지 또 굶을 겁니다."
      - goto: convoy_attack

  grain_bargain:
    actions:
      - bg: council_hall
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "장부가 상자에 잠기자 귀족 창고에서 군량 수레가 나왔습니다. 병사들의 솥에는 김이 올랐고, 마을 사람들은 도둑의 이름 대신 빈 자루만 바라봤습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "오늘은 저 군량이 국경을 살린다. 하지만 장부를 계속 담보로 쥐면, 내 열쇠와 곡식을 훔친 자의 열쇠가 무엇이 다른지 곧 묻게 되겠지."
      - goto: convoy_attack

  convoy_attack:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "마지막 수레가 협곡 그림자에 들어간 순간 앞뒤에서 바위가 굴렀습니다. 절벽 위 횃불들이 곡식 자루와 장부 상자를 동시에 겨눴습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "정면은 뚫을 수 있습니다. 그 순간 뒤 수레와 마을 몫이 불화살을 맞습니다. 적을 이기는 것과 곡식을 도착시키는 것 중 명령을 주십시오."
      - choice:
          key: c4_convoy
          prompt: "불화살은 장부 상자와 마지막 마을 몫을 함께 겨눈다. 무엇을 미끼로 삼지 않을까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "자루를 벽으로 쌓고 비를 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: convoy_saved
            - text: "빈 수레를 미끼로 매복 주인을 끌어낸다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: bait_ambush
            - text: "유신 옆에서 정면을 뚫는다"
              goto: bad_charge

  bait_ambush:
    actions:
      - say:
          channel: narration
          text: "빈 수레가 협곡으로 구르자 첫 궁수들이 몸을 드러냈습니다. 비담이 불화살 하나를 낚아채 절벽 아래로 던졌고, 유신은 그 짧은 틈에 뒤 수레를 비탈길로 돌렸습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "적의 얼굴은 봤습니다. 대신 수레 둘을 버렸습니다. 다음 마을 몫이 줄었다는 것도 기록하겠습니다."
      - goto: convoy_saved

  convoy_saved:
    actions:
      - bg: village
      - camera: medium
      - say:
          channel: narration
          text: "해가 뜰 무렵, 그을린 수레바퀴가 마을 돌길을 밟았습니다. 아이들이 달려와 터진 자루에서 쌀알을 한 톨씩 주웠습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "오늘은 공주님의 이름 때문에 따른 게 아닙니다. 제 칼보다 먼저 뒤 수레의 사람을 보셨기에 따랐습니다."
      - say:
          char: 덕만
          text: "다음에는 내가 못 본 사람과 값을 네가 먼저 말해 줘. 내 이름 앞에서 칼집째 침묵하는 장수는 필요 없어."
      - say:
          channel: record
          text: "유신이 찢어진 자루를 뒤집자 당의 낙인이 드러났습니다. 비담은 장부 마지막 장을 찢어 덕만에게 건넸습니다. 사흘 뒤 모란 연회. 원조 손실을 해명하라는 당 사신의 글이었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "아이들 쌀을 창으로 바꾼 손이 당 사신과도 잔을 부딪쳤어. 좋아. 빈 모란 그림 옆에 이 가득 찬 장부를 펼쳐 주지."
      - goto: /4.yaml

  bad_charge:
    actions:
      - bg: frontier
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "곡식을 미끼로 던지든 정면을 뚫든, 저 불화살부터 우리 쪽으로 돌린다."
      - say:
          char: 유신.angry
          text: "수레가 움직이면 피할 벽도 사라집니다. 한 번 시작하면 사람과 곡식을 따로 빼낼 수 없습니다."
      - say:
          channel: narration
          text: "선두가 협곡으로 돌진하자 숨어 있던 궁수들이 일제히 몸을 드러냈습니다. 두 번째 불화살은 사람과 장부가 실린 뒤 수레에 꽂혔고, 너무 깊이 들어온 선두는 불붙은 퇴로 앞에서 멈췄습니다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "전술로 적을 끌어낼 수는 있었지만 협곡 전체를 전장으로 만들면 곡식과 사람도 미끼가 됩니다. 덕만과 유신은 불길 속에서 전사했고 구휼 장부도 함께 탔습니다."
