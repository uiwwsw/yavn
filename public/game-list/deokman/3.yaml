script:
  - scene: empty_granary

scenes:
  empty_granary:
    actions:
      - bg: village
      - camera: wide
      - say:
          channel: record
          text: "제4장 — 칼과 장부"
      - say:
          channel: narration
          text: "자매가 지목한 서쪽 왕실 창고의 첫 수레를 따라온 밤이었습니다. 국경에서 가져온 붉은 인장이 찍힌 장부에는 구휼미가 가득하다고 적혀 있었지만, 서라벌 바깥 마을의 곡식독에서는 먼지만 나왔습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "곡식 수레가 산길에서 사라졌습니다. 병사 스무 명이면 오늘 밤 창고를 칠 수 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "창고 하나를 되찾으면 도둑은 다른 창고로 옮겨. 수레가 사라졌는데 장부의 숫자가 그대로인 이유부터 찾자."
      - choice:
          key: c4_investigation
          prompt: "사라진 구휼미를 어떻게 추적하겠습니까?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "수레바퀴 자국과 야간 통행표를 대조한다"
              add: { evidence: 2, insight: 1 }
              goto: track_wagons
            - text: "굶주린 마을 사람들을 임시 운송대로 고용한다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: hire_villagers
            - text: "유신의 군사로 귀족 창고를 즉시 포위한다"
              add: { army_support: 2, fear: 1 }
              goto: surround_warehouse

  track_wagons:
    actions:
      - say:
          channel: narration
          text: "낮에는 왕실 수레였던 바퀴가 밤에는 귀족 문장의 덮개를 달았습니다. 같은 수레가 두 개의 주인을 가진 셈이었습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "칼자국보다 선명합니다. 숫자는 거짓말을 해도 바퀴 폭은 바뀌지 않습니다."
      - goto: hidden_warehouse

  hire_villagers:
    actions:
      - say:
          channel: narration
          text: "마을 사람들은 품삯으로 받은 쌀 한 줌보다, 어느 길에서 수레가 방향을 바꾸는지 더 정확히 알려 주었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "백성을 구제의 대상만으로 보면 입을 기다리게 돼. 일을 맡기면 눈과 손을 얻을 수 있어."
      - goto: hidden_warehouse

  surround_warehouse:
    actions:
      - say:
          channel: narration
          text: "유신의 기병이 세 창고를 동시에 봉쇄했습니다. 곡식은 움직이지 못했지만 귀족들은 이를 왕실의 사유 재산 약탈이라 불렀습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "이제 문은 열 수 있습니다. 다만 안에서 무엇이 나오든 제 칼이 먼저 말한 것으로 기록될 겁니다."
      - goto: hidden_warehouse

  hidden_warehouse:
    actions:
      - bg: locked_room
      - camera: wide
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "숨은 창고 안에는 곡식 대신 사병의 갑옷이 쌓여 있었습니다. 그 위에 낯선 사내가 누워 장부를 읽고 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "굶는 사람의 쌀로 잘 먹는 군사를 만들었군요. 나라를 훔치는 데 꽤 성실한 장부입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "누구지?"
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "비담. 주인이 없는 칼이었는데, 오늘은 장부 쪽이 더 재미있어서 기다렸습니다."
      - sticker: { id: c4_ledger, image: grain_ledger_sticker, x: 51, y: 29, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, rotate: -2, enter: fadeIn }
      - get: grain_ledger
      - clearSticker: { id: c4_ledger, leave: fadeOut }
      - goto: grain_decision

  grain_decision:
    actions:
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "곡식은 내일이면 썩기 시작합니다. 장부를 공개하는 일과 배급하는 일을 동시에 할 수는 없습니다. 먼저 명령해 주십시오."
      - choice:
          key: c4_grain_policy
          prompt: "되찾은 곡식과 장부를 어떻게 처리하겠습니까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "장부를 공개하고 마을이 직접 곡식을 나누게 한다"
              set: { grain_policy: public_distribution }
              add: { people_support: 3, nobles_support: -1, insight: 1 }
              goto: public_distribution
            - text: "왕실이 곡식을 회수해 순서대로 배급한다"
              set: { grain_policy: royal_relief }
              add: { king_trust: 1, nobles_support: 1, people_support: 1 }
              goto: royal_relief
            - text: "장부를 비밀로 하고 귀족에게 군량 지원을 받아낸다"
              set: { grain_policy: bargain }
              add: { army_support: 2, evidence: 1, fear: 1 }
              goto: grain_bargain

  public_distribution:
    actions:
      - bg: village
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "마을마다 대표가 나와 자기 몫을 세었습니다. 배급은 느렸지만 어느 집에 몇 되가 갔는지 모두가 알았습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "백성에게 숫자를 보여 주셨군요. 다음에는 왕실 장부도 보여 달라고 할 겁니다."
      - say:
          char: 덕만
          text: "그래야 같은 쌀을 두 번 훔치지 못하지."
      - goto: convoy_attack

  royal_relief:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "왕실 깃발 아래 곡식이 배급되었습니다. 질서는 빨랐지만 사람들은 덕만이 아니라 왕의 은혜라고 들었습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘은 굶주림을 막았습니다. 내일 왕실 창고가 다시 비면 사람들은 같은 깃발만 기다릴 겁니다."
      - goto: convoy_attack

  grain_bargain:
    actions:
      - bg: council_hall
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "귀족들은 장부가 공개되지 않는 대가로 국경군에 군량을 내놓았습니다. 군사는 배불렀고 굶은 마을에는 누가 쌀을 훔쳤는지 알려지지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "오늘 얻은 군량으로 더 큰 약탈을 막을 수 있어. 다만 이 빚은 언젠가 공개해야 해."
      - goto: convoy_attack

  convoy_attack:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "마지막 수레가 협곡에 들어서자 사병들이 앞뒤 길을 막았습니다. 곡식과 장부를 한꺼번에 없애려는 공격이었습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "정면을 뚫으면 수레 절반은 살립니다. 명령을 기다리겠습니다."
      - choice:
          key: c4_convoy
          prompt: "협곡의 곡식 수레를 어떻게 지키겠습니까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "곡식 자루를 방벽으로 쌓고 증원군을 기다린다"
              add: { army_support: 1, insight: 1 }
              goto: convoy_saved
            - text: "수레 하나를 미끼로 보내 매복의 주인을 추적한다"
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: convoy_saved
            - text: "유신과 함께 정면으로 돌격해 모두 끝낸다"
              goto: bad_charge

  convoy_saved:
    actions:
      - bg: village
      - camera: medium
      - say:
          channel: narration
          text: "해가 뜰 때 곡식 수레는 마을에 도착했습니다. 모두를 살리지는 못했지만 장부와 배급의 길은 함께 남았습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          text: "오늘 저는 공주님의 명령이 아니라 판단을 믿었습니다."
      - say:
          char: 덕만
          text: "그럼 다음에도 내 직함보다 판단이 틀렸는지 먼저 봐 줘. 왕에게 필요한 건 그런 칼이야."
      - say:
          channel: record
          text: "덕만은 곡식을 되찾으며 유신을 얻었고, 장부를 얻으며 비담의 관심을 샀습니다. 되찾은 자루에는 당의 원조 표식이, 장부 끝에는 사흘 뒤 모란 연회에서 손실을 해명하라는 사신의 요구가 적혀 있었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "곡식을 훔친 손이 당과의 거래까지 쥐고 있어. 이 장부를 들고 연회에 가서, 원조가 혼인과 주둔지로 바뀐 과정을 묻겠다."
      - goto: /4.yaml

  bad_charge:
    actions:
      - bg: frontier
      - camera: close
      - effect: darken
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "수레 뒤에 숨지 않겠다. 나와 함께 길을 연다."
      - say:
          char: 유신.angry
          text: "공주님이 선두에 서면 병사들은 물러날 수 없습니다. 그래도 명령이라면 따르겠습니다."
      - say:
          channel: narration
          text: "첫 방패선은 뚫었지만 위에서 쏟아진 불화살이 곡식 자루에 꽂혔습니다. 퇴로도 식량도 함께 타올랐습니다."
      - say:
          channel: record
          text: "구휼 수레 피습 보고 — 왕실 혈족 덕만과 김유신, 군량을 지키다 전사. 장부는 소실됨."
      - gameOver:
          title: "운명 — 칼이 장부를 태우다"
          message: "용감한 돌격은 전투를 시작할 수 있지만 곡식의 길까지 지키지는 못했습니다. 덕만은 자신이 보호하려던 증거와 사람을 같은 전장에 걸었습니다."
