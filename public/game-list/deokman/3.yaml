script:
  - scene: chapter3_open
  - scene: chapter3_end

scenes:
  chapter3_open:
    actions:
      - bg: locked_room
      - effect: focus
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "제3장 — 한 사람만 거짓말한다"
      - say:
          char: 소원.nervous
          framing: full
          delivery: nervous
          text: "빗장은 안에서 걸려 있었고 창틀 먼지는 그대로예요. 그런데 문밖 사람들은 똑같은 말만 해요. ‘비명은 못 들었다, 아무도 드나들지 않았다.’"
      - say:
          char: 덕만
          framing: bust
          text: "누가 먼저 그렇게 말했대?"
      - say:
          char: 소원.nervous
          framing: bust
          with:
            - 덕만
          text: "다들 자기가 먼저 말했다고 해요. 그래서 더 이상해요."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 소원
          text: "그럼 사람들 말은 잠깐 잊자. 이 방에서 실제로 움직인 것부터 보자. 시체가 식기 전에."
      - goto: body_choice

  body_choice:
    actions:
      - choice:
          key: c3_body
          prompt: "시체가 식기 전, 무엇을 할까?"
          char: 덕만.angry
          framing: closeup
          with:
            - 소원
          options:
            - text: "모두 불러 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              goto: body_public
            - text: "침상 밑에 숨긴다"
              goto: go_17_second_murder
            - text: "칠숙 방으로 옮긴다"
              goto: go_18_borrowed_corpse
            - text: "소원과 흔적을 적는다"
              add:
                sowon_trust: 2
                insight: 1
              goto: body_record

  body_public:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: shout
          text: "문을 여세요. 들어와서 직접 보십시오. 제가 숨겼다는 말은 그 다음에 들을 테니, 지금 나가는 사람부터 잡으세요."
      - say:
          delivery: nervous
          text: "사람들이 시체를 보려 몰려드는 동안, 맨 뒤에 있던 칠숙의 하인이 한 걸음 물러섰습니다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "겁이 많은 아이라 그렇습니다. 시체를 보고 물러난 것까지 죄가 되지는 않겠지요."
      - say:
          char: 덕만
          framing: bust
          text: "아직 시체를 보지 않았습니다. 그런데 왜 물러났을까요? 그 아이는 따로 남겨 두세요."
      - goto: testimony_choice

  body_record:
    actions:
      - say:
          char: 소원
          framing: bust
          text: "안쪽 먼지는 그대로인데, 창밖 발판만 손바닥만큼 닦였어요. 누가 밖에서 창을 밀었나 봐요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 범인은 방 안에 들어오지 않았을 수도 있어. 네가 발견한 순서대로 적어 줘. 나중에 누가 말을 바꿔도 흔적은 안 바뀌게."
      - say:
          char: 소원
          framing: bust
          text: "글씨가 느려도 괜찮죠? 하나도 빼먹고 싶지 않아요."
      - say:
          char: 덕만
          framing: bust
          text: "천천히 써. 오늘은 빠른 대답보다 틀리지 않은 기록이 필요해."
      - goto: testimony_choice

  testimony_choice:
    actions:
      - bg: council_hall
      - say:
          text: "해가 뜨기 전, 소원은 창밖 흔적을 가져왔고 비담은 복제된 열쇠를, 유신은 젖은 발자국의 치수를 가져왔습니다."
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "열쇠는 세 벌입니다. 하나는 공주님 것, 하나는 죽은 자의 품, 나머지 하나는 어젯밤 급히 만든 흔적이 남았습니다."
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "창 아래 발자국은 여덟 개입니다. 비에 젖었지만 보폭은 일정합니다. 다친 사람의 걸음은 아닙니다."
      - say:
          char: 덕만
          framing: bust
          text: "단서 셋이 서로 다른 사람을 가리키는 것처럼 보여. 하나부터 끝까지 따라가 보자."
      - choice:
          key: c3_testimony
          prompt: "누구의 단서를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "소원의 먼지"
              add:
                sowon_trust: 1
                insight: 1
              goto: testimony_sowon
            - text: "비담의 열쇠"
              add:
                bidam_trust: 1
                insight: 1
              goto: testimony_bidam
            - text: "유신의 발자국"
              add:
                yushin_trust: 1
                power: 1
              goto: testimony_yushin
            - text: "칠숙의 상처"
              goto: go_19_last_witness

  testimony_sowon:
    actions:
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: bust
          text: "발판에 짚신 앞코만 찍혔어요. 밧줄에 몸을 기대고 창을 민 것 같아요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 소원
          text: "직접 들어오지 않고 어떻게 사람을 죽였지?"
      - say:
          char: 소원
          framing: closeup
          text: "창으로 뭘 건넸을 수도 있어요. 바닥에 약 냄새 나는 실이 떨어져 있었어요."
      - say:
          char: 덕만
          framing: bust
          text: "실로 문빗장을 당겼군. 살인은 방 안에서, 잠금은 방 밖에서 끝낸 거야."
      - goto: culprit_choice

  testimony_bidam:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "새 열쇠에는 밀랍이 묻어 있습니다. 공주님 열쇠 모양을 본떠 만든 겁니다."
      - say:
          char: 덕만
          framing: bust
          text: "누가 열쇠를 가져갔는지 알아낼 수 있어?"
      - say:
          char: 비담.smirk
          framing: bust
          text: "공주님 열쇠를 맡았던 나인 셋은 서로를 의심하고 있습니다. 범인은 그중에 없을 겁니다. 너무 잘 보이는 의심은 대개 누가 갖다 놓은 거라서요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 열쇠를 만든 장인부터 찾아. 누가 밀랍을 가져왔는지 물어보자."
      - goto: culprit_choice

  testimony_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "발자국은 여덟 개, 간격은 모두 두 자 반입니다. 그런데 용의자 한 명은 어젯밤부터 다리를 절었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "다친 척했다는 뜻이군요. 누굽니까?"
      - say:
          char: 유신
          framing: closeup
          text: "아진입니다. 공주께 들킨 뒤부터 왼쪽 다리를 절었습니다. 하지만 발자국은 양쪽 깊이가 같습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "그 사람은 얼굴을 숨겨도 걷는 속도는 못 숨겨. 데려오세요. 다만 아직 체포하지는 마세요."
      - goto: culprit_choice

  culprit_choice:
    actions:
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "문까지 열한 걸음입니다. 공주께서 제 이름을 부르는 순간부터 세었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
          text: "달아날 생각이었나?"
      - say:
          char: 아진.nervous
          framing: bust
          text: "증거가 없으면 달아날 필요도 없습니다. 공주께서는 제가 했다는 것만 아십니다. 왜 했는지는 모르십니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래서 아직 잡지 않았어. 네가 누구 명령을 받았는지 말할 기회를 주는 거야."
      - choice:
          key: c3_culprit
          prompt: "아진이 눈앞에 있다. 어떻게 할까?"
          char: 덕만
          framing: closeup
          with:
            - 아진
          options:
            - text: "당장 체포한다"
              goto: go_20_correct_accusation
            - text: "문서를 가져오라 한다"
              add:
                power: 1
                suspicion: 2
              goto: culprit_deal
            - text: "죽은 자가 깼다 속인다"
              add:
                insight: 2
                nobles_support: -1
              goto: culprit_bait
            - text: "소원을 범인으로 몬다"
              goto: go_21_friendless_truth

  culprit_deal:
    actions:
      - say:
          char: 아진.angry
          framing: bust
          delivery: neutral
          text: "문서를 가져오면 제 가족이 죽습니다. 다음 명령이 오면 저는 공주를 죽여야 합니다. 그래도 저를 보내시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "가족이 어디 있지?"
      - say:
          char: 아진.angry
          framing: closeup
          text: "그것까지 말하면 오늘 밤을 못 넘깁니다."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 말하지 마. 문서만 가져와. 그동안 내가 네 가족이 있는 곳부터 찾을게."
      - say:
          char: 아진.nervous
          framing: bust
          text: "공주를 믿는 게 아니라, 다른 길이 없어서 갑니다."
      - say:
          char: 덕만
          framing: bust
          text: "처음에는 그 정도면 돼. 돌아오면 그 다음을 정하자."
      - add:
          bidam_trust: 1
      - goto: chapter3_end

  culprit_bait:
    actions:
      - effect: focus
      - say:
          delivery: nervous
          text: "덕만은 죽은 귀족이 잠깐 의식을 되찾았다는 거짓 전갈을 보냈습니다. 반 시진 뒤, 칠숙의 하인이 방으로 돌아와 시체의 입을 확인하다 붙잡혔습니다."
      - say:
          char: 덕만
          framing: bust
          text: "죽은 사람이 무슨 말을 했다고 들었지?"
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "겁먹은 하인이 제멋대로 움직인 모양입니다. 제 사람이라고 모두 제 명령만 듣는 것은 아닙니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그 말은 하인 앞에서도 해 주세요. 품에서 나온 서약서와 함께 물어보겠습니다."
      - goto: chapter3_end

  chapter3_end:
    actions:
      - get: oath_fragment
      - set:
          clue_oath_fragment: true
      - add:
          legitimacy: 1
      - say:
          text: "찢긴 서약서에는 왕실 남자를 후계자로 세우고, 덕만을 혼인이나 추방으로 왕경에서 떼어 놓겠다는 약속이 남아 있었습니다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "살인 혐의는 벗으셨습니다. 축하드립니다. 전하께서 공주께 국경 위무를 맡기셨으니, 떠날 준비를 하셔야겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "살인범을 잡은 날 바로 왕경을 떠나라니, 준비가 빠르시군요."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "국경의 백성이 굶고 있습니다. 공주께서도 그들을 오래 기다리게 하고 싶지는 않으시겠지요."
      - say:
          char: 덕만
          framing: closeup
          text: "가겠습니다. 대신 제가 그곳에서 누구를 만나고 무엇을 듣는지는 이곳에서 정하지 못할 겁니다."
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "궁 밖에서는 공주라는 이름도 생각보다 가볍습니다. 몸조심하십시오."
      - say:
          text: "덕만은 살인 누명을 벗고 계승동맹의 서약서를 얻었습니다. 그러나 그날 안에 국경으로 떠나라는 왕명을 받았습니다."

  go_17_second_murder:
    actions:
      - gameOver:
          title: "운명 17 — 두 번째 살인"
          message: "숨긴 시체는 덕만의 침상 아래에서 발견되었다. 첫 번째 살인은 남의 것이었지만, 진실을 숨긴 두 번째 살인은 덕만의 것이 되었다."
  go_18_borrowed_corpse:
    actions:
      - gameOver:
          title: "운명 18 — 빌린 시체"
          message: "시체를 옮기는 덕만의 모습은 열두 명이 보았다. 칠숙은 자신의 방에서 발견된 시체보다 공주의 손에 묻은 피를 증거로 삼았다. 함정은 주인만 바꾸어 닫혔다."
  go_19_last_witness:
    actions:
      - gameOver:
          title: "운명 19 — 마지막 증언"
          message: "칠숙은 상처를 보았다고 했지만 시체는 엎드려 있었다. 덕만이 그 모순을 깨달았을 때, 증언을 믿고 물린 호위는 이미 그녀의 목에 칼을 대고 있었다."
  go_20_correct_accusation:
    actions:
      - gameOver:
          title: "운명 20 — 증거 없는 정답"
          message: "아진은 진범이었다. 그러나 체포 명령이 떨어지기 전 독을 삼켰고, 남은 것은 공주가 고문으로 무고한 이를 죽였다는 소문뿐이었다. 정답은 다시 죄가 되었다."
  go_21_friendless_truth:
    actions:
      - gameOver:
          title: "운명 21 — 친구 없는 진실"
          message: "소원은 고문 끝에 원하는 자백을 했다. 덕만은 살인 혐의를 벗었지만, 마지막까지 곁을 지키던 사람을 잃었다. 훗날 반란의 밤, 그녀를 깨워 줄 사람은 없었다."
