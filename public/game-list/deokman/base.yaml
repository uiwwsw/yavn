inventory:
  peony_painting:
    name: "향기 없는 모란도"
    description: "꽃은 무성하지만 벌과 나비가 없습니다. 그림 속 빈자리를 본 덕만은 방 안에서 사라진 발소리도 알아챘습니다. 뒤축에는 사망 기록이 숨겨져 있었습니다."
    image: "root:/game-list/deokman/assets/items/peony-painting.svg"
    category: "왕실 물품"
    order: 10
  death_register:
    name: "위조된 덕만의 사망 기록"
    description: "살아 있는 덕만의 사망 시각을 먼저 쓴 종이. 붉은 인장의 오른쪽 아래 모서리가 네모나게 비었습니다. 국경에서 얻은 수색표와 가장자리를 맞춰 볼 수 있습니다."
    image: "root:/game-list/deokman/assets/items/death-register.svg"
    category: "금지된 기록"
    order: 20
  peony_token:
    name: "청동 모란패"
    description: "어린 날 받은 청동 출입패. 초록 녹, 끈이 드나드는 열린 고리, 닳은 모란 무늬가 남았습니다. 천명 습격 뒤 얻은 새 패와 비교할 원본입니다."
    image: "root:/game-list/deokman/assets/items/peony-token.svg"
    category: "신분 표식"
    order: 30
  market_seal:
    name: "국경 시장의 붉은 인장"
    description: "수색 명단과 곡식 운송에 찍힌 붉은 도장. 오른쪽 아래 모서리가 깨졌습니다. 죽음을 미리 쓴 기록과 국경의 추격 명령을 같은 손으로 연결합니다."
    image: "root:/game-list/deokman/assets/items/market-seal.svg"
    category: "추적 증거"
    order: 40
  grain_ledger:
    name: "사라진 구휼 곡식 장부"
    description: "출발 칸에는 자루 여섯, 도착 칸에는 셋. 남은 세 자루가 군수품으로 바뀐 자리에 붉은 인장이 찍혔습니다. 이 수량은 배급 정책을 달리해도 사라지지 않는 빚입니다."
    image: "root:/game-list/deokman/assets/items/grain-ledger.svg"
    category: "정치 증거"
    order: 50
  eclipse_table:
    name: "일식 계산표"
    description: "해가 가려지고 돌아오는 시각을 두 달력으로 검산한 표. 다섯 단계의 둥근 해와 마지막 붉은 표시가 있습니다. 계산을 공개할지 기적으로 꾸밀지는 덕만의 선택입니다."
    image: "root:/game-list/deokman/assets/items/eclipse-table.svg"
    category: "천문 기록"
    order: 60
  empty_seal_box:
    name: "빈 옥새함"
    description: "옥새가 사라진 자리에 네모난 눌림과 붉은 인주만 남은 함. 도장을 소유해도 창고와 군대가 따르지 않던 왕의 증거입니다. 누구에게 열쇠를 줄지 다시 묻습니다."
    image: "root:/game-list/deokman/assets/items/empty-seal-box.svg"
    category: "왕권의 증거"
    order: 70
  star_chart:
    name: "백성을 위한 별자리표"
    description: "별의 점과 파종·강 수위의 표시를 이은 관측표. 누구에게 나눠 주었는지에 따라 경보의 속도와 표를 읽을 수 있는 사람이 달라집니다."
    image: "root:/game-list/deokman/assets/items/star-chart.svg"
    category: "통치 기록"
    order: 80
  burnt_kite:
    name: "불탄 연의 뼈대"
    description: "검게 탄 종이, 기름 먹인 대나무, 끈 끝의 짧은 고리 두 개. 떨어진 것은 별이 아니라 연이었습니다. 비담의 편지 봉끈과 같은 전령 매듭이 남았습니다."
    image: "root:/game-list/deokman/assets/items/burnt-kite.svg"
    category: "반란 증거"
    order: 90
  bidam_letter:
    name: "비담의 보내지 못한 서신"
    description: "왕의 신임을 묻는 글보다 먼저 눈에 들어오는 것은 두 고리의 봉끈입니다. 불탄 연과 같은 매듭이지만, 그 길을 다닌 모든 사람의 죄까지 같지는 않습니다."
    image: "root:/game-list/deokman/assets/items/bidam-letter.svg"
    category: "마지막 기록"
    order: 100
  forged_token:
    name: "암살자의 복제 모란패"
    description: "고리가 막힌 채 한 번에 부어진 새 패. 초록 녹 대신 금빛 도금이 있고 긁힌 곳은 붉은 구리색입니다. 원래 모란패와 나란히 보면 천명을 모함하려고 급히 만든 흔적이 드러납니다."
    image: "root:/game-list/deokman/assets/items/forged-token.svg"
    category: "자매의 증거"
    order: 75
  medicine_cup:
    name: "천명의 독이 남은 잔"
    description: "잔 안쪽 홈에 검은 가루가 남았습니다. 시장 의원이 헹군 물과 함께 봉해 둔 물증. 천명이 스스로 병든 것이 아니라 잔을 건네받은 뒤 쓰러졌다는 진료 기록과 함께 보관합니다."
    image: "root:/game-list/deokman/assets/items/medicine-cup.svg"
    category: "자매의 증거"
    order: 74
