inventory:
  peony_painting:
    name: "향기 없는 모란도"
    description: "꽃은 가득하지만 벌과 나비는 그려지지 않은 모란 그림입니다. 빠진 것을 읽는 덕만의 첫 수업이 되었습니다."
    image: root:/game-list/deokman/assets/items/peony-painting.svg
    category: "왕실 물품"
    order: 10
  death_register:
    name: "위조된 덕만의 사망 기록"
    description: "덕만이 죽기 전에 사망 시각부터 적은 문서입니다. 권력이 기록을 사실로 만드는 방식을 보여 줍니다."
    image: root:/game-list/deokman/assets/items/death-register.svg
    category: "금지된 기록"
    order: 20
  peony_token:
    name: "청동 모란패"
    description: "왕실 안쪽 문을 통과하는 표식입니다. 문을 열지만 소유자의 신분도 드러냅니다."
    image: root:/game-list/deokman/assets/items/peony-token.svg
    category: "신분 표식"
    order: 30
  market_seal:
    name: "국경 시장의 붉은 인장"
    description: "칠숙의 수색 명단과 곡식 운송표에 함께 찍힌 인장입니다. 별궁의 위조 기록과 같은 계통의 도장입니다."
    image: root:/game-list/deokman/assets/items/market-seal.svg
    category: "추적 증거"
    order: 40
  grain_ledger:
    name: "사라진 구휼 곡식 장부"
    description: "백성에게 갈 곡식이 귀족 사병의 창고로 옮겨졌음을 적은 장부입니다."
    image: root:/game-list/deokman/assets/items/grain-ledger.svg
    category: "정치 증거"
    order: 50
  eclipse_table:
    name: "일식 계산표"
    description: "하늘의 변화가 신의 분노가 아니라 계산 가능한 현상임을 보여 주는 관측표입니다."
    image: root:/game-list/deokman/assets/items/eclipse-table.svg
    category: "천문 기록"
    order: 60
  empty_seal_box:
    name: "빈 옥새함"
    description: "도장보다 도장을 움직이는 창고·사병·기록이 더 강하다는 진평왕의 고백입니다."
    image: root:/game-list/deokman/assets/items/empty-seal-box.svg
    category: "왕권의 증거"
    order: 70
  star_chart:
    name: "백성을 위한 별자리표"
    description: "파종과 홍수 시기를 누구나 읽을 수 있도록 덕만이 공개한 관측 기록입니다."
    image: root:/game-list/deokman/assets/items/star-chart.svg
    category: "통치 기록"
    order: 80
  burnt_kite:
    name: "불탄 연의 뼈대"
    description: "여왕의 별이 떨어졌다는 소문을 만들기 위해 하늘에 띄운 불붙은 연의 잔해입니다."
    image: root:/game-list/deokman/assets/items/burnt-kite.svg
    category: "반란 증거"
    order: 90
  bidam_letter:
    name: "비담의 보내지 못한 서신"
    description: "충성도 반역도 아닌, 여왕에게 마지막으로 확인받고 싶었던 질문이 적혀 있습니다."
    image: root:/game-list/deokman/assets/items/bidam-letter.svg
    category: "마지막 기록"
    order: 100
