title: "덕만: 왕관에는 주인이 없다"
author:
  name: "uiwwsw"
version: "6.0.1"
seo:
  description: "굶주린 마을의 곡식을 훔친 귀족 연합과 맞서 누명을 벗고 왕이 된 덕만이, 16년 뒤 같은 권력의 거래에서 시작된 비담의 반란을 판결하는 8장 시대극 비주얼노벨."
  keywords:
    - "선덕여왕"
    - "덕만"
    - "신라"
    - "역사 비주얼노벨"
    - "정치 생존 게임"
    - "분기형 게임"
  image: "assets/bg/title-palace-silla-social-v3.jpg"
  imageAlt: "비 내린 달밤의 7세기 신라 월성 왕궁"
textSpeed: 27
autoSave: true
clickToInstant: true
ui:
  template: paper-stage
startScreen:
  enabled: true
  image: "assets/bg/title-palace-silla-v3.webp"
  showTitle: true
  titleColor: "#ffe0a3"
  startButtonText: "이야기 시작"
  buttonPosition: bottom-left
endingScreen:
  image: "assets/bg/title-palace-silla-v3.webp"
endings:
  true_end:
    title: "TRUE END — 성문이 열린 아침"
    message: "덕만은 승만에게 왕위를 잇고, 속아 칼을 든 이와 거짓으로 군사를 일으킨 이를 나누어 판결했습니다. 날이 밝자 닫혔던 성문이 열렸습니다."
  permitted_queen:
    title: "END 01 — 귀족의 허락을 받는 왕"
    message: "반란은 끝났지만 장수와 창고지기를 정할 때마다 귀족 여덟 집의 허락을 받아야 했습니다."
  first_tyrant:
    title: "END 02 — 신라의 첫 번째 폭군"
    message: "반란에 가담한 집안을 통째로 벌하자 칼을 들지 않은 아이와 노인까지 끌려왔습니다. 반란은 끝났지만 반대하는 말도 사라졌습니다."
  lonely_throne:
    title: "END 03 — 혼자 앉은 왕"
    message: "마지막 명령을 받아 줄 사람이 남지 않았습니다. 날이 밝기 전 반란군이 대답 없는 회의장으로 들어왔습니다."
  one_step_queen:
    title: "END 04 — 다음 왕만 남긴 밤"
    message: "다음 왕의 이름은 남겼지만 그 이름을 지킬 군사가 없었습니다. 두 번째 공격 전에 성문이 무너졌습니다."
  abdicated_crown:
    title: "END 05 — 왕관을 내려놓은 하루"
    message: "덕만과 진운은 함께 물러나 군사들이 부상자를 거두게 했습니다. 하루 동안 왕관과 성문의 칼이 함께 내려갔습니다."
  queen_consort:
    title: "END 06 — 빌려 준 왕관"
    message: "덕만은 싸움을 멈추려고 진운에게 왕위를 넘겼습니다. 진운은 왕이 되었고 덕만의 16년은 왕비의 섭정으로 고쳐 적혔습니다."
  peoples_princess:
    title: "END 07 — 성문 위의 왕"
    message: "덕만은 병든 몸으로 성문 위에 섰습니다. 왕궁보다 먼저 곡식길에서 얻은 신뢰가 반란군의 대열을 갈랐습니다."
  vanished_princess:
    title: "END 08 — 사라진 왕과 반역자"
    message: "덕만은 호위 없이 비담을 만나러 갔습니다. 두 사람은 돌아오지 않았고 밤새 열린 협상의 내용도 남지 않았습니다."
  broken_alliance:
    title: "END 09 — 두 왕이 된 신라"
    message: "월성과 명활성은 서로 다른 명령을 내렸습니다. 열흘이 지나도 두 성의 북은 같은 때에 멎지 않았습니다."
defaultEnding: broken_alliance
