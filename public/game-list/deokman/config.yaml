title: "덕만: 왕관에는 주인이 없다"
author:
  name: "uiwwsw"
version: "5.5.0"
seo:
  description: "아버지를 살리고도 암살범으로 몰린 덕만이 왕위에 오르기까지의 음모와 16년 뒤 비담의 반란을 그린 8장 역사 비주얼노벨."
  keywords:
    - "선덕여왕"
    - "덕만"
    - "신라"
    - "역사 비주얼노벨"
    - "정치 생존 게임"
    - "분기형 게임"
  image: "assets/bg/title-palace-silla-social-v3.jpg"
  imageAlt: "비 내린 달밤의 7세기 신라 월성 왕궁"
textSpeed: 27
autoSave: true
clickToInstant: true
ui:
  template: paper-stage
startScreen:
  enabled: true
  image: "assets/bg/title-palace-silla-v3.webp"
  showTitle: true
  titleColor: "#ffe0a3"
  startButtonText: "이야기 시작"
  buttonPosition: bottom-left
endingScreen:
  image: "assets/bg/title-palace-silla-v3.webp"
endings:
  true_end:
    title: "TRUE END — 왕이 보지 못한 아침"
    message: "647년 1월, 덕만은 승만을 다음 왕으로 정했다. 유신은 성문을 열어 죽은 군사들을 거뒀다."
  permitted_queen:
    title: "END 01 — 귀족의 허락을 받는 왕"
    message: "반란은 끝났다. 대신 다음 왕을 고르는 권리는 귀족들이 갖게 됐다."
  first_tyrant:
    title: "END 02 — 신라의 첫 번째 폭군"
    message: "반란에 가담한 집안을 지우자 아이와 노인까지 끌려왔다. 반란은 끝났지만 모든 사람이 왕의 적이 되었다."
  lonely_throne:
    title: "END 03 — 혼자 앉은 왕"
    message: "마지막 명령을 받아 줄 사람이 없었다. 날이 밝기 전, 반란군이 비어 있는 왕의 회의장으로 들어왔다."
  one_step_queen:
    title: "END 04 — 다음 왕만 남긴 밤"
    message: "다음 왕은 정했지만 성문을 지킬 군사가 없었다. 두 번째 공격 신호가 울리기 전 반란군이 들이닥쳤다."
  abdicated_crown:
    title: "END 05 — 왕관을 버린 왕"
    message: "덕만과 진운은 함께 물러났다. 하루 동안 왕관은 비었고 성문의 칼도 내려갔다."
  queen_consort:
    title: "END 06 — 진운에게 넘긴 왕위"
    message: "덕만은 진운을 다음 왕으로 세웠다. 싸움은 끝났지만 덕만은 더 이상 왕으로 기록되지 않았다."
  peoples_princess:
    title: "END 07 — 성문 위의 왕"
    message: "덕만은 귀족 회의를 나와 백성 앞에 섰다. 성 밖의 함성이 반란군보다 먼저 수도를 채웠다."
  vanished_princess:
    title: "END 08 — 사라진 왕과 반역자"
    message: "덕만은 비담을 직접 불렀다. 두 사람은 돌아오지 않았고 왕과 반란도 기록에서 함께 사라졌다."
  broken_alliance:
    title: "END 09 — 두 왕이 된 신라"
    message: "월성과 명활성은 서로 다른 왕을 외쳤다. 10일 뒤에도 두 성의 북은 멈추지 않았다."
defaultEnding: broken_alliance
