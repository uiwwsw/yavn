title: "덕만: 왕관에는 주인이 없다"
author:
  name: "uiwwsw"
version: "5.1.0"
seo:
  description: "아버지를 살린 밤 암살범으로 몰린 덕만공주가 왕이 되기 전의 음모부터 16년 통치와 비담의 반란까지 살아 내는 8장 신라 궁중 대하만화극."
  keywords:
    - "선덕여왕"
    - "덕만"
    - "신라"
    - "역사 비주얼노벨"
    - "정치 생존 게임"
    - "분기형 게임"
  image: "assets/bg/title-palace-silla-social-v3.jpg"
  imageAlt: "비 내린 달밤의 7세기 신라 월성 왕궁"
textSpeed: 27
autoSave: true
clickToInstant: true
ui:
  template: paper-stage
startScreen:
  enabled: true
  image: "assets/bg/title-palace-silla-v3.webp"
  showTitle: true
  titleColor: "#ffe0a3"
  startButtonText: "첫 장을 연다"
  buttonPosition: bottom-left
endingScreen:
  image: "assets/bg/title-palace-silla-v3.webp"
endings:
  true_end:
    title: "TRUE END — 왕이 보지 못한 아침"
    message: "덕만은 왕이 되어 16년을 버텼다. 마지막 밤에는 왕관이 아니라 다음 아침을 지킬 사람을 남겼다."
  permitted_queen:
    title: "END 01 — 허락받은 내일"
    message: "반란은 멎었다. 대신 다음 왕을 고르는 권리는 왕이 아니라 귀족들의 문서에 남았다."
  first_tyrant:
    title: "END 02 — 신라의 첫 번째 폭군"
    message: "반란 가문을 지우자 아이와 노인까지 끌려왔다. 반란은 끝났지만 모든 사람이 왕의 적이 되었다."
  lonely_throne:
    title: "END 03 — 혼자 앉은 왕"
    message: "마지막 명령을 받을 사람이 없었다. 반란군은 대답 없는 왕좌전에 아침보다 먼저 닿았다."
  one_step_queen:
    title: "END 04 — 왕이었던 한 걸음"
    message: "다음 왕은 정했지만 성문을 지킬 군사가 없었다. 법은 남았고 왕좌전은 무너졌다."
  abdicated_crown:
    title: "END 05 — 왕관을 버린 왕"
    message: "덕만과 진운은 함께 물러났다. 하루 동안 왕관은 비었고 성문의 칼도 내려갔다."
  queen_consort:
    title: "END 06 — 빌려 준 왕관"
    message: "덕만은 진운을 다음 왕으로 세웠다. 전쟁은 멎었지만 그녀의 이름은 새 왕 아래에 적혔다."
  peoples_princess:
    title: "END 07 — 성문 위의 왕"
    message: "덕만은 닫힌 회의를 나와 백성 앞에 섰다. 성 밖의 함성이 반란군보다 먼저 수도를 채웠다."
  vanished_princess:
    title: "END 08 — 사라진 왕과 반역자"
    message: "덕만은 비담을 직접 불렀다. 두 사람은 돌아오지 않았고 왕과 반란도 기록에서 함께 사라졌다."
  broken_alliance:
    title: "END 09 — 둘로 갈라진 왕관"
    message: "월성과 명활성의 북이 열흘 동안 함께 울렸다. 칼은 왕을 고르지 못하고 죽은 사람만 셌다."
defaultEnding: broken_alliance
