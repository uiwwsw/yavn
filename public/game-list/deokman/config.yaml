title: "덕만: 별은 왕을 선택하지 않는다"
author:
  name: "uiwwsw"
version: "8.1.0"
seo:
  description: "죽었다고 기록된 어린 공주 덕만이 살아 있는 유령에서 신라의 여왕이 되고, 예언과 기록을 독점한 권력을 백성에게 돌려주는 12장 완결 시대극 비주얼노벨."
  keywords:
    - "선덕여왕"
    - "덕만"
    - "신라"
    - "역사 비주얼노벨"
    - "선택형 드라마"
    - "완결 게임"
  image: "/game-list/deokman/assets/bg/title-deokman-v8-fire-v1.webp"
  imageAlt: "금지된 사망 기록을 든 덕만 뒤로 불타는 신라 별궁과 검은 별이 보이는 밤"
textSpeed: 27
autoSave: true
clickToInstant: true
ui:
  template: paper-stage
startScreen:
  enabled: true
  image: "root:/game-list/deokman/assets/bg/title-deokman-v8-fire-v1.webp"
  showTitle: true
  titleColor: "#f1d49a"
  startButtonText: "이야기 시작"
  buttonPosition: bottom-left
endingScreen:
  image: "root:/game-list/deokman/assets/bg/title-palace-silla-v3.webp"
endings:
  stars_belong_to_people:
    title: "진엔딩 — 별은 왕을 선택하지 않는다"
    message: "덕만은 자신의 사망 기록과 반란 재판을 함께 공개했습니다. 첨성대의 기록은 왕실 예언이 아니라 백성의 달력이 되었고, 왕의 이름보다 결정의 근거가 오래 남았습니다."
  merciful_queen:
    title: "엔딩 — 용서받은 반역자"
    message: "비담은 목숨을 건졌고 궁은 조용해졌습니다. 그러나 여왕의 사적인 용서가 법보다 앞섰다는 기억은 다음 반역자에게도 희망이 되었습니다."
  iron_queen:
    title: "엔딩 — 아무도 반대하지 않는 왕"
    message: "반란은 완전히 끝났습니다. 신라는 빠르게 움직였고 명령은 한 번도 늦지 않았습니다. 다만 틀린 명령을 틀렸다고 말하는 사람도 남지 않았습니다."
  borrowed_crown:
    title: "엔딩 — 허락받은 왕관"
    message: "덕만은 왕좌를 지켰지만 군사와 창고를 움직일 때마다 귀족 회의의 허락을 받아야 했습니다. 평화는 유지됐고 여왕의 통치는 매번 담보를 요구받았습니다."
  empty_observatory:
    title: "엔딩 — 문 닫힌 첨성대"
    message: "첨성대는 완성됐지만 관측표는 왕실 서고에 잠겼습니다. 백성은 다시 예언을 기다렸고, 지식을 세운 돌은 권력의 높은 벽이 되었습니다."
  bidams_regent:
    title: "엔딩 — 가장 유능한 신하"
    message: "비담은 반란을 멈추고 여왕 곁에 남았습니다. 모든 문제를 가장 빨리 해결한 그는 마침내 왕보다 먼저 명령을 내리는 사람이 되었습니다."
  sisters_shadow:
    title: "엔딩 — 두 공주의 왕국"
    message: "덕만은 왕이 됐지만 중요한 결정마다 떠난 천명의 마지막 부탁을 물었습니다. 죽은 사람의 뜻을 존중한 통치는 살아 있는 사람의 반대를 듣지 못했습니다."
  recordless_peace:
    title: "엔딩 — 기록 없는 평화"
    message: "사망 기록과 반란 서신은 모두 불탔습니다. 누구도 과거를 들춰 싸우지 않았지만, 다음 세대는 같은 위조가 어떻게 시작됐는지 알 수 없었습니다."
  fallen_star:
    title: "엔딩 — 떨어진 별"
    message: "여왕은 왕좌를 지켰으나 성문 밖의 군대와 시장의 곡식길을 잃었습니다. 왕관은 남았고 신라는 서로 다른 명령을 내리는 두 나라가 되었습니다."
  nameless_queen:
    title: "엔딩 — 이름을 되찾지 못한 왕"
    message: "덕만은 여왕으로 기록됐지만 어린 시절 지워진 이름의 진실은 끝내 공개하지 않았습니다. 왕은 남았고, 그 왕이 왜 싸웠는지는 사라졌습니다."
defaultEnding: nameless_queen
