    <radialGradient id="sun"><stop stop-color="#f6d889"/><stop offset=".65" stop-color="#c18d42"/><stop offset="1" stop-color="#6d4527"/></radialGradient>
    <filter id="shadow" x="-30%" y="-35%" width="160%" height="180%"><feDropShadow dx="4" dy="14" stdDeviation="11" flood-opacity=".6"/></filter>
