script:
  - scene: queens_first_winter

scenes:
  queens_first_winter:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제10장 — 별을 세우는 사람"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 춘추, position: right }
      - say:
          channel: narration
          text: "즉위 첫겨울, 왕좌 앞에 두 돌이 놓였습니다. 하나는 무너진 북쪽 성벽에서, 하나는 지난해 홍수에 잠긴 남쪽 마을에서 왔습니다. 국고 상자에는 둘 중 한쪽 공사비밖에 남지 않았습니다."
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "성벽을 늦추면 적이 들고, 관측대를 늦추면 홍수를 놓칩니다. 무엇이 먼저 올지는 모릅니다."
      - say:
          char: 덕만
          camera: medium
          with: [춘추]
          text: "하나는 기다려야 하는군. 무엇을 지었는지만 말고, 누가 기다렸는지도 적어."
      - choice:
          key: c10_observatory_priority
          prompt: "국고로는 한 공사만 끝낼 수 있습니다. 무엇부터 할까요?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "창고를 채우고 돌 나를 품삯을 곡식으로 준다"
              set: { observatory_priority: granary_first }
              add: { people_support: 3, insight: 1, fear: 1 }
              goto: granary_first
            - text: "남쪽 돌을 골라 첨성대부터 올린다"
              set: { observatory_priority: stars_first }
              add: { insight: 3, people_support: 1, army_support: -1 }
              goto: stars_first
            - text: "북쪽 성벽을 막고 남은 돌을 나눈다"
              set: { observatory_priority: balanced }
              add: { army_support: 2, insight: 1, nobles_support: 1 }
              goto: balanced_build

  stars_first:
    actions:
      - bg:
          id: "title_palace"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "탑의 첫 층이 올라가는 동안 마을 창고에는 묽은 죽이 돌았습니다. 덕만은 공사장 불을 줄여 밤의 땔감을 보냈습니다."
      - say:
          char: "덕만"
          text: "탑은 서두르되 사람 몫은 줄이지 마. 왕실 비축부터 꺼내."
      - say:
          char: "춘추.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "이번 달은 버팁니다. 다음 달에 비가 안 오면 궁에서도 손을 벌려야 합니다."
      - say:
          channel: "narration"
          text: "관측은 한 계절 빨라졌습니다. 창고의 빈 칸도 그만큼 빨리 늘었습니다."
      - add:
          people_support: -4
          insight: 1
      - say:
          channel: "record"
          text: "통치의 대가 — 더 일찍 하늘을 읽게 됐습니다. 공사비를 낸 마을의 겨울은 길었습니다."
      - goto: "who_reads_stars"

  balanced_build:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - say:
          channel: "narration"
          text: "성벽과 관측대에 번갈아 수레가 들어갔습니다. 어느 쪽도 한 달 안에 완성되지는 않았습니다."
      - say:
          char: "춘추.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "장인들이 두 현장을 오가느라 품삯이 늘었습니다. 왕실 잔치 예산이면 메울 수 있습니다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "춘추"
          text: "올해 잔치는 취소해. 대신 현장마다 쓴 곡식과 돌을 적어."
      - say:
          channel: "narration"
          text: "조회장에 항의가 쌓였지만 마을 사람들은 번갈아 품삯을 받았습니다. 탑과 성문이 같은 겨울을 넘겼습니다."
      - add:
          nobles_support: -2
      - say:
          channel: "record"
          text: "통치의 대가 — 두 공사를 이어 갔습니다. 속도를 포기한 자리에는 왕실의 비용이 들어갔습니다."
      - goto: "who_reads_stars"

  granary_first:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "창고가 차자 마을 사람들이 곡식 자루를 품삯으로 받고 돌을 날랐습니다. 탑은 늦어졌고, 돌마다 어느 마을 손에서 왔는지 숯 글씨가 남았습니다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "장부엔 모두 자원했다고 적혔습니다. 왕의 곡식을 받으며 싫다고 말할 수 있었을까요?"
      - say:
          char: 덕만.queen_sad
          text: "온 사람만 적지 마. 안 온 마을과 그 이유도 적어. 죄는 묻지 말고."
      - goto: who_reads_stars

  who_reads_stars:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: fadeIn, layout: push, duration: 360 } }
      - say:
          camera: wide
          channel: narration
          text: "첫 관측표가 마르기도 전에 제관은 봉인 상자를 가져왔습니다. 비담은 그 상자 위에 앉아 날짜 하나를 손가락으로 가렸습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "농부가 마른 날을 알면 반란군도 마른 길을 알죠. 공개하면 저는 필요 없어집니다. 잠그면 저만 필요하고요."
      - choice:
          key: c10_knowledge_policy
          prompt: "관측표는 비와 진군로를 함께 알려 줍니다. 누구에게 공개할까요?"
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "표를 셋으로 찢어 왕실·군대·마을에 나눈다"
              set: { knowledge_policy: distributed }
              add: { nobles_support: 1, army_support: 1, people_support: 1 }
              goto: distributed_tables
            - text: "원본을 비담의 비밀 전령에게 맡긴다"
              set: { knowledge_policy: bidam_network }
              add: { bidam_trust: 3, fear: 2, evidence: 1 }
              goto: bidam_network
            - text: "그림 달력으로 바꿔 장터마다 붙인다"
              set: { knowledge_policy: public }
              add: { people_support: 3, insight: 2, nobles_support: -1 }
              goto: public_calendar

  public_calendar:
    actions:
      - sticker: { id: c10_chart, image: star_chart_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: star_chart
      - say:
          channel: narration
          text: "별 이름 옆에 씨앗과 물결 그림이 그려졌습니다. 글을 모르는 아이가 매듭 수를 세어 어른보다 먼저 강물 오를 날을 맞혔습니다."
      - clearSticker: { id: c10_chart, leave: fadeOut }
      - goto: observatory_sabotage

  distributed_tables:
    actions:
      - bg:
          id: "moon_court"
          transition: "dissolve"
          duration: 720
      - get: "star_chart"
      - say:
          channel: "narration"
          text: "관측표의 사본 세 벌이 왕실, 사찰, 마을로 갔습니다. 빠진 줄이 생기면 다른 두 벌과 맞출 수 있도록 날짜를 함께 적었습니다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "서로 답을 기다리면 제 전령보다 늦습니다. 홍수도 기다려 주겠습니까?"
      - say:
          char: "덕만.queen_angry"
          camera: "medium"
          with:
            - "비담"
          text: "대피는 먼저 해. 계산이 다른 까닭은 세 곳이 모두 남겨. 누구 탓인지보다 어디서 틀렸는지."
      - say:
          channel: "narration"
          text: "첫 정정표에는 세 필체가 남았습니다. 비담은 전령에게 봉인 대신 수정 날짜를 읽히기 시작했습니다."
      - add:
          bidam_trust: -1
      - say:
          channel: "record"
          text: "통치의 대가 — 표를 나눠 보관했습니다. 고치는 일은 느려졌지만 한 사람의 손으로 지울 수 없게 됐습니다."
      - goto: "observatory_sabotage"

  bidam_network:
    actions:
      - bg:
          id: "moon_court"
          transition: "dissolve"
          duration: 720
      - get: "star_chart"
      - say:
          channel: "narration"
          text: "비담의 전령은 비가 오기 전에 모든 마을에 닿았습니다. 원본은 왕실에 남았지만 마을 사람들은 전령이 읽어 주는 말만 들었습니다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "빠진 마을 없습니다. 원하신 속도입니다, 폐하."
      - say:
          char: "덕만.queen_sad"
          text: "네가 자리를 비워도 돌아가야 해. 암호를 풀 사람을 둘 더 가르쳐."
      - say:
          char: "비담.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "가르치겠습니다. 그래도 급한 밤에는 제 이름부터 부르시겠지요."
      - say:
          channel: "narration"
          text: "덕만은 대답하지 못했습니다. 가장 빠른 길 한가운데 비담이 서 있었습니다."
      - add:
          bidam_trust: 2
      - say:
          channel: "record"
          text: "통치의 대가 — 경보는 빨라졌습니다. 관측표를 직접 읽을 수 있는 사람은 늘지 않았습니다."
      - goto: "observatory_sabotage"

  observatory_sabotage:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - effect: embers
      - say:
          camera: wide
          channel: narration
          text: "완공 전날 밤, 탑 아래 창고에서 불이 솟았습니다. 종이 울리기도 전에 시장 반대편에서 '여왕의 별이 탔다'는 외침이 들렸습니다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "방화범은 북문으로 갑니다! 안엔 관측관 셋과 원본 표가 있습니다. 둘 다 쫓을 병력은 없습니다!"
      - choice:
          key: c10_sabotage
          prompt: "사람과 원본, 방화 흔적이 서로 다른 곳에 있습니다. 무엇부터 구할까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "국고를 열어 오늘 밤 탑을 다시 올린다"
              goto: bad_monument
            - text: "사람을 업고 원본 표를 품에 넣는다"
              add: { mercy: 2, people_support: 1, evidence: -1 }
              goto: tower_survives
            - text: "불길을 가두며 관측관을 뒷문으로 뺀다"
              add: { evidence: 2, fear: 1 }
              goto: preserve_traces

  preserve_traces:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "유신이 젖은 천으로 불길을 한쪽에 몰자 관측관들이 뒷문으로 기어 나왔습니다. 원본 표 가장자리는 탔지만 기름 묻은 발자국과 대나무 조각은 그대로 남았습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "사람은 나왔습니다. 흔적은 제가 지킵니다. 폐하도 연기 밖으로 나가십시오!"
      - say:
          char: 덕만.queen_angry
          camera: medium
          with: [유신]
          text: "발자국이 지워지면 다음 불도 못 막아. 저 대나무만 집고 나갈게."
      - say:
          channel: narration
          text: "덕만이 대나무를 집는 순간 기름통이 다시 터졌습니다. 방화범은 증거를 지키려 남을 사람까지 계산해 두었고, 두 번째 불길이 덕만의 퇴로를 삼켰습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "첨성대 방화 기록 — 관측관 전원 구조. 선덕왕은 방화 증거를 회수하다 화재 현장에서 사망."
      - gameOver:
          title: "운명 — 두 번째 불길의 증거"
          message: "사람을 내보낸 뒤 다시 만들 수 있는 흔적을 직접 지키려 남았습니다. 방화범이 준비한 두 번째 기름통이 터졌고 덕만은 증거를 손에 쥔 채 불 속에서 죽었습니다."
          recoverToChoice: c10_sabotage

  tower_survives:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "첨성대는 늦게 완성됐습니다. 한쪽 돌은 검게 탔고 관측표에는 물에 번진 숫자를 다시 쓴 흔적이 남았습니다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          char: 덕만
          camera: medium
          text: "이 탑은 내 운세를 보는 곳이 아니다. 내가 죽은 뒤에도 비를 읽고, 틀린 숫자를 고치는 곳이다."
      - branch:
          cases:
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: monopolized_tower
          default: challenged_network

  challenged_network:
    actions:
      - say:
          channel: narration
          text: "아이들이 탑 아래서 서로 다른 표를 맞췄습니다. 숫자가 어긋나자 왕실 관측관에게 틀렸다고 소리쳤고, 관측관은 사람들 앞에서 먹으로 수를 고쳤습니다."
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "아이도 읽고 관측관에게 틀렸다 하는군요. 제가 목숨 걸고 나르던 날짜가 벽보 한 장이 됐습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "네가 없어도 표를 읽는 것과 널 버리는 건 달라. 하지만 필요할 때만 네 이름을 부른 건… 미안해."
      - say:
          channel: narration
          text: "비담은 인사도 없이 계단을 내려갔습니다. 그날 밤 북쪽 봉화가 모두 꺼졌고, 잿더미에서는 그의 전령 매듭과 기름 먹인 대나무 조각이 나왔습니다."
      - goto: observatory_end

  monopolized_tower:
    actions:
      - say:
          channel: narration
          text: "불을 끄는 와중에도 관측표를 꺼낼 관리들은 비담의 허가를 기다렸습니다. 탑은 왕의 것이었지만 문 앞 명부에는 비담의 글씨만 가득했습니다."
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "폐하가 가장 빠른 길을 원하셨고, 저는 유일한 문이 됐습니다. 이제 와 제가 앞을 가렸다고 하십니까?"
      - say:
          char: 덕만.queen_sad
          camera: medium
          with: [비담]
          text: "빠르다는 이유로 네게 나라만 한 문을 줬어. 내 잘못이다. 표를 베끼고 전령 장부도 함께 열게 하겠다."
      - say:
          channel: narration
          text: "비담의 입가에서 웃음이 사라졌습니다. 그날 밤 북쪽 봉화가 모두 꺼졌고, 잿더미에서는 그의 전령 매듭과 기름 먹인 대나무 조각이 나왔습니다."
      - goto: observatory_end

  observatory_end:
    actions:
      - say:
          channel: record
          text: "덕만은 별을 읽을 사람을 늘리거나, 자신이 만든 독점을 뒤늦게 해체하려 했습니다. 그러나 비담에게 권한은 이미 충성과 사랑의 증명이었고, 문을 나누는 명령은 자신을 지우는 판결처럼 들렸습니다."
      - goto: /10.yaml

  bad_monument:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: center, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.queen_angry
          text: "국고를 열어. 오늘 밤 돌을 다시 올린다. 내 뜻을 꺾었다고 믿게 두지 마."
      - say:
          channel: narration
          text: "돌을 다시 세우라는 명령에 인부들이 몰리는 동안 관측관을 꺼낼 손이 늦었습니다. 불탄 시신이 탑 아래 놓이자 방화범은 '여왕이 돌을 위해 사람을 태웠다'는 벽보를 먼저 붙였습니다."
      - say:
          char: 춘추.nervous
          text: "흔적도 돌도 남았습니다. 하지만 시신을 본 군사들이 성문을 엽니다. 명령이 움직이지 않습니다."
      - say:
          channel: record
          text: "선덕왕 원년 — 첨성대 방화 뒤 군영 반란. 선덕왕은 북문으로 피신하던 중 피살되고 관측표 원본은 소각됨."
      - gameOver:
          title: "운명 — 사람보다 먼저 지킨 것"
          message: "왕의 기념비는 다시 세울 수 있어도 불 속의 사람은 되돌릴 수 없었습니다. 덕만은 무너진 권위를 하룻밤에 복구하려다 사람을 잃었고, 그날 밤 반란군에게 죽었습니다."
