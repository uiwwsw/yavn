chapterTitle: "별을 세우는 사람"

script:
  - scene: queens_first_winter

scenes:
  queens_first_winter:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제10장 — 별을 세우는 사람"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 춘추, position: right }
      - say:
          channel: action
          text: "성벽에서 깨진 돌과 강가에서 닳은 돌이 상에 놓였다. 둘을 만져 본다. 똑같이 차다. 국고 장부에는 공사 하나를 끝낼 곡식만 남아 있다."
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "성벽도 물막이도 급합니다. 적이 먼저 올지 큰물이 먼저 올지, 그것만은 못 적겠습니다."
      - say:
          char: 덕만
          camera: medium
          with: [춘추]
          text: "기다려야 할 쪽을 적어라. 완공했다는 보고 옆에 함께 두겠다."
      - choice:
          key: c10_observatory_priority
          prompt: "장부 끝을 다시 넘겨도 쓸 곡식은 늘지 않는다."
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "창고를 채우고 돌 나를 품삯을 곡식으로 준다"
              set: { observatory_priority: granary_first }
              add: { people_support: 3, insight: 1, fear: 1 }
              goto: granary_first
            - text: "남쪽 돌을 골라 첨성대부터 올린다"
              set: { observatory_priority: stars_first }
              add: { insight: 3, people_support: 1, army_support: -1 }
              goto: stars_first
            - text: "북쪽 성벽을 막고 남은 돌을 나눈다"
              set: { observatory_priority: balanced }
              add: { army_support: 2, insight: 1, nobles_support: 1 }
              goto: balanced_build

  stars_first:
    actions:
      - bg:
          id: "title_palace"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "탑의 첫 단이 올라갔다. 마을에서는 죽에 물을 한 바가지 더 부었다. 덕만은 공사장 밤불을 줄이고 남은 땔감을 마을로 보냈다."
      - say:
          char: "덕만"
          text: "사람 먹일 것까지 아끼지는 마라. 궁의 비축을 열어라."
      - say:
          char: "춘추.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "이번 달은 됩니다. 다음 달에도 비가 안 오면 궁에도 남는 것이 없습니다."
      - say:
          channel: "narration"
          text: "관측관은 한 계절 일찍 탑에 올랐다. 창고지기는 한 달 일찍 빈칸을 세기 시작했다."
      - add:
          people_support: -4
          insight: 1
      - say:
          channel: thought
          text: "관측은 빨라졌다. 오늘 죽을 받은 아이 얼굴은 나아지지 않았다. 내년을 보라고 말할 수가 없다."
      - goto: "who_reads_stars"

  balanced_build:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - say:
          channel: "narration"
          text: "같은 수레가 성벽과 탑 사이를 오갔다. 장인들은 연장을 실었다 내렸다 했다. 한 달이 지나도 두 곳 모두 공사가 남았다."
      - say:
          char: "춘추.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "오가는 품이 두 배입니다. 왕실 잔치를 거두시면 모자란 품삯은 메울 수 있습니다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "춘추"
          text: "거두어라. 이미 부른 악공들에게는 품삯을 주고. 공사 장부는 따로 올려라."
      - say:
          channel: "narration"
          text: "잔치를 기다리던 귀족들이 항의했다. 공사장에서는 번갈아 품삯이 나갔다. 미완성인 탑과 성벽 사이로 첫눈이 내렸다."
      - add:
          nobles_support: -2
      - say:
          channel: thought
          text: "어느 쪽도 다 짓지 못했다. 그래도 망치 소리는 끊기지 않는다. 서두르라던 말을 삼킨다."
      - goto: "who_reads_stars"

  granary_first:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: action
          text: "돌을 나른 이들에게 곡식을 준다. 한 사내가 자루를 내려놓고 다음 돌을 멘다. 탑이 늦어진다고 했더니, 저녁에는 다시 오겠다고 한다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "자원했다 적었으나, 굶은 이가 왕의 곡식 앞에서 싫다 할 수 있었겠습니까."
      - say:
          char: 덕만.queen_sad
          text: "오지 않은 마을도 적어라. 왜 못 왔는지 물어보고. 벌주러 간 줄 알게 하지 말고."
      - goto: who_reads_stars

  who_reads_stars:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 비담, position: right, emotion: smirk, enter: { effect: fadeIn, layout: push, duration: 360 } }
      - say:
          camera: wide
          channel: action
          text: "새 관측표를 펴자 비담이 봉인함을 가져다 놓는다. 긴 손가락이 날짜 하나를 가린다. 나는 그 손이 떨어지기를 기다린다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "농부만 보는 표가 아닙니다. 반란군도 마른 길을 읽겠지요. 그래도 여시겠습니까?"
      - choice:
          key: c10_knowledge_policy
          prompt: "비담의 손 아래에 다음 큰물 날짜가 가려져 있다."
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "표를 셋으로 찢어 왕실·군대·마을에 나눈다"
              set: { knowledge_policy: distributed }
              add: { nobles_support: 1, army_support: 1, people_support: 1 }
              goto: distributed_tables
            - text: "원본을 비담의 비밀 전령에게 맡긴다"
              set: { knowledge_policy: bidam_network }
              add: { bidam_trust: 3, fear: 2, evidence: 1 }
              goto: bidam_network
            - text: "그림 달력으로 바꿔 장터마다 붙인다"
              set: { knowledge_policy: public }
              add: { people_support: 3, insight: 2, nobles_support: -1 }
              goto: public_calendar

  public_calendar:
    actions:
      - sticker: { id: c10_chart, image: star_chart_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: star_chart
      - say:
          channel: action
          text: "씨앗 그림 옆에 물결을 그린다. 아이가 매듭을 세더니 큰물이 올 날을 짚는다. 내가 입을 열자 아이가 먼저 맞느냐고 묻는다."
      - clearSticker: { id: c10_chart, leave: fadeOut }
      - goto: observatory_sabotage

  distributed_tables:
    actions:
      - bg:
          id: "moon_court"
          transition: "dissolve"
          duration: 720
      - get: "star_chart"
      - say:
          channel: "narration"
          text: "같은 표 세 벌이 궁과 사찰과 마을로 갔다. 덕만은 베끼는 이들에게 빈칸도 그대로 남기라 했다. 모르는 수를 누가 채웠는지 알아야 했다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "세 곳 답을 기다리는 동안 물이 불면요? 전령 하나면 벌써 갔을 길입니다."
      - say:
          char: "덕만.queen_angry"
          camera: "medium"
          with:
            - "비담"
          text: "대피는 먼저 시켜라. 서로 다른 수는 지우지 말고 남겨. 나중에 맞춰 볼 테니."
      - say:
          channel: "narration"
          text: "첫 정정표에 세 사람의 글씨가 남았다. 비담은 봉인된 함 대신 수정한 날짜를 전령에게 읽혔다. 그 날짜를 두 번 확인했다."
      - add:
          bidam_trust: -1
      - say:
          channel: thought
          text: "고친 수 하나 옆에 이름이 셋이다. 늦긴 하다. 그러나 누가 고쳤느냐는 물음에 이제 나만 답하지 않아도 된다."
      - goto: "observatory_sabotage"

  bidam_network:
    actions:
      - bg:
          id: "moon_court"
          transition: "dissolve"
          duration: 720
      - get: "star_chart"
      - say:
          channel: "narration"
          text: "비담의 전령이 비 오기 전에 모든 마을에 닿았다. 사람들은 들은 말을 외워 이웃에게 전했다. 전령이 떠난 뒤 다시 읽어 볼 표는 남지 않았다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "마지막 마을까지 닿았습니다. 폐하께서 정하신 때보다 반나절 빠릅니다."
      - say:
          char: "덕만.queen_sad"
          text: "네가 아파도 갈 수 있어야 한다. 암호 읽을 사람을 둘 더 길러라."
      - say:
          char: "비담.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "그러지요. 그래도 밤중에 급해지시면, 저를 찾으실 겁니다."
      - say:
          channel: "narration"
          text: "덕만이 대답을 고르는 동안 비담은 이미 다음 전령을 불렀다. 덕만에게 묻고 가는 사람은 없었다."
      - add:
          bidam_trust: 2
      - say:
          channel: thought
          text: "경보는 닿았다. 그런데 비가 언제 그치느냐고 물으니 다들 전령 오는 길만 본다."
      - goto: "observatory_sabotage"

  observatory_sabotage:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - effect: embers
      - say:
          camera: wide
          channel: action
          text: "탑 밑에서 타는 냄새가 올라온다. 아직 종도 울리지 않았다. 시장 쪽에서 여왕의 별이 탔다고 외친다. 불보다 소문이 먼저 가 있다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "관측관 셋이 안에 있습니다! 방화범은 북문으로 갔습니다. 사람부터 꺼내겠습니다!"
      - choice:
          key: c10_sabotage
          prompt: "탑 안에서 기침이 들린다. 불길 옆에 원본 함이 있다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "국고를 열어 오늘 밤 탑을 다시 올린다"
              goto: bad_monument
            - text: "사람을 업고 원본 표를 품에 넣는다"
              add: { mercy: 2, people_support: 1, evidence: -1 }
              goto: tower_survives
            - text: "불길을 가두며 관측관을 뒷문으로 뺀다"
              add: { evidence: 2, fear: 1 }
              goto: preserve_traces

  preserve_traces:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "젖은 천 뒤로 관측관들이 기어 나왔다. 표의 가장자리가 타들어 갔다. 바닥에는 기름 묻은 발자국과 짧은 대나무가 남았다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "셋 다 나왔습니다! 폐하, 손을 주십시오. 여기서 나오셔야 합니다!"
      - say:
          char: 덕만.queen_angry
          camera: medium
          with: [유신]
          text: "저 대나무만. 발에 채이기 전에 그것만 집고—"
      - say:
          channel: narration
          text: "덕만의 손이 바닥에 닿자 뒤에서 기름통이 터졌다. 유신이 뻗은 팔을 불길이 갈랐다. 덕만은 대나무를 놓고 얼굴을 가렸다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "첨성대 방화 기록 — 관측관 전원 구조. 선덕왕은 방화 증거를 회수하다 화재 현장에서 사망."
      - gameOver:
          title: "운명 — 두 번째 불길의 증거"
          message: "관측관들은 모두 나왔다. 유신은 탑 쪽으로 돌아 뛰었으나 두 번째 불길을 넘지 못했다."
          recoverToChoice: c10_sabotage

  tower_survives:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: action
          text: "살아 나온 관측관이 젖은 표를 편다. 재 묻은 손가락으로 번진 수를 짚는다. 나는 새 종이를 내어 준다. 모르는 곳은 비워 두라 말한다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          char: 덕만
          camera: medium
          text: "사람부터 쉬게 하라. 잃은 수는 내일부터 다시 재면 된다. 내 운세부터 묻지는 않을 테니."
      - branch:
          cases:
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: monopolized_tower
          default: challenged_network

  challenged_network:
    actions:
      - say:
          channel: narration
          text: "아이들이 표를 맞춰 보다가 수 하나가 다르다고 외쳤다. 관측관이 내려와 한참 들여다보았다. 아이가 짚은 곳에 새 먹이 놓였다."
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "아이 손에까지 갔군요. 제가 품속에 숨겨 나르던 것이."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "비담아. 이제 숨기지 않아도 돼. 너도 밤마다 길에 나서지 않아도 되고."
      - say:
          channel: narration
          text: "비담은 대답 없이 계단을 내려갔다. 그날 밤 북쪽 봉화가 꺼졌다. 잿더미에서 기름 먹인 대나무와 전령 매듭이 나왔다. 덕만은 사람들을 물리고 다시 살폈다."
      - goto: observatory_end

  monopolized_tower:
    actions:
      - say:
          channel: narration
          text: "불을 끄다가도 관리들은 함 앞에서 멈췄다. 비담의 허락을 기다린다고 했다. 덕만은 제 눈앞의 함을 열라는 말을 두 번 해야 했다."
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "급하다 하실 때마다 제가 열었지요. 이제 문 앞에서 비키라 하시는군요."
      - say:
          char: 덕만.queen_sad
          camera: medium
          with: [비담]
          text: "모두 네게 맡긴 건 나다. 하지만 이대로 둘 순 없어. 표와 전령 명부를 내어라."
      - say:
          channel: narration
          text: "비담의 입가가 굳었다. 그날 밤 북쪽 봉화가 꺼졌다. 잿더미에서 기름 먹인 대나무와 매듭이 나왔다. 그의 전령들이 쓰는 매듭이었다."
      - goto: observatory_end

  observatory_end:
    actions:
      - say:
          channel: thought
          text: "비담이 나간 문이 덜 닫혔다. 부를까 하다가 만다. 한동안 그 틈으로 찬바람이 들어온다."
          with: []
          camera: wide
          continueLabel: 꺼진 북쪽 봉화를 확인하러 나간다
      - goto: /10.yaml

  bad_monument:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 덕만, position: center, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.queen_angry
          text: "국고를 열어라. 오늘 밤 다시 올린다. 저들이 무너뜨린 채로 날을 밝히지 않겠다."
      - say:
          channel: narration
          text: "돌을 나를 인부들이 몰렸다. 관측관을 꺼낼 사다리는 그 뒤에 들어왔다. 탑 아래 세 사람을 눕혔을 때, 시장에는 벌써 벽보가 붙고 있었다."
      - say:
          char: 춘추.nervous
          text: "성문 병사들이 돌아섭니다. 죽은 이들 가족이 문 앞에 왔습니다. 폐하, 나가셔야 합니다."
      - say:
          channel: record
          text: "선덕왕 원년 — 첨성대 방화 뒤 군영 반란. 선덕왕은 북문으로 피신하던 중 피살되고 관측표 원본은 소각됨."
      - gameOver:
          title: "운명 — 사람보다 먼저 지킨 것"
