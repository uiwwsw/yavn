script:
  - scene: queens_first_winter

scenes:
  queens_first_winter:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제10장 — 별을 세우는 사람"
      - char: { id: 덕만, position: left }
      - char: { id: 춘추, position: right }
      - say:
          channel: narration
          text: "즉위 첫겨울, 왕좌 앞에 두 돌이 놓였습니다. 하나는 무너진 북쪽 성벽에서, 하나는 지난해 홍수에 잠긴 남쪽 마을에서 왔습니다. 국고 상자에는 둘 중 한쪽 공사비밖에 남지 않았습니다."
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "성벽을 늦추면 적이 옵니다. 관측대를 늦추면 물이 옵니다. 어느 쪽이 먼저 올지는 아무도 모릅니다."
      - say:
          char: 덕만
          camera: close
          with: [춘추]
          text: "첫 삽을 뜨기도 전에 한쪽 사람에게 기다리라고 해야 하는군. 무엇을 세웠는지만 말고, 무엇을 늦췄는지도 적어."
      - choice:
          key: c10_observatory_priority
          prompt: "두 돌 사이에 국고 열쇠가 놓인다. 어느 쪽으로 밀까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "남쪽 돌을 골라 첨성대부터 올린다"
              set: { observatory_priority: stars_first }
              add: { insight: 3, people_support: 1, army_support: -1 }
              goto: stars_first
            - text: "북쪽 성벽을 막고 남은 돌을 나눈다"
              set: { observatory_priority: balanced }
              add: { army_support: 2, insight: 1, nobles_support: 1 }
              goto: balanced_build
            - text: "창고를 채우고 돌 나를 품삯을 곡식으로 준다"
              set: { observatory_priority: granary_first }
              add: { people_support: 3, insight: 1, fear: 1 }
              goto: granary_first

  stars_first:
    actions:
      - bg: title_palace
      - say:
          channel: narration
          text: "관측대가 왕궁 처마를 넘을 때 북쪽에서 깨진 방패가 도착했습니다. 군관은 방패에 '별이 성문을 지켜 주느냐'고 새겨 보냈습니다."
      - say:
          char: 덕만
          text: "저 방패도 탑 아래 걸어. 내가 별을 고른 날 누가 기다렸는지 지우지 마."
      - goto: who_reads_stars

  balanced_build:
    actions:
      - bg: frontier
      - say:
          channel: narration
          text: "성벽 틈은 겨우 막혔고 관측대는 계획보다 절반 높이에서 멈췄습니다. 군사와 관측관은 남은 돌 한 장을 두고 매일 얼굴을 마주쳐야 했습니다."
      - goto: who_reads_stars

  granary_first:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "창고가 차자 마을 사람들이 곡식 자루를 품삯으로 받고 돌을 날랐습니다. 탑은 늦어졌고, 돌마다 어느 마을 손에서 왔는지 숯 글씨가 남았습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "장부에는 모두 자원했다고 쓰였습니다. 하지만 왕의 공사 앞에서 정말 '싫다'고 말할 수 있었을까요?"
      - say:
          char: 덕만.sad
          text: "오지 않은 마을도 적어. 빠진 이름을 죄로 만들지 말고."
      - goto: who_reads_stars

  who_reads_stars:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "첫 관측표가 마르기도 전에 제관은 봉인 상자를 가져왔습니다. 비담은 그 상자 위에 앉아 날짜 하나를 손가락으로 가렸습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "농부에게 비 없는 날을 주면 반란군도 진흙 없는 길을 얻습니다. 문을 잠그면 제가 열어 드릴 수 있고요. 어느 위험이 더 마음에 드십니까?"
      - choice:
          key: c10_knowledge_policy
          prompt: "첫 별자리표를 두고 세 손이 뻗는다. 누구에게 건넬까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "그림 달력으로 바꿔 장터마다 붙인다"
              set: { knowledge_policy: public }
              add: { people_support: 3, insight: 2, nobles_support: -1 }
              goto: public_calendar
            - text: "표를 셋으로 찢어 왕실·군대·마을에 나눈다"
              set: { knowledge_policy: distributed }
              add: { nobles_support: 1, army_support: 1, people_support: 1 }
              goto: distributed_tables
            - text: "원본을 비담의 비밀 전령에게 맡긴다"
              set: { knowledge_policy: bidam_network }
              add: { bidam_trust: 3, fear: 2, evidence: 1 }
              goto: bidam_network

  public_calendar:
    actions:
      - sticker: { id: c10_chart, image: star_chart_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: star_chart
      - say:
          channel: narration
          text: "별 이름 옆에 씨앗과 물결 그림이 그려졌습니다. 글을 모르는 아이가 매듭 수를 세어 어른보다 먼저 강물 오를 날을 맞혔습니다."
      - clearSticker: { id: c10_chart, leave: fadeOut }
      - goto: observatory_sabotage

  distributed_tables:
    actions:
      - get: star_chart
      - say:
          channel: narration
          text: "군대는 바람, 마을은 비, 왕실은 계산식을 가져갔습니다. 누구도 전부 갖지 못했고, 셋이 같은 탁자에 앉아야 다음 계절을 읽을 수 있었습니다."
      - goto: observatory_sabotage

  bidam_network:
    actions:
      - get: star_chart
      - say:
          channel: narration
          text: "비담의 전령은 홍수보다 하루 먼저 달렸고 적군보다 밤 하나 빨랐습니다. 곧 관리들은 왕의 문보다 비담의 처소 앞에 먼저 줄을 섰습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "걱정하지 마십시오. 이 문 열쇠는 폐하를 위해서만 돌립니다."
      - say:
          char: 덕만.sad
          text: "그 말이 위로로 들리는 동안만 안전하겠지."
      - goto: observatory_sabotage

  observatory_sabotage:
    actions:
      - bg: title_palace
      - camera: wide
      - effect: embers
      - say:
          channel: narration
          text: "완공 전날 밤, 탑 아래 창고에서 불이 솟았습니다. 종이 울리기도 전에 시장 반대편에서 '여왕의 별이 탔다'는 외침이 들렸습니다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "방화범이 북문으로 갑니다! 하지만 안에 관측관 셋과 원본 표가 있습니다!"
      - choice:
          key: c10_sabotage
          prompt: "지붕이 무너진다. 불 속에서 무엇을 먼저 끌어낼까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "사람을 업고 원본 표를 품에 넣는다"
              add: { mercy: 2, people_support: 1, evidence: -1 }
              goto: tower_survives
            - text: "불길을 가두고 현장의 발자국을 지킨다"
              add: { evidence: 2, fear: 1 }
              goto: tower_survives
            - text: "국고를 열어 오늘 밤 탑을 다시 올린다"
              goto: bad_monument

  tower_survives:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대는 늦게 완성됐습니다. 한쪽 돌은 검게 탔고 관측표에는 물에 번진 숫자를 다시 쓴 흔적이 남았습니다."
      - char: { id: 덕만, position: center }
      - say:
          char: 덕만
          camera: close
          text: "이 탑은 내 운명을 찾는 곳이 아니다. 나 없이도 내일 비가 오는지 알게 하려고 세운 것이다."
      - branch:
          cases:
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: monopolized_tower
          default: challenged_network

  challenged_network:
    actions:
      - say:
          channel: narration
          text: "아이들이 탑 아래서 서로 다른 표를 맞췄습니다. 숫자가 어긋나자 왕실 관측관에게 틀렸다고 소리쳤고, 관측관은 사람들 앞에서 먹으로 수를 고쳤습니다."
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "아이도 읽는 표라… 제가 목숨 걸고 가져온 날짜도 이제 벽보 한 장 값이군요. 폐하께선 사람 대신 누구든 갈아 끼울 자리를 택하셨습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "너를 버리는 게 아니야. 하지만 네가 사라지면 나라가 멈추는 건 더 두고 볼 수 없어. 나도 마찬가지고."
      - say:
          channel: narration
          text: "비담은 인사도 없이 계단을 내려갔습니다. 그날 밤 북쪽 봉화가 모두 꺼졌고, 잿더미에서는 그의 전령 매듭과 기름 먹인 대나무 조각이 나왔습니다."
      - goto: observatory_end

  monopolized_tower:
    actions:
      - say:
          channel: narration
          text: "불을 끄는 와중에도 관측표를 꺼낼 관리들은 비담의 허가를 기다렸습니다. 탑은 왕의 것이었지만 문 앞 명부에는 비담의 글씨만 가득했습니다."
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "폐하께서 빠른 길을 원하셨습니다. 문을 하나만 두었고, 제가 밤낮으로 지켰습니다. 이제 와 문이 좁다 하십니까?"
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "내가 네게 너무 큰 문을 줬어. 오늘부터 표를 베끼고, 네 전령 장부도 두 사람이 함께 연다."
      - say:
          channel: narration
          text: "비담의 입가에서 웃음이 사라졌습니다. 그날 밤 북쪽 봉화가 모두 꺼졌고, 잿더미에서는 그의 전령 매듭과 기름 먹인 대나무 조각이 나왔습니다."
      - goto: observatory_end

  observatory_end:
    actions:
      - say:
          channel: record
          text: "덕만은 별을 읽을 사람을 늘리거나, 자신이 만든 독점을 뒤늦게 해체하려 했습니다. 어느 길에서도 지식의 문을 지키던 가장 가까운 신하와의 충돌은 피할 수 없었습니다."
      - goto: /10.yaml

  bad_monument:
    actions:
      - bg: title_palace
      - camera: close
      - effect: darken
      - char: { id: 덕만, position: center, emotion: angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.angry
          text: "오늘 밤 더 높은 탑을 세운다. 누구도 여왕의 뜻을 꺾지 못한다는 것을 보여라."
      - say:
          channel: narration
          text: "병사와 백성이 밤새 돌을 날랐습니다. 사흘 뒤 탑은 전보다 높아졌지만 국고의 구휼미와 성벽 보수금이 모두 사라졌습니다."
      - say:
          char: 춘추.nervous
          text: "탑은 남았습니다. 하지만 북쪽 성문과 남쪽 창고가 동시에 열렸습니다."
      - say:
          channel: record
          text: "선덕왕 원년 — 첨성대 완공. 같은 달 국경 성 함락과 구휼 창고 폐쇄로 지방 세 곳이 왕명을 거부함."
      - gameOver:
          title: "운명 — 나라보다 높은 기념비"
          message: "덕만은 방화를 이겼지만 첨성대를 자신의 권위와 같은 것으로 만들었습니다. 별을 위한 탑은 남고 그 별을 읽을 나라는 갈라졌습니다."
