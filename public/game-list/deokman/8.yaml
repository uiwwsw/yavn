script:
  - scene: king_last_night

scenes:
  king_last_night:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제9장 — 왕좌 앞의 밤"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "진평왕의 숨이 가늘어질수록 왕좌 뒤의 발소리들이 빨라졌습니다. 상복을 준비하는 손보다 새벽 표결 문서를 접는 손이 더 바빴습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "내가 마지막 숨으로 널 지명하면 저들은 여왕을 막는 대신 폭군의 유언을 막았다고 쓰겠지. 내 죽음에 업혀 오지 마라. 네가 살리고 설득하고 때로 잃은 사람들과 걸어와."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지의 마지막 숨을 왕관값으로 팔지 않겠습니다. 대신 아버지가 내준 열쇠와 붓, 그 때문에 죽고 굶은 이름까지 제 짐으로 들고 가겠습니다."
      - say:
          when: { var: king_trust, op: gte, value: 3 }
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "네가 나를 감춘 날도 사람들 앞에 세운 날도 모두 기억한다. 둘 다 나를 살리려 한 판단이었지. 이제 내 허락을 찾지 말고, 네 판단이 치를 값까지 보거라."
      - say:
          channel: narration
          text: "그 말을 들은 뒤에야 진평왕의 숨이 멎었습니다. 새벽 표결을 알리는 북이 곧바로 울렸고, 성문과 군량 창고 쪽에서는 귀족 사병의 횃불이 움직였습니다."
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: exile }
          channel: record
          text: "국경 구휼소에서 천명의 서신이 도착했습니다. '내 표는 줄 수 없지만, 내가 맡은 마을 이름은 네 편에 세우겠다.'"
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
          channel: narration
          text: "비밀문 너머에서 천명이 표결 명단을 읽어 주었습니다. 그러나 살아 있는 언니의 조언은 문밖에서 증언이 될 수 없었습니다."
      - goto: vote_strategy

  vote_strategy:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "회의장 문이 곧 닫힙니다. 장부는 사실을 무겁게 만들고, 궁 밖 이름은 문을 흔들고, 유신의 군사는 침묵해도 위협으로 보입니다. 무엇을 덕만 공주보다 먼저 들일지 정하셔야 합니다."
      - say:
          when: { var: chunchu_trust, op: gte, value: 1 }
          char: 춘추
          camera: close
          with: [덕만]
          text: "어머니의 위조 자백문을 함께 읽은 뒤로 저는 공주님이 사람과 증거 중 무엇을 먼저 놓는지 보았습니다. 오늘은 제 이름과 책임도 그 옆에 놓겠습니다."
      - say:
          when: { var: chunchu_trust, op: lte, value: -1 }
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "어머니를 다시 비밀문 뒤에 숨긴 선택을 저는 아직 믿지 못합니다. 그래도 오늘 표결의 거짓말은 같이 막겠습니다."
      - choice:
          key: c9_vote_strategy
          prompt: "왕의 유언 없이 맞는 첫 표결. 덕만의 이름보다 먼저 무엇이 방 안의 기준이 될까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "위조 기록과 곡식 장부를 상 위에 쏟는다"
              when: { var: evidence, op: gte, value: 5 }
              add: { nobles_support: 2, fear: 1 }
              goto: evidence_vote
            - text: "마을 대표들의 이름을 궁문에서 부른다"
              when: { var: people_support, op: gte, value: 5 }
              add: { people_support: 2, nobles_support: -1 }
              goto: people_vote
            - text: "유신의 군사에게 칼집을 봉하게 한다"
              when: { var: army_support, op: gte, value: 4 }
              add: { army_support: 2, fear: 2 }
              goto: guarded_vote
            - text: "왕이 되어도 회의를 닫지 않겠다고 서명한다"
              add: { nobles_support: 2, insight: 1 }
              goto: negotiated_vote

  evidence_vote:
    actions:
      - sticker: { id: c9_ledger, image: grain_ledger_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          camera: medium
          text: "제가 여왕이 되는 것을 반대해도 좋습니다. 다만 이 장부로 사람을 굶긴 손은 표결 탁자에서 먼저 떼십시오. 훔친 곡식으로 산 표가 왕을 고르게 두진 않겠습니다."
      - say:
          channel: narration
          text: "장부가 바닥을 미끄러지자 몇몇 귀족이 손을 소매 안으로 감췄습니다. 찬성은 아니었지만 누구도 먼저 반대표를 들지 못했습니다."
      - clearSticker: { id: c9_ledger, leave: fadeOut }
      - goto: coup_begins

  people_vote:
    actions:
      - say:
          channel: narration
          text: "궁문 밖에서 마을 이름이 하나씩 불렸습니다. 사람들은 덕만 만세 대신 자기 창고와 죽은 가족의 이름을 외쳤습니다. 귀족이 '폭도'라 부를 때마다 새로운 마을이 대답했습니다."
      - say:
          char: 덕만
          text: "표는 이 방 안 귀족에게 있습니다. 하지만 그 결과로 굶고 싸울 사람은 문밖에 있습니다. 문을 닫겠다면 적어도 저 이름과 대답까지 회의록에 들이십시오."
      - goto: coup_begins

  guarded_vote:
    actions:
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "병사들은 칼집을 밧줄로 묶고 회의장에 섰습니다. 칼은 나오지 않았지만 귀족들의 눈은 투표 항아리보다 병사 수를 더 오래 셌습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘 제 병사들의 칼은 묶였습니다. 그래도 반대표를 든 자들은 칼집보다 군사 수를 기억하고, 평생 협박받았다고 말할 겁니다."
      - goto: coup_begins

  negotiated_vote:
    actions:
      - say:
          channel: narration
          text: "덕만이 공개 회의를 닫지 않겠다고 피로 서명하자 흩어진 표가 돌아왔습니다. 왕관을 보기도 전에 첫 매듭이 그 안쪽에 묶였습니다."
      - goto: coup_begins

  coup_begins:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "첫 표가 항아리 바닥에 닿는 소리와 동시에 서문에서 불기둥이 올랐습니다. 위조 왕명을 든 병사들이 덕만의 이름을 외치며 회의장으로 달려왔습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "서문으로 가면 표결이 비고, 여기 남으면 불이 시장과 곡식 창고까지 갑니다. 한 사람의 명령으로 두 곳을 지킬 병력은 없습니다. 나누어 주십시오!"
      - choice:
          key: c9_coup_response
          prompt: "왕관을 정할 항아리와 왕이 지켜야 할 시장이 동시에 탄다. 책임을 어떻게 나눌까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "유신을 서문으로 보내고 항아리 곁에 남는다"
              add: { yushin_trust: 2, army_support: 1, nobles_support: 1 }
              goto: split_defense
            - text: "항아리를 버리고 전부 시장으로 달린다"
              add: { people_support: 3, nobles_support: -1, mercy: 1 }
              goto: save_market
            - text: "위조 왕명으로 반란군을 빈 창고에 모은다"
              when: { var: insight, op: gte, value: 4 }
              add: { evidence: 2, fear: 2, bidam_trust: 1 }
              goto: false_order
            - text: "홀로 왕좌에 앉아 진짜 왕명을 외친다"
              goto: bad_lonely_throne

  split_defense:
    actions:
      - say:
          channel: narration
          text: "유신의 말발굽이 서문으로 사라졌습니다. 덕만은 연기가 들어오는 회의장에서 항아리를 끌어안았습니다. 새벽 직전, 피 묻은 유신이 진짜 인장을 던져 넣었습니다."
      - goto: final_ballot

  save_market:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "덕만이 항아리를 놓고 물동이를 들었습니다. 종이를 쥐던 귀족 손과 장터 사람의 손이 같은 줄에서 물을 넘겼습니다. 표는 바닥에 흩어졌지만 불길은 시장 앞에서 멈췄습니다."
      - say:
          channel: narration
          text: "덕만이 돌아왔을 때 첫 표결은 무효가 되어 있었습니다. 대신 불을 끈 상인들이 궁문 앞에 남아 새 표결을 지켜보겠다고 버텼습니다. 왕관은 멀어졌지만 회의장 문은 다시 열렸습니다."
      - goto: final_ballot

  false_order:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "덕만이 위조 인장을 다시 눌렀습니다. 반란 지휘부는 빈 창고에서 서로를 발견했고, 싸움은 짧게 끝났습니다. 젖은 인주가 덕만 손에서도 마르고 있었습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "오늘은 어린 날 공주님을 죽인 위조가 사람을 살렸습니다. 하지만 가짜 인장을 본 병사들은 내일 진짜 명령도 한 번 더 멈춰 읽을 겁니다."
      - goto: final_ballot

  final_ballot:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "동이 틀 무렵 금 간 항아리가 다시 세워졌습니다. 마지막 세 표는 접히지 않은 채 춘추의 손에 남아 있었습니다."
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: close
          with: [덕만]
          text: "이 세 표는 공짜로 움직이지 않습니다. 왕관 뒤에서 몰래 빚지 말고, 무엇을 내주고 누가 감시할지 지금 모두 앞에서 말하십시오."
      - choice:
          key: c9_crown_terms
          prompt: "왕관까지 남은 세 표는 통치의 첫 빚이다. 공개해서 바꿀 수 있는 어떤 조건으로 받을까?"
          char: 덕만
          camera: close
          with: [춘추]
          options:
            - text: "귀족 회의에 군량 장부를 맡긴다"
              set: { coronation_compromise: nobles_audit }
              add: { nobles_support: 3, army_support: -1 }
              goto: coronation
            - text: "유신의 지휘패를 해마다 다시 심사한다"
              set: { coronation_compromise: reviewed_army }
              add: { army_support: 2, yushin_trust: 1, nobles_support: -1 }
              goto: coronation
            - text: "시장과 마을 자리를 회의장에 비워 둔다"
              set: { coronation_compromise: public_council }
              add: { people_support: 2, nobles_support: -2, insight: 1 }
              goto: coronation

  coronation:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: record
          delivery: calm
          text: "선덕왕 즉위 — 왕실 기록에서 죽었던 둘째 공주 덕만이 신라의 왕이 되다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          channel: narration
          text: "왕관이 머리에 닿자 덕만의 무릎이 아주 조금 꺾였습니다. 밤새 묻은 재와 피가 예복 안쪽에 그대로 남아 있었습니다."
      - say:
          char: 덕만
          camera: close
          text: "오늘부터 내 말은 옳기 때문에 명령이 되는 것이 아니다. 사람의 삶을 움직이는 명령이 되었기에, 내 말일수록 더 크게 의심하고 기록하라."
      - say:
          channel: narration
          text: "덕만은 왕관을 고쳐 쓰기도 전에 첫 명령을 내렸습니다. '오늘 나를 만든 표와 약속을 한 글자도 빼지 말라.' 이어 불탄 시장 너머 하늘을 보며 두 번째 명령을 불렀습니다. '다음 어둠은 누구나 미리 보게 하라.'"
      - say:
          channel: record
          text: "덕만은 여왕이 되었습니다. 이야기는 왕관을 얻는 데서 끝나지 않고, 즉위의 조건을 지키면서 무엇을 먼저 만들지 묻기 시작했습니다."
      - goto: /9.yaml

  bad_lonely_throne:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: center, emotion: angry }
      - say:
          char: 덕만.angry
          text: "내가 지키지 못한 문이 어디지? 왜 누구도 대답하지 않아?"
      - say:
          channel: narration
          text: "덕만이 사람도 명령도 나누지 않은 채 홀로 왕좌에 앉자, 표결 항아리와 궁문은 동시에 주인을 잃었습니다. 반란군은 비어 버린 길로 들어와 덕만의 퇴로부터 끊었습니다."
      - say:
          char: 유신.angry
          text: "한곳에 사람을 모두 모으면 다른 곳은 명령만 남습니다. 공주님, 동문까지 이미 넘어갔습니다."
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주, 표결 도중 왕궁에서 고립. 새벽에 반란군이 왕좌를 점령하고 덕만을 참수함."
      - gameOver:
          title: "운명 — 왕좌만 남은 왕"
          message: "왕의 목소리 하나로 시장과 표결과 성문을 동시에 붙들 수는 없었습니다. 병력과 책임을 나누지 않은 덕만은 왕좌에 고립됐고, 왕관을 쓰기 전에 죽었습니다."
