chapterTitle: "왕좌 앞의 밤"

script:
  - scene: king_last_night

scenes:
  king_last_night:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제9장 — 왕좌 앞의 밤"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: action
          text: "이불 밖으로 나온 아버지 손을 잡는다. 뼈가 먼저 만져진다. 문밖에서는 낮춘 목소리로 표결 순서를 읽는다. 문을 닫으라 말할 사람이 없다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "너를 왕이라 부르려 했는데… 죽는 아비의 고집이 될까 두렵구나."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "지금은 그런 말씀 마세요. 손이 이렇게 찬데. 이불 좀 더 덮으실래요?"
      - say:
          when: { var: king_trust, op: gte, value: 3 }
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "덕만아. 나를 보지 말거라, 이제는. 네가 얻은 사람들을 보아야 한다."
      - say:
          channel: action
          text: "쥔 손에서 힘이 빠진다. 한참 기다려도 다시 쥐어 오지 않는다. 밖에서 북이 울린다. 나는 아버지 손을 이불 안으로 넣어 드리지 못한다."
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: exile }
          channel: record
          text: "국경 구휼소에서 천명의 편지가 왔다. “내가 맡은 마을의 이름을 보낸다. 그 아이들 몫까지 네가 가서 말해 다오.”"
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
          channel: narration
          text: "비밀문 너머에서 천명이 표결 명단을 읽었다. 덕만은 이름마다 점을 찍었다. 언니 자신의 이름을 넣을 자리는 없었다."
      - goto: vote_strategy

  vote_strategy:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "장부만 내밀면 찢을 겁니다. 군사를 세우면 협박이라 하겠지요. 먼저 약조를 받으셔야 합니다."
      - say:
          when: { var: chunchu_trust, op: gte, value: 1 }
          char: 춘추
          camera: medium
          with: [덕만]
          text: "어머니께서 저 문을 넘으셨습니다. 오늘은 제가 곁에 서겠습니다."
      - say:
          when: { var: chunchu_trust, op: lte, value: -1 }
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "어머니 일은 아직 서운합니다. 하지만 공주님께서 저 문에 혼자 드시게 두지는 않겠습니다."
      - choice:
          key: c9_vote_strategy
          prompt: "회랑 끝 문이 열린다. 나를 부르는 목소리가 난다."
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "위조 기록과 곡식 장부를 상 위에 쏟는다"
              when: { var: evidence, op: gte, value: 5 }
              add: { nobles_support: 2, fear: 1 }
              goto: evidence_vote
            - text: "마을 대표들의 이름을 궁문에서 부른다"
              when: { var: people_support, op: gte, value: 5 }
              add: { people_support: 2, nobles_support: -1 }
              goto: people_vote
            - text: "유신의 군사에게 칼집을 봉하게 한다"
              when: { var: army_support, op: gte, value: 4 }
              add: { army_support: 2, fear: 2 }
              goto: guarded_vote
            - text: "왕이 되어도 회의를 닫지 않겠다고 서명한다"
              add: { nobles_support: 2, insight: 1 }
              goto: negotiated_vote

  evidence_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - sticker: { id: c9_ledger, image: grain_ledger_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          camera: medium
          text: "이 장부에 이름이 있는 분은 표를 내려놓으시오. 해명부터 듣겠소."
      - say:
          channel: narration
          text: "몇몇 손이 소매 안으로 들어갔다. 덕만은 장부를 더 앞으로 밀었다. 종이 귀퉁이가 탁자 끝에 걸렸다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "잠시만요. 누가 심리할지부터 정해야 합니다. 공주님, 물러서십시오."
      - say:
          channel: narration
          text: "탁자가 뒤집혔다. 경비가 달려들다 서로 다른 명령에 멈췄다. 덕만은 흩어진 종이 사이로 소매에서 빠져나온 단검을 보았다."
      - clearSticker: { id: c9_ledger, leave: fadeOut }
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결장 변고 — 덕만 공주, 조작된 곡식 장부로 귀족을 협박하다 난투 중 피살. 문제의 장부는 소실됨."
      - gameOver:
          title: "운명 — 증거만 세운 표결"
          message: "장부가 불쏘시개로 쓰였다. 공주의 이름은 표결 명부에서 지워지고 변고 보고에 올랐다. 장부가 거짓이었다는 문장이 먼저 적혔다."
          recoverToChoice: c9_vote_strategy

  people_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "궁문 밖에서 마을 이름이 불렸다. 뒤이어 죽은 가족의 이름이 터져 나왔다. 귀족들이 얼굴을 찌푸릴수록 외침은 더 커졌다."
      - say:
          char: 덕만
          text: "문밖의 이름도 적으시오. 여기서 정한 왕을 저 사람들도 섬겨야 하지 않소."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "저 앞줄을 보십시오. 마을 사람 옷인데 신은 군화입니다. 문부터 열어선 안 됩니다."
      - say:
          channel: narration
          text: "열린 문으로 돌이 날아들었다. 덕만이 사람들을 멈추려 계단을 내려갔다. 앞줄의 사내가 품에서 창날을 뺐다. 뒤에서 밀려든 사람들이 그 팔을 가렸다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 민란 — 덕만 공주가 백성을 궁궐에 끌어들여 표결을 압박하던 중 폭도에게 피살됨."
      - gameOver:
          title: "운명 — 이름 뒤에 숨은 칼"
          message: "문 앞에서 외치던 이름들이 비명에 묻혔다. 덕만이 쓰러진 뒤 문은 다시 잠겼다. 안의 회의는 군중이 공주를 죽였다고 기록했다."
          recoverToChoice: c9_vote_strategy

  guarded_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "병사들이 칼집을 묶고 들어섰다. 귀족들은 항아리보다 매듭을 오래 보았다. 탁자 밑으로는 제 사병을 부르는 손짓이 오갔다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "저쪽 칼은 그대로입니다. 저희만 묶어 두어서는 지키기 어렵습니다."
      - say:
          char: 덕만.princess_angry
          camera: medium
          with: [유신]
          text: "우리가 먼저 뽑지 않았다는 건 남겠지. 자리를 지켜라."
      - say:
          channel: narration
          text: "반대표 하나가 항아리에 떨어졌다. 동시에 문이 닫혔다. 매듭을 풀던 병사가 창에 맞았다. 유신은 칼집째 들어 두 번째 창을 막았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 유혈 사태 — 덕만 공주가 군사로 회의를 협박하다 충돌 발생. 덕만과 호위 병력 사망."
      - gameOver:
          title: "운명 — 묶인 칼의 표결"
          message: "피에 젖은 매듭은 좀처럼 풀리지 않았다. 덕만은 칼을 뽑지 못한 호위들 사이에 남았다."
          recoverToChoice: c9_vote_strategy

  negotiated_vote:
    actions:
      - say:
          channel: action
          text: "왕이 된 뒤에도 회의 문을 닫지 않겠다고 적는다. 귀족 하나가 문서를 제 쪽으로 당겨 읽는다. 오래 머뭇거리던 표가 그제야 항아리로 간다."
      - goto: coup_begins

  coup_begins:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: embers
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: action
          text: "표가 항아리 바닥을 친다. 그 소리 사이로 비명이 난다. 창밖에 불이 솟고 병사들이 내 이름을 외치며 달린다. 내가 내린 명은 아니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "서문을 뚫고 시장으로 갑니다! 전부 가면 여기가 빕니다. 병력을 나눠 주십시오!"
      - choice:
          key: c9_coup_response
          prompt: "시장 쪽 하늘이 붉다. 표결 항아리는 아직 열려 있다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "항아리를 버리고 전부 시장으로 달린다"
              add: { people_support: 3, nobles_support: -1, mercy: 1 }
              goto: save_market
            - text: "위조 왕명으로 반란군을 빈 창고에 모은다"
              when: { var: insight, op: gte, value: 4 }
              add: { evidence: 2, fear: 2, bidam_trust: 1 }
              goto: false_order
            - text: "홀로 왕좌에 앉아 진짜 왕명을 외친다"
              goto: bad_lonely_throne
            - text: "유신을 서문으로 보내고 항아리 곁에 남는다"
              add: { yushin_trust: 2, army_support: 1, nobles_support: 1 }
              goto: split_defense

  split_defense:
    actions:
      - say:
          channel: action
          text: "유신을 서문으로 보낸다. 연기가 들어와도 항아리에서 손을 떼지 않는다. 새벽 가까이 돌아온 병사가 진짜 인장을 내 손에 올린다. 피가 마르지 않았다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "서문 지켰습니다. …여기도 무사하군요. 이제 항아리를 여셔도 됩니다."
      - goto: final_ballot

  save_market:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만은 항아리를 두고 물동이를 들었다. 불붙은 좌판 앞에 줄이 생겼다. 물을 건네는 손마다 재가 묻었다. 시장 어귀에서 불길이 멎었다."
      - say:
          channel: narration
          text: "돌아가는 궁문에는 낯선 왕의 이름이 붙어 있었다. 덕만이 지킨 시장 쪽으로 왕군이 들어왔다. 앞장선 장수가 조금 전 회의장의 귀족이었다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "새 왕이 공주님을 잡으라 합니다. 동문은 아직 열려 있습니다. 가십시오!"
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [유신]
          text: "상인들부터 보내. 내가 끌고 온 군사들이야. 저 사람들 뒤에 숨지는 않겠다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 표결 뒤 반란 진압 — 왕위를 노린 덕만 공주, 시장에서 왕군에 저항하다 사망."
      - gameOver:
          title: "운명 — 비워 둔 표결"
          message: "불을 끈 손들이 덕만을 감싸려 했다. 덕만은 그 손들을 밀어 냈다. 새 왕의 명령은 시장 한복판에서 집행되었다."
          recoverToChoice: c9_coup_response

  false_order:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - say:
          channel: narration
          text: "덕만이 위조 인장을 눌렀다. 빈 창고로 병사들이 모였다. 낡은 갑옷의 하급 군사들뿐이었다. 지휘패를 찬 사람은 보이지 않았다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "지휘부가 없습니다. 공주님 글씨를 알아본 자들은 회의장으로 갔습니다."
      - say:
          char: 덕만.princess_angry
          camera: medium
          with: [유신]
          text: "여긴 버려. 돌아가야 해. 내 명을 기다리는 사람들에게."
      - say:
          channel: narration
          text: "덕만의 위조문이 성문에 붙었다. 돌아온 전령은 같은 질문을 여러 번 받았다. 이번 왕명은 진짜냐고. 답하는 동안 반란군이 회의장에 닿았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주가 위조 왕명을 사용한 사실이 드러난 뒤 호위대 해산. 덕만은 반란군에게 참수됨."
      - gameOver:
          title: "운명 — 진짜 명령까지 지운 획"
          message: "덕만은 마지막까지 병력을 부르는 명을 썼다. 전달받은 장수들은 인장을 확인하느라 움직이지 않았다."
          recoverToChoice: c9_coup_response

  final_ballot:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: thought
          text: "항아리에 금이 갔다. 밤새 지킨 표가 그 틈으로 보인다. 춘추가 세 손가락을 펴 보인다. 세 표. 아직 세 표가 모자란다."
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "세 표를 주겠답니다. 대신 조건을 달았습니다. 여기서 읽겠습니다. 모두 들으시게요."
      - choice:
          key: c9_crown_terms
          prompt: "마지막 세 표에 딸린 조건을 읽는다."
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "귀족 회의에 군량 장부를 맡긴다"
              set: { coronation_compromise: nobles_audit }
              add: { nobles_support: 3, army_support: -1 }
              goto: bad_nobles_audit
            - text: "시장과 마을 자리를 회의장에 비워 둔다"
              set: { coronation_compromise: public_council }
              add: { people_support: 2, nobles_support: -2, insight: 1 }
              goto: coronation
            - text: "유신의 지휘패를 해마다 다시 심사한다"
              set: { coronation_compromise: reviewed_army }
              add: { army_support: 2, yushin_trust: 1, nobles_support: -1 }
              goto: bad_army_review

  bad_nobles_audit:
    actions:
      - bg:
          id: "banquet_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "princess_sad"
      - char:
          id: "춘추"
          position: "right"
          emotion: "nervous"
      - say:
          char: "춘추.nervous"
          text: "세 표가 들어갔습니다. 이제 군량을 꺼낼 때마다 저 세 분 서명이 필요합니다."
      - say:
          char: "덕만.princess_sad"
          text: "첫 수확까지다. 그 뒤에는 누구 창고를 얼마나 열었는지 함께 따지겠다."
      - say:
          channel: "narration"
          text: "붓 세 자루가 움직였다. 왕관은 덕만에게 왔다. 군량 장부를 가지러 간 관리만 빈손으로 돌아왔다."
      - add:
          nobles_support: 2
      - say:
          channel: thought
          text: "장부를 돌려달라는 말에 세 사람이 서로를 본다. 아직 왕관을 쓰지도 않았는데, 벌써 허락을 기다린다."
      - goto: "coronation"

  bad_army_review:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "princess_angry"
      - char:
          id: "유신"
          position: "right"
          emotion: "angry"
      - say:
          char: "유신.angry"
          text: "심사를 받겠습니다. 그날 성문을 맡을 장수를 미리 정해 주십시오."
      - say:
          char: "덕만.princess_angry"
          text: "네가 없어도 문은 서 있어야지. 뒤를 맡을 사람도 같은 심사를 받게 하라."
      - say:
          channel: "narration"
          text: "장수 둘이 자리에서 일어났다. 유신은 지휘패를 내어 반납할 날짜를 새겼다. 떠난 두 사람의 자리에는 아무도 앉지 않았다."
      - add:
          army_support: -2
      - say:
          channel: thought
          text: "남은 군사 수를 다시 센다. 아까보다 적다. 약속을 지키려면 이 숫자로도 버텨야 한다."
      - goto: "coronation"

  coronation:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: record
          delivery: calm
          text: "선덕왕 즉위 — 왕실 기록에서 죽었던 둘째 공주 덕만이 신라의 왕이 되다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          channel: action
          text: "왕관이 이마를 누른다. 머리를 들자 마른 피가 밴 옷깃이 목을 긁는다. 누군가 옷을 갈아입히려 다가온다. 나는 먼저 문밖을 본다."
      - say:
          char: 덕만
          camera: medium
          text: "오늘 받은 표와 내가 한 약조를 먼저 읽어라. 즉위했으니 지워도 되는 글은 없다."
      - say:
          channel: narration
          text: "첫 조회는 불탄 시장의 명부를 읽으며 시작되었다. 덕만은 살 곳을 잃은 집마다 표시를 했다. 새 관측대를 어디에 세울지는 그다음에 물었다."
      - say:
          channel: thought
          text: "왕관을 썼는데 춥다. 시장 사람들은 오늘 어디서 잘까. 내 첫 겨울이 벌써 문 앞에 와 있다."
          with: []
          camera: wide
          continueLabel: 예복을 걷고 첫겨울의 장부를 받는다
      - goto: /9.yaml

  bad_lonely_throne:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: center, emotion: angry }
      - say:
          char: 덕만.angry
          text: "서문에는 누가 있느냐? 표결장은? 대답하라. 아무도 없느냐!"
      - say:
          channel: narration
          text: "왕좌까지 명령을 받으러 온 병사들이 몰렸다. 어느 문으로 보낼지 정해지지 않은 사이 반란군이 빈 회랑을 차지했다. 돌아가는 발길마다 다른 문이 막혀 있었다."
      - say:
          char: 유신.angry
          text: "동문도 넘어갔습니다. 공주님, 자리에서 일어나십시오. 지금 나가셔야 합니다."
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주, 표결 도중 왕궁에서 고립. 새벽에 반란군이 왕좌를 점령하고 덕만을 참수함."
      - gameOver:
          title: "운명 — 왕좌만 남은 왕"
          message: "덕만이 내려왔을 때 왕좌 아래에는 지킬 병력이 남지 않았다. 날이 밝기 전 반란군이 그 자리에 섰다."
