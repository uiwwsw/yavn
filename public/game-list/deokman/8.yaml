script:
  - scene: king_last_night

scenes:
  king_last_night:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제9장 — 왕좌 앞의 밤"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "진평왕의 숨이 멎자마자 왕좌 뒤의 발소리들이 빨라졌습니다. 상복도 갖추기 전, 새벽 표결을 알리는 북이 울렸습니다. 성문과 군량 창고 쪽에서는 귀족 사병의 횃불이 움직였습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "내가 널 지명하면 저들은 여인을 막는 게 아니라 폭군의 유언을 막는다고 할 게다. 내 말에 업혀 오지 마라. 네가 얻은 사람들과 걸어와."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지의 마지막 말을 왕관값으로 쓰지 않겠습니다. 대신 아버지가 잃은 것까지 제 몫으로 들고 가겠습니다."
      - goto: vote_strategy

  vote_strategy:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "회의장 문이 곧 닫힙니다. 장부 상자는 무겁고, 궁 밖 사람들은 더 많고, 유신의 군사는 눈에 너무 잘 띕니다. 하나만 앞에 세우셔야 합니다."
      - choice:
          key: c9_vote_strategy
          prompt: "새벽 문이 열린다. 덕만보다 먼저 무엇이 들어갈까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "위조 기록과 곡식 장부를 상 위에 쏟는다"
              when: { var: evidence, op: gte, value: 5 }
              add: { nobles_support: 2, fear: 1 }
              goto: evidence_vote
            - text: "마을 대표들의 이름을 궁문에서 부른다"
              when: { var: people_support, op: gte, value: 5 }
              add: { people_support: 2, nobles_support: -1 }
              goto: people_vote
            - text: "유신의 군사에게 칼집을 봉하게 한다"
              when: { var: army_support, op: gte, value: 4 }
              add: { army_support: 2, fear: 2 }
              goto: guarded_vote
            - text: "왕이 되어도 회의를 닫지 않겠다고 서명한다"
              add: { nobles_support: 2, insight: 1 }
              goto: negotiated_vote

  evidence_vote:
    actions:
      - sticker: { id: c9_ledger, image: grain_ledger_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          camera: medium
          text: "저를 반대하십시오. 대신 이 장부에 찍힌 손은 먼저 탁자에서 떼십시오. 굶긴 손으로 왕을 고르게 두진 않겠습니다."
      - say:
          channel: narration
          text: "장부가 바닥을 미끄러지자 몇몇 귀족이 손을 소매 안으로 감췄습니다. 찬성은 아니었지만 누구도 먼저 반대표를 들지 못했습니다."
      - clearSticker: { id: c9_ledger, leave: fadeOut }
      - goto: coup_begins

  people_vote:
    actions:
      - say:
          channel: narration
          text: "궁문 밖에서 마을 이름이 하나씩 불렸습니다. 사람들은 덕만 만세 대신 자기 창고와 죽은 가족의 이름을 외쳤습니다. 귀족이 '폭도'라 부를 때마다 새로운 마을이 대답했습니다."
      - say:
          char: 덕만
          text: "표는 이 방 안에 있습니다. 하지만 그 표 때문에 굶고 싸울 사람은 밖에 있습니다. 문을 닫더라도 저 이름들은 적으십시오."
      - goto: coup_begins

  guarded_vote:
    actions:
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "병사들은 칼집을 밧줄로 묶고 회의장에 섰습니다. 칼은 나오지 않았지만 귀족들의 눈은 투표 항아리보다 병사 수를 더 오래 셌습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘 칼은 안 뽑힙니다. 그래도 반대표를 든 자들은 평생 칼을 봤다고 말할 겁니다."
      - goto: coup_begins

  negotiated_vote:
    actions:
      - say:
          channel: narration
          text: "덕만이 공개 회의를 닫지 않겠다고 피로 서명하자 흩어진 표가 돌아왔습니다. 왕관을 보기도 전에 첫 매듭이 그 안쪽에 묶였습니다."
      - goto: coup_begins

  coup_begins:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "첫 표가 항아리 바닥에 닿는 소리와 동시에 서문에서 불기둥이 올랐습니다. 위조 왕명을 든 병사들이 덕만의 이름을 외치며 회의장으로 달려왔습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "서문으로 가면 이 방이 비고, 여기 남으면 불이 시장까지 갑니다. 둘 다 지킬 병력은 없습니다!"
      - choice:
          key: c9_coup_response
          prompt: "표결 항아리와 불붙은 시장 사이, 누구를 어디로 보낼까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "유신을 서문으로 보내고 항아리 곁에 남는다"
              add: { yushin_trust: 2, army_support: 1, nobles_support: 1 }
              goto: split_defense
            - text: "항아리를 버리고 전부 시장으로 달린다"
              add: { people_support: 3, nobles_support: -1, mercy: 1 }
              goto: save_market
            - text: "위조 왕명으로 반란군을 빈 창고에 모은다"
              when: { var: insight, op: gte, value: 4 }
              add: { evidence: 2, fear: 2, bidam_trust: 1 }
              goto: false_order
            - text: "홀로 왕좌에 앉아 진짜 왕명을 외친다"
              goto: bad_lonely_throne

  split_defense:
    actions:
      - say:
          channel: narration
          text: "유신의 말발굽이 서문으로 사라졌습니다. 덕만은 연기가 들어오는 회의장에서 항아리를 끌어안았습니다. 새벽 직전, 피 묻은 유신이 진짜 인장을 던져 넣었습니다."
      - goto: final_ballot

  save_market:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "덕만이 항아리를 놓고 물동이를 들었습니다. 종이를 쥐던 귀족 손과 장터 사람의 손이 같은 줄에서 물을 넘겼습니다. 표는 바닥에 흩어졌지만 불길은 시장 앞에서 멈췄습니다."
      - goto: final_ballot

  false_order:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "덕만이 위조 인장을 다시 눌렀습니다. 반란 지휘부는 빈 창고에서 서로를 발견했고, 싸움은 짧게 끝났습니다. 젖은 인주가 덕만 손에서도 마르고 있었습니다."
      - goto: final_ballot

  final_ballot:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "동이 틀 무렵 금 간 항아리가 다시 세워졌습니다. 마지막 세 표는 접히지 않은 채 춘추의 손에 남아 있었습니다."
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: close
          with: [덕만]
          text: "이 세 표는 약속 없이는 움직이지 않습니다. 몰래 빚지지 마십시오. 무엇을 내줄지 여기서 말하십시오."
      - choice:
          key: c9_crown_terms
          prompt: "왕관까지 세 표. 어떤 약속을 왕관 안쪽에 새길까?"
          char: 덕만
          camera: close
          with: [춘추]
          options:
            - text: "귀족 회의에 군량 장부를 맡긴다"
              set: { coronation_compromise: nobles_audit }
              add: { nobles_support: 3, army_support: -1 }
              goto: coronation
            - text: "유신의 지휘패를 해마다 다시 심사한다"
              set: { coronation_compromise: reviewed_army }
              add: { army_support: 2, yushin_trust: 1, nobles_support: -1 }
              goto: coronation
            - text: "시장과 마을 자리를 회의장에 비워 둔다"
              set: { coronation_compromise: public_council }
              add: { people_support: 2, nobles_support: -2, insight: 1 }
              goto: coronation

  coronation:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: record
          delivery: calm
          text: "선덕왕 즉위 — 왕실 기록에서 죽었던 둘째 공주 덕만이 신라의 왕이 되다."
      - char: { id: 덕만, position: center }
      - say:
          channel: narration
          text: "왕관이 머리에 닿자 덕만의 무릎이 아주 조금 꺾였습니다. 밤새 묻은 재와 피가 예복 안쪽에 그대로 남아 있었습니다."
      - say:
          char: 덕만
          camera: close
          text: "오늘부터 내 말은 옳아서 명령이 되는 게 아니다. 명령이 된 순간부터 더 크게 의심받아야 한다."
      - say:
          channel: narration
          text: "덕만은 왕관을 고쳐 쓰기도 전에 첫 명령을 내렸습니다. '오늘 나를 만든 표와 약속을 한 글자도 빼지 말라.' 이어 불탄 시장 너머 하늘을 보며 두 번째 명령을 불렀습니다. '다음 어둠은 누구나 미리 보게 하라.'"
      - say:
          channel: record
          text: "덕만은 여왕이 되었습니다. 이야기는 왕관을 얻는 데서 끝나지 않고, 즉위의 조건을 지키면서 무엇을 먼저 만들지 묻기 시작했습니다."
      - goto: /9.yaml

  bad_lonely_throne:
    actions:
      - bg: throne_hall
      - camera: close
      - effect: embers
      - char: { id: 덕만, position: center, emotion: angry }
      - say:
          char: 덕만.angry
          text: "내가 진평왕의 적법한 후계자다. 내 앞에 무기를 내려라!"
      - say:
          channel: narration
          text: "불길과 함성 속에서 왕좌의 말은 회랑 끝까지 닿지 않았습니다. 서로 다른 인장을 든 군사들은 각자 자기 명령만 진짜라 믿었습니다."
      - say:
          char: 유신.angry
          text: "왕좌를 지키려고 모두가 흩어졌습니다. 지금 공주님 곁에는 왕좌밖에 없습니다."
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주, 즉위 선언 직후 왕궁에서 고립. 새벽에 반란군이 왕좌를 점령함."
      - gameOver:
          title: "운명 — 왕좌만 남은 왕"
          message: "정통성은 사람과 길과 기록을 대신하지 못했습니다. 덕만은 왕이 앉는 자리를 차지했지만 왕의 명령이 움직일 나라를 잃었습니다."
