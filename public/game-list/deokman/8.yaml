script:
  - scene: king_last_night

scenes:
  king_last_night:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제9장 — 왕좌 앞의 밤"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: action
          text: 아버지 곁에 무릎을 꿇는다. 이불 아래 손이 차다. 문밖에서는 벌써 표결 문서를 접는 소리가 들린다.
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "지금 널 지명하면 죽어 가는 왕의 고집이라 하겠지. 내 유언 말고, 네가 얻은 사람들과 들어가라."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "유언은 받지 않을게요. 대신 아버지가 넘긴 열쇠와 다친 사람들 이름은 들고 가겠습니다."
      - say:
          when: { var: king_trust, op: gte, value: 3 }
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "나를 숨긴 날도, 문 앞에 세운 날도 기억한다. 이제 내 허락은 찾지 마라. 네 판단의 값까지 보거라."
      - say:
          channel: action
          text: 잡은 손이 더는 움직이지 않는다. 손을 놓기도 전에 북이 울린다. 조금만… 지금은 잠깐만 조용했으면.
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: exile }
          channel: record
          text: "국경 구휼소에서 천명의 서신이 도착했습니다. '내 표는 줄 수 없지만, 내가 맡은 마을 이름은 네 편에 세우겠다.'"
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
          channel: narration
          text: "비밀문 너머에서 천명이 표결 명단을 읽어 주었습니다. 그러나 살아 있는 언니의 조언은 문밖에서 증언이 될 수 없었습니다."
      - goto: vote_strategy

  vote_strategy:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "곧 문을 닫습니다. 장부는 반박을 막고, 마을 사람은 문을 못 닫게 하죠. 군사는 칼을 묶어도 협박입니다."
      - say:
          when: { var: chunchu_trust, op: gte, value: 1 }
          char: 춘추
          camera: medium
          with: [덕만]
          text: "어머니의 자백문을 함께 읽었죠. 오늘은 제 이름도 그 곁에 놓겠습니다."
      - say:
          when: { var: chunchu_trust, op: lte, value: -1 }
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "어머니를 다시 숨긴 선택은 아직 못 믿겠습니다. 그래도 오늘의 거짓말은 같이 막죠."
      - choice:
          key: c9_vote_strategy
          prompt: "왕의 유언 없이 표결이 시작됩니다. 무엇부터 회의장에 들일까요?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "위조 기록과 곡식 장부를 상 위에 쏟는다"
              when: { var: evidence, op: gte, value: 5 }
              add: { nobles_support: 2, fear: 1 }
              goto: evidence_vote
            - text: "마을 대표들의 이름을 궁문에서 부른다"
              when: { var: people_support, op: gte, value: 5 }
              add: { people_support: 2, nobles_support: -1 }
              goto: people_vote
            - text: "유신의 군사에게 칼집을 봉하게 한다"
              when: { var: army_support, op: gte, value: 4 }
              add: { army_support: 2, fear: 2 }
              goto: guarded_vote
            - text: "왕이 되어도 회의를 닫지 않겠다고 서명한다"
              add: { nobles_support: 2, insight: 1 }
              goto: negotiated_vote

  evidence_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - sticker: { id: c9_ledger, image: grain_ledger_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          camera: medium
          text: "저를 반대하셔도 됩니다. 다만 이 장부에 이름이 있다면 표부터 내려놓으십시오."
      - say:
          channel: narration
          text: "장부가 바닥을 미끄러지자 몇몇 귀족이 손을 소매 안으로 감췄습니다. 찬성은 아니었지만 누구도 먼저 반대표를 들지 못했습니다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "잠깐. 표를 내려놓으라 할 권한도, 장부를 증언할 사람도 아직 없습니다."
      - say:
          channel: narration
          text: "장부에 이름이 오른 귀족들이 동시에 탁자를 뒤엎었습니다. 경비는 증거를 지킨다는 명령과 표결을 지킨다는 명령 사이에서 멈췄고, 소매 속 단검은 그보다 빨랐습니다."
      - clearSticker: { id: c9_ledger, leave: fadeOut }
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결장 변고 — 덕만 공주, 조작된 곡식 장부로 귀족을 협박하다 난투 중 피살. 문제의 장부는 소실됨."
      - gameOver:
          title: "운명 — 증거만 세운 표결"
          message: "장부는 죄를 드러냈지만 누가 그 죄를 판정하고 증거를 지킬지는 정하지 못했습니다. 덕만이 공개 절차보다 고발을 먼저 내밀자 장부에 묶인 귀족들이 표결과 증인을 한꺼번에 없앴습니다."
          recoverToChoice: c9_vote_strategy

  people_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "궁문 밖에서 마을 이름이 하나씩 불렸습니다. 사람들은 덕만 만세 대신 자기 창고와 죽은 가족의 이름을 외쳤습니다. 귀족이 '폭도'라 부를 때마다 새로운 마을이 대답했습니다."
      - say:
          char: 덕만
          text: "표는 여러분이 갖지만 그 결과는 문밖 사람들이 견딥니다. 저 이름부터 회의록에 적으십시오."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "마을 이름은 증언이지 표가 아닙니다. 문을 열면 귀족 사병도 같이 들어옵니다."
      - say:
          channel: narration
          text: "궁문이 열리자 앞줄의 사병이 '덕만이 백성을 방패로 삼았다'고 외치며 돌을 던졌습니다. 군중이 한꺼번에 밀렸고, 덕만은 사람들을 세우려 계단 아래로 내려갔다가 숨겨 둔 창에 찔렸습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 민란 — 덕만 공주가 백성을 궁궐에 끌어들여 표결을 압박하던 중 폭도에게 피살됨."
      - gameOver:
          title: "운명 — 이름 뒤에 숨은 칼"
          message: "백성의 이름은 덕만이 책임질 사람을 보여 줬지만 표결 절차를 대신할 수는 없었습니다. 열린 궁문으로 귀족 사병까지 들어오면서 지지는 민란으로 기록됐고 덕만은 군중 속에서 죽었습니다."
          recoverToChoice: c9_vote_strategy

  guarded_vote:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "병사들은 칼집을 밧줄로 묶고 회의장에 섰습니다. 칼은 나오지 않았지만 귀족들의 눈은 투표 항아리보다 병사 수를 더 오래 셌습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "제 병사들 칼은 묶였는데 저쪽 칼은 풀렸습니다. 이건 표결이 아니라 눈치 싸움입니다."
      - say:
          char: 덕만.princess_angry
          camera: medium
          with: [유신]
          text: "우리 칼이 묶인 건 모두 봤어. 저들이 먼저 뽑게 둬."
      - say:
          channel: narration
          text: "첫 반대표가 항아리에 떨어지자 귀족 사병이 문을 닫았습니다. 유신의 병사들은 매듭을 푸는 동안 창을 맞았고, 덕만은 칼 한 번 뽑지 않은 군사들 사이에서 포위됐습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 유혈 사태 — 덕만 공주가 군사로 회의를 협박하다 충돌 발생. 덕만과 호위 병력 사망."
      - gameOver:
          title: "운명 — 묶인 칼의 표결"
          message: "칼집을 봉해도 군사가 표결장에 선 순간 반대자에게는 협박이 됐습니다. 귀족 사병이 먼저 문을 닫았고, 매듭을 풀지 못한 호위대와 덕만은 함께 죽었습니다."
          recoverToChoice: c9_vote_strategy

  negotiated_vote:
    actions:
      - say:
          channel: action
          text: 공개 회의를 지키겠다고 서명한다. 붓을 돌려주자 표가 돌아온다. 왕관을 쓰기도 전에 내 이름 아래 약속이 늘어난다.
      - goto: coup_begins

  coup_begins:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: embers
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: action
          text: 표가 항아리 바닥을 친다. 창밖에 불기둥이 솟는다. 달려오는 병사들이 내 이름을 외친다. 나는 명령한 적이 없다.
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "서문으로 가면 표결이 비고, 남으면 시장이 탑니다. 병력이 모자랍니다. 어디를 맡깁니까!"
      - choice:
          key: c9_coup_response
          prompt: "표결장과 시장이 동시에 공격받습니다. 병력을 어떻게 나눌까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "항아리를 버리고 전부 시장으로 달린다"
              add: { people_support: 3, nobles_support: -1, mercy: 1 }
              goto: save_market
            - text: "위조 왕명으로 반란군을 빈 창고에 모은다"
              when: { var: insight, op: gte, value: 4 }
              add: { evidence: 2, fear: 2, bidam_trust: 1 }
              goto: false_order
            - text: "홀로 왕좌에 앉아 진짜 왕명을 외친다"
              goto: bad_lonely_throne
            - text: "유신을 서문으로 보내고 항아리 곁에 남는다"
              add: { yushin_trust: 2, army_support: 1, nobles_support: 1 }
              goto: split_defense

  split_defense:
    actions:
      - say:
          channel: action
          text: 유신을 서문으로 보낸다. 연기가 들어와도 항아리를 놓지 않는다. 새벽 직전, 문턱에 떨어진 진짜 인장을 받아 든다.
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "서문은 막았습니다. 공주님도 자리를 지키셨군요. 이 표에 묻은 피를 잊지 마십시오."
      - goto: final_ballot

  save_market:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만이 항아리를 놓고 물동이를 들었습니다. 종이를 쥐던 귀족 손과 장터 사람의 손이 같은 줄에서 물을 넘겼습니다. 표는 바닥에 흩어졌지만 불길은 시장 앞에서 멈췄습니다."
      - say:
          channel: narration
          text: "덕만이 돌아왔을 때 표결 항아리는 사라지고 다른 왕의 이름이 성문에 붙어 있었습니다. 불을 끈 상인들이 덕만을 감쌌지만 이미 왕군이 된 귀족 사병이 골목을 막았습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "시장은 살았습니다. 대신 공주님이 반역자가 됐습니다. 동문으로 빠지십시오!"
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [유신]
          text: "두고 온 항아리에서 저 명령이 나왔구나. 사람부터 빼. 시장을 방패로 쓰지 마."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 표결 뒤 반란 진압 — 왕위를 노린 덕만 공주, 시장에서 왕군에 저항하다 사망."
      - gameOver:
          title: "운명 — 비워 둔 표결"
          message: "시장은 살았지만 왕을 정하는 자리를 비운 사이 반대파가 왕명과 군대를 차지했습니다. 덕만은 자신이 구한 시장에서 새 왕의 반역자로 죽었습니다."
          recoverToChoice: c9_coup_response

  false_order:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - say:
          channel: narration
          text: "덕만이 위조 인장을 다시 눌렀습니다. 반란 지휘부는 빈 창고에서 서로를 발견했고, 싸움은 짧게 끝났습니다. 젖은 인주가 덕만 손에서도 마르고 있었습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "빈 창고엔 하급 병사뿐입니다. 지휘부는 공주님 글씨를 알아보고 반대로 갔습니다."
      - say:
          char: 덕만.princess_angry
          camera: medium
          with: [유신]
          text: "내게 속은 사람만 잡았네. 나를 아는 자들은 놓쳤어."
      - say:
          channel: narration
          text: "덕만의 위조 명령이 공개되자 진짜 왕명도 효력을 잃었습니다. 어느 쪽 명령도 믿지 않게 된 병사들이 흩어졌고, 반란 지휘부는 비어 버린 회의장으로 곧장 들어왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주가 위조 왕명을 사용한 사실이 드러난 뒤 호위대 해산. 덕만은 반란군에게 참수됨."
      - gameOver:
          title: "운명 — 진짜 명령까지 지운 획"
          message: "자신을 죽이려 했던 위조를 다시 쓰자 덕만의 진짜 명령도 신뢰를 잃었습니다. 병사들이 멈춘 사이 반란군은 왕좌까지 도달했습니다."
          recoverToChoice: c9_coup_response

  final_ballot:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: thought
          text: 금 간 항아리 안에 밤새 지킨 표가 있다. 춘추의 손에는 아직 세 장. 저걸 얻으려고 또 무엇을 약속해야 하지?
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "이 세 표에는 값이 붙었습니다. 뒤에서 약속하지 말고 여기서 밝히십시오. 뭘 내줍니까?"
      - choice:
          key: c9_crown_terms
          prompt: "왕관까지 세 표가 모자랍니다. 어떤 조건이라면 공개하고 받을 수 있을까요?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "귀족 회의에 군량 장부를 맡긴다"
              set: { coronation_compromise: nobles_audit }
              add: { nobles_support: 3, army_support: -1 }
              goto: bad_nobles_audit
            - text: "시장과 마을 자리를 회의장에 비워 둔다"
              set: { coronation_compromise: public_council }
              add: { people_support: 2, nobles_support: -2, insight: 1 }
              goto: coronation
            - text: "유신의 지휘패를 해마다 다시 심사한다"
              set: { coronation_compromise: reviewed_army }
              add: { army_support: 2, yushin_trust: 1, nobles_support: -1 }
              goto: bad_army_review

  bad_nobles_audit:
    actions:
      - bg:
          id: "banquet_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "princess_sad"
      - char:
          id: "춘추"
          position: "right"
          emotion: "nervous"
      - say:
          char: "춘추.nervous"
          text: "세 표는 얻었습니다. 군량 한 섬을 움직일 때도 저들의 서명을 받으셔야 합니다."
      - say:
          char: "덕만.princess_sad"
          text: "기한은 첫 수확까지. 갱신할 때는 누구의 창고를 열었는지도 읽게 해."
      - say:
          channel: "narration"
          text: "귀족의 붓 세 자루가 움직였습니다. 왕관이 덕만에게 왔고 군량 장부는 회의장에 남았습니다."
      - add:
          nobles_support: 2
      - say:
          channel: thought
          text: 왕관은 여기 있다. 장부는 저 세 사람 앞에 있다. 겨울마다 이 서명을 다시 얻어야 하는 건가.
      - goto: "coronation"

  bad_army_review:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "princess_angry"
      - char:
          id: "유신"
          position: "right"
          emotion: "angry"
      - say:
          char: "유신.angry"
          text: "패를 심사받겠습니다. 다만 심사하는 날 성문 지휘자를 미리 정해 주십시오."
      - say:
          char: "덕만.princess_angry"
          text: "네가 자리를 비워도 문은 지켜야지. 후임도 같은 심사를 받게 하자."
      - say:
          channel: "narration"
          text: "장수 두 명이 퇴장했지만 유신은 남았습니다. 군은 더 작아졌고 지휘패에는 반납 날짜가 새겨졌습니다."
      - add:
          army_support: -2
      - say:
          channel: thought
          text: 지휘패에 반납 날짜를 새겼다. 떠난 장수의 자리가 비어 있다. 작은 군으로도 이 약속을 지켜야 해.
      - goto: "coronation"

  coronation:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: record
          delivery: calm
          text: "선덕왕 즉위 — 왕실 기록에서 죽었던 둘째 공주 덕만이 신라의 왕이 되다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          channel: action
          text: 왕관이 이마를 누른다. 무릎이 잠깐 꺾인다. 예복 안의 재와 피가 피부를 긁는다. 닦을 틈도 없었구나.
      - say:
          char: 덕만
          camera: medium
          text: "오늘부터 내 말이 사람을 움직인다. 그러니 내 명령일수록 더 묻고, 더 정확히 적어라."
      - say:
          channel: narration
          text: "덕만은 왕관을 고쳐 쓰기도 전에 첫 명령을 내렸습니다. '오늘 나를 만든 표와 약속을 한 글자도 빼지 말라.' 이어 불탄 시장 너머 하늘을 보며 두 번째 명령을 불렀습니다. '다음 어둠은 누구나 미리 보게 하라.'"
      - say:
          channel: thought
          text: 왕이 됐는데도 추워. 창밖 시장에는 지붕이 없다. 저 겨울부터 넘겨야 해.
          with: []
          camera: wide
          continueLabel: 예복을 걷고 첫겨울의 장부를 받는다
      - goto: /9.yaml

  bad_lonely_throne:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: center, emotion: angry }
      - say:
          char: 덕만.angry
          text: "내가 지키지 못한 문이 어디지? 왜 누구도 대답하지 않아?"
      - say:
          channel: narration
          text: "덕만이 사람도 명령도 나누지 않은 채 홀로 왕좌에 앉자, 표결 항아리와 궁문은 동시에 주인을 잃었습니다. 반란군은 비어 버린 길로 들어와 덕만의 퇴로부터 끊었습니다."
      - say:
          char: 유신.angry
          text: "사람을 한곳에 모으면 다른 곳엔 명령만 남습니다. 공주님, 동문도 넘어갔습니다."
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주, 표결 도중 왕궁에서 고립. 새벽에 반란군이 왕좌를 점령하고 덕만을 참수함."
      - gameOver:
          title: "운명 — 왕좌만 남은 왕"
          message: "왕의 목소리 하나로 시장과 표결과 성문을 동시에 붙들 수는 없었습니다. 병력과 책임을 나누지 않은 덕만은 왕좌에 고립됐고, 왕관을 쓰기 전에 죽었습니다."
