script:
  - scene: king_last_night

scenes:
  king_last_night:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제9장 — 왕좌 앞의 밤"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "진평왕의 숨이 가늘어질수록 왕좌 뒤의 발소리들이 빨라졌습니다. 상복을 준비하는 손보다 새벽 표결 문서를 접는 손이 더 바빴습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "내가 지금 널 지명하면 저들은 죽어 가는 왕의 억지라고 할 거다. 내 유언에 기대지 마라. 네가 살아오며 얻은 사람들과 들어가."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "유언은 받지 않겠습니다. 대신 아버지가 넘긴 열쇠와 그 때문에 다친 사람들 이름은 제가 들고 가겠습니다."
      - say:
          when: { var: king_trust, op: gte, value: 3 }
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "네가 나를 감춘 날도 사람들 앞에 세운 날도 모두 기억한다. 둘 다 나를 살리려 한 판단이었지. 이제 내 허락을 찾지 말고, 네 판단이 치를 값까지 보거라."
      - say:
          channel: narration
          text: "그 말을 들은 뒤에야 진평왕의 숨이 멎었습니다. 새벽 표결을 알리는 북이 곧바로 울렸고, 성문과 군량 창고 쪽에서는 귀족 사병의 횃불이 움직였습니다."
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: exile }
          channel: record
          text: "국경 구휼소에서 천명의 서신이 도착했습니다. '내 표는 줄 수 없지만, 내가 맡은 마을 이름은 네 편에 세우겠다.'"
      - say:
          when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
          channel: narration
          text: "비밀문 너머에서 천명이 표결 명단을 읽어 주었습니다. 그러나 살아 있는 언니의 조언은 문밖에서 증언이 될 수 없었습니다."
      - goto: vote_strategy

  vote_strategy:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: medium
          with: [덕만]
          text: "곧 문을 닫습니다. 장부를 들이면 반박하기 어렵고, 마을 사람을 부르면 문을 못 닫습니다. 군사는 칼을 묶어도 협박으로 보일 겁니다. 무엇부터 들이시겠습니까?"
      - say:
          when: { var: chunchu_trust, op: gte, value: 1 }
          char: 춘추
          camera: close
          with: [덕만]
          text: "어머니의 위조 자백문을 함께 읽은 뒤로 저는 공주님이 사람과 증거 중 무엇을 먼저 놓는지 보았습니다. 오늘은 제 이름과 책임도 그 옆에 놓겠습니다."
      - say:
          when: { var: chunchu_trust, op: lte, value: -1 }
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "어머니를 다시 비밀문 뒤에 숨긴 선택을 저는 아직 믿지 못합니다. 그래도 오늘 표결의 거짓말은 같이 막겠습니다."
      - choice:
          key: c9_vote_strategy
          prompt: "왕의 유언 없이 맞는 첫 표결. 덕만의 이름보다 먼저 무엇이 방 안의 기준이 될까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "위조 기록과 곡식 장부를 상 위에 쏟는다"
              when: { var: evidence, op: gte, value: 5 }
              add: { nobles_support: 2, fear: 1 }
              goto: evidence_vote
            - text: "마을 대표들의 이름을 궁문에서 부른다"
              when: { var: people_support, op: gte, value: 5 }
              add: { people_support: 2, nobles_support: -1 }
              goto: people_vote
            - text: "유신의 군사에게 칼집을 봉하게 한다"
              when: { var: army_support, op: gte, value: 4 }
              add: { army_support: 2, fear: 2 }
              goto: guarded_vote
            - text: "왕이 되어도 회의를 닫지 않겠다고 서명한다"
              add: { nobles_support: 2, insight: 1 }
              goto: negotiated_vote

  evidence_vote:
    actions:
      - bg: council_hall
      - sticker: { id: c9_ledger, image: grain_ledger_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          camera: medium
          text: "저를 반대하셔도 됩니다. 다만 이 장부에 이름이 있는 사람은 표부터 내려놓으십시오. 훔친 곡식으로 산 표는 받지 않겠습니다."
      - say:
          channel: narration
          text: "장부가 바닥을 미끄러지자 몇몇 귀족이 손을 소매 안으로 감췄습니다. 찬성은 아니었지만 누구도 먼저 반대표를 들지 못했습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "멈추십시오. 이름이 적힌 자들에게 표를 내려놓으라고 했지만, 그 표를 빼앗을 권한과 증인을 아직 세우지 않았습니다."
      - say:
          channel: narration
          text: "장부에 이름이 오른 귀족들이 동시에 탁자를 뒤엎었습니다. 경비는 증거를 지킨다는 명령과 표결을 지킨다는 명령 사이에서 멈췄고, 소매 속 단검은 그보다 빨랐습니다."
      - clearSticker: { id: c9_ledger, leave: fadeOut }
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결장 변고 — 덕만 공주, 조작된 곡식 장부로 귀족을 협박하다 난투 중 피살. 문제의 장부는 소실됨."
      - gameOver:
          title: "운명 — 증거만 세운 표결"
          message: "장부는 죄를 드러냈지만 누가 그 죄를 판정하고 증거를 지킬지는 정하지 못했습니다. 덕만이 공개 절차보다 고발을 먼저 내밀자 장부에 묶인 귀족들이 표결과 증인을 한꺼번에 없앴습니다."
          recoverToChoice: c9_vote_strategy

  people_vote:
    actions:
      - bg: council_hall
      - say:
          channel: narration
          text: "궁문 밖에서 마을 이름이 하나씩 불렸습니다. 사람들은 덕만 만세 대신 자기 창고와 죽은 가족의 이름을 외쳤습니다. 귀족이 '폭도'라 부를 때마다 새로운 마을이 대답했습니다."
      - say:
          char: 덕만
          text: "표는 여러분이 갖고 있지만 결과를 견딜 사람은 문밖에 있습니다. 문을 닫더라도 저 이름들은 회의록에 적으십시오."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "마을 이름은 증언이지만 아직 표가 아닙니다. 문을 열면 저 군중 속에 섞인 귀족 사병까지 함께 들어옵니다."
      - say:
          channel: narration
          text: "궁문이 열리자 앞줄의 사병이 '덕만이 백성을 방패로 삼았다'고 외치며 돌을 던졌습니다. 군중이 한꺼번에 밀렸고, 덕만은 사람들을 세우려 계단 아래로 내려갔다가 숨겨 둔 창에 찔렸습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 민란 — 덕만 공주가 백성을 궁궐에 끌어들여 표결을 압박하던 중 폭도에게 피살됨."
      - gameOver:
          title: "운명 — 이름 뒤에 숨은 칼"
          message: "백성의 이름은 덕만이 책임질 사람을 보여 줬지만 표결 절차를 대신할 수는 없었습니다. 열린 궁문으로 귀족 사병까지 들어오면서 지지는 민란으로 기록됐고 덕만은 군중 속에서 죽었습니다."
          recoverToChoice: c9_vote_strategy

  guarded_vote:
    actions:
      - bg: council_hall
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "병사들은 칼집을 밧줄로 묶고 회의장에 섰습니다. 칼은 나오지 않았지만 귀족들의 눈은 투표 항아리보다 병사 수를 더 오래 셌습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘 제 병사들의 칼은 묶였습니다. 그런데 문밖 귀족 사병들은 풀려 있습니다. 공주님, 이건 표결이 아니라 서로 먼저 칼을 뽑지 못하게 노려보는 자리입니다."
      - say:
          char: 덕만.princess_angry
          camera: close
          with: [유신]
          text: "우리 칼은 묶였다는 걸 모두 봤어. 저들이 먼저 뽑으면 명분은 우리에게 와."
      - say:
          channel: narration
          text: "첫 반대표가 항아리에 떨어지자 귀족 사병이 문을 닫았습니다. 유신의 병사들은 매듭을 푸는 동안 창을 맞았고, 덕만은 칼 한 번 뽑지 않은 군사들 사이에서 포위됐습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕위 표결 유혈 사태 — 덕만 공주가 군사로 회의를 협박하다 충돌 발생. 덕만과 호위 병력 사망."
      - gameOver:
          title: "운명 — 묶인 칼의 표결"
          message: "칼집을 봉해도 군사가 표결장에 선 순간 반대자에게는 협박이 됐습니다. 귀족 사병이 먼저 문을 닫았고, 매듭을 풀지 못한 호위대와 덕만은 함께 죽었습니다."
          recoverToChoice: c9_vote_strategy

  negotiated_vote:
    actions:
      - say:
          channel: narration
          text: "덕만이 공개 회의를 닫지 않겠다고 피로 서명하자 흩어진 표가 돌아왔습니다. 왕관을 보기도 전에 첫 매듭이 그 안쪽에 묶였습니다."
      - goto: coup_begins

  coup_begins:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "첫 표가 항아리 바닥에 닿는 소리와 동시에 서문에서 불기둥이 올랐습니다. 위조 왕명을 든 병사들이 덕만의 이름을 외치며 회의장으로 달려왔습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "제가 서문으로 가면 표결은 비고, 여기 남으면 시장이 탑니다. 병력이 모자랍니다. 제게 맡길 곳을 정하십시오!"
      - choice:
          key: c9_coup_response
          prompt: "왕관을 정할 항아리와 왕이 지켜야 할 시장이 동시에 탄다. 책임을 어떻게 나눌까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "유신을 서문으로 보내고 항아리 곁에 남는다"
              add: { yushin_trust: 2, army_support: 1, nobles_support: 1 }
              goto: split_defense
            - text: "항아리를 버리고 전부 시장으로 달린다"
              add: { people_support: 3, nobles_support: -1, mercy: 1 }
              goto: save_market
            - text: "위조 왕명으로 반란군을 빈 창고에 모은다"
              when: { var: insight, op: gte, value: 4 }
              add: { evidence: 2, fear: 2, bidam_trust: 1 }
              goto: false_order
            - text: "홀로 왕좌에 앉아 진짜 왕명을 외친다"
              goto: bad_lonely_throne

  split_defense:
    actions:
      - say:
          channel: narration
          text: "유신의 말발굽이 서문으로 사라졌습니다. 덕만은 연기가 들어오는 회의장에서 항아리를 끌어안았습니다. 새벽 직전, 피 묻은 유신이 진짜 인장을 던져 넣었습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "서문은 막았습니다. 공주님도 자리를 지키셨군요. 이제 이 표가 누구 피로 남았는지 잊지 마십시오."
      - goto: final_ballot

  save_market:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "덕만이 항아리를 놓고 물동이를 들었습니다. 종이를 쥐던 귀족 손과 장터 사람의 손이 같은 줄에서 물을 넘겼습니다. 표는 바닥에 흩어졌지만 불길은 시장 앞에서 멈췄습니다."
      - say:
          channel: narration
          text: "덕만이 돌아왔을 때 표결 항아리는 사라지고 다른 왕의 이름이 성문에 붙어 있었습니다. 불을 끈 상인들이 덕만을 감쌌지만 이미 왕군이 된 귀족 사병이 골목을 막았습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "시장은 살렸습니다. 하지만 저들은 공주님을 왕명을 거역한 반역자로 부릅니다. 동문으로 빠지셔야 합니다!"
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [유신]
          text: "내가 두고 온 항아리가 저 명령을 만들었구나. 사람들을 뒤로 빼. 이번에는 시장을 방패로 쓰지 않을 거야."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 표결 뒤 반란 진압 — 왕위를 노린 덕만 공주, 시장에서 왕군에 저항하다 사망."
      - gameOver:
          title: "운명 — 비워 둔 표결"
          message: "시장은 살았지만 왕을 정하는 자리를 비운 사이 반대파가 왕명과 군대를 차지했습니다. 덕만은 자신이 구한 시장에서 새 왕의 반역자로 죽었습니다."
          recoverToChoice: c9_coup_response

  false_order:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "덕만이 위조 인장을 다시 눌렀습니다. 반란 지휘부는 빈 창고에서 서로를 발견했고, 싸움은 짧게 끝났습니다. 젖은 인주가 덕만 손에서도 마르고 있었습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "빈 창고에 모인 건 하급 병사뿐입니다. 지휘부는 이 획이 공주님 것임을 알아보고 반대쪽 길로 움직였습니다."
      - say:
          char: 덕만.princess_angry
          camera: close
          with: [유신]
          text: "내가 속인 사람만 잡았어. 나를 속이는 법을 아는 사람들은 그대로 뒀구나."
      - say:
          channel: narration
          text: "덕만의 위조 명령이 공개되자 진짜 왕명도 효력을 잃었습니다. 어느 쪽 명령도 믿지 않게 된 병사들이 흩어졌고, 반란 지휘부는 비어 버린 회의장으로 곧장 들어왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주가 위조 왕명을 사용한 사실이 드러난 뒤 호위대 해산. 덕만은 반란군에게 참수됨."
      - gameOver:
          title: "운명 — 진짜 명령까지 지운 획"
          message: "자신을 죽이려 했던 위조를 다시 쓰자 덕만의 진짜 명령도 신뢰를 잃었습니다. 병사들이 멈춘 사이 반란군은 왕좌까지 도달했습니다."
          recoverToChoice: c9_coup_response

  final_ballot:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "동이 틀 무렵 금 간 항아리가 다시 세워졌습니다. 마지막 세 표는 접히지 않은 채 춘추의 손에 남아 있었습니다."
      - char: { id: 춘추, position: right }
      - say:
          char: 춘추
          camera: close
          with: [덕만]
          text: "이 세 표에는 조건이 있습니다. 뒤에서 몰래 약속하지 말고 지금 말하십시오. 무엇을 내주고, 누가 감시합니까?"
      - choice:
          key: c9_crown_terms
          prompt: "왕관까지 남은 세 표는 통치의 첫 빚이다. 공개해서 바꿀 수 있는 어떤 조건으로 받을까?"
          char: 덕만
          camera: close
          with: [춘추]
          options:
            - text: "귀족 회의에 군량 장부를 맡긴다"
              set: { coronation_compromise: nobles_audit }
              add: { nobles_support: 3, army_support: -1 }
              goto: bad_nobles_audit
            - text: "유신의 지휘패를 해마다 다시 심사한다"
              set: { coronation_compromise: reviewed_army }
              add: { army_support: 2, yushin_trust: 1, nobles_support: -1 }
              goto: bad_army_review
            - text: "시장과 마을 자리를 회의장에 비워 둔다"
              set: { coronation_compromise: public_council }
              add: { people_support: 2, nobles_support: -2, insight: 1 }
              goto: coronation

  bad_nobles_audit:
    actions:
      - bg: banquet_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_sad }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 춘추.nervous
          text: "장부를 넘기자마자 첫 장과 마지막 장이 없어졌습니다. 공주님을 지지한 세 표도 함께 자리를 비웠습니다."
      - say:
          char: 덕만.princess_sad
          text: "곡식을 훔친 사람에게 다시 장부를 맡겼어. 왕관을 받기도 전에 내가 가진 증거부터 돌려준 거야."
      - say:
          channel: narration
          text: "즉위 축하주가 들어왔지만 잔을 올린 가문 이름은 잘려 나간 장부 첫 장에 있었습니다. 덕만이 쓰러지자 귀족 회의는 표결을 취소하고 새 후보를 세웠습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "즉위 전야 변고 — 덕만 공주, 원인 불명의 독으로 사망. 군량 장부 분실로 수사 중단."
      - gameOver:
          title: "운명 — 장부와 바꾼 왕관"
          message: "표를 얻으려고 군량 장부를 그 장부에 이름이 적힌 귀족들에게 돌려줬습니다. 증거를 없앤 그들은 축하주에 독을 넣어 덕만까지 없앴습니다."
          recoverToChoice: c9_crown_terms

  bad_army_review:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "제 지휘패를 심사한다는 말이 군영에는 충성을 의심한다는 말로 퍼졌습니다. 서문 부대가 귀족 쪽으로 넘어갔습니다."
      - say:
          char: 덕만.princess_angry
          text: "네 권한을 줄이려는 게 아니라 누구도 영원히 쥐지 못하게 하려던 거야. 직접 가서 말하자."
      - say:
          channel: narration
          text: "두 사람이 군영에 닿았을 때 심사에서 지휘권을 잃을 장수들이 먼저 칼을 뽑았습니다. 유신은 덕만을 감쌌지만 등 뒤 부대까지 돌아선 뒤였습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "군영 반란 기록 — 덕만 공주와 김유신, 지휘권 회수에 반발한 장수들에게 피살. 즉위 표결 무효."
      - gameOver:
          title: "운명 — 왕관보다 먼저 흔든 군권"
          message: "즉위 전에 군 지휘권 재심사를 약속하자 자리를 잃을 장수들이 선수를 쳤습니다. 제도는 시작되기도 전에 군영 반란이 되었고 덕만은 왕관 앞에서 죽었습니다."
          recoverToChoice: c9_crown_terms

  coronation:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: record
          delivery: calm
          text: "선덕왕 즉위 — 왕실 기록에서 죽었던 둘째 공주 덕만이 신라의 왕이 되다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          channel: narration
          text: "왕관이 머리에 닿자 덕만의 무릎이 아주 조금 꺾였습니다. 밤새 묻은 재와 피가 예복 안쪽에 그대로 남아 있었습니다."
      - say:
          char: 덕만
          camera: close
          text: "오늘부터 내 말은 사람들의 삶을 움직인다. 그러니 내 명령이라고 덜 묻지 말고, 더 묻고 더 정확히 기록하라."
      - say:
          channel: narration
          text: "덕만은 왕관을 고쳐 쓰기도 전에 첫 명령을 내렸습니다. '오늘 나를 만든 표와 약속을 한 글자도 빼지 말라.' 이어 불탄 시장 너머 하늘을 보며 두 번째 명령을 불렀습니다. '다음 어둠은 누구나 미리 보게 하라.'"
      - say:
          channel: record
          text: "덕만은 여왕이 되었습니다. 이야기는 왕관을 얻는 데서 끝나지 않고, 즉위의 조건을 지키면서 무엇을 먼저 만들지 묻기 시작했습니다."
      - goto: /9.yaml

  bad_lonely_throne:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: center, emotion: angry }
      - say:
          char: 덕만.angry
          text: "내가 지키지 못한 문이 어디지? 왜 누구도 대답하지 않아?"
      - say:
          channel: narration
          text: "덕만이 사람도 명령도 나누지 않은 채 홀로 왕좌에 앉자, 표결 항아리와 궁문은 동시에 주인을 잃었습니다. 반란군은 비어 버린 길로 들어와 덕만의 퇴로부터 끊었습니다."
      - say:
          char: 유신.angry
          text: "한곳에 사람을 모두 모으면 다른 곳은 명령만 남습니다. 공주님, 동문까지 이미 넘어갔습니다."
      - say:
          channel: record
          text: "계승 내란 기록 — 덕만 공주, 표결 도중 왕궁에서 고립. 새벽에 반란군이 왕좌를 점령하고 덕만을 참수함."
      - gameOver:
          title: "운명 — 왕좌만 남은 왕"
          message: "왕의 목소리 하나로 시장과 표결과 성문을 동시에 붙들 수는 없었습니다. 병력과 책임을 나누지 않은 덕만은 왕좌에 고립됐고, 왕관을 쓰기 전에 죽었습니다."
