script:
  - scene: empty_seal

scenes:
  empty_seal:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제7장 — 왕이 약한 이유"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "밤의 왕좌에는 진평왕 혼자 앉아 있었습니다. 그는 일식표의 인영 옆에 옥새함을 놓고 천천히 뚜껑을 열었습니다. 비어 있었습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "사람들은 내가 너무 선해서 약하다고 하지. 거짓말이다. 나는 창고 하나, 군사 하나, 기록관 하나를 내주며 오늘만 넘겼다. 끝에 남은 건 이 의자뿐이더구나."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "왕관을 지키느라 왕이 할 일을 전부 내주셨군요. 저까지도."
      - sticker: { id: c7_seal_box, image: empty_seal_box_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 320px)", anchorX: center, anchorY: center, enter: scaleIn }
      - get: empty_seal_box
      - clearSticker: { id: c7_seal_box, leave: fadeOut }
      - goto: confession_choice

  confession_choice:
    actions:
      - choice:
          key: c7_confession
          prompt: "빈 옥새함 사이로 새벽 종이 들린다. 아버지의 고백을 어디까지 열까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "왕을 궁문 앞에 세워 직접 말하게 한다"
              set: { king_failure_public: true }
              add: { people_support: 2, king_trust: 2, nobles_support: -1 }
              goto: public_confession
            - text: "왕은 숨기고 빼앗긴 권한만 벽에 붙인다"
              set: { king_failure_public: false }
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: publish_powers
            - text: "옥새함을 닫고 덕만이 비난을 받는다"
              set: { king_failure_public: false }
              add: { king_trust: 3, fear: 1, people_support: -1 }
              goto: inherit_blame

  public_confession:
    actions:
      - bg: council_hall
      - say:
          char: 진평왕.weak
          camera: medium
          text: "나는 평화를 샀다고 말했다. 실은 오늘을 샀고, 그 값은 내가 아니라 굶은 사람들이 냈다."
      - say:
          channel: narration
          text: "진평왕의 목소리가 궁문 밖까지 닿자 야유와 울음이 한꺼번에 터졌습니다. 귀족들은 고개를 돌렸지만 누구도 왕이 뱉은 말을 주워 담지 못했습니다."
      - goto: rebuild_power

  publish_powers:
    actions:
      - say:
          channel: narration
          text: "궁문 벽이 가문 이름으로 가득 찼습니다. 어느 집이 어느 창고 열쇠를, 어느 성문 병사를, 어느 기록관의 붓을 쥐었는지 사람들이 손가락으로 따라 읽었습니다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지가 약하다는 말로는 아무 문도 안 열립니다. 열쇠를 쥔 손의 이름을 보여 줘야 해요."
      - goto: rebuild_power

  inherit_blame:
    actions:
      - say:
          channel: narration
          text: "덕만은 사람들 앞에서 창고의 혼란이 자기 명령 때문이라고 말했습니다. 진평왕을 향하던 돌이 덕만의 발치로 바뀌었습니다. 귀족들은 그 광경을 말없이 지켜봤습니다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "네 이름을 살려 돌아오게 해 놓고, 또 내 방패로 썼구나."
      - say:
          char: 덕만.sad
          text: "이번엔 제가 걸어 들어간 겁니다. 하지만 다음엔 아버지를 끌고 나오겠습니다."
      - goto: rebuild_power

  rebuild_power:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "탁자 위에는 세 물건이 놓였습니다. 창고 열쇠, 군 지휘패, 기록관의 붓. 셋을 한꺼번에 잡는 순간 귀족 가문도 하나로 뭉칠 판이었습니다."
      - choice:
          key: c7_first_power
          prompt: "덕만의 손이 세 물건 위를 지난다. 무엇부터 움켜쥘까?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "창고 열쇠를 마을과 반씩 나눈다"
              add: { people_support: 2, nobles_support: -1, insight: 1 }
              goto: restore_granary
            - text: "지휘패를 유신의 허리에 채운다"
              add: { army_support: 3, yushin_trust: 2, fear: 1 }
              goto: restore_army
            - text: "왕명 하나에 붓 두 자루를 붙인다"
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: restore_records

  restore_granary:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "왕실 관리와 마을 대표가 열쇠를 하나씩 들었습니다. 둘이 같은 문 앞에 서기 전까지 자물쇠는 꿈쩍하지 않았고, 누구도 혼자 자루를 빼돌릴 수 없었습니다."
      - goto: council_counterattack

  restore_army:
    actions:
      - bg: frontier
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "이 칼을 받겠습니다. 하지만 저를 믿는다는 말로 제 뒤를 비워 두지 마십시오. 다음 빈 왕좌는 제가 만들 수도 있습니다."
      - say:
          char: 덕만
          text: "그래서 네 칼과 네 군량을 다른 사람이 셀 거야. 믿으니까 눈을 감는 게 아니라, 믿고 오래 쓰려고 보는 거야."
      - goto: council_counterattack

  restore_records:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "한 명령을 두 기록관이 마주 앉아 썼습니다. 획이 다르면 종을 울렸습니다. 위조는 줄었지만 급한 전령도 두 번째 붓이 끝날 때까지 발을 굴러야 했습니다."
      - goto: council_counterattack

  council_counterattack:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "다음 조회에서 귀족들은 빈 옥새함 대신 섭정 의자를 들여왔습니다. 의자에는 천명의 이름이 새겨져 있었습니다. 되찾은 열쇠와 붓을 언니의 치맛자락에 다시 묶으려는 수였습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "내가 앉지 않으면 자매가 싸운다 할 거야. 앉으면 내 몸으로 네 앞을 막겠지. 저 의자는 어느 쪽으로도 칼이야."
      - choice:
          key: c7_regency
          prompt: "천명 앞에 섭정 의자가 놓인다. 두 자매는 어떻게 받을까?"
          char: 덕만
          camera: reaction
          with: [천명]
          options:
            - text: "둘이 함께 앉아 명령마다 공동 서명한다"
              add: { cheonmyeong_trust: 2, nobles_support: 2, people_support: -1 }
              goto: shared_regency
            - text: "의자를 치우고 궁문 밖까지 회의를 연다"
              add: { people_support: 2, insight: 1, nobles_support: -1 }
              goto: open_council
            - text: "왕명을 읽어 귀족 대표를 전부 묶는다"
              goto: bad_empty_order

  shared_regency:
    actions:
      - say:
          channel: narration
          text: "천명이 의자 한쪽으로 몸을 비켰습니다. 모든 문서에 두 자매의 먹이 나란히 마를 때까지 명령은 나가지 않았습니다. 귀족들은 그 기다림까지 장부에 적었습니다."
      - goto: weak_king_end

  open_council:
    actions:
      - say:
          channel: narration
          text: "회의장 문이 열리자 흙 묻은 짚신과 군화가 비단신 사이로 들어왔습니다. 목소리는 겹쳤고 결정은 느려졌지만, 누구도 문밖에서 결과만 기다리지는 않았습니다."
      - goto: weak_king_end

  weak_king_end:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          char: 진평왕.weak
          text: "내가 잃은 걸 되찾고도 네 손에 다 쥐지 않았구나. 내가 왕이었다면 무서워서 놓지 못했을 텐데."
      - say:
          char: 덕만
          text: "한 손에 모으면 다음 왕은 그걸 팔아 하루를 살 겁니다. 왕이 약해져도 문이 열리고 밥이 나가게 만들겠습니다."
      - say:
          channel: record
          text: "진평왕은 약한 사람이어서만 약한 왕이 된 것이 아니었습니다. 권한 없는 왕좌를 평화라고 부른 시간이 왕을 약하게 만들었습니다."
      - say:
          channel: narration
          text: "귀족 회의는 두 공주에게 구휼 순행을 요구했습니다. 길을 짠 서기관의 손에는 잃어버린 옥새 인주가 묻어 있었습니다. 천명은 그걸 보고도 마차에 올랐습니다. 거절하면 열린 창고가 다시 닫힐 판이었습니다."
      - goto: /7.yaml

  bad_empty_order:
    actions:
      - bg: throne_hall
      - camera: close
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          char: 덕만.angry
          text: "왕명을 읽는다. 이 자리의 귀족 대표는 반역 혐의로 모두 포박하라."
      - say:
          channel: narration
          text: "대표들을 한꺼번에 묶는 순간 회의장 밖의 군사는 절반만 움직였습니다. 나머지 병사들의 군량과 가족은 체포된 귀족의 창고에 묶여 있었습니다."
      - say:
          char: 천명.nervous
          text: "사람을 모두 적으로 묶으면 우리 편이 설 자리도 사라져. 덕만아, 문이 닫히고 있어."
      - say:
          channel: record
          text: "귀족 회의는 왕실의 불법 체포와 공동 섭정 강요를 명분으로 성문을 폐쇄함. 덕만 공주와 천명 공주, 회의장 화재로 사망."
      - gameOver:
          title: "운명 — 함께 잠긴 왕실"
          message: "반대자를 한 번에 없애려는 왕명은 중립에 설 자리까지 지웠습니다. 귀족들은 회의장을 잠그고 불을 놓았고, 왕실의 두 후계자는 함께 죽었습니다."
