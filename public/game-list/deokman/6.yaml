script:
  - scene: chapter6_open
  - scene: kings_last_words

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - effect: alarm
      - char:
          id: 천명
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제6장 — 왕이 잠든 밤"
      - say:
          char: 천명
          with:
            - 덕만
          delivery: nervous
          text: "왕명이라며 너를 체포하라는 군사가 궁문을 막았어. 하지만 아버지는 말씀을 하실 수 없어."
      - say:
          char: 덕만
          with:
            - 천명
          text: "가짜 왕명은 사람들이 믿는 동안 진짜가 돼. 해 뜨기 전에 왕과 인장을 찾아야 해."
      - goto: entry_choice

  entry_choice:
    actions:
      - choice:
          key: c6_entry
          prompt: "봉쇄된 궁으로 어떻게 들어갈까?"
          char: 덕만
          options:
            - text: "월명이 아는 약재 수로를 따라 침전 아래로 들어간다"
              add:
                insight: 1
              goto: entry_waterway
            - text: "천명의 가마에 숨어 왕실 여인들의 행렬로 통과한다"
              add:
                sowon_trust: 1
                legitimacy: 1
              goto: entry_procession
            - text: "유신의 병사로 정문을 깨고 왕의 이름을 외친다"
              goto: go_31_gate_breaker
            - text: "체포되는 척 들어가 비담이 지키는 감옥에서 빠져나온다"
              add:
                bidam_trust: 1
                suspicion: 1
              goto: entry_prison

  entry_waterway:
    actions:
      - char:
          id: 월명
          position: right
      - say:
          char: 월명
          text: "왕을 살리는 약도 이 길로 들였고, 죽이는 약도 이 길로 들였을 겁니다."
      - say:
          char: 덕만
          text: "길에는 죄가 없지요. 어디로 이어 놓았는지가 죄일 뿐."
      - goto: rescue_choice

  entry_procession:
    actions:
      - say:
          char: 천명
          text: "어릴 때는 내 치마 뒤에 숨어 과자를 훔치더니, 이제는 왕위를 훔치러 숨는구나."
      - say:
          char: 덕만
          text: "이번에도 들키면 언니가 혼내 줘. 살아서 나갈 테니까."
      - goto: rescue_choice

  entry_prison:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담
          text: "공주께서는 잡히는 방식도 남다르십니다. 열쇠를 안쪽에서 받으러 오셨군요."
      - say:
          char: 덕만
          text: "그대가 문밖에 서 있으면 체포고, 안에 서 있으면 초대지."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: princess_chamber
      - say:
          text: "왕의 숨은 가늘었고, 천명은 포위되었으며, 서약서 원본은 불타기 시작했다. 셋을 모두 먼저 구할 수는 없었다."
      - choice:
          key: c6_rescue
          prompt: "가장 먼저 무엇을 구할까?"
          char: 덕만
          options:
            - text: "월명과 함께 왕의 독부터 해독한다"
              add:
                legitimacy: 2
              goto: rescue_king
            - text: "유신을 보내 천명과 동료들을 포위에서 빼낸다"
              add:
                yushin_trust: 1
                power: 1
              goto: rescue_allies
            - text: "불타는 기록고에서 계승동맹 원본과 인장 대장을 꺼낸다"
              add:
                insight: 2
                suspicion: 1
              goto: rescue_evidence
            - text: "도망치는 아진을 쫓아 배후의 이름을 직접 듣는다"
              goto: go_32_name_in_dark

  rescue_king:
    actions:
      - say:
          char: 월명
          text: "숨은 돌아왔지만 오래 버티지 못합니다. 왕께 남은 말은 몇 마디뿐입니다."
      - say:
          char: 덕만
          text: "그 몇 마디로 내 왕위를 만들어 달라고 하지는 않겠습니다."
      - goto: seal_found

  rescue_allies:
    actions:
      - say:
          char: 천명
          text: "아버지보다 우리를 먼저 구했어. 후회하지 않겠니?"
      - say:
          char: 덕만
          text: "왕 한 사람을 살리고 나라를 잃을 수는 없어. 아버지도 왕이라면 알 거야."
      - add:
          army_support: 1
      - goto: seal_found

  rescue_evidence:
    actions:
      - effect: embers
      - say:
          text: "불길 속에서 꺼낸 대장에는 왕의 인장을 마지막으로 빌린 사람이 국산이라 적혀 있었다."
      - say:
          char: 덕만
          text: "왕명은 가짜지만 인영은 진짜였군. 진짜를 훔쳐 거짓을 찍었어."
      - set:
          cheonmyeong_alive: false
      - goto: seal_found

  seal_found:
    actions:
      - say:
          text: "침전 바닥의 빈 약함 아래에서 왕의 인장이 발견되었다. 이제 덕만의 손에는 명령을 진짜로 만들 힘이 있었다."
      - set:
          has_royal_seal: true
      - goto: seal_choice

  seal_choice:
    actions:
      - choice:
          key: c6_seal
          prompt: "왕의 인장을 사용할까?"
          char: 덕만
          options:
            - text: "국산 체포와 궁문 개방 명령에 인장을 찍는다"
              add:
                power: 2
                suspicion: 2
              goto: seal_command
            - text: "인장을 봉해 화백회의 앞에서만 열겠다고 선언한다"
              add:
                legitimacy: 2
                nobles_support: 1
              goto: seal_seal
            - text: "인장을 깨뜨려 누구도 가짜 왕명을 만들지 못하게 한다"
              add:
                legitimacy: 1
                power: -1
              set:
                has_royal_seal: false
              goto: seal_break
            - text: "인장을 들고 빈 왕좌에 먼저 앉아 즉위를 선포한다"
              goto: go_33_one_day_queen

  seal_command:
    actions:
      - say:
          char: 비담
          text: "가짜 왕명을 진짜 명령으로 막으셨습니다. 차이는 누가 이겼는가뿐입니까?"
      - say:
          char: 덕만
          text: "아니. 내일 모두 앞에서 내가 이 명령을 내렸다고 말할 수 있는가가 차이야."
      - goto: kings_last_words

  seal_seal:
    actions:
      - say:
          char: 국산
          text: "권력을 손에 들고도 쓰지 못하는 분이 왕이 되시겠습니까?"
      - say:
          char: 덕만
          text: "쓰지 않은 힘이 사라진 힘은 아닙니다. 그대가 떨고 있으니 더 분명하지요."
      - goto: kings_last_words

  seal_break:
    actions:
      - effect: flash
      - say:
          text: "금빛 인장이 돌바닥에서 둘로 갈라졌다. 군사들은 누구의 명령도 진짜라 부를 수 없게 되었다."
      - goto: kings_last_words

  kings_last_words:
    actions:
      - bg: throne_hall
      - effect: moonveil
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 덕만
          with:
            - 진평왕
          delivery: sad
          text: "<speed=20>저를 왕으로 세워주십시오.</speed>"
      - say:
          char: 진평왕
          with:
            - 덕만
          text: "<speed=19>내가 세워준 왕이라면,</speed> <speed=25>내가 죽은 뒤에도 왕이겠느냐?</speed>"
      - say:
          text: "진평왕은 후계자의 이름을 남기지 않았다. 덕만에게는 왕명도 유언도 없었다."
      - say:
          char: 덕만
          delivery: calm
          text: "아버지는 마지막까지 나를 보호하지 않으셨다. 왕이 될 기회를 주셨다."
      - add:
          legitimacy: 1
      - say:
          text: "제6장 완료 — 덕만은 왕의 인장을 얻는 대신, 왕의 허락을 잃었다."

  go_31_gate_breaker:
    actions:
      - gameOver:
          title: "운명 31 — 궁을 친 공주"
          message: "정문은 열렸지만 왕의 궁을 공격한 사실은 남았다. 국산은 반란을 막은 충신이 되었고 덕만은 군사를 이끌고 궁을 친 역적이 되었다."
  go_32_name_in_dark:
    actions:
      - gameOver:
          title: "운명 32 — 어둠 속의 이름"
          message: "아진은 붙잡히기 직전 배후의 이름을 속삭였다. 덕만이 귀를 가까이 댄 순간 숨겨 둔 칼이 심장을 찔렀다. 진실을 들은 사람은 둘 다 해를 보지 못했다."
  go_33_one_day_queen:
    actions:
      - gameOver:
          title: "운명 33 — 하루의 여왕"
          message: "덕만은 새벽에 왕좌에 앉았고 정오에 끌려 내려왔다. 인장은 왕의 것이었지만 왕좌를 지킬 사람은 그녀의 것이 아니었다. 신라는 그녀를 하루 동안도 왕으로 기록하지 않았다."
