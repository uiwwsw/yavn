script:
  - scene: empty_seal

scenes:
  empty_seal:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제7장 — 왕이 약한 이유"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "밤의 왕좌에는 진평왕 혼자 앉아 있었습니다. 그는 일식표의 인영 옆에 옥새함을 놓고 천천히 뚜껑을 열었습니다. 비어 있었습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "사람들은 내가 착해서 약해졌다더구나. 아니다. 하루만 더 버티자며 하나씩 내줬어. 이제 이 의자만 남았다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "왕좌를 지키느라 왕의 일을 다 넘기셨군요. 제 이름까지."
      - sticker: { id: c7_seal_box, image: empty_seal_box_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 320px)", anchorX: center, anchorY: center, enter: scaleIn }
      - get: empty_seal_box
      - clearSticker: { id: c7_seal_box, leave: fadeOut }
      - goto: confession_choice

  confession_choice:
    actions:
      - choice:
          key: c7_confession
          prompt: "왕의 실패와 빼앗긴 권한을 누가 직접 밝힐까요?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "왕은 숨기고 빼앗긴 권한만 벽에 붙인다"
              set: { king_failure_public: false }
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: publish_powers
            - text: "왕을 궁문 앞에 세워 직접 말하게 한다"
              set: { king_failure_public: true }
              add: { people_support: 2, king_trust: 2, nobles_support: -1 }
              goto: public_confession
            - text: "옥새함을 닫고 덕만이 비난을 받는다"
              set: { king_failure_public: false }
              add: { king_trust: 3, fear: 1, people_support: -1 }
              goto: inherit_blame

  public_confession:
    actions:
      - bg: council_hall
      - say:
          char: 진평왕.weak
          camera: medium
          text: "나는 평화를 지켰다고 했다. 거짓말이다. 내 자리를 하루씩 늘렸고, 백성과 내 딸들이 값을 냈다."
      - say:
          channel: narration
          text: "진평왕의 목소리가 궁문 밖까지 닿자 야유와 울음이 한꺼번에 터졌습니다. 귀족들은 고개를 돌렸지만 누구도 왕이 뱉은 말을 주워 담지 못했습니다."
      - goto: rebuild_power

  publish_powers:
    actions:
      - bg: council_hall
      - say:
          channel: narration
          text: "궁문 벽이 가문 이름으로 가득 찼습니다. 어느 집이 어느 창고 열쇠를, 어느 성문 병사를, 어느 기록관의 붓을 쥐었는지 사람들이 손가락으로 따라 읽었습니다. 왕이 빠진 고백은 덕만에게 반역 혐의를 남겼지만, 공개된 이름들이 그날 재판을 막았습니다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "빼앗긴 권한을 적었습니다. 아버지는 편찮아 못 나오셨다고 하죠."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "내가 숨으면 저건 고백이 아니라 네 격문이다. 덕만아, 나를 데리고 나가라."
      - say:
          channel: narration
          text: "왕이 끝내 모습을 보이지 않자 귀족들은 벽보를 위조라고 불렀습니다. 덕만을 따르던 군사도 왕명이 없다는 말에 물러났고, 새벽 재판에는 고발자만 남았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "반역 재판 기록 — 덕만 공주, 왕과 귀족을 이간하고 허위 벽보를 붙인 죄로 참수."
      - gameOver:
          title: "운명 — 주인 없는 고백"
          message: "왕의 실패를 왕의 입 없이 공개하자 진실은 덕만의 반역문으로 바뀌었습니다. 진평왕이 숨어 있는 동안 귀족들은 고발자를 먼저 처형했습니다."
          recoverToChoice: c7_confession

  inherit_blame:
    actions:
      - bg: throne_hall
      - say:
          channel: narration
          text: "덕만은 사람들 앞에서 창고의 혼란이 자기 명령 때문이라고 말했습니다. 진평왕을 향하던 돌이 덕만의 발치로 바뀌었습니다. 귀족들은 그 자백을 반역문으로 만들려 했지만 왕이 처음으로 옥좌에서 내려왔습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "죽은 네 이름을 살려 놓고 또 방패로 세웠구나. 이번엔 네 뒤에 숨지 않겠다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "이번에는 제가 막겠습니다. 아버지가 다시 힘을 얻으면 그때 바로잡으면 돼요."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "재판이 끝나면 바로잡을 입도 없어. 내가 살자고 네 자백을 받으면 또 같은 왕이다."
      - say:
          channel: narration
          text: "진평왕이 명을 거두려 했지만 옥새를 쥔 서기관은 이미 자백문을 성문 밖으로 보냈습니다. 귀족들은 왕이 딸을 감싸 판결을 뒤집으려 한다며 처형을 서둘렀습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 창고 반역 사건 — 덕만 공주, 국고 혼란을 일으킨 죄를 자백하고 당일 처형됨."
      - gameOver:
          title: "운명 — 대신 쓴 자백"
          message: "아버지를 지키려고 뒤집어쓴 실패는 귀족들에게 완성된 자백이 됐습니다. 덕만은 다음에 진실을 말할 수 있으리라 믿었지만 재판은 그날 끝났습니다."
          recoverToChoice: c7_confession

  rebuild_power:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 유신, position: right }
      - say:
          channel: narration
          text: "탁자 위에는 세 물건이 놓였습니다. 창고 열쇠, 군 지휘패, 기록관의 붓. 셋을 한꺼번에 잡는 순간 귀족 가문도 하나로 뭉칠 판이었습니다."
      - choice:
          key: c7_first_power
          prompt: "빼앗긴 권한을 되찾되 다시 독점하지 않으려면 무엇부터 바꿀까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "창고 열쇠를 마을과 반씩 나눈다"
              add: { people_support: 2, nobles_support: -1, insight: 1 }
              goto: restore_granary
            - text: "지휘패를 유신의 허리에 채운다"
              add: { army_support: 3, yushin_trust: 2, fear: 1 }
              goto: restore_army
            - text: "왕명 하나에 붓 두 자루를 붙인다"
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: restore_records

  restore_granary:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "왕실 관리와 마을 대표가 열쇠를 하나씩 들었습니다. 둘이 같은 문 앞에 서기 전까지 자물쇠는 꿈쩍하지 않았고, 누구도 혼자 자루를 빼돌릴 수 없었습니다."
      - goto: council_counterattack

  restore_army:
    actions:
      - bg: frontier
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "지휘패는 받겠습니다. 하지만 군량과 명령까지 제 뒤에 숨기진 마십시오. 저도 빈 옥새함을 만들 수 있습니다."
      - say:
          char: 덕만
          text: "네가 지휘패를 쥐면 오늘 밤은 움직일 수 있어. 나머지는 다음 조회에서 나누자."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "그 전에 저를 국경으로 보내는 가짜 명령이 돌면 어쩝니까. 지금 나누십시오."
      - say:
          channel: narration
          text: "그날 밤 위조 전령이 유신의 지휘패를 들고 군영을 밖으로 뺐습니다. 비어 버린 궁문으로 귀족 사병이 들어왔고 덕만의 처소부터 포위했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "궁성 변란 기록 — 김유신 군이 국경으로 이동한 사이 덕만 공주 피살. 지휘 명령의 진위는 확인되지 않음."
      - gameOver:
          title: "운명 — 한 사람에게 건 지휘패"
          message: "유신은 충성했지만 모든 군권을 한 패에 모은 구조가 위조 명령 한 장에 궁을 비웠습니다. 덕만은 믿었던 장수가 돌아오기 전에 살해됐습니다."
          recoverToChoice: c7_first_power

  restore_records:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "한 명령을 두 기록관이 마주 앉아 썼습니다. 획이 다르면 종을 울렸습니다. 위조는 줄었지만 급한 전령도 두 번째 붓이 끝날 때까지 발을 굴러야 했습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "두 사람이 확인하면 같은 위조는 막을 수 있어. 늦어도 정확한 편이 나아."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "동문에 공주님을 죽이라는 명령이 돌았습니다. 두 번째 서명을 기다리는 사이 문이 열립니다."
      - say:
          channel: narration
          text: "기록관 둘 중 하나가 일부러 획을 틀릴 때마다 정정은 처음부터 다시 시작됐습니다. 진짜 명령이 방 안에 묶인 사이 가짜 명령을 든 자객들이 덕만에게 닿았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "동문 경비 기록 — 적법한 왕명에 따라 덕만 공주를 처형함. 반대 명령은 처형 뒤 도착."
      - gameOver:
          title: "운명 — 두 붓 사이의 칼"
          message: "검증 절차만 세우고 긴급 명령의 길을 만들지 않자, 매수된 기록관 하나가 시간을 무기로 썼습니다. 진짜 취소문이 완성되기 전에 가짜 처형문이 집행됐습니다."
          recoverToChoice: c7_first_power

  council_counterattack:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "다음 조회에서 귀족들은 빈 옥새함 대신 섭정 의자를 들여왔습니다. 의자에는 천명의 이름이 새겨져 있었습니다. 되찾은 열쇠와 붓을 언니의 치맛자락에 다시 묶으려는 수였습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "안 앉으면 우리가 싸웠다 하고, 앉으면 내 이름으로 널 막겠지. 저 의자는 내 자리가 아니야."
      - choice:
          key: c7_regency
          prompt: "귀족들이 천명을 덕만의 반대편에 앉히려 합니다. 회의를 어떻게 바꿀까요?"
          char: 덕만
          camera: reaction
          with: [천명]
          options:
            - text: "둘이 함께 앉아 명령마다 공동 서명한다"
              add: { cheonmyeong_trust: 2, nobles_support: 2, people_support: -1 }
              goto: shared_regency
            - text: "왕명을 읽어 귀족 대표를 전부 묶는다"
              goto: bad_empty_order
            - text: "의자를 치우고 궁문 밖까지 회의를 연다"
              add: { people_support: 2, insight: 1, nobles_support: -1 }
              goto: open_council

  shared_regency:
    actions:
      - bg: throne_hall
      - say:
          channel: narration
          text: "천명이 의자 한쪽으로 몸을 비켰습니다. 모든 문서에 두 자매의 먹이 나란히 마를 때까지 명령은 나가지 않았습니다. 귀족들은 그 기다림까지 장부에 적었습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "이 먹 냄새 이상하지 않아? 아까부터 네 손가락만 붉게 부어. 붓 내려놔."
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [천명]
          text: "언니 붓은 괜찮아. 공동 서명이라면서 처음부터 나만 죽일 먹을 준비한 거야."
      - say:
          channel: narration
          text: "덕만의 붓에만 독이 배어 있었습니다. 왕위를 천명에게 몰아주려던 귀족들은 두 이름이 필요한 제도를 이용해, 한 사람이 죽으면 모든 명령도 멈추게 만들었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공동 섭정 첫날 — 덕만 공주, 서명 중 독살. 천명 공주 단독 섭정으로 전환."
      - gameOver:
          title: "운명 — 두 이름 중 하나의 독"
          message: "자매의 서명을 한 종이에 묶자 질투하던 귀족은 덕만의 붓에만 독을 발랐습니다. 한 사람을 없애면 권력도 천명에게 자동으로 돌아가도록 만든 함정이었습니다."
          recoverToChoice: c7_regency

  open_council:
    actions:
      - say:
          channel: narration
          text: "회의장 문이 열리자 흙 묻은 짚신과 군화가 비단신 사이로 들어왔습니다. 목소리는 겹쳤고 결정은 느려졌지만, 누구도 문밖에서 결과만 기다리지는 않았습니다."
      - goto: weak_king_end

  weak_king_end:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          char: 진평왕.weak
          text: "되찾은 걸 네 손에 다 쥘 줄 알았다. 나라면 또 빼앗길까 무서워 그랬을 테니까."
      - say:
          char: 덕만
          text: "한 손에 모으면 다음 왕도 다시 팔 겁니다. 왕이 약해도 창고는 열리고, 틀린 명령은 고치게 하겠습니다."
      - say:
          channel: record
          text: "진평왕은 약한 사람이어서만 약한 왕이 된 것이 아니었습니다. 권한 없는 왕좌를 평화라고 부른 시간이 왕을 약하게 만들었습니다."
      - say:
          channel: narration
          text: "귀족 회의는 두 공주에게 구휼 순행을 요구했습니다. 길을 짠 서기관의 손에는 잃어버린 옥새 인주가 묻어 있었습니다. 천명은 그걸 보고도 마차에 올랐습니다. 거절하면 열린 창고가 다시 닫힐 판이었습니다."
      - goto: /7.yaml

  bad_empty_order:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          char: 덕만.angry
          text: "왕명을 읽는다. 이 자리의 귀족 대표는 반역 혐의로 모두 포박하라."
      - say:
          channel: narration
          text: "대표들을 한꺼번에 묶는 순간 회의장 밖의 군사는 절반만 움직였습니다. 나머지 병사들의 군량과 가족은 체포된 귀족의 창고에 묶여 있었습니다."
      - say:
          char: 천명.nervous
          text: "사람을 모두 적으로 묶으면 우리 편이 설 자리도 사라져. 덕만아, 문이 닫히고 있어."
      - say:
          channel: record
          text: "귀족 회의는 왕실의 불법 체포와 공동 섭정 강요를 명분으로 성문을 폐쇄함. 덕만 공주와 천명 공주, 회의장 화재로 사망."
      - gameOver:
          title: "운명 — 함께 잠긴 왕실"
          message: "반대자를 한 번에 없애려는 왕명은 중립에 설 자리까지 지웠습니다. 귀족들은 회의장을 잠그고 불을 놓았고, 왕실의 두 후계자는 함께 죽었습니다."
