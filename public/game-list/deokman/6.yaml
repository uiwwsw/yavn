script:
  - scene: chapter6_open
  - scene: coronation_finish

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: moonveil
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          wait: 850
          text: "제6장 — 왕의 마지막 명령"
      - say:
          delivery: calm
          text: "같은 밤, 631년 겨울이었습니다."
      - say:
          with: [덕만, 천명]
          text: "진평왕의 도장이 찍힌 체포 명령이 궁문마다 붙었고, 칠숙의 병사들이 왕의 방과 기록 창고를 먼저 막았습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "약방에서 원래 약 상자를 찾았어. 바뀐 상자는 칠숙의 병사들이 가져갔고."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "아버지가 쓰러진 사이 진운을 죽이고 저를 잡으려 했어. 계획이 무너지자 왕궁을 통째로 차지한 거야."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "아버지 방에는 월명도 못 들어갔어. 아직 살아 계신지 몰라."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "살아 계신다고 생각하고 움직일게. 다른 사람도 살릴 수 있게 일을 나눠야 해."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "월명은 약방 뒤 물길, 유신은 동문 경비 교대, 비담은 감옥 열쇠를 준비했어."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니는 무엇을 준비했어?"
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          wait: 700
          text: "무서워도 너와 같이 들어갈 마음. 그것밖에는 없어."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "그게 제일 필요해. 대신 둘이 같은 곳에서 잡히지는 말자."
      - goto: entry_choice

  entry_choice:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - choice:
          key: c6_entry
          prompt: "거짓 왕명이 지키는 궁에 어떻게 들어가겠습니까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "약방 뒤 물길로 간다"
              add: { insight: 1 }
              goto: entry_water
            - text: "천명의 가마로 들어간다"
              add: { cheonmyeong_trust: 1 }
              goto: entry_carriage
            - text: "체포된 사람처럼 들어간다"
              add: { bidam_trust: 1, power: 1 }
              goto: entry_prisoner
            - text: "군사로 정문을 부순다"
              goto: go_31_broken_gate

  entry_water:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - say:
          with: [덕만, 월명]
          text: "월명은 약방 뒤 수로에서 등불을 가리고 기다렸습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "버린 약 냄새가 물에 남았습니다. 원래 약을 쏟고 독이 든 상자를 올린 것이 분명합니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "아버지께 갈 약은 있습니까?"
      - say:
          char: 월명.sad
          camera: close
          with: [덕만]
          text: "독이 더 퍼지는 것은 늦출 수 있습니다. 낫게 한다고는 말씀드리지 못합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "할 수 있는 일만 분명히 말해 주십시오. 그걸 믿고 가겠습니다."
      - goto: palace_fire

  entry_carriage:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 천명, position: right }
      - char: { id: 덕만, position: left }
      - say:
          with: [천명, 덕만]
          text: "덕만은 천명의 가마 밑 나무틀에 몸을 붙이고 동문을 지났습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "창끝이 휘장을 들면 내가 먼저 소리칠게. 그동안 반대쪽으로 내려."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니가 잡히면 저도 내리지 않을 거야. 같이 빠져나갈 길부터 봐."
      - say:
          with: [천명, 덕만]
          wait: 750
          text: "문지기가 가마 안을 살피는 동안 천명은 무릎의 떨림을 두 손으로 눌렀습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "무서워도 할 수 있네. 네가 말한 대로야."
      - goto: palace_fire

  entry_prisoner:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "비담은 덕만의 손목에 느슨한 수갑을 채우고 체포한 죄인처럼 감옥 문을 통과했습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "거짓 왕명도 죄인을 데려오는 사람에게는 문을 잘 열어 줍니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "문이 닫히면 수갑을 풀고 기록 창고 쪽 사람부터 빼내세요."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "전하께서는 왕의 방으로 가시고, 저는 불 속으로 가라는 말씀이군요."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "가장 위험한 일을 맡깁니다. 돌아오면 그 값을 제 앞에서 직접 말하세요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "이번에는 잊지 않겠습니다. 전하도 잊지 마십시오."
      - goto: palace_fire

  palace_fire:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - effect: embers
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - char: { id: 천명, position: center }
      - say:
          with: [덕만, 유신, 천명]
          text: "덕만이 궁 안에 들어서자 기록 창고에서 불길이 솟고, 옆 연회장에서는 갇힌 시종들이 문을 두드렸습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "왕의 방에는 칠숙의 병사 여덟이 있습니다. 연회장 안에는 스무 명이 넘게 갇혔습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "기록 창고에는 원본 장부와 도장 사용 기록이 있어. 불이 번지면 모두 없어져."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신, 천명]
          text: "제가 세 곳에 갈 수는 없어. 대신 맡길 사람은 있습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "누가 어디를 맡을지 명령하십시오. 한곳을 고르는 동안 나머지도 움직이겠습니다."
      - choice:
          key: c6_rescue
          prompt: "불길과 왕의 숨이 함께 약해집니다."
          char: 덕만
          camera: close
          with: [유신, 천명]
          options:
            - text: "월명과 왕의 방으로 간다"
              add: { legitimacy: 1, power: 1 }
              goto: rescue_king
            - text: "갇힌 사람을 먼저 꺼낸다"
              add: { people_support: 1, cheonmyeong_trust: 1 }
              goto: rescue_people
            - text: "원본 기록을 구한다"
              add: { insight: 1, bidam_trust: 1 }
              goto: rescue_records
            - text: "칠숙을 혼자 쫓아간다"
              goto: go_32_empty_chase

  rescue_king:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - say:
          with: [덕만, 월명]
          text: "유신은 연회장 문으로, 천명은 기록 창고로 향했고 덕만은 월명과 왕의 방을 열었습니다."
      - say:
          char: 월명.sad
          camera: close
          with: [덕만]
          text: "맥이 약하지만 아직 들으실 수 있습니다. 독을 늦추는 약부터 쓰겠습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "왕으로 하실 말이 남았습니다. 딸로 드릴 인사도 남았고요."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "그러면 손을 잡고 기다리십시오. 눈을 뜨실 힘을 남겨 드리겠습니다."
      - goto: seal_discovery

  rescue_people:
    actions:
      - bg: banquet_hall
      - camera: wide
      - effect: impact
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          with: [덕만, 천명]
          text: "덕만과 천명은 뜨거워진 문에 젖은 천을 감고 빗장을 함께 당겼습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "아버지께 가지 않아도 괜찮겠어?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "월명이 먼저 갔어. 우리는 아버지가 지키던 사람을 꺼내."
      - say:
          with: [덕만, 천명]
          text: "문이 열리자 시종들과 어린 견습들이 연기 속에서 기어 나왔습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "모두 나왔어. 이제 아버지께 가자. 늦어도 같이 가."
      - goto: seal_discovery

  rescue_records:
    actions:
      - bg: locked_room
      - camera: wide
      - effect: embers
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "유신은 갇힌 사람을 꺼내고 월명은 왕의 방으로 갔습니다. 덕만과 비담은 불붙은 기록방에 들어갔습니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "도장 사용 기록은 오른쪽 함에 있습니다. 곡식 장부는 이미 가져오셨으니 욕심내지 마십시오."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "왕의 도장을 마지막으로 빌린 이름만 확인하고 나갑니다."
      - say:
          with: [덕만, 비담]
          wait: 700
          text: "기록의 마지막 줄에는 칠숙이 왕의 약 상자를 확인한다며 도장을 빌렸고, 돌려준 기록은 없다고 적혀 있었습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "이제 나가야 합니다. 전하까지 기록 속 사람이 되게 둘 수는 없습니다."
      - goto: seal_discovery

  seal_discovery:
    actions:
      - bg: princess_chamber
      - camera: medium
      - effect: { name: focus, wait: true }
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "왕의 방 구석에 버려진 약 상자를 뒤집자, 밑바닥의 이중 판에서 금빛 도장과 젖은 명령서가 나왔습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "공주님을 잡으라는 명령을 찍은 뒤 도장을 여기 숨겼군요. 왕이 돌아가시면 다시 가져갈 생각이었겠지요."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "아버지 약과 왕명을 같은 상자에서 바꿨습니다. 하나가 들키면 다른 하나도 끝나는 계획입니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "이 도장으로 거짓 명령을 취소할 수 있습니다. 하지만 누가 찍었는지도 직접 밝히셔야 합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "왕이 숨을 쉬는 동안 제가 왕의 이름을 쓰게 되는군요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "옳았는지는 내일 설명하십시오. 오늘은 사람을 잡으러 오는 명령부터 멈춰야 합니다."
      - goto: seal_choice

  seal_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - choice:
          key: c6_seal
          prompt: "훔친 왕의 도장이 덕만의 손에 놓였습니다."
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "체포 명령만 취소한다"
              set: { has_royal_seal: true }
              add: { legitimacy: 1 }
              goto: seal_cancel
            - text: "도장과 기록을 공개한다"
              set: { has_royal_seal: true }
              add: { insight: 1, nobles_support: 1 }
              goto: seal_public
            - text: "왕이 직접 명령하게 한다"
              add: { legitimacy: 2 }
              goto: seal_king
            - text: "도장으로 즉위를 선포한다"
              goto: go_33_seal_crown

  seal_cancel:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "체포 명령을 거두되 다른 왕명은 만들지 않습니다. 제가 도장을 썼다고 각 궁문에 함께 알리세요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "왕의 이름을 함부로 썼다고 공격할 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "살려고 썼고 거짓 명령을 멈췄다고 제가 직접 답하겠습니다."
      - goto: kings_last_command

  seal_public:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          with: [덕만, 진운]
          text: "덕만은 훔친 도장과 도장 사용 기록을 궁문 앞에 나란히 놓고 진운에게 확인하게 했습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "기록의 흠집과 도장의 흠집이 같습니다. 칠숙공이 빌린 뒤 돌려주지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "진운공의 이름으로도 확인해 주시겠습니까?"
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "예. 누구를 왕으로 고를지는 나중 일입니다. 거짓 왕명부터 멈춥니다."
      - goto: kings_last_command

  seal_king:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "전하, 도장을 되찾았습니다. 거짓 체포 명령을 거두어 주십시오."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "붓을 가져와라. 손이 떨리면 네가 받쳐라. 글은 내가 정한다."
      - say:
          with: [진평왕, 덕만]
          text: "덕만이 왕의 손목을 받치자 진평왕은 체포 명령을 취소하고 칠숙의 군사를 해산하라는 글을 남겼습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "따르지 않는 자는 내 이름으로 반역을 묻는다."
      - goto: kings_last_command

  kings_last_command:
    actions:
      - bg: princess_chamber
      - camera: medium
      - effect: darken
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          with: [진평왕, 덕만]
          wait: 1000
          text: "날이 바뀌기 직전, 왕의 방에는 진평왕과 덕만만 남았습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "궁문은 열렸느냐?"
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "예. 갇힌 사람들도 나왔고, 거짓 명령도 멈췄습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "잘했다. 이제 듣기 싫은 말도 들어라."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "말씀하십시오."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "내가 오래 왕좌에 앉는 동안 귀족의 창고와 사병이 너무 커졌다. 왕명을 내리고 닿았는지는 살피지 않았다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "그 값이 네게 누명과 칼로 돌아왔다. 내 실패다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "저는 살아남을 때마다 누군가를 두고 왔습니다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "왕은 모두를 살릴 수 없다. 대신 누구를 두고 왔는지는 잊어선 안 된다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "아버지도 잊지 않으셨습니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "잊지 않았다. 그래서 이렇게 늦게 사과한다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "제가 살아남았다고 전하의 잘못이 사라지지는 않습니다. 그래도 지금은 아버지 손을 잡겠습니다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "그래. 그것은 명령 없이 해도 된다."
      - say:
          with: [진평왕, 덕만]
          wait: 900
          text: "덕만은 왕의 도장 대신 아버지의 차가운 손을 두 손으로 감쌌습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "아버지로 묻겠다. 무섭느냐?"
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "예. 누구를 살리고도 다른 사람을 잃을까 두렵습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "두려운 채로 판단해라. 두려움을 숨기면 남의 목숨이 숫자가 된다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          wait: 1050
          unskippable: true
          text: "<speed=17>내 뒤를 이을 사람은 너다. 그러나 내 이름 뒤에 숨지는 마라.</speed>"
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          wait: 1050
          unskippable: true
          text: "<speed=17>네가 살린 사람과 네게 반대할 사람 앞에서 왕위를 얻어라.</speed>"
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "아버지의 유언만 들고 왕좌에 가지 않겠습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "좋다. 마지막 명령도 들었구나."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          wait: 1100
          unskippable: true
          text: "<speed=17>덕만아, 왕보다 먼저 살아라.</speed>"
      - say:
          with: [진평왕, 덕만]
          wait: 1400
          text: "진평왕의 손에서 힘이 풀렸습니다. 덕만은 한동안 그 손을 내려놓지 않았습니다."
      - effect: { name: darken, wait: true }
      - say:
          delivery: calm
          text: "진평왕은 왕으로 내린 마지막 명령과 딸에게 남긴 마지막 말을 마친 뒤 숨을 거두었습니다."
      - goto: sisters_mourning

  sisters_mourning:
    actions:
      - bg: princess_chamber
      - camera: medium
      - effect: focus
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          delivery: calm
          text: "문이 조심스레 열렸습니다. 머리 장식도 다 매지 못한 천명이 방 안으로 들어왔습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "나, 늦었어?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "마지막 말씀은 들었어요. 언니에게 남길 말씀은…… 못 물었어요."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "또 혼자 다 들으려고 했지."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "미안해요."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "아버지가 마지막에 네 이름을 불렀지."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "그래도 내가 딸이 아닌 건 아니야."
      - say:
          with: [덕만, 천명]
          wait: 700
          text: "천명은 덕만의 손을 펴고 그 안에 자기 손을 포갰습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "네가 기억하는 아버지와 내가 기억하는 아버지를 합치자."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "그러면 빠진 말이 조금은 줄 거야."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "그러면 아버지가 너무 좋은 사람으로 남을 텐데요."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "조금은 그래도 돼. 오늘만."
      - effect: moonveil
      - say:
          with: [덕만, 천명]
          wait: 900
          text: "두 자매는 동이 틀 때까지 왕의 손이 아닌 서로의 손을 잡고 있었습니다."
      - goto: succession_council

  succession_council:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          delivery: calm
          text: "632년 1월 아침, 귀족 대표들이 다음 왕을 정하는 화백회의에 모였습니다."
      - say:
          with: [덕만, 진운, 칠숙]
          text: "덕만은 아버지의 유언장을 들지 않았습니다. 검은 독가루와 혼인 합의서, 계승 맹약의 조각을 원본 곡식 장부 위에 놓았습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 진운]
          text: "돌아가신 전하의 뜻을 입증할 글도 없이 왕좌를 요구하십니까?"
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "전하의 마지막 뜻은 들었습니다. 그러나 오늘은 살아 있는 이들에게 제 일을 묻겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "칠숙공과 그 집들은 곡식을 훔쳐 사병을 먹였고, 제 혼인으로 왕의 군사와 창고를 나누려 했습니다."
      - say:
          char: 칠숙.angry
          camera: close
          with: [덕만]
          text: "왕 한 사람이 군사와 곡식을 모두 쥐는 일이 더 위험합니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "그래서 장부와 반대 의견을 공개하겠습니다. 그러나 굶는 사람 앞에서 열쇠를 숨길 권리는 나누지 않겠습니다."
      - say:
          char: 칠숙.angry
          camera: medium
          with: [덕만]
          text: "신라에는 여자가 왕이 된 적이 없습니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "전례가 없다는 말은 할 수 없다는 증거가 아닙니다. 제가 한 일과 할 일을 보고 표를 정하십시오."
      - branch:
          cases:
            - when:
                var: rival_trust
                op: gte
                value: 3
              goto: jinun_free_vote
          default: jinun_hard_vote

  jinun_free_vote:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "저도 왕이 될 뜻이 있습니다. 그 뜻은 지금도 바뀌지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "압니다. 그러니 빚이 아니라 판단으로 표를 주십시오."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          wait: 750
          text: "공주님은 제 어머니를 살리고도 제 사퇴를 요구하지 않았습니다. 북쪽의 손실도 숨기지 않았습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "이번 표는 덕만공주께 드립니다. 왕이 된 뒤 제가 반대할 자리도 남겨 주십시오."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "내 곁에서 반대하십시오. 듣고도 결정은 제가 내리겠습니다."
      - goto: coronation_finish

  jinun_hard_vote:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "공주님을 다 믿지는 않습니다. 저도 왕이 될 자격이 있다고 생각합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 판단까지 바꾸라고 하지 않겠습니다. 오늘 표만 직접 정하십시오."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "협박과 훔친 곡식으로 산 표는 받지 않겠습니다. 제 표는 덕만공주께 드립니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "남은 의심은 왕이 된 뒤 직접 없애십시오."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 의심을 금하지 않겠습니다."
      - goto: coronation_finish

  coronation_finish:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: { name: crown, wait: true }
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 진운, position: right }
      - say:
          with: [덕만, 유신, 진운]
          wait: 900
          text: "진운의 표 뒤로 북쪽 성의 증언과 공개 장부를 확인한 귀족들이 하나씩 덕만에게 표를 보탰습니다."
      - say:
          with: [덕만, 유신, 진운]
          text: "칠숙은 왕의 도장을 훔치고 독살을 꾀한 혐의로 체포되었습니다. 그의 병사들은 지휘 문서를 확인한 뒤 무기를 내려놓았습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "회의의 뜻이 모였습니다. 명령을 내려 주십시오."
      - say:
          char: 덕만
          camera: close
          with: [유신, 진운]
          wait: 1000
          unskippable: true
          text: "<speed=17>들어라. 지금부터 신라의 왕은 덕만이다.</speed>"
      - say:
          delivery: calm
          wait: 800
          text: "632년 1월, 덕만은 선덕왕이 되었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "첫 명령이다. 끊긴 곡식길을 열고, 오늘 굶는 곳부터 왕실 창고를 풀어라."
      - say:
          char: 덕만
          camera: medium
          with: [유신, 진운]
          text: "칠숙과 아진의 죄는 따로 묻는다. 명령한 사람 뒤에 강요받은 사람을 숨기지 마라."

  go_31_broken_gate:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: impact
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "문 안에도 전하를 따르는 병사들이 있습니다. 문을 부수면 그들부터 깔립니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "아버지가 죽어 갑니다. 지금 부수십시오."
      - say:
          with: [덕만, 유신]
          text: "세 번째 충격에 궁문이 안쪽으로 무너졌고, 같은 깃발을 단 병사들이 잔해 아래에 깔렸습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "안쪽 병사들이 우리가 왕궁을 공격했다고 외칩니다."
      - effect: darken
      - gameOver:
          title: "운명 31 — 안으로 무너진 문"
          message: "왕을 구하려 부순 궁문이 왕을 지키던 병사들을 죽였고, 덕만은 왕궁을 공격한 반역자로 붙잡혔습니다."

  go_32_empty_chase:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: right }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "사람과 기록을 두고 저 하나를 쫓아오셨군요."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "여기서 끝냅니다."
      - say:
          with: [덕만, 칠숙]
          text: "칠숙은 빈 복도 끝의 문을 닫고 사라졌습니다. 그동안 불은 기록 창고에서 연회장으로 번졌습니다."
      - effect: darken
      - say:
          text: "덕만이 돌아왔을 때 진평왕은 마지막 명령을 남기지 못한 채 숨을 거두었고, 갇힌 사람들도 불길 속에 남았습니다."
      - gameOver:
          title: "운명 32 — 한 사람을 쫓은 밤"
          message: "배후 한 사람을 잡으려다 왕과 증인과 사람들을 모두 놓쳤습니다. 칠숙은 혼란 속에서 끝내 달아났습니다."

  go_33_seal_crown:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 덕만, position: center }
      - char: { id: 진운, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "왕의 도장이 제 손에 있습니다. 지금부터 제가 신라의 왕입니다."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "도장을 훔쳐 쓴 칠숙과 무엇이 다릅니까? 회의도 표도 거치지 않았습니다."
      - say:
          with: [덕만, 진운]
          text: "즉위를 알리는 북은 한 번 울렸고, 두 번째 북을 칠 사람은 나타나지 않았습니다."
      - effect: { name: darken, wait: true }
      - say:
          text: "정오가 되자 진운의 이름을 외치는 군사들이 회의장을 둘러쌌습니다."
      - gameOver:
          title: "운명 33 — 도장 하나의 왕"
          message: "도장으로 먼저 왕을 선포한 덕만은 살아 있는 이들의 동의를 잃었고, 반나절 만에 왕좌에서 끌려 내려왔습니다."
