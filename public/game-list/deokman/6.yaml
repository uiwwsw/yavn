          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "아니면 그 도장이 돌아가신 전하의 뜻이라는 겁니까?"
      - say:
          text: "새 왕을 알리는 북이 한 번 울렸다. 그다음 북소리는 끝내 들리지 않았다."
      - say:
          text: "정오가 되자 진운의 이름을 외치는 군사들이 왕의 회의장을 에워쌌다."
      - say:
          char: 칠숙
          camera: close
          with: [덕만]
          text: "반나절이면 충분히 앉아 보셨습니다. 이제 내려오시지요."
      - effect: darken
      - gameOver:
          title: "운명 33 — 울리지 않은 북"
          message: "덕만의 첫 명령은 궁문 밖에 닿지 못했다. 반나절 뒤 왕좌는 다시 비었다."
