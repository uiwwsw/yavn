chapterTitle: "왕이 약한 이유"

script:
  - scene: empty_seal

scenes:
  empty_seal:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제7장 — 왕이 약한 이유"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: action
          text: "아버지가 옥새함을 내미신다. 들어 보니 뜻밖에 가볍다. 안의 비단에는 인장이 눌러 만든 네모난 자국만 남았다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "하루만 조용히 넘기자 했다. 창고도 군사도… 그러다 보니 돌려달란 말조차 못 하겠더구나."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "제 이름을 지울 때도, 그 하루를 넘기려 하셨나요?"
      - sticker: { id: c7_seal_box, image: empty_seal_box_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 320px)", anchorX: center, anchorY: center, enter: scaleIn }
      - get: empty_seal_box
      - clearSticker: { id: c7_seal_box, leave: fadeOut }
      - goto: confession_choice

  confession_choice:
    actions:
      - choice:
          key: c7_confession
          prompt: "아버지가 빈 옥새함에서 손을 떼지 못하신다."
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "왕은 숨기고 빼앗긴 권한만 벽에 붙인다"
              set: { king_failure_public: false }
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: publish_powers
            - text: "왕을 궁문 앞에 세워 직접 말하게 한다"
              set: { king_failure_public: true }
              add: { people_support: 2, king_trust: 2, nobles_support: -1 }
              goto: public_confession
            - text: "옥새함을 닫고 덕만이 비난을 받는다"
              set: { king_failure_public: false }
              add: { king_trust: 3, fear: 1, people_support: -1 }
              goto: inherit_blame

  public_confession:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - say:
          char: 진평왕.weak
          camera: medium
          text: "내가 허락했다. 저들이 가져갈 때마다 내 인장을 내주었다. 딸들 앞에서도 숨겼다."
      - say:
          channel: action
          text: "궁문 밖에서 야유가 오른다. 아버지의 팔이 떨린다. 나는 잡아드리려던 손을 거둔다. 아직 하실 말씀이 남아 있다."
      - goto: rebuild_power

  publish_powers:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "왕이 목록에 인장을 눌렀다. 덕만이 종이를 들고 문밖으로 나가는 동안 그는 자리에서 일어나지 못했다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "진평왕"
          text: "전하께서 한 줄씩 확인하셨소. 의심하는 이는 앞으로 나와 인장을 보시오."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "마지막 줄도 읽거라. 내 이름이 있는 데까지."
      - say:
          channel: "narration"
          text: "귀족들은 왕께 직접 묻겠다며 물러났다. 창고 열쇠는 다음 날에야 나왔다. 기다리던 줄에서는 몇 사람이 이미 집으로 돌아간 뒤였다."
      - add:
          people_support: -1
      - say:
          channel: thought
          text: "내가 읽는 동안에도 사람들은 문 안을 기웃거렸다. 아버지가 직접 나오기를 기다렸구나."
      - goto: "rebuild_power"

  inherit_blame:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "덕만이 함 뚜껑을 덮으려 하자 왕의 손이 사이에 들어왔다. 늙은 손등에 뚜껑 자국이 붉게 남았다."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "또 네 이름을 대신 적게 할 셈이냐. 이번에는 안 된다."
      - say:
          char: "덕만.sad"
          camera: "medium"
          with:
            - "진평왕"
          text: "아버지 이름도 남길게요. 다만 오늘은… 밖에 서시지 않아도 돼요."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "늙은 아비가 딸 뒤에 숨는구나. 붓을 다오. 서명은 내가 하마."
      - say:
          channel: "narration"
          text: "두 이름이 나란히 마를 때까지 방 안은 조용했다. 문밖에서는 왕의 뜻이 무엇이냐고 묻는 소리가 그치지 않았다."
      - add:
          king_trust: 1
          people_support: -2
      - say:
          channel: thought
          text: "아버지는 눈을 감으셨다. 편안해 보이셔서 차마 깨우지 못했다. 밖에서 기다리는 사람들에게는 내가 나가야 한다."
      - goto: "rebuild_power"

  rebuild_power:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 유신, position: right }
      - say:
          camera: wide
          channel: thought
          text: "열쇠와 지휘패와 붓이 놓여 있다. 창고 앞에서 돌아서던 사람들이 생각난다. 나는 열쇠 쪽으로 손을 옮긴다."
      - choice:
          key: c7_first_power
          prompt: "돌려받은 것들이다. 무엇부터 손에 쥘까?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "창고 열쇠를 마을과 반씩 나눈다"
              add: { people_support: 2, nobles_support: -1, insight: 1 }
              goto: restore_granary
            - text: "지휘패를 유신의 허리에 채운다"
              add: { army_support: 3, yushin_trust: 2, fear: 1 }
              goto: restore_army
            - text: "왕명 하나에 붓 두 자루를 붙인다"
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: restore_records

  restore_granary:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: action
          text: "열쇠 하나를 마을 대표에게 준다. 두 사람이 함께 돌려야 빗장이 빠진다. 그는 품에 넣기 전에 열쇠를 한 번 더 들여다본다."
      - goto: council_counterattack

  restore_army:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "지휘패는 받겠습니다. 출병 명은 궁에도 한 벌 남겨 주십시오."
      - say:
          char: "덕만"
          text: "군량은 마을에서 세게 할 거야. 네가 급하다고 해도 그건 지켜."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "예. 성문부터 되찾겠습니다. 병사 명부는 내일 대조하겠습니다."
      - say:
          channel: "narration"
          text: "해 지기 전 성문 깃발이 바뀌었다. 창고를 열 병력은 그날 돌아오지 못했다. 배급을 기다리던 사람들에게 내일 다시 오라는 말이 전해졌다."
      - add:
          people_support: -1
      - say:
          channel: thought
          text: "성문을 먼저 지키라 한 건 나다. 오늘 저녁을 못 먹은 사람에게도 같은 말을 할 수 있을까."
      - goto: "council_counterattack"

  restore_records:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - say:
          channel: "narration"
          text: "같은 명을 두 사람이 베꼈다. 유신이 두 종이를 겹쳐 보다가 손을 멈췄다. 창고를 연다는 글자 하나가 달랐다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "그 명은 멈춰라. 대피시킬 사람은 먼저 옮기고. 누가 고쳤는지 이름을 받아 와."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "고친 자는 찾았습니다. 창고는… 두 시진 늦었습니다."
      - say:
          channel: "narration"
          text: "처벌할 이름이 장부에 올랐다. 창고 앞에서는 늦게 배급받은 사람들이 벌써 어둠 속으로 걸어가고 있었다."
      - add:
          people_support: -2
      - say:
          channel: thought
          text: "틀린 글자는 바로잡았다. 늦은 두 시진도 고칠 수 있으면 좋으련만."
      - goto: "council_counterattack"

  council_counterattack:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          camera: wide
          channel: narration
          text: "조회에 새 의자가 들어왔다. 등받이에 천명의 이름이 새겨져 있었다. 귀족 하나가 천명에게 자리를 권하며, 덕만 쪽에 놓인 열쇠를 끌어당겼다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "앉으라며 네 열쇠를 당기더라. 내가 저 의자에 앉으면 네 앞을 막아야 한대."
      - choice:
          key: c7_regency
          prompt: "언니 이름이 새겨진 의자가 내 맞은편에 놓인다."
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "둘이 함께 앉아 명령마다 공동 서명한다"
              add: { cheonmyeong_trust: 2, nobles_support: 2, people_support: -1 }
              goto: shared_regency
            - text: "왕명을 읽어 귀족 대표를 전부 묶는다"
              goto: bad_empty_order
            - text: "의자를 치우고 궁문 밖까지 회의를 연다"
              add: { people_support: 2, insight: 1, nobles_support: -1 }
              goto: open_council

  shared_regency:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "천명이 옆으로 비켜 덕만의 자리를 냈다. 첫 명령서가 두 사람 앞에 놓였다. 귀족들은 두 자매가 모두 서명할 때까지 기다렸다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "덕만아, 손 보여 줘. 왜 이렇게 붉니? 그 붓 내려놔."
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [천명]
          text: "언니 것은 만지지 마. 내 붓만… 내 것에만 묻었어."
      - say:
          channel: narration
          text: "덕만의 이름이 반쯤 쓰이다 멎었다. 천명이 붓을 걷어 내자 귀족 하나가 새 명령서를 내밀었다. 서명할 자리는 하나뿐이었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공동 섭정 첫날 — 덕만 공주, 서명 중 독살. 천명 공주 단독 섭정으로 전환."
      - gameOver:
          title: "운명 — 두 이름 중 하나의 독"
          message: "천명은 두 이름을 남기라 했으나, 관원들은 살아 있는 사람의 서명만 받았다. 덕만이 쥐었던 붓은 증거함에 봉해졌다."
          recoverToChoice: c7_regency

  open_council:
    actions:
      - say:
          channel: action
          text: "회의장 문을 연다. 진흙 묻은 짚신이 문턱에서 멈춘다. 나는 의자를 뒤로 민다. 들어와 말하라 하니, 맨 앞의 노인이 품에서 접은 종이를 꺼낸다."
      - goto: weak_king_end

  weak_king_end:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          camera: medium
          char: 진평왕.weak
          text: "네가 다 쥘 줄 알았다. 나처럼 다시 빼앗길까 무서워서."
      - say:
          char: 덕만
          text: "무서워요. 그러니까 나눠 두려는 거예요. 제가 놓쳐도 누군가는 쥐고 있게."
      - say:
          channel: thought
          text: "저 의자가 어릴 때보다 작아 보인다. 아버지는 저기서 자꾸 작아지셨구나. 나는 빈 옥새함을 닫아 드린다."
      - say:
          channel: action
          text: "구휼 순행표를 받는다. 서기관의 손끝이 붉다. 빈 옥새함에 남았던 인주와 같은 빛이다. 물으려는데 마차에서 천명이 나를 부른다. 나는 종이를 접어 소매에 넣는다."
          with: []
          camera: wide
          continueLabel: 순행표를 챙겨 언니의 마차에 오른다
      - goto: /7.yaml

  bad_empty_order:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          char: 덕만.angry
          text: "왕명을 받들라. 이 자리에 든 귀족 대표들을 모두 포박하라!"
      - say:
          channel: narration
          text: "병사 절반이 창을 들었다. 나머지는 움직이지 않았다. 묶여 가는 귀족 하나가 제 집 병사의 이름을 불렀다. 회의장 밖에서 빗장이 내려갔다."
      - say:
          char: 천명.nervous
          text: "덕만아. 저 병사들, 우리를 보고 있지 않아. 문이 닫혀…"
      - say:
          channel: record
          text: "귀족 회의는 왕실의 불법 체포와 공동 섭정 강요를 명분으로 성문을 폐쇄함. 덕만 공주와 천명 공주, 회의장 화재로 사망."
      - gameOver:
          title: "운명 — 함께 잠긴 왕실"
          message: "왕명을 다시 읽어도 문은 열리지 않았다. 천명이 덕만의 소매로 연기를 막았다. 밖에서는 두 사람의 이름을 지울 회의가 시작되었다."
