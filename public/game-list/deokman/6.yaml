script:
  - scene: chapter6_open
  - scene: coronation_finish

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          text: "제6장 — 아버지 없는 아침"
      - say:
          delivery: calm
          text: "같은 밤, 631년 겨울. 진평왕 53년의 마지막 밤이었습니다."
      - say:
          with: [덕만, 천명]
          delivery: calm
          text: "모든 궁문에 덕만의 체포령이 붙었습니다."
      - say:
          with: [덕만]
          text: "진운을 노린 매복이 실패한 지 몇 시간 뒤였습니다."
      - say:
          with: [덕만]
          text: "체포령에는 덕만이 왕을 해치려 한 역적이라 적혀 있었습니다."
      - say:
          with: [덕만, 천명]
          text: "진평왕은 약방에서 나온 독에 쓰러졌습니다."
      - say:
          with: [덕만, 천명]
          text: "왕의 방과 기록 창고는 칠숙의 병사들에게 막혀 있었습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "도장 흠집까지 진짜야."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "일곱 살 때 제가 떨어뜨린 자리예요."
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "아버지 손에서 훔쳤군요."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니, 다친 데는요?"
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "없어. 무서워서 떨리는 거야."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "무서운 건 나중에 같이 해요."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "약방에서 빈 상자가 나왔어."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "그 뒤 아버지 보초도 바뀌었고."
      - say:
          text: "천명이 네 가지 물건을 바닥에 놓았습니다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "월명의 약초, 내 가마."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "유신의 신호천, 비담의 수갑."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "다들 목숨 걸고 절 들여보냈군요."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "그러니 혼자 갚으려 하지 마."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "이번엔 같이 들어가."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니까지 위험해져요."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "네가 혼자 가는 것보단 나아."
      - goto: entry_choice

  entry_choice:
    actions:
      - choice:
          key: c6_entry
          prompt: "막힌 궁으로 어떻게 들어갈까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "약방 수로로 간다"
              add: { insight: 1 }
              goto: entry_waterway
            - text: "천명의 가마에 숨는다"
              add: { cheonmyeong_trust: 1 }
              goto: entry_procession
            - text: "정문을 부순다"
              goto: go_31_gate_breaker
            - text: "체포된 척 들어간다"
              add: { bidam_trust: 1, power: 1 }
              goto: entry_prison

  entry_waterway:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "월명은 약방 뒤 수로 입구에서 기다리고 있었습니다."
      - say:
          with: [덕만, 월명]
          text: "수로의 검은 물에서는 왕이 먹는 약 냄새가 났습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "수로는 약방 뒤로 이어집니다."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "물에서 감초 냄새가 납니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "아버지 약을 여기 버렸군요."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "갈림길에 보초가 둘입니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "싸우지 말고 지나가죠."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "그럼 가슴까지 잠깁니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "숨이 차도 참겠습니다."
      - goto: rescue_choice

  entry_procession:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 천명
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "덕만은 천명의 가마 밑 가로대에 몸을 붙였습니다."
      - say:
          char: 천명
          camera: medium
          with: []
          text: "발이 보여. 일곱 살 때랑 똑같아."
      - say:
          char: 덕만
          camera: medium
          with: []
          text: "그때도 언니가 가려 줬잖아요."
      - say:
          char: 천명.nervous
          camera: close
          with: []
          text: "둘 다 잡히면 어떡해?"
      - say:
          char: 덕만
          camera: close
          with: []
          text: "같이 들어가고 같이 나와요."
      - say:
          text: "창끝이 휘장을 들췄습니다."
      - say:
          text: "천명이 발로 덕만의 신발을 치마 밑에 숨겼습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: []
          text: "이번 약속은 꼭 지켜."
      - say:
          with: [덕만, 천명]
          text: "가마가 담장 안에 멈춘 뒤 덕만이 내려왔습니다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니 손을 잡고 나올게요."
      - goto: rescue_choice

  entry_prison:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 덕만에게 수갑을 채우고, 체포한 척 궁 안으로 데려갔습니다."
      - say:
          with: [덕만, 비담]
          text: "감옥 문이 닫힌 뒤에야 숨겨 둔 열쇠를 꺼냈습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "감옥에 넣어 달라는 부탁은 처음입니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "안에서 문을 열 겁니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "실패하면 전 역적입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "성공하면 아무도 모르게 해 드리죠."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그 보상은 좀 서운하군요."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "그래도 살아서 빚을 갚으십시오."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          text: "궁 안에 들자 왕의 위급을 알리는 약방 종이 세 번 울렸습니다."
      - say:
          text: "종루엔 천명의 붉은 천이 거꾸로 걸렸습니다."
      - say:
          text: "기록 창고에서는 불붙은 종이가 날아왔습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "사람이 모자랍니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "저는 종루로 가겠습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "아버지와 언니, 기록 창고까지……."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "제가 정해도 됩니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "아뇨. 제가 고르겠습니다."
      - say:
          with: [덕만, 유신]
          text: "약방 종은 멎고 붉은 천은 불길에 가려졌습니다. 어느 곳도 더 기다릴 수 없었습니다."
      - choice:
          key: c6_rescue
          prompt: "먼저 누구에게 갈까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "아버지께 간다"
              add: { legitimacy: 1 }
              goto: rescue_king
            - text: "천명을 구한다"
              add: { army_support: 1, cheonmyeong_trust: 1 }
              goto: rescue_allies
            - text: "기록을 구한다"
              add: { insight: 1, power: 1 }
              goto: rescue_evidence
            - text: "아진을 쫓는다"
              goto: go_32_name_in_dark

  rescue_king:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "덕만은 다른 두 길을 뒤로하고 왕의 방으로 달렸습니다."
      - say:
          with: [덕만, 월명]
          text: "월명은 문을 막은 병사를 피해 진평왕의 손목을 짚고 있었습니다."
      - say:
          char: 월명.sad
          camera: medium
          with: [덕만]
          text: "독은 막았습니다."
      - say:
          char: 월명.sad
          camera: close
          with: [덕만]
          text: "하지만 맥이 너무 약합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "잠깐이라도 깨울 수 있습니까?"
      - say:
          char: 월명.sad
          camera: medium
          with: [덕만]
          text: "꼭 들어야 할 말이 있습니까?"
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "딸로서 인사하고 싶습니다."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "손을 잡고 이름을 부르십시오."
      - goto: seal_found

  rescue_allies:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          with: [덕만, 천명]
          text: "덕만은 종루의 밧줄을 끊고 천명을 끌어냈습니다."
      - say:
          with: [덕만, 천명]
          text: "멀리 왕의 방에서 약종이 한 번 더 울렸습니다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "왜 나한테 왔어?"
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "아버지께 갔어야지."
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "언니를 두고 갈 수 없었어요."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "나 때문에 아버지를 못 보면?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "그때 같이 후회해요."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "……알았어. 같이 가자."
      - goto: seal_found

  rescue_evidence:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "덕만은 불길 속에서 도장 기록부를 꺼냈습니다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [비담]
          text: "마지막으로 빌린 자는 칠숙입니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "돌려줬다는 칸은 비었군요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "이제 나가야 합니다."
      - say:
          text: "창고 밖 들것에 천명의 붉은 옷이 보였습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "언니가…… 혼자 있었어."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "공주님이 오셨어도 천명 공주님을 살렸을지는 모릅니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [비담]
          text: "그 말로 괜찮아지진 않아요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그래도 이 기록은 끝까지 가져가요."
      - set: { cheonmyeong_alive: false }
      - goto: seal_found

  seal_found:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "비담이 왕의 방에서 빈 약 상자를 뒤집었습니다."
      - say:
          text: "금빛 도장이 바닥을 굴렀습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이걸로 체포령을 취소할 수 있습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "훔친 도장으로 만든 명령입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "되찾은 제가 다시 찍으면요?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "내일 옳았는지 설명하십시오."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "오늘은 먼저 살아남고요."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "쉬운 답은 하나도 없군요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "살려면 도장을 쓰셔야 합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "그 도장을 쓰면 저도 칠숙처럼 가짜 왕명을 만드는 겁니다."
      - set: { has_royal_seal: true }
      - goto: seal_choice

  seal_choice:
    actions:
      - choice:
          key: c6_seal
          prompt: "되찾은 왕의 도장을 어떻게 할까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "체포 취소령을 찍는다"
              add: { power: 1 }
              goto: seal_command
            - text: "회의까지 봉해 둔다"
              add: { legitimacy: 1 }
              goto: seal_seal
            - text: "도장을 깨뜨린다"
              add: { people_support: 1, suspicion: -1 }
              goto: seal_break
            - text: "왕이 됐다고 외친다"
              goto: go_33_one_day_queen

  seal_command:
    actions:
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "체포령은 멈췄습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "이제 어느 명령이 진짜냐 묻겠지요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "제가 찍었다고 밝히겠습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "왕명을 만든 죄라 할 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "살기 위해 내렸다고 말하죠."
      - goto: kings_last_words

  seal_seal:
    actions:
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "도장을 얻고도 봉하셨군요."
      - say:
          char: 덕만.angry
          camera: medium
          with: [칠숙]
          text: "거짓 명령을 또 만들진 않습니다."
      - say:
