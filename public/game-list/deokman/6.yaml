script:
  - scene: empty_seal

scenes:
  empty_seal:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제7장 — 왕이 약한 이유"
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          channel: narration
          text: "밤의 왕좌에는 진평왕 혼자 앉아 있었습니다. 그는 일식표의 인영 옆에 옥새함을 놓고 천천히 뚜껑을 열었습니다. 비어 있었습니다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "사람들은 내가 착해서 약해졌다더구나. 아니다. 하루만 더 버티자며 하나씩 내줬어. 이제 이 의자만 남았다."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "왕좌를 지키느라 왕의 일을 다 넘기셨군요. 제 이름까지."
      - sticker: { id: c7_seal_box, image: empty_seal_box_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 320px)", anchorX: center, anchorY: center, enter: scaleIn }
      - get: empty_seal_box
      - clearSticker: { id: c7_seal_box, leave: fadeOut }
      - goto: confession_choice

  confession_choice:
    actions:
      - choice:
          key: c7_confession
          prompt: "왕의 실패와 빼앗긴 권한을 누가 직접 밝힐까요?"
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "왕은 숨기고 빼앗긴 권한만 벽에 붙인다"
              set: { king_failure_public: false }
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: publish_powers
            - text: "왕을 궁문 앞에 세워 직접 말하게 한다"
              set: { king_failure_public: true }
              add: { people_support: 2, king_trust: 2, nobles_support: -1 }
              goto: public_confession
            - text: "옥새함을 닫고 덕만이 비난을 받는다"
              set: { king_failure_public: false }
              add: { king_trust: 3, fear: 1, people_support: -1 }
              goto: inherit_blame

  public_confession:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - say:
          char: 진평왕.weak
          camera: medium
          text: "나는 평화를 지켰다고 했다. 거짓말이다. 내 자리를 하루씩 늘렸고, 백성과 내 딸들이 값을 냈다."
      - say:
          channel: narration
          text: "진평왕의 목소리가 궁문 밖까지 닿자 야유와 울음이 한꺼번에 터졌습니다. 귀족들은 고개를 돌렸지만 누구도 왕이 뱉은 말을 주워 담지 못했습니다."
      - goto: rebuild_power

  publish_powers:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "빼앗긴 권한의 목록에 진평왕의 도장이 찍혔습니다. 왕은 문밖에 서지 못했고 덕만이 목록을 읽었습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "진평왕"
          text: "이건 제 고발만이 아닙니다. 아버지가 한 줄씩 확인하고 도장을 찍었습니다."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "내 몸이 못 나가도 내 이름은 빼지 마라. 마지막 줄까지 읽어라."
      - say:
          channel: "narration"
          text: "귀족들은 왕의 건강을 핑계로 시간을 끌었습니다. 덕만은 하루 늦게 창고 열쇠를 넘겨받았습니다."
      - add:
          people_support: -1
      - say:
          channel: "record"
          text: "통치의 대가 — 실패를 공개했습니다. 왕이 빠진 자리를 덕만의 설명이 메워야 했습니다."
      - goto: "rebuild_power"

  inherit_blame:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "덕만이 옥새함을 닫자 진평왕은 손을 얹어 막았습니다. 한 사람의 서명으로 끝낼 문서는 아니었습니다."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "내 잘못에 네 이름만 쓰면 저들은 다음에도 너를 부를 게다."
      - say:
          char: "덕만.sad"
          camera: "medium"
          with:
            - "진평왕"
          text: "제 몫만 쓰겠습니다. 아버지 이름도 지우지 않을게요. 오늘은 밖에 안 나가셔도 돼요."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "덕만"
          text: "그 말이 더 아프구나. 붓을 다오. 내 이름은 내가 쓰겠다."
      - say:
          channel: "narration"
          text: "고백은 궁 안에 남았습니다. 두 사람이 나란히 서명했지만 문밖 사람들은 무슨 약속인지 알지 못했습니다."
      - add:
          king_trust: 1
          people_support: -2
      - say:
          channel: "record"
          text: "통치의 대가 — 아버지를 지켰습니다. 공개되지 않은 실패는 나중에 다시 물을 빚이 됐습니다."
      - goto: "rebuild_power"

  rebuild_power:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 유신, position: right }
      - say:
          camera: wide
          channel: narration
          text: "탁자 위에는 세 물건이 놓였습니다. 창고 열쇠, 군 지휘패, 기록관의 붓. 셋을 한꺼번에 잡는 순간 귀족 가문도 하나로 뭉칠 판이었습니다."
      - choice:
          key: c7_first_power
          prompt: "빼앗긴 권한을 되찾되 다시 독점하지 않으려면 무엇부터 바꿀까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "창고 열쇠를 마을과 반씩 나눈다"
              add: { people_support: 2, nobles_support: -1, insight: 1 }
              goto: restore_granary
            - text: "지휘패를 유신의 허리에 채운다"
              add: { army_support: 3, yushin_trust: 2, fear: 1 }
              goto: restore_army
            - text: "왕명 하나에 붓 두 자루를 붙인다"
              add: { evidence: 2, nobles_support: 1, insight: 1 }
              goto: restore_records

  restore_granary:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "왕실 관리와 마을 대표가 열쇠를 하나씩 들었습니다. 둘이 같은 문 앞에 서기 전까지 자물쇠는 꿈쩍하지 않았고, 누구도 혼자 자루를 빼돌릴 수 없었습니다."
      - goto: council_counterattack

  restore_army:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - say:
          char: "유신"
          camera: "medium"
          with:
            - "덕만"
          text: "지휘패는 받겠습니다. 다만 출병 명령은 궁에 한 벌 더 남기십시오."
      - say:
          char: "덕만"
          text: "군량은 마을에서 확인하게 할게. 네 패 하나로 솥까지 닫지는 못해."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "그 정도면 됩니다. 오늘은 성문부터 묶고, 내일 병사들 이름을 대조하겠습니다."
      - say:
          channel: "narration"
          text: "유신의 병력이 성문을 되찾았습니다. 마을의 배급은 하루 늦었고 덕만의 첫 명령은 군영에서 먼저 읽혔습니다."
      - add:
          people_support: -1
      - say:
          channel: "record"
          text: "통치의 대가 — 성문을 지켰습니다. 백성보다 군대가 먼저 왕의 힘을 받았습니다."
      - goto: "council_counterattack"

  restore_records:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - say:
          channel: "narration"
          text: "서고의 두 기록관이 같은 명령을 따로 베꼈습니다. 서로 다른 한 글자를 찾자 유신이 두 종이를 모두 회수했습니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          text: "다르면 멈춰. 급한 대피는 먼저 하고, 명령을 바꾼 이름은 해 지기 전에 남겨."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "위조문은 막았습니다. 대신 창고 개방이 두 시진 늦었습니다."
      - say:
          channel: "narration"
          text: "기록은 되찾았지만 창고 앞 줄은 길어졌습니다. 덕만은 늦은 배급의 날짜를 첫 감사 기록에 적었습니다."
      - add:
          people_support: -2
      - say:
          channel: "record"
          text: "통치의 대가 — 위조를 막을 절차가 생겼습니다. 기다린 사람들의 배는 아직 비었습니다."
      - goto: "council_counterattack"

  council_counterattack:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          camera: wide
          channel: narration
          text: "다음 조회에서 귀족들은 빈 옥새함 대신 섭정 의자를 들여왔습니다. 의자에는 천명의 이름이 새겨져 있었습니다. 되찾은 열쇠와 붓을 언니의 치맛자락에 다시 묶으려는 수였습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "안 앉으면 우리가 싸웠다 하고, 앉으면 내 이름으로 널 막겠지. 저 의자는 내 자리가 아니야."
      - choice:
          key: c7_regency
          prompt: "귀족들이 천명을 덕만의 반대편에 앉히려 합니다. 회의를 어떻게 바꿀까요?"
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "둘이 함께 앉아 명령마다 공동 서명한다"
              add: { cheonmyeong_trust: 2, nobles_support: 2, people_support: -1 }
              goto: shared_regency
            - text: "왕명을 읽어 귀족 대표를 전부 묶는다"
              goto: bad_empty_order
            - text: "의자를 치우고 궁문 밖까지 회의를 연다"
              add: { people_support: 2, insight: 1, nobles_support: -1 }
              goto: open_council

  shared_regency:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "천명이 의자 한쪽으로 몸을 비켰습니다. 모든 문서에 두 자매의 먹이 나란히 마를 때까지 명령은 나가지 않았습니다. 귀족들은 그 기다림까지 장부에 적었습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "이 먹 냄새 이상하지 않아? 아까부터 네 손가락만 붉게 부어. 붓 내려놔."
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [천명]
          text: "언니 붓은 괜찮아. 공동 서명이라면서 처음부터 나만 죽일 먹을 준비한 거야."
      - say:
          channel: narration
          text: "덕만의 붓에만 독이 배어 있었습니다. 왕위를 천명에게 몰아주려던 귀족들은 두 이름이 필요한 제도를 이용해, 한 사람이 죽으면 모든 명령도 멈추게 만들었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "공동 섭정 첫날 — 덕만 공주, 서명 중 독살. 천명 공주 단독 섭정으로 전환."
      - gameOver:
          title: "운명 — 두 이름 중 하나의 독"
          message: "자매의 서명을 한 종이에 묶자 질투하던 귀족은 덕만의 붓에만 독을 발랐습니다. 한 사람을 없애면 권력도 천명에게 자동으로 돌아가도록 만든 함정이었습니다."
          recoverToChoice: c7_regency

  open_council:
    actions:
      - say:
          channel: narration
          text: "회의장 문이 열리자 흙 묻은 짚신과 군화가 비단신 사이로 들어왔습니다. 목소리는 겹쳤고 결정은 느려졌지만, 누구도 문밖에서 결과만 기다리지는 않았습니다."
      - goto: weak_king_end

  weak_king_end:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 진평왕, position: right, emotion: weak }
      - char: { id: 덕만, position: left }
      - say:
          camera: medium
          char: 진평왕.weak
          text: "되찾은 걸 네 손에 다 쥘 줄 알았다. 나라면 또 빼앗길까 무서워 그랬을 테니까."
      - say:
          char: 덕만
          text: "한 손에 모으면 다음 왕도 다시 팔 겁니다. 왕이 약해도 창고는 열리고, 틀린 명령은 고치게 하겠습니다."
      - say:
          channel: record
          text: "진평왕은 약한 사람이어서만 약한 왕이 된 것이 아니었습니다. 권한 없는 왕좌를 평화라고 부른 시간이 왕을 약하게 만들었습니다."
      - say:
          channel: narration
          text: "귀족 회의는 두 공주에게 구휼 순행을 요구했습니다. 길을 짠 서기관의 손에는 잃어버린 옥새 인주가 묻어 있었습니다. 천명은 그걸 보고도 마차에 올랐습니다. 거절하면 열린 창고가 다시 닫힐 판이었습니다."
      - goto: /7.yaml

  bad_empty_order:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 천명, position: right, emotion: nervous }
      - say:
          char: 덕만.angry
          text: "왕명을 읽는다. 이 자리의 귀족 대표는 반역 혐의로 모두 포박하라."
      - say:
          channel: narration
          text: "대표들을 한꺼번에 묶는 순간 회의장 밖의 군사는 절반만 움직였습니다. 나머지 병사들의 군량과 가족은 체포된 귀족의 창고에 묶여 있었습니다."
      - say:
          char: 천명.nervous
          text: "사람을 모두 적으로 묶으면 우리 편이 설 자리도 사라져. 덕만아, 문이 닫히고 있어."
      - say:
          channel: record
          text: "귀족 회의는 왕실의 불법 체포와 공동 섭정 강요를 명분으로 성문을 폐쇄함. 덕만 공주와 천명 공주, 회의장 화재로 사망."
      - gameOver:
          title: "운명 — 함께 잠긴 왕실"
          message: "반대자를 한 번에 없애려는 왕명은 중립에 설 자리까지 지웠습니다. 귀족들은 회의장을 잠그고 불을 놓았고, 왕실의 두 후계자는 함께 죽었습니다."
