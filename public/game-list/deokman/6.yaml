script:
  - scene: chapter6_open
  - scene: kings_last_words

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - effect: alarm
      - char:
          id: 천명
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제6장 — 왕이 잠든 밤"
      - say:
          char: 천명.nervous
          framing: closeup
          with:
            - 덕만
          delivery: nervous
          text: "네 얼굴이 모든 궁문에 붙었어. 체포령에는 아버지 인장이 찍혀 있는데, 아버지는 아직 의식도 없어."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: nervous
          text: "언니, 손 떨고 있어. 다친 데는 없어?"
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "없어. 무서워서 그래. 아버지 방에는 못 들어가고, 군사들은 네가 왕을 해쳤다고 외치고 있어."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          text: "좋아. 무서운 건 나중에 같이 하자. 지금은 인장을 찾고 아버지께 가야 해. 언니가 본 것부터 말해 줘."
      - say:
          char: 천명.nervous
          framing: bust
          text: "약방 나인이 새벽에 빈 약함을 들고 나왔어. 그 뒤에 침전 보초가 바뀌었고."
      - say:
          char: 덕만
          framing: closeup
          text: "약방부터 보자. 해가 뜨기 전에 체포령이 거짓이라는 걸 밝혀야 해."
      - goto: entry_choice

  entry_choice:
    actions:
      - choice:
          key: c6_entry
          prompt: "궁문이 봉쇄됐다. 어떻게 들어갈까?"
          char: 덕만
          framing: closeup
          options:
            - text: "약재 수로로 간다"
              add:
                insight: 1
              goto: entry_waterway
            - text: "천명의 가마에 숨는다"
              add:
                sowon_trust: 1
                legitimacy: 1
              goto: entry_procession
            - text: "정문을 부순다"
              goto: go_31_gate_breaker
            - text: "체포된 척 들어간다"
              add:
                bidam_trust: 1
                suspicion: 1
              goto: entry_prison

  entry_waterway:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: full
          text: "이 수로는 약방 뒤로 이어집니다. 물에서 독한 감초 냄새가 납니다. 전하께 올린 약을 여기서 버린 모양입니다."
      - say:
          char: 덕만
          framing: bust
          text: "누가 약을 바꿨는지 알 수 있습니까?"
      - say:
          char: 월명.warning
          framing: bust
          text: "냄새만으로는 모릅니다. 약방에 남은 그릇을 보면 알 수 있습니다. 세 번째 갈림길에 보초가 둘 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "싸우지 말고 지나가죠. 지금 소리가 나면 아버지 곁의 사람부터 도망칠 겁니다."
      - say:
          char: 월명
          framing: bust
          text: "그럼 물이 가슴까지 차는 길로 가야 합니다. 숨을 짧게 쉬십시오."
      - goto: rescue_choice

  entry_procession:
    actions:
      - say:
          char: 천명
          framing: closeup
          delivery: nervous
          text: "내 가마 밑에 숨으면 궁문은 지날 수 있어. 그런데 네 발이 다 보여. 일곱 살 때 꿀과자 훔치던 때랑 똑같아."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "그때도 언니가 치마로 가려 줬잖아. 조금만 더 내려 줘."
      - say:
          char: 천명.nervous
          framing: bust
          text: "이러다 둘 다 잡히면 어떡해?"
      - say:
          char: 덕만
          framing: bust
          text: "잡히면 내가 억지로 탔다고 해. 언니는 아버지 곁으로 가려던 거고."
      - say:
          char: 천명.nervous
          framing: closeup
          text: "또 혼자 책임지겠다는 말 하지 마. 이번에는 같이 들어가고 같이 나오는 거야."
      - say:
          char: 덕만
          framing: bust
          text: "알았어. 같이 나올게. 약속해."
      - goto: rescue_choice

  entry_prison:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "감옥에 들어가게 해 달라는 부탁은 처음입니다. 나오는 길도 제가 준비해야 합니까?"
      - say:
          char: 덕만
          framing: bust
          text: "당연하지. 체포된 척 들어가서 안에서 문을 열 거야."
      - say:
          char: 비담.smirk
          framing: bust
          text: "실패하면 저는 공주를 탈옥시킨 역적이 됩니다. 성공하면요?"
      - say:
          char: 덕만
          framing: bust
          text: "성공하면 아무도 그대가 도왔다는 걸 모르게 해 줄게."
      - say:
          char: 비담.sad
          framing: closeup
          text: "그 보상은 조금 서운하군요. 그래도 하겠습니다. 이번에는 살아서 빚을 갚으십시오."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: princess_chamber
      - say:
          delivery: nervous
          text: "덕만이 궁 안으로 들어온 순간 세 소식이 동시에 도착했습니다. 왕의 호흡이 급격히 약해졌고, 천명이 있는 종루는 군사들에게 포위됐으며, 기록고에는 불이 붙었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "유신, 세 곳에 모두 사람을 보낼 수는 없습니까?"
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "병력이 부족합니다. 제가 종루로 가면 공주께서는 왕이나 기록고 중 하나를 직접 택하셔야 합니다. 지금 정하십시오."
      - choice:
          key: c6_rescue
          prompt: "세 곳이 무너진다. 먼저 어디로?"
          char: 덕만
          framing: closeup
          options:
            - text: "왕에게 간다"
              add:
                legitimacy: 2
              goto: rescue_king
            - text: "천명을 구한다"
              add:
                yushin_trust: 1
                power: 1
              goto: rescue_allies
            - text: "기록고로 간다"
              add:
                insight: 2
                suspicion: 1
              goto: rescue_evidence
            - text: "아진을 쫓는다"
              goto: go_32_name_in_dark

  rescue_king:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.sad
          framing: closeup
          delivery: sad
          text: "독은 더 퍼지지 않게 막았습니다. 하지만 전하의 맥이 너무 약합니다. 말씀을 하셔도 오래 이어 가지는 못할 겁니다."
      - say:
          char: 덕만.sad
          framing: closeup
          delivery: sad
          text: "잠깐이라도 의식이 돌아오게 할 수 있습니까?"
      - say:
          char: 월명.sad
          framing: bust
          text: "할 수는 있습니다. 대신 더 빨리 지치실 겁니다. 꼭 들어야 할 말이 있습니까?"
      - say:
          char: 덕만.sad
          framing: closeup
          text: "후계자 이야기는 묻지 않겠습니다. 딸로서 마지막 인사를 하고 싶습니다."
      - say:
          char: 월명
          framing: bust
          text: "그럼 손을 잡고 이름을 부르십시오. 약보다 익숙한 목소리가 먼저 닿을 수도 있습니다."
      - goto: seal_found

  rescue_allies:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: bust
          text: "왜 여기로 왔어? 아버지께 갔어야지. 내가 살아도 아버지가 돌아가시면 어떡해."
      - say:
          char: 덕만.sad
          framing: bust
          text: "언니를 두고 갈 수 없었어."
      - say:
          char: 천명.sad
          framing: closeup
          text: "그럼 나 때문에 아버지를 못 봤다는 생각이 들 때마다 나를 미워하게 될 거야."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "미워할지도 몰라. 반대로 골랐으면 나 자신을 더 미워했을 거야. 지금은 살아 있어 줘. 나중에 같이 후회하자."
      - say:
          char: 천명.sad
          framing: bust
          text: "……알았어. 같이 가자. 아직 늦지 않았을 수도 있어."
      - add:
          army_support: 1
      - goto: seal_found

  rescue_evidence:
    actions:
      - effect: embers
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          text: "덕만은 불길 속에서 인장 대장을 꺼냈습니다. 왕의 인장을 마지막으로 빌린 사람은 이찬 칠숙이었고, 반환 기록은 비어 있었습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "체포령의 인영이 진짜였던 이유가 이거야. 칠숙이 아버지 인장을 돌려주지 않았어."
      - say:
          char: 비담.smirk
          framing: bust
          text: "이 장부만 있으면 체포령이 거짓이라는 건 밝힐 수 있습니다. 이제 나가야 합니다. 지붕이 무너집니다."
      - say:
          delivery: sad
          text: "덕만이 대장을 안고 기록고를 나왔을 때 종루의 봉화가 꺼졌습니다. 들것 가장자리로 천명이 쓰던 붉은 옷자락이 흘러내렸습니다."
          wait: 1000
      - say:
          char: 덕만.sad
          framing: bust
          text: "내가 기록고로 간 동안 언니가…… 혼자 있었어."
      - say:
          char: 비담.sad
          framing: bust
          text: "공주님이 가지 않았어도 결과가 달랐다고는 아무도 말할 수 없습니다."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "그 말로 괜찮아지지는 않아. 그래도 이 장부를 버리면 언니를 두고 간 이유까지 없어져. 들고 가자. 끝까지 밝힐 거야."
      - set:
          cheonmyeong_alive: false
      - goto: seal_found

  seal_found:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          text: "침전 바닥의 빈 약함 아래에서 왕의 인장이 발견되었습니다. 체포령에 사용한 뒤 급히 숨겨 둔 것이었습니다."
      - say:
          char: 비담.smirk
          framing: bust
          text: "찾던 인장입니다. 이걸로 체포령을 취소하면 궁문이 열릴 겁니다."
      - say:
          char: 덕만
          framing: closeup
          text: "훔친 인장으로 찍은 명령을, 되찾은 인장으로 다시 막으라는 거군. 사람들은 어느 쪽을 진짜 왕명이라고 믿을까?"
      - say:
          char: 비담
          framing: bust
          text: "오늘 밤 살아남으려면 먼저 하나를 골라야 합니다. 옳았는지는 내일 설명하시고요."
      - set:
          has_royal_seal: true
      - goto: seal_choice

  seal_choice:
    actions:
      - choice:
          key: c6_seal
          prompt: "인장이 손안에 있다. 쓸까?"
          char: 덕만
          framing: closeup
          options:
            - text: "체포령에 찍는다"
              add:
                power: 2
                suspicion: 2
              goto: seal_command
            - text: "화백 앞까지 봉한다"
              add:
                legitimacy: 2
                nobles_support: 1
              goto: seal_seal
            - text: "깨뜨린다"
              add:
                legitimacy: 1
                power: -1
              set:
                has_royal_seal: false
              goto: seal_break
            - text: "즉위를 선포한다"
              goto: go_33_one_day_queen

  seal_command:
    actions:
      - say:
          char: 비담.smirk
          framing: bust
          text: "체포령은 취소됐습니다. 대신 사람들은 두 명령 중 어느 것이 진짜였는지 묻고 있습니다."
      - say:
          char: 덕만
          framing: bust
          text: "둘 다 같은 인장으로 찍혔으니 도장만 보고는 알 수 없겠지. 내일 화백 앞에서 내가 찍었다고 밝힐게."
      - say:
          char: 비담.smirk
          framing: bust
          text: "왕명을 함부로 썼다고 공격할 겁니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래도 숨기지는 않을 거야. 내가 살기 위해 내린 명령이었다고, 그 때문에 다친 사람까지 같이 말하겠어."
      - goto: kings_last_words

  seal_seal:
    actions:
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "인장을 손에 넣고도 봉하셨군요. 체포령을 취소할 가장 쉬운 길을 스스로 막으셨습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "체포령이 거짓이라는 대장과 증인이 있습니다. 인장을 또 쓰면 어떤 명령이 진짜인지 더 흐려집니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "그 증인을 화백까지 데려갈 수 있을까요? 궁문 밖에는 제 군사가 있습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          text: "그러니 그대가 인장을 두려워하지 않는 척하는군요. 좋습니다. 도장 없이 사람을 데리고 나가 보겠습니다."
      - goto: kings_last_words

  seal_break:
    actions:
      - effect: flash
      - wait: 180
      - effect: impact
      - say:
          text: "덕만은 인장을 돌바닥에 내려놓고 칼자루로 내리쳤습니다. 금빛 도장이 둘로 갈라지자, 체포령을 들고 있던 군사들도 서로의 얼굴을 보았습니다."
      - say:
          char: 비담
          framing: bust
          text: "정말 깨뜨리실 줄은 몰랐습니다. 이제 공주께서 명령해도 그들이 듣지 않을 수 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "알아. 그래도 훔친 인장 하나 때문에 모두가 서로를 죽이게 둘 수는 없어. 이제 말과 증거로 설득해야 해."
      - goto: kings_last_words

  kings_last_words:
    actions:
      - bg: throne_hall
      - effect: moonveil
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 진평왕
          delivery: sad
          text: "<speed=18>아버지.</speed> <speed=22>저 왔어요.</speed> <speed=18>제 목소리 들리세요?</speed>"
          wait: 900
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "<speed=18>덕만아.</speed> <speed=18>늦지 않았구나.</speed>"
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          text: "죄송해요. 더 일찍 왔어야 했는데, 인장을 찾느라…… 언니도 위험했고…… 저는 계속 다른 곳을 골라야 했어요."
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "안다. 네 잘못이 아니다. 내가 너무 많은 일을 네가 고르게 두었구나."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 진평왕
          text: "아버지, 저한테 왕이 되라고 한 번만 말해 주시면 안 돼요? 유언으로 남기지 않아도 돼요. 저만 듣게."
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "너는 왕이 될 수 있다. 오래전부터 그렇게 생각했다. 그런데 내가 그 말을 유언으로 남기면, 대신들은 네가 아비 덕에 왕이 됐다고 할 것이다."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          text: "알아요. 그래도 지금은 딸로 듣고 싶었어요."
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
