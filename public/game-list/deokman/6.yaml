script:
  - scene: chapter6_open
  - scene: coronation_finish

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          text: "제6장 — 아버지 없는 아침"
      - say:
          delivery: calm
          wait: 800
          text: "같은 밤, 631년 겨울. 진평왕의 마지막 밤을 알리는 종이 궁 안에서 울렸다."
      - say:
          with: [덕만, 천명]
          delivery: calm
          wait: 650
          text: "덕만을 잡으라는 명령이 빗물도 마르기 전에 모든 궁문에 붙었다."
      - say:
          with: [덕만]
          text: "진운을 노린 화살이 멎은 지 두 시간도 지나지 않았다."
      - say:
          with: [덕만]
          text: "그 명령에는 덕만이 아버지를 해치려 한 역적이라고 적혀 있었다."
      - say:
          with: [덕만, 천명]
          text: "그사이 누군가 진평왕의 약에 독을 넣었고, 왕은 쓰러졌다."
      - say:
          with: [덕만, 천명]
          text: "왕의 방도 기록 창고도 칠숙의 병사들이 먼저 막고 있었다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "도장 흠집까지 똑같아. 진짜 도장이야."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "일곱 살 때 내가 떨어뜨려 생긴 흠집이야."
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "아버지가 쓰러지기를 기다렸군."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니는? 다친 데 없어?"
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          wait: 700
          text: "없어. 그냥 너무 무서워서 그래."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "그럼 나중에 같이 떨자. 지금은 가야 해."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "약방에서는 독이 든 빈 상자가 나왔어."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "그 뒤로 아버지 방 보초가 전부 바뀌었고."
      - say:
          text: "천명은 치맛자락 안에서 네 가지 물건을 꺼냈다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "월명의 약초 꾸러미와 내 가마 표식."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "유신의 위험 신호용 붉은 천과 비담의 수갑 열쇠."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "다들 내가 궁에 들어갈 방법을 하나씩 준비했네."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "그러니까 그 빚을 혼자 갚으려 하지 마."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          wait: 850
          text: "이번엔 내가 너랑 같이 들어가."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니까지 잡히면 난 못 견뎌."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          wait: 850
          text: "네가 혼자 사라지는 것보다는 나아."
      - goto: entry_choice

  entry_choice:
    actions:
      - choice:
          key: c6_entry
          prompt: "궁문 안에서 세 번째 종이 울린다."
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "약방 뒤 물길로 간다"
              add: { insight: 1 }
              goto: entry_waterway
            - text: "천명의 가마에 숨는다"
              add: { cheonmyeong_trust: 1 }
              goto: entry_procession
            - text: "정문을 부순다"
              goto: go_31_gate_breaker
            - text: "체포된 척 들어간다"
              add: { bidam_trust: 1, power: 1 }
              goto: entry_prison

  entry_waterway:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "월명은 약방 뒤 수로에서 등불 하나를 가리고 기다렸다."
      - say:
          with: [덕만, 월명]
          text: "검은 수로에서는 진평왕이 먹던 약 냄새가 진하게 났다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "이 수로는 약방 뒤뜰까지 이어집니다."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "그런데 물에 감초와 독초 냄새가 섞였습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "아버지가 드실 약을 바꾼 뒤, 원래 약은 여기에 버렸군요."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "갈림길마다 보초가 한 명씩 있습니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "아무도 죽이지 않고 지나가죠."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "그러면 찬물이 가슴까지 찹니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "숨이 차도 계속 가겠습니다."
      - goto: rescue_choice

  entry_procession:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 천명
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "덕만은 천명의 가마 밑 나무틀에 몸을 웅크리고 매달렸다."
      - say:
          char: 천명
          camera: medium
          with: []
          text: "발이 보여. 일곱 살 때 숨바꼭질하던 그대로야."
      - say:
          char: 덕만
          camera: medium
          with: []
          text: "그때도 언니 치마가 날 가려 줬잖아."
      - say:
          char: 천명.nervous
          camera: close
          with: []
          text: "이번엔 둘 다 잡히면 어떡해?"
      - say:
          char: 덕만
          camera: close
          with: []
          text: "같이 들어왔으니 같이 나갈 거야."
      - say:
          wait: 700
          text: "궁문 앞에서 창끝 하나가 가마 휘장을 들어 올렸다."
      - say:
          text: "천명은 떨리는 발로 덕만의 신발을 치마 밑에 밀어 넣었다."
      - say:
          char: 천명.nervous
          camera: close
          with: []
          wait: 850
          text: "덕만아. 이번 약속은 꼭 지켜."
      - say:
          with: [덕만, 천명]
          text: "가마가 담장 안에 멈추고 한참 뒤에야 덕만이 내려왔다."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "나갈 때는 꼭 언니 손을 잡고 나갈게."
      - goto: rescue_choice

  entry_prison:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 덕만의 손목에 수갑을 채워 잡아 온 죄인처럼 궁에 들였다."
      - say:
          with: [덕만, 비담]
          wait: 700
          text: "감옥 문이 닫히고 발소리가 멀어진 뒤에야 열쇠를 꺼냈다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "스스로 감옥에 넣어 달라는 분은 처음입니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "궁 안으로 들어가 아버지 방문을 열 겁니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "들키면 저는 진짜 역적이 됩니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "성공하면 아무도 비담이 도왔다고 모를 겁니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그건 보상치고 너무 서운하군요."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "그러니 살아서 다른 보상을 주십시오."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          text: "궁에 들어선 순간, 왕의 위급 상황을 알리는 종이 약방에서 세 번 울렸다."
      - say:
          text: "종탑에는 천명의 붉은 신호 천이 거꾸로 매달렸다."
      - say:
          text: "기록 창고 창문에서는 불붙은 종이들이 계속 날아왔다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "세 곳을 모두 가기엔 사람이 모자랍니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "제가 종탑으로 가겠습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "아버지, 언니, 그리고 불타는 기록까지……"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "제가 대신 결정해도 됩니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "아니요. 이건 제가 고르겠습니다."
      - say:
          with: [덕만, 유신]
          wait: 850
          text: "약방 종이 멎고 붉은 천은 불길에 가려졌다. 더는 결정을 미룰 수 없었다."
      - choice:
          key: c6_rescue
          prompt: "세 곳 모두 더는 기다릴 수 없다."
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "아버지께 간다"
              add: { legitimacy: 1 }
              goto: rescue_king
            - text: "천명을 구한다"
              add: { army_support: 1, cheonmyeong_trust: 1 }
              goto: rescue_allies
            - text: "기록을 구한다"
              add: { insight: 1, power: 1 }
              goto: rescue_evidence
            - text: "아진을 쫓는다"
              goto: go_32_name_in_dark

  rescue_king:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "덕만은 종탑과 불길을 뒤로한 채 왕의 방으로 달렸다."
      - say:
          with: [덕만, 월명]
          text: "월명은 쓰러진 보초들 사이에서 진평왕의 손목을 짚고 있었다."
      - say:
          char: 월명.sad
          camera: medium
          with: [덕만]
          text: "독이 더 퍼지는 건 막았습니다."
      - say:
          char: 월명.sad
          camera: close
          with: [덕만]
          text: "하지만 맥박이 점점 약해집니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          wait: 750
          text: "한 번만, 제 목소리를 듣게 할 수 있습니까?"
      - say:
          char: 월명.sad
          camera: medium
          with: [덕만]
          text: "전하께 꼭 받아야 할 대답이 있습니까?"
      - say:
          char: 덕만.sad
          camera: close
          with: [월명]
          text: "아니요. 딸로서 인사만 하고 싶습니다."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "손을 잡고, 아버지라 부르십시오."
      - goto: seal_found

  rescue_allies:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          with: [덕만, 천명]
          text: "덕만은 불붙은 밧줄을 끊고 천명을 품에 안아 끌어냈다."
      - say:
          with: [덕만, 천명]
          wait: 850
          text: "두 사람이 바닥에 쓰러진 순간, 왕의 방에서 위급을 알리는 종이 한 번 울렸다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "왜…… 왜 나한테 먼저 왔어?"
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "아버지께 갔어야 하잖아."
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "언니를 불 속에 두고 갈 수 없었어."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "나 때문에 아버지 마지막을 못 보면 어떡해?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          wait: 850
          text: "그러면 평생 같이 후회하자."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "……알았어. 울지 말고 같이 가자."
      - goto: seal_found

  rescue_evidence:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "덕만은 타는 선반 안으로 손을 뻗어 도장 기록부를 꺼냈다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [비담]
          text: "마지막으로 왕의 도장을 빌린 사람은 칠숙입니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "돌려줬다는 기록만 비어 있군요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "천장이 무너집니다. 이제 나가야 합니다."
      - say:
          text: "창고 밖을 지나는 들것에서 천명의 붉은 옷자락이 보였다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "언니가…… 나를 기다리다 혼자 있었어."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "공주님이 가셨어도 살릴 수 있었는지는 모릅니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [비담]
          text: "그렇다고 제가 잘 선택한 건 아니에요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그래도 이 기록만은 불 속에 두지 마요."
      - set: { cheonmyeong_alive: false }
      - goto: seal_found

  seal_found:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "비담이 왕의 방 구석에 버려진 약 상자를 뒤집었다."
      - say:
          wait: 750
          text: "왕의 금빛 도장이 덕만의 발치로 굴러왔다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이 도장으로 공주님을 잡으라는 명령을 멈출 수 있습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "훔친 도장으로 만든 거짓 명령입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그 도장을 제가 쓰면 뭐가 달라집니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          wait: 700
          text: "옳았는지는 내일 살아서 설명하십시오."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "오늘은 먼저 살아남고요."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "이번에도 마음 편한 선택은 하나도 없네요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "살고 싶다면 지금 도장을 쓰셔야 합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          wait: 800
          text: "제가 도장을 찍으면 저도 왕의 명령을 꾸미는 겁니다."
      - set: { has_royal_seal: true }
      - goto: seal_choice

  seal_choice:
    actions:
      - choice:
