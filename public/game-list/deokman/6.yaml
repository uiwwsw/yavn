script:
  - scene: chapter6_open
  - scene: kings_last_words

scenes:
  chapter6_open:
    actions:
      - bg: shadow_corridor
      - effect: alarm
      - char:
          id: 천명
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제6장 — 왕이 잠든 밤"
      - say:
          text: "덕만과 진운이 함께 암살 조사를 요구한 바로 그날, 진평왕이 독에 쓰러졌습니다. 칠숙은 돌려주지 않은 왕의 인장으로 덕만의 체포령을 찍고 궁문을 봉쇄했습니다. 왕은 말할 수 없고, 왕명만 덕만을 범인이라 부르는 밤이었습니다."
      - say:
          char: 천명.nervous
          framing: closeup
          with:
            - 덕만
          delivery: nervous
          text: "네 얼굴이 모든 궁문에 붙었어. 체포령에는 아버지 인장이 찍혀 있는데, 아버지는 아직 의식도 없어."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: nervous
          text: "언니, 손 떨고 있어. 다친 데는 없어?"
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "없어. 무서워서 그래. 아버지 방에는 못 들어가고, 군사들은 네가 왕을 해쳤다고 외치고 있어."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          text: "좋아. 무서운 건 나중에 같이 하자. 지금은 인장을 찾고 아버지께 가야 해. 언니가 본 것부터 말해 줘."
      - say:
          char: 천명.nervous
          framing: bust
          text: "약방 나인이 새벽에 빈 약함을 들고 나왔어. 그 뒤에 침전 보초가 바뀌었고."
      - say:
          char: 덕만
          framing: closeup
          text: "약방부터 보자. 해가 뜨기 전에 체포령이 거짓이라는 걸 밝혀야 해."
      - say:
          char: 천명.nervous
          framing: bust
          with:
            - 덕만
          text: "월명 선생은 약재 수로에서 기다리고, 내 가마는 왕족이라 아직 궁문을 지날 수 있어. 유신은 성밖에서 병사를 모으고 있지만 정문을 치면 반역이 돼."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          text: "비담이라면 체포된 사람처럼 안으로 들여보낼 수 있겠지. 수로를 택하면 월명을, 가마를 택하면 언니를, 정문을 택하면 유신의 군사를 걸게 돼. 혼자 들어가는 길은 없구나."
      - goto: entry_choice

  entry_choice:
    actions:
      - choice:
          key: c6_entry
          prompt: "궁문이 봉쇄됐다. 어떻게 들어갈까?"
          char: 덕만
          framing: closeup
          options:
            - text: "약재 수로로 간다"
              add:
                insight: 1
              goto: entry_waterway
            - text: "천명의 가마에 숨는다"
              add:
                cheonmyeong_trust: 1
                legitimacy: 1
              goto: entry_procession
            - text: "정문을 부순다"
              goto: go_31_gate_breaker
            - text: "체포된 척 들어간다"
              add:
                bidam_trust: 1
                suspicion: 1
              goto: entry_prison

  entry_waterway:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: full
          text: "이 수로는 약방 뒤로 이어집니다. 물에서 독한 감초 냄새가 납니다. 전하께 올린 약을 여기서 버린 모양입니다."
      - say:
          char: 덕만
          framing: bust
          text: "누가 약을 바꿨는지 알 수 있습니까?"
      - say:
          char: 월명.warning
          framing: bust
          text: "냄새만으로는 모릅니다. 약방에 남은 그릇을 보면 알 수 있습니다. 세 번째 갈림길에 보초가 둘 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "싸우지 말고 지나가죠. 지금 소리가 나면 아버지 곁의 사람부터 도망칠 겁니다."
      - say:
          char: 월명
          framing: bust
          text: "그럼 물이 가슴까지 차는 길로 가야 합니다. 숨을 짧게 쉬십시오."
      - goto: rescue_choice

  entry_procession:
    actions:
      - effect: darken
      - say:
          with:
            - 천명
          delivery: whisper
          text: "가마 휘장이 바닥까지 내려왔습니다. 덕만은 가마 밑 가로대에 몸을 붙였고, 천명은 무릎 위에 두 손을 포개 떨림을 감췄습니다."
      - say:
          char: 천명
          framing: closeup
          with: []
          delivery: nervous
          text: "내 가마 밑에 숨으면 궁문은 지날 수 있어. 그런데 네 발이 다 보여. 일곱 살 때 꿀과자 훔치던 때랑 똑같아."
      - say:
          char: 덕만
          framing: closeup
          with: []
          delivery: whisper
          text: "그때도 언니가 치마로 가려 줬잖아. 조금만 더 내려 줘."
      - say:
          char: 천명.nervous
          framing: bust
          with: []
          text: "이러다 둘 다 잡히면 어떡해?"
      - say:
          char: 덕만
          framing: bust
          with: []
          delivery: whisper
          text: "잡히면 내가 억지로 탔다고 해. 언니는 아버지 곁으로 가려던 거고."
      - effect: focus
      - say:
          with:
            - 천명
          delivery: whisper
          text: "궁문 앞에서 가마가 멈췄습니다. 창끝 하나가 휘장 아래를 들추자, 천명이 발을 내밀어 덕만의 신발 끝을 치맛자락 안으로 밀었습니다."
      - say:
          char: 천명.nervous
          framing: closeup
          with: []
          text: "또 혼자 책임지겠다는 말 하지 마. 이번에는 같이 들어가고 같이 나오는 거야."
      - say:
          char: 덕만
          framing: bust
          with: []
          delivery: whisper
          text: "알았어. 같이 나올게. 약속해."
      - say:
          with:
            - 덕만
            - 천명
          text: "창끝이 거두어지고 궁문이 열렸습니다. 가마가 약방 담장 안에 완전히 멈춘 뒤에야 덕만이 바닥으로 내려왔습니다. 그때 처음으로 두 자매가 서로의 얼굴을 보았습니다."
      - goto: rescue_choice

  entry_prison:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "감옥에 들어가게 해 달라는 부탁은 처음입니다. 나오는 길도 제가 준비해야 합니까?"
      - say:
          char: 덕만
          framing: bust
          text: "당연하지. 체포된 척 들어가서 안에서 문을 열 거야."
      - say:
          char: 비담.smirk
          framing: bust
          text: "실패하면 저는 공주를 탈옥시킨 역적이 됩니다. 성공하면요?"
      - say:
          char: 덕만
          framing: bust
          text: "성공하면 아무도 그대가 도왔다는 걸 모르게 해 줄게."
      - say:
          char: 비담.sad
          framing: closeup
          text: "그 보상은 조금 서운하군요. 그래도 하겠습니다. 이번에는 살아서 빚을 갚으십시오."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: princess_chamber
      - say:
          delivery: nervous
          text: "덕만이 궁 안으로 들어온 순간 세 소식이 동시에 도착했습니다. 왕의 호흡이 급격히 약해졌고, 천명이 있는 종루는 군사들에게 포위됐으며, 기록고에는 불이 붙었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "유신, 세 곳에 모두 사람을 보낼 수는 없습니까?"
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "병력이 부족합니다. 제가 종루로 가면 공주께서는 왕이나 기록고 중 하나를 직접 택하셔야 합니다. 지금 정하십시오."
      - say:
          char: 유신.angry
          framing: bust
          with:
            - 덕만
          text: "그리고 약방 뒤에서 아진이 빈 약함을 들고 달아났다는 보고가 있습니다. 쫓으면 배후의 이름을 들을지 모르지만, 왕과 천명공주와 기록은 모두 포기해야 합니다."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 유신
          text: "아버지는 마지막 말을, 언니는 목숨을, 기록고는 체포령을 뒤집을 증거를 갖고 있어. 아진은 이 모든 일을 시킨 이름을 갖고 있고. 하나를 고르는 동안 나머지는 기다려 주지 않겠지."
      - choice:
          key: c6_rescue
          prompt: "세 곳이 무너진다. 먼저 어디로?"
          char: 덕만
          framing: closeup
          options:
            - text: "왕에게 간다"
              add:
                legitimacy: 2
              goto: rescue_king
            - text: "천명을 구한다"
              add:
                yushin_trust: 1
                power: 1
              goto: rescue_allies
            - text: "기록고로 간다"
              add:
                insight: 2
                suspicion: 1
              goto: rescue_evidence
            - text: "아진을 쫓는다"
              goto: go_32_name_in_dark

  rescue_king:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.sad
          framing: closeup
          delivery: sad
          text: "독은 더 퍼지지 않게 막았습니다. 하지만 전하의 맥이 너무 약합니다. 말씀을 하셔도 오래 이어 가지는 못할 겁니다."
      - say:
          char: 덕만.sad
          framing: closeup
          delivery: sad
          text: "잠깐이라도 의식이 돌아오게 할 수 있습니까?"
      - say:
          char: 월명.sad
          framing: bust
          text: "할 수는 있습니다. 대신 더 빨리 지치실 겁니다. 꼭 들어야 할 말이 있습니까?"
      - say:
          char: 덕만.sad
          framing: closeup
          text: "후계자 이야기는 묻지 않겠습니다. 딸로서 마지막 인사를 하고 싶습니다."
      - say:
          char: 월명
          framing: bust
          text: "그럼 손을 잡고 이름을 부르십시오. 약보다 익숙한 목소리가 먼저 닿을 수도 있습니다."
      - goto: seal_found

  rescue_allies:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: bust
          text: "왜 여기로 왔어? 아버지께 갔어야지. 내가 살아도 아버지가 돌아가시면 어떡해."
      - say:
          char: 덕만.sad
          framing: bust
          text: "언니를 두고 갈 수 없었어."
      - say:
          char: 천명.sad
          framing: closeup
          text: "그럼 나 때문에 아버지를 못 봤다는 생각이 들 때마다 나를 미워하게 될 거야."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "미워할지도 몰라. 반대로 골랐으면 나 자신을 더 미워했을 거야. 지금은 살아 있어 줘. 나중에 같이 후회하자."
      - say:
          char: 천명.sad
          framing: bust
          text: "……알았어. 같이 가자. 아직 늦지 않았을 수도 있어."
      - add:
          army_support: 1
      - goto: seal_found

  rescue_evidence:
    actions:
      - effect: embers
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          text: "덕만은 불길 속에서 인장 대장을 꺼냈습니다. 왕의 인장을 마지막으로 빌린 사람은 이찬 칠숙이었고, 반환 기록은 비어 있었습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "체포령의 인영이 진짜였던 이유가 이거야. 칠숙이 아버지 인장을 돌려주지 않았어."
      - say:
          char: 비담.smirk
          framing: bust
          text: "이 장부만 있으면 체포령이 거짓이라는 건 밝힐 수 있습니다. 이제 나가야 합니다. 지붕이 무너집니다."
      - say:
          delivery: sad
          text: "덕만이 대장을 안고 기록고를 나왔을 때 종루의 봉화가 꺼졌습니다. 들것 가장자리로 천명이 쓰던 붉은 옷자락이 흘러내렸습니다."
          wait: 1000
      - say:
          char: 덕만.sad
          framing: bust
          text: "내가 기록고로 간 동안 언니가…… 혼자 있었어."
      - say:
          char: 비담.sad
          framing: bust
          text: "공주님이 가지 않았어도 결과가 달랐다고는 아무도 말할 수 없습니다."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "그 말로 괜찮아지지는 않아. 그래도 이 장부를 버리면 언니를 두고 간 이유까지 없어져. 들고 가자. 끝까지 밝힐 거야."
      - set:
          cheonmyeong_alive: false
      - goto: seal_found

  seal_found:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          text: "침전 바닥의 빈 약함 아래에서 왕의 인장이 발견되었습니다. 체포령에 사용한 뒤 급히 숨겨 둔 것이었습니다."
      - say:
          char: 비담.smirk
          framing: bust
          text: "찾던 인장입니다. 이걸로 체포령을 취소하면 궁문이 열릴 겁니다."
      - say:
          char: 덕만
          framing: closeup
          text: "훔친 인장으로 찍은 명령을, 되찾은 인장으로 다시 막으라는 거군. 사람들은 어느 쪽을 진짜 왕명이라고 믿을까?"
      - say:
          char: 비담
          framing: bust
          text: "오늘 밤 살아남으려면 먼저 하나를 골라야 합니다. 옳았는지는 내일 설명하시고요."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 비담
          text: "이건 나라의 도장이기 전에 아버지가 평생 쥐고 있던 물건이야. 아버지가 말하지 못하는 동안 내가 찍으면 칠숙과 같은 도둑이 될 수도 있어."
      - say:
          char: 비담
          framing: closeup
          with:
            - 덕만
          text: "봉하면 화백까지 가져갈 증거가 되고, 깨면 누구도 훔쳐 쓰지 못합니다. 하지만 지금 찍지 않으면 공주님을 구할 왕명도 없습니다. 어느 쪽이든 내일은 오늘의 값을 묻게 될 겁니다."
      - set:
          has_royal_seal: true
      - goto: seal_choice

  seal_choice:
    actions:
      - choice:
          key: c6_seal
          prompt: "인장이 손안에 있다. 쓸까?"
          char: 덕만
          framing: closeup
          options:
            - text: "체포령에 찍는다"
              add:
                power: 2
                suspicion: 2
              goto: seal_command
            - text: "화백 앞까지 봉한다"
              add:
                legitimacy: 2
                nobles_support: 1
              goto: seal_seal
            - text: "깨뜨린다"
              add:
                legitimacy: 1
                power: -1
              set:
                has_royal_seal: false
              goto: seal_break
            - text: "즉위를 선포한다"
              goto: go_33_one_day_queen

  seal_command:
    actions:
      - say:
          char: 비담.smirk
          framing: bust
          text: "체포령은 취소됐습니다. 대신 사람들은 두 명령 중 어느 것이 진짜였는지 묻고 있습니다."
      - say:
          char: 덕만
          framing: bust
          text: "둘 다 같은 인장으로 찍혔으니 도장만 보고는 알 수 없겠지. 내일 화백 앞에서 내가 찍었다고 밝힐게."
      - say:
          char: 비담.smirk
          framing: bust
          text: "왕명을 함부로 썼다고 공격할 겁니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래도 숨기지는 않을 거야. 내가 살기 위해 내린 명령이었다고, 그 때문에 다친 사람까지 같이 말하겠어."
      - goto: kings_last_words

  seal_seal:
    actions:
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "인장을 손에 넣고도 봉하셨군요. 체포령을 취소할 가장 쉬운 길을 스스로 막으셨습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "체포령이 거짓이라는 대장과 증인이 있습니다. 인장을 또 쓰면 어떤 명령이 진짜인지 더 흐려집니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "그 증인을 화백까지 데려갈 수 있을까요? 궁문 밖에는 제 군사가 있습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          text: "그러니 그대가 인장을 두려워하지 않는 척하는군요. 좋습니다. 도장 없이 사람을 데리고 나가 보겠습니다."
      - goto: kings_last_words

  seal_break:
    actions:
      - effect: flash
      - wait: 180
      - effect: impact
      - say:
          text: "덕만은 인장을 돌바닥에 내려놓고 칼자루로 내리쳤습니다. 금빛 도장이 둘로 갈라지자, 체포령을 들고 있던 군사들도 서로의 얼굴을 보았습니다."
      - say:
          char: 비담
          framing: bust
          text: "정말 깨뜨리실 줄은 몰랐습니다. 이제 공주께서 명령해도 그들이 듣지 않을 수 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "알아. 그래도 훔친 인장 하나 때문에 모두가 서로를 죽이게 둘 수는 없어. 이제 말과 증거로 설득해야 해."
      - goto: kings_last_words

  kings_last_words:
    actions:
      - bg: throne_hall
      - effect: moonveil
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          delivery: sad
          text: "침전에는 진평왕과 덕만만 남았습니다. 왕의 숨은 짧았고, 덕만은 침상 곁에 무릎을 꿇었습니다."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          delivery: sad
          text: "<speed=18>아버지.</speed> <speed=22>저 왔어요.</speed> <speed=18>제 목소리 들리세요?</speed>"
          wait: 900
      - say:
          char: 진평왕.weak
          framing: bust
          with:
            - 덕만
          delivery: sad
          text: "<speed=18>덕만아.</speed> <speed=18>늦지 않았구나.</speed>"
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          text: "죄송해요. 더 일찍 왔어야 했는데, 인장을 찾느라…… 언니도 위험했고…… 저는 계속 다른 곳을 골라야 했어요."
      - say:
          char: 진평왕.weak
          framing: bust
          with:
            - 덕만
          delivery: sad
          text: "안다. 네 잘못이 아니다. 내가 너무 많은 일을 네가 고르게 두었구나."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 진평왕
          text: "아버지, 저한테 왕이 되라고 한 번만 말해 주시면 안 돼요? 유언으로 남기지 않아도 돼요. 저만 듣게."
      - say:
          char: 진평왕.weak
          framing: bust
          with:
            - 덕만
          delivery: sad
          text: "너는 왕이 될 수 있다. 오래전부터 그렇게 생각했다. 그런데 내가 그 말을 유언으로 남기면, 대신들은 네가 아비 덕에 왕이 됐다고 할 것이다."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          text: "알아요. 그래도 지금은 딸로 듣고 싶었어요."
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "그래. 내 딸은 왕이 될 수 있다. 그리고 왕이 되지 않아도 내 딸이다. 미안하다. 그 말을 너무 늦게 했구나."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 진평왕
          text: "늦어도 들었어요. 아버지, 조금만 더 계세요."
      - say:
          char: 진평왕.weak
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "덕만아…… 왕이 되기 전에, 먼저 살아라."
          wait: 1200
      - say:
          delivery: sad
          text: "진평왕은 덕만의 손을 잡은 채 숨을 거두었습니다. 공식 유언도, 후계자의 이름도 남기지 않았습니다."
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          delivery: sad
          text: "아버지…… 들었어요. 살아서, 제 이름으로 해 볼게요."
          wait: 900
      - add:
          legitimacy: 1
      - say:
          text: "왕은 후계자를 지명하지 않고 세상을 떠났습니다. 이제 덕만은 아버지의 명령이 아니라, 자신이 모은 사람과 증거로 왕위를 요구해야 합니다."

  go_31_gate_breaker:
    actions:
      - bg: shadow_corridor
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          with:
            - 덕만
            - 유신
          text: "궁 정문이 끝내 열리지 않자 덕만의 병사들은 충차를 문 앞까지 끌고 왔습니다. 문 위 궁수들과 문밖 병사들은 같은 신라 깃발을 달고 서로에게 활을 겨눴습니다."
      - say:
          char: 유신.angry
          framing: bust
          text: "충차를 대면 문은 열 수 있습니다. 하지만 안쪽을 지키는 병사도 신라군입니다. 먼저 다치게 되는 건 저 사람들입니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "아버지가 죽어 가고 있어요. 정문을 부수고 길을 여세요. 책임은 제가 집니다."
      - effect: impact
      - say:
          with: []
          text: "세 번째 충격에 화면을 가득 채운 문짝이 안쪽으로 넘어갔습니다. 먼지가 시야를 가린 사이, 안과 밖에서 동시에 활시위가 울렸습니다."
      - say:
          char: 유신.sad
          framing: bust
          text: "문은 열렸습니다. 우리 군사 열일곱, 궁군 아홉이 죽었습니다. 이제 어느 쪽도 칼을 거두지 않습니다."
      - effect: darken
      - say:
          with:
            - 덕만
          text: "덕만이 침전에 닿았을 때 안에서는 곡소리가 시작되고 있었습니다. 돌아본 궁문 너머에는 유신이 보이지 않았고, 피 묻은 돌계단 위로 칠숙이 내려왔습니다."
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙
          framing: closeup
          with:
            - 덕만
          text: "전하를 뵙겠다는 말로 궁을 친 사람을 신라에서는 역적이라 부릅니다."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 칠숙
          text: "아버지께서 살아 계셨다면 왜 문을 닫았는지부터 물으셨을 겁니다."
          wait: 700
      - gameOver:
          title: "운명 31 — 부서진 궁문"
          message: "덕만은 왕궁을 공격한 역적으로 체포됐습니다. 칠숙은 궁을 지킨 공으로 군권을 장악했습니다."
  go_32_name_in_dark:
    actions:
      - bg: locked_room
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          with:
            - 덕만
            - 아진
          text: "약방 뒤 창고에서 두 사람은 세 걸음을 사이에 두고 멈췄습니다. 출구는 덕만의 등 뒤에 있었고, 벽에 몰린 아진은 빈 왼손만 등불 쪽으로 내밀었습니다."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          text: "칼은 버렸습니다. 공주께서 찾는 이름을 말하겠습니다. 가까이 오십시오. 밖에서는 들으면 안 됩니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
          text: "거기서 말해. 한 걸음이라도 움직이면 호위를 부르겠다."
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          text: "그 이름이 전하의 침전 안에 있습니다. 지금 크게 말하면 왕부터 죽습니다."
      - effect: focus
      - say:
          with:
            - 덕만
            - 아진
          text: "덕만은 호위를 부르려던 손을 멈췄습니다. 한 걸음. 둘 사이에 남은 거리는 칼 한 자루보다 짧았습니다. 아진이 입술만 움직이자 이름의 첫 음절도 들리지 않았습니다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 아진
          text: "다시 말해. 누구라고?"
      - effect: impact
      - say:
          with:
            - 덕만
            - 아진
          text: "아진의 오른손이 소매에서 나왔습니다. 손바닥에 감춘 짧은 칼은 그 한 걸음을 되돌릴 틈도 주지 않았습니다. 문밖 호위가 빗장을 부수는 동안 아진도 독을 삼켰습니다."
      - say:
          char: 아진.nervous
          framing: closeup
          with: []
          text: "이름보다 거리를 먼저 보셨어야 합니다."
          wait: 700
      - gameOver:
          title: "운명 32 — 한 걸음의 거리"
          message: "덕만은 배후의 이름을 듣지 못한 채 죽었습니다. 아진도 현장에서 숨져 증언은 남지 않았습니다."
  go_33_one_day_queen:
    actions:
      - bg: throne_hall
      - char:
          id: 덕만
          position: center
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          text: "덕만은 왕의 인장으로 체포령을 취소한 뒤, 해가 뜨기 전에 스스로 즉위를 선포했습니다. 빈 왕좌전에서 호위 몇 명이 먼저 무릎을 꿇었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "왕이 숨을 거둔 지금 신라에는 명령할 사람이 필요합니다. 화백에는 즉위 뒤 설명하겠습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "전하께서 후계자를 남기셨습니까? 아니면 공주께서 찾은 인장이 곧 유언입니까?"
      - say:
          char: 덕만.angry
          framing: closeup
          with: []
          text: "반란을 막고 나면 절차를 따지겠습니다. 지금은 제가 왕입니다."
      - effect: crown
      - say:
          text: "첫 번째 즉위 북은 울렸지만 두 번째 북을 칠 악공은 오지 않았습니다. 정오가 되자 진운을 지지하는 군사들이 왕좌전을 포위했습니다."
      - say:
          char: 칠숙
          framing: closeup
          with: []
          text: "인장은 왕의 것이지만, 이 방 밖에서 공주의 명령을 왕명으로 듣는 사람은 없습니다. 내려오십시오."
      - effect: darken
      - say:
          text: "덕만을 따르던 호위들은 칼을 내려놓았습니다. 그녀는 왕좌에서 끌려 내려와 왕명을 위조한 죄인으로 압송됐습니다."
          wait: 750
      - gameOver:
          title: "운명 33 — 울리지 않은 두 번째 북"
          message: "덕만의 즉위는 반나절 만에 끝났습니다. 화백은 그 시간을 정식 재위로 인정하지 않았습니다."
