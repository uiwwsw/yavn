script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - effect: focus
      - char:
          id: 덕만
          position: center
          framing: full
      - say:
          text: "최종장 — 왕관에는 주인이 없다"
      - say:
          text: "진평왕의 장례 행렬이 궁을 떠나기도 전에 화백회의가 열렸습니다. 성문 밖에는 계승동맹의 군사 사백 명이 모였고, 화백들은 해가 지기 전 후계자를 정하라고 요구했습니다."
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "장례 행렬이 동문에 막혔습니다. 반란군이 상여를 보내려면 진운공을 왕으로 세우라고 요구합니다."
      - say:
          char: 덕만.sad
          framing: bust
          with:
            - 유신
          text: "아버지 장례까지 거래에 쓰는군요. 진운공은 어디 있습니까?"
      - say:
          char: 유신
          framing: bust
          text: "회의장 안에 있습니다. 아직 누구 편에도 서지 않았습니다."
      - say:
          char: 덕만.angry
          framing: full
          text: "좋습니다. 먼저 회의를 열겠습니다. 제가 왕이 되어야 한다는 말부터 하지 않겠습니다. 오늘 밤 성문을 열고 아버지 장례를 치를 사람이 누구인지부터 묻겠습니다."
          wait: 800
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "회의 전, 첫 수는?"
          char: 덕만
          framing: closeup
          options:
            - text: "진운과 함께 들어간다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "성문을 잠근다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "증인을 풀어 준다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "귀족을 처형한다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운
          framing: bust
          text: "제가 공주와 함께 들어가면 저를 따르던 가문 절반이 돌아설 겁니다. 어머니를 구해 주신 빚 때문에 이러는 거라고 할 테고요."
      - say:
          char: 덕만
          framing: bust
          text: "그 빚 때문에 같이 서 달라는 게 아닙니다. 그대가 정말 내가 왕이 되는 편이 낫다고 생각할 때만 들어오세요."
      - say:
          char: 진운.nervous
          framing: bust
          text: "솔직히 아직 확신하지 못했습니다. 다만 칠숙이 제 이름으로 군사를 움직이는 나라는 원하지 않습니다."
      - say:
          char: 덕만
          framing: bust
          text: "그 정도면 됩니다. 회의 안에서 생각이 바뀌면 그때 말하세요. 내 편인 척할 필요는 없습니다."
      - say:
          char: 진운
          framing: closeup
          text: "그럼 함께 들어가겠습니다. 오늘은 제 말이 바뀌어도 제 입으로 바꾸겠습니다."
      - goto: proof_choice

  opening_gates:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "동문과 북문을 닫았습니다. 반란군은 성 밖 사백입니다. 한 시진 뒤에는 문을 공격할 겁니다."
      - say:
          char: 덕만
          framing: bust
          text: "우리 군사는요?"
      - say:
          char: 유신.angry
          framing: bust
          text: "삼백십입니다. 먼저 치면 이길 수는 있습니다. 하지만 장례 행렬이 가운데 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "먼저 치지 마세요. 한 시진 안에 표결을 끝내겠습니다. 공격이 시작되면 상여부터 지켜 주세요."
      - goto: proof_choice

  opening_witnesses:
    actions:
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: bust
          text: "증인들이 문밖에 와 있어요. 독 묻은 행주를 본 나인도 있고, 국경에서 배급받은 사람들도 왔어요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 소원
          text: "군사들이 막지 않았어?"
      - say:
          char: 소원.nervous
          framing: bust
          text: "막았죠. 그래서 각자 자기 이름이랑 할 말을 천 조각에 써서 묶었어요. 사람은 못 들어가도 이름은 들여보내겠다고요."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "다 들어오게 해. 오늘은 대신들만 말하는 회의로 끝내지 않겠어."
      - say:
          char: 소원
          framing: bust
          text: "그 말 기다렸어요. 제가 문을 열게요."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주의 용기와 능력을 의심하는 것이 아닙니다. 하지만 신라에는 여인을 왕으로 세운 전례가 없습니다. 나라의 법을 오늘 하루의 위기 때문에 바꿀 수는 없습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "전례가 없다는 말은 들었습니다. 그래서 묻겠습니다. 법에 여인은 왕이 될 수 없다고 적힌 곳이 어디입니까?"
      - say:
          char: 칠숙.smile
          framing: bust
          text: "적혀 있지 않기에 지금까지 없었던 겁니다. 모든 관습을 글로 남기지는 않습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그럼 오늘 판단할 것은 금지된 일을 허락할지가 아니라, 지금까지 없던 일을 시작할 이유가 충분한지입니다. 제가 그 이유를 말씀드리겠습니다."
      - choice:
          key: final_proof
          prompt: "무엇으로 왕임을 증명할까?"
          char: 덕만
          framing: closeup
          with:
            - 칠숙
          options:
            - text: "사람을 세운다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "세 증거를 잇는다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "군사를 보인다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "유언을 꾸민다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - char:
          id: 소원
          position: left
          framing: full
      - say:
          char: 소원.nervous
          framing: bust
          text: "저는 궁에서 행주를 빨던 나인입니다. 공주님이 제 이름을 미끼로 썼을 때 화가 나서 따졌고, 공주님은 제 앞에서 잘못했다고 말했습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "사적인 사과가 왕의 자격을 증명합니까?"
      - say:
          char: 소원.angry
          framing: closeup
          text: "적어도 잘못하고도 모르는 척한 분들보다는 낫습니다. 저는 높은 분이 자기 잘못을 제 이름 앞에 놓는 걸 처음 봤습니다."
      - say:
          char: 덕만
          framing: bust
          text: "제가 늘 옳았다고 말하려는 것이 아닙니다. 제 명령으로 살고 죽은 사람의 이름을 듣고, 틀렸을 때 책임지는 왕이 되겠다고 말씀드리는 겁니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "좋은 뜻은 누구나 말할 수 있습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래서 말만 가져오지 않았습니다. 제 선택을 직접 겪은 사람들이 여기 있습니다. 한 사람씩 들으십시오."
          wait: 700
      - goto: crown_assessment

  proof_evidence:
    actions:
      - char:
          id: 아진
          position: left
          framing: full
      - say:
          char: 덕만
          framing: bust
          text: "이 검은 가루는 왕을 독살하고 제게 죄를 씌우려던 물건입니다. 이 합의서는 혼인으로 저를 왕위에서 떼어 놓으려던 약속입니다. 그리고 이 대장은 칠숙공이 왕의 인장을 돌려주지 않았다는 기록입니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "물건 세 개를 한자리에 놓는다고 같은 사건이 되지는 않습니다. 누가 그것을 이었다고 증언합니까?"
      - say:
          char: 아진.nervous
          framing: bust
          text: "제가 증언합니다. 왕의 잔을 준비한 사람, 죽은 귀족을 공주의 방에 넣으라 한 사람, 훔친 인장을 약방으로 옮긴 사람에게서 같은 붉은 매듭을 받았습니다."
      - say:
          char: 칠숙.angry
          framing: closeup
          text: "살인자가 목숨을 구하려 거짓말하는 것입니다."
      - say:
          char: 아진.angry
          framing: closeup
          text: "맞습니다. 저는 살인자입니다. 그래서 제가 한 일을 압니다. 공주는 제 죄를 숨겨 준 적이 없습니다. 지금도 숨기지 말라고 했습니다."
      - say:
          char: 덕만
          framing: bust
          text: "세 사건은 모두 제 이름을 지우기 위해 시작됐습니다. 마지막에는 왕이 대답하지 못하는 틈을 이용해 왕명까지 훔쳤습니다. 이것은 계승이 아니라 반역입니다."
          wait: 700
      - goto: crown_assessment

  proof_army:
    actions:
      - char:
          id: 유신
          position: left
          framing: full
      - say:
          char: 유신.sad
          framing: bust
          text: "국경의 군사는 공주라는 신분 때문에 따르지 않았습니다. 곡식이 사흘치뿐일 때 함께 굶었고, 전사자 이름을 직접 가족에게 읽은 지휘관이어서 따랐습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "유신공의 군사가 이미 궁문을 장악했습니다. 칼을 든 자의 증언을 자유로운 의견이라 할 수 있습니까?"
      - say:
          char: 유신
          framing: bust
          text: "제 군사는 회의장 밖에 있습니다. 화백이 원하면 저는 지금 칼을 내려놓겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "아니요. 칼은 성문을 지키는 데 필요합니다. 대신 이 회의장에는 들이지 마세요. 표결이 끝날 때까지 누구도 칼로 답하지 않습니다."
      - say:
          char: 유신
          framing: closeup
          text: "명령 받들겠습니다. 그 명령을 받아 마흔일곱을 잃은 장수로서, 남은 군사의 이름을 걸고 덕만공주를 지지합니다."
          wait: 650
      - goto: crown_assessment

  crown_assessment:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 7
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 2
                  - var: army_support
                    op: gte
                    value: 2
                  - var: rival_trust
                    op: gte
                    value: 2
              goto: crown_balanced
            - when:
                var: power
                op: gte
                value: 6
              goto: crown_force
            - when:
                var: people_support
                op: gte
                value: 5
              goto: crown_people_ready
          default: crown_fragile

  crown_balanced:
    actions:
      - say:
          text: "증언이 끝나자 회의장은 조용해졌습니다. 성문을 지키는 군사, 문밖의 백성, 진운의 지지, 세 가지 증거가 모두 덕만의 말을 뒷받침하고 있었습니다."
      - goto: crown_choice

  crown_force:
    actions:
      - say:
          text: "성문과 군사는 덕만의 명령을 따르고 있었습니다. 그러나 회의장 안에서는 군사가 물러난 뒤에도 덕만을 지지할 이유가 부족하다는 목소리가 나왔습니다."
      - goto: crown_choice

  crown_people_ready:
    actions:
      - say:
          text: "문밖의 사람들은 덕만의 이름을 외쳤습니다. 하지만 화백들은 백성의 지지만으로 성밖 반란군과 귀족 가문을 통제할 수 있겠느냐고 물었습니다."
      - goto: crown_choice

  crown_fragile:
    actions:
      - say:
          text: "덕만에게는 사람도 증거도 군사도 있었지만 어느 하나도 충분하지 않았습니다. 화백들은 마지막으로 어떤 힘을 왕위의 근거로 삼을지 답하라고 요구했습니다."
      - goto: crown_choice

  crown_choice:
    actions:
      - effect: crown
      - say:
          char: 칠숙.smile
          framing: bust
          text: "결국 무엇으로 왕이 되시겠다는 겁니까? 화백의 표입니까, 문밖의 백성입니까, 성문의 군사입니까, 진운공의 양보입니까?"
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "그중 하나만 고르면 나머지를 잃겠지요. 하지만 지금 화백은 마지막 답을 하나로 말하라고 요구하고 있습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "왕좌는 원래 하나입니다. 선택하십시오."
      - choice:
          key: final_crown
          prompt: "왕좌를 어떻게 요구할까?"
          char: 덕만
          framing: closeup
          options:
            - text: "화백의 표를 받는다"
              set:
                final_strategy: "law"
              add:
                legitimacy: 1
              goto: verdict
            - text: "백성의 함성으로 민다"
              set:
                final_strategy: "people"
              add:
                people_support: 1
              goto: verdict
            - text: "군권으로 밀어붙인다"
              set:
                final_strategy: "army"
              add:
                power: 2
                suspicion: 2
              goto: verdict
            - text: "진운과 함께 선다"
              set:
                final_strategy: "alliance"
              add:
                rival_trust: 1
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 8
                  - var: power
                    op: gte
                    value: 4
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: rival_trust
                    op: gte
                    value: 2
                  - var: clue_black_powder
                    op: eq
                    value: true
                  - var: clue_marriage_pact
                    op: eq
                    value: true
                  - var: clue_oath_fragment
                    op: eq
                    value: true
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: suspicion
                    op: gte
                    value: 6
              goto: ending_tyrant
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: nobles_support
                    op: gte
                    value: 2
              goto: ending_permitted
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 4
                  - var: legitimacy
                    op: lt
                    value: 7
              goto: ending_queen_consort
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 3
              goto: ending_abdicated
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "people"
                  - var: people_support
                    op: gte
                    value: 5
              goto: ending_people
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: false
                  - var: sowon_trust
                    op: lte
                    value: 1
              goto: ending_lonely
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: power
                    op: lt
                    value: 4
              goto: ending_one_step
            - when:
                all:
                  - var: bidam_trust
                    op: gte
                    value: 4
                  - var: power
                    op: lt
                    value: 4
              goto: ending_vanished
          default: ending_broken

  ending_true:
    actions:
      - bg: title_palace
      - effect: crown
      - say:
          text: "화백의 표가 하나씩 덕만에게 모였습니다. 문밖의 증인들은 돌아가지 않았고, 성문의 군사들은 칼을 뽑지 않은 채 반란군의 길을 막았습니다."
      - say:
          char: 칠숙.angry
          framing: bust
          text: "진평왕의 유언도 없습니다. 남자 후계자가 왕위를 양보한다는 문서도 없습니다. 누구의 명으로 왕좌를 요구하십니까?"
      - say:
          char: 덕만
          framing: bust
          text: "누구의 명도 빌리지 않겠습니다. 여기 있는 사람들이 직접 보고 겪은 일로 판단해 주십시오. 제가 내린 명령과 그 결과도 숨기지 않겠습니다."
          wait: 1000
      - char:
          id: 진운
          position: left
          framing: full
      - say:
          char: 진운
          framing: bust
          text: "저는 왕위를 양보하지 않겠습니다. 제 판단으로 덕만공주에게 표를 던지겠습니다. 그 차이를 기록해 주십시오."
      - char:
          id: 유신
          position: left
          framing: full
      - say:
          char: 유신
          framing: bust
          text: "동문에서 반란군이 물러나기 시작했습니다. 장례 행렬이 지나갈 길이 열렸습니다."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "아버지 상여부터 보내 주세요. 즉위식은 그 뒤에 하겠습니다."
      - say:
          delivery: calm
          text: "진평왕의 장례 행렬이 동문을 빠져나간 뒤, 즉위를 알리는 북이 세 번 울렸습니다. 화백들은 새 왕 앞에 예를 갖추었고 궁문이 열렸습니다."
      - effect: crown
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: closeup
          delivery: shout
          text: "길을 여세요! 신라의 새 여왕, 덕만 폐하께서 드십니다!"
      - say:
          char: 덕만
          framing: bust
          delivery: deduction
          text: "<speed=18>여왕이 아니다.</speed> <speed=42>신라의 왕이다.</speed>"
          wait: 1200
      - ending: true_end

  ending_tyrant:
    actions:
      - say:
          text: "군사가 회의장을 포위하자 표결은 한 번에 끝났다. 반대한 사람은 그날 밤 이름째 사라졌다. 덕만은 가장 빨리 왕이 되었고, 다음 날부터 모든 문을 더 많은 칼로 지켜야 했다."
      - ending: first_tyrant
  ending_permitted:
    actions:
      - say:
          text: "화백은 덕만을 왕이라 부르는 대신 왕명마다 대신들의 도장을 요구했다. 옥좌는 높았지만, 덕만의 손이 닿는 곳마다 이미 다른 손이 놓여 있었다."
      - ending: permitted_queen
  ending_queen_consort:
    actions:
      - say:
          text: "진운은 끝내 물러나지 못했다. 두 사람의 공동 선언은 혼인 서약으로 고쳐졌다. 신라는 왕 하나와 현명한 왕비를 얻었고, 덕만이 직접 쓴 문장은 진운의 이름 아래 보관되었다."
      - ending: queen_consort
  ending_abdicated:
    actions:
      - say:
          text: "진운이 물러나면 그의 군사가 움직이고, 덕만이 나아가면 왕경이 갈라질 판이었다. 덕만은 왕관을 내려놓아 내전을 멈췄다. 그날 나라를 다스린 결정은 왕이 되지 않겠다는 결정이었다."
      - ending: abdicated_crown
  ending_people:
    actions:
      - say:
          text: "화백은 끝내 문을 열지 않았다. 덕만은 문밖의 사람들과 함께 왕경을 떠났다. 국경의 마을들은 인장 없는 명령을 따랐고, 그녀는 왕관보다 먼저 통치를 얻었다."
      - ending: peoples_princess
  ending_lonely:
    actions:
      - say:
          delivery: sad
          text: "덕만은 왕좌에 올랐다. 첫 조회에서 무심코 오른편을 보았지만 언니의 붉은 옷도, 문밖에서 이름을 불러 줄 친구도 없었다. 넓어진 궁은 대답하지 않았다."
      - ending: lonely_throne
  ending_one_step:
    actions:
      - say:
          text: "표결은 덕만을 택했다. 그러나 성문을 지킬 군사는 오지 않았다. 즉위의 두 번째 북이 울릴 때, 칠숙의 마지막 궁수가 시위를 놓았다. 세 번째 북은 끝내 울리지 못했다."
      - ending: one_step_queen
  ending_vanished:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.sad
          framing: closeup
          delivery: whisper
          text: "동쪽 바다는 아직 누구에게도 신하의 예를 올리지 않았습니다. 저와 가시면 살아남을 수 있습니다. 다만…… 우리 이름을 적어 줄 사람은 데려가지 못하겠군요."
      - say:
          text: "덕만은 비담과 동쪽 바다를 건넜다. 행복했는지, 후회했는지, 서로의 이름을 얼마나 오래 불렀는지는 누구도 기록하지 않았다."
      - ending: vanished_princess
  ending_broken:
    actions:
      - say:
          text: "덕만도 진운도 물러나지 않았고, 어느 쪽도 나라 전체를 설득하지 못했다. 같은 모양의 왕관이 두 군기 위에 걸렸다. 신라 사람들은 누구의 백성인지 정하기 위해 서로에게 칼을 들었다."
      - ending: broken_alliance

  go_34_empty_council:
    actions:
      - gameOver:
          title: "운명 34 — 빈 회의의 승자"
          message: "반대할 귀족이 사라진 회의에서 덕만은 만장일치로 승리했다. 그러나 밖에 남은 가문들이 동시에 군사를 일으켰다. 아무도 없는 방의 승자는 나라를 얻지 못했다."
  go_35_fathers_lie:
    actions:
      - gameOver:
          title: "운명 35 — 아버지의 거짓말"
          message: "유언장은 완벽했지만 진평왕은 마지막 순간 오른손을 쓰지 못했다. 칠숙은 서명 한 획으로 거짓을 증명했다. 덕만은 왕의 딸이 아니라 왕명을 위조한 죄인으로 끌려갔다."
