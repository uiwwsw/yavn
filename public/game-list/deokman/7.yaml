script:
  - scene: poisoned_procession

scenes:
  poisoned_procession:
    actions:
      - bg: village
      - camera: wide
      - say:
          channel: record
          text: "제8장 — 한 사람을 버리는 법"
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          channel: narration
          text: "구휼 수레가 시장 모퉁이를 돌 때 지붕 기와가 한 장 미끄러졌습니다. 덕만이 고개를 들기도 전에 화살이 천명의 어깨를 꿰었습니다. 달아나는 자의 허리에서 가짜 모란패가 돌바닥에 튕겼습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "이 모란패, 가짜야… 내가 죽으면 네가 시킨 일이 돼. 자객 말고 나부터 의원에게 데려가."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "독이 퍼집니다. 의원은 남쪽, 자객은 북쪽입니다. 둘 다 못 갑니다. 정하십시오!"
      - choice:
          key: c8_first_response
          prompt: "천명의 독과 자객의 도주가 동시에 시작됐습니다. 덕만은 어디로 갈까요?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "천명을 업고 시장 의원에게 뛴다"
              add: { cheonmyeong_trust: 2, people_support: 2, evidence: -1 }
              goto: public_treatment
            - text: "비담의 의원에게 숨기고 사망 종을 울린다"
              add: { bidam_trust: 2, insight: 1, fear: 1 }
              goto: false_death
            - text: "천명을 유신에게 맡기고 지붕을 쫓는다"
              add: { evidence: 2, yushin_trust: 2, fear: 1 }
              goto: divided_rescue

  public_treatment:
    actions:
      - bg: village
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          channel: narration
          text: "덕만은 천명을 업고 사람들을 밀치며 달렸습니다. 천명의 피가 덕만의 소매를 적시는 동안 지붕 위 발자국은 빗물에 하나씩 무너졌습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "사람들이 네가 날 업고 뛴 걸 봤어. 적어도 네 화살이라고는 못 하겠지. 자객은 놓쳤지만."
      - goto: forged_confession

  divided_rescue:
    actions:
      - bg: frontier
      - say:
          channel: narration
          text: "유신이 천명을 안고 골목으로 사라지는 동안 덕만은 지붕을 건넜습니다. 버려진 초소에는 귀족 금화와 덕만의 글씨를 흉내 낸 명령서가 바닥에 흩어져 있었습니다."
      - say:
          char: 덕만.sad
          text: "명령서는 찾았어. 자객만 잡으면 언니를 해친 사람이 누군지도—"
      - say:
          channel: narration
          text: "문장 끝에 지붕 기와가 꺼졌습니다. 초소는 명령서를 보여 주기 위한 미끼였고, 아래 방에는 독화살을 쏜 자객 둘이 덕만을 기다리고 있었습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "공주님! 천명 공주님은 의원에게 닿았습니다. 어디 계십니까? 대답하십시오!"
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [유신]
          text: "언니가 살았다면 됐어. 이 종이… 꼭 가져가. 내 글씨가 아니라고 언니가 말해 줄 거야."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 순행 피습 — 천명 공주는 생존. 덕만 공주는 자객 추격 중 독화살에 맞아 사망."
      - gameOver:
          title: "운명 — 명령서 아래의 함정"
          message: "치료를 맡길 수는 있었지만 덕만이 직접 쫓은 증거는 자객이 준비한 두 번째 미끼였습니다. 천명은 살았고 덕만은 위조문을 쥔 채 지붕 아래에서 죽었습니다."
          recoverToChoice: c8_first_response

  false_death:
    actions:
      - bg: locked_room
      - char: { id: 비담, position: right }
      - say:
          channel: narration
          text: "비담의 의원이 문을 잠그자 궁에서는 천명의 사망 종이 울렸습니다. 그날 밤 축하주를 주문한 집마다 비담의 전령이 서신을 훔쳐 나왔습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "산 공주를 죽었다고 쓰는 건 왕실의 특기인가 봅니다. 이번엔 축하 편지를 부르는군요."
      - say:
          char: 덕만.angry
          text: "그 기록에서 살아난 내 앞에서 웃지 마. 편지보다 해독약이 먼저야. 의원은 언제 와?"
      - goto: bad_poison_clock

  bad_poison_clock:
    actions:
      - bg: locked_room
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - camera: { shot: close, target: 천명 }
      - say:
          channel: narration
          text: "덕만이 가짜 사망 종으로 범인을 낚는 동안, 비담의 밀실은 천명을 시장 의원에게서 너무 멀리 숨겼습니다. 의원에게 닿았을 때는 해독약을 삼킬 숨이 남지 않았습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "편지를 다 잡아도… 내가 죽으면 누가 네 말을 믿어? 또 산 사람의 글만 남잖아."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니, 눈 떠. 편지도 종도 다 버릴게. 이번엔 언니부터 고를게."
      - say:
          channel: record
          text: "천명 공주 독살 사건 — 현장에서 사라진 덕만 공주가 배후로 지목됨. 덕만은 체포 이틀 뒤 반역죄로 처형됨."
      - gameOver:
          title: "운명 — 독보다 늦은 진실"
          message: "거짓 죽음으로 범인을 끌어내려다 진짜 치료 시간을 잃었습니다. 천명이 죽자 준비된 자백문이 사실이 되었고 덕만도 뒤따라 죽었습니다."

  forged_confession:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "이튿날 조회상에 자백문이 펼쳐졌습니다. 천명이 쓰러지기 전부터 말라 있던 먹, 이미 죽은 군관의 서명. 어린 덕만의 사망 기록과 같은 냄새가 났습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "어머니가 나오면 위조문은 찢깁니다. 대신 군대가 갈립니다. 계속 숨으면 그 종이가 공주님 목을 조르고요."
      - choice:
          key: c8_public_story
          prompt: "살아 있는 천명과 위조 자백문이 있습니다. 무엇을 먼저 공개할까요?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "천명의 손을 잡고 회의장에 들어간다"
              when: { var: sisters_public, op: eq, value: true }
              add: { nobles_support: 1, people_support: 2, cheonmyeong_trust: 1 }
              goto: sister_testimony
            - text: "문은 닫고 위조된 획만 공개한다"
              add: { evidence: 2, chunchu_trust: 1 }
              goto: evidence_only
            - text: "장례 종을 계속 울려 배후를 낚는다"
              add: { evidence: 2, fear: 2, cheonmyeong_trust: -1 }
              goto: keep_death_story

  sister_testimony:
    actions:
      - bg: throne_hall
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "덕만이 저를 죽이려 했다는 글은 거짓입니다. 제 상처를 덕만의 표로도 쓰지 마세요. 제 말은 제가 합니다."
      - say:
          channel: narration
          text: "천명이 살아 걸어오자 자백문은 찢겼습니다. 그러나 질문은 곧 바뀌었습니다. '천명 공주도 덕만을 왕으로 인정합니까?' 모두가 같은 답만 기다렸습니다."
      - goto: sister_decision

  evidence_only:
    actions:
      - bg: council_hall
      - say:
          channel: narration
          text: "덕만은 틀린 획과 죽은 군관의 날짜를 하나씩 읽었습니다. 종이는 거짓으로 판명됐지만 닫힌 문 뒤 천명의 침묵에는 저마다 원하는 생사가 붙었습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "종이는 이겼습니다. 하지만 어머니가 안 나오니 증인을 숨겼다 합니다. 지금이라도 여십시오."
      - say:
          char: 덕만.princess_angry
          camera: close
          with: [춘추]
          text: "언니 몸이 아직 버티지 못해. 획이 틀렸다는 것만으로 충분해야 해."
      - say:
          channel: narration
          text: "그날 밤 닫힌 방에 새 의원이 들어갔습니다. 천명의 맥을 본다며 놓은 침에는 남은 독을 심장으로 밀어 넣는 약이 묻어 있었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "천명 공주 독살 사건 — 유일한 목격자 덕만 공주가 치료를 통제한 정황으로 체포, 사흘 뒤 처형."
      - gameOver:
          title: "운명 — 문 뒤에서 끝난 증언"
          message: "종이의 위조만 밝히고 살아 있는 천명을 감추자, 암살자는 의원으로 들어가 독을 마무리했습니다. 증언자가 죽은 뒤 덕만은 언니를 숨긴 범인으로 몰려 처형됐습니다."
          recoverToChoice: c8_public_story

  keep_death_story:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "빈 관에 비단이 덮이는 동안 축하 서신 다섯 통이 잡혔습니다. 벽 하나 너머에서 천명은 자기 장례를 준비하는 못질을 끝까지 들었습니다."
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "원하던 편지는 얻었어. 이제 문 열자. 약 냄새가 이상해. 아까 온 의원, 시장에서 본 사람이 아니었어."
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [천명]
          text: "조금만 더 버텨. 축하 서신을 보낸 집이 하나 더 있어. 그 집까지 잡으면—"
      - say:
          channel: narration
          text: "천명의 손이 덕만의 소매에서 미끄러졌습니다. 장례를 계속하는 동안 가짜 의원이 해독약을 조금씩 독으로 바꿨고, 밖의 사람들은 이미 천명이 죽었다고 믿었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "천명 공주 장례 뒤 덕만 공주가 암살 배후로 지목됨. 덕만은 귀족 회의의 판결로 참수."
      - gameOver:
          title: "운명 — 끝내지 않은 장례"
          message: "배후를 더 잡으려고 천명의 죽음을 연기하자 진짜 독살도 장례 뒤에 숨었습니다. 살아 있다는 증언이 사라진 순간 덕만은 준비된 범인이 되어 뒤따라 죽었습니다."
          recoverToChoice: c8_public_story

  sister_decision:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          text: "남으면 또 네 반대편에 세우겠지. 떠나면 버렸다고 할 테고. 그래도 이번엔 내가 정할래. 내 목숨이니까."
      - choice:
          key: c8_cheonmyeong_fate
          prompt: "천명이 자기 삶을 고르려 합니다. 덕만은 어떻게 답할까요?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "국경 구휼소의 열쇠를 천명에게 준다"
              set: { cheonmyeong_outcome: exile }
              add: { cheonmyeong_trust: 2, people_support: 1, nobles_support: -1 }
              goto: living_exile
            - text: "비밀방 문을 열고 궁 안에 숨긴다"
              set: { cheonmyeong_outcome: hidden_alive }
              add: { evidence: 1, fear: 2, chunchu_trust: -1 }
              goto: hidden_alive
            - text: "자백문에 덕만의 진짜 서명을 한다"
              goto: bad_self_sacrifice

  living_exile:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "천명은 왕실 비녀를 탁자에 두고 구휼소 열쇠를 목에 걸었습니다. 성문 밖에서는 추방이라 수군댔지만 마차의 행선지는 천명이 직접 적었습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "사람들은 네가 날 버렸다 하겠지. 화나면 편지해. 나도 네가 미웠다고 답할게. 우린 자매니까."
      - goto: abandoned_end

  hidden_alive:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "밤이면 비밀문이 열리고 천명이 촛불 아래로 나왔습니다. 덕만은 언니의 조언을 들었지만, 해가 뜨면 천명은 발소리조차 숨겨야 했습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "네 곁에 숨으면 살 줄 알았어. 그런데 약도 문도 전부 저들 손이야. 우리끼린 나갈 수도 없어."
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [천명]
          text: "오늘 밤 나가자. 네가 걸을 수 있을 때까지 기다리려 했는데, 더 기다리면 안 돼."
      - say:
          channel: narration
          text: "덕만이 비밀문을 밀었지만 바깥 빗장은 이미 잠겨 있었습니다. 방 안 향로에서는 치료약과 같은 냄새의 연기가 피어올랐고, 문밖에서는 두 공주의 기침을 조용히 세고 있었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 밀실 화재 — 신원 미상 여인 둘 사망. 천명 공주의 장례 기록은 수정하지 않음."
      - gameOver:
          title: "운명 — 숨겨 둔 자매"
          message: "살아 있는 천명을 궁 안에 숨기자 자매의 음식과 약과 문을 모두 적이 통제했습니다. 왕위를 시기한 귀족들은 향로에 독을 넣고 두 사람을 이름 없는 시신으로 만들었습니다."
          recoverToChoice: c8_cheonmyeong_fate

  abandoned_end:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: sad }
      - say:
          channel: narration
          text: "마차가 성문을 나가거나 비밀문이 닫힌 뒤, 덕만의 곁에는 천명이 쓰던 찻잔 하나만 남았습니다. 덕만은 손을 뻗었다가 끝내 잔을 치우지 못했습니다."
      - say:
          char: 덕만.sad
          text: "언니를 버린 게 아니야. 내 옆에만 있어야 산다는 고집을 버린 거야. 언니가 고른 길을 지킬게."
      - say:
          channel: record
          text: "그날 밤 천명의 빈 의자에 세 가문의 표식이 번갈아 놓였습니다. 곧이어 진평왕의 처소에서 다급한 종이 울렸고, 귀족 회의는 새벽에 왕을 고르겠다는 문서를 문틈으로 밀어 넣었습니다."
      - goto: /8.yaml

  bad_self_sacrifice:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.sad
          text: "언니는 살아야 해. 내가 자백문이 사실이라고 말하면 모두 끝나."
      - say:
          char: 천명.sad
          text: "네가 죽으면 나는 네 죄를 증언하며 살아. 그게 어떻게 나를 살리는 일이야?"
      - say:
          channel: narration
          text: "덕만의 자백은 위조문을 진실로 만들었습니다. 천명은 풀려났지만 동생을 죽이고 얻은 왕위라는 소문에서 평생 벗어나지 못했습니다."
      - say:
          channel: record
          text: "반역 재판 기록 — 덕만 공주, 언니 천명 암살 모의 자백 후 처형. 왕위 계승 분쟁 종결."
      - gameOver:
          title: "운명 — 대신 죽는다는 폭력"
          message: "자기희생은 천명에게 선택권을 돌려주지 않았습니다. 덕만은 언니를 살린다는 명분으로 언니에게 가장 무거운 삶을 강요했습니다."
