script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: focus
      - char:
          id: 덕만
          position: center
      - say:
          text: "최종장 — 왕이 보지 못한 아침"
      - say:
          with:
            - 덕만
          delivery: calm
          text: "632년, 왕이 된 지 사흘째. 첫 회의가 열렸습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "공주 덕만은 이제 선덕왕이라 불렸습니다. 신라에서 처음으로 왕이 된 여자였습니다."
      - say:
          with:
            - 덕만
          text: "왕관을 쓰는 데는 성공했지만, 사람들이 여자의 명령을 왕명으로 받아들일지는 아직 증명되지 않았습니다."
      - char:
          id: 소원
          position: left
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "전하. 궁문 밖에 사람이 가득합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "무슨 일이지?"
      - say:
          char: 소원.nervous
          camera: close
          with:
            - 덕만
          text: "곡식이 끊겼답니다."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "새 왕을 알리는 의식이 먼저입니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "사람들은 사흘을 굶었습니다."
      - say:
          char: 진운
          camera: close
          with:
            - 덕만
          text: "왕이 흔들리면 창고도 못 엽니다."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "밖에선 오늘을 못 넘깁니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "호위는 준비됐습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "왕이 된 뒤 첫걸음이군요."
      - say:
          with:
            - 덕만
          text: "창고를 열면 오늘의 굶주림은 막지만 겨울 몫이 줄어듭니다. 세금을 미루면 고을은 살지만 군량과 귀족의 지지는 흔들립니다."
      - say:
          with:
            - 덕만
          text: "직접 백성 앞에 나가면 새 왕의 얼굴을 믿게 할 수 있습니다. 그러나 왕위에 반대한 사람들이 노리는 거리로 스스로 나가는 길이기도 했습니다."
      - branch:
          cases:
            - when:
                var: has_royal_seal
                op: eq
                value: true
              goto: opening_seal_legacy
          default: opening_broken_seal_legacy

  opening_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "사흘 전 되찾은 금빛 도장이 새 왕의 첫 명령을 기다렸습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "도장이 있으면 명령은 빨라집니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "빠른 명령이 늘 옳지는 않지요."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그래도 오늘은 모두 듣겠습니다."
      - add: { legitimacy: 1 }
      - goto: opening_move_choice

  opening_broken_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "덕만은 깨진 도장 두 조각을 왕좌 곁에 내려놓았습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "문지기들이 전하 이름을 묻습니다."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "그럼 제 이름으로 설득해야죠."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "그 이름을 들으러 모인 사람들입니다."
      - add: { people_support: 1 }
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "첫날, 무엇부터 할까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "창고를 연다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "세금을 미룬다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "왕이 직접 나간다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "반대 귀족을 친다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with:
            - 덕만
            - 진운
          text: "왕실 창고의 첫 문이 열렸습니다."
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "겨울 몫까지 나가고 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "그 전에 굶으면 겨울도 없습니다."
      - say:
          char: 진운.nervous
          camera: close
          with:
            - 덕만
          text: "제가 틀렸다고 기록하실 겁니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진운
          text: "내일도 같이 틀려 주세요."
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "……그 부탁은 처음 듣습니다."
      - goto: early_reign_bridge

  opening_gates:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "덕만은 피해 고을의 세금을 미뤘습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "군량도 줄어듭니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "농부가 살아야 내년 군량도 납니다."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "그때까지 제가 버티겠습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "아니요. 우리가 버팁니다."
      - goto: early_reign_bridge

  opening_witnesses:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "덕만은 왕의 옷을 입고 궁문 밖으로 나갔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "돌아가라 하면 화내실 겁니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "화낼 힘도 없어서 못 가."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "그럼 제 팔을 잡으세요."
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "왕이 기대도 되나?"
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "넘어지는 것보단 낫죠."
      - goto: early_reign_bridge

  early_reign_bridge:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "이듬해 봄. 굶주린 고을의 세금이 멈췄습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "귀족들 얼굴이 아주 볼 만합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "웃지만 말고 달래 주세요."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "왕께서 절 믿는다는 뜻입니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "신라에 그대가 필요하다는 뜻입니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "또 신라가 먼저군요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "그대가 없으면 못 하는 일입니다."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "그 말로 오늘은 속아 드리죠."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: fortress
      - camera: wide
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          delivery: calm
          text: "10년 뒤, 642년. 대야성이 무너졌습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "덕만은 그사이 굶주린 고을의 세금을 멈추고 국경의 창고를 채웠습니다. 그래도 전쟁까지 막을 수는 없었습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "대야성의 패배는 성 하나를 잃은 일이 아니었습니다. 피란길, 남은 성, 새로 꾸릴 군대가 한꺼번에 왕의 결정을 기다렸습니다."
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "서쪽 마흔 성이 위태롭습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 유신
          text: "피란민은?"
      - say:
          char: 유신.sad
          camera: close
          with:
            - 덕만
          text: "길이 막혔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "당에 보낼 사신도 기다립니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "한 손으로 다 잡을 수는 없군."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "그래도 왕의 손은 하나뿐입니다."
      - say:
          with:
            - 덕만
          text: "피란길을 열면 사람은 살지만 남은 성의 병력이 빠집니다. 유신에게 큰 군권을 주면 반격할 수 있지만 왕의 힘 일부를 한 장수에게 맡겨야 합니다."
      - say:
          with:
            - 덕만
            - 비담
          text: "성을 먼저 지키면 나라의 땅은 남지만 길 밖의 사람을 버리게 됩니다. 거짓 승전은 잠깐의 공포를 막는 대신 왕의 말을 다시 믿지 못하게 만듭니다."
      - choice:
          key: final_proof
          prompt: "무엇부터 지킬까?"
          char: 덕만
          camera: close
          with:
            - 비담
          options:
            - text: "피란길을 연다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "유신에게 군권을 준다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "남은 성을 지킨다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "승전을 꾸민다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "성문이 열리자 피란민이 쏟아져 들어왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "다 받을 자리가 없습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "절 마당까지 비워."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "전하의 방도요?"
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "비어 있잖아. 사람부터 눕혀."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "그 말, 제가 꼭 기록할게요."
      - goto: pagoda_bridge

  proof_evidence:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "덕만은 자신의 도장을 유신에게 건넸습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "돌아오지 못할 수도 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "그래서 그대에게 맡깁니다."
      - say:
          char: 유신.sad
          camera: close
          with:
            - 덕만
          text: "전하를 두고 가기 싫습니다."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 유신
          text: "나도 보내기 싫어요."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "그럼 살아서 돌아오겠습니다."
      - goto: pagoda_bridge

  proof_army:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with:
            - 덕만
            - 비담
          text: "덕만은 남은 성마다 군사를 다시 나눴습니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "피란길은 더 늦어집니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "성이 무너지면 길도 없습니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "또 누구를 먼저 버릴지 고르시는군요."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "그 말은 틀리지 않아."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "틀리지 않아서 더 싫습니다."
      - goto: pagoda_bridge

  pagoda_bridge:
    actions:
      - bg: title_palace
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "645년. 황룡사에 아홉 층 탑이 올랐습니다."
      - say:
          with:
            - 덕만
            - 비담
          delivery: calm
          text: "대야성을 잃은 뒤 세 해 동안 덕만은 군사를 다시 세우고 피란민을 받아들였습니다. 전쟁은 끝나지 않았고 백성의 두려움도 남았습니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "백성은 돌보다 곡식을 원합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "탑이 전쟁을 막진 못해요."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "무너진 마음을 붙들 뿐이지."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "전하는 늘 둘 다 필요하다 하십니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "하나를 버리는 건 늘 제 몫이고요."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "비담. 난 그대를 버린 적 없어요."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "왕은 사람보다 나라를 먼저 고릅니다."
      - say:
          char: 비담
          camera: close
          with:
            - 덕만
          text: "이제 그 선택은 제가 하겠습니다."
      - say:
          text: "그날 비담은 귀족 회의를 이끄는 자리에 올랐습니다."
      - goto: crown_assessment

  crown_assessment:
    actions:
      - bg: title_palace
      - camera: wide
      - effect: crown
      - say:
          delivery: calm
          text: "사람들은 탑보다 먼저 전쟁 소식을 올려다봤습니다."
      - say:
          delivery: calm
          text: "647년 정월. 선덕왕은 오래 앓고 있었습니다."
      - say:
          delivery: calm
          text: "탑이 선 지 두 해 뒤, 비담은 여왕이 나라를 어지럽혔다며 군사를 모았습니다. 덕만이 가장 오래 믿은 사람 가운데 하나가 마지막 적이 된 것입니다."
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 7
                  - var: power
                    op: gte
                    value: 4
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
              goto: crown_balanced
            - when:
                all:
                  - var: power
                    op: gte
                    value: 6
                  - var: army_support
                    op: gte
                    value: 3
              goto: crown_force
            - when:
                all:
                  - var: people_support
                    op: gte
                    value: 4
              goto: crown_people_ready
          default: crown_fragile

  crown_balanced:
    actions:
      - say:
          text: "백성과 군사, 귀족의 사자가 차례로 왕의 문을 두드렸습니다."
      - goto: crown_choice

  crown_force:
    actions:
      - say:
          text: "군사는 왕을 따랐지만 궁 안에는 빈자리가 많았습니다."
      - goto: crown_choice

  crown_people_ready:
    actions:
      - say:
          text: "성 밖에는 왕을 부르는 사람이 모였습니다."
      - goto: crown_choice

  crown_fragile:
    actions:
      - say:
          text: "왕의 편은 많았지만 서로를 믿지 못했습니다."
