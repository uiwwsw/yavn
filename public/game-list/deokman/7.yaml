          text: "살려 두면 회의 안에서 제 목을 요구합니다. 먼저 끝내겠습니다."
      - effect: darken
      - say:
          text: "해가 뜨기 전 열세 명이 처형됐습니다. 귀족 회의에는 덕만을 반대할 사람이 오지 않았고, 남은 이들은 모두 같은 표를 던졌습니다."
      - effect: crown
