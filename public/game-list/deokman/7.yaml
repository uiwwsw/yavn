chapterTitle: "한 사람을 버리는 법"

script:
  - scene: poisoned_procession

scenes:
  poisoned_procession:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - music: night_road
      - say:
          camera: wide
          channel: record
          text: "제8장 — 한 사람을 버리는 법"
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          channel: action
          text: "머리 위에서 기와가 달그락거린다. 언니가 내 쪽으로 쓰러진다. 부축한 손이 젖는다. 발치에 떨어진 모란패가 한 바퀴 돌고 멎는다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "덕만아, 저 패는… 가짜야. 가지 마. 나 좀 붙잡아 줘."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "독입니다. 의원은 남쪽입니다. 자객은 제가 보낼 테니 공주님을 옮기십시오!"
      - choice:
          key: c8_first_response
          prompt: "언니의 숨이 짧아진다. 지붕 위 발소리는 멀어진다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "비담의 의원에게 숨기고 사망 종을 울린다"
              add: { bidam_trust: 2, insight: 1, fear: 1 }
              goto: false_death
            - text: "천명을 유신에게 맡기고 지붕을 쫓는다"
              add: { evidence: 2, yushin_trust: 2, fear: 1 }
              goto: divided_rescue
            - text: "천명을 업고 시장 의원에게 뛴다"
              add: { cheonmyeong_trust: 2, people_support: 2, evidence: -1 }
              goto: public_treatment

  public_treatment:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - char:
          id: "천명"
          position: "right"
          emotion: "sad"
      - say:
          channel: action
          text: "언니를 업는다. 젖은 옷보다 몸이 가볍다. 고개가 내 어깨에 떨어질 때마다 이름을 부른다. 대답이 들려야 한 걸음 더 뛸 수 있다."
      - say:
          char: "천명.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "온 장터가 보았겠다. 공주가 공주를 업고… 너, 허리는 괜찮니?"
      - goto: "recover_sister_evidence"

  divided_rescue:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - say:
          channel: narration
          text: "유신이 천명을 안고 뛰었다. 덕만은 지붕으로 올라갔다. 버려진 초소 바닥에 금화와 종이가 널렸다. 종이 끝에 제 이름이 보였다."
      - say:
          char: 덕만.sad
          text: "내 이름이야. 이것만 가져가면… 잠깐, 아래에 누가—"
      - say:
          channel: narration
          text: "기왓장이 발밑에서 꺼졌다. 덕만은 종이를 잡은 채 떨어졌다. 어두운 방 안에서 활 두 자루가 이미 들려 있었다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "덕만 공주님! 의원에게 모셨습니다! 어디 계십니까!"
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [유신]
          text: "언니는… 살았어? 그럼 됐어. 이 종이는 가져가. 언니가 내 글씨를 알아."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "구휼 순행 피습 — 천명 공주는 생존. 덕만 공주는 자객 추격 중 독화살에 맞아 사망."
      - gameOver:
          title: "운명 — 명령서 아래의 함정"
          message: "유신이 종이를 빼내자 덕만의 손이 바닥으로 떨어졌다. 의원에서 깨어난 천명은 동생이 어디 있느냐고 물었다."
          recoverToChoice: c8_first_response

  false_death:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - char: { id: 비담, position: right }
      - say:
          channel: narration
          text: "잠긴 방 안에서 의원을 기다렸다. 궁의 종이 천명의 죽음을 알렸다. 그날 밤 비담의 전령들은 축하 서신을 여러 통 가져왔다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "부고가 닿자마자 술을 들였답니다. 성급한 분들이 꽤 계시는군요."
      - say:
          char: 덕만.angry
          text: "그만 웃어. 언니 손이 식잖아. 의원은 어디 있어?"
      - goto: bad_poison_clock

  bad_poison_clock:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - camera: { shot: close, target: 천명 }
      - say:
          channel: narration
          text: "숨어 오는 의원은 길을 여러 번 돌아야 했다. 문이 열렸을 때 천명은 물도 삼키지 못했다. 덕만이 턱을 받쳐도 약은 입가로 흘렀다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "덕만아… 그만. 쓰다. 나 좀 쉬게 해 줘."
      - say:
          char: 덕만.sad
          camera: medium
          with: [천명]
          text: "한 모금만, 언니. 그러고 나한테 화내. 다 듣고 있을게."
      - say:
          channel: record
          text: "천명 공주 독살 사건 — 현장에서 사라진 덕만 공주가 배후로 지목됨. 덕만은 체포 이틀 뒤 반역죄로 처형됨."
      - gameOver:
          title: "운명 — 독보다 늦은 진실"
          message: "축하 서신은 모두 모였다. 천명은 그것을 읽지 못했다. 덕만을 데려가는 병사들은 동생이 언니를 숨긴 이유만 물었다."

  forged_confession:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - music: "sealed_court"
      - char:
          id: "춘추"
          position: "right"
          emotion: "nervous"
      - say:
          camera: wide
          channel: thought
          text: "언니가 쓰러진 것은 어제다. 자백문은 접힌 자리가 닳아 있다. 서명한 군관의 이름을 다시 읽는다. 장례를 치른 사람이다."
      - say:
          char: "춘추.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "어머니께서 직접 말씀하셔야 합니다. …걸으실 수는 있습니까? 제가 모시겠습니다."
      - choice:
          key: "c8_public_story"
          prompt: "춘추가 닫힌 방문과 내 손의 종이를 번갈아 본다."
          char: "덕만"
          camera: "medium"
          with:
            - "춘추"
          options:
            - text: "문은 닫고 위조된 획만 공개한다"
              add:
                evidence: 2
                chunchu_trust: 1
              goto: "evidence_only"
            - text: "천명의 손을 잡고 회의장에 들어간다"
              when:
                var: "sisters_public"
                op: "eq"
                value: true
              add:
                nobles_support: 1
                people_support: 2
                cheonmyeong_trust: 1
              goto: "sister_testimony"
            - text: "장례 종을 계속 울려 배후를 낚는다"
              add:
                evidence: 2
                fear: 2
                cheonmyeong_trust: -1
              goto: "keep_death_story"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_token"

  sister_testimony:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "내가 살아 여기 왔소. 동생이 나를 죽였다 쓴 자는 앞으로 나오시오. 내 눈을 보고 말하시오."
      - say:
          channel: action
          text: "언니가 문턱을 넘는다. 자백문을 쥔 사내가 종이를 접다가 찢는다. 누군가 다급히 왕위 이야기를 꺼낸다. 언니는 아직 앉지도 않았다."
      - goto: sister_decision

  evidence_only:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만은 틀린 획을 짚고, 죽은 군관의 날짜를 읽었다. 반박하는 사람은 없었다. 대신 천명은 어디 있느냐는 질문이 되풀이되었다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "저도 어머니를 뵙게 해 주십시오. 공주님 말씀만 전하라 하지 마시고요."
      - say:
          char: 덕만.princess_angry
          camera: medium
          with: [춘추]
          text: "아직 못 일어나셔. 네가 가면 일어나려 하실 거야. 오늘만 기다려 줘."
      - say:
          channel: narration
          text: "새 의원이 조용히 방에 들었다. 맥을 보겠다며 천명의 손목을 꺼냈다. 그가 놓은 침 주위로 검은 빛이 번질 때까지, 문은 열리지 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "천명 공주 독살 사건 — 유일한 목격자 덕만 공주가 치료를 통제한 정황으로 체포, 사흘 뒤 처형."
      - gameOver:
          title: "운명 — 문 뒤에서 끝난 증언"
          message: "덕만은 위조문을 밝혔으나 천명을 지키지 못했다. 의원은 사라졌고, 치료를 맡긴 동생의 이름만 남았다."
          recoverToChoice: c8_public_story

  keep_death_story:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - say:
          channel: narration
          text: "벽 너머에서 관 짜는 소리가 났다. 천명은 못질이 멈출 때마다 잠들려 했다. 그때마다 문이 열리고 새 서신이 들어왔다."
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "이제 됐잖아. 문 열자, 덕만아. 약이 아까와 달라. 나, 이 방이 싫어."
      - say:
          char: 덕만.princess_sad
          camera: medium
          with: [천명]
          text: "한 집만 더 남았어. 그 집 답장만 받으면 끝낼게. 언니, 조금만…"
      - say:
          channel: narration
          text: "천명이 잡고 있던 소매가 풀렸다. 덕만은 서신을 내려놓고 언니를 흔들었다. 문밖에서는 장례에 쓸 흰 천을 재고 있었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "천명 공주 장례 뒤 덕만 공주가 암살 배후로 지목됨. 덕만은 귀족 회의의 판결로 참수."
      - gameOver:
          title: "운명 — 끝내지 않은 장례"
          message: "빈 관이라던 관에 천명이 누웠다. 덕만이 거짓 장례였다고 외쳤으나, 귀족들은 그 말을 자백으로 받아 적었다."
          recoverToChoice: c8_public_story

  sister_decision:
    actions:
      - bg: { id: princess_chamber, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          camera: medium
          char: 천명.sad
          text: "궁에 남아도, 떠나도 말은 나오겠지. 덕만아. 이번에는 내가 갈 곳을 정하마."
      - choice:
          key: c8_cheonmyeong_fate
          prompt: "언니가 제 짐을 싸 놓았다. 나는 문 앞에 서 있다."
          char: 덕만
          camera: medium
          with: [천명]
          options:
            - text: "국경 구휼소의 열쇠를 천명에게 준다"
              set: { cheonmyeong_outcome: exile }
              add: { cheonmyeong_trust: 2, people_support: 1, nobles_support: -1 }
              goto: living_exile
            - text: "비밀방 문을 열고 궁 안에 숨긴다"
              set: { cheonmyeong_outcome: hidden_alive }
              add: { evidence: 1, fear: 2, chunchu_trust: -1 }
              goto: hidden_alive
            - text: "자백문에 덕만의 진짜 서명을 한다"
              goto: bad_self_sacrifice

  living_exile:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: action
          text: "언니가 비녀를 빼어 놓는다. 구휼소 열쇠가 목 아래서 흔들린다. 마차 행선지를 적는 손을 본다. 붙잡으려던 내 손은 무릎 위에 둔다."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "편지해라. 나라 얘기 말고, 네가 먹은 밥 얘기도 좀 쓰고. 나도 그럴 테니."
      - goto: abandoned_end

  hidden_alive:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - say:
          channel: "narration"
          text: "비밀방에 작은 창이 났다. 천명은 열린 틈에 손을 내밀어 볕을 받았다. 복도에서 발소리가 나자 손을 거두었다."
      - say:
          char: "천명.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "창은 내 주면서 문은 못 열어 주는구나."
      - say:
          char: "덕만.princess_sad"
          camera: "medium"
          with:
            - "천명"
          text: "날을 정하자. 언니가 정해. 그날에는 내가 직접 문을 열게."
      - say:
          channel: "narration"
          text: "천명은 달력에 동그라미를 쳤다. 덕만이 나간 뒤에도 그 날짜를 보고 있었다. 회의장에는 의자 하나가 비어 있었다."
      - add:
          cheonmyeong_trust: -2
      - say:
          channel: thought
          text: "언니는 살아 있다. 그 말로 안심하려 하면, 창에서 거두던 손이 떠오른다."
      - goto: "abandoned_end"

  abandoned_end:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 덕만, position: left, emotion: sad }
      - say:
          camera: wide
          channel: action
          text: "언니가 쓰던 찻잔을 들어 본다. 입 닿는 곳이 조금 닳았다. 상궁을 불렀다가, 치우지 말라는 말만 한다."
      - say:
          char: 덕만.sad
          text: "잘 있어야 해, 언니. 다음엔 내가 갈게. 숨지 않고, 대문으로."
      - say:
          channel: action
          text: "안채에서 다급한 종이 울린다. 문틈으로 새 왕을 정할 회의 문서가 들어온다. 나는 찻잔을 내려놓는다."
          with: []
          camera: wide
          continueLabel: 아버지의 처소로 서둘러 간다
      - goto: /8.yaml

  bad_self_sacrifice:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.sad
          text: "내가 했다고 할게. 그러면 언니는 풀려나잖아. 이번엔 내가 남을게."
      - say:
          char: 천명.sad
          text: "내가 언제 너 죽는 걸 보겠댔어? 덕만아, 내 말 좀 들어. 제발."
      - say:
          channel: narration
          text: "자백문에 진짜 서명이 들어갔다. 천명은 풀려나 곧장 형장으로 갔다. 문지기는 새 계승자께서 보실 일이 아니라며 길을 막았다."
      - say:
          channel: record
          text: "반역 재판 기록 — 덕만 공주, 언니 천명 암살 모의 자백 후 처형. 왕위 계승 분쟁 종결."
      - gameOver:
          title: "운명 — 대신 죽는다는 폭력"
          message: "천명은 동생의 자백을 거두라 청했다. 덕만의 서명이 너무 분명하다는 대답이 돌아왔다."

  evidence_token:
    actions:
      - sticker:
          id: desk_0
          image: peony_token_sticker
          x: 27
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - sticker:
          id: desk_1
          image: forged_token_sticker
          x: 73
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - say:
          channel: action
          text: "언니의 숨이 고르게 돌아온 뒤에야 천을 편다. 모란패 둘을 나란히 놓는다. 내 것은 늘 목에 닿던 면부터 손이 간다."
          with: []
          camera: wide
      - goto: evidence_token_compare

  evidence_token_compare:
    actions:
      - choice:
          key: evidence_token_look
          presentation: explore
          prompt: "닮은 모란 두 송이. 손으로 확인할 곳은?"
          camera: wide
          with: []
          options:
            - text: 내 오래된 모란패
              at:
                x: 27
                "y": 75
              goto: evidence_token_detail_0
            - text: 지붕에서 주운 패
              at:
                x: 73
                "y": 75
              goto: evidence_token_detail_1
            - text: 살펴본 두 흔적을 대조한다
              when:
                all:
                  - var: evidence_token_seen_0
                    op: eq
                    value: true
                  - var: evidence_token_seen_1
                    op: eq
                    value: true
              goto: evidence_token_deduce
            - text: 물건을 챙기고 돌아간다
              goto: evidence_token_return


  evidence_token_retry:
    actions:
      - say:
          channel: thought
          text: "빛깔은 닦으면 달라져. 그런데 저 고리에는 끈이 들어갈까? 쓰던 물건이라면 흔적이 있을 텐데."
          with: []
          camera: wide
      - goto: evidence_token_compare

  evidence_token_solved:
    actions:
      - set:
          token_verified: true
      - say:
          char: "덕만"
          text: "고리가 막혔어. 매달고 다닌 패가 아니야. 누군가 떨어뜨리려고 만든 거야."
      - goto: "evidence_token_return"


  evidence_token_return:
    actions:
      - clearSticker:
          id: "desk_0"
          leave: "fadeOut"
      - clearSticker:
          id: "desk_1"
          leave: "fadeOut"
      - goto: "forged_confession"


  recover_sister_evidence:
    actions:
      - sticker:
          id: "rescue_cup"
          image: "medicine_cup_sticker"
          x: 50
          "y": 28
          width: "clamp(170px, 32%, 340px)"
          anchorX: "center"
          anchorY: "center"
          enter: "fadeIn"
      - get: "medicine_cup"
      - say:
          channel: action
          text: "의원이 씻긴 잔의 홈을 가리킨다. 검은 가루가 남아 있다. 그 곁에 지붕에서 주운 패를 올려 둔다. 언니의 손은 아직 차다."
      - clearSticker:
          id: "rescue_cup"
          leave: "fadeOut"
      - get: "forged_token"
      - goto: "forged_confession"

  evidence_token_deduce:
    actions:
      - choice:
          key: evidence_token
          prompt: "실제로 지니고 다닌 패라면 어디가 달라야 할까?"
          camera: wide
          options:
            - text: 매끈하게 막힌 고리와 표면의 붉은 속살
              goto: evidence_token_solved
            - text: 새 패가 더 반짝인다는 사실
              goto: evidence_token_retry
            - text: 두 패에 모두 새겨진 모란꽃
              goto: evidence_token_retry
            - text: 판단을 미루고 돌아간다
              goto: evidence_token_return
          with: []

  evidence_token_detail_0:
    actions:
      - say:
          channel: action
          text: "내 패의 고리로 끈을 통과시킨다. 안쪽은 오래 닳아 매끈하다. 손이 닿지 않는 틈에는 초록 녹이 남았다."
          with: []
          camera: wide
      - set:
          evidence_token_seen_0: true
      - goto: evidence_token_compare

  evidence_token_detail_1:
    actions:
      - say:
          channel: action
          text: "주운 패는 끈이 들어가지 않는다. 고리 안까지 구리가 차 있다. 긁힌 꽃잎 아래로 붉은 속살이 드러난다."
          with: []
          camera: wide
      - set:
          evidence_token_seen_1: true
      - goto: evidence_token_compare
