      - say:
          delivery: calm
          text: "자정이 가까워질 무렵, 진평왕의 장례 행렬이 동문을 빠져나갔습니다. 그 뒤 새 왕을 알리는 북이 세 번 울렸고, 귀족들은 덕만 앞에 고개를 숙였으며 궁문이 열렸습니다."
