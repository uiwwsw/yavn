script:
  - scene: poisoned_procession

scenes:
  poisoned_procession:
    actions:
      - bg: village
      - camera: wide
      - say:
          channel: record
          text: "제8장 — 한 사람을 버리는 법"
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          channel: narration
          text: "구휼 수레가 시장 모퉁이를 돌 때 지붕 기와가 한 장 미끄러졌습니다. 덕만이 고개를 들기도 전에 화살이 천명의 어깨를 꿰었습니다. 달아나는 자의 허리에서 가짜 모란패가 돌바닥에 튕겼습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "이 가짜 모란패를 봐... 내가 죽으면 네가 시킨 화살이 되고, 네가 쫓으면 내가 널 모함한 미끼가 돼. 저들은 우리 중 누가 살아도 자매가 서로를 죽였다고 쓸 준비를 했어."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "독이 퍼집니다. 시장 의원은 남쪽, 명령서를 든 자객은 북쪽 지붕입니다. 한 몸으로 두 길을 갈 수 없습니다. 누구에게 무엇을 맡길지 명령하십시오!"
      - choice:
          key: c8_first_response
          prompt: "독의 시간과 위조 명령의 시간이 동시에 흐른다. 덕만이 직접 붙잡아야 할 것은?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "천명을 업고 시장 의원에게 뛴다"
              add: { cheonmyeong_trust: 2, people_support: 2, evidence: -1 }
              goto: public_treatment
            - text: "비담의 의원에게 숨기고 사망 종을 울린다"
              add: { bidam_trust: 2, insight: 1, fear: 1 }
              goto: false_death
            - text: "천명을 유신에게 맡기고 지붕을 쫓는다"
              add: { evidence: 2, yushin_trust: 2, fear: 1 }
              goto: divided_rescue

  public_treatment:
    actions:
      - bg: village
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          channel: narration
          text: "덕만은 천명을 업고 사람들을 밀치며 달렸습니다. 천명의 피가 덕만의 소매를 적시는 동안 지붕 위 발자국은 빗물에 하나씩 무너졌습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "오늘 시장 사람들은 네가 나를 살렸다고 증언하겠지. 하지만 자객의 발자국은 다 지워졌어... 다음에는 내가 아니라 그 증인들을 겨눌 거야."
      - goto: forged_confession

  divided_rescue:
    actions:
      - bg: frontier
      - say:
          channel: narration
          text: "유신이 천명을 안고 골목으로 사라지는 동안 덕만은 지붕을 건넜습니다. 버려진 초소에는 귀족 금화와 덕만의 글씨를 흉내 낸 명령서가 바닥에 흩어져 있었습니다."
      - say:
          char: 덕만.sad
          text: "명령서는 잡았지만 언니가 눈을 떴을 때 내 손은 없었어. 책임을 나눈다는 건 결국 사랑하는 사람에게 늦을 수도 있다는 뜻이구나."
      - goto: forged_confession

  false_death:
    actions:
      - bg: locked_room
      - char: { id: 비담, position: right }
      - say:
          channel: narration
          text: "비담의 의원이 문을 잠그자 궁에서는 천명의 사망 종이 울렸습니다. 그날 밤 축하주를 주문한 집마다 비담의 전령이 서신을 훔쳐 나왔습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "살아 있는 공주를 죽었다고 쓰는 건 이 왕실의 오래된 기술인가 봅니다. 이번에는 적의 축하 편지를 부르는 데 제법 쓸모가 있군요."
      - say:
          char: 덕만.angry
          text: "그 기록으로 살아난 내가 같은 수를 썼다고 웃지 마. 지금은 편지보다 해독약이 먼저야. 네 의원이 얼마나 걸리지?"
      - goto: bad_poison_clock

  bad_poison_clock:
    actions:
      - bg: locked_room
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - camera: { shot: close, target: 천명 }
      - say:
          channel: narration
          text: "덕만이 가짜 사망 종으로 범인을 낚는 동안, 비담의 밀실은 천명을 시장 의원에게서 너무 멀리 숨겼습니다. 의원에게 닿았을 때는 해독약을 삼킬 숨이 남지 않았습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "편지를 다 잡아도... 내가 죽으면 네가 나를 살리려 했다는 말을 누가 해 주지? 또 살아남은 사람의 기록만 진실이 되잖아."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니, 눈 떠. 잡은 편지도 사망 종도 다 버릴게. 너무 늦게 배웠지만 이번에는 기록보다 사람을 먼저 고를게."
      - say:
          channel: record
          text: "천명 공주 독살 사건 — 현장에서 사라진 덕만 공주가 배후로 지목됨. 덕만은 체포 이틀 뒤 반역죄로 처형됨."
      - gameOver:
          title: "운명 — 독보다 늦은 진실"
          message: "거짓 죽음으로 범인을 끌어내려다 진짜 치료 시간을 잃었습니다. 천명이 죽자 준비된 자백문이 사실이 되었고 덕만도 뒤따라 죽었습니다."

  forged_confession:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "이튿날 조회상에 자백문이 펼쳐졌습니다. 천명이 쓰러지기 전부터 말라 있던 먹, 이미 죽은 군관의 서명. 어린 덕만의 사망 기록과 같은 냄새가 났습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "어머니가 지금 걸어 나오면 위조문은 찢기지만 계승 군대가 둘로 갈립니다. 계속 죽어 계시면 그 거짓말이 공주님 목을 조르고요."
      - choice:
          key: c8_public_story
          prompt: "문밖에는 살아 있는 천명, 상 위에는 이미 마른 자백문. 누구의 시간을 먼저 세상에 돌려줄까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "천명의 손을 잡고 회의장에 들어간다"
              when: { var: sisters_public, op: eq, value: true }
              add: { nobles_support: 1, people_support: 2, cheonmyeong_trust: 1 }
              goto: sister_testimony
            - text: "문은 닫고 위조된 획만 공개한다"
              add: { evidence: 2, chunchu_trust: 1 }
              goto: evidence_only
            - text: "장례 종을 계속 울려 배후를 낚는다"
              add: { evidence: 2, fear: 2, cheonmyeong_trust: -1 }
              goto: keep_death_story

  sister_testimony:
    actions:
      - bg: throne_hall
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "저를 죽이려 한 사람은 덕만이 아닙니다. 그렇다고 이 상처를 덕만의 무죄 도장이나 왕위 표로 쓰지 마십시오. 저는 살아서 말하러 왔지, 증거물이 되러 온 것이 아닙니다."
      - say:
          channel: narration
          text: "천명이 살아 걸어오자 자백문은 찢겼습니다. 그러나 질문은 곧 바뀌었습니다. '천명 공주도 덕만을 왕으로 인정합니까?' 모두가 같은 답만 기다렸습니다."
      - goto: sister_decision

  evidence_only:
    actions:
      - say:
          channel: narration
          text: "덕만은 틀린 획과 죽은 군관의 날짜를 하나씩 읽었습니다. 종이는 거짓으로 판명됐지만 닫힌 문 뒤 천명의 침묵에는 저마다 원하는 생사가 붙었습니다."
      - goto: sister_decision

  keep_death_story:
    actions:
      - say:
          channel: narration
          text: "빈 관에 비단이 덮이는 동안 축하 서신 다섯 통이 잡혔습니다. 벽 하나 너머에서 천명은 자기 장례를 준비하는 못질을 끝까지 들었습니다."
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "원하던 편지는 얻었어. 그런데 사람들이 내 이름을 부르며 우는 동안 나는 살아 있다고 대답도 못 했어. 이 문 뒤에서 오래 살면, 누가 먼저 ‘천명’이 아니게 될까?"
      - goto: sister_decision

  sister_decision:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 천명.sad
          text: "궁에 남으면 평생 네 반대편 의자에 앉히고, 떠나면 네가 언니를 버렸다고 쓰겠지. 어느 기록이 생겨도 이번 길은 내가 고를래. 겨우 되찾은 내 목숨이니까."
      - choice:
          key: c8_cheonmyeong_fate
          prompt: "서로를 살린다는 이름으로 붙잡아 온 두 손. 덕만은 천명이 고른 길에서 손을 놓을 수 있을까?"
          char: 덕만
          camera: close
          with: [천명]
          options:
            - text: "국경 구휼소의 열쇠를 천명에게 준다"
              set: { cheonmyeong_outcome: exile }
              add: { cheonmyeong_trust: 2, people_support: 1, nobles_support: -1 }
              goto: living_exile
            - text: "비밀방 문을 열고 궁 안에 숨긴다"
              set: { cheonmyeong_outcome: hidden_alive }
              add: { evidence: 1, fear: 2, chunchu_trust: -1 }
              goto: hidden_alive
            - text: "자백문에 덕만의 진짜 서명을 한다"
              goto: bad_self_sacrifice

  living_exile:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "천명은 왕실 비녀를 탁자에 두고 구휼소 열쇠를 목에 걸었습니다. 성문 밖에서는 추방이라 수군댔지만 마차의 행선지는 천명이 직접 적었습니다."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "사람들은 네가 날 버렸다고 쓰겠지. 그 문장 때문에 화나면 편지해. 나도 네 선택이 미웠다고 답할게. 서로 다른 말을 해도 자매라는 걸 이제는 알잖아."
      - goto: abandoned_end

  hidden_alive:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "밤이면 비밀문이 열리고 천명이 촛불 아래로 나왔습니다. 덕만은 언니의 조언을 들었지만, 해가 뜨면 천명은 발소리조차 숨겨야 했습니다."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "네 곁에 숨으면 싸움이 끝난 줄 알았어. 그런데 이제 나는 네가 문을 열어 줄 때만 천명이 되고, 닫으면 다시 죽은 사람이 되는구나."
      - goto: abandoned_end

  abandoned_end:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: sad }
      - say:
          channel: narration
          text: "마차가 성문을 나가거나 비밀문이 닫힌 뒤, 덕만의 곁에는 천명이 쓰던 찻잔 하나만 남았습니다. 덕만은 손을 뻗었다가 끝내 잔을 치우지 못했습니다."
      - say:
          char: 덕만.sad
          text: "언니를 버린 게 아니야. 언니를 살린다는 말로 내 곁에 묶어 두고 싶었던 나를 놓은 거야. 이제 언니가 고른 길을 지킬 차례야."
      - say:
          channel: record
          text: "그날 밤 천명의 빈 의자에 세 가문의 표식이 번갈아 놓였습니다. 곧이어 진평왕의 처소에서 다급한 종이 울렸고, 귀족 회의는 새벽에 왕을 고르겠다는 문서를 문틈으로 밀어 넣었습니다."
      - goto: /8.yaml

  bad_self_sacrifice:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: sad }
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          char: 덕만.sad
          text: "언니는 살아야 해. 내가 자백문이 사실이라고 말하면 모두 끝나."
      - say:
          char: 천명.sad
          text: "네가 죽으면 내가 살아서 네 죄를 증명하는 사람이 돼. 그것은 나를 구하는 일이 아니야."
      - say:
          channel: narration
          text: "덕만의 자백은 위조문을 진실로 만들었습니다. 천명은 풀려났지만 동생을 죽이고 얻은 왕위라는 소문에서 평생 벗어나지 못했습니다."
      - say:
          channel: record
          text: "반역 재판 기록 — 덕만 공주, 언니 천명 암살 모의 자백 후 처형. 왕위 계승 분쟁 종결."
      - gameOver:
          title: "운명 — 대신 죽는다는 폭력"
          message: "자기희생은 천명에게 선택권을 돌려주지 않았습니다. 덕만은 언니를 살린다는 명분으로 언니에게 가장 무거운 삶을 강요했습니다."
