          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니부터 살리겠다고."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "그 약속, 이제 내가 갚을 차례야."
      - say:
