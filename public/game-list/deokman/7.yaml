script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: focus
      - char:
          id: 덕만
          position: center
      - say:
          text: "최종장 — 왕관에는 주인이 없다"
      - effect: alarm
      - say:
          with:
            - 덕만
          delivery: calm
          text: "진평왕이 숨을 거둔 이튿날 · 해 질 무렵. 왕의 상여가 동문 아래에서 멈췄습니다. 문밖 군사 사백 명은 진운을 왕으로 세우기 전에는 장례 행렬을 한 걸음도 보내지 않겠다고 외쳤습니다. 상여의 붉은 매듭 하나가 잘려 회의장 바닥으로 날아들었습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.angry
          camera: medium
          text: "장례 행렬이 동문에 막혔습니다. 반란군이 상여를 보내려면 진운공을 왕으로 세우라고 요구합니다."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 유신
          text: "아버지 장례까지 거래에 쓰는군요. 진운공은 어디 있습니까?"
      - say:
          char: 유신
          camera: medium
          text: "회의장 안에 있습니다. 아직 누구 편에도 서지 않았습니다."
      - char:
          id: 칠숙
          position: right
      - char:
          id: 진운
          position: left
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진운
          text: "진운공께서 저 빈 자리에 앉으시면 동문은 바로 열립니다. 왕의 장례를 치르게 하는 것이 첫 명령이라면 누가 반대하겠습니까?"
      - say:
          char: 진운
          camera: medium
          with:
            - 칠숙
          text: "제 이름으로 문을 막았으니, 제가 앉으면 듣겠지요. 하지만 그렇다고 저 자리가 제 것이 되진 않습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "양보하겠다는 말도 아니군요."
      - say:
          char: 진운
          camera: close
          with:
            - 덕만
          text: "예. 공주께 빚져 물러나지도, 칠숙에게 밀려 앉지도 않겠습니다. 회의에서 제 답을 제 입으로 정하겠습니다."
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 소원
          text: "소원은 사람 이름이 빼곡한 천 조각들을 두 팔로 안고 들어왔습니다. 궁 나인, 국경의 피란민, 전사자의 가족이 각자 본 덕만의 선택을 한 줄씩 적은 것이었습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "사람들은 문밖에 막혔어요. 그래서 이름이라도 들여보내 달래요. 좋은 말만 있진 않아요. 공주님께 화난 사람도 썼어요."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "제 이름은 맨 아래 있어요. 급히 쓰느라 ‘원’ 자가 조금 뚱뚱합니다. 웃지 마세요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "안 웃었어. 내 이름도 옆에 똑같이 뚱뚱하게 써 줘."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 소원
          text: "좋아. 칭찬만 들고 들어가면 칠숙과 다를 게 없어. 저 이름들이 말할 자리를 먼저 만들자."
      - say:
          char: 덕만.angry
          camera: wide
          text: "좋습니다. 회의를 열죠. 제가 왕이란 말은 나중입니다. 오늘 성문을 열고 아버지를 보내 드릴 사람이 누군지부터 묻겠습니다."
          wait: 800
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "어느 문부터 열까요. 명만 내리시면 제가 길을 만들겠습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "아버지 상여가 문밖에 있습니다. 왕좌부터 고르진 않겠어요. 먼저 저 문을 열 사람이 누군지 정하죠."
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "회의 전, 첫 수는?"
          char: 덕만
          camera: close
          with:
            - 유신
          options:
            - text: "진운과 함께 들어간다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "성문을 잠근다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "증인을 풀어 준다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "귀족을 처형한다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          text: "제가 공주와 함께 들어가면 저를 따르던 가문 절반이 돌아설 겁니다. 어머니를 구해 주신 빚 때문에 이러는 거라고 할 테고요."
      - say:
          char: 덕만
          camera: medium
          text: "그 빚 때문에 같이 서 달라는 게 아닙니다. 그대가 정말 내가 왕이 되는 편이 낫다고 생각할 때만 들어오세요."
      - say:
          char: 진운.nervous
          camera: medium
          text: "솔직히 아직 확신하지 못했습니다. 다만 칠숙이 제 이름으로 군사를 움직이는 나라는 원하지 않습니다."
      - say:
          char: 덕만
          camera: medium
          text: "그 정도면 됩니다. 회의 안에서 생각이 바뀌면 그때 말하세요. 내 편인 척할 필요는 없습니다."
      - say:
          char: 진운
          camera: close
          text: "그럼 함께 들어가겠습니다. 오늘은 제 말이 바뀌어도 제 입으로 바꾸겠습니다."
      - goto: proof_choice

  opening_gates:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.angry
          camera: medium
          text: "동문과 북문을 닫았습니다. 반란군은 성 밖 사백입니다. 두 시간쯤 뒤에는 문을 공격할 겁니다."
      - say:
          char: 덕만
          camera: medium
          text: "우리 군사는요?"
      - say:
          char: 유신.angry
          camera: medium
          text: "삼백십입니다. 먼저 치면 이길 수는 있습니다. 하지만 장례 행렬이 가운데 있습니다."
      - say:
          char: 덕만
          camera: close
          text: "먼저 치지 마세요. 두 시간 안에 표결을 끝내겠습니다. 공격이 시작되면 아버지 상여부터 지켜 주세요."
      - goto: proof_choice

  opening_witnesses:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          text: "증인들이 문밖에 와 있어요. 독 묻은 행주를 본 나인도 있고, 국경에서 배급받은 사람들도 왔어요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "군사들이 막지 않았어?"
      - say:
          char: 소원.nervous
          camera: medium
          text: "막았죠. 그래서 각자 자기 이름이랑 할 말을 천 조각에 써서 묶었어요. 사람은 못 들어가도 이름은 들여보내겠다고요."
      - say:
          char: 덕만.sad
          camera: close
          text: "다 들어오게 해. 오늘은 대신들만 말하는 회의로 끝내지 않겠어."
      - say:
          char: 소원
          camera: medium
          text: "그 말 기다렸어요. 제가 문을 열게요."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          delivery: calm
          text: "해가 지고 첫 횃불이 켜졌습니다. 상여는 여전히 동문 아래에 멈춰 있었고, 귀족들은 그 불이 다 타기 전에 왕을 정하자며 문을 걸어 잠갔습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          text: "<speed=22>공주가 왕이 되면, 아들들은 누이도 자기 자리를 가질 수 있단 걸 배우겠지요.</speed> <speed=19>전 그게 두렵습니다.</speed>"
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "전에 여자가 왕이 된 적 없다는 말은 들었습니다. 그래서 묻죠. 법 어디에 안 된다고 적혀 있습니까?"
      - say:
          char: 칠숙.smile
          camera: medium
          text: "적혀 있지 않아도 저는 안 된다고 믿습니다. 공주께서 무슨 증거를 내셔도 그 생각은 바꾸지 않겠습니다."
      - say:
          char: 덕만
          camera: close
          text: "<speed=20>이제 알겠군요. 그대는 싫다는 마음을 법처럼 말하고 있어요.</speed> <speed=21>결정은 여기 있는 사람들에게 맡기겠습니다.</speed>"
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "결국 공주의 사람을 세워 공주가 옳다고 말하게 하시겠습니까? 충성은 증언이 아니라 되풀이일 뿐입니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "아니요. 저 때문에 다친 일부터 말하게 하겠습니다. 왕이 될 사람이라면 칭찬보다 피해자의 기억을 오래 견뎌야 하니까요."
      - choice:
          key: final_proof
          prompt: "무엇으로 왕임을 증명할까?"
          char: 덕만
          camera: close
          with:
            - 칠숙
          options:
            - text: "사람을 세운다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "세 증거를 잇는다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "군사를 보인다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "유언을 꾸민다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - char:
          id: 소원
          position: left
      - say:
          char: 소원.nervous
          camera: medium
          text: "전 궁에서 행주를 빨던 나인이에요. 공주님이 제 이름을 미끼로 써서 크게 싸웠죠. 그래도 제 앞에서 잘못했다고 했어요."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "사적인 사과가 왕의 자격을 증명합니까?"
      - say:
          char: 소원.angry
          camera: close
          text: "적어도 잘못하고도 모르는 척한 분들보다는 낫습니다. 저는 높은 분이 자기 잘못을 제 이름 앞에 놓는 걸 처음 봤습니다."
      - say:
          char: 덕만
          camera: medium
          text: "제가 늘 옳았다는 말이 아닙니다. 제 명령으로 다친 사람 이름을 듣고, 틀리면 잘못했다고 말하는 왕이 되겠습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "좋은 뜻은 누구나 말할 수 있습니다."
      - say:
          char: 덕만
          camera: close
          text: "그래서 말만 가져오지 않았습니다. 제 선택을 직접 겪은 사람들이 여기 있습니다. 한 사람씩 들으십시오."
          wait: 700
      - goto: crown_assessment

  proof_evidence:
    actions:
      - char:
          id: 아진
          position: left
      - say:
          char: 덕만
          camera: medium
          text: "검은 가루로 왕을 죽이고 제 죄로 만들려 했습니다. 혼인으로 절 치우려 했고, 마지막엔 왕의 도장까지 훔쳤습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "물건 세 개를 한자리에 놓는다고 같은 사건이 되지는 않습니다. 누가 그것을 이었다고 증언합니까?"
      - say:
          char: 아진.nervous
          camera: medium
          text: "제가 말하겠습니다. 왕의 잔, 공주 방의 시체, 훔친 도장. 세 명령을 내린 자가 모두 같은 붉은 매듭을 줬습니다."
      - say:
          char: 칠숙.angry
          camera: close
          text: "살인자가 목숨을 구하려 거짓말하는 것입니다."
      - say:
          char: 아진.angry
          camera: close
          text: "맞습니다. 전 살인자입니다. 제가 한 일은 압니다. 공주는 제 죄를 숨긴 적이 없습니다. 지금도 다 말하라 했습니다."
      - say:
          char: 덕만
          camera: medium
          text: "모두 제 이름을 지우려고 벌인 일입니다. 끝에는 쓰러진 왕의 명령까지 훔쳤습니다. 나라를 훔친 겁니다."
          wait: 700
      - goto: crown_assessment

  proof_army:
    actions:
      - char:
          id: 유신
          position: left
      - say:
          char: 유신.sad
          camera: medium
          text: "국경 군사는 공주라서 따른 게 아닙니다. 사흘치 곡식을 나눴고, 죽은 병사 이름을 가족 앞에서 읽었기에 따랐습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "유신공의 군사가 이미 궁문을 장악했습니다. 칼을 든 자의 증언을 자유로운 의견이라 할 수 있습니까?"
      - say:
          char: 유신
          camera: medium
          text: "제 군사는 회의장 밖에 있습니다. 귀족들이 원하면 저는 지금 칼을 내려놓겠습니다."
      - say:
          char: 덕만
          camera: medium
          text: "아니요. 칼은 성문을 지켜야 합니다. 대신 이 방엔 들이지 마세요. 투표가 끝날 때까지 누구도 칼로 답하지 않습니다."
      - say:
          char: 유신
          camera: close
          text: "명령 받들겠습니다. 그 명령을 받아 마흔일곱을 잃은 장수로서, 남은 군사의 이름을 걸고 덕만공주를 지지합니다."
          wait: 650
      - goto: crown_assessment

  crown_assessment:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 7
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 2
                  - var: army_support
                    op: gte
                    value: 2
                  - var: rival_trust
                    op: gte
                    value: 2
              goto: crown_balanced
            - when:
                var: power
                op: gte
                value: 6
              goto: crown_force
            - when:
                var: people_support
                op: gte
                value: 5
              goto: crown_people_ready
          default: crown_fragile

  crown_balanced:
    actions:
      - say:
          text: "증언이 끝나자 회의장은 조용해졌습니다. 성문을 지키는 군사, 문밖의 백성, 진운의 지지, 세 가지 증거가 모두 덕만의 말을 뒷받침하고 있었습니다."
      - goto: crown_choice

  crown_force:
    actions:
      - say:
          text: "성문과 군사는 덕만의 명령을 따르고 있었습니다. 그러나 회의장 안에서는 군사가 물러난 뒤에도 덕만을 지지할 이유가 부족하다는 목소리가 나왔습니다."
      - goto: crown_choice

  crown_people_ready:
    actions:
      - say:
          text: "문밖의 사람들은 덕만의 이름을 외쳤습니다. 하지만 귀족들은 백성의 지지만으로 성밖 반란군과 귀족 가문을 막을 수 있겠느냐고 물었습니다."
      - goto: crown_choice

  crown_fragile:
    actions:
      - say:
          text: "덕만에게는 사람도 증거도 군사도 있었지만 어느 하나도 충분하지 않았습니다. 귀족들은 마지막으로 어떤 힘으로 왕이 되려는지 답하라고 요구했습니다."
      - goto: crown_choice

  crown_choice:
    actions:
      - effect: crown
      - say:
          delivery: calm
          text: "회의가 시작된 지 두 시간. 첫 횃불이 절반으로 줄었지만 동문의 함성은 잦아들지 않았습니다. 그때 유신이 회의장 안으로 들어왔습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          text: "결국 무엇으로 왕이 되시겠다는 겁니까? 귀족의 표입니까, 문밖의 백성입니까, 성문의 군사입니까, 진운공의 양보입니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "그중 하나만 고르면 나머지를 잃겠지요. 하지만 지금 이 회의는 마지막 답을 하나로 말하라고 요구하고 있습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          text: "왕은 한 명뿐입니다. 하나를 고르십시오."
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 덕만
          text: "우리 표를 받으면 오늘 왕이 됩니다. 대신 혼인과 장군을 정할 때 우리 허락을 받는다고 쓰십시오."
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "문을 열면 사람들이 공주님 이름을 외칠 거예요. 성밖 군사도 활을 들겠죠. 그러면 맨 앞에 선 사람이 먼저 다칠 거예요."
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 유신
          text: "유신은 허리의 칼을 풀어 왕좌 앞에 내려놓았습니다. 칼집 끝에는 동문에서 묻은 피가 아직 마르지 않았습니다."
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "명하시면 군사로 끝낼 수 있습니다. 가장 빠릅니다. 하지만 왕의 첫 명령이 같은 신라 사람을 베라는 말로 남습니다."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "저와 함께 서면 제 군사는 물러납니다. 대신 또 공주 이름을 제 뒤에 쓰겠지요. 볼 때마다 고치겠습니다. 그 약속은 합니다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "다들 소중한 걸 내놓고 있어. 소원은 이름을, 유신공은 칼을, 진운공은 자리를. 왕은 그걸 빼앗는 사람이 아니어야 해."
      - choice:
          key: final_crown
          prompt: "왕좌를 어떻게 요구할까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "귀족의 표를 받는다"
              set:
                final_strategy: "law"
              add:
                legitimacy: 1
              goto: verdict
            - text: "백성의 함성으로 민다"
              set:
                final_strategy: "people"
              add:
                people_support: 1
              goto: verdict
            - text: "군사로 밀어붙인다"
              set:
                final_strategy: "army"
              add:
                power: 2
                suspicion: 2
              goto: verdict
            - text: "진운과 함께 선다"
              set:
                final_strategy: "alliance"
              add:
                rival_trust: 1
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 8
                  - var: power
                    op: gte
                    value: 4
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: rival_trust
                    op: gte
                    value: 2
                  - var: clue_black_powder
                    op: eq
                    value: true
                  - var: clue_marriage_pact
                    op: eq
                    value: true
                  - var: clue_oath_fragment
                    op: eq
                    value: true
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: suspicion
                    op: gte
                    value: 6
              goto: ending_tyrant
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: nobles_support
                    op: gte
                    value: 2
              goto: ending_permitted
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 4
                  - var: legitimacy
                    op: lt
                    value: 7
              goto: ending_queen_consort
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 3
              goto: ending_abdicated
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "people"
                  - var: people_support
                    op: gte
                    value: 5
              goto: ending_people
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: false
                  - var: sowon_trust
                    op: lte
                    value: 1
              goto: ending_lonely
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: power
                    op: lt
                    value: 4
              goto: ending_one_step
            - when:
                all:
                  - var: bidam_trust
                    op: gte
                    value: 4
                  - var: power
                    op: lt
                    value: 4
              goto: ending_vanished
          default: ending_broken

  ending_true:
    actions:
      - bg: title_palace
      - camera: wide
      - effect: crown
      - say:
          text: "귀족의 표가 하나씩 덕만에게 모였습니다. 문밖의 증인들은 돌아가지 않았고, 성문의 군사들은 칼을 뽑지 않은 채 반란군의 길을 막았습니다."
      - char:
