  crown_choice:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "한밤중, 월성 위로 별 하나가 떨어졌습니다."
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "비담이 명활성에서 군사를 일으켰습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "이유는?"
      - say:
          char: 유신.angry
          camera: close
          with:
            - 덕만
          text: "여왕은 나라를 못 다스린다 합니다."
      - bg: fortress
      - camera: wide
      - char:
          id: 비담
          position: center
      - say:
          with: [비담]
          text: "같은 시각, 명활성. 비담은 왕궁 쪽에 오른 불빛을 바라봤습니다."
      - say:
          char: 비담.sad
          camera: close
          with: []
          delivery: whisper
          text: "전하께선 늘 나라를 먼저 고르셨지요."
      - say:
          char: 비담.sad
          camera: close
          with: []
          delivery: whisper
          text: "<speed=18>이번에는 제가 먼저 골랐습니다.</speed>"
      - branch:
          cases:
            - when:
                var: bidam_trust
                op: gte
                value: 4
              goto: bidam_warning_remembered
          default: bidam_silence_remembered

  bidam_warning_remembered:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "북이 울리기 전, 소원이 붉은 매듭 하나를 가져왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "비담님이 보낸 마지막 암호예요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "반란을 알리고 반란을 일으켰군."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "전하께 도망칠 시간을 준 겁니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "끝까지 늦게 말하는 사람이네."
