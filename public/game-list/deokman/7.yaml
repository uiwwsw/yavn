script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - effect: focus
      - char:
          id: 덕만
          position: center
          framing: full
      - say:
          text: "최종장 — 왕관에는 주인이 없다"
      - say:
          text: "진평왕의 상여가 궁문턱을 넘기도 전에 화백회의가 열렸다. 성문 밖 계승동맹의 군사들은 갑옷 위에 상복을 걸쳤다. 애도와 반란이 같은 흰옷을 입었다."
      - say:
          char: 덕만.angry
          framing: full
          text: "나를 왕으로 세워 달라 청하지 않겠습니다. 대신 대답하십시오. 나를 지운 뒤에도, 오늘 밤 신라를 지킬 수 있습니까?"
          wait: 800
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "회의 전, 첫 수는?"
          char: 덕만
          framing: closeup
          options:
            - text: "진운과 함께 들어간다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "성문을 잠근다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "증인을 풀어 준다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "귀족을 처형한다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운
          framing: bust
          text: "제가 공주를 지지하는 순간, 저를 따르던 가문의 표는 절반이 사라집니다. 그래도 빌린 원고가 아니라 제 입으로 말해야 합니까?"
      - say:
          char: 덕만
          framing: bust
          text: "표는 다시 셀 수 있습니다. 하지만 남의 문장으로 산 하루는 돌려놓지 못해요. 오늘은 그대가 처음부터 끝까지 고른 말을 들려주세요."
      - goto: proof_choice

  opening_gates:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "동문과 북문을 닫았습니다. 봉화대 셋은 우리 편, 반란군은 성 밖 사백. 한 시진 안에 표결이 끝나지 않으면 다음 보고는 사망자 수로 드리겠습니다."
      - goto: proof_choice

  opening_witnesses:
    actions:
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: bust
          text: "독 묻은 행주를 찾은 나인도, 국경에서 곡식을 받은 어머니도 왔어요. 제 옷자락처럼 이름표를 서로 꿰맸어요. 하나를 뜯어 가면 아흔아홉이 그 이름을 읽을 거예요."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: council_hall
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주의 용기와 효심은 의심하지 않습니다. 다만 신라의 법 어디에도 여인을 왕이라 쓴 적은 없지요. 마음이 법보다 앞설 수는 없는 일 아닙니까?"
      - choice:
          key: final_proof
          prompt: "무엇으로 왕임을 증명할까?"
          char: 덕만
          framing: closeup
          with:
            - 칠숙
          options:
            - text: "사람을 세운다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "세 증거를 잇는다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "군사를 보인다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "유언을 꾸민다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - say:
          char: 덕만
          framing: bust
          text: "전례가 없다는 말 한 줄로 오늘 굶는 사람의 그릇을 채울 수 있습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "여기 선 사람들은 내가 여자라서 살아난 것도, 남자라서 죽을 뻔한 것도 아닙니다. 필요한 때 필요한 결정을 내린 사람이 있었기에 살았습니다. 왕에게 그보다 먼저 물을 자격이 있습니까?"
          wait: 700
      - goto: crown_assessment

  proof_evidence:
    actions:
      - say:
          char: 덕만
          framing: bust
          text: "잔에는 독을 묻혔고, 제 이름에는 혼인을 묶었으며, 아버지의 침묵에는 훔친 인장을 찍었습니다."
      - say:
          char: 덕만
          framing: bust
          text: "따로 일어난 세 사건이 아닙니다. 제 이름을 지우려다 왕의 이름까지 훔친 하나의 긴 반역입니다. 같은 손과 같은 인장이 여기 있습니다."
          wait: 700
      - goto: crown_assessment

  proof_army:
    actions:
      - say:
          char: 유신.sad
          framing: bust
          text: "국경의 군사는 공주의 관을 보고 따르지 않았습니다. 사흘치 곡식을 같은 줄에서 나누고, 전사자 마흔일곱 이름을 먼저 읽은 지휘관의 명령을 따랐습니다."
      - say:
          char: 유신
          framing: bust
          text: "그 명령을 받아 마흔일곱을 잃은 장수로서, 제 목과 남은 군사의 이름을 걸고 증언합니다."
          wait: 650
      - goto: crown_assessment

  crown_assessment:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 7
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 2
                  - var: army_support
                    op: gte
                    value: 2
                  - var: rival_trust
                    op: gte
                    value: 2
              goto: crown_balanced
            - when:
                var: power
                op: gte
                value: 6
              goto: crown_force
            - when:
                var: people_support
                op: gte
                value: 5
              goto: crown_people_ready
          default: crown_fragile

  crown_balanced:
    actions:
      - say:
          text: "회의장 안의 명분, 성문 위의 군사, 문밖의 증인, 진운이 처음으로 스스로 고른 문장까지 한곳을 향했다. 누구도 먼저 무릎 꿇지는 않았지만, 누구도 덕만을 보지 않은 척할 수 없었다."
      - goto: crown_choice

  crown_force:
    actions:
      - say:
          text: "성문과 군사는 덕만의 손에 있었다. 그러나 칼집에 칼을 넣은 뒤에도 사람들이 남을 이유는 부족했다. 힘으로 연 문은 더 큰 힘이 올 때마다 다시 닫힐 것이다."
      - goto: crown_choice

  crown_people_ready:
    actions:
      - say:
          text: "궁 밖에서는 이미 덕만을 왕이라 불렀다. 하지만 그 목소리는 회의장 두꺼운 문과 성 밖 반란군의 갑옷을 아직 뚫지 못했다."
      - goto: crown_choice

  crown_fragile:
    actions:
      - say:
          text: "덕만은 사람도, 증거도, 군사도 조금씩 얻었다. 그러나 서로를 믿지 않는 힘은 합쳐지지 않았다. 이제 하나를 앞세우면 나머지는 그 그림자에 가려질 것이다."
      - goto: crown_choice

  crown_choice:
    actions:
      - effect: crown
      - say:
          char: 칠숙.smile
          framing: bust
          text: "대체 무엇을 왕관이라 부르십니까? 화백의 허락, 문밖의 함성, 성문의 칼, 진운공의 양보. 그중 하나라도 거두면 남는 것이 있습니까?"
      - choice:
          key: final_crown
          prompt: "왕좌를 어떻게 요구할까?"
          char: 덕만
          framing: closeup
          options:
            - text: "화백의 표를 받는다"
              set:
                final_strategy: "law"
              add:
                legitimacy: 1
              goto: verdict
            - text: "백성의 함성으로 민다"
              set:
                final_strategy: "people"
              add:
                people_support: 1
              goto: verdict
            - text: "군권으로 밀어붙인다"
              set:
                final_strategy: "army"
              add:
                power: 2
                suspicion: 2
              goto: verdict
            - text: "진운과 함께 선다"
              set:
                final_strategy: "alliance"
              add:
                rival_trust: 1
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 8
                  - var: power
                    op: gte
                    value: 4
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: rival_trust
                    op: gte
                    value: 2
                  - var: clue_black_powder
                    op: eq
                    value: true
                  - var: clue_marriage_pact
                    op: eq
                    value: true
                  - var: clue_oath_fragment
                    op: eq
                    value: true
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: suspicion
                    op: gte
                    value: 6
              goto: ending_tyrant
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: nobles_support
                    op: gte
                    value: 2
              goto: ending_permitted
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 4
                  - var: legitimacy
                    op: lt
                    value: 7
              goto: ending_queen_consort
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 3
              goto: ending_abdicated
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "people"
                  - var: people_support
                    op: gte
                    value: 5
              goto: ending_people
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: false
                  - var: sowon_trust
                    op: lte
                    value: 1
              goto: ending_lonely
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: power
                    op: lt
                    value: 4
              goto: ending_one_step
            - when:
                all:
                  - var: bidam_trust
                    op: gte
                    value: 4
                  - var: power
                    op: lt
                    value: 4
              goto: ending_vanished
          default: ending_broken

  ending_true:
    actions:
      - bg: title_palace
      - effect: crown
      - say:
          text: "살려 둔 사람들은 빌린 이름이 아니라 자기 이름으로 증언했다. 함께 굶은 군사는 성문을 지켰다. 감추지 않은 세 증거가 하나의 반역을 완성했고, 진운은 처음으로 원고 없이 덕만의 이름을 말했다."
      - say:
          char: 칠숙.angry
          framing: bust
          text: "전하의 유언도, 남자 후계자의 양보도 없습니다. 대체 누구의 명으로 왕좌를 요구하시는 겁니까?"
      - say:
          char: 덕만
          framing: bust
          text: "누구의 명도 아닙니다. 그대들이 끝내 지우지 못한 내 이름과, 내가 끝내 이름을 버리지 않은 사람들이 나를 여기 세웠습니다."
          wait: 1000
      - say:
          delivery: calm
          text: "첫 번째 북에 성문의 창끝이 내려갔다. 두 번째 북에 화백의 시선이 내려갔다. 세 번째 북이 울리자, 문밖의 이름들이 한 사람의 이름으로 모였다. 덕만."
      - effect: crown
      - say:
          char: 소원
          framing: closeup
          delivery: shout
          text: "길을 여세요! 신라의 새 여왕, 덕만 폐하께서 드십니다!"
      - say:
          char: 덕만
          framing: bust
          delivery: deduction
          text: "<speed=18>여왕이 아니다.</speed> <speed=42>신라의 왕이다.</speed>"
          wait: 1200
      - ending: true_end

  ending_tyrant:
    actions:
      - say:
          text: "군사가 회의장을 포위하자 표결은 한 번에 끝났다. 반대한 사람은 그날 밤 이름째 사라졌다. 덕만은 가장 빨리 왕이 되었고, 다음 날부터 모든 문을 더 많은 칼로 지켜야 했다."
      - ending: first_tyrant
  ending_permitted:
    actions:
      - say:
          text: "화백은 덕만을 왕이라 부르는 대신 왕명마다 대신들의 도장을 요구했다. 옥좌는 높았지만, 덕만의 손이 닿는 곳마다 이미 다른 손이 놓여 있었다."
      - ending: permitted_queen
  ending_queen_consort:
    actions:
      - say:
          text: "진운은 끝내 물러나지 못했다. 두 사람의 공동 선언은 혼인 서약으로 고쳐졌다. 신라는 왕 하나와 현명한 왕비를 얻었고, 덕만이 직접 쓴 문장은 진운의 이름 아래 보관되었다."
      - ending: queen_consort
  ending_abdicated:
    actions:
      - say:
          text: "진운이 물러나면 그의 군사가 움직이고, 덕만이 나아가면 왕경이 갈라질 판이었다. 덕만은 왕관을 내려놓아 내전을 멈췄다. 그날 나라를 다스린 결정은 왕이 되지 않겠다는 결정이었다."
      - ending: abdicated_crown
  ending_people:
    actions:
      - say:
          text: "화백은 끝내 문을 열지 않았다. 덕만은 문밖의 사람들과 함께 왕경을 떠났다. 국경의 마을들은 인장 없는 명령을 따랐고, 그녀는 왕관보다 먼저 통치를 얻었다."
      - ending: peoples_princess
  ending_lonely:
    actions:
      - say:
          delivery: sad
          text: "덕만은 왕좌에 올랐다. 첫 조회에서 무심코 오른편을 보았지만 언니의 붉은 옷도, 문밖에서 이름을 불러 줄 친구도 없었다. 넓어진 궁은 대답하지 않았다."
      - ending: lonely_throne
  ending_one_step:
    actions:
      - say:
          text: "표결은 덕만을 택했다. 그러나 성문을 지킬 군사는 오지 않았다. 즉위의 두 번째 북이 울릴 때, 칠숙의 마지막 궁수가 시위를 놓았다. 세 번째 북은 끝내 울리지 못했다."
      - ending: one_step_queen
  ending_vanished:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.sad
          framing: closeup
          delivery: whisper
          text: "동쪽 바다는 아직 누구에게도 신하의 예를 올리지 않았습니다. 저와 가시면 살아남을 수 있습니다. 다만…… 우리 이름을 적어 줄 사람은 데려가지 못하겠군요."
      - say:
          text: "덕만은 비담과 동쪽 바다를 건넜다. 행복했는지, 후회했는지, 서로의 이름을 얼마나 오래 불렀는지는 누구도 기록하지 않았다."
      - ending: vanished_princess
  ending_broken:
    actions:
      - say:
          text: "덕만도 진운도 물러나지 않았고, 어느 쪽도 나라 전체를 설득하지 못했다. 같은 모양의 왕관이 두 군기 위에 걸렸다. 신라 사람들은 누구의 백성인지 정하기 위해 서로에게 칼을 들었다."
      - ending: broken_alliance

  go_34_empty_council:
    actions:
      - gameOver:
          title: "운명 34 — 빈 회의의 승자"
          message: "반대할 귀족이 사라진 회의에서 덕만은 만장일치로 승리했다. 그러나 밖에 남은 가문들이 동시에 군사를 일으켰다. 아무도 없는 방의 승자는 나라를 얻지 못했다."
  go_35_fathers_lie:
    actions:
      - gameOver:
          title: "운명 35 — 아버지의 거짓말"
          message: "유언장은 완벽했지만 진평왕은 마지막 순간 오른손을 쓰지 못했다. 칠숙은 서명 한 획으로 거짓을 증명했다. 덕만은 왕의 딸이 아니라 왕명을 위조한 죄인으로 끌려갔다."
