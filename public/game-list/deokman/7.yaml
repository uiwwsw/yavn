script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - camera: medium
      - effect: focus
      - char:
          id: 덕만
          position: center
      - say:
          text: "최종장 — 왕이 보지 못한 아침"
      - say:
          with:
            - 덕만
          delivery: calm
          text: "632년 정월, 왕이 된 지 사흘째 되는 날 첫 회의가 열렸습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "궁문 밖에서는 새 왕의 이름보다 곡식을 달라는 외침이 더 컸습니다."
      - char:
          id: 소원
          position: left
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "전하. 궁문 밖에 사람이 가득합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "무슨 일이지?"
      - say:
          char: 소원.nervous
          camera: close
          with:
            - 덕만
          text: "곡식이 끊겼답니다."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "새 왕을 알리는 의식이 먼저입니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "사람들은 사흘을 굶었습니다."
      - say:
          char: 진운
          camera: close
          with:
            - 덕만
          text: "왕이 흔들리면 창고도 못 엽니다."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "밖에선 오늘을 못 넘깁니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "호위는 준비됐습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "왕이 된 뒤 첫걸음이군요."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "귀족부터 묶자는 장수도 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "왕이 된 첫날부터 사람을 잡아들일 수도 있겠군요."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "군사를 돌리면 창고를 여는 일이 늦습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "늦어지는 쪽도 제가 책임져요."
      - branch:
          cases:
            - when:
                var: has_royal_seal
                op: eq
                value: true
              goto: opening_seal_legacy
          default: opening_broken_seal_legacy

  opening_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "사흘 전 되찾은 왕의 도장이 탁자 위에 놓여 있었습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "도장이 있으면 명령은 빨라집니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "빠른 명령이 늘 옳지는 않지요."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그래도 오늘은 모두가 따를 겁니다."
      - add: { legitimacy: 1 }
      - goto: opening_move_choice

  opening_broken_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "덕만은 깨진 도장 두 조각을 왕좌 곁에 내려놓았습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "문지기들이 새 왕의 명을 확인하겠답니다."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "그럼 제가 직접 가서 말하겠습니다."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "궁문 밖 사람들도 새 왕이 직접 나오길 기다립니다."
      - add: { people_support: 1 }
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "첫날, 무엇부터 할까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "창고를 연다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "세금을 미룬다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "왕이 직접 나간다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "반대 귀족을 친다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with:
            - 덕만
            - 진운
          text: "덕만은 왕실 창고의 빗장을 직접 풀었습니다."
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "겨울 몫까지 나가고 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "그 전에 굶으면 겨울도 없습니다."
      - say:
          char: 진운.nervous
          camera: close
          with:
            - 덕만
          text: "제가 틀렸다고 기록하실 겁니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진운
          text: "내일도 같이 틀려 주세요."
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "……그 부탁은 처음 듣습니다."
      - goto: early_reign_bridge

  opening_gates:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "덕만은 흉년 든 고을의 세금 납부를 한 해 미뤘습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "군량도 줄어듭니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "농부가 살아야 내년 군량도 납니다."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "그때까지 제가 버티겠습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "아니요. 우리가 버팁니다."
      - goto: early_reign_bridge

  opening_witnesses:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "덕만은 왕의 옷을 입고 궁문 밖으로 나갔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "돌아가라 하면 화내실 겁니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "화낼 힘도 없어서 못 가."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "그럼 제 팔을 잡으세요."
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "왕이 기대도 되나?"
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "넘어지는 것보단 낫죠."
      - goto: early_reign_bridge

  early_reign_bridge:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "왕이 된 지 한 해가 지난 633년 봄."
      - say:
          with:
            - 덕만
            - 비담
          delivery: calm
          text: "첫날 열었던 창고 앞에는 새 곡식 자루가 쌓였습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "왕좌전 탁자에는 흉년 든 고을의 세금을 미룬 문서가 펼쳐져 있었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "귀족들 얼굴이 아주 볼 만합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "웃지만 말고 달래 주세요."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "왕께서 절 믿는다는 뜻입니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "신라에 그대가 필요하다는 뜻입니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "또 신라가 먼저군요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "그대가 없으면 못 하는 일입니다."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "그 말로 오늘은 속아 드리죠."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: fortress
      - camera: medium
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          delivery: calm
          text: "그 뒤로 아홉 해가 흘렀습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "덕만의 머리에는 흰머리가 늘었고, 유신의 지도에는 새 성의 이름이 빼곡해졌습니다."
      - say:
          with:
            - 덕만
            - 유신
          delivery: calm
          text: "642년 가을, 왕위에 오른 지 11년째 되던 해 대야성이 무너졌습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "대야성이 무너지자 서쪽의 여러 성과 피란길까지 한꺼번에 위태로워졌습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "궁에는 피란민을 받아들이라는 요청과 군사를 보내 달라는 급보가 함께 올라왔습니다."
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "서쪽의 마흔 개 성이 위태롭습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 유신
          text: "피란민은?"
      - say:
          char: 유신.sad
          camera: close
          with:
            - 덕만
          text: "길이 막혔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "당으로 떠날 사신도 명을 기다리고 있습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "한꺼번에 다 보낼 병력이 없군."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "예. 먼저 움직일 곳을 정하셔야 합니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "피란민도 성을 지키는 군사도 오늘 안에 결정을 기다립니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "이번에도 한쪽부터 정해야겠군."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "이제는 전하께서 정하셔야 합니다."
      - choice:
          key: final_proof
          prompt: "무엇부터 지킬까?"
          char: 덕만
          camera: close
          with:
            - 비담
          options:
            - text: "피란길을 연다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "유신에게 군권을 준다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "남은 성을 지킨다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "승전을 꾸민다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "성문이 열리자 피란민이 쏟아져 들어왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "다 받을 자리가 없습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "절 마당까지 비워."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "전하의 방도요?"
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "비어 있잖아. 사람부터 눕혀."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "그 말, 제가 꼭 기록할게요."
      - goto: pagoda_bridge

  proof_evidence:
    actions:
      - bg: fortress
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "덕만은 자신의 도장을 유신에게 건넸습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "돌아오지 못할 수도 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "그래서 그대에게 맡깁니다."
      - say:
          char: 유신.sad
          camera: close
          with:
            - 덕만
          text: "전하를 두고 가기 싫습니다."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 유신
          text: "나도 보내기 싫어요."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "그럼 살아서 돌아오겠습니다."
      - goto: pagoda_bridge

  proof_army:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with:
            - 덕만
            - 비담
          text: "덕만은 남은 성마다 지킬 병력을 새로 배치했습니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "피란길은 더 늦어집니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "성이 무너지면 길도 없습니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "결국 피란민을 뒤로 미루시는군요."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "그래요. 그 사람들을 기다리게 하는 겁니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "그렇게 바로 인정하셔서 더 화가 납니다."
      - goto: pagoda_bridge

  pagoda_bridge:
    actions:
      - bg: title_palace
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "그로부터 세 해 뒤인 645년, 황룡사에 아홉 층 목탑이 완성됐습니다."
      - say:
          with:
            - 덕만
            - 비담
          delivery: calm
          text: "대야성을 잃은 뒤 세 해 동안, 덕만은 무너진 군대를 다시 세웠습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "절과 빈 관청에는 돌아갈 집을 잃은 사람들이 머물렀습니다."
      - say:
          with:
            - 덕만
            - 비담
          delivery: calm
          text: "피란민들은 탑 그림자 아래에서도 밤마다 짐을 싸 둔 채 잠들었습니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "성 밖 아이들은 탑 그림자도 못 먹습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "알아요. 탑이 배를 채우진 않죠."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "그래도 겁먹은 채 살게 둘 순 없어."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "곡식도 주고 용기도 주시겠다?"
      - say:
          char: 비담.sad
          camera: close
