          with: [덕만]
          text: "처음부터 내게 말했잖아."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니부터 살리겠다고."
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "그 약속, 이제 내가 갚을 차례야."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "궁 안은 내가 맡을게."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "이번엔 같이 지키는 거야."
      - add: { legitimacy: 1 }
      - goto: crown_choice_report

  crown_choice_sister:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          char: 천명.sad
