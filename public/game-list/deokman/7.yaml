          text: "길을 여세요! 신라의 새 여왕, 덕만 폐하께서 드십니다!"
      - say:
          char: 덕만
          camera: medium
          delivery: deduction
          text: "<speed=17>여왕이 아니다.</speed> <speed=18>신라의 왕이다.</speed>"
          wait: 1200
      - ending: true_end

