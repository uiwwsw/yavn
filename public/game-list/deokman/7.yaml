  crown_choice_report:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "전하. 반란군이 성문까지 왔어요."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "다음 왕도 정해야 합니다."
      - say:
          char: 덕만
          camera: close
          with: []
          text: "왕의 마지막 선택이군."
      - say:
          with:
            - 덕만
          text: "다음 왕을 세우면 반란 뒤의 질서는 남지만 지금 성문을 지킬 힘이 줄어듭니다. 백성에게 알리면 왕의 뜻은 퍼지지만 병든 왕의 약함도 드러납니다."
      - say:
          with:
            - 덕만
          text: "유신에게 맡기면 반란은 빠르게 막을 수 있습니다. 비담을 직접 부르면 마지막 대화의 문은 열리지만, 왕 자신이 반란의 손에 닿게 됩니다."
      - choice:
          key: final_crown
          prompt: "무엇을 남길까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "다음 왕을 세운다"
              set:
                final_strategy: "law"
              add:
                legitimacy: 1
              goto: verdict
            - text: "백성에게 알린다"
              set:
                final_strategy: "people"
              add:
                people_support: 1
              goto: verdict
            - text: "유신에게 맡긴다"
              set:
                final_strategy: "army"
              add:
                power: 2
                suspicion: 2
              goto: verdict
            - text: "비담을 직접 부른다"
              set:
                final_strategy: "alliance"
              add:
                rival_trust: 1
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 8
                  - var: power
                    op: gte
                    value: 4
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: rival_trust
                    op: gte
                    value: 2
                  - var: clue_black_powder
                    op: eq
                    value: true
                  - var: clue_marriage_pact
                    op: eq
                    value: true
                  - var: clue_oath_fragment
                    op: eq
                    value: true
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: suspicion
                    op: gte
                    value: 6
              goto: ending_tyrant
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: yushin_trust
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: legitimacy
                    op: gte
                    value: 6
                  - var: suspicion
                    op: lt
                    value: 6
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: nobles_support
                    op: gte
                    value: 2
              goto: ending_permitted
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 4
                  - var: legitimacy
                    op: lt
                    value: 7
              goto: ending_queen_consort
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 3
              goto: ending_abdicated
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "people"
                  - var: people_support
                    op: gte
                    value: 5
              goto: ending_people
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: false
                  - var: sowon_trust
                    op: lte
                    value: 1
              goto: ending_lonely
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: power
                    op: lt
                    value: 4
              goto: ending_one_step
            - when:
                all:
                  - var: bidam_trust
                    op: gte
                    value: 4
                  - var: power
                    op: lt
                    value: 4
              goto: ending_vanished
          default: ending_broken

