script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - camera: wide
      - effect: focus
      - char: { id: 덕만, position: center }
      - char: { id: 소원, position: left }
      - char: { id: 진운, position: right }
      - say:
          wait: 850
          text: "최종장 — 별이 떨어진 밤"
      - say:
          delivery: calm
          text: "632년 1월, 덕만이 왕이 된 지 3일째 되는 아침이었습니다."
      - say:
          with: [덕만, 소원, 진운]
          text: "즉위 의식에 쓸 깃발은 마당에 펼쳐졌지만, 궁문 밖에서는 새 왕의 이름보다 끊긴 곡식 수레를 찾는 외침이 컸습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "전하, 세 지역으로 갈 수레가 칠숙의 옛 창고 앞에서 멈췄습니다. 창고지기들이 새 왕명을 못 믿겠다고 해요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "수레는 며칠째 멈췄느냐?"
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "사흘째입니다. 문밖에 온 사람들도 그동안 굶었습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "즉위 의식을 먼저 마치면 명령을 의심할 구실이 줄어듭니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 사흘은 내 즉위를 기다리느라 생겼다. 지연의 책임은 내가 진다."
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "창고 문을 열 군사는 준비했습니다. 다만 칼이 먼저 보이면 남은 집들도 문을 닫을 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "첫 명령의 뜻이 곡식인지 체포인지 지금 정해야겠군."
      - branch:
          cases:
            - when:
                var: has_royal_seal
                op: eq
                value: true
              goto: seal_legacy
          default: spoken_legacy

  seal_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          with: [덕만, 진운]
          text: "되찾은 왕의 도장은 아직 불에 그을린 천 위에 놓여 있었습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "도장을 찍으면 창고지기들이 바로 문을 열 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "도장만 보내지 않는다. 왜 여는지, 얼마나 내주는지도 함께 보낸다."
      - goto: opening_choice

  spoken_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만은 거짓 명령을 멈춘 날의 기록을 왕좌 곁에 펼쳤습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "문지기들은 새 도장이 없으면 누구 말을 믿어야 하느냐고 해요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그러면 내 얼굴과 장부를 함께 보여라. 왕의 말은 결과로 확인하게 한다."
      - goto: opening_choice

  opening_choice:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 진운, position: right }
      - choice:
          key: final_opening
          prompt: "멈춘 곡식 수레 앞에서 첫 통치를 시작합니다."
          char: 덕만
          camera: close
          with: [유신, 진운]
          options:
            - text: "왕실 곡식을 먼저 보낸다"
              add: { legitimacy: 1, people_support: 1 }
              goto: opening_reserve
            - text: "세금을 늦추고 현지에 푼다"
              add: { people_support: 2, power: 1 }
              goto: opening_tax
            - text: "호위와 감시인을 함께 보낸다"
              add: { army_support: 1, nobles_support: 1 }
              goto: opening_escort
            - text: "반대한 여덟 집을 잡는다"
              goto: go_34_arrested_revolt

  opening_reserve:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 진운, position: right }
      - say:
          with: [덕만, 진운]
          text: "덕만은 즉위 의식에 쓸 왕실 수레를 비우고 곡식 자루를 실었습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "겨울에 남길 왕실 몫까지 나갑니다. 내일 모자라면 제가 반대하겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          wait: 850
          unskippable: true
          text: "<speed=18>반대는 죄가 아니다. 내일도 내 곁에서 틀렸다고 말하라.</speed>"
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그러면 오늘은 수레가 떠나는지 끝까지 확인하겠습니다."
      - goto: early_reign

  opening_tax:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 가뭄 지역에서 거둘 봄 곡식을 그 지역의 구휼미로 돌리고 세금을 한 철 늦췄습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "그러면 올해 군량도 줄어듭니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "농부가 살아야 내년 군량도 있다. 군사와 백성에게 줄어든 몫을 함께 공개하라."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "불평도 함께 올라올 겁니다. 그대로 전하겠습니다."
      - goto: early_reign

  opening_escort:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만은 병사와 함께 마을 대표를 수레마다 태워 자루 수와 도착 시간을 직접 적게 했습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "병사만 보내면 빼앗으러 왔다고 하고, 관리만 보내면 숨기러 왔다고 할 테니 둘 다 보게 하는군요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "서로를 감시하게만 하지 마. 길에서 함께 먹고 도착한 뒤 같은 장부에 이름을 남겨."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "왕도 끝까지 봤다고 적어 둘게요."
      - goto: early_reign

  early_reign:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          wait: 900
          text: "일 년이 지나 633년 봄이 왔습니다."
      - say:
          with: [덕만, 비담]
          text: "왕의 회의장에는 세금을 늦춘 지역의 첫 파종 기록과, 닫았던 창고를 다시 조사해 달라는 귀족들의 글이 쌓였습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "열흘 동안 여섯 집을 돌았습니다. 두 집은 문을 열고, 세 집은 욕을 하고, 한 집은 개를 풀었습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "다친 곳은 없느냐?"
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "욕은 제게 왔고, 곡식을 풀었다는 칭찬은 전하께 갔습니다. 손해가 조금 크군요."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "믿는다는 말로 험한 일을 넘겼구나. 다음 회의에는 처음부터 함께 앉아라."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "결정이 끝난 뒤 달래는 사람이 아니라, 결정하기 전에 반대하는 사람으로 부르시는 겁니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그렇다. 대신 반대가 끝나면 결정도 함께 집행해야 한다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "마음에 들지 않는 결정도요? 왕의 곁은 생각보다 힘든 자리군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그래서 아무에게나 맡기지 않는다."
      - say:
          with: [덕만, 비담]
          wait: 700
          text: "그날 비담의 찻잔은 끝내 비어 있었습니다. 국경에서 온 급보가 먼저 왕의 탁자에 올랐습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "차는 다음에 마셔야겠군요."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "보고만 끝내고 부르겠다."
      - say:
          delivery: calm
          text: "3년 뒤, 비담은 깨진 찻잔 하나를 왕의 탁자에 올렸습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "누가 던졌느냐?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "창고를 열라고 설득한 집에서요. 차를 대접받은 셈 치겠습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "다친 곳은 없느냐?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "그 질문을 들으니 조금 낫습니다."
      - say:
          delivery: calm
          text: "다시 4년 뒤, 비담은 왕의 방 앞에서 밤을 새웠습니다."
      - say:
          with: [비담]
          text: "문 안에서는 유신과 전쟁 지도가 아침까지 왕을 붙들었습니다."
      - say:
          char: 비담.sad
          camera: close
          with: []
          text: "이번에도 일이 끝난 뒤겠군요."
      - say:
          with: [비담]
          wait: 800
          text: "비담은 준비한 말을 하지 않고, 오래 매고 다니던 붉은 매듭을 다시 품에 넣었습니다."
      - add: { bidam_trust: 1, legitimacy: 1 }
      - goto: war_bridge

  war_bridge:
    actions:
      - bg: fortress
      - camera: wide
      - effect: pulse
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - char: { id: 비담, position: center }
      - say:
          delivery: calm
          wait: 1050
          text: "그 뒤로 아홉 해가 흘렀습니다."
      - say:
          delivery: calm
          text: "642년 가을, 왕이 된 지 11년째에 대야성이 무너졌습니다."
      - say:
          with: [덕만, 유신, 비담]
          text: "피란길과 남은 성에서 보낸 보고가 같은 지도 위에 겹쳤고, 서쪽의 신호 불빛이 하나씩 꺼졌습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "피란민이 건널 길은 적의 기병에게 막혔습니다. 남은 성의 군사를 빼면 방어선이 무너집니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "귀족 창고를 열면 군량은 만들 수 있습니다. 다만 그들은 다음 왕의 권한을 미리 나누자고 요구합니다."
      - say:
          char: 덕만
          camera: close
          with: [유신, 비담]
          text: "전쟁 중에도 다음 왕의 열쇠부터 사려는군."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "싫은 조건이라도 들어야 오늘 곡식이 나옵니다. 제가 조건을 늦추는 동안 전하께서 먼저 보낼 군사를 정하십시오."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신, 비담]
          text: "11년이 지나도 모든 사람을 한 번에 구하는 명령은 없구나."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "없습니다. 어느 쪽을 먼저 지킬지와 다른 쪽의 손실을 누가 책임질지만 정할 수 있습니다."
      - choice:
          key: final_war
          prompt: "대야성 뒤의 피란길과 성들이 함께 무너집니다."
          char: 덕만
          camera: close
          with: [유신, 비담]
          options:
            - text: "피란길부터 연다"
              add: { people_support: 2, legitimacy: 1 }
              goto: war_refugees
            - text: "유신에게 방어선을 맡긴다"
              add: { army_support: 2, yushin_trust: 1, power: 1 }
              goto: war_defense
            - text: "비담에게 군량 협상을 맡긴다"
              add: { bidam_trust: 1, nobles_support: 1, insight: 1 }
              goto: war_negotiation
            - text: "대야성을 되찾았다고 알린다"
              goto: go_35_false_victory

  war_refugees:
    actions:
      - bg: village
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "왕군이 산길의 기병을 밀어내자 피란민들이 밤새 임시 성문 안으로 들어왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "사람을 눕힐 자리가 없습니다. 절과 관청 마당도 가득 찼어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "내가 머무는 방까지 열어라. 지붕이 있는 곳은 모두 환자와 아이에게 내준다."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "전하는 어디서 주무실 건가요?"
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "오늘은 회의장에서 잔다. 내일 잃은 성의 보고도 받아야 한다."
      - goto: war_cost

  war_defense:
    actions:
      - bg: fortress
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "남은 성을 잇고 피란민이 지나갈 좁은 길 하나는 끝까지 남겨라. 군사의 순서는 유신이 정한다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "전하 곁의 호위도 빼야 합니다. 살아 돌아오겠다고는 약속하지 못합니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "돌아오라는 말을 명령으로 만들지는 않겠다. 다만 버릴 성과 남길 길을 모두 기록해 와라."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "명령 때문이 아니라 그 기록을 드리려고 돌아오겠습니다."
      - goto: war_cost

  war_negotiation:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "귀족들은 군량을 내는 대신 다음 장수 셋 중 하나를 자신들이 고르겠다고 합니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "이번 전쟁의 군량과 다음 왕의 군사권을 한 문서에 넣지 마라. 오늘 낼 곡식의 값은 세금과 토지로 갚는다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그 선을 지키면 곡식이 늦어집니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "안다. 늦어 생기는 손실은 내 책임으로 적어라. 대신 다음 왕을 오늘의 인질로 만들지는 않는다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "그 책임까지 들고 다시 문을 두드리겠습니다."
      - goto: war_cost

  war_cost:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "642년 겨울, 첫눈이 내린 날 비담이 귀족 회의에서 돌아왔습니다."
      - say:
          with: [덕만, 비담]
          text: "그의 입술은 터져 있었고, 품에는 왕을 물러나게 하자는 글 세 장과 늦게 열린 창고 열쇠가 함께 있었습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [비담]
          text: "이번에도 내 결정 때문에 네가 미움을 받았구나."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "전하의 결정이라고 말하면 곡식이 나오지 않아 우리 모두의 결정이라 했습니다. 제 이름으로 거짓말했습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "내 책임을 네 이름 뒤에 숨겼다. 그 일부터 회의 기록에 바로잡겠다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "기록만 바로잡으면 다음에는 달라집니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "다음 조건은 네가 가져오기 전에 함께 정한다. 오늘은 네 말을 끝까지 듣겠다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "전하께 필요한 제 말과, 전하께 듣기 싫은 제 말을 나누지 마십시오."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "나누지 않겠다. 결정이 다르더라도 먼저 끝까지 듣는다."
      - goto: succession_bridge

  succession_bridge:
    actions:
      - bg: title_palace
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          wait: 1000
          text: "3년 뒤인 645년, 황룡사의 구층 목탑이 모습을 드러냈습니다."
      - say:
          with: [덕만, 비담]
          text: "탑 아래의 절과 빈 관청에는 대야성에서 돌아가지 못한 사람들이 여전히 살고 있었습니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "탑이 나라가 버틴다는 표시는 될 수 있습니다. 하지만 다음 왕의 이름이 비어 있으면 귀족들은 또 자기 사람을 세울 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "승만은 3년 동안 피란민 곡식과 성의 복구 장부를 맡았다. 오늘 다음 왕으로 밝힌다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "반대할 집들도 오늘 바로 움직일 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "숨겨서 지키려다 내게 남은 것이 누명과 칼이었다. 이번에는 이름과 준비를 함께 공개한다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "비담, 상대등이 되어 귀족 회의를 맡아라. 승만을 받들 조건을 공개된 자리에서 모은다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "자리를 주시는 것이 아니라 가장 어려운 협상을 맡기시는군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "둘 다다. 이번에는 조건을 정하는 첫 자리부터 내가 함께 앉는다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그러면 제가 가져올 답이 전하의 뜻과 달라도 들으십시오."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "듣겠다. 받아들일지는 왕이 정한다."
      - add: { bidam_trust: 1, legitimacy: 1 }
      - goto: compact_break

  compact_break:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "이듬해인 646년 가을, 비담은 여덟 집의 도장이 찍힌 다음 왕 합의서를 가져왔습니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "여덟 집은 승만공주를 다음 왕으로 받듭니다. 대신 장수 셋과 창고지기 절반을 그들이 고릅니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "16년 전 혼인 합의서와 같은 거래다. 이름만 진운에서 승만으로 바뀌었다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그때와 달리 이번에는 다음 왕이 공개됐고 귀족도 공개된 책임을 집니다. 모두 같은 거래는 아닙니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "창고 장부를 함께 보고 장수 후보를 추천하는 일은 받겠다. 마지막 임명과 열쇠는 왕이 맡는다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "추천만 듣고 전하께서 모두 정하시면 협상이 아니라 통보입니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "결정과 책임을 함께 피할 수는 없다. 성이 무너지면 여덟 집이 아니라 왕의 이름을 부른다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그래서 저는 다음 왕이 한 사람의 판단에만 갇히지 않게 하려는 겁니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "그 뜻은 죄가 아니다. 하지만 군량을 막아 동의를 사는 방식은 받지 않는다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "여덟 집이 문을 닫으면 승만공주의 왕위도 지킬 수 없습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내일 그들과 다시 만난다. 네가 가운데 서지 말고 내 옆에 앉아라. 내가 직접 거절하고 값을 치른다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "전하께서 직접 말해도 답이 달라지지 않으면요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그러면 합의하지 못한 책임도 내 이름으로 남긴다."
      - goto: meetings_fail

  meetings_fail:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "선덕왕은 여덟 집과 두 차례 직접 만났습니다."
      - say:
          with: [덕만, 비담]
          text: "첫 회의에서 왕은 공개 장부와 장수 추천권을 제안했고, 둘째 회의에서는 사병을 왕군으로 받아 품계를 보장하겠다고 제안했습니다."
      - say:
          with: [덕만, 비담]
          text: "여덟 집은 군사 임명권을 내주지 않으면 승만의 후계를 거두고 창고를 닫겠다는 답만 되풀이했습니다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "두 번 모두 들었고 두 번 모두 거절했습니다. 이제 합의로 열 문은 없습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "문이 닫혔다고 칼로 부수지는 않는다. 시간이 걸려도 다른 집과 군사를 모은다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "그 시간 동안 승만공주는 표도 군량도 잃습니다. 전하께서는 늘 기다릴 수 있는 쪽의 시간을 고르십니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "기다리다 잃을 사람의 이름을 가져와라. 그 값을 보고 다시 정한다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          wait: 900
          text: "이번에는 제가 기다리지 않겠습니다."
      - say:
          with: [덕만, 비담]
          text: "비담은 상대등의 관모를 벗지 않았지만, 오래 차고 다니던 붉은 매듭을 왕의 탁자에 내려놓았습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [비담]
          text: "다시 오겠느냐?"
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "다음에는 제 답을 군사들과 함께 들으실 겁니다."
      - goto: rebellion_choice_setup

  rebellion_choice_setup:
    actions:
      - bg: fortress
      - camera: wide
      - effect: embers
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "석 달 뒤, 647년 1월이었습니다."
      - say:
          with: [비담]
          text: "명활성에는 여덟 집의 군사와 왕의 조건을 거부한 장수들이 모였습니다."
      - say:
          char: 비담.sad
          camera: close
          with: []
          text: "왕이 귀족의 조건을 듣지 않았다는 말만으로는 병사들이 모이지 않습니다."
      - say:
          with: [비담]
          text: "비담 앞에는 ‘여자는 나라를 다스릴 수 없다’고 쓴 깃발이 놓였습니다."
      - say:
          char: 비담.sad
          camera: close
          with: []
          wait: 1050
          unskippable: true
          text: "<speed=18>이 문장은 거짓입니다. 그래도 사람을 모으려고 제가 쓰겠습니다.</speed>"
      - say:
          char: 비담.sad
          camera: close
          with: []
          text: "합의로 열지 못한 문을 군사로 열기로 한 것도 제 선택입니다. 누구의 명령도 아닙니다."
      - bg: throne_hall
      - camera: wide
      - effect: moonveil
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 천명, position: right }
      - say:
          with: [덕만, 유신, 천명]
          wait: 900
          text: "같은 밤 월성 위로 별 하나가 길게 떨어졌고, 오래 앓던 선덕왕은 누운 자리에서 반란의 북소리를 들었습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "비담이 명활성에 군사를 모았습니다. 깃발에는 여자가 왕이라 나라가 어지럽다고 적었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "그가 믿지 않는 말이다. 믿지 않는 거짓으로 사람을 갈랐구나."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "비담이 틀렸다는 걸 말하려고 직접 가면 안 돼. 이번에는 네가 왕궁에 남아야 해."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "알아. 사람을 믿은 것과 그 사람의 죄를 판단하는 일도 나눠야 해."
      - char: { id: 진운, position: right }
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "승만공주를 다음 왕으로 세우는 문서와 성문 방어 명령을 준비했습니다. 둘 다 전하의 결정이 필요합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "숨부터 고르고 듣겠다. 마지막 명령까지 쫓기듯 내리지는 않는다."
      - goto: final_choice

  final_choice:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 진운, position: right }
      - choice:
          key: final_crown
          prompt: "두 번째 공격 전에 왕의 마지막 방침을 정합니다."
          char: 덕만
          camera: close
          with: [유신, 진운]
          options:
            - text: "승만의 계승을 공표한다"
              set: { final_strategy: "law" }
              add: { legitimacy: 1 }
              goto: verdict
            - text: "성문 위에서 백성에게 말한다"
              set: { final_strategy: "people" }
              add: { people_support: 1 }
              goto: verdict
            - text: "유신에게 진압을 맡긴다"
              set: { final_strategy: "army" }
              add: { power: 2, suspicion: 2 }
              goto: verdict
            - text: "비담에게 마지막 답을 보낸다"
              set: { final_strategy: "alliance" }
              add: { bidam_trust: 1 }
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: legitimacy, op: gte, value: 11 }
                  - { var: insight, op: gte, value: 5 }
                  - { var: people_support, op: gte, value: 3 }
                  - { var: army_support, op: gte, value: 2 }
                  - { var: rival_trust, op: gte, value: 3 }
                  - { var: clue_black_powder, op: eq, value: true }
                  - { var: clue_marriage_pact, op: eq, value: true }
                  - { var: clue_oath_fragment, op: eq, value: true }
              goto: ending_true
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "army" }
                  - { var: suspicion, op: gte, value: 5 }
              goto: ending_tyrant
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "army" }
                  - { var: yushin_trust, op: gte, value: 3 }
                  - { var: army_support, op: gte, value: 3 }
                  - { var: legitimacy, op: gte, value: 9 }
                  - { var: suspicion, op: lt, value: 5 }
              goto: ending_true
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "law" }
                  - { var: nobles_support, op: gte, value: 3 }
              goto: ending_permitted
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "alliance" }
                  - { var: rival_trust, op: gte, value: 5 }
                  - { var: legitimacy, op: lt, value: 13 }
              goto: ending_queen_consort
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "alliance" }
                  - { var: bidam_trust, op: gte, value: 4 }
                  - { var: power, op: lt, value: 5 }
              goto: ending_vanished
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "alliance" }
                  - { var: rival_trust, op: gte, value: 4 }
              goto: ending_abdicated
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "people" }
                  - { var: people_support, op: gte, value: 6 }
              goto: ending_people
            - when:
                all:
                  - { var: people_support, op: lte, value: 2 }
                  - { var: sowon_trust, op: lte, value: 1 }
              goto: ending_lonely
            - when:
                all:
                  - { var: final_strategy, op: eq, value: "law" }
                  - { var: power, op: lt, value: 5 }
              goto: ending_one_step
          default: ending_broken

  ending_true:
    actions:
      - bg: fortress
      - camera: wide
      - effect: embers
      - char: { id: 유신, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [유신, 비담]
          text: "별이 떨어졌다는 소문에 왕군의 방패가 흔들리자, 유신은 불붙인 연을 밤하늘 높이 띄웠습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [비담]
          text: "하늘의 뜻을 말할 시간이 있으면 다친 병사를 보라! 왕의 별은 아직 꺼지지 않았다!"
      - say:
          char: 비담.sad
          camera: close
          with: [유신]
          text: "전하께서는 마지막까지 제가 만든 거짓보다 사람을 먼저 보시는군요."
      - say:
          char: 유신
          camera: close
          with: [비담]
          text: "그 거짓을 만든 사람은 비담공입니다. 상처가 대신 책임지지는 않습니다."
      - say:
          with: [유신, 비담]
          text: "왕이 승만의 계승과 속아 따른 병사의 사면 기준을 함께 공표하자 반란군의 줄이 갈라졌습니다."
      - effect: { name: crown, wait: true }
      - say:
          with: [유신, 비담]
          wait: 900
