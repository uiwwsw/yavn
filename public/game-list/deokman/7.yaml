          cases:
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: true
                  - var: cheonmyeong_trust
                    op: gte
                    value: 2
              goto: crown_choice_sister_trusted
            - when:
                var: cheonmyeong_alive
                op: eq
                value: true
              goto: crown_choice_sister
          default: crown_choice_memory

  crown_choice_sister_trusted:
