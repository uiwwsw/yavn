script:
  - scene: final_open

scenes:
  final_open:
    actions:
      - bg: throne_hall
      - camera: medium
      - effect: focus
      - char:
          id: 덕만
          position: center
      - say:
          text: "최종장 — 왕이 보지 못한 아침"
      - say:
          with:
            - 덕만
          delivery: calm
          wait: 750
          text: "632년 1월, 왕이 된 지 3일째 되는 아침에 덕만의 첫 회의가 열렸습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "궁문 밖에서는 새 왕의 이름보다 곡식을 달라는 외침이 더 크게 들렸습니다."
      - char:
          id: 소원
          position: left
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "전하, 궁문 밖이 사람들로 가득 찼습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "어느 지역으로 갈 곡식이 끊겼느냐?"
      - say:
          char: 소원.nervous
          camera: close
          with:
            - 덕만
          text: "세 지역으로 갈 곡식 수레가 3일째 안 왔습니다."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "새 왕을 알리는 의식부터 마쳐야 합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "밖의 사람들은 그 3일을 굶었습니다."
      - say:
          char: 진운
          camera: close
          with:
            - 덕만
          text: "새 왕이 힘을 잃으면 귀족들이 창고를 다시 닫을 겁니다."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "하지만 밖에서는 오늘을 못 넘겨요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "궁문까지 모실 호위는 준비됐습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "왕이 된 뒤 처음 나서는 길이군."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "반대하는 귀족부터 체포하자는 장수도 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "첫 명령이 체포가 될 수도 있겠군."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "귀족에게 군사를 보내면 창고는 더 늦게 열립니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "알겠다. 늦어진 만큼 내가 직접 사과하겠다."
      - branch:
          cases:
            - when:
                var: has_royal_seal
                op: eq
                value: true
              goto: opening_seal_legacy
          default: opening_broken_seal_legacy

  opening_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          wait: 650
          text: "3일 전 되찾은 왕의 도장이 아직 피 묻은 천 위에 놓여 있었습니다."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "도장을 찍으면 궁문은 바로 열립니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "서둘러 내린 명령이 늘 옳지는 않았습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그래도 오늘은 망설일 틈이 없습니다."
      - add: { legitimacy: 1 }
      - goto: opening_move_choice

  opening_broken_seal_legacy:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "덕만은 깨진 도장 두 조각을 왕좌 곁에 그대로 내려놓았습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "문지기들이 새 왕의 명령을 어떻게 믿냐고 해요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "그럼 제 얼굴을 보고 믿게 하죠."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "밖의 사람들도 왕이 직접 나오길 기다리고 있어요."
      - add: { people_support: 1 }
      - goto: opening_move_choice

  opening_move_choice:
    actions:
      - choice:
          key: final_opening
          prompt: "왕의 첫 명령을 모두가 기다립니다."
          char: 덕만
          camera: close
          with: []
          options:
            - text: "창고를 연다"
              add:
                legitimacy: 1
                rival_trust: 1
              goto: opening_joint
            - text: "세금을 미룬다"
              add:
                army_support: 1
                power: 1
              goto: opening_gates
            - text: "왕이 직접 나간다"
              add:
                people_support: 1
                sowon_trust: 1
              goto: opening_witnesses
            - text: "반대하는 귀족을 체포한다"
              goto: go_34_empty_council

  opening_joint:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with:
            - 덕만
            - 진운
          wait: 700
          text: "덕만은 아버지와 함께 열었던 창고의 빗장을 이번에는 직접 풀었습니다."
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "전하, 겨울에 쓸 곡식까지 나가고 있습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진운
          text: "오늘 굶어 죽으면 그 겨울도 오지 않습니다."
      - say:
          char: 진운.nervous
          camera: close
          with:
            - 덕만
          text: "제 반대를 어리석었다고 기록하시겠습니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진운
          wait: 800
          unskippable: true
          text: "<speed=19>아니요. 내일도 제 옆에서 틀렸다고 말해 주세요.</speed>"
      - say:
          char: 진운
          camera: medium
          with:
            - 덕만
          text: "……그런 부탁은 처음 받아 봅니다."
      - goto: early_reign_bridge

  opening_gates:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          text: "덕만은 흉년이 든 지역의 세금을 다음 가을까지 미뤘습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "그러면 올해 군대 식량도 모자랍니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "농부가 살아야 내년 곡식도 거둘 수 있습니다."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "그때까지 군대 식량은 제가 어떻게든 마련하겠습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "아니요. 그때까지 우리 모두가 함께 버팁니다."
      - goto: early_reign_bridge

  opening_witnesses:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "덕만은 무거운 왕의 옷을 입은 채 궁문 밖으로 걸어 나갔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "지금이라도 들어가자고 하면 화내실 겁니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "화낼 힘도 없어. 다리가 자꾸 풀려."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "그럼 제 팔을 잡아요. 아무도 못 보게."
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "왕이 시녀 팔에 기대도 되나?"
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "전하가 넘어지는 것보단 훨씬 낫죠."
      - goto: early_reign_bridge

  early_reign_bridge:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          wait: 900
          text: "일 년이 지나 633년 봄이 왔습니다."
      - say:
          with:
            - 덕만
            - 비담
          delivery: calm
          text: "그동안 비어 있던 창고가 다시 채워지고, 그 앞에는 새 곡식 자루가 쌓였습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "왕의 회의장에는 세금을 미룬 지역에서 보낸 첫 수확 소식과 감사 글이 펼쳐졌습니다."
      - say:
          with:
            - 덕만
            - 비담
          text: "비담은 열이틀 동안 일곱 집을 돌고 찢어진 소매로 돌아왔습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "손은 왜 다쳤습니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "세 집은 문을 열고 두 집은 물을 뿌렸습니다."
      - say:
          char: 비담
          camera: close
          with:
            - 덕만
          text: "나머지 두 집은 제 손에 도장을 찍었고요."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "제가 미룬 세금 때문에 비담이 욕을 들었군요."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "칭찬은 전하께, 화는 제게 왔습니다."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "고맙습니다. 오늘은 먼저 쉬세요."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "세금을 기다린 귀족들 얼굴이 아주 볼 만합니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "그만 비웃고, 가서 달래 주세요."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "저를 그분들 사이에 보내도 믿으시겠습니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          wait: 800
          text: "신라에 비담이 꼭 필요하다는 뜻입니다."
      - char:
          id: 유신
          position: center
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "전하, 서쪽 성 두 곳이 곡식을 거부했습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 비담
          text: "비담, 쉬라고 한 말을 바로 거두게 됐네요."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          wait: 850
          text: "역시, 오늘도 신라가 먼저군요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "비담이 아니면 부탁할 수 없는 일입니다."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 비담
          text: "돌아오시면 이번에는 차부터 마시지요."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          wait: 750
          text: "그 약속은 돌아와서 확인하지요."
      - goto: proof_choice

  proof_choice:
    actions:
      - bg: fortress
      - camera: medium
      - effect: pulse
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with:
            - 덕만
            - 유신
          delivery: calm
          wait: 1100
          text: "그 뒤로 아홉 해가 흘렀습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          wait: 900
          text: "그동안 덕만의 머리에는 흰머리가 늘었고, 유신의 지도에는 지켜야 할 성이 늘었습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "왕의 탁자에는 유신의 닳은 지도와 진운의 장부, 비담의 붉은 매듭이 쌓였습니다."
      - say:
          with:
            - 덕만
            - 유신
          delivery: calm
          wait: 850
          text: "642년 가을, 왕이 된 지 11년째에 대야성이 무너졌습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "대야성이 무너지면서 서쪽의 성들과 피란길이 한꺼번에 끊겼습니다."
      - say:
          with:
            - 덕만
            - 유신
          text: "피란민을 살려 달라는 글과 성을 지켜 달라는 긴급 보고가 같은 탁자에 놓였습니다."
      - say:
          char: 유신.angry
          camera: medium
          with:
            - 덕만
          text: "서쪽의 성 40곳에서 차례로 불을 올려 위험을 알렸습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with:
            - 유신
          text: "성 밖으로 나온 사람들은?"
      - say:
          char: 유신.sad
          camera: close
          with:
            - 덕만
          text: "피란길이 적의 기병에게 막혔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "당나라에 지원군을 요청하러 갈 사람도 문밖에서 기다립니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "세 곳을 모두 지킬 병력이 모자라는군."
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "예. 오늘 먼저 움직일 곳을 정하셔야 합니다."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "피란민도 병사도 해가 지기 전 명령을 기다립니다."
      - say:
          char: 비담.sad
          camera: medium
          with:
            - 덕만
          text: "저는 귀족들 창고를 다시 열어 보겠습니다."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "하지만 오늘 보낼 군사는 전하께서 정하셔야 합니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 비담
          text: "11년이 지나도 한쪽부터 골라야 하는군."
      - say:
          char: 비담.sad
          camera: close
          with:
            - 덕만
          text: "예. 그리고 이번에도 전하께서 책임지셔야 합니다."
      - choice:
          key: final_proof
          prompt: "대야성의 마지막 신호 불빛이 꺼져 갑니다."
          char: 덕만
          camera: close
          with:
            - 비담
          options:
            - text: "피란길을 연다"
              add:
                legitimacy: 2
                people_support: 1
              goto: proof_people
            - text: "유신에게 군대를 맡긴다"
              add:
                insight: 2
                legitimacy: 1
              goto: proof_evidence
            - text: "남은 성을 지킨다"
              add:
                army_support: 1
                power: 2
              goto: proof_army
            - text: "이겼다고 거짓말한다"
              goto: go_35_fathers_lie

  proof_people:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with:
            - 덕만
            - 소원
          text: "성문을 열자 지친 피란민들이 한꺼번에 안으로 들어왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "전하, 사람들을 눕힐 자리가 더는 없어요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "절과 관청 마당까지 전부 비워."
      - say:
          char: 소원
          camera: close
          with:
            - 덕만
          text: "전하께서 주무실 방도요?"
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          text: "나는 밤새 일할 거야. 사람부터 눕혀."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
