          text: "두 사람 사이의 왕좌는 끝내 비어 있었습니다. 같은 모양의 왕관이 두 군기 위에 걸렸고, 신라 사람들은 누구의 백성인지 정하기 위해 서로에게 칼을 들었습니다."
