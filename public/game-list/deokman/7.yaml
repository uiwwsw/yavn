          text: "그로부터 두 해 뒤, 647년 정월."
      - say:
          delivery: calm
          text: "오래 앓던 선덕왕은 침상에서 반란의 북소리를 들었습니다."
      - say:
          delivery: calm
          text: "비담은 ‘여왕이 나라를 어지럽혔다’며 명활성에 군사를 모았습니다."
      - say:
          delivery: calm
          text: "왕궁과 명활성 사이의 문이 모두 닫혔습니다."
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 7
                  - var: power
                    op: gte
                    value: 4
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
              goto: crown_balanced
            - when:
                all:
                  - var: power
                    op: gte
                    value: 6
                  - var: army_support
                    op: gte
                    value: 3
              goto: crown_force
            - when:
                all:
                  - var: people_support
                    op: gte
                    value: 4
              goto: crown_people_ready
          default: crown_fragile

  crown_balanced:
    actions:
      - say:
          text: "백성과 군사, 귀족이 보낸 전갈이 밤새 왕의 침전으로 들어왔습니다."
      - goto: crown_choice

  crown_force:
    actions:
      - say:
          text: "군사들은 왕명을 따랐지만, 오랜 전쟁으로 대열 곳곳이 비어 있었습니다."
      - goto: crown_choice

