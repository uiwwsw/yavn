                final_strategy: "law"
              add:
                legitimacy: 1
              goto: verdict
            - text: "왕이 살아 있다고 알린다"
              set:
                final_strategy: "people"
              add:
                people_support: 1
              goto: verdict
            - text: "유신에게 반란 진압을 맡긴다"
              set:
                final_strategy: "army"
              add:
                power: 2
                suspicion: 2
              goto: verdict
            - text: "비담을 직접 부른다"
              set:
                final_strategy: "alliance"
              add:
                rival_trust: 1
              goto: verdict

  verdict:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: legitimacy
                    op: gte
                    value: 8
                  - var: power
                    op: gte
                    value: 4
                  - var: insight
                    op: gte
                    value: 6
                  - var: people_support
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: rival_trust
                    op: gte
                    value: 2
                  - var: clue_black_powder
                    op: eq
                    value: true
                  - var: clue_marriage_pact
                    op: eq
                    value: true
                  - var: clue_oath_fragment
                    op: eq
                    value: true
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: suspicion
                    op: gte
                    value: 6
              goto: ending_tyrant
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "army"
                  - var: yushin_trust
                    op: gte
                    value: 3
                  - var: army_support
                    op: gte
                    value: 3
                  - var: legitimacy
                    op: gte
                    value: 6
                  - var: suspicion
                    op: lt
                    value: 6
              goto: ending_true
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: nobles_support
                    op: gte
                    value: 2
              goto: ending_permitted
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 4
                  - var: legitimacy
                    op: lt
                    value: 7
              goto: ending_queen_consort
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "alliance"
                  - var: rival_trust
                    op: gte
                    value: 3
              goto: ending_abdicated
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "people"
                  - var: people_support
                    op: gte
                    value: 5
              goto: ending_people
            - when:
                all:
                  - var: cheonmyeong_alive
                    op: eq
                    value: false
                  - var: sowon_trust
                    op: lte
                    value: 1
              goto: ending_lonely
            - when:
                all:
                  - var: final_strategy
                    op: eq
                    value: "law"
                  - var: power
                    op: lt
                    value: 4
              goto: ending_one_step
            - when:
                all:
                  - var: bidam_trust
                    op: gte
                    value: 4
                  - var: power
                    op: lt
                    value: 4
              goto: ending_vanished
          default: ending_broken

