          text: "진평왕의 유언도 없습니다. 남자 왕 후보가 왕위를 양보한다는 글도 없습니다. 누구의 명으로 왕좌를 요구하십니까?"
      - say:
          char: 덕만
          camera: medium
          text: "<speed=19>누구의 명도 빌리지 않겠습니다.</speed> <speed=21>여러분이 직접 본 저를 고르십시오. 제가 잘못한 일도 숨기지 않겠습니다.</speed>"
          wait: 1000
      - char:
          id: 진운
          position: left
      - say:
          char: 진운
          camera: medium
          text: "저는 왕위를 양보하지 않겠습니다. 제 판단으로 덕만공주에게 표를 던지겠습니다. 그 차이를 기록해 주십시오."
