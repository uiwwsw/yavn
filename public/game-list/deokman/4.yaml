script:
  - scene: peony_banquet

scenes:
  peony_banquet:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제5장 — 향기 없는 꽃"
      - char: { id: 덕만, position: left }
      - char: { id: 당 사신, position: right }
      - say:
          channel: action
          text: 사신이 내 장부 위에 모란 그림을 편다. 불타던 방에서 보았던 그 꽃. 손끝이 차가워진다. 천천히 숨을 내쉰다.
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서 신라를 걱정하십니다. 당이 고른 남편을 왕으로 세우면 곡식과 군사를 보내시겠답니다."
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "남편을 보낸다면서 값은 안 보이는군요. 이 그림처럼 일부러 빼놓으셨겠죠."
      - choice:
          key: c5_first_reply
          prompt: "혼인 제안은 값을 숨기고 있습니다. 무엇으로 먼저 맞설까요?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "웃으며 편지의 마지막 줄까지 듣는다"
              add: { nobles_support: 1, evidence: 1 }
              goto: answer_with_patience
            - text: "굶은 아이들의 명단을 그림 위에 펼친다"
              add: { people_support: 2, fear: 1 }
              goto: answer_with_ledger
            - text: "그림 속 빈 나비 자리를 손가락으로 짚는다"
              add: { people_support: 1, insight: 2 }
              goto: answer_with_absence

  answer_with_absence:
    actions:
      - sticker: { id: c5_peony, image: peony_painting_sticker, x: 50, y: 27, width: "clamp(190px, 23%, 360px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          text: "나비가 없다고 꽃이 빈 건 아닙니다. 신라 왕도 당이 그려 넣을 자리가 아니고요."
      - say:
          char: 당 사신.nervous
          camera: medium
          with: [덕만]
          text: "그림 한 장으로 목소리를 높이시는군요."
      - clearSticker: { id: c5_peony, leave: fadeOut }
      - goto: hidden_terms

  answer_with_patience:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만은 대꾸하지 않고 조건을 한 줄씩 받아 적었습니다. 사신이 잔을 드는 순간 마지막 종이를 낚아챘습니다. 혼인 조항 아래, 신라 성 하나를 당군 주둔지로 내준다는 작은 글씨가 숨어 있었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "성 하나를 내놓으라는 말이 여기 있었군요. 처음부터 이 줄을 읽었어야 했습니다."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "공주께서 끝까지 들으시는 동안 반대가 없었습니다. 배석한 귀족들은 이미 동의의 잔을 나누었지요."
      - say:
          channel: narration
          text: "덕만이 자기 잔을 내려다봤습니다. 입술이 닿은 자리만 은빛이 검게 변해 있었습니다. 혼인으로 권력을 잃을 가문은 덕만이 거절할 때를 대비해 독까지 준비해 두었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "모란 연회 기록 — 덕만 공주, 혼인 합의 직후 급서. 당과 신라 귀족 회의는 예정대로 혼인을 추진함."
      - gameOver:
          title: "운명 — 마지막 줄보다 늦은 대답"
          message: "덕만이 숨은 조건을 읽는 동안 침묵은 동의로 이용됐고, 혼인을 시기하면서도 그 권력을 탐낸 귀족은 거절에 대비한 독을 먹였습니다. 마지막 줄을 찾았을 때는 이미 잔도 비어 있었습니다."
          recoverToChoice: c5_first_reply

  answer_with_ledger:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          char: 덕만
          text: "남자 왕이 곡식을 만든다면 왜 이 장부는 비었습니까? 남편입니까, 원조입니까. 값을 붙여 하나만 답하세요."
      - say:
          char: 당 사신.nervous
          camera: medium
          with: [덕만]
          text: "공주께선 제국의 혼인을 장터 거래처럼 다루시는군요."
      - say:
          char: 덕만
          text: "장터 거래도 값은 밝힙니다. 값을 치를 아이들 이름부터 읽죠."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "제국의 문서 위에 그 명단을 올리셨군요. 이제 모욕의 값만 남았습니다."
      - say:
          channel: narration
          text: "사신이 자리를 뜨자 원조 곡식을 기다리던 귀족들이 문을 막았습니다. 그들은 전쟁을 피하려면 모욕한 사람 한 명만 내놓으면 된다고 서로를 설득했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "대당 사죄문 — 왕실의 뜻과 무관하게 사신을 모욕한 덕만 공주를 처형하고 그 목을 국경에 보냄."
      - gameOver:
          title: "운명 — 옳은 분노의 인질"
          message: "굶은 아이들의 이름은 진실했지만 사신의 숨은 조건을 먼저 무너뜨리지는 못했습니다. 전쟁을 두려워한 귀족들은 자신들의 창고 대신 덕만의 목을 사죄 값으로 내놓았습니다."
          recoverToChoice: c5_first_reply

  hidden_terms:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - music: night_road
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          camera: medium
          channel: action
          text: 휘장 뒤에서 비담이 술병을 내민다. 안에서 종이가 바스락거린다. 펴 보니 구휼미를 훔친 가문 옆에 답신 표시가 있다.
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "사신을 잡으면 오늘은 안전합니다. 쪽지를 돌려놓으면 뒤의 손을 보고요. 어느 쪽입니까?"
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "베끼고 원본은 돌려놔. 사신도 보내고, 뒤에서 받는 자도 본다."
      - goto: treaty_choice

  treaty_choice:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - char: { id: 당 사신, position: right }
      - choice:
          key: c5_diplomacy
          prompt: "혼인을 빼고 무엇을 주고받을까요?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "혼인 답을 미루고 국경 군량부터 받는다"
              set: { diplomacy_policy: armed_truce }
              add: { army_support: 2, nobles_support: 1, fear: 1 }
              goto: armed_truce
            - text: "혼인을 지우고 종자와 천문표를 맞바꾼다"
              set: { diplomacy_policy: equal_exchange }
              add: { people_support: 1, insight: 2, nobles_support: -1 }
              goto: equal_exchange
            - text: "무역권 하나로 귀족들의 서신을 산다"
              set: { diplomacy_policy: secret_trade }
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: secret_trade

  equal_exchange:
    actions:
      - say:
          char: 덕만
          text: "혼인은 뺍니다. 당은 종자와 천문표, 신라는 철과 항로. 이제 같은 값으로 말하죠."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서 이 문서를 찢으실 수도 있습니다."
      - say:
          char: 덕만
          text: "찢으셔도 됩니다. 조각은 상인들에게 보여 드리죠. 누가 손해인지 셈은 빠를 겁니다."
      - goto: banquet_test

  armed_truce:
    actions:
      - bg:
          id: "banquet_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "혼인 답을 미룬 종이에 군량 기한이 적혔습니다. 덕만은 주둔군 조항을 지우고 성 밖 검수선을 그었습니다."
      - say:
          char: "당 사신"
          camera: "medium"
          with:
            - "덕만"
          text: "곡식은 드리겠습니다. 다음 겨울에도 같은 답이면 값이 달라지겠지요."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "당 사신"
          text: "그때 다시 계산하죠. 오늘은 군사가 아니라 자루만 문을 넘습니다."
      - say:
          channel: "narration"
          text: "곡식이 국경을 넘었습니다. 춘추는 내년 협상란을 비워 두고, 운송에 딸린 천문표 사본을 챙겼습니다."
      - add:
          nobles_support: -1
      - say:
          channel: thought
          text: 겨울의 군량은 왔다. 내년 협상란은 아직 비어 있다. 시간을 번 만큼 다음 답도 준비해야 해.
      - goto: "banquet_test"

  secret_trade:
    actions:
      - bg:
          id: "shadow_corridor"
          transition: "fade"
          duration: 900
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "무역권 한 장이 탁자 밑으로 건너왔습니다. 비담은 서신을 천으로 펴고 사본 두 벌을 만들었습니다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "이름은 얻었습니다. 항구에서 내는 세금은 이제 저 가문 주머니로 갑니다."
      - say:
          char: "덕만.princess_sad"
          camera: "medium"
          with:
            - "비담"
          text: "기한은 한 해. 연장하려면 이 서신을 회의장에 내야 한다고 적어."
      - say:
          channel: "narration"
          text: "공모자들의 편지 사이에 다음 일식의 관측표가 끼어 있었습니다. 덕만은 표를 챙겼지만 바닷가 상인들의 세금은 오르게 됐습니다."
      - add:
          people_support: -2
          evidence: 1
      - say:
          channel: thought
          text: 편지는 얻었어. 세금을 더 낼 상인들은 여기 앉아 보지도 못했는데. 이 서명을 보여 줄 수 있을까?
      - goto: "banquet_test"

  banquet_test:
    actions:
      - char: { id: 당 사신, position: right }
      - say:
          channel: action
          text: 사신이 내 앞의 방석을 두드린다. 앉으라는 건가? 시선은 내 얼굴을 지나 무릎에서 멈춰 있다.
      - choice:
          key: c5_protocol
          prompt: "사신이 덕만에게 무릎을 꿇으라 합니다. 어떻게 답할까요?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "사신도 일으켜 같은 높이에서 절한다"
              add: { nobles_support: 1, people_support: 1, insight: 1 }
              goto: scentless_end
            - text: "문을 잠그고 사과문부터 쓰게 한다"
              goto: bad_hostage
            - text: "모란 그림을 말아 사신 품에 돌려준다"
              add: { fear: 2, people_support: 1 }
              goto: return_peony

  return_peony:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "그림은 돌려드립니다. 향기를 빼도 꽃은 남고, 남편을 더해도 신라 왕은 되지 않는다는 답과 함께요."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "그 답은 모욕으로 기록될 겁니다."
      - say:
          char: 덕만
          text: "그럼 혼인과 곡식 조건도 한 글자 빼지 말고 적으십시오."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "그림은 받겠습니다. 다만 황제의 선물을 되돌린 손이 무사할지는 신라 안에서 먼저 정하겠지요."
      - say:
          channel: narration
          text: "사신이 떠난 뒤 그림을 묶은 끈에서 하얀 가루가 떨어졌습니다. 덕만이 기침을 시작하자 혼인을 원하던 귀족들은 의원을 부르는 대신 연회장 문부터 잠갔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "모란 연회 변고 — 덕만 공주, 황제의 선물을 훼손한 뒤 원인 불명의 호흡 곤란으로 사망."
      - gameOver:
          title: "운명 — 돌려준 꽃의 독"
          message: "모란도를 그대로 돌려주는 공개 모욕은 혼인으로 이익을 얻을 귀족들에게 덕만을 없앨 명분을 줬습니다. 그림끈의 독가루가 퍼졌고, 문을 연 사람은 아무도 없었습니다."
          recoverToChoice: c5_protocol

  scentless_end:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          camera: wide
          channel: action
          text: 수레 소리가 궁문 밖으로 멀어진다. 모란 그림을 뒤집는다. 굳은 손가락을 하나씩 편다. 아직 손바닥이 아프다.
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "사신도 귀족도 오늘 밤은 못 자겠군요. 마음에 듭니다."
      - say:
          char: 덕만
          text: "좋아하긴 일러. 받아 낸 곡식과 표를 어디부터 쓸지 정해야 해."
      - say:
          channel: thought
          text: 다음 일식의 관측표를 얻었다. 꽃 때문에 시작한 싸움이 하늘의 숫자로 끝나다니. 날짜부터 읽어 볼까.
          with: []
          camera: wide
          continueLabel: 관측표를 펴고 밤을 지새운다
      - say:
          channel: action
          text: 다음 날 장터에 검은 부적이 걸린다. “덕만을 삼킬 날.” 어젯밤 읽었던 날짜와 같다. 내 손에서 종이가 구겨진다.
      - goto: /5.yaml

  bad_hostage:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 당 사신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "이 모욕은 그대로 돌려보내겠습니다. 오늘 누가 무릎 꿇었는지도 황제에게 전하십시오."
      - say:
          char: 당 사신.angry
          text: "문을 잠그는 순간부터 이 자리는 연회가 아니라 감옥입니다. 황제께 신라가 사신의 목을 겨눴다고 쓰겠습니다."
      - say:
          channel: narration
          text: "사흘 뒤 국경의 원조 곡식이 되돌아갔고 당의 군선이 동해에 나타났습니다. 사신을 반대하던 귀족들조차 전쟁 책임을 덕만에게 돌려 궁문을 안에서 열었습니다."
      - say:
          channel: record
          text: "당 조정 기록 — 신라 왕실의 공주가 황제의 사신을 모욕하고 억류함. 신라 귀족 연합이 덕만을 처형한 뒤 사죄 사절을 보냄."
      - gameOver:
          title: "운명 — 모욕의 값이 된 목"
          message: "사신을 가둬 사과를 받아낼 수는 있었지만 그가 대표하는 군대와 국내의 공포까지 가둘 수는 없었습니다. 귀족들은 나라를 살린다는 명분으로 덕만의 목을 먼저 내놓았습니다."
