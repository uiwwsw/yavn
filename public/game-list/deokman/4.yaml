script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: frontier
      - char:
          id: 유신
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제4장 — 궁 밖에서 왕을 만나다"
      - say:
          text: "국경 창고에는 곡식 삼백 섬이 남아 있었습니다. 성 안에는 군사 오백 명, 성문 밖에는 전쟁을 피해 온 백성 천칠백 명이 배급을 기다리고 있었습니다."
      - say:
          char: 유신
          framing: full
          with:
            - 덕만
          text: "군사에게만 주면 엿새를 버팁니다. 성밖 사람들과 나누면 모두 사흘입니다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 유신
          delivery: nervous
          text: "왕경에서 받은 보고에는 피난민이 천칠백이라고만 적혀 있었습니다. 아이가 몇이고, 아픈 사람이 몇인지는 없었어요."
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "아이 육백열둘, 걷지 못하는 사람 백아홉입니다. 원하시면 마을별 이름도 읽겠습니다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 유신
          text: "아니요. 먼저 배급 방법을 정하겠습니다. 그다음 이름은 제가 직접 듣겠습니다."
      - goto: grain_choice

  grain_choice:
    actions:
      - choice:
          key: c4_grain
          prompt: "곡식은 사흘치. 누구에게 줄까?"
          char: 덕만
          framing: closeup
          with:
            - 유신
          options:
            - text: "백성에게 푼다"
              add:
                people_support: 2
                legitimacy: 1
              goto: grain_people
            - text: "병사와 가족에게 준다"
              add:
                army_support: 2
                power: 1
              goto: grain_army
            - text: "모두 똑같이 나눈다"
              goto: go_22_fair_hunger
            - text: "배급을 끊는다"
              goto: go_23_full_princess

  grain_people:
    actions:
      - char:
          id: 월명
          position: right
          framing: full
      - say:
          char: 월명.warning
          framing: bust
          text: "백성부터 먹이겠다고 하셨군요. 사흘 뒤에도 보급길이 열리지 않으면 군사들이 먼저 반발할 겁니다."
      - say:
          char: 덕만
          framing: bust
          text: "압니다. 그래도 오늘 성문 앞에서 쓰러지는 아이를 두고 군량을 쌓아 둘 수는 없습니다."
      - say:
          char: 월명.warning
          framing: closeup
          text: "마음이 아니라 계획을 묻는 겁니다. 넷째 날에는 어떻게 하시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "오늘 밤 정찰대를 보내 보급로를 찾겠습니다. 실패하면 제 몫까지 군사에게 돌리고, 저는 백성과 같은 줄에 서겠습니다."
      - say:
          char: 월명
          framing: bust
          text: "그 답이면 됐습니다. 배급을 시작하지요."
      - goto: defense_choice

  grain_army:
    actions:
      - say:
          char: 유신
          framing: bust
          text: "병사와 가족을 한 줄에 세우라는 명령에 장수 셋이 반대했습니다. 가족 몫만큼 전투 식량이 줄어든다고 합니다."
      - say:
          char: 덕만
          framing: bust
          text: "병사들은 뭐라고 합니까?"
      - say:
          char: 유신
          framing: bust
          text: "아직 묻지 않았습니다. 지휘관들이 먼저 결정하려 했습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그럼 병사들에게 직접 물으세요. 자기 아이가 굶는 걸 보고도 혼자 두 끼를 먹겠다는 사람이 몇인지. 결과를 보고 다시 정하겠습니다."
      - say:
          char: 유신
          framing: bust
          text: "명령이 아니라 의견을 묻는 겁니까?"
      - say:
          char: 덕만
          framing: bust
          text: "먹는 사람의 일입니다. 한 번은 물어봐야죠."
      - goto: defense_choice

  defense_choice:
    actions:
      - bg: fortress
      - say:
          delivery: nervous
          text: "해 질 무렵, 적 기병이 둘로 갈라졌습니다. 한쪽은 주민이 남은 마을로, 다른 한쪽은 마지막 보급로를 지키는 요새로 향했습니다."
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "기병 이백을 한쪽에 보내면 다른 쪽에는 늦습니다. 병력을 나누면 둘 다 막기 어렵습니다. 지금 정해 주십시오."
      - say:
          char: 덕만
          framing: closeup
          text: "마을 사람들에게 피할 시간은 얼마나 있습니까?"
      - say:
          char: 유신
          framing: bust
          text: "반 시진도 없습니다. 선택하셔야 합니다."
      - choice:
          key: c4_defense
          prompt: "적이 둘로 갈라졌다. 어디로 갈까?"
          char: 덕만
          framing: closeup
          options:
            - text: "마을을 구한다"
              add:
                people_support: 2
                insight: 1
              goto: defense_village
            - text: "요새를 지킨다"
              add:
                army_support: 2
                yushin_trust: 1
              goto: defense_fortress
            - text: "병력을 반으로 가른다"
              goto: go_24_kind_failure
            - text: "전군 후퇴한다"
              goto: go_25_silla_abandoned

  defense_village:
    actions:
      - effect: impact
      - say:
          char: 유신
          framing: bust
          text: "주민 천이백삼십 명이 산길을 넘었습니다. 요새는 빼앗겼습니다. 전사 마흔일곱, 부상 예순둘입니다."
      - say:
          char: 덕만.sad
          framing: closeup
          delivery: sad
          text: "마흔일곱 명의 이름을 적어 주세요. 가족에게는 제가 직접 설명하겠습니다."
      - say:
          char: 유신.sad
          framing: bust
          text: "공주께서 설명한다고 돌아오는 사람은 없습니다."
      - say:
          char: 덕만.sad
          framing: bust
          text: "알아요. 그래도 누가 왜 그 명령을 내렸는지는 들어야 합니다. 살린 사람 수로 죽은 사람 이름을 지우고 싶지 않습니다."
      - goto: enemy_choice

  defense_fortress:
    actions:
      - say:
          text: "요새는 지켰습니다. 주민들은 산으로 피했지만 미처 짐을 챙기지 못했고, 빈 마을의 지붕은 새벽까지 탔습니다."
      - say:
          char: 덕만
          framing: closeup
          delivery: sad
          text: "부상자는요?"
      - say:
          char: 유신.sad
          framing: bust
          text: "군사는 열셋입니다. 마을 사람은 아직 확인하지 못했습니다. 요새를 지킨 덕분에 보급대는 내일 도착합니다."
      - say:
          char: 덕만.sad
          framing: bust
          text: "내일 곡식이 오면 가장 먼저 마을 사람들에게 천막과 그릇을 주세요. 오늘 지킨 길이 저 사람들에게도 자기 길이었다는 걸 보여 줘야 합니다."
      - goto: enemy_choice

  enemy_choice:
    actions:
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진.nervous
          framing: bust
          delivery: neutral
          text: "적장이 해 질 무렵 강가에서 만나자고 합니다. 호위 없이 나오면 사흘 동안 공격하지 않겠답니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
          text: "믿을 만한 약속인가?"
      - say:
          char: 아진.nervous
          framing: bust
          text: "아닙니다. 강 건너 궁수까지 백스무 걸음입니다. 공주께서는 활보다 느립니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그래도 사흘은 필요해. 만나기 전에 우리가 내놓을 것부터 정하자."
      - choice:
          key: c4_enemy
          prompt: "적이 강가에서 기다린다. 답은?"
          char: 덕만
          framing: closeup
          options:
            - text: "포로와 곡식을 바꾼다"
              add:
                insight: 1
                people_support: 1
              goto: enemy_negotiate
            - text: "보급대를 친다"
              add:
                army_support: 1
                power: 2
              goto: enemy_fight
            - text: "빈 수레로 속인다"
              add:
                insight: 2
                suspicion: 1
              goto: enemy_bluff
            - text: "혼자 항복한다"
              goto: go_26_hostage_princess

  enemy_negotiate:
    actions:
      - say:
          char: 아진.nervous
          framing: bust
          delivery: neutral
          text: "공주를 죽이라는 명령은 아직 남아 있습니다. 강가까지 서른두 걸음입니다. 제 앞에서 걷지 마십시오."
      - say:
          char: 덕만
          framing: bust
          text: "그건 경고인가, 협박인가?"
      - say:
          char: 아진.nervous
          framing: bust
          text: "저도 모르겠습니다. 공주께서 살아 돌아가야 제 가족을 찾겠다는 약속도 남으니까요."
      - say:
          char: 덕만
          framing: bust
          text: "그럼 내 옆에서 걸어. 서로 손이 보이는 곳에서. 협상이 끝나면 네 가족 이야기를 다시 하자."
      - goto: chapter4_end

  enemy_fight:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.sad
          framing: closeup
          delivery: sad
          text: "적 보급대는 끊겼고 적은 물러났습니다. 우리 전사자는 여든하나입니다."
      - say:
          char: 덕만
          framing: bust
          text: "……너무 많군요."
      - say:
          char: 유신.sad
          framing: bust
          text: "예. 제가 공격을 건의했고 공주께서 허락하셨습니다. 보고서에는 승리라고 쓰지 않겠습니다."
      - say:
          char: 덕만.sad
          framing: closeup
          text: "여든하나 이름을 모두 적어 주세요. 그 아래에 제 이름도 쓰세요. 이 명령을 누가 내렸는지 빠지지 않게."
      - goto: chapter4_end

  enemy_bluff:
    actions:
      - say:
          text: "쇠붙이를 매단 빈 수레 스무 대가 안개 속 돌길을 반복해 달렸습니다. 적은 대규모 증원군이 온 줄 알고 사흘을 물러났습니다."
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 덕만
          framing: bust
          text: "정찰병은 돌아왔습니까?"
      - say:
          char: 유신
          framing: bust
          text: "전원 돌아왔습니다. 적이 속았다는 걸 깨닫기 전에 보급로를 열 수 있습니다."
      - say:
          char: 덕만
          framing: bust
          text: "좋아요. 수레를 몬 사람들에게 먼저 먹이고 쉬게 하세요. 거짓말을 한 건 나지만, 목숨을 건 건 그 사람들이니까."
      - goto: chapter4_end

  chapter4_end:
    actions:
      - add:
          legitimacy: 2
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          text: "전투가 끝난 뒤 배급 줄이 다시 움직였습니다. 군사와 백성은 덕만에게 다음 명령을 물었고, 처음으로 몇몇 사람은 그녀를 공주가 아닌 ‘우리 지휘관’이라고 불렀습니다."
      - say:
          char: 유신.angry
          framing: bust
          text: "왕경에서 전갈이 왔습니다. 화백이 남자 후계자를 불러들였습니다. 이름은 진운입니다."
      - say:
          char: 덕만
          framing: bust
          text: "혼담 때 만난 그 사람입니까?"
      - say:
          char: 유신.angry
          framing: bust
          text: "예. 공주께서 국경에 있는 사이 칠숙이 지지 가문을 모았습니다. 지금 돌아가도 화백의 절반이 진운 편입니다."
      - say:
          char: 덕만
          framing: closeup
          text: "그럼 돌아가야죠. 이번에는 진운이 남의 문장 말고 자기 말을 할 수 있는지 확인하겠습니다."
      - say:
          text: "덕만은 국경에서 자신을 따르는 사람들을 얻었습니다. 그러나 왕경으로 돌아가는 길에는 이미 다른 후계자가 기다리고 있었습니다."

  go_22_fair_hunger:
    actions:
      - gameOver:
          title: "운명 22 — 공평한 굶주림"
          message: "모두가 똑같이 조금씩 받았다. 병사는 싸울 힘이 없었고 아이는 겨울을 날 만큼 먹지 못했다. 덕만의 공평함은 누구도 살리지 못했다."
  go_23_full_princess:
    actions:
      - gameOver:
          title: "운명 23 — 배부른 공주"
          message: "귀족의 창고는 지켜졌고 백성의 그릇은 비었다. 덕만의 마차가 마을을 지날 때 처음 날아온 돌은 작았다. 마지막 돌이 누구의 것이었는지는 기록되지 않았다."
  go_24_kind_failure:
    actions:
      - gameOver:
          title: "운명 24 — 착한 사람은 왕이 될 수 없다"
          message: "반으로 나뉜 군사는 마을에도 요새에도 늦었다. 모두를 버리지 않으려던 선택은 모두를 잃는 명령이 되었다."
  go_25_silla_abandoned:
    actions:
      - gameOver:
          title: "운명 25 — 신라가 버린 공주"
          message: "왕경의 명령은 오지 않았다. 후퇴로 열린 길을 따라 적군이 내려왔고, 덕만은 포로가 되어 신라의 협상 문서에 값으로 적혔다."
  go_26_hostage_princess:
    actions:
      - gameOver:
          title: "운명 26 — 좋은 인질"
          message: "적장은 약속대로 백성을 살렸다. 대신 덕만을 가장 좋은 인질로 왕경에 팔았다. 그녀의 자비는 신라를 구했지만 그녀를 왕위에서 지웠다."
