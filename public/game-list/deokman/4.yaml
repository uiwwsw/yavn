script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제4장 — 빈 그릇의 성"
      - say:
          delivery: calm
          text: "두 달 뒤, 631년 가을."
      - say:
          with: [덕만, 칠숙]
          text: "덕만은 남자 왕족을 세우려 한 밀약서를 내놓았지만, 이름이 적힌 귀족들은 모두 입을 닫았습니다."
      - say:
          with: [칠숙]
          text: "칠숙은 문책을 피한 채, 덕만을 수도에서 내보낼 지휘패를 들고 왔습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "누명을 벗은 상을 드리겠습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "국경의 지휘권입니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "상이라면서 돌아올 길은 막으시는군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "국경에서 살아 돌아오시면 그때 다시 뵙지요."
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: center
      - say:
          delivery: calm
          text: "수도를 떠난 지 열이틀째."
      - say:
          with: [덕만]
          delivery: calm
          text: "가을비가 그친 저녁, 덕만은 북쪽 국경 성에 닿았습니다."
      - say:
          with: [덕만]
          text: "환영 북 대신 빈 솥 긁는 소리가 났습니다."
      - say:
          text: "빈 그릇을 든 아이가 성문 앞에 쓰러졌습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "오늘만 두 번째입니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "제 수레의 곡식부터 내리세요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "군사만 먹이면 엿새입니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "모두 나누면 사흘입니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "성 밖에는 아이가 몇이나 있습니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "육백열둘입니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "병사도 백성도 굶고 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "직접 나가 보고 정하겠습니다."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "무엇을 정하시든, 먼저 죽부터 드십시오."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "오는 길에 흙먼지는 실컷 먹었습니다."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "절대로요."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "사흘 뒤에는 빈 솥만 남습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "먼저 오늘 굶어 쓰러질 사람부터 살립시다."
      - branch:
          cases:
            - when:
                var: yushin_trust
                op: gte
                value: 2
              goto: frontier_yushin_reserve
          default: grain_choice

  frontier_yushin_reserve:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "유신은 성벽 아래에서 군량 자루 열둘을 끌어냈습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "보고에는 없던 곡식이군요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "공주께서 제 경고를 믿어 주셨습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "저도 공주의 귀환을 믿었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "이 열두 자루면 하루는 더 버티겠네요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "누구부터 먹일지는 공주님이 정해 주십시오."
      - add: { army_support: 1 }
      - goto: grain_choice

  grain_choice:
    actions:
      - choice:
          key: c4_grain
          prompt: "남은 곡식을 누구에게 줄까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "백성부터 먹인다"
              add: { people_support: 1, legitimacy: 1 }
              goto: grain_people
            - text: "병사와 가족에게 준다"
              add: { army_support: 1, yushin_trust: 1 }
              goto: grain_army
            - text: "똑같이 나눈다"
              goto: go_22_fair_hunger
            - text: "배급을 멈춘다"
              goto: go_23_full_princess

  grain_people:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "덕만은 쓰러진 아이와 성 밖 피란민부터 배급 줄에 세웠습니다."
      - say:
          with: [덕만, 월명]
          text: "군사의 몫은 보급로가 열릴 때까지 줄였습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "넷째 날엔 군사가 반발합니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "오늘 쓰러진 아이를 먼저 살려요."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "넷째 날은요?"
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "오늘 밤 보급로를 찾겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "실패하면 제 몫의 곡식도 내놓죠."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "그럼 배급을 시작하겠습니다."
      - goto: defense_choice

  grain_army:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "덕만은 싸울 병사와 그 가족을 먼저 배급 줄에 세웠습니다."
      - say:
          with: [덕만, 유신]
          text: "병사들은 받은 죽의 절반을 집에 있는 가족에게 가져갔습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "장수 셋이 가족 배급에 반대합니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "병사들은 뭐랍니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "아직 묻지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "먹는 사람에게 먼저 물으세요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "명령 대신 의견을 묻습니까?"
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "한 번쯤은 그래야죠."
      - goto: defense_choice

  defense_choice:
    actions:
      - bg: fortress
      - camera: wide
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          text: "도착 이튿날 해 질 무렵, 적 기병이 두 갈래로 나뉘었습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "한쪽은 마을로 갑니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "다른 쪽은 마지막 요새로 갑니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "마을이 피할 시간은요?"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "한 시간도 없습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "마을엔 걷지 못하는 환자가 있습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "요새 뒤엔 내일 올 곡식이 있습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "살리지 못한 이들도 빠짐없이 알려 주세요."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "어느 쪽을 택해도 원망을 듣게 될 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그 원망도 제가 받아야죠."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "둘 다 제 백성인데."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "그래도 하나를 먼저 골라야 합니다."
      - choice:
          key: c4_defense
          prompt: "어디를 먼저 지킬까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "마을을 구한다"
              add: { people_support: 1 }
              goto: defense_village
            - text: "요새를 지킨다"
              add: { army_support: 1, power: 1 }
              goto: defense_fortress
            - text: "병력을 반씩 나눈다"
              goto: go_24_kind_failure
            - text: "전군 후퇴한다"
              goto: go_25_silla_abandoned

  defense_village:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "주민 천이백삼십 명을 살렸습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "요새는 잃었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          delivery: sad
          text: "죽은 군사는요?"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "<speed=18>마흔일곱입니다.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "이름을 모두 적어 주세요."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          delivery: calm
          text: "<speed=19>가족에겐 제가 말하겠습니다.</speed>"
      - goto: enemy_choice

  defense_fortress:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          text: "요새는 지켰고, 빈 마을은 밤새 탔습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "마을 사람들은요?"
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "산으로 피했습니다. 아직 모릅니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "내일 곡식은 들어옵니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "첫 수레는 마을로 보내세요."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "오늘 지킨 길로 마을에도 곡식을 보낼 수 있으니까."
      - goto: enemy_choice

  enemy_choice:
    actions:
      - bg: frontier
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          delivery: calm
          text: "전투 다음 날 한낮, 화살 한 대가 덕만 앞에 꽂혔습니다."
      - say:
          text: "화살엔 아이의 짚신 한 짝이 묶여 있었습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "제 동생의 남은 한 짝입니다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [아진]
          text: "이번엔 적장의 말을 전하러 왔군요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "해 질 때 강가로 나오랍니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "혼자 오면 사흘간 공격을 멈추겠답니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "믿을 만합니까?"
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "못 믿습니다. 적의 화살이 공주님보다 빠르니까요."
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "오른쪽 신발 끈이 풀렸습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "제가 넘어질까 걱정합니까?"
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "넘어져 다치게 하란 명령은 없었습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "동생을 되찾고 싶습니까?"
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "원합니다. 그래서 공주를 보내기 싫습니다."
      - choice:
          key: c4_enemy
          prompt: "적의 진격을 어떻게 멈출까?"
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "포로와 곡식을 바꾼다"
              add: { legitimacy: 1, people_support: 1 }
              goto: enemy_negotiate
            - text: "적 보급대를 친다"
              add: { army_support: 1, power: 1 }
              goto: enemy_fight
            - text: "빈 수레로 속인다"
              add: { insight: 1, yushin_trust: 1 }
              goto: enemy_bluff
            - text: "혼자 항복한다"
              goto: go_26_hostage_princess

  enemy_negotiate:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          with: [덕만, 아진]
          text: "해가 기울자 두 사람은 포로 명단과 곡식 수레를 들고 강가로 향했습니다."
      - say:
          with: [덕만, 아진]
          text: "멀리 갈대밭에서 활시위가 두 사람을 따라 움직였습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "제 앞에서 걷지 마십시오."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "경고입니까, 협박입니까?"
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "저도 모르겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "살아야 제 가족도 찾으시니까요."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "그럼 내 옆에서 걸어요."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "서로 손이 보이게."
      - goto: chapter4_end

  enemy_fight:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "적은 물러났습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "<speed=18>우리 전사자는 여든하나입니다.</speed>"
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "승리라고 쓰지 마세요."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "저도 그럴 생각입니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "마지막 줄에 제 명령이었다고 쓰세요."
      - goto: chapter4_end

  enemy_bluff:
