script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제4장 — 빈 그릇의 성"
      - say:
          with: [덕만, 칠숙]
          text: "덕만은 잠긴 방의 살인 누명까지 벗었지만, 귀족들이 남자 왕족을 세우려 했다는 약속문을 손에 넣었습니다."
      - say:
          with: [칠숙]
          text: "칠숙은 그 증거를 빼앗는 대신 덕만을 수도에서 떼어 놓기로 했습니다. 이미 국경 지휘패까지 준비해 둔 뒤였습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "누명을 벗은 상을 드리겠습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "국경의 지휘권입니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "상이라면서 수도 패는 빼앗는군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "백성이 놓아줄 때 돌아오십시오."
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: center
      - say:
          delivery: calm
          text: "열이틀 뒤, 덕만은 국경 성에 닿았습니다."
      - say:
          with: [덕만]
          text: "환영 북 대신 빈 솥 긁는 소리가 났습니다."
      - say:
          text: "빈 그릇을 든 아이가 성문 앞에 쓰러졌습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "오늘만 두 번째입니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "제 수레의 곡식부터 내리세요."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "군사만 먹이면 엿새입니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "모두 나누면 사흘입니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "성밖 아이는 몇입니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "육백열둘입니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "병사도 백성도 굶고 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "숫자 뒤에 숨진 않겠습니다."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "결정 뒤엔 죽부터 드십시오."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "흙먼지는 한 끼로 안 칩니까?"
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "절대로요."
      - say:
          with: [덕만]
          text: "병사만 먹이면 성은 엿새를 버티지만 성밖 사람들이 먼저 죽습니다. 모두에게 똑같이 나누면 필요한 양이 다른 사람부터 쓰러집니다."
      - say:
          with: [덕만]
          text: "덕만에게 남은 곡식은 사흘치뿐이었습니다. 누구를 먼저 살리느냐가 곧 누구의 원망을 먼저 받느냐는 뜻이었습니다."
      - branch:
          cases:
            - when:
                var: yushin_trust
                op: gte
                value: 2
              goto: frontier_yushin_reserve
          default: grain_choice

  frontier_yushin_reserve:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "유신은 성벽 아래에서 군량 자루 열둘을 끌어냈습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "보고에는 없던 곡식이군요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "공주께서 제 경고를 믿어 주셨습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "저도 공주의 귀환을 믿었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "열둘로 하루를 더 사겠네요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "누구의 하루인지는 정하셔야 합니다."
      - add: { army_support: 1 }
      - goto: grain_choice

  grain_choice:
    actions:
      - choice:
          key: c4_grain
          prompt: "남은 곡식을 누구에게 줄까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "백성부터 먹인다"
              add: { people_support: 1, legitimacy: 1 }
              goto: grain_people
            - text: "병사와 가족에게 준다"
              add: { army_support: 1, yushin_trust: 1 }
              goto: grain_army
            - text: "똑같이 나눈다"
              goto: go_22_fair_hunger
            - text: "배급을 멈춘다"
              goto: go_23_full_princess

  grain_people:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "덕만은 쓰러진 아이와 성밖 피란민부터 배급 줄에 세웠습니다. 군사 몫은 보급로가 열릴 때까지 줄였습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "넷째 날엔 군사가 반발합니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "오늘 쓰러진 아이를 먼저 살려요."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "넷째 날은요?"
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "오늘 밤 보급로를 찾겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "실패하면 제 몫도 내놓죠."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "그럼 배급을 시작하겠습니다."
      - goto: defense_choice

  grain_army:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "덕만은 싸울 병사와 그 가족을 먼저 먹이기로 했습니다. 가족이 굶는 군사는 성벽을 지킬 수 없다고 보았습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "장수 셋이 가족 배급에 반대합니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "병사들은 뭐랍니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "아직 묻지 않았습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "먹는 사람에게 먼저 물으세요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "명령 대신 의견을 묻습니까?"
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "한 번쯤은 그래야죠."
      - goto: defense_choice

  defense_choice:
    actions:
      - bg: fortress
      - camera: wide
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          text: "이튿날 저녁. 적 기병이 둘로 갈라졌습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "한쪽은 마을로 갑니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "다른 쪽은 마지막 요새로 갑니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "마을이 피할 시간은요?"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "한 시간도 없습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "마을엔 걷지 못하는 환자가 있습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "요새 뒤엔 내일 올 곡식이 있습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "놓친 사람 이름까지 보고하세요."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "원망은 제가 듣겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그것도 제 몫입니다."
      - say:
          with: [덕만]
          text: "마을을 지키면 사람을 살릴 수 있지만 마지막 요새와 보급로를 잃습니다. 요새를 지키면 내일의 곡식은 오지만 오늘 밤 마을이 탑니다."
      - say:
          with: [덕만, 유신]
          text: "병력을 나누면 둘 다 지킬 가능성은 생깁니다. 그러나 굶은 병사로 두 전장을 버틸 여유는 없었습니다."
      - choice:
          key: c4_defense
          prompt: "어디를 먼저 지킬까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "마을을 구한다"
              add: { people_support: 1 }
              goto: defense_village
            - text: "요새를 지킨다"
              add: { army_support: 1, power: 1 }
              goto: defense_fortress
            - text: "병력을 반씩 나눈다"
              goto: go_24_kind_failure
            - text: "전군 후퇴한다"
              goto: go_25_silla_abandoned

  defense_village:
    actions:
      - bg: village
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "주민 천이백삼십 명을 살렸습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "요새는 잃었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          delivery: sad
          text: "죽은 군사는요?"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "<speed=18>마흔일곱입니다.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "이름을 모두 적어 주세요."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          delivery: calm
          text: "<speed=19>가족에겐 제가 말하겠습니다.</speed>"
      - goto: enemy_choice

  defense_fortress:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          text: "요새는 지켰고, 빈 마을은 밤새 탔습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [유신]
          text: "마을 사람들은요?"
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "산으로 피했습니다. 아직 모릅니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "내일 곡식은 들어옵니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "첫 수레는 마을로 보내세요."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "오늘 지킨 길이 그들 길이기도 하니까."
      - goto: enemy_choice

  enemy_choice:
    actions:
      - bg: frontier
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          delivery: calm
          text: "다음 날, 화살 한 대가 덕만 앞에 꽂혔습니다."
      - say:
          text: "화살엔 아이의 짚신 한 짝이 묶여 있었습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "제 동생의 남은 한 짝입니다."
      - say:
          char: 덕만.angry
          camera: medium
          with: [아진]
          text: "이번엔 적장의 말을 전하러 왔군요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "해 질 때 강가로 나오랍니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "혼자 오면 사흘간 멈춘답니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "믿을 만합니까?"
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "아뇨. 활보다 공주님이 느립니다."
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "오른쪽 신발 끈이 풀렸습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "제가 넘어질까 걱정합니까?"
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "넘어져 죽는 건 제 명령이 아닙니다."
      - say:
          with: [덕만, 아진]
          text: "적장은 아진의 가족을 미끼로 덕만을 강가에 끌어내려 했습니다. 협상은 사람을 돌려받을 기회이자 매복으로 들어가는 길이었습니다."
      - say:
          with: [덕만]
          text: "싸우면 주도권은 얻지만 또 이름을 적어야 합니다. 속이면 피를 줄일 수 있지만 실패할 때 물러날 길이 없었습니다."
      - choice:
          key: c4_enemy
          prompt: "적의 틈을 어떻게 만들까?"
          char: 덕만
          camera: close
          with: [아진]
          options:
            - text: "포로와 곡식을 바꾼다"
              add: { legitimacy: 1, people_support: 1 }
              goto: enemy_negotiate
            - text: "적 보급대를 친다"
              add: { army_support: 1, power: 1 }
              goto: enemy_fight
            - text: "빈 수레로 속인다"
              add: { insight: 1, yushin_trust: 1 }
              goto: enemy_bluff
            - text: "혼자 항복한다"
              goto: go_26_hostage_princess

  enemy_negotiate:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 아진
          position: right
      - say:
          with: [덕만, 아진]
          text: "해가 기울자 덕만과 아진은 포로 명단과 곡식 수레를 들고 강가로 향했습니다. 멀리 갈대밭에서 활시위가 따라 움직였습니다."
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "제 앞에서 걷지 마십시오."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "경고입니까, 협박입니까?"
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "저도 모르겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "살아야 제 가족도 찾으시니까요."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "그럼 내 옆에서 걸어요."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "서로 손이 보이게."
      - goto: chapter4_end

  enemy_fight:
    actions:
      - bg: fortress
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "적은 물러났습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "<speed=18>우리 전사자는 여든하나입니다.</speed>"
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "승리라고 쓰지 마세요."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "저도 그럴 생각입니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "이름 아래 제 이름도 쓰세요."
      - goto: chapter4_end

