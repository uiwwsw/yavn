script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "제4장 — 빈 그릇의 성"
      - say:
          delivery: calm
          text: "두 달 뒤, 631년 가을."
      - say:
          with: [덕만, 칠숙]
          text: "덕만이 비밀 문서를 공개한 뒤 두 달이 지났지만, 거기에 이름을 올린 귀족들은 입을 다물었습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "전하께서 출발을 두 달이나 늦추셨습니다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "빈손으로 보내려 한 건 누구입니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "귀족들 수레가 움직이지 않았을 뿐입니다."
      - char:
          id: 진평왕
          position: center
      - say:
          with: [진평왕, 덕만, 칠숙]
          wait: 650
          text: "진평왕은 의자에서 일어나지 못한 채 수레 목록을 펼쳤습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "출발을 늦춘 것은 나다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "빈손으로 국경에 보낼 수는 없었다."
      - say:
          char: 진평왕
          camera: medium
          with: [칠숙]
          text: "움직이지 않은 집의 이름을 읽어라."
      - say:
          char: 칠숙.smile
          camera: close
          with: [진평왕]
          text: "전하, 모두 조정의 큰 기둥들입니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          wait: 650
          text: "왕명을 막은 기둥은 썩은 기둥이다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "그 이름을 조정 기록에 남겨라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그 기록이 국경 사람을 먹이지는 못합니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "그래서 왕실 창고를 먼저 열었다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "세 마을과 북쪽 성으로 이미 보냈다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "남은 것은 네 일행의 길양식뿐이다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 진평왕]
          text: "누명을 벗은 공주께 좋은 상이군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "북쪽 국경의 지휘권입니다."
      - say:
          char: 진평왕
          camera: medium
          with: [칠숙]
          text: "국경을 상이라 부르지 마라."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "나라의 성을 지키는 일이다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "쫓아내려던 제 손에 성의 열쇠가 들어왔군요."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "군사와 창고의 명령은 모두 네 것이다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "보고서보다 빈 그릇을 먼저 보아라."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "유신의 보고를 듣되 결정은 네가 내려라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "성을 지키고 사람들과 돌아오겠습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          wait: 750
          text: "살아 돌아와 내게 보고하라."
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: center
      - char:
          id: 천명
          position: right
      - say:
          with: [덕만, 천명]
          text: "천명은 왕의 약과 덕만의 약을 서로 다른 주머니에 나눠 담았습니다."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "아버지 약을 왜 내 짐에 넣어?"
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "돌아오는 길에 모자라면 안 되잖아."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니, 아직도 무서워?"
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "응. 그래도 가방은 쌀 수 있어."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          wait: 750
          text: "그러니까 살아서 다시 풀어 줘."
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "국경에서 살아남으시면 다시 뵙지요."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "돌아와서 누가 막았는지부터 밝히겠습니다."
      - say:
          with: [덕만, 칠숙]
          wait: 650
          text: "덕만에게는 성에 나눌 몫 없이 12일 길에 쓸 곡식만 주어졌습니다."
      - bg: frontier
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          text: "길을 나선 지 일곱째 날, 가을비에 뒤 수레의 차축이 부러졌습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "짐을 줄이지 않으면 고개를 못 넘습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "곡식과 약은 어느 쪽도 버릴 수 없습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "비단 장막과 놋그릇부터 내리세요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "공주의 위엄을 보일 물건들입니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "굶는 성에서 빈 놋그릇은 위엄이 아닙니다."
      - say:
          with: [덕만, 유신]
          wait: 700
          text: "덕만은 의장용 장막과 그릇을 비우고 곡식과 약을 한 수레에 다시 실었습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "이제 공주 행렬처럼 보이지 않을 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          wait: 700
          text: "성에 도착한 뒤 무엇을 했는지로 보이면 됩니다."
      - bg: fortress
      - camera: medium
      - char:
          id: 덕만
          position: center
      - say:
          delivery: calm
          wait: 700
          text: "수도를 떠난 지 12일째 되는 날."
      - say:
          with: [덕만]
          delivery: calm
          wait: 800
          text: "12일 동안 가을비를 맞은 끝에 북쪽 성이 보였습니다."
      - say:
          with: [덕만]
          text: "성에 들어서자 빈 솥을 긁는 소리만 들렸습니다."
      - effect: impact
      - say:
          wait: 750
          text: "빈 그릇을 든 아이가 덕만의 말 앞에서 그대로 쓰러졌습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "오늘만 벌써 두 번째입니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "사람들은 공주님이 보고만 가실 줄 압니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "저 아이가 일어나기 전에는 못 갑니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "제 짐 수레부터 여세요. 곡식이 있습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "병사만 먹이면 6일을 버팁니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "성 안팎에 나누면 3일입니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "성 밖에서 굶고 있는 아이가 몇 명입니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          wait: 650
          text: "확인된 아이만 612명입니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "병사들도 똑같이 굶고 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "명단만 보지 말고 사람들을 직접 본 뒤 정하겠습니다."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "그전에 죽부터 몇 숟갈 드십시오."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "오는 길에 흙먼지는 실컷 먹었습니다."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "흙먼지는 끼니가 아닙니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "3일 뒤면 솥 바닥도 긁을 게 없습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          wait: 750
          text: "그럼 오늘 밤을 못 넘길 사람부터 살립시다."
      - branch:
          cases:
            - when:
                var: yushin_trust
                op: gte
                value: 2
              goto: frontier_yushin_reserve
          default: grain_choice

  frontier_yushin_reserve:
    actions:
      - bg: fortress
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "유신은 무너진 성벽 밑에서 비상 식량 12자루를 끌어냈습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "보고서에는 없던 곡식이네요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          wait: 650
          text: "공주님이 제 경고를 믿어 주셨으니까요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          wait: 850
          text: "저도 공주님이 돌아오실 거라 믿었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "이 12자루면 하루를 더 버틸 수 있겠네요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "누구에게 먼저 나눌지 정해 주십시오."
      - add: { army_support: 1 }
      - goto: grain_choice

  grain_choice:
    actions:
      - choice:
          key: c4_grain
          prompt: "3일치 곡식 앞에 빈 그릇이 늘어섭니다."
          char: 덕만
          camera: close
          with: []
          options:
            - text: "백성부터 먹인다"
              add: { people_support: 1, legitimacy: 1 }
              goto: grain_people
            - text: "병사와 가족에게 준다"
              add: { army_support: 1, yushin_trust: 1 }
              goto: grain_army
            - text: "똑같이 나눈다"
              goto: go_22_fair_hunger
            - text: "배급을 멈춘다"
              goto: go_23_full_princess

  grain_people:
    actions:
      - bg: village
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 월명
          position: right
      - say:
          with: [덕만, 월명]
          text: "덕만은 쓰러진 아이와 성 밖 피란민을 먼저 줄에 세웠습니다."
      - say:
          with: [덕만, 월명]
          text: "보급로가 열릴 때까지 군사의 그릇은 절반만 채웠습니다."
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "4일째가 되면 병사들이 칼을 들 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [월명]
          text: "오늘은 이 아이가 먼저입니다."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "그럼 4일째는 누가 책임집니까?"
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "제가 오늘 밤 보급로를 열겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "못 열면 제 몫부터 끊으세요."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "알겠습니다. 지금 죽을 올리겠습니다."
      - goto: defense_choice

  grain_army:
    actions:
      - bg: fortress
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "덕만은 싸울 병사와 성 안의 가족을 먼저 줄에 세웠습니다."
      - say:
          with: [덕만, 유신]
          text: "병사들은 자기 몫의 죽을 절반 남겨 가족에게 들고 갔습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "장수 3명이 가족에게 나누는 일을 반대합니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "죽을 받은 병사들은 뭐라 합니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "아직 장수들에게만 물었습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그릇을 든 사람에게 먼저 물으세요."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "병사들에게 직접 묻겠다는 말씀입니까?"
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "배급 방법까지 장수들끼리 정할 수는 없으니까요."
      - goto: defense_choice

  defense_choice:
    actions:
      - bg: fortress
      - camera: medium
      - effect: pulse
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          wait: 650
          text: "도착한 다음 날 해 질 무렵, 적 기병이 성 아래서 둘로 갈라졌습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "수도에서 온 명령은 성 밖으로 나가지 말라 합니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "그러면 마을은 버리라는 말이군요."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "적도 그 명령을 아는 듯 움직입니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "칠숙이 이 명령까지 미리 심어 두었군요."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "기병 절반이 마을로 향합니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "나머지는 마지막 요새로 갑니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "마을을 비울 시간은 얼마나 됩니까?"
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "한 시간도 채 남지 않았습니다."
      - char:
          id: 월명
          position: right
      - say:
          char: 월명.warning
          camera: medium
          with: [덕만]
          text: "마을에는 제 발로 못 걷는 환자도 있습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
