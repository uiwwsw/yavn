script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: title_palace
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          wait: 800
          text: "제4장 — 북쪽의 겨울"
      - say:
          delivery: calm
          text: "두 달 뒤, 631년 가을이었습니다."
      - say:
          with: [진평왕, 덕만]
          text: "북쪽으로 떠날 수레에는 비단 대신 곡식이, 제사용 그릇 대신 약과 바퀴 부품이 실렸습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "성 안의 군사와 성 밖의 백성이 같은 곡식을 기다린다. 한쪽만 왕의 사람이라 여기지 마라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "받은 사람과 받지 못한 사람까지 모두 적겠습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "수도가 보고 싶어도 장부를 먼저 끝내라. 돌아오겠다는 약속은 하지 마라. 해야 할 일을 마치고 돌아와라."
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "예, 전하. 끝낸 뒤 돌아오겠습니다."
      - bg: princess_chamber
      - camera: medium
      - char: { id: 천명, position: right }
      - char: { id: 덕만, position: left }
      - say:
          char: 천명
          camera: medium
          with: [덕만]
          text: "아버지 약과 네 약은 다른 색 보자기에 넣었어. 바쁜 척하다 바꿔 먹지 마."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니가 매번 확인할 수 없으니 이번에는 제가 색을 외울게요."
      - say:
          char: 천명.sad
          camera: close
          with: [덕만]
          text: "다친 사람은 데려와. 죽은 척 용감해지지는 말고."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "살아서 혼날게."
      - bg: frontier
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - char: { id: 아진, position: center }
      - say:
          delivery: calm
          text: "길을 나선 지 일곱째 날, 산길 한가운데서 곡식 수레의 앞바퀴가 부러졌습니다."
      - say:
          with: [덕만, 유신, 아진]
          text: "바퀴 축에는 칼집이 나 있었고, 갈라진 나무 속에서 붉은 매듭이 나왔습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "우연히 부러진 것이 아닙니다. 뒤따르는 수레도 해 지기 전에 같은 비탈을 지나야 합니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "이 매듭은 북쪽 거점에서 길이 막혔다는 신호입니다. 제 동생이 묶었을 수도 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신, 아진]
          text: "수레를 가볍게 하고, 사람과 곡식을 해 지기 전에 비탈 아래로 옮겨야 합니다."
      - choice:
          key: c4_road
          prompt: "부러진 수레에서 무엇을 먼저 옮기겠습니까?"
          char: 덕만
          camera: close
          with: [유신, 아진]
          options:
            - text: "곡식과 약부터 나른다"
              add: { people_support: 1, insight: 1 }
              goto: road_supplies
            - text: "짐을 병사들과 나눠 든다"
              add: { army_support: 1, yushin_trust: 1 }
              goto: road_shared
            - text: "약을 버리고 속도를 낸다"
              goto: go_21_fever_road
            - text: "마을 소를 빼앗아 끈다"
              goto: go_22_empty_field

  road_supplies:
    actions:
      - bg: frontier
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만은 의식에 쓸 천막과 놋그릇을 길가에 내려놓고 곡식과 약을 작은 꾸러미로 나눴습니다."
      - say:
          char: 소원.angry
          camera: medium
          with: [덕만]
          text: "공주님 옷상자도 내려놓을게요. 곡식보다 귀한 옷은 없잖아요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "겨울 겉옷 한 벌은 남겨 줘. 얼어 죽으면 언니가 더 크게 혼낼 거야."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "그 정도 계산은 하셔서 다행이네요."
      - goto: checkpoint

  road_shared:
    actions:
      - bg: frontier
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 곡식 자루를 작은 포대로 나누고 자기 어깨에도 하나를 올렸습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "공주님이 들면 병사들이 쉬지 못합니다. 제게 주십시오."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "그러면 다섯 걸음마다 교대하죠. 지친 사람을 숨기지 않게 제가 먼저 내려놓겠습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "명령보다 나은 신호입니다."
      - goto: checkpoint

  checkpoint:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          delivery: calm
          text: "해가 지기 전, 행렬은 버려진 옛 초소에 닿았습니다."
      - say:
          with: [덕만, 아진]
          text: "초소 안에는 끊긴 붉은 매듭과 수레가 지나간 날짜를 벽에 새긴 젊은이가 숨어 있었습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          wait: 800
          text: "제 동생입니다. 살아 있습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [아진]
          text: "먼저 물과 음식을 주세요. 증언은 숨을 고른 뒤 받습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "저 아이는 수레를 서쪽 길로 돌리라는 표시를 새기게 했답니다. 거부하면 마을 사람을 잡아갔고요."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진과 동생이 한 일도, 강요한 사람의 일도 따로 적겠습니다."
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "도망치지 않고 수도로 돌아가 재판을 받겠습니다."
      - branch:
          cases:
            - when:
                var: ajin_trust
                op: gte
                value: 2
              goto: checkpoint_testifies
          default: checkpoint_guarded

  checkpoint_testifies:
    actions:
      - bg: frontier
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "공주님이 제 증언을 먼저 지켜 주셨습니다. 이제 제가 숨긴 것까지 모두 내놓겠습니다."
      - say:
          with: [덕만, 아진]
          text: "아진은 동생이 새긴 수레 날짜와 자신이 받은 명령서를 한 보자기에 넣었습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "두 사람의 말이 서로 다른 곳은 지우지 마세요. 다른 기억까지 그대로 재판에 올립니다."
      - add: { ajin_trust: 1, legitimacy: 1 }
      - goto: fortress_arrival

  checkpoint_guarded:
    actions:
      - bg: frontier
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          char: 아진.nervous
          camera: medium
          with: [덕만]
          text: "동생은 구했지만 아직 공주님을 모두 믿지는 못합니다. 명령서는 제가 들고 가겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "좋습니다. 유신의 호위만 곁에 두고, 봉인은 아진이 직접 지키세요."
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "수도에 도착하면 제 손으로 왕 앞에 내놓겠습니다."
      - add: { legitimacy: 1 }
      - goto: fortress_arrival

  fortress_arrival:
    actions:
      - bg: fortress
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          delivery: calm
          text: "수도를 떠난 지 12일째 되는 날, 덕만의 행렬이 북쪽 성에 도착했습니다."
      - say:
          with: [덕만, 유신]
          text: "성문 안에는 이틀째 배급을 받지 못한 병사들이, 성문 밖에는 마을을 떠난 사람들이 같은 자루를 바라보고 있었습니다."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "남은 곡식은 모두에게 하루씩 나누면 끝입니다. 다음 수레는 나흘 뒤에야 옵니다."
      - char: { id: 소원, position: right }
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "성 밖 아이가 배급표를 쥔 채 쓰러졌어요. 어제부터 물만 마셨대요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "월명에게 데려가. 그리고 제 식량도 배급 장부에 올려."
      - char: { id: 유신, position: right }
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "병사 몫을 줄이면 밤 경계를 설 힘이 없습니다. 백성 몫을 줄이면 내일 아침을 못 넘깁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "누구에게 얼마를 주는지 문 앞에 걸겠습니다. 숨긴 자루가 없다는 것부터 보여야 합니다."
      - choice:
          key: c4_ration
          prompt: "나흘을 버틸 곡식을 어떻게 나누겠습니까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "모두에게 같은 첫 몫을 준다"
              add: { people_support: 1, legitimacy: 1 }
              goto: ration_equal
            - text: "병사 가족을 함께 먹인다"
              add: { army_support: 1, people_support: 1 }
              goto: ration_households
            - text: "병사에게 전부 준다"
              goto: go_23_closed_gate
            - text: "성 밖에 전부 푼다"
              goto: go_24_empty_wall

  ration_equal:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만은 아이와 병사에게 같은 크기의 첫 몫을 주고, 일할 수 있는 사람에게 둘째 몫을 정했습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "공주님 이름도 첫 몫 줄에 적었어요. 줄 맨 끝입니다."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          wait: 900
          unskippable: true
          text: "<speed=18>굶은 사람에게 줄을 지키라 말하려면, 제 그릇도 그 줄에 놓여야 합니다.</speed>"
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "그래도 쓰러질 때까지 기다리지는 마세요. 왕명보다 제가 먼저 끌고 올 거예요."
      - goto: siege_warning

  ration_households:
    actions:
      - bg: fortress
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 병사의 가족과 피란민을 섞어 열 집씩 한 솥을 쓰게 했습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "병사가 자기 가족의 몫을 확인하면 성 밖 사람의 자루도 지킬 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "성 안과 밖을 장부에서 먼저 나누지 맙시다. 같은 불 앞에 앉은 사람으로 적으세요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "오늘 밤 경계 인원도 지킬 수 있습니다."
      - goto: siege_warning

  siege_warning:
    actions:
      - bg: fortress
      - camera: wide
      - effect: embers
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - char: { id: 아진, position: center }
      - say:
          delivery: calm
          text: "도착한 다음 날 해 질 무렵, 서쪽 마을에서 불길이 올랐습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만, 아진]
          text: "적의 기병이 곡식 수레가 늦은 틈을 알고 내려왔습니다. 성문을 닫으면 성은 지키지만 마을 사람들이 갇힙니다."
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "마른 개울을 따라가면 마을 뒤로 갈 수 있습니다. 수레를 빼돌리던 길이라 적은 아직 모릅니다."
      - say:
          char: 덕만
          camera: close
          with: [유신, 아진]
          text: "제가 한곳을 고르면 다른 곳을 누가 맡을지 지금 정해야 합니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "명령만 분명하면 성과 길을 나누어 지킬 수 있습니다."
      - choice:
          key: c4_siege
          prompt: "적의 기병이 마을과 성 사이로 들어옵니다."
          char: 덕만
          camera: close
          with: [유신, 아진]
          options:
            - text: "마을 사람의 퇴로를 연다"
              add: { people_support: 2, yushin_trust: 1 }
              goto: siege_evacuate
            - text: "유신에게 성을 맡긴다"
              add: { army_support: 2, power: 1 }
              goto: siege_hold
            - text: "빈 수레로 적을 돌린다"
              add: { insight: 2, army_support: 1 }
              goto: siege_decoy
            - text: "기병 앞으로 돌격한다"
              goto: go_25_field_charge

  siege_evacuate:
    actions:
      - bg: village
      - camera: wide
      - effect: pulse
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          with: [덕만, 아진]
          text: "덕만은 아진이 알려 준 마른 개울로 사람들을 빼내고, 마지막까지 방패 뒤에 남았습니다."
      - say:
          char: 아진.angry
          camera: medium
          with: [덕만]
          text: "마지막 가족이 지났습니다. 이제 공주님이 먼저 움직이십시오."
      - say:
          char: 덕만
          camera: close
          with: [아진]
          text: "아진도 함께 갑니다. 이번에는 누구도 명령 뒤에 버리지 않겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "그 말을 믿고 등을 보이겠습니다."
      - goto: aftermath

  siege_hold:
    actions:
      - bg: fortress
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "유신은 성을 지키고, 저는 아진과 마을 퇴로를 열겠습니다. 서로의 신호가 끊기면 해 뜰 때 이곳에서 만납니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "한쪽이 늦어도 다른 쪽이 자리를 버리지 않는 명령입니까?"
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "예. 기다리는 책임까지 제가 지겠습니다."
      - say:
          with: [덕만, 유신]
          text: "새벽이 오자 성벽의 횃불과 마른 개울의 신호불이 같은 때에 올랐습니다."
      - goto: aftermath

  siege_decoy:
    actions:
      - bg: frontier
      - camera: wide
      - effect: embers
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 빈 수레에 횃불을 달아 곡식 행렬처럼 보이게 하고, 병사 둘만 멀리서 끌게 했습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "적 기병이 수레를 따라 서쪽으로 빠집니다. 두 병사는 개울에서 말을 버리고 돌아올 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "미끼가 된 사람의 이름도 전투 기록 첫 줄에 적으세요. 살아 돌아온 뒤 공을 받게 합니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "그들이 목숨을 건 이유까지 남기겠습니다."
      - goto: aftermath

  aftermath:
    actions:
      - bg: fortress
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          delivery: calm
          text: "전투 다음 날 한낮, 성문 앞에 새 배급 장부와 전사자 명단이 함께 걸렸습니다."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "마을 사람 열한 명과 병사 여섯 명이 돌아오지 못했습니다. 부상자는 서른둘입니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "살린 수만 보고하지 않겠습니다. 돌아오지 못한 이름도 왕께 직접 읽겠습니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "병사들이 공주님의 명령을 다시 받겠다고 합니다. 승리해서가 아니라 손실을 숨기지 않아서라고 했습니다."
      - add: { legitimacy: 1, army_support: 1, people_support: 1 }
      - goto: chapter4_end

  chapter4_end:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          delivery: calm
          text: "4일 뒤, 수도에서 보낸 곡식 수레가 끊겼던 길을 따라 북쪽 성에 들어왔습니다."
      - say:
          with: [덕만, 소원]
          text: "수레에는 진운의 어머니가 살아 있다는 비담의 글과, 진운을 다음 왕 후보로 부르기 시작했다는 소식이 함께 실려 있었습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "수도로 돌아가면 또 곡식보다 왕관 이야기부터 하겠네요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그러면 이 장부를 먼저 펼칠 거야. 왕관을 말하려면 누구의 겨울을 지킬지도 답해야 하니까."
      - say:
          with: [덕만, 소원]
          wait: 850
          text: "덕만은 원본 곡식 장부, 전사자 명단, 아진 남매의 증언을 한 상자에 봉해 수도로 향했습니다."

  go_21_fever_road:
    actions:
      - bg: frontier
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - say:
          with: [덕만, 월명]
          text: "덕만은 수레를 가볍게 하려고 약 상자를 비탈 아래에 남겼습니다."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "성 안에는 굶주림뿐 아니라 열병도 번지고 있습니다. 이 약을 버리면 도착해도 손을 쓸 수 없습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "곡식을 하루라도 빨리 가져가는 편이 낫습니다."
      - effect: darken
      - say:
          text: "덕만이 도착한 날 밤, 열병은 배급 줄을 따라 번졌고 월명에게는 끓일 약재가 남지 않았습니다."
      - gameOver:
          title: "운명 21 — 약을 버린 길"
          message: "속도를 위해 버린 약 때문에 북쪽 성의 열병을 막지 못했고, 곡식을 받은 사람들까지 차례로 쓰러졌습니다."

  go_22_empty_field:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만의 병사들은 길 아래 마을에서 마지막 두 마리 소를 끌어냈습니다."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "저 소가 없으면 이 사람들은 내년 밭을 갈 수 없어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "지금 곡식을 늦출 수 없습니다. 수도에서 갚게 하겠습니다."
      - effect: darken
      - say:
          text: "겨울은 넘겼지만 봄이 와도 마을의 밭은 갈리지 않았습니다. 덕만의 약속보다 굶주림이 먼저 돌아왔습니다."
      - gameOver:
          title: "운명 22 — 봄을 끌고 간 수레"
          message: "오늘의 수레를 움직이려고 내일의 농사를 빼앗았습니다. 구휼을 받은 마을은 다음 봄 더 큰 굶주림을 맞았습니다."

  go_23_closed_gate:
    actions:
      - bg: fortress
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "성벽이 무너지면 모두 죽습니다. 남은 곡식을 병사에게 먼저 주십시오."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "성 밖 사람들은 오늘 밤을 넘기지 못합니다."
      - say:
          with: [덕만, 유신]
          text: "성문이 닫히자 밖의 사람들이 맨손으로 문을 두드렸고, 그 소리가 밤새 경계 북을 덮었습니다."
      - effect: darken
      - say:
          text: "새벽에 문을 열었을 때 적군은 보이지 않았고, 문 앞에 쓰러진 사람들만 남았습니다."
      - gameOver:
          title: "운명 23 — 지킬 사람 없는 성"
          message: "병사들은 성벽을 지켰지만 성 밖 사람들을 잃었습니다. 그날부터 북쪽 마을은 왕실에 길을 열어 주지 않았습니다."

  go_24_empty_wall:
    actions:
      - bg: fortress
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "굶주린 사람에게 모두 나누십시오. 병사들은 하루 더 버텨야 합니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "경계에 선 병사들이 창을 놓고 있습니다. 팔에 힘이 남지 않았습니다."
      - effect: pulse
      - say:
          text: "그날 밤 적의 사다리가 성벽에 걸렸고, 굶은 병사들은 첫 공격을 막지 못했습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "사람을 먹이고도 그들이 숨을 곳을 잃게 했군요."
      - gameOver:
          title: "운명 24 — 비어 버린 성벽"
          message: "배급은 모두에게 닿았지만 성을 지킬 힘이 남지 않았습니다. 성 안의 곡식과 사람은 함께 적의 손에 넘어갔습니다."

  go_25_field_charge:
    actions:
      - bg: frontier
      - camera: wide
      - effect: impact
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 덕만.angry
          camera: medium
          with: [유신]
          text: "지금 기병을 치면 마을과 성을 함께 구할 수 있습니다. 전군을 내보내세요."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "들판은 젖어 있고 적은 우리가 나오길 기다립니다."
      - say:
          with: [덕만, 유신]
          text: "성문을 나온 병사들의 말발굽이 진창에 빠지자 숲 양쪽에서 화살이 쏟아졌습니다."
      - effect: { name: darken, wait: true }
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "돌아갈 성문까지 적이 막았습니다."
      - gameOver:
          title: "운명 25 — 열린 들판의 함정"
          message: "한 번에 두 곳을 구하려던 돌격은 매복에 갇혔고, 성과 마을을 지킬 군사가 함께 사라졌습니다."
