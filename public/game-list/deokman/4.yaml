script:
  - scene: peony_banquet

scenes:
  peony_banquet:
    actions:
      - bg: banquet_hall
      - camera: wide
      - say:
          channel: record
          text: "제5장 — 향기 없는 꽃"
      - char: { id: 덕만, position: left }
      - char: { id: 당 사신, position: right }
      - say:
          channel: narration
          text: "당 사신은 곡식 장부를 거들떠보지 않고 모란 족자를 연회상 위에 펼쳤습니다. 어린 날 불타던 별궁에서 본 바로 그 그림이었습니다. 편지 세 봉에는 같은 조롱이 다른 먹빛으로 적혀 있었습니다."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서는 신라의 빈 왕좌를 염려하십니다. 공주께서 당이 고른 남편을 왕으로 세우시면, 빈 곡식 창고와 약한 성문을 모두 채워 주시겠답니다."
      - say:
          char: 덕만
          camera: close
          with: [당 사신]
          text: "당에서는 종이 위 꽃향기와 비어 있는 왕좌까지 맡는 모양이군요. 좋습니다. 대신 이 그림과 조건에서 일부러 빠뜨린 것부터 같이 보시죠."
      - choice:
          key: c5_first_reply
          prompt: "모란은 향기를, 혼인서는 값을 숨긴다. 무엇으로 사신의 첫 문장을 끊을까?"
          char: 덕만
          camera: close
          with: [당 사신]
          options:
            - text: "그림 속 빈 나비 자리를 손가락으로 짚는다"
              add: { people_support: 1, insight: 2 }
              goto: answer_with_absence
            - text: "웃으며 편지의 마지막 줄까지 듣는다"
              add: { nobles_support: 1, evidence: 1 }
              goto: answer_with_patience
            - text: "굶은 아이들의 명단을 그림 위에 펼친다"
              add: { people_support: 2, fear: 1 }
              goto: answer_with_ledger

  answer_with_absence:
    actions:
      - sticker: { id: c5_peony, image: peony_painting_sticker, x: 50, y: 27, width: "clamp(190px, 23%, 360px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          text: "나비가 없다고 꽃이 빈 것은 아닙니다. 화공이 나비를 빼고 뜻을 만들어 냈을 뿐이죠. 신라의 왕도 당의 붓끝에서 생기거나 사라지지 않습니다."
      - say:
          char: 당 사신.nervous
          camera: reaction
          with: [덕만]
          text: "그림 한 장으로 목소리를 높이시는군요."
      - clearSticker: { id: c5_peony, leave: fadeOut }
      - goto: hidden_terms

  answer_with_patience:
    actions:
      - say:
          channel: narration
          text: "덕만은 대꾸하지 않고 조건을 한 줄씩 받아 적었습니다. 사신이 잔을 드는 순간 마지막 종이를 낚아챘습니다. 혼인 조항 아래, 신라 성 하나를 당군 주둔지로 내준다는 작은 글씨가 숨어 있었습니다."
      - say:
          char: 덕만
          camera: close
          with: [당 사신]
          text: "남편은 첫 줄의 향기고, 성문이 마지막 줄의 값이었군요. 남의 시선을 꽃에 묶어 두고 칼은 글 끝에 작게 쓰는 버릇이 있으십니다."
      - goto: hidden_terms

  answer_with_ledger:
    actions:
      - say:
          char: 덕만
          text: "남자 왕이 곡식을 만든다면 왜 이 아이들 장부는 비었습니까? 당이 보내려는 건 남편입니까, 가뭄 씨앗입니까? 신라가 치를 값을 붙여 하나만 답하십시오."
      - say:
          char: 당 사신.nervous
          camera: close
          with: [덕만]
          text: "공주께선 제국의 혼인을 장터 거래처럼 다루시는군요."
      - say:
          char: 덕만
          text: "값을 정하는 사람과 치르는 사람이 다르니까요. 왕끼리 향기로운 술을 마셔도 계산은 굶는 사람이 합니다."
      - goto: hidden_terms

  hidden_terms:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "비담이 빈 술병을 들고 휘장 뒤에서 나타났습니다. 병 속에는 통역관의 쪽지가 말려 있었습니다. 구휼미를 훔친 가문과 봄 연회 습격자의 이름 옆에 당의 답신 표시가 찍혀 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "사신의 입을 막으면 오늘은 안전합니다. 원본을 돌려놓고 뒤를 밟으면 내일의 적을 알 수 있고요. 공주님께 필요한 칼은 어느 쪽입니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "나를 살린다며 답을 둘로 줄이지 마. 쪽지는 베끼고 원본은 돌려놓아. 오늘 사람도 지키고 내일 손도 찾는다."
      - goto: treaty_choice

  treaty_choice:
    actions:
      - bg: banquet_hall
      - char: { id: 당 사신, position: right }
      - choice:
          key: c5_diplomacy
          prompt: "사신이 혼인이라는 제목만 쓴 문서를 내민다. 신라가 실제로 받을 것과 내줄 것은?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "혼인을 지우고 종자와 천문표를 맞바꾼다"
              set: { diplomacy_policy: equal_exchange }
              add: { people_support: 1, insight: 2, nobles_support: -1 }
              goto: equal_exchange
            - text: "혼인 답을 미루고 국경 군량부터 받는다"
              set: { diplomacy_policy: armed_truce }
              add: { army_support: 2, nobles_support: 1, fear: 1 }
              goto: armed_truce
            - text: "무역권 하나로 귀족들의 서신을 산다"
              set: { diplomacy_policy: secret_trade }
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: secret_trade

  equal_exchange:
    actions:
      - say:
          char: 덕만
          text: "신라는 왕도 혼인도 조공으로 보내지 않습니다. 가뭄 종자와 천문표를 내놓으십시오. 우리는 철과 항로를 같은 줄에 내놓겠습니다."
      - say:
          char: 당 사신
          camera: close
          with: [덕만]
          text: "황제께서 이 문서를 찢으실 수도 있습니다."
      - say:
          char: 덕만
          text: "그 조각까지 주워 양국 상인에게 보여 드리지요."
      - goto: banquet_test

  armed_truce:
    actions:
      - say:
          channel: narration
          text: "덕만은 혼인 답변 날짜를 세 달 뒤로 밀고 그 빈칸에 국경 군량 수레 수를 적었습니다. 사신은 웃었지만 날짜 아래 붉은 줄을 두 번 그었습니다."
      - say:
          char: 당 사신
          camera: close
          with: [덕만]
          text: "미룬 답도 답입니다. 황제께서는 날짜와 빚을 함께 세십니다."
      - goto: banquet_test

  secret_trade:
    actions:
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "사신은 소매에서 밀봉된 서신 다섯 장을 꺼냈습니다. 대신 무역권 문서에 한 가문의 이름이 새로 들어갔습니다. 덕만은 적의 이름을 얻는 순간 또 하나의 문을 그들에게 내주었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "더러운 편지는 깨끗한 손으로는 못 폅니다. 축하드립니다. 사람 대신 문을 고른 손에도 이제 꽤 왕다운 얼룩이 생겼군요."
      - goto: banquet_test

  banquet_test:
    actions:
      - char: { id: 당 사신, position: right }
      - say:
          channel: narration
          text: "마지막 술잔이 비자 사신은 상석 앞 방석을 손끝으로 두드렸습니다. 당의 예법대로 무릎 꿇으라는 뜻이었습니다. 귀족들의 시선이 덕만의 무릎으로 쏠렸습니다."
      - choice:
          key: c5_protocol
          prompt: "조건 다음에는 몸의 높이를 요구한다. 신라와 당의 답을 어떤 장면으로 남길까?"
          char: 덕만
          camera: reaction
          with: [당 사신]
          options:
            - text: "문을 잠그고 사과문부터 쓰게 한다"
              goto: bad_hostage
            - text: "사신도 일으켜 같은 높이에서 절한다"
              add: { nobles_support: 1, people_support: 1, insight: 1 }
              goto: scentless_end
            - text: "모란 그림을 말아 사신 품에 돌려준다"
              add: { fear: 2, people_support: 1 }
              goto: return_peony

  return_peony:
    actions:
      - say:
          char: 덕만
          camera: close
          with: [당 사신]
          text: "이 그림은 돌려드립니다. 황제의 화공이 향기를 빼도 꽃은 남고, 황제가 남편을 더해도 신라 왕이 되지는 않는다는 답과 함께요."
      - say:
          char: 당 사신.angry
          camera: reaction
          with: [덕만]
          text: "그 답은 모욕으로 기록될 겁니다."
      - say:
          char: 덕만
          text: "그러니 혼인 조건과 곡식 조건도 한 글자도 빼지 말고 함께 기록하십시오."
      - goto: scentless_end

  scentless_end:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          channel: narration
          text: "사신의 수레가 궁문을 나설 때 모란 족자는 연회상 위에 남았습니다. 덕만은 그림을 뒤집어 놓고서야 굳었던 손가락을 폈습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "칼 한 번 안 뽑고 사신과 귀족을 전부 잠 못 들게 하셨군요. 마음에 듭니다."
      - say:
          char: 덕만
          text: "좋아하지 마. 오늘 받아 낸 곡식과 표의 값이 어느 마을, 어느 성문으로 돌아갈지 아직 정하지 못했어."
      - say:
          channel: record
          text: "덕만은 모욕을 조건으로 바꾸었습니다. 당은 신라에 여왕 후보가 있다는 사실을 처음으로 공식 기록했고, 교환품으로 다음 일식의 관측표를 남겼습니다."
      - say:
          channel: narration
          text: "그날 밤, 관측표 위 촛농이 아직 굳기 전에 제관 하나가 날짜를 베꼈습니다. 이튿날 시장 좌판마다 검은 부적이 걸렸고 같은 날짜가 '덕만을 삼킬 날'로 팔렸습니다."
      - goto: /5.yaml

  bad_hostage:
    actions:
      - bg: locked_room
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 당 사신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "이 모욕은 그대로 돌려보내겠습니다. 오늘 누가 무릎 꿇었는지도 황제에게 전하십시오."
      - say:
          char: 당 사신.angry
          text: "문을 잠그는 순간부터 이 자리는 연회가 아니라 감옥입니다. 황제께 신라가 사신의 목을 겨눴다고 쓰겠습니다."
      - say:
          channel: narration
          text: "사흘 뒤 국경의 원조 곡식이 되돌아갔고 당의 군선이 동해에 나타났습니다. 사신을 반대하던 귀족들조차 전쟁 책임을 덕만에게 돌려 궁문을 안에서 열었습니다."
      - say:
          channel: record
          text: "당 조정 기록 — 신라 왕실의 공주가 황제의 사신을 모욕하고 억류함. 신라 귀족 연합이 덕만을 처형한 뒤 사죄 사절을 보냄."
      - gameOver:
          title: "운명 — 모욕의 값이 된 목"
          message: "사신을 가둬 사과를 받아낼 수는 있었지만 그가 대표하는 군대와 국내의 공포까지 가둘 수는 없었습니다. 귀족들은 나라를 살린다는 명분으로 덕만의 목을 먼저 내놓았습니다."
