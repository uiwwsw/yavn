chapterTitle: "향기 없는 꽃"

script:
  - scene: peony_banquet

scenes:
  peony_banquet:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제5장 — 향기 없는 꽃"
      - char: { id: 덕만, position: left }
      - char: { id: 당 사신, position: right }
      - say:
          channel: action
          text: "사신이 장부를 밀어내고 모란도를 편다. 불타던 방에서 아버지가 펼쳤던 꽃이다. 나는 무릎 위에 손을 내려 떨리는 손가락을 누른다."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서 사위를 골라 보내시겠다 하십니다. 곡식과 군사도 혼수로 딸릴 터이지요."
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "혼수를 그리 후히 주시니, 신라에서 내놓을 것도 적지는 않겠군요."
      - choice:
          key: c5_first_reply
          prompt: "사신이 모란도를 내 쪽으로 한 치 더 민다."
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "웃으며 편지의 마지막 줄까지 듣는다"
              add: { nobles_support: 1, evidence: 1 }
              goto: answer_with_patience
            - text: "굶은 아이들의 명단을 그림 위에 펼친다"
              add: { people_support: 2, fear: 1 }
              goto: answer_with_ledger
            - text: "그림 속 빈 나비 자리를 손가락으로 짚는다"
              add: { people_support: 1, insight: 2 }
              goto: answer_with_absence

  answer_with_absence:
    actions:
      - sticker: { id: c5_peony, image: peony_painting_sticker, x: 50, y: 27, width: "clamp(190px, 23%, 360px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          text: "모란 곁이 비었다 하여 아무 나비나 앉힐 수야 있겠습니까. 신라의 왕좌도 그러합니다."
      - say:
          char: 당 사신.nervous
          camera: medium
          with: [덕만]
          text: "황제의 선물을 그리 읽으십니까? 소신이 뜻을 잘못 전했나 봅니다."
      - clearSticker: { id: c5_peony, leave: fadeOut }
      - goto: hidden_terms

  answer_with_patience:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만은 끝까지 듣고 마지막 종이를 집었다. 혼인 조항 아래 작은 글씨가 있었다. 신라의 성 하나를 당군에게 내어 준다는 약조였다."
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "성 하나를 내달라는 말씀이 여기 있었군요. 혼인이 아니라 주둔을 청하러 오셨습니까?"
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "잔을 받으시기에 뜻이 통한 줄 알았습니다. 여기 계신 분들도 그리 보셨겠지요."
      - say:
          channel: narration
          text: "배석한 귀족들은 덕만의 눈을 피했다. 잔을 내려놓으려는데 손가락이 듣지 않았다. 목을 타고 내려간 것이 차갑게 남아 있었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "모란 연회 기록 — 덕만 공주, 혼인 합의 직후 급서. 당과 신라 귀족 회의는 예정대로 혼인을 추진함."
      - gameOver:
          title: "운명 — 마지막 줄보다 늦은 대답"
          message: "덕만이 찾아낸 마지막 조항 위로 잔이 넘어졌다. 귀족들은 젖은 종이부터 거두었다. 공주를 부축한 사람은 그 뒤에야 들어왔다."
          recoverToChoice: c5_first_reply

  answer_with_ledger:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          char: 덕만
          text: "그 전에 이 이름들을 보십시오. 혼수를 기다리다 굶어 죽을 아이들입니다."
      - say:
          char: 당 사신.nervous
          camera: medium
          with: [덕만]
          text: "황제의 글 위에 천것들의 명부를 얹으시는 겁니까?"
      - say:
          char: 덕만
          text: "이 아이들 입에 들어갈 쌀을 두고 하는 혼담 아닙니까. 먼저 읽으시지요."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "더는 읽을 것이 없군요. 오늘 이 자리에 누가 있었는지만 적어 가겠습니다."
      - say:
          channel: narration
          text: "사신이 나가자 귀족들이 문 앞에 섰다. 조금 전까지 눈을 피하던 이들이 덕만을 똑바로 보았다. 누구를 내주면 군선이 돌아갈지 이미 정한 얼굴이었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "대당 사죄문 — 왕실의 뜻과 무관하게 사신을 모욕한 덕만 공주를 처형하고 그 목을 국경에 보냄."
      - gameOver:
          title: "운명 — 옳은 분노의 인질"
          message: "아이들 명단은 사죄문 밑에 깔렸다. 사죄문에는 덕만의 이름 하나만 필요했다."
          recoverToChoice: c5_first_reply

  hidden_terms:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - music: night_road
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          camera: medium
          channel: action
          text: "휘장 틈으로 비담이 술병을 건넨다. 마개를 빼자 말린 종이가 나온다. 구휼미 장부에서 본 가문들 옆에 답신을 받았다는 점이 찍혀 있다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "붙잡아 둘까요? 오늘 밤 잠은 편해지실 겁니다. 뒤에 선 분들은 잠적하겠지만."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "베껴 두고 돌려놔. 누가 답장을 받으러 오는지 봐야겠어."
      - goto: treaty_choice

  treaty_choice:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - char: { id: 당 사신, position: right }
      - choice:
          key: c5_diplomacy
          prompt: "혼인 조항 위에 붓을 댄다. 무엇을 남길까?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "혼인 답을 미루고 국경 군량부터 받는다"
              set: { diplomacy_policy: armed_truce }
              add: { army_support: 2, nobles_support: 1, fear: 1 }
              goto: armed_truce
            - text: "혼인을 지우고 종자와 천문표를 맞바꾼다"
              set: { diplomacy_policy: equal_exchange }
              add: { people_support: 1, insight: 2, nobles_support: -1 }
              goto: equal_exchange
            - text: "무역권 하나로 귀족들의 서신을 산다"
              set: { diplomacy_policy: secret_trade }
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: secret_trade

  equal_exchange:
    actions:
      - say:
          char: 덕만
          text: "혼인 조항은 지우십시오. 종자와 천문표를 주시면 철과 항로를 내겠습니다."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서 찢어 버리실 문서입니다."
      - say:
          char: 덕만
          text: "그리 전하시지요. 다만 철을 기다리는 당의 상인들에게도 한 부씩 보내겠습니다."
      - goto: banquet_test

  armed_truce:
    actions:
      - bg:
          id: "banquet_hall"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "덕만은 주둔 조항에 먹줄을 그었다. 사신이 다시 쓰려 하자 종이를 잡아 두었다. 군량이 넘어올 날짜만 빈칸으로 남았다."
      - say:
          char: "당 사신"
          camera: "medium"
          with:
            - "덕만"
          text: "이번 겨울은 넘기시겠군요. 다음 겨울에도 이 값일지는 장담 못 합니다."
      - say:
          char: "덕만"
          camera: "medium"
          with:
            - "당 사신"
          text: "그때는 다시 묻겠습니다. 오늘 성문을 넘는 것은 곡식뿐입니다."
      - say:
          channel: "narration"
          text: "국경에 군량 수레가 도착했다. 춘추는 운송표를 챙기다 바닥에 끼인 천문표 사본을 발견했다. 내년 협상 날짜는 아직 비어 있었다."
      - add:
          nobles_support: -1
      - say:
          channel: thought
          text: "이번 겨울은 넘겼다. 그 말이 자꾸 걸린다. 내년 겨울에도 저 사람에게 고개를 숙여야 할까."
      - goto: "banquet_test"

  secret_trade:
    actions:
      - bg:
          id: "shadow_corridor"
          transition: "fade"
          duration: 900
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "탁자 아래서 서신 뭉치가 건너왔다. 덕만은 무역권 문서에 서명했다. 비담은 먹이 마르기를 기다려 두 종이를 맞바꿨다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "이름값이 비싸군요. 항구 상인들이 한 해 동안 대신 갚겠습니다."
      - say:
          char: "덕만.princess_sad"
          camera: "medium"
          with:
            - "비담"
          text: "한 해로 못 박아. 더 달라거든 이 편지를 회의장에 펴겠다고 전해."
      - say:
          channel: "narration"
          text: "서신 사이에 일식 관측표가 들어 있었다. 덕만은 그것을 골라 냈다. 무역권 문서를 쥔 사내는 벌써 세금 걷을 사람을 부르고 있었다."
      - add:
          people_support: -2
          evidence: 1
      - say:
          channel: thought
          text: "편지 몇 장에 사람들의 한 해를 넘겼다. 항구에서 나를 맞을 얼굴들을 아직 보지도 못했는데."
      - goto: "banquet_test"

  banquet_test:
    actions:
      - char: { id: 당 사신, position: right }
      - say:
          channel: action
          text: "사신이 낮은 방석을 가리킨다. 자신의 의자는 그대로다. 나는 방석을 보다가 그 뒤에 선 기록관을 본다. 붓이 들려 있다."
      - choice:
          key: c5_protocol
          prompt: "내가 무릎 꿇는 순간을 적으려는 붓이 기다린다."
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "사신도 일으켜 같은 높이에서 절한다"
              add: { nobles_support: 1, people_support: 1, insight: 1 }
              goto: scentless_end
            - text: "문을 잠그고 사과문부터 쓰게 한다"
              goto: bad_hostage
            - text: "모란 그림을 말아 사신 품에 돌려준다"
              add: { fear: 2, people_support: 1 }
              goto: return_peony

  return_peony:
    actions:
      - bg: { id: banquet_hall, transition: dissolve, duration: 720 }
      - say:
          char: 덕만
          camera: medium
          with: [당 사신]
          text: "도로 가져가십시오. 신라의 꽃은 신라에서 피우겠습니다."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "황제께 올릴 말씀이 그것뿐입니까?"
      - say:
          char: 덕만
          text: "한 글자도 빼지 마십시오. 혼인에 성을 끼워 넣으신 일도 함께요."
      - say:
          char: 당 사신.angry
          camera: medium
          with: [덕만]
          text: "분부대로 전하겠습니다. 그때까지 옥체 보중하시기를."
      - say:
          channel: narration
          text: "족자를 말던 손에 흰 가루가 묻었다. 덕만이 기침하자 사신은 한 걸음 물러섰다. 의원을 부르는 소리보다 문 잠기는 소리가 먼저 났다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "모란 연회 변고 — 덕만 공주, 황제의 선물을 훼손한 뒤 원인 불명의 호흡 곤란으로 사망."
      - gameOver:
          title: "운명 — 돌려준 꽃의 독"
          message: "그림끈에서 떨어진 가루가 소매에 남았다. 덕만은 문을 열라 명했으나, 밖의 사람들은 서로에게 눈짓만 보냈다."
          recoverToChoice: c5_protocol

  scentless_end:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          camera: wide
          channel: action
          text: "궁문 밖으로 수레가 멀어진다. 모란도를 뒤집어 놓고 손을 편다. 손바닥에 손톱 자국이 네 개나 났다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "오늘 연회 술맛은 오래 기억하겠습니다. 사신 얼굴이 특히 좋더군요."
      - say:
          char: 덕만
          text: "넌 내 잔이 비었는지도 못 봤지? 물이나 좀 가져다줘."
      - say:
          channel: thought
          text: "천문표를 펴 놓는다. 다음 일식의 날짜가 눈에 걸린다. 잔을 쥔 손이 아직 조금 떨린다."
          with: []
          camera: wide
          continueLabel: 관측표를 펴고 밤을 지새운다
      - say:
          channel: action
          text: "이튿날 장터에 검은 부적이 걸린다. 덕만을 삼킬 날이라 적혀 있다. 어젯밤 천문표에서 읽은 바로 그 날짜다."
      - goto: /5.yaml

  bad_hostage:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 당 사신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "문을 닫아라. 사신께서 남기신 모욕을 거두기 전에는 아무도 나가지 못한다."
      - say:
          char: 당 사신.angry
          text: "소신의 목을 잡으시면 황제께서 손을 놓으실 줄 아십니까?"
      - say:
          channel: narration
          text: "사흘 뒤 군량 수레가 돌아갔다. 동해에 당의 군선이 보인다는 보고가 들어오자, 귀족들은 사신을 풀어 주고 덕만의 처소를 잠갔다."
      - say:
          channel: record
          text: "당 조정 기록 — 신라 왕실의 공주가 황제의 사신을 모욕하고 억류함. 신라 귀족 연합이 덕만을 처형한 뒤 사죄 사절을 보냄."
      - gameOver:
          title: "운명 — 모욕의 값이 된 목"
          message: "사과문을 쓰게 하려던 붓으로 덕만의 죄목이 적혔다. 귀족들은 그 문서를 들고 국경으로 갔다."
