script:
  - scene: chapter4_open
  - scene: chapter4_end

scenes:
  chapter4_open:
    actions:
      - bg: frontier
      - char:
          id: 유신
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제4장 — 궁 밖에서 왕을 만나다"
      - say:
          text: "국경에는 삼백 섬의 곡식과 오백 명의 군사, 그리고 그보다 많은 굶주린 사람이 있었다."
      - say:
          char: 유신
          with:
            - 덕만
          text: "모두를 살릴 수는 없습니다. 명령을 내려 주십시오."
      - say:
          char: 덕만
          with:
            - 유신
          text: "궁에서는 명령 하나가 문장이었는데, 여기서는 사람 수로 보이는군요."
      - goto: grain_choice

  grain_choice:
    actions:
      - choice:
          key: c4_grain
          prompt: "남은 곡식을 어디에 먼저 배분할까?"
          char: 덕만
          with:
            - 유신
          options:
            - text: "사흘치만 백성에게 풀고 그 안에 보급로를 연다"
              add:
                people_support: 2
                legitimacy: 1
              goto: grain_people
            - text: "군량을 우선 지급하되 병사 가족도 같은 줄에 세운다"
              add:
                army_support: 2
                power: 1
              goto: grain_army
            - text: "모두에게 똑같이 나눠 주면 공평하다고 선언한다"
              goto: go_22_fair_hunger
            - text: "귀족 창고를 지키기 위해 배급을 전면 중단한다"
              goto: go_23_full_princess

  grain_people:
    actions:
      - char:
          id: 월명
          position: right
      - say:
          char: 월명
          text: "사흘 뒤에도 길이 열리지 않으면 백성이 공주를 원망할 겁니다."
      - say:
          char: 덕만
          text: "사흘 동안 살아 있어야 원망도 하지요. 그 시간을 사겠습니다."
      - goto: defense_choice

  grain_army:
    actions:
      - say:
          char: 유신
          text: "병사와 가족을 같은 줄에 세우면 군의 몫이 줄었다고 장수들이 반발할 겁니다."
      - say:
          char: 덕만
          text: "가족이 굶는 병사는 성을 지키지 않습니다. 집으로 돌아갈 뿐이지요."
      - goto: defense_choice

  defense_choice:
    actions:
      - bg: fortress
      - say:
          text: "적의 기병이 움직였다. 버려진 마을과 보급로를 지키는 요새 중 하나만 제때 구할 수 있었다."
      - choice:
          key: c4_defense
          prompt: "어디를 먼저 지킬까?"
          char: 덕만
          options:
            - text: "마을 사람을 빼낸 뒤 빈집과 수레로 길을 막는다"
              add:
                people_support: 2
                insight: 1
              goto: defense_village
            - text: "요새를 지키고 봉화로 마을의 피난 시간을 번다"
              add:
                army_support: 2
                yushin_trust: 1
              goto: defense_fortress
            - text: "병력을 반으로 나눠 마을과 요새를 모두 지킨다"
              goto: go_24_kind_failure
            - text: "왕경의 추가 명령이 올 때까지 전군을 후퇴시킨다"
              goto: go_25_silla_abandoned

  defense_village:
    actions:
      - effect: impact
      - say:
          char: 유신
          text: "빈 수레가 길을 막는 동안 사람들은 산길로 빠졌습니다. 요새는 잃었지만 군은 남았습니다."
      - say:
          char: 덕만
          text: "성은 다시 쌓을 수 있어도, 성을 쌓을 사람은 다시 만들 수 없습니다."
      - goto: enemy_choice

  defense_fortress:
    actions:
      - say:
          text: "봉화 세 개가 차례로 올랐다. 마을은 불탔지만 주민 대부분은 산으로 피했다."
      - say:
          char: 덕만
          text: "완전한 승리는 없군. 무엇을 잃을지 먼저 정하는 것뿐."
      - goto: enemy_choice

  enemy_choice:
    actions:
      - char:
          id: 아진
          position: right
      - say:
          char: 아진
          text: "적장이 사흘 휴전을 제안했습니다. 대신 공주가 홀로 강가로 나오랍니다."
      - choice:
          key: c4_enemy
          prompt: "적의 제안에 어떻게 답할까?"
          char: 덕만
          options:
            - text: "아진을 통역으로 데리고 강가에서 포로와 곡식을 교환한다"
              add:
                insight: 1
                people_support: 1
              goto: enemy_negotiate
            - text: "유신의 매복 계획으로 적 보급대를 끊고 휴전을 강제한다"
              add:
                army_support: 1
                power: 2
              goto: enemy_fight
            - text: "항복 문서를 보내되 빈 수레 행렬로 병력을 과장한다"
              add:
                insight: 2
                suspicion: 1
              goto: enemy_bluff
            - text: "백성을 위해 어떤 조건이든 받겠다며 홀로 나간다"
              goto: go_26_hostage_princess

  enemy_negotiate:
    actions:
      - say:
          char: 아진
          text: "공주를 죽이라는 명령은 아직 유효합니다. 등을 보이지 마십시오."
      - say:
          char: 덕만
          text: "그 말을 해 준 순간부터 그대는 명령보다 나를 먼저 본 거야."
      - goto: chapter4_end

  enemy_fight:
    actions:
      - say:
          char: 유신
          text: "승리라 부르기에는 잃은 것이 많습니다."
      - say:
          char: 덕만
          text: "살아남은 사람이 내일을 고를 수 있다면, 오늘은 패배가 아닙니다."
      - goto: chapter4_end

  enemy_bluff:
    actions:
      - say:
          text: "안개 속 빈 수레의 바퀴 소리는 천 명의 군대처럼 울렸다. 적은 사흘 물러났다."
      - say:
          char: 덕만
          text: "왕경에서는 사람이 소문을 만들었는데, 여기서는 소문이 사람을 살리는군."
      - goto: chapter4_end

  chapter4_end:
    actions:
      - add:
          legitimacy: 2
      - say:
          text: "덕만은 완전한 승리를 거두지 못했지만 더 큰 피해를 막았다. 백성과 군사들은 처음으로 공주가 아니라 자신의 결정을 따랐다."
      - say:
          char: 유신
          text: "왕경에서 전갈입니다. 신라에는 이제 왕자가 있다고 합니다."
      - say:
          text: "제4장 완료 — 덕만은 따르는 사람을 얻는 대신, 비어 있던 후계자의 자리를 잃었다."

  go_22_fair_hunger:
    actions:
      - gameOver:
          title: "운명 22 — 공평한 굶주림"
          message: "모두가 똑같이 조금씩 받았다. 병사는 싸울 힘이 없었고 아이는 겨울을 날 만큼 먹지 못했다. 덕만의 공평함은 누구도 살리지 못했다."
  go_23_full_princess:
    actions:
      - gameOver:
          title: "운명 23 — 배부른 공주"
          message: "귀족의 창고는 지켜졌고 백성의 그릇은 비었다. 덕만의 마차가 마을을 지날 때 처음 날아온 돌은 작았다. 마지막 돌이 누구의 것이었는지는 기록되지 않았다."
  go_24_kind_failure:
    actions:
      - gameOver:
          title: "운명 24 — 착한 사람은 왕이 될 수 없다"
          message: "반으로 나뉜 군사는 마을에도 요새에도 늦었다. 모두를 버리지 않으려던 선택은 모두를 잃는 명령이 되었다."
  go_25_silla_abandoned:
    actions:
      - gameOver:
          title: "운명 25 — 신라가 버린 공주"
          message: "왕경의 명령은 오지 않았다. 후퇴로 열린 길을 따라 적군이 내려왔고, 덕만은 포로가 되어 신라의 협상 문서에 값으로 적혔다."
  go_26_hostage_princess:
    actions:
      - gameOver:
          title: "운명 26 — 좋은 인질"
          message: "적장은 약속대로 백성을 살렸다. 대신 덕만을 가장 좋은 인질로 왕경에 팔았다. 그녀의 자비는 신라를 구했지만 그녀를 왕위에서 지웠다."
