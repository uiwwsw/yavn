script:
  - scene: peony_banquet

scenes:
  peony_banquet:
    actions:
      - bg: banquet_hall
      - camera: wide
      - say:
          channel: record
          text: "제5장 — 향기 없는 꽃"
      - char: { id: 덕만, position: left }
      - char: { id: 당 사신, position: right }
      - say:
          channel: narration
          text: "당 사신은 곡식 장부를 거들떠보지 않고 모란 족자를 연회상 위에 펼쳤습니다. 어린 날 불타던 별궁에서 본 바로 그 그림이었습니다. 편지 세 봉에는 같은 조롱이 다른 먹빛으로 적혀 있었습니다."
      - say:
          char: 당 사신
          camera: medium
          with: [덕만]
          text: "황제께서는 신라를 걱정하십니다. 공주께서 남편을 왕으로 세우시면, 비어 버린 곡식 창고도 군사도 채워 주시겠답니다."
      - say:
          char: 덕만
          camera: close
          with: [당 사신]
          text: "당에서는 종이 위 꽃향기도 맡나 보군요. 좋습니다. 대신 빠뜨린 것까지 같이 보시죠."
      - choice:
          key: c5_first_reply
          prompt: "연회장의 숨이 멎는다. 덕만은 무엇을 상 위에 올릴까?"
          char: 덕만
          camera: close
          with: [당 사신]
          options:
            - text: "그림 속 빈 나비 자리를 손가락으로 짚는다"
              add: { people_support: 1, insight: 2 }
              goto: answer_with_absence
            - text: "웃으며 편지의 마지막 줄까지 듣는다"
              add: { nobles_support: 1, evidence: 1 }
              goto: bad_silent_consent
            - text: "굶은 아이들의 명단을 그림 위에 펼친다"
              add: { people_support: 2, fear: 1 }
              goto: bad_righteous_insult

  answer_with_absence:
    actions:
      - sticker: { id: c5_peony, image: peony_painting_sticker, x: 50, y: 27, width: "clamp(190px, 23%, 360px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          char: 덕만
          text: "향기가 없어서 나비가 없는 게 아닙니다. 화공이 그리지 않았을 뿐이죠. 신라의 왕도 당의 붓끝에서 생기진 않습니다."
      - say:
          char: 당 사신.nervous
          camera: reaction
          with: [덕만]
          text: "그림 한 장으로 목소리를 높이시는군요."
      - clearSticker: { id: c5_peony, leave: fadeOut }
      - goto: hidden_terms

  bad_silent_consent:
    actions:
      - bg: peony_court
      - camera: medium
      - char: { id: 덕만, position: left, emotion: princess }
      - char: { id: 당 사신, position: right }
      - say:
          channel: narration
          text: "덕만은 미소를 거두지 않은 채 편지의 마지막 줄까지 들었습니다. 사신은 답을 재촉하지 않고 빈 술잔을 천천히 뒤집었습니다."
      - say:
          char: 당 사신
          camera: close
          with: [덕만]
          text: "반대가 없으셨으니 혼인과 주둔 조항 모두 받아들이신 것으로 기록하겠습니다. 축하드립니다."
      - say:
          char: 덕만.princess_angry
          text: "나는 듣겠다고 했지, 허락한다고 하지 않았습니다. 그 붓을 멈추세요."
      - say:
          channel: record
          text: "당 조정 외교 기록 — 신라의 덕만 공주, 황실 혼인과 당군 주둔 조건을 묵인. 이후 합의를 뒤집어 반역자로 처형됨."
      - gameOver:
          title: "운명 — 침묵으로 굳은 혼인"
          message: "덕만이 답을 미루는 동안 귀족들은 침묵을 혼인 동의로 기록했습니다. 당군이 성 안에 들어온 뒤 그 작은 글씨를 바로잡을 사람은 남지 않았습니다."

  bad_righteous_insult:
    actions:
      - bg: peony_court
      - camera: close
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 당 사신, position: right, emotion: angry }
      - say:
          char: 덕만.princess_angry
          text: "남자 왕이 쌀을 만든다면 이 아이들은 왜 굶었습니까? 이 명단부터 황제 앞에서 읽으십시오."
      - say:
          channel: narration
          text: "명단이 모란 그림을 덮자 연회장은 잠시 조용해졌습니다. 사신은 종이를 줍지 않고 수행관에게 술잔을 치우라 손짓했습니다."
      - say:
          char: 당 사신.angry
          camera: reaction
          with: [덕만]
          text: "대답 대신 황제의 사신을 모욕하셨군요. 국경에서 곡식과 군선 중 무엇이 먼저 오는지 보시지요."
      - say:
          channel: narration
          text: "당의 군선이 나타나자 덕만을 칭찬하던 귀족들이 먼저 궁문을 열었습니다. 전쟁을 막는 값으로 공주의 목이 합의문에 올랐습니다."
      - gameOver:
          title: "운명 — 옳은 분노의 인질"
          message: "아이들의 이름은 연회장을 흔들었지만 사신의 함정을 반박하지는 못했습니다. 당은 이를 공개 모욕으로 기록했고 귀족들은 전쟁을 막겠다며 덕만을 처형했습니다."

  hidden_terms:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "비담이 빈 술병을 들고 휘장 뒤에서 나타났습니다. 병 속에는 통역관의 쪽지가 말려 있었습니다. 구휼미를 훔친 가문과 봄 연회 습격자의 이름 옆에 당의 답신 표시가 찍혀 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "사신 입을 막으면 오늘은 조용합니다. 원본을 돌려놓으면 내일 누구 손에 들어가는지 볼 수 있고요. 어느 쪽이 더 궁금하십니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내게 답을 둘만 주지 마. 베껴. 원본은 돌려놓고 뒤따라가."
      - goto: treaty_choice

  treaty_choice:
    actions:
      - bg: banquet_hall
      - char: { id: 당 사신, position: right }
      - choice:
          key: c5_diplomacy
          prompt: "사신이 빈 문서와 붓을 내민다. 어떤 값을 써 넣을까?"
          char: 덕만
          camera: medium
          with: [당 사신]
          options:
            - text: "혼인을 지우고 종자와 천문표를 맞바꾼다"
              set: { diplomacy_policy: equal_exchange }
              add: { people_support: 1, insight: 2, nobles_support: -1 }
              goto: equal_exchange
            - text: "혼인 답을 미루고 국경 군량부터 받는다"
              set: { diplomacy_policy: armed_truce }
              add: { army_support: 2, nobles_support: 1, fear: 1 }
              goto: armed_truce
            - text: "무역권 하나로 귀족들의 서신을 산다"
              set: { diplomacy_policy: secret_trade }
              add: { evidence: 2, bidam_trust: 1, fear: 1 }
              goto: secret_trade

  equal_exchange:
    actions:
      - say:
          char: 덕만
          text: "신라는 사람을 조공으로 보내지 않습니다. 가뭄 종자와 천문표를 내놓으십시오. 우리는 철과 항로를 내놓겠습니다."
      - say:
          char: 당 사신
          camera: close
          with: [덕만]
          text: "황제께서 이 문서를 찢으실 수도 있습니다."
      - say:
          char: 덕만
          text: "그 조각까지 주워 양국 상인에게 보여 드리지요."
      - goto: banquet_test

  armed_truce:
    actions:
      - say:
          channel: narration
          text: "덕만은 혼인 답변 날짜를 세 달 뒤로 밀고 그 빈칸에 국경 군량 수레 수를 적었습니다. 사신은 웃었지만 날짜 아래 붉은 줄을 두 번 그었습니다."
      - say:
          char: 당 사신
          camera: close
          with: [덕만]
          text: "미룬 답도 답입니다. 황제께서는 날짜와 빚을 함께 세십니다."
      - goto: banquet_test

  secret_trade:
    actions:
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "사신은 소매에서 밀봉된 서신 다섯 장을 꺼냈습니다. 대신 무역권 문서에 한 가문의 이름이 새로 들어갔습니다. 덕만은 적의 이름을 얻는 순간 또 하나의 문을 그들에게 내주었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "더러운 편지는 깨끗한 손으로 안 펴집니다. 축하드립니다. 이제 공주님 손에도 꽤 왕다운 얼룩이 생겼군요."
      - goto: banquet_test

  banquet_test:
    actions:
      - char: { id: 당 사신, position: right }
      - say:
          channel: narration
          text: "마지막 술잔이 비자 사신은 상석 앞 방석을 손끝으로 두드렸습니다. 당의 예법대로 무릎 꿇으라는 뜻이었습니다. 귀족들의 시선이 덕만의 무릎으로 쏠렸습니다."
      - choice:
          key: c5_protocol
          prompt: "사신이 방석을 두드린다. 덕만은 어디에 설까?"
          char: 덕만
          camera: reaction
          with: [당 사신]
          options:
            - text: "사신도 일으켜 같은 높이에서 절한다"
              add: { nobles_support: 1, people_support: 1, insight: 1 }
              goto: scentless_end
            - text: "모란 그림을 말아 사신 품에 돌려준다"
              add: { fear: 2, people_support: 1 }
              goto: bad_hostage
            - text: "문을 잠그고 사과문부터 쓰게 한다"
              goto: bad_hostage

  scentless_end:
    actions:
      - bg: peony_court
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          channel: narration
          text: "사신의 수레가 궁문을 나설 때 모란 족자는 연회상 위에 남았습니다. 덕만은 그림을 뒤집어 놓고서야 굳었던 손가락을 폈습니다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "칼 한 번 안 뽑고 사신과 귀족을 전부 잠 못 들게 하셨군요. 마음에 듭니다."
      - say:
          char: 덕만
          text: "좋아하지 마. 오늘 내가 산 곡식값은 아직 누가 낼지 정하지 못했어."
      - say:
          channel: record
          text: "덕만은 모욕을 조건으로 바꾸었습니다. 당은 신라에 여왕 후보가 있다는 사실을 처음으로 공식 기록했고, 교환품으로 다음 일식의 관측표를 남겼습니다."
      - say:
          channel: narration
          text: "그날 밤, 관측표 위 촛농이 아직 굳기 전에 제관 하나가 날짜를 베꼈습니다. 이튿날 시장 좌판마다 검은 부적이 걸렸고 같은 날짜가 '덕만을 삼킬 날'로 팔렸습니다."
      - goto: /5.yaml

  bad_hostage:
    actions:
      - bg: locked_room
      - camera: close
      - char: { id: 덕만, position: left, emotion: angry }
      - char: { id: 당 사신, position: right, emotion: angry }
      - say:
          char: 덕만.angry
          text: "이 모욕은 그대로 돌려보내겠습니다. 오늘 누가 무릎 꿇었는지도 황제에게 전하십시오."
      - say:
          char: 당 사신.angry
          text: "그림을 제 얼굴에 던지든 문을 잠그든 황제께 닿는 뜻은 하나입니다. 신라가 사신의 목을 겨눴다고 쓰겠습니다."
      - say:
          channel: narration
          text: "사흘 뒤 국경의 원조 곡식이 되돌아갔고 당의 군선이 동해에 나타났습니다. 사신을 반대하던 귀족들조차 전쟁 책임을 덕만에게 돌려 궁문을 안에서 열었습니다."
      - say:
          channel: record
          text: "당 조정 기록 — 신라 왕실의 공주가 황제의 사신을 모욕하고 억류함. 신라 귀족 연합이 덕만을 처형한 뒤 사죄 사절을 보냄."
      - gameOver:
          title: "운명 — 모욕의 값이 된 목"
          message: "사신 한 사람에게 모욕을 돌려줄 수는 있었지만 그가 대표하는 군대와 국내의 공포까지 꺾지는 못했습니다. 귀족들은 나라를 살린다는 명분으로 덕만의 목을 먼저 내놓았습니다."
