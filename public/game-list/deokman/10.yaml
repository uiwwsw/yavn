script:
  - scene: falling_star_rumor

scenes:
  falling_star_rumor:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - say:
          channel: record
          text: "제11장 — 떨어진 별"
      - say:
          channel: narration
          text: "사흘 뒤 밤, 불붙은 것이 별처럼 왕궁 위를 가로질렀습니다. 사람들이 하늘을 올려다보기도 전에 군영과 시장에서 같은 외침이 터졌습니다. '여왕의 별이 떨어졌다.'"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "비담이 북쪽 길을 막고 국경군을 모았습니다. 창고와 옥새를 잃은 가문들이 그 불을 하늘의 뜻이라 쓰고 도장을 찍었습니다."
      - say:
          char: 덕만
          camera: close
          with: [춘추]
          text: "별이 아니야. 별은 군량 나가는 밤을 골라 떨어지지 않아. 누군가 시간을 맞춰 불을 던졌어."
      - choice:
          key: c11_falling_star
          prompt: "소문이 성문보다 빠르다. 무엇으로 붙잡을까?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "낙하지에 먼저 가 재를 사람들 앞에 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: inspect_kite
            - text: "관측관들을 장터로 보내 진짜 별을 가리킨다"
              when: { var: knowledge_policy, op: ne, value: bidam_network }
              add: { people_support: 2, insight: 1 }
              goto: bad_truth_too_late
            - text: "왕궁 지붕에 더 큰 불을 올린다"
              add: { fear: 2, people_support: 1 }
              goto: bad_larger_false_star

  inspect_kite:
    actions:
      - sticker: { id: c11_kite, image: burnt_kite_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 310px)", anchorX: center, anchorY: center, enter: rotateIn }
      - get: burnt_kite
      - say:
          channel: narration
          text: "재를 헤치자 대나무 살이 손에 걸렸습니다. 기름 먹인 천 끝에는 비담 전령의 매듭이 그대로 남아 있었습니다."
      - clearSticker: { id: c11_kite, leave: fadeOut }
      - goto: bidam_letter_arrives

  bad_truth_too_late:
    actions:
      - bg: village
      - camera: wide
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "관측관들이 장터마다 같은 별을 가리켰습니다. 사람들은 고개를 들었지만, 먼 군영에서는 이미 불붙은 연을 보고 반란 북을 울리고 있었습니다."
      - say:
          char: 춘추.nervous
          camera: reaction
          with: [덕만]
          text: "설명은 맞습니다. 하지만 저들은 사실을 묻기 전에 칼을 들었습니다. 성문 세 곳에서 같은 깃발이 올라옵니다."
      - say:
          char: 덕만.queen_angry
          text: "진실을 알리면 멈출 거라 생각했어. 누가 거짓을 움직이는지부터 끊었어야 했다."
      - say:
          channel: record
          text: "유성 소요 기록 — 왕실 관측 발표 중 반란군이 서문을 돌파. 선덕왕은 피난민을 호위하다 군사에게 피살됨."
      - gameOver:
          title: "운명 — 사실보다 빠른 불"
          message: "관측관들이 하늘을 설명하는 동안 불붙은 연은 이미 군영 세 곳을 반란으로 묶었습니다. 사실은 맞았지만 늦었고, 덕만은 성문을 돌파한 군사에게 피살됐습니다."

  bad_larger_false_star:
    actions:
      - bg: burning_palace
      - camera: close
      - effect: embers
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.queen_angry
          text: "왕궁 지붕에 불을 올려라. 저 가짜 별보다 큰 불로 아직 왕이 서 있다는 걸 보여 준다."
      - say:
          channel: narration
          text: "도성의 환호가 잠시 돌아왔습니다. 그러나 성 밖 반란군에게 가장 밝은 불은 왕이 숨은 지붕을 가리키는 봉화가 되었습니다."
      - say:
          char: 춘추.nervous
          camera: reaction
          with: [덕만]
          text: "폐하, 불화살이 이쪽으로 모입니다. 소문을 덮은 게 아니라 표적을 그려 줬습니다!"
      - say:
          char: 덕만.queen_sad
          camera: close
          text: "거짓을 이기려고 더 큰 거짓을 골랐구나. 다음 불은 하늘이 아니라 내가 부른 것이다."
      - gameOver:
          title: "운명 — 더 큰 거짓 별"
          message: "여왕의 불은 소문을 덮는 대신 왕궁 위치를 반란군에게 밝혔습니다. 가짜 징조를 더 큰 징조로 누르려던 덕만은 불타는 지붕 아래에서 죽었습니다."

  bidam_letter_arrives:
    actions:
      - bg: throne_hall
      - camera: medium
      - say:
          channel: narration
          text: "북쪽 길의 봉화가 반란군 손으로 넘어갔습니다. 밤중에 화살 하나가 왕좌 앞까지 미끄러졌고, 화살대에는 구겨진 편지가 묶여 있었습니다."
      - sticker: { id: c11_letter, image: bidam_letter_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, rotate: 2, enter: fadeIn }
      - get: bidam_letter
      - say:
          channel: record
          delivery: calm
          text: "폐하께. 제 눈으로 나라를 보실 때는 저를 믿는다 하셨습니다. 다른 눈을 세운 뒤에는 저를 위험이라 부르셨지요. 저는 사람이었습니까, 잠시 쓰는 문이었습니까?"
      - clearSticker: { id: c11_letter, leave: fadeOut }
      - goto: answer_bidam

  answer_bidam:
    actions:
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "답장 한 줄이면 공격을 늦출 수 있습니다. 하지만 비담은 폐하의 쉼표까지 항복문으로 읽어 군사에게 보여 줄 겁니다."
      - choice:
          key: c11_bidam_answer
          prompt: "붓끝에 비담의 이름이 걸린다. 어떤 문장을 보낼까?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "믿었고, 너무 많이 맡긴 잘못도 쓴다"
              add: { bidam_trust: 1, mercy: 2, evidence: 1 }
              goto: honest_letter
            - text: "편지를 장터 벽에 그대로 붙인다"
              add: { people_support: 2, fear: 1, bidam_trust: -2 }
              goto: publish_letter
            - text: "비담의 글씨를 베껴 철군 명령을 보낸다"
              add: { army_support: 2, fear: 2, evidence: -1 }
              goto: forged_withdrawal

  honest_letter:
    actions:
      - say:
          char: 덕만
          text: "너를 믿었다. 그래서 네 충성이 법 대신 서게 둔 건 내 잘못이다. 돌아와라. 내 잘못과 네 반역을 같은 재판상에 올리겠다."
      - say:
          channel: narration
          text: "비담은 편지를 두 번 읽고 공격 북을 거꾸로 눕혔습니다. 반나절뿐이었지만 '버림받았다'는 격문의 한 줄이 먹으로 지워졌습니다."
      - goto: rebellion_strategy

  publish_letter:
    actions:
      - say:
          channel: narration
          text: "편지가 시장 벽에 붙자 비담의 상처는 웃음거리가 됐습니다. 그와 함께 창을 든 사람들은 자기 굶주림과 분노까지 조롱받았다고 느끼며 대열을 더 조였습니다."
      - goto: rebellion_strategy

  forged_withdrawal:
    actions:
      - say:
          channel: narration
          text: "가짜 철군 명령을 읽은 한 부대가 진을 비웠습니다. 길은 열렸지만 덕만의 손에는 어린 날 사망 기록과 같은 거짓 획이 남았습니다."
      - goto: rebellion_strategy

  rebellion_strategy:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "망루 아래 세 진영의 모닥불 색이 달랐습니다. 비담의 전령, 권한을 빼앗긴 귀족 사병, 별의 소문을 믿고 따라온 농민군. 깃발만 같을 뿐 서로 원하는 승리는 달랐습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "한꺼번에 치면 오늘 끝납니다. 깃발 아래 사람을 가려내면 오래 걸립니다. 대신 돌아갈 길은 남습니다."
      - choice:
          key: c11_rebellion_response
          prompt: "세 진영의 불이 켜져 있다. 어느 불부터 끌까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "해산 북을 울리고 지휘부만 에워싼다"
              set: { rebellion_response: amnesty_split }
              add: { mercy: 3, people_support: 2, army_support: -1 }
              goto: split_rebellion
            - text: "군량길을 끊고 공개 재판을 외친다"
              set: { rebellion_response: siege_trial }
              add: { evidence: 2, nobles_support: 1, fear: 1 }
              goto: starve_command
            - text: "유신의 전군으로 비담 본진을 덮친다"
              set: { rebellion_response: total_assault }
              goto: bad_fortress_rush

  split_rebellion:
    actions:
      - say:
          channel: narration
          text: "세 번째 해산 북이 울리자 농민군부터 창을 놓았습니다. 빈손으로 돌아가는 등을 왕군이 지켜보는 동안 귀족들은 '반역자를 살려 보냈다'고 외쳤습니다."
      - goto: bidam_captured

  starve_command:
    actions:
      - say:
          channel: narration
          text: "사흘째, 반란군 솥에서 연기가 끊겼습니다. 항복자는 늘었지만 같은 길을 쓰던 성 밖 마을의 아궁이도 함께 식었습니다."
      - say:
          char: 덕만.queen_sad
          camera: close
          with: [유신]
          text: "칼을 안 썼다고 깨끗한 게 아니야. 저 마을의 빈 솥도 승전 기록에 적어."
      - goto: bad_fortress_rush

  bidam_captured:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "비담은 결박된 손으로 왕궁 문을 다시 넘었습니다. 처음 만난 창고에서처럼 웃지 않았고, 왕좌 앞에서도 끝내 무릎을 꿇지 않았습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "별이 떨어진 게 아니었군요. 제가 제 몸에 불을 붙이고 뛰어내렸습니다. 이제 폐하께서 어디까지 저를 사람으로 적으실지 보겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "네가 나에게 듣고 싶은 말과, 죽은 사람들에게 남겨야 할 판결은 다르다. 내일 둘을 같은 자리에서 듣게 해 주마."
      - say:
          channel: record
          text: "반란은 끝났습니다. 불붙은 연과 비담의 서신, 어린 덕만의 사망 기록은 모두 사실보다 먼저 결론을 퍼뜨린 같은 방식의 증거였습니다. 이제 비담의 목숨과 그 방식을 만든 왕실까지 마지막 재판을 기다렸습니다."
      - goto: /11.yaml

  bad_fortress_rush:
    actions:
      - bg: frontier
      - camera: close
      - effect: darken
      - char: { id: 유신, position: right, emotion: angry }
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - say:
          char: 덕만.queen_angry
          text: "군량길을 끊으면 항복할 줄 알았고, 본진을 치면 끝날 줄 알았다. 내가 돌아갈 길부터 없앴구나."
      - say:
          char: 유신.angry
          text: "적의 돌아갈 길을 없애면 항복할 손도 칼을 잡습니다. 이제 어느 깃발 아래 있는지로 사람을 가를 수 없습니다."
      - say:
          channel: narration
          text: "포위가 길어지자 굶은 마을이 반란군 문을 열었고, 급습을 택하자 불붙은 막사가 민가로 번졌습니다. 서로 다른 속도의 강경책은 끝내 민가 전체를 적진으로 만들었습니다."
      - say:
          channel: record
          text: "비담의 난 진압 보고 — 왕군 지휘부 붕괴. 선덕왕, 포위망을 돌파한 반란군의 화살에 맞아 사망. 비담의 행방은 확인되지 않음."
      - gameOver:
          title: "운명 — 끝내기 위해 키운 반란"
          message: "굶기는 포위와 가리지 않는 돌격은 속도만 달랐을 뿐 돌아갈 사람의 길을 없앴습니다. 궁지에 몰린 군대와 마을이 함께 덤볐고, 덕만은 끝내려던 반란 한가운데서 죽었습니다."
