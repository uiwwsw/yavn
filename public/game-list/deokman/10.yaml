chapterTitle: "떨어진 별"

script:
  - scene: falling_star_rumor

scenes:
  falling_star_rumor:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: starfall
      - say:
          camera: wide
          channel: record
          text: "제11장 — 떨어진 별"
      - say:
          channel: action
          text: "불의 꼬리가 궁 위를 긋는다. 여왕의 별이 떨어졌다는 외침이 뒤따른다. 나는 담장 너머를 본다. 별이 저렇게 낮게 날 수도 있나."
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "북쪽 전령길을 비담이 막았습니다. 권한을 잃은 가문들이 그 깃발 아래 모였습니다."
      - say:
          char: 덕만
          camera: medium
          with: [춘추]
          text: "봉화가 꺼지자마자 떨어졌어. 군량이 끊긴 날에. 춘추야, 떨어진 곳부터 찾아라."
      - say:
          when: { var: used_false_omen, op: eq, value: true }
          channel: narration
          text: "왕실이 일식에 북을 쳤던 일을 사람들이 꺼냈다. 그때는 여왕이 해를 돌렸다더니, 오늘 별은 왜 아니라 하느냐고 물었다."
      - say:
          when: { var: observatory_priority, op: eq, value: stars_first }
          channel: narration
          text: "일찍 세운 탑에서 관측관이 불의 궤적을 보았다. 별치고는 낮다고 했다. 보고가 끝나기 전 북쪽 성벽에서 반란 봉화가 올랐다."
      - say:
          when: { var: observatory_priority, op: eq, value: balanced }
          channel: narration
          text: "미완성인 탑에서는 떨어진 방향을 놓쳤다. 보강한 성벽의 초병이 탄 대나무를 가져왔다. 담 아래서 주웠다고 했다."
      - say:
          when: { var: observatory_priority, op: eq, value: granary_first }
          channel: narration
          text: "곡식 품삯을 받고 돌을 날랐던 사내가 잔해를 들고 왔다. 기름 냄새를 맡더니 공사장에서도 이런 불쏘시개를 썼다고 했다."
      - choice:
          key: c11_falling_star
          prompt: "별이 떨어졌다며 군사가 움직인다. 먼저 할 일은?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "관측관들을 장터로 보내 진짜 별을 가리킨다"
              when: { var: knowledge_policy, op: ne, value: bidam_network }
              add: { people_support: 2, insight: 1 }
              goto: explain_sky
            - text: "낙하지에 먼저 가 재를 사람들 앞에 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: inspect_kite
            - text: "왕궁 지붕에 더 큰 불을 올린다"
              add: { fear: 2, people_support: 1 }
              goto: bad_larger_false_star

  inspect_kite:
    actions:
      - sticker: { id: c11_kite, image: burnt_kite_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 310px)", anchorX: center, anchorY: center, enter: rotateIn }
      - get: burnt_kite
      - say:
          channel: action
          text: "재를 헤치자 손끝이 따갑다. 가늘고 곧은 대나무가 잡힌다. 끝에 끈이 달려 있다. 끊어지지 않게 흙째 들어 올린다."
      - clearSticker: { id: c11_kite, leave: fadeOut }
      - goto: bidam_letter_arrives

  explain_sky:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - get: burnt_kite
      - say:
          channel: narration
          text: "관측관이 하늘을 가리켰다. 별은 제자리에 있었다. 사람들은 표를 돌려 보며 같은 점을 찾았다. 아이 하나가 담 아래서 탄 연살을 가져왔다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "두 군영은 북을 멈췄습니다. 나머지 하나는 전령을 돌려보냈습니다."
      - say:
          char: 덕만.queen
          text: "그쪽에도 표를 보내라. 두 곳이 멈춘 것을 알면 들을지 모른다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "이미 동문을 넘었습니다. 폐하, 궁으로 가는 길이 없습니다."
      - say:
          channel: narration
          text: "장터 사람들이 길을 터 주었다. 덕만은 궁으로 말을 달렸다. 문 위에 낯선 깃발이 펄럭였다. 활을 든 병사들은 표를 읽으려 하지 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 첫날 — 선덕왕, 장터에서 민심을 수습하고 귀환하던 중 반란군에게 피살."
      - gameOver:
          title: "운명 — 사실보다 빠른 불"
          message: "두 군영이 멈춘 사이 남은 한 군영이 궁문을 차지했다. 덕만이 돌아갈 때 길을 열어 줄 병사는 없었다."
          recoverToChoice: c11_falling_star

  bad_larger_false_star:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.queen_angry
          text: "궁 지붕에 불을 올려라. 내가 살아 있음을 보게 하라. 더 높이!"
      - say:
          channel: narration
          text: "장터에서 환호가 났다. 성 밖의 궁수들도 고개를 들었다. 어둠 속 여러 지붕 가운데 하나가 또렷해졌다."
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "불을 끄십시오! 저들이 이 지붕을 겨눕니다!"
      - say:
          char: 덕만.queen_sad
          camera: medium
          text: "내가 올리라 했다. 다들 내려가라. 불부터 끄지 말고, 사람부터!"
      - gameOver:
          title: "운명 — 더 큰 거짓 별"
          message: "기와 밑으로 불화살이 박혔다. 덕만이 올린 불과 반란군이 쏜 불이 한데 붙었다. 지붕이 내려앉았다. 덕만이 죽은 뒤에도 불은 한동안 꺼지지 않았다."

  bidam_letter_arrives:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: medium
          channel: action
          text: "돌바닥에서 화살이 미끄러진다. 나는 한 발 물러섰다가 화살대의 종이를 본다. 익숙한 매듭이다. 풀던 손이 잠깐 멈춘다."
      - sticker: { id: c11_letter, image: bidam_letter_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, rotate: 2, enter: fadeIn }
      - get: bidam_letter
      - say:
          channel: record
          delivery: calm
          text: "폐하께. 밤마다 저를 부르셨지요. 사람을 살려 오라 하실 때도, 이름을 지우라 하실 때도. 이제는 저 없이도 된다 하십니다. 저는 그 말을 어찌 받아야 합니까."
      - say:
          when: { var: knowledge_policy, op: eq, value: public }
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "북을 멈춘 군영이 있답니다. 비담도 듣겠지요. 자기 전령 없이 명이 닿았다는 것을."
      - say:
          when: { var: knowledge_policy, op: eq, value: bidam_network }
          char: 덕만.queen_sad
          camera: medium
          with: [춘추]
          text: "내가 열어 준 길이다. 암호도 군량도 의심하지 말라 했어. 내 말이 그들을 보냈다."
      - clearSticker: { id: c11_letter, leave: fadeOut }
      - goto: answer_bidam

  answer_bidam:
    actions:
      - char:
          id: "유신"
          position: "right"
          emotion: "angry"
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "답장을 기다리는 동안은 공격하지 않겠답니다. 약속하실 수 있는 말만 쓰십시오."
      - choice:
          key: "c11_bidam_answer"
          prompt: "비담에게 보낼 종이를 편다. 첫 줄이 나오지 않는다."
          char: "덕만"
          camera: "medium"
          with:
            - "유신"
          options:
            - text: "편지를 장터 벽에 그대로 붙인다"
              add:
                people_support: 2
                fear: 1
                bidam_trust: -2
              goto: "publish_letter"
            - text: "비담의 글씨를 베껴 철군 명령을 보낸다"
              add:
                army_support: 2
                fear: 2
                evidence: -1
              goto: "forged_withdrawal"
            - text: "믿었고, 너무 많이 맡긴 잘못도 쓴다"
              add:
                bidam_trust: 1
                mercy: 2
                evidence: 1
              goto: "honest_letter"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_kite"

  honest_letter:
    actions:
      - say:
          char: 덕만
          text: "너를 믿었다. 너무 많은 일을 네 손에만 맡겼다. 그것은 내 허물이다. 돌아와라. 네가 저지른 죄도 내 앞에서 답하라."
      - say:
          channel: action
          text: "북이 멈췄다는 전갈이 온다. 반나절뿐이다. 창밖으로 아이 업은 여인이 지나간다. 나는 답장에 남은 먹을 말리며 그 걸음을 센다."
      - goto: rebellion_strategy

  publish_letter:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "벽에 붙은 편지를 소리 내 읽는 사람이 있었다. 몇이 웃었다. 비담 휘하의 병사가 그 앞에 한참 서 있다가 돌아갔다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "백기입니다. 답을 보내기도 전에 항복해 왔습니다. 폐하, 그 물 받지 마십시오."
      - say:
          char: 덕만.queen_sad
          camera: medium
          with: [유신]
          text: "비웃게 하려던 건 아니었다고… 직접 말하겠다. 비켜라."
      - say:
          channel: narration
          text: "항복병이 내민 물에서 쓴맛이 났다. 덕만은 잔을 뱉듯 내려놓았다. 병사는 무릎 꿇은 채 고개를 들지 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 진압 기록 — 선덕왕, 항복병이 바친 물을 마신 뒤 독으로 사망."
      - gameOver:
          title: "운명 — 벽에 붙인 상처"
          message: "거짓 항복을 가릴 겨를도 없이 잔이 건네졌다. 벽에 붙인 편지는 그대로였지만, 덕만은 답을 전하지 못했다."
          recoverToChoice: c11_bidam_answer

  forged_withdrawal:
    actions:
      - bg: { id: shadow_corridor, transition: fade, duration: 900 }
      - say:
          channel: narration
          text: "비담의 필체를 흉내 낸 철군 명령이 나갔다. 적진에서 군사가 물러났다. 덕만은 빈 길을 보며 붓에 묻은 먹을 닦았다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "멈추십시오! 전령이 우리 명령서를 돌려보냈습니다. 알고 길을 연 겁니다!"
      - say:
          char: 덕만.queen_angry
          camera: medium
          with: [유신]
          text: "앞줄 멈춰! 돌아서라! 그 길로 들어가면—"
      - say:
          channel: narration
          text: "양쪽 비탈에서 화살이 쏟아졌다. 덕만의 명령을 믿고 앞선 병사들이 쓰러졌다. 뒤에서는 진짜 비담의 기가 올라왔다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 전투 기록 — 선덕왕, 위조 철군 명령으로 적진에 진입했다가 매복으로 사망."
      - gameOver:
          title: "운명 — 속은 척 열린 길"
          message: "비담의 전령은 위조된 글씨를 알아보았다. 덕만이 연 줄 알았던 길은 안으로 들어오는 발만 기다리고 있었다."
          recoverToChoice: c11_bidam_answer

  rebellion_strategy:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          camera: wide
          channel: thought
          text: "같은 깃발 아래 솥이 세 군데다. 전령들은 따로 먹고, 귀족의 군사는 농민을 밀어낸다. 저들이 모두 끝까지 함께 싸울까."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "해산할 길을 주면 나올 자들이 있습니다. 돌격하시면 가릴 틈은 없습니다."
      - say:
          when: { var: yushin_trust, op: gte, value: 4 }
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "명만 주십시오. 돌아갈 자들 앞에서는 제 칼도 멈추겠습니다."
      - choice:
          key: c11_rebellion_response
          prompt: "반란군 진영에서 빈 그릇을 두드리는 소리가 난다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "해산 북을 울리고 지휘부만 에워싼다"
              set: { rebellion_response: amnesty_split }
              add: { mercy: 3, people_support: 2, army_support: -1 }
              goto: split_rebellion
            - text: "유신의 전군으로 비담 본진을 덮친다"
              set: { rebellion_response: total_assault }
              goto: bad_fortress_rush
            - text: "군량길을 끊고 공개 재판을 외친다"
              set: { rebellion_response: siege_trial }
              add: { evidence: 2, nobles_support: 1, fear: 1 }
              goto: starve_command

  split_rebellion:
    actions:
      - say:
          channel: action
          text: "세 번째 북이 울리자 첫 창이 땅에 놓인다. 뒤이어 농민들이 나온다. 귀족이 고함쳐도 돌아보지 않는다. 나는 빈손을 확인한 사람부터 길을 내준다."
      - goto: bidam_captured

  starve_command:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - say:
          channel: "narration"
          text: "포위 사흘째 마을에서도 연기가 오르지 않았다. 덕만은 빈 솥을 들고 온 노인을 만났다. 좁은 배급길이 열리고 병사들이 물러났다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "유신"
          text: "내가 길을 끊어 이리 됐다. 죽을 쑤어라. 돌아갈 사람에게 죄부터 묻지 마라."
      - say:
          char: "유신.angry"
          camera: "medium"
          with:
            - "덕만"
          text: "지휘관 몇도 섞여 나갈 겁니다. 얼굴을 아는 자를 세워 두겠습니다."
      - say:
          channel: "narration"
          text: "농민들이 배급길로 나왔다. 그 틈에 사라진 지휘관도 있었다. 잡아야 할 이름 몇이 명부에 남았으나, 비담의 진영은 눈에 띄게 줄었다."
      - add:
          people_support: -4
      - say:
          channel: thought
          text: "칼을 덜 썼다고 말하려 했다. 노인이 빈 솥을 도로 메는 것을 보고 입을 다문다."
      - goto: "bidam_captured"

  bidam_captured:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          camera: wide
          channel: action
          text: "비담이 묶인 손으로 문턱을 짚는다. 처음 만난 창고에서는 저 손에 장부가 들려 있었다. 나를 올려다본다. 웃지 않는다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "연에는 제가 불을 붙였습니다. 다른 자 이름을 찾으실 필요 없습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내일 직접 말해라. 네가 기다렸다는 내 대답도 그 자리에서 하겠다."
      - say:
          channel: thought
          text: "비담이 끌려간 뒤에도 문턱의 손자국이 남아 있다. 나는 사망 기록을 꺼내 놓는다. 이번에는 산 사람의 말을 끝까지 듣겠다."
          with: []
          camera: wide
          continueLabel: 비담과 피해자들의 말을 재판에 올린다
      - goto: /11.yaml

  bad_fortress_rush:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - camera: { shot: close, target: 덕만 }
      - effect: darken
      - char: { id: 유신, position: right, emotion: angry }
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - say:
          char: 덕만.queen_angry
          text: "민가로 번진다. 뒤로 물려라. 앞만 치지 말고, 불길부터 갈라!"
      - say:
          char: 유신.angry
          text: "돌아갈 길이 없습니다! 창을 놓았던 자들도 다시 듭니다!"
      - say:
          channel: narration
          text: "본진에 붙은 불이 초가지붕으로 옮겨 갔다. 집을 잃은 사람들이 왕군 앞을 막았다. 병사들은 어느 손에 무기가 들렸는지 볼 틈도 없었다."
      - say:
          channel: record
          text: "비담의 난 진압 보고 — 왕군 지휘부 붕괴. 선덕왕, 포위망을 돌파한 반란군의 화살에 맞아 사망. 비담의 행방은 확인되지 않음."
      - gameOver:
          title: "운명 — 끝내기 위해 키운 반란"
          message: "한 번에 끝내려던 돌격이 민가까지 번졌다. 덕만을 겨눈 화살이 어느 깃발 밑에서 왔는지는 끝내 밝혀지지 않았다."

  evidence_kite:
    actions:
      - sticker:
          id: desk_0
          image: burnt_kite_sticker
          x: 27
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - sticker:
          id: desk_1
          image: bidam_letter_sticker
          x: 73
          'y': 43
          width: clamp(140px, 44%, 380px)
          anchorX: center
          anchorY: center
          enter: fadeIn
          zIndex: 14
      - say:
          channel: action
          text: "불탄 대나무를 편지 옆에 놓는다. 매운 냄새가 난다. 매듭은 풀지 않는다. 묶인 채로 두 끈을 같은 방향에 맞춘다."
          with: []
          camera: wide
      - goto: evidence_kite_compare

  evidence_kite_compare:
    actions:
      - choice:
          key: evidence_kite_look
          presentation: explore
          prompt: "연과 편지를 묶었던 끈. 어느 쪽부터 살필까?"
          camera: wide
          with: []
          options:
            - text: 연에 남은 끈
              at:
                x: 27
                "y": 75
              goto: evidence_kite_detail_0
            - text: 편지의 봉끈
              at:
                x: 73
                "y": 75
              goto: evidence_kite_detail_1
            - text: 살펴본 두 흔적을 대조한다
              when:
                all:
                  - var: evidence_kite_seen_0
                    op: eq
                    value: true
                  - var: evidence_kite_seen_1
                    op: eq
                    value: true
              goto: evidence_kite_deduce
            - text: 물건을 챙기고 돌아간다
              goto: evidence_kite_return


  evidence_kite_retry:
    actions:
      - say:
          channel: thought
          text: "이름만으로는 부족해. 쓴 사람이 묶은 사람과 같다는 보장도 없다. 두 끈에서 직접 맞춰 본 것이 무엇이었지?"
          with: []
          camera: wide
      - goto: evidence_kite_compare

  evidence_kite_solved:
    actions:
      - set:
          kite_verified: true
      - say:
          char: "덕만"
          text: "비담의 전령 매듭이야. 그 길로 연이 왔구나. 다만 묶은 손이 누구인지는 더 물어야 해."
      - goto: "evidence_kite_return"


  evidence_kite_return:
    actions:
      - clearSticker:
          id: "desk_0"
          leave: "fadeOut"
      - clearSticker:
          id: "desk_1"
          leave: "fadeOut"
      - goto: "answer_bidam"

  evidence_kite_deduce:
    actions:
      - choice:
          key: evidence_kite
          prompt: "이 연이 전령길을 거쳤음을 보여 주는 것은?"
          camera: wide
          options:
            - text: 짧은 고리 두 개를 묶은 같은 전령 매듭
              goto: evidence_kite_solved
            - text: 편지에 쓰인 비담의 이름만
              goto: evidence_kite_retry
            - text: 하늘에서 떨어진 시각만
              goto: evidence_kite_retry
            - text: 판단을 미루고 돌아간다
              goto: evidence_kite_return
          with: []

  evidence_kite_detail_0:
    actions:
      - say:
          channel: action
          text: "연살 끝에 짧은 고리가 둘 남았다. 그을린 끈을 뒤집어 보니 고리 하나가 다른 고리 밑으로 지나간다."
          with: []
          camera: wide
      - set:
          evidence_kite_seen_0: true
      - goto: evidence_kite_compare

  evidence_kite_detail_1:
    actions:
      - say:
          channel: action
          text: "편지의 봉끈도 두 고리다. 나란히 놓자 꼬인 방향까지 맞는다. 밤마다 비담의 전령이 풀던 바로 그 매듭이다."
          with: []
          camera: wide
      - set:
          evidence_kite_seen_1: true
      - goto: evidence_kite_compare
