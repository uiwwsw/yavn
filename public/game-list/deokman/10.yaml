script:
  - scene: falling_star_rumor

scenes:
  falling_star_rumor:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: starfall
      - say:
          channel: record
          text: "제11장 — 떨어진 별"
      - say:
          channel: narration
          text: "사흘 뒤 밤, 불붙은 것이 별처럼 왕궁 위를 가로질렀습니다. 사람들이 하늘을 올려다보기도 전에 군영과 시장에서 같은 외침이 터졌습니다. '여왕의 별이 떨어졌다.'"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 춘추.nervous
          camera: medium
          with: [덕만]
          text: "비담이 북쪽 전령길을 닫았습니다. 권한을 잃은 가문들은 저 불을 '여왕의 별'이라 부르며 모였고요."
      - say:
          char: 덕만
          camera: close
          with: [춘추]
          text: "별이 아니야. 군량이 빈 날, 봉화가 꺼진 때에 맞춰 떨어졌어. 낙하지부터 찾자."
      - say:
          when: { var: used_false_omen, op: eq, value: true }
          channel: narration
          text: "일식 날 북소리로 해를 돌려놓았다고 외친 기억 탓에 왕실은 즉시 반박하지 못했습니다. 사람들은 여왕의 하늘도 또 하나의 연출인지 먼저 의심했습니다."
      - say:
          when: { var: observatory_priority, op: eq, value: stars_first }
          channel: narration
          text: "먼저 올린 첨성대의 관측관은 불의 꼬리가 별보다 낮게 휘는 것을 봤습니다. 대신 느슨해진 북쪽 성벽에서는 이미 첫 반란 봉화가 올랐습니다."
      - say:
          when: { var: observatory_priority, op: eq, value: balanced }
          channel: narration
          text: "반쯤 세운 관측대는 불이 떨어진 정확한 방향을 놓쳤지만, 보강한 성벽의 초병이 대나무 잔해를 가장 먼저 찾았습니다."
      - say:
          when: { var: observatory_priority, op: eq, value: granary_first }
          channel: narration
          text: "돌 품삯을 곡식으로 받았던 마을 사람들이 냄새만으로 기름 먹인 대나무를 알아봤습니다. 늦게 올린 탑 대신 사람의 눈이 증거를 찾았습니다."
      - choice:
          key: c11_falling_star
          prompt: "불붙은 연이 별이라는 소문이 퍼집니다. 무엇을 먼저 보여 줄까요?"
          char: 덕만
          camera: medium
          with: [춘추]
          options:
            - text: "낙하지에 먼저 가 재를 사람들 앞에 펼친다"
              add: { evidence: 2, insight: 1 }
              goto: inspect_kite
            - text: "관측관들을 장터로 보내 진짜 별을 가리킨다"
              when: { var: knowledge_policy, op: ne, value: bidam_network }
              add: { people_support: 2, insight: 1 }
              goto: explain_sky
            - text: "왕궁 지붕에 더 큰 불을 올린다"
              add: { fear: 2, people_support: 1 }
              goto: bad_larger_false_star

  inspect_kite:
    actions:
      - sticker: { id: c11_kite, image: burnt_kite_sticker, x: 50, y: 28, width: "clamp(170px, 20%, 310px)", anchorX: center, anchorY: center, enter: rotateIn }
      - get: burnt_kite
      - say:
          channel: narration
          text: "재를 헤치자 대나무 살이 손에 걸렸습니다. 기름 먹인 천 끝에는 비담 전령의 매듭이 그대로 남아 있었습니다."
      - clearSticker: { id: c11_kite, leave: fadeOut }
      - goto: bidam_letter_arrives

  explain_sky:
    actions:
      - bg: village
      - get: burnt_kite
      - say:
          channel: narration
          text: "관측관이 하늘 한 점을 가리켰습니다. '진짜 별은 아직 저기 있습니다.' 장터마다 다른 손이 같은 표를 펴고 같은 자리를 찾아냈습니다. 아이들이 불붙은 연의 대나무 살을 먼저 찾아 들었습니다."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "장터에서 같은 표를 읽자 소문이 갈렸습니다. 한 군영은 움직였지만 둘은 북을 눕혔습니다."
      - say:
          char: 덕만.queen
          text: "두 군영은 멈췄어. 남은 한 곳에도 관측표를 보내. 아직 늦지 않았어."
      - say:
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "한 군영이 동문을 넘었습니다. 관측관을 모두 보낸 탓에 궁엔 저 불을 가릴 사람도 없습니다."
      - say:
          channel: narration
          text: "진실을 들은 사람들은 멈췄지만 반란군은 그 시간을 기다리지 않았습니다. 덕만이 장터에서 돌아왔을 때 왕궁 퇴로는 이미 끊겨 있었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 첫날 — 선덕왕, 장터에서 민심을 수습하고 귀환하던 중 반란군에게 피살."
      - gameOver:
          title: "운명 — 사실보다 빠른 불"
          message: "관측관의 설명은 옳았지만 이미 움직인 군대보다 느렸습니다. 증거를 찾기 전에 모든 눈을 설득하러 보낸 덕만은 비어 버린 왕궁으로 돌아가지 못했습니다."
          recoverToChoice: c11_falling_star

  bad_larger_false_star:
    actions:
      - bg: burning_palace
      - camera: { shot: close, target: 덕만 }
      - effect: embers
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 덕만.queen_angry
          text: "왕궁 지붕에 불을 올려라. 저 가짜 별보다 크게. 왕이 섰다는 걸 보여 줘."
      - say:
          channel: narration
          text: "도성의 환호가 잠시 돌아왔습니다. 그러나 성 밖 반란군에게 가장 밝은 불은 왕이 숨은 지붕을 가리키는 봉화가 되었습니다."
      - say:
          char: 춘추.nervous
          camera: reaction
          with: [덕만]
          text: "폐하, 불화살이 이쪽으로 모입니다. 소문을 덮은 게 아니라 표적을 그려 줬습니다!"
      - say:
          char: 덕만.queen_sad
          camera: close
          text: "거짓을 이긴다고 더 큰 거짓을 골랐구나. 저 불은 내가 불렀어."
      - gameOver:
          title: "운명 — 더 큰 거짓 별"
          message: "여왕의 불은 소문을 덮는 대신 왕궁 위치를 반란군에게 밝혔습니다. 가짜 징조를 더 큰 징조로 누르려던 덕만은 불타는 지붕 아래에서 죽었습니다."

  bidam_letter_arrives:
    actions:
      - bg: throne_hall
      - camera: medium
      - say:
          channel: narration
          text: "북쪽 길의 봉화가 반란군 손으로 넘어갔습니다. 밤중에 화살 하나가 왕좌 앞까지 미끄러졌고, 화살대에는 구겨진 편지가 묶여 있었습니다."
      - sticker: { id: c11_letter, image: bidam_letter_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 330px)", anchorX: center, anchorY: center, rotate: 2, enter: fadeIn }
      - get: bidam_letter
      - say:
          channel: record
          delivery: calm
          text: "폐하께. 제 눈으로 나라를 보실 때는 저를 믿는다 하셨습니다. 다른 눈을 세운 뒤에는 저를 위험이라 부르셨지요. 저는 사람이었습니까, 잠시 쓰는 문이었습니까?"
      - say:
          when: { var: knowledge_policy, op: eq, value: public }
          char: 춘추.nervous
          camera: close
          with: [덕만]
          text: "장터 달력이 두 군영을 멈췄습니다. 비담이 두려운 건 느린 전령이 아닙니다. 자기 없이도 보는 폐하시죠."
      - say:
          when: { var: knowledge_policy, op: eq, value: bidam_network }
          char: 덕만.queen_sad
          camera: close
          with: [춘추]
          text: "나라의 눈과 귀를 비담에게 몰아준 건 나야. 저들이 쥔 길 절반은 내가 건넸어."
      - clearSticker: { id: c11_letter, leave: fadeOut }
      - goto: answer_bidam

  answer_bidam:
    actions:
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "답장 한 줄이면 공격을 늦춥니다. 다만 비담은 사과를 사랑으로, 망설임을 항복으로 읽을 겁니다. 분명히 쓰십시오."
      - choice:
          key: c11_bidam_answer
          prompt: "비담의 편지에 어떻게 답할까요?"
          char: 덕만
          camera: close
          with: [유신]
          options:
            - text: "믿었고, 너무 많이 맡긴 잘못도 쓴다"
              add: { bidam_trust: 1, mercy: 2, evidence: 1 }
              goto: honest_letter
            - text: "편지를 장터 벽에 그대로 붙인다"
              add: { people_support: 2, fear: 1, bidam_trust: -2 }
              goto: publish_letter
            - text: "비담의 글씨를 베껴 철군 명령을 보낸다"
              add: { army_support: 2, fear: 2, evidence: -1 }
              goto: forged_withdrawal

  honest_letter:
    actions:
      - say:
          char: 덕만
          text: "나는 너를 믿었고 필요로 했다. 네 충성을 법처럼 쓴 건 내 잘못이다. 돌아와라. 내 잘못과 네 반역은 따로 묻겠다."
      - say:
          channel: narration
          text: "비담은 편지를 두 번 읽고 공격 북을 거꾸로 눕혔습니다. 반나절뿐이었지만 ‘버림받았다’는 격문의 한 줄을 자기 손으로 지웠고, 그 틈에 마을 하나가 진영을 빠져나왔습니다."
      - goto: rebellion_strategy

  publish_letter:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "편지가 시장 벽에 붙자 비담의 상처는 웃음거리가 됐습니다. 그와 함께 창을 든 사람들은 자기 굶주림과 분노까지 조롱받았다고 느끼며 대열을 더 조였습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "편지를 읽은 진영이 백기를 들었습니다. 너무 빠릅니다. 폐하, 저 물동이 치우십시오."
      - say:
          char: 덕만.queen_sad
          camera: close
          with: [유신]
          text: "내가 그 사람의 상처를 구경거리로 만들었어. 직접 사과하고—"
      - say:
          channel: narration
          text: "항복병이 내민 물에서 쓴 냄새가 났을 때 덕만은 이미 한 모금 마신 뒤였습니다. 비담을 조롱당한 지도자로 본 병사들이 거짓 항복으로 여왕에게 독을 먹였습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 진압 기록 — 선덕왕, 항복병이 바친 물을 마신 뒤 독으로 사망."
      - gameOver:
          title: "운명 — 벽에 붙인 상처"
          message: "비담의 사적인 편지를 공개하자 반란군은 자기 분노까지 조롱받았다고 느꼈습니다. 거짓 항복으로 다가온 병사가 독물을 바쳤고 덕만은 사과할 틈도 없이 죽었습니다."
          recoverToChoice: c11_bidam_answer

  forged_withdrawal:
    actions:
      - bg: shadow_corridor
      - say:
          channel: narration
          text: "가짜 철군 명령을 읽은 한 부대가 진을 비웠습니다. 길은 열렸지만 덕만의 손에는 어린 날 사망 기록과 같은 거짓 획이 남았습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "남은 비담의 전령이 글씨를 알아봤습니다. 가짜인 줄 알면서 길을 열어 둔 겁니다."
      - say:
          char: 덕만.queen_angry
          camera: close
          with: [유신]
          text: "우리를 안으로 들이려고 속은 척한 거야. 전군 멈춰. 지금 돌아—"
      - say:
          channel: narration
          text: "열린 길 양쪽에서 화살이 쏟아졌습니다. 덕만의 위조문을 믿은 병사들이 가장 깊이 들어가 있었고, 퇴로에는 진짜 비담의 명령을 받은 군대가 기다렸습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 전투 기록 — 선덕왕, 위조 철군 명령으로 적진에 진입했다가 매복으로 사망."
      - gameOver:
          title: "운명 — 속은 척 열린 길"
          message: "비담의 글씨를 아는 전령은 위조를 즉시 알아보고 철군한 척 매복했습니다. 어린 덕만을 죽였던 방식으로 길을 연 여왕은 같은 거짓말 안에서 죽었습니다."
          recoverToChoice: c11_bidam_answer

  rebellion_strategy:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          channel: narration
          text: "망루 아래 세 진영의 모닥불 색이 달랐습니다. 비담의 전령, 권한을 빼앗긴 귀족 사병, 별의 소문을 믿고 따라온 농민군. 깃발만 같을 뿐 서로 원하는 승리는 달랐습니다."
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "한 군대로 보면 오늘 끝납니다. 이유를 나누면 오래 걸려도 창을 놓을 사람은 돌려보낼 수 있습니다."
      - say:
          when: { var: yushin_trust, op: gte, value: 4 }
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "제 칼을 멈춘 날도 지휘패를 맡긴 날도 기억합니다. 오늘은 누구를 살려 보낼지 먼저 명령하십시오."
      - choice:
          key: c11_rebellion_response
          prompt: "서로 다른 이유로 모인 반란군을 어떻게 흩을까요?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "해산 북을 울리고 지휘부만 에워싼다"
              set: { rebellion_response: amnesty_split }
              add: { mercy: 3, people_support: 2, army_support: -1 }
              goto: split_rebellion
            - text: "유신의 전군으로 비담 본진을 덮친다"
              set: { rebellion_response: total_assault }
              goto: bad_fortress_rush
            - text: "군량길을 끊고 공개 재판을 외친다"
              set: { rebellion_response: siege_trial }
              add: { evidence: 2, nobles_support: 1, fear: 1 }
              goto: starve_command

  split_rebellion:
    actions:
      - say:
          channel: narration
          text: "세 번째 해산 북이 울리자 농민군부터 창을 놓았습니다. 빈손으로 돌아가는 등을 왕군이 지켜보는 동안 귀족들은 '반역자를 살려 보냈다'고 외쳤습니다."
      - goto: bidam_captured

  starve_command:
    actions:
      - bg: frontier
      - say:
          channel: narration
          text: "사흘째, 반란군 솥에서 연기가 끊겼습니다. 항복자는 늘었지만 같은 길을 쓰던 성 밖 마을의 아궁이도 함께 식었습니다."
      - say:
          char: 덕만.queen_sad
          camera: close
          with: [유신]
          text: "마을까지 굶는데 왜 이제 말했지? 군량길을 나눠. 오늘 안에 죽을 보내."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "늦었습니다. 굶은 마을이 성문을 열었습니다. 항복이 아니라 우리 곡식을 빼앗으러 옵니다."
      - say:
          channel: narration
          text: "왕군이 마을과 싸우지 않으려 물러서는 사이 반란군이 그 틈으로 나왔습니다. 덕만은 빈 솥을 든 사람들 사이에서 군복을 숨긴 궁수의 화살을 맞았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담의 난 포위 기록 — 성 밖 기근으로 민가 폭동 발생. 선덕왕, 포위망 붕괴 중 화살에 맞아 사망."
      - gameOver:
          title: "운명 — 함께 끊긴 솥"
