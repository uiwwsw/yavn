script:
  - scene: chapter5_open
  - scene: chapter5_end

scenes:
  chapter5_open:
    actions:
      - bg: council_hall
      - char:
          id: 진운
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제5장 — 신라에는 이미 왕자가 있다"
      - say:
          char: 진운
          framing: full
          with:
            - 덕만
          text: "제 줄을 쥔 자가 있습니다. 그렇다고 생각까지 맡겼다고 보면, 공주께서 먼저 집니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "줄을 먼저 보여 주는 경쟁자라. 오래 볼수록 위험하겠군요."
      - goto: contest_choice

  contest_choice:
    actions:
      - choice:
          key: c5_contest
          prompt: "화백 앞, 진운을 어떻게 상대할까?"
          char: 덕만
          framing: closeup
          with:
            - 진운
          options:
            - text: "정사로 겨룬다"
              add:
                legitimacy: 1
                people_support: 1
              goto: contest_policy
            - text: "서로 속내를 밝힌다"
              add:
                rival_trust: 1
                insight: 1
              goto: contest_private
            - text: "먼저 말하게 둔다"
              add:
                insight: 2
              goto: contest_listen
            - text: "독살범으로 몬다"
              goto: go_27_dead_prince

  contest_policy:
    actions:
      - say:
          char: 진운
          framing: bust
          text: "공주께서는 이번 겨울의 천칠백을 살렸습니다. 저는 절반을 남겨 다음 겨울의 이천을 준비했을 겁니다. 어느 죽음이 더 무겁습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "내년의 이천은 장부에 있고, 오늘의 천칠백은 문밖에 있습니다. 먼날에 도착할 사람부터 살리겠습니다."
      - add:
          nobles_support: 1
      - goto: leverage_choice

  contest_private:
    actions:
      - say:
          char: 진운
          framing: closeup
          delivery: whisper
          text: "제 어머니는 국산의 별채 동쪽방에 있습니다. 창은 하나, 호위는 여섯. 회의에서 제 표가 늘 때마다 어머니 문밖의 칼도 하나씩 늘어납니다."
      - say:
          char: 덕만
          framing: bust
          text: "숨기지 않는 것이 그대의 방패라고 들었습니다. 좋습니다. 나는 그 자물쇠를 열 길을 말하고, 그대는 내 등에 겨눈 칼을 말하세요."
      - goto: leverage_choice

  contest_listen:
    actions:
      - say:
          delivery: deduction
          text: "진운이 첫 문장을 말할 때 국산의 입술도 같은 박자로 움직였다. 두 번째 문장 중간, 진운은 원고에 없는 단어 하나를 골라 천천히 발음했다."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "틀린 것이 아니라 일부러 틀렸어. 줄에 매달린 사람이 줄을 당겨 내 쪽을 보게 했군."
      - add:
          rival_trust: 1
      - goto: leverage_choice

  leverage_choice:
    actions:
      - say:
          char: 비담
          framing: bust
          text: "진운공의 약점은 셋. 별채의 어머니, 대신 갚아 준 빚, 자기 왕관이 피에 젖는 건 싫다는 양심."
      - say:
          char: 비담
          framing: bust
          text: "보통은 싼 것부터 씁니다. 어느 쪽을 사실 겁니까?"
      - choice:
          key: c5_leverage
          prompt: "진운의 약점을 손에 쥐었다. 쓸까?"
          char: 덕만
          framing: closeup
          with:
            - 비담
          options:
            - text: "어머니를 공개한다"
              goto: go_28_sons_crown
            - text: "어머니를 구해 거래한다"
              add:
                rival_trust: 2
                power: 1
              goto: leverage_deal
            - text: "혼인을 강요한다"
              goto: go_29_second_queen
            - text: "빚 장부만 공개한다"
              add:
                legitimacy: 1
                nobles_support: -1
              goto: leverage_ledger

  leverage_deal:
    actions:
      - say:
          char: 진운
          framing: closeup
          delivery: nervous
          text: "어머니를 빼내고도 제게 물러나라는 서약을 받지 않으셨습니다. 왜 제 약점을 쓰지 않으십니까?"
      - say:
          char: 덕만
          framing: bust
          text: "약점을 밟아 얻은 동맹은 다음 약점을 만날 때 배신합니다. 나는 그대의 목숨이 아니라, 그대가 스스로 고른 문장을 원해요."
      - goto: rescue_choice

  leverage_ledger:
    actions:
      - say:
          char: 국산
          framing: bust
          text: "궁핍한 왕족의 빚을 대신 갚아 드린 일이 반역이라니, 선의가 죄가 되는 세상이군요."
      - say:
          char: 덕만
          framing: bust
          text: "은전만 돌려받았다면 선의였겠지요. 회의에서 그대 문장을 그대로 읽은 횟수가 이자로 적혀 있습니다."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: shadow_corridor
      - say:
          delivery: nervous
          text: "회의가 끝난 밤, 진운의 마차가 좁은 비탈에 들어서자 앞바퀴 축이 부러졌다. 숲에서는 활시위 당기는 소리가 한 번에 열둘 울렸다."
      - choice:
          key: c5_rescue
          prompt: "진운의 마차에 화살이 향한다. 막을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "함께 미끼가 된다"
              add:
                rival_trust: 2
                power: 1
              set:
                saved_rival: true
              goto: rescue_personal
            - text: "유신에게 구출을 맡긴다"
              add:
                yushin_trust: 1
                army_support: 1
              set:
                saved_rival: true
              goto: rescue_yushin
            - text: "못 본 척한다"
              goto: go_30_martyr_prince
            - text: "암살을 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              set:
                saved_rival: true
              goto: rescue_public

  rescue_personal:
    actions:
      - effect: shake
      - say:
          char: 진운
          framing: closeup
          delivery: angry
          text: "왜 직접 탔습니까! 두 후계자가 한 마차에서 죽으면 계승동맹이 나라까지 상복으로 덮습니다. 공주께서는 계산도 못 하십니까?"
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "계산했어요. 그래서 무서워도 탔습니다. 그들이 가장 두려워하는 건 우리 둘의 죽음이 아니라…… 함께 살아 돌아오는 모습이니까."
      - goto: chapter5_end

  rescue_yushin:
    actions:
      - say:
          char: 유신
          framing: bust
          text: "진운공은 무사합니다. 궁수 열둘 중 셋을 생포했습니다. 한 명이 같은 붉은 매듭을 왕의 침전 약방에서 보았다고 진술했습니다."
      - goto: chapter5_end

  rescue_public:
    actions:
      - say:
          char: 국산
          framing: bust
          text: "일어나지도 않은 암살을 막으셨다니, 공주님의 공은 증명할 길이 없어 더욱 크겠습니다."
      - say:
          char: 덕만
          framing: bust
          text: "그렇군요. 그럼 오늘 밤 진운이 무사하면 아무 일도 없었던 것이고, 죽으면 그대가 방금 거짓말한 것이 됩니다. 어느 쪽이 편하십니까?"
      - goto: chapter5_end

  chapter5_end:
    actions:
      - add:
          legitimacy: 1
      - say:
          text: "덕만과 진운이 처음으로 같은 문서에 각자의 이름을 쓰려던 순간, 궁의 종이 장례 때처럼 거꾸로 울렸다. 한 번. 그리고 또 한 번."
          wait: 900
      - say:
          char: 천명.nervous
          framing: closeup
          delivery: nervous
          text: "덕만아, 아버지가 쓰러지셨어. 숨은 붙어 있는데 말씀을 못 하셔. 인장은 사라졌고…… 네 이름으로 체포령이 내려졌어."
      - say:
          text: "제5장 완료 — 덕만은 경쟁자를 동맹으로 얻는 대신, 아버지를 잃을 시간을 맞았다."

  go_27_dead_prince:
    actions:
      - gameOver:
          title: "운명 27 — 죽은 왕자"
          message: "진운은 결백을 주장하다 회의장을 나선 뒤 살해되었다. 사람들은 덕만의 거짓 폭로가 그를 죽였다고 믿었다. 죽은 경쟁자는 살아 있는 공주보다 완벽한 후계자가 되었다."
  go_28_sons_crown:
    actions:
      - gameOver:
          title: "운명 28 — 어머니의 값"
          message: "진운은 어머니를 살리기 위해 물러났다. 그러나 인질을 이용한 덕만을 왕으로 인정하지 않았다. 그의 마지막 증언 하나가 화백회의의 모든 표를 돌렸다."
  go_29_second_queen:
    actions:
      - gameOver:
          title: "운명 29 — 두 번째 왕비"
          message: "혼인은 내전을 막았고 덕만의 목숨도 지켰다. 왕좌에는 진운이 앉았고 덕만은 그 옆에 앉았다. 사람들은 그녀를 현명한 왕비라 불렀다."
  go_30_martyr_prince:
    actions:
      - gameOver:
          title: "운명 30 — 피 묻은 왕관"
          message: "진운은 죽으며 덕만의 이름을 불렀다. 계승동맹은 그 한마디를 살인의 증거로 만들었다. 덕만이 얻은 빈자리는 피가 마르기도 전에 닫혔다."
