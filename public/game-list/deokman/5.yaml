script:
  - scene: chapter5_open
  - scene: chapter5_end

scenes:
  chapter5_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          text: "제5장 — 두 개의 왕관"
      - say:
          delivery: calm
          text: "두 달 뒤, 631년 겨울."
      - say:
          with: [덕만]
          delivery: calm
          text: "국경에 보급로를 남기고 수도로 돌아온 지 3일째였습니다."
      - say:
          with: [덕만]
          wait: 700
          text: "수도로 떠나기 전 3일 동안, 국경 사람들은 빈 그릇마다 자기 이름을 적었습니다."
      - say:
          with: [덕만]
          text: "귀족들은 돌아온 덕만보다 그를 따라온 빈 그릇들을 더 오래 바라봤습니다."
      - say:
          with: [덕만, 진운]
          wait: 650
          text: "진평왕의 빈자리에는 식어 버린 약그릇만 놓여 있었습니다."
      - say:
          with: [진운]
          text: "그사이 칠숙은 진운을 남자 왕 후보로 내세웠습니다."
      - say:
          with: [진운]
          text: "귀족들은 왕의 딸보다 왕실과 먼 친척인 남자를 다음 왕으로 세우려 했습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 진운]
          text: "전하께서는 두 달 동안 다섯 번 쓰러지셨습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "아버지가 살아 계신데 다음 왕부터 정합니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "빈 왕좌를 본 뒤 정하면 이미 늦습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "석 달 전에는 제 남편이 될 분이었지요."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "이번에는 왕이 되라는 글을 받았습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "두 글 모두 제 손으로 쓴 것이 아닙니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 진운]
          text: "진운 왕자께 정식으로 인사하시지요."
      - say:
          char: 진운
          camera: medium
          with: [칠숙]
          text: "저는 왕자가 아닙니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "누구도 저를 다음 왕으로 정하지 않았습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진운]
          text: "귀족들 중 절반은 이미 왕자라 부르고 있습니다."
      - say:
          wait: 750
          text: "칠숙의 하인이 낡은 비녀 하나를 진운 앞에 내려놓았습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "어머니의 비녀입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "예. 제가 이기면 어머니를 살려 보내겠답니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          delivery: sad
          wait: 950
          text: "<speed=18>제가 지면, 다음에는 손가락을 보낸답니다.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [진운]
          text: "이건 경쟁이 아니라 협박이군요."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "그래도 공주님께 숨기고 시작하긴 싫었습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "공주님은 누구를 위해 왕이 되려 합니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "국경에서 제 대답을 기다린 사람들 때문입니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그런데 찻잔은 왜 계속 밀어 둡니까?"
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          wait: 550
          text: "계피 냄새를 싫어합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 정도 취향은 마음대로 해도 됩니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "저도 생강은 골라 냅니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          wait: 650
          text: "……그건 아무에게도 말하지 않겠습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그러면 저를 적으로 보십니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "아직은 적이 아니라 경쟁자입니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          wait: 800
          text: "그 차이가 오래 남았으면 좋겠습니다."
      - goto: contest_choice

  contest_choice:
    actions:
      - choice:
          key: c5_contest
          prompt: "두 사람 사이에 왕관 하나가 놓여 있습니다."
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "국경을 살릴 방법을 말한다"
              add: { nobles_support: 1 }
              goto: contest_policy
            - text: "서로 속내를 말한다"
              add: { insight: 1 }
              goto: contest_private
            - text: "진운의 말을 듣는다"
              add: { rival_trust: 1 }
              goto: contest_listen
            - text: "독살범으로 몬다"
              goto: go_27_dead_prince

  contest_policy:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "두 사람은 귀족들 앞에서 국경 사람들이 다음 겨울을 버틸 방법을 두고 토론했습니다."
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "이번 겨울에 1,700명을 살리셨습니다."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "그런데 내년에 2,000명이 굶으면요?"
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "봄부터 빈 창고를 다시 채우겠습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그 곡식은 누구에게 걷으실 겁니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "세금으로 낼 곡식을 숨긴 귀족들 창고부터 열죠."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "그 답에는 저도 반대할 말이 없습니다."
      - goto: leverage_choice

  contest_private:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "덕만은 회의를 멈추고 진운만 기록 창고로 불렀습니다."
      - say:
          with: [덕만, 진운]
          text: "문이 닫히자 덕만은 진운의 어머니가 어디 있는지부터 물었습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "어머니는 칠숙공의 서쪽 별채에 있습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "창문 하나, 출입문 하나. 밤마다 호위 6명이 지킵니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "제가 그 정보를 이용할 수도 있습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그래도 공주님은 어머니부터 찾을 것 같았습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "저를 너무 좋게 보지 마세요. 저도 왕좌를 원합니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그래도 지금은 별채부터 그려 주세요."
      - goto: leverage_choice

  contest_listen:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 진운
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "진운이 원고를 읽는 동안 칠숙도 같은 문장을 입 모양으로 따라 했습니다."
      - say:
          wait: 700
          text: "두 번째 문장 끝에서 진운은 원고를 접어 내려놓았습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [칠숙]
          text: "여기부터는 제가 고른 말입니다."
      - say:
          char: 진운
          camera: close
          with: [칠숙]
          wait: 900
          text: "저는…… 왕이 되고 싶습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [칠숙]
          text: "하지만 어머니 목숨으로 산 왕좌는 싫습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진운]
          text: "진운공께 드린 시간이 끝났습니다."
      - char:
          id: 덕만
          position: right
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "아닙니다. 지금부터가 진운공 본인의 말입니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "제 말은 끝까지 하겠습니다."
      - goto: leverage_choice

  leverage_choice:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "회의가 쉬는 사이, 비담은 지도와 장부와 버려진 원고를 늘어놓았습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "별채 지도와 빚 장부, 남이 써 준 연설문입니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          wait: 650
          text: "이 셋으로 진운을 마음대로 움직였군요."
      - say:
          char: 덕만.angry
          camera: medium
          with: [비담]
          text: "그 사람을 물건처럼 늘어놓지 마세요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "칠숙공은 이미 그 세 가지로 진운을 조종하고 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "제가 칠숙과 같아지면 꼭 비웃어 주세요."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그건 대가를 받기 미안할 만큼 쉽군요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그럼 이번만은 대가 없이 해 주세요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이제 제 값을 아주 잘 깎으십니다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "어머니를 구하면 진운은 자유로운 경쟁자가 됩니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          wait: 850
          unskippable: true
          text: "<speed=19>사람 하나를 없애고 왕이 되진 않겠습니다.</speed>"
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "왕이 된 뒤에도 그 말을 기억하십시오."
      - char:
          id: 아진
          position: right
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "별채 서쪽 창은 해 질 때 비어 있습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "이번에는 왜 저를 돕습니까?"
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "인질이 된 가족을 한 번 봤으니까요."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          wait: 700
          text: "이번 길은 제가 정했습니다."
      - char:
          id: 비담
          position: right
      - choice:
          key: c5_leverage
          prompt: "진운의 어머니가 오늘 밤 옮겨집니다."
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "인질을 공개한다"
              goto: go_28_sons_crown
            - text: "어머니부터 구한다"
              add: { rival_trust: 2, legitimacy: 1 }
              goto: leverage_deal
            - text: "혼인을 제안한다"
              goto: go_29_second_queen
            - text: "빚 장부를 공개한다"
              add: { power: 1, nobles_support: 1 }
              goto: leverage_ledger

  leverage_deal:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "해가 지기 전, 아진과 유신이 진운의 어머니를 별채에서 데려왔습니다."
      - say:
          with: [덕만, 진운]
          wait: 700
          text: "진운은 어머니의 목소리를 직접 들은 뒤에야 덕만 앞에 섰습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "어머니를 구해 놓고 정말 아무것도 안 받습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "왕좌를 내놓으라 하면 칠숙과 같아지니까요."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그러면 저는 다시 공주님의 경쟁자입니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그래야 다음 말이 정말 진운공의 말인지 알 수 있죠."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          wait: 800
          text: "제 삶을 제가 고르는 건 처음입니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "서툴러도 계속 골라 보세요."
      - goto: rescue_choice

  leverage_ledger:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          with: [덕만, 칠숙]
          text: "덕만은 귀족 회의 탁자 한가운데 빚 장부를 펼쳤습니다."
      - say:
          with: [덕만, 칠숙]
          text: "진운에게 표를 준 귀족들의 빚이 장부에서 줄어 있었습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "왕족의 빚을 대신 갚은 것이 죄입니까?"
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "진운에게 표 하나가 갈 때마다 빚 한 줄이 지워졌습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "우연히 표가 갈 때마다 빚도 사라졌겠지요."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "아닙니다. 저 사람들은 제 이름을 앞세워 표를 샀습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "예. 진운공이 직접 말해 주길 바랐습니다."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: frontier
      - camera: medium
      - effect: pulse
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "어머니도 풀려났고 제 뜻도 밝혔습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그러니 이제 진운공을 살려 둘 이유가 없겠지요."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제가 죽으면 공주님에게 씌우면 됩니다."
      - say:
          delivery: calm
          wait: 650
