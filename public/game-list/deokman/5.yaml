script:
  - scene: stolen_sun

scenes:
  stolen_sun:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: record
          text: "제6장 — 해를 훔친 자들"
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          channel: narration
          text: "검은 부적이 왕좌 아래까지 날아들었습니다. 제관들은 당의 관측표와 같은 날짜를 '신의 계시'라 외쳤고, 열흘 뒤 사라질 해의 값을 덕만의 목숨으로 매겼습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "열흘만 숨어라. 해가 돌아온 뒤에 말하면 된다. 겁먹은 군중은 설명보다 목을 먼저 찾는다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "저들은 해가 언제 사라지는지 이미 압니다. 제가 숨으면 저들 말이 맞아져요. 시각부터 빼앗겠습니다."
      - choice:
          key: c6_find_time
          prompt: "해가 지기 전, 거짓 예언의 시각을 어디서 훔칠까?"
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "당의 천문표와 신라 달력을 겹친다"
              add: { insight: 2, evidence: 1 }
              goto: calculate_eclipse
            - text: "비담을 제관의 서고에 들여보낸다"
              add: { evidence: 2, fear: 1, bidam_trust: 1 }
              goto: steal_table
            - text: "농부들의 파종 기억을 모은다"
              add: { people_support: 2, insight: 1 }
              goto: public_observation

  calculate_eclipse:
    actions:
      - bg: moon_court
      - say:
          channel: narration
          text: "덕만은 두 달력의 칸을 하나씩 밀었습니다. 마지막 선이 포개지자 제관의 '계시'가 당의 계산표와 한 치도 다르지 않게 겹쳤습니다."
      - goto: table_revealed

  steal_table:
    actions:
      - bg: shadow_corridor
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "창문이 열리고 비담이 먼지투성이 계산표를 던졌습니다. 일식 시각 옆에는 '덕만을 가리킬 때'라는 붉은 글씨가 적혀 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "해는 정직한데, 해 대신 말하는 자들 입이 너무 많군요."
      - goto: table_revealed

  public_observation:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "늙은 농부는 지난 일식 날 망친 씨앗을 아직도 자루째 보관하고 있었습니다. 아이들은 그날 우물 그림자가 어느 담을 넘었는지 몸으로 가리켰습니다."
      - say:
          char: 덕만
          text: "기록관은 잊어도 씨앗을 잃은 사람은 안 잊어. 하늘은 저 사람들 몸에도 적혀 있어."
      - goto: table_revealed

  table_revealed:
    actions:
      - sticker: { id: c6_table, image: eclipse_table_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: eclipse_table
      - say:
          channel: narration
          text: "먹줄은 정오 바로 뒤에서 만났습니다. 어둠이 머무는 시간은 짧았습니다. 그런데 계산표 아래에는 덕만을 가리킬 순간과 왕실 옥새까지 이미 찍혀 있었습니다."
      - clearSticker: { id: c6_table, leave: fadeOut }
      - goto: eclipse_policy

  eclipse_policy:
    actions:
      - choice:
          key: c6_eclipse_policy
          prompt: "어둠이 올 시각을 손에 넣었다. 누구에게 먼저 보여 줄까?"
          char: 덕만
          camera: close
          options:
            - text: "시장 벽에 시각과 관측법을 붙인다"
              set: { eclipse_policy: public_science, used_false_omen: false }
              add: { people_support: 2, insight: 2, nobles_support: -1 }
              goto: announce_science
            - text: "마지막 순간 북을 울려 해를 돌려놓는다"
              set: { eclipse_policy: royal_miracle, used_false_omen: true }
              add: { people_support: 1, fear: 2, nobles_support: 1 }
              goto: stage_miracle
            - text: "표를 궁 안에 잠그고 군사만 배치한다"
              set: { eclipse_policy: secret_knowledge, used_false_omen: false }
              add: { king_trust: 2, nobles_support: 2, insight: -1 }
              goto: keep_secret

  announce_science:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "새벽마다 벽보가 뜯겼고 덕만은 낮마다 다시 붙였습니다. 아이들이 구멍 뚫은 가죽으로 해를 보는 법을 따라 하자 검은 부적값이 바닥으로 떨어졌습니다."
      - say:
          char: 덕만
          camera: medium
          text: "해가 돌아와도 내 이름을 외치지 마. 숫자가 맞으면 쓰고, 틀리면 고치면 돼."
      - goto: eclipse_day

  stage_miracle:
    actions:
      - bg: peony_court
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "어둠이 가장 짙어졌을 때 북이 세 번 울렸습니다. 세 번째 북채가 떨어지자 햇빛이 제단 끝을 긁었고 군중은 덕만의 이름을 울부짖었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "거짓말을 이기려고 더 정확한 거짓말을 고르셨군요. 보십시오. 다들 폐하라고 부를 준비가 됐습니다."
      - say:
          char: 덕만.sad
          text: "오늘은 저들을 살렸어. 그런데 방금 저 환호를 들으니… 다음엔 내가 이 힘을 놓을 수 있을지 모르겠어."
      - goto: eclipse_day

  keep_secret:
    actions:
      - bg: council_hall
      - char: { id: 진평왕, position: right }
      - say:
          channel: narration
          text: "일식 날 궁문은 닫혔고 골목마다 방패가 섰습니다. 비명은 담 밖에서 작게 끝났지만, 사람들은 어둠의 이유를 모른 채 제관의 다음 말을 기다렸습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "오늘은 조용히 넘겼다. 대신 내일부터는 이 표를 훔치려는 자와 가진 자를 지키느라 더 많은 칼이 필요하겠구나."
      - goto: eclipse_day

  eclipse_day:
    actions:
      - bg: peony_court
      - camera: wide
      - effect: eclipse
      - say:
          channel: narration
          text: "정오가 지나자 새들이 먼저 울음을 멈췄습니다. 빛이 빠르게 식었고, 제관의 손가락이 덕만을 향하는 순간 군중이 한 몸처럼 제단으로 쏟아졌습니다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "방패를 세우면 앞줄이 눌립니다. 안 세우면 제단까지 열 걸음입니다. 명령하십시오!"
      - choice:
          key: c6_eclipse_riot
          prompt: "어둠 속에서 아이가 넘어진다. 덕만은 무엇부터 할까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "난간에 올라 남은 시간을 센다"
              add: { people_support: 2, insight: 1 }
              goto: bad_dark_crowd
            - text: "방패를 눕혀 아이들의 길을 만든다"
              add: { mercy: 2, yushin_trust: 1 }
              goto: sun_returns
            - text: "혼자 제관 앞까지 걸어간다"
              goto: bad_dark_crowd

  sun_returns:
    actions:
      - effect: { name: darken, wait: true }
      - bg: peony_court
      - camera: wide
      - say:
          channel: narration
          text: "덕만이 마지막 수를 외치자 빛이 손등부터 돌아왔습니다. 누군가는 무릎을 꿇었고, 누군가는 구겨진 벽보를 펴 시각을 다시 확인했습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "오늘 네 목소리에 왕명보다 많은 사람이 멈췄다. 나는 그 힘이 두렵다. 네가 어떻게 얻었는지도."
      - say:
          char: 덕만
          text: "저도 두렵습니다. 그러니 제 목소리가 없어도 같은 답을 찾게 만들어야 합니다."
      - say:
          channel: record
          text: "덕만은 해를 되돌리지 않았습니다. 다만 해를 훔쳐 권력을 만들던 사람들의 시간을 빼앗았습니다."
      - say:
          channel: narration
          text: "군중이 흩어진 뒤 진평왕은 계산표의 옥새를 엄지로 문질렀습니다. '내가 찍은 적 없다.' 그는 그 말만 남기고 밤중에 빈 왕좌로 오라고 했습니다."
      - goto: /6.yaml

  bad_dark_crowd:
    actions:
      - bg: peony_court
      - camera: close
      - effect: eclipse
      - char: { id: 덕만, position: left, emotion: angry }
      - say:
          char: 덕만.angry
          text: "해는 곧 돌아온다. 내 목소리를 듣고 아이들이 지나갈 길부터 열어라!"
      - say:
          channel: narration
          text: "난간 위에서 시간을 외치거나 방패선 밖으로 제관을 향해 걷는 순간 덕만은 유신의 손이 닿지 않는 곳에 섰습니다. 뒤에서는 '군사가 친다'는 외침이 터졌고 군중이 한꺼번에 앞으로 무너졌습니다."
      - say:
          char: 유신.angry
          text: "공주님께 길이 없습니다. 방패를 세우면 사람들이 짓밟힙니다."
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 제단 앞 압사자 사이에서 사망. 제관은 이를 하늘의 심판이라 선포하고 계산표를 소각함."
      - gameOver:
          title: "운명 — 옳은 말이 닿지 않은 거리"
          message: "진실은 사실만으로 군중을 통과하지 못했습니다. 덕만은 사람을 빼낼 길보다 자신의 몸을 먼저 드러냈고, 해가 돌아왔을 때는 이미 군중 아래에서 숨이 멎어 있었습니다."
