script:
  - scene: chapter5_open
  - scene: chapter5_end

scenes:
  chapter5_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          text: "제5장 — 두 개의 왕관"
      - say:
          delivery: calm
          text: "두 달 뒤, 631년 겨울."
      - say:
          with: [덕만]
          delivery: calm
          text: "국경에 보급선을 남기고 수도로 돌아온 지 사흘째였습니다."
      - say:
          with: [덕만]
          text: "국경 사람들은 빈 그릇과 감사의 글을 덕만의 수레에 실어 보냈습니다."
      - say:
          with: [덕만]
          text: "이제 귀족들도 덕만을 멀리 보내면 그만인 공주로 볼 수 없었습니다."
      - say:
          with: [진운]
          text: "그사이 칠숙은 진운을 다음 왕 후보로 세웠습니다."
      - say:
          with: [진운]
          text: "귀족들은 왕의 딸보다 먼 남자 친척을 택했습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: wide
          with: [덕만, 진운]
          text: "진운 왕자께 예를 갖추십시오."
      - say:
          char: 진운
          camera: medium
          with: [칠숙]
          text: "왕자가 아닙니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "다음 왕으로 정해진 적도 없습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진운]
          text: "하지만 대신들 절반이 이미 진운공을 왕자라 부릅니다."
      - say:
          text: "칠숙의 하인이 낡은 비녀를 내려놨습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "어머니 물건입니까?"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "예. 제가 이기면 어머니를 돌려보내겠답니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          delivery: sad
          text: "<speed=18>지면 다음엔 손가락을 보낸답니다.</speed>"
      - say:
          char: 덕만.sad
          camera: medium
          with: [진운]
          text: "공정한 싸움은 아니군요."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "그래도 숨기고 싶진 않았습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "공주는 누구를 위해 싸웁니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "국경에서 제 명령을 기다린 사람들."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그런데 차는 왜 안 마십니까?"
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "계피를 싫어합니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 정도는 마음대로 하세요."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "저도 생강은 골라 냅니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "……그건 기록하지 않겠습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "저를 적이라 여기십니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "아직은 경쟁자입니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "그 차이가 오래가길 바랍니다."
      - goto: contest_choice

  contest_choice:
    actions:
      - choice:
          key: c5_contest
          prompt: "진운과 어떻게 겨룰까?"
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "나라일로 겨룬다"
              add: { nobles_support: 1 }
              goto: contest_policy
            - text: "서로 속내를 말한다"
              add: { insight: 1 }
              goto: contest_private
            - text: "진운의 말을 듣는다"
              add: { rival_trust: 1 }
              goto: contest_listen
            - text: "독살범으로 몬다"
              goto: go_27_dead_prince

  contest_policy:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "두 사람은 귀족들 앞에서 국경 백성을 어떻게 살릴지를 두고 맞섰습니다."
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "이번 겨울에는 천칠백 명을 살렸습니다."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "내년에 이천 명이 굶으면요?"
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "봄부터 창고를 채우겠습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "어느 세금을 올립니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "세금 안 낸 귀족 창고부터 보죠."
      - say:
          char: 진운
          camera: medium
          with: [덕만]
          text: "그 방법에는 저도 동의합니다."
      - goto: leverage_choice

  contest_private:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "덕만은 회의를 멈추고 진운과 기록 창고로 자리를 옮겼습니다."
      - say:
          with: [덕만, 진운]
          text: "덕만은 자리에 앉자마자 진운의 어머니가 어디에 갇혔는지 물었습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "어머니는 칠숙공의 별채에 있습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "창문 하나, 출입문 하나, 호위는 여섯입니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "제가 이용할 수도 있습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그래도 공주라면 어머니부터 구할 것 같았습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "확신하지 마세요. 저도 왕위가 급합니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "일단 방 지도를 그리세요."
      - goto: leverage_choice

  contest_listen:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 진운
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          text: "진운이 연설하자 칠숙의 입술도 움직였습니다."
      - say:
          text: "진운은 두 번째 문장에서 원고를 내려놨습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [칠숙]
          text: "여기부터는 제 말입니다."
      - say:
          char: 진운
          camera: close
          with: [칠숙]
          text: "저는 왕이 되고 싶습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [칠숙]
          text: "어머니 목숨으로 산 왕좌는 싫습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진운]
          text: "정해진 시간이 끝났습니다."
      - char:
          id: 덕만
          position: right
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "아뇨. 이제야 시작했습니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "끝까지 말하겠습니다."
      - goto: leverage_choice

  leverage_choice:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "회의가 잠시 멈추자 비담이 품에서 지도와 장부, 연설문을 꺼냈습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "별채 지도, 빚 장부, 진운의 연설문."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "약점이 가지런하군요."
      - say:
          char: 덕만.angry
          camera: medium
          with: [비담]
          text: "사람을 물건처럼 말하지 마요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "칠숙은 이미 셋 다 써먹고 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내가 칠숙과 같아지면 비웃어 줘요."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "그건 너무 쉬운 부탁인데요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그럼 대가 없이 해 줘요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "흥정이 제법 늘었습니다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "어머니를 구하면 경쟁자는 남습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "경쟁자를 죽여 왕이 되진 않겠습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "왕좌가 가까워져도 그 말을 잊지 마십시오."
      - choice:
          key: c5_leverage
          prompt: "칠숙의 협박을 어떻게 끊을까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "인질을 공개한다"
              goto: go_28_sons_crown
            - text: "어머니부터 구한다"
              add: { rival_trust: 2, legitimacy: 1 }
              goto: leverage_deal
            - text: "혼인을 제안한다"
              goto: go_29_second_queen
            - text: "빚 장부를 공개한다"
              add: { power: 1, nobles_support: 1 }
              goto: leverage_ledger

  leverage_deal:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          with: [덕만, 진운]
          text: "덕만이 보낸 사람들이 진운의 어머니를 별채에서 빼냈습니다."
      - say:
          with: [덕만, 진운]
          text: "진운은 어머니가 안전하다는 소식을 들은 뒤에야 덕만을 만났습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "어머니를 구하고도 대가를 안 받습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "왕위를 달라 하면 칠숙과 같아집니다."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그럼 저는 여전히 경쟁자입니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그래야 그대 말을 믿을 수 있죠."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "직접 고르는 건 처음입니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "서툴러도 해 보세요."
      - goto: rescue_choice

  leverage_ledger:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: right
      - say:
          with: [덕만, 칠숙]
          text: "덕만은 빚 장부를 귀족 회의 한가운데 펼쳤습니다."
      - say:
          with: [덕만, 칠숙]
          text: "진운을 지지한 표와 줄어든 빚이 같은 줄에 적혀 있었습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "왕족의 빚을 갚은 게 반역입니까?"
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "표를 줄 때마다 빚이 줄었습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "우연히 뜻이 같았겠지요."
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "아닙니다. 제 표를 샀습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "그 말을 기다렸습니다."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: frontier
      - camera: wide
      - effect: alarm
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          delivery: calm
          text: "그날 해가 진 뒤, 진운이 탄 마차의 축이 부러졌습니다."
      - say:
          text: "숲에서 활시위가 한꺼번에 당겨졌습니다."
      - say:
          char: 진운.nervous
          camera: medium
          with: [덕만]
          text: "가까이 오지 마십시오."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "제가 죽으면 공주 짓이라 할 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그래서 더 살려야겠군요."
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "살려도 왕위는 양보하지 않습니다."
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "<speed=19>양보는 살아서 거절하세요.</speed>"
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "왜 저까지 살리려 합니까?"
      - say:
          char: 덕만
          camera: close
          with: [진운]
          text: "살아 있어야 내게 반대도 하죠."
      - say:
          char: 진운
          camera: close
          with: [덕만]
          text: "그 말, 끝까지 지키십시오."
      - choice:
          key: c5_rescue
          prompt: "진운을 어떻게 살릴까?"
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "함께 마차에 탄다"
              add: { rival_trust: 1, power: 1 }
              goto: rescue_personal
            - text: "유신에게 맡긴다"
              add: { yushin_trust: 1, army_support: 1 }
              goto: rescue_yushin
            - text: "못 본 척한다"
              goto: go_30_martyr_prince
            - text: "매복을 공개한다"
              add: { legitimacy: 1, nobles_support: 1 }
              goto: rescue_public

  rescue_personal:
    actions:
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 진운
          position: right
      - say:
          char: 진운.angry
          camera: medium
          with: [덕만]
          text: "왜 제 마차에 타셨습니까?"
      - say:
          char: 진운.angry
          camera: close
          with: [덕만]
          text: "둘 다 죽을 뻔했습니다!"
      - say:
          char: 덕만
          camera: medium
          with: [진운]
          text: "그래서 방패도 가져왔습니다."
      - say:
          char: 진운.nervous
          camera: close
          with: [덕만]
          text: "저는 아직 손이 떨립니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [진운]
          text: "저도요. 그러니 같이 잡아요."
      - goto: chapter5_end

  rescue_yushin:
    actions:
      - bg: frontier
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "덕만의 신호를 받은 유신은 진운의 마차를 먼저 빼냈습니다."
      - say:
          with: [덕만, 유신]
          text: "숲을 포위한 뒤에야 덕만에게 돌아왔습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "진운공은 무사합니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "궁수 셋을 생포했습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "궁수들 몸에서 나온 건요?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "붉은 매듭입니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "왕의 약방에서도 같은 매듭을 봤답니다."
      - say:
