script:
  - scene: chapter5_open
  - scene: chapter5_end

scenes:
  chapter5_open:
    actions:
      - bg: council_hall
      - char:
          id: 진운
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제5장 — 신라에는 이미 왕자가 있다"
      - say:
          char: 진운
          framing: full
          with:
            - 덕만
          text: "다시 뵙는군요. 이번에는 혼담이 아니라 왕위를 두고 만났습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "이번에도 칠숙이 써 준 말을 읽으실 겁니까?"
      - say:
          char: 진운.nervous
          framing: bust
          with:
            - 덕만
          text: "오늘 원고는 제가 썼습니다. 다만 제가 이기는 순간 어머니가 풀려난다는 약속을 받았습니다. 공주께 숨기고 공정한 척하고 싶지는 않습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진운
          text: "공정한 경쟁은 아니군요. 그래도 적어도 누구를 위해 싸우는지는 알겠습니다."
      - say:
          char: 진운
          framing: bust
          text: "공주께서는 누구를 위해 싸우십니까? 본인 말고 다른 이름으로 답하실 수 있습니까?"
      - goto: contest_choice

  contest_choice:
    actions:
      - choice:
          key: c5_contest
          prompt: "화백 앞, 진운을 어떻게 상대할까?"
          char: 덕만
          framing: closeup
          with:
            - 진운
          options:
            - text: "정사로 겨룬다"
              add:
                legitimacy: 1
                people_support: 1
              goto: contest_policy
            - text: "서로 속내를 밝힌다"
              add:
                rival_trust: 1
                insight: 1
              goto: contest_private
            - text: "먼저 말하게 둔다"
              add:
                insight: 2
              goto: contest_listen
            - text: "독살범으로 몬다"
              goto: go_27_dead_prince

  contest_policy:
    actions:
      - say:
          char: 진운.angry
          framing: bust
          text: "공주께서는 이번 겨울의 천칠백 명을 살렸습니다. 하지만 비축 곡식이 줄어 내년에는 이천 명이 굶을 수 있습니다. 그때도 같은 선택을 하시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          text: "아니요. 내년에는 봄부터 창고를 채우겠습니다. 하지만 그 준비를 위해 지금 눈앞의 아이를 굶기지는 않겠습니다."
      - say:
          char: 진운.angry
          framing: bust
          text: "좋은 마음만으로 곡식이 생기지는 않습니다. 어느 세금을 올리실 겁니까?"
      - say:
          char: 덕만
          framing: bust
          text: "전쟁 중에도 면세받은 세 가문의 창고부터 조사하겠습니다. 부족하면 왕실 창고를 열죠. 제 답이 틀렸다면 그대 답도 듣겠습니다."
      - say:
          char: 진운
          framing: bust
          text: "……왕실 창고까지 말씀하실 줄은 몰랐습니다. 그 부분은 동의합니다."
      - add:
          nobles_support: 1
      - goto: leverage_choice

  contest_private:
    actions:
      - say:
          char: 진운.nervous
          framing: closeup
          delivery: whisper
          text: "제 어머니는 칠숙의 별채 동쪽방에 갇혀 있습니다. 창 하나, 문 하나, 호위는 여섯입니다. 제가 화백에서 주저할 때마다 한 명씩 방 안으로 들어갑니다."
      - say:
          char: 덕만
          framing: bust
          text: "왜 그걸 저한테 말합니까? 제가 이용할 수도 있습니다."
      - say:
          char: 진운.nervous
          framing: closeup
          text: "알고 있습니다. 그래도 공주께서는 사람을 살려 놓고 빚을 요구하는 쪽을 택할 것 같았습니다. 칠숙은 먼저 빚부터 씁니다."
      - say:
          char: 덕만
          framing: bust
          text: "확신하지 마세요. 나도 왕위가 급합니다. 다만 그 전에 어머니가 있는 방의 지도를 그려 주세요."
      - goto: leverage_choice

  contest_listen:
    actions:
      - say:
          delivery: deduction
          text: "진운이 연설을 시작하자 칠숙의 입술이 같은 박자로 움직였습니다. 두 번째 문장 중간, 진운은 원고를 내려놓았습니다."
      - say:
          char: 진운.nervous
          framing: bust
          text: "여기부터는 원고에 없습니다. 저는 왕이 되고 싶습니다. 하지만 제 어머니 목숨을 값으로 치른 왕좌라면, 앉은 뒤에도 제 것이 아닐 겁니다."
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "진운공, 정해진 시간을 넘기셨습니다."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "아니요. 이제야 진운공의 말을 들었습니다. 끝까지 하게 두시죠."
      - say:
          char: 진운
          framing: bust
          text: "감사합니다. 다음에는 공주께서 제 말을 막으셔도 됩니다. 오늘 한 번이면 충분합니다."
      - add:
          rival_trust: 1
      - goto: leverage_choice

  leverage_choice:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "진운공에게는 쓸 만한 약점이 셋 있습니다. 별채에 갇힌 어머니, 칠숙이 대신 갚아 준 빚, 그리고 사람을 밟고 왕이 될 만큼 모질지는 못하다는 점."
      - say:
          char: 비담.smirk
          framing: bust
          text: "어느 것부터 쓰시겠습니까?"
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "사람 약점을 물건 고르듯 말하지 마."
      - say:
          char: 비담.smirk
          framing: bust
          text: "왕이 되려는 분들이 늘 그렇게 하기에 미리 연습해 봤습니다. 싫으시면 안 쓰셔도 됩니다. 하지만 칠숙은 이미 전부 쓰고 있습니다."
      - choice:
          key: c5_leverage
          prompt: "진운의 약점을 손에 쥐었다. 쓸까?"
          char: 덕만
          framing: closeup
          with:
            - 비담
          options:
            - text: "어머니를 공개한다"
              goto: go_28_sons_crown
            - text: "어머니를 구해 거래한다"
              add:
                rival_trust: 2
                power: 1
              goto: leverage_deal
            - text: "혼인을 강요한다"
              goto: go_29_second_queen
            - text: "빚 장부만 공개한다"
              add:
                legitimacy: 1
                nobles_support: -1
              goto: leverage_ledger

  leverage_deal:
    actions:
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.nervous
          framing: closeup
          delivery: nervous
          text: "어머니를 빼내고도 제게 물러나라는 서약을 받지 않으셨습니다. 왜입니까?"
      - say:
          char: 덕만
          framing: bust
          text: "어머니를 구한 값으로 왕위를 달라고 하면, 칠숙과 다를 게 없으니까요."
      - say:
          char: 진운.nervous
          framing: bust
          text: "그럼 저는 여전히 경쟁자입니다. 내일 공주를 이길 수도 있습니다."
      - say:
          char: 덕만
          framing: bust
          text: "그래야 그대가 나중에 하는 선택도 믿을 수 있습니다. 빚 때문에 물러나는 사람은 필요 없어요."
      - say:
          char: 진운
          framing: closeup
          text: "처음으로 누군가 제게 직접 고르라고 하는군요. 익숙하지 않지만 해 보겠습니다."
      - goto: rescue_choice

  leverage_ledger:
    actions:
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "궁핍한 왕족의 빚을 대신 갚아 드린 일이 반역입니까? 이제 선의도 장부에 적지 말아야겠군요."
      - say:
          char: 덕만
          framing: bust
          text: "은전만 돌려받았다면 선의였겠지요. 그런데 이 장부에는 진운공이 화백에서 그대 뜻대로 표결한 날마다 빚이 줄어 있습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "우연히 뜻이 같았을 수도 있습니다."
      - char:
          id: 진운
          position: center
          framing: full
      - say:
          char: 진운.angry
          framing: bust
          text: "아닙니다. 제 표를 빚으로 샀습니다. 제가 직접 증언하겠습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "이제 제 말만 반박해서 끝날 일이 아닙니다, 칠숙공."
      - goto: rescue_choice

  rescue_choice:
    actions:
      - bg: shadow_corridor
      - say:
          delivery: nervous
          text: "회의가 끝난 밤, 진운의 마차가 좁은 비탈에 들어서자 앞바퀴 축이 부러졌습니다. 숲에서는 여러 개의 활시위가 동시에 당겨지는 소리가 났습니다."
      - say:
          char: 진운.nervous
          framing: closeup
          text: "저를 죽이면 칠숙은 공주가 꾸민 일이라 할 겁니다. 가까이 오지 마십시오."
      - say:
          char: 덕만
          framing: bust
          text: "그 말을 들으니 더 막아야겠군요. 시간 없습니다."
      - choice:
          key: c5_rescue
          prompt: "진운의 마차에 화살이 향한다. 막을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "함께 미끼가 된다"
              add:
                rival_trust: 2
                power: 1
              set:
                saved_rival: true
              goto: rescue_personal
            - text: "유신에게 구출을 맡긴다"
              add:
                yushin_trust: 1
                army_support: 1
              set:
                saved_rival: true
              goto: rescue_yushin
            - text: "못 본 척한다"
              goto: go_30_martyr_prince
            - text: "암살을 공개한다"
              add:
                legitimacy: 1
                suspicion: 1
              set:
                saved_rival: true
              goto: rescue_public

  rescue_personal:
    actions:
      - effect: shake
      - char:
          id: 진운
          position: right
          framing: full
      - say:
          char: 진운.angry
          framing: closeup
          delivery: angry
          text: "왜 제 마차에 직접 타셨습니까? 두 사람이 같이 죽었으면 후계자가 한 번에 사라질 뻔했습니다!"
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "알아요. 그래서 죽지 않으려고 방패도 끌고 왔습니다. 혼자 두면 저를 의심하면서 죽을 것 같아서요."
      - say:
          char: 진운.angry
          framing: bust
          text: "사람을 구해 놓고 그렇게 태연하게 말하지 마십시오. 저는 아직 손이 떨립니다."
      - say:
          char: 덕만
          framing: bust
          delivery: nervous
          text: "나도 떨려요. 그러니까 화는 살아서 왕경에 돌아간 뒤에 내세요. 지금은 이 방패 좀 같이 잡아 줘요."
      - goto: chapter5_end

  rescue_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신.angry
          framing: bust
          text: "진운공은 무사합니다. 궁수 열둘 중 넷은 죽었고, 다섯은 달아났으며, 셋을 생포했습니다."
      - say:
          char: 덕만
          framing: bust
          text: "생포자에게서 나온 건요?"
      - say:
          char: 유신.angry
          framing: bust
          text: "붉은 매듭입니다. 그중 한 명은 같은 매듭을 왕의 침전 약방에서 보았다고 진술했습니다."
      - say:
          char: 덕만
          framing: closeup
          text: "아버지 곁까지 들어갔다는 뜻이군요. 진운을 안전한 곳으로 옮기고 바로 궁으로 갑시다."
      - goto: chapter5_end

  rescue_public:
    actions:
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 진운
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "암살이 있을 거라고 공개하셨으니 이제 아무 일도 일어나지 않겠군요. 일어나지 않은 사건을 공으로 삼으실 겁니까?"
      - say:
          char: 덕만
          framing: bust
          text: "진운공이 살면 그걸로 됐습니다. 공은 필요 없습니다."
      - say:
          char: 진운
          framing: bust
          text: "저는 필요합니다. 누가 제 마차 바퀴를 손댔는지 직접 조사해 달라고 화백 앞에서 요구하겠습니다."
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "진운공께서 많이 달라지셨군요."
      - say:
          char: 진운
          framing: closeup
          text: "아니요. 이제 제 말을 제가 하고 있을 뿐입니다."
      - goto: chapter5_end

  chapter5_end:
    actions:
      - add:
          legitimacy: 1
      - say:
          text: "덕만과 진운이 암살 조사를 함께 요구하는 문서에 각자의 이름을 쓰려던 순간, 궁의 종이 장례 때처럼 거꾸로 울렸습니다."
          wait: 900
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.nervous
          framing: closeup
          delivery: nervous
          text: "덕만아, 아버지가 쓰러지셨어. 의식이 없어. 그런데 왕의 인장이 사라졌고, 그 인장으로 네 체포령이 내려졌어."
      - say:
          char: 덕만.sad
          framing: closeup
          with:
            - 천명
          text: "언니는 어디야? 지금 안전해?"
      - say:
          char: 천명.nervous
          framing: bust
          text: "아직 궁 안이야. 아버지 곁으로 가려다가 막혔어. 군사들이 오기 전에 들어와."
      - say:
          char: 덕만
          framing: closeup
          text: "문을 잠그고 기다려. 내가 갈게. 이번에는 혼자 움직이지 마."
      - say:
          text: "덕만과 진운은 처음으로 같은 편에 섰습니다. 그러나 그들이 손을 잡은 바로 그날, 왕이 쓰러지고 덕만의 체포령이 내려졌습니다."

  go_27_dead_prince:
    actions:
      - bg: council_hall
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 진운
          position: center
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          text: "후계자 토론이 시작되자 덕만은 준비해 둔 독살 의혹을 모든 화백 앞에서 꺼냈습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "진운공이 오늘 마신 차에서 독 냄새가 났습니다. 스스로 쓰러진 뒤 저를 범인으로 만들 생각이었습니까?"
      - say:
          char: 진운.angry
          framing: bust
          text: "저는 그 차에 손도 대지 않았습니다. 공주께서 증거를 내놓지 못하면 지금 말은 거짓 고발입니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "두 분 중 한 분은 거짓말을 하고 있겠군요. 진운공, 오늘은 물러나 계시는 편이 좋겠습니다."
      - bg: shadow_corridor
      - effect: darken
      - say:
          with:
            - 진운
          text: "진운은 혼자 회의장을 나왔습니다. 좁은 회랑 끝에서 화살깃 하나가 기둥 밖으로 나왔다가 사라졌고, 뒤쪽 문에서는 빗장이 걸렸습니다."
          wait: 550
      - effect: impact
      - say:
          char: 진운.nervous
          framing: closeup
          with: []
          text: "덕만공주에게 전해 주십시오. 저는 독을 준비하지 않았다고……"
      - say:
          with:
            - 진운
          text: "화살은 세 방향에서 날아왔습니다. 진운은 덕만의 이름을 남기고 회랑 바닥에서 죽었고, 그 자리에 없던 칠숙은 마지막 말을 덕만이 보낸 자객을 알아봤다는 뜻으로 화백에 보고했습니다."
          wait: 750
      - gameOver:
          title: "운명 27 — 진운의 마지막 말"
          message: "진운은 암살됐고 덕만은 배후로 지목됐습니다. 화백은 죽은 진운을 정당한 후계자로 추존했습니다."
  go_28_sons_crown:
    actions:
      - bg: council_hall
