chapterTitle: "해를 훔친 자들"

script:
  - scene: stolen_sun

scenes:
  stolen_sun:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제6장 — 해를 훔친 자들"
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          channel: action
          text: "제관이 내 발치에 부적을 던진다. 열흘 뒤 하늘이 답할 거라고 한다. 모여든 사람 중 누구도 하늘을 올려다보지 않는다. 모두 나를 본다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: equal_exchange }
          channel: record
          text: "당에서 받아 온 천문표에는 이미 그 날짜가 적혀 있었다. 제관이 장터에 부적을 내건 것보다 먼저였다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: armed_truce }
          channel: narration
          text: "군량 수레에서 나온 메모가 천문표 곁에 놓였다. 당 군관이 적어 둔 일식 날짜는 제관의 말과 같았다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: secret_trade }
          channel: narration
          text: "돈을 주고 산 서신에 짧은 당부가 있었다. 해가 잠기면 덕만을 가리키라는 말이었다. 날짜에 붉은 점까지 찍혀 있었다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "열흘만 내 곁에 있거라. 저들이 돌을 들면, 네가 아는 것이 너를 막아 주지는 못해."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "제가 숨으면 저 부적을 믿을 거예요. 왜 어두워지는지 제가 먼저 말하겠습니다."
      - choice:
          key: c6_find_time
          prompt: "제관이 날짜를 안다. 나도 정확한 때를 알아야 한다."
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "당의 천문표와 신라 달력을 겹친다"
              add: { insight: 2, evidence: 1 }
              goto: calculate_eclipse
            - text: "비담을 제관의 서고에 들여보낸다"
              add: { evidence: 2, fear: 1, bidam_trust: 1 }
              goto: steal_table
            - text: "농부들의 파종 기억을 모은다"
              add: { people_support: 2, insight: 1 }
              goto: public_observation

  calculate_eclipse:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - say:
          channel: action
          text: "당의 날짜 옆에 신라의 날짜를 적는다. 한 칸씩 옮겨 세다가 손을 멈춘다. 처음부터 다시 세어도 같은 자리에 닿는다."
      - goto: table_revealed

  steal_table:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "비담이 가져온 표에는 먼지도 묻지 않았다. 덕만은 마지막 줄을 빛에 비췄다. 새로 쓴 먹만 검게 빛났다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "참 친절한 서고더군요. 훔칠 종이까지 문 가까이 내놓고."
      - say:
          char: "덕만.princess_angry"
          camera: "medium"
          with:
            - "비담"
          text: "마지막 줄을 고쳤어. 그 위의 날짜는 남아 있지? 거기서부터 다시 세자."
      - say:
          channel: "narration"
          text: "틀린 숫자를 지우자 종이가 얇아졌다. 그날 밤 서고에 새 자물쇠가 걸렸다는 소식이 왔다. 비담은 열쇠를 구하러 다시 나가지 못했다."
      - add:
          nobles_support: -1
      - say:
          channel: thought
          text: "가짜인 줄은 알았어. 정확한 답을 안 것은 아니야. 남은 두 장을 맞춰 봐야 한다."
      - goto: "calculate_eclipse"

  public_observation:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "농부들은 지난 일식에 강물이 어디까지 찼는지 기억했다. 볍씨를 담갔다는 날도 같았다. 다만 해가 가려진 시각에서는 서로 고개를 저었다."
      - say:
          char: "덕만"
          text: "그날 일은 더 들어 보자. 시각이 다르다고 전부 틀린 말은 아닐 거야."
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "날짜가 맞습니다. 당의 표와 우리 달력 사이를 세면 더 좁힐 수 있겠습니다."
      - say:
          channel: "narration"
          text: "덕만은 파종한 날마다 점을 찍었다. 당의 표에서도 같은 간격이 나타났다. 맞은편 농부가 손가락을 뻗어 점 하나를 바로잡았다."
      - add:
          people_support: 1
          insight: -1
      - say:
          channel: thought
          text: "저 사람은 아버지와 씨를 뿌린 날이라 기억한대. 지우려던 점 옆에 다시 작은 점을 찍는다."
      - goto: "calculate_eclipse"

  table_revealed:
    actions:
      - sticker: { id: c6_table, image: eclipse_table_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: eclipse_table
      - say:
          channel: thought
          text: "정오를 조금 지난 때. 오래 가려지지는 않는다. 그런데 이 표에 왜 옥새가 찍혔지? 아버지도 보셨던 걸까."
      - clearSticker: { id: c6_table, leave: fadeOut }
      - goto: eclipse_policy

  eclipse_policy:
    actions:
      - choice:
          key: c6_eclipse_policy
          prompt: "시각을 알아냈다. 이 종이를 누구에게 건넬까?"
          char: 덕만
          camera: medium
          options:
            - text: "마지막 순간 북을 울려 해를 돌려놓는다"
              set: { eclipse_policy: royal_miracle, used_false_omen: true }
              add: { people_support: 1, fear: 2, nobles_support: 1 }
              goto: stage_miracle
            - text: "표를 궁 안에 잠그고 군사만 배치한다"
              set: { eclipse_policy: secret_knowledge, used_false_omen: false }
              add: { king_trust: 2, nobles_support: 2, insight: -1 }
              goto: keep_secret
            - text: "시장 벽에 시각과 관측법을 붙인다"
              set: { eclipse_policy: public_science, used_false_omen: false }
              add: { people_support: 2, insight: 2, nobles_support: -1 }
              goto: announce_science

  announce_science:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: action
          text: "찢긴 벽보 위에 새 종이를 붙인다. 아이에게 구멍 뚫린 판을 들게 하자 땅 위에 작은 해가 맺힌다. 아이가 제 발로 가려 보다가 웃는다."
      - say:
          char: 덕만
          camera: medium
          text: "하늘을 맨눈으로 보지는 마라. 이 그림자를 보렴. 내 말이 맞는지 네가 세어 줘."
      - goto: eclipse_day

  stage_miracle:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "북 칠 자리가 정해졌다. 덕만은 해가 돌아올 숫자 옆에 붉은 실을 묶었다. 접은 표가 소매 밖으로 나오지 않도록 깊이 밀어 넣었다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "시각은 제 전령이 맞추겠습니다. 공주님께서는 손만 들어 주십시오."
      - say:
          char: "덕만.sad"
          text: "소요가 가라앉으면 표를 내놓겠어. 오늘은 다치지 않게 넘기자."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "그때도 저들이 종이를 보려 하겠습니까. 공주님을 보고 싶어 할 텐데."
      - say:
          channel: "narration"
          text: "북이 울리자 사람들이 덕만을 향해 엎드렸다. 소매 안의 계산표가 손목을 찔렀다. 덕만은 손을 들고도 웃지 못했다."
      - add:
          bidam_trust: 2
          fear: 1
      - say:
          channel: thought
          text: "무릎 꿇지 말라고 해야 한다. 입을 열었는데도 소리가 안 나온다. 내가 치라 한 북이 아직 울린다."
      - goto: "eclipse_day"

  keep_secret:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - char:
          id: "진평왕"
          position: "right"
      - say:
          channel: "narration"
          text: "장수들만 표를 받았다. 병사들은 약속한 시각에 방패를 들었다. 그 너머 장터에서는 제관이 무슨 뜻인지 대신 외쳐 주고 있었다."
      - say:
          char: "진평왕"
          camera: "medium"
          with:
            - "덕만"
          text: "소요만 막으면 된다. 해가 돌아온 뒤에 일러 주면 안 되겠느냐?"
      - say:
          char: "덕만.princess_sad"
          camera: "medium"
          with:
            - "진평왕"
          text: "그동안 저 사람들은 무엇을 믿고 기다립니까. 제가 나가서 말할게요."
      - say:
          channel: "narration"
          text: "덕만은 마지막 숫자를 손바닥에 옮겨 적었다. 문을 나설 때 부적을 든 아이와 눈이 마주쳤다. 아이는 손바닥을 보지 못했다."
      - add:
          people_support: -2
      - say:
          channel: thought
          text: "병사들은 울지 않는다. 시각을 아니까. 저 아이에게도 말해 줄 수 있었는데."
      - goto: "eclipse_day"

  eclipse_day:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: eclipse
      - say:
          camera: wide
          channel: action
          text: "새소리가 그친다. 손등에 닿던 볕이 식는다. 군중 속에서 돌 든 팔이 솟는다. 나는 지워질까 봐 손바닥의 숫자를 감싸지 못한다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "아이들이 방패에 끼입니다! 길을 내면 제단이 뚫립니다. 명을 주십시오!"
      - choice:
          key: c6_eclipse_riot
          prompt: "앞줄이 밀린다. 아이의 울음소리가 낮아진다."
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "방패를 눕혀 아이들의 길을 만든다"
              add: { mercy: 2, yushin_trust: 1 }
              goto: bad_open_line
            - text: "난간에 올라 남은 시간을 센다"
              add: { people_support: 2, insight: 1 }
              goto: count_down_return
            - text: "혼자 제관 앞까지 걸어간다"
              goto: bad_dark_crowd

  count_down_return:
    actions:
      - say:
          char: 덕만.angry
          camera: medium
          with: [유신]
          text: "나를 보아라! 서른까지만 함께 세자! 유신, 방패를 눕혀! 아이들부터 빼내라!"
      - say:
          channel: action
          text: "열. 돌 하나가 난간을 때린다. 스물. 숨을 들이쉴 때마다 목이 찢어질 듯하다. 스물아홉을 세자 군중 속에서 다음 수가 터진다."
      - goto: sun_returns

  sun_returns:
    actions:
      - effect: { name: darken, wait: true }
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: action
          text: "손등에 볕이 닿는다. 방패를 붙잡고 있던 아이가 고개를 든다. 누군가 벽보를 펴고 손가락으로 방금 센 숫자를 짚는다."
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "네 목소리를 듣더구나. 저 많은 사람이. …돌이 날아올 때는 숨도 못 쉬었다."
      - say:
          char: 덕만
          text: "저도요. 숫자를 잊을까 봐 무서웠어요. 다음엔 저 혼자 세지 않을래요."
      - say:
          channel: thought
          text: "아이가 자기는 마흔까지도 셀 수 있다고 한다. 웃음이 나려다가 목이 메인다. 그래, 다음에는 네가 먼저 세렴."
      - say:
          channel: action
          text: "아버지가 천문표의 인장을 문지른다. 찍은 적 없다고 하신다. 손끝이 비어 있는 옥새함으로 향한다. 나는 표를 접지 않는다."
          with: []
          camera: wide
          continueLabel: 아버지를 따라 밤의 왕좌로 간다
      - goto: /6.yaml

  bad_open_line:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "아이들은 나갔습니다! 칼 든 자들이 그 길로 들어옵니다. 공주님, 시각을 외치십시오!"
      - say:
          char: 덕만.princess_angry
          text: "아직 남은 아이가 있어. 닫지 마! 해가 돌아올 때까지만 버텨!"
      - say:
          channel: narration
          text: "마지막 아이가 방패를 넘었다. 그 뒤에서 사내 하나가 몸을 일으켰다. 덕만은 빈손인 줄 알았다. 허리 아래서 꺼낸 짧은 칼은 빛도 내지 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 피난 통로를 지키다 제관의 사병에게 피살."
      - gameOver:
          title: "운명 — 진실보다 먼저 열린 길"
          message: "아이를 넘겨받은 병사가 돌아보았다. 공주가 주저앉아 있었다. 해가 돌아왔을 때 손바닥의 숫자는 피에 번져 읽을 수 없었다."
          recoverToChoice: c6_eclipse_riot

  bad_dark_crowd:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: eclipse
      - char: { id: 덕만, position: left, emotion: angry }
      - say:
          char: 덕만.angry
          text: "밀지 마라! 아이가 있다. 내 쪽으로 길을 내라!"
      - say:
          channel: narration
          text: "방패선 밖으로 한 걸음 나가자 사람들의 어깨에 시야가 막혔다. 뒤에서 군사가 친다는 외침이 터졌다. 덕만은 발을 디딜 땅을 잃었다."
      - say:
          char: 유신.angry
          text: "밀지 마라! 공주님이 그 아래 계신다! 방패 내려!"
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 제단 앞 압사자 사이에서 사망. 제관은 이를 하늘의 심판이라 선포하고 계산표를 소각함."
      - gameOver:
          title: "운명 — 옳은 말이 닿지 않은 거리"
          message: "유신은 해가 돌아온 뒤에야 덕만의 옷자락을 찾았다. 제관은 그동안 제단 위에서 새 예언을 외치고 있었다."
