          with: [덕만]
          text: "그 말은 왕이 된 뒤에도 지키십시오."
      - choice:
          key: c5_rescue
          prompt: "첫 화살이 마차 지붕을 뚫습니다."
          char: 덕만
          camera: close
          with: [진운]
          options:
            - text: "함께 마차에 탄다"
              add: { rival_trust: 1, power: 1 }
              goto: rescue_personal
            - text: "유신에게 맡긴다"
              add: { yushin_trust: 1, army_support: 1 }
              goto: rescue_yushin
            - text: "못 본 척한다"
              goto: go_30_martyr_prince
            - text: "매복을 공개한다"
              add: { legitimacy: 1, nobles_support: 1 }
              goto: rescue_public

