script:
  - scene: stolen_sun

scenes:
  stolen_sun:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: record
          text: "제6장 — 해를 훔친 자들"
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          channel: narration
          text: "검은 부적이 왕좌 아래까지 날아들었습니다. 제관들은 당의 관측표와 같은 날짜를 '신의 계시'라 외쳤고, 열흘 뒤 사라질 해의 값을 덕만의 목숨으로 매겼습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: equal_exchange }
          channel: record
          text: "모란 연회에서 받아 온 당의 천문표가 제관의 날짜와 일치했습니다. 덕만이 혼인 대신 가져온 지식이 첫 단서가 됐습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: armed_truce }
          channel: narration
          text: "국경에 먼저 도착한 군량 수레 바닥에서 당 군관의 일식 메모가 발견됐습니다. 전쟁을 미룬 시간이 이제 해를 읽을 시간으로 바뀌었습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: secret_trade }
          channel: narration
          text: "무역권으로 산 귀족의 서신 중 한 장에 '해가 잠길 때 덕만을 가리킨다'는 문장이 있었습니다. 더러운 거래가 음모의 시각을 먼저 밝혔습니다."
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "열흘만 궁 안에 있어라. 해가 돌아온 뒤 표를 보여도 늦지 않다. 겁먹은 사람들은 숫자보다 네 목을 먼저 볼 거다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "저들은 하늘의 뜻을 아는 게 아니라 시각을 먼저 안 겁니다. 제가 숨으면 정말 예언처럼 보여요. 정확한 시간을 찾아 공개하겠습니다."
      - choice:
          key: c6_find_time
          prompt: "제관은 계산을 계시로 바꿨다. 빼앗긴 시각을 누구의 기록에서 되찾을까?"
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "당의 천문표와 신라 달력을 겹친다"
              add: { insight: 2, evidence: 1 }
              goto: calculate_eclipse
            - text: "비담을 제관의 서고에 들여보낸다"
              add: { evidence: 2, fear: 1, bidam_trust: 1 }
              goto: steal_table
            - text: "농부들의 파종 기억을 모은다"
              add: { people_support: 2, insight: 1 }
              goto: public_observation

  calculate_eclipse:
    actions:
      - bg: moon_court
      - say:
          channel: narration
          text: "덕만은 두 달력의 칸을 하나씩 밀었습니다. 마지막 선이 포개지자 제관의 '계시'가 당의 계산표와 한 치도 다르지 않게 겹쳤습니다."
      - goto: table_revealed

  steal_table:
    actions:
      - bg: locked_room
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "창문이 열리고 비담이 먼지투성이 계산표를 던졌습니다. 일식 시각 옆에는 '덕만을 가리킬 때'라는 붉은 글씨가 적혀 있었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "표는 찾았습니다. 그런데 창밖 발소리는 제가 들어올 때보다 많군요. 제관들이 일부러 훔치게 둔 것 같습니다."
      - say:
          char: 덕만.princess_angry
          camera: close
          with: [비담]
          text: "표를 놓고 나가. 살아서 당의 표와 대조해야 증거가 돼."
      - say:
          channel: narration
          text: "문밖에서 '신전을 더럽힌 공주'라는 외침이 먼저 터졌습니다. 계산표에는 훔친 사람 손에 묻도록 독가루가 발려 있었고, 덕만의 손등이 빠르게 검게 변했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "신전 침입 기록 — 덕만 공주, 성물을 훔치다 신벌을 받아 사망. 계산표는 제관이 회수해 소각함."
      - gameOver:
          title: "운명 — 훔치게 둔 계산표"
          message: "제관들은 계산표를 지키는 대신 덕만이 훔치는 장면을 기다렸습니다. 손에 묻은 독은 신벌로 꾸며졌고, 진짜 일식 시각도 함께 사라졌습니다."
          recoverToChoice: c6_find_time

  public_observation:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "늙은 농부는 지난 일식 날 망친 씨앗을 아직도 자루째 보관하고 있었습니다. 아이들은 그날 우물 그림자가 어느 담을 넘었는지 몸으로 가리켰습니다. 기억을 포개자 어둠의 범위가 한 시진 안으로 좁혀졌습니다."
      - say:
          char: 덕만
          text: "한 시진 안으로는 좁혔어. 사람들에게 넉넉히 말하면 피할 수 있지 않을까?"
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "제관은 한 시각을 말합니다. 공주님이 한 시진을 말하면 사람들은 어느 쪽이 더 확신하는지만 볼 겁니다."
      - say:
          channel: narration
          text: "덕만이 예고한 첫 시각에 해가 그대로이자 군중에서 웃음이 터졌습니다. 제관은 바로 그 틈에 '가짜 공주가 하늘을 모욕했다'고 외쳤고, 돌이 덕만 쪽으로 쏟아졌습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 거짓 예언으로 민심을 어지럽히다 군중에게 피살."
      - gameOver:
          title: "운명 — 한 시진의 빈틈"
          message: "농부들의 기억은 계절을 가리켰지만 정확한 시각을 증명하지 못했습니다. 넓게 잡은 예고가 빗나간 순간 제관은 그 빈틈을 선동으로 채웠고 덕만은 일식 전에 죽었습니다."
          recoverToChoice: c6_find_time

  table_revealed:
    actions:
      - sticker: { id: c6_table, image: eclipse_table_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: eclipse_table
      - say:
          channel: narration
          text: "먹줄은 정오 바로 뒤에서 만났습니다. 어둠이 머무는 시간은 짧았습니다. 그런데 계산표 아래에는 덕만을 가리킬 순간과 왕실 옥새까지 이미 찍혀 있었습니다."
      - clearSticker: { id: c6_table, leave: fadeOut }
      - goto: eclipse_policy

  eclipse_policy:
    actions:
      - choice:
          key: c6_eclipse_policy
          prompt: "어둠이 올 시각을 손에 넣었다. 한 번의 승리가 아니라 다음 거짓 예언까지 막으려면?"
          char: 덕만
          camera: close
          options:
            - text: "시장 벽에 시각과 관측법을 붙인다"
              set: { eclipse_policy: public_science, used_false_omen: false }
              add: { people_support: 2, insight: 2, nobles_support: -1 }
              goto: announce_science
            - text: "마지막 순간 북을 울려 해를 돌려놓는다"
              set: { eclipse_policy: royal_miracle, used_false_omen: true }
              add: { people_support: 1, fear: 2, nobles_support: 1 }
              goto: stage_miracle
            - text: "표를 궁 안에 잠그고 군사만 배치한다"
              set: { eclipse_policy: secret_knowledge, used_false_omen: false }
              add: { king_trust: 2, nobles_support: 2, insight: -1 }
              goto: keep_secret

  announce_science:
    actions:
      - bg: village
      - say:
          channel: narration
          text: "새벽마다 벽보가 뜯겼고 덕만은 낮마다 다시 붙였습니다. 아이들이 구멍 뚫은 가죽으로 해를 보는 법을 따라 하자 검은 부적값이 바닥으로 떨어졌습니다."
      - say:
          char: 덕만
          camera: medium
          text: "해가 돌아와도 제 이름을 외치지 마세요. 벽보 시간이 맞았는지 확인하세요. 틀리면 제 숫자라도 고치면 됩니다."
      - goto: eclipse_day

  stage_miracle:
    actions:
      - bg: peony_court
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "어둠이 가장 짙어졌을 때 북이 세 번 울렸습니다. 세 번째 북채가 떨어지자 햇빛이 제단 끝을 긁었고 군중은 덕만의 이름을 울부짖었습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "거짓 예언을 이기려고 더 정확한 기적을 연출하셨군요. 보십시오. 숫자를 배운 사람보다 폐하를 외울 사람이 더 빨리 늘었습니다."
      - say:
          char: 덕만.sad
          text: "사람들이 살았어. 그걸로 됐다고 생각하고 싶은데… 저 북을 누가 한 번만 일찍 울렸지?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "제관입니다. 이제 공주님의 기적이 거짓이라는 증거도 그 사람이 갖게 됐군요."
      - say:
          channel: narration
          text: "사흘 뒤 '하늘을 속인 공주'라는 격문이 귀족가에 돌았습니다. 같은 날 밤 덕만의 약차에서는 제관의 제단에 쓰이던 독초가 나왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 진료 기록 — 덕만 공주, 일식 뒤 기력을 잃고 사망. 제관들은 하늘을 속인 벌이라 선포함."
      - gameOver:
          title: "운명 — 기적을 아는 입"
          message: "북으로 해를 돌려놓은 연출은 당장의 공포를 눌렀지만 비밀을 아는 제관에게 덕만의 목숨을 쥐여 줬습니다. 왕위를 시기한 귀족들은 폭로보다 먼저 독으로 입을 막았습니다."
          recoverToChoice: c6_eclipse_policy

  keep_secret:
    actions:
      - bg: council_hall
      - char: { id: 진평왕, position: right }
      - say:
          channel: narration
          text: "일식 날 궁문은 닫혔고 골목마다 방패가 섰습니다. 비명은 담 밖에서 작게 끝났지만, 사람들은 어둠의 이유를 모른 채 제관의 다음 말을 기다렸습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "궁문은 지켰다. 그런데 밖에서 네 이름을 부르던 소리가 왜 갑자기 멎었느냐?"
      - say:
          char: 덕만.princess_sad
          camera: close
          with: [진평왕]
          text: "군사가 사람들을 골목에 몰았습니다. 제가 나가겠습니다. 표를 보여 주면—"
      - say:
          channel: narration
          text: "문이 열리자 제관의 군중이 아니라 왕실 군복을 입은 자객이 들어왔습니다. 계산표를 독점한 가문은 덕만이 살아 있는 한 언젠가 이름이 공개될 것을 알고 있었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "일식 경비 기록 — 궁문 혼란 중 덕만 공주 피살. 범인은 왕실 군사로 위장해 신원 확인 불가."
      - gameOver:
          title: "운명 — 잠근 표가 연 문"
          message: "사람들에게 시각을 숨기자 계산표는 소수 가문의 목숨줄이 됐습니다. 그 비밀을 지키려는 자객이 왕실 군복으로 궁에 들어왔고 덕만은 설명할 기회도 얻지 못했습니다."
          recoverToChoice: c6_eclipse_policy

  eclipse_day:
    actions:
      - bg: peony_court
      - camera: wide
      - effect: eclipse
      - say:
          channel: narration
          text: "정오가 지나자 새들이 먼저 울음을 멈췄습니다. 빛이 빠르게 식었고, 제관의 손가락이 덕만을 향하는 순간 군중이 한 몸처럼 제단으로 쏟아졌습니다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: reaction
          with: [덕만]
          text: "방패를 세우면 앞줄 아이들이 눌리고, 눕히면 제단까지 길이 열립니다. 사람을 빼낼 순서를 명령하십시오!"
      - choice:
          key: c6_eclipse_riot
          prompt: "예언이 아니라 군중이 아이를 삼키려 한다. 진실이 닿을 길부터 어떻게 만들까?"
          char: 덕만
          camera: reaction
          with: [유신]
          options:
            - text: "난간에 올라 남은 시간을 센다"
              add: { people_support: 2, insight: 1 }
              goto: count_down_return
            - text: "방패를 눕혀 아이들의 길을 만든다"
              add: { mercy: 2, yushin_trust: 1 }
              goto: bad_open_line
            - text: "혼자 제관 앞까지 걸어간다"
              goto: bad_dark_crowd

  count_down_return:
    actions:
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "서른까지 센다! 그때도 해가 안 돌아오면 나를 잡아! 방패는 눕히고 아이들부터 뒤로 보내!"
      - say:
          channel: narration
          text: "처음 열까지는 돌이 날아왔고, 스물에는 울음이 잦아들었습니다. 서른을 앞두고 햇빛이 난간을 긁자 군중 속 아이 하나가 덕만보다 먼저 남은 수를 외쳤습니다."
      - goto: sun_returns

  sun_returns:
    actions:
      - effect: { name: darken, wait: true }
      - bg: peony_court
      - camera: wide
      - say:
          channel: narration
          text: "덕만이 마지막 수를 외치자 빛이 손등부터 돌아왔습니다. 누군가는 무릎을 꿇었고, 누군가는 구겨진 벽보를 펴 시각을 다시 확인했습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          char: 진평왕.weak
          camera: close
          with: [덕만]
          text: "오늘은 내 왕명보다 네 목소리에 더 많은 사람이 멈췄다. 그 힘이 자랑스러우면서도 무섭구나."
      - say:
          char: 덕만
          text: "저도 무섭습니다. 그래서 다음에는 제가 없어도 시간을 셀 수 있게 하려고요. 제가 틀리면 틀렸다고 말할 사람도 늘리고요."
      - say:
          channel: record
          text: "덕만은 해를 되돌리지 않았습니다. 다만 해를 훔쳐 권력을 만들던 사람들의 시간을 빼앗았습니다."
      - say:
          channel: narration
          text: "군중이 흩어진 뒤 진평왕은 계산표의 옥새를 엄지로 문질렀습니다. '내가 찍은 적 없다.' 그는 그 말만 남기고 밤중에 빈 왕좌로 오라고 했습니다."
      - goto: /6.yaml

  bad_open_line:
    actions:
      - bg: peony_court
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "아이들은 빠졌습니다. 하지만 제단까지 열린 길로 칼 든 자들이 섞여 들어옵니다. 남은 시각을 외쳐 사람부터 멈춰야 합니다!"
      - say:
          char: 덕만.princess_angry
          text: "길을 다시 닫으면 아이들이 끼어. 끝까지 열어 둬. 해가 돌아오면 저들도 멈출 거야."
      - say:
          channel: narration
          text: "아이들은 빠져나왔지만 제관의 사병도 눕힌 방패를 밟고 들어왔습니다. 해가 돌아오기 직전, 군중 속에서 뻗은 칼이 덕만의 옆구리를 찔렀습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
