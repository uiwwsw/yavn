script:
  - scene: stolen_sun

scenes:
  stolen_sun:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제6장 — 해를 훔친 자들"
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          channel: narration
          text: "검은 부적이 왕좌 아래까지 날아들었습니다. 제관들은 당의 관측표와 같은 날짜를 '신의 계시'라 외쳤고, 열흘 뒤 사라질 해의 값을 덕만의 목숨으로 매겼습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: equal_exchange }
          channel: record
          text: "모란 연회에서 받아 온 당의 천문표가 제관의 날짜와 일치했습니다. 덕만이 혼인 대신 가져온 지식이 첫 단서가 됐습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: armed_truce }
          channel: narration
          text: "국경에 먼저 도착한 군량 수레 바닥에서 당 군관의 일식 메모가 발견됐습니다. 전쟁을 미룬 시간이 이제 해를 읽을 시간으로 바뀌었습니다."
      - say:
          when: { var: diplomacy_policy, op: eq, value: secret_trade }
          channel: narration
          text: "무역권으로 산 귀족의 서신 중 한 장에 '해가 잠길 때 덕만을 가리킨다'는 문장이 있었습니다. 더러운 거래가 음모의 시각을 먼저 밝혔습니다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "열흘만 궁에 있어라. 해가 돌아온 뒤 표를 보여도 늦지 않아. 겁먹은 눈에는 숫자보다 네 목이 먼저 보인다."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "저들은 하늘의 뜻이 아니라 시각을 압니다. 제가 숨으면 예언이 돼요. 정확한 때를 찾아 알리겠습니다."
      - choice:
          key: c6_find_time
          prompt: "제관이 계산을 예언처럼 꾸몄습니다. 정확한 시각을 어디서 찾을까요?"
          char: 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "당의 천문표와 신라 달력을 겹친다"
              add: { insight: 2, evidence: 1 }
              goto: calculate_eclipse
            - text: "비담을 제관의 서고에 들여보낸다"
              add: { evidence: 2, fear: 1, bidam_trust: 1 }
              goto: steal_table
            - text: "농부들의 파종 기억을 모은다"
              add: { people_support: 2, insight: 1 }
              goto: public_observation

  calculate_eclipse:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "덕만은 두 달력의 칸을 하나씩 밀었습니다. 마지막 선이 포개지자 제관의 '계시'가 당의 계산표와 한 치도 다르지 않게 겹쳤습니다."
      - goto: table_revealed

  steal_table:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "비담이 꺼낸 표에는 먼지가 없었습니다. 덕만은 당에서 받은 사본을 그 옆에 펴고 먹이 젖은 줄을 가리켰습니다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "가져가라고 놓아뒀군요. 마지막 줄만 먹이 덜 말랐습니다."
      - say:
          char: "덕만.princess_angry"
          camera: "medium"
          with:
            - "비담"
          text: "그 줄은 믿지 마. 앞장의 날짜부터 우리 달력으로 다시 세자."
      - say:
          channel: "narration"
          text: "가짜 예측은 버렸습니다. 비담이 들킨 서고의 문에는 새 자물쇠가 걸렸고, 제관들은 덕만의 다음 실수만 기다렸습니다."
      - add:
          nobles_support: -1
      - say:
          channel: "record"
          text: "조사 결과 — 위조를 알아봤지만 시간을 잃었습니다. 두 달력을 대조해야 정확한 시각이 나옵니다."
      - goto: "calculate_eclipse"

  public_observation:
    actions:
      - bg:
          id: "village"
          transition: "dissolve"
          duration: 720
      - say:
          channel: "narration"
          text: "농부들은 지난 일식 날의 파종과 강 수위를 기억했습니다. 날짜는 맞았지만 해가 가려진 시각은 제각각이었습니다."
      - say:
          char: "덕만"
          text: "계절은 맞아. 시각만 좁히면 돼. 이 기억을 버리진 말자."
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "기억한 날과 당의 표가 겹칩니다. 두 달력의 간격부터 세시죠."
      - say:
          channel: "narration"
          text: "덕만은 파종 날짜에 작은 점을 찍었습니다. 뒤에 받은 천문표에도 같은 간격으로 점이 이어졌습니다."
      - add:
          people_support: 1
          insight: -1
      - say:
          channel: "record"
          text: "조사 결과 — 농부들이 검산에 참여했습니다. 기억을 계산표와 맞춰 남은 시각을 구합니다."
      - goto: "calculate_eclipse"

  table_revealed:
    actions:
      - sticker: { id: c6_table, image: eclipse_table_sticker, x: 50, y: 27, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - get: eclipse_table
      - say:
          channel: narration
          text: "먹줄은 정오 바로 뒤에서 만났습니다. 어둠이 머무는 시간은 짧았습니다. 그런데 계산표 아래에는 덕만을 가리킬 순간과 왕실 옥새까지 이미 찍혀 있었습니다."
      - clearSticker: { id: c6_table, leave: fadeOut }
      - goto: eclipse_policy

  eclipse_policy:
    actions:
      - choice:
          key: c6_eclipse_policy
          prompt: "일식 시각을 알아냈습니다. 사람들에게 어떻게 알릴까요?"
          char: 덕만
          camera: medium
          options:
            - text: "마지막 순간 북을 울려 해를 돌려놓는다"
              set: { eclipse_policy: royal_miracle, used_false_omen: true }
              add: { people_support: 1, fear: 2, nobles_support: 1 }
              goto: stage_miracle
            - text: "표를 궁 안에 잠그고 군사만 배치한다"
              set: { eclipse_policy: secret_knowledge, used_false_omen: false }
              add: { king_trust: 2, nobles_support: 2, insight: -1 }
              goto: keep_secret
            - text: "시장 벽에 시각과 관측법을 붙인다"
              set: { eclipse_policy: public_science, used_false_omen: false }
              add: { people_support: 2, insight: 2, nobles_support: -1 }
              goto: announce_science

  announce_science:
    actions:
      - bg: { id: village, transition: dissolve, duration: 720 }
      - say:
          channel: narration
          text: "새벽마다 벽보가 뜯겼고 덕만은 낮마다 다시 붙였습니다. 아이들이 구멍 뚫은 가죽으로 해를 보는 법을 따라 하자 검은 부적값이 바닥으로 떨어졌습니다."
      - say:
          char: 덕만
          camera: medium
          text: "해가 돌아와도 제 이름은 부르지 마세요. 벽보가 맞았는지 보세요. 틀리면 고치고요."
      - goto: eclipse_day

  stage_miracle:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - char:
          id: "비담"
          position: "right"
          emotion: "smirk"
      - say:
          channel: "narration"
          text: "북을 울릴 자리는 정해졌습니다. 덕만은 계산표를 소매 안에 넣고, 해가 돌아올 시각에 붉은 실을 묶었습니다."
      - say:
          char: "비담.smirk"
          camera: "medium"
          with:
            - "덕만"
          text: "북을 치면 사람들이 폐하만 볼 겁니다. 시각은 제 전령에게 맡기십시오."
      - say:
          char: "덕만.sad"
          text: "사람들이 진정하면 표도 보여 주겠어. 오늘은 밀려 죽는 사람부터 막자."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "사람들이 기적을 원하면, 표를 보여 줄 날은 자꾸 늦어질 겁니다."
      - say:
          channel: "narration"
          text: "북소리에 사람들이 멈췄습니다. 덕만은 자신이 고른 거짓을 계산표 뒷면에 적었습니다."
      - add:
          bidam_trust: 2
          fear: 1
      - say:
          channel: "record"
          text: "통치의 대가 — 군중은 진정됐습니다. 북의 비밀을 아는 비담의 말이 무거워졌습니다."
      - goto: "eclipse_day"

  keep_secret:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - char:
          id: "진평왕"
          position: "right"
      - say:
          channel: "narration"
          text: "왕은 계산표 사본을 장수들에게만 건넸습니다. 병사들은 정확한 시각에 방패를 세웠지만 시장에는 아무 설명도 전해지지 않았습니다."
      - say:
          char: "진평왕"
          camera: "medium"
          with:
            - "덕만"
          text: "질서는 지킬 수 있다. 왜 어두워지는지까지 오늘 말해야 하느냐?"
      - say:
          char: "덕만.princess_sad"
          camera: "medium"
          with:
            - "진평왕"
          text: "오늘 안 물어도 내일 물을 겁니다. 제가 난간에서 직접 답하겠습니다."
      - say:
          channel: "narration"
          text: "덕만은 잠근 표의 마지막 숫자를 손바닥에 옮겼습니다. 문밖에서는 제관의 설명이 먼저 퍼지고 있었습니다."
      - add:
          people_support: -2
      - say:
          channel: "record"
          text: "통치의 대가 — 군사는 준비됐습니다. 군중의 불안을 설명할 책임은 덕만 한 사람에게 남았습니다."
      - goto: "eclipse_day"

  eclipse_day:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: eclipse
      - say:
          camera: wide
          channel: narration
          text: "정오가 지나자 새들이 먼저 울음을 멈췄습니다. 빛이 빠르게 식었고, 제관의 손가락이 덕만을 향하는 순간 군중이 한 몸처럼 제단으로 쏟아졌습니다."
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "방패를 세우면 아이들이 눌리고, 눕히면 제단까지 열립니다. 무엇부터 지킵니까!"
      - choice:
          key: c6_eclipse_riot
          prompt: "군중 속 아이들이 눌리고 있습니다. 길을 어떻게 열까요?"
          char: 덕만
          camera: medium
          with: [유신]
          options:
            - text: "방패를 눕혀 아이들의 길을 만든다"
              add: { mercy: 2, yushin_trust: 1 }
              goto: bad_open_line
            - text: "난간에 올라 남은 시간을 센다"
              add: { people_support: 2, insight: 1 }
              goto: count_down_return
            - text: "혼자 제관 앞까지 걸어간다"
              goto: bad_dark_crowd

  count_down_return:
    actions:
      - say:
          char: 덕만.angry
          camera: medium
          with: [유신]
          text: "서른까지 센다! 그때도 해가 안 돌아오면 나를 잡아! 방패는 눕히고 아이들부터 뒤로 보내!"
      - say:
          channel: narration
          text: "처음 열까지는 돌이 날아왔고, 스물에는 울음이 잦아들었습니다. 서른을 앞두고 햇빛이 난간을 긁자 군중 속 아이 하나가 덕만보다 먼저 남은 수를 외쳤습니다."
      - goto: sun_returns

  sun_returns:
    actions:
      - effect: { name: darken, wait: true }
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "덕만이 마지막 수를 외치자 빛이 손등부터 돌아왔습니다. 누군가는 무릎을 꿇었고, 누군가는 구겨진 벽보를 펴 시각을 다시 확인했습니다."
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right, emotion: weak }
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만]
          text: "오늘은 내 왕명보다 네 목소리에 더 많은 사람이 멈췄다. 자랑스럽고… 무섭구나."
      - say:
          char: 덕만
          text: "저도 무서워요. 다음엔 제가 없어도 시간을 세게 할 겁니다. 틀렸다고 말할 사람도요."
      - say:
          channel: record
          text: "덕만은 해를 되돌리지 않았습니다. 다만 해를 훔쳐 권력을 만들던 사람들의 시간을 빼앗았습니다."
      - say:
          channel: narration
          text: "군중이 흩어진 뒤 진평왕은 계산표의 옥새를 엄지로 문질렀습니다. '내가 찍은 적 없다.' 그는 그 말만 남기고 밤중에 빈 왕좌로 오라고 했습니다."
      - goto: /6.yaml

  bad_open_line:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: princess_angry }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "아이들은 빠졌습니다. 하지만 제단까지 열린 길로 칼 든 자들이 섞여 들어옵니다. 남은 시각을 외쳐 사람부터 멈춰야 합니다!"
      - say:
          char: 덕만.princess_angry
          text: "길을 다시 닫으면 아이들이 끼어. 끝까지 열어 둬. 해가 돌아오면 저들도 멈출 거야."
      - say:
          channel: narration
          text: "아이들은 빠져나왔지만 제관의 사병도 눕힌 방패를 밟고 들어왔습니다. 해가 돌아오기 직전, 군중 속에서 뻗은 칼이 덕만의 옆구리를 찔렀습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 피난 통로를 지키다 제관의 사병에게 피살."
      - gameOver:
          title: "운명 — 진실보다 먼저 열린 길"
          message: "사람을 빼낼 길만 열고 군중을 멈출 정확한 시간을 말하지 않자 자객도 같은 길을 이용했습니다. 아이들은 살았지만 덕만은 돌아온 햇빛을 보지 못했습니다."
          recoverToChoice: c6_eclipse_riot

  bad_dark_crowd:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 덕만 }
      - effect: eclipse
      - char: { id: 덕만, position: left, emotion: angry }
      - say:
          char: 덕만.angry
          text: "해는 곧 돌아온다. 내 목소리를 듣고 아이들이 지나갈 길부터 열어라!"
      - say:
          channel: narration
          text: "덕만이 혼자 방패선 밖으로 걸어 나가자 유신의 손이 닿지 않는 거리가 생겼습니다. 뒤에서는 '군사가 친다'는 외침이 터졌고 군중이 한꺼번에 앞으로 무너졌습니다."
      - say:
          char: 유신.angry
          text: "공주님께 길이 없습니다. 방패를 세우면 사람들이 짓밟힙니다."
      - say:
          channel: record
          text: "일식 소요 기록 — 덕만 공주, 제단 앞 압사자 사이에서 사망. 제관은 이를 하늘의 심판이라 선포하고 계산표를 소각함."
      - gameOver:
          title: "운명 — 옳은 말이 닿지 않은 거리"
          message: "진실은 사실만으로 군중을 통과하지 못했습니다. 덕만은 사람을 빼낼 길보다 자신의 몸을 먼저 드러냈고, 해가 돌아왔을 때는 이미 군중 아래에서 숨이 멎어 있었습니다."
