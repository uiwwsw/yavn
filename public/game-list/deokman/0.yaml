script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: title_palace
      - camera: medium
      - effect: moonveil
      - say:
          delivery: calm
          text: "서장 — 왕관에는 주인이 없다"
      - say:
          delivery: calm
          text: "역사에 남은 인물과 사건 위에 상상을 보탠 이야기입니다."
      - say:
          delivery: calm
          text: "서기 631년 늦봄, 진평왕 53년."
      - say:
          delivery: calm
          text: "제사와 연회를 하루 앞둔 오후, 월성의 기와 위로 늦봄비가 오래 내렸다."
      - say:
          delivery: calm
          text: "진평왕에게는 두 딸이 있었고, 아들은 없었다."
      - say:
          delivery: calm
          text: "신라에서는 아직 여자가 왕이 된 적이 없었다."
      - bg: throne_hall
      - camera: medium
      - effect: focus
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: center
      - say:
          with:
            - 진평왕
            - 덕만
            - 칠숙
          delivery: calm
          text: "내일 제사 순서를 적은 문서 옆에는 아무도 앉지 않는 방석 하나가 놓여 있었다."
      - say:
          with:
            - 칠숙
            - 덕만
          wait: 650
          text: "칠숙이 그 빈 방석을 가리켰다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "전하, 언젠가 태어날 왕자를 위해 비워 둔 자리입니다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 칠숙
          wait: 550
          text: "내게 아들은 없다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "아직 없으니 계속 비워 두셔야 합니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "태어나지도 않은 왕자 때문에 제 자리는 없는 겁니까?"
      - char:
          id: 천명
          position: center
      - say:
          char: 천명
          camera: medium
          with:
            - 덕만
          text: "덕만아. 오늘만 참자."
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          text: "언니는 참아져?"
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
            - 천명
          text: "둘 다 이리 와서 내 곁에 앉아라."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "두 공주께서 어디에 앉아야 할지 헷갈리시겠습니다."
      - say:
          char: 진평왕
          camera: close
          with:
            - 칠숙
          text: "내 딸들이 내 곁에 앉는 모습에 모두 익숙해질 것이다."
      - say:
          camera: medium
          with:
            - 진평왕
            - 덕만
            - 칠숙
          text: "문이 벌컥 열렸다. 젖은 관리가 숨도 못 고른 채 엎드렸다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
            - 칠숙
          text: "무슨 일이냐? 숨부터 고르고 말해라."
      - say:
          camera: medium
          with:
            - 진평왕
            - 덕만
            - 칠숙
          text: "관리가 펼친 청원서는 세 마을에서 곡식을 보내 달라는 글이었다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "덕만아. 네가 읽어 봐라."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "3일째 곡식 수레가 오지 않았답니다."
      - say:
          char: 칠숙
          camera: medium
          with:
            - 덕만
          text: "내일 제사에 올릴 곡식도 빠듯합니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "굶는 아이가 제삿날까지 기다립니까?"
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "네가 왕이라면 어떻게 하겠느냐?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "해가 지기 전에 왕실 창고를 열겠습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "공주님 한마디로 왕실 창고를 여십니까?"
      - say:
          char: 진평왕
          camera: close
          with:
            - 칠숙
          text: "내 명령이다. 해가 지기 전에 창고를 열어라."
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          wait: 700
          text: "아버지…… 고맙습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 덕만
          text: "오늘 창고를 연 분이 누구인지 모두 기억하겠군요."
      - bg: moon_court
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          with:
            - 덕만
            - 천명
          wait: 900
          text: "두 자매는 회랑을 다 걸을 때까지 아무 말도 하지 않았다."
      - say:
          char: 천명
          camera: medium
          with:
            - 덕만
          text: "넌 왜 한 번도 망설이질 않아?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          text: "망설인다고 덜 굶어?"
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          text: "아니. 그러니까 더 무서워."
      - char:
          id: 유신
          position: center
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "내일 연회 경비가 전부 바뀌었습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "아버지 곁을 지키는 사람도 바뀌었습니까?"
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "예. 칠숙공이 직접 바꿨습니다."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          wait: 650
          text: "오늘 밤은 전하 곁을 비우지 마십시오."
      - bg: shadow_corridor
      - camera: medium
      - effect: moonveil
      - char:
          id: 덕만
          position: center
      - say:
          with:
            - 덕만
          delivery: calm
          wait: 700
          text: "같은 날, 밤이 깊은 시각."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "덕만은 젖은 청원서를 품에 안고 왕의 방으로 향했다."
      - say:
          with:
            - 덕만
          delivery: calm
          wait: 550
          text: "등불 하나가 꺼졌다."
      - say:
          with:
            - 덕만
          delivery: calm
          wait: 700
          text: "그다음 불도 꺼졌다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "……두 사람이 오고 있어."
      - say:
          camera: wide
          with: []
          delivery: whisper
          text: "덕만은 기둥 뒤로 몸을 숨겼다."
          wait: 550
      - char:
          id: 칠숙
          position: right
      - char:
          id: 아진
          position: left
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 아진
          text: "내일, 전하께서 두 번째 잔을 드시면 쓰러지실 겁니다."
          wait: 700
      - say:
          char: 아진
          camera: medium
          with:
            - 칠숙
          delivery: neutral
          text: "공주는 왕의 방에서 멀리 떨어져 있습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 아진
          text: "공주가 전하께 닿기 전에 붙잡으십시오."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 칠숙
          text: "죽이지는 말라는 겁니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 아진
          wait: 850
          unskippable: true
          text: "<speed=19>살아 있으면 결국 왕이 될 사람입니다.</speed>"
      - say:
          camera:
            shot: reaction
            target: 덕만
          with:
            - 덕만
          delivery: whisper
          text: "덕만의 손이 청원서를 구겼다."
          wait: 450
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "발밑에서 마른 나뭇가지가 부러졌다."
          wait: 650
      - say:
          with:
            - 덕만
          delivery: whisper
          wait: 800
          text: "발소리가 멎었다. 방향이 바뀌었다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "아버지께 가야 해. 지금."
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          camera: close
          with: []
          prompt: "발소리가 코앞에서 멎었다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          with:
            - 덕만
            - 아진
            - 칠숙
          text: "덕만은 숨을 고르고 밖으로 나섰다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 아진
            - 칠숙
          delivery: nervous
          text: "밤길이 낯설어 길을 잘못 들었습니다."
      - say:
          char: 아진
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "제 손은 왜 보십니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 아진
          text: "칼자루를 쥐고 계시니까요."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "오늘 들은 일은 못 들은 것으로 하시지요."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "호위가 오려면 아직 시간이 걸립니다."
      - say:
          char: 덕만.angry
          camera: close
          with:
            - 아진
          delivery: angry
          text: "벌써 둘이 오고 있습니다. 곧 도착합니다."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "다음에도 호위가 제때 올 거라 믿으십니까?"
      - say:
          with:
            - 덕만
            - 아진
          text: "아진 소매 아래 붉은 매듭이 보였다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - say:
          with:
            - 덕만
          text: "덕만은 빗장을 두 번 확인했다."
      - say:
          with:
            - 덕만
          text: "천명의 비녀와 유신의 호각을 나란히 놓았다."
      - say:
          char: 덕만
          camera: medium
          with: []
          text: "아버지께 알리면 연회는 취소될 거야."
      - say:
          camera: close
          with:
            - 덕만
          text: "덕만의 손이 천명의 비녀 위에서 멈췄다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "그러면 저들은 바로 숨겠지."
      - say:
          char: 덕만
          camera: close
          delivery: whisper
          text: "혼자 가면 아버지를 만나기도 전에 붙잡혀."
      - say:
          char: 덕만
          camera: close
          delivery: whisper
          text: "누군가는 불러야 해."
      - say:
          camera: close
          with:
            - 덕만
          wait: 650
          text: "이번에는 유신의 호각을 손에 쥐었다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "부르는 순간 그 사람도 위험해져."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          wait: 750
          text: "……이번만큼은 혼자 못 해."
      - choice:
          key: p_warn
          prompt: "날이 밝기 전, 누구를 믿을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          delivery: sad
          text: "왜 혼자 다 듣고 왔어?"
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          delivery: sad
          text: "손부터 줘 봐. 떨고 있잖아."
      - say:
          char: 덕만
          camera: close
          with:
            - 천명
          delivery: whisper
          text: "다친 건 아니야. 아버지 곁에 있어 줘."
      - say:
          char: 천명.sad
          camera: medium
          with:
            - 덕만
          text: "또 괜찮은 척하면 정말 화낼 거야."
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          text: "무섭다고 말해. 내가 같이 떨게."
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          delivery: whisper
          wait: 900
          text: "……무서워. 아버지 손을 놓지 마."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "명단에는 13명이 있습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "그중 둘은 이미 죽었습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "죽은 사람까지 넣었다면 이 명단은 가짜야."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "갓난아이 이름도 하나 있습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "범인을 잡게 하려는 게 아니라 시간을 끌려는 명단입니다."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "누가 이 명단을 만들었는지 찾겠습니다."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - camera: medium
      - effect: embers
      - say:
          delivery: calm
          text: "다음 날, 예정된 연회가 열렸다."
          wait: 450
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
            - 덕만
          text: "두 번째 잔은 제가 올리지요."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "공주님, 어젯밤엔 길을 찾으셨습니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "예. 덕분에 아주 잘 찾았습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "술병이 바뀔 때마다 손가락을 하나씩 접으시더군요."
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 덕만
          text: "몇 번까지 세셨습니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "두 번. 이제 세 번째겠지요."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "덕만아. 내게 숨기는 것이 있느냐?"
          wait: 600
      - say:
          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "조금만 더 모른 척해 주십시오."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "지금은 묻지 말고 널 믿어 달라는 뜻이냐?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          delivery: nervous
          text: "예. 이번 한 번만 제 눈을 믿어 주십시오."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          wait: 850
          text: "<speed=20>믿는다. 위험하면 내 손부터 잡아라.</speed>"
      - say:
          with:
            - 덕만
            - 진평왕
          wait: 750
          text: "진평왕이 두 번째 잔을 들었다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          delivery: whisper
          text: "지금이야. 더 늦으면 못 막아."
      - effect: { name: pulse, wait: true }
      - choice:
          key: p_cup
          prompt: "두 번째 잔이 왕의 입술에 닿는다."
          char: 덕만
          camera: close
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "음식상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          text: "공주님께서 전하의 음식상을 엎으셨군요."
      - say:
          char: 덕만.angry
          camera: medium
          text: "상은 다시 차리면 됩니다."
      - say:
          char: 덕만.angry
          camera: close
          with:
            - 진평왕
          text: "아버지는 다시 모실 수 없으니까요."
      - say:
          char: 진평왕
          camera: medium
          text: "잔을 치워라. 술을 따른 사람도 당장 잡아라."
      - goto: prologue_survive

  cup_swap:
    actions:
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "전하의 잔을 제게 주시겠습니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          delivery: deduction
          text: "그 잔만 보며 손가락을 접으셨지요."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "먼저 드시지요."
          wait: 650
      - say:
          char: 칠숙.smile
          camera: close
          text: "농담이 지나치십니다."
      - say:
          char: 덕만
          camera: close
          text: "농담이면 웃으면서 드세요."
      - effect: impact
      - say:
          delivery: nervous
          wait: 650
          text: "악사의 손에서 잔이 떨어졌다. 그도 함께 무너졌다."
      - goto: prologue_survive

  prologue_survive:
    actions:
      - effect: focus
      - say:
          delivery: sad
          text: "왕은 살았다. 잔을 나른 악사는 그 자리에서 죽었다."
      - say:
          with:
            - 진평왕
            - 덕만
          text: "악사의 품에서 연꽃 노리개가 나왔다."
      - say:
          char: 진평왕.sad
          camera: medium
          text: "이게 네 것이냐?"
      - say:
          char: 덕만
          camera: medium
          delivery: whisper
          text: "제 것입니다. 하지만 제가 준 게 아닙니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "아버지를 죽이고, 제 손에 피를 묻히려 했어요."
          wait: 800
      - say:
          char: 진평왕.sad
          camera: medium
          text: "아버지는 네 말을 믿는다."
      - say:
          char: 진평왕.sad
          camera: close
          with:
            - 덕만
          wait: 700
          text: "하지만 왕은 네 말만 믿을 수 없다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "3일만 주십시오."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 진평왕
          text: "누명을 벗고, 진짜 범인을 잡겠습니다."
      - get: black_powder
      - set:
          clue_black_powder: true
      - say:
          delivery: calm
          text: "연회가 끝나기도 전, 회의장 문에 덕만의 이름을 적은 나무패가 걸렸다."
      - say:
          with:
            - 덕만
          text: "‘왕을 죽이려 한 사람, 덕만.’"

  go_01_too_clever:
    actions:
      - char:
          id: 아진
          position: left
      - char:
          id: 덕만
          position: center
      - char:
          id: 칠숙
          position: right
      - effect: focus
      - say:
          text: "덕만은 숨지 않았다. 스스로 기둥 밖으로 나섰다."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙, 아진]
          text: "두 번째 잔에 독을 넣으시겠군요."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "그 뒤에는 제 입을 막고요."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "들은 말을 아무에게도 하지 않으셨군요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "길을 잃으셨다기엔 너무 정확합니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "제가 살아서 말할까 두려우시군요."
      - say:
          char: 아진
          camera: medium
          with: [덕만]
          text: "아닙니다. 증언이 하나 생긴 겁니다."
      - say:
          char: 아진
          camera: close
          with: [덕만]
          text: "공주님이 먼저 독살을 말하셨다고 증언하겠습니다."
      - effect: darken
      - say:
          text: "칠숙이 먼저 무릎을 꿇었다."
      - say:
          text: "칠숙은 덕만이 범인이라고 말했다."
      - say:
          text: "덕만이 계획을 자세히 안다는 이유로, 칠숙은 공범이라고 몰아갔다."
          wait: 700
      - gameOver:
          title: "운명 01 — 엿들은 계획"
          message: "덕만은 독잔을 막기도 전에 한패로 몰렸다. 그가 죽은 뒤에도 연회는 예정대로 열렸다."
  go_02_broken_moon:
    actions:
      - char:
          id: 덕만
          position: center
      - effect: shake
      - say:
          with:
            - 덕만
          text: "덕만이 지붕에 오르자 젖은 기와가 발밑에서 밀렸다."
      - say:
          with: [덕만]
          text: "아래 회랑의 발소리는 어느새 처마 밑까지 왔다."
      - say:
          char: 덕만.sad
          camera: medium
          with: []
          text: "잠깐…… 누구든, 손 좀 잡아 줘!"
      - char:
          id: 아진
          position: right
      - say:
          char: 아진
          camera: medium
          with:
            - 덕만
          text: "조금만 더 앞으로 오십시오."
      - say:
          char: 아진
