script:
  - scene: opening_record

scenes:
  opening_record:
    actions:
      - bg: peony_court
      - camera: wide
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(210px, 28%, 420px)"
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          channel: record
          delivery: calm
          wait: 600
          unskippable: true
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤."
      - say:
          channel: narration
          delivery: calm
          text: "먹은 아직 번들거렸습니다. 덕만의 죽음은 시신보다 먼저 방 안에 도착해 있었습니다."
      - clearSticker:
          id: opening_death_register
          leave: fadeOut
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "전하께서 몰래 부르셨어요. 발소리 내지 말고 제 옆에 붙으세요. 오늘은 아는 얼굴도 먼저 믿으면 안 됩니다."
      - say:
          char: 어린 덕만
          camera: close
          with: [소화]
          text: "또 누가 나를 찾는데? 아버지는 숨으라면서 왜 자꾸 불러?"
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "저도 몰라서 무섭습니다. 제가 놓으라고 해도 한 번은 제 눈을 보세요. 누가 시켜서 하는 말일 수도 있으니까요."
      - goto: peony_arrives

  peony_arrives:
    actions:
      - say:
          channel: narration
          text: "진평왕은 시종을 모두 내보냈습니다. 문빗장이 걸리는 소리를 확인한 뒤에야 모란 족자를 펼쳤습니다."
      - sticker:
          id: peony_painting_view
          image: peony_painting_sticker
          x: 50
          y: 27
          width: "clamp(180px, 22%, 360px)"
          anchorX: center
          anchorY: center
          rotate: -1.5
          zIndex: 12
          enter: fadeIn
          inputLockMs: 320
      - get: peony_painting
      - char: { id: 진평왕, position: center }
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "덕만아, 꽃이 예쁘다는 말은 필요 없다. 있어야 하는데 없는 것을 찾아봐라."
      - choice:
          key: c1_peony_observation
          prompt: "왕은 답을 기다린다. 덕만의 눈은 어디로 향할까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "꽃 사이의 빈자리를 훑는다"
              goto: observe_absence
            - text: "족자를 들어 뒤축을 만진다"
              goto: observe_back
            - text: "그림을 두고 창과 퇴로를 센다"
              set: { observed_left_waterway: true }
              goto: observe_waterway

  observe_absence:
    actions:
      - bg: peony_court
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "꽃은 이렇게 많은데 벌도 나비도 없어요. 한 마리도요."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "화공이 게을렀던 것뿐일 수도 있지 않느냐."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "향기가 있었다면 벌이 왔을 거예요. 화공은 일부러 아무것도 못 오게 그렸어요."
      - say:
          channel: narration
          text: "진평왕이 정답이라 고개를 끄덕이는 동안 덕만은 그림에만 눈을 두었습니다. 소화가 막으려던 낯선 시종은 그 틈에 찻잔을 바꿨고, 덕만은 목을 축인 뒤에야 씁쓸한 살구씨 냄새를 맡았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 모란도를 감상하던 중 독차를 마시고 사망. 시종 신원 미상."
      - gameOver:
          title: "운명 — 그림 안의 정답"
          message: "모란도의 수수께끼는 풀었지만 소화가 경고한 방 안의 위험과 열린 퇴로를 보지 못했습니다. 덕만이 그림 속 빈자리를 읽는 동안 독을 든 시종이 현실의 빈틈을 먼저 차지했습니다."
          recoverToChoice: c1_peony_observation

  observe_back:
    actions:
      - bg: peony_court
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - say:
          channel: narration
          text: "아래 축이 손끝에서 달각거렸습니다. 덕만이 마개를 비틀자 접힌 종이 한 장이 떨어졌고, 덜 마른 인주가 손가락에 묻었습니다."
      - sticker:
          id: death_register_view
          image: death_register_sticker
          x: 51
          y: 29
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 2
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          channel: record
          delivery: deduction
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "아버지… 여기엔 제가 오늘 밤 죽는다고 쓰여 있어요. 아버지 도장으로."
      - say:
          char: 진평왕.weak
          camera: close
          with: [어린 덕만]
          text: "그 종이를 내려놓아라. 붉은 인주가 아니라 손끝부터 검어지고 있다."
      - say:
          channel: narration
          text: "족자 축 안의 종이는 증거이자 덫이었습니다. 덜 마른 인주에 섞인 독이 손가락의 작은 상처로 번졌고, 덕만은 소화가 물을 가져오기 전에 무릎을 꿇었습니다."
      - clearSticker:
          id: death_register_view
          leave: fadeOut
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "왕실 족보 보정 — 둘째 공주 덕만, 금지 문서를 훔쳐보다 독에 중독되어 사망. 문제의 문서는 소각함."
      - gameOver:
          title: "운명 — 먼저 만진 사망 기록"
          message: "죽음을 예고한 문서는 읽히기 위해 숨겨진 것이 아니라 발견한 사람까지 없애기 위한 미끼였습니다. 덕만은 퇴로보다 증거를 먼저 쥐었고, 기록에 적힌 밤을 넘기지 못했습니다."
          recoverToChoice: c1_peony_observation

  observe_waterway:
    actions:
      - camera: wide
      - say:
          channel: narration
          text: "덕만은 그림을 보지 않았습니다. 창밖의 창끝이 한 번에 같은 방향으로 돌아갔고, 왼쪽 담 아래 배수로 돌판만 비뚤어져 있었습니다."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "왼쪽 담 밑이 열려 있어요. 저라면 기어 나갈 수 있어요."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "꽃을 보랬더니 도망칠 구멍부터 세었구나."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "소화가 그랬어요. 누가 궁 안에서 저를 찾고 있다고."
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "그래서 네가 그림보다 먼저 봐야 할 것이 하나 더 있다. 누군가 오늘 밤 네 죽음을 내 이름으로 적어 두었다."
      - say:
          channel: record
          delivery: deduction
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - goto: king_question

  king_question:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - bg: peony_court
      - camera: medium
      - char: { id: 어린 덕만, position: left }
      - char: { id: 진평왕, position: center }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그래서 묻겠다. 이 꽃에 향기가 있느냐?"
      - choice:
          key: c1_answer_king
          prompt: "진평왕의 시선이 흔들린다. 무엇을 내밀까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "사라진 벌과 나비를 짚는다"
              set: { spoke_truth_to_king: true }
              goto: answer_scent
            - text: "사망 기록을 왕 앞에 펼친다"
              when: { var: death_register, op: eq, value: true }
              set: { spoke_truth_to_king: true }
              goto: answer_record
            - text: "그림만 보고는 모른다고 버틴다"
              goto: answer_literal

  answer_scent:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "벌과 나비가 없으니 향기도 없을 것입니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그래. 당 황제는 향기 없는 모란을 보냈다. 내게 아들이 없으니 신라의 왕좌도 빈 꽃이라 비웃은 것이다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "나는 네가 예쁜 꽃만 볼지, 그 그림으로 나를 비웃는 사람까지 볼지 알고 싶었다. 그 눈으로 이제 누가 네 죽음을 먼저 썼는지 찾아라."
      - goto: king_warning

  answer_record:
    actions:
      - bg: peony_court
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "누가 제가 죽을 날을 먼저 쓰고, 그 거짓말에 아버지 손까지 빌려 갔어요?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내가 아니다. 하지만 내 도장을 훔쳐 갈 만큼 가까운 자다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "그럼 오늘 저를 죽이면 저 종이가 사실이 되고, 제가 살아 있으면 아버지 도장이 거짓이 되겠네요."
      - say:
          char: 진평왕.weak
          camera: close
          with: [어린 덕만]
          text: "말을 멈추고 손을 펴 보아라. 인주가 손금 안에서 검게 번지고 있다. 이 종이 자체가 너를 죽이려고 놓인 덫이다."
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - say:
          channel: narration
          text: "진평왕이 종이를 걷어 냈지만 이미 늦었습니다. 덕만은 향기 없는 꽃의 뜻을 답하는 대신 독이 밴 기록을 오래 펼쳐 들었고, 손끝의 검은 선은 팔목까지 올라왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 왕실 금지 문서의 독성 인주에 중독되어 사망. 문서와 시신은 즉시 화장함."
      - gameOver:
          title: "운명 — 증거가 된 독"
          message: "사망 기록은 범인을 밝힐 증거처럼 보였지만, 펼쳐 든 사람을 기록대로 죽이는 장치였습니다. 왕의 질문에 답하지 못한 채 종이를 증명하려 한 순간 독이 먼저 사실을 만들었습니다."
          recoverToChoice: c1_answer_king

  answer_literal:
    actions:
      - bg: peony_court
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "모르겠어요. 그림만 보고 어떻게 알아요?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "그래, 모른다고 하면 틀리지는 않겠지. 하지만 오늘은 틀리는 것보다 못 보는 것이 더 위험하다."
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만, 진평왕]
          text: "전하, 문밖에 약탕을 든 아이가 있습니다. 제가 부른 아이가 아닙니다."
      - say:
          channel: narration
          text: "소화가 문으로 뛰었지만 늦었습니다. 시종은 이미 잔을 내려놓고 사라졌고, 방금 전 덕만이 입을 댄 차에서는 씁쓸한 살구씨 냄새가 났습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 급작스러운 열병으로 사망. 독물 흔적 없음."
      - gameOver:
          title: "운명 — 모른 척한 사이"
          message: "왕의 질문은 수수께끼가 아니라 누가 방 안까지 손을 뻗었는지 확인하는 시험이었습니다. 덕만이 위험을 읽지 못한 사이, 왕위를 시기한 귀족이 보낸 독차가 먼저 도착했습니다."

  king_warning:
    actions:
      - camera: medium
      - char: { id: 진평왕, position: center }
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내게 아들이 없자 귀족들은 천명과 너를 서로 다른 편에 세웠다. 너희가 걷기도 전부터 말이다."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "둘 다 살린다면서 왜 언니 곁에서는 제 이름부터 지웠어요?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "둘 다 살리고 싶었다. 그래서 널 숨겼다. 그런데 거짓말이 길어지자 누군가는 정말 네가 없어지면 편하다고 생각하기 시작했어."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그래서 오늘은 종이에 먼저 저를 죽였어요?"
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래. 오늘 밤 널 죽여서 저 기록을 사실로 만들 셈이다. 미안하다, 덕만아. 너무 늦게 알았다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [진평왕, 어린 덕만]
          text: "전하… 서쪽 처마입니다. 비 냄새가 아니라 기름 냄새예요."
      - say:
          char: 진평왕
          camera: close
          with: [소화, 어린 덕만]
          text: "소화, 덕만을 데리고 나가라."
      - goto: fire_breaks

  fire_breaks:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          channel: narration
          camera: medium
          delivery: nervous
          text: "천장이 갈라지는 소리와 함께 불붙은 들보가 방을 둘로 찍었습니다. 친위대는 왕을 안채로 끌고 갔고, 덕만은 소화의 손을 잡은 채 불 반대편에 남았습니다."
      - say:
          channel: narration
          text: "쿵, 쿵, 쿵. 별궁의 세 문이 차례로 닫혔습니다. 연기 너머에서 칠숙이 소매의 재를 털며 걸어 나왔습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "불이 꺼지면 공주께선 열병으로 죽은 겁니다. 살아 있는 얼굴보다 먼저 도착한 기록을, 누가 의심하겠습니까?"
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [칠숙]
          text: "내 이름을 쓴 손이 당신이야?"
      - say:
          char: 칠숙
          camera: close
          with: [어린 덕만]
          text: "해가 뜨면 거짓말도 옥새를 두르고 왕실 기록이 됩니다. 그때쯤이면 자기 이름을 되찾을 입도 재가 되겠지요."
      - char: { id: 소화, position: center, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "아기씨, 숨은 짧게. 허리 숙이고 제 손만 보세요. 말하면 연기를 마십니다."
      - say:
          channel: narration
          text: "소화가 옷깃을 찢어 청동 모란패를 꺼냈습니다. 뜨겁게 달아오른 패가 덕만의 손바닥에 박혔습니다."
      - sticker:
          id: peony_token_view
          image: peony_token_sticker
          x: 49
          y: 31
          width: "clamp(104px, 12%, 180px)"
          anchorX: center
          anchorY: center
          zIndex: 15
          enter: fadeIn
          inputLockMs: 300
      - get: peony_token
      - say:
          char: 소화
          camera: close
          with: [어린 덕만]
          text: "북문에 이걸 보이면 열 겁니다. 하지만 문지기 모두가 아기씨 얼굴을 기억하게 됩니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "제가 손을 놓쳐도 뒤돌아보지 마세요. 하지만 제가 아기씨를 놓으라 말하면, 그 말만은 듣지 마세요."
      - clearSticker:
          id: peony_token_view
          leave: fadeOut
      - choice:
          key: c1_fire_escape
          prompt: "들보가 갈라지고 세 문이 닫힌다. 살아 있는 덕만의 첫 길은?"
          char: 어린 덕만.scared
          camera: close
          with: [소화]
          timeoutMs: 5500
          timeoutOptionIndex: 3
          options:
            - text: "소화의 손을 잡고 배수로로 뛴다"
              when: { var: observed_left_waterway, op: eq, value: true }
              goto: escape_waterway
            - text: "모란패를 치켜들고 북문을 연다"
              add: { nobles_support: 1, fear: 1 }
              goto: escape_north_gate
            - text: "기록을 품고 불길 너머 왕에게 간다"
              when:
                all:
                  - { var: death_register, op: eq, value: true }
                  - { var: spoke_truth_to_king, op: eq, value: true }
              goto: escape_with_record
            - text: "모란 화단에 엎드려 불길을 피한다"
              goto: bad_smoke

  escape_waterway:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          camera: medium
          text: "덕만은 망설이지 않고 왼쪽 담으로 꺾었습니다. 돌판을 걷어 내자 시커먼 물길이 입을 벌렸습니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "먼저 들어가세요! 제가 돌을 잡고 뒤따라가겠습니다."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          text: "또 나만 먼저 보내지 마. 소매 말고 손 줘. 같이 나가."
      - say:
          channel: narration
          text: "두 사람이 진흙 위로 구르자 뒤에서 지붕이 주저앉았습니다. 불티가 빗물 위에 떨어져 짧게 타올랐습니다."
      - say:
          char: 소화
          camera: close
          with: [어린 덕만]
          text: "이제… 어디로 가실 겁니까?"
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          wait: 600
          unskippable: true
          text: "저 안에서는 덕만이 죽었다고 믿을 거야. 그럼 나는 살아서 누가 내 죽음을 먼저 썼는지 찾을 수 있어."
      - say:
          channel: narration
          text: "소화는 국경 상단의 암호를 속삭였습니다. 덕만은 대답 대신 손바닥의 붉은 인주를 빗물에 씻지 않았습니다. 이제부터 붉은 인장의 행로가 두 사람의 길이었습니다."
      - say:
          channel: record
          delivery: calm
          text: "왕실 기록에서 공주는 죽었습니다. 그러나 그날 밤 덕만은 별궁을 빠져나와 살아남았습니다."
      - set: { c1_escape_route: waterway, identity_exposed: false }
      - add: { sohwa_trust: 2, people_support: 1, insight: 1 }
      - goto: /1.yaml

  escape_north_gate:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만이 청동 모란패를 들자 북문 빗장이 반쯤 열렸습니다. 문지기는 패를 확인한 뒤에도 덕만의 얼굴에서 눈을 떼지 않았습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "아기씨, 멈춰요. 문밖에 말이 너무 조용합니다. 경비가 아니라 기다리는 사람들 같아요."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [소화]
          text: "문을 열어 주는 패라면서. 소화, 왜 다시 닫혀?"
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: close
          with: [어린 덕만, 소화]
          text: "왕실 안쪽 패는 주인을 살리는 물건이 아닙니다. 어느 문으로 달아났는지 알려 주는 물건이지요."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "북문 당직 기록 — 화재 중 침입한 신원 미상 여인 둘을 사살함. 왕실 모란패 회수."
      - gameOver:
          title: "운명 — 문을 연 표식"
          message: "모란패는 북문을 열었지만 덕만의 얼굴과 탈출로도 함께 드러냈습니다. 매복하고 있던 칠숙은 문이 닫히자 두 사람을 기록에서 다시 지웠습니다."

  escape_with_record:
    actions:
      - bg: burning_palace
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 밖으로 꺾는 대신 왕의 침전 아래 문서 운반 통로로 뛰었습니다. 불길 속에서 기록을 확인받으면 거짓을 끝낼 수 있다고 믿었지만, 좁은 통로의 바람은 불을 안쪽으로 빨아들였습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "돌아가야 합니다! 저 문은 바깥에서 잠겼고, 불이 우리 뒤를 막고 있어요. 기록을 놓고 제 손을 잡으세요!"
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          text: "이 종이만 아버지께 닿으면 내가 죽었다는 거짓말을 멈출 수 있어. 조금만 더 가면 돼."
      - say:
          channel: narration
          text: "덕만이 잠긴 문에 기록을 밀어 넣는 순간 불탄 서까래가 통로 입구를 덮쳤습니다. 소화는 덕만의 손을 잡았지만, 두 사람에게 남은 공기는 종이 한 장을 태우는 시간보다 짧았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 수습 기록 — 침전 아래 통로에서 둘째 공주 덕만과 유모 소화의 시신 발견. 위조 사망 기록은 전소함."
      - gameOver:
          title: "운명 — 불길 안으로 가져간 증거"
          message: "살아남아야 증거를 쓸 수 있었지만 덕만은 기록을 먼저 왕에게 돌려주려 했습니다. 바깥 퇴로를 버린 두 사람은 잠긴 문과 불길 사이에서 사망 기록보다 먼저 타 버렸습니다."
          recoverToChoice: c1_fire_escape

  bad_smoke:
    actions:
      - bg: burning_palace
      - camera: { shot: close, target: 어린 덕만 }
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만이 모란 화단에 엎드리는 순간, 칠숙이 미리 뿌려 둔 기름이 꽃밭 가장자리에서 푸르게 타올랐습니다. 무너진 들보가 마지막 빈틈까지 막았습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "눈 감지 마세요! 여기, 제 손이에요. 손을 잡아요!"
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [소화]
          text: "어디로 가도… 저 사람들이 먼저 알고 있었어."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 보고 — 열병으로 죽은 둘째 공주 덕만의 시신과 유모 소화가 불에 타 신원을 다시 확인할 수 없음."
      - gameOver:
          title: "운명 — 먼저 준비된 죽음"
          message: "불길 한가운데 머무는 선택은 탈출로가 될 수 없었습니다. 덕만과 소화는 별궁을 빠져나오지 못했고, 칠숙이 준비한 사망 기록은 실제가 되었습니다."
