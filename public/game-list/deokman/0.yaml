script:
  - scene: first_breath

scenes:
  opening_record:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(210px, 28%, 420px)"
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          channel: thought
          with: []
          camera: wide
          when:
            not:
              var: opening_name_read
              op: eq
              value: true
          text: 종이에서 내 이름을 찾았다. 오늘 밤 죽는다고? 나는 아직 여기 있는데.
      - say:
          channel: thought
          with: []
          camera: wide
          when:
            not:
              var: opening_name_read
              op: eq
              value: true
          text: 소화에게 물어봐야겠어. 문밖의 소리도 이상해.
      - clearSticker:
          id: opening_death_register
          leave: fadeOut
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "전하께서 몰래 부르셨어요. 제 옆에 딱 붙으세요. 아는 얼굴이 불러도 먼저 가지 말고요."
      - say:
          char: 어린 덕만
          camera: medium
          with: [소화]
          text: "또 누가 나를 찾는데? 아버지는 숨으라면서 왜 자꾸 불러?"
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "저도 몰라서 무서워요. 제가 손을 놓으라 해도 먼저 제 눈을 보세요."
      - goto: peony_arrives

  peony_arrives:
    actions:
      - say:
          channel: action
          text: 철컥. 내 뒤에서 빗장이 걸린다. 아버지는 아무 말 없이 모란 그림을 편다. 찻잔에서 단내가 난다.
      - sticker:
          id: peony_painting_view
          image: peony_painting_sticker
          x: 50
          'y': 27
          width: clamp(180px, 22%, 360px)
          anchorX: center
          anchorY: center
          rotate: -1.5
          zIndex: 12
          enter: fadeIn
          inputLockMs: 320
      - get: peony_painting
      - char:
          id: 진평왕
          position: center
          enter:
            effect: fadeIn
            layout: push
            duration: 360
      - say:
          char: 진평왕
          camera: medium
          with:
            - 어린 덕만
          text: 예쁘다는 말은 됐다. 있어야 하는데 없는 걸 찾아봐라.
      - choice:
          key: c1_peony_observation
          prompt: 왕이 답을 기다립니다. 덕만은 무엇부터 볼까요?
          char: 어린 덕만
          camera: medium
          with:
            - 진평왕
          options:
            - text: 꽃 사이의 빈자리를 훑는다
              goto: observe_absence
            - text: 족자를 들어 뒤축을 만진다
              goto: observe_back
            - text: 그림을 두고 창과 퇴로를 센다
              set:
                observed_left_waterway: true
              goto: observe_waterway

  observe_absence:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - say:
          char: "어린 덕만.resolve"
          camera: "medium"
          with:
            - "진평왕"
          text: "꽃은 이렇게 많은데 벌도 나비도 없어요. 한 마리도요."
      - say:
          char: "진평왕"
          camera: "medium"
          with:
            - "어린 덕만"
          text: "그림은 잘 봤다. 그렇다면 이 방에는 무엇이 없느냐?"
      - say:
          char: "어린 덕만"
          camera: "medium"
          with:
            - "진평왕"
          text: "문밖에 발소리가 없어요. 시종들이 전부 어디 갔죠?"
      - say:
          channel: action
          text: 찻잔에서 손을 뗀다. 소화가 내 소매를 두 번 당긴다. 눈길이 창 아래로 향한다.
      - add:
          insight: 1
      - say:
          channel: thought
          text: 벌도 없고 나비도 없어. 그런데… 아까 문밖에 있던 사람들은 다 어디 갔지?
          with: []
          camera: wide
          continueLabel: 창 아래로 몸을 낮춘다
      - goto: "observe_waterway"

  observe_back:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - clearSticker:
          id: "peony_painting_view"
          leave: "fadeOut"
      - say:
          channel: action
          text: 족자 뒤에서 종이가 떨어진다. 붉은 도장 자국. 아까 보았던 내 이름이 또 있다.
      - sticker:
          id: "death_register_view"
          image: "death_register_sticker"
          x: 51
          "y": 29
          width: "clamp(150px, 18%, 300px)"
          anchorX: "center"
          anchorY: "center"
          rotate: 2
          zIndex: 14
          enter: "fadeIn"
          inputLockMs: 320
      - get: "death_register"
      - say:
          channel: "record"
          delivery: "deduction"
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - say:
          char: "어린 덕만.scared"
          camera: "medium"
          with:
            - "진평왕"
          text: "아버지 도장인데… 왜 이쪽만 모서리가 깨졌어요?"
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "어린 덕만"
          text: "내 도장은 온전하다. 종이를 소매로 싸라. 네 이름을 지운 손이 아직 궁에 있다."
      - say:
          channel: action
          text: 문밖에서 쇠를 긁는 소리가 난다. 소화가 고개를 젓는다. 종이의 마른 가장자리만 잡아 접는다.
      - clearSticker:
          id: "death_register_view"
          leave: "fadeOut"
      - add:
          evidence: 1
      - say:
          channel: thought
          text: 도장 오른쪽 아래가 비었어. 이 흠, 기억해 두자. 지금은 문에서 떨어져야 해.
          with: []
          camera: wide
          continueLabel: 왕이 가리키는 창으로 간다
      - goto: "observe_waterway"

  observe_waterway:
    actions:
      - set:
          observed_left_waterway: true
      - say:
          camera: wide
          channel: action
          text: 창턱에 뺨을 붙인다. 왼쪽 담 밑, 돌판 하나가 비스듬하다. 틈으로 물이 빠지는 소리가 난다.
      - say:
          char: 어린 덕만
          camera: medium
          with:
            - 진평왕
          text: 왼쪽 담 밑이 열려 있어요. 저라면 기어 나갈 수 있어요.
      - say:
          char: 진평왕
          camera: medium
          with:
            - 어린 덕만
          text: 꽃을 보랬더니 달아날 구멍부터 찾았구나.
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with:
            - 진평왕
          text: 소화가 그랬어요. 누가 궁 안에서 저를 찾고 있다고.
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          'y': 28
          width: clamp(150px, 18%, 300px)
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          char: 진평왕.sad
          camera: medium
          with:
            - 어린 덕만
          text: 잘 봤다. 누군가 내 이름으로 네 죽음을 미리 적어 뒀다.
      - say:
          channel: record
          delivery: deduction
          text: '왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장.'
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - goto: king_question

  king_question:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 어린 덕만, position: left }
      - char: { id: 진평왕, position: center }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래서 묻겠다. 이 꽃에 향기가 있느냐?"
      - choice:
          key: c1_answer_king
          prompt: "진평왕의 시선이 흔들립니다. 무엇을 보여 줄까요?"
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "사라진 벌과 나비를 짚는다"
              set: { spoke_truth_to_king: true }
              goto: answer_scent
            - text: "사망 기록을 왕 앞에 펼친다"
              when: { var: death_register, op: eq, value: true }
              set: { spoke_truth_to_king: true }
              goto: answer_record
            - text: "그림만 보고는 모른다고 버틴다"
              goto: answer_literal

  answer_scent:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "벌도 나비도 없잖아요. 향기가 없나 봐요."
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래. 아들이 없는 내 왕좌도 저 꽃처럼 비었다고 비웃은 게야."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "네가 꽃 뒤에 숨은 뜻까지 보는지 궁금했다. 이제 그 눈으로 네 죽음을 쓴 자를 찾아라."
      - goto: king_warning

  answer_record:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [진평왕]
          text: "누가 제가 죽을 날을 먼저 쓰고, 그 거짓말에 아버지 손까지 빌려 갔어요?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "내가 아니다. 하지만 내 도장을 훔쳐 갈 만큼 가까운 자다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "제가 죽으면 저 종이가 진짜가 되는 거네요."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [어린 덕만]
          text: "손을 펴 봐라. 인주가 검게 번진다. 종이부터 내려놔!"
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - say:
          channel: narration
          text: "진평왕이 종이를 걷어 냈지만 이미 늦었습니다. 덕만은 향기 없는 꽃의 뜻을 답하는 대신 독이 밴 기록을 오래 펼쳐 들었고, 손끝의 검은 선은 팔목까지 올라왔습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 왕실 금지 문서의 독성 인주에 중독되어 사망. 문서와 시신은 즉시 화장함."
      - gameOver:
          title: "운명 — 증거가 된 독"
          message: "사망 기록은 범인을 밝힐 증거처럼 보였지만, 펼쳐 든 사람을 기록대로 죽이는 장치였습니다. 왕의 질문에 답하지 못한 채 종이를 증명하려 한 순간 독이 먼저 사실을 만들었습니다."
          recoverToChoice: c1_answer_king

  answer_literal:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "모르겠어요. 그림만 보고 어떻게 알아요?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "모른다고 하면 틀리진 않겠지. 하지만 오늘은 못 본 대가가 네 목숨이다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만, 진평왕]
          text: "전하, 문밖에 약탕을 든 아이가 있습니다. 제가 부른 아이가 아닙니다."
      - say:
          channel: narration
          text: "소화가 문으로 뛰었지만 늦었습니다. 시종은 이미 잔을 내려놓고 사라졌고, 방금 전 덕만이 입을 댄 차에서는 씁쓸한 살구씨 냄새가 났습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 급작스러운 열병으로 사망. 독물 흔적 없음."
      - gameOver:
          title: "운명 — 모른 척한 사이"
          message: "왕의 질문은 수수께끼가 아니라 누가 방 안까지 손을 뻗었는지 확인하는 시험이었습니다. 덕만이 위험을 읽지 못한 사이, 왕위를 시기한 귀족이 보낸 독차가 먼저 도착했습니다."

  king_warning:
    actions:
      - music: sealed_court
      - char: { id: 진평왕, position: center }
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "내게 아들이 없자 귀족들은 천명과 너를 서로 다른 편에 세웠다. 너희가 걷기도 전부터 말이다."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "둘 다 살린다면서 왜 언니 곁에서는 제 이름부터 지웠어요?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "둘 다 살리고 싶어서 널 숨겼다. 그런데 오래 숨기자, 정말 없애도 된다고 믿는 자가 생겼어."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "그래서 오늘은 종이에 먼저 저를 죽였어요?"
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래. 오늘 밤 저 글을 사실로 만들려 한다. 미안하다, 덕만아. 너무 늦게 봤구나."
      - say:
          char: 소화.nervous
          camera: medium
          with: [진평왕, 어린 덕만]
          text: "전하… 서쪽 처마입니다. 비 냄새가 아니라 기름 냄새예요."
      - say:
          char: 진평왕
          camera: medium
          with: [소화, 어린 덕만]
          text: "소화, 덕만을 데리고 나가라."
      - goto: fire_breaks

  fire_breaks:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - char: { id: 칠숙, position: center, emotion: smile, enter: { effect: fadeIn, layout: push, duration: 360 } }
      - say:
          channel: action
          camera: medium
          text: 머리 위에서 나무가 찢어진다. 뜨거워! 소화의 손을 움켜쥔다. 들보 너머로 아버지가 보이지 않는다.
      - say:
          channel: action
          text: 쿵. 쿵. 쿵. 문 닫히는 소리가 등 뒤를 돈다. 연기 사이에서 칠숙의 얼굴이 드러난다.
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "불이 꺼지면 공주께선 열병으로 죽습니다. 기록이 얼굴보다 먼저 도착할 테니까요."
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [칠숙]
          text: "내 이름을 쓴 손이 당신이야?"
      - say:
          char: 칠숙
          camera: medium
          with: [어린 덕만]
          text: "해가 뜨면 거짓말도 왕실 기록이 됩니다. 따질 입은 재가 되고요."
      - say:
          channel: action
          text: 칠숙의 엄지가 칼집을 민다. 쇠가 짧게 운다. 소화가 내 앞을 막아선다.
      - attack:
          attacker: 칠숙
          target: 소화
          from: right
          style: slash
          image: chilsuk_sword_cutin
          strength: light
          anticipation: 680
          recovery: 740
          caption: "칼집에서 쇠가 긁히는 소리."
      - say:
          channel: action
          wait: 300
          unskippable: true
          text: 찢어진 소매가 눈앞에 떨어진다. 붙잡은 손목이 떨린다. 내 손인지 소화의 손인지 모르겠다.
      - char: { id: 소화, position: center, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "아기씨, 숨은 짧게. 허리 숙이고 제 손만 보세요. 말하면 연기를 마십니다."
      - say:
          channel: action
          text: 소화가 내 손에 모란패를 쥐여 준다. 뜨겁다. 놓치지 않으려고 손가락을 더 세게 접는다.
      - sticker:
          id: peony_token_view
          image: peony_token_sticker
          x: 49
          y: 31
          width: "clamp(104px, 12%, 180px)"
          anchorX: center
          anchorY: center
          zIndex: 15
          enter: fadeIn
          inputLockMs: 300
      - get: peony_token
      - say:
          char: 소화
          camera: medium
          with: [어린 덕만]
          text: "북문에 이걸 보이면 열 겁니다. 하지만 문지기 모두가 아기씨 얼굴을 기억하게 됩니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "손을 놓쳐도 돌아보지 마세요. 제가 놓으라고 하면… 그 말만은 믿지 말고요."
      - clearSticker:
          id: peony_token_view
          leave: fadeOut
      - choice:
          key: c1_fire_escape
          prompt: "들보가 갈라지고 문이 닫힙니다. 어디로 빠져나갈까요?"
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          timeoutMs: 5500
          timeoutOptionIndex: 2
          options:
            - text: "모란패를 치켜들고 북문을 연다"
              add: { nobles_support: 1, fear: 1 }
              goto: escape_north_gate
            - text: "기록을 품고 불길 너머 왕에게 간다"
              when:
                all:
                  - { var: death_register, op: eq, value: true }
                  - { var: spoke_truth_to_king, op: eq, value: true }
              goto: escape_with_record
            - text: "모란 화단에 엎드려 불길을 피한다"
              goto: bad_smoke
            - text: "소화의 손을 잡고 배수로로 뛴다"
              when: { var: observed_left_waterway, op: eq, value: true }
              goto: escape_waterway

  escape_waterway:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right }
      - say:
          channel: action
          camera: medium
          text: 왼쪽 담이다. 돌판 틈에 손을 넣는다. 손톱이 뒤집힐 듯 아프지만, 아래에서 찬바람이 올라온다.
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "먼저 들어가세요! 제가 돌을 잡고 뒤따라가겠습니다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          text: "또 나만 먼저 보내지 마. 소매 말고 손 줘. 같이 나가."
      - say:
          channel: action
          text: 진흙에 무릎이 처박힌다. 뒤에서 지붕이 무너진다. 손은? 아직 소화의 손을 잡고 있다.
      - say:
          char: 소화
          camera: medium
          with: [어린 덕만]
          text: "이제… 어디로 가실 겁니까?"
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          wait: 600
          unskippable: true
          text: "저들은 덕만이 죽었다고 믿을 거야. 나는 살아서, 누가 그 말을 썼는지 찾을래."
      - say:
          channel: thought
          text: 살았어. 그런데 내 이름은 죽었다고 쓰였겠지. 붉은 인장의 행로… 그걸 따라가면 쓴 손을 찾을 수 있을까?
          with: []
          camera: wide
          continueLabel: 소화의 손을 잡고 국경으로 향한다
      - say:
          channel: record
          delivery: calm
          text: "왕실 기록에서 공주는 죽었습니다. 그러나 그날 밤 덕만은 별궁을 빠져나와 살아남았습니다."
      - set: { c1_escape_route: waterway, identity_exposed: false }
      - add: { sohwa_trust: 2, people_support: 1, insight: 1 }
      - goto: /1.yaml

  escape_north_gate:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          camera: wide
          channel: narration
          text: "덕만이 청동 모란패를 들자 북문 빗장이 반쯤 열렸습니다. 문지기는 패를 확인한 뒤에도 덕만의 얼굴에서 눈을 떼지 않았습니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "아기씨, 멈춰요. 문밖에 말이 너무 조용합니다. 경비가 아니라 기다리는 사람들 같아요."
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          text: "문을 열어 주는 패라면서. 소화, 왜 다시 닫혀?"
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "왕실 안쪽 패는 주인을 살리는 물건이 아닙니다. 어느 문으로 달아났는지 알려 주는 물건이지요."
      - say:
          channel: narration
          delivery: nervous
          text: "칠숙이 두 손가락을 내렸습니다. 문 위의 활시위가 팽팽해졌습니다. 소화가 덕만의 어깨를 눌렀지만 등 뒤에는 닫힌 문짝뿐이었습니다."
      - attack:
          attacker: 칠숙
          target: 어린 덕만
          from: right
          style: shot
          image: chilsuk_bow_cutin
          anticipation: 850
          impact: 140
          recovery: 900
          caption: "머리 위에서 활시위가 놓였다."
      - say:
          channel: narration
          delivery: nervous
          wait: 450
          unskippable: true
          text: "문짝이 등 뒤에서 둔하게 울렸습니다. 덕만이 쥐었던 모란패가 돌바닥을 두 번 튕겼습니다. 손을 뻗었지만 손가락은 더 이상 패에 닿지 않았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "북문 당직 기록 — 화재 중 침입한 신원 미상 여인 둘을 사살함. 왕실 모란패 회수."
      - gameOver:
          title: "운명 — 문을 연 표식"
          message: "모란패는 북문을 열었지만 덕만의 얼굴과 탈출로도 함께 드러냈습니다. 매복하고 있던 칠숙은 문이 닫히자 두 사람을 기록에서 다시 지웠습니다."

  escape_with_record:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 밖으로 꺾는 대신 왕의 침전 아래 문서 운반 통로로 뛰었습니다. 불길 속에서 기록을 확인받으면 거짓을 끝낼 수 있다고 믿었지만, 좁은 통로의 바람은 불을 안쪽으로 빨아들였습니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "돌아가야 합니다! 저 문은 바깥에서 잠겼고, 불이 우리 뒤를 막고 있어요. 기록을 놓고 제 손을 잡으세요!"
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          text: "이 종이만 아버지께 닿으면 내가 죽었다는 거짓말을 멈출 수 있어. 조금만 더 가면 돼."
      - say:
          channel: narration
          text: "덕만이 잠긴 문에 기록을 밀어 넣는 순간 불탄 서까래가 통로 입구를 덮쳤습니다. 소화는 덕만의 손을 잡았지만, 두 사람에게 남은 공기는 종이 한 장을 태우는 시간보다 짧았습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 수습 기록 — 침전 아래 통로에서 둘째 공주 덕만과 유모 소화의 시신 발견. 위조 사망 기록은 전소함."
      - gameOver:
          title: "운명 — 불길 안으로 가져간 증거"
          message: "살아남아야 증거를 쓸 수 있었지만 덕만은 기록을 먼저 왕에게 돌려주려 했습니다. 바깥 퇴로를 버린 두 사람은 잠긴 문과 불길 사이에서 사망 기록보다 먼저 타 버렸습니다."
          recoverToChoice: c1_fire_escape

  bad_smoke:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 어린 덕만 }
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만이 모란 화단에 엎드리는 순간, 칠숙이 미리 뿌려 둔 기름이 꽃밭 가장자리에서 푸르게 타올랐습니다. 무너진 들보가 마지막 빈틈까지 막았습니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "눈 감지 마세요! 여기, 제 손이에요. 손을 잡아요!"
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          text: "어디로 가도… 저 사람들이 먼저 알고 있었어."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 보고 — 열병으로 죽은 둘째 공주 덕만의 시신과 유모 소화가 불에 타 신원을 다시 확인할 수 없음."
      - gameOver:
          title: "운명 — 먼저 준비된 죽음"
          message: "불길 한가운데 머무는 선택은 탈출로가 될 수 없었습니다. 덕만과 소화는 별궁을 빠져나오지 못했고, 칠숙이 준비한 사망 기록은 실제가 되었습니다."

  first_room_look:
    actions:
      - choice:
          key: first_room_look
          presentation: explore
          prompt: 내 이름이 적힌 종이. 문밖에서는 쇠 긁는 소리.
          with: []
          camera: wide
          options:
            - text: 종이의 내 이름
              at:
                x: 28
                "y": 40
              when:
                not:
                  var: opening_name_read
                  op: eq
                  value: true
              goto: first_read_name
            - text: 닫힌 문
              at:
                x: 74
                "y": 68
              when:
                not:
                  var: opening_door_heard
                  op: eq
                  value: true
              goto: first_hear_door
            - text: 소화에게 종이를 가리킨다
              when:
                var: opening_name_read
                op: eq
                value: true
              goto: opening_record


  first_read_name:
    actions:
      - say:
          channel: record
          with: []
          camera: wide
          text: '둘째 공주 덕만. 사망: 오늘 밤.'
      - say:
          channel: thought
          with: []
          text: 오늘 밤? 나는 여기 있는데. 아직 손도 따뜻한데… 누가 이걸 쓴 거야?
      - set:
          opening_name_read: true
      - goto: first_room_look

  first_hear_door:
    actions:
      - say:
          channel: action
          with: []
          text: 문틈에 귀를 댄다. 발소리가 멎는다. 바깥에서 고리를 거는 소리가 아주 가까이 들린다.
      - say:
          channel: thought
          with: []
          text: 들어오려는 소리가 아니야. 우리를 못 나가게 하는 건가?
      - set:
          opening_door_heard: true
      - goto: first_room_look

  first_breath:
    actions:
      - bg:
          id: peony_court
          transition: dissolve
          duration: 720
      - music: sealed_court
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          'y': 28
          width: clamp(210px, 28%, 420px)
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          camera: wide
          channel: action
          wait: 600
          unskippable: true
          text: 촛불이 흔들린다. 펼쳐진 종이에서 내 이름이 눈에 걸린다. 그 옆의 두 글자는…
          with: []
      - goto: first_room_look
