script:
  - scene: prologue_open
  - scene: prologue_end

scenes:
  prologue_open:
    actions:
      - bg: title_palace
      - camera: wide
      - effect: moonveil
      - say:
          delivery: calm
          wait: 800
          text: "서장 — 비어 버린 곡식길"
      - say:
          delivery: calm
          text: "역사에 남은 인물과 사건 위에 상상을 보탠 이야기입니다."
      - say:
          delivery: calm
          text: "서기 631년 늦봄, 진평왕 53년이었습니다."
      - say:
          delivery: calm
          text: "비가 오지 않은 들판을 지나, 세 마을의 대표가 빈 곡식 자루를 들고 월성에 들어왔습니다."
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          with: [진평왕, 덕만, 칠숙]
          text: "진평왕 앞에는 제사에 쓸 곡식 목록과 구휼 수레가 사라졌다는 청원서가 나란히 놓였습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "덕만, 청원서를 읽어라. 한 글자도 줄이지 마라."
      - say:
          char: 덕만.sad
          camera: medium
          with: [진평왕]
          text: "왕실 도장이 찍힌 수레를 사흘째 기다렸으나, 길에서는 빈 수레 한 대도 보지 못했다고 합니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "장마가 늦어 길이 험해졌을 뿐입니다. 내일 제사를 마친 뒤 살펴도 늦지 않습니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "굶는 사람에게 내일은 늦다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "제사 곡식부터 풀어라. 사라진 수레의 문서도 오늘 안에 가져와라."
      - say:
          char: 칠숙.smile
          camera: close
          with: [진평왕]
          text: "왕실 창고만 열어서는 모자랍니다. 귀족 창고를 건드리면 그 집 군사들이 움직일 것입니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          wait: 850
          unskippable: true
          text: "<speed=18>움직이게 두어라. 누가 굶는 사람보다 제 창고를 먼저 지키는지 보겠다.</speed>"
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "전하, 먼저 곡식을 보내고 그 수레를 따라가면 사라진 길도 찾을 수 있습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "말을 꺼냈으면 끝까지 책임질 방도를 내놓아라."
      - choice:
          key: c0_relief
          prompt: "굶주린 마을에 오늘 무엇을 보내겠습니까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "왕실 곡식을 먼저 보낸다"
              add: { legitimacy: 1, people_support: 1 }
              goto: relief_royal
            - text: "수레 장부부터 대조한다"
              add: { insight: 1 }
              goto: relief_audit
            - text: "귀족의 자원을 기다린다"
              goto: go_01_empty_village
            - text: "창고를 밤에 강제로 연다"
              goto: go_02_granary_battle

  relief_royal:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 제사 목록에서 곡식 수레 세 대를 지우고, 유신에게 마을까지 호위하라고 맡겼습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "오늘 밤 출발하면 내일 해가 높기 전에 첫 마을에 닿습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "빈 수레가 돌아오면 바퀴의 흙까지 살펴 주세요. 어느 길을 지났는지 알아야 합니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "곡식과 증거를 함께 가져오겠습니다."
      - goto: late_family_meal

  relief_audit:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "덕만은 새 곡식을 내보내는 동안, 비담에게 지난달 수레 문서를 한곳에 모으게 했습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "종이에는 수레가 다섯 번 떠났고, 성문 기록에는 세 번만 나갔다고 적혀 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "나가지 않은 두 수레의 곡식값이 어디로 갔는지 찾으세요."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "길보다 돈을 먼저 따라가라는 말씀이군요. 그 길은 대개 사람의 방까지 이어집니다."
      - goto: late_family_meal

  late_family_meal:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 진평왕, position: center }
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          delivery: calm
          text: "그날 밤, 마지막 곡식 수레가 궁문을 나간 뒤에야 세 사람의 늦은 저녁상이 놓였습니다."
      - say:
          char: 천명
          camera: medium
          with: [진평왕, 덕만]
          text: "아버지, 국을 세 번 데웠어요. 한 번 더 데우면 죽이 됩니다."
      - say:
          char: 진평왕
          camera: close
          with: [천명]
          text: "수레는 모두 떠났느냐?"
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "예. 첫 수레가 서쪽 궁문을 지났습니다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "이제 숟가락을 드셔도 됩니다."
      - say:
          char: 천명
          camera: medium
          with: [진평왕, 덕만]
          text: "왕에게 밥을 먹으라는 딸이 둘이나 있으니, 신라는 참 든든하겠네요."
      - say:
          char: 진평왕
          camera: close
          with: [천명, 덕만]
          text: "내가 왕좌에서 내려오면 둘부터 벌해야겠구나."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그날까지는 국이 식기 전에 드세요."
      - say:
          with: [진평왕, 덕만, 천명]
          text: "진평왕이 마침내 숟가락을 들자 천명이 덕만에게 눈을 찡긋했습니다. 잠깐이나마 세 사람은 왕과 공주가 아니라 한 식구처럼 웃었습니다."
      - say:
          with: [진평왕, 덕만, 천명]
          wait: 650
          text: "웃음 끝에 진평왕이 길게 기침했습니다. 천명은 약방에서 내일 제사 전에 올릴 새 약재가 왔다며 먼저 확인하겠다고 말했습니다."
      - say:
          char: 진평왕
          camera: close
          with: [천명]
          text: "그래. 네 눈을 거친 뒤 가져오너라."
      - goto: night_corridor

  night_corridor:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: focus
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          delivery: calm
          text: "같은 날 밤, 출발 준비를 마친 빈 수레 한 대가 서쪽 궁문으로 돌아왔습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "공주님, 바퀴에 진흙은 없고 창고에서 쓰는 붉은 끈만 묶여 있어요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "길을 다녀온 수레가 아니야. 궁 안에서 곡식만 내린 거야."
      - say:
          with: [덕만, 소원]
          wait: 650
          text: "소원이 끈을 풀자 손끝에 검은 가루가 얇게 묻었습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [소원]
          text: "만지지 마. 천으로 감싸서 월명에게 가져가."
      - char: { id: 칠숙, position: right }
      - char: { id: 아진, position: center }
      - say:
          with: [칠숙, 아진]
          wait: 700
          text: "맞은편 문이 열리며 칠숙과 아진의 목소리가 복도에 낮게 번졌습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [아진]
          text: "왕이 장부를 펴기 전에 약이 먼저 들어가야 한다."
      - say:
          char: 아진.nervous
          camera: close
          with: [칠숙]
          text: "약을 올리는 사람까지 죽이면 입을 막을 수 없습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [아진]
          text: "살아 있는 입은 다른 말을 한다. 죽은 입은 우리가 대신 말할 수 있지."
      - say:
          char: 아진.nervous
          camera: close
          with: [칠숙]
          text: "제 동생은 약속대로 돌려보내 주십시오."
      - say:
          char: 칠숙
          camera: medium
          with: [아진]
          text: "내일 왕이 첫 숟가락을 뜨면 돌려보내겠다."
      - char: { id: 소원, position: right }
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "전하께 바로 가야 해요. 하지만 저 사람들이 궁문을 먼저 막을지도 몰라요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "경고가 늦으면 아버지가 죽고, 소문이 먼저 나면 범인이 숨을 거야."
      - choice:
          key: c0_warning
          prompt: "연회 전에 누구에게 먼저 알리겠습니까?"
          char: 덕만
          camera: close
          with: [소원]
          options:
            - text: "왕께 직접 보고한다"
              add: { legitimacy: 1, insight: 1 }
              goto: warning_king
            - text: "유신에게 약방을 맡긴다"
              add: { yushin_trust: 1, power: 1 }
              goto: warning_yushin
            - text: "천명에게 잔을 지키게 한다"
              add: { cheonmyeong_trust: 1 }
              goto: warning_sister
            - text: "칠숙을 지금 붙잡는다"
              goto: go_03_missing_order

  warning_king:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "전하, 내일 약에 손을 댈 자가 있습니다. 칠숙의 말을 직접 들었습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "들은 말과 본 물건을 나누어 말하라."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "검은 가루가 묻은 수레 끈을 월명에게 보냈습니다. 약을 올리는 사람도 노리고 있습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "좋다. 연회는 그대로 연다. 놈들이 손을 내밀게 두고 그 손을 잡는다."
      - goto: banquet_cup

  warning_yushin:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "약방 문과 연회장 문을 함께 지키겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "칼을 먼저 뽑지 마세요. 약을 바꾸는 손과 명령을 받는 사람이 모두 보여야 합니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "사람을 잡기 전에 길부터 막겠습니다."
      - goto: banquet_cup

  warning_sister:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "아버지 잔만 보고 있으면 되는 거지? 무서워도 눈은 떼지 않을게."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니가 신호하면 내가 움직일게. 혼자 막으려 하진 마."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "그 말, 너도 지켜."
      - goto: banquet_cup

  banquet_cup:
    actions:
      - bg: banquet_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          delivery: calm
          text: "다음 날 연회는 취소되지 않았습니다. 빈 곡식 자루 세 개가 화려한 상 앞에 놓였습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "먹기 전에 보고부터 받아라. 구휼 수레는 출발했느냐?"
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "첫 수레는 동문을 지났습니다. 나머지 두 대도 해 지기 전에 떠납니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [진평왕]
          text: "전하, 약이 식겠습니다."
      - say:
          with: [진평왕, 덕만, 칠숙]
          wait: 750
          text: "시종이 약그릇을 들었습니다. 은빛 숟가락의 목 부분에 검은 점 하나가 붙어 있었습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [진평왕]
          text: "전하, 손대지 마십시오."
      - choice:
          key: c0_cup
          prompt: "왕의 손이 약숟가락에 닿으려 합니다."
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "월명을 불러 확인한다"
              add: { insight: 1 }
              goto: cup_physician
            - text: "소매로 약상을 밀어낸다"
              add: { power: 1, suspicion: 1 }
              goto: cup_swept
            - text: "천명의 그릇과 바꾼다"
              goto: go_04_sisters_cup
            - text: "대신 약을 삼킨다"
              goto: go_05_black_breath

  cup_physician:
    actions:
      - bg: banquet_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - char: { id: 진평왕, position: center }
      - say:
          char: 월명.warning
          camera: close
          with: [덕만, 진평왕]
          text: "숟가락을 내려놓으십시오. 냄새는 약재와 비슷하지만 혀를 마비시키는 독입니다."
      - say:
          char: 진평왕
          camera: close
          with: [월명]
          text: "그릇과 숟가락을 따로 봉하라. 만진 사람도 내 앞에 세워라."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "수레 끈에 묻은 가루와 같은지 대조해 주십시오."
      - goto: frame_reveal

  cup_swept:
    actions:
      - bg: banquet_hall
      - camera: medium
      - effect: { name: impact, wait: true }
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right }
      - char: { id: 칠숙, position: center }
      - say:
          with: [덕만, 진평왕, 칠숙]
          wait: 700
          text: "덕만이 약상을 밀어내자 그릇이 깨지고 검은 물방울이 소매에 튀었습니다."
      - say:
          char: 칠숙.angry
          camera: close
          with: [덕만]
          text: "왕의 약을 엎고도 손을 숨기십니까?"
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "숨기지 않습니다. 이 소매까지 증거로 내놓겠습니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "칠숙, 판결을 서두르지 마라. 아직 내가 묻지 않았다."
      - goto: frame_reveal

  frame_reveal:
    actions:
      - bg: banquet_hall
      - camera: medium
      - effect: focus
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          with: [진평왕, 덕만, 칠숙]
          text: "연회장 밖에서 둔탁한 소리가 났습니다. 사라진 수레를 맡았던 관리가 문턱에 쓰러졌습니다."
      - say:
          char: 덕만.sad
          camera: medium
          with: [진평왕]
          text: "저 사람이 청원서를 들고 온 관리입니다."
      - say:
          with: [진평왕, 덕만, 칠숙]
          wait: 800
          text: "관리의 품에서는 덕만의 인장이 찍힌 약 포장지와 검은 가루가 든 종이가 나왔습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 진평왕]
          text: "독도, 인장도, 약을 엎은 사람도 모두 한곳을 가리킵니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "누군가 제 인장을 본떠 저 사람에게 쥐여 줬습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "주장으로는 모자란다. 증거를 가져와라."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만, 칠숙]
          text: "지금부터 궁문을 닫는다. 약과 장부에 손댄 자는 누구도 나가지 못한다."
      - get: black_powder
      - set: { clue_black_powder: true }
      - add: { legitimacy: 1 }
      - say:
          with: [진평왕, 덕만]
          text: "진평왕은 검은 가루를 봉한 상자를 덕만 앞에 내려놓게 했습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          wait: 950
          unskippable: true
          text: "<speed=18>네가 내 딸인 것과 죄인을 정하는 일은 다르다. 숨지 마라. 판결은 내가 한다.</speed>"
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "사흘 안에 누가 제 이름으로 아버지를 죽이려 했는지 밝히겠습니다."
      - goto: prologue_end

  prologue_end:
    actions:
      - bg: moon_court
      - camera: wide
      - effect: darken
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          delivery: calm
          text: "그날 밤, 월성의 모든 문이 닫혔습니다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "아버지는 살았는데, 이제 모두가 너를 보고 있어."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "그래서 도망치지 않을 거야. 저들이 내 이름을 썼다면, 난 내 목소리로 되찾을게."
      - say:
          with: [덕만, 천명]
          wait: 900
          text: "문밖에는 죽은 관리가 지키지 못한 빈 곡식 자루가 그대로 놓여 있었습니다."

  go_01_empty_village:
    actions:
      - bg: village
      - camera: wide
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "덕만은 귀족들이 곡식을 모을 때까지 기다리자고 말했습니다."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "공주님, 약속한 집들이 오늘도 창고 문을 열지 않았어요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "그 약속을 믿느라 수레를 하루 늦췄구나."
      - effect: { name: darken, wait: true }
      - say:
          text: "수레가 도착했을 때 첫 마을에는 곡식을 받을 사람이 남지 않았습니다."
      - gameOver:
          title: "운명 01 — 하루 늦은 곡식"
          message: "귀족들의 약속을 기다린 하루 동안 굶주린 사람들은 마을을 떠났고, 길에서 쓰러졌습니다."

  go_02_granary_battle:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - effect: pulse
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만]
          text: "사병들이 창고 문 안쪽에서 활을 겨누고 있습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "왕명을 거부한 자들입니다. 문을 여세요."
      - effect: impact
      - say:
          with: [덕만, 유신]
          text: "문이 부서지자 같은 신라의 군사들이 어둠 속에서 서로에게 칼을 휘둘렀습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "곡식 자루보다 시신이 먼저 밖으로 나옵니다."
      - gameOver:
          title: "운명 02 — 피로 열린 창고"
          message: "증거와 준비 없이 창고를 공격한 밤, 구휼 곡식은 내전의 군량이 되었습니다."

  go_03_missing_order:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: right }
      - say:
          char: 덕만.angry
          camera: close
          with: [칠숙]
          text: "왕의 약에 손대려 한 말을 들었습니다. 지금 저와 함께 전하께 가시죠."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "증인도 물건도 없이 제 방에 들어오셨군요."
      - say:
          with: [덕만, 칠숙]
          text: "등 뒤에서 문이 닫혔고, 복도에 있던 아진의 발소리가 멀어졌습니다."
      - effect: darken
      - say:
          char: 칠숙
          camera: close
          with: [덕만]
          text: "내일은 공주께서 왕의 약을 훔치다 달아났다고 말하겠습니다."
      - gameOver:
          title: "운명 03 — 증인 없는 고발"
          message: "덕만은 증거를 남기지 못한 채 갇혔고, 칠숙은 그의 침묵을 도주로 바꾸어 말했습니다."

  go_04_sisters_cup:
    actions:
      - bg: banquet_hall
      - camera: reaction
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          with: [덕만, 천명]
          text: "덕만은 왕의 약그릇을 천명의 빈 그릇과 바꾸었습니다."
      - say:
          char: 천명.nervous
          camera: close
          with: [덕만]
          text: "덕만아, 왜 내 그릇에서 쓴 냄새가 나지?"
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "언니, 삼키지 마. 지금 뱉어."
      - effect: { name: darken, wait: true }
      - say:
          text: "천명의 손에서 그릇이 떨어졌지만, 독은 이미 목을 지나간 뒤였습니다."
      - gameOver:
          title: "운명 04 — 바뀐 그릇"
          message: "왕을 살리려고 옮긴 독은 천명에게 닿았습니다. 덕만은 평생 그 선택을 판결하지 못했습니다."

  go_05_black_breath:
    actions:
      - bg: banquet_hall
      - camera: close
      - char: { id: 덕만, position: left }
      - char: { id: 진평왕, position: right }
      - say:
          with: [덕만, 진평왕]
          text: "덕만은 왕의 손에서 약그릇을 빼앗아 단숨에 삼켰습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "뱉어라. 지금 당장 뱉어라!"
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "아버지가 살아야…… 다음 명령을……"
      - effect: { name: darken, wait: true }
      - say:
          text: "덕만은 말을 끝내지 못했습니다. 진평왕은 딸을 안은 채 누구에게도 약상을 치우지 못하게 했습니다."
      - gameOver:
          title: "운명 05 — 대신 마신 독"
          message: "덕만은 왕을 살렸지만 자신이 본 음모를 증언하지 못했습니다. 독살을 꾸민 자들은 다시 약을 준비했습니다."
