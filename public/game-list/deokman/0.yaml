script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: title_palace
      - camera: wide
      - effect: moonveil
      - say:
          delivery: calm
          text: "서장 — 왕관에는 주인이 없다"
      - say:
          delivery: calm
          text: "이 작품은 역사에 남은 인물과 사건 위에 상상을 더한 이야기입니다."
      - say:
          delivery: calm
          text: "서기 631년 늦봄, 진평왕 53년."
      - say:
          delivery: calm
          text: "왕실 제사와 연회를 하루 앞둔 오후. 비가 신라의 수도 월성을 적셨습니다."
      - say:
          delivery: calm
          text: "진평왕에게는 두 딸뿐이었습니다."
      - say:
          delivery: calm
          text: "신라의 왕좌에는 아직 여자 이름이 오른 적이 없었습니다."
      - bg: throne_hall
      - camera: wide
      - effect: focus
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: center
      - say:
          with:
            - 진평왕
            - 덕만
            - 칠숙
          delivery: calm
          text: "왕좌전의 낮은 탁자에는 왕실 제사 순서와 굶주린 세 마을의 글이 함께 놓여 있었습니다."
      - say:
          with:
            - 칠숙
            - 덕만
          text: "칠숙은 굶주린 사람들의 글보다 먼저, 비어 있는 왕자의 자리를 가리켰습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "전하. 왕자께서 설 자리가 비었습니다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 칠숙
          text: "내게 왕자는 없다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "그러니 비워 두셔야 합니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "빈자리인데, 왜 제 이름부터 지우십니까?"
      - char:
          id: 천명
          position: center
      - say:
          char: 천명
          camera: medium
          with:
            - 덕만
          text: "덕만아. 오늘은 참아."
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          text: "언니는 참을 수 있어?"
      - say:
          char: 진평왕
          camera: wide
          with:
            - 덕만
            - 천명
          text: "둘 다 내 딸이다. 내 곁에 앉아라."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "공주가 왕의 자리에 익숙해지겠군요."
      - say:
          char: 진평왕
          camera: close
          with:
            - 칠숙
          text: "백성도 익숙해지겠지."
      - say:
          camera: wide
          with:
            - 진평왕
            - 덕만
            - 칠숙
          text: "문이 벌컥 열렸습니다. 비에 젖은 관리가 바닥에 엎드렸습니다."
      - say:
          char: 진평왕
          camera: wide
          with:
            - 덕만
            - 칠숙
          text: "무슨 일인가?"
      - say:
          camera: wide
          with:
            - 진평왕
            - 덕만
            - 칠숙
          text: "관리가 내민 젖은 청원서에는 세 마을의 이름이 적혀 있었습니다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "덕만아. 읽어라."
      - say:
          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "사흘째 곡식이 오지 않았습니다."
      - say:
          char: 칠숙
          camera: medium
          with:
            - 덕만
          text: "내일은 왕실 제사입니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "굶는 데도 날을 가립니까?"
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "네가 왕이라면?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "창고를 열겠습니다. 오늘 바로요."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
          text: "왕실 곡식을 공주 말 한마디로 풉니까?"
      - say:
          char: 진평왕
          camera: close
          with:
            - 칠숙
          text: "아니다. 왕이 허락한다."
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "아버지……."
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 덕만
          text: "이제 모두 공주를 왕처럼 보겠군요."
      - bg: moon_court
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 천명
          position: right
      - say:
          with:
            - 덕만
            - 천명
          text: "왕좌전을 나온 두 자매는 한동안 말이 없었습니다."
      - say:
          char: 천명
          camera: medium
          with:
            - 덕만
          text: "또 아버지 답까지 먼저 해 버렸네."
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          text: "틀렸어?"
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          text: "아니. 그래서 무서워."
      - char:
          id: 유신
          position: center
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "내일 연회 경비가 바뀌었습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "누가 바꿨지요?"
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "칠숙공입니다. 왕의 곁을 비우지 마십시오."
      - bg: shadow_corridor
      - camera: wide
      - effect: moonveil
      - char:
          id: 덕만
          position: center
      - say:
          with:
            - 덕만
          delivery: calm
          text: "631년 늦봄, 같은 날 밤."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "덕만은 세 마을의 글을 품고 왕의 방으로 향했습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "등불 하나가 꺼졌습니다."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "그다음 불도 꺼졌습니다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "……누가 오고 있어."
      - say:
          camera: wide
          with: []
          delivery: whisper
          text: "덕만은 기둥 뒤로 숨었습니다."
          wait: 550
      - char:
          id: 칠숙
          position: right
      - char:
          id: 아진
          position: left
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 아진
          text: "내일, 왕은 두 번째 잔에서 쓰러집니다."
          wait: 700
      - say:
          char: 아진
          camera: medium
          with:
            - 칠숙
          delivery: neutral
          text: "공주는 왕의 열두 걸음 뒤에 섭니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 아진
          text: "아버지에게 닿기 전에 막으십시오."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 칠숙
          text: "죽입니까?"
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 아진
          text: "<speed=19>살아 있으면 왕이 됩니다.</speed>"
      - say:
          camera:
            shot: reaction
            target: 덕만
          with:
            - 덕만
          delivery: whisper
          text: "덕만은 숨을 죽였습니다."
          wait: 450
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "발밑에서 마른 대나무가 부러졌습니다."
          wait: 650
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "발소리가 덕만이 숨은 기둥으로 다가왔습니다."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "아버지께 돌아가야 해."
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          camera: close
          with: []
          prompt: "대나무가 꺾였다. 발소리가 온다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          with:
            - 덕만
            - 아진
            - 칠숙
          text: "덕만은 기둥 밖으로 걸어 나왔습니다."
      - say:
          char: 덕만
          camera: wide
          with:
            - 아진
            - 칠숙
          delivery: nervous
          text: "길을 잃었습니다."
      - say:
          char: 아진
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "제 손은 왜 보십니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 아진
          text: "칼을 잡고 계시니까요."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "오늘 밤은 잊으십시오."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "호위가 오려면 일곱 번 숨을 쉽니다."
      - say:
          char: 덕만.angry
          camera: close
          with:
            - 아진
          delivery: angry
          text: "벌써 둘. 다섯이면 충분해."
      - say:
          char: 아진.nervous
          camera: medium
          with:
            - 덕만
          delivery: neutral
          text: "다음에도 다섯 번이 남을까요?"
      - say:
          with:
            - 덕만
            - 아진
          text: "아진의 손목에 붉은 매듭이 보였습니다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - say:
          with:
            - 덕만
          text: "덕만은 방문을 걸어 잠갔습니다."
      - say:
          with:
            - 덕만
          text: "언니의 비녀와 유신의 호각을 꺼냈습니다."
      - say:
          char: 덕만
          camera: medium
          with: []
          text: "아버지께 말하면 연회는 멈춰."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "그러면 놈들은 흔적을 지우겠지."
      - say:
          char: 덕만
          camera: close
          delivery: whisper
          text: "혼자 막으면 모두 죽어."
      - say:
          char: 덕만
          camera: close
          delivery: whisper
          text: "한 사람은 믿어야 해."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "누구를 부르든 그 사람도 표적이 돼."
      - say:
          char: 덕만
          camera: close
          with: []
          delivery: whisper
          text: "그래도 혼자서는 못 막아."
      - choice:
          key: p_warn
          prompt: "동트기 전, 누구를 믿을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          delivery: sad
          text: "왜 이제 말해?"
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          delivery: sad
          text: "다친 데부터 보여 줘."
      - say:
          char: 덕만
          camera: close
          with:
            - 천명
          delivery: whisper
          text: "안 다쳤어. 아버지 곁에 있어 줘."
      - say:
          char: 천명.sad
          camera: medium
          with:
            - 덕만
          text: "이번엔 괜찮은 척하지 마."
      - say:
          char: 천명.sad
          camera: close
          with:
            - 덕만
          text: "무섭다고 해. 나도 같이 무서울게."
      - say:
          char: 덕만
          camera: medium
          with:
            - 천명
          delivery: whisper
          text: "……무서워. 아버지 손을 놓지 마."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "명단은 열셋입니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "하나는 죽은 자, 하나는 갓난아이입니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "우릴 엉뚱한 곳으로 보낼 미끼군요."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "예. 의심할 사람까지 골라 놨습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 유신
          text: "열셋 말고, 쓴 사람을 찾으세요."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "연회 전까지 찾겠습니다."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - camera: wide
      - effect: embers
      - say:
          delivery: calm
          text: "이튿날 아침. 왕실 연회가 시작됐습니다."
          wait: 450
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: wide
          with:
            - 진평왕
            - 덕만
          text: "두 번째 잔은 제가 올리겠습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "공주께선 밤길을 찾으셨습니까?"
      - say:
          char: 덕만
          camera: medium
          with:
            - 칠숙
          text: "덕분에요."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "술병이 바뀔 때마다 세시던데."
      - say:
          char: 칠숙.smile
          camera: close
          with:
            - 덕만
          text: "몇까지 보셨습니까?"
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "둘."
      - say:
          char: 진평왕
          camera: wide
          with:
            - 덕만
          text: "덕만아. 내게 할 말이 있느냐?"
          wait: 600
      - say:
          char: 덕만
          camera: medium
          with:
            - 진평왕
          text: "아직은요."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "내가 널 믿으면 되느냐?"
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          delivery: nervous
          text: "이번 한 번만 제 눈을 믿어 주세요."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
          text: "<speed=20>믿는다. 위험하면 내 손을 잡아라.</speed>"
      - say:
          with:
            - 덕만
            - 진평왕
          text: "왕의 손이 두 번째 잔을 들었습니다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          delivery: whisper
          text: "지금 막지 못하면 끝이야."
      - choice:
          key: p_cup
          prompt: "왕이 두 번째 잔을 든다."
          char: 덕만
          camera: close
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          text: "공주께서 왕의 상을 엎으셨군요."
      - say:
          char: 덕만.angry
          camera: medium
          text: "상은 다시 차리면 됩니다."
      - say:
          char: 덕만.angry
          camera: close
          with:
