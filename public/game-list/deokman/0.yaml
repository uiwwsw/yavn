script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: throne_hall
      - effect: focus
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          with:
            - 진평왕
            - 덕만
          delivery: calm
          text: "연회 전날 · 저녁 식사 뒤. 진평왕은 꿀 묻힌 누룽지 한 조각을 접시 가장자리에 남겼습니다. 덕만이 어릴 때부터 가장 좋아하던 것이었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "또 남기셨어요? 의원은 단것부터 줄이라고 했지, 아버지 몫을 전부 딸에게 주라고 하진 않았습니다."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "네가 좋아하니 남겨 둔 것이다. 그리고 벌이 아니라 네 생각이 듣고 싶구나. 이 부탁 글을 읽어 보아라. 남쪽 둑을 어디부터 고치면 좋겠느냐?"
      - char:
          id: 천명
          position: center
          framing: full
      - say:
          char: 천명
          framing: bust
          with:
            - 진평왕
            - 덕만
          text: "아버지는 덕만에게 벌을 내릴 때마다 붓을 주시네요. 저는 어릴 때 무릎부터 꿇었는데."
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
            - 천명
          text: "언니가 누룽지를 먼저 훔쳐 먹었으니까요. 둑은 아래부터 막아야 해요. 위를 먼저 고치면 첫비에 아랫마을이 잠깁니다."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "<speed=22>그럼 네 글씨로 써라. 네 답이 마음에 든다.</speed> <speed=20>내일 연회에서도 내 곁에 앉아라. 나는 네가 무엇을 보는지 자랑하고 싶구나.</speed>"
      - say:
          char: 천명
          framing: bust
          with:
            - 진평왕
            - 덕만
          text: "둑 이야기는 끝났어요? 그럼 마지막 누룽지는 제 겁니까?"
      - say:
          char: 진평왕
          framing: bust
          with:
            - 천명
          text: "이미 덕만 접시로 갔구나. 아비가 내일은 두 조각 남기마."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          text: "오늘 건 반 나눠 먹어요. 대신 꿀 많이 묻은 쪽은 제 거예요."
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          with:
            - 진평왕
            - 덕만
            - 칠숙
          text: "귀족들의 앞자리에 서는 이찬 칠숙이 들어왔습니다. 그는 인사보다 먼저 덕만이 쓴 답안과 왕 옆의 빈자리를 번갈아 보았습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 진평왕
            - 덕만
          text: "전하께 아들이 없는 지금, 귀족 회의는 공주가 나라 문서에 답을 쓰는 모습을 ‘다음 왕으로 키운다’는 뜻으로 봅니다. 저는 여자가 왕이 되는 꼴을 보고 싶지 않습니다."
      - say:
          char: 진평왕
          framing: closeup
          with:
            - 덕만
            - 칠숙
          text: "그렇다면 똑똑히 보라고 하게. 내 딸은 백성이 사는 마을부터 걱정했다. 나는 그런 딸이 자랑스럽다."
      - say:
          char: 칠숙.smile
          framing: closeup
          with:
            - 덕만
          text: "<speed=22>그 사랑이 나라의 순서를 망칠 겁니다.</speed> <speed=20>전하도 공주도 제 뜻을 막는다면, 저는 두 분 모두 치우겠습니다.</speed>"
      - bg: shadow_corridor
      - effect: moonveil
      - char:
          id: 덕만
          position: center
          framing: full
      - say:
          with:
            - 덕만
          delivery: calm
          text: "같은 밤 · 모두 잠든 한밤중. 덕만은 자신이 고쳐 쓴 부탁 글을 아버지 방에 돌려놓으려 서쪽 회랑을 건넜습니다. 종이 끝에는 진평왕이 덧붙인 짧은 글씨가 남아 있었습니다. ‘내 딸의 답대로 하라.’"
      - say:
          with:
            - 덕만
          delivery: calm
          text: "비가 처마를 때렸습니다. 덕만이 서쪽 회랑에 들어서자 세 번째 등불이 꺼졌습니다. 앞의 두 등불과 똑같은 간격이었습니다."
      - say:
          char: 덕만
          framing: closeup
          with: []
          delivery: whisper
          text: "……바람이 아니야. 누가 내가 오는 쪽부터 불을 죽이고 있어."
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "덕만은 가장 굵은 기둥 뒤로 몸을 붙였습니다. 조금 전 아버지 앞에서 웃던 칠숙의 목소리가, 불 꺼진 회랑 너머에서 들렸습니다."
          wait: 550
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 아진
          position: left
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "<speed=20>내일 해가 막 오른 아침, 왕이 두 번째 잔을 들면 시작하십시오.</speed>"
          wait: 700
      - say:
          char: 아진
          framing: bust
          with:
            - 칠숙
          delivery: neutral
          text: "왕이 쓰러지면 호위가 공주에게 닿기까지 열두 걸음입니다. 그 전에 끝내겠습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "천명공주는 이미 남편의 집안에 묶여 있습니다. 하지만 덕만공주는 영리하고 사람들의 마음을 얻고 있지요. 남자 왕을 세우려면 덕만공주부터 없애야 합니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "왕만 죽이고 공주를 놓치지 마십시오. 나는 덕만이 왕이 되는 모습을 절대 보지 않을 겁니다."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 칠숙
          delivery: neutral
          text: "……알겠습니다."
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "덕만은 소매로 입을 막았습니다. 열두 걸음. 그 거리를 머릿속으로 재는 순간, 발뒤꿈치 아래의 마른 대나무가 부러졌습니다."
          wait: 650
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          framing: closeup
          with: []
          prompt: "대나무가 부러졌다. 발소리가 덕만에게 달려온다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          with:
            - 덕만
            - 아진
            - 칠숙
          text: "덕만은 달아나는 대신 기둥 밖으로 걸어 나왔습니다. 아진의 손은 칼자루에, 칠숙의 손은 소매 안에 들어가 있었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
            - 칠숙
          delivery: nervous
          text: "연못으로 가려다가 길을 잘못 들었습니다. 그런데 두 분은 등불도 없이 여기서 뭘 하십니까?"
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "길을 잃으신 분치고는 제 손을 오래 보시는군요."
      - say:
          char: 덕만
          framing: bust
          text: "허리에 칼을 찬 사람을 밤중에 만나면 누구라도 보게 되지요. 제가 이상합니까?"
      - say:
          char: 칠숙.smile
          framing: bust
          text: "아닙니다. 공주께서는 늘 눈이 밝으셨지요. 오늘 본 것은 아침까지 기억하지 않으시면 좋겠습니다."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "호위가 오기까지 일곱 번 숨을 쉽니다. 벌써 두 번 쓰셨습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with:
            - 아진
          delivery: angry
          text: "다섯 번이면 충분해. 칼을 뽑아 봐. 호위가 왔을 때 누구 얼굴부터 말해야 하는지 확인하게."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "오늘은 물러나겠습니다. 다음에도 다섯 번이 남을 거라고 생각하지 마십시오."
      - say:
          with:
            - 덕만
            - 아진
          text: "검은 복면은 사라졌지만, 덕만은 오른손에 감긴 붉은 매듭을 보았습니다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          with:
            - 덕만
          text: "덕만은 문빗장을 걸고 탁자 위에 네 가지를 놓았습니다. 아버지가 돌려준 부탁 글, 천명이 두고 간 비녀, 유신을 부르는 호각, 내일 연회에 칠숙이 보낸 자리표였습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "아버지는 나를 믿어. 하지만 연회를 멈추면 칠숙은 증거부터 없앨 거야. 언니에게 가면 나를 지키려다 다칠 테고, 유신에게 가면 왕의 명령 없이 칼을 뽑은 죄까지 질 거야."
      - say:
          char: 덕만
          framing: closeup
          with: []
          delivery: whisper
          text: "칠숙의 자리표를 집어 들고 웃으면, 그 사람 얼굴을 바로 볼 수는 있어. 내가 웃지 못하는 순간 그 방 문도 닫히겠지만."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "나는 아버지를 꼭 살리고 싶어. 그리고 나 때문에 죄 없는 사람도 다치게 하고 싶지 않아. 지금 누구에게 먼저 말해야 둘 다 지킬 수 있을까?"
      - choice:
          key: p_warn
          prompt: "동트기 전, 누구를 믿을까?"
          char: 덕만
          framing: closeup
          with: []
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "왜 이제 말해? 그 회랑을 혼자 지나왔다는 거야? 다친 데부터 보여 줘."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: whisper
          text: "다치진 않았어. 언니, 아버지 곁에 있어 줘. 내가 독이 든 잔을 찾을게."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "열병이 났던 밤에도 넌 괜찮다고 했어. 그러고 내 손에 손톱 자국을 냈지. 이번에는 무서우면 무섭다고 말해. 그래야 내가 같이 무서워해 주지."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          delivery: whisper
          text: "……무서워. 그러니까 아침까지 아버지 손을 놓지 마."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "명단에는 열셋이 적혀 있습니다. 그런데 한 명은 석 달 전에 죽었고, 한 명은 아직 태어나지도 않았습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 유신
          text: "명단을 믿고 움직이면 우리가 엉뚱한 문부터 두드리겠군요."
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "예. 누군가 공주께서 의심할 사람까지 골라 주었습니다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 유신
          text: "그럼 적힌 열셋은 놔두고, 이 명단을 쓴 열네 번째 사람을 찾으세요. 연회가 시작되기 전까지."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - effect: embers
      - say:
          delivery: calm
          text: "연회 당일 · 해가 막 오른 아침. 밤새 내린 비가 처마 끝에서 떨어졌습니다. 덕만은 한숨도 못 잔 얼굴로 아버지의 두 번째 잔만 바라봤습니다."
          wait: 450
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: full
          with:
            - 진평왕
            - 덕만
          text: "전하의 두 번째 잔은 제가 올리겠습니다. 어젯밤 길을 잃으신 공주께서도 오늘은 자리를 잘 찾으셨군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          text: "덕분에 길을 외웠습니다. 술병이 바뀔 때마다 손가락을 접는 버릇까지 보일 만큼요."
      - say:
          char: 칠숙.smile
          framing: closeup
          with:
            - 덕만
          text: "공주께서 몇까지 세셨는지 궁금하군요. 저는 이제 둘입니다."
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "아까부터 잔은 한 번도 보지 않는구나. 무엇을 보고 있느냐?"
          wait: 600
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "잔을 나르는 손과, 제가 아버지 곁에 설 때마다 저를 보는 얼굴을 보고 있습니다."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "내가 들어야 할 말이 있느냐?"
      - say:
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          delivery: nervous
          text: "있습니다. 하지만 지금 말씀드리면 잔을 바꿀 사람이 먼저 도망칩니다. 아버지, 이번 한 번만 제 눈을 믿어 주세요."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "믿는다. 나는 잔보다 네 얼굴을 보고 있겠다. 위험하면 바로 내 손을 잡아라."
      - choice:
          key: p_cup
          prompt: "왕이 잔을 든다. 지금 막을까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주께서 전하의 상을 엎으셨군요. 연회에 모인 이들이 오래 기억하겠습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "상은 다시 차리면 됩니다. 아버지는 다시 모실 수 없습니다."
      - say:
          char: 진평왕
          framing: bust
          text: "그만. 잔을 치우고, 술을 따른 자를 잡아라. 덕만은 나와 함께 간다."
      - goto: prologue_survive

  cup_swap:
    actions:
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "전하의 잔을 제게 주시는 겁니까? 제가 무슨 영광을 드렸는지 모르겠습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          delivery: deduction
          text: "그 잔을 보는 순간부터 손가락을 접으셨습니다. 무엇을 기다리는지 궁금해서요. 먼저 드십시오."
          wait: 650
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "공주께서 농이 지나치십니다."
      - say:
          char: 덕만
          framing: closeup
          text: "농이면 웃고 드시면 됩니다. 왜 못 드십니까?"
      - effect: impact
      - say:
          delivery: nervous
          text: "칠숙의 미소가 채 사라지기 전, 잔을 나르던 연주자가 혀를 깨물고 쓰러졌습니다."
      - goto: prologue_survive

  prologue_survive:
    actions:
      - effect: focus
      - say:
          delivery: sad
          text: "왕은 살아남았습니다. 그러나 잔을 나르던 연주자는 숨이 끊어졌습니다. 그의 품에서는 덕만의 노리개가 나왔고, 손톱 밑에는 검은 가루가 남아 있었습니다."
      - say:
          char: 진평왕.sad
          framing: bust
          text: "이 노리개가 네 것임을 부정할 수 있겠느냐?"
      - say:
          char: 덕만
          framing: bust
          delivery: whisper
          text: "제 것입니다. 누군가 제 방에서 훔쳤습니다. 독으로 아버지를 죽이고, 이 물건으로 제가 범인이라고 만들 생각이었습니다."
          wait: 800
      - say:
          char: 진평왕.sad
          framing: bust
          text: "아비인 나는 네 말을 믿는다. 하지만 왕인 나는 내일 아침 모두가 믿을 증거도 보여 줘야 한다."
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "알고 있습니다. 사흘만 주십시오. 제 이름에 묻은 독부터 닦아 내겠습니다."
      - get: black_powder
      - set:
          clue_black_powder: true
      - say:
          delivery: calm
          text: "동이 트자 왕좌전 문에 새 목패가 걸렸습니다. 밤새 빗물에 번진 ‘암살 용의’ 네 글자 아래, 덕만의 이름만 또렷했습니다."

  go_01_too_clever:
    actions:
      - char:
          id: 아진
          position: left
          framing: full
      - char:
          id: 덕만
          position: center
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - effect: focus
      - say:
          text: "덕만은 숨지 않고 두 사람 앞에 나섰습니다. 회랑 끝에서 호위가 달려오는 발소리가 들렸습니다."
      - say:
          char: 덕만
          framing: bust
          text: "내일 해가 뜬 뒤 두 번째 잔. 왕을 죽인 다음 저까지 없앨 생각이군요."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "회랑이 비었는데도 한 글자도 놓치지 않으셨습니다. 우연히 길을 잃은 분의 기억치고는 너무 정확하군요."
      - say:
          char: 덕만.angry
          framing: closeup
          with: []
          text: "제가 들은 걸 두려워하는군요."
      - say:
          char: 아진
          framing: bust
          text: "아닙니다. 내일 공주께서 공모 사실을 미리 알고 있었다고 증언할 사람이 생긴 겁니다."
      - effect: darken
      - say:
          text: "호위가 달려왔지만 칠숙은 먼저 무릎을 꿇었습니다. 그는 덕만이 암살 시각과 방법을 직접 말했다고 고했습니다. 다음 날 재판에서는 정확한 기억이 결백이 아니라 공모의 증거가 되었습니다."
          wait: 700
      - gameOver:
          title: "운명 01 — 들어 버린 문장"
          message: "덕만은 암살 계획을 막기도 전에 공모자로 체포되었습니다. 그녀를 처형한 뒤, 연회는 예정대로 열렸습니다."
