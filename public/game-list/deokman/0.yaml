script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: shadow_corridor
      - effect: moonveil
      - char:
          id: 덕만
          position: center
          framing: full
      - say:
          delivery: calm
          text: "서기 631년, 신라 왕경. 연회를 하루 앞둔 궁에는 잠든 방보다 깨어 있는 등불이 많았다."
      - say:
          text: "이 이야기는 실제 역사 인물과 시대를 바탕으로 암살·계승 음모와 인물 관계를 창작한 역사 픽션이다."
      - say:
          char: 덕만
          framing: full
          delivery: whisper
          text: "회랑의 등불이 하나씩 죽는다. 마지막 불빛이 꺼지기 전, 누군가 목소리를 눌렀다."
      - say:
          char: 칠숙
          framing: bust
          text: "<speed=20>내일 아침, 전하의 잔은 깨끗이 비워질 것입니다.</speed>"
          wait: 700
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "왕의 숨이 멎으면, 공주께 남은 거리는 열두 걸음입니다."
      - say:
          char: 칠숙
          framing: bust
          text: "공주께 허락된 자리는 처음부터 없었습니다."
      - say:
          delivery: whisper
          text: "<speed=20>훗날 덕만은 신라 최초의 여왕이 된다.</speed> <speed=32>오늘 밤을 살아남는다면.</speed>"
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          framing: closeup
          with:
            - 아진
          prompt: "대나무가 부러졌다. 발소리가 덕만에게 달려온다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "연못으로 가던 길이었는데…… 두 분도 길을 잃으셨습니까? 등불 하나 없이."
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "길을 잃은 사람치고는 숨이 고르십니다."
      - say:
          char: 덕만
          framing: bust
          text: "대답을 못 들으면, 같은 분들을 다시 만날까 두려워서요."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "호위가 닿기까지 일곱 숨. 신호에 둘을 쓰셨습니다."
      - say:
          char: 덕만
          framing: closeup
          delivery: angry
          text: "다섯이면 충분해. 그대가 칼을 뽑는 손까지 기억하기에는."
      - say:
          text: "검은 복면은 사라졌지만, 덕만은 오른손에 감긴 붉은 매듭을 보았다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "왕을 죽인다는 말을 들었다. 이제 문제는 하나다. 누구를 믿을 것인가."
      - choice:
          key: p_warn
          prompt: "동트기 전, 누구를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "열병이 났던 밤, 네 손을 너무 세게 잡아 자국까지 냈지. 이번에도 먼저 놓지 마."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: whisper
          text: "이번엔 내가 잡을게. 해가 뜬 뒤에도 놓지 않을게."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "열셋입니다. 하나는 석 달 전 죽었고, 하나는 아직 태어나지 않았습니다. 명단이 아니라 덫입니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 유신
          text: "미끼는 내가 물죠. 유신은 그들이 지운 열네 번째 이름을 찾으세요."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - effect: embers
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "잔은 보지 않고 손을 보는구나. 무엇이 보이느냐?"
          wait: 600
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "술보다 먼저 취한 얼굴들이 보입니다."
      - choice:
          key: p_cup
          prompt: "왕이 잔을 든다. 지금 막을까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - say:
          char: 칠숙
          framing: bust
          text: "공주께서 전하의 연회를 엎으셨군요. 왕실은 오늘의 무례를 오래 기억할 것입니다."
      - say:
          char: 덕만
          framing: bust
          text: "상을 다시 차리면 무례는 끝납니다. 전하를 다시 모실 수는 없지요."
      - goto: prologue_survive

  cup_swap:
    actions:
      - say:
          char: 칠숙
          framing: bust
          with:
            - 덕만
          text: "신하의 잔을 전하께 올리시다니. 과분한 영광입니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          delivery: deduction
          text: "반대입니다. 전하의 잔을 그대가 먼저 비울 영광을 드리지요."
          wait: 650
      - effect: impact
      - say:
          delivery: nervous
          text: "칠숙의 미소가 채 사라지기 전, 잔을 나르던 악공이 혀를 깨물고 쓰러졌다."
      - goto: prologue_survive

  prologue_survive:
    actions:
      - effect: focus
      - say:
          delivery: sad
          text: "왕은 살았다. 죽은 악공의 품에서는 덕만의 노리개가 나왔다. 그 손톱 밑에는 검은 가루가 박혀 있었다."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "독은 아버지의 잔을 노렸지만…… 함정은 내 이름 아래 놓였어."
          wait: 800
      - get: black_powder
      - set:
          clue_black_powder: true
      - say:
          text: "프롤로그 완료 — 덕만은 아버지를 얻는 대신 안전을 잃었다."

  go_01_too_clever:
    actions:
      - gameOver:
          title: "운명 01 — 너무 영리한 공주"
          message: "덕만은 들은 문장을 한 글자도 틀리지 않았다. 다음 날 그 정확함이 공모의 증거가 되었다. 정답을 너무 빨리 말한 공주는 해 뜨기 전 처형되었다."
  go_02_broken_moon:
    actions:
      - gameOver:
          title: "운명 02 — 부러진 달"
          message: "기와는 비에 젖어 있었다. 덕만은 지붕 아래의 어둠으로 사라졌고, 궁은 실족이라 기록했다. 난간에는 붉은 매듭 한 올이 남았다."
  go_03_open_door:
    actions:
      - gameOver:
          title: "운명 03 — 열린 문"
          message: "왕의 침전으로 가는 문은 너무 쉽게 열렸다. 기다리던 칼은 덕만의 입을 먼저 막았다. 그날 밤 왕은 암살 계획을 끝내 듣지 못했다."
  go_04_guest_of_traitor:
    actions:
      - gameOver:
          title: "운명 04 — 반역자의 손님"
          message: "칠숙은 무릎 꿇고 충성을 맹세했다. 덕만이 돌아선 뒤 그 맹세는 체포 명령이 되었다. 공주는 스스로 적의 방에 들어간 첫 번째 왕족으로 남았다."
  go_05_filial_cup:
    actions:
      - gameOver:
          title: "운명 05 — 효녀 덕만"
          message: "덕만은 왕 대신 잔을 비웠다. 왕실은 효심을 칭송했으나, 그녀의 손톱 밑 검은 가루는 기록에서 지워졌다. 삼 년 뒤 왕위는 이름 없는 소년에게 돌아갔다."
  go_06_closed_mouth:
    actions:
      - gameOver:
          title: "운명 06 — 입을 다문 공주"
          message: "왕은 잔을 비우고 쓰러졌다. 덕만은 아무것도 하지 않았다는 이유로 살아남지 못했다. 침묵은 결백이 아니라 가장 값싼 공모가 되었다."
