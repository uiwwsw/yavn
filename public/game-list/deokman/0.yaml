script:
  - scene: opening_record

scenes:
  opening_record:
    actions:
      - bg: peony_court
      - camera: wide
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(210px, 28%, 420px)"
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          channel: record
          delivery: calm
          wait: 600
          unskippable: true
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤."
      - say:
          channel: narration
          delivery: calm
          text: "누군가 덕만을 죽이기도 전에 사망 기록부터 만들어 두었습니다."
      - clearSticker:
          id: opening_death_register
          leave: fadeOut
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "전하께서 몰래 부르셨습니다. 사람들이 눈치채기 전에 돌아가야 합니다."
      - say:
          char: 어린 덕만
          camera: close
          with: [소화]
          text: "나를 찾는 사람이 궁 안에 있어?"
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "네. 그러니 제 곁에서 떨어지지 마세요."
      - goto: peony_arrives

  peony_arrives:
    actions:
      - say:
          channel: narration
          text: "덕만을 부른 사람은 진평왕이었습니다. 왕은 시종들을 물리고 호위 둘만 문밖에 남긴 뒤, 당나라 황제가 보낸 모란 그림을 펼쳤습니다."
      - sticker:
          id: peony_painting_view
          image: peony_painting_sticker
          x: 50
          y: 27
          width: "clamp(180px, 22%, 360px)"
          anchorX: center
          anchorY: center
          rotate: -1.5
          zIndex: 12
          enter: fadeIn
          inputLockMs: 320
      - get: peony_painting
      - char: { id: 진평왕, position: center }
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "덕만아, 이 그림에서 이상한 점을 찾아보아라."
      - choice:
          key: c1_peony_observation
          prompt: "모란 그림에서 무엇을 먼저 살피겠습니까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "그림에 없는 것을 찾는다"
              goto: observe_absence
            - text: "그림 뒤와 족자 축을 살핀다"
              goto: observe_back
            - text: "그림보다 방 안의 사람들과 바깥길을 살핀다"
              set: { observed_left_waterway: true }
              goto: observe_waterway

  observe_absence:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "꽃은 많은데 벌과 나비가 한 마리도 없습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "왜 그게 이상하지?"
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "꽃에 향기가 있다면 벌이나 나비가 찾아왔을 테니까요."
      - goto: king_question

  observe_back:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - say:
          channel: narration
          text: "덕만은 족자 아래쪽 나무축이 제대로 닫히지 않은 것을 발견했습니다. 축을 열자 접힌 문서와 반쯤 마른 붉은 도장 자국이 드러났습니다."
      - sticker:
          id: death_register_view
          image: death_register_sticker
          x: 51
          y: 29
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 2
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          channel: record
          delivery: deduction
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "전하, 제가 오늘 밤 죽는다고 적혀 있습니다. 전하의 도장도 있습니다."
      - clearSticker:
          id: death_register_view
          leave: fadeOut
      - goto: king_question

  observe_waterway:
    actions:
      - camera: wide
      - say:
          channel: narration
          text: "덕만은 그림보다 열린 창과 병사들의 움직임을 살폈습니다. 왼쪽 담 아래 배수로 덮개가 비뚤어져 있었습니다."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "왼쪽 배수로는 아이가 지나갈 만큼 열려 있습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그림을 보라 했는데 나갈 길부터 찾았구나."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "저를 찾는 사람이 궁 안에 있다고 들었습니다."
      - goto: king_question

  king_question:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - bg: peony_court
      - camera: medium
      - char: { id: 어린 덕만, position: left }
      - char: { id: 진평왕, position: center }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "이 모란에 향기가 있겠느냐?"
      - choice:
          key: c1_answer_king
          prompt: "왕에게 무엇을 대답하겠습니까?"
          char: 어린 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "벌과 나비가 없으니 향기도 없을 것입니다"
              set: { spoke_truth_to_king: true }
              goto: answer_scent
            - text: "꽃보다 먼저, 족자 뒤에서 찾은 제 사망 기록을 보여 드리겠습니다"
              when: { var: death_register, op: eq, value: true }
              set: { spoke_truth_to_king: true }
              goto: answer_record
            - text: "그림일 뿐이라 실제 향기는 알 수 없습니다"
              goto: answer_literal

  answer_scent:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [진평왕]
          text: "벌과 나비가 없으니 향기도 없을 것입니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "맞다. 당나라 황제는 향기 없는 모란으로, 신라에 왕위를 이을 아들이 없다는 사실을 비웃었다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "네가 그림에 숨긴 조롱을 알아보는지 보고 싶었다."
      - goto: king_warning

  answer_record:
    actions:
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [진평왕]
          text: "누가 제가 오늘 밤 죽는다고 적고 전하의 도장을 찍은 겁니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내가 만든 기록이 아니다. 누군가 내 도장을 훔쳐 네 죽음을 미리 적었다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "오늘 저를 죽여 이 문서를 진짜로 만들려는 거군요."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그래. 반드시 살아남아라."
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - goto: king_warning

  answer_literal:
    actions:
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그림일 뿐이라 실제 향기는 알 수 없습니다."
      - say:
          char: 진평왕
          camera: close
          with: [어린 덕만]
          text: "그림의 냄새를 묻는 게 아니다. 벌과 나비가 없는 이유를 생각해 보아라."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "신라에 왕위를 이을 아들이 없다는 걸 빗댄 겁니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "그래. 당나라 황제는 그걸 조롱한 것이다."
      - goto: king_warning

  king_warning:
    actions:
      - camera: medium
      - char: { id: 진평왕, position: center }
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕.sad
          camera: close
          with: [어린 덕만]
          text: "내게 아들이 없자 귀족들은 네 쌍둥이 언니 천명과 너를 서로 다른 후계자로 내세웠다."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그래서 저를 숨기셨습니까?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "두 편이 충돌하는 걸 막고 너를 살리려 했다. 하지만 누군가 네 존재를 알아냈다."
      - say:
          char: 어린 덕만
          camera: close
          with: [진평왕]
          text: "그 사람이 사망 기록도 만들었군요."
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그래. 오늘 밤 너를 죽이고 기록을 사실로 만들 생각이다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [진평왕, 어린 덕만]
          text: "전하, 서쪽 처마에서 기름 냄새가 납니다."
      - say:
          char: 진평왕
          camera: close
          with: [소화, 어린 덕만]
          text: "소화, 덕만을 데리고 나가라."
      - goto: fire_breaks

  fire_breaks:
    actions:
      - bg: burning_palace
      - camera: wide
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          channel: narration
          camera: medium
          delivery: nervous
          text: "불붙은 들보가 방 안으로 떨어졌습니다. 친위대가 왕을 안채로 데려갔고, 덕만과 소화는 반대편 마당에 고립됐습니다."
      - say:
          channel: narration
          text: "별궁의 세 문이 동시에 닫혔습니다. 문밖에는 왕실 기록을 관리하는 귀족 칠숙이 서 있었습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "불이 꺼지면 공주는 열병으로 죽었고 시신은 불탔다고 기록하겠습니다."
      - say:
          char: 어린 덕만.scared
          camera: close
          with: [칠숙]
          text: "당신이 제 사망 기록을 만든 겁니까?"
      - say:
          char: 칠숙
          camera: close
          with: [어린 덕만]
          text: "오늘 밤이 지나면 아무도 그 기록을 거짓이라고 말할 수 없을 겁니다."
      - char: { id: 소화, position: center, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "아기씨, 연기가 위로 차오릅니다. 몸을 낮추고 제 손짓만 보며 움직이세요."
      - say:
          channel: narration
          text: "소화는 옷깃 안에 숨겨 둔 청동 모란패를 꺼내 덕만의 손에 쥐여 주었습니다."
      - sticker:
          id: peony_token_view
          image: peony_token_sticker
          x: 49
          y: 31
          width: "clamp(104px, 12%, 180px)"
          anchorX: center
          anchorY: center
          zIndex: 15
          enter: fadeIn
          inputLockMs: 300
      - get: peony_token
      - say:
          char: 소화
          camera: close
          with: [어린 덕만]
          text: "이 패를 북문 수비에게 보이면 문을 열어 줄 겁니다. 대신 아기씨의 신분도 드러납니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "저를 놓치더라도 멈추지 말고 궁 밖으로 나가세요."
      - clearSticker:
          id: peony_token_view
          leave: fadeOut
      - choice:
          key: c1_fire_escape
          prompt: "불길이 마루를 끊기 전에 어떻게 빠져나가겠습니까?"
          char: 어린 덕만.scared
          camera: close
          with: [소화]
          timeoutMs: 5500
          timeoutOptionIndex: 3
          options:
            - text: "왼쪽 담 아래 물길로 소화와 함께 나간다"
              when: { var: observed_left_waterway, op: eq, value: true }
              goto: escape_waterway
            - text: "청동 모란패를 보이고 북문을 연다"
              goto: escape_token
            - text: "사망 기록을 들고 왕이 있는 안채로 뛴다"
              when:
                all:
                  - { var: death_register, op: eq, value: true }
                  - { var: spoke_truth_to_king, op: eq, value: true }
              goto: escape_record
            - text: "모란 화단에 몸을 숨기고 불이 지나가길 기다린다"
              goto: bad_smoke

  escape_waterway:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          camera: medium
          text: "덕만은 조금 전 보아 둔 왼쪽 담으로 달렸습니다. 빗물을 빼는 돌판 아래에는 아이 하나가 겨우 기어갈 틈이 있었습니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "먼저 나가세요. 제가 뒤에서 돌판을 받치겠습니다."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          text: "혼자 가지 않을 거야. 같이 나가."
      - say:
          channel: narration
          text: "두 사람의 뒤에서 별궁 지붕이 내려앉았습니다. 젖은 돌길 위로 불티가 별처럼 떨어졌습니다."
      - say:
          char: 소화
          camera: close
          with: [어린 덕만]
          text: "이제 어디로 가시겠습니까?"
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          wait: 600
          unskippable: true
          text: "기록에는 내가 죽었다고 되어 있어. 궁 밖에서 이름을 숨기고, 누가 나를 죽이려 했는지 찾을 거야."
      - say:
          channel: narration
          text: "소화는 국경 상단에 몸을 숨길 길을 정했고, 덕만은 그날 본 붉은 인장과 모란 그림을 기억했습니다. 두 단서가 다시 만나는 곳이 돌아갈 때를 알려 줄 것이었습니다."
      - say:
          channel: record
          delivery: calm
          text: "왕실 기록에서 공주는 죽었습니다. 그러나 그날 밤 덕만은 별궁을 빠져나와 살아남았습니다."
      - set: { c1_escape_route: waterway, identity_exposed: false }
      - add: { sohwa_trust: 2, people_support: 1, insight: 1 }
      - goto: /1.yaml

  escape_token:
    actions:
      - bg: moon_court
      - camera: wide
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          camera: medium
          text: "덕만이 청동 모란패를 치켜들자 북문을 막던 창들이 양옆으로 걷혔습니다. 문은 열렸지만 수비대 모두가 아이의 얼굴을 보았습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [어린 덕만]
          text: "문은 열렸지만 너무 많은 눈이 아기씨를 보았습니다."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          text: "지금은 들키더라도 살아서 나가는 게 먼저야."
      - say:
          channel: narration
          text: "문을 지킨 병사들은 곧 칠숙에게 덕만의 얼굴을 설명했습니다. 덕만은 살아남았지만 더는 완전히 숨을 수 없었습니다."
      - say:
          char: 어린 덕만.resolve
          camera: close
          with: [소화]
          text: "저들이 내 얼굴을 기억한다면 나도 저 인장을 기억할 거야. 국경에서 살아남으며 저 도장이 움직이는 길을 찾자."
      - say:
          channel: record
