script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: shadow_corridor
      - effect: moonveil
      - char:
          id: 덕만
          position: center
          framing: full
      - say:
          with:
            - 덕만
          text: "진평왕에게는 아들이 없었습니다. 맏딸 천명은 이미 혼인했고, 둘째 딸 덕만은 아버지 곁에서 정사를 배우기 시작했습니다. 그때부터 몇몇 귀족은 덕만을 공주가 아니라, 자신들이 정할 왕위를 빼앗을 사람으로 보았습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "아버지는 내가 회의에 앉는다고 나라가 무너지지는 않는다고 하셨지. 그런데 왜 다들 내가 왕관이라도 훔친 얼굴로 보는 걸까."
      - say:
          with:
            - 덕만
          delivery: calm
          text: "비가 처마를 때렸습니다. 덕만이 서쪽 회랑에 들어서자 세 번째 등불이 꺼졌습니다. 앞의 두 등불과 똑같은 간격이었습니다."
      - say:
          char: 덕만
          framing: closeup
          with: []
          delivery: whisper
          text: "……바람이 아니야. 누가 내가 오는 쪽부터 불을 죽이고 있어."
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "덕만은 가장 굵은 기둥 뒤로 몸을 붙였습니다. 남자의 목소리는 이찬 칠숙의 것이었습니다. 왕 앞에서는 가장 충직한 대신이지만, 화백회의에서는 여인이 왕이 되는 순간 신라의 질서가 끝난다고 주장해 온 사람이었습니다."
          wait: 550
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 아진
          position: left
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "<speed=20>내일 진시, 전하께서 두 번째 잔을 드시면 일을 시작하십시오.</speed>"
          wait: 700
      - say:
          char: 아진
          framing: bust
          with:
            - 칠숙
          delivery: neutral
          text: "왕이 쓰러지면 호위가 공주에게 닿기까지 열두 걸음입니다. 그 전에 끝내겠습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "천명공주는 이미 남편의 가문이 있습니다. 덕만공주는 아직 누구의 이름 아래에도 들어가지 않았지요. 뜻을 가진 딸이 칼을 가진 아들보다 위험할 때가 있습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 아진
          text: "실수하지 마십시오. 왕만 죽고 공주가 살면, 오늘보다 더 성가신 내일이 옵니다."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 칠숙
          delivery: neutral
          text: "……알겠습니다."
      - say:
          with:
            - 덕만
          delivery: whisper
          text: "덕만은 소매로 입을 막았습니다. 열두 걸음. 그 거리를 머릿속으로 재는 순간, 발뒤꿈치 아래의 마른 대나무가 부러졌습니다."
          wait: 650
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          framing: closeup
          with: []
          prompt: "대나무가 부러졌다. 발소리가 덕만에게 달려온다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          with:
            - 덕만
            - 아진
            - 칠숙
          text: "덕만은 달아나는 대신 기둥 밖으로 걸어 나왔습니다. 아진의 손은 칼자루에, 칠숙의 손은 소매 안에 들어가 있었습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 아진
            - 칠숙
          delivery: nervous
          text: "연못으로 가려다가 길을 잘못 들었습니다. 그런데 두 분은 등불도 없이 여기서 뭘 하십니까?"
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "길을 잃으신 분치고는 제 손을 오래 보시는군요."
      - say:
          char: 덕만
          framing: bust
          text: "허리에 칼을 찬 사람을 밤중에 만나면 누구라도 보게 되지요. 제가 이상합니까?"
      - say:
          char: 칠숙.smile
          framing: bust
          text: "아닙니다. 공주께서는 늘 눈이 밝으셨지요. 오늘 본 것은 아침까지 기억하지 않으시면 좋겠습니다."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "호위가 오기까지 일곱 번 숨을 쉽니다. 벌써 두 번 쓰셨습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with:
            - 아진
          delivery: angry
          text: "다섯 번이면 충분해. 칼을 뽑아 봐. 호위가 왔을 때 누구 얼굴부터 말해야 하는지 확인하게."
      - say:
          char: 아진.nervous
          framing: bust
          with:
            - 덕만
          delivery: neutral
          text: "오늘은 물러나겠습니다. 다음에도 다섯 번이 남을 거라고 생각하지 마십시오."
      - say:
          with:
            - 덕만
            - 아진
          text: "검은 복면은 사라졌지만, 덕만은 오른손에 감긴 붉은 매듭을 보았습니다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          with:
            - 덕만
          text: "덕만에게 진평왕은 아버지이자 신라의 왕이었습니다. 아버지는 딸의 말을 믿을 수 있지만, 왕은 증거 없이 연회를 멈출 수 없었습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "언니 천명은 내 말을 의심하지 않겠지만 칼이 없어. 유신은 내 호위를 맡은 장수라 칼은 있지만, 왕명 없이 움직이면 반역으로 몰릴 거야."
      - say:
          char: 덕만
          framing: closeup
          with: []
          delivery: whisper
          text: "칠숙에게 아무것도 못 들은 척 다가가면 시간을 벌 수도 있어. 들켰다는 걸 알아차리면 그 방에서 나오지 못하겠지."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "아버지를 죽이겠다는 말을 들었어. 그런데 지금 바로 침전으로 가면, 그들이 나부터 기다리고 있을 거야. 누구에게 먼저 말하지?"
      - choice:
          key: p_warn
          prompt: "동트기 전, 누구를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "왜 이제 말해? 그 회랑을 혼자 지나왔다는 거야? 다친 데부터 보여 줘."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: whisper
          text: "다치진 않았어. 언니, 아버지 곁에 있어 줘. 내가 독이 든 잔을 찾을게."
      - say:
          char: 천명.sad
          framing: bust
          with:
            - 덕만
          text: "열병이 났던 밤에도 넌 괜찮다고 했어. 그러고 내 손에 손톱 자국을 냈지. 이번에는 무서우면 무섭다고 말해. 그래야 내가 같이 무서워해 주지."
      - say:
          char: 덕만
          framing: bust
          with:
            - 천명
          delivery: whisper
          text: "……무서워. 그러니까 아침까지 아버지 손을 놓지 마."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "명단에는 열셋이 적혀 있습니다. 그런데 한 명은 석 달 전에 죽었고, 한 명은 아직 태어나지도 않았습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 유신
          text: "명단을 믿고 움직이면 우리가 엉뚱한 문부터 두드리겠군요."
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "예. 누군가 공주께서 의심할 사람까지 골라 주었습니다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 유신
          text: "그럼 적힌 열셋은 놔두고, 이 명단을 쓴 열네 번째 사람을 찾으세요. 연회가 시작되기 전까지."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - effect: embers
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          with:
            - 칠숙
          text: "연회 반대편에는 왕의 잔을 준비한 대신들을 대표해 칠숙이 앉아 있었습니다. 그는 덕만과 눈이 마주칠 때마다 웃었고, 술병이 바뀔 때마다 소매 안에서 손가락을 하나씩 접었습니다."
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "아까부터 잔은 한 번도 보지 않는구나. 무엇을 보고 있느냐?"
          wait: 600
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "잔을 나르는 손과, 제가 아버지 곁에 설 때마다 저를 보는 얼굴을 보고 있습니다."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "내가 들어야 할 말이 있느냐?"
      - say:
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          delivery: nervous
          text: "있습니다. 하지만 지금 말씀드리면 잔을 바꿀 사람이 먼저 도망칩니다. 아버지, 이번 한 번만 제 눈을 믿어 주세요."
      - say:
          char: 진평왕
          framing: bust
          with:
            - 덕만
          text: "좋다. 대신 늦지는 마라."
      - choice:
          key: p_cup
          prompt: "왕이 잔을 든다. 지금 막을까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주께서 전하의 상을 엎으셨군요. 연회에 모인 이들이 오래 기억하겠습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "상은 다시 차리면 됩니다. 아버지는 다시 모실 수 없습니다."
      - say:
          char: 진평왕
          framing: bust
          text: "그만. 잔을 치우고, 술을 따른 자를 잡아라. 덕만은 나와 함께 간다."
      - goto: prologue_survive

  cup_swap:
    actions:
      - char:
          id: 칠숙
          position: center
          framing: full
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "전하의 잔을 제게 주시는 겁니까? 제가 무슨 영광을 드렸는지 모르겠습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          delivery: deduction
          text: "그 잔을 보는 순간부터 손가락을 접으셨습니다. 무엇을 기다리는지 궁금해서요. 먼저 드십시오."
          wait: 650
      - say:
          char: 칠숙.smile
          framing: closeup
          text: "공주께서 농이 지나치십니다."
      - say:
          char: 덕만
          framing: closeup
          text: "농이면 웃고 드시면 됩니다. 왜 못 드십니까?"
      - effect: impact
      - say:
          delivery: nervous
          text: "칠숙의 미소가 채 사라지기 전, 잔을 나르던 악공이 혀를 깨물고 쓰러졌습니다."
      - goto: prologue_survive

  prologue_survive:
    actions:
      - effect: focus
      - say:
          delivery: sad
          text: "왕은 살아남았습니다. 그러나 잔을 나르던 악공은 숨이 끊어졌습니다. 그의 품에서는 덕만의 노리개가 나왔고, 손톱 밑에는 검은 가루가 남아 있었습니다."
      - say:
          char: 진평왕.sad
          framing: bust
          text: "이 노리개가 네 것임을 부정할 수 있겠느냐?"
      - say:
          char: 덕만
          framing: bust
          delivery: whisper
          text: "제 것입니다. 누군가 제 방에서 훔쳤습니다. 독으로 아버지를 죽이고, 이 물건으로 제가 범인이라고 만들 생각이었습니다."
          wait: 800
      - say:
          char: 진평왕.sad
          framing: bust
          text: "그 말을 믿고 싶구나. 하지만 내일 아침에는 나 말고도 모두를 설득해야 한다."
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "알고 있습니다. 사흘만 주십시오. 제 이름에 묻은 독부터 닦아 내겠습니다."
      - get: black_powder
      - set:
          clue_black_powder: true
      - say:
          text: "덕만은 아버지의 목숨을 구했지만, 다음 날부터 암살 용의자로 불리게 되었습니다."

  go_01_too_clever:
    actions:
      - char:
          id: 아진
          position: left
          framing: full
      - char:
          id: 덕만
          position: center
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - effect: focus
      - say:
          text: "덕만은 숨지 않고 두 사람 앞에 나섰습니다. 회랑 끝에서 호위가 달려오는 발소리가 들렸습니다."
      - say:
          char: 덕만
          framing: bust
          text: "내일 진시, 두 번째 잔. 왕이 쓰러지면 저부터 죽일 생각이군요."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "회랑이 비었는데도 한 글자도 놓치지 않으셨습니다. 우연히 길을 잃은 분의 기억치고는 너무 정확하군요."
      - say:
          char: 덕만.angry
          framing: closeup
          with: []
          text: "제가 들은 걸 두려워하는군요."
      - say:
          char: 아진
          framing: bust
          text: "아닙니다. 내일 공주께서 공모 사실을 미리 알고 있었다고 증언할 사람이 생긴 겁니다."
      - effect: darken
      - say:
          text: "호위가 달려왔지만 칠숙은 먼저 무릎을 꿇었습니다. 그는 덕만이 암살 시각과 방법을 직접 말했다고 고했습니다. 다음 날 재판에서는 정확한 기억이 결백이 아니라 공모의 증거가 되었습니다."
          wait: 700
      - gameOver:
          title: "운명 01 — 들어 버린 문장"
          message: "덕만은 암살 계획을 막기도 전에 공모자로 체포되었습니다. 그녀를 처형한 뒤, 연회는 예정대로 열렸습니다."
  go_02_broken_moon:
    actions:
      - char:
          id: 덕만
          position: center
          framing: full
      - effect: shake
      - say:
          with:
            - 덕만
          text: "덕만이 난간을 짚고 지붕에 오르자 젖은 기와가 발밑에서 밀렸습니다. 아래 회랑의 발소리는 보이지 않았지만 점점 가까워졌습니다."
      - say:
          char: 덕만.sad
          framing: bust
          with: []
          text: "잠깐…… 손을 잡아 줘!"
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          text: "세 걸음만 더 가시면 아래 회랑으로 내려갈 수 있습니다. 그대로 오십시오."
      - say:
          with:
            - 덕만
            - 아진
          text: "처마 아래에서 아진의 손이 올라왔습니다. 손목의 붉은 매듭을 본 덕만이 손을 거두는 순간, 마지막 기와가 깨졌습니다."
      - effect: darken
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          char: 칠숙.smile
          framing: closeup
          with: []
          text: "난간이 많이 미끄러웠다고 기록하십시오."
          wait: 650
      - gameOver:
          title: "운명 02 — 젖은 기와"
          message: "덕만은 지붕 아래 회랑으로 떨어졌습니다. 궁은 사고사라 발표했고, 난간의 붉은 실은 아침 전에 치워졌습니다."
  go_03_open_door:
    actions:
      - bg: shadow_corridor
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          with:
            - 덕만
          text: "왕의 침전으로 가는 서쪽 문에는 보초가 없었습니다. 문틈에는 불빛도 없었고, 덕만이 손을 대기 전에 빗장이 안쪽에서 먼저 움직였습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "누가 안에 있느냐. 아버지께 급히 드릴 말이 있다."
      - char:
          id: 아진
          position: right
          framing: full
      - say:
          char: 아진
          framing: bust
          with:
            - 덕만
          text: "그 말을 듣지 못하게 하라는 명령을 받았습니다."
      - effect: impact
      - say:
          char: 덕만.angry
          framing: closeup
          with:
            - 아진
          text: "아버지! 잔을 드시면 안 됩니다!"
      - effect: darken
      - say:
          text: "덕만의 외침은 닫힌 침전 문을 넘지 못했습니다. 칼이 먼저 목소리를 끊었고, 안에서는 연회 준비를 알리는 북이 울렸습니다."
          wait: 700
      - gameOver:
          title: "운명 03 — 침전 앞의 칼"
          message: "덕만은 침전 문 앞에서 살해되었습니다. 진평왕은 딸이 왜 찾아왔는지 끝내 듣지 못했습니다."
  go_04_guest_of_traitor:
    actions:
      - bg: council_hall
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - say:
          text: "칠숙은 덕만을 자신의 방으로 들이고 시종들을 모두 물렸습니다. 문밖에서 빗장이 걸리는 소리가 났습니다."
      - say:
          char: 덕만
          framing: bust
          text: "내일 두 번째 잔에 무슨 일이 생기는지 알고 계십니까?"
      - say:
          char: 칠숙.smile
          framing: bust
          text: "알고 있습니다. 공주께서 제게 그 계획을 제안하러 오셨다는 사실도 이제 알게 됐습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          with: []
          text: "함정을 판 건 그대입니다."
      - effect: alarm
      - say:
          char: 칠숙
          framing: bust
          text: "문밖의 호위에게는 어느 쪽 말이 더 그럴듯할까요?"
      - say:
          text: "문이 열리자 칠숙은 먼저 바닥에 엎드렸습니다. 호위들은 칠숙의 방에서 그를 협박하던 덕만을 현장에서 체포했습니다."
          wait: 700
      - gameOver:
          title: "운명 04 — 칠숙의 방"
          message: "덕만은 칠숙을 떠보려다 암살을 제안한 사람으로 몰렸습니다. 재판이 열리기 전부터 증언은 준비돼 있었습니다."
  go_05_filial_cup:
    actions:
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: center
          framing: full
      - char:
          id: 진평왕
          position: right
          framing: full
      - effect: focus
      - say:
          text: "덕만은 진평왕의 손에서 잔을 빼앗아 한 번에 비웠습니다. 연회장이 조용해졌다가 곧 효심을 칭송하는 목소리로 가득 찼습니다."
      - say:
          char: 진평왕
          framing: bust
          text: "덕만아, 왜 그랬느냐. 그 잔에 무엇이 있었느냐?"
      - say:
          char: 덕만.sad
          framing: bust
          text: "아버지께서 드시면 안 되는 것이었습니다. 저는 괜찮……"
      - effect: blur
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "손끝이…… 움직이지 않습니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주께서 독을 알고도 직접 마셨다면, 누가 넣었는지부터 밝혀야겠습니다."
      - effect: darken
      - say:
          text: "덕만은 아버지의 무릎에 기대어 숨을 거두었습니다. 칠숙은 그녀의 손톱 밑에서 검은 가루를 찾아냈고, 죽은 공주가 독을 준비했다는 기록을 남겼습니다."
          wait: 800
      - gameOver:
          title: "운명 05 — 두 번째 잔"
          message: "덕만은 진평왕 대신 독을 마시고 죽었습니다. 누가 잔을 바꿨는지는 조사되지 않았습니다."
  go_06_closed_mouth:
    actions:
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 칠숙
          position: center
          framing: full
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          text: "덕만이 망설이는 사이 진평왕은 두 번째 잔을 입에 댔습니다. 칠숙은 잔이 비워지는 것을 끝까지 바라보았습니다."
      - say:
          char: 덕만.sad
          framing: bust
          text: "아버지, 잠깐만요. 그 잔은……"
      - say:
          char: 진평왕
          framing: bust
          text: "왜 그러느냐?"
      - effect: impact
      - say:
          text: "진평왕의 손에서 잔이 떨어졌습니다. 왕이 숨을 쉬지 못하자 호위들이 덕만과 칠숙 사이를 막아섰습니다."
      - say:
          char: 칠숙
          framing: bust
          text: "공주께서는 무언가 아시는 얼굴입니다. 왜 전하께서 드실 때까지 말씀하지 않으셨습니까?"
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "확실하지 않았습니다. 한 번만 더 확인하려고……"
      - effect: darken
      - say:
          text: "덕만의 설명은 끝나지 못했습니다. 왕의 잔에 독이 든 것을 알고도 지켜봤다는 증언이 먼저 퍼졌고, 새벽이 오기 전에 체포 명령이 내려졌습니다."
          wait: 700
      - gameOver:
          title: "운명 06 — 늦은 경고"
          message: "진평왕은 연회장에서 죽었습니다. 덕만은 독을 알고도 막지 않았다는 혐의로 함께 처형되었습니다."
