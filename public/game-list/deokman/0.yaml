      - set:
          clue_black_powder: true
      - say:
          delivery: calm
          text: "연회가 끝날 무렵, 왕좌전 문에 목패가 걸렸습니다."
      - say:
          with:
            - 덕만
          text: "‘왕을 죽이려 한 자, 덕만.’"

