script:
  - scene: prologue_open
  - scene: prologue_survive

scenes:
  prologue_open:
    actions:
      - bg: shadow_corridor
      - effect: moonveil
      - char:
          id: 덕만
          position: center
          framing: full
      - char:
          id: 칠숙
          position: right
          framing: full
      - char:
          id: 아진
          position: left
          framing: full
      - say:
          delivery: calm
          text: "서기 631년, 신라 왕경. 연회 전야. 잠든 방은 많았고, 꺼지지 않은 등불에는 저마다 주인이 있었다."
      - say:
          text: "이 이야기는 실제 역사 인물과 시대를 바탕으로 암살·계승 음모와 인물 관계를 창작한 역사 픽션이다."
      - say:
          char: 덕만
          framing: full
          delivery: whisper
          text: "등불이 서쪽부터 꺼진다. 바람이 아니라 사람 손이다. 마지막 불빛 너머에서 목소리가 숨을 죽였다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "<speed=20>내일 진시, 전하의 잔은 바닥을 보게 될 것입니다.</speed>"
          wait: 700
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "왕의 숨이 멎고 열두 걸음. 그 안에 공주도 따라야 합니다."
      - say:
          char: 칠숙.smile
          framing: bust
          text: "왕이 없는 조정에 공주를 위한 자리는 없으니까요."
      - say:
          delivery: whisper
          text: "<speed=20>훗날 덕만은 신라 최초의 여왕이 된다.</speed> <speed=32>오늘 밤을 살아남는다면.</speed>"
      - goto: caught_choice

  caught_choice:
    actions:
      - choice:
          key: p_caught
          char: 덕만
          framing: closeup
          with:
            - 아진
          prompt: "대나무가 부러졌다. 발소리가 덕만에게 달려온다."
          options:
            - text: "길 잃은 척 나선다"
              add:
                insight: 1
              goto: caught_lost
            - text: "들은 말을 되묻는다"
              goto: go_01_too_clever
            - text: "지붕으로 뛴다"
              goto: go_02_broken_moon
            - text: "비상 휘파람을 분다"
              add:
                power: 1
                suspicion: 1
              goto: caught_signal

  caught_lost:
    actions:
      - say:
          char: 덕만
          framing: closeup
          delivery: nervous
          text: "연못으로 가던 길을 놓쳤습니다. 두 분도 그러신가요? 등불도 없이, 같은 곳에서."
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "길을 잃은 분은 돌아갈 곳부터 봅니다. 공주는 제 손부터 보고 계시는군요."
      - say:
          char: 덕만
          framing: bust
          text: "길은 내일도 묻지요. 칼을 쥔 손은 오늘 외워 둬야 하고."
      - goto: warn_choice

  caught_signal:
    actions:
      - effect: focus
      - say:
          char: 아진
          framing: bust
          delivery: neutral
          text: "호위까지 일곱 숨. 두 숨을 휘파람에 쓰셨습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          delivery: angry
          text: "다섯이면 충분해. 그대가 칼을 뽑고, 후회하는 얼굴까지 기억하기에는."
      - say:
          text: "검은 복면은 사라졌지만, 덕만은 오른손에 감긴 붉은 매듭을 보았다."
      - goto: warn_choice

  warn_choice:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "왕을 죽일 목소리는 들었다. 이제 내 입이 누구를 먼저 살릴지 정해야 한다."
      - choice:
          key: p_warn
          prompt: "동트기 전, 누구를 믿을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "아버지께 고한다"
              goto: go_03_open_door
            - text: "천명에게 알린다"
              add:
                cheonmyeong_trust: 1
              goto: warn_cheonmyeong
            - text: "유신에게 명단을 맡긴다"
              add:
                yushin_trust: 1
                insight: 1
              goto: warn_yushin
            - text: "칠숙을 떠본다"
              goto: go_04_guest_of_traitor

  warn_cheonmyeong:
    actions:
      - char:
          id: 천명
          position: right
          framing: full
      - say:
          char: 천명.sad
          framing: closeup
          with:
            - 덕만
          delivery: sad
          text: "열병이 났던 밤, 네 손을 너무 세게 잡아 손톱 자국을 냈지. 덕만아, 오늘도 아프다고 먼저 놓지는 마."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 천명
          delivery: whisper
          text: "이번에는 내가 잡을게. 언니 손에 자국이 남아도, 해 뜰 때까지."
      - add:
          legitimacy: 1
      - goto: banquet_choice

  warn_yushin:
    actions:
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          char: 유신
          framing: bust
          with:
            - 덕만
          text: "열셋입니다. 하나는 석 달 전 죽었고, 하나는 아직 태어나지도 않았습니다. 사람을 적은 명단이 아니라, 공주를 기다린 덫입니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 유신
          text: "그럼 덫은 내가 밟죠. 유신은 명단을 만든 뒤 자기 이름부터 지운 열네 번째 사람을 찾으세요."
      - goto: banquet_choice

  banquet_choice:
    actions:
      - bg: banquet_hall
      - effect: embers
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "잔은 보지 않고 잔 든 손을 보는구나. 누가 먼저 떨더냐?"
          wait: 600
      - say:
          char: 덕만
          framing: bust
          with:
            - 진평왕
          text: "술을 따르는 이는 떨지 않습니다. 마실 까닭이 없는 자들이 먼저 취했을 뿐입니다."
      - choice:
          key: p_cup
          prompt: "왕이 잔을 든다. 지금 막을까?"
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          options:
            - text: "대신 마신다"
              goto: go_05_filial_cup
            - text: "상을 엎는다"
              add:
                power: 1
                suspicion: 2
              goto: cup_smash
            - text: "칠숙과 잔을 바꾼다"
              add:
                insight: 2
                nobles_support: -1
              goto: cup_swap
            - text: "지켜본다"
              goto: go_06_closed_mouth

  cup_smash:
    actions:
      - effect: shake
      - say:
          char: 칠숙.smile
          framing: bust
          text: "공주께서 전하의 상을 엎으셨군요. 목숨은 짧아도 왕실의 기억은 길지요."
      - say:
          char: 덕만.angry
          framing: bust
          text: "상은 다시 차리면 됩니다. 아버지는 다시 모실 수 없고요. 어느 쪽이 더 오래 남을지 보시지요."
      - goto: prologue_survive

  cup_swap:
    actions:
      - say:
          char: 칠숙.smile
          framing: bust
          with:
            - 덕만
          text: "전하의 잔을 신하에게 내리시다니. 오래 살면 이런 영광도 보는군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 칠숙
          delivery: deduction
          text: "순서가 바뀌었습니다. 그대가 오래 준비한 잔이니, 첫 모금도 그대 것이어야지요."
          wait: 650
      - effect: impact
      - say:
          delivery: nervous
          text: "칠숙의 미소가 채 사라지기 전, 잔을 나르던 악공이 혀를 깨물고 쓰러졌다."
      - goto: prologue_survive

  prologue_survive:
    actions:
      - effect: focus
      - say:
          delivery: sad
          text: "왕은 살았다. 대신 악공 하나가 죽었다. 그의 품에서는 덕만의 노리개가, 손톱 밑에서는 잔에 없던 검은 가루가 나왔다."
      - say:
          char: 덕만
          framing: closeup
          delivery: whisper
          text: "아버지를 죽일 독과 나를 죽일 증거를 한 손이 만들었어. 잔을 놓쳤으니, 이제 내 이름을 마시게 하겠지."
          wait: 800
      - get: black_powder
      - set:
          clue_black_powder: true
      - say:
          text: "프롤로그 완료 — 덕만은 아버지를 얻는 대신 안전을 잃었다."

  go_01_too_clever:
    actions:
      - gameOver:
          title: "운명 01 — 너무 영리한 공주"
          message: "덕만은 들은 문장을 한 글자도 틀리지 않았다. 다음 날 그 정확함이 공모의 증거가 되었다. 정답을 너무 빨리 말한 공주는 해 뜨기 전 처형되었다."
  go_02_broken_moon:
    actions:
      - gameOver:
          title: "운명 02 — 부러진 달"
          message: "기와는 비에 젖어 있었다. 덕만은 지붕 아래의 어둠으로 사라졌고, 궁은 실족이라 기록했다. 난간에는 붉은 매듭 한 올이 남았다."
  go_03_open_door:
    actions:
      - gameOver:
          title: "운명 03 — 열린 문"
          message: "왕의 침전으로 가는 문은 너무 쉽게 열렸다. 기다리던 칼은 덕만의 입을 먼저 막았다. 그날 밤 왕은 암살 계획을 끝내 듣지 못했다."
  go_04_guest_of_traitor:
    actions:
      - gameOver:
          title: "운명 04 — 반역자의 손님"
          message: "칠숙은 무릎 꿇고 충성을 맹세했다. 덕만이 돌아선 뒤 그 맹세는 체포 명령이 되었다. 공주는 스스로 적의 방에 들어간 첫 번째 왕족으로 남았다."
  go_05_filial_cup:
    actions:
      - gameOver:
          title: "운명 05 — 효녀 덕만"
          message: "덕만은 왕 대신 잔을 비웠다. 왕실은 효심을 칭송했으나, 그녀의 손톱 밑 검은 가루는 기록에서 지워졌다. 삼 년 뒤 왕위는 이름 없는 소년에게 돌아갔다."
  go_06_closed_mouth:
    actions:
      - gameOver:
          title: "운명 06 — 입을 다문 공주"
          message: "왕은 잔을 비우고 쓰러졌다. 덕만은 아무것도 하지 않았다는 이유로 살아남지 못했다. 침묵은 결백이 아니라 가장 값싼 공모가 되었다."
