chapterTitle: "모란이 피기 전에"

script:
  - scene: first_breath

scenes:
  opening_record:
    title: "먼저 쓰인 사망 기록"
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(210px, 28%, 420px)"
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          channel: thought
          with: []
          camera: wide
          when:
            not:
              var: opening_name_read
              op: eq
              value: true
          text: "내 이름 아래에 오늘 밤이라고 적혀 있다. 죽는 날이. 먹이 아직 젖어 있다."
      - say:
          channel: thought
          with: []
          camera: wide
          when:
            not:
              var: opening_name_read
              op: eq
              value: true
          text: "소화도 봤나? 아까부터 문 쪽만 보고 있다."
      - clearSticker:
          id: opening_death_register
          leave: fadeOut
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "전하께서 기다리십니다. 제 손 놓지 마셔요. 누가 부르거든 저부터 보시고요."
      - say:
          char: 어린 덕만
          camera: medium
          with: [소화]
          text: "아버지가? 아무한테도 얼굴 보이지 말라셨잖아."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "쉿. 제 곁에만 계셔요. 손 아프셔도 조금만 참으시고요."
      - goto: peony_arrives

  peony_arrives:
    actions:
      - say:
          channel: action
          text: "등 뒤에서 빗장이 떨어진다. 아버지는 모란 족자를 펴신다. 차가 식는데도 마시라는 말씀이 없다."
      - sticker:
          id: peony_painting_view
          image: peony_painting_sticker
          x: 50
          'y': 27
          width: clamp(180px, 22%, 360px)
          anchorX: center
          anchorY: center
          rotate: -1.5
          zIndex: 12
          enter: fadeIn
          inputLockMs: 320
      - get: peony_painting
      - char:
          id: 진평왕
          position: center
          enter:
            effect: fadeIn
            layout: push
            duration: 360
      - say:
          char: 진평왕
          camera: medium
          with:
            - 어린 덕만
          text: "가까이 오너라. 이 꽃을 보고 네 눈에 드는 것을 말해 보아라."
      - choice:
          key: c1_peony_observation
          prompt: "아버지는 꽃이 아니라 내 얼굴을 보고 계신다."
          char: 어린 덕만
          camera: medium
          with:
            - 진평왕
          options:
            - text: 꽃 사이의 빈자리를 훑는다
              goto: observe_absence
            - text: 족자를 들어 뒤축을 만진다
              goto: observe_back
            - text: 창밖으로 빠져나갈 곳을 찾는다
              set:
                observed_left_waterway: true
              goto: observe_waterway

  observe_absence:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - say:
          char: "어린 덕만.resolve"
          camera: "medium"
          with:
            - "진평왕"
          text: "벌이 없어요. 꽃은 이렇게 많이 그려 놓고, 나비도 한 마리 없고요."
      - say:
          char: "진평왕"
          camera: "medium"
          with:
            - "어린 덕만"
          text: "용케 보았구나. 그러면 그림 밖도 보아라."
      - say:
          char: "어린 덕만"
          camera: "medium"
          with:
            - "진평왕"
          text: "…조용해요. 아까 문밖에 서 있던 사람들은요?"
      - say:
          channel: action
          text: "찻잔에 손을 뻗자 소화가 내 손목을 붙든다. 소매를 잡아당기며 창 쪽으로 눈짓한다."
      - add:
          insight: 1
      - say:
          channel: thought
          text: "아버지 잔도 그대로야. 아까부터 한 모금도 안 드셨어."
          with: []
          camera: wide
          continueLabel: 창 아래로 몸을 낮춘다
      - goto: "observe_waterway"

  observe_back:
    actions:
      - bg:
          id: "peony_court"
          transition: "dissolve"
          duration: 720
      - clearSticker:
          id: "peony_painting_view"
          leave: "fadeOut"
      - say:
          channel: action
          text: "족자 뒤축에서 얇은 종이가 흘러내린다. 붉은 인장 아래, 조금 전 읽었던 이름이 다시 나타난다."
      - sticker:
          id: "death_register_view"
          image: "death_register_sticker"
          x: 51
          "y": 29
          width: "clamp(150px, 18%, 300px)"
          anchorX: "center"
          anchorY: "center"
          rotate: 2
          zIndex: 14
          enter: "fadeIn"
          inputLockMs: 320
      - get: "death_register"
      - say:
          channel: "record"
          delivery: "deduction"
          text: "왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장."
      - say:
          char: "어린 덕만.scared"
          camera: "medium"
          with:
            - "진평왕"
          text: "이건 아버지 도장이지요? 그런데 여기… 모서리가 없어요."
      - say:
          char: "진평왕.weak"
          camera: "medium"
          with:
            - "어린 덕만"
          text: "내 인장은 상한 데가 없다. 맨손으로 만지지 말고 소매로 집어라."
      - say:
          channel: action
          text: "문밖에서 쇠붙이가 긁힌다. 소화가 입술에 손가락을 댄다. 나는 소매로 종이 끝을 싸서 접는다."
      - clearSticker:
          id: "death_register_view"
          leave: "fadeOut"
      - add:
          evidence: 1
      - say:
          channel: thought
          text: "오른쪽 아래가 깨져 있어. 다른 데 찍힌 것도 이럴까?"
          with: []
          camera: wide
          continueLabel: 왕이 가리키는 창으로 간다
      - goto: "observe_waterway"

  observe_waterway:
    actions:
      - set:
          observed_left_waterway: true
      - say:
          camera: wide
          channel: action
          text: "창턱에 뺨을 대니 돌이 차다. 왼쪽 담 아래로 물소리가 새어 나온다. 들린 돌판 밑에 손 하나 들어갈 틈이 있다."
      - say:
          char: 어린 덕만
          camera: medium
          with:
            - 진평왕
          text: "저 담 밑으로 물이 나가요. 저도 빠져나갈 수 있을 것 같아요."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 어린 덕만
          text: "내가 꽃을 보라 했더니, 너는 나갈 길을 찾는구나."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with:
            - 진평왕
          text: "소화가 자꾸 문을 봐요. 저를 찾는 사람이 또 왔나 봐요."
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          'y': 28
          width: clamp(150px, 18%, 300px)
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - get: death_register
      - say:
          char: 진평왕.sad
          camera: medium
          with:
            - 어린 덕만
          text: "…그래. 네 이름으로 부고를 만든 자가 있다. 살아 있는 너를 두고."
      - say:
          channel: record
          delivery: deduction
          text: '왕실 족보 — 둘째 공주 덕만. 사망: 오늘 밤. 왕명에 따라 즉시 화장.'
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - goto: king_question

  king_question:
    actions:
      - clearSticker:
          id: peony_painting_view
          leave: fadeOut
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 어린 덕만, position: left }
      - char: { id: 진평왕, position: center }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "덕만아. 이 모란에 향기가 있겠느냐?"
      - choice:
          key: c1_answer_king
          prompt: "대답을 기다리는 아버지의 손이 잔 위에서 멎는다."
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          options:
            - text: "사라진 벌과 나비를 짚는다"
              set: { spoke_truth_to_king: true }
              goto: answer_scent
            - text: "사망 기록을 왕 앞에 펼친다"
              when: { var: death_register, op: eq, value: true }
              set: { spoke_truth_to_king: true }
              goto: answer_record
            - text: "그림만 보고는 모른다고 버틴다"
              goto: answer_literal

  answer_scent:
    actions:
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "없을 것 같아요. 향기가 났다면 벌이 찾아왔을 테니까요."
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "그림을 보낸 자는 내게 아들이 없음을 그리 조롱하는구나."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "허나 내겐 네가 있다. 남들이 비었다는 곳을 보는 네가."
      - goto: king_warning

  answer_record:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - sticker:
          id: death_register_answer
          image: death_register_sticker
          x: 50
          y: 28
          width: "clamp(150px, 18%, 300px)"
          anchorX: center
          anchorY: center
          rotate: 1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [진평왕]
          text: "이것부터 봐 주세요. 누가 저를 죽었다고 썼어요. 아버지 도장까지 찍어서."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "나는 그런 명을 내린 적 없다. 그 종이를 어디서…"
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [진평왕]
          text: "저를 보세요. 제가 여기 있잖아요. 아버지가 아니라고 해 주시면—"
      - say:
          char: 진평왕.weak
          camera: medium
          with: [어린 덕만]
          text: "덕만아, 손을 펴 보아라. 그 검은 것은… 놓아라! 어서!"
      - clearSticker:
          id: death_register_answer
          leave: fadeOut
      - say:
          channel: narration
          text: "왕이 종이를 쳐 냈다. 덕만은 떨어진 종이보다 아버지의 얼굴을 보았다. 무슨 말을 하려 했으나 혀가 굳었다. 손끝에서 번진 검은 빛이 소매 속으로 사라졌다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 왕실 금지 문서의 독성 인주에 중독되어 사망. 문서와 시신은 즉시 화장함."
      - gameOver:
          title: "운명 — 증거가 된 독"
          message: "소매에서 꺼낸 종이의 인주가 손에 묻었다. 진평왕은 딸의 이름을 거듭 불렀으나, 덕만은 끝내 대답하지 못했다."
          recoverToChoice: c1_answer_king

  answer_literal:
    actions:
      - bg: { id: peony_court, transition: dissolve, duration: 720 }
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "그림인데요. 냄새를 맡아 볼 수도 없잖아요."
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "그리 말하면 마음은 편하겠구나. 나도 여태 보지 않은 것이 많았다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만, 진평왕]
          text: "전하. 문밖에 약탕을 든 아이가… 제가 보낸 아이가 아니옵니다."
      - say:
          channel: narration
          text: "소화가 잔을 빼앗았다. 덕만은 입안에 남은 쓴맛을 삼키려 했다. 아버지가 일어서는데, 방바닥이 먼저 기울었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 진료 기록 — 둘째 공주 덕만, 급작스러운 열병으로 사망. 독물 흔적 없음."
      - gameOver:
          title: "운명 — 모른 척한 사이"
          message: "낯선 시종이 두고 간 차였다. 소화는 잔을 깨뜨렸고 왕은 의원을 불렀다. 덕만에게는 두 소리가 모두 먼 데서 들렸다."

  king_warning:
    actions:
      - music: sealed_court
      - char: { id: 진평왕, position: center }
      - char: { id: 어린 덕만, position: left }
      - char: { id: 소화, position: right }
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "너희가 태어났을 때부터였다. 저들은 천명 곁에 서거나, 네 곁에 서겠다 했지."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "그래서 나를 숨겼어요? 언니한테도 못 가게 하고?"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [어린 덕만]
          text: "네 얼굴을 모르면 해치지도 못할 줄 알았다. 내가… 그리 어리석었어."
      - say:
          char: 어린 덕만
          camera: medium
          with: [진평왕]
          text: "그럼 이제는요? 오늘 밤에도 여기 숨어 있어야 해요?"
      - say:
          char: 진평왕
          camera: medium
          with: [어린 덕만]
          text: "아니다. 오늘은 나가야 한다. 너를 붙들어 둔 아비 말고, 소화 말을 듣거라."
      - say:
          char: 소화.nervous
          camera: medium
          with: [진평왕, 어린 덕만]
          text: "전하, 서쪽 처마에서 기름 냄새가 납니다. 아까는 없던 냄새입니다."
      - say:
          char: 진평왕
          camera: medium
          with: [소화, 어린 덕만]
          text: "소화야. 이 아이를 데려가라. 어서."
      - goto: fire_breaks

  fire_breaks:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - music: sealed_court
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - char: { id: 칠숙, position: center, emotion: smile, enter: { effect: fadeIn, layout: push, duration: 360 } }
      - say:
          channel: action
          camera: medium
          text: "들보가 갈라지는 소리에 귀가 먹먹하다. 소화의 손이 나를 잡아끈다. 아버지가 계시던 자리가 불빛에 가린다."
      - say:
          channel: action
          text: "문 하나가 닫힌다. 또 하나. 연기 저편에서 걸어오는 사람은 기침도 하지 않는다. 칠숙이다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "공주께서는 열병으로 돌아가셨습니다. 소신은 시신을 수습하러 왔고요."
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [칠숙]
          text: "나 여기 있어. 보고 있잖아!"
      - say:
          char: 칠숙
          camera: medium
          with: [어린 덕만]
          text: "그러니 곤란하지요. 전하의 인장까지 찍힌 문서인데."
      - say:
          channel: action
          text: "칠숙의 엄지 아래로 칼날이 드러난다. 소화가 내 앞에 선다. 돌아선 어깨가 시야를 다 가린다."
      - attack:
          attacker: 칠숙
          target: 소화
          from: right
          style: slash
          image: chilsuk_sword_cutin
          strength: light
          anticipation: 680
          recovery: 740
          caption: "칼집에서 쇠가 긁히는 소리."
      - say:
          channel: action
          wait: 300
          unskippable: true
          text: "소화의 소매가 찢어진다. 나는 맨살이 드러난 손목을 붙든다. 자꾸 미끄러진다. 더 세게 쥔다."
      - char: { id: 소화, position: center, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "숙이셔요. 입은 닫고요. 저만 따라오시면 됩니다."
      - say:
          channel: action
          text: "소화가 내 손바닥에 모란패를 밀어 넣는다. 달아오른 금속이 살에 달라붙는다. 아파도 펼 수가 없다."
      - sticker:
          id: peony_token_view
          image: peony_token_sticker
          x: 49
          y: 31
          width: "clamp(104px, 12%, 180px)"
          anchorX: center
          anchorY: center
          zIndex: 15
          enter: fadeIn
          inputLockMs: 300
      - get: peony_token
      - say:
          char: 소화
          camera: medium
          with: [어린 덕만]
          text: "북문은 이 패로 열 수 있습니다. 다만 문지기 눈에 얼굴이 남을 겁니다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "손 놓지 마셔요. 제가 무슨 소리를 해도… 오늘은 고집 좀 부리셔요."
      - clearSticker:
          id: peony_token_view
          leave: fadeOut
      - choice:
          key: c1_fire_escape
          prompt: "소화의 손이 미끄러진다. 나갈 곳을 찾아야 한다."
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          timeoutMs: 5500
          timeoutOptionIndex: 2
          options:
            - text: "모란패를 치켜들고 북문을 연다"
              add: { nobles_support: 1, fear: 1 }
              goto: escape_north_gate
            - text: "기록을 품고 불길 너머 왕에게 간다"
              when:
                all:
                  - { var: death_register, op: eq, value: true }
                  - { var: spoke_truth_to_king, op: eq, value: true }
              goto: escape_with_record
            - text: "모란 화단에 엎드려 불길을 피한다"
              goto: bad_smoke
            - text: "소화의 손을 잡고 배수로로 뛴다"
              when: { var: observed_left_waterway, op: eq, value: true }
              goto: escape_waterway

  escape_waterway:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right }
      - say:
          channel: action
          camera: medium
          text: "왼쪽 담. 아까 그 돌판이다. 손톱 밑으로 모래가 파고든다. 돌이 들리자 젖은 흙냄새가 얼굴에 끼친다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "먼저 들어가셔요. 돌을 받치고 있겠습니다."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          text: "싫어. 손 줘. 나만 보내려고 하지 마."
      - say:
          channel: action
          text: "무릎부터 진흙에 박힌다. 뒤에서 무너지는 소리에 몸이 움츠러든다. 붙잡은 손이 한 번, 꼭 쥐어 온다."
      - say:
          char: 소화
          camera: medium
          with: [어린 덕만]
          text: "…다치신 데는요? 아기씨, 저 좀 보셔요."
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          wait: 600
          unskippable: true
          text: "괜찮아. 소화도 있잖아. 우리… 일단 멀리 가자."
      - say:
          channel: thought
          text: "숨이 들어온다. 아프게, 자꾸 들어온다. 나는 아직 여기 있다. 내 죽음에 붉은 인장을 찍은 손도, 아직 어딘가에 있을 것이다."
          with: []
          camera: wide
          continueLabel: 소화의 손을 잡고 국경으로 향한다
      - say:
          channel: record
          delivery: calm
          text: "그날 밤 별궁에서 둘째 공주가 죽었다고 기록되었다. 성 밖 물가에서는 아이 하나가 유모의 젖은 옷자락을 놓지 않았다."
      - set: { c1_escape_route: waterway, identity_exposed: false }
      - add: { sohwa_trust: 2, people_support: 1, insight: 1 }
      - goto: /1.yaml

  escape_north_gate:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          camera: wide
          channel: narration
          text: "모란패를 본 문지기가 빗장을 들었다. 반쯤 열린 문 너머로 말의 코김이 희게 번졌다. 기다리고 있던 기병은 길을 비키지 않았다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "서셔요. 저 말들… 고삐를 쥔 채 기다리고 있습니다."
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          text: "소화, 문이 닫혀. 우린 아직 못 나갔는데."
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [어린 덕만, 소화]
          text: "패를 보여 주셨다지요. 덕분에 소신이 문을 잘 찾아왔습니다."
      - say:
          channel: narration
          delivery: nervous
          text: "칠숙이 손을 내렸다. 소화가 덕만을 품에 끌어안았다. 문 위에서 활시위 당기는 소리가 겹쳤다."
      - attack:
          attacker: 칠숙
          target: 어린 덕만
          from: right
          style: shot
          image: chilsuk_bow_cutin
          anticipation: 850
          impact: 140
          recovery: 900
          caption: "머리 위에서 활시위가 놓였다."
      - say:
          channel: narration
          delivery: nervous
          wait: 450
          unskippable: true
          text: "모란패가 돌바닥을 굴렀다. 덕만은 그것을 주우려 몸을 기울였다. 소화의 팔이 놓이지 않았다. 더는 힘이 들어가지도 않았다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "북문 당직 기록 — 화재 중 침입한 신원 미상 여인 둘을 사살함. 왕실 모란패 회수."
      - gameOver:
          title: "운명 — 문을 연 표식"
          message: "문을 열어 준 모란패를 문지기가 거두어 갔다. 덕만과 소화는 북문 밖으로 한 걸음도 나가지 못했다."

  escape_with_record:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: resolve }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "아버지께 가야 했다. 덕만은 소화의 팔을 끌어 문서 통로로 뛰었다. 침전 쪽 문틈으로 불빛이 새고 있었다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "잠겼습니다! 아기씨, 뒤로 오셔요. 종이는 두고요!"
      - say:
          char: 어린 덕만.resolve
          camera: medium
          with: [소화]
          text: "아버지! 저 안 죽었어요! 여기 좀 열어 주세요!"
      - say:
          channel: narration
          text: "문틈에 밀어 넣은 종이가 반쯤 걸렸다. 덕만이 다시 문을 두드리는 사이, 뒤편에서 서까래가 내려앉았다. 소화는 아이의 입과 코를 제 소매로 덮었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 수습 기록 — 침전 아래 통로에서 둘째 공주 덕만과 유모 소화의 시신 발견. 위조 사망 기록은 전소함."
      - gameOver:
          title: "운명 — 불길 안으로 가져간 증거"
          message: "문 너머에서는 대답이 없었다. 덕만은 마지막까지 문에 손을 대고 있었다. 소화가 그 손 위에 제 손을 포갰다."
          recoverToChoice: c1_fire_escape

  bad_smoke:
    actions:
      - bg: { id: burning_palace, transition: dissolve, duration: 720 }
      - camera: { shot: close, target: 어린 덕만 }
      - effect: embers
      - char: { id: 어린 덕만, position: left, emotion: scared }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "화단의 흙이 서늘했다. 덕만이 얼굴을 묻자 꽃뿌리 사이에서 기름 냄새가 올라왔다. 소화가 일으켜 세우기도 전에, 가장자리를 따라 불이 달렸다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [어린 덕만]
          text: "눈 뜨셔요. 여기 제 손 있지요? 잡으셔야지요!"
      - say:
          char: 어린 덕만.scared
          camera: medium
          with: [소화]
          text: "소화… 꽃에서도 불이 나."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "별궁 화재 보고 — 열병으로 죽은 둘째 공주 덕만의 시신과 유모 소화가 불에 타 신원을 다시 확인할 수 없음."
      - gameOver:
          title: "운명 — 먼저 준비된 죽음"
          message: "담으로 가는 길이 무너진 들보에 막혔다. 소화는 아이를 안고 화단을 벗어나려 했으나 불길이 더 빨랐다."

  first_room_look:
    actions:
      - choice:
          key: first_room_look
          presentation: explore
          prompt: "종이 위의 내 이름. 문밖에서 멎은 발소리."
          with: []
          camera: wide
          options:
            - text: 종이의 내 이름
              at:
                x: 28
                "y": 40
              when:
                not:
                  var: opening_name_read
                  op: eq
                  value: true
              goto: first_read_name
            - text: 닫힌 문
              at:
                x: 74
                "y": 68
              when:
                not:
                  var: opening_door_heard
                  op: eq
                  value: true
              goto: first_hear_door
            - text: 소화에게 종이를 가리킨다
              when:
                var: opening_name_read
                op: eq
                value: true
              goto: opening_record


  first_read_name:
    actions:
      - say:
          channel: record
          with: []
          camera: wide
          text: '둘째 공주 덕만. 사망: 오늘 밤.'
      - say:
          channel: thought
          with: []
          text: "오늘 밤? 아직 밤이 오지도 않았는데."
      - set:
          opening_name_read: true
      - goto: first_room_look

  first_hear_door:
    actions:
      - say:
          channel: action
          with: []
          text: "문틈에 귀를 붙인다. 누군가 바로 너머에 있다. 숨을 죽이자 바깥에서 쇠고리 걸리는 소리가 난다."
      - say:
          channel: thought
          with: []
          text: "왜 밖에서 잠그지? 안에 사람 있다고 말할까…"
      - set:
          opening_door_heard: true
      - goto: first_room_look

  first_breath:
    title: "내 이름 옆의 두 글자"
    actions:
      - bg:
          id: peony_court
          transition: dissolve
          duration: 720
      - music: sealed_court
      - sticker:
          id: opening_death_register
          image: death_register_sticker
          x: 50
          'y': 28
          width: clamp(210px, 28%, 420px)
          anchorX: center
          anchorY: center
          rotate: -1
          zIndex: 14
          enter: fadeIn
          inputLockMs: 320
      - say:
          camera: wide
          channel: action
          wait: 600
          unskippable: true
          text: "촛농이 종이 가장자리에 떨어진다. 혼날까 봐 밀어 놓으려다 손을 멈춘다. 내 이름이다. 그 옆에는…"
          with: []
      - goto: first_room_look
