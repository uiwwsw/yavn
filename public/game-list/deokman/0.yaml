          text: "이 노리개는 네 것이냐?"
      - say:
          char: 덕만
          camera: medium
          delivery: whisper
          text: "제 것입니다. 누가 훔쳤습니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "아버지를 죽이고, 제 죄로 만들려 했어요."
          wait: 800
      - say:
          char: 진평왕.sad
          camera: medium
          text: "아비는 널 믿는다."
      - say:
          char: 진평왕.sad
          camera: close
          with:
            - 덕만
          text: "왕은 증거를 요구해야 한다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "사흘만 주십시오."
      - say:
          char: 덕만.sad
          camera: close
          with:
            - 진평왕
          text: "제 이름의 독부터 닦겠습니다."
