      - say:
          with: [덕만]
          text: "마지막 기와가 깨졌다."
      - effect: darken
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: close
          with: []
          text: "비에 젖어 미끄러졌다고 적으십시오."
          wait: 650
      - gameOver:
          title: "운명 02 — 젖은 기와"
          message: "덕만은 궁 복도 아래로 떨어졌다. 궁은 사고라 발표했고, 붉은 실은 날이 밝기 전에 사라졌다."
