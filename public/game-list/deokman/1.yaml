script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제1장 — 범인은 내 이름을 알고 있다"
      - say:
          char: 진평왕
          with:
            - 덕만
          text: "사흘 안에 네 결백을 증명해라. 나흘째에는 왕도 아버지도 너를 지킬 수 없다."
      - say:
          char: 덕만
          text: "저를 모함한 사람은 제가 어디로 갈지도 알고 있습니다. 그렇다면 처음부터 틀린 곳으로 가야겠군요."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "가장 먼저 어디를 조사할까?"
          char: 덕만
          options:
            - text: "독보다 잔을 만진 손이 많은 왕실 부엌"
              add:
                insight: 1
              goto: investigate_kitchen
            - text: "출입 명단이 바뀐 기록고"
              add:
                insight: 1
                suspicion: 1
              goto: investigate_archive
            - text: "병력을 움직일 수 있는 호위부부터 공개 심문한다"
              goto: go_07_guard_revolt
            - text: "문을 잠그고 내 방에서 증거가 나타나길 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: princess_chamber
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          with:
            - 덕만
          text: "독은 술에 없었어요. 잔을 닦은 천에 있었습니다. 공주님 손에 묻히도록요."
      - say:
          char: 덕만
          with:
            - 소원
          text: "나를 죽일 독이 아니라, 내 이름을 죽일 독이었구나."
      - add:
          sowon_trust: 1
      - goto: rumor_choice

  investigate_archive:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담
          with:
            - 덕만
          text: "명단을 고친 사람은 서툴렀습니다. 먹은 새것인데 붓은 오래된 관리의 것이죠."
      - say:
          char: 덕만
          with:
            - 비담
          text: "서툰 흔적을 남길 만큼 영리한 사람이라. 그대처럼 마음에 들지 않는군요."
      - add:
          bidam_trust: 1
      - goto: rumor_choice

  rumor_choice:
    actions:
      - say:
          char: 비담
          text: "범인이 우리를 보고 있다면, 보고 싶은 것을 보여 주면 됩니다. 어떤 거짓말을 먹이시겠습니까?"
      - choice:
          key: c1_rumor
          prompt: "범인을 끌어내기 위해 어떤 소문을 흘릴까?"
          char: 덕만
          with:
            - 비담
          options:
            - text: "검은 가루가 백제 상인의 물건으로 밝혀졌다고 한다"
              add:
                insight: 1
              goto: rumor_baekje
            - text: "왕이 이미 회복해 범인의 이름을 말했다고 한다"
              add:
                power: 1
              goto: rumor_king
            - text: "덕만에게 살아 있는 목격자가 있다고 한다"
              add:
                suspicion: 1
                sowon_trust: -1
              goto: rumor_witness
            - text: "왕이 덕만을 후계자로 지명했다는 소문을 낸다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - say:
          text: "소문이 돌자, 국산의 하인이 국경 상단 장부를 훔치려다 붙잡혔다."
      - say:
          char: 덕만
          text: "거짓말은 거짓말을 믿은 사람보다, 두려워한 사람을 가리키는군."
      - goto: evidence_choice

  rumor_king:
    actions:
      - say:
          text: "왕의 침전 앞에 문병객이 몰렸다. 오지 않은 사람의 이름이 오히려 선명했다."
      - add:
          legitimacy: 1
      - goto: evidence_choice

  rumor_witness:
    actions:
      - say:
          char: 소원
          text: "살아 있는 목격자라니, 다들 저를 보더군요. 다음에는 거짓말에도 이름을 붙여 주세요."
      - say:
          char: 덕만
          text: "미안하다. 그래서 네가 살아 있는 동안 끝내겠다."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - say:
          text: "사흘째 새벽, 덕만은 바뀐 출입 명단과 독 묻은 천, 도망치다 붙잡힌 하인을 한자리에 모았다."
      - choice:
          key: c1_evidence
          prompt: "얻은 증거를 어떻게 사용할까?"
          char: 덕만
          options:
            - text: "왕에게만 증거를 보이고 공개 재판은 미룬다"
              add:
                legitimacy: 2
              goto: evidence_king
            - text: "하인을 풀어 주는 대신 배후에게 거짓 보고를 시킨다"
              add:
                insight: 2
                power: 1
                suspicion: 1
              goto: evidence_reverse
            - text: "화백회의에서 국산을 암살 배후로 즉시 지목한다"
              goto: go_10_right_without_proof
            - text: "누명을 끝내기 위해 증거를 모두 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - say:
          char: 진평왕
          text: "네 결백은 알겠다. 하지만 배후를 못 잡은 결백은 다음 칼을 막지 못한다."
      - say:
          char: 덕만
          text: "다음 칼이 오는 방향은 알게 되었습니다."
      - goto: chapter1_end

  evidence_reverse:
    actions:
      - say:
          char: 비담
          text: "공주께서는 적을 잡는 대신 적의 편지를 받아 보시는군요."
      - say:
          char: 덕만
          text: "잡힌 손은 한 번만 쓸 수 있지만, 믿고 있는 손은 계속 움직이니까."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - effect: focus
      - say:
          text: "덕만은 누명을 벗었다. 배후는 놓쳤지만, 하인의 품에서 다음 계획을 발견했다."
      - say:
          char: 덕만
          text: "덕만공주 혼인에 관한 합의서. 죽이는 데 실패하니 이제 아내로 만들려는군."
      - get: marriage_pact
      - set:
          clue_marriage_pact: true
      - say:
          text: "제1장 완료 — 덕만은 결백을 얻는 대신, 혼인을 거부할 자유를 잃었다."

  go_07_guard_revolt:
    actions:
      - gameOver:
          title: "운명 07 — 충성의 칼"
          message: "덕만은 호위부를 한꺼번에 의심했다. 그날 밤 그녀를 지킬 병사는 아무도 보초에 서지 않았다. 충성을 시험한 공주는 충성이 사라진 자리에서 죽었다."
  go_08_waiting_room:
    actions:
      - gameOver:
          title: "운명 08 — 기다리는 사람"
          message: "증거는 나타나지 않았고 문밖의 증인만 하나씩 사라졌다. 사흘째 아침 문이 열렸을 때, 덕만은 결백을 말할 사람도 들을 사람도 없었다."
  go_09_false_heir:
    actions:
      - gameOver:
          title: "운명 09 — 가짜 왕명"
          message: "후계자 지명 소문은 왕의 권위를 훔친 죄가 되었다. 암살범보다 먼저 잡힌 것은 소문을 만든 공주였다. 국산은 재판에서 가장 슬픈 얼굴로 유죄를 청했다."
  go_10_right_without_proof:
    actions:
      - gameOver:
          title: "운명 10 — 정답을 맞힌 죄인"
          message: "국산이 배후라는 추리는 옳았다. 하지만 옳은 말과 증명된 말은 궁에서 서로 다른 목숨값을 가졌다. 덕만은 정답을 남기고 처형되었다."
  go_11_innocent_exile:
    actions:
      - gameOver:
          title: "운명 11 — 죄 없는 죄인"
          message: "증거가 사라지자 죄도 사라진 듯 보였다. 그러나 결백을 증명할 것도 함께 사라졌다. 덕만은 살아서 궁을 나갔고, 다시는 왕위 가까이 돌아오지 못했다."
