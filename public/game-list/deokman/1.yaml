script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제1장 — 범인은 내 이름을 알고 있다"
      - say:
          with:
            - 진평왕
            - 덕만
          delivery: calm
          text: "연회 다음 날 · 아침. 칠숙이 죽은 연주자의 소매를 귀족 회의인 화백 앞에서 털었습니다. 핏자국 사이로 덕만의 연꽃 노리개가 굴러 나와 왕좌 아래에서 멈췄습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 진평왕
            - 덕만
          text: "죽은 자는 변명하지 못합니다. 그래서 산 사람의 이름을 품에 넣기 좋지요. 전하께서 공주를 믿으신다면, 오늘은 부정이 아니라 증거로 믿어 주셔야 합니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "매듭이 다릅니다. 제 것은 소원이 두 번 감아 묶습니다. 저 노리개는 한 번뿐이에요. 누군가 제 모양만 보고 흉내 냈습니다."
      - say:
          char: 진평왕
          camera: medium
          with:
            - 덕만
            - 칠숙
          text: "화백은 사흘 뒤 다시 열린다. 그때까지 이 노리개가 네 것이 아니라는 말보다, 죽은 자의 품에 누가 넣었는지를 가져오너라."
      - say:
          char: 진평왕
          camera: wide
          with:
            - 덕만
          text: "그동안 궁문은 닫겠다. 너를 가두기 위해서가 아니라, 네 이름을 숨긴 자가 먼저 빠져나가지 못하게 하기 위해서다."
      - say:
          char: 덕만
          camera: medium
          text: "아버지도 제가 범인일 수 있다고 생각하십니까?"
      - say:
          char: 진평왕.sad
          camera: medium
          with:
            - 덕만
          text: "네가 아니라는 건 안다. 하지만 내가 안다는 사실은 네 결백이 아니다. <speed=21>아비의 믿음이 딸에게 가장 약한 증거라니, 왕 노릇이 참 고약하구나.</speed>"
      - say:
          char: 덕만
          camera: close
          with:
            - 진평왕
          text: "그럼 왕을 설득할 증거를 가져오겠습니다. 그때는 아버지가 제 말을 들어 주세요."
      - say:
          char: 진평왕
          camera: medium
          text: "<speed=20>반드시 살아서 돌아와라.</speed> <speed=18>네가 없는 왕좌는 내게 아무 소용이 없다.</speed> <speed=20>혼자 움직이지 마라.</speed>"
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "보세요. 제가 묶은 노리개는 실 끝을 옷 안으로 숨겨요. 가짜는 밖으로 삐져나왔어요. 부엌 행주에도 똑같은 검은 실이 붙어 있었고요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "사람 얼굴보다 옷 솔기부터 기억하는 건 여전하구나. 행주를 만진 사람은 찾았어?"
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "아직요. 대신 공주님 옷을 열두 해나 손본 사람에게 가짜 매듭은 못 속여요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "열두 해나 손봤는데도 오른쪽 소매는 자꾸 길어."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
          text: "소매가 긴 게 아니라 공주님이 왼팔만 급하게 쓰는 거예요. 가만히 좀 계셔야 맞추죠."
      - char:
          id: 유신
          position: center
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "연회 호위 명단입니다. 비어 있던 자리는 셋인데 기록에는 전원 근무했다고 적혔습니다. 병사 얼굴과 장부가 서로 다른 말을 합니다."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
            - 유신
          text: "장군님은 사람 셋이 비었다고 하시지만, 저는 옷이 하나 남았다고 봤어요. 주인 없는 호위복이 부엌 뒤에서 젖고 있었습니다."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
            - 소원
          text: "옷이 혼자 연회장까지 걸어가진 않았을 겁니다. 그 호위복부터 보겠습니다."
      - say:
          char: 소원
          camera: medium
          with:
            - 덕만
            - 유신
          text: "가져가셔도 되는데 소매는 자르지 마세요. 높은 분들은 증거만 보면 꼭 천부터 망치더라고요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "내 문을 지키라고 뽑은 장수가, 이번에는 그 문 안의 나부터 의심해야겠군요."
      - say:
          char: 유신
          camera: close
          with:
            - 덕만
          text: "그래야 끝까지 공주님을 지킬 수 있습니다. 제 병사라도 숫자가 틀리면 제가 먼저 묻겠습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 유신
          text: "눈이 빨갛습니다. 어젯밤에 잠은 잤습니까?"
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "한숨 잤습니다. 두숨부터는 사건이 끝난 뒤에 자겠습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "문을 잠그라는 왕의 명령은 들었습니다. 그래서 창문으로 왔습니다. 그리고 장군님, 부엌 뒤 호위복은 벌써 없어졌습니다. 누가 우리보다 반 걸음 빠르군요."
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
            - 비담
          text: "그걸 보고도 잡지 않았습니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
            - 유신
          text: "잡으면 한 사람이고, 따라가면 한 무리입니다. 저는 숫자를 크게 세는 편이라서요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "훔친 문서로 내 결백을 사라고요?"
      - say:
          char: 비담.smirk
          camera: close
          with:
            - 덕만
          text: "아니요. 누군가 방금 우리가 입을 맞추기도 전에 흔적 하나를 지웠습니다. 이제 공주님이 먼저 움직였다는 사실만 저쪽에 보여 주면 됩니다. 어디를 건드릴지는 직접 고르시죠."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "첫 단서를 어디서 찾을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "부엌을 뒤진다"
              add:
                insight: 1
              goto: investigate_kitchen
            - text: "기록 창고를 뒤진다"
              add:
                insight: 1
                suspicion: 1
              goto: investigate_archive
            - text: "호위 막사를 조사한다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.nervous
          camera: wide
          with:
            - 덕만
          text: "술독이랑 국자, 잔은 냄새가 다 같아요. 그런데 이 행주만 달라요. 공주님 자리를 닦은 뒤부터 검은 가루가 묻어났대요."
      - say:
          char: 덕만
          camera: close
          with:
            - 소원
          delivery: whisper
          text: "누가 이걸 썼는지 본 사람은?"
      - say:
          char: 소원.nervous
          camera: medium
          with:
            - 덕만
          text: "없어요. 다들 못 봤다고 해요. 너무 똑같이 말해서 오히려 수상할 만큼요."
      - say:
          char: 덕만
          camera: medium
          with:
            - 소원
          text: "이 가루는 술에 넣으려고 가져온 게 아니야. 내 손에 묻혀서, 내가 잔을 건넨 것처럼 보이게 하려던 거야. 행주는 숨겨 둬. 네가 찾았다는 것도 아직 말하지 말고."
      - say:
          char: 소원
          camera: medium
          text: "네. 그런데 공주님, 저한테까지 숨기지는 마세요. 무서운 건 같이 무서워해야 덜 무서우니까."
      - add:
          sowon_trust: 1
      - goto: rumor_choice

  investigate_archive:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "먹물은 오늘 갈았는데, 붓은 삼 년 전에 죽은 관리의 물건이군요. 일부러 그 사람 필체를 흉내 냈습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "누가 쓴 건지 알겠습니까?"
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "알았으면 값을 먼저 불렀겠지요. 다만 이 글씨는 너무 서툽니다. 들키지 않으려는 사람이 아니라, 공주님이 발견해 주길 바란 사람이 썼습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "나를 기록 창고로 부른 거군요. 그럼 부른 사람에게 내가 왔다고 알려 줍시다."
      - say:
          char: 비담.smirk
          camera: medium
          text: "그런 표정으로 말씀하시니, 제가 공주님 편이 된 것처럼 들립니다. 아직은 아닙니다."
      - say:
          char: 덕만
          camera: medium
          text: "아직은, 이라고 했군요. 충분합니다."
      - add:
          bidam_trust: 1
      - goto: rumor_choice

  rumor_choice:
    actions:
      - say:
          with:
            - 덕만
          delivery: calm
          text: "첫째 날 · 해 질 무렵. 덕만의 방문은 왕의 명령으로 잠겨 있었고, 낮 동안 모은 단서는 아직 범인의 이름을 가리키지 못했습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: wide
          with:
            - 덕만
          text: "아까 같은 거짓말을 두 나인에게 건넸습니다. 한 사람은 웃었고, 다른 사람은 곧장 칠숙의 방으로 뛰었습니다. 소문은 믿는 사람보다 고치려는 사람을 더 빨리 찾아냅니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "내 편이라서 가르쳐 주는 건 아니겠지요."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "칠숙에게는 공주님이 겁먹었다고 팔았습니다. 공주님께는 칠숙이 그 말을 사고 싶어 했다고 파는 중이고요. 어느 쪽이 더 재미있는지는 아직 고르지 않았습니다."
      - say:
          char: 비담.smirk
          camera: medium
          text: "궁 안에 귀가 너무 많습니다. 아무 말도 안 하면 저쪽에서 먼저 이야기를 만들 겁니다."
      - say:
          char: 비담.smirk
          camera: medium
          with:
            - 덕만
          text: "소원은 손에 남은 흔적을 보고, 유신공은 발이 움직인 자리를 봅니다. 저는 거짓말을 들은 사람이 어디로 달려가는지 보지요. 그 일이라면 저를 쓰십시오."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "그럼 우리가 먼저 틀린 이야기를 들려주죠. 누가 급히 고치려 드는지 보면 됩니다."
      - say:
          char: 비담.smirk
          camera: medium
          text: "좋습니다. 오늘은 어떤 거짓말을 사실처럼 말해 볼까요?"
      - choice:
          key: c1_rumor
          prompt: "어떤 소문으로 덫을 놓을까?"
          char: 덕만
          camera: close
          with:
            - 비담
          options:
            - text: "백제 상인 탓이라 한다"
              add:
                insight: 1
              goto: rumor_baekje
            - text: "왕이 범인을 봤다 한다"
              add:
                power: 1
              goto: rumor_king
            - text: "목격자가 살아 있다 한다"
              add:
                suspicion: 1
                sowon_trust: -1
              goto: rumor_witness
            - text: "후계 지명을 꾸민다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - say:
          text: "백제 상인이 독을 들여왔다는 소문은 반나절 만에 궁을 돌았습니다. 그날 밤, 칠숙의 하인이 국경 상단 장부를 품고 담을 넘다가 붙잡혔습니다."
      - say:
          char: 덕만
          camera: medium
          text: "소문을 믿었다면 숨어 있었겠지. 장부를 들고 달아난 건 들킬 게 있다는 뜻이야. 그 하인부터 데려와."
      - say:
          char: 비담.smirk
          camera: medium
          text: "소문은 틀렸는데, 도망친 사람은 제대로 골랐군요. 가끔은 거짓말도 발이 빠릅니다."
      - goto: evidence_choice

  rumor_king:
    actions:
      - char:
          id: 진평왕
          position: right
      - say:
          text: "왕이 범인의 얼굴을 보았다는 소문이 퍼지자 문병객이 줄을 섰습니다. 평소 가장 먼저 오던 세 사람만 모습을 보이지 않았습니다."
      - say:
          char: 진평왕
          camera: medium
          text: "내가 보았다는 얼굴을, 정작 나는 모르고 있구나."
      - say:
          char: 덕만
          camera: medium
          text: "아버지가 누굴 보았는지는 중요하지 않습니다. 아버지가 봤다고 믿고 숨은 사람이 중요합니다. 세 사람의 집을 지켜봐 주세요."
      - add:
          legitimacy: 1
      - goto: evidence_choice

  rumor_witness:
    actions:
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.angry
          camera: medium
          text: "목격자가 살아 있다고 소문내셨죠? 그 말을 듣자마자 다들 제 얼굴을 봤어요. 왜 저한테는 먼저 말하지 않으셨어요?"
      - say:
          char: 덕만.sad
          camera: medium
          text: "네가 반대할까 봐. 반대하면 내가 결심을 못 할까 봐 말하지 않았어. 미안해."
      - say:
          char: 소원.angry
          camera: close
          text: "미안하다는 말보다 먼저 저를 숨겨 주세요. 사과는 둘 다 살아남고 나서 들을게요."
      - say:
          char: 덕만.sad
          camera: medium
          text: "그래. 오늘 해 지기 전까지 네 이름을 이 소문에서 빼낼게. 이번에는 네 허락부터 받겠다."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - say:
          with:
            - 덕만
          delivery: calm
          text: "사흘째 · 새벽. 붙잡힌 하인이 덕만 앞에 무릎을 꿇었습니다. 품에서는 바뀐 명단이, 손톱 밑에서는 행주와 같은 검은 가루가 나왔습니다. 문밖에서는 귀족 회의를 알리는 북이 울렸습니다."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with:
            - 덕만
          text: "전하께서는 공주님 한 사람만 들이라는 패를 보내셨습니다. 하인은 제가 지킬 수 있습니다. 다만 풀어 미행하라 하시면, 칠숙의 칼이 저보다 먼저 닿을 수 있습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with:
            - 덕만
          text: "공주께서 잡은 하인은 제 사람이 아니라고 울고 있더군요. 귀족들 앞에 세우시겠습니까? 살아서 입을 열기 전에 누구 사람인지부터 결정될 겁니다."
      - say:
          char: 덕만
          camera: close
          with:
            - 칠숙
          text: "그 사람은 그대 이름을 말하면 죽고, 말하지 않으면 제 이름으로 죽겠지요. 사람 하나를 증거로만 보는 쪽이 이기는 판이라면, 판부터 바꾸겠습니다."
      - choice:
          key: c1_evidence
          prompt: "증거를 어떻게 쓸까?"
          char: 덕만
          camera: close
          with:
            - 칠숙
          options:
            - text: "왕에게만 보인다"
              add:
                legitimacy: 2
              goto: evidence_king
            - text: "하인을 거짓 전령으로 쓴다"
              add:
                insight: 2
                power: 1
                suspicion: 1
              goto: evidence_reverse
            - text: "칠숙을 공개 지목한다"
              goto: go_10_right_without_proof
            - text: "모두 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - char:
          id: 진평왕
          position: right
      - say:
          char: 진평왕.sad
          camera: medium
          text: "이 정도면 네가 독을 넣지 않았다는 사실은 밝힐 수 있다. 제발 여기서 멈추면 안 되겠느냐? 나는 또 너를 잃을까 무섭다."
      - say:
          char: 덕만
          camera: medium
          text: "<speed=22>제가 멈추면 다음에는 다른 사람이 누명을 쓰고 죽습니다.</speed> <speed=20>그건 싫어요. 하인에게 명령한 사람까지 찾겠습니다.</speed>"
      - say:
          char: 진평왕.sad
          camera: medium
          text: "그러다 네가 정말 죽을 수도 있다."
      - say:
          char: 덕만
          camera: close
          text: "사흘 전에도 죽을 뻔했습니다. 이번에는 적어도 누구 손인지 알고 피하고 싶습니다."
      - goto: chapter1_end

  evidence_reverse:
    actions:
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          text: "붙잡은 하인을 그냥 풀어 주셨군요. 칠숙이 그를 믿을까요?"
      - say:
          char: 덕만
          camera: medium
