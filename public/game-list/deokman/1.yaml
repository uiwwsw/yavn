script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제1장 — 훔친 이름"
      - say:
          with: [진평왕, 덕만]
          delivery: calm
          text: "631년 늦봄, 연회 다음 날 아침."
      - say:
          with: [진평왕, 덕만]
          delivery: calm
          text: "덕만은 아버지를 살렸지만, 잔을 나른 악사는 죽었습니다."
      - say:
          with: [덕만]
          delivery: calm
          text: "그리고 죽은 사람의 품에서는 덕만이 잃어버린 노리개가 나왔습니다."
      - say:
          with: [덕만]
          text: "하룻밤 사이, 사람들은 왕을 살린 덕만을 암살범이라 불렀습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕, 덕만]
          text: "죽은 악사의 품에서 나왔습니다."
      - say:
          with: [칠숙, 덕만]
          text: "피 묻은 연꽃 노리개가 바닥을 굴렀습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님의 것이지요?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "제 것과 닮았지만, 매듭이 다릅니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "죽은 자에게 물을 수도 없겠군요."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "그래서 그 입에 제 이름을 넣었습니까?"
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "사흘을 주마."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "네 이름을 훔친 자를 찾아라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지는 절 믿으십니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: sad
          text: "<speed=20>아비는 믿는다.</speed>"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: calm
          text: "<speed=19>왕은 증거를 기다려야 한다.</speed>"
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "가짜예요. 매듭이 한 번 모자라요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "내 옷은 눈 감고도 묶지?"
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "공주님이 가만있으면요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그건 좀 어렵겠네."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "어젯밤 호위 셋이 비었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "장부에는?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "셋 다 근무했다고 적혔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "사라진 호위복도 한 벌 있었지요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "문으로 들어오는 법은 없습니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "잠긴 문을 별로 안 좋아해서요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "좋습니다. 누가 거짓말했는지부터 찾죠."
      - say:
          with: [덕만]
          text: "남은 시간은 사흘뿐이었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "부엌과 기록 창고, 어디부터 뒤져 볼까요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "멀쩡한 쪽이 더 수상하겠네요."
      - branch:
          cases:
            - when:
                var: cheonmyeong_trust
                op: gte
                value: 1
              goto: remembered_sister_warning
            - when:
                var: yushin_trust
                op: gte
                value: 1
              goto: remembered_guard_warning
          default: investigate_choice

  remembered_sister_warning:
    actions:
      - char:
          id: 천명
          position: right
      - say:
          with: [덕만, 천명]
          text: "천명은 연회가 끝난 뒤에도 악사들이 머물던 방을 지켜봤습니다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "노리개를 줍는 궁녀를 봤어."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "얼굴은 기억나요?"
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아니. 대신 왼손을 썼어."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니에게 말하길 잘했네요."
      - goto: investigate_choice

  remembered_guard_warning:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "유신은 밤새 연회장에 드나든 호위의 이름과 시간을 다시 맞춰 봤습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "빈 자리는 셋이 아닙니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "호위복 하나가 더 있었군요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "안에서 갈아입은 자가 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "명단을 맡기길 잘했어요."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "첫 흔적은 어디에 있을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "부엌을 본다"
              add: { insight: 1, sowon_trust: 1 }
              goto: investigate_kitchen
            - text: "기록 창고를 본다"
              add: { insight: 1, bidam_trust: 1 }
              goto: investigate_archive
            - text: "호위를 몰아세운다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: banquet_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "연회가 끝난 부엌에는 술 냄새와 젖은 재만 남아 있었습니다."
      - say:
          with: [덕만, 소원]
          text: "소원은 악사가 쓰러진 자리부터 되짚었습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "이 행주만 냄새가 달라요."
      - say:
          with: [덕만, 소원]
          text: "천 끝에 검은 가루가 묻어 있었습니다."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "술에 넣으려던 게 아니야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "그럼 어디에 쓰려고 했어요?"
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "내 손. 독을 따른 손으로 만들려고."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이건 제가 챙길게요. 또 없어지면 안 되니까."
      - goto: rumor_choice

  investigate_archive:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 덕만을 불 꺼진 기록 창고로 데려갔습니다."
      - say:
          with: [덕만, 비담]
          text: "그곳에는 죽은 악사의 출입을 적은 장부가 남아 있었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이 글씨의 주인은 삼 년 전에 죽었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "죽은 사람 글씨를 흉내 냈군요."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "그런데 너무 서툽니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "숨긴 게 아니라, 날 부른 거야."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "제법 마음에 드는 답입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "아직 내 편은 아니면서요?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "그래서 더 재미있지요."
      - goto: rumor_choice

  rumor_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "첫째 날 해 질 무렵."
      - say:
          with: [덕만, 비담]
          delivery: calm
          text: "궁문은 닫혔고, 범인은 아직 그 안에 있었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "우리가 잠자코 있으면 저들이 먼저 거짓말을 퍼뜨릴 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "그럼 우리가 먼저 미끼를 던지죠."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "거짓말을 퍼뜨리자고요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "그 말을 바로잡으려 달려드는 자가 범인일 테니까요."
      - say:
          with: [덕만, 비담]
          text: "소문은 증거가 아니었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "잘못 짚으면 죄 없는 사람까지 달아날 겁니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "잡기 전에 한 번 더 확인하죠."
      - choice:
          key: c1_rumor
          prompt: "어떤 소문을 흘릴까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "백제 독이라 한다"
              add: { insight: 1 }
              goto: rumor_baekje
            - text: "왕이 봤다고 한다"
              add: { legitimacy: 1 }
              goto: rumor_king
            - text: "목격자가 있다 한다"
              add: { sowon_trust: 1 }
              goto: rumor_witness
            - text: "후계 지명을 꾸민다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "‘백제 독’이라는 말이 궁을 한 바퀴 돌았습니다."
      - say:
          text: "그날 밤, 하인 하나가 담을 넘었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "미끼를 문 사람이 하나 나왔군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "저 하인 품에 든 장부부터 보죠."
      - goto: evidence_choice

  rumor_king:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "‘왕이 범인을 봤다’는 소문이 퍼졌습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "내가 본 얼굴을 나만 모르는구나."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "안 온 사람을 찾으면 됩니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "셋이 문병을 피했다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그 셋의 집을 지켜봐 주세요."
      - goto: evidence_choice

  rumor_witness:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "목격자라니. 다들 절 봤어요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "미안해. 네게 먼저 말했어야 했어."
      - say:
          char: 소원.angry
          camera: medium
          with: [덕만]
          text: "사과는 살아남고 들을게요."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "일단 절 숨겨 주세요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "이번엔 네 말부터 들을게."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          text: "사흘째 새벽, 달아난 하인이 붙잡혔습니다."
      - say:
          text: "손톱 밑에는 같은 검은 가루가 있었습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "살려 두면 입을 열 겁니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "귀족들 앞에서도 그럴까요?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "당신 이름을 말하면 죽겠죠."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님 이름을 말해도 죽습니다."
      - say:
          with: [덕만, 칠숙]
          text: "하인이 증언하면 칠숙을 잡을 수 있었습니다. 하지만 이름을 말하는 순간 하인도 죽을 터였습니다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "입을 열게 하려면 먼저 살려야 해."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "살리면 달아날 수도 있지요."
      - choice:
          key: c1_evidence
          prompt: "하인을 살리려면 어떻게 해야 할까?"
          char: 덕만
          camera: close
          with: [칠숙]
          options:
            - text: "왕에게만 보인다"
              add: { legitimacy: 1 }
              goto: evidence_king
            - text: "풀어 주고 뒤를 밟는다"
              add: { insight: 1, bidam_trust: 1 }
              goto: evidence_reverse
            - text: "칠숙을 지목한다"
              goto: go_10_right_without_proof
            - text: "증거를 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          with: [진평왕, 덕만]
          text: "덕만은 붙잡힌 하인과 검은 가루를 아버지 앞에 내놓았습니다. 진평왕은 곧 문을 걸어 잠갔습니다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "이걸로 네 결백은 밝힐 수 있다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "여기서 멈추면 안 되겠느냐?"
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "<speed=20>멈추면 다음 사람이 죽습니다.</speed>"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [덕만]
          text: "그러다 네가 죽을까 두렵다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
