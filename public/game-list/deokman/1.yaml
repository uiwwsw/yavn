script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제1장 — 훔친 이름"
      - say:
          with: [진평왕, 덕만]
          delivery: calm
          text: "연회 다음 날, 귀족들이 다시 모였습니다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕, 덕만]
          text: "죽은 악사의 품에서 나왔습니다."
      - say:
          with: [칠숙, 덕만]
          text: "피 묻은 연꽃 노리개가 바닥을 굴렀습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님의 것이지요?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "닮았지만, 제 것은 아닙니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "죽은 자는 다르게 말할 수 없겠군요."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "그래서 그 입에 제 이름을 넣었습니까?"
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "사흘을 주마."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "네 이름을 훔친 자를 찾아라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지는 절 믿으십니까?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: sad
          text: "<speed=20>아비는 믿는다.</speed>"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: calm
          text: "<speed=19>왕은 증거를 기다려야 한다.</speed>"
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "가짜예요. 매듭이 한 번 모자라요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "내 옷은 눈 감고도 묶지?"
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "공주님이 가만있으면요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그건 좀 어렵겠네."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "어젯밤 호위 셋이 비었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "장부에는?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "셋 다 근무했다고 적혔습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "빈 호위복도 하나 있었지요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "문으로 들어오는 법은 없습니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "잠긴 문을 별로 안 좋아해서요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "좋아요. 먼저 가짜를 찾죠."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "첫 흔적은 어디에 있을까?"
          char: 덕만
          camera: close
          with: []
          options:
            - text: "부엌을 본다"
              add: { insight: 1, sowon_trust: 1 }
              goto: investigate_kitchen
            - text: "기록 창고를 본다"
              add: { insight: 1, bidam_trust: 1 }
              goto: investigate_archive
            - text: "호위를 몰아세운다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: banquet_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "이 행주만 냄새가 달라요."
      - say:
          with: [덕만, 소원]
          text: "천 끝에 검은 가루가 묻어 있었습니다."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "술에 넣으려던 게 아니야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "그럼 어디에요?"
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "내 손. 독을 따른 손으로 만들려고."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이건 제가 숨길게요."
      - goto: rumor_choice

  investigate_archive:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "붓 주인은 삼 년 전에 죽었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "죽은 사람 글씨를 흉내 냈군요."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "그런데 너무 서툽니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "숨긴 게 아니라, 날 부른 거야."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "제법 마음에 드는 답입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "아직 내 편은 아니면서요?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "그래서 더 재미있지요."
      - goto: rumor_choice

  rumor_choice:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "첫날 저녁. 범인은 아직 궁 안에 있었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "가만있으면 저쪽이 이야기를 만듭니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "그럼 우리가 먼저 만들죠."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "틀린 이야기를요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "고치러 뛰는 사람이 범인이니까."
      - choice:
          key: c1_rumor
          prompt: "어떤 소문을 흘릴까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "백제 독이라 한다"
              add: { insight: 1 }
              goto: rumor_baekje
            - text: "왕이 봤다고 한다"
              add: { legitimacy: 1 }
              goto: rumor_king
            - text: "목격자가 있다 한다"
              add: { sowon_trust: 1 }
              goto: rumor_witness
            - text: "후계 지명을 꾸민다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "‘백제 독’이라는 말이 궁을 한 바퀴 돌았습니다."
      - say:
          text: "그날 밤, 하인 하나가 담을 넘었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "거짓말이 사람 하나를 뛰게 했군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "품의 장부부터 보죠."
      - goto: evidence_choice

  rumor_king:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "‘왕이 범인을 봤다’는 소문이 퍼졌습니다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "내가 본 얼굴을 나만 모르는구나."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "안 온 사람을 찾으면 됩니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "셋이 문병을 피했다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그 셋의 집을 지켜봐 주세요."
      - goto: evidence_choice

  rumor_witness:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "목격자라니. 다들 절 봤어요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "미안해. 네게 먼저 말했어야 했어."
      - say:
          char: 소원.angry
          camera: medium
          with: [덕만]
          text: "사과는 살아남고 들을게요."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "일단 절 숨겨 주세요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "이번엔 네 말부터 들을게."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          text: "사흘째 새벽. 달아난 하인이 붙잡혔습니다."
      - say:
          text: "손톱 밑에는 같은 검은 가루가 있었습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "살려 두면 입을 열 겁니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "귀족들 앞에서도 그럴까요?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "당신 이름을 말하면 죽겠죠."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님 이름을 말해도 죽습니다."
      - choice:
          key: c1_evidence
          prompt: "붙잡힌 하인을 어떻게 쓸까?"
          char: 덕만
          camera: close
          with: [칠숙]
          options:
            - text: "왕에게만 보인다"
              add: { legitimacy: 1 }
              goto: evidence_king
            - text: "풀어 주고 뒤를 밟는다"
              add: { insight: 1, bidam_trust: 1 }
              goto: evidence_reverse
            - text: "칠숙을 지목한다"
              goto: go_10_right_without_proof
            - text: "증거를 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "이걸로 네 결백은 밝힐 수 있다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "여기서 멈추면 안 되겠느냐?"
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "<speed=20>멈추면 다음 사람이 죽습니다.</speed>"
      - say:
          char: 진평왕.sad
          camera: medium
          with: [덕만]
          text: "그러다 네가 죽을까 두렵다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그래도 누구 손인지는 알아야 해요."
      - goto: chapter1_end

  evidence_reverse:
    actions:
      - bg: shadow_corridor
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "잡은 하인을 풀어 주셨군요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "도망갈 곳이 곧 답이니까요."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "뒤를 밟을 사람도 필요하고요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "싫으면 돌아가도 됩니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "그 말은 늘 반대로 들립니다."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - bg: locked_room
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          text: "사흘째 밤. 덕만의 누명은 벗겨졌습니다."
      - say:
          with: [덕만, 비담]
          text: "비담이 혼인 문서 세 장을 펼쳤습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "신부는 하나인데 신랑은 셋이군요."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "가문마다 다른 값을 받았습니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "죽이지 못하니 시집보내겠다?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "공주님 이름은 참 비싸군요."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "값을 매긴 사람부터 만나죠."
      - get: marriage_pact
      - set: { clue_marriage_pact: true }
      - say:
          text: "새벽, 세 문서가 왕좌 앞에 걸렸습니다."
      - say:
          text: "붉은 혼인끈이 덕만의 이름을 묶고 있었습니다."

  go_07_guard_revolt:
    actions:
      - bg: council_hall
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          char: 덕만.angry
          camera: medium
          with: [유신]
          text: "호위 전부 무기를 내려놓으라 해요."
      - say:
          char: 유신.sad
          camera: medium
          with: [덕만]
          text: "그러면 공주님 문이 빕니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [유신]
          text: "그 안에 범인이 있습니다."
      - say:
          char: 유신.sad
          camera: close
          with: [덕만]
          text: "결백한 자까지 등을 돌릴 겁니다."
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: center
      - say:
          with: [덕만]
          text: "그날 밤, 문 앞에는 아무도 없었습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "유신…… 밖에 있습니까?"
      - effect: darken
      - say:
          text: "대답 대신 창살이 뜯겼습니다."
      - gameOver:
          title: "운명 07 — 빈 보초"
          message: "덕만은 텅 빈 방에서 습격을 받았습니다."

  go_08_waiting_room:
    actions:
      - bg: princess_chamber
      - camera: wide
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          delivery: calm
          text: "첫날에는 증인이 둘이었습니다."
      - say:
          text: "둘째 날에는 아무도 남지 않았습니다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "행주를 본 아이도 사라졌어요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "나가면 저들이 기다릴 거야."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "여기 있으면 증거가 사라져요."
      - effect: impact
      - say:
          text: "사흘째 새벽, 정문이 부서졌습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: []
          text: "너는 뒷문으로 나가. 어서."
      - effect: darken
      - gameOver:
          title: "운명 08 — 사라진 증인"
          message: "덕만은 결백을 밝히지 못한 채 별궁에 갇혔습니다."

  go_09_false_heir:
    actions:
      - bg: throne_hall
      - camera: wide
      - char:
          id: 진평왕
          position: right
      - char:
