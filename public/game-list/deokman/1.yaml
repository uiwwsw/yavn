script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          wait: 800
          text: "제1장 — 왕의 사흘"
      - say:
          delivery: calm
          text: "연회 다음 날 아침, 닫힌 궁문 안에서 첫 조사가 열렸습니다."
      - say:
          with: [진평왕, 덕만, 칠숙]
          text: "진평왕은 밤새 독을 마시지 않았지만, 독가루가 묻은 약숟가락을 만진 손이 붓고 열이 올랐습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "독살을 의심받는 사람에게 조사를 맡기시면 누가 그 결과를 믿겠습니까?"
      - say:
          char: 진평왕.weak
          camera: close
          with: [칠숙]
          text: "덕만에게 판결을 맡긴 적은 없다. 사실을 가져오라 했다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [진평왕]
          text: "도망치지 못하게 가두셔야 합니다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "궁문을 닫았다. 도망칠 수 없는 자를 다시 가두라는 말은 증거를 찾지 말라는 뜻과 같다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "덕만, 유신의 호위와 비담의 문서 열람을 허락한다. 사흘째 해가 지면 내 앞에 서라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "명령을 받들겠습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "내가 듣고 싶은 답을 찾지 마라. 있었던 일을 찾아라."
      - char: { id: 월명, position: center }
      - say:
          char: 월명.warning
          camera: medium
          with: [진평왕, 덕만]
          text: "검은 가루는 약에 타서 마시는 독이 아닙니다. 젖은 손이나 숟가락에 붙여 입으로 옮기는 독입니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "그래서 약그릇이 아니라 숟가락에만 묻어 있었군요."
      - say:
          char: 월명
          camera: close
          with: [덕만]
          text: "예. 수레 끈의 가루도 같습니다. 곡식을 훔친 길과 독이 들어온 길이 겹칩니다."
      - choice:
          key: c1_first_lead
          prompt: "첫날 해가 기울기 전에 어디부터 보겠습니까?"
          char: 덕만
          camera: close
          with: [월명]
          options:
            - text: "서쪽 궁문 기록을 본다"
              add: { insight: 1, yushin_trust: 1 }
              goto: lead_gate
            - text: "죽은 관리의 집을 찾는다"
              add: { people_support: 1, sowon_trust: 1 }
              goto: lead_home
            - text: "약 포장지를 대조한다"
              add: { insight: 2 }
              goto: lead_wrapping
            - text: "칠숙의 집부터 뒤진다"
              goto: go_06_empty_search

  lead_gate:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "유신은 서쪽 궁문의 나무패를 날짜 순서대로 마루에 놓았습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "장부에는 수레 다섯 대가 나갔다고 적혔지만, 문지기가 받은 나무패는 세 개뿐입니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "나머지 두 대는 궁을 떠나지 않았습니다. 빈 수레만 돌려 길에서 사라진 것처럼 꾸몄군요."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "두 나무패를 적었다는 문지기는 어젯밤 근무가 끝난 뒤 사라졌습니다."
      - goto: first_day_join

  lead_home:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          with: [덕만, 소원]
          text: "죽은 관리의 방에는 다 먹지 못한 저녁상과 어린 동생이 만든 나무 수레가 남아 있었습니다."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "나무 수레 밑에 종이가 붙어 있어요. 누가 찾으러 올까 봐 숨겼나 봐요."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "이 사람 이름은 도림이에요. 다들 죽은 관리라고만 부르지만, 동생은 형 이름부터 적어 달랬어요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "도림. 이제부터 기록에도 그렇게 남겨."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "‘곡식은 서문을 나가지 않았다. 돈은 서쪽 별채로 갔다.’"
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "이걸 말하려고 궁에 왔다가 죽은 거군요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "그러니 도림을 범인의 짐꾼으로만 기록하면 안 돼. 끝에라도 우리에게 알리려 했어."
      - goto: first_day_join

  lead_wrapping:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 월명, position: right }
      - say:
          with: [덕만, 월명]
          text: "월명은 왕의 약 포장지와 죽은 관리에게서 나온 포장지를 물 위에 띄웠습니다."
      - say:
          char: 월명.warning
          camera: close
          with: [덕만]
          text: "왕의 약지는 물을 먹어도 결이 남습니다. 이 종이는 물에 닿자 풀처럼 녹습니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "제 인장을 찍은 뒤 급히 말린 가짜 포장지군요."
      - say:
          char: 월명
          camera: medium
          with: [덕만]
          text: "인장 둘레의 붉은 먹도 왕실 약방에서 쓰는 빛이 아닙니다."
      - say:
          char: 덕만
          camera: close
          with: [월명]
          text: "가짜를 만든 곳과 곡식값이 간 곳을 함께 찾겠습니다."
      - goto: first_day_join

  first_day_join:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "수사 첫날, 해가 서쪽 담장에 걸릴 무렵이었습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "사라진 곡식값은 서쪽 별채의 빚을 갚는 데 쓰였습니다. 이름은 진운, 먼 왕족입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "진운이 돈을 받았습니까?"
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "아닙니다. 진운의 어머니가 진 빚을 누군가 대신 갚았습니다. 본인은 장부를 본 적도 없겠지요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "사람 하나의 빚에 두 마을 몫 곡식을 썼다면, 그 사람의 이름으로 더 큰 것을 사려는 겁니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "내일 아침 기록 창고를 옮긴다는 명령도 나왔습니다. 범인이 남은 종이를 치우려는 모양입니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "잡으러 들어가면 종이를 태울 겁니다. 스스로 들고 나오게 해야 합니다."
      - goto: first_night_table

  first_night_table:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "첫날 밤, 세 사람은 창문 없는 기록방에 모였습니다. 바닥에는 가짜 약 포장지와 문지기 패, 도림의 나무 수레가 차례로 놓였습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만, 유신]
          text: "하루 만에 독과 빚과 장난감이 한 방에 모였습니다. 범인보다 우리가 더 수상해 보이겠습니다."
      - say:
          char: 유신
          camera: close
          with: [비담]
          text: "농담할 힘이 남았으면 문지기 보고부터 들으시오. 거짓 패를 적은 사람은 셋입니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "둘은 돈을 받았고, 하나는 열병을 앓는 아이에게 약을 끊겠다는 협박을 받았습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "같은 글씨를 썼다고 같은 죄로 묶지 마세요. 돈을 준 사람과 약을 쥔 사람의 이름을 먼저 찾습니다."
      - say:
          char: 비담
          camera: medium
          with: [덕만]
          text: "빚 장부 끝에는 서쪽 별채의 봉인이 있습니다. 가짜 약지에 쓴 붉은 먹과 빛도 같습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "곡식을 돈으로 바꾸고, 그 돈으로 진운의 빚과 제 누명을 함께 샀군요. 아직 누가 샀는지는 비어 있습니다."
      - say:
          with: [덕만, 유신, 비담]
          text: "소원이 문밖에 내려놓은 보리물은 손도 대지 않아 미지근해졌습니다. 등잔 심지만 세 번째로 짧아졌습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "사흘 안에 누명을 벗으셔야 하는 분이 가장 늦게 마시는군요. 이러다 독보다 굶주림이 먼저 이기겠습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "도림은 이 장부를 말하려다 저녁도 못 마쳤습니다. 적어도 그의 문장을 끝낸 뒤 마시겠습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "공개 심리까지 스물일곱 시간입니다. 기록 창고는 내일 해 뜨기 전에 비워진다는 명령을 받았습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신, 비담]
          text: "창고를 막으면 불을 지를 겁니다. 우리가 가진 것을 먼저 보여 주고, 감추려는 문서를 제 발로 움직이게 하죠."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "겁을 먹은 종이는 반드시 주인을 찾아갑니다. 제가 종이가 달아날 문을 열어 두겠습니다."
      - say:
          with: [덕만, 유신, 비담]
          wait: 650
          text: "덕만은 세 증거 사이에 빈 종이 한 장을 놓았습니다. 그 빈칸에 원본을 가진 사람의 움직임을 적기로 했습니다."
      - goto: trace_choice

  trace_choice:
    actions:
      - bg: council_hall
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - choice:
          key: c1_trace
          prompt: "숨긴 장부를 어떻게 밖으로 나오게 하겠습니까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "장부를 찾았다고 알린다"
              add: { insight: 1, bidam_trust: 1 }
              goto: trace_false_notice
            - text: "빚을 받은 사람을 따라간다"
              add: { nobles_support: 1, insight: 1 }
              goto: trace_debt
            - text: "기록 창고를 봉쇄한다"
              goto: go_07_burned_archive
            - text: "관리의 가족을 압박한다"
              goto: go_08_closed_mouth

  trace_false_notice:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "덕만은 사라진 곡식 장부를 찾았다는 글을 일부러 회의장 문에 붙였습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "글을 붙인 지 얼마 되지 않아, 기록방의 등불이 세 번이나 옮겨졌습니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "가짜가 들킬까 두려운 사람이 진짜를 먼저 숨기러 갑니다. 뒤를 놓치지 마세요."
      - goto: warehouse_confrontation

  trace_debt:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "유신은 진운의 빚을 갚아 준 상인이 빈 상자를 싣고 서쪽 별채로 가는 것을 따라갔습니다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "상자는 비어 있었지만 바닥에 붉은 먹과 종이 풀이 남았습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "인장과 포장지를 만든 방입니다. 오늘 밤 진짜 문서도 그곳으로 옮길 겁니다."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "문 앞에서 기다리겠습니다. 나오는 사람을 산 채로 데려오겠습니다."
      - goto: warehouse_confrontation

  warehouse_confrontation:
    actions:
      - bg: locked_room
      - camera: medium
      - effect: focus
      - char: { id: 덕만, position: left }
      - char: { id: 아진, position: right }
      - say:
          delivery: calm
          text: "둘째 날 밤, 아진이 종이 꾸러미를 품고 서쪽 별채에서 나왔습니다."
      - say:
          char: 아진.angry
          camera: close
          with: [덕만]
          text: "길을 비키십시오. 이 문서가 늦으면 제 동생이 죽습니다."
      - say:
          char: 덕만
          camera: medium
          with: [아진]
          text: "문서를 넘기면 다음에는 아진에게 사람을 죽이라 할 겁니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "이미 죽은 사람이 있습니다. 제 손에 피가 없다고 제가 깨끗한 건 아닙니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [아진]
          text: "그렇다면 살아서 누구의 명령이었는지 말하세요. 동생도 찾겠습니다."
      - say:
          char: 아진.nervous
          camera: close
          with: [덕만]
          text: "공주님이 사흘 뒤에도 살아 있으면 그 말을 믿겠습니다."
      - say:
          with: [덕만, 아진]
          wait: 700
          text: "아진은 빈 칼집을 던져 등불을 끈 뒤 달아났습니다. 바닥에는 나무로 만든 인장 틀과 문서 한 장이 남았습니다."
      - say:
          char: 덕만
          camera: close
          with: []
          text: "도망친 사람만 쫓지 마세요. 떨어뜨린 문서부터 봉하십시오."
      - goto: after_warehouse

  after_warehouse:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: center }
      - char: { id: 유신, position: left }
      - char: { id: 비담, position: right }
      - say:
          delivery: calm
          text: "등불을 다시 켜자 유신과 비담이 복도 양쪽에서 거의 동시에 들어왔습니다."
      - say:
          char: 유신.angry
          camera: medium
          with: [덕만, 비담]
          text: "발자국이 아직 젖어 있습니다. 제가 쫓겠습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [유신]
          text: "어두운 길에서 칼 든 사람을 쫓는 일은 맡기죠."
      - say:
          char: 비담.smirk
          camera: close
          with: [유신]
          text: "저는 밝은 데서 이 종이를 보겠습니다."
      - say:
          char: 유신
          camera: close
          with: [비담]
          text: "말이 많군."
      - say:
          char: 비담.smirk
          camera: close
          with: [유신]
          text: "장부가 말을 안 해서 제가 대신합니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신, 비담]
          text: "유신은 아진의 길과 동생을 찾으세요."
      - say:
          char: 덕만
          camera: medium
          with: [유신, 비담]
          text: "비담은 먹과 인장을 확인하고요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "누가 먼저 돌아오는지도 보시겠습니까?"
      - say:
          char: 덕만
          camera: close
          with: [유신, 비담]
          text: "아니요. 누구도 빠뜨리지 않고 돌아오는지만 보겠습니다."
      - say:
          with: [덕만, 유신, 비담]
          text: "유신은 말없이 고개를 숙였고, 비담은 웃음을 거두고 문서를 소매에 넣었습니다."
      - goto: hearing_choice

  hearing_choice:
    actions:
      - bg: throne_hall
      - camera: wide
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          delivery: calm
          text: "3일째 밤, 약속한 시각에 공개 심리가 열렸습니다."
      - say:
          char: 진평왕.weak
          camera: medium
          with: [덕만, 칠숙]
          text: "사흘이 지났다. 덕만, 사실과 짐작을 나누어 말하라."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "도망친 아진의 말도 증거라 하시겠습니까?"
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "말이 아니라 남은 물건과 기록을 말씀드리겠습니다."
      - choice:
          key: c1_hearing
          prompt: "왕 앞에 어떤 순서로 증거를 놓겠습니까?"
          char: 덕만
          camera: close
          with: [진평왕]
          options:
            - text: "가루·인장·장부를 잇는다"
              add: { legitimacy: 2, insight: 1 }
              goto: hearing_chain
            - text: "증인 둘을 함께 세운다"
              add: { legitimacy: 1, yushin_trust: 1 }
              goto: hearing_witnesses
            - text: "아진의 말을 사실로 단정한다"
              goto: go_09_absent_witness
            - text: "딸로서 믿어 달라 한다"
              goto: go_10_kings_favor

  hearing_chain:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만
          camera: medium
          with: [진평왕, 칠숙]
          text: "수레 끈과 약숟가락의 가루가 같고, 가짜 포장지는 이 나무 인장으로 찍었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕, 칠숙]
          text: "그 재료를 산 돈은 사라진 곡식값에서 나왔습니다. 제 방과 제 사람을 거친 기록은 하나도 없습니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "증거가 어디서 나와 누구의 손을 거쳤는지도 기록했느냐?"
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "예. 봉한 사람과 지킨 사람을 모두 세웠습니다."
      - goto: verdict_cleared

  hearing_witnesses:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 월명, position: center }
      - char: { id: 유신, position: left }
      - say:
          char: 월명.warning
          camera: medium
          with: [진평왕]
          text: "독은 가짜 포장지와 같은 종이 풀에 섞였습니다. 공주의 방에 있던 약지와는 다릅니다."
      - say:
          char: 유신
          camera: medium
          with: [진평왕]
          text: "수레 두 대는 서문을 나가지 않았습니다. 궁문 나무패와 수레의 바퀴가 함께 증명합니다."
      - char: { id: 덕만, position: left }
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "두 증언이 만나는 곳에서 제 인장을 본뜬 틀이 나왔습니다."
      - goto: verdict_cleared

  verdict_cleared:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          wait: 900
          unskippable: true
          text: "<speed=18>덕만이 독을 들였다는 혐의는 거둔다. 이 판결은 증거로 내린다.</speed>"
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "그러면 진짜 범인은 누구입니까?"
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "아직 이름을 정하지 않았다. 혐의가 짙다고 형을 먼저 내리지는 않는다."
      - say:
          char: 진평왕
          camera: close
          with: [칠숙]
          text: "칠숙, 수도를 떠나지 마라. 네 집 장부도 내일 해 뜨기 전에 가져와라."
      - char: { id: 비담, position: center }
      - say:
          char: 비담
          camera: medium
          with: [덕만, 진평왕]
          text: "아진이 떨어뜨린 문서의 뒷면에 다른 글이 있습니다."
      - say:
          with: [덕만, 진평왕, 비담]
          wait: 750
          text: "문서에는 덕만과 진운을 혼인시키고, 두 사람의 이름으로 군사와 창고를 나누는 조건이 적혀 있었습니다."
      - get: marriage_pact
      - set: { clue_marriage_pact: true }
      - add: { legitimacy: 1 }
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "곡식을 훔친 돈으로 진운의 빚을 갚고, 제 이름으로 그를 왕으로 만들려 했군요."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "혼인은 왕실을 묶는 끈이지, 내 딸의 입을 막는 재갈이 아니다."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 천명, position: right }
      - say:
          delivery: calm
          text: "심리가 끝난 뒤에도 궁문은 열리지 않았습니다. 독살 혐의만 사라졌을 뿐, 사라진 곡식과 명령한 사람은 남아 있었습니다."
      - say:
          char: 천명.sad
          camera: medium
          with: [덕만]
          text: "누명은 벗었는데 얼굴이 더 어두워졌어."
      - say:
          char: 덕만.sad
          camera: close
          with: [천명]
          text: "죽은 사람의 마지막 기록이 제 혼인 조건으로 이어졌어. 다음에는 산 사람의 말을 들어야 해."
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "진운을 만나려는 거구나."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "응. 남들이 빌린 이름 말고, 그 사람이 자기 입으로 하는 말을 들을 거야."

  go_06_empty_search:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 유신, position: right }
      - say:
          with: [덕만, 유신]
          text: "덕만은 왕의 허락을 기다리지 않고 칠숙의 집을 뒤졌습니다."
      - say:
          char: 유신.angry
          camera: close
          with: [덕만]
          text: "방은 비었고 바닥에 기름 냄새만 남았습니다. 함정입니다."
      - effect: impact
      - say:
          text: "문밖에서 불길이 솟았고, 덕만의 병사들이 증거를 태운 범인으로 붙잡혔습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [유신]
          text: "증거를 찾으러 왔다가 없앨 구실을 줬군요."
      - gameOver:
          title: "운명 06 — 비어 있던 집"
          message: "허가 없는 수색은 방화의 증거로 바뀌었고, 덕만은 사흘째 심리 전에 조사권을 잃었습니다."

  go_07_burned_archive:
    actions:
      - bg: locked_room
      - camera: wide
      - effect: embers
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right }
      - say:
          with: [덕만, 비담]
          text: "덕만이 기록 창고를 봉쇄하자 안에 숨어 있던 사람이 등잔을 서류 더미에 던졌습니다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "문을 열면 범인은 달아나고, 닫아 두면 장부가 모두 탑니다."
      - say:
          char: 덕만.angry
          camera: close
          with: [비담]
          text: "사람부터 꺼내세요!"
      - effect: { name: darken, wait: true }
      - say:
          text: "문을 열었을 때 범인과 원본 장부는 사라졌고, 연기에 쓰러진 관리들만 남았습니다."
      - gameOver:
          title: "운명 07 — 봉한 문 안의 불"
          message: "범인을 가두려 봉한 문이 기록관들의 탈출까지 막았습니다. 원본과 증인은 함께 사라졌습니다."

  go_08_closed_mouth:
    actions:
      - bg: village
      - camera: medium
      - char: { id: 덕만, position: left }
      - char: { id: 소원, position: right }
      - say:
          char: 덕만.angry
          camera: medium
          with: [소원]
          text: "숨긴 기록을 내놓지 않으면 가족도 조사하겠다고 전하세요."
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "그 가족은 이미 한 사람을 잃었어요. 겁을 주면 우리에게 입을 열까요?"
      - say:
          with: [덕만, 소원]
          text: "위협을 들은 늙은 아버지는 아들이 남긴 종이를 아궁이에 넣고 문을 걸어 잠갔습니다."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "범인이 아니라 저를 두려워하게 만들었구나."
      - gameOver:
          title: "운명 08 — 닫힌 유족의 문"
          message: "위협받은 유족은 마지막 기록을 태웠습니다. 덕만은 자신을 믿어 줄 증인까지 잃었습니다."

  go_09_absent_witness:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만.angry
          camera: medium
          with: [진평왕, 칠숙]
          text: "아진은 동생을 잡은 사람이 칠숙공이라고 말했습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "그 말을 했다는 사람은 어디 있습니까?"
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "없는 증인의 말을 네 확신으로 채우지 마라."
      - say:
          with: [진평왕, 덕만, 칠숙]
          text: "그날 밤 아진은 칠숙의 병사들에게 붙잡혔고, 다시는 심리장에 나타나지 못했습니다."
      - gameOver:
          title: "운명 09 — 오지 못한 증인"
          message: "덕만이 증언을 먼저 공개하자 아진은 심리장에 서기 전에 사라졌고, 남은 증거도 거짓말로 몰렸습니다."

  go_10_kings_favor:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 진평왕, position: right }
      - char: { id: 덕만, position: left }
      - char: { id: 칠숙, position: center }
      - say:
          char: 덕만.sad
          camera: close
          with: [진평왕]
          text: "아버지, 제가 그런 일을 하지 않았다는 것만 믿어 주세요."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "내가 믿는다고 판결이 되지는 않는다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕]
          text: "전하께서 딸을 위해 법을 굽히셨다고 모두가 보았습니다."
      - effect: darken
      - say:
          text: "회의장을 나간 귀족들은 진운을 보호한다는 명분으로 사병을 모았습니다. 그날 밤 궁문이 안팎에서 닫혔습니다."
      - gameOver:
          title: "운명 10 — 아버지의 믿음"
          message: "증거 대신 아버지의 믿음을 구한 순간 판결은 편애가 되었고, 귀족들은 그것을 반란의 명분으로 삼았습니다."
