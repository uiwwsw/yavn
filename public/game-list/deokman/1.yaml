script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "제1장 — 훔친 이름"
      - say:
          with: [진평왕, 덕만]
          delivery: calm
          text: "631년 늦봄, 연회 다음 날 아침."
      - say:
          with: [진평왕, 덕만]
          delivery: calm
          text: "왕은 살았고 악사는 죽었다."
      - say:
          with: [덕만]
          delivery: calm
          text: "죽은 악사의 품에서는 덕만이 잃어버린 노리개가 나왔다."
      - say:
          with: [덕만]
          wait: 800
          text: "연회가 끝난 지 하룻밤 만에, 왕을 살린 딸은 왕을 죽이려 한 사람으로 몰렸다."
      - char:
          id: 칠숙
          position: center
      - say:
          char: 칠숙.smile
          camera: medium
          with: [진평왕, 덕만]
          text: "죽은 악사의 품에서 나온 물건입니다."
      - say:
          with: [칠숙, 덕만]
          wait: 650
          text: "노리개가 덕만 발치까지 굴렀다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님 것이 맞습니까?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "제 것이라면 매듭이 하나 더 있어야 합니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "죽은 악사는 이 물건이 어디서 났는지 말할 수 없겠군요."
      - say:
          char: 덕만
          camera: medium
          with: [칠숙]
          text: "그래서 죽은 사람을 이용해 저를 범인으로 만드시는 겁니까?"
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "3일을 주겠다. 그 이상은 막아 줄 수 없다."
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          text: "누가 네 물건으로 누명을 씌웠는지 찾아와라."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "아버지는 그래도 절 믿으세요?"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: sad
          wait: 850
          unskippable: true
          text: "<speed=20>아버지는 한 번도 의심하지 않았다.</speed>"
      - say:
          char: 진평왕.sad
          camera: close
          with: [덕만]
          delivery: calm
          unskippable: true
          text: "<speed=19>다만 왕은 증거 없이 널 감쌀 수 없다.</speed>"
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "가짜예요. 매듭 하나가 빠졌어요."
      - say:
          char: 덕만
          camera: medium
          with: [소원]
          text: "내 매듭은 눈 감고도 알지?"
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "공주님이 가만히만 계시면요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그건 평생 안 되겠네."
      - char:
          id: 유신
          position: right
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "어젯밤 호위 세 명이 자리를 비웠습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "장부에는 뭐라 적혔습니까?"
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "셋 다 제자리를 지켰다고 돼 있습니다."
      - char:
          id: 비담
          position: right
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "사라진 호위복도 한 벌 있고요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "문으로 들어오면 안 됩니까?"
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "잠긴 문을 별로 안 좋아해서요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "좋아요. 거짓말한 사람부터 찾죠."
      - say:
          with: [덕만]
          wait: 700
          text: "덕만에게 주어진 3일은 빠르게 줄어들었다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "부엌과 기록 창고. 어느 문부터 열까요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "흔적이 지워지기 전에 움직이죠."
      - branch:
          cases:
            - when:
                var: cheonmyeong_trust
                op: gte
                value: 1
              goto: remembered_sister_warning
            - when:
                var: yushin_trust
                op: gte
                value: 1
              goto: remembered_guard_warning
          default: investigate_choice

  remembered_sister_warning:
    actions:
      - char:
          id: 천명
          position: right
      - say:
          with: [덕만, 천명]
          text: "천명은 연회가 끝난 뒤에도 악사들의 방을 지켜봤다."
      - say:
          char: 천명.nervous
          camera: medium
          with: [덕만]
          text: "네 노리개를 줍는 궁녀를 봤어."
      - say:
          char: 덕만
          camera: medium
          with: [천명]
          text: "얼굴, 기억나?"
      - say:
          char: 천명
          camera: close
          with: [덕만]
          text: "아니. 그런데 왼손으로 주웠어."
      - say:
          char: 덕만
          camera: close
          with: [천명]
          text: "언니한테 먼저 말하길 잘했어."
      - goto: investigate_choice

  remembered_guard_warning:
    actions:
      - char:
          id: 유신
          position: right
      - say:
          with: [덕만, 유신]
          text: "유신은 밤새 호위의 이름과 출입 시각을 다시 맞췄다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "자리를 비운 호위가 셋만은 아니었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [유신]
          text: "누군가 안에서 호위복을 갈아입었군요."
      - say:
          char: 유신
          camera: close
          with: [덕만]
          text: "예. 궁을 나갈 때만 호위복을 입은 사람이 있습니다."
      - say:
          char: 덕만
          camera: close
          with: [유신]
          text: "유신에게 맡기길 잘했네요."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "3일 안에 첫 흔적을 찾아야 한다."
          char: 덕만
          camera: close
          with: []
          options:
            - text: "부엌을 본다"
              add: { insight: 1, sowon_trust: 1 }
              goto: investigate_kitchen
            - text: "기록 창고를 본다"
              add: { insight: 1, bidam_trust: 1 }
              goto: investigate_archive
            - text: "호위를 몰아세운다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: banquet_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          with: [덕만, 소원]
          text: "부엌에는 젖은 재만 남았다."
      - say:
          with: [덕만, 소원]
          text: "소원은 무릎을 꿇고 바닥을 훑었다."
      - say:
          char: 소원.nervous
          camera: medium
          with: [덕만]
          text: "이 행주만 냄새가 매워요."
      - say:
          with: [덕만, 소원]
          text: "검은 가루가 손끝에 묻었다."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "술에 타려던 가루가 아니야."
      - say:
          char: 소원.nervous
          camera: close
          with: [덕만]
          text: "그럼 어디에 쓰려고 한 거예요?"
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "내 손에 묻혀서 나를 범인으로 만들려고."
      - say:
          char: 소원
          camera: medium
          with: [덕만]
          text: "이건 제가 품을게요. 또 빼앗기면 안 돼요."
      - goto: rumor_choice

  investigate_archive:
    actions:
      - bg: locked_room
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          with: [덕만, 비담]
          text: "비담은 덕만을 등불 꺼진 기록 창고로 데려갔다."
      - say:
          with: [덕만, 비담]
          text: "먼지 쌓인 장부에는 죽은 악사의 출입 기록이 남아 있었다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "이 글씨를 쓴 사람은 3년 전에 죽었습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "죽은 사람 이름으로 장부까지 꾸몄군요."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "그런데 흉내가 너무 서툽니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "일부러 들키게 썼어. 나를 이리로 부른 거야."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "그 답은 제법 마음에 드네요."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "아직 제 편도 아니면서요?"
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "그래야 더 오래 곁에 있지요."
      - goto: rumor_choice

  rumor_choice:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          delivery: calm
          wait: 600
          text: "수사 첫날, 해가 서쪽 담장에 걸릴 무렵."
      - say:
          with: [덕만, 비담]
          delivery: calm
          wait: 650
          text: "궁문이 닫혔다. 범인도 덕만과 함께 갇혔다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "우리가 조용하면 저들이 먼저 이야기를 만들 겁니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "그럼 우리가 먼저 거짓 소문을 내죠."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "공주님께서 직접 거짓말을 하시겠다고요?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "소문이 틀렸다고 나서는 사람이 진실을 아는 겁니다."
      - say:
          with: [덕만, 비담]
          wait: 600
          text: "거짓 소문은 궁 안에서 진실보다 빨리 퍼졌다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "소문을 잘못 내면 죄 없는 사람도 겁에 질려 도망칩니다."
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "뒤를 밟되 바로 붙잡지는 말죠."
      - choice:
          key: c1_rumor
          prompt: "어떤 소문을 내야 범인이 움직일까?"
          char: 덕만
          camera: close
          with: [비담]
          options:
            - text: "백제에서 온 독이라고 퍼뜨린다"
              add: { insight: 1 }
              goto: rumor_baekje
            - text: "왕이 범인을 봤다고 퍼뜨린다"
              add: { legitimacy: 1 }
              goto: rumor_king
            - text: "목격자가 있다고 퍼뜨린다"
              add: { sowon_trust: 1 }
              goto: rumor_witness
            - text: "덕만이 다음 왕이라 한다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - bg: shadow_corridor
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 비담
          position: right
      - say:
          text: "‘백제에서 온 독’이라는 말이 궁을 한 바퀴 돌았다."
      - say:
          text: "밤이 되자 하인 하나가 장부를 품고 담을 넘었다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "벌써 한 명이 도망치네요."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "잡기 전에 품속 장부부터 확인해요."
      - goto: evidence_choice

  rumor_king:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
          text: "‘왕이 범인의 얼굴을 봤다’는 소문이 퍼졌다."
      - say:
          char: 진평왕
          camera: medium
          with: [덕만]
          text: "내가 못 본 범인을 봤다는 소문이 났구나."
      - say:
          char: 덕만
          camera: medium
          with: [진평왕]
          text: "병문안을 오지 않은 사람이 놀란 겁니다."
      - say:
          char: 진평왕
          camera: close
          with: [덕만]
          text: "오늘 병문안을 피한 사람이 3명이다."
      - say:
          char: 덕만
          camera: close
          with: [진평왕]
          text: "그 셋이 오늘 밤 어디로 가는지 봐 주세요."
      - goto: evidence_choice

  rumor_witness:
    actions:
      - bg: princess_chamber
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 소원
          position: right
      - say:
          char: 소원.angry
          camera: close
          with: [덕만]
          text: "목격자라니요. 이제 다들 절 봐요."
      - say:
          char: 덕만.sad
          camera: close
          with: [소원]
          text: "미안해. 네 이름부터 지켰어야 했어."
      - say:
          char: 소원.angry
          camera: medium
          with: [덕만]
          text: "사과는 살아남고 들을게요."
      - say:
          char: 소원
          camera: close
          with: [덕만]
          text: "일단 절 아무도 모르는 방에 숨겨 주세요."
      - say:
          char: 덕만
          camera: close
          with: [소원]
          text: "그래. 이번에는 네 말부터 들을게."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - camera: medium
      - char:
          id: 덕만
          position: left
      - char:
          id: 유신
          position: right
      - say:
          delivery: calm
          wait: 650
          text: "3일째 새벽, 달아난 하인이 궁문 앞에서 붙잡혔다."
      - say:
          text: "그의 손톱 밑에도 같은 검은 가루가 끼어 있었다."
      - say:
          char: 유신
          camera: medium
          with: [덕만]
          text: "살려 두면 사실대로 말하게 할 수 있습니다."
      - char:
          id: 칠숙
          position: right
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "귀족들 앞에서도 사실대로 말할까요?"
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "칠숙공 이름을 대는 순간 죽겠지요."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "공주님 이름을 대도 결과는 같습니다."
      - say:
          with: [덕만, 칠숙]
          text: "하인은 칠숙의 이름을 꺼내려다 문밖의 인기척에 입을 다물었다."
      - say:
          char: 덕만
          camera: close
          with: [칠숙]
          text: "입을 열 때까지는 살려 둬야 합니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "살려 두면 다시 달아날 수도 있지요."
      - choice:
          key: c1_evidence
          prompt: "하인이 입을 열려 하자 문밖에서 인기척이 난다."
          char: 덕만
          camera: close
          with: [칠숙]
          options:
            - text: "왕에게만 보인다"
              add: { legitimacy: 1 }
              goto: evidence_king
            - text: "풀어 주고 뒤를 밟는다"
              add: { insight: 1, bidam_trust: 1 }
              goto: evidence_reverse
            - text: "칠숙을 지목한다"
              goto: go_10_right_without_proof
            - text: "증거를 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - bg: throne_hall
      - camera: medium
      - char:
          id: 진평왕
          position: right
      - char:
          id: 덕만
          position: left
      - say:
