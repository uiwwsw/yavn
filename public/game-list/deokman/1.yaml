script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제1장 — 범인은 내 이름을 알고 있다"
      - say:
          text: "왕을 살린 다음 날, 죽은 악공의 품에서는 덕만의 노리개가 나왔습니다. 범인은 왕을 죽이는 데 실패하고도 덕만을 공범으로 만드는 데는 성공했습니다."
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "사흘을 주마. 그 안에 네 결백을 증명하지 못하면, 넷째 날에는 너를 심문하라는 대신들의 청을 받아들여야 한다."
      - say:
          char: 덕만
          framing: bust
          text: "아버지도 제가 범인일 수 있다고 생각하십니까?"
      - say:
          char: 진평왕.sad
          framing: bust
          with:
            - 덕만
          text: "아비는 믿지 않는다. 왕은 증거 없이 너만 믿을 수 없다."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 진평왕
          text: "그럼 왕을 설득할 증거를 가져오겠습니다. 그때는 아버지가 제 말을 들어 주세요."
      - say:
          char: 진평왕
          framing: bust
          text: "살아서 돌아오면 듣겠다. 혼자 움직이지 마라."
      - say:
          with:
            - 덕만
          text: "덕만에게 남은 사람은 많지 않았습니다. 어릴 때부터 옷과 방을 돌본 나인 소원은 물건의 변화를 알았고, 호위를 맡은 젊은 장수 유신은 사람의 움직임을 알았습니다. 어느 가문에도 속하지 않은 비담은 궁의 소문과 문서를 팔며 누구보다 먼저 비밀을 알아냈습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "독이 어디서 왔는지, 누가 기록을 바꿨는지, 어느 호위가 자리를 비웠는지. 셋 중 하나는 범인이 먼저 지우려 했을 흔적이야."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "첫 단서를 어디서 찾을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "부엌을 뒤진다"
              add:
                insight: 1
              goto: investigate_kitchen
            - text: "기록고를 뒤진다"
              add:
                insight: 1
                suspicion: 1
              goto: investigate_archive
            - text: "호위부를 심문한다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: princess_chamber
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원.nervous
          framing: full
          with:
            - 덕만
          text: "술독이랑 국자, 잔은 냄새가 다 같아요. 그런데 이 행주만 달라요. 공주님 자리를 닦은 뒤부터 검은 가루가 묻어났대요."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 소원
          delivery: whisper
          text: "누가 이걸 썼는지 본 사람은?"
      - say:
          char: 소원.nervous
          framing: bust
          with:
            - 덕만
          text: "없어요. 다들 못 봤다고 해요. 너무 똑같이 말해서 오히려 수상할 만큼요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 소원
          text: "이 가루는 술에 넣으려고 가져온 게 아니야. 내 손에 묻혀서, 내가 잔을 건넨 것처럼 보이게 하려던 거야. 행주는 숨겨 둬. 네가 찾았다는 것도 아직 말하지 말고."
      - say:
          char: 소원
          framing: bust
          text: "네. 그런데 공주님, 저한테까지 숨기지는 마세요. 무서운 건 같이 무서워해야 덜 무서우니까."
      - add:
          sowon_trust: 1
      - goto: rumor_choice

  investigate_archive:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "먹물은 오늘 갈았는데, 붓은 삼 년 전에 죽은 관리의 물건이군요. 일부러 그 사람 필체를 흉내 냈습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "누가 쓴 건지 알겠습니까?"
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "알았으면 값을 먼저 불렀겠지요. 다만 이 글씨는 너무 서툽니다. 들키지 않으려는 사람이 아니라, 공주님이 발견해 주길 바란 사람이 썼습니다."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "나를 기록고로 부른 거군요. 그럼 부른 사람에게 내가 왔다고 알려 줍시다."
      - say:
          char: 비담.smirk
          framing: bust
          text: "그런 표정으로 말씀하시니, 제가 공주님 편이 된 것처럼 들립니다. 아직은 아닙니다."
      - say:
          char: 덕만
          framing: bust
          text: "아직은, 이라고 했군요. 충분합니다."
      - add:
          bidam_trust: 1
      - goto: rumor_choice

  rumor_choice:
    actions:
      - say:
          with:
            - 덕만
          text: "해가 기울자 비담이 나타났습니다. 그는 덕만의 신하도, 칠숙의 사람도 아니었습니다. 비밀을 팔아 살아왔고, 이번에는 어느 쪽이 더 흥미로운 값을 내놓는지 지켜보는 중이었습니다."
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "궁 안에 귀가 너무 많습니다. 아무 말도 안 하면 저쪽에서 먼저 이야기를 만들 겁니다."
      - say:
          char: 비담.smirk
          framing: bust
          with:
            - 덕만
          text: "소원은 손에 남은 흔적을 보고, 유신공은 발이 움직인 자리를 봅니다. 저는 거짓말을 들은 사람이 어디로 달려가는지 보지요. 그 일이라면 저를 쓰십시오."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "그럼 우리가 먼저 틀린 이야기를 들려주죠. 누가 급히 고치려 드는지 보면 됩니다."
      - say:
          char: 비담.smirk
          framing: bust
          text: "좋습니다. 오늘은 어떤 거짓말을 사실처럼 말해 볼까요?"
      - choice:
          key: c1_rumor
          prompt: "어떤 소문으로 덫을 놓을까?"
          char: 덕만
          framing: closeup
          with:
            - 비담
          options:
            - text: "백제 상인 탓이라 한다"
              add:
                insight: 1
              goto: rumor_baekje
            - text: "왕이 범인을 봤다 한다"
              add:
                power: 1
              goto: rumor_king
            - text: "목격자가 살아 있다 한다"
              add:
                suspicion: 1
                sowon_trust: -1
              goto: rumor_witness
            - text: "후계 지명을 꾸민다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - say:
          text: "백제 상인이 독을 들여왔다는 소문은 반나절 만에 궁을 돌았습니다. 그날 밤, 칠숙의 하인이 국경 상단 장부를 품고 담을 넘다가 붙잡혔습니다."
      - say:
          char: 덕만
          framing: bust
          text: "소문을 믿었다면 숨어 있었겠지. 장부를 들고 달아난 건 들킬 게 있다는 뜻이야. 그 하인부터 데려와."
      - say:
          char: 비담.smirk
          framing: bust
          text: "소문은 틀렸는데, 도망친 사람은 제대로 골랐군요. 가끔은 거짓말도 발이 빠릅니다."
      - goto: evidence_choice

  rumor_king:
    actions:
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          text: "왕이 범인의 얼굴을 보았다는 소문이 퍼지자 문병객이 줄을 섰습니다. 평소 가장 먼저 오던 세 사람만 모습을 보이지 않았습니다."
      - say:
          char: 진평왕
          framing: bust
          text: "내가 보았다는 얼굴을, 정작 나는 모르고 있구나."
      - say:
          char: 덕만
          framing: bust
          text: "아버지가 누굴 보았는지는 중요하지 않습니다. 아버지가 봤다고 믿고 숨은 사람이 중요합니다. 세 사람의 집을 지켜봐 주세요."
      - add:
          legitimacy: 1
      - goto: evidence_choice

  rumor_witness:
    actions:
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원.angry
          framing: bust
          text: "목격자가 살아 있다고 소문내셨죠? 그 말을 듣자마자 다들 제 얼굴을 봤어요. 왜 저한테는 먼저 말하지 않으셨어요?"
      - say:
          char: 덕만.sad
          framing: bust
          text: "네가 반대할까 봐. 반대하면 내가 결심을 못 할까 봐 말하지 않았어. 미안해."
      - say:
          char: 소원.angry
          framing: closeup
          text: "미안하다는 말보다 먼저 저를 숨겨 주세요. 사과는 둘 다 살아남고 나서 들을게요."
      - say:
          char: 덕만.sad
          framing: bust
          text: "그래. 오늘 해 지기 전까지 네 이름을 이 소문에서 빼낼게. 이번에는 네 허락부터 받겠다."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - say:
          text: "사흘째 새벽, 덕만은 바뀐 명단과 독 묻은 행주, 담 아래에서 붙잡힌 하인을 한자리에 모았습니다. 이제 증거를 누구에게, 어떤 순서로 보여 줄지가 남았습니다."
      - say:
          char: 덕만
          framing: bust
          with: []
          text: "아버지께만 보이면 내 누명은 벗지만 배후는 숨을 거야. 하인을 풀어 뒤를 밟으면 주인에게 닿을 수 있지만, 저 사람은 입을 막으러 온 칼부터 만나겠지."
      - say:
          with:
            - 덕만
          text: "칠숙을 공개 지목하기에는 명령을 직접 들은 증인이 없었습니다. 증거를 없애면 당장의 심문은 피할지 몰라도, 덕만의 결백을 대신 말해 줄 것도 사라졌습니다."
      - choice:
          key: c1_evidence
          prompt: "증거를 어떻게 쓸까?"
          char: 덕만
          framing: closeup
          options:
            - text: "왕에게만 보인다"
              add:
                legitimacy: 2
              goto: evidence_king
            - text: "하인을 거짓 전령으로 쓴다"
              add:
                insight: 2
                power: 1
                suspicion: 1
              goto: evidence_reverse
            - text: "칠숙을 공개 지목한다"
              goto: go_10_right_without_proof
            - text: "모두 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - char:
          id: 진평왕
          position: right
          framing: full
      - say:
          char: 진평왕.sad
          framing: bust
          text: "이 정도면 네가 독을 넣지 않았다는 것은 밝힐 수 있다. 여기서 멈추겠느냐?"
      - say:
          char: 덕만
          framing: bust
          text: "멈추면 다음 잔에는 다른 사람 이름이 들어갑니다. 하인에게 명령한 사람이 누군지 찾겠습니다."
      - say:
          char: 진평왕.sad
          framing: bust
          text: "그러다 네가 정말 죽을 수도 있다."
      - say:
          char: 덕만
          framing: closeup
          text: "사흘 전에도 죽을 뻔했습니다. 이번에는 적어도 누구 손인지 알고 피하고 싶습니다."
      - goto: chapter1_end

  evidence_reverse:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담.smirk
          framing: bust
          text: "붙잡은 하인을 그냥 풀어 주셨군요. 칠숙이 그를 믿을까요?"
      - say:
          char: 덕만
          framing: bust
          text: "믿지 않아도 됩니다. 어디로 도망가는지만 보면 되니까요."
      - say:
          char: 비담.smirk
          framing: bust
          text: "그 뒤를 밟는 사람도 필요하겠군요. 위험한 일은 늘 제 몫입니까?"
      - say:
          char: 덕만
          framing: bust
          text: "싫으면 돌아가도 됩니다."
      - say:
          char: 비담.smirk
          framing: closeup
          text: "그렇게 말하면 더 가고 싶어지는 성격이라서요. 다녀오겠습니다."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - effect: focus
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          text: "덕만은 누명을 벗었습니다. 하지만 하인을 쫓던 비담은 배후 대신 봉인된 합의서 한 장을 가져왔습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          delivery: angry
          text: "이번에는 혼인이군. 죽이지 못했으니 누군가의 아내로 만들어 입을 막겠다는 거야."
          wait: 800
      - say:
          char: 비담.smirk
          framing: bust
          text: "세 가문이 같은 신부에게 서로 다른 값을 약속받았습니다. 청혼이라기보다 경매에 가깝습니다."
      - say:
          char: 덕만.angry
          framing: closeup
          text: "그럼 값을 매긴 사람부터 만나야겠지. 내 혼인을 내가 모르는 채로 정하게 두지는 않겠어."
      - get: marriage_pact
      - set:
          clue_marriage_pact: true
      - say:
          text: "덕만은 결백을 되찾았습니다. 그러나 바로 다음 날, 세 가문의 청혼서가 동시에 왕에게 올라왔습니다."

  go_07_guard_revolt:
    actions:
      - bg: council_hall
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 유신
          position: right
          framing: full
      - say:
          text: "덕만은 호위부 병사 스물여덟 명을 한 줄로 세우고, 어젯밤 자리를 비운 사람은 모두 무기를 내려놓으라고 명했습니다."
      - say:
          char: 유신
          framing: bust
          text: "교대 시간이 달랐던 사람까지 전부 세우셨습니다. 이대로 심문하면 오늘 밤 공주님 처소를 지킬 병사가 없습니다."
      - say:
          char: 덕만.angry
          framing: bust
          text: "그 안에 암살범이 있을지 모르는데 다시 칼을 맡길 수는 없습니다."
      - say:
          char: 유신.sad
          framing: closeup
          with: []
          text: "그럼 결백한 병사들도 공주께서 이미 자신을 범인으로 정했다고 생각할 겁니다."
      - effect: darken
      - say:
          with:
            - 덕만
          text: "그날 밤 덕만의 처소에는 발소리가 하나도 멈추지 않았습니다. 창살이 마찰하는 소리를 듣고 칼을 찾았을 때, 무기함도 비어 있었습니다."
      - effect: impact
      - say:
          char: 덕만.sad
          framing: closeup
          with: []
          text: "유신…… 문밖에 있습니까?"
          wait: 700
      - gameOver:
          title: "운명 07 — 빈 보초"
          message: "대답은 없었습니다. 덕만은 비어 있는 처소에서 습격을 받고 죽었습니다."
  go_08_waiting_room:
    actions:
      - bg: princess_chamber
      - char:
          id: 덕만
          position: left
          framing: full
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          text: "첫날에는 문밖에 증언하겠다는 나인이 둘 있었습니다. 둘째 날 아침에는 한 명만 남았고, 저녁에는 아무도 오지 않았습니다."
      - say:
          char: 소원.nervous
          framing: bust
          text: "공주님, 부엌에서 행주를 봤다는 아이가 사라졌어요. 지금 나가서 찾아야 해요."
      - say:
