script:
  - scene: ten_years_later

scenes:
  ten_years_later:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: record
          delivery: calm
          text: "십 년 뒤. 국경 장시의 종이 세 번 울리자 '만덕'은 셈을 멈췄습니다. 죽은 공주를 찾는 군화 소리가 장터로 들어왔습니다."
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          camera: medium
          text: "덕만의 손가락이 두 장부 사이를 오갔습니다. 난민을 잡는 종이와 곡식을 옮기는 종이에 같은 붉은 흠집이 있었습니다. 목적지는 둘 다 서라벌 서쪽 창고."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "칠숙입니다. 남문 말이 그 사람 것입니다. 십 년 동안 저 발굽보다 반나절 먼저 떠나 살았어요. 이번에도 그래야 합니다."
      - say:
          char: 덕만
          camera: close
          with: [소화]
          text: "십 년을 먼저 떠났는데도 저 도장은 늘 우리보다 앞에 있었어. 오늘은 도망칠 짐 대신, 저 도장이 어디로 가는지 기다릴 거야."
      - goto: choose_identity

  choose_identity:
    actions:
      - choice:
          key: c2_identity
          prompt: "칠숙이 장터에 들어온다. 어떤 얼굴로 장부에 다가갈까?"
          char: 덕만
          camera: close
          with: [소화]
          options:
            - text: "장부꾼 만덕으로 시비를 건다"
              set: { identity_mode: hidden, identity_exposed: false }
              add: { insight: 1, sohwa_trust: 1 }
              goto: hidden_inquiry
            - text: "왕실 감찰관 행세로 장부를 뺏는다"
              set: { identity_mode: borrowed }
              add: { fear: 1, evidence: 1 }
              goto: borrowed_inquiry
            - text: "장터 한복판에서 덕만이라 밝힌다"
              set: { identity_mode: public, identity_exposed: true }
              add: { people_support: 2, fear: 1 }
              goto: public_inquiry

  hidden_inquiry:
    actions:
      - say:
          channel: narration
          text: "덕만이 틀린 합계를 큰 소리로 읽자 상인이 욕설을 뱉으며 인장장이를 불렀습니다. 모두가 싸움 구경에 몰렸고 장부는 탁자 위에 열린 채 남았습니다."
      - say:
          char: 소화
          camera: medium
          with: [덕만]
          text: "싸움 구경꾼은 많아도 만덕을 지켜 줄 사람은 없네요. 숨은 이름은 칼도 피하지만 도움을 청할 입도 잃습니다."
      - goto: market_crackdown

  borrowed_inquiry:
    actions:
      - say:
          channel: narration
          text: "'왕실 감찰'이라는 네 글자에 상인들의 허리가 동시에 굽었습니다. 멀리서 진짜 관원의 깃발이 보이자 굽었던 눈들이 덕만의 얼굴을 다시 훑었습니다."
      - say:
          char: 덕만.wanderer
          camera: close
          with: [소화]
          text: "빌린 이름은 문을 빨리 열어도 빚까지 안쪽에 남겨. 해 지기 전에 증거만 꺼내고, 그 이름의 값도 나중에 갚자."
      - goto: market_crackdown

  public_inquiry:
    actions:
      - say:
          channel: narration
          text: "'덕만'이라는 이름이 떨어지자 늙은 상인이 먼저 무릎을 꿇었습니다. 환호가 번지는 동안 맞은편 좌판 주인은 조용히 현상수배 전단을 접었습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "저분들은 아기씨 이름을 되살렸습니다. 이제 칠숙도 소문을 따라 헤매지 않고 이 자리로 곧장 오겠군요."
      - goto: market_crackdown

  market_crackdown:
    actions:
      - effect: darken
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          channel: narration
          camera: wide
          text: "마지막 햇빛이 처마에서 사라지자 네 문이 동시에 닫혔습니다. 군사들이 좌판을 걷어차며 종이에 그려진 얼굴과 사람들을 번갈아 보았습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "죽은 공주께서 십 년 동안 장부까지 보셨군요. 이제 그 이름과 함께 관에 누우시면 기록도 조용해지겠습니다."
      - say:
          char: 덕만.wanderer_angry
          camera: close
          with: [칠숙]
          text: "없는 사람 하나 잡겠다고 네 문을 닫고 군사를 풀었군. 고맙다, 칠숙. 내가 살아 있다는 증인은 네가 데려왔어."
      - choice:
          key: c2_witness
          prompt: "인장장이와 소화가 서로 다른 쪽으로 끌려간다. 이번에는 무엇을 잃지 않을까?"
          char: 덕만
          camera: reaction
          with: [칠숙]
          options:
            - text: "수레를 엎어 인장장이를 빼낸다"
              set: { saved_market_witness: true }
              add: { evidence: 2, people_support: 1 }
              goto: save_witness
            - text: "사람을 포기하고 인장함을 낚아챈다"
              set: { saved_market_witness: false }
              add: { evidence: 2, fear: 1 }
              goto: steal_seal
            - text: "소화를 밀어 보내고 추격을 끌고 간다"
              set: { saved_market_witness: false }
              add: { sohwa_trust: 2, army_support: 1 }
              goto: protect_sohwa

  save_witness:
    actions:
      - say:
          channel: narration
          text: "덕만이 멍에를 베자 놀란 소가 수레를 골목에 비스듬히 처박았습니다. 인장장이를 끌어냈을 때 군사들의 창끝은 이미 곡식 자루를 찢고 있었습니다."
      - get: market_seal
      - goto: checkpoint

  steal_seal:
    actions:
      - sticker: { id: c2_seal, image: market_seal_sticker, x: 50, y: 27, width: "clamp(150px, 18%, 280px)", anchorX: center, anchorY: center, enter: scaleIn }
      - say:
          channel: narration
          text: "덕만은 인장함을 낚아채 천막 기둥을 밟고 지붕으로 올랐습니다. 아래에서 인장장이가 이름을 외쳤지만, 덕만은 끝내 돌아보지 못했습니다."
      - get: market_seal
      - clearSticker: { id: c2_seal, leave: fadeOut }
      - goto: checkpoint

  protect_sohwa:
    actions:
      - char: { id: 소화, position: right, emotion: angry }
      - say:
          char: 소화.angry
          camera: close
          with: [덕만]
          text: "또 저만 살려 보내려고요? 불 속에서 같이 나왔다는 약속은 위험할 때마다 아기씨 기억에서 먼저 지워집니까?"
      - say:
          char: 덕만.wanderer
          camera: close
          with: [소화]
          text: "네가 살아야 내가 돌아갈 곳이 생겨. 하지만 그 말을 핑계로 혼자 남지는 않을게. 추격을 돌리고 바로 따라가."
      - get: market_seal
      - goto: checkpoint

  checkpoint:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          text: "검문소 횃불 아래, 별궁에서 본 표식이 바람에 흔들렸습니다. 정문에는 창이 겹쳤고 마른 수로는 어깨 하나가 겨우 들어갈 만큼 좁았습니다."
      - choice:
          key: c2_checkpoint
          prompt: "뒤에는 칠숙의 말발굽, 앞에는 왕실 창끝. 지난 탈출에서 배운 길로 거짓 기록을 뒤집어라."
          char: 덕만
          camera: medium
          with: [소화]
          options:
            - text: "마른 수로로 한 명씩 밀어 넣는다"
              when: { var: c1_escape_route, op: eq, value: waterway }
              add: { insight: 2, people_support: 1 }
              goto: return_to_silla
            - text: "모란패로 문을 열고 붉은 인장으로 추격대를 고발한다"
              when: { var: peony_token, op: eq, value: true }
              add: { nobles_support: 1, evidence: 1 }
              goto: turn_checkpoint
            - text: "빈 관에 숨어 죽은 사람으로 통과한다"
              when: { var: death_register, op: eq, value: true }
              add: { insight: 1, evidence: 1 }
              goto: return_in_coffin
            - text: "칠숙 앞에 걸어 나가 소화와 거래한다"
              goto: bad_surrender

  return_to_silla:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          text: "새벽 안개 속에서 검문소 횃불이 멀어졌습니다. 덕만은 달리는 수레 위에서 붉은 인장을 사망 기록 옆에 찍어 보았습니다. 흠집이 정확히 포개졌습니다."
      - say:
          char: 소화
          camera: close
          with: [덕만]
          text: "서라벌 성벽이 보이면… 만덕을 버리고 정말 덕만으로 들어가시는 겁니까?"
      - say:
          char: 덕만
          camera: close
          with: [소화]
          text: "돌아가는 게 아니야. 그 궁은 살아 있는 덕만을 가진 적이 없어. 이번에 처음, 내 이름을 내가 들고 들어가는 거야."
      - say:
          channel: narration
          text: "덕만은 성문 앞에서 수레를 세웠습니다. 밀랍 인장과 사망 기록의 한 줄을 궁 안으로 보냈습니다. 해가 지자 모란 향이 밴 짧은 답신이 돌아왔습니다."
      - say:
          channel: record
          text: "살아 있는 유령은 자신의 사망 기록과 국경의 붉은 인장을 들고 수도로 돌아왔습니다. 다음 문은 혈연이 아니라 두 증거를 함께 읽을 자매가 열어야 했습니다."
      - goto: /2.yaml

  return_in_coffin:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 빈 관 뚜껑 안쪽에 자기 사망 기록을 붙였습니다. 검문병은 죽은 공주의 이름을 읽고도 관 속에서 숨을 죽인 당사자를 끝내 찾지 못했습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "다시는 자기 죽음을 길로 쓰지 마세요. 살아 있는 아기씨가 관 속에서 숨을 참는 걸 저는 두 번 못 봅니다."
      - say:
          char: 덕만.wanderer_angry
          camera: close
          with: [소화]
          text: "다음에는 관이 아니라 이 기록을 열 거야. 사망 기록과 붉은 인장이 같은 손에서 나왔다는 걸 천명 언니부터 보게 하자."
      - say:
          channel: record
          text: "죽었다고 적힌 공주는 자기 사망 기록을 검문증으로 바꾸었습니다. 거짓 기록은 처음으로 그 기록이 지우려던 사람을 살렸습니다."
      - set: { identity_exposed: false }
      - add: { insight: 1, evidence: 1, sohwa_trust: 1 }
      - goto: /2.yaml

  turn_checkpoint:
    actions:
      - bg: frontier
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 모란패로 빗장을 반쯤 열고, 붉은 인장은 추격대가 보도록 다른 손에 높이 들었습니다. 두 표식은 한 사람의 신분증이 아니라 서로의 위조를 고발하는 증거처럼 보였습니다."
      - say:
          char: 덕만.wanderer_angry
          camera: close
          with: [소화]
          text: "왕실 문을 열 표식은 내가 갖고 있다. 그런데 뒤에서 왕실 인장을 든 자들이 나를 쫓는다. 누가 가짜인지 직접 가려 보겠나?"
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "문지기들이 추격대를 막았습니다. 하지만 이제 저들도 아기씨 얼굴을 잊지 않을 겁니다."
      - say:
          channel: record
          text: "국경 검문 기록 — 모란패를 든 여인이 붉은 인장의 위조를 고발한 새, 추격대는 신원 확인을 위해 시간을 잃음."
      - set: { identity_exposed: true }
      - add: { fear: 2, sohwa_trust: -1 }
      - goto: /2.yaml

  bad_surrender:
    actions:
      - bg: locked_room
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: wanderer_sad }
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          char: 덕만.wanderer_sad
          text: "칠숙, 나는 남겠다. 소화만 보내. 네가 찾는 건 살아 있는 공주지 유모가 아니잖아."
      - say:
          char: 칠숙.smile
          text: "그래서 더 보내 드릴 수 없습니다. 속임수는 달라도 끝에는 늘 살아 있는 공주가 남으니까요."
      - say:
          channel: narration
          text: "덕만이 스스로 걸어 나가자 군사들은 거래의 담보로 소화부터 붙잡았습니다. 칠숙은 약속을 논할 대신 두 사람의 이름을 검문 명부에서 지웠습니다."
      - say:
          channel: record
          text: "국경 도적 토벌 보고 — 신원을 알 수 없는 두 여인이 수색 중 사망. 왕실 혈족과의 관련 없음."
      - gameOver:
          title: "운명 — 죽은 사람의 검문"
          message: "칠숙이 지키는 문에서 자신을 담보로 거는 거래는 통하지 않았습니다. 덕만과 소화는 새벽 전에 죽었고 그 이름은 다시 국경 보고서에서 지워졌습니다."
          recoverToChoice: c2_checkpoint
