      - say:
          char: 비담.smirk
          camera: medium
          text: "그 뒤를 밟는 사람도 필요하겠군요. 위험한 일은 늘 제 몫입니까?"
      - say:
          char: 덕만
          camera: medium
          text: "싫으면 돌아가도 됩니다."
      - say:
          char: 비담.smirk
          camera: close
          text: "그렇게 말하면 더 가고 싶어지는 성격이라서요. 다녀오겠습니다."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - effect: focus
      - char:
          id: 비담
          position: right
      - say:
          with:
            - 비담
          delivery: calm
          text: "사흘째 · 밤. 덕만이 누명을 벗은 뒤, 비담은 등불 밖에 선 남자에게서 봉인된 합의서 원본을 받았습니다. 남자는 먹물 묻은 손만 보인 채 얼굴과 이름을 감추고 물러났습니다."
      - say:
          char: 덕만
          camera: medium
          with:
            - 비담
          text: "저 사람은 누구지? 이름이라도 듣고 가라고 해."
      - say:
          char: 비담
          camera: medium
          with:
            - 덕만
          text: "왕실 문서를 베끼는 관리입니다. 지금 이름을 말하면 가족이 다친다며 돌아갔습니다. 내일 다시 와서 직접 말하겠답니다."
      - say:
          char: 덕만.angry
          camera: close
          delivery: angry
          text: "이번에는 혼인이군. 죽이지 못했으니 누군가의 아내로 만들어 입을 막겠다는 거야."
          wait: 800
      - say:
          char: 비담.smirk
          camera: medium
          text: "세 가문이 같은 신부에게 서로 다른 값을 약속받았습니다. 청혼이라기보다 경매에 가깝습니다."
      - say:
          char: 덕만.angry
          camera: close
          text: "그럼 값을 매긴 사람부터 만나야겠지. 내 혼인을 내가 모르는 채로 정하게 두지는 않겠어."
      - get: marriage_pact
      - set:
          clue_marriage_pact: true
      - say:
          delivery: calm
          text: "다음 날 새벽, 왕좌 앞에서 ‘암살 의심’이라 적힌 나무패가 내려갔습니다. 비어 있던 못 세 개에는 서로 다른 가문의 혼인 문서가 나란히 걸렸고, 세 문서 모두 덕만의 이름 위를 붉은 혼인끈으로 묶고 있었습니다."

