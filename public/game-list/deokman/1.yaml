script:
  - scene: chapter1_open
  - scene: chapter1_end

scenes:
  chapter1_open:
    actions:
      - bg: council_hall
      - char:
          id: 진평왕
          position: right
          framing: full
      - char:
          id: 덕만
          position: left
          framing: full
      - say:
          text: "제1장 — 범인은 내 이름을 알고 있다"
      - say:
          char: 진평왕
          framing: full
          with:
            - 덕만
          text: "사흘이다. 네 이름에서 독 냄새를 씻어 내라. 나흘째에는 왕도, 아버지도 네 앞에 설 수 없다."
      - say:
          char: 덕만
          framing: bust
          text: "범인은 제 동선까지 압니다. 그들이 안심하고 비워 둔 곳부터 보겠습니다."
      - goto: investigate_choice

  investigate_choice:
    actions:
      - choice:
          key: c1_investigate
          prompt: "첫 단서를 어디서 찾을까?"
          char: 덕만
          framing: closeup
          options:
            - text: "부엌을 뒤진다"
              add:
                insight: 1
              goto: investigate_kitchen
            - text: "기록고를 뒤진다"
              add:
                insight: 1
                suspicion: 1
              goto: investigate_archive
            - text: "호위부를 심문한다"
              goto: go_07_guard_revolt
            - text: "방에서 기다린다"
              goto: go_08_waiting_room

  investigate_kitchen:
    actions:
      - bg: princess_chamber
      - char:
          id: 소원
          position: right
          framing: full
      - say:
          char: 소원
          framing: full
          with:
            - 덕만
          text: "술독도, 국자도, 잔도 깨끗해요. 이상한 건 행주뿐이에요. 공주님 손이 닿는 곳만 검은 가루로 닦았어요."
      - say:
          char: 덕만
          framing: closeup
          with:
            - 소원
          delivery: whisper
          text: "마시는 독이 아니야. 내 손에 묻혀, 내 이름을 죽이려던 거야."
      - add:
          sowon_trust: 1
      - goto: rumor_choice

  investigate_archive:
    actions:
      - char:
          id: 비담
          position: right
          framing: full
      - say:
          char: 비담
          framing: bust
          with:
            - 덕만
          text: "먹은 새것, 붓은 죽은 관리의 것. 오늘 만든 거짓말에 삼 년 전 필체를 입혔군요."
      - say:
          char: 덕만
          framing: bust
          with:
            - 비담
          text: "일부러 틀렸군. 나를 그대에게 보내려고."
      - add:
          bidam_trust: 1
      - goto: rumor_choice

  rumor_choice:
    actions:
      - say:
          char: 비담
          framing: bust
          text: "저쪽이 공주님을 구경하고 있습니다. 손님을 오래 세워 둘 수는 없지요. 어떤 거짓말을 안주로 내시겠습니까?"
      - choice:
          key: c1_rumor
          prompt: "어떤 소문으로 덫을 놓을까?"
          char: 덕만
          framing: closeup
          with:
            - 비담
          options:
            - text: "백제 상인 탓이라 한다"
              add:
                insight: 1
              goto: rumor_baekje
            - text: "왕이 범인을 봤다 한다"
              add:
                power: 1
              goto: rumor_king
            - text: "목격자가 살아 있다 한다"
              add:
                suspicion: 1
                sowon_trust: -1
              goto: rumor_witness
            - text: "후계 지명을 꾸민다"
              goto: go_09_false_heir

  rumor_baekje:
    actions:
      - say:
          text: "백제 상인 소문이 반나절 만에 궁을 돌았다. 그날 밤 국산의 하인이 국경 상단 장부를 품고 담을 넘었다."
      - say:
          char: 덕만
          framing: bust
          text: "믿은 사람은 입을 열었고, 두려워한 사람은 발을 움직였군. 발자국을 따라가자."
      - goto: evidence_choice

  rumor_king:
    actions:
      - say:
          text: "왕이 범인을 보았다는 소문에 문병객이 줄을 섰다. 오지 않은 세 사람의 이름만 빈 마루 위에 선명하게 남았다."
      - add:
          legitimacy: 1
      - goto: evidence_choice

  rumor_witness:
    actions:
      - say:
          char: 소원.angry
          framing: bust
          text: "살아 있는 목격자라니까 모두 절 봤어요. 제 이름을 미끼로 쓸 거면, 먼저 말해 줬어야죠."
      - say:
          char: 덕만.sad
          framing: bust
          text: "맞아. 네가 겁먹는 걸 보면서도 네 이름을 썼어. 미안해. 오늘 안에 끝낼게."
      - goto: evidence_choice

  evidence_choice:
    actions:
      - bg: council_hall
      - say:
          text: "사흘째 새벽. 바뀐 명단, 독 묻은 행주, 담 아래 붙잡힌 하인이 같은 탁자 위에 놓였다."
      - choice:
          key: c1_evidence
          prompt: "증거를 어떻게 쓸까?"
          char: 덕만
          framing: closeup
          options:
            - text: "왕에게만 보인다"
              add:
                legitimacy: 2
              goto: evidence_king
            - text: "하인을 거짓 전령으로 쓴다"
              add:
                insight: 2
                power: 1
                suspicion: 1
              goto: evidence_reverse
            - text: "국산을 공개 지목한다"
              goto: go_10_right_without_proof
            - text: "모두 태운다"
              goto: go_11_innocent_exile

  evidence_king:
    actions:
      - say:
          char: 진평왕
          framing: bust
          text: "네가 죄 없다는 것은 알겠다. 그런데 덕만아, 죄 없는 사람이 다음 칼도 피할 수 있겠느냐?"
      - say:
          char: 덕만
          framing: bust
          text: "아니요. 그래서 결백만 청하지 않겠습니다. 칼을 든 손이 돌아갈 곳까지 보겠습니다."
      - goto: chapter1_end

  evidence_reverse:
    actions:
      - say:
          char: 비담
          framing: bust
          text: "하인을 풀어 주셨으니, 이제 적이 보내는 편지를 매일 받아 보시겠군요. 답장은 제가 태워 드릴까요?"
      - say:
          char: 덕만
          framing: bust
          text: "아니. 계속 배달하게 두세요. 잡힌 손은 입을 다물지만, 의심받지 않는 손은 길을 보여 주니까."
      - goto: chapter1_end

  chapter1_end:
    actions:
      - effect: focus
      - say:
          text: "덕만은 누명을 벗었다. 배후는 놓쳤지만, 하인의 품에서 다음 계획을 발견했다."
      - say:
          char: 덕만
          framing: closeup
          delivery: angry
          text: "죽이지 못한 여자는 남의 아내로 보관하겠다…… 내 목숨에 값을 매겼군."
          wait: 800
      - get: marriage_pact
      - set:
          clue_marriage_pact: true
      - say:
          text: "제1장 완료 — 덕만은 결백을 얻는 대신, 혼인을 거부할 자유를 잃었다."

  go_07_guard_revolt:
    actions:
      - gameOver:
          title: "운명 07 — 충성의 칼"
          message: "덕만은 호위부를 한꺼번에 의심했다. 그날 밤 그녀를 지킬 병사는 아무도 보초에 서지 않았다. 충성을 시험한 공주는 충성이 사라진 자리에서 죽었다."
  go_08_waiting_room:
    actions:
      - gameOver:
          title: "운명 08 — 기다리는 사람"
          message: "증거는 나타나지 않았고 문밖의 증인만 하나씩 사라졌다. 사흘째 아침 문이 열렸을 때, 덕만은 결백을 말할 사람도 들을 사람도 없었다."
  go_09_false_heir:
    actions:
      - gameOver:
          title: "운명 09 — 가짜 왕명"
          message: "후계자 지명 소문은 왕의 권위를 훔친 죄가 되었다. 암살범보다 먼저 잡힌 것은 소문을 만든 공주였다. 국산은 재판에서 가장 슬픈 얼굴로 유죄를 청했다."
  go_10_right_without_proof:
    actions:
      - gameOver:
          title: "운명 10 — 정답을 맞힌 죄인"
          message: "국산이 배후라는 추리는 옳았다. 하지만 옳은 말과 증명된 말은 궁에서 서로 다른 목숨값을 가졌다. 덕만은 정답을 남기고 처형되었다."
  go_11_innocent_exile:
    actions:
      - gameOver:
          title: "운명 11 — 죄 없는 죄인"
          message: "증거가 사라지자 죄도 사라진 듯 보였다. 그러나 결백을 증명할 것도 함께 사라졌다. 덕만은 살아서 궁을 나갔고, 다시는 왕위 가까이 돌아오지 못했다."
