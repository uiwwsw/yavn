chapterTitle: "살아 있는 유령"

script:
  - scene: ten_years_later

scenes:
  ten_years_later:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: action
          text: "“만덕아!” 장시의 종소리 사이로 소화가 부른다. 나는 세던 엽전을 쥔다. 십 년을 불린 이름인데도, 군화 소리가 섞이면 돌아보는 게 늦어진다."
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          channel: thought
          camera: medium
          text: "수색표를 누른 붉은 인장. 오른쪽 아래가 비었다. 장부 귀퉁이에도 같은 흠이 있다. 서라벌 서쪽 창고… 이 이름부터 기억해 두자."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만]
          text: "남문에 그자의 말이 있습니다. 지금 나서면 반나절은 앞설 수 있어요."
      - say:
          char: 덕만
          camera: medium
          with: [소화]
          text: "소화. 우리 저 도장 때문에 몇 번이나 짐을 쌌지? 오늘은 보고 갈래."
      - goto: choose_identity

  choose_identity:
    actions:
      - choice:
          key: c2_identity
          prompt: "장부가 눈앞에 있다. 칠숙의 말소리도 가까워진다."
          char: 덕만
          camera: medium
          with: [소화]
          options:
            - text: "왕실 감찰관 행세로 장부를 뺏는다"
              set: { identity_mode: borrowed }
              add: { fear: 1, evidence: 1 }
              goto: borrowed_inquiry
            - text: "장부꾼 만덕으로 시비를 건다"
              set: { identity_mode: hidden, identity_exposed: false }
              add: { insight: 1, sohwa_trust: 1 }
              goto: hidden_inquiry
            - text: "장터 한복판에서 덕만이라 밝힌다"
              set: { identity_mode: public, identity_exposed: true }
              add: { people_support: 2, fear: 1 }
              goto: public_inquiry

  hidden_inquiry:
    actions:
      - say:
          channel: action
          text: "합계를 한 닢 부풀려 읽는다. 상인이 삿대질을 하며 인장장이를 부른다. 구경꾼들이 몰리는 틈에 내 손이 장부 밑으로 들어간다."
      - say:
          char: 소화
          camera: medium
          with: [덕만]
          text: "참 잘도 싸우십니다. 제가 망볼 테니 얼른요."
      - goto: market_crackdown

  borrowed_inquiry:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - say:
          channel: narration
          text: "왕실 감찰이라는 말에 상인들이 길을 텄다. 덕만이 장부에 손을 얹을 즈음, 거리 끝에서 진짜 감찰의 깃발이 올라왔다."
      - say:
          char: 덕만.wanderer
          camera: medium
          with: [소화]
          text: "소화, 저 깃발 좀 가려 줘. 이것만 꺼내면 돼."
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "감찰 나리. 소신과도 인사를 나누셔야지요."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만, 칠숙]
          text: "손 떼셔요. 장부 말고 제 손을 잡으셔요!"
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "국경 재판 기록 — 왕실 감찰을 사칭한 만덕과 공범 소화, 반역 혐의로 당일 참수."
      - gameOver:
          title: "운명 — 빌린 이름의 목"
          message: "감찰관은 덕만의 이름을 묻지 않았다. 왕실을 사칭했다는 죄목만 받아 적었다. 형틀 곁에는 소화의 자리도 마련되어 있었다."
          recoverToChoice: c2_identity

  public_inquiry:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - say:
          channel: narration
          text: "늙은 상인이 무릎을 꿇었다. 그를 따라 머리를 숙이는 사람들 사이로, 좌판을 접는 손이 보였다. 빈자리에 군사의 창끝이 들어섰다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만]
          text: "아기씨, 보셔요. 사람들이 물러납니다. 저 길로는 못 나가요."
      - say:
          char: 덕만.wanderer_angry
          camera: medium
          with: [소화]
          text: "다들 보고 있다. 칠숙, 여기서도 나를 못 알아보겠느냐?"
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 소화]
          text: "알아뵙기에 온 것이지요. 다른 이들까지 알아보기 전에."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "국경 소요 보고 — 죽은 공주를 사칭한 여인이 군중을 선동하다 사살됨."
      - gameOver:
          title: "운명 — 너무 일찍 부른 이름"
          message: "누군가 공주를 부르려다 입을 막았다. 첫 화살이 날아왔을 때 군중은 덕만을 감싸지 못했다. 모두 저마다의 아이를 끌어안았다."
          recoverToChoice: c2_identity

  market_crackdown:
    actions:
      - effect: darken
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          channel: action
          camera: wide
          text: "사방에서 문 닫는 소리가 난다. 걷힌 좌판 하나가 군사의 발에 차여 내 앞까지 밀려온다. 인장장이가 그 밑으로 몸을 웅크린다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "오래 찾았습니다. 이번에는 소신의 발품을 좀 아껴 주시지요."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만, 칠숙]
          text: "장인을 데려가야 합니다. 저 흠을 아는 사람이에요. 인장만으로는 안 됩니다."
      - say:
          char: 덕만.wanderer_angry
          camera: medium
          with: [칠숙]
          text: "죽은 아이 하나 찾느라 온 장터를 막았구나. 네 주인은 내가 그리 무섭다더냐?"
      - choice:
          key: c2_witness
          prompt: "인장장이가 넘어진다. 반대편에서 소화가 끌려간다."
          char: 덕만
          camera: medium
          with: [칠숙]
          options:
            - text: "사람을 포기하고 인장함을 낚아챈다"
              set: { saved_market_witness: false }
              add: { evidence: 2, fear: 1 }
              goto: steal_seal
            - text: "소화를 밀어 보내고 추격을 끌고 간다"
              set: { saved_market_witness: false }
              add: { sohwa_trust: 2, army_support: 1 }
              goto: protect_sohwa
            - text: "수레를 엎어 인장장이를 빼낸다"
              set: { saved_market_witness: true }
              add: { evidence: 2, people_support: 1 }
              goto: save_witness

  save_witness:
    actions:
      - say:
          channel: action
          text: "소의 멍에를 끊는다. 놀란 소가 수레를 비틀며 군사들 사이로 뛰어든다. 나는 그 밑에 깔린 장인의 팔을 잡아 뺀다."
      - get: market_seal
      - goto: checkpoint

  steal_seal:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - sticker: { id: c2_seal, image: market_seal_sticker, x: 50, y: 27, width: "clamp(150px, 18%, 280px)", anchorX: center, anchorY: center, enter: scaleIn }
      - say:
          channel: narration
          text: "인장함을 겨드랑이에 낀 채 지붕으로 올랐다. 아래에서 장인이 덕만의 옷자락을 부르듯 손을 뻗었다. 잡아 주려면 다시 내려가야 했다."
      - get: market_seal
      - clearSticker: { id: c2_seal, leave: fadeOut }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "그 함이 탐나셨습니까? 주인은 여기 두고 가셔도 됩니다."
      - say:
          char: 덕만.wanderer_angry
          camera: medium
          with: [칠숙]
          text: "칠숙, 그 사람 놔. 함을 돌려줄 테니—"
      - say:
          channel: narration
          text: "장인의 팔이 꺾였다. 덕만이 기왓장을 움켜쥔 사이, 맞은편 지붕에서 궁수가 일어섰다. 내려갈 곳이 없었다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "국경 절도 보고 — 왕실 인장을 훔친 신원 미상 여인, 추격 중 사망. 인장장이도 현장에서 사망."
      - gameOver:
          title: "운명 — 증거만 건진 손"
          message: "함은 끝내 열어 보지 못했다. 덕만의 손에서 떨어진 인장을 칠숙이 주워 닦았다. 그 흠을 증언할 장인도 살아남지 못했다."
          recoverToChoice: c2_witness

  protect_sohwa:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - char: { id: 소화, position: right, emotion: angry }
      - say:
          char: 소화.angry
          camera: medium
          with: [덕만]
          text: "같이 나가자던 아기씨는 어디 가셨습니까? 이번에도 저더러 혼자 가라 하시게요?"
      - say:
          char: 덕만.wanderer
          camera: medium
          with: [소화]
          text: "골목만 돌아서 따라갈게. 소화, 이번 한 번만 내 말 들어."
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만, 소화]
          text: "저 여인을 저리 아끼시니 다행입니다. 멀리 달아나시지는 않겠군요."
      - say:
          channel: narration
          text: "골목을 돌아온 소화의 두 손이 묶여 있었다. 덕만은 달리던 발을 멈췄다. 뒤에서 군사들이 덮쳐도 소화에게서 눈을 떼지 못했다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "국경 도적 처형 명부 — 만덕, 소화. 공범의 신원과 목적은 확인하지 않음."
      - gameOver:
          title: "운명 — 돌아오게 만든 미끼"
          message: "서로를 두고 달아나지 못할 줄 칠숙은 알고 있었다. 새벽 형장에서도 소화는 덕만 쪽으로 몸을 돌렸다."
          recoverToChoice: c2_witness

  checkpoint:
    actions:
      - bg:
          id: "frontier"
          transition: "wipeLeft"
          duration: 700
      - music: "night_road"
      - char:
          id: "소화"
          position: "right"
      - say:
          camera: wide
          channel: action
          text: "횃불 아래로 수로 입구가 드러난다. 진흙에 새 장화 자국이 찍혀 있다. 문지기는 내 손의 패를 보다가 추격대의 인장으로 눈을 옮긴다."
      - choice:
          key: "c2_checkpoint"
          prompt: "문지기가 창을 내린다. 칠숙의 말발굽이 들린다."
          char: "덕만"
          camera: "medium"
          with:
            - "소화"
          options:
            - text: "모란패로 문을 열고 붉은 인장으로 추격대를 고발한다"
              when:
                var: "peony_token"
                op: "eq"
                value: true
              add:
                nobles_support: 1
                evidence: 1
              goto: "turn_checkpoint"
            - text: "마른 수로로 한 명씩 밀어 넣는다"
              when:
                var: "c1_escape_route"
                op: "eq"
                value: "waterway"
              add:
                insight: 2
                people_support: 1
              goto: "return_to_silla"
            - text: "빈 관에 숨어 죽은 사람으로 통과한다"
              when:
                var: "death_register"
                op: "eq"
                value: true
              add:
                insight: 1
                evidence: 1
              goto: "return_in_coffin"
            - text: "칠숙 앞에 걸어 나가 소화와 거래한다"
              goto: "bad_surrender"
            - text: "결정 전에 증거를 나란히 살핀다"
              goto: "evidence_seals"

  return_to_silla:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          camera: wide
          channel: narration
          text: "수로에 들어서자 물이 차가웠다. 뒤에서 쇠창살이 떨어졌다. 덕만이 앞으로 기어가 손을 뻗었을 때, 그곳에서도 쇠가 잡혔다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만]
          text: "아까 그 발자국… 우리가 먼저 본 건데."
      - char: { id: 칠숙, position: center, emotion: smile }
      - say:
          char: 덕만.wanderer_sad
          camera: medium
          with: [소화, 칠숙]
          text: "소화, 뒤로 와. 내가… 내가 한 번 더 밀어 볼게."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "이 길을 잊지 않으셨군요. 소신도 잊지 않았습니다."
      - say:
          channel: narration
          delivery: nervous
          text: "철창 사이로 활이 들어왔다. 덕만은 소화를 제 뒤로 밀었다. 어둠 속 화살촉만 두 사람을 따라 움직였다."
      - attack:
          attacker: 칠숙
          target: 덕만
          from: right
          style: shot
          image: chilsuk_bow_cutin
          anticipation: 900
          recovery: 850
          caption: "수로 안에서, 피할 곳 없는 한 발."
      - say:
          channel: narration
          delivery: nervous
          wait: 400
          unskippable: true
          text: "시위가 울리고 물이 튀었다. 덕만의 무릎이 꺾였다. 바깥에서는 돌 쌓는 소리가 나기 시작했다. 소화가 부르는 이름을 덮을 만큼 크게."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "국경 수로 보수 기록 — 침입자 둘을 철창 안에서 사살한 뒤 통로를 폐쇄함."
      - gameOver:
          title: "운명 — 기억된 탈출로"
          message: "십 년 전 빠져나온 길이었다. 이번에는 물이 흐르는 틈마저 돌로 메워졌다."
          recoverToChoice: c2_checkpoint

  return_in_coffin:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          camera: wide
          channel: narration
          text: "관 안은 생각보다 좁았다. 무릎을 접은 덕만의 뺨에 소화의 숨이 닿았다. 수레가 멎더니, 머리맡에서 못 박는 소리가 났다."
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만]
          text: "아기씨. 못을 박습니다. 밖에서… 못을 박아요."
      - say:
          char: 덕만.wanderer_angry
          camera: medium
          with: [소화]
          text: "이쪽을 밀어. 내가 셀게. 하나, 둘… 소화, 연기 나지 않아?"
      - say:
          channel: narration
          text: "뚜껑은 들리지 않았다. 덕만은 틈에 손가락을 넣었다가 뺐다. 뜨거웠다. 밑바닥에서 스며든 연기에 두 사람이 동시에 기침했다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "무연고 관 운송 기록 — 역병 예방을 위해 개봉하지 않고 즉시 화장함."
      - gameOver:
          title: "운명 — 두 번째 장례"
          message: "관을 두드리는 소리는 수레바퀴에 묻혔다. 죽었다는 문서를 붙인 관은 검문을 거쳐 그대로 화장터로 향했다."
          recoverToChoice: c2_checkpoint

  turn_checkpoint:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: action
          text: "문지기의 코앞에 패와 인장을 나란히 든다. 그의 시선이 깨진 모서리에 멎는다. 뒤쫓아온 군사들에게 창을 돌리는 순간, 나는 소화의 손을 당긴다."
      - say:
          char: 덕만.wanderer_angry
          camera: medium
          with: [소화]
          text: "내 패부터 보아라. 이제 저 인장을 보아라. 깨진 왕인을 누가 쓰게 했느냐?"
      - say:
          char: 소화.nervous
          camera: medium
          with: [덕만]
          text: "길 났습니다. 아기씨, 지금이어요!"
      - say:
          channel: record
          text: "국경 검문 기록 — 모란패를 든 여인이 붉은 인장의 위조를 고발한 새, 추격대는 신원 확인을 위해 시간을 잃음."
      - set: { identity_exposed: true }
