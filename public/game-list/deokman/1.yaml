          char: 덕만.wanderer_angry
          camera: close
          with: [소화]
          text: "문지기, 잘 봐. 문을 여는 모란패는 내 손에 있고 왕실 인장을 든 자들이 나를 쫓고 있어. 둘 다 진짜일 수는 없잖아."
      - say:
