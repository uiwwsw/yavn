script:
  - scene: ten_years_later

scenes:
  ten_years_later:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: record
          delivery: calm
          text: "십 년 뒤. 국경 장시의 종이 세 번 울리자 '만덕'은 셈을 멈췄습니다. 죽은 공주를 찾는 군화 소리가 장터로 들어왔습니다."
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          camera: medium
          text: "덕만의 손가락이 두 장부 사이를 오갔습니다. 난민을 잡는 종이와 곡식을 옮기는 종이에 같은 붉은 흠집이 있었습니다. 목적지는 둘 다 서라벌 서쪽 창고."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "칠숙입니다. 남문에 그 사람 말이 묶여 있어요. 해 지기 전에 짐을 싸야 합니다."
      - say:
          char: 덕만
          camera: close
          with: [소화]
          text: "십 년을 달렸는데 저 도장이 늘 먼저 도착했어. 오늘은 내가 기다릴 차례야."
      - goto: choose_identity

  choose_identity:
    actions:
      - choice:
          key: c2_identity
          prompt: "칠숙이 장터에 들어온다. 어떤 얼굴로 장부에 다가갈까?"
          char: 덕만
          camera: close
          with: [소화]
          options:
            - text: "장부꾼 만덕으로 시비를 건다"
              set: { identity_mode: hidden, identity_exposed: false }
              add: { insight: 1, sohwa_trust: 1 }
              goto: hidden_inquiry
            - text: "왕실 감찰관 행세로 장부를 뺏는다"
              set: { identity_mode: borrowed }
              add: { fear: 1, evidence: 1 }
              goto: bad_borrowed_name
            - text: "장터 한복판에서 덕만이라 밝힌다"
              set: { identity_mode: public, identity_exposed: true }
              add: { people_support: 2, fear: 1 }
              goto: bad_public_name

  hidden_inquiry:
    actions:
      - say:
          channel: narration
          text: "덕만이 틀린 합계를 큰 소리로 읽자 상인이 욕설을 뱉으며 인장장이를 불렀습니다. 모두가 싸움 구경에 몰렸고 장부는 탁자 위에 열린 채 남았습니다."
      - say:
          char: 소화
          camera: medium
          with: [덕만]
          text: "아무도 우릴 보지 않네요. 좋은데… 칼이 오면 아무도 우릴 위해 서 주지도 않겠죠."
      - goto: market_crackdown

  bad_borrowed_name:
    actions:
      - bg: village
      - camera: close
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만이 감찰패를 탁자에 내리치자 상인들이 장부를 내밀었습니다. 그때 장터 반대편에서 같은 문양의 진짜 깃발이 올라왔습니다."
      - say:
          char: 소화.nervous
          camera: reaction
          with: [덕만]
          text: "아기씨, 저 관원은 패를 들지 않았어요. 모두가 얼굴을 알아서 길을 비킨 겁니다."
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "왕실의 이름을 빌렸으니 왕실의 법으로 죽으시면 되겠습니다. 이번 장부에는 틀리지 않게 적지요."
      - say:
          channel: record
          text: "국경 감찰 사칭 사건 — 덕만이라 자칭한 여인과 공범 소화, 반역 혐의로 해 지기 전 처형."
      - gameOver:
          title: "운명 — 빌린 이름의 목"
          message: "진짜 감찰관의 깃발이 장터에 들어오자 덕만의 가짜 직함은 반역 자백이 되었습니다. 칠숙은 해가 지기 전에 덕만과 소화를 처형했습니다."

  bad_public_name:
    actions:
      - bg: village
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          char: 덕만.wanderer_angry
          camera: close
          text: "내 이름은 덕만이다. 열병으로 죽은 적도, 이 장터에서 숨을 이유도 없어."
      - say:
          channel: narration
          text: "늙은 상인이 무릎을 꿇는 동안 맞은편 좌판에서는 현상수배 전단이 조용히 접혔습니다. 환호보다 봉화가 먼저 골목을 건넜습니다."
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          char: 칠숙.smile
          camera: reaction
          with: [덕만]
          text: "살아 계신 걸 축하드립니다. 이제 목격자 모두 앞에서 다시 죽으시면 기록도 더 단단해지겠군요."
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "이름을 되찾는 날엔 그 이름을 지켜 줄 사람도 함께 있어야 했어요… 너무 빨랐습니다."
      - gameOver:
          title: "운명 — 너무 일찍 되찾은 이름"
          message: "덕만의 이름을 들은 군중보다 칠숙의 칼이 먼저 움직였습니다. 살아 있다는 증거를 모으기 전에 정체를 드러낸 공주는 장터에서 다시 죽었습니다."

  market_crackdown:
    actions:
      - effect: darken
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          channel: narration
          camera: wide
          text: "마지막 햇빛이 처마에서 사라지자 네 문이 동시에 닫혔습니다. 군사들이 좌판을 걷어차며 종이에 그려진 얼굴과 사람들을 번갈아 보았습니다."
      - say:
          char: 칠숙.smile
          camera: medium
          with: [덕만]
          text: "죽은 분이 참 멀리도 도망치셨습니다. 이제 관에 누우시지요."
      - say:
          char: 덕만.wanderer_angry
          camera: close
          with: [칠숙]
          text: "죽은 아이 하나 잡겠다고 군사를 몰고 왔어? 고맙네. 내 이름을 네가 증명해 줬어."
      - choice:
          key: c2_witness
          prompt: "인장장이의 비명과 소화의 손이 동시에 멀어진다. 누구에게 뛸까?"
          char: 덕만
          camera: reaction
          with: [칠숙]
          options:
            - text: "수레를 엎어 인장장이를 빼낸다"
              set: { saved_market_witness: true }
              add: { evidence: 2, people_support: 1 }
              goto: save_witness
            - text: "사람을 포기하고 인장함을 낚아챈다"
              set: { saved_market_witness: false }
              add: { evidence: 2, fear: 1 }
              goto: bad_seal_without_witness
            - text: "소화를 밀어 보내고 추격을 끌고 간다"
              set: { saved_market_witness: false }
              add: { sohwa_trust: 2, army_support: 1 }
              goto: bad_lone_decoy

  save_witness:
    actions:
      - say:
          channel: narration
          text: "덕만이 멍에를 베자 놀란 소가 수레를 골목에 비스듬히 처박았습니다. 인장장이를 끌어냈을 때 군사들의 창끝은 이미 곡식 자루를 찢고 있었습니다."
      - get: market_seal
      - goto: checkpoint

  bad_seal_without_witness:
    actions:
      - bg: village
      - camera: close
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 비명 쪽을 보지 않고 인장함을 낚아챘습니다. 뚜껑 안의 붉은 밀랍은 사망 기록과 정확히 같았습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "그걸 누가 만들었는지 말해 줄 사람은 방금 죽었습니다. 이제 저 인장이 누구 것인지 누가 믿겠습니까?"
      - say:
          char: 덕만.wanderer_angry
          text: "증거를 잡았는데… 증거가 내 손만 가리키고 있어."
      - say:
          channel: record
          text: "장터 살인 보고 — 사라진 인장함은 덕만이라 자칭한 여인의 소지품에서 발견. 증인은 현장에서 사망함."
      - gameOver:
          title: "운명 — 증거만 건진 손"
          message: "덕만이 인장함을 낚아채는 동안 인장장이는 칠숙의 칼에 쓰러졌습니다. 증언할 사람이 사라지자 훔친 인장은 덕만의 범죄 증거가 되었고, 추격은 새벽 전에 끝났습니다."

  bad_lone_decoy:
    actions:
      - bg: village
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer_angry }
      - char: { id: 소화, position: right, emotion: angry }
      - say:
          char: 덕만.wanderer_angry
          text: "서문으로 뛰어. 내가 반대 골목으로 군사를 끌고 갈게. 뒤돌아보지 마."
      - say:
          char: 소화.angry
          camera: reaction
          with: [덕만]
          text: "같이 살자고 하셨잖아요. 왜 위험할 때마다 그 약속에서 저만 밀어냅니까?"
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          channel: narration
          text: "소화의 발소리가 멀어지자 막다른 골목 양쪽에서 창끝이 들어왔습니다. 덕만에게는 증인도 퇴로도 남지 않았습니다."
      - say:
          char: 칠숙.smile
          camera: close
          with: [덕만]
          text: "혼자 남는 용기는 기록하기 참 쉽습니다. 죽은 사람은 반박하지 않으니까요."
      - gameOver:
          title: "운명 — 혼자 남은 미끼"
          message: "소화는 빠져나갔지만 덕만은 증인도 퇴로도 없는 골목에 홀로 남았습니다. 칠숙은 살아 있는 공주를 붙잡아 사망 기록의 마지막 빈칸을 채웠습니다."

  checkpoint:
    actions:
      - bg: frontier
      - camera: wide
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          text: "검문소 횃불 아래, 별궁에서 본 표식이 바람에 흔들렸습니다. 정문에는 창이 겹쳤고 마른 수로는 어깨 하나가 겨우 들어갈 만큼 좁았습니다."
      - choice:
          key: c2_checkpoint
          prompt: "뒤에서는 말발굽, 앞에서는 창끝이 다가온다. 길을 만들어라."
          char: 덕만
          camera: medium
          with: [소화]
          options:
            - text: "마른 수로로 한 명씩 밀어 넣는다"
              when: { var: c1_escape_route, op: eq, value: waterway }
              add: { insight: 2, people_support: 1 }
              goto: return_to_silla
            - text: "모란패와 붉은 인장을 한꺼번에 내민다"
              when: { var: peony_token, op: eq, value: true }
              add: { nobles_support: 1, evidence: 1 }
              goto: bad_surrender
            - text: "빈 관에 숨어 죽은 사람으로 통과한다"
              when: { var: death_register, op: eq, value: true }
              add: { insight: 1, evidence: 1 }
              goto: return_in_coffin
            - text: "칠숙 앞에 걸어 나가 소화와 거래한다"
              goto: bad_surrender

  return_to_silla:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right }
      - say:
          channel: narration
          text: "새벽 안개 속에서 검문소 횃불이 멀어졌습니다. 덕만은 달리는 수레 위에서 붉은 인장을 사망 기록 옆에 찍어 보았습니다. 흠집이 정확히 포개졌습니다."
      - say:
          char: 소화
          camera: close
          with: [덕만]
          text: "서라벌 성벽이 보이면… 정말 돌아가시는 겁니까?"
      - say:
          char: 덕만
          camera: close
          with: [소화]
          text: "돌아가는 게 아니야. 처음으로 들어가는 거야. 내 이름을 가진 채로."
      - say:
          channel: narration
          text: "덕만은 성문 앞에서 수레를 세웠습니다. 밀랍 인장과 사망 기록의 한 줄을 궁 안으로 보냈습니다. 해가 지자 모란 향이 밴 짧은 답신이 돌아왔습니다."
      - say:
          channel: record
          text: "살아 있는 유령은 자신의 사망 기록과 국경의 붉은 인장을 들고 수도로 돌아왔습니다. 다음 문은 혈연이 아니라 두 증거를 함께 읽을 자매가 열어야 했습니다."
      - goto: /2.yaml

  return_in_coffin:
    actions:
      - bg: moon_court
      - camera: wide
      - char: { id: 덕만, position: left, emotion: wanderer }
      - char: { id: 소화, position: right, emotion: nervous }
      - say:
          channel: narration
          text: "덕만은 빈 관 뚜껑 안쪽에 자기 사망 기록을 붙였습니다. 검문병은 죽은 공주의 이름을 읽고도 관 속에서 숨을 죽인 당사자를 끝내 찾지 못했습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "다시는 이런 길 쓰지 마세요. 살아 있는 분이 자기 관에 눕는 걸 두 번은 못 보겠습니다."
      - say:
          char: 덕만.wanderer_angry
          camera: close
          with: [소화]
          text: "다음에는 관을 만든 사람을 눕힐 거야. 이 기록과 붉은 인장이 같은 손에서 나왔다는 걸 천명에게 보여 주자."
      - say:
          channel: record
          text: "죽었다고 적힌 공주는 자기 사망 기록을 검문증으로 바꾸었습니다. 거짓 기록은 처음으로 그 기록이 지우려던 사람을 살렸습니다."
      - set: { identity_exposed: false }
      - add: { insight: 1, evidence: 1, sohwa_trust: 1 }
      - goto: /2.yaml

  bad_surrender:
    actions:
      - bg: locked_room
      - camera: close
      - char: { id: 덕만, position: left, emotion: wanderer_sad }
      - char: { id: 칠숙, position: right, emotion: smile }
      - say:
          char: 덕만.wanderer_sad
          text: "문서도 얼굴도 확인했으니 길을 열어. 우리가 누군지는 네가 가장 잘 알잖아."
      - say:
          char: 칠숙.smile
          text: "그래서 더 보내 드릴 수 없습니다. 속임수는 달라도 끝에는 늘 살아 있는 공주가 남으니까요."
      - say:
          channel: narration
          text: "모란패를 붉은 인장과 함께 내밀자 왕실 표식이 덕만의 얼굴을 증명했습니다. 스스로 칠숙 앞에 걸어 나간 경우에도 군사들은 소화부터 붙잡았습니다. 서로 다른 거래가 같은 검문실 문 앞에서 끝났습니다."
      - say:
          channel: record
          text: "국경 도적 토벌 보고 — 신원을 알 수 없는 두 여인이 수색 중 사망. 왕실 혈족과의 관련 없음."
      - gameOver:
          title: "운명 — 죽은 사람의 검문"
          message: "칠숙이 지키는 문에서 왕실 표식과 사망 기록은 통행증이 아니라 처형할 사람을 확인하는 증거였습니다. 덕만과 소화는 새벽 전에 죽었고 그 이름은 다시 국경 보고서에서 지워졌습니다."
          recoverToChoice: c1_fire_escape
