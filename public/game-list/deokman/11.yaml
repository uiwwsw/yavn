script:
  - scene: last_trial

scenes:
  last_trial:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제12장 — 마지막 기록"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "증거상 위에 불탄 연, 비담의 편지, 어린 덕만의 사망 기록이 놓였습니다. 궁문 밖에는 세 줄이 생겼습니다. 비담을 죽이라는 사람, 살리라는 사람, 그리고 어느 쪽이든 먼저 자기 가족 이름부터 적어 달라는 사람들."
      - say:
          when: { var: rebellion_response, op: eq, value: siege_trial }
          channel: record
          text: "재판 명부 첫 장에는 포위 사흘 동안 솥이 식은 성 밖 마을의 이름이 적혔습니다. 칼을 덜 쓴 승리도 굶은 사람 앞에서는 무죄가 아니었습니다."
      - say:
          when: { var: rebellion_response, op: eq, value: amnesty_split }
          channel: narration
          text: "해산 북을 듣고 돌아간 농민들은 궁문 밖 세 줄 어디에도 서지 않았습니다. 덕만은 비어 있는 네 번째 줄까지 판결문에 남기게 했습니다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "살리면 사랑이라 하고, 죽이면 제 말을 겁냈다 하겠지요. 폐하는 어느 기록이 더 두렵습니까?"
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내가 덜 아픈 쪽을 고르진 않겠다. 네 반역도, 네 권력을 키운 내 책임도 따로 적을 거야."
      - goto: bidam_sentence_choice

  bidam_sentence_choice:
    actions:
      - choice:
          key: c12_bidam_sentence
          prompt: "비담의 반역을 어떻게 판결할까요?"
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "반란 지휘의 책임을 물어 처형한다"
              set: { bidam_sentence: execution }
              add: { fear: 2, nobles_support: 1, mercy: -1 }
              goto: sentence_execution
            - text: "모든 이름을 빼앗고 국경으로 추방한다"
              set: { bidam_sentence: exile }
              add: { mercy: 2, people_support: 1, nobles_support: -1 }
              goto: sentence_exile
            - text: "정보망을 넘기게 하고 곁에서 감시한다"
              when: { var: bidam_trust, op: gte, value: 5 }
              set: { bidam_sentence: restored }
              add: { army_support: 1, fear: 2, bidam_trust: 2 }
              goto: sentence_restored

  sentence_execution:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - effect: "inkstamp"
      - say:
          char: "덕만"
          text: "지휘한 죄는 네 것이다. 그러나 돌아간 농민을 네 이름 아래 함께 묶지는 않겠다."
      - say:
          char: "비담.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "제 목을 베고도 제 전령길은 필요하시겠지요. 거기서 다시 제 이름을 보실 겁니다."
      - say:
          channel: "narration"
          text: "형이 집행된 뒤 전령의 명부와 암호는 세 기록관에게 나뉘었습니다. 궁문 밖 유족들은 조용히 이름을 확인했습니다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          text: "끝난 건 한 사람의 판결이다. 내 도장이 만든 권력까지 끝났다고 쓰진 마라."
      - wait: 180
      - say:
          channel: thought
          text: 판결을 내렸다. 누가 반대하느냐고 물었는데 아무도 고개를 들지 않는다. 정말 모두 같은 생각일까.
      - goto: "death_record_choice"

  sentence_exile:
    actions:
      - effect: inkstamp
      - say:
          char: 덕만
          text: "죽여서 네 죄와 내 책임을 함께 덮진 않겠다. 네가 끊은 곡식길로 가. 이름 없이 다리를 잇고 살아."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "죽는 것보다 오래 걸리겠군요. 자비라 부르는 자에겐 제가 부순 첫 다리부터 보여 주겠습니다."
      - goto: death_record_choice

  sentence_restored:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - effect: "inkstamp"
      - say:
          char: "덕만"
          text: "암호와 전령 명부를 모두 넘겨라. 네 명령에는 기록관의 서명을 붙인다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "제 손을 묶어 다시 쓰시는군요. 급한 밤에도 그 서명을 기다리실 수 있습니까?"
      - say:
          channel: "narration"
          text: "비담은 명부를 건넸습니다. 그러나 처음 보는 암호가 나올 때마다 관리들은 그에게 먼저 물었습니다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "비담"
          text: "오늘 빨랐다고 내일도 너만 찾으면, 이 재판은 종이 한 장으로 끝나는 거야."
      - wait: 180
      - say:
          channel: thought
          text: 명부는 되찾았다. 그런데 모르는 암호가 나올 때마다 모두 비담부터 본다. 저 자리를 내가 다시 만든 거야.
      - goto: "death_record_choice"

  death_record_choice:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - say:
          camera: medium
          channel: action
          text: 열두 해의 종이를 바닥에 길게 편다. 사망 기록에서 비담의 편지까지. 소화가 화로를 가져온다. 손을 가까이 대니 따뜻하다.
      - char: { id: 소화, position: right }
      - say:
          when: { var: sohwa_trust, op: gte, value: 3 }
          char: 소화
          camera: medium
          with: [덕만]
          text: "불 속에서 제 손을 다시 잡으셨죠. 무엇을 남기든, 죽었다고 적힌 덕만과 그 뒤에 죽은 사람부터 읽어 주세요."
      - choice:
          key: c12_record_policy
          prompt: "열두 해의 기록을 어떻게 남길까요?"
          char: 덕만
          camera: medium
          options:
            - text: "원본과 덕만의 거짓까지 궁문에 붙인다"
              set: { record_policy: public }
              add: { evidence: 2, people_support: 2, nobles_support: -2 }
              goto: records_public
            - text: "세 자물쇠로 잠가 다음 왕에게 넘긴다"
              set: { record_policy: sealed }
              add: { nobles_support: 2, fear: 1 }
              goto: records_sealed
            - text: "피해자 이름만 베끼고 원본은 태운다"
              set: { record_policy: burned }
              add: { mercy: 1, people_support: 1, evidence: -3 }
              goto: records_burned

  records_public:
    actions:
      - sticker: { id: c12_death_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: action
          text: 내 사망 기록을 궁문에 붙인다. 내가 거짓 왕명을 쓴 날도 바로 아래에 적는다. 뒤에서 누군가 읽기 시작한다. 끝까지 자리를 지킨다.
      - say:
          char: 덕만
          text: "나를 죽인 거짓만 열고 내가 쓴 거짓을 숨기면 똑같아. 왕에게 불리한 글도 같은 크기로 써."
      - clearSticker: { id: c12_death_record, leave: fadeOut }
      - goto: last_decree_choice

  records_sealed:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - say:
          channel: "narration"
          text: "열두 해의 원본이 세 자물쇠 뒤로 들어갔습니다. 피해자의 이름은 밖에 남았지만, 누가 어떤 문장을 고쳤는지는 봉인됐습니다."
      - say:
          char: "소화.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "이름은 남겼어요. 그 이름을 지운 손도 언젠가는 사람들이 볼 수 있겠지요?"
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "소화"
          text: "다음 왕이 열도록 날짜를 적겠어. 내가 틀렸다면 그 왕이 나부터 고치게."
      - say:
          channel: "narration"
          text: "열쇠 셋은 다른 주인에게 갔습니다. 궁문 앞에서 원본을 기다리던 사람들은 개봉 날짜만 받아 들었습니다."
      - wait: 180
      - say:
          channel: thought
          text: 원본은 남겼다. 피해자는 개봉 날짜만 받아 간다. 그때까지 살아 있을 수 있느냐는 말에 대답하지 못했다.
      - goto: "last_decree_choice"

  records_burned:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - effect: "embers"
      - say:
          channel: "narration"
          text: "소화가 마지막 피해자 이름을 옮기자 덕만은 원본을 화로에 넣었습니다. 붉은 인장이 검게 오그라들었습니다."
      - say:
          char: "덕만.queen_sad"
          text: "이 이름으로 다시 누구를 죽이게 두진 않겠어. 살아 있는 사람부터 돌려보내."
      - say:
          char: "소화.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "이름은 다 썼어요. 하지만 같은 도장이 돌아오면, 이제 이 종이와 맞출 수는 없어요."
      - say:
          channel: "narration"
          text: "덕만은 화로 앞에서 오래 움직이지 않았습니다. 궁문 밖의 다툼은 잦아들었지만 그 종이를 다시 읽을 수는 없었습니다."
      - wait: 180
      - say:
          channel: thought
          text: 조용해졌다. 붉은 인장은 재가 됐다. 다시 확인하고 싶은 사람이 오면, 나는 뭘 내밀 수 있지.
      - goto: "last_decree_choice"

  last_decree_choice:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: thought
          text: 내 죽음은 남이 먼저 썼다. 이 칙령도 내가 죽은 뒤에는 남겠지. 틀렸을 때, 누가 이 글을 고칠 수 있어야 할까?
      - choice:
          key: c12_final_decree
          prompt: "다음 왕의 거짓도 고칠 수 있게 권한을 어디에 둘까요?"
          char: 덕만
          camera: medium
          options:
            - text: "전쟁 중 모인 권한을 왕좌에 묶어 둔다"
              set: { final_decree: strong_crown }
              add: { army_support: 2, fear: 2, nobles_support: -1 }
              goto: bad_strong_crown
            - text: "귀족·군대·마을에 서로 다른 열쇠를 준다"
              set: { final_decree: divided_guardians }
              add: { nobles_support: 1, people_support: 1, army_support: 1 }
              goto: bad_divided_guardians
            - text: "관측·곡식·재판 장부의 문을 모두 연다"
              set: { final_decree: shared_limits }
              add: { people_support: 2, insight: 2 }
              goto: judge_ending

  bad_strong_crown:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "queen_angry"
      - char:
          id: "춘추"
          position: "right"
          emotion: "nervous"
      - say:
          char: "덕만.queen"
          text: "전시 권한은 왕에게 남긴다. 명령을 늦춘 이름도 매일 내 앞에 올려라."
      - say:
          char: "춘추"
          text: "신속해지겠지요. 폐하가 틀렸을 때 멈출 사람의 이름은 어디에 씁니까?"
      - say:
          channel: "narration"
          text: "명령은 빠르게 나갔습니다. 여왕의 붓이 멈추면 회의장 전체가 숨을 죽였습니다."
      - wait: 180
      - say:
          channel: thought
          text: 명령은 빨리 나간다. 내가 붓을 멈추면 모두 기다린다. 내가 틀렸다는 말은 어디서 들을 수 있을까.
      - goto: "judge_ending"

  bad_divided_guardians:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "queen_sad"
      - char:
          id: "유신"
          position: "right"
          emotion: "angry"
      - say:
          char: "덕만.queen"
          text: "귀족은 군량, 군대는 성문, 마을은 관측표를 맡아라. 서로의 자물쇠를 혼자 열 수는 없다."
      - say:
          char: "유신"
          text: "누군가 열쇠를 감추면 늦어질 겁니다. 그때도 다시 같은 상에 앉으시겠습니까?"
      - say:
          channel: "narration"
          text: "세 열쇠가 탁자에서 갈라졌습니다. 첫 회의는 해가 져도 끝나지 않았지만 문밖 사람들도 결정이 늦는 까닭을 들었습니다."
      - wait: 180
      - say:
          channel: thought
          text: 회의가 해가 져도 안 끝난다. 답답하다. 그래도 저 문밖의 사람이 늦는 이유를 물을 수는 있게 됐다.
      - goto: "judge_ending"

  judge_ending:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: observed_left_waterway
                    op: eq
                    value: true
                  - var: saved_market_witness
                    op: eq
                    value: true
                  - var: sisters_public
                    op: eq
                    value: true
                  - var: grain_policy
                    op: eq
                    value: public_distribution
                  - var: eclipse_policy
                    op: eq
                    value: public_science
                  - var: king_failure_public
                    op: eq
                    value: true
                  - var: cheonmyeong_outcome
                    op: eq
                    value: exile
                  - var: coronation_compromise
                    op: eq
                    value: public_council
                  - var: knowledge_policy
                    op: eq
                    value: public
                  - var: record_policy
                    op: eq
                    value: public
                  - var: final_decree
                    op: eq
                    value: shared_limits
                  - var: bidam_sentence
                    op: eq
                    value: exile
                  - var: seals_linked
                    op: eq
                    value: true
                  - var: grain_verified
                    op: eq
                    value: true
                  - var: token_verified
                    op: eq
                    value: true
                  - var: kite_verified
                    op: eq
                    value: true
              goto: ending_hidden_constellation
            - when:
                var: cheonmyeong_outcome
                op: eq
                value: hidden_alive
              goto: ending_sisters_shadow
            - when:
                all:
                  - var: record_policy
                    op: eq
                    value: public
                  - var: knowledge_policy
                    op: eq
                    value: public
                  - var: final_decree
                    op: eq
                    value: shared_limits
                  - var: bidam_sentence
                    op: eq
                    value: exile
                  - var: people_support
                    op: gte
                    value: 8
                  - var: insight
                    op: gte
                    value: 8
              goto: ending_stars_belong_to_people
            - when:
                var: bidam_sentence
                op: eq
                value: restored
              goto: ending_bidams_regent
            - when:
                var: record_policy
                op: eq
                value: burned
              goto: ending_recordless_peace
            - when:
                var: knowledge_policy
                op: eq
                value: bidam_network
              goto: ending_empty_observatory
            - when:
                all:
                  - var: bidam_sentence
                    op: eq
                    value: execution
                  - var: final_decree
                    op: eq
                    value: strong_crown
              goto: ending_iron_queen
            - when:
                all:
                  - var: coronation_compromise
                    op: eq
                    value: nobles_audit
                  - var: final_decree
                    op: ne
                    value: shared_limits
              goto: ending_borrowed_crown
            - when:
                var: people_support
                op: lte
                value: 4
              goto: ending_fallen_star
            - when:
                var: bidam_sentence
                op: eq
                value: exile
              goto: ending_merciful_queen
          default: ending_nameless_queen

  ending_hidden_constellation:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "첨성대 아래에 열두 개의 등불이 켜졌습니다. 어린 덕만이 찾아낸 물길에서 시작해 장터의 증인, 천명의 공개 증언, 굶지 않은 마을의 이름이 등불마다 적혔습니다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          char: 덕만
          camera: medium
          text: "나는 죽었다고 적혔다가 돌아왔고, 사람을 살린다며 거짓도 썼다. 내 이름보다 내가 틀렸을 때 막아선 이름들을 먼저 읽어라."
      - say:
          channel: narration
          text: "사람들은 등불 사이에 실을 걸었습니다. 왕의 선택 하나가 아니라 서로를 살린 선택들이 이어지자, 땅 위에 처음 보는 별자리가 생겼습니다."
      - say:
          channel: record
          text: "숨겨진 기록 — 선덕왕의 가장 긴 승리는 왕관을 얻은 날이 아니라, 어린 날부터 이어진 선택의 원인을 누구나 되짚을 수 있게 만든 밤이었다."
      - ending: hidden_constellation

  ending_stars_belong_to_people:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "덕만의 사망 기록과 비담의 재판 기록이 같은 벽에 붙었습니다. 아이들이 두 문서의 다른 도장 자국을 손가락으로 찾아냈습니다."
      - say:
          char: 덕만
          camera: medium
          text: "별이 왕을 고르는 게 아니다. 우리가 별을 읽고 왕을 고른다. 왕이 틀리면 기록하고 고친다."
      - say:
          channel: record
          text: "첨성대 아래 달력은 손때로 검어졌습니다. 죽었다고 먼저 적혔던 아이의 이름 옆에는 수많은 사람의 수정 흔적이 겹쳐 남았습니다."
      - ending: stars_belong_to_people

  ending_merciful_queen:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: narration
          text: "비담은 국경에서 이름 없이 다리를 고쳤습니다. 사람들은 선덕의 자비를 노래했고, 새 반역을 꿈꾸는 자들은 그 노래에서 살아남을 가능성을 들었습니다."
      - say:
          char: 덕만.queen_sad
          text: "그를 살린 게 옳았는지는 노래가 답하지 않는다. 비담의 남은 삶과 다음 판결이 답할 거야."
      - say:
          channel: record
          text: "용서는 평화를 만들었고 동시에 법의 경계를 흐렸습니다."
      - ending: merciful_queen

  ending_iron_queen:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "비담의 목이 떨어진 뒤 회의는 놀랄 만큼 짧아졌습니다. 왕명이 끝나기 전에 모두가 고개를 숙였습니다."
      - say:
          char: 덕만
          text: "조용하구나. 반란이 끝난 소리와 내가 틀려도 말하지 못하는 침묵을 이제 구분할 수가 없어."
      - say:
          channel: record
          text: "강한 왕은 모든 반대를 이겼습니다. 그 뒤에는 반대와 경고를 구분할 사람도 남지 않았습니다."
      - ending: iron_queen

  ending_borrowed_crown:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "귀족 회의의 붓은 군량 장부를 넘어 군사 이동과 창고 문서까지 따라왔습니다. 덕만은 명령을 내릴 때마다 즉위 날 받은 세 표를 다시 갚았습니다."
      - say:
          char: 덕만.queen_sad
          text: "조건을 밝히고 왕이 됐지만 다시 따질 문은 만들지 못했어. 이 왕관은 아직 세 표에게 빌린 거야."
      - say:
          channel: record
          text: "평화는 유지됐고 여왕의 통치는 매번 담보를 요구받았습니다."
      - ending: borrowed_crown

  ending_empty_observatory:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "첨성대 문은 열려 있었지만 관측표 상자는 비담의 암호 없이는 열리지 않았습니다. 탑 아래 아이들은 별 대신 전령을 기다렸습니다."
      - say:
          char: 덕만.queen_sad
          text: "돌은 누구나 보게 세우고, 올라갈 계단은 한 사람의 암호 뒤에 숨겼구나."
      - say:
          channel: record
          text: "지식을 위해 세운 탑은 지식을 가두는 가장 높은 벽이 되었습니다."
      - ending: empty_observatory

  ending_bidams_regent:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          camera: medium
          channel: narration
          text: "돌아온 비담은 사흘 만에 끊긴 전령망을 이었습니다. 넷째 날부터 관리들은 왕의 도장보다 비담의 고갯짓을 먼저 기다렸습니다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "폐하께서 저를 감시하시는 동안 나라는 아주 잘 움직이고 있습니다."
      - say:
          channel: record
          text: "가장 유능한 신하는 왕 곁에 남았고, 마침내 왕보다 먼저 명령을 내리는 사람이 되었습니다."
      - ending: bidams_regent

  ending_sisters_shadow:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          camera: medium
          channel: narration
          text: "밤마다 비밀문이 열리고 천명이 덕만의 칙령을 먼저 읽었습니다. 어느 순간 덕만은 회의장의 반대보다 어둠 속 언니의 침묵을 더 두려워했습니다."
      - say:
          char: 천명.sad
          text: "나를 살린 방이 네 통치까지 가두고 있어. 이제 내게 묻지 않고 결정해야 해."
      - say:
          channel: record
          text: "두 공주는 함께 남았고, 한 사람의 멈춘 시간이 나라의 미래 위에 긴 그림자를 만들었습니다."
      - ending: sisters_shadow

  ending_recordless_peace:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - effect: embers
      - say:
          camera: wide
          channel: narration
          text: "사망 기록과 반란 서신은 한 줌 재가 됐습니다. 한동안 아무도 과거 종이를 들고 새 싸움을 시작하지 못했습니다."
      - say:
          char: 덕만.queen_sad
          text: "이 평화가 오래가면 좋겠구나. 다음 거짓을 알아볼 눈까지 태운 게 아니길 바란다."
      - say:
          channel: record
          text: "싸움의 증거가 사라지자 싸움은 잦아들었습니다. 같은 위조가 어떻게 시작됐는지도 함께 사라졌습니다."
      - ending: recordless_peace

  ending_fallen_star:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: narration
          text: "반란은 끝났지만 왕실 전령이 오는 날이면 마을 문이 먼저 닫혔습니다. 성문 안에는 왕관이, 밖에는 왕명을 기다리지 않는 장터가 남았습니다."
      - say:
          char: 덕만.queen_sad
          text: "별이 떨어진 것이 아니다. 내가 별을 바라보는 사람들의 땅을 잃었다."
      - say:
          channel: record
          text: "여왕은 왕좌를 지켰고 신라는 서로 다른 명령을 내리는 두 나라가 되었습니다."
      - ending: fallen_star

  ending_nameless_queen:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "사서에는 선덕왕의 이름이 오래 남았습니다. 그러나 그 이름을 처음 죽인 종이와 왕좌까지 빌려 쓴 거짓은 봉인 상자 안에서 함께 늙었습니다."
      - say:
          char: 덕만.queen_sad
          text: "왕의 이름은 되찾았는데, 어린 덕만을 지운 손과 내가 쓴 거짓은 끝내 꺼내지 못했구나."
      - say:
          channel: record
          text: "왕은 남았습니다. 그 왕이 무엇과 싸웠는지는 이름 없는 공백이 되었습니다."
      - ending: nameless_queen
