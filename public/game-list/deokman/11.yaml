script:
  - scene: last_trial

scenes:
  last_trial:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제12장 — 마지막 기록"
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "불붙은 연, 비담의 서신, 어린 덕만의 사망 기록이 같은 증거상에 놓였습니다. 모두 사실보다 먼저 결론을 기록해 사람을 움직인 문서였습니다. 반란이 끝난 뒤에도 왕궁 앞에는 비담의 처형을 요구하는 사람, 용서를 요구하는 사람, 그리고 죽은 가족의 이름을 기록해 달라는 사람의 세 줄이 남았습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "폐하께서 저를 살리면 사사로운 정이라 하고, 죽이면 두려워했다고 할 겁니다. 어느 기록이 더 마음에 드십니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내 마음에 드는 기록을 고르지 않겠다. 네가 한 일과 내가 만든 조건을 함께 남기겠다."
      - goto: bidam_sentence_choice

  bidam_sentence_choice:
    actions:
      - choice:
          key: c12_bidam_sentence
          prompt: "비담의 반란을 어떻게 판결하겠습니까?"
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "공개 재판 뒤 반란 지휘 책임으로 처형한다"
              set: { bidam_sentence: execution }
              add: { fear: 2, nobles_support: 1, mercy: -1 }
              goto: sentence_execution
            - text: "재산과 지위를 박탈하고 평생 국경으로 추방한다"
              set: { bidam_sentence: exile }
              add: { mercy: 2, people_support: 1, nobles_support: -1 }
              goto: sentence_exile
            - text: "정보망을 해체하는 조건으로 왕실 고문에 복귀시킨다"
              when: { var: bidam_trust, op: gte, value: 5 }
              set: { bidam_sentence: restored }
              add: { army_support: 1, fear: 2, bidam_trust: 2 }
              goto: sentence_restored

  sentence_execution:
    actions:
      - say:
          char: 덕만
          text: "비담의 문제 제기는 죄가 아니다. 군대를 일으켜 그 답을 강요한 일은 다른 사람의 삶을 빼앗은 죄다. 두 사실을 함께 기록하라."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "마지막까지 저를 한 문장으로 만들지 않으시는군요. 그래서 따르기 어려운 왕이었습니다."
      - goto: death_record_choice

  sentence_exile:
    actions:
      - say:
          char: 덕만
          text: "죽음으로 질문을 끝내지 않겠다. 네가 끊은 곡식길 끝에서 이름 없이 사람을 살리며 살아라."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "죽는 것보다 긴 형벌이군요. 사람들이 폐하의 자비라고 부르면 저는 웃겠습니다."
      - goto: death_record_choice

  sentence_restored:
    actions:
      - say:
          char: 덕만
          text: "네 정보망을 나라의 기록관에게 넘기고 혼자 명령할 권한을 버려라. 다시 일하게 하되 다시 믿음만으로 맡기지는 않겠다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "저를 가장 잘 쓰는 형벌을 고르셨군요. 폐하 곁에서 제가 얼마나 커지는지 계속 지켜보십시오."
      - goto: death_record_choice

  death_record_choice:
    actions:
      - bg: locked_room
      - camera: medium
      - say:
          channel: narration
          text: "재판 뒤 덕만은 어린 시절의 사망 기록, 국경 인장이 찍힌 곡식 장부, 천명 암살의 위조 자백, 일식표와 비담의 서신을 시간순으로 놓았습니다. 열두 장의 사건이 하나의 질문으로 모였습니다. 모두 공개하면 왕실의 죄도 드러났고, 태우면 싸움의 구실과 거짓을 알아볼 방법이 함께 사라졌습니다."
      - choice:
          key: c12_record_policy
          prompt: "왕실의 거짓 기록을 후대에 어떻게 남기겠습니까?"
          char: 덕만
          camera: close
          options:
            - text: "원본과 덕만 자신의 책임까지 전부 공개한다"
              set: { record_policy: public }
              add: { evidence: 2, people_support: 2, nobles_support: -2 }
              goto: records_public
            - text: "왕실 서고에 봉인하고 다음 왕에게만 열람시킨다"
              set: { record_policy: sealed }
              add: { nobles_support: 2, fear: 1 }
              goto: records_sealed
            - text: "피해자 이름만 새로 적고 위조 원본은 불태운다"
              set: { record_policy: burned }
              add: { mercy: 1, people_support: 1, evidence: -3 }
              goto: records_burned

  records_public:
    actions:
      - sticker: { id: c12_death_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: narration
          text: "궁문에 덕만의 사망 기록이 붙었습니다. 백성은 여왕도 위조와 거짓 예언을 사용한 적이 있다는 주석까지 함께 읽었습니다."
      - say:
          char: 덕만
          text: "나를 정당하게 보이게 하는 기록만 공개하면 이것도 또 다른 위조다. 내가 빌린 거짓말까지 남겨라."
      - clearSticker: { id: c12_death_record, leave: fadeOut }
      - goto: last_decree_choice

  records_sealed:
    actions:
      - say:
          channel: narration
          text: "상자는 세 개의 자물쇠로 잠겼습니다. 당장의 왕실은 보호됐지만 다음 왕은 진실을 공개할지 협박에 쓸지 혼자 결정할 수 있게 됐습니다."
      - goto: last_decree_choice

  records_burned:
    actions:
      - effect: embers
      - say:
          channel: narration
          text: "위조 문서가 불꽃 속에서 검게 말렸습니다. 피해자의 이름은 새 명부에 남았지만 누가 어떤 방식으로 이름을 지웠는지 증명할 원본은 사라졌습니다."
      - say:
          char: 덕만.sad
          text: "사람을 살리려고 기록을 태웠다고 쓰게. 훗날 이것이 겁이었는지 자비였는지는 내가 정하지 않겠다."
      - goto: last_decree_choice

  last_decree_choice:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "덕만은 첨성대 아래에서 마지막 칙령을 준비했습니다. 어린 시절에는 다른 사람이 먼저 쓴 문장 때문에 죽어야 했지만, 마지막 문장은 살아남은 사람들이 왕의 선택을 고칠 수 있게 하는 것이어야 했습니다. 왕의 힘을 어디에 남길지 정하는 칙령이었습니다."
      - choice:
          key: c12_final_decree
          prompt: "선덕왕의 통치를 어떤 원칙으로 마무리하겠습니까?"
          char: 덕만
          camera: close
          options:
            - text: "관측·곡식·재판 기록을 누구나 열람하게 한다"
              set: { final_decree: shared_limits }
              add: { people_support: 2, insight: 2 }
              goto: judge_ending
            - text: "전쟁 동안 왕에게 집중된 권한을 영구히 유지한다"
              set: { final_decree: strong_crown }
              add: { army_support: 2, fear: 2, nobles_support: -1 }
              goto: judge_ending
            - text: "귀족·군대·마을 대표가 왕권을 나누어 감시하게 한다"
              set: { final_decree: divided_guardians }
              add: { nobles_support: 1, people_support: 1, army_support: 1 }
              goto: judge_ending

  judge_ending:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: record_policy, op: eq, value: public }
                  - { var: knowledge_policy, op: eq, value: public }
                  - { var: final_decree, op: eq, value: shared_limits }
                  - { var: bidam_sentence, op: eq, value: exile }
                  - { var: people_support, op: gte, value: 8 }
                  - { var: insight, op: gte, value: 8 }
              goto: ending_stars_belong_to_people
            - when: { var: bidam_sentence, op: eq, value: restored }
              goto: ending_bidams_regent
            - when: { var: record_policy, op: eq, value: burned }
              goto: ending_recordless_peace
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: ending_empty_observatory
            - when:
                all:
                  - { var: bidam_sentence, op: eq, value: execution }
                  - { var: final_decree, op: eq, value: strong_crown }
              goto: ending_iron_queen
            - when:
                all:
                  - { var: coronation_compromise, op: eq, value: nobles_audit }
                  - { var: final_decree, op: ne, value: shared_limits }
              goto: ending_borrowed_crown
            - when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
              goto: ending_sisters_shadow
            - when: { var: bidam_sentence, op: eq, value: exile }
              goto: ending_merciful_queen
            - when: { var: people_support, op: lte, value: 4 }
              goto: ending_fallen_star
          default: ending_nameless_queen

  ending_stars_belong_to_people:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "덕만의 사망 기록과 비담의 재판 기록이 같은 날 공개됐습니다. 어느 쪽도 왕을 완벽하게 만들지 않았고, 그래서 사람들은 결정을 비교할 수 있었습니다."
      - say:
          char: 덕만
          camera: close
          text: "별은 왕을 선택하지 않는다. 사람이 별을 읽고, 왕의 선택을 기록하고, 잘못된 선택을 고친다."
      - say:
          channel: record
          text: "첨성대의 달력은 왕실 예언이 아니라 백성의 계절표가 되었습니다. 기록에서 먼저 죽었던 아이는, 살아 있는 사람의 선택 뒤에 기록이 따라와야 한다는 원칙을 자신의 이름보다 오래 남겼습니다."
      - ending: stars_belong_to_people

  ending_merciful_queen:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "비담은 국경에서 살아남아 반란으로 끊긴 길을 고쳤습니다. 사람들은 여왕의 자비를 칭송했고 다음 반역자들은 자신도 살 수 있다는 희망을 품었습니다."
      - say:
          char: 덕만.sad
          text: "살려 둔 것이 옳았는지는 그의 남은 삶과 다음 반란이 함께 대답할 것이다."
      - say:
          channel: record
          text: "용서는 평화를 만들었고 동시에 법의 경계를 흐렸습니다."
      - ending: merciful_queen

  ending_iron_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "비담의 처형 뒤 반란은 사라졌고 왕명은 빨라졌습니다. 회의는 짧아졌으며 누구도 공개적으로 반대하지 않았습니다."
      - say:
          char: 덕만
          text: "나라가 조용해졌다. 그런데 이제 틀린 명령을 누가 내게 알려 주지?"
      - say:
          channel: record
          text: "강한 왕은 모든 반대를 이겼습니다. 그 뒤에는 반대와 경고를 구분할 사람도 남지 않았습니다."
      - ending: iron_queen

  ending_borrowed_crown:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: narration
          text: "귀족 회의는 군량 감사를 넘어 군사 이동과 창고 개방에도 서명을 요구했습니다. 덕만은 왕좌를 지켰지만 매 결정마다 즉위 날의 빚을 갚았습니다."
      - say:
          char: 덕만.sad
          text: "조건을 받아 왕이 됐다. 조건을 바꾸지 못하면 왕관은 계속 빌린 물건이다."
      - say:
          channel: record
          text: "평화는 유지됐고 여왕의 통치는 매번 담보를 요구받았습니다."
      - ending: borrowed_crown

  ending_empty_observatory:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대는 완성됐지만 관측표를 읽는 길은 비담의 정보망과 왕실 서고를 거쳐야 했습니다. 탑 아래 아이들은 다시 예언을 기다렸습니다."
      - say:
          char: 덕만.sad
          text: "돌을 높이 세웠는데 지식이 오를 계단은 한 사람에게 맡겼구나."
      - say:
          channel: record
          text: "지식을 위해 세운 탑은 지식을 가두는 가장 높은 벽이 되었습니다."
      - ending: empty_observatory

  ending_bidams_regent:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "복귀한 비담은 흩어진 정보망을 누구보다 빠르게 다시 묶었습니다. 관리들은 여왕의 결재보다 비담의 판단을 먼저 기다렸습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "폐하께서 저를 감시하시는 동안 나라는 아주 잘 움직이고 있습니다."
      - say:
          channel: record
          text: "가장 유능한 신하는 왕 곁에 남았고, 마침내 왕보다 먼저 명령을 내리는 사람이 되었습니다."
      - ending: bidams_regent

  ending_sisters_shadow:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          channel: narration
          text: "살아 있으나 죽었다고 기록된 천명은 매일 밤 덕만의 결정을 들었습니다. 덕만은 언니의 조언을 잃지 않았지만 살아 있는 반대자보다 숨은 언니의 뜻을 먼저 물었습니다."
      - say:
          char: 천명.sad
          text: "나를 살린 방이 네 통치까지 가두고 있어. 이제 내게 묻지 않고 결정해야 해."
      - say:
          channel: record
          text: "두 공주는 함께 남았고, 한 사람의 멈춘 시간이 나라의 미래 위에 긴 그림자를 만들었습니다."
      - ending: sisters_shadow

  ending_recordless_peace:
    actions:
      - bg: moon_court
      - camera: wide
      - effect: embers
      - say:
          channel: narration
          text: "사망 기록과 반란 서신은 모두 재가 됐습니다. 누구도 과거 문서를 들이밀어 새 싸움을 시작할 수 없었습니다."
      - say:
          char: 덕만.sad
          text: "이 평화가 오래가기를 바란다. 다만 다음 거짓 기록을 알아볼 눈까지 태운 것은 아니기를."
      - say:
          channel: record
          text: "싸움의 증거가 사라지자 싸움은 잦아들었습니다. 같은 위조가 어떻게 시작됐는지도 함께 사라졌습니다."
      - ending: recordless_peace

  ending_fallen_star:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "반란은 끝났지만 마을과 시장은 왕실의 명령을 더는 자기 일로 받아들이지 않았습니다. 성문 안에는 왕관이, 성문 밖에는 다른 질서가 남았습니다."
      - say:
          char: 덕만.sad
          text: "별이 떨어진 것이 아니다. 내가 별을 바라보는 사람들의 땅을 잃었다."
      - say:
          channel: record
          text: "여왕은 왕좌를 지켰고 신라는 서로 다른 명령을 내리는 두 나라가 되었습니다."
      - ending: fallen_star

  ending_nameless_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "덕만은 여왕으로 오래 기록됐습니다. 그러나 어린 공주가 왜 죽었다고 적혔고 어떤 거짓을 빌려 왕좌까지 왔는지는 봉인된 상자 안에 남았습니다."
      - say:
          char: 덕만.sad
          text: "왕의 이름은 되찾았는데, 그 이름을 지우려 한 이유는 세상에 돌려주지 못했구나."
      - say:
          channel: record
          text: "왕은 남았습니다. 그 왕이 무엇과 싸웠는지는 이름 없는 공백이 되었습니다."
      - ending: nameless_queen
