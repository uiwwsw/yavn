script:
  - scene: last_trial

scenes:
  last_trial:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제12장 — 마지막 기록"
      - char: { id: 덕만, position: left }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "증거상 위에 불탄 연, 비담의 편지, 어린 덕만의 사망 기록이 놓였습니다. 궁문 밖에는 세 줄이 생겼습니다. 비담을 죽이라는 사람, 살리라는 사람, 그리고 어느 쪽이든 먼저 자기 가족 이름부터 적어 달라는 사람들."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "저를 살리면 사랑이라 쓰고, 죽이면 두려움이라 쓰겠지요. 폐하께선 어느 오해가 덜 아프십니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내 마음이 편한 문장은 고르지 않아. 네가 한 일 옆에, 내가 너를 그렇게 키운 자리도 함께 적겠다."
      - goto: bidam_sentence_choice

  bidam_sentence_choice:
    actions:
      - choice:
          key: c12_bidam_sentence
          prompt: "비담의 결박이 풀리지 않은 채 판결문이 열린다. 마지막 줄은?"
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "반란 지휘의 책임을 물어 처형한다"
              set: { bidam_sentence: execution }
              add: { fear: 2, nobles_support: 1, mercy: -1 }
              goto: sentence_execution
            - text: "모든 이름을 빼앗고 국경으로 추방한다"
              set: { bidam_sentence: exile }
              add: { mercy: 2, people_support: 1, nobles_support: -1 }
              goto: sentence_exile
            - text: "정보망을 넘기게 하고 곁에서 감시한다"
              when: { var: bidam_trust, op: gte, value: 5 }
              set: { bidam_sentence: restored }
              add: { army_support: 1, fear: 2, bidam_trust: 2 }
              goto: sentence_restored

  sentence_execution:
    actions:
      - say:
          char: 덕만
          text: "비담의 질문은 죄가 아니다. 그 답을 받겠다며 군사를 일으킨 순간, 남의 목숨으로 값을 치렀다. 질문과 죄를 한 줄로 뭉개지 마라."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "끝까지 저를 악인 한 글자로 끝내 주지 않으시는군요. 그래서 폐하를 따르기가 그렇게 피곤했습니다."
      - goto: death_record_choice

  sentence_exile:
    actions:
      - say:
          char: 덕만
          text: "죽여서 네 질문을 편하게 끝내 주지 않겠다. 네가 끊은 곡식길로 가라. 이름 없이 길을 다시 잇고 살아."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "죽는 것보다 오래 걸리는 벌이군요. 누가 자비라고 부르면 그 사람 앞에서 꼭 웃겠습니다."
      - goto: death_record_choice

  sentence_restored:
    actions:
      - say:
          char: 덕만
          text: "전령 이름과 암호를 모두 기록관에 넘겨. 다시 내 곁에서 일하되, 네 충성을 자물쇠로 쓰지 않겠다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "저를 가장 잘 쓰는 형벌을 고르셨군요. 눈을 떼지 마십시오. 폐하 곁의 그림자는 또 자라니까."
      - goto: death_record_choice

  death_record_choice:
    actions:
      - bg: locked_room
      - camera: medium
      - say:
          channel: narration
          text: "재판 뒤 덕만은 열두 해의 종이를 바닥에 길게 늘어놓았습니다. 자기 사망 기록에서 시작한 줄은 곡식 장부와 위조 자백, 일식표를 지나 비담의 편지에서 멈췄습니다. 소화가 화로를 가져왔습니다."
      - choice:
          key: c12_record_policy
          prompt: "화로의 불이 종이 끝을 핥는다. 무엇을 세상에 남길까?"
          char: 덕만
          camera: close
          options:
            - text: "원본과 덕만의 거짓까지 궁문에 붙인다"
              set: { record_policy: public }
              add: { evidence: 2, people_support: 2, nobles_support: -2 }
              goto: records_public
            - text: "세 자물쇠로 잠가 다음 왕에게 넘긴다"
              set: { record_policy: sealed }
              add: { nobles_support: 2, fear: 1 }
              goto: records_sealed
            - text: "피해자 이름만 베끼고 원본은 태운다"
              set: { record_policy: burned }
              add: { mercy: 1, people_support: 1, evidence: -3 }
              goto: records_burned

  records_public:
    actions:
      - sticker: { id: c12_death_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: narration
          text: "덕만의 사망 기록이 궁문 한가운데 붙었습니다. 그 아래에는 여왕이 거짓 왕명과 연출된 기적을 쓴 날도 같은 먹으로 적혔습니다."
      - say:
          char: 덕만
          text: "내가 옳아 보이는 종이만 내놓으면 이것도 위조야. 내가 거짓을 빌린 날도 같은 크기로 써."
      - clearSticker: { id: c12_death_record, leave: fadeOut }
      - goto: last_decree_choice

  records_sealed:
    actions:
      - say:
          channel: narration
          text: "상자에 자물쇠 세 개가 걸렸습니다. 열쇠는 다음 왕에게 넘어갔고, 진실은 다시 한 사람의 밤에만 열리는 물건이 됐습니다."
      - goto: last_decree_choice

  records_burned:
    actions:
      - effect: embers
      - say:
          channel: narration
          text: "위조 문서가 불 속에서 오그라들었습니다. 소화는 피해자 이름을 새 명부에 옮겼지만, 마지막 도장이 재가 될 때 손을 멈췄습니다."
      - say:
          char: 덕만.sad
          text: "사람을 살리려고 태웠다고 적어. 그 말이 겁이었는지 자비였는지는 다음 사람이 정하게 두고."
      - goto: last_decree_choice

  last_decree_choice:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대 아래 긴 탁자에 마지막 칙령이 놓였습니다. 어린 덕만의 죽음은 남이 먼저 썼습니다. 이제 선덕왕은 자기 뒤에 올 사람들이 왕의 글을 고칠 수 있는 문장을 써야 했습니다."
      - choice:
          key: c12_final_decree
          prompt: "마지막 칙령의 빈칸. 왕의 힘을 누구 손에 남길까?"
          char: 덕만
          camera: close
          options:
            - text: "관측·곡식·재판 장부의 문을 모두 연다"
              set: { final_decree: shared_limits }
              add: { people_support: 2, insight: 2 }
              goto: judge_ending
            - text: "전쟁 중 모인 권한을 왕좌에 묶어 둔다"
              set: { final_decree: strong_crown }
              add: { army_support: 2, fear: 2, nobles_support: -1 }
              goto: judge_ending
            - text: "귀족·군대·마을에 서로 다른 열쇠를 준다"
              set: { final_decree: divided_guardians }
              add: { nobles_support: 1, people_support: 1, army_support: 1 }
              goto: judge_ending

  judge_ending:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: record_policy, op: eq, value: public }
                  - { var: knowledge_policy, op: eq, value: public }
                  - { var: final_decree, op: eq, value: shared_limits }
                  - { var: bidam_sentence, op: eq, value: exile }
                  - { var: people_support, op: gte, value: 8 }
                  - { var: insight, op: gte, value: 8 }
              goto: ending_stars_belong_to_people
            - when: { var: bidam_sentence, op: eq, value: restored }
              goto: ending_bidams_regent
            - when: { var: record_policy, op: eq, value: burned }
              goto: ending_recordless_peace
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: ending_empty_observatory
            - when:
                all:
                  - { var: bidam_sentence, op: eq, value: execution }
                  - { var: final_decree, op: eq, value: strong_crown }
              goto: ending_iron_queen
            - when:
                all:
                  - { var: coronation_compromise, op: eq, value: nobles_audit }
                  - { var: final_decree, op: ne, value: shared_limits }
              goto: ending_borrowed_crown
            - when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
              goto: ending_sisters_shadow
            - when: { var: bidam_sentence, op: eq, value: exile }
              goto: ending_merciful_queen
            - when: { var: people_support, op: lte, value: 4 }
              goto: ending_fallen_star
          default: ending_nameless_queen

  ending_stars_belong_to_people:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "덕만의 사망 기록과 비담의 재판 기록이 같은 벽에 붙었습니다. 아이들이 두 문서의 다른 도장 자국을 손가락으로 찾아냈습니다."
      - say:
          char: 덕만
          camera: close
          text: "별은 왕을 고르지 않는다. 우리가 별을 읽고, 왕의 선택을 적고, 틀리면 고친다."
      - say:
          channel: record
          text: "첨성대 아래 달력은 손때로 검어졌습니다. 죽었다고 먼저 적혔던 아이의 이름 옆에는 수많은 사람의 수정 흔적이 겹쳐 남았습니다."
      - ending: stars_belong_to_people

  ending_merciful_queen:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "비담은 국경에서 이름 없이 다리를 고쳤습니다. 사람들은 선덕의 자비를 노래했고, 새 반역을 꿈꾸는 자들은 그 노래에서 살아남을 가능성을 들었습니다."
      - say:
          char: 덕만.sad
          text: "살려 둔 것이 옳았는지는 그의 남은 삶과 다음 반란이 함께 대답할 것이다."
      - say:
          channel: record
          text: "용서는 평화를 만들었고 동시에 법의 경계를 흐렸습니다."
      - ending: merciful_queen

  ending_iron_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "비담의 목이 떨어진 뒤 회의는 놀랄 만큼 짧아졌습니다. 왕명이 끝나기 전에 모두가 고개를 숙였습니다."
      - say:
          char: 덕만
          text: "조용하구나. 너무 조용해서… 내가 틀렸다는 말도 들리지 않아."
      - say:
          channel: record
          text: "강한 왕은 모든 반대를 이겼습니다. 그 뒤에는 반대와 경고를 구분할 사람도 남지 않았습니다."
      - ending: iron_queen

  ending_borrowed_crown:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: narration
          text: "귀족 회의의 붓은 군량 장부를 넘어 군사 이동과 창고 문서까지 따라왔습니다. 덕만은 명령을 내릴 때마다 즉위 날 받은 세 표를 다시 갚았습니다."
      - say:
          char: 덕만.sad
          text: "조건을 받아 왕이 됐다. 조건을 바꾸지 못하면 왕관은 계속 빌린 물건이다."
      - say:
          channel: record
          text: "평화는 유지됐고 여왕의 통치는 매번 담보를 요구받았습니다."
      - ending: borrowed_crown

  ending_empty_observatory:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대 문은 열려 있었지만 관측표 상자는 비담의 암호 없이는 열리지 않았습니다. 탑 아래 아이들은 별 대신 전령을 기다렸습니다."
      - say:
          char: 덕만.sad
          text: "돌을 높이 세웠는데 지식이 오를 계단은 한 사람에게 맡겼구나."
      - say:
          channel: record
          text: "지식을 위해 세운 탑은 지식을 가두는 가장 높은 벽이 되었습니다."
      - ending: empty_observatory

  ending_bidams_regent:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "돌아온 비담은 사흘 만에 끊긴 전령망을 이었습니다. 넷째 날부터 관리들은 왕의 도장보다 비담의 고갯짓을 먼저 기다렸습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "폐하께서 저를 감시하시는 동안 나라는 아주 잘 움직이고 있습니다."
      - say:
          channel: record
          text: "가장 유능한 신하는 왕 곁에 남았고, 마침내 왕보다 먼저 명령을 내리는 사람이 되었습니다."
      - ending: bidams_regent

  ending_sisters_shadow:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          channel: narration
          text: "밤마다 비밀문이 열리고 천명이 덕만의 칙령을 먼저 읽었습니다. 어느 순간 덕만은 회의장의 반대보다 어둠 속 언니의 침묵을 더 두려워했습니다."
      - say:
          char: 천명.sad
          text: "나를 살린 방이 네 통치까지 가두고 있어. 이제 내게 묻지 않고 결정해야 해."
      - say:
          channel: record
          text: "두 공주는 함께 남았고, 한 사람의 멈춘 시간이 나라의 미래 위에 긴 그림자를 만들었습니다."
      - ending: sisters_shadow

  ending_recordless_peace:
    actions:
      - bg: moon_court
      - camera: wide
      - effect: embers
      - say:
          channel: narration
          text: "사망 기록과 반란 서신은 한 줌 재가 됐습니다. 한동안 아무도 과거 종이를 들고 새 싸움을 시작하지 못했습니다."
      - say:
          char: 덕만.sad
          text: "이 평화가 오래가기를 바란다. 다만 다음 거짓 기록을 알아볼 눈까지 태운 것은 아니기를."
      - say:
          channel: record
          text: "싸움의 증거가 사라지자 싸움은 잦아들었습니다. 같은 위조가 어떻게 시작됐는지도 함께 사라졌습니다."
      - ending: recordless_peace

  ending_fallen_star:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "반란은 끝났지만 왕실 전령이 오는 날이면 마을 문이 먼저 닫혔습니다. 성문 안에는 왕관이, 밖에는 왕명을 기다리지 않는 장터가 남았습니다."
      - say:
          char: 덕만.sad
          text: "별이 떨어진 것이 아니다. 내가 별을 바라보는 사람들의 땅을 잃었다."
      - say:
          channel: record
          text: "여왕은 왕좌를 지켰고 신라는 서로 다른 명령을 내리는 두 나라가 되었습니다."
      - ending: fallen_star

  ending_nameless_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "사서에는 선덕왕의 이름이 오래 남았습니다. 그러나 그 이름을 처음 죽인 종이와 왕좌까지 빌려 쓴 거짓은 봉인 상자 안에서 함께 늙었습니다."
      - say:
          char: 덕만.sad
          text: "왕의 이름은 되찾았는데, 그 이름을 지우려 한 이유는 세상에 돌려주지 못했구나."
      - say:
          channel: record
          text: "왕은 남았습니다. 그 왕이 무엇과 싸웠는지는 이름 없는 공백이 되었습니다."
      - ending: nameless_queen
