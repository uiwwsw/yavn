chapterTitle: "마지막 기록"

script:
  - scene: last_trial

scenes:
  last_trial:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: record
          text: "제12장 — 마지막 기록"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "상 위에 탄 연살과 비담의 편지가 놓였다. 덕만은 그 곁에 제 사망 기록을 폈다. 궁문 밖에서 비담을 죽이라는 소리와 살리라는 소리가 부딪혔다. 가족 이름을 읽어 달라는 목소리가 그 사이에 끼었다."
      - say:
          when: { var: rebellion_response, op: eq, value: siege_trial }
          channel: record
          text: "재판 명부 첫 장에 성 밖 마을들이 올랐다. 포위 사흘 동안 먹을 것이 끊긴 집들이었다. 덕만은 그 장을 넘기지 말라 했다."
      - say:
          when: { var: rebellion_response, op: eq, value: amnesty_split }
          channel: narration
          text: "해산한 농민들 대부분은 궁에 오지 않았다. 덕만은 돌아간 이들의 명부도 가져오게 했다. 대답하러 오지 않은 이름을 함부로 지우지 못하게 했다."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "죽이시겠습니까, 살리시겠습니까. 오늘은 폐하의 대답만 듣겠습니다."
      - say:
          char: 덕만
          camera: medium
          with: [비담]
          text: "내 대답을 기다린 사람이 너만은 아니다. 문밖의 이름부터 듣고 시작하겠다."
      - goto: bidam_sentence_choice

  bidam_sentence_choice:
    actions:
      - choice:
          key: c12_bidam_sentence
          prompt: "비담이 고개를 든다. 판결을 기다리고 있다."
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "반란 지휘의 책임을 물어 처형한다"
              set: { bidam_sentence: execution }
              add: { fear: 2, nobles_support: 1, mercy: -1 }
              goto: sentence_execution
            - text: "모든 이름을 빼앗고 국경으로 추방한다"
              set: { bidam_sentence: exile }
              add: { mercy: 2, people_support: 1, nobles_support: -1 }
              goto: sentence_exile
            - text: "정보망을 넘기게 하고 곁에서 감시한다"
              when: { var: bidam_trust, op: gte, value: 5 }
              set: { bidam_sentence: restored }
              add: { army_support: 1, fear: 2, bidam_trust: 2 }
              goto: sentence_restored

  sentence_execution:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - effect: "inkstamp"
      - say:
          char: "덕만"
          text: "반란을 지휘한 죄로 죽음을 명한다. 해산한 농민들에게 네 죄를 나누어 묻지는 않겠다."
      - say:
          char: "비담.sad"
          camera: "medium"
          with:
            - "덕만"
          text: "명 받들겠습니다. …제 전령들은 길밖에 모릅니다. 그 길까지 베지는 마십시오."
      - say:
          channel: "narration"
          text: "형이 집행되었다. 전령의 명부와 암호는 세 기록관이 나눠 받았다. 유족들이 앞으로 나와 자기 가족의 이름을 짚었다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          text: "다음 장을 펴라. 비담에게 권한을 내준 날, 내 인장이 찍힌 명도 읽어라."
      - wait: 180
      - say:
          channel: thought
          text: "다른 말이 있느냐고 물었다. 아무도 고개를 들지 않는다. 판결 전보다 이 고요가 더 길다."
      - goto: "death_record_choice"

  sentence_exile:
    actions:
      - effect: inkstamp
      - say:
          char: 덕만
          text: "지위와 이름을 거두고 국경으로 보낸다. 네가 끊은 곡식길의 다리를 고쳐라. 살아서 갚아라."
      - say:
          char: 비담.sad
          camera: medium
          with: [덕만]
          text: "알겠습니다. 첫 다리가 어디인지는 제가 압니다."
      - goto: death_record_choice

  sentence_restored:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - effect: "inkstamp"
      - say:
          char: "덕만"
          text: "명부와 암호를 내어라. 이후 네가 내리는 명에는 기록관이 함께 서명한다."
      - say:
          char: "비담"
          camera: "medium"
          with:
            - "덕만"
          text: "그리하겠습니다. 급한 밤에도 그 한 사람을 기다려 주십시오."
      - say:
          channel: "narration"
          text: "비담이 명부를 건넸다. 기록관은 첫 장에서부터 읽지 못하는 암호를 만났다. 묶인 손의 비담이 몸을 기울여 뜻을 일러 주었다."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "비담"
          text: "한 번 더 가르쳐라. 너 없으면 못 읽겠다는 보고를 다시 듣지는 않겠다."
      - wait: 180
      - say:
          channel: thought
          text: "명부는 상 위에 있다. 그런데 묻는 얼굴은 모두 비담을 향한다. 내 명령만으로 저 버릇이 바뀔까."
      - goto: "death_record_choice"

  death_record_choice:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - say:
          camera: medium
          channel: action
          text: "오래 모은 종이를 바닥에 편다. 불탄 귀퉁이와 새 먹이 한 줄로 이어진다. 소화가 화로를 놓는다. 우리는 잠시 말없이 손을 녹인다."
      - char: { id: 소화, position: right }
      - say:
          when: { var: sohwa_trust, op: gte, value: 3 }
          char: 소화
          camera: medium
          with: [덕만]
          text: "그날도 이 손을 놓지 않으셨지요. …아기씨 이름부터 읽어 주셔요. 저는 듣고 있겠습니다."
      - choice:
          key: c12_record_policy
          prompt: "화로에 불이 남았다. 내 이름이 적힌 종이를 든다."
          char: 덕만
          camera: medium
          options:
            - text: "원본과 덕만의 거짓까지 궁문에 붙인다"
              set: { record_policy: public }
              add: { evidence: 2, people_support: 2, nobles_support: -2 }
              goto: records_public
            - text: "세 자물쇠로 잠가 다음 왕에게 넘긴다"
              set: { record_policy: sealed }
              add: { nobles_support: 2, fear: 1 }
              goto: records_sealed
            - text: "피해자 이름만 베끼고 원본은 태운다"
              set: { record_policy: burned }
              add: { mercy: 1, people_support: 1, evidence: -3 }
              goto: records_burned

  records_public:
    actions:
      - sticker: { id: c12_death_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: action
          text: "내 사망 기록을 궁문에 붙인다. 내가 내린 명도 그 옆에 건다. 사람들 틈에서 읽는 목소리가 난다. 내 이름에 이르러 멎어도 자리를 뜨지 않는다."
      - say:
          char: 덕만
          text: "내가 쓴 거짓도 같은 자리에 걸어라. 글씨를 작게 쓰지 말고."
      - clearSticker: { id: c12_death_record, leave: fadeOut }
      - goto: last_decree_choice

  records_sealed:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - say:
          channel: "narration"
          text: "원본들이 함 안으로 들어갔다. 피해자 이름만 따로 베껴 궁문에 붙였다. 누가 고쳤는지 보려는 손은 닫힌 함 위에서 멈췄다."
      - say:
          char: "소화.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "기다리는 분들이 늙었습니다. 이 문서가 열릴 때까지 기다릴 수 있을까요."
      - say:
          char: "덕만.queen_sad"
          camera: "medium"
          with:
            - "소화"
          text: "개봉할 날을 적어 두자. 다음 왕에게도 그대로 넘기라 명하겠다."
      - say:
          channel: "narration"
          text: "열쇠 셋이 나뉘었다. 원본을 보러 온 사람들은 날짜가 적힌 작은 종이를 받아 갔다. 한 노인이 품에 넣기 전 오래 들여다보았다."
      - wait: 180
      - say:
          channel: thought
          text: "그때까지 살 수 있겠느냐고 노인이 물었다. 명령서에 쓸 대답은 있었는데, 그 앞에서 할 말은 없었다."
      - goto: "last_decree_choice"

  records_burned:
    actions:
      - bg:
          id: "locked_room"
          transition: "fade"
          duration: 900
      - effect: "embers"
      - say:
          channel: "narration"
          text: "소화가 마지막 이름을 옮겼다. 덕만은 원본을 화로에 넣었다. 붉은 인장이 먼저 검어지고, 접혔던 자리를 따라 불이 벌어졌다."
      - say:
          char: "덕만.queen_sad"
          text: "이 이름으로 다시 사람을 끌어내지는 마라. 문밖에 기다리는 이들은 집으로 보내라."
      - say:
          char: "소화.nervous"
          camera: "medium"
          with:
            - "덕만"
          text: "다 옮겼습니다. …그런데 이 도장이 또 나오면, 이제 무엇에 맞춰 볼까요."
      - say:
          channel: "narration"
          text: "덕만이 불집게를 들었다가 내려놓았다. 종이는 모양만 남은 재였다. 문밖의 언성이 조금씩 멀어졌다."
      - wait: 180
      - say:
          channel: thought
          text: "조용해졌다. 소화의 물음이 남았다. 같은 도장이 다시 나오면. 나는 화로에서 눈을 떼지 못한다."
      - goto: "last_decree_choice"

  last_decree_choice:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: thought
          text: "새 종이를 편다. 남이 내 죽음을 적었던 때가 떠오른다. 내가 쓴 이 글도 틀릴 수 있다. 그때 고칠 사람의 자리를 남겨야 한다."
      - choice:
          key: c12_final_decree
          prompt: "마지막 칙령이다. 다음 왕에게 무엇을 남길까?"
          char: 덕만
          camera: medium
          options:
            - text: "전쟁 중 모인 권한을 왕좌에 묶어 둔다"
              set: { final_decree: strong_crown }
              add: { army_support: 2, fear: 2, nobles_support: -1 }
              goto: bad_strong_crown
            - text: "귀족·군대·마을에 서로 다른 열쇠를 준다"
              set: { final_decree: divided_guardians }
              add: { nobles_support: 1, people_support: 1, army_support: 1 }
              goto: bad_divided_guardians
            - text: "관측·곡식·재판 장부의 문을 모두 연다"
              set: { final_decree: shared_limits }
              add: { people_support: 2, insight: 2 }
              goto: judge_ending

  bad_strong_crown:
    actions:
      - bg:
          id: "throne_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "queen_angry"
      - char:
          id: "춘추"
          position: "right"
          emotion: "nervous"
      - say:
          char: "덕만.queen"
          text: "전시에 거둔 권한은 왕에게 남긴다. 늦어진 명은 까닭과 담당자의 이름을 올려라."
      - say:
          char: "춘추"
          text: "왕명이 잘못되어 멈춘 자도 그 명부에 올려야 합니까, 폐하?"
      - say:
          channel: "narration"
          text: "명령이 빨리 나갔다. 덕만이 붓을 내려놓으면 기록관도 붓을 놓았다. 반박하려고 목을 가다듬는 소리는 점점 드물어졌다."
      - wait: 180
      - say:
          channel: thought
          text: "급한 일은 줄었다. 잘못된 일이 줄었는지는 알 수 없다. 내 눈앞에 오는 보고는 모두 가지런하다."
      - goto: "judge_ending"

  bad_divided_guardians:
    actions:
      - bg:
          id: "council_hall"
          transition: "dissolve"
          duration: 720
      - camera:
          shot: "close"
          target: "덕만"
      - char:
          id: "덕만"
          position: "left"
          emotion: "queen_sad"
      - char:
          id: "유신"
          position: "right"
          emotion: "angry"
      - say:
          char: "덕만.queen"
          text: "군량과 성문과 관측표의 열쇠를 나누어라. 다른 이의 문을 혼자 열게 하지는 마라."
      - say:
          char: "유신"
          text: "열쇠를 쥔 자가 오지 않으면 늦어집니다. 그때도 다시 불러 의논하시겠습니까?"
      - say:
          channel: "narration"
          text: "첫 회의는 해가 져도 끝나지 않았다. 문밖에서 기다리던 사람이 언제 결정되느냐고 물었다. 덕만은 문을 열고 무엇 때문에 늦는지 설명하게 했다."
      - wait: 180
      - say:
          channel: thought
          text: "촛불을 한 번 갈았다. 답답해서 내가 정하고 싶다. 그럴 때마다 탁자 위에 놓인 다른 열쇠들을 본다."
      - goto: "judge_ending"

  judge_ending:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - var: observed_left_waterway
                    op: eq
                    value: true
                  - var: saved_market_witness
                    op: eq
                    value: true
                  - var: sisters_public
                    op: eq
                    value: true
                  - var: grain_policy
                    op: eq
                    value: public_distribution
                  - var: eclipse_policy
                    op: eq
                    value: public_science
                  - var: king_failure_public
                    op: eq
                    value: true
                  - var: cheonmyeong_outcome
                    op: eq
                    value: exile
                  - var: coronation_compromise
                    op: eq
                    value: public_council
                  - var: knowledge_policy
                    op: eq
                    value: public
                  - var: record_policy
                    op: eq
                    value: public
                  - var: final_decree
                    op: eq
                    value: shared_limits
                  - var: bidam_sentence
                    op: eq
                    value: exile
                  - var: seals_linked
                    op: eq
                    value: true
                  - var: grain_verified
                    op: eq
                    value: true
                  - var: token_verified
                    op: eq
                    value: true
                  - var: kite_verified
                    op: eq
                    value: true
              goto: ending_hidden_constellation
            - when:
                var: cheonmyeong_outcome
                op: eq
                value: hidden_alive
              goto: ending_sisters_shadow
            - when:
                all:
                  - var: record_policy
                    op: eq
                    value: public
                  - var: knowledge_policy
                    op: eq
                    value: public
                  - var: final_decree
                    op: eq
                    value: shared_limits
                  - var: bidam_sentence
                    op: eq
                    value: exile
                  - var: people_support
                    op: gte
                    value: 8
                  - var: insight
                    op: gte
                    value: 8
              goto: ending_stars_belong_to_people
            - when:
                var: bidam_sentence
                op: eq
                value: restored
              goto: ending_bidams_regent
            - when:
                var: record_policy
                op: eq
                value: burned
              goto: ending_recordless_peace
            - when:
                var: knowledge_policy
                op: eq
                value: bidam_network
              goto: ending_empty_observatory
            - when:
                all:
                  - var: bidam_sentence
                    op: eq
                    value: execution
                  - var: final_decree
                    op: eq
                    value: strong_crown
              goto: ending_iron_queen
            - when:
                all:
                  - var: coronation_compromise
                    op: eq
                    value: nobles_audit
                  - var: final_decree
                    op: ne
                    value: shared_limits
              goto: ending_borrowed_crown
            - when:
                var: people_support
                op: lte
                value: 4
              goto: ending_fallen_star
            - when:
                var: bidam_sentence
                op: eq
                value: exile
              goto: ending_merciful_queen
          default: ending_nameless_queen

  ending_hidden_constellation:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "탑 아래 열두 등불이 켜졌다. 물길을 열어 준 이, 인장장이를 숨겨 준 이, 천명의 들것을 함께 든 이의 이름이 걸렸다. 덕만은 아는 이름 앞에서 걸음을 멈췄다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          char: 덕만
          camera: medium
          text: "내 이름은 뒤에 읽어도 된다. 소화의 이름은 어디 있느냐. 그날 내 손을 잡은 사람이다."
      - say:
          channel: narration
          text: "아이들이 등불 사이에 실을 걸었다. 키가 닿지 않는 곳은 어른들이 들어 주었다. 덕만도 실 한 끝을 받았다. 누가 먼저 놓을 수 없는 모양이 되었다."
      - say:
          channel: record
          text: "그날 등불의 배치는 관측표에 없는 것이었다. 이듬해에도 사람들은 같은 자리에 모였고, 빠졌던 이름을 하나씩 더 걸었다."
      - ending: hidden_constellation

  ending_stars_belong_to_people:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "사망 기록과 재판 기록이 같은 벽에 걸렸다. 아이 둘이 다른 도장 자국을 찾으며 다투었다. 덕만이 다가가도 다툼은 멎지 않았다."
      - say:
          char: 덕만
          camera: medium
          text: "별이 왕을 고르는 게 아니다. 너희가 보고 고르는 것이지. 자, 어디가 다르다고 했느냐?"
      - say:
          channel: record
          text: "첨성대 아래 달력은 손때로 검어졌다. 왕의 글씨 위에도 줄이 그어졌다. 고친 사람은 자기 이름을 작게 덧썼다."
      - ending: stars_belong_to_people

  ending_merciful_queen:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: narration
          text: "국경의 다리가 다시 놓였다. 이름 없는 사내가 마지막 널을 박았다. 도성에서는 여왕의 자비를 노래했고, 유족 하나는 그 노래가 시작되면 자리를 떴다."
      - say:
          char: 덕만.queen_sad
          text: "다리를 다 고쳤다는 보고가 왔느냐. 그렇다고 유족의 청을 돌려보내지는 마라."
      - say:
          channel: record
          text: "비담은 살아남았다. 판결이 옳았느냐는 청원은 해마다 다른 이름으로 올라왔다."
      - ending: merciful_queen

  ending_iron_queen:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "조회가 일찍 끝났다. 덕만이 말을 맺기 전에 모두 머리를 숙였다. 틀린 숫자가 든 문서도 그날은 그대로 나갔다."
      - say:
          char: 덕만
          text: "이 수가 틀렸구나. 아는 자가 없었느냐? …알고도 말하지 않은 것이냐?"
      - say:
          channel: record
          text: "반란은 다시 일어나지 않았다. 사관은 그해를 평온했다 적었다. 그 문장에 이의를 다는 사람도 없었다."
      - ending: iron_queen

  ending_borrowed_crown:
    actions:
      - bg: { id: council_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "군량 장부를 보던 귀족들이 출병 문서에도 서명을 요구했다. 덕만의 인장 옆에 빈칸 셋이 생겼다. 급한 전령은 그 칸이 채워질 때까지 서 있었다."
      - say:
          char: 덕만.queen_sad
          text: "오늘도 세 분을 기다려야 하느냐. 국경에서는 벌써 사흘을 기다렸다."
      - say:
          channel: record
          text: "왕명은 내려졌다. 시행한 날짜는 늘 조금 늦었다. 즉위 날 받은 세 표의 값은 장부에 적히지 않았다."
      - ending: borrowed_crown

  ending_empty_observatory:
    actions:
      - bg: { id: title_palace, transition: dissolve, duration: 720 }
      - music: open_sky
      - say:
          camera: wide
          channel: narration
          text: "첨성대 문은 열려 있었다. 그러나 표가 든 함 앞에서 관측관이 멈췄다. 아이들은 탑을 올려다보다가 전령 오는 길로 고개를 돌렸다."
      - say:
          char: 덕만.queen_sad
          text: "문을 열어 두라 했는데… 아직도 허락을 기다리느냐. 누구의 허락을."
      - say:
          channel: record
          text: "탑의 돌은 해마다 볕을 받았다. 관측표의 종이는 함 안에서 빛을 잃었다."
      - ending: empty_observatory

  ending_bidams_regent:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          camera: medium
          channel: narration
          text: "비담이 돌아온 지 사흘 만에 전령길이 이어졌다. 넷째 날, 덕만이 인장을 들었을 때 관리가 이미 명을 보냈다고 답했다."
      - say:
          char: 비담.smirk
          camera: medium
          with: [덕만]
          text: "밤이 급해 먼저 보냈습니다. 폐하를 깨워야 했겠습니까?"
      - say:
          channel: record
          text: "왕의 인장은 뒤늦게 찍혔다. 명령서에는 여왕의 뜻이라 적혔다."
      - ending: bidams_regent

  ending_sisters_shadow:
    actions:
      - bg: { id: locked_room, transition: fade, duration: 900 }
      - music: sealed_court
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          camera: medium
          channel: narration
          text: "밤마다 비밀문이 열렸다. 천명은 칙령을 먼저 읽었다. 언니가 돌려주는 종이에 아무 표시가 없으면 덕만은 한 번 더 물었다. 정말 괜찮겠느냐고."
      - say:
          char: 천명.sad
          text: "덕만아. 오늘은 내게 묻지 마. 나는 아직 저 문밖도 못 나가 본 사람이야."
      - say:
          channel: record
          text: "두 자매는 오래 함께 있었다. 회의장에는 천명의 자리가 생기지 않았다. 밤의 조언을 낮에 증언할 사람도 없었다."
      - ending: sisters_shadow

  ending_recordless_peace:
    actions:
      - bg: { id: moon_court, transition: dissolve, duration: 720 }
      - music: open_sky
      - effect: embers
      - say:
          camera: wide
          channel: narration
          text: "종이를 태운 뒤로 궁문 앞 다툼이 줄었다. 몇 해 뒤, 낡은 인장을 가져온 사내가 그 흠을 아느냐고 물었다. 맞춰 볼 원본은 없었다."
      - say:
          char: 덕만.queen_sad
          text: "본 적 있는 흠이다. 분명히… 소화야, 네가 베낀 이름들을 가져오너라."
      - say:
          channel: record
          text: "이름은 남아 있었다. 어느 인장이 누구를 죽였다 적었는지, 다시 확인할 종이만 없었다."
      - ending: recordless_peace

  ending_fallen_star:
    actions:
      - bg: { id: frontier, transition: wipeLeft, duration: 700 }
      - music: night_road
      - say:
          camera: wide
          channel: narration
          text: "왕실 전령이 오면 마을 문이 닫혔다. 도성의 명령이 도착하기 전에 장터 사람들은 제 일을 정했다. 전령은 읽지 못한 왕명을 품고 돌아왔다."
      - say:
          char: 덕만.queen_sad
          text: "가 보아야겠다. 군사를 데려가자는 말은 하지 마라. 이번에는 문을 열어 달라 청하겠다."
      - say:
          channel: record
          text: "왕좌는 지켜졌다. 성 밖 마을 장부에는 그해부터 왕실과 다른 날짜가 쓰였다."
      - ending: fallen_star

  ending_nameless_queen:
    actions:
      - bg: { id: throne_hall, transition: dissolve, duration: 720 }
      - music: sealed_court
      - say:
          camera: wide
          channel: narration
          text: "사관은 선덕왕의 치적을 적었다. 어린 덕만을 죽었다 쓴 종이는 잠긴 함에 있었다. 사관이 물으면 관원은 그 함이 아직 열릴 때가 아니라 했다."
      - say:
          char: 덕만.queen_sad
          text: "왕이 된 날은 자세히 적었구나. 그 전에 나는… 어떤 아이였다고 적었느냐?"
      - say:
          channel: record
          text: "왕의 이름은 오래 전해졌다. 그 이름을 되찾기 전에 불렸던 이름들은 사서의 빈칸에 남았다."
      - ending: nameless_queen
