script:
  - scene: last_trial

scenes:
  last_trial:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: record
          text: "제12장 — 마지막 기록"
      - char: { id: 덕만, position: left, emotion: queen }
      - char: { id: 비담, position: right, emotion: sad }
      - say:
          channel: narration
          text: "증거상 위에 불탄 연, 비담의 편지, 어린 덕만의 사망 기록이 놓였습니다. 궁문 밖에는 세 줄이 생겼습니다. 비담을 죽이라는 사람, 살리라는 사람, 그리고 어느 쪽이든 먼저 자기 가족 이름부터 적어 달라는 사람들."
      - say:
          when: { var: rebellion_response, op: eq, value: siege_trial }
          channel: record
          text: "재판 명부 첫 장에는 포위 사흘 동안 솥이 식은 성 밖 마을의 이름이 적혔습니다. 칼을 덜 쓴 승리도 굶은 사람 앞에서는 무죄가 아니었습니다."
      - say:
          when: { var: rebellion_response, op: eq, value: amnesty_split }
          channel: narration
          text: "해산 북을 듣고 돌아간 농민들은 궁문 밖 세 줄 어디에도 서지 않았습니다. 덕만은 비어 있는 네 번째 줄까지 판결문에 남기게 했습니다."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "살리면 사랑이라 하고, 죽이면 제 말을 겁냈다 하겠지요. 폐하는 어느 기록이 더 두렵습니까?"
      - say:
          char: 덕만
          camera: close
          with: [비담]
          text: "내가 덜 아픈 쪽을 고르진 않겠다. 네 반역도, 네 권력을 키운 내 책임도 따로 적을 거야."
      - goto: bidam_sentence_choice

  bidam_sentence_choice:
    actions:
      - choice:
          key: c12_bidam_sentence
          prompt: "비담의 반역을 어떻게 판결할까요?"
          char: 덕만
          camera: medium
          with: [비담]
          options:
            - text: "반란 지휘의 책임을 물어 처형한다"
              set: { bidam_sentence: execution }
              add: { fear: 2, nobles_support: 1, mercy: -1 }
              goto: sentence_execution
            - text: "모든 이름을 빼앗고 국경으로 추방한다"
              set: { bidam_sentence: exile }
              add: { mercy: 2, people_support: 1, nobles_support: -1 }
              goto: sentence_exile
            - text: "정보망을 넘기게 하고 곁에서 감시한다"
              when: { var: bidam_trust, op: gte, value: 5 }
              set: { bidam_sentence: restored }
              add: { army_support: 1, fear: 2, bidam_trust: 2 }
              goto: sentence_restored

  sentence_execution:
    actions:
      - bg: throne_hall
      - effect: inkstamp
      - say:
          char: 덕만
          text: "사람이었는지 물은 건 죄가 아니다. 하지만 그 답을 받겠다며 남의 목숨을 썼다. 외로움으로 반역을 덮지 마라."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "끝까지 저를 악인 한 글자로 끝내진 않으시는군요. 그래도 제 목을 본 사람들은 짧게 기억하겠죠."
      - say:
          channel: narration
          text: "처형 뒤 비담의 전령들은 해산하지 않았습니다. 사흘째 밤, 비담의 마지막 술이라며 올라온 잔을 한 궁인이 덕만 앞에 놓았습니다."
      - say:
          char: 덕만.queen_sad
          camera: close
          text: "이 잔, 누가 들였지? 비담은 죽었는데 왜 그자의 명령은 아직 궁문을 지나와?"
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "비담 처형 사흘 뒤 선덕왕 독살. 비담 잔당으로 추정되나 관련 전령 명부는 발견되지 않음."
      - gameOver:
          title: "운명 — 잘린 목이 남긴 잔"
          message: "비담만 처형하고 그가 만든 전령망과 추종자들의 돌아갈 길을 정리하지 않았습니다. 충성을 잃은 잔당은 마지막 술에 독을 넣어 여왕을 뒤따르게 했습니다."
          recoverToChoice: c12_bidam_sentence

  sentence_exile:
    actions:
      - effect: inkstamp
      - say:
          char: 덕만
          text: "죽여서 네 죄와 내 책임을 함께 덮진 않겠다. 네가 끊은 곡식길로 가. 이름 없이 다리를 잇고 살아."
      - say:
          char: 비담.sad
          camera: close
          with: [덕만]
          text: "죽는 것보다 오래 걸리겠군요. 자비라 부르는 자에겐 제가 부순 첫 다리부터 보여 주겠습니다."
      - goto: death_record_choice

  sentence_restored:
    actions:
      - bg: throne_hall
      - effect: inkstamp
      - say:
          char: 덕만
          text: "전령 이름과 암호를 전부 넘겨라. 다시 내 곁에서 일하되, 네 충성을 자물쇠도 면죄부도 삼지 않겠다."
      - say:
          char: 비담
          camera: close
          with: [덕만]
          text: "버리지도 믿지도 않고 다시 쓰시는군요. 폐하께서 잠든 뒤에도 눈을 떼지 않으실 수 있습니까?"
      - say:
          channel: narration
          text: "한 달 뒤 관리들은 여왕의 도장보다 비담의 허가를 먼저 기다렸습니다. 왕실 의원도 그의 전령이 가져온 약재만 받았습니다."
      - say:
          char: 덕만.queen_sad
          camera: close
          with: [비담]
          text: "이 약을 네 사람이 가져왔다. 비담, 이번에도 내가 널 믿어야만 문이 열리는구나."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "선덕왕, 지병으로 승하. 비담이 섭정으로 국정을 수습했으며 독살 의혹을 제기한 기록관은 실종됨."
      - gameOver:
          title: "운명 — 다시 맡긴 문"
          message: "반란 뒤에도 비담을 유일한 정보의 문으로 복귀시키자 여왕의 약과 명령까지 그를 거쳤습니다. 덕만은 독이 든 약을 마셨고 비담은 가장 먼저 국정을 수습한 사람이 됐습니다."
          recoverToChoice: c12_bidam_sentence

  death_record_choice:
    actions:
      - bg: locked_room
      - camera: medium
      - say:
          channel: narration
          text: "재판 뒤 덕만은 열두 해의 종이를 바닥에 길게 늘어놓았습니다. 자기 사망 기록에서 시작한 줄은 곡식 장부와 위조 자백, 일식표를 지나 비담의 편지에서 멈췄습니다. 소화가 화로를 가져왔습니다."
      - char: { id: 소화, position: right }
      - say:
          when: { var: sohwa_trust, op: gte, value: 3 }
          char: 소화
          camera: close
          with: [덕만]
          text: "불 속에서 제 손을 다시 잡으셨죠. 무엇을 남기든, 죽었다고 적힌 덕만과 그 뒤에 죽은 사람부터 읽어 주세요."
      - choice:
          key: c12_record_policy
          prompt: "열두 해의 기록을 어떻게 남길까요?"
          char: 덕만
          camera: close
          options:
            - text: "원본과 덕만의 거짓까지 궁문에 붙인다"
              set: { record_policy: public }
              add: { evidence: 2, people_support: 2, nobles_support: -2 }
              goto: records_public
            - text: "세 자물쇠로 잠가 다음 왕에게 넘긴다"
              set: { record_policy: sealed }
              add: { nobles_support: 2, fear: 1 }
              goto: records_sealed
            - text: "피해자 이름만 베끼고 원본은 태운다"
              set: { record_policy: burned }
              add: { mercy: 1, people_support: 1, evidence: -3 }
              goto: records_burned

  records_public:
    actions:
      - sticker: { id: c12_death_record, image: death_register_sticker, x: 50, y: 28, width: "clamp(180px, 22%, 340px)", anchorX: center, anchorY: center, enter: fadeIn }
      - say:
          channel: narration
          text: "덕만의 사망 기록이 궁문 한가운데 붙었습니다. 그 아래에는 여왕이 거짓 왕명과 연출된 기적을 쓴 날도 같은 먹으로 적혔습니다."
      - say:
          char: 덕만
          text: "나를 죽인 거짓만 열고 내가 쓴 거짓을 숨기면 똑같아. 왕에게 불리한 글도 같은 크기로 써."
      - clearSticker: { id: c12_death_record, leave: fadeOut }
      - goto: last_decree_choice

  records_sealed:
    actions:
      - bg: locked_room
      - say:
          channel: narration
          text: "상자에 자물쇠 세 개가 걸렸습니다. 열쇠는 다음 왕에게 넘어갔고, 진실은 다시 한 사람의 밤에만 열리는 물건이 됐습니다."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "폐하, 다음 왕의 열쇠를 왜 귀족들이 하나씩 가져갑니까? 상자보다 폐하 얼굴만 보고 있어요."
      - say:
          char: 덕만.queen_sad
          camera: close
          with: [소화]
          text: "내가 죽어야 열 수 있는 상자처럼 보이겠구나. 열쇠를 돌려받아. 오늘 안에 공개하자."
      - say:
          channel: narration
          text: "열쇠를 받은 세 가문은 상자를 열기보다 다음 왕을 먼저 만들기로 했습니다. 그날 저녁 덕만의 탕약에는 냄새 없는 독이 섞였습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "선덕왕 급서. 봉인 기록은 후계 왕에게 이관됐으며 독살 의혹은 국가 안정을 위해 기록하지 않음."
      - gameOver:
          title: "운명 — 다음 왕을 부른 상자"
          message: "진실을 다음 왕에게만 넘기자 열쇠를 쥔 귀족들에게는 현재 왕을 빨리 없앨 이유가 생겼습니다. 덕만은 봉인을 열기도 전에 독살됐습니다."
          recoverToChoice: c12_record_policy

  records_burned:
    actions:
      - bg: locked_room
      - effect: embers
      - say:
          channel: narration
          text: "위조 문서가 불 속에서 오그라들었습니다. 소화는 피해자 이름을 새 명부에 옮겼지만, 마지막 도장이 재가 될 때 손을 멈췄습니다."
      - say:
          char: 덕만.queen_sad
          text: "사람 이름은 옮겼어. 이제 저 종이로 다시 싸우진 못할 거야."
      - say:
          char: 소화.nervous
          camera: close
          with: [덕만]
          text: "하지만 첫 기록의 인장도 탔어요. 방금 온 약방 교지가 같은 인장인지 뭘로 확인합니까?"
      - say:
          channel: narration
          text: "덕만이 교지를 들었지만 비교할 원본은 재가 된 뒤였습니다. 왕실 약방은 위조 명령대로 의원을 내보냈고, 새 의원이 올린 침에 독이 묻어 있었습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "선덕왕 진료 기록 — 왕명에 따라 새 의원이 시침한 뒤 선덕왕 사망. 교지 진위는 확인할 기록이 없음."
      - gameOver:
          title: "운명 — 태운 뒤 돌아온 인장"
          message: "거짓 기록의 원본을 태우자 같은 위조를 알아볼 기준도 사라졌습니다. 독을 묻힌 의원은 왕명으로 들어왔고 아무도 그 인장을 반박하지 못했습니다."
          recoverToChoice: c12_record_policy

  last_decree_choice:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대 아래 긴 탁자에 마지막 칙령이 놓였습니다. 어린 덕만의 죽음은 남이 먼저 썼습니다. 이제 선덕왕은 자기 뒤에 올 사람들이 왕의 글을 고칠 수 있는 문장을 써야 했습니다."
      - choice:
          key: c12_final_decree
          prompt: "다음 왕의 거짓도 고칠 수 있게 권한을 어디에 둘까요?"
          char: 덕만
          camera: close
          options:
            - text: "관측·곡식·재판 장부의 문을 모두 연다"
              set: { final_decree: shared_limits }
              add: { people_support: 2, insight: 2 }
              goto: judge_ending
            - text: "전쟁 중 모인 권한을 왕좌에 묶어 둔다"
              set: { final_decree: strong_crown }
              add: { army_support: 2, fear: 2, nobles_support: -1 }
              goto: bad_strong_crown
            - text: "귀족·군대·마을에 서로 다른 열쇠를 준다"
              set: { final_decree: divided_guardians }
              add: { nobles_support: 1, people_support: 1, army_support: 1 }
              goto: bad_divided_guardians

  bad_strong_crown:
    actions:
      - bg: throne_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: queen_angry }
      - char: { id: 춘추, position: right, emotion: nervous }
      - say:
          char: 춘추.nervous
          text: "창고와 군대와 재판 열쇠가 모두 왕실에 있습니다. 그러니 반대파도 폐하의 침전만 노립니다."
      - say:
          char: 덕만.queen_angry
          text: "문을 잠그고 열쇠를 가져와. 아침에 권한마다 다른 사람을 세우겠다."
      - say:
          channel: narration
          text: "문을 잠근 근위대장도 내일이면 권한을 잃을 사람이었습니다. 그는 마지막으로 왕명을 독점할 수 있는 밤에 침전 열쇠를 반대파에게 넘겼습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "선덕왕 말년 궁성 변란 — 모든 국권을 회수한 밤, 근위대 반란으로 선덕왕 피살."
      - gameOver:
          title: "운명 — 한곳에 모인 칼끝"
          message: "모든 권한을 왕좌에 묶자 나라를 뒤집으려는 사람도 왕 한 명만 없애면 됐습니다. 권한을 잃을 근위대장이 문을 열었고 덕만은 마지막 칙령이 마르기 전에 살해됐습니다."
          recoverToChoice: c12_final_decree

  bad_divided_guardians:
    actions:
      - bg: council_hall
      - camera: { shot: close, target: 덕만 }
      - char: { id: 덕만, position: left, emotion: queen_sad }
      - char: { id: 유신, position: right, emotion: angry }
      - say:
          char: 유신.angry
          text: "군대 열쇠는 있는데 창고가 안 열립니다. 마을은 재판 열쇠부터 내놓으랍니다. 세 명령이 서로 막힙니다."
      - say:
          char: 덕만.queen_sad
          text: "서로 감시하라 나눈 건데 아무도 못 움직이는구나. 세 사람을 지금 불러."
      - say:
          channel: narration
          text: "회의가 열리기 전 군대는 보급을 빼앗으러 창고로 향했고, 마을은 왕군을 막았습니다. 혼란을 기다리던 귀족 자객이 중재하러 나온 덕만의 수레를 습격했습니다."
      - effect: { name: darken, wait: true }
      - say:
          channel: record
          text: "삼열쇠 분쟁 — 군대와 마을 충돌을 중재하던 선덕왕 피살. 범인은 어느 열쇠의 명령도 받지 않았다고 진술."
      - gameOver:
          title: "운명 — 서로 잠근 세 열쇠"
          message: "권한을 나누기만 하고 함께 결정할 공개 절차를 만들지 않자 세 열쇠는 서로를 잠갔습니다. 군대와 마을이 충돌한 틈에서 덕만은 중재자로 나섰다가 죽었습니다."
          recoverToChoice: c12_final_decree

  judge_ending:
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: observed_left_waterway, op: eq, value: true }
                  - { var: saved_market_witness, op: eq, value: true }
                  - { var: sisters_public, op: eq, value: true }
                  - { var: grain_policy, op: eq, value: public_distribution }
                  - { var: eclipse_policy, op: eq, value: public_science }
                  - { var: king_failure_public, op: eq, value: true }
                  - { var: cheonmyeong_outcome, op: eq, value: exile }
                  - { var: coronation_compromise, op: eq, value: public_council }
                  - { var: knowledge_policy, op: eq, value: public }
                  - { var: record_policy, op: eq, value: public }
                  - { var: final_decree, op: eq, value: shared_limits }
                  - { var: bidam_sentence, op: eq, value: exile }
              goto: ending_hidden_constellation
            - when:
                all:
                  - { var: record_policy, op: eq, value: public }
                  - { var: knowledge_policy, op: eq, value: public }
                  - { var: final_decree, op: eq, value: shared_limits }
                  - { var: bidam_sentence, op: eq, value: exile }
                  - { var: people_support, op: gte, value: 8 }
                  - { var: insight, op: gte, value: 8 }
              goto: ending_stars_belong_to_people
            - when: { var: bidam_sentence, op: eq, value: restored }
              goto: ending_bidams_regent
            - when: { var: record_policy, op: eq, value: burned }
              goto: ending_recordless_peace
            - when: { var: knowledge_policy, op: eq, value: bidam_network }
              goto: ending_empty_observatory
            - when:
                all:
                  - { var: bidam_sentence, op: eq, value: execution }
                  - { var: final_decree, op: eq, value: strong_crown }
              goto: ending_iron_queen
            - when:
                all:
                  - { var: coronation_compromise, op: eq, value: nobles_audit }
                  - { var: final_decree, op: ne, value: shared_limits }
              goto: ending_borrowed_crown
            - when: { var: cheonmyeong_outcome, op: eq, value: hidden_alive }
              goto: ending_sisters_shadow
            - when: { var: bidam_sentence, op: eq, value: exile }
              goto: ending_merciful_queen
            - when: { var: people_support, op: lte, value: 4 }
              goto: ending_fallen_star
          default: ending_nameless_queen

  ending_hidden_constellation:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대 아래에 열두 개의 등불이 켜졌습니다. 어린 덕만이 찾아낸 물길에서 시작해 장터의 증인, 천명의 공개 증언, 굶지 않은 마을의 이름이 등불마다 적혔습니다."
      - char: { id: 덕만, position: center, emotion: queen }
      - say:
          char: 덕만
          camera: close
          text: "나는 죽었다고 적혔다가 돌아왔고, 사람을 살린다며 거짓도 썼다. 내 이름보다 내가 틀렸을 때 막아선 이름들을 먼저 읽어라."
      - say:
          channel: narration
          text: "사람들은 등불 사이에 실을 걸었습니다. 왕의 선택 하나가 아니라 서로를 살린 선택들이 이어지자, 땅 위에 처음 보는 별자리가 생겼습니다."
      - say:
          channel: record
          text: "숨겨진 기록 — 선덕왕의 가장 긴 승리는 왕관을 얻은 날이 아니라, 어린 날부터 이어진 선택의 원인을 누구나 되짚을 수 있게 만든 밤이었다."
      - ending: hidden_constellation

  ending_stars_belong_to_people:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "덕만의 사망 기록과 비담의 재판 기록이 같은 벽에 붙었습니다. 아이들이 두 문서의 다른 도장 자국을 손가락으로 찾아냈습니다."
      - say:
          char: 덕만
          camera: close
          text: "별이 왕을 고르는 게 아니다. 우리가 별을 읽고 왕을 고른다. 왕이 틀리면 기록하고 고친다."
      - say:
          channel: record
          text: "첨성대 아래 달력은 손때로 검어졌습니다. 죽었다고 먼저 적혔던 아이의 이름 옆에는 수많은 사람의 수정 흔적이 겹쳐 남았습니다."
      - ending: stars_belong_to_people

  ending_merciful_queen:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "비담은 국경에서 이름 없이 다리를 고쳤습니다. 사람들은 선덕의 자비를 노래했고, 새 반역을 꿈꾸는 자들은 그 노래에서 살아남을 가능성을 들었습니다."
      - say:
          char: 덕만.queen_sad
          text: "그를 살린 게 옳았는지는 노래가 답하지 않는다. 비담의 남은 삶과 다음 판결이 답할 거야."
      - say:
          channel: record
          text: "용서는 평화를 만들었고 동시에 법의 경계를 흐렸습니다."
      - ending: merciful_queen

  ending_iron_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "비담의 목이 떨어진 뒤 회의는 놀랄 만큼 짧아졌습니다. 왕명이 끝나기 전에 모두가 고개를 숙였습니다."
      - say:
          char: 덕만
          text: "조용하구나. 반란이 끝난 소리와 내가 틀려도 말하지 못하는 침묵을 이제 구분할 수가 없어."
      - say:
          channel: record
          text: "강한 왕은 모든 반대를 이겼습니다. 그 뒤에는 반대와 경고를 구분할 사람도 남지 않았습니다."
      - ending: iron_queen

  ending_borrowed_crown:
    actions:
      - bg: council_hall
      - camera: wide
      - say:
          channel: narration
          text: "귀족 회의의 붓은 군량 장부를 넘어 군사 이동과 창고 문서까지 따라왔습니다. 덕만은 명령을 내릴 때마다 즉위 날 받은 세 표를 다시 갚았습니다."
      - say:
          char: 덕만.queen_sad
          text: "조건을 밝히고 왕이 됐지만 다시 따질 문은 만들지 못했어. 이 왕관은 아직 세 표에게 빌린 거야."
      - say:
          channel: record
          text: "평화는 유지됐고 여왕의 통치는 매번 담보를 요구받았습니다."
      - ending: borrowed_crown

  ending_empty_observatory:
    actions:
      - bg: title_palace
      - camera: wide
      - say:
          channel: narration
          text: "첨성대 문은 열려 있었지만 관측표 상자는 비담의 암호 없이는 열리지 않았습니다. 탑 아래 아이들은 별 대신 전령을 기다렸습니다."
      - say:
          char: 덕만.queen_sad
          text: "돌은 누구나 보게 세우고, 올라갈 계단은 한 사람의 암호 뒤에 숨겼구나."
      - say:
          channel: record
          text: "지식을 위해 세운 탑은 지식을 가두는 가장 높은 벽이 되었습니다."
      - ending: empty_observatory

  ending_bidams_regent:
    actions:
      - bg: throne_hall
      - camera: medium
      - char: { id: 비담, position: right, emotion: smirk }
      - say:
          channel: narration
          text: "돌아온 비담은 사흘 만에 끊긴 전령망을 이었습니다. 넷째 날부터 관리들은 왕의 도장보다 비담의 고갯짓을 먼저 기다렸습니다."
      - say:
          char: 비담.smirk
          camera: close
          with: [덕만]
          text: "폐하께서 저를 감시하시는 동안 나라는 아주 잘 움직이고 있습니다."
      - say:
          channel: record
          text: "가장 유능한 신하는 왕 곁에 남았고, 마침내 왕보다 먼저 명령을 내리는 사람이 되었습니다."
      - ending: bidams_regent

  ending_sisters_shadow:
    actions:
      - bg: locked_room
      - camera: medium
      - char: { id: 천명, position: right, emotion: sad }
      - say:
          channel: narration
          text: "밤마다 비밀문이 열리고 천명이 덕만의 칙령을 먼저 읽었습니다. 어느 순간 덕만은 회의장의 반대보다 어둠 속 언니의 침묵을 더 두려워했습니다."
      - say:
          char: 천명.sad
          text: "나를 살린 방이 네 통치까지 가두고 있어. 이제 내게 묻지 않고 결정해야 해."
      - say:
          channel: record
          text: "두 공주는 함께 남았고, 한 사람의 멈춘 시간이 나라의 미래 위에 긴 그림자를 만들었습니다."
      - ending: sisters_shadow

  ending_recordless_peace:
    actions:
      - bg: moon_court
      - camera: wide
      - effect: embers
      - say:
          channel: narration
          text: "사망 기록과 반란 서신은 한 줌 재가 됐습니다. 한동안 아무도 과거 종이를 들고 새 싸움을 시작하지 못했습니다."
      - say:
          char: 덕만.queen_sad
          text: "이 평화가 오래가면 좋겠구나. 다음 거짓을 알아볼 눈까지 태운 게 아니길 바란다."
      - say:
          channel: record
          text: "싸움의 증거가 사라지자 싸움은 잦아들었습니다. 같은 위조가 어떻게 시작됐는지도 함께 사라졌습니다."
      - ending: recordless_peace

  ending_fallen_star:
    actions:
      - bg: frontier
      - camera: wide
      - say:
          channel: narration
          text: "반란은 끝났지만 왕실 전령이 오는 날이면 마을 문이 먼저 닫혔습니다. 성문 안에는 왕관이, 밖에는 왕명을 기다리지 않는 장터가 남았습니다."
      - say:
          char: 덕만.queen_sad
          text: "별이 떨어진 것이 아니다. 내가 별을 바라보는 사람들의 땅을 잃었다."
      - say:
          channel: record
          text: "여왕은 왕좌를 지켰고 신라는 서로 다른 명령을 내리는 두 나라가 되었습니다."
      - ending: fallen_star

  ending_nameless_queen:
    actions:
      - bg: throne_hall
      - camera: wide
      - say:
          channel: narration
          text: "사서에는 선덕왕의 이름이 오래 남았습니다. 그러나 그 이름을 처음 죽인 종이와 왕좌까지 빌려 쓴 거짓은 봉인 상자 안에서 함께 늙었습니다."
      - say:
          char: 덕만.queen_sad
          text: "왕의 이름은 되찾았는데, 어린 덕만을 지운 손과 내가 쓴 거짓은 끝내 꺼내지 못했구나."
      - say:
          channel: record
          text: "왕은 남았습니다. 그 왕이 무엇과 싸웠는지는 이름 없는 공백이 되었습니다."
      - ending: nameless_queen
