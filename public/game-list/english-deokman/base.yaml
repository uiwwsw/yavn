inventory:
  peony_painting:
    name: Scentless peony painting
    description: Flowers without bees or butterflies. A death record was hidden behind the roller.
    image: root:/game-list/deokman/assets/items/peony-painting.svg
    category: Royal object
    order: 10
  death_register:
    name: Forged death record
    description: It records Deokman's death tonight while she is still alive. The red seal is missing its bottom-right corner.
    image: root:/game-list/deokman/assets/items/death-register.svg
    category: Forbidden record
    order: 20
  peony_token:
    name: Bronze peony token
    description: A worn royal pass with green patina, an open cord loop and a peony design. It can open the north gate, but using it reveals her identity.
    image: root:/game-list/deokman/assets/items/peony-token.svg
    category: Identity token
    order: 30
