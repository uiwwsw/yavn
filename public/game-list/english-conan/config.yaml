textSpeed: 32
autoSave: true
clickToInstant: true
ui:
  template: cinematic-noir
startScreen:
  enabled: true
  image: root:/game-list/conan/assets/bg/title_storm-v2.avif
  music: root:/game-list/conan/assets/music/intro.mp3
  showTitle: true
  startButtonText: Start English chapter
  buttonPosition: bottom-center
  eyebrow: ENGLISH OPENING CHAPTER
  subtitle: There is a space beside her in every photograph.
  scene:
    layout: split
    motion: push
    duration: 32000
    parallax: 10
    particles: rain
    intensity: 0.85
    fog: true
    light: lightning
    accent: "#a4c6e8"
    transition:
      type: iris
      duration: 1100
endingScreen:
  image: root:/game-list/conan/assets/bg/mountain_rain-v2.avif
endings:
  prologue_end:
    title: Tonight, all three of us
