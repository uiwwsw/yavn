script:
  - scene: ren_live2d_drag_test

scenes:
  ren_live2d_drag_test:
    actions:
      - char:
          id: 렌
          position: center
          emotion: exp_01
      - choice:
          key: live2d_drag_test
          camera: medium
          prompt: "오늘은 렌과 뭘 해 볼까?"
          char: 렌.exp_01
          options:
            - text: "표정을 본다"
              saveText: "표정으로 인사해 줘"
              goto: expressions
            - text: "렌의 시선을 움직인다"
              saveText: "내 손끝을 따라와 봐"
              goto: follow_pointer
            - text: "가까이서 본다"
              saveText: "조금 더 가까이 볼게"
              goto: close_conversation
            - text: "대화를 끝낸다"
              saveText: "오늘은 여기까지"
              goto: farewell

  expressions:
    actions:
      - say:
          char: 렌.exp_02
          camera: medium
          text: "그럼 웃는 얼굴로 인사할게. 어서 와."
      - choice:
          key: live2d_expression
          char: 렌.exp_02
          prompt: "다른 표정도 볼까?"
          options:
            - text: "다른 표정을 본다"
              saveText: "응, 하나 더"
              goto: another_expression
            - text: "처음으로 돌아간다"
              saveText: "처음처럼 편하게 있어"
              goto: ren_live2d_drag_test

  another_expression:
    actions:
      - say:
          char: 렌.exp_03
          text: "이번엔 눈을 감고. 어서 와."
      - say:
          char: 렌.exp_05
          text: "이 얼굴로 인사하면 화난 줄 알겠다."
      - goto: ren_live2d_drag_test

  follow_pointer:
    actions:
      - choice:
          key: live2d_follow
          char: 렌.exp_01
          camera: medium
          prompt: "렌의 얼굴을 누른 채 천천히 움직여 보자."
          options:
            - text: "처음으로 돌아간다"
              saveText: "잘 따라오네. 다시 이야기하자"
              goto: ren_live2d_drag_test

  close_conversation:
    actions:
      - say:
          char: 렌.exp_02
          camera: { shot: close, target: 렌, transition: push, duration: 680 }
          text: "이 정도 거리라면 눈웃음도 잘 보이지?"
      - choice:
          key: live2d_distance
          char: 렌.exp_02
          prompt: "조금 물러날까, 아니면 오늘은 여기까지 할까?"
          options:
            - text: "처음으로 돌아간다"
              saveText: "조금 떨어져서 다시 이야기하자"
              goto: ren_live2d_drag_test
            - text: "대화를 끝낸다"
              saveText: "다음에 또 만나"
              goto: farewell

  farewell:
    actions:
      - say:
          char: 렌.exp_01
          camera: medium
          text: "오늘은 여기까지. 다음에 오면 먼저 알아볼 수 있게, 또 인사해 줘."
      - ending: until_next_time
