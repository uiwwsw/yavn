title: "명탐정 코난 DEMO: 60초의 경고"
author:
  name: "uiwwsw"
  contacts:
    - "Email: creator@yavn.dev"
    - label: "Homepage"
      value: "yavn.vercel.app"
      href: "https://yavn.vercel.app"
version: "1.0"
seo:
  description: "폭우 속 산악 철도에서 60초 안에 정지 열차와 폭발 신호의 모순을 풀어내는 자동 진행형 코난 엔진 쇼케이스."
  keywords:
    - "명탐정 코난"
    - "게임 예고편"
    - "비주얼노벨 엔진"
    - "60초 데모"
  image: "assets/bg/rail-warning-social.jpg"
  imageAlt: "폭우 속 적색 경보가 켜진 산악 철도 터널"
textSpeed: 56
autoSave: false
clickToInstant: true
ui:
  template: neon-grid
startScreen:
  enabled: true
  image: "assets/bg/rail-warning.avif"
  music: "root:/game-list/conan/assets/music/tension.wav"
  showTitle: true
  startButtonText: "60초 시작"
  buttonPosition: "bottom-center"
endingScreen:
  image: "assets/bg/rail-warning.avif"
endings:
  demo_clear:
    title: "MISSION CLEAR"
    message: "폭발 0.3초 전, 열차는 멈췄다. 하지만 60초의 경고는 진짜 사건의 시작에 불과했다."
defaultEnding: demo_clear
