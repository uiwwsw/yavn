chapterTitle: "공포의 전환"

script:
  - scene: switch
  - scene: clinic_door

scenes:
  switch:
    actions:
      - say:
          channel: card
          with: []
          text: "4막 · 공포의 전환"
      - bg: { id: office_night, transition: fade, duration: 800 }
      - music: static
      - say:
          channel: thought
          with: []
          camera: wide
          text: "소문이 날까 봐 무서웠다. 이제는 다른 게 무섭다."
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "HIV 잠복기"
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "HIV 초기 증상 목 림프절"
      - say:
          channel: message
          side: me
          with: []
          erase: true
          text: "HIV 검사 언제 해야 정확"
      - say:
          channel: message
          side: them
          with: []
          text: "질병관리청: 노출이 걱정되면 보건소에서 익명·무료로 검사받을 수 있습니다. 치료하면 일상생활이 가능합니다."
      - say:
          channel: thought
          with: []
          text: "답은 이미 화면에 있다. 문제는 답이 아니라, 문 앞에 서는 일이다."

  clinic_door:
    actions:
      - bg: { id: clinic_hall, transition: fade, duration: 900 }
      - music: cold_room
      - char: { id: 도윤, position: center }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "보건소 복도. 번호표 기계 앞. 아는 사람이 지나갈까 봐 모자를 깊게 눌러쓴다."
      - choice:
          key: f3_clinic
          prompt: "번호표 버튼까지 한 걸음."
          char: 도윤
          options:
            - text: "번호표를 뽑는다"
              set: { went_to_clinic: true }
              goto: f3_ticket
            - text: "돌아선다. 들키는 게 더 무섭다"
              goto: f3_turn

  f3_ticket:
    actions:
      - sticker:
          id: f3_ticket
          image: ticket_sticker
          x: 50
          y: 32
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - get: test_ticket
      - say:
          channel: narration
          with: []
          text: "대기 번호 47. 손바닥이 젖어서 종이가 눅눅해진다. 그래도 놓지 않는다."
      - clearSticker: { id: f3_ticket, leave: fadeOut }
      - goto: f3_harin

  f3_turn:
    actions:
      - say:
          channel: action
          with: []
          text: "도윤은 버튼 앞에서 돌아선다. 자동문이 열렸다 닫힌다. 아무 일도 없었다."
      - say:
          channel: thought
          with: []
          text: "검사를 안 받으면, 결과도 없다. 결과가 없으면… 아직 아닌 거다."
      - goto: f3_harin

  f3_harin:
    actions:
      - say:
          channel: card
          with: []
          text: "과거\n유하린 · 18"
      - bg: { id: science_room, transition: fade, duration: 900 }
      - char: { id: 하린, position: center, emotion: blank }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "과학실. 하린은 나비의 날개를 펴고 핀을 꽂는다. 하나, 둘. 날개가 움직이지 않는다."
      - sticker:
          id: f3_butterfly
          image: butterfly_sticker
          x: 50
          y: 30
          width: "clamp(150px, 20%, 260px)"
          enter: fadeIn
          inputLockMs: 400
      - get: butterfly
      - char: { id: 아진, position: right }
      - say:
          char: 아진.awkward
          with: [하린]
          text: "하린아… 왜 이렇게까지 해?"
      - say:
          char: 하린.blank
          with: [아진]
          text: "가만히 있으니까."
      - clearSticker: { id: f3_butterfly, leave: fadeOut }
      - say:
          channel: thought
          with: []
          text: "가만히 있는 것만 고정할 수 있다. 움직이는 마음은 핀이 안 들어간다."
      - bg: { id: clinic_hall, transition: fade, duration: 900 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "몇 달 뒤. 하얀 상담실 앞. 하린은 서류 맨 아래 서명란을 본다."
      - say:
          char: 의사
          with: []
          text: "확신하세요? 한번 지우면 돌아올 수 없어요."
      - say:
          char: 하린.cry
          with: []
          text: "네."
      - goto: /4.yaml
