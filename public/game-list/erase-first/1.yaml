chapterTitle: "협박"

script:
  - scene: arrival
  - scene: alone

scenes:
  arrival:
    actions:
      - say:
          channel: card
          with: []
          text: "2막 · 협박"
      - bg: { id: office, transition: fade, duration: 800 }
      - music: neon
      - say:
          channel: narration
          with: []
          camera: wide
          text: "한 주 뒤. 새 팀장 소개. 앞에 선 사람은 박준성이다."
      - char: { id: 준성, position: right }
      - say:
          char: 준성
          with: []
          text: "박준성입니다. 잘 부탁드려요. 다들 처음 뵙겠습니다."
      - say:
          channel: thought
          with: [준성]
          text: "다들. 처음. 그 말에 도윤만 빠져 있지 않다. 그래서 더 무섭다."

  alone:
    actions:
      - bg: { id: office_night, transition: fade, duration: 800 }
      - music: static
      - say:
          channel: narration
          with: []
          camera: wide
          text: "야근. 사무실에 둘만 남았다. 형광등 한 줄이 꺼져 있다."
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - say:
          char: 도윤
          with: [준성]
          text: "우리 있었던 일… 없던 걸로 하죠. 괜히 말 나오면 서로 좋을 거 없잖아요."
      - say:
          char: 준성
          with: [도윤]
          text: "난 말할 생각 없어요."
      - say:
          char: 준성.smirk
          with: [도윤]
          text: "근데 도윤 씨는 왜 그렇게 무서워해요? 내가 아니라, 자기가 한 걸."
      - say:
          channel: thought
          with: [준성]
          text: "말할 생각이 없다. 그 애매함이 칼날처럼 남는다. 확실한 게 하나도 없다."
      - goto: f1_dig

  f1_dig:
    actions:
      - choice:
          key: f1_dig
          prompt: "그날 밤, 도윤은 노트북을 연다."
          with: []
          options:
            - text: "준성의 SNS를 처음부터 끝까지 뒤진다"
              when: { var: dug_sns, op: eq, value: false }
              add: { cruelty: 1 }
              set: { dug_sns: true }
              goto: f1_sns
            - text: "병원 예약 문자가 보였던 걸 떠올리며 추측한다"
              when: { var: dug_hospital, op: eq, value: false }
              add: { cruelty: 1 }
              set: { dug_hospital: true }
              goto: f1_hospital
            - text: "단톡방에 은근히 흘린다"
              when: { var: leaked, op: eq, value: false }
              add: { cruelty: 2 }
              set: { leaked: true }
              goto: f1_leak
            - text: "노트북을 덮는다"
              goto: f1_threat

  f1_sns:
    actions:
      - say:
          channel: message
          side: them
          char: 준성
          with: []
          text: "3년 전 게시물: 오늘도 약 잘 챙겨 먹은 나, 칭찬해 🙂"
      - say:
          channel: thought
          with: []
          text: "약. 무슨 약. 물어볼 수 없는 질문이 머릿속에서 혼자 커진다."
      - goto: f1_dig

  f1_hospital:
    actions:
      - say:
          channel: action
          with: []
          text: "회의 때 팀장 휴대폰에 떴던 알림. '감염내과 정기 진료'. 도윤은 그 단어를 메모장에 적는다."
      - say:
          channel: thought
          with: []
          text: "남의 진료 기록을 추측하는 건 선을 넘는 일이다. 알면서도 손이 멈추지 않는다."
      - goto: f1_dig

  f1_leak:
    actions:
      - say:
          channel: message
          side: me
          char: 도윤
          with: []
          text: "[단톡] 근데 팀장님 전 회사에서 왜 나왔는지 아는 사람? 좀 이상한 얘기 들었는데"
      - say:
          channel: message
          side: them
          with: []
          text: "[단톡] 헐 뭔데뭔데"
      - say:
          channel: action
          with: []
          erase: true
          text: "메시지 삭제. '모두에게서 삭제'를 누른다. 하지만 이미 읽은 사람이 넷이다."
      - goto: f1_dig

  f1_threat:
    actions:
      - bg: { id: office_night, transition: fade, duration: 600 }
      - say:
          channel: narration
          with: []
          camera: wide
          text: "다음 날 밤. 엘리베이터 앞. 둘뿐이다."
      - char: { id: 도윤, position: left }
      - char: { id: 준성, position: right }
      - choice:
          key: f1_threat
          prompt: "엘리베이터 문이 열리기 전에."
          char: 도윤
          options:
            - text: "\"형도 조심하세요. 세상 좁아요.\""
              add: { cruelty: 2 }
              goto: f1_said
            - text: "아무 말 없이 문이 열리길 기다린다"
              goto: f1_silent

  f1_said:
    actions:
      - say:
          char: 도윤
          with: [준성]
          text: "형도 조심하세요. 세상 좁아요."
      - say:
          char: 준성.tired
          with: [도윤]
          text: "…그 말, 경고예요? 협박이에요?"
      - say:
          channel: thought
          with: [준성]
          text: "경고가 아니었다. 협박이었다. 도윤은 먼저 선을 넘었다."
      - goto: /2.yaml

  f1_silent:
    actions:
      - say:
          channel: action
          with: [준성]
          text: "문이 열린다. 준성이 먼저 탄다. '닫힘' 버튼 위의 손가락이 잠깐 멈췄다가, 도윤을 기다린다."
      - say:
          channel: thought
          with: [준성]
          text: "기다려 주는 사람에게, 이미 너무 많은 걸 했다."
      - goto: /2.yaml
