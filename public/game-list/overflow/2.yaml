chapterTitle: "앞자리가 없는 사람들"

script:
  - scene: sera_comes
  - scene: meeting

scenes:
  sera_comes:
    title: "이름이 비어 있는 칸"
    actions:
      - bg: office
      - place: "3월 22일 오전 · 상계동 이의신청 사무소"
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 세라, with: [지완], text: "여기 예약할 때 소장 이름 안 뜨더라. 떴으면… 아니, 떴어도 왔겠다. 이 동네에 하는 데가 너밖에 없대." }
      - say: { char: 지완, with: [세라], text: "무슨 서류야?" }
      - say: { channel: record, with: [], text: "윤세라 · 산전 심사\n애착 29. 기준 미달. 출산 뒤 모자 동실 제한 권고." }
      - say: { char: 세라, with: [지완], text: "아기 이름 아직 못 정했어. 그 칸은 비어 있는데, 나랑 같은 방 못 쓴다는 칸은 벌써 채워 놨더라." }
      - say: { char: 지완, with: [세라], text: "재측정 신청부터 넣자. 점수 올라가면 병원에 다시 낼 수 있어." }
      - say: { char: 세라, with: [지완], text: "우리가 헤어질 때도 너 그랬어. 사랑이 1이면 내가 널 잘못 안 거래. 난 너한테 어떻게 지내고 싶냐고 물었는데." }
      - say: { char: 지완, with: [세라], text: "그날 네가 다시 재 보자고 했지. 내가 싫다고 했고." }
      - say: { char: 세라, with: [지완], text: "그래. 점수가 틀렸으면 좋겠는데, 오늘은 그게 맞아도 애를 안아 보고 싶어. 그건 어디다 써?" }
      - say: { char: 지완, with: [세라], text: "사유란. 네 말 그대로 적자." }

  meeting:
    title: "두 칸"
    actions:
      - bg: hansin_room
      - place: "3월 22일 오후 · 가산동 한신뉴로 본사"
      - music: standard
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "일곱 번은 창구에서 걸렀습니다. 이번 건 제가 받았고요. 또 1이 나오는지 여기서 한 번만 봅시다. 측정에 동의하십니까?" }
      - say: { char: 지완, with: [수경], text: "네. 이번에는 둘 다 보고 싶습니다. 기계가 읽은 것하고, 제게 준 것." }
      - sound: read
      - effect: glitch
      - say: { channel: record, with: [], text: "동일 판독 · 문지완 · 연민\n센서 원본 101 → 판독표 01" }
      - say: { char: 지완, with: [수경], text: "어느 쪽이 제 연민입니까?" }
      - say: { char: 수경, with: [지완], text: "101은 센서가 잡은 신호의 크기입니다. 연민은 그 옆에 저희가 붙인 이름이고요." }
      - say: { char: 수경, with: [지완], text: "배포할 때 표에 숫자 두 칸만 줬어요. 99까진 그대로 나갑니다. 100부터는 앞자리를 버리죠. 이걸 내부에선 오버플로라고 합니다." }
      - say: { char: 지완, with: [수경], text: "그럼 화면에 0이 뜨면, 진짜 0인지 100이 잘린 건지 모르는 거네요." }
      - say: { char: 수경, with: [지완], text: "네. 5년 전에 고치자고 올렸습니다. 법원하고 병원까지 같은 표를 쓰기 시작한 뒤였어요. 보류됐고, 저도 더 안 올렸습니다." }
      - say: { char: 지완, with: [수경], text: "제 판독은 7년 치입니다. 몇 번이나 잘못됐는지 봐야겠습니다." }
      - say: { char: 수경, with: [지완], text: "그 전에 회사 제안부터 보셔야 합니다." }
      - say: { channel: record, with: [], text: "개별 구제 합의서 · 문지완의 판정 및 사무소 의뢰 건 12건을 별도 심사한다. 내부 자료는 반납하며 외부에 알리지 않는다." }
      - choice:
          key: o2_deal
          prompt: "회사 제안에 어떻게 답할까?"
          char: 지완
          with: [수경]
          options:
            - text: "지금 답하지 않겠다고 한다"
              goto: refuse_deal
            - text: "배동식 씨 판독도 잘렸는지 묻는다"
              goto: ask_dongsik
            - text: "서명한다"
              gameOver:
                title: "서류 한 장"
                message: "사무소 의뢰 열두 건은 별도 심사에 들어갔다. 지완은 판독 자료를 반납했다. 동식이 들으라고 준 녹음기는 재생하지 않은 채 돌려보냈다."
                recoverToChoice: o2_deal

  refuse_deal:
    actions:
      - say: { char: 지완, with: [수경], text: "이분들하고 의논도 안 했습니다. 지금은 답 못 드립니다." }
      - goto: deal_end

  ask_dongsik:
    actions:
      - say: { char: 지완, with: [수경], text: "노원 사건, 배동식 씨 죄책감이 0이었습니다. 그것도 잘렸습니까?" }
      - say: { char: 수경, with: [지완], text: "저한테 물으시면 회사에서 모른다고 답합니다. 본인에게 원본 제공 동의를 받아 오세요." }
      - goto: deal_end

  deal_end:
    actions:
      - say: { char: 수경, with: [지완], text: "문 소장님, 아까 결과는 본인 자료니까 가져가셔도 됩니다. 다른 사람 것은 서면 동의가 있어야 드릴 수 있고요." }
      - say: { channel: action, with: [], text: "지완은 자기 판독표만 접어 넣는다. 가방 안에서 녹음기 모서리가 손등에 걸린다." }
      - goto: /3.yaml
