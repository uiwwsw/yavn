chapterTitle: "세 번 두드리면"

script:
  - scene: consent

scenes:
  consent:
    title: "연결"
    actions:
      - bg: hospital_stairs
      - place: "월계병원 동쪽 계단"
      - music: street
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: true }, text: "아까 접어 두신 이름, 여기에도 안 들어가요. 저장은 이쪽에 해 둘게요. 종이든 파일이든 전부 드리고요." }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: false }, text: "아까 기록 안 보여주신 거 잘하셨어요. 여기선 렌즈 연결 허용만 누르시면 돼요. 저장한 건 전부 드릴게요." }
      - say: { char: 지완, with: [수경], text: "제 것만 보세요. 병실 가서 아버지 쪽은 재지 말고요." }
      - say: { char: 수경, with: [지완], text: "네. 카메라도 꺼 둘게요. 면회 끝나고 내려오시면 따라가겠습니다." }
      - say: { channel: record, with: [], continueLabel: "내 렌즈 연결 허용", text: "에모스 · 근거리 진단 연결\n대상: 문지완의 렌즈\n기록: 센서 입력과 표시값 · 영상 및 음성 끔" }
      - goto: visit

  visit:
    title: "병실"
    actions:
      - bg: ward_bed
      - place: "20시 10분 · 신경과 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right, emotion: far }
      - say: { channel: action, with: [], text: "아버지는 양말을 한 짝만 신고 있다. 지완이 이불 아래를 더듬자 아버지가 침대 밑을 가리킨다." }
      - say: { char: 지완, with: [동식], text: "그냥 벗어 놔요. 따뜻한 거 가져올게요." }
      - say: { char: 동식, with: [지완], text: "…국." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: true }, text: "반만 얼리기로 했잖아요. 일요일에 제가 가면 그때 끓여요." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: false }, text: "아침에 전화 못 받았죠. 작은 통은 찾으셨어요?" }
      - say: { channel: action, with: [], sound: bed_rail, text: "아버지가 입술을 몇 번 달싹이다 만다. 검지로 침대 난간을 세 번 두드린다. 지완은 처음 두 번에 맞춰 세다가 마지막이 늦게 와서 다시 센다." }
      - say: { char: 동식, with: [지완], text: "…겁났냐." }
      - choice:
          key: o2_father
          prompt: "아버지가 지완의 얼굴을 본다."
          with: [동식]
          options:
            - text: "겁났다고 말한다"
              goto: tell_father
            - text: "물부터 건넨다"
              goto: bring_water

  tell_father:
    actions:
      - set: { told_father: true }
      - say: { char: 지완.break, with: [동식], text: "네. 아까 저한테 전화한 게 아버지가 아니어서요." }
      - say: { channel: action, with: [], text: "아버지가 손을 뻗는다. 침대 옆 의자를 손끝으로 가리킨다." }
      - say: { char: 동식, with: [지완], text: "앉아." }
      - goto: measure

  bring_water:
    actions:
      - say: { channel: action, with: [], text: "지완이 빨대를 꺼내 반대쪽을 구부린다. 아버지는 물을 한 모금 마시고 그제야 침대 난간에서 손을 뗀다." }
      - say: { char: 지완, with: [동식], text: "안 가요. 물만 놓고 여기 앉을게요." }
      - goto: measure

  measure:
    title: "앞자리"
    actions:
      - say: { channel: action, with: [], text: "간호사가 시간을 더 주겠다며 문 옆으로 물러난다. 지완의 렌즈가 짧게 진동한다." }
      - sound: read
      - say: { channel: record, with: [], text: "에모스 · 보호자 재확인\n정서 반응 01 · 무반응 의심" }
      - say: { channel: action, with: [], text: "지완은 경고창을 내린다. 아버지 발에 양말을 신기고, 뒤축을 두 번 잡아당긴다." }
      - bg: hospital_stairs
      - place: "면회 뒤 · 월계병원 동쪽 계단"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "같은 시각이에요. 왼쪽이 렌즈에서 온 거고 오른쪽이 화면에 나온 거예요." }
      - effect: glitch
      - get: raw_print
      - sticker: { id: diagnosis, image: raw_sticker, x: 50, y: 36, width: "clamp(140px, 23%, 270px)", enter: fadeIn }
      - say: { channel: record, with: [], text: "20:14:09 · 판독 카드와 진단 기록 일치\n센서 입력 101 → 표시 01\n카드 판정: 무반응 의심" }
      - clearSticker: { id: diagnosis, leave: fadeOut }
      - say: { char: 지완, with: [수경], text: "지금 저 숫자로 제가 무서워한 걸 증명할 수 있어요?" }
      - say: { char: 수경, with: [지완], text: "이건 앞에 1이 사라졌다는 것만 보여줘요. 병원에 겁났다고 쓰고 싶으면 그건 직접 쓰셔야 돼요." }
      - say: { channel: action, with: [], text: "수경이 파일을 보내고 휴대폰을 뒤집는다. 떨리는 건 기계가 아니라, 그 아래에 깔린 수경의 손이다." }
      - goto: /3.yaml
