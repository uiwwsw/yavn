chapterTitle: "세 번 두드리면"

script:
  - scene: consent

scenes:
  consent:
    title: "연결"
    actions:
      - bg: hospital_stairs
      - place: "면회 직전 · 월계병원 동쪽 계단"
      - music: street
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: true }, text: "아까 접수표에서 가리신 이름은 여기에도 안 넣을게요. 검사 기록은 저장해서 지완 씨께 드릴게요." }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: false }, text: "아까 접수표 안 보여 주셔도 괜찮아요. 여기서는 렌즈 연결만 허용해 주세요. 기록은 전부 드릴게요." }
      - say: { char: 지완, with: [수경], text: "제 렌즈만 봐 주세요. 아버지는 검사하지 말고요." }
      - say: { char: 수경, with: [지완], text: "네. 카메라는 꺼 둘게요. 면회 끝나면 여기 계단으로 오세요." }
      - say: { channel: record, with: [], continueLabel: "내 렌즈 연결 허용", text: "에모스 · 근거리 진단 연결\n대상: 문지완의 렌즈\n기록: 센서 입력과 표시값 · 영상 및 음성 끔" }
      - goto: visit

  visit:
    title: "병실"
    actions:
      - bg: ward_bed
      - place: "20시 10분 · 신경과 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right, emotion: far }
      - say: { channel: action, with: [지완, 동식], camera: wide, text: "교대 간호사가 문을 열어 준다. 지완이 문턱에 서자 아버지는 양말이 벗겨진 발을 내놓고 침대 밑을 가리킨다." }
      - say: { char: 지완, with: [동식], text: "거기 떨어졌어요? 제가 주울게요. 누워 있어요." }
      - say: { char: 동식, with: [지완], text: "…국." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: true }, text: "반만 얼리기로 했잖아요. 일요일에 제가 가면 그때 끓여요." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: false }, text: "아침에 전화 못 받았죠. 작은 통은 찾으셨어요?" }
      - say: { channel: action, with: [], sound: bed_rail, text: "아버지가 난간을 두 번 두드린다. 지완이 쳐다본 뒤에 세 번째 소리가 난다." }
      - say: { char: 동식, with: [지완], text: "…겁났냐." }
      - choice:
          key: o2_father
          prompt: "지완이 대답하려다 침대 옆 물컵을 본다."
          with: [동식]
          options:
            - text: "겁났다고 말한다"
              goto: tell_father
            - text: "물부터 건넨다"
              goto: bring_water

  tell_father:
    actions:
      - set: { told_father: true }
      - say: { char: 지완.break, with: [동식], text: "네. 전화 받았는데 반찬집 아주머니였잖아요." }
      - say: { channel: action, with: [], text: "아버지가 손을 뻗는다. 침대 옆 의자를 손끝으로 가리킨다." }
      - say: { char: 동식, with: [지완], text: "앉아." }
      - goto: measure

  bring_water:
    actions:
      - say: { channel: action, with: [], text: "지완이 물컵에 빨대를 꽂고 끝을 아버지 입 쪽으로 굽힌다. 아버지는 한 모금 마시고 난간에서 손을 뗀다." }
      - say: { char: 지완, with: [동식], text: "안 가요. 물만 놓고 여기 앉을게요." }
      - goto: measure

  measure:
    title: "앞자리"
    actions:
      - say: { channel: action, with: [], text: "간호사가 시간을 더 주겠다며 문 옆으로 물러난다. 지완의 렌즈가 짧게 진동한다." }
      - sound: read
      - say: { channel: record, with: [], continueLabel: "경고창을 닫는다", text: "에모스 · 보호자 재확인\n정서 반응 01 · 무반응 의심" }
      - say: { channel: action, with: [], continueLabel: "양말을 주워 신긴다", text: "침대 바퀴 앞에 양말이 떨어져 있다. 아버지가 뒤꿈치를 살짝 든다." }
      - bg: ward_sock
      - say: { channel: action, with: [], text: "몸을 숙여 양말을 줍는다. 뒤꿈치가 다 덮이도록 신기고 나자 아버지가 발을 거둔다. 문가의 간호사가 시계를 가리킨다." }
      - bg: hospital_stairs
      - place: "면회 뒤 · 월계병원 동쪽 계단"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "병실에서 렌즈가 울렸을 때 찍힌 숫자예요. 왼쪽은 렌즈 값, 오른쪽은 접수대에 뜬 숫자예요." }
      - effect: glitch
      - get: raw_print
      - sticker: { id: diagnosis, image: raw_sticker, x: 50, y: 36, width: "clamp(140px, 23%, 270px)", enter: fadeIn }
      - say: { channel: record, with: [], text: "20:14:09 · 판독 카드와 진단 기록 일치\n센서 입력 101 → 표시 01\n카드 판정: 무반응 의심" }
      - clearSticker: { id: diagnosis, leave: fadeOut }
      - say: { char: 지완, with: [수경], text: "그럼 이걸로 제가 겁났던 것도 설명돼요?" }
      - say: { char: 수경, with: [지완], text: "숫자에서 앞자리 하나가 빠졌다는 것만 확인돼요. 겁이 났다는 건 지완 씨가 직접 써 주세요." }
      - say: { channel: action, with: [], text: "수경이 파일을 보낸다. 휴대폰을 주머니에 넣고 나서도 손끝이 한동안 떨린다." }
      - goto: /3.yaml
