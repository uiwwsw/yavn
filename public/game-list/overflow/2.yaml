chapterTitle: "96.7"

script:
  - scene: sera_comes
  - scene: sera_case
  - scene: lobby
  - scene: meeting
  - scene: scale
  - scene: offer
  - scene: night

scenes:
  sera_comes:
    title: "의뢰인"
    actions:
      - bg: { id: office, transition: fade, duration: 600 }
      - place: "2033년 3월 22일 수요일 오전 10시 · 사무소"
      - music: quant
      - char: { id: 도겸, position: right }
      - char: { id: 지완, position: left }
      - say:
          char: 도겸
          with: [지완]
          text: "소장님, 10시 예약 오셨는데요. 윤세라 님."
      - say:
          char: 지완
          with: [도겸]
          text: "…"
      - say:
          char: 도겸
          with: [지완]
          text: "소장님?"
      - say:
          char: 지완
          with: [도겸]
          text: "들어오시라고 해."
      - say:
          char: 도겸
          motion: headtilt
          with: [지완]
          text: "네."
      - move: { id: 도겸, style: exit, wait: true }
      - char: { id: 세라, position: right }
      - say:
          char: 세라
          with: [지완]
          text: "안녕하세요."
      - say:
          char: 지완
          with: [세라]
          text: "…앉아."
      - say:
          char: 세라
          motion: headtilt
          with: [지완]
          text: "어, 반말."
      - say:
          char: 지완
          with: [세라]
          text: "앉으세요."
      - say:
          char: 세라.joke
          with: [지완]
          text: "아니 그것도 이상해. 그냥 하던 대로 해."
      - say:
          char: 지완
          with: [세라]
          text: "앉아."
      - say:
          char: 세라
          with: [지완]
          text: "여기 2층인 거 몰랐어. 3층인 줄 알고 올라갔다가 내려왔잖아."
      - say:
          char: 지완
          with: [세라]
          text: "작년에 옮겼어."
      - say:
          char: 세라
          with: [지완]
          text: "3층은 지금 뭐 해?"
      - say:
          char: 지완
          with: [세라]
          text: "필라테스."
      - say:
          char: 세라.joke
          with: [지완]
          text: "아 그래서 천장이 쿵쿵거리는구나. 여기서 일 되냐."
      - say:
          char: 지완
          with: [세라]
          text: "돼."
      - say:
          char: 세라
          with: [지완]
          text: "…"
      - say:
          char: 지완
          with: [세라]
          text: "뭐."
      - say:
          char: 세라
          with: [지완]
          text: "아니, 너 말 더 짧아졌다."
      - say:
          char: 지완
          with: [세라]
          text: "그대로야."
      - say:
          char: 세라
          with: [지완]
          text: "아니야. 예전엔 '돼'까지는 아니었어."
      - say:
          char: 지완
          with: [세라]
          text: "그럼 뭐였는데."
      - say:
          char: 세라
          with: [지완]
          text: "'되긴 돼'."
      - say:
          char: 지완.tight
          with: [세라]
          text: "…그건 좀 길다."

  sera_case:
    actions:
      - say:
          char: 세라
          with: [지완]
          text: "나 일로 왔어. 진짜 일로."
      - say:
          char: 지완
          with: [세라]
          text: "알아. 10시 예약으로 들어왔잖아."
      - say:
          char: 세라
          with: [지완]
          text: "접수비 얼마야? 미리 줄게."
      - say:
          char: 지완
          with: [세라]
          text: "68,000원. 나중에."
      - say:
          char: 세라
          with: [지완]
          text: "지금 줄래. 나중에 주면 내가 또 와야 되잖아."
      - say:
          char: 지완
          with: [세라]
          text: "…그럼 지금 받을게."
      - say:
          char: 세라
          with: [지완]
          text: "나 20주야."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "뭐 축하한다고 안 해?"
      - say:
          char: 지완
          with: [세라]
          text: "축하해."
      - say:
          char: 세라.joke
          with: [지완]
          text: "진짜 성의 없다."
      - say:
          char: 지완
          with: [세라]
          text: "서류 보자."
      - sound: read
      - say:
          channel: record
          with: []
          text: "산전 양육적합 사전판독서 · 윤세라(2000년생) · 20주차 · 모성 애착 29 · 양육 지속성 34 · 권고 등급 C"
      - say:
          channel: record
          with: []
          text: "C등급 안내 · 출생 후 6개월·18개월 재판독 대상. 지자체 양육지원 신청 시 가점 없음."
      - say:
          char: 지완
          with: [세라]
          text: "29랑 34."
      - say:
          char: 세라
          with: [지완]
          text: "응. 평균이 60이래."
      - say:
          char: 지완
          with: [세라]
          text: "누가 그래."
      - say:
          char: 세라
          with: [지완]
          text: "병원에서. 시어머니가 그 자리에 계셨어."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "그날 집에 와서 남편한테 그러셨대. 쟤가 애를 어떻게 키우냐고."
      - say:
          char: 지완
          with: [세라]
          text: "남편은 뭐래."
      - say:
          char: 세라
          with: [지완]
          text: "엄마 그런 말 하지 말라고 했대."
      - say:
          char: 지완
          with: [세라]
          text: "너한테는."
      - say:
          char: 세라
          with: [지완]
          text: "나한테는 아무 말도 안 했어."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          motion: sigh
          with: [지완]
          text: "우리 궁합 96.7이야. 알지? 그거 보고 결혼했어."
      - say:
          char: 지완
          with: [세라]
          text: "알아."
      - say:
          char: 세라
          with: [지완]
          text: "96.7인 사람이 아무 말도 안 하는 건 어떻게 나오는 거야? 그건 몇 점이야?"
      - say:
          char: 지완
          with: [세라]
          text: "그건 안 재."
      - say:
          char: 세라
          with: [지완]
          text: "그럼 뭘 재는 건데."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "우리는 31.2였잖아."
      - say:
          char: 지완.break
          with: [세라]
          text: "31.2."
      - say:
          char: 세라
          with: [지완]
          text: "우리 엄마가 그거 프린트해서 냉장고에 붙여 놨었어. 기억나?"
      - say:
          char: 지완
          with: [세라]
          text: "응."
      - say:
          char: 세라
          with: [지완]
          text: "나는 그거 한 번도 안 믿었어."
      - say:
          char: 지완
          with: [세라]
          text: "…그럼 왜 헤어졌어."
      - say:
          char: 세라.drop
          with: [지완]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "아, 그거 됐고."
      - say:
          char: 세라
          with: [지완]
          text: "29랑 34 올려 줄 수 있어?"
      - choice:
          key: o2_sera
          prompt: "대답한다."
          char: 지완
          with: [세라]
          options:
            - text: "\"올려 주는 게 아니라 틀렸다고 쓰는 거야. 쓸게.\""
              goto: sera_yes
              set: { sera_case: true }
            - text: "\"다른 사무소 소개해 줄게. 내가 쓰면 네가 손해야.\""
              goto: sera_no
            - text: "\"그 서류 누가 요구했어? 병원이야, 시어머니야?\""
              goto: sera_who

  sera_yes:
    actions:
      - say:
          char: 세라
          with: [지완]
          text: "그게 돼?"
      - say:
          char: 지완
          with: [세라]
          text: "여덟 번 해 봤어. 전부 반려됐고."
      - say:
          char: 세라.joke
          with: [지완]
          text: "와. 영업 진짜 못한다."
      - say:
          char: 지완
          with: [세라]
          text: "사실대로 말한 거야."
      - say:
          char: 세라
          with: [지완]
          text: "…알아. 너 그거 하나는 변함없어."
      - goto: sera_out

  sera_no:
    actions:
      - say:
          char: 세라
          with: [지완]
          text: "왜 네가 쓰면 손해야."
      - say:
          char: 지완
          with: [세라]
          text: "대리인 란에 내 수치가 같이 올라가. 1이 여덟 개."
      - say:
          char: 세라
          motion: freeze
          with: [지완]
          text: "…그런 게 올라가?"
      - say:
          char: 지완
          with: [세라]
          text: "작년부터."
      - say:
          char: 세라
          with: [지완]
          text: "그럼 너한테 오는 사람들은 다 손해 보는 거잖아."
      - say:
          char: 지완
          with: [세라]
          text: "그 사람들은 다른 데서 안 받아 줘."
      - say:
          char: 세라
          with: [지완]
          text: "…나도 안 받아 줬어. 세 군데 갔다가 왔어."
      - say:
          char: 지완
          with: [세라]
          text: "…그럼 내가 쓸게."
      - set: { sera_case: true }
      - goto: sera_out

  sera_who:
    actions:
      - say:
          char: 세라
          with: [지완]
          text: "병원은 그냥 띄워 준 거야. 요구한 건 아니고."
      - say:
          char: 지완
          with: [세라]
          text: "그럼 왜 재판독을 받아야 돼."
      - say:
          char: 세라
          with: [지완]
          text: "안 받아도 돼."
      - say:
          char: 지완
          with: [세라]
          text: "그런데."
      - say:
          char: 세라
          with: [지완]
          text: "안 받으면 어머니가 매달 물어보셔."
      - say:
          char: 세라
          with: [지완]
          text: "'세라야, 이번 달엔 몇 나왔니.'"
      - say:
          char: 지완.tight
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "그 말 들으면 다음 달 수치가 더 떨어져. 진짜야."
      - say:
          char: 지완
          with: [세라]
          text: "알아. 그게 제일 흔한 패턴이야."
      - say:
          char: 세라
          with: [지완]
          text: "그럼 써 줘."
      - set: { sera_case: true }
      - goto: sera_out

  sera_out:
    actions:
      - say:
          char: 세라
          with: [지완]
          text: "나 갈게. 11시에 진료 있어."
      - say:
          char: 지완
          with: [세라]
          text: "서류 사본 문자로 보내."
      - say:
          char: 세라
          with: [지완]
          text: "응."
      - move: { id: 세라, toward: 지완, style: retreat }
      - say:
          char: 세라
          with: [지완]
          text: "지완아."
      - say:
          char: 지완
          with: [세라]
          text: "응."
      - say:
          char: 세라
          with: [지완]
          text: "너 밥은 먹고 다녀?"
      - say:
          char: 지완
          with: [세라]
          text: "먹어."
      - say:
          char: 세라
          with: [지완]
          text: "뭐 먹었어 오늘."
      - say:
          char: 지완
          with: [세라]
          text: "…아직."
      - say:
          char: 세라.joke
          with: [지완]
          text: "거봐."
      - move: { id: 세라, style: exit, wait: true }
      - goto: lobby

  lobby:
    title: "가산"
    actions:
      - bg: { id: hansin_lobby, transition: dissolve, duration: 800 }
      - place: "같은 날 오후 3시 · 한신뉴로 가산 사옥"
      - music: standard
      - say:
          channel: system
          with: []
          text: "방문증 발급 · 문지완 · 방문 사유: 민원 면담 · 체류 가능 시간 60분 · 동행 필요"
      - say:
          channel: system
          with: []
          text: "에모스 — 서로를 오해하지 않는 사회. 2026년부터 2033년까지, 오해로 인한 분쟁 조정 건수 71% 감소"
      - say:
          channel: system
          with: []
          text: "게이트 통과 판독 · 문지완 — 긴장 1 · 적대 1 · 협조 1 · 재확인 필요"
      - say:
          channel: system
          with: []
          text: "게이트 통과 판독 · 재시도 · 문지완 — 긴장 1 · 적대 1 · 협조 1 · 수동 통과 처리됨"
      - set: { met_sukyung: true }

  meeting:
    actions:
      - bg: { id: hansin_room, transition: fade, duration: 600 }
      - char: { id: 수경, position: right }
      - char: { id: 지완, position: left }
      - say:
          char: 수경
          with: [지완]
          text: "앉으세요. 물 드세요."
      - say:
          char: 지완
          with: [수경]
          text: "감사합니다."
      - say:
          char: 수경
          with: [지완]
          text: "두 잔 따랐는데 제 건 안 마셔요. 신경 쓰지 마시고요."
      - say:
          char: 지완
          with: [수경]
          text: "…네."
      - say:
          char: 수경
          with: [지완]
          text: "본론부터. 어제 장위동에서 하신 건 약관 위반입니다. 14조 3항."
      - say:
          char: 지완
          with: [수경]
          text: "본인 이력을 본인 앞에서 띄웠습니다."
      - say:
          char: 수경
          with: [지완]
          text: "선생님 단말에서요. 그게 14조 3항이고요."
      - say:
          char: 지완
          with: [수경]
          text: "고발하시게요."
      - say:
          char: 수경.edge
          with: [지완]
          text: "고발할 거면 변호사가 왔지 제가 왔겠습니까."
      - say:
          char: 지완
          with: [수경]
          text: "그럼 왜 오셨습니까."
      - say:
          char: 수경
          with: [지완]
          text: "선생님 신청서 여덟 장을 제가 다 읽어서요."
      - say:
          char: 지완
          with: [수경]
          text: "…"
      - say:
          char: 수경
          with: [지완]
          text: "'측정 범위 밖의 값이 범위 안으로 접혀 들어왔을 가능성.' 이 문장 선생님이 쓰셨죠."
      - say:
          char: 지완
          with: [수경]
          text: "네."
      - say:
          char: 수경
          with: [지완]
          text: "어디서 들으셨어요."
      - say:
          char: 지완
          with: [수경]
          text: "안 들었습니다. 제가 썼습니다."
      - say:
          char: 수경
          with: [지완]
          text: "그걸 혼자 생각해 내셨다고요."
      - say:
          char: 지완
          with: [수경]
          text: "7년을 1만 보면 그 생각밖에 안 남습니다."

  scale:
    actions:
      - move: { id: 수경, toward: 지완, style: approach }
      - say:
          char: 수경
          with: [지완]
          text: "선생님, 저희가 뭘 재는지 아십니까."
      - say:
          char: 지완
          with: [수경]
          text: "감정요."
      - say:
          char: 수경.edge
          with: [지완]
          text: "아니요. 변동입니다."
      - say:
          char: 지완
          with: [수경]
          text: "…"
      - say:
          char: 수경
          with: [지완]
          text: "예를 들죠. A는 평소 연민이 1이에요. 길에서 사람이 쓰러지면 20이 됩니다."
      - say:
          char: 수경
          with: [지완]
          text: "B는 평소가 80이에요. 같은 걸 보면 90이 됩니다."
      - say:
          char: 지완
          with: [수경]
          text: "사회는 B를 따뜻하다고 합니다."
      - say:
          char: 수경
          with: [지완]
          text: "네. 그런데 움직인 건 A가 19고 B가 10입니다."
      - say:
          char: 지완
          with: [수경]
          text: "그럼 왜 B가 더 높게 나옵니까."
      - say:
          char: 수경
          with: [지완]
          text: "같은 자에 올려놓으니까요. 그래야 비교가 되니까요."
      - say:
          char: 지완
          with: [수경]
          text: "비교가 안 되는 걸 비교하려고 자를 만들었다는 말씀입니까."
      - say:
          char: 수경
          with: [지완]
          text: "비교가 안 되면 채용을 어떻게 합니까. 보험료를 어떻게 매깁니까."
      - say:
          char: 지완
          with: [수경]
          text: "그건 그쪽 사정이고요."
      - say:
          char: 수경
          motion: stomp
          with: [지완]
          text: "그쪽 사정이 지금 4,870만 명 사정입니다."
      - say:
          char: 지완
          with: [수경]
          text: "그중에 한 명이 저고요."
      - say:
          char: 수경
          with: [지완]
          text: "…"
      - move: { id: 수경, style: reset }
      - say:
          char: 수경
          with: [지완]
          text: "선생님 평소 값은 자 위에 없습니다."
      - say:
          char: 지완.break
          with: [수경]
          text: "…위에 없다는 게 무슨 뜻입니까."
      - say:
          char: 수경
          with: [지완]
          text: "자가 100까지예요. 선생님 평소 값이 그보다 큽니다."
      - say:
          char: 지완
          with: [수경]
          text: "얼마나."
      - say:
          char: 수경
          with: [지완]
          text: "그건 말씀 못 드립니다."
      - say:
          char: 지완
          with: [수경]
          text: "그럼 왜 1이 찍힙니까."
      - say:
          char: 수경
          with: [지완]
          text: "자리를 넘기면 앞자리가 잘립니다. 10001은 1로 보입니다."
      - sound: read
      - effect: glitch
      - say:
          char: 지완
          with: [수경]
          text: "…그걸 뭐라고 부르십니까."
      - say:
          char: 수경.tired
          with: [지완]
          text: "…"
      - say:
          char: 지완
          with: [수경]
          text: "이름이 있을 거 아닙니까. 이름 없는 건 서류에 못 씁니다."
      - say:
          char: 수경
          with: [지완]
          text: "오버플로."
      - set: { heard_overflow: true }
      - say:
          char: 지완
          with: [수경]
          text: "…"
      - say:
          char: 수경
          with: [지완]
          text: "사내에서만 쓰는 말입니다. 밖에서 쓰시면 저는 안 했다고 할 겁니다."

  offer:
    actions:
      - say:
          char: 수경
          with: [지완]
          text: "선생님. 제가 오늘 드릴 수 있는 건 두 가지예요."
      - say:
          char: 지완
          with: [수경]
          text: "들어 보겠습니다."
      - say:
          char: 수경
          with: [지완]
          text: "하나. 선생님 재측정을 보정 모드로 돌려 드립니다. 정상 범위로 나옵니다."
      - say:
          char: 지완
          with: [수경]
          text: "그건 조작 아닙니까."
      - say:
          char: 수경
          with: [지완]
          text: "보정입니다. 시력표 글자 키우는 거랑 같아요."
      - say:
          char: 지완
          with: [수경]
          text: "두 번째는요."
      - say:
          char: 수경
          with: [지완]
          text: "선생님 사무소 이의신청 건들, 저희 쪽에서 일괄 재심사 해 드립니다. 올해 접수분 전부요."
      - say:
          char: 지완
          with: [수경]
          text: "김옥분 할머니 건도요."
      - say:
          char: 수경
          with: [지완]
          text: "성함을 외우고 계시네요."
      - say:
          char: 지완
          with: [수경]
          text: "열두 장 썼습니다."
      - say:
          char: 수경
          with: [지완]
          text: "그 건도 포함입니다."
      - say:
          char: 지완
          with: [수경]
          text: "대신에요."
      - say:
          char: 수경
          with: [지완]
          text: "장위동 건에서 손 떼시고, 오늘 들은 단어는 안 들으신 겁니다."
      - say:
          channel: record
          with: []
          text: "합의 및 비밀유지 확약서 · 갑 주식회사 한신뉴로 · 을 문지완 · 위반 시 위약벌 3억 원 · 서명란 공란"
      - choice:
          key: o2_deal
          prompt: "종이를 본다."
          char: 수경
          with: [지완]
          options:
            - text: "\"할머니 건은 따로 합니다.\" 종이를 밀어 놓는다"
              goto: refuse_deal
            - text: "\"하나만 묻겠습니다. 배동식 씨도 오버플로입니까.\""
              goto: ask_dongsik
            - text: "서명한다"
              gameOver:
                title: "서류 한 장"
                message: "그해 4월에 김옥분 외 11명의 이의신청이 인용됐다. 장위동 건은 종결로 남았고, 배동식은 아무에게도 아무 말도 하지 않았다."
                recoverToChoice: o2_deal

  refuse_deal:
    actions:
      - say:
          char: 수경
          with: [지완]
          text: "따로 하시면 또 반려됩니다."
      - say:
          char: 지완
          with: [수경]
          text: "압니다. 열두 번 반려됐습니다."
      - say:
          char: 수경
          with: [지완]
          text: "열세 번째를 쓰시겠다고요."
      - say:
          char: 지완
          with: [수경]
          text: "네."
      - say:
          char: 수경.tired
          motion: sigh
          with: [지완]
          text: "…그 문장 쓰신 분이 그럴 줄 알았습니다."
      - goto: deal_end

  ask_dongsik:
    actions:
      - say:
          char: 수경
          motion: freeze
          with: [지완]
          text: "…"
      - say:
          char: 지완
          with: [수경]
          text: "애착 2, 슬픔 1입니다. 이십 년 도시락 싼 사람이요."
      - say:
          char: 수경
          with: [지완]
          text: "그 건은 제가 답할 수 없습니다."
      - say:
          char: 지완
          with: [수경]
          text: "답할 수 없다는 건 아니라는 뜻이 아닙니다."
      - say:
          char: 수경.edge
          with: [지완]
          text: "선생님. 그 사람 불기소됐어요. 지금 집에 있잖아요."
      - say:
          char: 지완
          with: [수경]
          text: "그게 왜 답입니까."
      - say:
          char: 수경
          with: [지완]
          text: "손해 본 사람이 없다는 뜻입니다."
      - say:
          char: 지완.tight
          with: [수경]
          text: "죽은 사람이 있습니다."
      - say:
          char: 수경
          with: [지완]
          text: "…"
      - add: { trust: 1 }
      - goto: deal_end

  deal_end:
    actions:
      - say:
          char: 수경
          with: [지완]
          text: "종이는 두고 가겠습니다. 날짜는 안 적었어요."
      - say:
          char: 지완
          with: [수경]
          text: "안 적으면 언제까지 유효합니까."
      - say:
          char: 수경
          with: [지완]
          text: "제가 이 자리에 있을 때까지요."
      - say:
          char: 지완
          with: [수경]
          text: "오래 계실 것 같습니까."
      - say:
          char: 수경
          with: [지완]
          text: "공식 쓴 사람이 저예요. 2025년에."
      - say:
          char: 지완
          with: [수경]
          text: "…"
      - say:
          char: 수경
          with: [지완]
          text: "그때 저는 스물여섯이었고, 그게 좋은 일인 줄 알았습니다."
      - move: { id: 수경, style: exit, wait: true }
      - goto: night

  night:
    title: "그날 밤"
    actions:
      - bg: { id: office_night, transition: dissolve, duration: 800 }
      - place: "같은 날 밤 11시 40분 · 사무소"
      - music: lowscore
      - char: { id: 도겸, position: right }
      - char: { id: 지완, position: left }
      - say:
          char: 도겸
          with: [지완]
          text: "소장님, 저 이상한 거 찾았는데요."
      - say:
          char: 지완
          with: [도겸]
          text: "뭐."
      - say:
          char: 도겸
          with: [지완]
          text: "에모스 개발자 문서요. 2029년에 공개됐다가 내려간 거."
      - say:
          char: 지완
          with: [도겸]
          text: "그걸 어디서 구했어."
      - say:
          char: 도겸
          with: [지완]
          text: "대학 과제 올리는 사이트에 누가 첨부파일로 올려놨어요. 2029년 1학기."
      - say:
          char: 지완
          with: [도겸]
          text: "…너 진짜 잘 찾는다."
      - say:
          char: 도겸.wide
          with: [지완]
          text: "어 칭찬이다. 녹음할걸."
      - say:
          char: 지완
          with: [도겸]
          text: "띄워 봐."
      - sound: read
      - say:
          channel: record
          with: []
          text: "EMOS SDK v3 · 응답 필드 · value(0-100, 환산값) · raw(정수, 비공개) · scale_id · overflow_flag(bool)"
      - say:
          channel: record
          with: []
          text: "주의 · raw가 표현 범위를 넘는 경우 value는 하위 두 자리만 반환한다. 이 동작은 설계상 의도된 것이다."
      - say:
          char: 도겸
          with: [지완]
          text: "'설계상 의도된 것이다'래요."
      - say:
          char: 지완
          with: [도겸]
          text: "예시 있어?"
      - say:
          char: 도겸
          with: [지완]
          text: "있어요. 맨 밑에."
      - say:
          channel: record
          with: []
          text: "예 · raw = 10001 → value = 1 · overflow_flag = true · 운영 설정에서 flag는 응답에 포함하지 않는다"
      - say:
          char: 도겸
          with: [지완]
          text: "소장님."
      - say:
          char: 지완.break
          with: [도겸]
          text: "…"
      - say:
          char: 도겸
          with: [지완]
          text: "소장님 1 세 개 나오잖아요."
      - say:
          char: 지완
          with: [도겸]
          text: "…그러네."
      - say:
          char: 도겸
          with: [지완]
          text: "그럼 원본은요?"
      - say:
          char: 지완
          with: [도겸]
          text: "원본은 저쪽에만 있어."
      - say:
          char: 도겸
          with: [지완]
          text: "달라고 하면요?"
      - say:
          char: 지완
          with: [도겸]
          text: "비공개라고 적혀 있잖아."
      - say:
          char: 도겸
          motion: sigh
          with: [지완]
          text: "…그러네요."
      - say:
          char: 지완
          with: [도겸]
          text: "도겸아."
      - say:
          char: 도겸
          with: [지완]
          text: "네."
      - say:
          char: 지완
          with: [도겸]
          text: "녹음기 배터리 충전기 좀 찾아 줘. 119개 들어야 돼."
      - goto: /3.yaml
