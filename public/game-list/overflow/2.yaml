chapterTitle: "병실 안에서"

script:
  - scene: pair_lens

scenes:
  pair_lens:
    title: "검사기 연결"
    actions:
      - bg: { id: hospital_stairs, transition: fade, duration: 350 }
      - place: "면회 직전 · 신경과 옆 계단"
      - music: street
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: true }, text: "아까 접수표, 여기요. 이름은 옮겨 적지 않았어요." }
      - say: { char: 수경, with: [지완], when: { var: shared_slip, op: eq, value: false }, text: "접수표는 안 주셔도 돼요. 렌즈에 검사기만 연결할게요." }
      - say: { char: 지완, with: [수경], text: "아버지 쪽은요." }
      - say: { char: 수경, with: [지완], text: "안 찍혀요. 렌즈가 읽은 값과 화면에 뜬 값만 남아요. 아버님 모습이나 목소리는 저장 안 해요." }
      - say: { char: 수경, with: [지완], text: "화면에 뜨는 항목 보시고 누르세요." }
      - choice:
          key: o2_pair_lens
          prompt: "검사기에 센서 입력값과 화면 표시값을 저장할까? 영상과 음성은 저장하지 않는다."
          with: [수경]
          options:
            - text: "내 렌즈 연결 허용"
            - text: "연결하지 않고 아버지를 뵙는다"
              goto: visit_without_test
      - say: { char: 수경, with: [지완], text: "저는 여기 있을게요. 오래 기다리셨잖아요. 아버님 뵙고 오세요." }
      - goto: first_visit

  visit_without_test:
    title: "면회 시간"
    actions:
      - say: { char: 지완, with: [수경], text: "오늘은 아버지만 뵙고 싶어요. 검사기 연결은 안 할게요." }
      - say: { char: 수경, with: [지완], text: "네. 기기는 제가 가져갈게요. 아버님 잘 뵙고 오세요." }
      - bg: { id: ward_bed, transition: fade, duration: 420 }
      - place: "저녁 8시 10분 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right, emotion: far }
      - say: { char: 동식, with: [지완], text: "왔냐. 냄비는… 불 껐나." }
      - say: { char: 지완, with: [동식], text: "껐다고 아래 가게에서 그러셨어요. 내일 제가 들를게요." }
      - say: { channel: record, with: [], sound: read, text: "보호자 재확인 · 문지완\n정서 반응 01 · 무반응 의심" }
      - say: { channel: action, with: [지완, 동식], text: "지완은 경고창을 닫고 아버지 옆에 앉았다. 침대에서 떨어진 양말을 주워 무릎 위에 올렸다." }
      - ending: visiting_hours

  first_visit:
    title: "아버지"
    actions:
      - bg: ward_bed
      - place: "저녁 8시 10분 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right, emotion: far }
      - say: { channel: action, with: [지완, 동식], camera: wide, text: "지완이 간호사 뒤를 따라 들어간다. 아버지가 일어나려다 침대 끝의 양말을 바닥에 떨어뜨린다." }
      - say: { char: 지완, with: [동식], text: "일어나지 마세요." }
      - say: { channel: thought, with: [동식], text: "하나, 둘." }
      - say: { char: 동식, with: [지완], text: "…국." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: true }, text: "알아요, 제 거 빼 두셨죠. 일요일에 먹으러 갈게요." }
      - say: { char: 지완, with: [동식], when: { var: picked_up, op: eq, value: false }, text: "아침에 전화 못 받아서 죄송해요. 국은 일요일에 먹으러 갈게요." }
      - say: { channel: action, with: [지완, 동식], text: "아버지 입 오른쪽이 처져 있다. 지완은 거기를 안 보려고 링거 줄을 본다. 방울이 떨어지는 걸 센다." }
      - say: { channel: action, with: [지완, 동식], sound: bed_rail, text: "아버지가 침대 난간을 세 번 두드린다. 마지막 한 번이 늦다." }
      - say: { channel: action, with: [지완, 동식], text: "두드린 건 왼손이다. 오른손은 이불 위에 놓인 채 움직이지 않는다." }
      - say: { channel: action, with: [지완, 동식], text: "지완이 다가선다." }
      - say: { char: 동식, with: [지완], text: "겁났냐." }
      - choice:
          key: o2_father
          prompt: "침대 옆에 물컵이 놓여 있다."
          with: [동식]
          options:
            - text: "겁났다고 말한다"
              goto: admit_fear
            - text: "물부터 건넨다"
              goto: offer_water

  admit_fear:
    actions:
      - set: { told_father: true }
      - say: { char: 지완.break, with: [동식], text: "네. 전화 받았는데 아버지 목소리가 아니어서… 무슨 일인지 묻기도 무섭더라고요." }
      - say: { char: 동식, with: [지완], text: "앉아. 여기." }
      - goto: compare_readings

  offer_water:
    actions:
      - set: { told_father: false }
      - say: { char: 지완, with: [동식], text: "물부터 드세요. 천천히요." }
      - say: { channel: action, with: [지완, 동식], text: "지완이 두 손으로 물컵을 받친다. 아버지가 컵을 잡아도 놓지 못한다. 아버지는 한 모금 마시고 아들 손을 두드린다." }
      - goto: compare_readings

  compare_readings:
    title: "같은 경고"
    actions:
      - effect: focus
      - say: { channel: record, with: [], sound: read, text: "보호자 재확인 · 문지완\n정서 반응 01 · 무반응 의심" }
      - say: { char: 지완.tight, with: [동식], text: "…또네." }
      - say: { char: 지완, with: [동식], text: "아버지, 발 좀요. 양말 떨어졌어요." }
      - bg: ward_sock
      - say: { channel: action, with: [], text: "문 앞 의자의 간호사가 경고음에 일어선다. 양말을 신기는 지완을 보더니 도로 앉는다." }
      - bg: { id: hospital_stairs, transition: dissolve, duration: 420 }
      - place: "면회 뒤 · 신경과 옆 계단"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "오셨어요. 이번에는 잘리기 전 값도 남았어요." }
      - get: raw_print
      - sticker: { id: diagnosis, image: raw_sticker, x: 50, y: 46, width: "clamp(140px, 23%, 270px)", enter: fadeIn }
      - say: { channel: record, with: [], text: "20:14:09 · 문지완의 렌즈\n센서 입력 101 → 표시 01\n화면 판정: 무반응 의심" }
      - clearSticker: { id: diagnosis, leave: fadeOut }
      - say: { char: 지완, with: [수경], text: "101." }
      - say: { char: 지완, with: [수경], text: "8시 14분. 아버지 옆에 있을 때예요." }
      - say: { char: 지완, with: [수경], text: "그럼 저 무반응 아닌 거죠." }
      - say: { char: 수경, with: [지완], text: "화면이 앞자리를 잘랐다는 건 이걸로 말할 수 있어요. 지완 씨가 그때 어땠는지는 제가 못 써요." }
      - choice:
          key: o2_evidence
          prompt: "첫 접수표에는 01만 있다. 출력물에는 20시 14분과 두 숫자가 찍혀 있다."
          with: [수경]
          options:
            - text: "첫 접수 수치도 101로 고쳐 달라고 한다"
              set: { asked_for_first_value: true }
            - text: "20시 14분에 나온 두 값을 증거로 남긴다"
              set: { asked_for_first_value: false }
      - say: { char: 수경, with: [지완], when: { var: asked_for_first_value, op: eq, value: true }, text: "첫 입력값은 남아 있지 않아요. 이건 8시 14분에 다시 잰 값이에요." }
      - say: { char: 지완, with: [수경], text: "그럼 이것만 그대로 써 주세요. 8시 14분, 101, 01. 같은 시각이라고." }
      - say: { char: 수경, with: [지완], text: "네. 그대로 쓸게요." }
      - say: { char: 지완, with: [수경], text: "제가 그때 어땠는지는 본 사람이 있어요. 문 앞에 간호사님요. 접수대에서도 그분이었어요." }
      - say: { char: 수경, with: [지완], text: "그분께 같이 말씀드려도 될까요?" }
      - say: { char: 지완, with: [수경], text: "같이 가요." }
      - goto: /3.yaml
