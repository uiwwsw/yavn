chapterTitle: "누가 사인했어요?"

script:
  - scene: nurse_statement

scenes:
  nurse_statement:
    title: "교대 기록"
    actions:
      - bg: { id: office_night, transition: fade, duration: 360 }
      - place: { text: "그날 밤 · 신경과 간호사실", presentation: center }
      - music: quant
      - char: { id: 세라, position: right }
      - char: { id: 수경, position: center }
      - char: { id: 지완, position: left }
      - say: { char: 세라, with: [지완, 수경], text: "들어오세요. 아까 면회 같이 들어갔던 윤세라예요." }
      - say: { channel: action, with: [지완, 수경, 세라], text: "지완이 접어 둔 출력물을 책상에 편다. 접은 자리가 두 줄이다." }
      - say: { char: 지완, with: [세라, 수경], text: "병실에서 뜬 01은 잘린 게 아니래요. 기계는 맞게 읽었대요. 간호사님은 그때 제가 뭘 하는 걸 보셨어요?" }
      - say: { char: 세라, with: [지완], text: "경고음이 나서 문 쪽을 봤어요. 01 아래에 ‘무반응 의심’이라고 써 있었죠." }
      - say: { char: 세라, with: [지완], text: "그때 보호자님은 아버님 양말 신기고 계셨고요." }
      - say: { char: 세라, with: [지완], text: "접수대에서 한 번, 병실에서 한 번. 두 번 다 제가 본 건 확인서에 적어 드릴게요." }
      - say: { char: 세라, with: [지완], when: { var: door_reply, op: eq, value: asked }, text: "접수대에서는 ‘지금 대답하고 있잖아요’ 하셨죠. 그 말도 들은 대로 적을게요." }
      - say: { char: 세라, with: [지완], when: { var: door_reply, op: eq, value: counted }, text: "접수대에서는 한참 있다가 면회 시간부터 물으셨어요. 장갑 쥔 손은 주머니에 넣으시고요. 그것도 적을게요." }
      - say: { char: 세라, with: [지완], text: "01이 뜬 분을 본 대로 적는 건 저도 처음이에요. 적는 칸이 없어서 여백에 써요." }
      - say: { channel: action, with: [세라], text: "세라가 확인서 오른쪽 여백에 작은 글씨로 쓰기 시작한다." }
      - choice:
          key: o3_ask_2031
          prompt: "여백이 글씨로 찬다. 재작년 그날의 01도 누군가의 손으로 적혔을 것이다."
          with: [세라]
          options:
            - text: "재작년 그 보호자는 어땠는지 묻는다"
              set: { asked_2031: true }
            - text: "확인서만 받아 든다"
      - say: { char: 지완, with: [세라], when: { var: asked_2031, op: eq, value: true }, text: "재작년에 01이 떴다는 그분은 어땠어요." }
      - say: { channel: action, with: [세라], when: { var: asked_2031, op: eq, value: true }, text: "세라가 펜을 내려놓는다." }
      - say: { char: 세라, with: [지완], when: { var: asked_2031, op: eq, value: true }, text: "그날 야간이 저였어요. 환자분이 발작하면서 링거를 뽑으셨고, 보호자분은 침대 옆에 서 계셨어요." }
      - say: { char: 세라, with: [지완], when: { var: asked_2031, op: eq, value: true }, text: "사십 초쯤요. 손도 안 움직이시고 눈도 안 깜빡이셨어요. 그러다 갑자기 어머니 손목을 붙잡으셨는데, 그게 부러졌어요." }
      - say: { char: 세라, with: [지완], when: { var: asked_2031, op: eq, value: true }, text: "기록에는 ‘보호자 반응 없음’이라고 적었어요. 제가요. 본 대로였어요." }
      - say: { char: 세라, with: [지완], when: { var: asked_2031, op: eq, value: true }, text: "지금 생각하면 아무것도 안 느끼는 분처럼 보이지 않았어요. 얼어 있었어요. 그런 칸이 없었어요." }
      - say: { char: 지완, with: [세라], when: { var: asked_2031, op: ne, value: true }, text: "그럼 무반응이라고 뜬 건 지워져요?" }
      - say: { char: 세라, with: [지완], when: { var: asked_2031, op: ne, value: true }, text: "제가 지울 수는 없어요. 숫자가 틀린 게 아니면 이의 신청을 해도 숫자는 남고요. 확인서는 그 옆에 같이 붙어요." }
      - say: { char: 세라, with: [지완], text: "오늘 같은 안내 받고 그냥 가신 분이 한 분 더 있어요." }
      - say: { char: 수경, with: [세라], text: "그분께 제 연락처를 전해 주실 수 있을까요? 원하시면 그분 렌즈도 확인해 드릴게요." }
      - say: { char: 세라, with: [수경], text: "네. 제가 먼저 여쭙고, 원하시면 전해 드릴게요." }
      - goto: sign_confirmation

  sign_confirmation:
    title: "확인자"
    actions:
      - say: { char: 세라, with: [수경, 지완], text: "여기 확인자 칸이 있어요. 기기 쪽은 어느 분이 확인하신 건가요?" }
      - say: { char: 수경, with: [세라, 지완], text: "제가 확인했습니다. 한수경이고, 한신뉴로 검증팀이에요." }
      - say: { channel: action, with: [지완, 수경], text: "수경이 회사 이름을 쓰다가 펜을 멈춘다." }
      - say: { char: 지완, with: [수경], text: "검증팀이면, 팔 년 동안 한 번도 안 틀렸다는 것도 거기서 확인한 거죠. 그건 누가 사인했어요?" }
      - say: { char: 수경, with: [지완], text: "…저요. 삼 년째 제가 해요." }
      - say: { char: 수경, with: [지완], text: "높게 뜬 건 다 확인했어요. 97이 뜨면 경찰이 가고 조서가 남아요. 맞았는지 틀렸는지 종이가 생겨요." }
      - say: { char: 지완, with: [수경], text: "낮게 뜬 건요." }
      - say: { char: 수경.tired, with: [지완], text: "확인한 적 없어요. 0이 뜬 사람한테는 아무도 안 가요. 갈 이유가 없으니까요. 종이가 없으니까 틀린 것도 0건이에요." }
      - say: { char: 수경, with: [지완], text: "맞았다고 확인한 0은 팔 년 동안 재작년 그 한 건이에요." }
      - say: { channel: action, with: [세라, 수경], when: { var: asked_2031, op: eq, value: true }, text: "세라가 수경을 본다." }
      - say: { char: 세라, with: [수경, 지완], when: { var: asked_2031, op: ne, value: true }, text: "그 한 건, 제가 적은 거예요. ‘보호자 반응 없음.’" }
      - say: { char: 세라, with: [수경, 지완], when: { var: asked_2031, op: ne, value: true }, text: "그분은 사십 초쯤 침대 옆에 그냥 서 계셨어요. 손도 눈도 안 움직이고. 그러다 어머니 손목을 붙잡았는데, 그게 부러졌어요." }
      - say: { char: 세라, with: [수경, 지완], when: { var: asked_2031, op: ne, value: true }, text: "아무것도 안 느끼는 분 같지 않았어요. 얼어 있었어요. 그런 칸이 없었어요." }
      - say: { char: 지완, with: [수경], text: "그럼 안 틀린 게 아니라 안 물어본 거네요." }
      - say: { channel: action, with: [수경], text: "수경이 펜 뚜껑을 닫는다. 한참 말이 없다." }
      - say: { char: 수경, with: [지완], text: "작년 겨울에 엄마가 호스피스에 계셨어요." }
      - say: { char: 수경, with: [지완], text: "병실 앞에서 제 렌즈에 02가 떴어요. 동행 면회만 된다고 해서 기다렸어요. 사십 분." }
      - say: { char: 수경.tired, with: [지완], text: "그 사이에 가셨어요. 장례식장에서도 안 울었어요." }
      - say: { char: 수경.tired, with: [지완], text: "숫자가 맞는 줄 알았어요. 저는 정말 아무렇지도 않은 사람인 줄 알았어요. 그리고 두 달 뒤에 0건에 서명했어요." }
      - say: { channel: thought, with: [수경], text: "렌즈는 팔 년 동안 틀린 적이 없다. 그러면 지금 나는 아무렇지도 않은 사람이다. 그 문장을 이 사람도 했다." }
      - say: { char: 수경, with: [지완], text: "버그이기를 바랐어요. 버그는 고치면 되니까요." }
      - say: { char: 지완, with: [수경], text: "버그가 아니면요." }
      - say: { char: 수경, with: [지완], text: "팔 년 치 0을 찾아가서 물어야 해요. 그날 어땠느냐고." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: true }, text: "아까 보신 결함 보고서는 거둘게요. 틀린 건 화면이 아니었으니까요." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: false }, text: "두 달 전에 회사에 낸 결함 보고서가 있어요. 그건 거둘게요. 틀린 건 화면이 아니었으니까요." }
      - say: { char: 수경, with: [지완], text: "대신 올해 검증 보고서에 한 줄을 넣을게요. ‘오류 0건’ 옆에요. 0 판정은 확인한 적 없음." }
      - get: report
      - choice:
          key: o3_sugyeong
          prompt: "수경의 펜이 회사 이름을 쓰다 만 자리에 멈춰 있다."
          with: [수경]
          options:
            - text: "아침에 역에서 병원을 물은 것도 그래서였는지 묻는다"
              set: { asked_morning: true }
            - text: "아무 말 없이 출력물을 끌어온다"
      - say: { char: 지완, with: [수경], when: { var: asked_morning, op: eq, value: true }, text: "아침에 역에서 병원이 어느 쪽이냐고 물으셨죠. 그때도 저 같은 사람 기다리러 가던 길이었어요?" }
      - say: { char: 수경, with: [지완], when: { var: asked_morning, op: eq, value: true }, text: "네. 그게 지완 씨일 줄은 몰랐어요. 장갑은… 그냥 떨어져서 주운 거예요." }
      - say: { char: 지완, with: [수경], when: { var: asked_morning, op: eq, value: true }, text: "장갑은 고마웠어요. 그건 따로예요." }
      - bg: desk_print
      - say: { channel: action, with: [], text: "지완이 책상 위의 출력물을 자기 쪽으로 끌어온다." }
      - bg: { id: office_night, transition: dissolve, duration: 320 }
      - say: { char: 지완, with: [수경], text: "이건 제가 갖고 있을게요." }
      - say: { char: 수경, with: [지완], text: "네. 지완 씨 거예요." }
      - say: { char: 수경, with: [지완], text: "제가 찾던 건 오버플로였어요. 값이 그릇보다 커지면 넘쳐서 0부터 다시 세는 거요. 렌즈는 안 넘쳤어요. 100에서 멈추게 만들었으니까요." }
      - say: { char: 지완, with: [수경], text: "사람은요. 사람도 넘치면 0부터 다시 세요?" }
      - say: { char: 수경.tired, with: [지완], text: "…그건 제가 검증한 적이 없어요." }
      - say: { channel: action, with: [지완, 수경, 세라], text: "수경이 확인자 칸에 회사 이름과 자기 이름을 끝까지 적는다. 세라가 그 아래에 본 것을 두 줄 쓴다." }
      - say: { char: 세라, with: [지완], text: "아버님이 아드님 찾으세요. 지금은 제가 같이 들어갈게요. 내일 혼자 면회하실 수 있을지는 이 확인서로 담당자에게 먼저 물어둘게요." }
      - goto: second_visit

  second_visit:
    title: "문 열리는 소리"
    actions:
      - bg: { id: ward_bed, transition: fade, duration: 360 }
      - place: "그날 밤 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right }
      - say: { channel: action, with: [지완, 동식], text: "침대 머리맡 환자 판독기에 숫자가 떠 있다. 03. 오른쪽 얼굴이 움직이지 않는 사람의 숫자다." }
      - say: { char: 동식, with: [지완], text: "아까부터 와 있었다며." }
      - say: { char: 지완, with: [동식], text: "문 앞에요." }
      - say: { char: 동식, with: [지완], text: "나도 그랬다." }
      - say: { char: 동식, with: [지완], text: "네 학교에서 경보 울렸을 때." }
      - say: { char: 지완, with: [동식], text: "…실습 못 간 날요?" }
      - say: { char: 동식, with: [지완], text: "너 복도에 앉아 있었다." }
      - say: { char: 동식, with: [지완], text: "담임이… 수치가 높다고. 가라앉을 때까지 나도 못 본다더라." }
      - say: { char: 지완, with: [동식], text: "그때 뭐라고 하셨어요?" }
      - say: { char: 동식, with: [지완], text: "우리 애 겁먹은 거라고. 나 좀 들여보내 달랬지." }
      - say: { char: 동식, with: [지완], text: "안 되더라. 그래서 너한테 셋 세라고 했다. 화내지 말라고." }
      - say: { char: 지완, with: [동식], text: "아까도 셌어요. 문 앞에서." }
      - say: { char: 동식, with: [지완], text: "안다. 너 셀 때 얼굴이 그렇다." }
      - say: { char: 지완, with: [동식], text: "기계는 저보고 1이래요. 아버지 옆에서 두 번 쟀는데 두 번 다요." }
      - say: { channel: action, with: [지완, 동식], text: "아버지가 왼손으로 머리맡의 판독기를 가리킨다." }
      - say: { char: 동식, with: [지완], text: "나는 3이란다." }
      - say: { char: 동식, with: [지완], text: "…합쳐서 4냐." }
      - say: { channel: action, with: [지완, 동식], text: "지완이 숨을 한 번 내쉰다. 웃음 비슷한 소리가 난다. 아버지 입은 왼쪽만 올라간다." }
      - say: { channel: action, with: [지완, 동식], text: "웃음이 그친 뒤에도 아버지의 얼굴은 그대로다. 오른쪽이 움직이지 않으니 왼쪽만으로는 무엇도 다 지어지지 않는다." }
      - say: { char: 동식, with: [지완], text: "얼굴이 이래서 말로 한다." }
      - say: { char: 동식, with: [지완], text: "무섭다. 아까부터. 네가 못 들어올까 봐." }
      - say: { char: 동식, with: [지완], text: "나한텐 세지 마라." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: true }, text: "아까 저 앉혀 주셨잖아요. 저도 무서웠어요. 아버지가 저 못 알아보실까 봐요." }
      - say: { char: 지완.break, with: [동식], when: { var: told_father, op: eq, value: false }, text: "저도 무서웠어요. 아까 대답 못 했는데, 아버지가 저 못 알아보실까 봐요." }
      - say: { char: 동식, with: [지완], text: "알아보지. 문만 열리면 너 오는 줄 알고 봤는데." }
      - say: { char: 지완, with: [동식], text: "내일은 아침에 올게요. 들어오면서 크게 부를게요." }
      - goto: /4.yaml
