chapterTitle: "사유란"

script:
  - scene: stairwell

scenes:
  stairwell:
    title: "내려오는 사람들"
    actions:
      - bg: hospital_stairs
      - wait: 0
      - music: street
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: action, with: [], text: "계단 위에서 출입문이 열린다. “한수경 책임님, 잠깐만요.” 수경이 지완을 본다." }
      - say: { char: 지완, with: [수경], text: "이쪽이요. 제 면회증 아직 돼요." }
      - say: { channel: action, with: [], text: "지완이 면회증을 댄다. 닫히는 문을 종이컵을 든 간호사가 발로 받친다. 가슴의 명찰에 ‘윤세라’라고 적혀 있다." }
      - goto: staff_desk

  staff_desk:
    title: "교대 시간"
    actions:
      - bg: office_night
      - place: "신경과 간호사실 옆"
      - music: quant
      - char: { id: 세라, position: right }
      - char: { id: 수경, position: center }
      - char: { id: 지완, position: left }
      - say: { char: 세라, with: [지완, 수경], text: "여기 앉으세요. 병실 쪽으로는 가지 마시고요. 찾는 사람 오면 제가 얘기할게요." }
      - say: { char: 지완, with: [세라], text: "아까 접수대에 있던 문지완입니다. 이것 좀 봐 주세요. 두 줄 다 20시 14분이에요." }
      - say: { channel: action, with: [], text: "세라가 면회표에 표시해 둔 줄을 짚는다." }
      - say: { char: 세라, with: [지완], text: "교대 전에 한 분 더 떴어요, 01. 애 데리러 가야 된다고 결국 그냥 가셨고요." }
      - say: { char: 수경, with: [세라], text: "그분 건 함부로 열어 보지 마세요. 01만 같을 수도 있어요." }
      - say: { char: 세라, with: [수경], text: "제가 전화는 해 볼게요. 원하시면 내일 오셔서 이의 신청할 수 있다고." }
      - say: { char: 세라, with: [지완], text: "얼마나 기다리셨는지는 제가 쓸게요. 지완 씨는 그때 하려던 말 있으면 여기 쓰세요." }
      - goto: sign

  sign:
    title: "수경의 이름"
    actions:
      - say: { char: 지완, with: [수경], text: "아까 그 사람들요. 저한테도 찾아와요?" }
      - say: { char: 수경, with: [지완], text: "오면 저 찾으라고 해요. 병원에 이거 넣을 때 검수란에 제가 사인했어요." }
      - say: { char: 수경, with: [지완], text: "역에서 사고가 줄었으니까 병원에도 빨리 넣자고 했어요. 면회 막는 칸도 그때 봤고요." }
      - say: { char: 지완, with: [수경], text: "그때도 그 칸이 있었어요?" }
      - say: { char: 수경, with: [지완], text: "네. 말하면 또 한 달 밀린댔어요. 제 차례에 가만있었더니 그날 바로 결재 났어요." }
      - say: { channel: action, with: [], wait: 700, text: "수경이 두 숫자 아래에 자기 이름을 적는다." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: true }, text: "아까 보신 보고서도 붙여 주세요. 제 사인 있는 쪽이요." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: false }, text: "배포 멈춰 달라고 쓴 것도 같이 내요. 제가 언제 썼는지 나오니까." }
      - get: report
      - say: { char: 세라, with: [지완], text: "아버님이 또 찾으세요. 먼저 들어가세요. 서류는 제 쪽에 둘게요." }
      - goto: father_again

  father_again:
    title: "아까 대답"
    actions:
      - bg: ward_bed
      - place: "같은 날 밤 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right }
      - say: { char: 동식, with: [지완], text: "밖에서… 오래 있었냐." }
      - say: { char: 지완, with: [동식], text: "네. 학교에서도 문 밖에 세워 두고 울면 다시 쟀잖아요. 오늘은 조용히 있었는데도 문을 안 열어 주더라고요." }
      - say: { char: 동식, with: [지완], text: "그날 선생한테 네가 겁먹은 거라고 했어. 한참 듣더니 그 표를 또 꺼내더라." }
      - say: { channel: action, with: [], text: "아버지가 숨을 고른다. 지완은 물병을 내려놓는다." }
      - say: { char: 동식, with: [지완], wait: 850, text: "집에선 울어도 된다고, 그 말도 할걸 그랬어." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: true }, text: "아까는 옆에 앉으라고 하셨잖아요." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: false }, text: "아까 물부터 드렸죠. 사실 겁났어요. 택시 기사님한테 병원 이름도 두 번이나 틀리게 말했어요." }
      - say: { char: 동식, with: [지완], text: "나도 무섭더라. 문 열리는 소리 날 때마다 네가 왔나 했어." }
      - say: { channel: action, with: [], wait: 850, text: "아버지가 지완의 손등을 한 번 두드린다." }
      - goto: /4.yaml
