chapterTitle: "동식이 한 말"

script:
  - scene: tapes
  - scene: confront
  - scene: raw

scenes:
  tapes:
    title: "마지막 파일"
    actions:
      - bg: office_night
      - place: "3월 22일 밤 · 상계동 이의신청 사무소"
      - music: lowscore
      - char: { id: 지완, position: left }
      - say: { channel: record, with: [], text: "녹음 001 · 2031년 5월 14일" }
      - char: { id: 희남, position: right }
      - say: { char: 희남, with: [], text: "하율이 색연필 사 줘. 24색 말고 12색. 큰 건 걔 가방에 안 들어가." }
      - say: { channel: record, with: [], text: "녹음 119 · 2033년 3월 6일" }
      - say: { char: 희남, with: [], text: "병원에 물어봤어. 오늘 밤에 해 줄 수 있는 건 다 했대." }
      - say: { char: 희남, with: [], text: "동식아. 내가 전에도 부탁했지. 이제 좀 그만 아프게 해 줘." }
      - say: { char: 희남, with: [], text: "듣고는 있어? 지난번처럼 나가 있지 말고." }
      - say: { char: 동식, with: [], text: "여기 있어." }
      - say: { char: 희남, with: [], text: "이거 지우지 마. 나중에 네 말만 듣고 뭐라고 할 거 아니야. 내 말도 있어야지." }
      - move: { id: 희남, style: exit, wait: true }
      - say: { channel: action, with: [], text: "재생이 멈춘다. 지완은 판독표를 뒤집고 그 뒷면에 두 사람의 말을 옮겨 적는다." }

  confront:
    title: "말 한 문장씩"
    actions:
      - bg: dongsik_house
      - place: "3월 23일 아침 · 장위동"
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right }
      - say: { char: 지완, with: [동식], when: { var: ev_calendar, op: eq, value: true }, text: "7일 달력에 ‘희남이랑 얘기할 것’이라고 쓰셨죠. 녹음 다음 날 무슨 얘기를 하셨습니까?" }
      - say: { char: 지완, with: [동식], when: { var: ev_calendar, op: eq, value: false }, text: "마지막 파일을 들었습니다. 그 다음 날, 두 분이 무슨 얘기를 하셨습니까?" }
      - say: { char: 동식, with: [지완], when: { var: ev_lunchbox, op: eq, value: true }, text: "뚜껑에 한 숟갈이라고 적힌 거 보셨죠. 저녁에 죽 한 숟갈 먹고, 더는 안 먹겠다고 했습니다." }
      - say: { char: 동식, with: [지완], when: { var: ev_lunchbox, op: eq, value: false }, text: "저녁에 죽을 좀 쒔습니다. 한 숟갈 먹고, 더는 안 먹겠다고 했어요." }
      - say: { char: 동식, with: [지완], text: "또 부탁하더군요. 전날까지는 안 된다고 했습니다. 그날은 알았다고 했고요." }
      - say: { char: 지완, with: [동식], text: "오희남 씨가 돌아가신 일. 직접 하신 겁니까?" }
      - say: { char: 동식.far, with: [지완], text: "예. 제가 희남이를 죽였습니다." }
      - say: { char: 동식, with: [지완], text: "그만 아팠으면 좋겠다고 생각했습니다. 내가 그만 보고 싶었던 건지도 모르겠고요." }
      - say: { char: 동식, with: [지완], text: "신고하고 나서도 그 말 했습니다. 조서 첫 줄에 있는 줄 알았는데, 집에 와서 보니 제 입으로 한 말은 없더군요." }
      - say: { char: 지완, with: [동식], text: "이걸 다시 내면 조사받으실 겁니다. 희남 씨가 부탁했다는 말로 끝나지 않을 수도 있어요." }
      - say: { char: 동식, with: [지완], text: "압니다. 제 건 제가 대답할 테니, 그 사람 말을 제 입으로 대신 하게는 하지 마십시오." }
      - say: { char: 지완, with: [동식], text: "경찰하고 검찰에만 녹음을 낼 수 있게 동의받겠습니다. 판독 원본도 같이 요청하고요." }
      - say: { char: 동식, with: [지완], text: "예. 수사하는 데까지만요. 밖에선 하율이도 들을 수 있으니까." }

  raw:
    title: "같은 날, 같은 검사"
    actions:
      - bg: cafe
      - place: "3월 23일 저녁 · 장위삼거리"
      - music: overflow
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "배동식 씨가 동의한 범위로 출력했습니다. 기존 판독표부터 옆에 두세요." }
      - get: raw_print
      - sticker: { id: raw, image: raw_sticker, x: 78, y: 48, width: "clamp(150px, 20%, 250px)", enter: fadeIn }
      - effect: glitch
      - say: { channel: record, with: [], text: "배동식 · 3월 7일 사건 판독\n분노: 원본 103 → 표시 3\n죄책감: 원본 100 → 표시 0" }
      - clearSticker: { id: raw, leave: fadeOut }
      - say: { char: 수경, with: [지완], text: "100이라고 실제로 죄책감이 더 컸다는 말은 못 합니다. 제가 증언할 수 있는 건 0이 출력된 이유까지예요." }
      - say: { char: 지완, with: [수경], text: "그것부터 써 주세요. 이걸 가지고 기태 경위한테 가서, 동식 씨가 한 말을 다시 받으라고 할 겁니다." }
      - say: { char: 수경, with: [지완], text: "제 이름 쓰세요. 환산표 제가 만들었습니다." }
      - say: { char: 수경, with: [지완], text: "회사에도 반출 기록이 남았습니다. 내일 아홉 시까지 자료를 돌려주면 합의는 살아 있답니다." }
      - choice:
          key: o3_tell
          prompt: "오늘 밤 누구에게 먼저 연락할까?"
          char: 지완
          with: [수경]
          options:
            - text: "노기태에게 전화한다"
              goto: tell_gitae
            - text: "세라에게 먼저 말한다"
              goto: tell_sera

  tell_gitae:
    actions:
      - set: { told_gitae: true }
      - say: { channel: message, side: me, char: 지완, with: [], text: "동식 씨 진술 다시 받으실 수 있겠어요? 불기소에 쓰인 판독표에 오류가 있습니다." }
      - say: { channel: message, side: them, char: 기태, with: [], text: "내 근무 아니어도 내일 저녁엔 있을게. 원본하고 진술 가지고 와." }
      - goto: /4.yaml

  tell_sera:
    actions:
      - set: { sera_knows: true }
      - say: { channel: message, side: me, char: 지완, with: [], text: "회사에서 점수가 잘못 나오는 경우가 있다는 걸 확인했어. 네 건은 아직 몰라. 신청서에 네가 한 말은 적어 뒀어." }
      - say: { channel: message, side: them, char: 세라, with: [], text: "내일 먼저 내 눈으로 읽어 볼래. 아직 내지는 마." }
      - goto: /4.yaml
