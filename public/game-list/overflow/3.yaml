          text: "메시지 · 오후 9:11"
      - say:
          channel: message
          side: them
          char: 세라
          with: []
          text: "서류 접수됐대 고마워"
      - say:
          channel: message
          side: them
          char: 세라
          with: []
          text: "근데 어머니가 접수한 거 아시고 또 물어보셔"
      - say:
          channel: message
          side: them
          char: 세라
          with: []
          text: "이번엔 몇 나올 것 같냐고"
      - say:
          channel: message
