    actions:
      - say:
          channel: system
          with: []
          text: "통화 · 노기태 · 연결됨 · 오후 9:24"
      - say:
          channel: message
          side: me
          char: 지완
          with: []
          text: "경위님 원본 받았습니다"
      - say:
          channel: message
          side: them
          char: 기태
          with: []
          text: "뭐"
      - say:
          channel: message
          side: me
          char: 지완
          with: []
          text: "사랑 20002 슬픔 30001 죄책감 10001입니다"
      - say:
          channel: message
          side: them
          char: 기태
          with: []
