chapterTitle: "사유란"

script:
  - scene: stairwell

scenes:
  stairwell:
    title: "내려오는 사람들"
    actions:
      - bg: hospital_stairs
      - wait: 0
      - music: street
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: action, with: [], text: "계단 위에서 출입문이 열린다. “한수경 책임님, 잠깐만요.” 수경이 지완을 본다." }
      - say: { char: 지완, with: [수경], text: "이쪽으로요. 제 면회증으로 아직 문이 열려요." }
      - say: { channel: action, with: [], text: "지완이 면회증을 댄다. 닫히는 문을 종이컵을 든 간호사가 발로 받친다. 가슴의 명찰에 ‘윤세라’라고 적혀 있다." }
      - goto: staff_desk

  staff_desk:
    title: "교대 시간"
    actions:
      - bg: office_night
      - place: "신경과 간호사실 옆"
      - music: quant
      - char: { id: 세라, position: right }
      - char: { id: 수경, position: center }
      - char: { id: 지완, position: left }
      - say: { char: 세라, with: [지완, 수경], text: "병실 쪽으론 들어가지 마세요. 저기 의자에 잠깐 앉아 계세요. 누가 찾으면 저한테 먼저 오라고 할게요." }
      - say: { char: 지완, with: [세라], text: "아까 접수대 앞에서 기다렸던 문지완인데요. 방금 계단에서 확인한 기록이에요. 이 두 줄, 같은 시각에 찍혔어요." }
      - say: { channel: action, with: [], text: "세라가 면회표에 볼펜으로 그려 둔 동그라미를 손톱으로 문지른다." }
      - say: { char: 세라, with: [지완], text: "교대 전에 01 뜬 분이 한 분 더 있었어요. 한참 기다리다 애 데리러 가야 한다고 돌아가셨어요." }
      - say: { char: 수경, with: [세라], text: "그분 기록은 열지 마세요. 같은 오류인지 지금은 몰라요." }
      - say: { char: 세라, with: [수경], text: "그분한테 연락은 할 수 있어요. 이의가 있으면 내일 와서 써 내실 수 있다고 전할게요." }
      - say: { char: 세라, with: [지완], text: "면회 접수 앞에서 동행할 간호사를 기다리셨다고 적을게요. 그때 어떤 기분이셨는지는 본인이 써 주세요." }
      - goto: sign

  sign:
    title: "수경의 이름"
    actions:
      - say: { char: 지완, with: [수경], text: "아까 계단까지 찾아온 사람들, 저한테도 옵니까?" }
      - say: { char: 수경, with: [지완], text: "찾아오면 저한테 연락하라고 하세요. 병원에 납품할 때 검수란에 사인한 게 저예요." }
      - say: { char: 수경, with: [지완], text: "역에서 사고 줄었다고 병원에도 빨리 넣자고 했어요. 제가 면회 제한 칸도 봤고요." }
      - say: { char: 지완, with: [수경], text: "왜 그때는 그냥 두셨어요?" }
      - say: { char: 수경, with: [지완], text: "반대하면 또 한 달 밀린댔어요. 회의에서 제 차례에 아무 말도 안 했더니 그날 바로 결재가 났어요." }
      - say: { channel: action, with: [], wait: 700, text: "수경이 두 숫자 아래 이름을 적는다. 이름 가운데 글자에서 펜이 한 번 멎는다." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: true }, text: "아까 보신 보고서도 같이 내주세요. 제 서명이 있는 쪽이요." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: false }, text: "제가 배포를 멈춰 달라고 했던 보고서도 같이 내요. 날짜가 찍혀 있으니까요." }
      - get: report
      - say: { char: 세라, with: [지완], text: "아버님이 다시 찾으세요. 들어가 보세요. 서류는 제가 맡아 둘게요." }
      - goto: father_again

  father_again:
    title: "아까 대답"
    actions:
      - bg: ward_bed
      - place: "같은 날 밤 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right }
      - say: { char: 동식, with: [지완], text: "밖에서… 오래 있었냐." }
      - say: { char: 지완, with: [동식], text: "네. 학교에서도 밖에 오래 세워 놨잖아요. 울면 한 번 더 재고. 오늘은 안 운다고 못 들어갔어요." }
      - say: { char: 동식, with: [지완], text: "그땐 네 선생한테… 네가 겁먹었다고 했다. 화낸 거 아니라고. 선생은 표 다시 보더라." }
      - say: { channel: action, with: [], text: "아버지가 한마디 더 하려다가 숨을 고른다. 지완은 손에 든 물병을 내려놓고 기다린다." }
      - say: { char: 동식, with: [지완], wait: 850, text: "집에선 울어도 된다고 했어야 했는데." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: true }, text: "오늘은 제가 겁났다고 했더니 아버지가 옆에 앉으라 그랬잖아요." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: false }, text: "아까 물부터 드렸죠. 겁났어요. 택시에서 병원 이름을 두 번이나 잘못 말했어요." }
      - say: { char: 동식, with: [지완], text: "나도… 겁나더라. 문 열릴 때마다 쳐다봤다." }
      - say: { channel: action, with: [], wait: 850, text: "아버지가 지완의 손등을 한 번 두드린다." }
      - goto: /4.yaml
