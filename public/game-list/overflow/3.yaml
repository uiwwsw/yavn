chapterTitle: "누가 사인했어요?"

script:
  - scene: nurse_statement

scenes:
  nurse_statement:
    title: "교대 기록"
    actions:
      - bg: { id: office_night, transition: fade, duration: 360 }
      - place: { text: "그날 밤 · 신경과 간호사실", presentation: center }
      - music: quant
      - char: { id: 세라, position: right }
      - char: { id: 수경, position: center }
      - char: { id: 지완, position: left }
      - say: { char: 세라, with: [지완, 수경], text: "아까 면회 도와드린 간호사 윤세라예요. 문 닫고 얘기할까요?" }
      - say: { char: 지완, with: [세라, 수경], text: "아까 잠깐 앉아 있으라고 하셨을 때도 01이 또 떴어요. 같은 시간에 여기 검사기엔 101이 잡혔고요." }
      - say: { char: 세라, with: [지완], text: "봤어요. 첫 안내가 뜬 뒤에도 제 질문에 바로 대답하셨고요. 두 번 다 제가 본 대로 적으면 내일부터는 직원 확인으로 들어오실 수 있어요." }
      - say: { char: 지완, with: [세라], text: "출입은 그렇고, 저녁에 제 이름 옆에 뜬 건요? 그건 그냥 남아요?" }
      - say: { char: 세라, with: [지완], text: "접수 시간은 남아 있지만 처음 수치는 없어요. 판정에 이의는 내실 수 있어요. 아까도 01 때문에 기다리다 애 데리러 가신 분이 있었어요." }
      - say: { char: 수경, with: [세라], text: "그분 렌즈도 확인해 보고 싶어요. 먼저 연락해서 여쭤봐 주실래요?" }
      - say: { char: 세라, with: [수경], text: "내일 오실 건지 전화해 볼게요. 오늘 건 지완 씨가 원하시면 제가 본 것까지 적어 드리고요." }
      - goto: sign_confirmation

  sign_confirmation:
    title: "확인자"
    actions:
      - say: { char: 세라, with: [수경, 지완], text: "101이 잘렸다는 건 누가 확인해 주시겠어요? 병원 보고서에 이름을 써야 해서요." }
      - say: { char: 수경, with: [세라, 지완], text: "한수경, 한신뉴로 개발팀이요. 처음 병원에 설치할 때도 제가 확인란에 사인했어요." }
      - say: { char: 지완, with: [수경], text: "그때는 앞자리 잘리는 거 모르셨어요?" }
      - say: { char: 수경, with: [지완], text: "제가 끝 두 자리만 보내게 만들었어요. 99가 넘으면 어떻게 되는지 확인 안 하고 검수에 사인했어요. 출입에 쓰이는 것도 알면서요." }
      - say: { channel: action, with: [지완, 수경], text: "수경이 확인서 아래에 회사 이름과 자기 이름을 적는다." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: true }, text: "아까 보신 보고서도 같이 내요. 제가 언제 회사에 알렸는지 거기 나와요." }
      - say: { char: 수경, with: [지완], when: { var: read_report, op: eq, value: false }, text: "회사에 멈춰 달라고 낸 보고서도 있어요. 이거랑 같이 받아 두세요." }
      - get: report
      - say: { char: 세라, with: [지완], text: "아버님이 다시 찾으세요. 제가 문 열어 드릴게요. 서류는 내일 오셔서 정하세요." }
      - goto: second_visit

  second_visit:
    title: "문 열리는 소리"
    actions:
      - bg: { id: ward_bed, transition: fade, duration: 360 }
      - place: "그날 밤 · 308호"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 동식, position: right }
      - say: { char: 동식, with: [지완], text: "일찍 왔었다며." }
      - say: { char: 지완, with: [동식], text: "네. 고등학교 때 렌즈 경보 울려서 실습에서 빠졌잖아요. 아버지 오실 때까지 복도에 앉아 있었던 거 생각났어요." }
      - say: { char: 동식, with: [지완], text: "그날 네 선생도 계속 숫자 얘길 하더라." }
      - say: { char: 지완, with: [동식], text: "아버지는 뭐라고 하셨어요?" }
      - say: { char: 동식, with: [지완], text: "애가 겁먹었으니 나부터 들여보내 달랬지." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: true }, text: "아까 옆에 앉으라 하셨을 때요. 겨우 숨 좀 돌렸어요." }
      - say: { char: 지완, with: [동식], when: { var: told_father, op: eq, value: false }, text: "아까 물부터 드렸죠. 사실 겁났어요. 아버지 못 알아보시면 어떡하나 했어요." }
      - say: { char: 동식, with: [지완], text: "알아봤지. 문 열릴 때마다 너인가 했는데." }
      - say: { char: 지완, with: [동식], text: "내일도 올게요. 문 열리면 제가 먼저 소리 낼게요." }
      - goto: /4.yaml
