            - text: "노기태에게 전화한다"
              goto: tell_gitae
              set: { told_gitae: true }
            - text: "세라에게 먼저 말한다"
              goto: tell_sera
              set: { sera_knows: true }
            - text: "가방에 넣고 집으로 간다"
              goto: keep

