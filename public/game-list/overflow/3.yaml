      - say:
          channel: message
          side: me
          char: 지완
          with: []
          text: "단위가 없습니다 그게 문제입니다"
      - say:
          channel: message
          side: them
          char: 기태
          with: []
          text: "...내일 아침에 와 서류 뗄 거 뗄게"
      - say:
          channel: message
          side: them
          char: 기태
          with: []
          text: "근데 지완아 이거 받으면 나 전출 못 가고 징계야"
      - say:
          channel: message
          side: me
