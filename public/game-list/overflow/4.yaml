chapterTitle: "새 면회증"

script:
  - scene: morning_pass

scenes:
  morning_pass:
    title: "다음 날 아침"
    actions:
      - bg: ward_entry
      - place: "다음 날 아침 · 월계병원 면회 접수"
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 세라, with: [지완], text: "문지완 님은 이 면회증으로 바로 들어가실 수 있어요. 어제 뜬 01도 고치시려면 이의 신청서에 이름 써 주세요." }
      - say: { char: 지완, with: [세라], text: "어제 그냥 가셨다는 분은요? 전화 받으셨어요?" }
      - say: { char: 세라, with: [지완], text: "오고 계신댔어요. 제가 본 건 써 드릴 수 있는데, 저분 기록은 저분이 직접 확인하셔야 해요." }
      - char: { id: 수경, position: center }
      - say: { char: 수경, with: [지완, 세라], text: "병원에 둘이 같이 내면 출입 기준을 다시 봐 달라고 할 수 있어요. 밖에 알리고 싶으시면 지역 기자한테 설명할게요. 어느 쪽이든 자료는 지완 씨 거예요." }
      - say: { channel: action, with: [지완, 수경, 세라], text: "그때 한 여자가 아이 손을 잡고 들어온다. 어제 면회 못 하고 갔다고 이야기하자 세라가 접수표를 찾는다." }
      - choice:
          key: o4_end
          prompt: "새 면회증 옆에 정정 신청서가 놓여 있다."
          with: [수경, 세라]
          options:
            - text: "내 판독과 수경의 설명을 공개한다"
              goto: publish_readings
            - text: "내 기록의 정정을 신청한다"
              goto: correct_record
            - text: "면회 제한 해제를 받고 끝낸다"
              goto: use_new_pass
            - text: "기다린 사람들과 함께 이의를 낸다"
              goto: joint_appeal

  publish_readings:
    title: "뉴스에 나온 이름"
    actions:
      - say: { char: 지완, with: [수경], text: "제 이름하고 제 기록은 공개할게요. 아버지 병실이랑 다른 분들 정보는 빼 주세요." }
      - bg: { id: studio, transition: fade, duration: 600 }
      - place: "3일 뒤 · 지역 뉴스 녹화"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: record, with: [], text: "공개 자료 · 문지완 본인 동의\n같은 시각의 센서 입력 101 / 렌즈 표시 01" }
      - say: { char: 수경, with: [지완], text: "네, 제가 검수한 버전입니다. 여기 보시면 병원에서 찍은 숫자랑 검사기에서 받은 숫자가 다르죠." }
      - say: { char: 지완, with: [수경], text: "그 01 때문에 저는 밖에서 기다렸어요. 아버지한텐 제가 어디 있는지도 늦게 전해졌고요." }
      - bg: { id: wolgye_station, transition: fade, duration: 520 }
      - place: "보도 다음 날 아침 · 월계역"
      - say: { channel: message, side: them, char: 도겸, with: [], text: "팀장님이 뉴스에 지완 씨 맞냐는데요 일단 답 안 했어요" }
      - say: { channel: message, side: me, char: 지완, with: [], text: "저 맞아요. 월요일 새벽조 그대로 간다고 해 주세요" }
      - ending: broadcast

  correct_record:
    title: "기록 두 장"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 지완, with: [세라], text: "어제 제가 몇 시에 왔는지도 적을 수 있어요? 아버지가 제가 늦게 온 줄 아셨어요." }
      - say: { char: 세라, with: [지완], text: "그날 접수한 시간이 남아 있어요. 같이 넣을게요. 결과 나오면 연락드릴 테니 오늘은 이 면회증으로 들어가세요." }
      - say: { channel: card, with: [], text: "이틀 뒤", autoAdvance: 1200 }
      - place: "이틀 뒤 · 월계병원 면회 접수"
      - say: { channel: record, with: [], text: "문지완 · 이의 신청 처리 완료\n‘무반응 의심’ 판정 철회\n첨부: 진단 출력물, 당일 접수 시각 및 직원 확인 기록" }
      - say: { char: 지완, with: [세라], text: "처음에 뜬 것도 한 장 주실래요? 둘 다 아버지한테 갖다 드리려고요." }
      - ending: one_file

  use_new_pass:
    title: "새 면회증"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - say: { char: 지완, with: [세라], text: "오늘은 그냥 들어갈게요. 아버지 점심 전에 봬야 돼서요." }
      - say: { channel: action, with: [], sound: ward_door, text: "지완이 새 면회증을 대자 자동문이 열린다. 어제 받은 표는 주머니에 넣는다." }
      - bg: { id: ward_bed, transition: dissolve, duration: 420 }
      - place: "같은 날 아침 · 308호"
      - char: { id: 동식, position: right }
      - say: { char: 지완, with: [동식], text: "문동식 씨. 아침 드셨어요?" }
      - say: { char: 동식, with: [지완], text: "야. 간호사인 줄 알았다." }
      - say: { channel: action, with: [지완, 동식], text: "아버지가 침대 옆 의자를 발끝으로 밀어 준다. 지완은 가방부터 내려놓는다." }
      - ending: sealed

  joint_appeal:
    title: "같이 내기로 했다"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 지완, with: [세라], text: "어제 저도 저분처럼 기다렸다고 얘기해도 될까요? 신청서 한 장 더 주세요. 원하시면 같이 내 보게요." }
      - say: { channel: action, with: [지완], text: "여자는 어제 접수표를 받아 든다. 자기가 도착한 시간과 그냥 돌아간 시간이 같은 줄에 찍혀 있다." }
      - say: { channel: dialogue, speakerName: "보호자", with: [지완], text: "아빠는 내가 안 온 줄 알아요. 저도 같이 적어도 돼요?" }
      - say: { char: 지완, with: [세라], text: "네. 접수대에서 직접 확인한 다음에 막아 달라고 쓸 거예요. 어제 몇 시까지 기다리셨어요?" }
      - say: { channel: record, with: [], text: "공동 이의신청 접수\n요청: 보호자 출입을 제한하기 전에 직원이 직접 확인할 것.\n신청인 두 명 · 병원 답변 대기" }
      - bg: { id: dongsik_house, transition: fade, duration: 650 }
      - place: "아버지가 퇴원한 뒤 · 일요일 점심"
      - char: { id: 동식, position: right }
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [지완, 동식], text: "지완이 식탁에 그릇을 두 개 놓는다. 아버지가 냉동실에서 작은 통을 꺼내 온다." }
      - say: { char: 동식, with: [지완], text: "반만 얼렸다. 나머진 냄비에." }
      - say: { char: 지완, with: [동식], text: "아버지도 드셔야죠. 그건 넣어 둬요. 제가 데울게요." }
      - ending: appeal
