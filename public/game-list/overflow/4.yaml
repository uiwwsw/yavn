chapterTitle: "새 면회증"

script:
  - scene: morning_pass

scenes:
  morning_pass:
    title: "다음 날 아침"
    actions:
      - bg: ward_entry
      - place: { text: "다음 날 아침 · 월계병원 면회 접수", presentation: center }
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 세라, with: [지완], text: "오늘부터는 이걸로 들어가시면 돼요. 어제 판정은 이의 신청하실 수 있고요." }
      - say: { char: 지완, with: [세라], text: "어제 면회 못 하고 가신 분, 연락은 됐어요?" }
      - say: { char: 세라, with: [지완], text: "네, 지금 오고 계세요." }
      - char: { id: 수경, position: center }
      - say: { char: 수경, with: [지완, 세라], text: "신청서에 제 이름도 적어 주세요. 기기가 왜 잘못 표시했는지는 제가 설명할게요." }
      - say: { channel: action, with: [지완, 수경, 세라], text: "그때 한 여자가 아이 손을 잡고 들어온다. 어제 면회 못 하고 갔다고 이야기하자 세라가 접수표를 찾는다." }
      - choice:
          key: o4_end
          prompt: "새 면회증 옆에 정정 신청서가 놓여 있다."
          with: [수경, 세라]
          options:
            - text: "내 판독과 수경의 설명을 공개한다"
              goto: publish_readings
            - text: "내 기록의 정정을 신청한다"
              goto: correct_record
            - text: "면회 제한 해제를 받고 끝낸다"
              goto: use_new_pass
            - text: "기다린 사람들과 함께 이의를 낸다"
              goto: joint_appeal

  publish_readings:
    title: "뉴스에 나온 이름"
    actions:
      - say: { char: 지완, with: [수경], text: "제 기록은 써도 돼요. 아버지 이름은 빼 주시고요." }
      - bg: { id: studio, transition: fade, duration: 600 }
      - place: { text: "3일 뒤 · 지역 뉴스 녹화", presentation: center }
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: record, with: [], text: "공개 자료 · 문지완 본인 동의\n같은 시각의 센서 입력 101 / 렌즈 표시 01" }
      - say: { char: 수경, with: [지완], text: "네, 제가 검수한 버전입니다. 병실에 들어간 뒤 다시 잰 기록이에요. 검사기는 101을 받았는데 렌즈 화면은 01이었어요." }
      - say: { char: 지완, with: [수경], text: "저는 문 밖에서 기다렸어요. 아버지는 제가 아직 안 온 줄 아셨대요." }
      - bg: { id: wolgye_station, transition: fade, duration: 520 }
      - place: { text: "보도 다음 날 아침 · 월계역", presentation: center }
      - say: { thread: "도겸", channel: message, side: them, char: 도겸, with: [], text: "팀장님이 뉴스에 지완 씨 맞냐는데요 일단 답 안 했어요" }
      - say: { thread: "도겸", channel: message, side: me, char: 지완, with: [], text: "저 맞아요. 월요일 새벽조 그대로 간다고 해 주세요" }
      - ending: broadcast

  correct_record:
    title: "기록 두 장"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 지완, with: [세라], text: "접수한 시간도 같이 적어 주세요. 제가 늦게 온 건 아니었다고요." }
      - say: { char: 세라, with: [지완], text: "네. 접수 기록 확인해서 같이 넣을게요. 결과는 나오는 대로 연락드릴게요." }
      - place: { text: "이틀 뒤 · 월계병원 면회 접수", presentation: center }
      - say: { channel: action, with: [지완, 세라], text: "세라가 처음 받은 접수표 옆에 이의 신청 결과지를 나란히 놓는다." }
      - say: { channel: record, with: [], text: "문지완 · 이의 신청 처리 완료\n‘무반응 의심’ 판정 철회\n첨부: 진단 출력물, 당일 접수 시각 및 직원 확인 기록" }
      - say: { char: 지완, with: [세라], text: "감사합니다. 두 장 다 아버지 보여 드려야겠어요." }
      - ending: one_file

  use_new_pass:
    title: "새 면회증"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - say: { char: 지완, with: [세라], text: "감사합니다. 오늘은 들어가 볼게요." }
      - say: { channel: action, with: [], sound: ward_door, text: "지완이 새 면회증을 대자 자동문이 열린다. 어제 받은 표는 주머니에 넣는다." }
      - bg: { id: ward_bed, transition: dissolve, duration: 420 }
      - place: "같은 날 아침 · 308호"
      - char: { id: 동식, position: right }
      - say: { char: 지완, with: [동식], text: "문동식 씨, 아드님 면회 왔습니다." }
      - say: { char: 동식, with: [지완], text: "야, 네 목소리 알아. 아침부터 어디 갔다 왔냐." }
      - say: { channel: action, with: [지완, 동식], text: "아버지가 침대 옆 의자를 발끝으로 밀어 준다. 지완은 가방부터 내려놓는다." }
      - ending: sealed

  joint_appeal:
    title: "같이 내기로 했다"
    actions:
      - bg: ward_entry
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { char: 지완, with: [세라], text: "신청서 한 장만 더 주시겠어요? 저분이랑 얘기해 보고 올게요." }
      - say: { channel: action, with: [지완], text: "여자는 어제 접수표를 받아 든다. 어제 도착한 시간 옆에 ‘면회 전 귀가’라고 적혀 있다." }
      - say: { channel: dialogue, speakerName: "보호자", with: [지완], text: "저도 같이 내도 될까요? 아버지가 제가 안 온 줄 아셔서요." }
      - say: { char: 지완, with: [세라], text: "네. 여기 제 거 보시고 쓰셔도 돼요." }
      - say: { channel: record, with: [], text: "공동 이의신청 접수\n요청: 보호자 출입을 제한하기 전에 직원이 직접 확인할 것.\n신청인 두 명 · 병원 답변 대기" }
      - bg: { id: dongsik_house, transition: fade, duration: 650 }
      - place: { text: "퇴원 뒤 일요일 점심 · 아버지 집", presentation: center }
      - char: { id: 동식, position: right }
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [지완, 동식], text: "지완이 식탁에 그릇을 두 개 놓는다. 아버지가 냉동실에서 작은 통을 꺼내 온다." }
      - say: { char: 동식, with: [지완], text: "반만 얼렸다. 나머진 냄비에." }
      - say: { char: 지완, with: [동식], text: "앉아 계세요. 오늘은 제가 차릴게요." }
      - ending: appeal
