chapterTitle: "오버플로"

script:
  - scene: monday
  - scene: hayul_comes
  - scene: sera_cafe
  - scene: final

scenes:
  monday:
    title: "월요일"
    actions:
      - bg: { id: office, transition: fade, duration: 700 }
      - place: "2033년 3월 27일 월요일 오전 9시 · 사무소"
      - music: quant
      - char: { id: 도겸, position: right }
      - char: { id: 지완, position: left }
      - say:
          char: 도겸
          with: [지완]
          text: "소장님, 등기 왔어요. 두 통."
      - say:
          char: 지완
          with: [도겸]
          text: "읽어 봐."
      - say:
          char: 도겸
          with: [지완]
          text: "한 통은 한신뉴로 법무팀이고요."
      - say:
          channel: record
          with: []
          text: "내용증명 · 영업비밀 누설 금지 가처분 신청 예고 · 수신 문지완 · 2033.03.27 접수"
      - say:
          char: 도겸
          with: [지완]
          text: "다른 한 통은 건물주요."
      - say:
          channel: record
          with: []
          text: "임대차 계약 갱신 거절 통지 · 성일빌딩 201호 · 계약 종료일 2033.04.30"
      - say:
          char: 도겸
          motion: slump
          with: [지완]
          text: "…이게 같은 날 오는 게 말이 돼요?"
      - say:
          char: 지완
          with: [도겸]
          text: "건물주는 1월부터 얘기했어."
      - say:
          char: 도겸
          with: [지완]
          text: "그 얘기 저한테 안 하셨잖아요."
      - say:
          char: 지완
          with: [도겸]
          text: "4월에 보험사 건 들어오면 해결되는 거였어."
      - say:
          char: 도겸
          with: [지완]
          text: "그 보험사 건 지금 어떻게 됐어요?"
      - say:
          char: 지완
          with: [도겸]
          text: "…지난주 금요일에 취소됐어."
      - say:
          char: 도겸.wide
          with: [지완]
          text: "소장님."
      - say:
          char: 지완
          with: [도겸]
          text: "응."
      - say:
          char: 도겸
          with: [지완]
          text: "저 월급 안 받아도 돼요. 삼 개월 정도는."
      - say:
          char: 지완
          with: [도겸]
          text: "안 돼."
      - say:
          char: 도겸
          with: [지완]
          text: "아니 제 말은—"
      - say:
          char: 지완
          with: [도겸]
          text: "안 돼. 네가 그러면 내가 네 형한테 할 말이 없어."
      - say:
          char: 도겸
          motion: freeze
          with: [지완]
          text: "…우리 형 얘기 왜 꺼내세요."
      - say:
          char: 지완
          with: [도겸]
          text: "네가 먼저 꺼냈어. 저번 주에."
      - say:
          char: 도겸
          with: [지완]
          text: "…그러네."
      - say:
          char: 지완
          with: [도겸]
          text: "도겸아, 네 계정으로 뭐 해 보자는 생각은 하지 마라."
      - say:
          char: 도겸
          motion: startle
          with: [지완]
          text: "어떻게 아셨어요."
      - say:
          char: 지완
          with: [도겸]
          text: "어제 네가 '소장님 혹시 B1 출입카드 보신 적' 하고 지웠잖아."
      - say:
          char: 도겸
          with: [지완]
          text: "…그거 보셨구나."
      - say:
          char: 지완
          with: [도겸]
          text: "하지 마. 그쪽이 제일 원하는 그림이야."
      - say:
          char: 지완
          with: [도겸]
          text: "원본을 훔쳤다고 하면 원본 얘기가 아니라 도둑 얘기가 돼."
      - say:
          char: 도겸
          motion: nod
          with: [지완]
          text: "…네."
      - say:
          channel: system
          with: []
          text: "메시지 · 오전 9:40"
      - say:
          channel: message
          side: them
          char: 기태
          when: { var: told_gitae, op: eq, value: true }
          with: []
          text: "지완아 어제 서류 올렸어 부장이 세 번 물어봤다"
      - say:
          channel: message
          side: them
          char: 기태
          when: { var: told_gitae, op: eq, value: true }
          with: []
          text: "일단 접수는 됐어 다음은 검찰이야"
      - say:
          channel: message
          side: them
          char: 기태
          when: { var: told_gitae, op: eq, value: false }
          with: []
          text: "야 노원 거 어떻게 됐냐 나 다음주 전출이다"
      - say:
          channel: message
          side: them
          char: 기태
          when: { var: told_gitae, op: eq, value: false }
          with: []
          text: "뭐 들고 오려면 이번주 안에 와"
      - say:
          channel: message
          side: them
          char: 수경
          with: []
          text: "오늘 오전에 출력 이력 감사가 돌았습니다. 제 이름이 떴습니다."
      - say:
          channel: message
          side: them
          char: 수경
          with: []
          text: "금요일에 징계위가 열립니다. 그 전에 결정하세요."
      - say:
          channel: message
          side: me
          char: 지완
          with: []
          text: "뭘 결정합니까"
      - say:
          channel: message
          side: them
          char: 수경
          with: []
          text: "그 종이를 혼자 들고 계실지요."

  hayul_comes:
    title: "찾아온 손님"
    actions:
      - place: "같은 날 오후 4시 10분 · 사무소"
      - char: { id: 하율, position: center }
      - say:
          char: 도겸
          with: [지완, 하율]
          text: "소장님, 애가 왔는데요."
      - say:
          char: 지완
          with: [하율]
          text: "…하율아."
      - say:
          char: 하율
          with: [지완]
          text: "안녕하세요."
      - say:
          char: 지완
          with: [하율]
          text: "여기 어떻게 왔어."
      - say:
          char: 하율
          with: [지완]
          text: "할아버지 책상에 아저씨 명함 있었어요. 147번 타고 왔어요."
      - say:
          char: 지완
          with: [하율]
          text: "147번은 여기 안 와."
      - say:
          char: 하율
          with: [지완]
          text: "알아요. 갈아탔어요. 두 번."
      - say:
          char: 도겸
          with: [하율]
          text: "야, 대단하다. 너 몇 학년이야?"
      - say:
          char: 하율
          with: [도겸]
          text: "3학년이요. 근데 저 반말 싫어해요."
      - say:
          char: 도겸.wide
          with: [하율]
          text: "…죄송합니다."
      - say:
          char: 하율
          with: [지완]
          text: "아저씨."
      - say:
          char: 지완
          with: [하율]
          text: "응."
      - say:
          char: 하율
          with: [지완]
          text: "할아버지가 또 경찰서 간대요."
      - say:
          char: 지완
          with: [하율]
          text: "…"
      - say:
          char: 하율
          with: [지완]
          text: "지난번에 갔을 때는 하루 만에 왔는데, 이번엔 오래 걸릴 수도 있대요."
      - say:
          char: 지완
          with: [하율]
          text: "누가 그래."
      - say:
          char: 하율
          with: [지완]
          text: "할아버지가요. 밥솥에 쌀 두 컵 해 놓고 나가면서."
      - say:
          char: 지완.tight
          with: [하율]
          text: "…"
      - say:
          char: 하율
          with: [지완]
          text: "아저씨가 숫자 틀렸다고 써 주는 사람이라고 했잖아요."
      - say:
          char: 지완
          with: [하율]
          text: "그랬지."
      - say:
          char: 하율
          with: [지완]
          text: "그럼 할아버지 숫자도 틀린 거예요?"
      - say:
          char: 지완
          with: [하율]
          text: "…틀렸어."
      - say:
          char: 하율
          motion: perk
          with: [지완]
          text: "그럼 고치면 할아버지 안 가도 되는 거예요?"
      - say:
          char: 지완
          with: [하율]
          text: "…"
      - say:
          char: 하율
          with: [지완]
          text: "아저씨."
      - say:
          char: 지완
          with: [하율]
          text: "하율아."
      - say:
          char: 하율
          with: [지완]
          text: "네."
      - say:
          char: 지완
          with: [하율]
          text: "숫자를 고치면 할아버지는 더 오래 갈 수도 있어."
      - say:
          char: 하율
          motion: headtilt
          with: [지완]
          text: "왜요?"
      - say:
          char: 지완
          with: [하율]
          text: "지금은 할아버지가 아무것도 안 느낀 사람으로 적혀 있거든."
      - say:
          char: 하율
          with: [지완]
          text: "할아버지 아무것도 안 느끼는데요."
      - say:
          char: 지완
          motion: freeze
          with: [하율]
          text: "…어?"
      - say:
          char: 하율
          with: [지완]
          text: "할머니 아플 때도 안 울었어요. 저는 울었는데."
      - say:
          char: 하율
          with: [지완]
          text: "근데 할아버지는 안 자고 계속 앉아 있었어요. 그건 느끼는 거예요?"
      - say:
          char: 지완.break
          with: [하율]
          text: "…그건 느끼는 거야."
      - say:
          char: 하율
          with: [지완]
          text: "그럼 왜 숫자에 안 나와요?"
      - say:
          char: 지완
          with: [하율]
          text: "…"
      - say:
          char: 도겸
          with: [하율]
          text: "저기, 하율 학생. 집에 데려다 드릴게요. 버스비 있으세요?"
      - say:
          char: 하율
          with: [도겸]
          text: "있어요. 근데 아저씨 돈 없다면서요."
      - say:
          char: 도겸
          motion: slump
          with: [하율]
          text: "…그걸 어디서 들었어요."
      - say:
          char: 하율
          with: [도겸]
          text: "아까 아저씨가 전화로 말했어요. 월급 안 받아도 된다고."
      - say:
          char: 지완
          with: [도겸]
          text: "데려다줘. 택시 타고. 영수증 가져와."
      - say:
          char: 도겸
          with: [지완]
          text: "네."
      - say:
          char: 하율
          with: [지완]
          text: "아저씨, 할아버지한테 말하지 마세요. 저 여기 온 거."
      - say:
          char: 지완
          with: [하율]
          text: "알았어."
      - say:
          char: 하율
          with: [지완]
          text: "진짜예요. 할아버지 걱정 많이 해요."
      - move: { id: 하율, style: exit, wait: true }
      - move: { id: 도겸, style: exit, wait: true }

  sera_cafe:
    title: "카페"
    actions:
      - bg: { id: cafe, transition: dissolve, duration: 800 }
      - place: "2033년 3월 29일 수요일 오후 2시 · 상계동"
      - music: lowscore
      - char: { id: 세라, position: right }
      - char: { id: 지완, position: left }
      - say:
          char: 세라
          with: [지완]
          text: "나 디카페인. 너는?"
      - say:
          char: 지완
          with: [세라]
          text: "같은 걸로."
      - say:
          char: 세라.joke
          with: [지완]
          text: "너 디카페인 싫어했잖아."
      - say:
          char: 지완
          with: [세라]
          text: "싫어해."
      - say:
          char: 세라
          with: [지완]
          text: "그럼 왜 같은 걸 시켜."
      - say:
          char: 지완
          with: [세라]
          text: "두 번 말하기 귀찮아서."
      - say:
          char: 세라
          with: [지완]
          text: "…너 진짜 하나도 안 변했다."
      - say:
          char: 세라
          with: [지완]
          text: "재판독 결과 나왔어."
      - say:
          char: 지완
          with: [세라]
          text: "몇."
      - say:
          char: 세라
          with: [지완]
          text: "31이랑 36. 2점 3점 올랐어."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "어머니가 그러시더라. '그래도 올랐네'."
      - say:
          char: 세라
          with: [지완]
          text: "나는 그 말이 제일 싫었어."
      - say:
          char: 지완
          with: [세라]
          text: "왜."
      - say:
          char: 세라
          with: [지완]
          text: "올랐다는 건 전에는 낮았다는 거잖아."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "그래서 네가 전화로 한 얘기."
      - say:
          char: 지완
          with: [세라]
          text: "응."
      - say:
          char: 세라
          with: [지완]
          text: "그거 공개하면 내 29도 없어지는 거야?"
      - say:
          char: 지완
          with: [세라]
          text: "없어져. 전부 다."
      - say:
          char: 세라
          with: [지완]
          text: "96.7도?"
      - say:
          char: 지완
          with: [세라]
          text: "…응."
      - say:
          char: 세라.drop
          with: [지완]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "야."
      - say:
          char: 지완
          with: [세라]
          text: "응."
      - say:
          char: 세라
          with: [지완]
          text: "나 그 사람 좋아해. 그건 알지."
      - say:
          char: 지완
          with: [세라]
          text: "알아."
      - say:
          char: 세라
          with: [지완]
          text: "근데 그 집에서 96.7 빼면 뭐가 남는지 나도 몰라."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "어머니가 처음 만난 날 그 숫자부터 보셨거든."
      - say:
          char: 세라
          with: [지완]
          text: "나보다 먼저."
      - move: { id: 세라, toward: 지완, style: approach }
      - say:
          char: 세라
          with: [지완]
          text: "지완아. 31.2 때 내가 왜 헤어졌는지 물었잖아."
      - say:
          char: 지완
          with: [세라]
          text: "응."
      - say:
          char: 세라
          with: [지완]
          text: "네가 그때 나한테 '그 숫자 맞는 것 같다'고 했어."
      - say:
          char: 지완.break
          with: [세라]
          text: "…"
      - say:
          char: 세라
          with: [지완]
          text: "기억 안 나지."
      - say:
          char: 지완
          with: [세라]
          text: "…안 나."
      - say:
          char: 세라
          with: [지완]
          text: "나는 칠 년 동안 그 말만 생각했어."
      - say:
          char: 세라
          with: [지완]
          text: "네가 나를 안 좋아한 게 아니라, 네가 너를 안 믿은 거였잖아."
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라
          motion: sigh
          with: [지완]
          text: "아, 그거 됐고."
      - move: { id: 세라, style: reset }
      - say:
          char: 세라
          with: [지완]
          text: "할 거면 해. 나한테 허락받지 말고."
      - say:
          char: 지완
          with: [세라]
          text: "너한테 손해야."
      - say:
          char: 세라
          with: [지완]
          text: "손해 보는 쪽 서류를 네가 칠 년을 썼잖아."
      - say:
          char: 세라
          with: [지완]
          text: "그 사람들한테는 괜찮고 나한테는 안 괜찮아?"
      - say:
          char: 지완
          with: [세라]
          text: "…"
      - say:
          char: 세라.joke
          with: [지완]
          text: "말 못 하겠지. 커피 식는다."

  final:
    title: "4월 2일"
    actions:
      - bg: { id: office_night, transition: dissolve, duration: 900 }
      - place: "2033년 4월 2일 토요일 오후 6시 · 사무소"
      - music: overflow
      - char: { id: 지완, position: left }
      - say:
          channel: system
          with: []
          text: "메시지 · 오후 5:52"
      - say:
          channel: message
          side: them
          char: 수경
          with: []
          text: "징계위 끝났습니다. 해고입니다."
      - say:
          channel: message
          side: them
          char: 수경
          with: []
