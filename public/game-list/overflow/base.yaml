inventory:
  appeal_form:
    name: "재측정 이의신청서"
    description: "문지완의 여덟 번째 신청. 표에는 7년째 전 항목 1. 고객 상담 업무에서 배제된 판정의 근거를 요청했다."
    image: assets/items/appeal_form.svg
    category: "서류"
    order: 10
  lunchbox:
    name: "초록색 도시락통"
    description: "뚜껑 안쪽에 희남이 먹을 수 있었던 반찬이 적혀 있다. 마지막 줄은 ‘3월 7일 · 한 숟갈’."
    image: assets/items/lunchbox.svg
    category: "증거"
    order: 20
  recorder:
    name: "협탁 녹음기"
    description: "오희남의 병실용 녹음기. 파일 119개. 1번은 2031년 5월, 마지막은 2033년 3월 6일."
    image: assets/items/recorder.svg
    category: "증거"
    order: 30
  pill_bag:
    name: "날짜가 적힌 약봉지"
    description: "3월 6일자 약봉지. 뒷면에 다음 진료 때 통증을 직접 설명하겠다는 희남의 메모가 있다."
    image: assets/items/pill_bag.svg
    category: "증거"
    order: 40
  raw_print:
    name: "원본 로그 출력물"
    description: "배동식의 3월 7일 판독. 분노 원본 103 → 표시 3, 죄책감 원본 100 → 표시 0. 수사기관 제출 동의를 받았다."
    image: assets/items/raw_print.svg
    category: "증거"
    order: 50
