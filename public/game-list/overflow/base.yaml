inventory:
  appeal_form:
    name: "재측정 이의신청서"
    description: "문지완 본인 건. 2033년 3월 20일 접수, 여덟 번째. 판정 지수 칸에 1이 세 개."
    image: assets/items/appeal_form.svg
    category: "서류"
    order: 10
  lunchbox:
    name: "초록색 도시락통"
    description: "뚜껑 안쪽에 유성펜으로 날짜. 마지막 줄이 3월 7일이다. 배동식이 20년을 쓴 통."
    image: assets/items/lunchbox.svg
    category: "증거"
    order: 20
  recorder:
    name: "협탁 녹음기"
    description: "오희남의 병실용 녹음기. 파일 119개. 1번은 2031년 5월, 마지막은 2033년 3월 6일."
    image: assets/items/recorder.svg
    category: "증거"
    order: 30
  pill_bag:
    name: "날짜가 적힌 약봉지"
    description: "하율이 접어서 모아 둔 진통제 봉지. 마지막 봉지에 2033. 03. 06. 그날 치가 남아 있다."
    image: assets/items/pill_bag.svg
    category: "증거"
    order: 40
  raw_print:
    name: "원본 로그 출력물"
    description: "환산 전 값. 사랑 20002, 슬픔 30001, 죄책감 10001. 같은 줄의 환산 후 값은 2, 1, 1이다."
    image: assets/items/raw_print.svg
    category: "증거"
    order: 50
