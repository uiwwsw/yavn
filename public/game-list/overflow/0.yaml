chapterTitle: "보호자 한 분"

script:
  - scene: morning_train

scenes:
  morning_train:
    title: "출근길"
    actions:
      - bg: wolgye_station
      - place: "2033년 10월 · 월계역"
      - music: quant
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [지완], camera: wide, text: "출근길, 월계역 개찰구 앞에서 문지완의 장갑이 떨어진다." }
      - bg: station_glove
      - say: { channel: record, with: [], text: "에모스 렌즈 · 감정 판독\n문지완 · 안정 24\n안경 쓴 여자 · 안정 31" }
      - bg: { id: wolgye_station, transition: dissolve, duration: 240 }
      - char: { id: 수경, position: right }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "저기요. 장갑이요." }
      - say: { char: 지완, with: [수경], text: "고맙습니다." }
      - move: { id: 수경, style: exit }
      - camera: medium
      - sound: call
      - choice:
          key: o0_call
          prompt: "오전 7:42 · 지완의 휴대폰에 ‘아버지’가 뜬다."
          with: [지완]
          options:
            - text: "전화를 받는다"
              goto: take_call
            - text: "문자로 답한다"
              goto: text_back

  take_call:
    actions:
      - set: { picked_up: true }
      - char: { id: 지완, position: left }
      - say: { char: 지완, with: [지완], text: "여보세요, 아버지." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "야, 국 냄비째 얼려도 되냐?" }
      - say: { char: 지완, channel: dialogue, with: [지완], text: "작은 통 있잖아요. 거기 나눠 담아요. 얼면 안 빠져요." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "일요일에 올 거지?" }
      - say: { char: 지완, channel: dialogue, with: [지완], text: "점심 먹고 갈게요. 국은 반만 얼려요." }
      - wait: 0
      - goto: platform

  text_back:
    actions:
      - wait: 0
      - say: { char: 지완, channel: message, side: me, with: [], text: "지금 지하철 타요. 이따 전화할게요" }
      - say: { char: 동식_연락처, channel: message, side: them, with: [], text: "국 끓여 놨다 냄비째 얼려 두면 되냐" }
      - say: { char: 지완, channel: message, side: me, with: [], text: "반만 얼려요 작은 통에" }
      - goto: platform

  platform:
    title: "노란 선"
    actions:
      - bg: wolgye_station
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { channel: action, with: [지완, 도겸], camera: wide, text: "같은 근무조 도겸이 개찰구 쪽을 가리킨다. 한 남자가 문에 낀 휠체어 바퀴를 빼고 있다." }
      - say: { channel: record, with: [], text: "역사 안전 경보\n흥분 94 · 직원 호출" }
      - say: { channel: action, with: [], text: "역무원 둘이 달려온다. 남자가 손잡이에서 손을 떼자 휠체어에 앉은 노인이 그에게 팔을 뻗는다." }
      - say: { char: 도겸, with: [지완], text: "저분 바퀴 빼 주던 거 같은데요." }
      - say: { channel: action, with: [], text: "렌즈가 다시 울린다. 도겸은 노란 선 앞에서 멈춘다." }
      - say: { channel: record, with: [], text: "월계역 대합실 전광판\n안전 모드 도입 후 역사 내 폭행 신고 18건 → 7건\n같은 기간 전년 대비 · 서울교통공사" }
      - say: { char: 도겸, with: [지완], text: "지난겨울에 여기서 역무원이 사람 잡은 거 기억나요? 우리 엄만 그 뒤로 여기서만 타요." }
      - say: { channel: action, with: [], text: "역무원이 옆 통로를 열어 준다. 남자는 노인이 지나갈 때까지 기다렸다가 묻는다. “직장에도 연락이 갑니까?”" }
      - say: { channel: thought, with: [], text: "내 기록은 나보다 먼저 학교에 갔다." }
      - goto: father_lesson

  father_lesson:
    title: "현관에서"
    actions:
      - bg: { id: dongsik_house, transition: fade, duration: 560 }
      - place: "6년 전 · 실습 배정 전날 · 아버지 집"
      - music: lowscore
      - char: { id: 동식, position: right }
      - say: { channel: record, with: [], text: "문지완 · 안전 면담 확인\n경보 3회 · 현장 실습 배정 보류" }
      - say: { channel: action, with: [], text: "아버지가 현관에 걸린 교복 주머니에서 구겨진 확인서를 꺼낸다. 그 아래엔 한 번도 신지 않은 작업화가 있다." }
      - say: { char: 동식, with: [], text: "지완아, 밖에서 표정 좀 살펴. 학교에서 또 연락 오면 너 실습 못 나가." }
      - say: { char: 동식, with: [], text: "뭐라고 하기 전에 문부터 봐. 나갈 수 있으면 나가. 못 나가면 셋 세고." }
      - say: { char: 지완, with: [동식], text: "아버지, 지금 나가요?" }
      - say: { char: 동식, with: [], text: "학교 간다. 넌 내일 갈 가방 싸 놔." }
      - say: { channel: action, with: [], text: "지완은 가방을 다 싸고도 작업화는 신발장에 넣어 두었다. 아버지는 어두워지고 나서야 돌아왔다." }
      - goto: shift

  shift:
    title: "두 번째 전화"
    actions:
      - bg: { id: office, transition: fade, duration: 520 }
      - place: "2033년 10월 · 그날 오후 · 물류 사무실"
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { channel: action, with: [지완, 도겸], sound: call, text: "휴대폰에 다시 ‘아버지’가 뜬다." }
      - say: { char: 지완, with: [지완], text: "네, 아버지?" }
      - say: { channel: dialogue, speakerName: "반찬집 아주머니 (통화)", with: [지완], text: "지완 씨, 반찬집이에요. 아버님이 쓰러지셔서 월계병원으로 갔어요. 이리 좀 와요." }
      - say: { channel: thought, with: [지완], wait: 800, text: "문이 어디 있지." }
      - say: { char: 도겸, with: [지완], text: "지완 씨, 출입증요. 뒷주머니에 있잖아요. 택시는 제가 부를게요." }
      - goto: admission

  admission:
    title: "반응 부족"
    actions:
      - bg: { id: ward_entry, transition: fade, duration: 500 }
      - place: "그날 저녁 · 월계병원 신경과 면회 접수"
      - music: lowscore
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [], text: "간호사가 접수창을 연다. “문동식 환자분 아드님이시죠? 들어가시면 아버님 이름부터 불러 보세요.”" }
      - say: { char: 지완, with: [], text: "네. 제 목소리는 아실 거예요." }
      - say: { channel: action, with: [], sound: ward_door, text: "접수대 옆 자동문이 반쯤 열리다 멎는다." }
      - sound: read
      - say: { channel: record, with: [], wait: 850, text: "에모스 · 보호자 면회 확인\n정서 반응 01 · 무반응 의심\n직원 동행 면회만 가능" }
      - say: { channel: action, with: [], text: "시트가 든 카트를 밀던 직원이 단말기와 지완의 얼굴을 번갈아 본다." }
      - say: { char: 지완, with: [], text: "잠깐만요. 안에서 제 이름 부른 거 같은데, 못 들어가요?" }
      - say: { channel: action, with: [], text: "교대할 간호사가 올 때까지 기다리라고 한다. 지완이 속으로 셋을 세는데, 건너편에 아침에 장갑을 주워 준 여자가 앉아 있다." }
      - get: appeal_form
      - goto: across_the_hall

  across_the_hall:
    title: "건너편 의자"
    pov: "안경 쓴 여자"
    layout: fixed
    actions:
      - place: "같은 시각 · 접수대 건너편"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: thought, char: 수경, speakerName: "안경 쓴 여자", with: [지완], camera: wide, text: "월계역에서 장갑 떨어뜨린 사람. 저 사람 화면에도 01이 떴다." }
      - say: { channel: record, with: [], text: "받은 메시지\n결함 보고서 쓴 계정까지 정지됐어요. 인사팀에서 해고 통지 보냈고요. 보안팀 두 명이 출입구에 있어요." }
      - say: { channel: record, with: [], text: "보낸 메시지\n01 뜬 분을 봤어요. 접수대에서." }
      - say: { channel: record, with: [], text: "받은 메시지\n01만 봐서는 같은 오류인지 몰라요. 당사자가 원하지 않으면 붙잡지 마세요. 제발." }
      - say: { channel: action, with: [], text: "가방에 넣어 온 보고서에는 아직 ‘현장에서 다시 확인하지 못함’이라고 적혀 있다." }
      - say: { channel: action, with: [지완, 수경], camera: wide, text: "남자는 빈 물병을 들고 1층으로 내려간다. 나도 보고서를 들고 일어난다." }
      - goto: /1.yaml
