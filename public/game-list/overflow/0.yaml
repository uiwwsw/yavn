chapterTitle: "말을 받지 않는 곳"

script:
  - scene: first_reading
  - scene: kitae

scenes:
  first_reading:
    title: "불기소 통지"
    actions:
      - bg: office
      - place: "2033년 3월 20일 · 상계동 이의신청 사무소"
      - music: quant
      - say: { channel: record, with: [], text: "3월 7일 신고 녹취 · 배동식\n“제 아내가 죽었습니다. 제가 했습니다.”" }
      - say: { channel: record, with: [], text: "3월 19일 불기소 통지 · 배동식\n분노 3 · 죄책감 0. 정서 기준 미달로 진술 신빙성 불인정." }
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { char: 도겸, with: [지완], text: "본인이 했다고 전화까지 했는데, 검사한테는 저 종이가 더 확실하대요?" }
      - say: { char: 지완, with: [도겸], text: "에모스 판독표야. 우리한텐 이거 한 장이면 사람 자를 수도 있어." }
      - say: { char: 도겸, with: [지완], text: "소장님도 이거 때문에 그만두신 거예요?" }
      - sound: read
      - say: { channel: record, with: [], text: "문지완 · 재측정 결과\n사랑 1 · 연민 1 · 슬픔 1 · 분노 1 · 불안 1 · 기쁨 1" }
      - say: { char: 도겸, with: [지완], text: "일곱 번째랑 같네요." }
      - get: appeal_form
      - say: { char: 지완, with: [도겸], text: "여덟 번째는 내가 냈어. 연민 1이라고 고객 상담에서 뺀 게 7년 전인데, 아직 사유 한 줄을 안 알려 주네." }
      - say: { char: 도겸, with: [지완], text: "김옥분 어르신 것도 반려 왔어요. 남편분 돌아가셨는데 슬픔 점수가 낮아서, 유족 상담 지원은 못 받는대요." }
      - say: { char: 지완, with: [도겸], text: "서류 돌려 드리지 말고 책상 위에 둬. 오늘 내가 전화할게." }

  kitae:
    title: "신고한 사람"
    actions:
      - char: { id: 기태, position: right }
      - say: { char: 기태, with: [지완], text: "그 통지서 내가 보냈어. 배동식 씨가 두 번 찾아왔거든. 자기가 한 말을 기록에서 왜 뺐냐고." }
      - say: { char: 지완, with: [기태], text: "다시 불러서 들으시면 되잖아요." }
      - say: { char: 기태, with: [지완], text: "검사가 문을 닫았어. 판독표가 잘못됐다는 근거라도 있어야 다시 열지." }
      - say: { char: 기태, with: [지완], text: "동식 씨한테 네 번호 줘도 되냐. 피해자 이름은 오희남. 그 집에 가면 그 이름부터 불러 줘." }
      - choice:
          key: o0_case
          prompt: "기태에게 무엇을 부탁할까?"
          char: 지완
          with: [기태]
          options:
            - text: "배동식 씨 연락처를 받는다"
              goto: take
            - text: "신고 녹취부터 다시 듣는다"
              goto: hedge

  take:
    actions:
      - say: { char: 지완, with: [기태], text: "제가 전화하겠습니다. 진술을 고칠 사람이 아니라, 들을 사람이라고 전해 주세요." }
      - goto: call

  hedge:
    actions:
      - say: { channel: record, with: [], text: "신고 녹취 계속 · 배동식\n“잠시만요. 아내 이름 안 물으셨어요. 오희남입니다.”" }
      - say: { char: 지완, with: [기태], text: "뒤에 이 말도 있었네요. 주소 좀 주세요." }
      - goto: call

  call:
    title: "장위삼거리"
    actions:
      - say: { channel: message, side: me, char: 지완, with: [], text: "문지완입니다. 오희남 씨 일로 내일 잠깐 뵐 수 있을까요." }
      - say: { channel: message, side: them, char: 동식, with: [], text: "147번 타고 장위삼거리에서 내리십시오 종점까지 가시면 돌아와야 됩니다" }
      - say: { channel: message, side: them, char: 동식, with: [], text: "제가 무슨 말을 했는지 적어 두십니까" }
      - say: { channel: message, side: me, char: 지완, with: [], text: "네. 적기 전에 여쭤보겠습니다." }
      - goto: /1.yaml
