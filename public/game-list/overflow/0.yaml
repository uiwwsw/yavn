chapterTitle: "아버지한테 전화가 왔다"

script:
  - scene: world_before

scenes:
  world_before:
    title: "팔 년"
    actions:
      - bg: hansin_lobby
      - place: { text: "2025년 3월", presentation: center }
      - music: quant
      - say: { channel: narration, with: [], text: "2025년 봄, 한신뉴로라는 회사가 안경 하나를 내놓았다. 이름은 에모스. 쓰고 사람을 보면 그 얼굴 옆에 숫자가 떴다. 0부터 100까지." }
      - say: { channel: narration, with: [], text: "처음에는 장난감이었다. 소개팅 자리에서 상대의 숫자를 몰래 찍은 영상이 돌았고, 사람들은 웃었다." }
      - bg: { id: studio, transition: fade, duration: 420 }
      - place: { text: "2025년 12월", presentation: center }
      - say: { channel: narration, with: [], text: "그해 겨울 부산의 지하철 승강장에서, 렌즈를 쓴 역무원이 한 남자의 팔을 잡았다. 남자 옆에 뜬 숫자는 97이었다. 가방에서 칼이 나왔다." }
      - say: { channel: narration, with: [], text: "이듬해 봄에는 요양병원에서 영상 하나가 올라왔다. 딸을 삼 년째 못 알아보던 노인이 딸 앞에서 61을 띄웠다. 딸은 그 숫자를 찍어 놓고 한참 울었다." }
      - say: { channel: narration, with: [], text: "말로 못 하는 것을 숫자가 대신 말해 준다고들 했다. 응급실이 렌즈를 들였고, 학교가 들였고, 역마다 개찰구에 달렸다." }
      - place: { text: "2027년", presentation: center }
      - say: { channel: narration, with: [], text: "반대하는 사람도 있었다. 한 철학과 교수는 신문에 이렇게 썼다. ‘렌즈가 재는 것은 얼굴이다. 마음을 재는 기계는 아직 아무도 만들지 못했다.’" }
      - say: { channel: narration, with: [], text: "인권위는 면접장에서 렌즈를 벗으라고 권고했다. 조사 위원들은 틀린 판독을 찾아 전국을 돌았다." }
      - say: { channel: narration, with: [], text: "못 찾았다. 97이 뜬 사람은 정말로 무슨 짓을 하려던 사람이었고, 61이 뜬 노인은 딸이 손을 잡자 그 손을 놓지 않았다." }
      - say: { channel: record, with: [], sound: read, text: "에모스 연례 검증 보고 · 2032\n현장 판독 오류 0건 · 8년 연속" }
      - say: { channel: narration, with: [], text: "교수는 2030년에 연재를 접었다. 마지막 칼럼의 끝 문장은 이랬다. ‘틀리지 않는 것과 싸우는 법을 나는 모른다.’" }
      - bg: { id: ward_entry, transition: fade, duration: 420 }
      - place: { text: "2033년", presentation: center }
      - say: { channel: narration, with: [], text: "이제 렌즈는 쓴 사람도 읽는다. 눈가와 관자놀이에서. 병원 문과 역 개찰구는 그 숫자를 받아 열린다. 100에 가까우면 ‘흥분’, 0에 가까우면 ‘무반응’이다." }
      - say: { channel: narration, with: [], text: "높은 숫자가 뜨면 사람이 달려와 묻는다. 낮은 숫자가 뜨면 문이 닫힌다." }
      - goto: station_arrival

  station_arrival:
    title: "아침 전화"
    actions:
      - bg: wolgye_station
      - place: "2033년 10월 · 오전 7시 42분 · 월계역"
      - music: quant
      - char: { id: 지완, position: left }
      - sound: call
      - say: { channel: action, with: [지완], text: "문지완이 개찰구를 지난다. 아버지에게 전화가 온다." }
      - choice:
          key: o0_call
          prompt: "아버지에게서 온 전화다."
          with: [지완]
          options:
            - text: "전화를 받는다"
              goto: answered_call
            - text: "문자로 답한다"
              goto: phone_reply

  answered_call:
    actions:
      - set: { picked_up: true }
      - say: { char: 지완, with: [지완], text: "여보세요, 아버지." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "야, 국 냄비째 얼려도 되냐? 네 거 빼 놨는데." }
      - say: { char: 지완, with: [지완], text: "작은 통에 담아요. 냄비째 넣으면 안 빠져요." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "일요일에 올 거지?" }
      - say: { char: 지완, with: [지완], text: "네, 제 건 반만 얼려요. 아버지도 좀 드시고요." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "파는 먹을 때 넣어라." }
      - goto: dropped_glove

  phone_reply:
    actions:
      - set: { picked_up: false }
      - say: { thread: "동식_연락처", char: 지완, channel: message, side: me, with: [], text: "출근 중이에요 이따 전화할게요" }
      - say: { thread: "동식_연락처", char: 동식_연락처, channel: message, side: them, with: [], text: "네 거 국 빼 놨다. 냄비째 얼려도 되냐" }
      - say: { thread: "동식_연락처", char: 지완, channel: message, side: me, with: [], text: "반만 얼려요 작은 통에. 일요일에 갈게요" }
      - goto: dropped_glove

  dropped_glove:
    title: "개찰구"
    actions:
      - bg: station_glove
      - say: { channel: action, with: [], text: "휴대폰을 주머니에 넣을 때 작업 장갑 한 짝이 발밑에 떨어진다." }
      - bg: { id: wolgye_station, transition: dissolve, duration: 220 }
      - char: { id: 수경, position: right }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "저기요. 장갑 떨어뜨리셨어요." }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "혹시 월계병원이 어느 쪽인지 아세요?" }
      - say: { char: 지완, with: [수경], text: "2번 출구요. …아, 감사합니다." }
      - move: { id: 수경, style: exit }
      - char: { id: 도겸, position: right }
      - say: { char: 도겸, with: [지완], text: "지완 씨, 이쪽으로 와요. 저기는 휠체어가 걸렸나 봐요." }
      - say: { channel: action, with: [], text: "남자가 개찰구에 낀 휠체어를 들어 올린다. 지완의 감정 판독 렌즈가 남자 얼굴 옆에 경고를 띄운다." }
      - say: { channel: record, with: [], sound: read, text: "에모스 렌즈 · 역사 안전 경보\n흥분 94 · 역무원 호출" }
      - say: { channel: action, with: [], text: "역무원이 달려와 남자 앞을 막는다. 휠체어의 노인이 돌아본다. “저분이 저 도와주신 건데요.”" }
      - goto: station_alert

  station_alert:
    title: "역무원이 오면"
    actions:
      - say: { char: 도겸, with: [지완], text: "그래도 저거 있어서 다행이긴 해요. 지난겨울엔 우리 엄마 밀친 사람도 잡았거든요." }
      - say: { char: 지완, with: [도겸], text: "저분은 도와준 건데요." }
      - say: { char: 도겸, with: [지완], text: "숫자가 틀린 건 아니잖아요. 저 아저씨 지금 진짜 열 받았을걸요. 휠체어는 무겁지, 뒤에서는 밀지." }
      - say: { char: 도겸, with: [지완], text: "역무원이 들어 보면 풀리잖아요. 지완 씨는 저거 울려 본 적 없죠?" }
      - say: { char: 지완, with: [도겸], text: "고등학교 때 한 번요. 렌즈 처음 들어온 해에." }
      - say: { char: 도겸, with: [지완], text: "에이, 지완 씨가요?" }
      - say: { channel: thought, with: [도겸], text: "하나, 둘, 셋." }
      - say: { char: 지완, with: [도겸], text: "네. 그 뒤로 세고 말해요. 셋까지." }
      - say: { char: 도겸, with: [지완], text: "아…… 그래서 대답이 늦구나. 난 그냥 말수가 적은 줄 알았는데." }
      - say: { channel: action, with: [], text: "남자가 역무원에게 이름을 불러 준다." }
      - goto: warehouse_call

  warehouse_call:
    title: "아버지 번호"
    actions:
      - bg: { id: office, transition: fade, duration: 520 }
      - place: { text: "그날 오후 · 물류센터 사무실", presentation: center }
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { channel: action, with: [지완, 도겸], sound: call, text: "출고표를 확인하던 지완에게 아버지 번호로 다시 전화가 온다." }
      - say: { char: 지완, with: [지완], text: "네, 아버지?" }
      - say: { channel: dialogue, speakerName: "반찬집 아주머니 (통화)", with: [지완], text: "지완 씨? 아래 반찬집이에요. 아버님이 가게 앞에서 쓰러지셨어요. 구급차가 월계병원으로 갔어요." }
      - say: { char: 지완.tight, with: [도겸], text: "…눈은 뜨셨어요?" }
      - say: { channel: dialogue, speakerName: "반찬집 아주머니 (통화)", with: [지완], text: "실려 갈 땐 뜨고 계셨어요. 그 뒤는 나도 못 봤고. 아버님 폰은 내가 갖고 병원으로 갈게요." }
      - say: { char: 도겸, with: [지완], text: "출고는 제가 할 테니까 가 봐요. 택시 불러 드릴까요?" }
      - say: { char: 지완, with: [도겸], text: "남은 게 4번 도크 두 대예요. 송장은 제 자리에—" }
      - say: { char: 도겸, with: [지완], text: "지완 씨. 가요." }
      - say: { channel: action, with: [지완, 도겸], text: "지완은 출고표를 든 채 문까지 간다. 손에 든 걸 보고 돌아와 책상에 놓는다. 모서리를 맞추고 나서야 뛴다." }
      - say: { channel: thought, with: [지완], text: "택시에서 병원 이름을 두 번 말했다. 기사는 처음에 알아들었다." }
      - goto: ward_check_in

  ward_check_in:
    title: "병실 문 앞"
    actions:
      - bg: { id: ward_entry, transition: fade, duration: 500 }
      - place: { text: "그날 저녁 · 월계병원 신경과", presentation: center }
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 세라, position: right }
      - say: { channel: action, with: [지완], text: "신경과 복도 끝이다. 지완은 아침에 떨어뜨렸던 작업 장갑 한 짝을 아직 쥐고 있다. 손바닥 쪽이 젖었다." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "문동식 환자분 아드님이세요?" }
      - say: { channel: thought, with: [세라], text: "숨이 목에 걸려 있다. 지금 입을 열면 소리가 갈라진다." }
      - say: { channel: thought, with: [세라], text: "하나, 둘, 셋." }
      - say: { char: 지완, with: [세라], text: "네, 아들입니다." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "지금 깨어 계세요. 말은 아직 길게 못 하시고요." }
      - say: { char: 지완, with: [세라], text: "잠깐 뵐 수 있을까요." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "병동 문은 보호자 렌즈를 한 번 읽고 열려요. 문 쪽 봐 주세요." }
      - say: { channel: action, with: [], sound: ward_door, text: "간호사가 면회증을 찍는다. 열리던 자동문이 멈춘다." }
      - say: { channel: action, with: [], text: "한 뼘 열린 틈으로 침대 발치가 보인다. 이불 밖으로 맨발 하나가 나와 있다. 문이 도로 닫힌다." }
      - sticker: { id: o0_appeal, image: appeal_form_sticker, x: 50, y: 46, width: "clamp(150px, 24%, 280px)", enter: fadeIn }
      - say: { channel: record, with: [], sound: read, text: "보호자 면회 확인 · 문지완\n감정 판독 렌즈 측정: 01 · 무반응 의심\n직원 동행 면회만 가능" }
      - clearSticker: { id: o0_appeal, leave: fadeOut }
      - say: { channel: thought, with: [세라], text: "렌즈는 팔 년 동안 틀린 적이 없다. 그러면 지금 나는 아무렇지도 않은 사람이다." }
      - say: { channel: action, with: [지완], text: "장갑 쥔 손이 떨린다. 지완은 그 손을 점퍼 주머니에 넣는다." }
      - choice:
          key: o0_door
          prompt: "자동문이 도로 닫혔다. 간호사가 면회표를 내민다."
          with: [세라]
          options:
            - text: "지금 대답하고 있지 않느냐고 묻는다"
              set: { door_reply: asked }
            - text: "셋을 세고 언제 들어갈 수 있는지 묻는다"
              set: { door_reply: counted }
      - say: { char: 지완, with: [세라], when: { var: door_reply, op: ne, value: counted }, text: "저요? 저 지금 대답하고 있잖아요." }
      - say: { channel: thought, with: [세라], when: { var: door_reply, op: eq, value: counted }, text: "하나, 둘, 셋. 셋까지 세는데 숨이 두 번 끊긴다." }
      - say: { char: 지완, with: [세라], when: { var: door_reply, op: eq, value: counted }, text: "…그럼 언제 들어갈 수 있어요." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], when: { var: door_reply, op: eq, value: counted }, text: "잠깐만요. 그 전에 말씀드릴 게 있어요." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "대답하시는 건 저도 봤어요." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "재작년에 이 병동에서 보호자가 환자분을 다치게 한 일이 있었어요. 그날 그분 렌즈가 01이었고요." }
      - say: { char: 세라, speakerName: "간호사", with: [지완], text: "그 뒤로 이 안내가 뜨면 직원이 같이 들어가야 해서요. 동행 면회는 8시 10분부터예요." }
      - say: { char: 지완, with: [세라], text: "저 왔다고만 전해 주세요. 문 밖에 있다고요." }
      - say: { char: 지완, with: [세라], text: "늦게 온 줄 아실 거예요." }
      - get: appeal_form
      - goto: waiting_area

  waiting_area:
    title: "건너편 의자"
    actions:
      - char: { id: 수경, position: right }
      - say: { channel: action, with: [지완, 수경], camera: wide, text: "지완이 면회표를 들고 돌아서자 건너편 의자에서 아침에 장갑을 주워 준 여자가 일어난다." }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "저… 아침에 장갑 주워 드렸던 사람이에요. 잠깐 말씀드려도 괜찮을까요?" }
      - say: { char: 지완, with: [수경], text: "…아. 네." }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "방금 뜬 01요. 저, 그 렌즈 만드는 회사 다녀요." }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "틀리게 떴을 수도 있어서요." }
      - say: { char: 지완, with: [수경], text: "…그게 틀린 적도 있어요?" }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "없어요. 아직은요." }
      - say: { char: 지완, with: [수경], text: "면회가 8시 10분이에요." }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "그 전까지만요. 1층에 카페가 있어요." }
      - goto: /1.yaml
