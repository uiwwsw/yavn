chapterTitle: "보호자 한 분"

script:
  - scene: morning_train

scenes:
  morning_train:
    title: "출근길"
    actions:
      - bg: wolgye_station
      - place: "2033년 10월 · 월계역"
      - music: quant
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [지완], camera: wide, text: "출근하던 문지완이 월계역 개찰구 앞에서 장갑을 떨어뜨린다." }
      - bg: station_glove
      - say: { channel: record, with: [], text: "에모스 렌즈 · 통행 안전 모드\n문지완 · 안정 24\n안경 쓴 여자 · 안정 31" }
      - bg: { id: wolgye_station, transition: dissolve, duration: 240 }
      - char: { id: 수경, position: right }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "장갑 떨어뜨리셨어요." }
      - say: { char: 지완, with: [수경], text: "고맙습니다." }
      - move: { id: 수경, style: exit }
      - camera: medium
      - sound: call
      - choice:
          key: o0_call
          prompt: "오전 7:42 · 아버지에게 전화가 온다."
          with: [지완]
          options:
            - text: "전화를 받는다"
              goto: take_call
            - text: "문자로 답한다"
              goto: text_back

  take_call:
    actions:
      - set: { picked_up: true }
      - char: { id: 지완, position: left }
      - wait: 0
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "야, 국 냄비째 얼려도 되냐?" }
      - say: { char: 지완, channel: dialogue, with: [지완], text: "그거 꽝꽝 얼면 안 빠져요. 작은 통에 나눠요." }
      - say: { char: 동식_연락처, speakerName: "아버지 (통화)", channel: dialogue, with: [지완], text: "넌 일요일에 안 오냐?" }
      - say: { char: 지완, channel: dialogue, with: [지완], text: "점심 지나서요. 반만 얼려요." }
      - wait: 0
      - goto: platform

  text_back:
    actions:
      - wait: 0
      - say: { char: 지완, channel: message, side: me, with: [], text: "지금 지하철 타요. 이따 전화할게요" }
      - say: { char: 동식_연락처, channel: message, side: them, with: [], text: "국 끓였다 냉동실에 넣어 놓으마" }
      - say: { char: 지완, channel: message, side: me, with: [], text: "냄비째 넣지 말고요" }
      - goto: platform

  platform:
    title: "노란 선"
    actions:
      - bg: wolgye_station
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { channel: action, with: [지완, 도겸], camera: wide, text: "같은 근무조 도겸이 개찰구를 가리킨다. 한 남자가 문에 낀 휠체어를 빼내려 한다." }
      - say: { channel: record, with: [], text: "역사 안전 경보\n흥분 94 · 직원 호출" }
      - say: { channel: action, with: [], text: "역무원 둘이 달려온다. 남자가 손잡이에서 손을 떼자 휠체어에 앉은 노인이 그에게 팔을 뻗는다." }
      - say: { char: 도겸, with: [지완], text: "휠체어 좀 빼 달라고 한 거 아니에요?" }
      - say: { channel: action, with: [], text: "도겸이 반 걸음 나선다. 지완의 렌즈가 다시 진동한다. 도겸은 노란 선을 보고 발을 거둔다." }
      - say: { channel: record, with: [], text: "월계역 대합실 전광판\n안전 모드 도입 후 역사 내 폭행 신고 18건 → 7건\n같은 기간 전년 대비 · 서울교통공사" }
      - say: { char: 도겸, with: [지완], text: "지난겨울에도 여기서 알림 떴잖아요. 역무원이 사람 하나 붙잡았던 거. 엄마는 그 뒤로 꼭 이 역으로 다녀요." }
      - say: { channel: action, with: [], text: "역무원이 비상 통로로 휠체어를 빼 준다. 남자가 노인에게 들리지 않게 묻는다. 호출 기록도 회사로 갑니까." }
      - say: { channel: action, with: [], text: "줄이 다시 움직인다. 호출 기록도 회사로 가냐는 말이 남는다. 내 경보 기록이 학교로 갔던 날에도, 나는 누가 그걸 먼저 봤는지 몰랐다." }
      - goto: father_lesson

  father_lesson:
    title: "현관에서"
    actions:
      - bg: { id: dongsik_house, transition: fade, duration: 560 }
      - place: "6년 전 · 실습 배정 전날 · 아버지 집"
      - music: lowscore
      - char: { id: 동식, position: right }
      - say: { channel: record, with: [], text: "문지완 · 안전 면담 확인\n경보 3회 · 현장 실습 배정 보류" }
      - say: { channel: action, with: [], text: "아버지가 현관에 걸린 교복 주머니에서 구겨진 확인서를 꺼낸다. 그 아래엔 한 번도 신지 않은 작업화가 있다." }
      - say: { char: 동식, with: [], text: "지완아. 밖에선 화나거나 겁나도 티 내지 마라. 또 학교에서 부르면 실습 못 나가." }
      - say: { char: 동식, with: [], text: "말하기 전에 문부터 봐. 나갈 수 있으면 나가고. 못 나가면 셋 세고." }
      - say: { char: 지완, with: [동식], text: "아버지는 어디 가요? 이 시간에." }
      - say: { char: 동식, with: [], text: "학교. 내일 실습 나가야 될 거 아냐. 가방 싸 놔." }
      - say: { channel: action, with: [], text: "지완은 가방을 다 싸고도 작업화는 신발장에 넣어 두었다. 아버지는 어두워지고 나서야 돌아왔다." }
      - goto: shift

  shift:
    title: "두 번째 전화"
    actions:
      - bg: { id: office, transition: fade, duration: 520 }
      - place: "2033년 10월 · 그날 오후 · 물류 사무실"
      - music: quant
      - char: { id: 지완, position: left }
      - char: { id: 도겸, position: right }
      - say: { channel: action, with: [지완, 도겸], sound: call, text: "아버지에게 다시 전화가 온다." }
      - wait: 0
      - say: { channel: action, with: [지완], text: "아버지 목소리가 아니다. 반찬집 아주머니다. “아버지가 쓰러졌어요. 월계병원으로 오세요.”" }
      - say: { channel: thought, with: [지완], text: "문이 어디 있지." }
      - say: { char: 도겸, with: [지완], text: "지완 씨. 출입증 뒷주머니. 내가 택시 부를게요." }
      - goto: admission

  admission:
    title: "반응 부족"
    actions:
      - bg: { id: ward_entry, transition: fade, duration: 500 }
      - place: "그날 저녁 · 월계병원 신경과 면회 접수"
      - music: lowscore
      - char: { id: 지완, position: left }
      - say: { channel: action, with: [], text: "간호사가 접수창을 열고 말한다. “아드님 오시면 목소리부터 들려 드리려고 했어요.”" }
      - say: { char: 지완, with: [], text: "저 들어가면 알아보실 거예요. 아들입니다." }
      - say: { channel: action, with: [], sound: ward_door, text: "접수대 옆 자동문이 반쯤 열리다 멎는다. 간호사가 단말기를 지완 쪽으로 돌렸다가 다시 자기 앞으로 잡아당긴다." }
      - sound: read
      - say: { channel: record, with: [], text: "에모스 · 보호자 면회 확인\n정서 반응 01 · 무반응 의심\n직원 동행 면회만 가능" }
      - say: { channel: action, with: [], text: "시트가 든 카트를 밀던 직원이 단말기와 지완의 얼굴을 번갈아 본다." }
      - say: { char: 지완, with: [], text: "지금 이름 부르는 소리가 났는데요. 한 번만 가 보면 안 돼요?" }
      - say: { channel: action, with: [], text: "교대할 간호사를 기다리라는 말에 지완은 문 앞에서 셋을 센다. 건너편에 아침에 장갑을 주워 준 여자가 앉아 있다." }
      - get: appeal_form
      - goto: across_the_hall

  across_the_hall:
    title: "건너편 의자"
    pov: "안경 쓴 여자"
    layout: fixed
    actions:
      - place: "같은 시각 · 접수대 건너편"
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: thought, char: 수경, speakerName: "안경 쓴 여자", with: [지완], camera: wide, text: "월계역에서 장갑을 주워 줬던 남자다. 면회 화면에 01이 떴다." }
      - say: { channel: record, with: [], text: "받은 메시지\n결함 보고서 쓴 계정까지 정지됐어요. 인사팀에서 해고 통지 보냈고요. 보안팀 두 명이 출입구에 있어요." }
      - say: { channel: record, with: [], text: "보낸 메시지\n01 뜬 분을 봤어요. 접수대에서." }
      - say: { channel: record, with: [], text: "받은 메시지\n01만 봐서는 같은 오류인지 몰라요. 당사자가 원하지 않으면 붙잡지 마세요. 제발." }
      - say: { channel: action, with: [], text: "가방 속 결함 보고서 마지막 줄. ‘현장에서 다시 확인하지 못함.’" }
      - say: { channel: action, with: [지완, 수경], camera: wide, text: "남자가 빈 물병을 들고 1층으로 내려간다. 나도 보고서를 챙긴다." }
      - goto: /1.yaml
