title: "오버플로"
pov: "문지완"
author:
  name: "uiwwsw"
version: "3.0.0"
seo:
  description: "감정을 읽는 AI 렌즈가 일상이 된 2033년 서울. 쓰러진 아버지를 찾아간 문지완은 무반응 의심 판정을 받고 병실 앞에서 멈춘다. 렌즈를 만든 한수경은 건너편에서 그의 숫자를 보고 있었다. 5장 SF 미스터리, 결말 4종."
  keywords:
    - "SF 미스터리"
    - "비주얼노벨"
    - "감정 측정"
    - "AI 렌즈"
    - "반전"
  image: "assets/bg/title.svg"
  imageAlt: "병동 자동문과 황갈색 숫자 01이 빛나는 판독기"
textSpeed: 32
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: cinematic-noir
  messagePortrait: assets/char/jiwan-phone.svg
legalNotices:
  - id: content-warning
    title: "내용 안내"
    text: "이 작품에는 가족의 응급 입원, 정서 반응 수치에 따른 차별, 직장 내 압박이 나옵니다."
  - id: fiction
    title: "허구 안내"
    text: "에모스와 한신뉴로, 작중의 모든 법령·판례·수치는 지어낸 것입니다. 실제 기업·제도·사건과 관계가 없습니다."
startScreen:
  enabled: true
  music: assets/music/quant.flac
  image: assets/bg/title.svg
  imagePosition: "50% 50%"
  mobileImagePosition: "84% 50%"
  showTitle: true
  titleColor: "#e8eef9"
  startButtonText: "측정 시작"
  buttonPosition: bottom-left
  eyebrow: "2033 한국 · SF 미스터리 · 5장 · 결말 4종"
  subtitle: "쓰러진 아버지를 보러 갔다. 병실 앞에서 렌즈가 내게 띄운 숫자는 01이었다."
  scene:
    layout: split
    motion: drift
    duration: 30000
    parallax: 10
    particles: none
    intensity: 0.4
    fog: false
    light: breathe
    accent: "#d7ae76"
endings:
  broadcast:
    title: "공개"
    message: "병원 면회 판독에 대한 외부 조사 착수"
    epilogue: "지완은 월요일 새벽에 제시간에 출근했다. 도겸은 아무 말 없이 지완 몫의 작업 장갑을 꺼내 두었다."
    background: studio
    music: street
    tone: mystery
  one_file:
    title: "정정 이력"
    message: "문지완의 무반응 의심 기록 정정"
    epilogue: "세라는 정정 전 기록도 지완에게 한 부 뽑아 주었다. 지완은 두 장을 같은 주머니에 넣었다."
    background: ward_entry
    music: lowscore
    tone: tragic
  sealed:
    title: "출입 허용"
    message: "문지완의 면회 제한 해제"
    epilogue: "지완은 밀린 물을 갖다 드리고 오전 내내 병실에 있었다."
    background: ward_bed
    music: standard
    tone: tragic
  appeal:
    title: "이의신청"
    message: "에모스 공동 이의신청 접수 · 심사일 미정"
    epilogue: "월요일에 병동은 접수대에 빈 서식을 더 놓았다. 두 사람이 낸 신청의 답은 아직 오지 않았다."
    background: dongsik_house
    music: quant
    tone: hopeful
defaultEnding: appeal
