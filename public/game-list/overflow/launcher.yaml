summary: "감정을 숫자로 재는 에모스가 채용·결혼·형량까지 정하는 2033년 한국. 모든 수치가 1로 나오는 이의신청 대행업자가, 수치가 너무 낮아 불기소된 살인사건을 맡는다. 증거를 직접 뒤지는 5장 SF 미스터리. 결말 4종."
