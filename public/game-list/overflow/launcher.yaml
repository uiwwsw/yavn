  en:
    summary: "By 2033 every hire, marriage and sentence in Korea runs on EMOS, a service that puts a number on what you feel. A man whose every reading comes back as 1 takes on a murder the prosecution dropped because the suspect's anger was too low to kill. Five chapters, four endings."
