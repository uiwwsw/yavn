summary: "아내가 죽자 남편은 자신이 했다고 신고한다. 검찰은 죄책감 0점을 근거로 그의 말을 믿지 않는다. 7년째 모든 감정에 1점을 받은 문지완은 그 진술을 다시 기록에 올리기로 한다. 5장 SF 미스터리, 결말 4종."
