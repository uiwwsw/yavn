translations:
  en:
    summary: "After his wife dies, a man tells police he killed her. Prosecutors dismiss his confession because EMOS scored his guilt at zero. Jiwan, whose own feelings have all scored a 1 for seven years, sets out to put the man's words back on the record. A sci-fi mystery in five chapters with four endings."
