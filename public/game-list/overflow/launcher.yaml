  en:
    summary: "In 2033 Seoul, AI lenses read emotions. When Jiwan comes to see his father in the hospital, the lens flags him as unresponsive and he is made to wait outside the ward. Across the hall, the engineer who built the lens sees his score. A sci-fi mystery in five chapters with four endings."
