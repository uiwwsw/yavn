chapterTitle: "01이 두 번 나온다"

script:
  - scene: cafe_introduction

scenes:
  cafe_introduction:
    title: "카페"
    actions:
      - bg: { id: cafe, transition: fade, duration: 480 }
      - place: "잠시 뒤 · 월계병원 1층 카페"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - set: { read_trial: false, read_report: false, checked_phone: false }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "저 한수경이에요. 에모스에서 아까 그 점수 보여 주는 화면을 만들었어요." }
      - say: { char: 지완, with: [수경], text: "문지완입니다. 그럼 아까 그거, 다시 재면 들어갈 수 있어요?" }
      - say: { char: 수경, with: [지완], text: "문은 병원에서 열어 줘야 해요. 제가 볼 수 있는 건 왜 01이 떴는지예요. 혹시 접수표 받아 오셨어요?" }
      - choice:
          key: o1_trust
          prompt: "수경이 면회표의 이름을 가려도 된다고 말한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: share_slip
            - text: "수경의 자료부터 보여달라고 한다"
              goto: withhold_slip

  share_slip:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [지완, 수경], text: "지완이 이름이 적힌 부분을 접어 건넨다." }
      - say: { char: 수경, with: [지완], text: "아, 이 번호. 병원에서 아직도 저희가 시험했던 버전을 쓰네요." }
      - goto: cafe_documents

  withhold_slip:
    actions:
      - set: { shared_slip: false }
      - say: { char: 지완, with: [수경], text: "죄송한데 그쪽 자료부터 좀 볼게요. 병원에서 받은 건 아버지 것도 적혀 있어서요." }
      - say: { char: 수경, with: [지완], text: "네. 접수표는 넣으세요. 저희가 시험할 때 뽑아 둔 게 있어요." }
      - goto: cafe_documents

  cafe_documents:
    title: "시험 출력물"
    actions:
      - say: { channel: action, with: [지완, 수경], text: "수경이 가방에서 시험 출력물과 회사에 냈던 보고서를 꺼낸다. 출력물의 두 줄에 같은 숫자가 적혀 있다." }
      - goto: cafe_choices

  cafe_choices:
    actions:
      - choice:
          key: o1_desk
          prompt: "면회 시간까지 아직 조금 남았다."
          with: [수경]
          options:
            - text: "시험 출력물을 읽는다"
              when: { var: read_trial, op: eq, value: false }
              goto: display_test
            - text: "결함 보고서를 읽는다"
              when: { var: read_report, op: eq, value: false }
              goto: company_report
            - text: "병동에서 연락이 왔는지 확인한다"
              when: { var: checked_phone, op: eq, value: false }
              goto: hospital_message
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: plan_measurement

  display_test:
    actions:
      - set: { read_trial: true }
      - say: { channel: record, with: [], sound: read, text: "에모스 사내 시험 · 병원에 설치된 버전\n센서 입력 001 → 표시 01\n센서 입력 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "1이면 정말 낮은 거예요. 근데 101이 들어와도 앞자리 잘라서 똑같이 01로 띄워요." }
      - say: { char: 지완, with: [수경], text: "그럼 접수표에 01이라고만 적혀 있으면, 애초에 1이었는지 101이었는지 몰라요?" }
      - say: { char: 수경, with: [지완], text: "접수표만 봐서는 몰라요. 그래서 병원에 실제로 그 숫자를 보고 막은 사람이 있는지 물으러 왔어요. 회사에선 시험할 때만 저런 숫자가 나온대요. 실제로 면회를 막은 적 있는지 물어보러 온 거예요." }
      - goto: cafe_choices

  company_report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 한수경\n세 자리 입력의 앞자리가 화면에서 잘림. 병원 사용 중지 요청.\n회사 답변 · 실제 면회에 영향을 준 사례가 확인되면 재검토." }
      - say: { char: 지완, with: [수경], text: "회사에서도 알면서 이걸 계속 쓰고 있다고요?" }
      - say: { char: 수경, with: [지완], text: "두 달 전에 올린 건데 회사에선 병원 일에 손 떼래요. 그래서 여기서 어느 버전 쓰는지만이라도 알아 가려고요." }
      - goto: cafe_choices

  hospital_message:
    actions:
      - set: { checked_phone: true }
      - say: { channel: message, side: them, with: [], text: "월계병원입니다. 보호자 면회는 저녁 8시 10분에 시작합니다. 접수대에서 기다려 주세요." }
      - say: { channel: action, with: [], when: { var: picked_up, op: eq, value: false }, text: "병원 문자 바로 밑에 아버지가 아침에 남긴 음성 메시지가 있다. 지완은 휴대폰을 귀에 댄다." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지완아, 작은 통 찾았다. 지난번 네가 사 온 거 있네. 빈 통 들고 오지 마라." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "아버지한테 저 왔다고 전해 줬을까. 아까 한 번 더 부탁할걸." }
      - goto: cafe_choices

  plan_measurement:
    title: "면회 전에"
    actions:
      - say: { char: 수경, with: [지완], text: "처음 수치는 되찾을 수 없어요. 병실에서 렌즈가 한 번 더 재니까, 그때 검사기를 붙여 두면 잘리기 전 숫자와 표시값을 같이 볼 수 있어요." }
      - say: { char: 지완, with: [수경], text: "그걸 병원에 내면 내일은 제가 혼자 들어갈 수 있을까요? 아버지 며칠 더 계셔야 한대요." }
      - say: { char: 수경, with: [지완], text: "이번에도 101이 01로 뜨면, 병원이 쓰는 버전에 같은 문제가 있다는 건 보여 줄 수 있어요. 처음 판정을 고칠지는 병원이 정하고요. 괜찮으면 면회 전에 계단 쪽에서 붙여 드릴게요." }
      - say: { channel: action, with: [지완, 수경], text: "접수대 전광판에 면회 시작 안내가 뜬다. 지완이 휴대폰을 챙긴다." }
      - goto: /2.yaml
