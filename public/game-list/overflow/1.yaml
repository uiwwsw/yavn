chapterTitle: "01이 두 번 나온다"

script:
  - scene: cafe_introduction

scenes:
  cafe_introduction:
    title: "카페"
    actions:
      - bg: { id: cafe, transition: fade, duration: 480 }
      - place: "잠시 뒤 · 월계병원 1층 카페"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - set: { read_trial: false, read_report: false, checked_phone: false }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "한수경이라고 합니다. 아까 보신 안내 화면을 개발했어요." }
      - say: { char: 지완, with: [수경], text: "문지완입니다. 혹시 저한테 뜬 것도 잘못 나온 건가요?" }
      - say: { char: 수경, with: [지완], text: "그럴 가능성은 있어요. 접수표를 잠깐 봐도 될까요? 이름은 가리셔도 돼요." }
      - choice:
          key: o1_trust
          prompt: "수경이 면회표의 이름을 가려도 된다고 말한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: share_slip
            - text: "수경의 자료부터 보여달라고 한다"
              goto: withhold_slip

  share_slip:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [지완, 수경], text: "지완이 이름이 적힌 부분을 접어 건넨다." }
      - say: { char: 수경, with: [지완], text: "여기 아래 버전 번호요. 제가 확인하러 온 게 이거예요." }
      - goto: cafe_documents

  withhold_slip:
    actions:
      - set: { shared_slip: false }
      - say: { char: 지완, with: [수경], text: "죄송합니다. 어떤 자료인지 먼저 볼 수 있을까요? 여기 아버지 이름도 적혀 있어서요." }
      - say: { char: 수경, with: [지완], text: "네, 그러세요. 제가 가져온 것부터 보여 드릴게요." }
      - goto: cafe_documents

  cafe_documents:
    title: "시험 출력물"
    actions:
      - say: { channel: action, with: [지완, 수경], text: "수경이 가방에서 시험 출력물과 회사에 냈던 보고서를 꺼낸다. 출력물의 두 줄에 같은 숫자가 적혀 있다." }
      - goto: cafe_choices

  cafe_choices:
    actions:
      - choice:
          key: o1_desk
          prompt: "면회 시간까지 아직 조금 남았다."
          with: [수경]
          options:
            - text: "시험 출력물을 읽는다"
              when: { var: read_trial, op: eq, value: false }
              goto: display_test
            - text: "결함 보고서를 읽는다"
              when: { var: read_report, op: eq, value: false }
              goto: company_report
            - text: "병동에서 연락이 왔는지 확인한다"
              when: { var: checked_phone, op: eq, value: false }
              goto: hospital_message
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: plan_measurement

  display_test:
    actions:
      - set: { read_trial: true }
      - say: { channel: record, with: [], sound: read, text: "에모스 사내 시험 · 병원에 설치된 버전\n센서 입력 001 → 표시 01\n센서 입력 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "왼쪽이 센서에서 읽은 값이고, 오른쪽이 화면이에요. 1이든 101이든 화면에는 01로 떠요." }
      - say: { char: 지완, with: [수경], text: "그럼 제 것도… 101인데 01로 뜬 걸 수도 있겠네요?" }
      - say: { char: 수경, with: [지완], text: "네. 다만 그때 실제 값은 접수표에 안 남아서, 지금은 확인할 수 없어요." }
      - goto: cafe_choices

  company_report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 한수경\n세 자리 입력의 앞자리가 화면에서 잘림. 병원 사용 중지 요청.\n회사 답변 · 실제 면회에 영향을 준 사례가 확인되면 재검토." }
      - say: { char: 지완, with: [수경], text: "회사에 알렸는데도 아직 이걸 쓰는 거예요?" }
      - say: { char: 수경, with: [지완], text: "네. 실제로 면회 못 한 사람이 있어야 다시 보겠대요. 두 달을 기다리다가 오늘 직접 와 봤어요." }
      - goto: cafe_choices

  hospital_message:
    actions:
      - set: { checked_phone: true }
      - say: { thread: "월계병원", speakerName: "월계병원", channel: message, side: them, with: [], text: "월계병원입니다. 보호자 면회는 저녁 8시 10분에 시작합니다. 접수대에서 기다려 주세요." }
      - say: { channel: action, with: [], when: { var: picked_up, op: eq, value: false }, text: "병원 문자를 닫는데 부재중 전화 알림에 아버지가 남긴 음성 메시지가 보인다. 지완은 휴대폰을 귀에 댄다." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지완아, 작은 통 찾았다. 지난번 네가 사 온 거 있네. 빈 통 들고 오지 마라." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "아버지한테 저 왔다고 전해 줬을까. 아까 한 번 더 부탁할걸." }
      - goto: cafe_choices

  plan_measurement:
    title: "면회 전에"
    actions:
      - say: { char: 수경, with: [지완], text: "병실에 들어가면 렌즈가 한 번 더 재요. 그때 검사기를 연결해 두면, 잘리기 전 숫자도 같이 남길 수 있어요." }
      - say: { char: 지완, with: [수경], text: "그걸 하면… 내일은 혼자 들어갈 수도 있을까요?" }
      - say: { char: 수경, with: [지완], text: "그건 병원에 확인해야 해요. 우선 오류가 난 건지부터 알아보고요. 연결해 드려도 괜찮을까요?" }
      - say: { channel: action, with: [지완, 수경], text: "전광판에 저녁 8시 10분 면회 대기 장소가 뜬다. 지완이 시간을 보고 자리에서 일어난다." }
      - goto: /2.yaml
