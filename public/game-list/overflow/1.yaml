chapterTitle: "같은 01"

script:
  - scene: introduction

scenes:
  introduction:
    title: "카페 문 앞"
    actions:
      - bg: { id: cafe, transition: fade, duration: 480 }
      - place: "잠시 뒤 · 월계병원 1층 카페"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, speakerName: "낯선 여자", with: [지완], text: "저기요. 아까 접수대 건너편에 앉아 있었어요. 01 뜬 거 봤는데, 전에도 그런 적 있으세요?" }
      - say: { char: 지완, with: [수경], text: "물 받으러 내려온 건데… 병원 사람이세요?" }
      - say: { char: 수경, speakerName: "낯선 여자", with: [지완], text: "한수경이에요. 접수대에 뜬 그 카드, 제가 만든 겁니다." }
      - say: { char: 지완, with: [수경], text: "그럼 위에 전화해서 저 들여보내 주세요. 지금 그것만 되면 돼요." }
      - say: { char: 수경, with: [지완], text: "저도 이제 거기 전화 못 해요. …접수표 갖고 계세요? 이름 가리고 보여 주세요." }
      - choice:
          key: o1_trust
          prompt: "수경이 접수 기록을 보여 달라고 한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: show_record
            - text: "수경의 자료부터 보여달라고 한다"
              goto: ask_report

  show_record:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [], text: "지완이 접수표 맨 윗줄을 접는다. 수경은 표를 자기 쪽으로 끌어당기지 않고 거꾸로 읽는다." }
      - say: { char: 수경, with: [지완], text: "숫자 바로 밑이요. 거기에 버전이 적혀 있어요. …아직 이걸 쓰네요." }
      - goto: investigation

  ask_report:
    actions:
      - say: { char: 지완, with: [수경], text: "제가 뭘 주기 전에, 그쪽이 뭘 갖고 있는지 보고 싶어요." }
      - say: { char: 수경, with: [지완], text: "맞아요. 제가 순서를 거꾸로 했네요. 여기요." }
      - goto: investigation

  investigation:
    title: "테이블 위의 자료"
    actions:
      - say: { channel: action, with: [], text: "수경이 시험 출력물과 접힌 종이를 꺼낸다. 카페 직원이 옆자리 의자를 테이블 위에 올린다." }
      - goto: desk

  desk:
    actions:
      - choice:
          key: o1_desk
          prompt: "수경이 가져온 자료를 살펴본다."
          with: [수경]
          options:
            - text: "시험 출력물을 읽는다"
              when: { var: read_trial, op: eq, value: false }
              goto: trial
            - text: "결함 보고서를 읽는다"
              when: { var: read_report, op: eq, value: false }
              goto: report
            - text: "병동에서 연락이 왔는지 확인한다"
              when: { var: checked_phone, op: eq, value: false }
              goto: check_phone
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: ask_test

  trial:
    actions:
      - set: { read_trial: true }
      - sound: read
      - say: { channel: record, with: [], text: "출시 전 시험 · 동일 버전의 판독 카드\n시험 신호 001 → 표시 01\n시험 신호 099 → 표시 99\n시험 신호 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "화면에 숫자가 두 자리만 떠요. 입력이 100 이상이면 앞자리를 잘라 내거든요. 그래서 001도 101도 똑같이 01로 보여요." }
      - say: { char: 지완, with: [수경], text: "저는 어느 쪽인데요?" }
      - say: { char: 수경, with: [지완], text: "아직 몰라요. 렌즈가 받은 숫자와 접수대에 뜬 숫자를 같은 시각에 확인해야 해요." }
      - goto: desk

  report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 작성자 한수경\n판독 카드가 다른 입력에 같은 값을 표시함. 병원 배포 중지 요청.\n처리 결과 · 현장 재현 자료 부족. 배포 유지." }
      - say: { char: 지완, with: [수경], text: "해고 통지에도 저렇게 써 있어요?" }
      - say: { char: 수경, with: [지완], text: "승인 없이 자료를 반출했다고 돼 있어요. 여기엔 제 서명이 있는 결함 보고서만 가져왔고요." }
      - goto: desk

  check_phone:
    actions:
      - set: { checked_phone: true }
      - say: { channel: message, side: them, with: [], text: "월계병원 신경과입니다. 담당 간호사 복귀 후 20시 10분에 동행 면회 가능합니다." }
      - say: { channel: action, with: [], when: { var: picked_up, op: eq, value: false }, continueLabel: "음성 메시지를 듣는다", text: "병원 문자 아래에 아버지가 오전 7시 45분에 남긴 음성 메시지가 있다." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지완아, 작은 통 찾았다. 지난번 네가 사 온 거 있네." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "국은 반만 얼린다 그랬는데. 냄비에 남았겠네." }
      - goto: desk

  ask_test:
    title: "다음 판독"
    actions:
      - say: { char: 수경, with: [지완], text: "접수대엔 표시된 01만 남았어요. 다음에 검사용 단말기를 연결해 두면 화면에 뜨기 전 숫자도 기록할 수 있어요." }
      - say: { char: 지완, with: [수경], text: "제가 뭘 해야 돼요? 아까처럼 놀라야 되나." }
      - say: { char: 수경, with: [지완], text: "평소처럼 들어가세요. 이번에 01이 또 뜬다는 보장은 없어요. 안 뜨면 오늘은 거기까지고요." }
      - say: { channel: action, with: [], text: "폰에 20시 10분 면회 안내가 떠 있다. 지완이 의자 옆 물병을 챙겨 일어나자, 먼저 나가던 수경이 정문 쪽을 보고 멈춰 선다." }
      - say: { char: 수경, with: [지완], text: "연결하는 건 옆 계단에서 해야겠어요. 정문에 서 있는 두 사람, 낮에 집 앞에도 있었거든요." }
      - goto: /2.yaml
