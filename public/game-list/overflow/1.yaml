chapterTitle: "같은 01"

script:
  - scene: introduction

scenes:
  introduction:
    title: "카페 문 앞"
    actions:
      - bg: cafe
      - place: "월계병원 1층 · 폐점 직전"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [지완], text: "저기요. 접수대에서 01 뜨셨죠? 혹시 오늘 처음 보신 거예요?" }
      - say: { char: 지완, with: [수경], text: "아까 그 옆에 계셨죠. 병원 사람이세요?" }
      - say: { char: 수경, with: [지완], text: "한수경입니다. 에모스 첫 버전 출시할 때 제가 개발 책임자였어요. 그 판독 카드 만든 사람이에요." }
      - say: { char: 지완, with: [수경], text: "그럼 위에 전화해서 저 들여보내 주세요. 지금 그것만 되면 돼요." }
      - say: { char: 수경, with: [지완], text: "전화할 데가 없어졌어요. 대신 그 카드부터 확인해 봐도 돼요? 오늘 기록. 성함이랑 병원 번호는 가리셔도 돼요." }
      - choice:
          key: o1_trust
          prompt: "수경이 접수 기록을 보여 달라고 한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: show_record
            - text: "수경의 자료부터 보여달라고 한다"
              goto: ask_report

  show_record:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [], text: "지완이 접수표 맨 윗줄을 접는다. 수경은 표를 자기 쪽으로 끌어당기지 않고 거꾸로 읽는다." }
      - say: { char: 수경, with: [지완], text: "숫자 밑에 버전 있어요. 네, 이거예요. 아주 반가운데, 그러면 안 되는 자리인 것도 알아요." }
      - goto: investigation

  ask_report:
    actions:
      - say: { char: 지완, with: [수경], text: "제가 뭘 주기 전에, 그쪽이 뭘 갖고 있는지 보고 싶어요." }
      - say: { char: 수경, with: [지완], text: "맞아요. 제가 순서 거꾸로 했네요. 여기요." }
      - goto: investigation

  investigation:
    title: "테이블 위의 자료"
    actions:
      - say: { channel: action, with: [], text: "수경이 시험 출력물과 접힌 종이를 꺼낸다. 카페 직원이 옆자리 의자를 테이블 위에 올린다." }
      - goto: desk

  desk:
    actions:
      - choice:
          key: o1_desk
          prompt: "수경이 가져온 자료를 살펴본다."
          with: [수경]
          options:
            - text: "시험 출력물을 읽는다"
              when: { var: read_trial, op: eq, value: false }
              goto: trial
            - text: "결함 보고서를 읽는다"
              when: { var: read_report, op: eq, value: false }
              goto: report
            - text: "병동에서 연락이 왔는지 확인한다"
              when: { var: checked_phone, op: eq, value: false }
              goto: check_phone
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: ask_test

  trial:
    actions:
      - set: { read_trial: true }
      - sound: read
      - say: { channel: record, with: [], text: "출시 전 시험 · 동일 버전의 판독 카드\n시험 신호 001 → 표시 01\n시험 신호 099 → 표시 99\n시험 신호 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "백 넘어가면 맨 앞자리가 빠져요. 그래서 01이 둘이에요. 조금 들어온 01하고, 너무 많이 들어온 01." }
      - say: { char: 지완, with: [수경], text: "저는 어느 쪽인데요?" }
      - say: { char: 수경, with: [지완], text: "모르죠. 이건 시험기에 숫자 넣은 거라서. 실제로 사람한테서 같이 찍힌 두 칸이 있어야 해요." }
      - goto: desk

  report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 작성자 한수경\n판독 카드가 다른 입력에 같은 값을 표시함. 병원 배포 중지 요청.\n처리 결과 · 현장 재현 자료 부족. 배포 유지." }
      - say: { char: 지완, with: [수경], text: "해고 통지에도 저렇게 써 있어요?" }
      - say: { char: 수경, with: [지완], text: "거기엔 승인되지 않은 자료를 들고 나갔다고 돼 있어요. 이건 제 서명이 있는 쪽만 복사한 거예요. 이쪽은 넘겨 보셔도 돼요." }
      - goto: desk

  check_phone:
    actions:
      - set: { checked_phone: true }
      - say: { channel: message, side: them, with: [], text: "월계병원 신경과입니다. 담당 간호사 복귀 후 20시 10분에 동행 면회 가능합니다." }
      - say: { channel: message, side: them, char: 동식_연락처, with: [], when: { var: picked_up, op: eq, value: false }, text: "음성 메시지 · 오전 7시 45분\n지완아, 작은 통 찾았다. 지난번 네가 사 온 거 있네." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "일요일 점심 지나서 간다 그랬지. 그 전에 배고프면 어떡하지." }
      - goto: desk

  ask_test:
    title: "다음 판독"
    actions:
      - say: { char: 수경, with: [지완], text: "아까 건 접수대에 01만 남았어요. 다시 찍을 때 제가 네트워크 끈 검사용 단말기를 연결하면, 렌즈가 버리기 전 숫자도 남길 수 있어요." }
      - say: { char: 지완, with: [수경], text: "제가 뭘 해야 돼요? 아까처럼 놀라야 되나." }
      - say: { char: 수경, with: [지완], text: "그냥 병동에 들어가세요. 다시 안 나올 수도 있어요. 그러면 오늘은 거기까지고요." }
      - say: { channel: action, with: [], text: "수경의 전화가 짧게 진동한다. 그녀는 화면을 보고 병원 쪽 유리문으로 눈을 돌린다." }
      - say: { char: 수경, with: [지완], text: "연결하는 건 옆 계단에서 해야겠어요. 정문에 서 있는 두 사람, 낮에 집 앞에도 있었거든요." }
      - goto: /2.yaml
