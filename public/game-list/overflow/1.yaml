chapterTitle: "같은 01"

script:
  - scene: introduction

scenes:
  introduction:
    title: "카페 문 앞"
    actions:
      - bg: { id: cafe, transition: fade, duration: 480 }
      - place: "잠시 뒤 · 월계병원 1층 카페"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "저기요. 아까 접수대에 01 떴죠?" }
      - say: { char: 지완, with: [수경], text: "아침에 뵀죠? 여기서 일하세요?" }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "한수경이에요. 접수대에 뜬 그 화면, 제가 만들었어요." }
      - say: { char: 지완, with: [수경], text: "그럼 간호사한테 전화 한 통만 해 주시면 안 돼요? 저 아버지 좀 보게요." }
      - say: { char: 수경, with: [지완], text: "저도 이제 거긴 전화 못 해요. 접수표 있어요? 이름은 접어서 가리시고요." }
      - choice:
          key: o1_trust
          prompt: "수경이 접수 기록을 보여 달라고 한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: show_record
            - text: "수경의 자료부터 보여달라고 한다"
              goto: ask_report

  show_record:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [], text: "지완이 접수표 맨 윗줄을 접는다. 수경은 표를 자기 쪽으로 끌어당기지 않고 거꾸로 읽는다." }
      - say: { char: 수경, with: [지완], text: "01 밑에 작은 글씨요. 잠깐만. 아직도 이 버전이에요?" }
      - goto: investigation

  ask_report:
    actions:
      - say: { char: 지완, with: [수경], text: "잠깐만요. 뭐 갖고 오신 건지 먼저 보여 주실래요?" }
      - say: { char: 수경, with: [지완], text: "그러죠. 여기 보세요." }
      - goto: investigation

  investigation:
    title: "테이블 위의 자료"
    actions:
      - say: { channel: action, with: [], text: "수경이 시험 출력물과 접힌 종이를 꺼낸다. 카페 직원이 옆자리 의자를 테이블 위에 올린다." }
      - goto: desk

  desk:
    actions:
      - choice:
          key: o1_desk
          prompt: "수경이 가져온 자료를 살펴본다."
          with: [수경]
          options:
            - text: "시험 출력물을 읽는다"
              when: { var: read_trial, op: eq, value: false }
              goto: trial
            - text: "결함 보고서를 읽는다"
              when: { var: read_report, op: eq, value: false }
              goto: report
            - text: "병동에서 연락이 왔는지 확인한다"
              when: { var: checked_phone, op: eq, value: false }
              goto: check_phone
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: ask_test

  trial:
    actions:
      - set: { read_trial: true }
      - sound: read
      - say: { channel: record, with: [], text: "출시 전 시험 · 동일 버전의 판독 카드\n시험 신호 001 → 표시 01\n시험 신호 099 → 표시 99\n시험 신호 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "맨 앞자리가 잘려요. 여기 101 보이죠? 1을 지우면 위에 거랑 똑같아요." }
      - say: { char: 지완, with: [수경], text: "그럼 제 거는 1이에요, 101이에요?" }
      - say: { char: 수경, with: [지완], text: "지금은 몰라요. 다음에 뜰 때 지완 씨 렌즈도 같이 봐야 해요." }
      - goto: desk

  report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 작성자 한수경\n판독 카드가 다른 입력에 같은 값을 표시함. 병원 배포 중지 요청.\n처리 결과 · 현장 재현 자료 부족. 배포 유지." }
      - say: { char: 지완, with: [수경], text: "이거 쓰고 잘리신 거예요?" }
      - say: { char: 수경, with: [지완], text: "허락 없이 자료를 가져갔대요. 제가 쓴 보고서예요. 여기, 제 이름도 있고요." }
      - goto: desk

  check_phone:
    actions:
      - set: { checked_phone: true }
      - say: { channel: message, side: them, with: [], text: "월계병원 신경과입니다. 담당 간호사 복귀 후 20시 10분에 동행 면회 가능합니다." }
      - say: { channel: action, with: [], when: { var: picked_up, op: eq, value: false }, continueLabel: "음성 메시지를 듣는다", text: "병원 문자 아래에 아버지가 오전 7시 45분에 남긴 음성 메시지가 있다." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지완아, 작은 통 찾았다. 지난번 네가 사 온 거 있네." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "국은 반만 얼린다 그랬는데. 냄비에 남았겠네." }
      - goto: desk

  ask_test:
    title: "다음 판독"
    actions:
      - say: { char: 수경, with: [지완], text: "아까 건 늦었어요. 접수대엔 01만 남으니까. 다음에 뜨기 전에 검사용 단말기를 붙여 둘 수는 있어요." }
      - say: { char: 지완, with: [수경], text: "제가 뭐 해야 돼요? 일부러 놀라야 돼요?" }
      - say: { char: 수경, with: [지완], text: "그냥 아버님 보고 오세요. 경고가 안 뜨면 오늘은 거기까지예요." }
      - say: { channel: action, with: [], text: "면회 시간인 20시 10분이 가까워졌다. 일어서던 수경이 정문을 보고 멈춘다." }
      - say: { char: 수경, with: [지완], text: "동쪽 계단으로 와요. 저기 정문에 두 사람 보이죠? 낮에 우리 집 앞에도 왔었어요." }
      - goto: /2.yaml
