chapterTitle: "01이 두 번 나온다"

script:
  - scene: cafe_introduction

scenes:
  cafe_introduction:
    title: "카페"
    actions:
      - bg: { id: cafe, transition: fade, duration: 480 }
      - place: "잠시 뒤 · 월계병원 1층 카페"
      - music: lowscore
      - char: { id: 지완, position: left }
      - char: { id: 수경, position: right }
      - set: { read_trial: false, read_report: false, checked_phone: false }
      - say: { char: 수경, speakerName: "안경 쓴 여자", with: [지완], text: "한수경이라고 합니다. 한신뉴로에서 그 안내 화면을 맡고 있어요." }
      - say: { char: 지완, with: [수경], text: "문지완입니다. 그럼 제 01이 틀린 거예요?" }
      - say: { char: 수경, with: [지완], text: "아직은 몰라요. 접수표 아래쪽만 잠깐 봐도 될까요? 이름은 가리셔도 돼요." }
      - choice:
          key: o1_trust
          prompt: "수경이 면회표의 이름을 가려도 된다고 말한다."
          with: [수경]
          options:
            - text: "이름을 가리고 기록을 보여준다"
              goto: share_slip
            - text: "수경의 자료부터 보여달라고 한다"
              goto: withhold_slip

  share_slip:
    actions:
      - set: { shared_slip: true }
      - say: { channel: action, with: [지완, 수경], text: "지완이 이름이 적힌 부분을 접어 건넨다." }
      - say: { char: 수경, with: [지완], text: "여기 아래 버전 번호요. 제가 확인하러 온 게 이거예요." }
      - goto: cafe_documents

  withhold_slip:
    actions:
      - set: { shared_slip: false }
      - say: { char: 지완, with: [수경], text: "그쪽 자료부터 볼게요. 여기 아버지 이름이 있어서요." }
      - say: { char: 수경, with: [지완], text: "네. 그게 순서죠." }
      - goto: cafe_documents

  cafe_documents:
    title: "시험 출력물"
    actions:
      - say: { channel: action, with: [지완, 수경], text: "수경이 가방에서 시험 출력물과 회사에 냈던 보고서를 꺼낸다. 접힌 자리를 손날로 눌러 편다." }
      - goto: cafe_choices

  cafe_choices:
    actions:
      - choice:
          key: o1_desk
          presentation: explore
          prompt: "면회 시간까지 아직 조금 남았다."
          with: []
          options:
            - text: "시험 출력물을 읽는다"
              at: { x: 31, y: 94 }
              when: { var: read_trial, op: eq, value: false }
              goto: display_test
            - text: "결함 보고서를 읽는다"
              at: { x: 48, y: 90 }
              when: { var: read_report, op: eq, value: false }
              goto: company_report
            - text: "병동에서 연락이 왔는지 확인한다"
              at: { x: 66, y: 88 }
              when: { var: checked_phone, op: eq, value: false }
              goto: hospital_message
            - text: "내 렌즈에서 무엇을 확인할지 묻는다"
              when: { var: read_trial, op: eq, value: true }
              goto: plan_measurement

  display_test:
    actions:
      - set: { read_trial: true }
      - say: { channel: record, with: [], sound: read, text: "에모스 사내 시험 · 병원에 설치된 버전\n센서 입력 001 → 표시 01\n센서 입력 101 → 표시 01" }
      - say: { char: 수경, with: [지완], text: "실제로는 1이어도 101이어도, 화면이 앞자리를 잘라서 똑같이 01로 보여 줘요." }
      - say: { char: 지완, with: [수경], text: "그럼 저는 1이에요, 101이에요?" }
      - say: { char: 수경, with: [지완], text: "몰라요. 그때 실제 값은 접수표에 안 남아서, 지금은 확인할 수 없어요." }
      - say: { char: 지완, with: [수경], text: "100 넘으면 뭔데요." }
      - say: { char: 수경, with: [지완], text: "렌즈가 감정 반응을 아주 크게 읽었다는 뜻이에요. 역에서는 그 정도면 직원이 와요." }
      - say: { char: 지완, with: [수경], text: "…아." }
      - goto: cafe_choices

  company_report:
    actions:
      - set: { read_report: true }
      - say: { channel: record, with: [], text: "한신뉴로 결함 보고서 · 한수경 · 2033.08.11\n세 자리 입력의 앞자리가 화면에서 잘림. 병원 사용 중지 요청.\n회사 답변 · 실제 면회에 영향을 준 사례가 확인되면 재검토." }
      - say: { char: 지완, with: [수경], text: "두 달 전이네요." }
      - say: { char: 수경, with: [지완], text: "네. 면회 못 한 사람이 실제로 나와야 다시 보겠대요. 그래서 오늘 연차 내고 접수대 앞에 앉아 있었어요." }
      - say: { char: 지완, with: [수경], text: "기다리신 거네요. 저 같은 사람." }
      - say: { char: 수경, with: [지완], text: "…네." }
      - goto: cafe_choices

  hospital_message:
    actions:
      - set: { checked_phone: true }
      - say: { thread: "월계병원", speakerName: "월계병원", channel: message, side: them, with: [], text: "월계병원입니다. 보호자 면회는 저녁 8시 10분에 시작합니다. 접수대에서 기다려 주세요." }
      - say: { channel: action, with: [], when: { var: picked_up, op: eq, value: false }, text: "병원 문자를 닫는데 부재중 전화 알림에 아버지가 남긴 음성 메시지가 보인다. 지완은 휴대폰을 귀에 댄다." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지완아, 작은 통 찾았다. 지난번에 네가 사 온 거." }
      - say: { char: 동식_연락처, channel: dialogue, with: [], when: { var: picked_up, op: eq, value: false }, text: "지난번 통은 안 가져와도 된다. 먹고 씻지도 않고 가더니." }
      - say: { channel: thought, with: [], when: { var: picked_up, op: eq, value: true }, text: "아버지한테 저 왔다고 전해 줬을까. 아까 한 번 더 부탁할걸." }
      - goto: cafe_choices

  plan_measurement:
    title: "면회 전에"
    actions:
      - say: { char: 수경, with: [지완], text: "병실에 들어가면 렌즈가 한 번 더 재요. 그때 검사기를 연결해 두면, 잘리기 전 숫자도 같이 남길 수 있어요." }
      - say: { char: 지완, with: [수경], text: "그러면 내일은 혼자 들어가요?" }
      - say: { char: 수경, with: [지완], text: "그건 병원이 정해요. 제가 약속은 못 드려요." }
      - say: { char: 지완, with: [수경], text: "그럼 누구 좋으라고 하는 건데요." }
      - say: { char: 수경, with: [지완], text: "저요. 숫자가 남아야 회사에 다시 낼 수 있어요. 지완 씨한테는… 틀렸다는 종이 한 장이 생기고요." }
      - say: { char: 지완, with: [수경], text: "제 건 제가 먼저 볼게요. 아버지 쪽은 아무것도 안 남기고요." }
      - say: { char: 수경, with: [지완], text: "네. 그렇게 할게요." }
      - say: { channel: action, with: [지완, 수경], text: "휴대폰에 8시 10분 알람이 울린다. 지완은 식은 커피를 그대로 두고 일어난다. 수경이 종이를 챙겨 뒤따른다." }
      - goto: /2.yaml
