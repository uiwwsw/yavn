chapterTitle: "곳간 열쇠"
pov: "만석"

script:
  - scene: dark

scenes:
  # 어둠은 하나다. 삶이 끝날 때마다 같은 자리로 돌아온다.
  dark:
    title: "암흑"
    actions:
      - branch:
          cases:
            - when: { var: lives_done, op: gte, value: 4 }
              goto: /4.yaml
            - when: { var: lives_done, op: gte, value: 1 }
              goto: dark_again
          default: dark_first

  dark_first:
    pov: "???"
    actions:
      - bg: { id: void_empty, transition: cut }
      - say: { channel: narration, text: "눈을 떴다. 앞이 보이지 않는다.", wait: 650 }
      - music: void
      - say: { channel: narration, text: "숨을 쉬어 보는데, 내 숨소리도 들리지 않는다.", wait: 650 }
      - choice:
          key: where_am_i
          prompt: "여긴 어디지?"
          options:
            - { text: "모르겠음", saveText: "모르겠다.", goto: first_light }
            - { text: "지옥", saveText: "지옥인가.", goto: first_light }
            - { text: "천국", saveText: "천국인가.", goto: first_light }

  first_light:
    pov: "???"
    actions:
      - choice:
          key: first_light
          presentation: approach
          prompt: "멀리 작은 빛이 보인다."
          options:
            - text: "손을 뻗는다."
              at: { x: 54, y: 42 }
              mood: pale
              reveal:
                - "빛을 향해 조금 다가갔다."
                - "조금 더 다가가자 어둠 속에 희미한 빛들이 보였다."
              goto: first_memories
            - text: "그대로 있는다."
              gameOver:
                message: "한참 뒤, 빛이 꺼졌다."
                recoverToChoice: first_light

  first_memories:
    pov: "???"
    actions:
      - mood: off
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - goto: stars

  # 두 번째부터. 돌아왔다는 것만 알고, 어디로 돌아왔는지는 모른다.
  dark_again:
    pov: "???"
    actions:
      - bg: { id: void, transition: cut }
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "아까와 같은 어둠이다.", wait: 1300 }
      - say: { channel: narration, text: "방금까지 대답하던 내 이름이 생각나지 않는다." }
      - bg: { id: void_light, transition: dissolve, duration: 1450 }
      - say: { channel: narration, text: "반짝이던 것 중 하나가 꺼져 있다." }
      - say: { channel: narration, text: "꺼진 자리 옆에서 아직 들어가 보지 않은 빛이 손에 닿을 듯 깜박인다." }
      - goto: stars

  # 고르는 것은 사람이 아니라 그리움의 모양이다. 누군지는 가 봐야 안다.
  stars:
    pov: "???"
    actions:
      - choice:
          key: star
          presentation: approach
          prompt: "빛마다 낯선 풍경이 비친다. 어느 쪽으로 갈까?"
          options:
            - text: "깨 붙은 엿"
              at: { x: 26, y: 63 }
              when: { var: lived_1894, op: eq, value: false }
              mood: ember
              reveal:
                - "종이가 눅눅하다. 깨가 붙어 있다."
                - '"아버지, 깨 붙은 걸로요."'
              goto: go_1894
            - text: "부두의 고무신"
              at: { x: 73, y: 47 }
              when: { var: lived_1952, op: eq, value: false }
              mood: cold
              reveal:
                - "바람에 치맛자락이 들린다. 한쪽 고무신은 뒤축이 다 닳았다."
                - "배에서 마지막 사람이 내린다. 부두에 선 여자는 자리를 안 뜬다."
              goto: go_1952
            - text: "갈치 가시"
              at: { x: 46, y: 21 }
              when: { var: lived_1988, op: eq, value: false }
              mood: pale
              reveal:
                - "도시락 뚜껑 안쪽에 물방울이 맺혀 있다."
                - "뚜껑을 여는 손에서 비린내가 난다. 접시 한쪽에 가시가 수북하다."
              goto: go_1988
            - text: "답장을 못 받은 사람"
              at: { x: 81, y: 71 }
              when:
                all:
                  - { var: lived_2026, op: eq, value: false }
                  - { var: lives_done, op: gte, value: 3 }
              mood: pale
              reveal:
                - "그쪽만 깜박인다."
                - "글자 한 줄이 떠 있고, 그 아래가 비어 있다."
                - "커서가 깜박인다. 아무도 치지 않는다."
              goto: go_2026

  go_1894:
    pov: "???"
    actions:
      - set: { lived_1894: true }
      - add: { lives_done: 1 }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "먼저 주판알 소리가 들렸다.", wait: 1100 }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - wait: 950
      - say: { channel: narration, text: "선창에 매 놓은 배의 돛대가 하나씩 드러났다.", wait: 1400 }
      - wait: 300
      - say: { channel: card, with: [], text: "1894년 6월\n제물포\n내 이름은 만석.", wait: 2000 }
      - mood: off
      - goto: yard

  go_1952:
    pov: "???"
    actions:
      - set: { lived_1952: true }
      - add: { lives_done: 1 }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "뺨에 짠 바람이 닿았다.", wait: 1100 }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - wait: 950
      - say: { channel: narration, text: "뱃고동이 울리자 부두 사람들이 한꺼번에 바다 쪽을 봤다.", wait: 1400 }
      - wait: 300
      - say: { channel: card, with: [], text: "1952년 12월\n부산\n내 이름은 순임.", wait: 2000 }
      - mood: off
      - goto: /1.yaml

  go_1988:
    pov: "???"
    actions:
      - set: { lived_1988: true }
      - add: { lives_done: 1 }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "텔레비전 소리가 들렸다.", wait: 1100 }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - wait: 950
      - say: { channel: narration, text: "푸른 화면 불빛이 침대 여섯 개 위로 번졌다.", wait: 1400 }
      - wait: 300
      - say: { channel: card, with: [], text: "1988년 9월\n서울\n내 이름은 민재.", wait: 2000 }
      - mood: off
      - goto: /2.yaml

  go_2026:
    pov: "???"
    actions:
      - set: { lived_2026: true }
      - add: { lives_done: 1 }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "책상 아래에서 컴퓨터 돌아가는 소리가 났다.", wait: 1100 }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - wait: 950
      - say: { channel: narration, text: "모니터 속 영상은 멈춰 있다. 그 뒤 창문에 내 얼굴이 비친다.", wait: 1400 }
      - wait: 300
      - say: { channel: card, with: [], text: "2026년 3월\n서울\n내 이름은 지안.", wait: 2000 }
      - mood: off
      - goto: /3.yaml

  # 어느 어둠에서든 쥐지 않기로 하면 여기로 온다. 게임 오버가 아니다.
  dark_still:
    pov: "???"
    actions:
      - bg: { id: void, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "손을 내린다. 저쪽 빛은 그대로다." }
      - ending: still

  yard:
    title: "객주 마당"
    actions:
      - bg: { id: jemulpo_yard, transition: cut }
      - music: port
      - place: "1894년 6월 · 제물포 객주 마당 · 만석"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석], text: "주인어른, 덕이 어멈이 화도진 사람 열댓을 데리고 왔습니다." }
      - say: { char: 봉구, with: [만석], text: "쌀을 외상으로 달랍니다. 가을에 갚는다고요. 저자 쌀집은 죄다 문을 걸었답니다." }
      - say:
          channel: action
          with: []
          when: { var: t_kin, op: eq, value: true }
          text: "안채에서 기침 소리가 난다. 주판알을 밀던 손이 멈춘다."
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지, 진지 드세요. 봉구 오라버니 것도 퍼 왔어요." }
      - say: { char: 끝순, with: [만석], text: "덕이도 왔어요? 지난번에 저한테 조개 한 줌 주고 갔는데." }
      - say: { char: 봉구, with: [끝순], text: "왔지. 여덟 살 먹은 게 어미 등에 업혀 왔더라." }
      - say: { char: 만석, with: [끝순, 봉구], text: "기침이 왜 그 모양이냐." }
      - say: { char: 끝순, with: [만석], text: "밤바람 좀 쐤어요. 포구에 군사들 내리는 거 구경하느라고." }
      - say: { char: 봉구, with: [만석], text: "총 멘 것들한테 왜 가까이 가. 덕이보다 네가 더 애 같다." }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "총은 멀리 있었어요. 말이 코앞까지 왔는데, 고개를 한참 들어야 눈이 보이더라고요." }
      - mood: { tone: warm, level: 2 }
      - say: { channel: action, with: [], text: "웃을 때 왼쪽 눈이 먼저 감긴다. 어려서부터 그랬다." }
      - say: { char: 끝순, with: [만석], text: "아버지, 이번에 마포 가시면 엿 사다 주세요. 깨 붙은 거." }
      - say: { char: 만석, with: [끝순], text: "열여섯이나 먹은 게 아직도 엿 타령이냐." }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "여든 먹어도 엿은 엿이죠." }
      - mood: off
      - say: { char: 봉구, with: [만석], text: "주인어른, 포구에 왜선이 또 들어왔습니다. 오늘만 넉 척째예요." }
      - say: { char: 봉구, with: [만석], text: "쌀이 열흘 새 닷 냥에서 아홉 냥이 됐습니다. 저자에선 내일 열두 냥 간답니다." }
      - say: { char: 만석, with: [봉구], text: "곳간에 몇 섬이냐." }
      - say: { char: 봉구, with: [만석], motion: sigh, text: "삼백 하고 열두 섬이요. …어젯밤에도 세셨잖습니까. 그저께 밤에도요." }
      - say: { char: 만석, with: [봉구], text: "그중에 우리 것은." }
      - say: { char: 봉구, with: [만석], text: "백마흔 섬입니다. 나머지는 맡아 둔 거고, 강경 윤 객주 것이 제일 많습니다." }
      - say: { channel: thought, with: [], text: "맡은 쌀에 손대면 그날로 끝이다." }
      - say: { channel: action, with: [], sound: granary_key, text: "허리춤의 곳간 열쇠를 만져 본다. 잘 때도 풀지 않는다." }
      - say:
          channel: action
          with: []
          when: { var: t_hold, op: eq, value: true }
          text: "만지면 손가락이 저절로 오그라든다. 언제부터 그랬는지는 모른다."
      - goto: rice_choice

  rice_choice:
    actions:
      - choice:
          key: l1_rice
          prompt: "대문 밖에서 누가 아이를 달래고 있다."
          char: 봉구
          with: [봉구]
          options:
            - text: "곳간을 열고 쌀을 나눈다."
              saveText: "곳간을 연다. 우리 것에서 한 집에 닷 되씩."
              goto: rice_try
            - text: "대문을 잠근다."
              saveText: "문을 닫아건다. 값은 더 오른다."
              goto: rice_shut

  rice_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: hold }
              goto: rice_cannot
            - when: { var: last_taken, op: eq, value: say }
              goto: rice_cannot
            - when: { var: last_taken, op: eq, value: guard }
              goto: rice_cannot
            - when: { var: last_taken, op: eq, value: live }
              goto: rice_cannot
          default: rice_open

  rice_cannot:
    actions:
      - sticker: { id: key, image: key_sticker, x: 50, y: 32, width: "clamp(150px, 20%, 280px)", enter: fadeIn, inputLockMs: 300 }
      - wait: 1100
      - say: { channel: action, with: [], text: "열쇠를 자물쇠에 꽂는다. 손목이 돌아가지 않는다.", wait: 900, unskippable: true }
      - say: { channel: thought, with: [], text: "열쇠를 돌리려는데 쥔 손에 힘만 더 들어간다. 대문 밖에선 여전히 열어 달라는 소리가 난다." }
      - clearSticker: { id: key, leave: fadeOut }
      - say: { char: 봉구, with: [만석], motion: headtilt, text: "주인어른? 여시는 겁니까, 마시는 겁니까." }
      - say: { char: 만석, with: [봉구], text: "…대문 닫아라." }
      - goto: rice_shut

  rice_open:
    actions:
      - set: { l1_gave: true }
      - say: { char: 만석, with: [봉구], text: "되 가져오너라. 한 집에 닷 되다." }
      - say: { char: 만석, with: [봉구], text: "치부책에 이름 적고." }
      - say: { char: 봉구, with: [만석], motion: shake, text: "한 집에 닷 되씩이면 우리 쌀도 금방 줄어요. 맡은 쌀은 내줄 수도 없고요." }
      - say: { char: 만석, with: [봉구], text: "안다. 우리 것에서 내라." }
      - say: { char: 봉구, with: [만석], motion: shake, text: "저 집들은 가을까지 기다려도 받을 게 없을 겁니다." }
      - say: { char: 만석, with: [봉구], text: "그것도 안다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석, 봉구], text: "덕이네는 애가 넷이에요, 오라버니. 닷 되면 나흘인데." }
      - say: { char: 봉구, with: [끝순, 만석], text: "엿 되? 닷 되씩 해도 모자란다는데 너까지 왜 그래." }
      - say: { channel: action, with: [], text: "해 질 때까지 되로 쌀을 퍼 줬다. 우리 쌀 백마흔 섬 중에 스무 섬이 나갔다." }
      - say: { channel: action, with: [], text: "덕이 어멈이 절을 하려는 걸 그 애가 붙들어 일으켰다." }
      - goto: fever

  rice_shut:
    actions:
      - say: { channel: action, with: [], text: "빗장이 걸린다. 대문 밖이 한동안 조용하다." }
      - say: { channel: action, with: [], text: "대문 안에서 끝순이가 훌쩍이는 소리가 들렸다." }
      - say: { char: 끝순, with: [], text: "덕이 어머니." }
      - say: { char: 끝순, with: [], text: "우리 아버지 그런 사람 아니에요." }
      - say: { char: 끝순, with: [], text: "내일 다시 와 보세요, 네?" }
      - say: { channel: thought, with: [], text: "쌀값이 더 오를 때까지는 열지 않을 작정이었다. 그 애는 그걸 몰랐다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지. 덕이가 업혀 왔어요. 여덟 살이." }
      - say: { char: 만석, with: [끝순], text: "곳간 쌀 절반이 남의 것이다. 남의 것을 퍼 주면 그건 도둑질이야." }
      - say: { char: 끝순, with: [만석], text: "우리 것도 백마흔이잖아요." }
      - say: { char: 만석, with: [끝순], text: "그 백마흔이 네 혼수고 내 늙어 먹을 것이다." }
      - say: { char: 끝순, with: [만석], motion: droop, text: "…진지 식어요." }
      - say: { channel: action, with: [], text: "그날 밤 치부책을 폈다가 덮었다. 셈할 것이 없었다." }
      - goto: fever

  fever:
    title: "학질"
    actions:
      - bg: { id: jemulpo_room, transition: fade, duration: 900 }
      - place: { text: "10일 뒤 · 안채", presentation: center }
      - move: { id: 끝순, style: reset }
      - char: { id: 만석, position: left }
      - char: { id: 끝순, position: center, emotion: sick }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석], text: "의원 말이 학질이랍니다. 하루걸러 열이 오르는 게 꼭 그렇다고요." }
      - say: { char: 봉구, with: [만석], text: "양인 병원에 금계랍이란 가루약이 있답니다. 한 병에 스무 냥." }
      - say: { char: 만석, with: [봉구], text: "사 와라. 두 병 사 와라." }
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_gave, op: eq, value: true }
          text: "…외상으로 나간 쌀만큼 다시 들여놓느라 궤에 스물여덟 냥밖에 없습니다."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_gave, op: eq, value: true }
          text: "…한 병만 사 와라. 쌀을 내다 팔면 더 사자."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_gave, op: eq, value: false }
          text: "예. 궤에서 마흔 냥 꺼내 가겠습니다."
      - say: { char: 봉구, with: [만석], text: "그런데 하나 더 있습니다. 마포 김 주사한테서 기별이 왔어요." }
      - say: { char: 봉구, with: [만석], text: "삼백 섬을 한꺼번에 사겠답니다. 섬에 열닷 냥. 모레까진 직접 와서 수결하시랍니다." }
      - say: { char: 봉구, with: [만석], when: { var: l1_gave, op: eq, value: true }, text: "여덟 섬이 모자란다고 알렸더니 그만큼은 마포서 따로 구한다더군요." }
      - say: { char: 만석, with: [봉구], text: "삼백이면 우리 것으로는 모자란다." }
      - say: { char: 봉구, with: [만석], text: "맡은 쌀까지 넘기고 윤 객주한테는 값으로 쳐 주면 됩니다. 그게 더 남고요." }
      - say: { channel: action, with: [], text: "지금 쌀을 내줘도 값이 더 오르면 손해다. 하지만 열닷 냥이면 놓치기 아까운 값이다." }
      - say: { char: 만석, with: [봉구], when: { var: l1_gave, op: eq, value: false }, text: "…열닷 냥이면 사천오백 냥이다." }
      - say: { char: 만석, with: [봉구], when: { var: l1_gave, op: eq, value: true }, text: "…이백아흔두 섬이면 사천삼백여든 냥이다." }
      - say: { char: 봉구, with: [만석], text: "예. 오가는 데 사흘입니다." }
      - say: { char: 끝순.sick, with: [만석], text: "다녀오세요, 아버지. 저 괜찮아요. 오라버니 있잖아요." }
      - say: { char: 끝순.sick, with: [만석], motion: laugh, text: "올 때 엿 잊지 마시고요. 깨 붙은 걸로." }
      - say: { channel: action, with: [], text: "웃는데 왼쪽 눈이 다 감기지 않는다. 이마에 다시 열이 오른다." }
      - goto: leave_choice

  leave_choice:
    actions:
      - choice:
          key: l1_leave
          prompt: "이마가 불덩이다. 마포까지는 팔십 리."
          with: [끝순]
          options:
            - text: "마포에 간다."
              saveText: "마포에 올라간다. 사흘이면 돌아온다."
              goto: leave_try
            - text: "봉구를 보내고 남는다."
              saveText: "봉구를 대신 보내고 곁에 남는다."
              goto: stay_home

  leave_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: kin }
              goto: leave_cannot
            - when: { var: last_taken, op: eq, value: free }
              goto: leave_cannot
            - when: { var: last_taken, op: eq, value: stay }
              goto: leave_cannot
            - when: { var: last_taken, op: eq, value: dare }
              goto: leave_cannot
          default: go_mapo

  leave_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [], text: "짚신을 신고 문지방에 선다. 발이 넘어가지 않는다.", wait: 900, unskippable: true }
      - say: { channel: action, with: [], text: "등 뒤에서 기침 소리가 난다. 돌아보니 호롱불은 켜져 있다." }
      - say: { channel: thought, with: [], text: "호롱불은 분명 켜져 있는데, 발을 떼려는 순간 숨부터 막힌다." }
      - say: { channel: thought, with: [], text: "봉구는 마루 아래에서 내 짚신만 보고 있다." }
      - say: { char: 만석, with: [봉구], text: "봉구야. 네가 가라. 수결은 네가 해라." }
      - goto: stay_home

  go_mapo:
    actions:
      - say: { char: 만석, with: [봉구], text: "약 먹이고, 밤에 물수건 갈아 줘라. 사흘이다." }
      - say: { char: 봉구, with: [만석], motion: nod, text: "예. 다녀오십시오." }
      - bg: { id: jemulpo_yard, transition: fade, duration: 1200 }
      - place: "3일 뒤 저녁 · 객주 마당"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say: { char: 만석, with: [봉구], when: { var: l1_gave, op: eq, value: false }, text: "수결했다. 사천오백 냥이다." }
      - say: { char: 만석, with: [봉구], when: { var: l1_gave, op: eq, value: true }, text: "수결했다. 사천삼백여든 냥이다." }
      - say: { char: 만석, with: [봉구], text: "엿도 사 왔다." }
      - say: { channel: action, with: [], text: "봉구가 대문 안쪽에 서 있다. 저녁인데 마당에 불이 안 켜져 있다." }
      - say: { char: 만석, with: [봉구], text: "…너는 왜 마당에 나와 섰느냐." }
      - say: { char: 봉구, with: [만석], motion: droop, text: "어제 새벽입니다." }
      - mood: { tone: grief, level: 2 }
      - wait: 1100
      - say: { channel: action, with: [], text: "엿 봉지가 손에 있다. 사흘을 들고 다녀서 종이가 눅눅하다.", wait: 900, unskippable: true }
      - say: { char: 봉구, with: [만석], text: "약은 사다 먹였습니다." }
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_gave, op: eq, value: true }
          text: "약이 한 병뿐이었습니다. 어제 새벽에는 물수건을 갈아도 열이 안 내렸습니다."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_gave, op: eq, value: false }
          text: "두 병 다요. 그래도 안 들었습니다."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_gave, op: eq, value: false }
          text: "의원도 이런 건 처음 본다고… 예."
      - say: { char: 만석, with: [봉구], text: "…나를 찾더냐." }
      - say: { char: 봉구, with: [만석], text: "두 번이요." }
      - say: { char: 만석, with: [봉구], text: "뭐라더냐." }
      - say: { char: 봉구, with: [만석], motion: droop, text: "아버지 진지 드셨느냐고요. 두 번 다 그것만 물었습니다." }
      - wait: 900
      - say: { channel: action, with: [], text: "엿 봉지를 궤짝에 넣었다. 그 궤짝은 그 뒤로 열지 않았다." }
      - mood: off
      - set: { l1_end: gone }
      - goto: old_age

  stay_home:
    actions:
      - say: { char: 봉구, with: [만석], text: "김 주사가 제 수결을 받아 줄까요. …가 보기는 하겠습니다." }
      - say: { channel: action, with: [], text: "사흘 밤 물수건을 갈았다. 나흘째 아침에 그 애가 미음을 달라고 했다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지 수염이 왜 그래요. 꼭 엿장수 같아." }
      - say: { channel: action, with: [], text: "웃는다. 왼쪽 눈이 먼저 감긴다." }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석, 끝순], motion: shake, text: "김 주사가 서기하고는 말도 안 섞습디다. 쌀은 용산 객주 것으로 채웠답니다." }
      - branch:
          cases:
            - when: { var: l1_gave, op: eq, value: true }
              goto: after_ruined
          default: after_kept

  after_kept:
    actions:
      - say: { char: 만석, with: [봉구], text: "됐다. 쌀은 곳간에 있다." }
      - say: { char: 만석, with: [봉구], text: "쌀값은 다시 오를 게다." }
      - say: { channel: action, with: [], text: "그해 햇곡이 나자 쌀값은 닷 냥으로 떨어졌다. 이듬해 가을까지도 그 값이었다." }
      - say: { char: 끝순, with: [만석], text: "아버지, 묵은쌀에 바구미 생겨요. 덕이네 좀 주면 안 돼요?" }
      - say: { char: 끝순, with: [만석], text: "지금이라도요." }
      - say: { char: 만석, with: [끝순], text: "바구미는 체로 치면 된다." }
      - say: { char: 끝순, with: [만석], text: "덕이 지난겨울에 갔어요." }
      - wait: 900
      - say: { channel: action, with: [], text: "체를 가져오라 했더니 그 애가 부엌 문을 닫고 나갔다. 저녁에 들인 진지는 다 식어 있었다." }
      - say: { channel: action, with: [], text: "끝순이는 스물에 강화로 시집을 갔다. 혼수는 넉넉히 넣었다." }
      - say: { channel: action, with: [], text: "강화로 간 뒤로 그 애는 친정에 한 번도 오지 않았다." }
      - set: { l1_end: kept }
      - goto: old_age

  after_ruined:
    actions:
      - say: { char: 만석, with: [봉구], text: "됐다. 애가 일어났으면 됐다." }
      - say: { channel: action, with: [], text: "가을에 외상을 갚은 집은 두 집이었다. 햇곡이 풀리자 쌀값은 닷 냥이 됐다." }
      - say: { channel: action, with: [], text: "쌀 들여올 때 진 빚부터 갚았다. 맡은 쌀까지 내다 팔았다가 강경 윤 객주가 보낸 사람이 들이닥쳤다." }
      - say: { channel: action, with: [], text: "이듬해 봄에 객주 문을 닫았다. 쌀을 풀어 준 지 4년이 지난 여름에도 식구는 포구 뒷골목 셋방에 있었다." }
      - bg: { id: jemulpo_room, transition: fade, duration: 900, place: "쌀을 풀고 4년 뒤 여름 · 제물포 뒷골목 셋방" }
      - say: { char: 끝순, with: [만석], text: "아버지, 저 내일부터 왜인 정미소 나가요. 쌀에서 뉘 고르는 일인데 하루 열두 전이래요." }
      - say: { char: 만석, with: [끝순], text: "거긴 겨 먼지가 눈처럼 날린다더라. 네 기침에 거길 어찌 가." }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "그럼 아버지가 대신 가실래요? …방세부터 내야죠. 석 달 밀렸잖아요." }
      - say: { char: 끝순, with: [만석], text: "아버지. 그때 쌀 푼 거요." }
      - say: { char: 만석, with: [끝순], text: "…" }
      - say: { char: 끝순, with: [만석], text: "잘한 거예요." }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "덕이 지금 열둘이에요. 저번에 장에서 봤는데 키가 저만해요." }
      - say: { channel: action, with: [], text: "한 대꾸도 못 했다. 그 애도 두 번 다시 그 일을 입에 올리지 않았다." }
      - say: { channel: action, with: [], text: "말릴 돈이 없었다. 아침마다 정미소 문 앞까지 데려다주기를 여섯 해 했다." }
      - say: { channel: action, with: [], text: "스물여섯 되던 겨울에 누웠다. 나는 머리맡에 있었고, 금계랍 살 스무 냥은 없었다." }
      - set: { l1_end: poor }
      - goto: old_age

  old_age:
    title: "10월"
    actions:
      - bg: { id: jemulpo_room, transition: fade, duration: 1200 }
      - place: "1910년 10월 · 제물포"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: gone }
          text: "어르신, 곳간은 제가 맡겠습니다. 열쇠는 이제 풀어 놓으시지요."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: gone }
          text: "잘 때도 차고 계시니 허리에 자국이 안 없어지잖습니까."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: gone }
          text: "죽거든 풀어라. 그 엿은… 궤짝에 아직 있다."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: gone }
          text: "버려라."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: kept }
          text: "강화에 기별했습니다, 어르신. …못 온답니다."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: kept }
          text: "막내가 홍역이래요."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: kept }
          text: "애가 아픈데 어찌 오냐. 그 애라면 아이 곁에 있겠지."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: poor }
          text: "약값은 제가 치렀습니다, 어르신. 끝순이 때는 제가 서기 삯밖에 없어서…"
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: poor }
          text: "네 탓이 아니다. 문 닫지 마라."
      - say:
          char: 만석
          with: [봉구]
          text: "네가 객주를 일으켰으니 됐다. 그 집 문이나 잘 열어 둬라."
      - say: { char: 봉구, with: [만석], text: "뭐 드시고 싶은 건 없습니까." }
      - wait: 1600
      - say: { char: 만석, with: [봉구], text: "…엿." }
      - say: { char: 봉구, with: [만석], motion: headtilt, text: "예? 어떤 걸로 사 올까요." }
      - wait: 1400
      - say: { char: 만석, with: [봉구], text: "…됐다. 불이나 끄지 마라.", wait: 1900 }
      - bg: { id: void, transition: fade, duration: 2600 }
      - music: void
      - goto: void_one

  # 재판. 신도 관리자도 없다. 묻는 쪽과 답하는 쪽이 같아서 끝나지 않는다.
  void_one:
    title: "암흑"
    actions:
      - bg: { id: void, transition: fade, duration: 1800 }
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "포구에서 밤바다를 보고 있으면 눈이 어둠에 익었다. 여기는 아무리 있어도 앞이 안 보인다." }
      - say:
          channel: narration
          when:
            all:
              - { var: l1_end, op: eq, value: gone }
              - { var: l1_gave, op: eq, value: false }
          text: "쉰여섯 해가 전부 떠오른다. 사천오백 냥. 깨 붙은 엿. 진지 드셨느냐는 말."
      - say:
          channel: narration
          when:
            all:
              - { var: l1_end, op: eq, value: gone }
              - { var: l1_gave, op: eq, value: true }
          text: "쉰여섯 해가 전부 떠오른다. 사천삼백여든 냥. 깨 붙은 엿. 진지 드셨느냐는 말."
      - say:
          channel: narration
          when: { var: l1_end, op: eq, value: kept }
          text: "쉰여섯 해가 전부 떠오른다. 바구미 슨 삼백 섬. 강화로 떠난 뒤 돌아오지 않은 딸."
      - say:
          channel: narration
          when: { var: l1_end, op: eq, value: poor }
          text: "쉰여섯 해가 전부 떠오른다. 정미소 문 앞. 겨 먼지. 끝내 마련하지 못한 스무 냥."
      - wait: 700
      - say: { channel: narration, text: "묻는 소리가 난다." }
      - say: { channel: narration, text: "어디서 나는지 찾다가 그만둔다. 내 안에서 난다." }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, when: { var: l1_gave, op: eq, value: false }, text: "그날 곳간을 열었더라면." }
      - say: { channel: narration, when: { var: l1_gave, op: eq, value: false }, text: "열지 않을 거라면 그 까닭을 그 애한테 한 번이라도 말해 줄걸." }
      - say: { channel: narration, text: "엿." }
      - say: { channel: narration, text: "엿 얘기 말고 다른 얘기를 한 번만." }
      - say: { channel: narration, text: "고맙다고 했어야 했다." }
      - say: { channel: narration, text: "미안하다고도." }
      - say: { channel: narration, when: { var: l1_end, op: eq, value: gone }, text: "포구를 비운 사흘 동안, 곳간에 둔 쌀부터 걱정했다." }
      - wait: 900
      - say: { channel: narration, text: "봉구한테 열쇠를 맡겨 두고 끝순이랑 포구 밖에나 나가 볼걸." }
      - say: { channel: narration, text: "쉰여섯 해를 다 뒤져도 변명 하나가 안 나온다." }
      - say: { channel: narration, text: "끝순아, 하고 불러 봤다. 이번엔 대답이 없다." }
      - bg: { id: void_light, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "가져갈 수 있는 것은 하나다. 나머지는 여기 두고 간다." }
      - goto: void_one_choice

  void_one_choice:
    actions:
      - choice:
          key: v1
          prompt: "쉰여섯 해 동안 남은 후회 중 하나를 가져간다."
          options:
            - text: "하지 못한 말"
              saveText: "말을 했어야 했다."
              set: { t_say: true, last_taken: say, deg_last: "118.5" }
              goto: void_one_go
            - text: "자유롭게 살고 싶었던 마음"
              saveText: "어디에도 매이지 말았어야 했다."
              set: { t_free: true, last_taken: free, deg_last: "307.9" }
