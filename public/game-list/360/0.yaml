chapterTitle: "곳간 열쇠"

script:
  - scene: dark

scenes:
  # 어둠은 하나다. 삶이 끝날 때마다 같은 자리로 돌아온다.
  dark:
    title: "암흑"
    actions:
      - bg: { id: void, transition: cut }
      - branch:
          cases:
            - when: { var: lives_done, op: gte, value: 4 }
              goto: /4.yaml
            - when: { var: lives_done, op: gte, value: 1 }
              goto: dark_again
          default: dark_first

  # 처음 눈을 뜬 자리. 아직 아무것도 모르고, 아는 것은 그립다는 것뿐이다.
  dark_first:
    actions:
      - say: { channel: narration, text: "끝에는 뭐가 있을까, 생각해 본 적이 있다." }
      - music: void
      - say: { channel: narration, text: "지금 그 끝에 있다." }
      - say: { channel: narration, text: "어둡다. 끊이지 않고 어둡다." }
      - wait: 900
      - say: { channel: narration, text: "아련하다." }
      - say: { channel: narration, text: "뭐가 아련한지는 모르겠다. 모르겠는데 가슴 한쪽이 아려 온다." }
      - wait: 1100
      - say: { channel: narration, text: "사무치게 그립다." }
      - wait: 700
      - effect: { name: starfall, wait: true }
      - bg: { id: void_light, transition: dissolve, duration: 3600 }
      - say: { channel: narration, text: "별 하나가 반짝인다." }
      - wait: 600
      - say: { channel: narration, text: "…아, 누군가 보고 싶다." }
      - wait: 800
      - say: { channel: narration, text: "하나가 아니다. 반짝이는 것이 몇 개 더 있다." }
      - goto: stars

  # 두 번째부터. 돌아왔다는 것만 알고, 어디로 돌아왔는지는 모른다.
  dark_again:
    actions:
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "여기다. 여기였던 것 같다." }
      - say: { channel: narration, text: "방금 산 것이 벌써 흐리다. 쥔 것 하나만 또렷하다." }
      - bg: { id: void_light, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "반짝이던 것 중 하나가 꺼져 있다." }
      - say: { channel: narration, text: "남은 것이 아직 그립다." }
      - goto: stars

  # 고르는 것은 사람이 아니라 그리움의 모양이다. 누군지는 가 봐야 안다.
  stars:
    actions:
      - choice:
          key: star
          presentation: explore
          prompt: "누군지는 모르겠는데, 어떻게 그리운지는 안다."
          options:
            - text: "엿을 기다린 아이"
              at: { x: 26, y: 63 }
              when: { var: lived_1894, op: eq, value: false }
              goto: go_1894
            - text: "부두에 두고 온 사람"
              at: { x: 71, y: 38 }
              when: { var: lived_1952, op: eq, value: false }
              goto: go_1952
            - text: "새벽마다 오던 사람"
              at: { x: 46, y: 21 }
              when: { var: lived_1988, op: eq, value: false }
              goto: go_1988
            - text: "답장을 못 받은 사람"
              at: { x: 81, y: 71 }
              when:
                all:
                  - { var: lived_2026, op: eq, value: false }
                  - { var: lives_done, op: gte, value: 3 }
              goto: go_2026

  go_1894:
    actions:
      - set: { lived_1894: true }
      - add: { lives_done: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그쪽으로 기운다. 처음에는 느리다.", autoAdvance: 1900 }
      - bg: { id: void_near, transition: wipeLeft, duration: 320 }
      - effect: { name: speedlines, wait: true }
      - say: { channel: narration, text: "그리운 것만 남고 나머지가 빠져나간다.", autoAdvance: 1800 }
      - effect: { name: flash, wait: true }
      - say: { channel: card, with: [], text: "1894년 유월\n제물포" }
      - goto: yard

  go_1952:
    actions:
      - set: { lived_1952: true }
      - add: { lives_done: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그쪽으로 기운다. 기울고 나니 빠르다.", autoAdvance: 1900 }
      - bg: { id: void_near, transition: wipeRight, duration: 320 }
      - effect: { name: speedlines, wait: true }
      - say: { channel: narration, text: "그리운 것만 남고 나머지가 빠져나간다.", autoAdvance: 1800 }
      - effect: { name: flash, wait: true }
      - say: { channel: card, with: [], text: "1952년 십이월\n부산" }
      - goto: /1.yaml

  go_1988:
    actions:
      - set: { lived_1988: true }
      - add: { lives_done: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그쪽으로 기운다. 가까웠던 모양이다.", autoAdvance: 1900 }
      - bg: { id: void_near, transition: wipeLeft, duration: 320 }
      - effect: { name: speedlines, wait: true }
      - say: { channel: narration, text: "그리운 것만 남고 나머지가 빠져나간다.", autoAdvance: 1800 }
      - effect: { name: flash, wait: true }
      - say: { channel: card, with: [], text: "1988년 구월\n서울" }
      - goto: /2.yaml

  go_2026:
    actions:
      - set: { lived_2026: true }
      - add: { lives_done: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그쪽으로 기운다. 멀어서 오래 걸린다.", autoAdvance: 1900 }
      - bg: { id: void_near, transition: wipeRight, duration: 320 }
      - effect: { name: speedlines, wait: true }
      - say: { channel: narration, text: "그리운 것만 남고 나머지가 빠져나간다.", autoAdvance: 1800 }
      - effect: { name: flash, wait: true }
      - say: { channel: card, with: [], text: "2026년 삼월\n서울" }
      - goto: /3.yaml

  # 어느 어둠에서든 쥐지 않기로 하면 여기로 온다. 게임 오버가 아니다.
  dark_still:
    actions:
      - bg: { id: void, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "반짝이던 것이 반짝인 채로 있다. 서두르는 것은 아무것도 없다." }
      - ending: still

  yard:
    title: "객주 마당"
    actions:
      - bg: { id: jemulpo_yard, transition: fade, duration: 900 }
      - music: port
      - place: "1894년 유월 · 제물포 객주 마당"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석], text: "주인어른, 포구에 왜선이 또 들어왔습니다. 오늘만 넉 척째예요." }
      - say: { char: 봉구, with: [만석], text: "쌀이 열흘 새 닷 냥에서 아홉 냥이 됐습니다. 저자에선 내일 열두 냥 간답니다." }
      - say: { char: 만석, with: [봉구], text: "곳간에 몇 섬이냐." }
      - say: { char: 봉구, with: [만석], motion: sigh, text: "삼백 하고 열두 섬이요. 어젯밤에도 세셨잖습니까. 그저께 밤에도요." }
      - say: { channel: action, with: [], text: "허리춤의 곳간 열쇠를 만져 본다. 잘 때도 풀지 않는다." }
      - say:
          channel: action
          with: []
          when: { var: t_hold, op: eq, value: true }
          text: "만지면 손가락이 저절로 오그라든다. 언제부터 그랬는지는 모른다."
      - say:
          channel: action
          with: []
          when: { var: t_kin, op: eq, value: true }
          text: "안채에서 기침 소리가 난다. 주판알이 손에서 미끄러진다."
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지, 진지 드세요. 봉구 오라버니 것도 퍼 왔어요." }
      - say: { char: 만석, with: [끝순, 봉구], text: "기침이 왜 그 모양이냐." }
      - say: { char: 끝순, with: [만석], text: "밤바람 좀 쐤어요. 포구에 군사들 내리는 거 구경하느라고." }
      - say: { char: 봉구, with: [만석], text: "열여섯 먹은 처자가 총 멘 것들을 구경해?" }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "총은 안 무섭던데요. 말이 무섭지. 말이 그렇게 큰 줄 몰랐어요." }
      - say: { channel: action, with: [], text: "웃을 때 왼쪽 눈이 먼저 감긴다. 어려서부터 그랬다." }
      - say: { char: 봉구, with: [만석], text: "그리고 주인어른. 대문 밖에 덕이 어멈이 와 있습니다. 화도진 사람들 열댓하고요." }
      - say: { char: 봉구, with: [만석], text: "쌀을 외상으로 달랍니다. 가을에 갚는다고요. 저자 쌀집은 죄다 문을 걸었답니다." }
      - goto: rice_choice

  rice_choice:
    actions:
      - choice:
          key: l1_rice
          prompt: "대문 밖에서 누가 아이를 달래고 있다."
          char: 봉구
          with: [봉구]
          options:
            - text: "곳간을 연다. 한 집에 닷 되씩, 가을에 받는다."
              goto: rice_try
            - text: "문을 닫아건다. 값은 더 오른다."
              goto: rice_shut

  rice_try:
    actions:
      - branch:
          cases:
            - when: { var: t_hold, op: eq, value: true }
              goto: rice_cannot
          default: rice_open

  rice_cannot:
    actions:
      - sticker: { id: key, image: key_sticker, x: 50, y: 32, width: "clamp(150px, 20%, 280px)", enter: fadeIn, inputLockMs: 300 }
      - wait: 1100
      - say: { channel: action, with: [], text: "열쇠를 자물쇠에 댄다. 손목이 돌아가지 않는다.", wait: 900, unskippable: true }
      - say: { channel: thought, with: [], text: "쥐고 있어야 한다는 생각이 어디서 오는지 모르겠다. 내 생각 같지가 않다." }
      - clearSticker: { id: key, leave: fadeOut }
      - say: { char: 봉구, with: [만석], motion: headtilt, text: "주인어른? 여시는 겁니까, 마시는 겁니까." }
      - say: { char: 만석, with: [봉구], text: "…대문 닫아라." }
      - goto: rice_shut

  rice_open:
    actions:
      - set: { l1_gave: true }
      - say: { char: 만석, with: [봉구], text: "되 가져오너라. 한 집에 닷 되다. 치부책에 이름 적고." }
      - say: { char: 봉구, with: [만석], motion: shake, text: "가을에 못 받습니다. 저 사람들은 가을에도 없어요." }
      - say: { char: 만석, with: [봉구], text: "안다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석, 봉구], text: "덕이네는 애가 넷이에요, 오라버니. 닷 되면 나흘인데." }
      - say: { char: 봉구, with: [끝순, 만석], text: "그래서 엿 되 주자고? 네가 서기 해라, 그럼." }
      - say: { channel: action, with: [], text: "해 질 때까지 되질을 했다. 곳간에서 스무 섬이 나갔다." }
      - goto: fever

  rice_shut:
    actions:
      - say: { channel: action, with: [], text: "빗장이 걸린다. 대문 밖이 한동안 조용하다." }
      - say: { channel: action, with: [], text: "조용한 뒤에 그 애 목소리가 났다. 대문 밖이다. 언제 나갔는지 모르겠다." }
      - say: { channel: action, with: [], text: "\"덕이 어머니. 우리 아버지 그런 사람 아니에요. 내일 다시 와 보세요, 네?\"" }
      - say: { channel: action, with: [], text: "내일도 열지 않을 것이다. 그 애는 그걸 모른다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지. 덕이네는 애가 넷이에요." }
      - say: { char: 만석, with: [끝순], text: "쌀은 곳간에 있을 때 쌀이다. 나가면 남의 밥이고." }
      - say:
          char: 만석
          with: [끝순]
          when: { var: t_kin, op: eq, value: true }
          text: "…가을에 네 혼수도 해야 한다. 값 오를 때 팔아야 이불 한 채라도 더 넣지."
      - say: { char: 끝순, with: [만석], motion: droop, text: "…진지 식어요." }
      - goto: fever

  fever:
    title: "학질"
    actions:
      - bg: { id: jemulpo_room, transition: fade, duration: 900 }
      - place: "열흘 뒤 · 안채"
      - move: { id: 끝순, style: reset }
      - char: { id: 만석, position: left }
      - char: { id: 끝순, position: center, emotion: sick }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석], text: "의원 말이 학질이랍니다. 하루걸러 열이 오르는 게 꼭 그렇다고요." }
      - say: { char: 봉구, with: [만석], text: "양인 병원에 금계랍이란 가루약이 있답니다. 한 병에 스무 냥." }
      - say: { char: 만석, with: [봉구], text: "사 와라. 두 병 사 와라." }
      - say: { char: 봉구, with: [만석], text: "그건 사 오겠습니다. 그런데 하나 더 있어요. 마포 김 주사한테서 기별이 왔습니다." }
      - say: { char: 봉구, with: [만석], text: "삼백 석을 통으로 사겠답니다. 섬에 열닷 냥. 모레까지 주인어른이 직접 와서 수결하시랍니다." }
      - say: { char: 만석, with: [봉구], text: "열닷 냥이면 사천오백 냥이다." }
      - say: { char: 봉구, with: [만석], text: "예. 오가는 데 사흘입니다." }
      - say: { char: 끝순.sick, with: [만석], text: "다녀오세요, 아버지. 저 괜찮아요. 오라버니 있잖아요." }
      - say: { char: 끝순.sick, with: [만석], text: "올 때 마포 엿 사다 주세요. 깨 붙은 걸로." }
      - goto: leave_choice

  leave_choice:
    actions:
      - choice:
          key: l1_leave
          prompt: "끝순이 이마가 불덩이다. 마포까지는 팔십 리."
          with: [끝순]
          options:
            - text: "마포에 올라간다. 사흘이면 돌아온다."
              goto: leave_try
            - text: "봉구를 대신 보내고 곁에 남는다."
              goto: stay_home

  leave_try:
    actions:
      - branch:
          cases:
            - when: { var: t_kin, op: eq, value: true }
              goto: leave_cannot
          default: go_mapo

  leave_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [], text: "짚신을 신고 문지방에 선다. 발이 넘어가지 않는다.", wait: 900, unskippable: true }
      - say: { channel: action, with: [], text: "등 뒤에서 기침 소리가 난다. 돌아본다. 호롱불은 켜져 있다." }
      - say: { channel: thought, with: [], text: "켜져 있는 걸 보고도 숨이 안 쉬어진다. 불이 꺼진 방을 본 적은 없는데." }
      - say: { channel: thought, with: [], text: "곁에 있어야 한다는 생각이 어디서 오는지 모르겠다. 내 생각 같지가 않다." }
      - say: { char: 만석, with: [봉구], text: "봉구야. 네가 가라. 수결은 네가 해라." }
      - goto: stay_home

  go_mapo:
    actions:
      - say: { char: 만석, with: [봉구], text: "약 먹이고, 밤에 물수건 갈아 줘라. 사흘이다." }
      - say: { char: 봉구, with: [만석], motion: nod, text: "예. 다녀오십시오." }
      - bg: { id: jemulpo_yard, transition: fade, duration: 1200 }
      - place: "사흘 뒤 저녁 · 객주 마당"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say: { char: 만석, with: [봉구], text: "수결했다. 사천오백 냥이다. 엿도 사 왔다. …너는 왜 마당에 나와 섰느냐." }
      - say: { char: 봉구, with: [만석], motion: droop, text: "어제 새벽입니다. 약은 사다 먹였습니다. 두 병 다요." }
      - say: { char: 만석, with: [봉구], text: "…나를 찾더냐." }
      - say: { char: 봉구, with: [만석], text: "두 번이요. 아버지 진지 드셨느냐고." }
      - set: { l1_end: gone }
      - goto: old_age

  stay_home:
    actions:
      - say: { char: 봉구, with: [만석], text: "서기 수결을 받아 줄 사람이 아닌데요. …가 보기는 하겠습니다." }
      - say: { channel: action, with: [], text: "사흘 밤 물수건을 갈았다. 나흘째 아침에 끝순이가 미음을 달라고 했다." }
      - char: { id: 끝순, position: center }
      - say: { char: 끝순, with: [만석], text: "아버지 수염이 왜 그래요. 꼭 엿장수 같아." }
      - char: { id: 봉구, position: right }
      - say: { char: 봉구, with: [만석, 끝순], motion: shake, text: "김 주사가 서기하고는 말도 안 섞습디다. 쌀은 용산 객주 것으로 채웠답니다." }
      - branch:
          cases:
            - when: { var: l1_gave, op: eq, value: true }
              goto: after_ruined
          default: after_kept

  after_kept:
    actions:
      - say: { char: 만석, with: [봉구], text: "됐다. 쌀은 곳간에 있다. 값은 또 온다." }
      - say: { channel: action, with: [], text: "값은 다시 오지 않았다. 가을에 햇곡이 풀리자 닷 냥으로 내려앉았다." }
      - say: { char: 끝순, with: [만석], text: "아버지, 묵은쌀에 바구미 슬어요. 덕이네 좀 주면 안 돼요? 지금이라도." }
      - say: { char: 만석, with: [끝순], text: "바구미는 체로 치면 된다." }
      - say: { channel: action, with: [], text: "끝순이는 스물에 강화로 시집을 갔다. 혼수는 넉넉히 넣었다. 그 애는 친정에 오지 않았다." }
      - set: { l1_end: kept }
      - goto: old_age

  after_ruined:
    actions:
      - say: { char: 만석, with: [봉구], text: "됐다. 애가 일어났으면 됐다." }
      - say: { channel: action, with: [], text: "가을에 외상을 갚은 집은 두 집이었다. 햇곡이 풀리자 쌀값은 닷 냥으로 내려앉았다." }
      - say: { channel: action, with: [], text: "이듬해 봄에 객주 문을 닫았다." }
      - place: "네 해 뒤 · 포구 뒷골목 셋방"
      - say: { char: 끝순, with: [만석], text: "아버지, 저 내일부터 왜인 정미소 나가요. 쌀에서 뉘 고르는 일. 하루 열두 전이래요." }
      - say: { char: 만석, with: [끝순], text: "거긴 겨 먼지가 눈처럼 날린다더라. 네 기침에 거길 어찌 가." }
      - say: { char: 끝순, with: [만석], motion: laugh, text: "그럼 아버지가 벌어 오시든가요. …농이에요. 방세가 석 달 밀렸어요." }
      - say: { channel: action, with: [], text: "말릴 돈이 없었다. 아침마다 정미소 문 앞까지 데려다주었다. 여섯 해를 그랬다." }
      - say: { channel: action, with: [], text: "끝순이는 스물여섯 되던 겨울에 누웠다. 나는 머리맡에 있었다. 금계랍 살 스무 냥은 없었다." }
      - set: { l1_end: poor }
      - goto: old_age

  old_age:
    title: "시월"
    actions:
      - bg: { id: jemulpo_room, transition: fade, duration: 1200 }
      - place: "1910년 시월 · 제물포"
      - char: { id: 만석, position: left }
      - char: { id: 봉구, position: right }
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: gone }
          text: "어르신, 곳간은 제가 맡겠습니다. 열쇠는 이제 풀어 놓으시지요. 허리에 배깁니다."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: gone }
          text: "죽거든 풀어라. 그 엿은… 궤짝에 아직 있다. 버려라."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: kept }
          text: "강화에 기별했습니다, 어르신. 못 온답니다. 막내가 홍역이래요."
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: kept }
          text: "애가 아프면 못 오지. 그건 맞다. …그건 그 애가 맞다."
      - say:
          char: 봉구
          with: [만석]
          when: { var: l1_end, op: eq, value: poor }
          text: "약값은 제가 치렀습니다, 어르신. 끝순이 때는 제가 서기 삯밖에 없어서…"
      - say:
          char: 만석
          with: [봉구]
          when: { var: l1_end, op: eq, value: poor }
          text: "네 탓이 아니다. 너는 객주 차렸으면 됐다. 문 닫지 마라."
      - say: { char: 봉구, with: [만석], text: "뭐 드시고 싶은 건 없습니까." }
      - wait: 800
      - say: { char: 만석, with: [봉구], text: "…됐다. 불이나 끄지 마라.", wait: 900 }
      - bg: { id: void, transition: fade, duration: 2600 }
      - music: void
      - goto: void_one

  # 재판. 신도 관리자도 없다. 묻는 쪽과 답하는 쪽이 같아서 끝나지 않는다.
  void_one:
    title: "암흑"
    actions:
      - bg: { id: void, transition: fade, duration: 1800 }
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "넓다. 포구에서 본 밤바다를 백 번 포개도 여기 한 귀퉁이가 안 된다." }
      - say:
          channel: narration
          when: { var: l1_end, op: eq, value: gone }
          text: "쉰여섯 해가 전부 떠오른다. 사천오백 냥. 깨 붙은 엿. 진지 드셨느냐는 말."
      - say:
          channel: narration
          when: { var: l1_end, op: eq, value: kept }
          text: "쉰여섯 해가 전부 떠오른다. 바구미 슨 삼백 섬. 강화에서 한 번도 오지 않은 가마."
      - say:
          channel: narration
          when: { var: l1_end, op: eq, value: poor }
          text: "쉰여섯 해가 전부 떠오른다. 정미소 문 앞. 겨 먼지. 없던 스무 냥."
      - wait: 700
      - say: { channel: narration, text: "묻는 소리가 난다." }
      - say: { channel: narration, text: "어디서 나는지 찾다가 그만둔다. 내 안에서 난다." }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그날 곳간을 열었더라면." }
      - say: { channel: narration, text: "열지 않았더라도 까닭을 한 번 말해 줬더라면." }
      - say: { channel: narration, text: "엿 얘기 말고 다른 얘기를 한 번만 했더라면." }
      - say: { channel: narration, text: "그 애한테 고맙다고, 미안하다고 한 번만 했더라면." }
      - say: { channel: narration, text: "포구 밖으로 한 번만 더 나가 봤더라면. 곳간이 거기 있어서 나도 거기 있었다." }
      - wait: 900
      - say: { channel: narration, text: "대답할 차례다." }
      - say: { channel: narration, text: "쉰여섯 해를 다 뒤져도 변명 하나가 안 나온다." }
      - say: { channel: narration, text: "묻는 쪽과 답하는 쪽이 같아서 끝나지 않는다." }
      - bg: { id: void_light, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "끝내려면 하나를 쥐어야 한다. 쥐면 나머지는 놓는 것이다." }
      - goto: void_one_choice

  void_one_choice:
    actions:
      - choice:
          key: v1
          prompt: "쉰여섯 해에서 쥘 수 있는 것은 하나다."
          options:
            - text: "말을 했어야 했다."
              set: { t_say: true, deg_last: "118.5" }
              goto: void_one_go
            - text: "어디에도 매이지 말았어야 했다."
              set: { t_free: true, deg_last: "307.9" }
              goto: void_one_go
            - text: "쥐지 않는다."
              goto: void_one_stop

  void_one_stop:
    actions:
      - choice:
          key: v1_stop
          prompt: "남은 것이 정말 없는가."
          options:
            - text: "없다. 여기 있는다."
              goto: dark_still
            - text: "…하나 있다."
              goto: void_one_choice

  void_one_go:
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "그것 하나를 쥐자 묻는 소리가 멎는다.", autoAdvance: 1900 }
      - say: { channel: narration, text: "쉰여섯 해가 접힌다. 쥔 것만 손에 남는다.", autoAdvance: 1800 }
      - say: { channel: narration, text: "포구 이름이 먼저 빠져나간다. 그다음은 허리춤에 있던 것의 무게." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - goto: /0.yaml
