chapterTitle: "360"
pov: "지안"

script:
  - scene: last_dark

scenes:
  last_dark:
    title: "암흑"
    actions:
      - bg: { id: void, transition: cut }
      - music: void
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "요양 병동에서 마지막으로 붙들고 있던 답장 칸이 안 보인다. 편집실 모니터를 끄고 나면 남던 파란 불빛도 없다." }
      - say: { channel: narration, text: "가만히 귀를 기울여도 아무 소리도 들리지 않는다." }
      - say: { channel: narration, text: "일흔아홉 해가 전부 떠오른다." }
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: true }
          text: "서명한 날 차 피디가 악수를 청했다. 방송 뒤 다온이 어머니에게서 온 전화는 받지 못했다."
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: false }
          text: "팔리지 않은 책 상자 사이에 다온이 어머니가 보낸 엽서가 끼어 있었다."
      - say:
          channel: narration
          when: { var: l4_refuted, op: eq, value: true }
          text: "파주 거실에서 한 말. 그건 선생님이 모르시는 일이에요."
      - say: { channel: narration, text: "김치통. 끝내 누르지 않은 전송 버튼." }
      - say: { channel: narration, text: "유리 너머 십 분." }
      - say: { channel: narration, text: "벽의 숫자가 줄어드는 걸 마흔 번도 넘게 봤다." }
      - say: { channel: narration, text: "엄마는 그때마다 먼저 수화기를 내려놓았다." }
      - say: { channel: narration, text: "마지막 십 분에는 건너편 수화기가 걸이에서 내려오지 않았다." }
      - say: { channel: narration, when: { var: l4_sign_blocked, op: eq, value: true }, text: "계약서 앞에서 몸이 내 뜻과 다른 쪽으로 갔던 오후." }
      - say:
          channel: narration
          when: { var: looked_back, op: eq, value: true }
          text: "형광펜으로 그은 줄 하나. 가다가 돌아봤다."
      - say: { channel: narration, text: "일흔아홉 해면 끝이다. 더 떠오를 것이 없다." }
      - say: { channel: narration, text: "그런데 소리가 난다." }
      - goto: leak_one

  leak_one:
    actions:
      - say: { channel: record, text: "\"아버지는 맨날 다 식은 다음에 오시잖아요.\"" }
      - say: { channel: narration, text: "…" }
      - say: { channel: narration, text: "녹음기에서 나는 소리가 아니다. 이어폰도 없다." }
      - say: { channel: narration, text: "열여섯쯤 된 여자아이다. 웃음이 섞여서 끝이 올라간다." }
      - say: { channel: narration, text: "목소리 400개를 귀로 외웠다. 이건 그중에 없다." }
      - goto: leak_two

  leak_two:
    actions:
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: gone }
          text: "\"끝순이 쓰던 숟가락은 그대로 둬라.\""
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: kept }
          text: "\"쌀에 벌레가 났다고 하니 체로 치면 된다고 했다.\""
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: gone }
          text: "“마포까지 팔십 리를 걸었다. 돌아왔을 때 애는 이미 숨을 거둔 뒤였다.”"
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: kept }
          text: "“딸이 강화로 떠난 뒤로 한 번도 돌아오지 않았다.”"
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: poor }
          text: "\"정미소 문 앞까지 여섯 해를 데려다주었다. 겨 먼지가 눈처럼 날렸다.\""
      - say:
          channel: record
          when: { var: l1_rice_blocked, op: eq, value: true }
          text: "\"열쇠를 자물쇠에 꽂았는데 손목이 돌아가지 않았다. 대문을 닫으라고 했다.\""
      - say:
          channel: record
          when: { var: l1_leave_blocked, op: eq, value: true }
          text: "\"짚신을 신고 문지방에 섰는데 발이 넘어가지 않았다. 봉구를 보냈다.\""
      - say: { channel: narration, text: "이번 목소리는 늙은 남자다. 쌀을 팔던 때부터 죽기 전날까지 한 사람이 말한다." }
      - say: { channel: narration, text: "이 사람은 객주였다. 주판알을 미는 손까지 보인다." }
      - goto: leak_three

  leak_three:
    actions:
      - say:
          channel: record
          when: { var: l2_told, op: eq, value: true }
          text: "\"그 사람 웃는 걸 좋아했다. 좋다고 말해 버렸고, 세어 보지도 않고 건넸다.\""
      - say:
          channel: record
          when: { var: l2_told, op: eq, value: false }
          text: "\"날짜와 금액과 이름 석 자를 받아 뒀다. 도장이 가짜였다.\""
      - say:
          channel: record
          when: { var: l2_asked, op: eq, value: true }
          text: "\"새벽 네 시에 어머니에게 같이 가자고 했다. 기차는 다섯 시였다.\""
      - say:
          channel: record
          text: "\"불에 들어간 건 내가 아니고 옆 좌판 사람이었다. 아이 둘은 나왔다.\""
      - say:
          channel: record
          when: { var: l2_asked, op: eq, value: false }
          text: "\"새벽 네 시에 신을 신고 문간에 섰다. 같이 가자는 말은 못 하고 나왔다.\""
      - say:
          channel: record
          when: { var: l2_heart_blocked, op: eq, value: true }
          text: "\"영수증부터 달라고 할 참이었는데 입을 여니 다른 말이 나왔다.\""
      - say:
          channel: record
          when: { var: l2_mother_blocked, op: eq, value: true }
          text: "\"어머이, 하고 부르기만 했다. 보따리는 벌써 어깨에 있었다.\""
      - say: { channel: narration, text: "목소리가 바뀌었다. 앞의 것보다 젊은 여자다." }
      - say: { channel: narration, text: "여자는 돈을 건넨 날을 몇 번이고 되짚는다." }
      - goto: leak_four

  leak_four:
    actions:
      - say:
          channel: record
          when: { var: l3_said, op: eq, value: true }
          text: "\"엄마 손에서 비린내가 났다. 아침 여섯 시였다. 괜찮다고 안 했다.\""
      - say:
          channel: record
          when: { var: l3_said, op: eq, value: false }
          text: "\"엄마 손에서 비린내가 났다. 아침 여섯 시였다. 괜찮다고 했다.\""
      - say:
          channel: record
          when: { var: l3_went, op: eq, value: true }
          text: "\"환자복 위에 잠바를 걸치고 둔치까지 갔다. 물에서 비린내가 났다. 손에서 나던 것과 같았다.\""
      - say:
          channel: record
          when: { var: l3_went, op: eq, value: false }
          text: "\"병실에 남았다. 그날 밤 누나가 약봉지에 불꽃을 그려 가지고 돌아왔다.\""
      - say:
          channel: record
          when: { var: l3_open_blocked, op: eq, value: true }
          text: "\"무섭다고 말하려고 했는데 그 말만 나오지 않았다.\""
      - say:
          channel: record
          when: { var: l3_out_blocked, op: eq, value: true }
          text: "\"손을 뻗었는데 손은 난간을 잡고 있었다. 손가락을 펴도 다시 쥐었다.\""
      - say: { channel: narration, text: "열일곱 살 남자아이 목소리다. 6인실에서 녹음한 것처럼 울린다." }
      - say: { channel: narration, text: "다음에 무슨 말이 나올지, 듣기 전에 벌써 안다." }
      - say: { channel: narration, text: "무릎 위에 있어야 할 녹음기를 더듬다 손을 멈춘다." }
      - goto: leak_name

  leak_name:
    actions:
      - bg: { id: void_light, transition: dissolve, duration: 2400 }
      - say: { channel: narration, text: "제보자 성명을 적으려는데 셋 다 이름이 생각나지 않는다." }
      - say: { channel: narration, text: "성명 미상으로 올리면 방송에 못 쓴다. 차 피디가 제일 먼저 빼는 것이 그거다." }
      - say: { channel: narration, text: "녹취할 때도 이름 얘기에서 말이 끊기면, 먼저 그날 일을 물었다." }
      - say: { channel: narration, text: "무슨 냄새가 났지? 옆엔 누가 있었고, 그 사람은 뭘 신고 있었지?" }
      - say: { channel: narration, text: "질문을 하려는데 끝까지 말하기도 전에 답이 떠오른다." }
      - say: { channel: narration, text: "곳간 열쇠. 좌판 밑에 둔 보따리. 손끝에 걸리던 약봉지." }
      - say: { channel: narration, text: "누구한테 묻는 건지 모르겠다. 답할 사람은 하나뿐이다." }
      - say: { channel: record, text: "오늘은 같이 먹자고 했다. 그 애 밥그릇만 오래 마루에 남아 있었다." }
      - say: { channel: record, text: "국제시장 3열 17번. 복례 아주머니가 좋은 자리라고 했다. 나는 미안하다는 말을 못 했다." }
      - say: { channel: record, text: "갈치 비린내. 가시를 발라 온 엄마 손에서 났다." }
      - say: { channel: narration, text: "셋 다 내가 답했다." }
      - effect: focus
      - say: { channel: narration, text: "쉰여섯. 마흔넷. 열일곱. 일흔아홉." }
      - say: { channel: narration, text: "다 합하면 196년이다. 각자 살다 죽던 날까지 다 기억난다." }
      - say: { channel: narration, text: "그보다 먼저 살았던 날도 있다." }
      - say: { channel: narration, text: "거기 닿으려니 냄새만 난다. 세 번의 어둠마다 맡았던 냄새다." }
      - say: { channel: narration, text: "한겨울 아궁이에서 나던 식은 재 냄새." }
      - say: { channel: narration, text: "그 이상은 손이 닿지 않는다." }
      - goto: degrees

  # 쥔 것의 이름은 고를 때와 한 글자도 다르지 않다. 그래야 플레이어가 자기 손을 알아본다.
  degrees:
    title: "각도"
    actions:
      - say: { channel: narration, text: "삶마다 마지막에 쥔 것에 숫자가 붙어 있다." }
      - say: { channel: record, when: { var: t_say, op: eq, value: true }, text: "118.5 — 끝순이한테 끝내 말하지 못한 것" }
      - say: { channel: record, when: { var: t_free, op: eq, value: true }, text: "307.9 — 열쇠를 풀고 끝순이랑 월미도에 가 보지 못한 것" }
      - say:
          channel: record
          when: { all: [{ var: t_guard, op: eq, value: true }, { var: l2_told, op: eq, value: true }] }
          text: "076.3 — 세어 보지도 않고 전대를 건넨 것"
      - say:
          channel: record
          when: { all: [{ var: t_guard, op: eq, value: true }, { var: l2_told, op: eq, value: false }] }
          text: "076.3 — 가짜 도장을 믿고 전대를 건넨 것"
      - say: { channel: record, when: { var: t_stay, op: eq, value: true }, text: "251.0 — 어머이를 판잣집에 두고 나온 것" }
      - say: { channel: record, when: { var: t_live, op: eq, value: true }, text: "164.8 — 이식 날짜까지 살지 못한 것" }
      - say: { channel: record, when: { var: t_dare, op: eq, value: true }, text: "339.4 — 약봉지 속 다리를 걸어 보지 못한 것" }
      - say: { channel: narration, text: "같은 숫자는 없다." }
      - say: { channel: narration, text: "원 둘레에 점을 찍는 거예요, 사람마다 다른 자리에. 유 선생님은 그렇게 말했다." }
      - say: { channel: narration, text: "그땐 한 사람이 찍은 점 여러 개를 나란히 놓고 볼 길이 없었다." }
      - say: { channel: narration, text: "지금 셋을 본다. 셋 다 한 사람 것이다." }
      - goto: leftovers

  # 두고 간 쪽, 그리고 쥔 것이 다음 삶에서 막은 것. 막힌 적 없는 삶은 막혔을 자리를 본다.
  leftovers:
    actions:
      - say: { channel: narration, text: "쥐지 않고 두고 간 쪽에도 숫자가 남아 있다." }
      - say: { channel: record, when: { var: t_say, op: eq, value: true }, text: "307.9 — 열쇠를 풀고 끝순이랑 월미도에 가 보지 못한 것" }
      - say: { channel: record, when: { var: t_free, op: eq, value: true }, text: "118.5 — 끝순이한테 끝내 말하지 못한 것" }
      - say: { channel: record, when: { var: t_guard, op: eq, value: true }, text: "251.0 — 어머이를 판잣집에 두고 나온 것" }
      - say:
          channel: record
          when: { all: [{ var: t_stay, op: eq, value: true }, { var: l2_told, op: eq, value: true }] }
          text: "076.3 — 세어 보지도 않고 전대를 건넨 것"
      - say:
          channel: record
          when: { all: [{ var: t_stay, op: eq, value: true }, { var: l2_told, op: eq, value: false }] }
          text: "076.3 — 가짜 도장을 믿고 전대를 건넨 것"
      - say: { channel: record, when: { var: t_live, op: eq, value: true }, text: "339.4 — 약봉지 속 다리를 걸어 보지 못한 것" }
      - say: { channel: record, when: { var: t_dare, op: eq, value: true }, text: "164.8 — 이식 날짜까지 살지 못한 것" }
      - say: { channel: narration, text: "두고 간 숫자는 쥔 숫자의 거의 맞은편이다." }
      - wait: 700
      - say: { channel: narration, text: "쥔 것 옆에, 그다음 삶에서 하려는데 안 되던 일을 놓아 본다." }
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: guard }
              - { var: l1_rice_blocked, op: eq, value: true }
          text: "076.3을 쥐고 간 포구에서는 열쇠를 꽂고도 손목이 돌아가지 않았다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: guard }
              - { var: l1_rice_blocked, op: eq, value: false }
          text: "076.3을 쥐고 간 포구에서는 막힌 적이 없었다. 곳간을 열려 했다면 손목이 돌아가지 않았을 것이다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: live }
              - { var: l1_rice_blocked, op: eq, value: true }
          text: "164.8을 쥐고 간 포구에서는 열쇠를 꽂고도 손목이 돌아가지 않았다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: live }
              - { var: l1_rice_blocked, op: eq, value: false }
          text: "164.8을 쥐고 간 포구에서는 막힌 적이 없었다. 곳간을 열려 했다면 손목이 돌아가지 않았을 것이다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: stay }
              - { var: l1_leave_blocked, op: eq, value: true }
          text: "251.0을 쥐고 간 포구에서는 문지방 앞에서 발이 넘어가지 않았다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: stay }
              - { var: l1_leave_blocked, op: eq, value: false }
          text: "251.0을 쥐고 간 포구에서는 막힌 적이 없었다. 마포로 나서려 했다면 문지방에서 발이 멈췄을 것이다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: dare }
              - { var: l1_leave_blocked, op: eq, value: true }
          text: "339.4를 쥐고 간 포구에서는 문지방 앞에서 발이 넘어가지 않았다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1894, op: eq, value: dare }
              - { var: l1_leave_blocked, op: eq, value: false }
          text: "339.4를 쥐고 간 포구에서는 막힌 적이 없었다. 마포로 나서려 했다면 문지방에서 발이 멈췄을 것이다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1952, op: eq, value: say }
              - { var: l2_heart_blocked, op: eq, value: true }
          text: "118.5를 쥐고 간 부두에서는 영수증을 달라는 말이 나오지 않았다. 입을 열자 다른 말이 먼저 나왔다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1952, op: eq, value: say }
              - { var: l2_heart_blocked, op: eq, value: false }
          text: "118.5를 쥐고 간 부두에서는 막힌 적이 없었다. 영수증부터 달라고 했다면 다른 말이 먼저 나왔을 것이다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1952, op: eq, value: live }
              - { var: l2_heart_blocked, op: eq, value: true }
          text: "164.8을 쥐고 간 부두에서는 영수증을 달라는 말이 나오지 않았다. 입을 열자 다른 말이 먼저 나왔다."
      - say:
          channel: narration
          when:
            all:
              - { var: pre_1952, op: eq, value: live }
              - { var: l2_heart_blocked, op: eq, value: false }
          text: "164.8을 쥐고 간 부두에서는 막힌 적이 없었다. 영수증부터 달라고 했다면 다른 말이 먼저 나왔을 것이다."
      - say:
          channel: narration
          when:
