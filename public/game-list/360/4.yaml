      - goto: leftover_look

  leftover_look:
    actions:
      - choice:
          key: l5_leftover
          prompt: "그때 두고 간 기억도 다시 볼 수 있다."
          options:
            - text: "쉰여섯 해의 기억을 본다."
              saveText: "쉰여섯 해가 두고 간 것을 본다."
              goto: leftover_first
            - text: "열일곱 해의 기억을 본다."
              saveText: "열일곱 해가 두고 간 것을 본다."
              goto: leftover_last
            - text: "보지 않는다."
              goto: last_count

  leftover_first:
    actions:
      - say:
          channel: narration
          when: { var: t_say, op: eq, value: true }
          text: "307.9. 장삿길 말고는 포구 밖에 나가 본 적 없는 사람의 것이다."
      - say:
          channel: narration
          when: { var: t_say, op: eq, value: true }
          text: "월미도에 굴뚝 셋 달린 배가 들어온 날, 곳간은 누가 보느냐고 했다. 그쪽은 두고 왔다."
      - say:
          channel: narration
          when: { var: t_free, op: eq, value: true }
          text: "118.5. 같이 먹자는 딸 앞에서 끝내 장부를 덮지 못한 사람의 것이다."
      - say:
          channel: narration
          when: { var: t_free, op: eq, value: true }
          text: "고맙다고도 미안하다고도 한 적이 없다. 그쪽은 두고 왔다."
      - goto: last_count

  leftover_last:
    actions:
      - say:
          channel: narration
          when: { var: t_live, op: eq, value: true }
          text: "339.4. 열일곱에서 끝난 쪽이 두고 간 것이다. 약봉지 속 다리는 끝내 걷지 못했다."
      - say:
          channel: narration
          when: { var: t_live, op: eq, value: true }
          text: "이식 날짜까지 살지 못한 것을 쥐고 또 살았다. 지안으로 살 때도 방마다 비상구부터 봤다."
      - say:
          channel: narration
          when: { var: t_dare, op: eq, value: true }
          text: "164.8. 열일곱에서 끝난 쪽이 두고 간 것이다. 달력에 동그라미 친 날은 오지 않았다."
      - say:
          channel: narration
          when: { var: t_dare, op: eq, value: true }
          text: "약봉지 속 다리를 쥐고 또 살았다. 2년 넘게 다닌 데가 없었다. 전세금을 빼서 카페를 했다."
      - say: { channel: narration, text: "지안으로 살 때는 그 버릇이 어디서 왔는지 몰랐다." }
      - goto: last_count

  last_count:
    actions:
      - say: { channel: narration, text: "다섯 번째 어둠이다." }
      - say: { channel: narration, text: "넷째 칸이 비어 있다." }
      - goto: stake

  stake:
    actions:
      - say: { channel: narration, text: "손이 닿는 것이 두 개다. 둘 다 일흔아홉 해에서 나왔다." }
      - say: { channel: narration, text: "하나는 초록 뚜껑 김치통이다." }
      - say: { channel: narration, text: "마흔두 번을 냉장고에 두었다가, 마흔세 번째에 무릎에 얹고 빈 의자 앞에 앉았던 통." }
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: true }
          text: "다른 하나는 녹취 원본이다. 간인을 찍고 넘긴 뒤에는 내가 받은 목소리를 마음대로 꺼내 들을 수 없었다."
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: false }
          text: "다른 하나는 서랍의 통장이다. 잔액은 장례비에 조금 못 미친다."
      - say: { channel: narration, text: "김치통 쪽으로 기울면 223.7이다." }
      - say: { channel: narration, when: { var: l4_signed, op: eq, value: true }, text: "원본 쪽으로 기울면 041.2다." }
      - say: { channel: narration, when: { var: l4_signed, op: eq, value: false }, text: "통장 쪽으로 기울면 041.2다." }
      - say: { channel: narration, text: "앞의 숫자들과 겹치는 데는 없다." }
      - say: { channel: narration, text: "같은 점이 없다는 걸 확인한 사람은 없다. 두 번 살고 두 번 다 기억해야 하니까." }
      - say: { channel: narration, text: "앞의 셋은 눈을 뜨고 아무것도 기억하지 못했다." }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "등 뒤에서 빛이 가까워진다. 벌써 다섯 번째다." }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "멀리서는 점 같던 것이 가까워지자 시야를 다 가린다." }
      - goto: last_choice

  last_choice:
    actions:
      - choice:
          key: v4
          prompt: "한쪽이 덜 어둡다. 쥘 수 있는 것은 하나다."
          options:
            - text: "유리 너머 엄마 곁에 있지 못한 것"
              saveText: "유리 너머 엄마 곁에 있지 못한 것"
              set: { t_kin: true, last_taken: kin, v_final: kin, deg_last: "223.7" }
              goto: last_go
            - text: "녹취 원본을 쥐고 있지 못한 것"
              saveText: "녹취 원본을 쥐고 있지 못한 것"
              when: { var: l4_signed, op: eq, value: true }
              set: { t_hold: true, last_taken: hold, v_final: hold, deg_last: "041.2" }
              goto: last_go
            - text: "통장에 장례비만큼 쥐고 있지 못한 것"
              saveText: "통장에 장례비만큼 쥐고 있지 못한 것"
              when: { var: l4_signed, op: eq, value: false }
              set: { t_hold: true, last_taken: hold, v_final: hold, deg_last: "041.2" }
              goto: last_go
            - text: "쥐지 않는다."
              goto: last_stop

  last_stop:
    actions:
      - say: { channel: narration, text: "쥐지 않으면 기울어지지 않는다. 그건 네 번 다 알고 있었다." }
      - say: { channel: narration, text: "기울어지지 않으면 숫자가 안 붙는다. 넷째 칸이 빈 채로 남는다." }
      - choice:
          key: v4_stop
          prompt: "남은 것이 정말 없는가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: last_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: last_choice

  last_still:
    actions:
      - say: { channel: narration, text: "목록은 그대로 둔다. 셋까지 적혀 있고, 넷째 칸은 비어 있다." }
      - say: { channel: narration, text: "내가 한 말을 다시 들을 사람은 여기 없다." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  last_go:
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, when: { var: last_taken, op: eq, value: kin }, text: "김치통 손잡이가 손바닥에 걸린다." }
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: true }] }
          text: "녹음기 무게가 손에 남는다."
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: false }] }
          text: "통장 모서리가 손바닥에 걸린다."
      - say: { channel: narration, text: "다음 빛을 향해 천천히 움직였다.", wait: 1200 }
      - bg: { id: void_near, transition: dissolve, duration: 2300 }
      - wait: 900
      - say: { channel: narration, text: "편집실이 몇 층이었는지 기억이 나지 않았다.", wait: 1400 }
      - say: { channel: narration, text: "살면서 보던 풍경이 멀어진다. 그 너머로 낯선 풍경 하나가 드러난다." }
      - goto: winter_in

  look_choice:
    actions:
      - say: { channel: narration, text: "기억이 흐려지기 직전에 녹취록에 그었던 형광펜 줄이 떠오른다." }
      - say: { channel: narration, text: "셋이 서로 모르는 사이인데 셋 다 돌아봤다는 줄. 차 피디가 그 자리에서 몸을 기울였던 줄." }
      - say: { channel: narration, text: "돌아보지 않은 사람의 제보는 한 건도 없었다. 그 사람들은 기억을 못 하니까." }
      - choice:
          key: l5_look
          prompt: "기억이 사라지기 전에 뒤를 볼 수 있다."
          options:
            - text: "돌아본다."
              goto: look_back
            - text: "그대로 간다."
              goto: last_arrive

  look_back:
    actions:
      - effect: focus
      - say: { channel: narration, text: "돌아본다. 식은 아궁이 옆에 이불이 그대로 있다. 그 뒤에서 답장 칸의 커서가 깜박인다." }
      - say: { channel: narration, text: "빠져나가던 것들이 멈춘다. 편집실은 3층이었고 엄마 김치통은 초록색이었다." }
      - say: { channel: narration, text: "지나온 자리도 기억난다. 방금 고른 쪽의 숫자는 {{deg_last}}도였다." }
      - say: { channel: narration, text: "쥔 것이 하나가 아니다. 세어 보니 다섯이다." }
      - say: { channel: narration, text: "다섯 개를 센 채로 밝은 쪽에 닿는다." }
      - bg: { id: void_light, transition: dissolve, duration: 900 }
      - goto: life_returner

  # 넷째를 쥐고 기울어지는 중에, 한 번도 재판한 적 없는 것이 하나 더 온다.
  winter_in:
    pov: "???"
    actions:
      - say: { channel: narration, text: "편집실 기억은 멀어졌는데, 손끝에 차가운 기운이 남는다." }
      - wait: 900
      - say: { channel: narration, text: "하나가 더 온다." }
      - say: { channel: narration, text: "아까 냄새만 났던 겨울이다. 이번엔 가 본 길이 생각난다." }
      - bg: { id: void_light, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "이때는 아무것도 가져가는 법을 몰랐다. 그래서 그 겨울에는 숫자가 없다." }
      - say: { channel: card, with: [], text: "1809년 겨울\n조선", wait: 2200 }
      - goto: winter_remember

  # 기억은 한 번에 오지 않는다. 더듬어 찾은 것만 돌아오고, 셋이 모이면 나머지가 저절로 온다.
  winter_remember:
    pov: "???"
    actions:
      - choice:
          key: w_remember
          presentation: explore
          prompt: "어둠 속에서 그 겨울에 보고 들었던 것들이 하나씩 떠오른다."
          options:
            - text: "냄새"
              at: { x: 31, y: 68 }
              when: { var: m_ash, op: eq, value: false }
              goto: mem_ash
            - text: "소리"
              at: { x: 72, y: 41 }
              when: { var: m_jar, op: eq, value: false }
              goto: mem_jar
            - text: "추위"
              at: { x: 49, y: 22 }
              when: { var: m_river, op: eq, value: false }
              goto: mem_river
            - text: "울음"
              at: { x: 18, y: 36 }
              when: { var: m_found, op: gte, value: 3 }
              goto: mem_child

  mem_ash:
    pov: "???"
    actions:
      - set: { m_ash: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "아궁이에 코를 가까이 대자 탄내만 희미하게 남아 있다." }
      - say: { channel: narration, text: "땅을 파서 지은 집이었다. 바닥에 다 식은 재가 흩어져 있었다." }
      - say: { channel: narration, text: "아침에 나설 때 부지깽이로 재를 모아 덮어 뒀었다." }
      - goto: winter_remember

  mem_jar:
    pov: "???"
    actions:
      - set: { m_jar: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "독 바닥에 남은 좁쌀을 손톱으로 긁어모으던 소리다." }
      - say: { channel: narration, text: "좁쌀이 두 줌." }
      - say: { channel: narration, text: "손바닥에 털어 보니 어제보다 적다." }
      - goto: winter_remember

  mem_river:
    pov: "???"
    actions:
      - set: { m_river: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "강을 건너다 얼음이 갈라져 찬물이 발목까지 찼다." }
      - say: { channel: narration, text: "건너 마을에서 곡식을 꾸어 준다는 말을 들었다." }
      - say: { channel: narration, text: "얼음이 가운데만 얇았다." }
      - say: { channel: narration, text: "가는 데 반나절, 오는 데 반나절." }
      - goto: winter_remember

  mem_child:
    pov: "???"
    actions:
      - effect: { name: focus, wait: true }
      - sticker: { id: blanket, image: blanket_sticker, x: 50, y: 34, width: "clamp(190px, 28%, 360px)", enter: fadeIn, inputLockMs: 300 }
      - say: { channel: narration, text: "식은 아궁이 옆에 이불 한 채가 보인다." }
      - wait: 700
      - music: null
      - wait: 1000
      - say: { channel: narration, text: "아이가 있었다. 사흘째 울지 않았다.", wait: 2000, unskippable: true }
      - say: { channel: narration, text: "울지 않는 걸 괜찮다고 쳤다." }
      - say: { channel: narration, text: "덮어 두고 나갔다. 돌아왔을 때 불은 꺼져 있었다." }
      - wait: 900
      - say: { channel: narration, text: "이불은 아침에 여며 둔 그대로였다. 귀퉁이 하나 들춰져 있지 않았다.", wait: 2600, unskippable: true }
      - say: { channel: narration, text: "꾸어 온 좁쌀 자루를 내려놓지도 못하고 문턱에 서 있었다." }
      - clearSticker: { id: blanket, leave: fadeOut }
      - effect: { name: pulse, wait: true }
      - say: { channel: narration, text: "그 뒤로 서른 해를 더 살았다. 그런데 그 겨울만 자꾸 떠오른다." }
      - goto: winter_face

  # 아이는 돌아오지 않는다. 네 삶에서 되풀이된 것은 여며 주고 나간 손이다.
  winter_face:
    pov: "???"
    actions:
      - say: { channel: narration, text: "아이 얼굴이 생각나지 않는다. 그렇게 오래 떠올려 본 얼굴인데." }
      - wait: 1400
      - say: { channel: narration, text: "대신 다른 얼굴들이 온다. 살면서 곁에 있던 사람들이다.", wait: 1400 }
      - say: { channel: narration, text: "저녁을 같이 먹자던 열여섯. 나는 장부를 폈다." }
      - say: { channel: narration, text: "방문 여는 소리에 벽 쪽으로 돌아눕던 어머이. 나는 기차를 탔다." }
      - say: { channel: narration, text: "앞치마를 벗고 병실에 들어온 엄마. 나는 입을 다물었다." }
      - say: { channel: narration, text: "유리 너머에서 수화기를 먼저 내려놓던 엄마. 나는 다음 주에 온다고 했다." }
      - wait: 1800
      - mood: { tone: warm, level: 2 }
      - say: { channel: narration, text: "넷은 닮은 데가 없다. 웃는 것도, 나를 부르는 말도 다르다." }
      - say: { channel: narration, text: "넷 다 한 번 있던 사람이다." }
      - wait: 1800
      - say: { channel: narration, text: "그 아이도 그 겨울에 한 번 있었다.", wait: 2200 }
      - mood: off
      - effect: { name: eclipse, wait: true }
      - say: { channel: narration, text: "이불을 여미던 손들이 온다." }
      - say: { channel: narration, when: { var: l1_end, op: eq, value: gone }, text: "마포로 나서는 새벽, 딸의 이불을 턱 밑까지 여미던 손." }
      - say: { channel: narration, when: { var: l1_end, op: ne, value: gone }, text: "곳간 가는 새벽마다 딸의 이불을 여미던 손." }
      - say: { channel: narration, text: "기차 타는 새벽, 어머이의 이불을 어깨까지 끌어 올리던 손." }
      - say: { channel: narration, when: { var: l3_said, op: eq, value: false }, text: "가게로 가기 전에 엄마가 내 이불을 여미던 손. 그날은 내가 이불 속에 있었다." }
      - wait: 1200
      - say: { channel: narration, text: "다 여며 주고 나갔다. 귀퉁이를 들춰 보고 나간 사람은 없었다.", wait: 1800, unskippable: true }
      - say: { channel: narration, text: "다온이는 뒤에 사람이 서 있다고 했다. 얼굴은 안 보인다고. 맨날 거기 서 있다고." }
      - say: { channel: narration, text: "내 뒤에 있는 것은 이불 한 채다. 내가 덮어 놓아서 얼굴이 안 보인다." }
      - goto: winter_churn

  # 서른 해 동안 되씹은 것들이 한꺼번에 올라온다.
  winter_churn:
    pov: "???"
    actions:
      - say: { channel: narration, text: "손이 기억보다 늦게 움직인다. 이제 와서 아이 쪽으로 뻗는다." }
      - say: { channel: narration, text: "그날 강을 안 건넜더라면." }
      - say: { channel: narration, text: "건너더라도 해 지기 전에 돌아왔더라면." }
      - say: { channel: narration, text: "건너편에 사람이 있다는 말을, 전해 들은 그 말을 믿지 말았어야 했다." }
      - say: { channel: narration, text: "가을에 좁쌀 반 섬만 더 들여놨더라면 아침에 눈 뜨자마자 강으로 가진 않았을 것이다." }
      - say: { channel: narration, text: "애를 업고 갈까 했었다. 함께 얼음 위에 올랐다가 빠지면 어쩌냐고, 내가 그렇게 생각했다." }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "기억을 더듬을수록 아이를 이불 속에 두고 문을 닫던 순간으로 돌아간다." }
      - wait: 900
      - say: { channel: narration, text: "쥐면 기운다. 기울면 또 누군가로 눈을 뜬다." }
      - say: { channel: narration, text: "어느 쪽을 쥐어도 그 아이한테 닿지는 않는다. 눈을 뜨면 곁에 처음 보는 사람이 있다." }
      - bg: { id: void_near, transition: dissolve, duration: 3200 }
      - wait: 800
      - say: { channel: narration, text: "등 뒤에 있던 빛이 조금 더 가까이 왔다." }
      - say: { channel: narration, text: "저기서 덮쳐 오는 빛에 강 위의 얼음이 다시 하얘진다." }
      - goto: winter_hand

  # 손은 이미 일흔아홉 해의 것을 쥐고 있다. 겨울의 것을 쥐려면 그걸 놓아야 한다.
  winter_hand:
    pov: "???"
    actions:
      - say: { channel: narration, text: "손에는 이미 하나가 들려 있다." }
      - say: { channel: narration, when: { var: last_taken, op: eq, value: kin }, text: "초록 김치통 손잡이다." }
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: true }] }
          text: "원본이 든 녹음기다."
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: false }] }
          text: "서랍의 통장이다."
      - say: { channel: narration, text: "그 겨울의 것을 쥐려면 그걸 놓아야 한다." }
      - goto: winter_choice

  winter_choice:
    pov: "???"
    actions:
      - choice:
          key: v_end
          prompt: "손에 든 것을 놓아야 그 겨울의 것을 쥘 수 있다."
          options:
            - text: "독에 좁쌀을 쥐고 있지 못한 것"
              saveText: "독에 좁쌀을 쥐고 있지 못한 것"
              set: { v_end: hold, v_final: hold, deg_last: "041.2" }
              goto: winter_go
            - text: "이불 속 아이 곁에 있지 못한 것"
              saveText: "이불 속 아이 곁에 있지 못한 것"
              set: { v_end: kin, v_final: kin, deg_last: "223.7" }
              goto: winter_go
            - text: "그 겨울은 두고 간다."
              set: { v_end: left }
              goto: winter_keep
            - text: "손을 편다."
              goto: winter_stop

  winter_stop:
    pov: "???"
    actions:
      - choice:
          key: v_end_stop
          prompt: "그 겨울은 이곳에 두고 갈 것인가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: winter_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: winter_choice

  winter_still:
    pov: "???"
    actions:
      - say: { channel: narration, text: "아궁이 옆에 앉았다. 이번에는 문을 열고 나가지 않았다." }
      - say: { channel: narration, text: "이불 위에 손을 얹는다. 귀퉁이를 들춰도 얼굴은 떠오르지 않는다." }
      - say: { channel: narration, text: "손을 거기 둔다.", wait: 1800 }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  winter_go:
    pov: "???"
    actions:
      - branch:
          cases:
            - when:
                all:
                  - { var: last_taken, op: eq, value: hold }
                  - { var: v_end, op: eq, value: hold }
              goto: winter_same
            - when:
                all:
                  - { var: last_taken, op: eq, value: kin }
                  - { var: v_end, op: eq, value: kin }
              goto: winter_same
          default: winter_swap

  # 같은 후회면 놓을 것이 없다. 두 손에 든 것이 같은 것이다.
  winter_same:
    pov: "???"
    actions:
      - effect: { name: focus, wait: true }
      - say: { channel: narration, text: "손가락을 펴려는데 펼 것이 없다.", wait: 1200 }
      - say: { channel: narration, when: { var: v_end, op: eq, value: kin }, text: "김치통 손잡이와 이불 귀퉁이가 한 손에 같이 잡힌다.", wait: 2000, unskippable: true }
      - say:
          channel: narration
          when: { all: [{ var: v_end, op: eq, value: hold }, { var: l4_signed, op: eq, value: true }] }
          text: "녹음기와 좁쌀 자루가 한 손에 같이 잡힌다."
          wait: 2000
          unskippable: true
      - say:
          channel: narration
          when: { all: [{ var: v_end, op: eq, value: hold }, { var: l4_signed, op: eq, value: false }] }
          text: "통장과 좁쌀 자루가 한 손에 같이 잡힌다."
          wait: 2000
          unskippable: true
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "{{deg_last}}. 목록에 이미 있는 숫자다. 방금 적은 칸과 같다." }
      - say: { channel: narration, text: "유 선생님은 같은 자리는 없을 거라고 했다." }
      - goto: winter_after

  # 다른 쪽을 쥐려면 손을 편다. 무엇이 빠져나가는지 본다.
  winter_swap:
    pov: "???"
    actions:
      - music: null
      - wait: 900
      - say: { channel: narration, text: "손가락을 하나씩 편다.", wait: 1400, unskippable: true }
      - say: { channel: narration, when: { var: last_taken, op: eq, value: kin }, text: "초록 김치통 손잡이가 빠져나간다.", wait: 1800, unskippable: true }
      - say: { channel: narration, when: { var: last_taken, op: eq, value: kin }, text: "유리 너머 빈 의자가 먼저 흐려진다." }
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: true }] }
          text: "녹음기 무게가 빠져나간다."
          wait: 1800
          unskippable: true
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: true }] }
          text: "유 선생님 목소리가 먼저 멀어진다. 다온이 목소리가 그다음이다."
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: false }] }
          text: "통장이 손에서 빠져나간다."
          wait: 1800
          unskippable: true
      - say:
          channel: narration
          when: { all: [{ var: last_taken, op: eq, value: hold }, { var: l4_signed, op: eq, value: false }] }
          text: "장례비에 조금 못 미치던 숫자가 먼저 흐려진다."
      - wait: 1200
      - say: { channel: narration, when: { var: v_end, op: eq, value: kin }, text: "빈손으로 이불 귀퉁이를 쥔다." }
      - say: { channel: narration, when: { var: v_end, op: eq, value: hold }, text: "빈손으로 좁쌀 자루를 쥔다." }
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - goto: winter_after

  # 겨울을 두고 간다. 손에 든 것은 그대로다. 그 겨울은 이번에도 숫자가 없다.
  winter_keep:
    pov: "???"
    actions:
      - say: { channel: narration, text: "손에 든 것을 그대로 쥔다." }
      - say: { channel: narration, text: "아궁이 옆 이불은 거기 둔다." }
      - say: { channel: narration, text: "그 겨울은 이번에도 숫자 없이 남는다.", wait: 1400 }
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - goto: winter_after

  winter_after:
    pov: "???"
    actions:
      - wait: 220
      - branch:
          cases:
            - when: { var: looked_back, op: eq, value: true }
              goto: look_choice
          default: last_arrive

  last_arrive:
    actions:
      - say: { channel: narration, text: "방금 본 숫자부터 흐려진다." }
      - say: { channel: narration, text: "목록에 적어 둔 이름들이 흐려진다. 겨울은 맨 끝까지 남는다." }
      - say: { channel: narration, text: "엄마라는 말이 마지막으로 빠져나간다. 쥔 것 하나만 남는다." }
      - bg: { id: void, transition: dissolve, duration: 900 }
      - branch:
          cases:
            - when:
                all:
                  - { var: last_taken, op: eq, value: kin }
                  - { var: v_end, op: eq, value: kin }
              goto: life_kin_open
            - when:
                all:
                  - { var: last_taken, op: eq, value: hold }
                  - { var: v_end, op: eq, value: hold }
              goto: life_hold_open
            - when: { var: v_final, op: eq, value: kin }
              goto: life_kin_open
            - when: { var: v_end, op: eq, value: kin }
              goto: life_kin_open
          default: life_hold_open

  # 다음 삶. 쥔 것은 처음 보는 사람 앞에서 버릇이 된다.
  # 곁(223.7) 쪽의 두 결말은 같은 문장으로 시작해서, 아이가 신을 벗느냐 덮고 나가느냐에서 갈린다.
  life_kin_open:
    pov: "???"
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1600, label: false }
      - music: birth
      - say: { channel: narration, text: "{{deg_last}}°. 어느 해 어느 나라인지는 고를 수 없었다." }
      - say: { channel: narration, text: "갓난아이가 운다." }
      - say: { channel: narration, text: "받아 든 사람이 웃는다. 처음 보는 얼굴이다.", wait: 1400 }
      - place: { text: "여섯 살 되던 겨울", presentation: center }
      - say: { channel: action, with: [], text: "아랫목에 갓난 동생이 이불을 덮고 자고 있다. 엄마는 장에 갔다." }
      - say: { channel: dialogue, speakerName: "동무들", with: [], text: "강 얼었대! 썰매 타러 가자!" }
      - say: { channel: action, with: [], continueLabel: "귀퉁이를 들춘다", text: "아이는 신을 신다 말고 돌아온다." }
      - say: { channel: action, with: [], text: "이불 귀퉁이를 들추고 동생 얼굴을 한참 들여다본다.", wait: 1600, unskippable: true }
      - branch:
          cases:
            - when: { var: v_end, op: eq, value: left }
              goto: life_kin
            - when: { var: last_taken, op: eq, value: kin }
              goto: life_circle_kin
          default: life_kin

  life_kin:
    pov: "???"
    actions:
      - say: { channel: action, with: [], text: "덮는다. 신을 마저 신고 나간다.", wait: 1400, unskippable: true }
      - say: { channel: action, with: [], text: "강에서 돌아와서도 신을 벗기 전에 먼저 귀퉁이를 들춘다." }
      - say: { channel: action, with: [], text: "들출 때마다 동생이 깬다." }
      - say: { channel: dialogue, speakerName: "엄마", with: [], text: "깨우지 좀 마라." }
      - say: { channel: action, with: [], text: "아이는 나갈 때마다, 들어올 때마다 들춘다.", wait: 2000 }
      - ending: onward

  life_circle_kin:
    pov: "???"
    actions:
      - say: { channel: action, with: [], text: "덮는다. 문간까지 갔다가 다시 와서 또 들춘다." }
      - say: { channel: action, with: [], text: "동무들 소리가 골목 끝으로 멀어진다." }
      - say: { channel: action, with: [], text: "아이는 신을 벗는다.", wait: 1600, unskippable: true }
      - say: { channel: action, with: [], text: "해가 질 때까지 이불 옆에 앉아 있다. 동생이 깨서 울자 귀퉁이를 걷고 안아 올린다." }
      - say: { channel: dialogue, speakerName: "엄마", with: [], text: "너 강에 안 갔니." }
      - say: { channel: action, with: [], text: "아이는 동생을 안은 채 대답하지 않는다." }
      - say: { channel: action, with: [], text: "그해 겨울 아이는 한 번도 얼음에 올라가지 않았다.", wait: 2000 }
      - ending: circle

  # 쥠(041.2) 쪽의 두 결말도 같은 문장으로 시작한다. 갈리는 곳은 대문 앞에 선 옆집 아이다.
  life_hold_open:
    pov: "???"
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1600, label: false }
      - music: birth
      - say: { channel: narration, text: "{{deg_last}}°. 어느 해 어느 나라인지는 고를 수 없었다." }
      - say: { channel: narration, text: "갓난아이가 운다." }
      - say: { channel: narration, text: "받아 든 사람이 웃는다. 처음 보는 얼굴이다.", wait: 1400 }
      - place: { text: "여섯 살 되던 해", presentation: center }
      - say: { channel: action, with: [], continueLabel: "독 뚜껑을 연다", text: "아이는 잠들기 전에 쌀독을 들여다본다." }
      - say: { channel: action, with: [], text: "바닥이 보이면 잠을 못 잔다." }
      - branch:
          cases:
            - when: { var: v_end, op: eq, value: left }
              goto: life_hold
            - when: { var: last_taken, op: eq, value: hold }
              goto: life_circle_hold
          default: life_hold

  life_hold:
    pov: "???"
    actions:
      - say: { channel: action, with: [], text: "봄에 옆집 아이가 대문 앞에 와서 선다. 그 집은 보리가 떨어졌다고 한다." }
      - say: { channel: action, with: [], text: "아이는 독 뚜껑을 열고 한참 들여다본다." }
      - say: { channel: action, with: [], text: "도로 덮는다. 한 줌도 꺼내지 않는다.", wait: 1600, unskippable: true }
      - say: { channel: action, with: [], text: "옆집 아이는 해 질 때까지 대문 앞에 있다가 간다." }
      - say: { channel: action, with: [], text: "그해 그 집 독은 한 번도 바닥을 보이지 않았다.", wait: 2000 }
      - ending: onward

  life_circle_hold:
    pov: "???"
    actions:
      - say: { channel: action, with: [], text: "아이는 잘 때도 독 뚜껑에 손을 얹는다." }
      - say: { channel: action, with: [], text: "엄마가 쌀을 푸러 오면 깨서 몇 바가지인지 센다." }
      - say: { channel: action, with: [], text: "손바닥에 뚜껑 자국이 남은 채로 아침을 먹는다." }
      - say: { channel: action, with: [], text: "옆집 아이가 대문 앞에 오는 날에는 빗장부터 건다.", wait: 2000, unskippable: true }
      - ending: circle

  # 돌아본 사람. 다섯을 다 쥐고 온 아이는 처음 보는 할머니에게 토요일을 말한다.
  life_returner:
    pov: "???"
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1600, label: false }
      - music: now
      - place: { text: "여섯 살 되던 해", presentation: center }
      - say: { channel: dialogue, speakerName: "외할머니", with: [], text: "언제 한번 와라." }
      - say: { channel: action, with: [], text: "전화를 끊기 전에 아이가 수화기를 두 손으로 쥔다." }
      - say: { channel: dialogue, speakerName: "아이", with: [], text: "토요일에 가요." }
      - say: { channel: dialogue, speakerName: "엄마", with: [], text: "토요일에 뭐 있어?" }
      - say: { channel: action, with: [], text: "그날 저녁 아이가 밥을 먹다 말한다." }
      - say: { channel: dialogue, speakerName: "아이", with: [], text: "엄마, 나 전에 편집실에서 일했어." }
      - say: { channel: action, with: [], text: "엄마는 웃으면서 휴대폰 녹음 버튼을 누른다. 아이 말을 끊지 않는다." }
      - say: { channel: action, with: [], text: "국이 다 식는다.", wait: 1400 }
      - say: { channel: action, with: [], continueLabel: "반찬통을 든다", text: "토요일 아침, 아이는 엄마보다 먼저 신을 신고 문간에 서 있다." }
      - say: { channel: action, with: [], text: "빈 반찬통 하나를 두 손으로 들고 있다.", wait: 2200, unskippable: true }
      - ending: returner
