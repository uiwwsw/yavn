chapterTitle: "360"
pov: "지안"

script:
  - scene: last_dark

scenes:
  last_dark:
    title: "암흑"
    actions:
      - bg: { id: void, transition: cut }
      - music: void
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "요양 병동에서 마지막으로 붙들고 있던 답장 칸이 안 보인다. 편집실 모니터를 끄고 나면 남던 파란 불빛도 없다." }
      - say: { channel: narration, text: "가만히 귀를 기울여도 아무 소리도 들리지 않는다." }
      - say: { channel: narration, text: "일흔아홉 해가 전부 떠오른다." }
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: true }
          text: "서명한 날 차 피디가 악수를 청했다. 방송 뒤 다온이 어머니에게서 온 전화는 받지 못했다."
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: false }
          text: "팔리지 않은 책 상자 사이에 다온이 어머니가 보낸 엽서가 끼어 있었다."
      - say:
          channel: narration
          when: { var: l4_refuted, op: eq, value: true }
          text: "파주 거실에서 한 말. 그건 선생님이 모르시는 일이에요."
      - say: { channel: narration, text: "김치통. 끝내 누르지 않은 전송 버튼." }
      - say: { channel: narration, text: "유리 너머 십 분." }
      - say: { channel: narration, text: "벽의 숫자가 줄어드는 걸 마흔 번도 넘게 봤다." }
      - say: { channel: narration, text: "엄마는 그때마다 먼저 수화기를 내려놓았다." }
      - say: { channel: narration, when: { var: l4_sign_blocked, op: eq, value: true }, text: "계약서 앞에서 몸이 내 뜻과 다른 쪽으로 갔던 오후." }
      - say:
          channel: narration
          when: { var: looked_back, op: eq, value: true }
          text: "형광펜으로 그은 줄 하나. 가다가 돌아봤다."
      - say: { channel: narration, text: "일흔아홉 해면 끝이다. 더 떠오를 것이 없다." }
      - say: { channel: narration, text: "그런데 소리가 난다." }
      - goto: leak_one

  leak_one:
    actions:
      - say: { channel: record, text: "\"아버지는 맨날 다 식은 다음에 오시잖아요.\"" }
      - say: { channel: narration, text: "…" }
      - say: { channel: narration, text: "녹음기에서 나는 소리가 아니다. 이어폰도 없다." }
      - say: { channel: narration, text: "열여섯쯤 된 여자아이다. 웃음이 섞여서 끝이 올라간다." }
      - say: { channel: narration, text: "목소리 400개를 귀로 외웠다. 이건 그중에 없다." }
      - goto: leak_two

  leak_two:
    actions:
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: gone }
          text: "\"끝순이 쓰던 숟가락은 그대로 둬라.\""
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: kept }
          text: "\"쌀에 벌레가 났다고 하니 체로 치면 된다고 했다.\""
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: gone }
          text: "“마포까지 팔십 리를 걸었다. 돌아왔을 때 애는 이미 숨을 거둔 뒤였다.”"
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: kept }
          text: "“딸이 강화로 떠난 뒤로 한 번도 돌아오지 않았다.”"
      - say:
          channel: record
          when: { var: l1_end, op: eq, value: poor }
          text: "\"정미소 문 앞까지 여섯 해를 데려다주었다. 겨 먼지가 눈처럼 날렸다.\""
      - say:
          channel: record
          when: { var: l1_rice_blocked, op: eq, value: true }
          text: "\"열쇠를 자물쇠에 꽂았는데 손목이 돌아가지 않았다. 대문을 닫으라고 했다.\""
      - say:
          channel: record
          when: { var: l1_leave_blocked, op: eq, value: true }
          text: "\"짚신을 신고 문지방에 섰는데 발이 넘어가지 않았다. 봉구를 보냈다.\""
      - say: { channel: narration, text: "이번 목소리는 늙은 남자다. 쌀을 팔던 때부터 죽기 전날까지 한 사람이 말한다." }
      - say: { channel: narration, text: "제보를 받으면 앞뒤가 어긋나는 곳에 표시부터 했다." }
      - say: { channel: narration, text: "편집실에서 제일 자주 들은 건 전생에 벼슬을 했다는 말이었다." }
      - say: { channel: narration, text: "이 사람은 객주였다. 주판알을 미는 손까지 보인다." }
      - goto: leak_three

  leak_three:
    actions:
      - say:
          channel: record
          when: { var: l2_told, op: eq, value: true }
          text: "\"그 사람 웃는 걸 좋아했다. 좋다고 말해 버렸고, 세어 보지도 않고 건넸다.\""
      - say:
          channel: record
          when: { var: l2_told, op: eq, value: false }
          text: "\"날짜와 금액과 이름 석 자를 받아 뒀다. 도장이 가짜였다.\""
      - say:
          channel: record
          when: { var: l2_asked, op: eq, value: true }
          text: "\"새벽 네 시에 어머니에게 같이 가자고 했다. 기차는 다섯 시였다.\""
      - say:
          channel: record
          text: "\"불에 들어간 건 내가 아니고 옆 좌판 사람이었다. 아이 둘은 나왔다.\""
      - say:
          channel: record
          when: { var: l2_asked, op: eq, value: false }
          text: "\"새벽 네 시에 신을 신고 문간에 섰다. 같이 가자는 말은 못 하고 나왔다.\""
      - say:
          channel: record
          when: { var: l2_heart_blocked, op: eq, value: true }
          text: "\"영수증부터 달라고 할 참이었는데 입을 여니 다른 말이 나왔다.\""
      - say:
          channel: record
          when: { var: l2_mother_blocked, op: eq, value: true }
          text: "\"어머이, 하고 부르기만 했다. 보따리는 벌써 어깨에 있었다.\""
      - say: { channel: narration, text: "목소리가 바뀌었다. 앞의 것보다 젊은 여자다." }
      - say: { channel: narration, text: "여자는 돈을 건넨 날을 몇 번이고 되짚는다." }
      - say: { channel: narration, text: "돈을 내밀던 손이며 좌판의 나뭇결이 눈앞에 또렷하다." }
      - say: { channel: narration, text: "녹취였다면 그 대목에 노란 표시를 했을 것이다." }
      - goto: leak_four

  leak_four:
    actions:
      - say:
          channel: record
          when: { var: l3_said, op: eq, value: true }
          text: "\"엄마 손에서 비린내가 났다. 아침 여섯 시였다. 괜찮다고 안 했다.\""
      - say:
          channel: record
          when: { var: l3_said, op: eq, value: false }
          text: "\"엄마 손에서 비린내가 났다. 아침 여섯 시였다. 괜찮다고 했다.\""
      - say:
          channel: record
          when: { var: l3_went, op: eq, value: true }
          text: "\"환자복 위에 잠바를 걸치고 둔치까지 갔다. 물에서 비린내가 났다. 손에서 나던 것과 같았다.\""
      - say:
          channel: record
          when: { var: l3_went, op: eq, value: false }
          text: "\"병실에 남았다. 그날 밤 누나가 약봉지에 불꽃을 그려 가지고 돌아왔다.\""
      - say:
          channel: record
          when: { var: l3_open_blocked, op: eq, value: true }
          text: "\"무섭다고 말하려고 했는데 그 말만 나오지 않았다.\""
      - say:
          channel: record
          when: { var: l3_out_blocked, op: eq, value: true }
          text: "\"손을 뻗었는데 손은 난간을 잡고 있었다. 손가락을 펴도 다시 쥐었다.\""
      - say: { channel: narration, text: "열일곱 살 남자아이 목소리다. 6인실에서 녹음한 것처럼 울린다." }
      - say: { channel: narration, text: "셋이 서로 모르는 사이다. 객주, 좌판, 6인실." }
      - say: { channel: narration, text: "허리춤의 열쇠, 건넨 전대, 약봉지에 그린 다리가 손에 닿을 듯 또렷하다." }
      - say: { channel: narration, text: "다음에 무슨 말이 나올지, 듣기 전에 벌써 안다." }
      - say: { channel: narration, text: "다큐를 만들 때 이런 증언 하나 듣겠다고 석 달 내내 파일을 뒤졌다." }
      - say: { channel: narration, text: "무릎 위에 있어야 할 녹음기를 더듬다 손을 멈춘다." }
      - goto: leak_name

  leak_name:
    actions:
      - bg: { id: void_light, transition: dissolve, duration: 2400 }
      - say: { channel: narration, text: "제보자 성명을 적으려는데 셋 다 이름이 생각나지 않는다." }
      - say: { channel: narration, text: "성명 미상으로 올리면 방송에 못 쓴다. 차 피디가 제일 먼저 빼는 것이 그거다." }
      - say: { channel: narration, text: "녹취할 때도 이름 얘기에서 말이 끊기면, 먼저 그날 일을 물었다." }
      - say: { channel: narration, text: "무슨 냄새가 났지? 옆엔 누가 있었고, 그 사람은 뭘 신고 있었지?" }
      - say: { channel: narration, text: "질문을 하려는데 끝까지 말하기도 전에 답이 떠오른다." }
      - say: { channel: narration, text: "곳간 열쇠. 좌판 밑에 둔 보따리. 손끝에 걸리던 약봉지." }
      - say: { channel: narration, text: "누구한테 묻는 건지 모르겠다. 답할 사람은 하나뿐이다." }
      - say: { channel: record, text: "오늘은 같이 먹자고 했다. 그 애 밥그릇만 오래 마루에 남아 있었다." }
      - say: { channel: record, text: "국제시장 3열 17번. 복례 아주머니가 좋은 자리라고 했다. 나는 미안하다는 말을 못 했다." }
      - say: { channel: record, text: "갈치 비린내. 가시를 발라 온 엄마 손에서 났다." }
      - say: { channel: narration, text: "셋 다 내가 답했다." }
      - say: { channel: narration, text: "목소리는 셋인데 그날 본 것은 다 내 눈앞에 있다." }
      - effect: focus
      - say: { channel: narration, text: "일흔아홉 해 앞에 다른 삶이 이어져 있다." }
      - say: { channel: narration, text: "쉰여섯. 마흔넷. 열일곱. 일흔아홉." }
      - say: { channel: narration, text: "다 합하면 196년이다. 각자 살다 죽던 날까지 다 기억난다." }
      - say: { channel: narration, text: "그보다 먼저 살았던 날도 있다." }
      - say: { channel: narration, text: "거기 닿으려니 겨울 냄새만 난다." }
      - say: { channel: narration, text: "한겨울 아궁이에서 나던 식은 재 냄새." }
      - say: { channel: narration, text: "그 이상은 손이 닿지 않는다." }
      - goto: degrees

  degrees:
    title: "각도"
    actions:
      - say: { channel: narration, text: "삶마다 마지막에 쥔 것에 숫자가 붙어 있다." }
      - say:
          channel: record
          when: { var: t_say, op: eq, value: true }
          text: "118.5"
      - say:
          channel: record
          when: { var: t_free, op: eq, value: true }
          text: "307.9"
      - say:
          channel: record
          when: { var: t_guard, op: eq, value: true }
          text: "076.3"
      - say:
          channel: record
          when: { var: t_stay, op: eq, value: true }
          text: "251.0"
      - say:
          channel: record
          when: { var: t_live, op: eq, value: true }
          text: "164.8"
      - say:
          channel: record
          when: { var: t_dare, op: eq, value: true }
          text: "339.4"
      - say: { channel: narration, text: "소수점 아래 한 자리까지 적힌 숫자 셋. 같은 건 없다." }
      - say: { channel: record, text: "녹취 07. 유정림(71, 전 수학 교사). \"후회를 하나 고르니까 몸이 한쪽으로 기울었어요. 그 방향을 각도라고 불렀지요.\"" }
      - say: { channel: record, text: "\"원 둘레에 점을 찍는 거예요. 사람마다 다른 자리에. 같은 자리는 없을 거라고 생각해요.\"" }
      - say: { channel: record, text: "\"가까운 점끼리는 닮았어요. 맞은편에 찍힌 사람은 딴판이고요. 0.001도만 달라도 다른 사람이지요.\"" }
      - say: { channel: narration, text: "유 선생님은 다음 삶으로 향하던 방향을 원 둘레의 점에 빗댔다. 한 점에는 한 사람만 있을 거라 여겼다." }
      - say: { channel: narration, text: "그땐 한 사람이 찍은 점 여러 개를 나란히 놓고 볼 길이 없었다." }
      - say: { channel: narration, text: "지금 셋을 본다. 셋 다 한 사람 것이다." }
      - say: { channel: narration, text: "내 쪽에는 아직 적을 숫자가 없다." }
      - goto: leftovers

  leftovers:
    actions:
      - say: { channel: narration, text: "쥐지 않고 두고 간 쪽에도 숫자가 남아 있다." }
      - say:
          channel: record
          when: { var: t_say, op: eq, value: true }
          text: "307.9 — 어디에도 매이지 말았어야 했다."
      - say:
          channel: record
          when: { var: t_free, op: eq, value: true }
          text: "118.5 — 말을 했어야 했다."
      - say:
          channel: record
          when: { var: t_guard, op: eq, value: true }
          text: "251.0 — 떠나지 말았어야 했다."
      - say:
          channel: record
          when: { var: t_stay, op: eq, value: true }
          text: "076.3 — 아무도 믿지 말았어야 했다."
      - say:
          channel: record
          when: { var: t_live, op: eq, value: true }
          text: "339.4 — 한 번은 해 볼걸."
      - say:
          channel: record
          when: { var: t_dare, op: eq, value: true }
          text: "164.8 — 더 살고 싶었다."
      - say: { channel: narration, text: "하나를 쥘 때마다 하나를 두고 갔다. 두고 간 셋도 여기 그대로 있다." }
      - say: { channel: narration, text: "두고 간 숫자는 쥔 숫자의 거의 맞은편이다. 쥘 때마다 원의 반대쪽으로 기울었다." }
      - say:
          channel: narration
          when:
            any:
              - { var: l1_rice_blocked, op: eq, value: true }
              - { var: l1_leave_blocked, op: eq, value: true }
              - { var: l2_heart_blocked, op: eq, value: true }
              - { var: l2_mother_blocked, op: eq, value: true }
              - { var: l3_open_blocked, op: eq, value: true }
              - { var: l3_out_blocked, op: eq, value: true }
              - { var: l4_sign_blocked, op: eq, value: true }
          text: "쥔 것 옆에, 그다음 삶에서 하려는데 안 되던 일을 놓아 본다. 하나씩 짝이 맞는다."
      - wait: 900
      - say:
          channel: narration
          when:
            any:
              - { var: l1_rice_blocked, op: eq, value: true }
              - { var: l1_leave_blocked, op: eq, value: true }
              - { var: l2_heart_blocked, op: eq, value: true }
              - { var: l2_mother_blocked, op: eq, value: true }
              - { var: l3_open_blocked, op: eq, value: true }
              - { var: l3_out_blocked, op: eq, value: true }
              - { var: l4_sign_blocked, op: eq, value: true }
          text: "다음 삶에선 다르게 살겠다고 쥔 후회였다. 그런데 그쪽 행동밖에 못 하게 되었다."
      - goto: leftover_look

  leftover_look:
    actions:
      - choice:
          key: l5_leftover
          prompt: "그때 두고 간 기억도 다시 볼 수 있다."
          options:
            - text: "쉰여섯 해의 기억을 본다."
              saveText: "쉰여섯 해가 두고 간 것을 본다."
              goto: leftover_first
            - text: "열일곱 해의 기억을 본다."
              saveText: "열일곱 해가 두고 간 것을 본다."
              goto: leftover_last
            - text: "보지 않는다."
              goto: last_count

  leftover_first:
    actions:
      - say:
          channel: narration
          when: { var: t_say, op: eq, value: true }
          text: "307.9. 어디에도 매이지 말았어야 했다. 평생 포구를 한 번밖에 못 떠났던 사람의 후회다."
      - say:
          channel: narration
          when: { var: t_say, op: eq, value: true }
          text: "열쇠는 봉구한테 맡기고 끝순이랑 포구 밖에 나가 보는 것. 그쪽은 두고 왔다."
      - say:
          channel: narration
          when: { var: t_free, op: eq, value: true }
          text: "118.5. 말을 했어야 했다. 같이 먹자는 딸한테 끝내 장부를 덮지 못했다."
      - say:
          channel: narration
          when: { var: t_free, op: eq, value: true }
          text: "고맙다고도 미안하다고도 한 적이 없다. 그쪽은 두고 왔다."
      - say: { channel: narration, text: "그때는 둘 중 하나만 손에 쥐면 되는 줄 알았다." }
      - say: { channel: narration, text: "두고 온 쪽도 없어지지 않았다." }
      - goto: last_count

  leftover_last:
    actions:
      - say:
          channel: narration
          when: { var: t_live, op: eq, value: true }
          text: "339.4. 한 번은 해 볼걸. 열일곱에서 끝난 쪽이 두고 간 말이다."
      - say:
          channel: narration
          when: { var: t_live, op: eq, value: true }
          text: "더 살고 싶다는 마음을 쥐고 또 살았다. 지안으로 살 때도 어느 방에 들어가든 비상구부터 봤다."
      - say:
          channel: narration
          when: { var: t_dare, op: eq, value: true }
          text: "164.8. 더 살고 싶었다. 열일곱에서 끝난 쪽이 두고 간 말이다."
      - say:
          channel: narration
          when: { var: t_dare, op: eq, value: true }
          text: "한 번은 해 보는 쪽을 쥐었더니 2년 넘게 다닌 데가 없었다. 전세금을 빼서 카페를 했다."
      - say: { channel: narration, text: "지안으로 살 때는 그 버릇이 어디서 왔는지 몰랐다." }
      - goto: last_count

  last_count:
    actions:
      - say: { channel: narration, text: "다섯 번째 어둠이다." }
      - say: { channel: narration, text: "세 번은 쥐면 어떻게 되는지 모르고 쥐었다. 그보다 앞의 한 번은 쥘 줄도 몰랐다." }
      - say: { channel: narration, text: "이번에는 쥔 것과 두고 간 것을 다 보고 고른다." }
      - say: { channel: narration, text: "넷째 칸이 비어 있다." }
      - goto: stake

  stake:
    actions:
      - say: { channel: narration, text: "손이 닿는 것이 두 개다. 둘 다 일흔아홉 해에서 나왔다." }
      - say: { channel: narration, text: "하나는 김치통이다. 엄마 살아 계실 때 미룬 답장을, 돌아가신 뒤에도 썼다 지웠다." }
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: true }
          text: "다른 하나는 녹취 원본이다. 간인을 찍고 넘긴 뒤에는 내가 받은 목소리를 마음대로 꺼내 들을 수 없었다."
      - say:
          channel: narration
          when: { var: l4_signed, op: eq, value: false }
          text: "다른 하나는 녹취 원본이다. 팔리지 않은 책에도 그 사람들 목소리는 남아 있다."
      - say: { channel: narration, text: "김치통 쪽으로 기울면 223.7이다." }
      - say: { channel: narration, text: "원본 쪽으로 기울면 041.2다." }
      - say: { channel: narration, text: "앞에 적힌 세 수 옆에 놓아 본다. 둘 다 겹치는 자리가 없다." }
      - say: { channel: narration, text: "겹치지는 않아도 이웃은 있다. 223.7은 251.0 곁이고, 041.2는 076.3 곁이다." }
      - say: { channel: narration, text: "곁에 있었어야 했다는 것과 떠나지 말았어야 했다는 것. 닮은 후회는 가까운 자리에 찍힌다." }
      - say: { channel: narration, text: "같은 점이 없다는 걸 확인한 사람은 없다. 두 번 살고 두 번 다 기억해야 하니까." }
      - say: { channel: narration, text: "앞의 셋은 눈을 뜨고 아무것도 기억하지 못했다." }
      - bg: { id: void_light, transition: dissolve, duration: 1800 }
      - say: { channel: narration, text: "등 뒤에서 빛이 가까워진다. 벌써 다섯 번째다." }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "멀리서는 점 같던 것이 가까워지자 시야를 다 가린다." }
      - goto: last_choice

  last_choice:
    actions:
      - choice:
          key: v4
          prompt: "한쪽이 덜 어둡다. 쥘 수 있는 것은 하나다."
          options:
            - text: "곁에 남지 못한 후회"
              saveText: "곁에 있었어야 했다."
              set: { t_kin: true, last_taken: kin, deg_last: "223.7" }
              goto: last_go
            - text: "원본을 놓친 후회"
              saveText: "원본을 내 손에 쥐고 있었어야 했다."
              when: { var: l4_signed, op: eq, value: true }
              set: { t_hold: true, last_taken: hold, deg_last: "041.2" }
              goto: last_go
            - text: "목소리를 더 멀리 전하지 못한 후회"
              saveText: "뭐라도 쥐고 있었어야 했다."
              when: { var: l4_signed, op: eq, value: false }
              set: { t_hold: true, last_taken: hold, deg_last: "041.2" }
              goto: last_go
            - text: "쥐지 않는다."
              goto: last_stop

  last_stop:
    actions:
      - say: { channel: narration, text: "쥐지 않으면 기울어지지 않는다. 그건 네 번 다 알고 있었다." }
      - say: { channel: narration, text: "기울어지지 않으면 숫자가 안 붙는다. 넷째 칸이 빈 채로 남는다." }
      - choice:
          key: v4_stop
          prompt: "남은 것이 정말 없는가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: last_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: last_choice

  last_still:
    actions:
      - say: { channel: narration, text: "목록은 그대로 둔다. 셋까지 적혀 있고, 넷째 칸은 비어 있다." }
      - say: { channel: narration, text: "내가 한 말을 다시 들을 사람은 여기 없다." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  last_go:
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "다음 빛을 향해 천천히 움직였다.", wait: 1200 }
      - bg: { id: void_near, transition: dissolve, duration: 2300 }
      - wait: 900
      - say: { channel: narration, text: "편집실이 몇 층이었는지 기억이 나지 않았다.", wait: 1400 }
      - say: { channel: narration, text: "살면서 보던 풍경이 멀어진다. 그 너머로 낯선 풍경 하나가 드러난다." }
      - goto: winter_in

  look_choice:
    actions:
      - say: { channel: narration, text: "기억이 흐려지기 직전에 녹취록에 그었던 형광펜 줄이 떠오른다." }
      - say: { channel: narration, text: "셋이 서로 모르는 사이인데 셋 다 돌아봤다는 줄. 차 피디가 그 자리에서 몸을 기울였던 줄." }
      - say: { channel: narration, text: "돌아보지 않은 사람의 제보는 한 건도 없었다. 그 사람들은 기억을 못 하니까." }
      - choice:
          key: l5_look
          prompt: "기억이 사라지기 전에 뒤를 볼 수 있다."
          options:
            - text: "돌아본다."
              goto: look_back
            - text: "그대로 간다."
              goto: last_arrive

  look_back:
    actions:
      - effect: focus
      - say: { channel: narration, text: "돌아본다. 식은 아궁이 옆에 이불이 그대로 있다. 그 뒤에서 답장 칸의 커서가 깜박인다." }
      - say: { channel: narration, text: "빠져나가던 것들이 멈춘다. 편집실은 3층이었고 엄마 김치통은 초록색이었다." }
      - say: { channel: narration, text: "지나온 자리도 기억난다. 방금 고른 쪽의 숫자는 {{deg_last}}도였다." }
      - say: { channel: narration, text: "쥔 것이 하나가 아니다. 세어 보니 다섯이다." }
      - say: { channel: narration, text: "다섯 개를 센 채로 밝은 쪽에 닿는다." }
      - bg: { id: void_light, transition: dissolve, duration: 900 }
      - ending: returner

  # 넷째를 쥐고 기울어지는 중에, 한 번도 재판한 적 없는 것이 하나 더 온다.
  winter_in:
    pov: "???"
    actions:
      - say: { channel: narration, text: "편집실 기억은 멀어졌는데, 손끝에 차가운 기운이 남는다." }
      - wait: 900
      - say: { channel: narration, text: "하나가 더 온다." }
      - say: { channel: narration, text: "아까 냄새만 났던 겨울이다. 이번엔 가 본 길이 생각난다." }
      - bg: { id: void_light, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "이때는 아무것도 가져가는 법을 몰랐다. 그래서 그 겨울에는 숫자가 없다." }
      - say: { channel: card, with: [], text: "1809년 겨울\n조선", wait: 2200 }
      - goto: winter_remember

  # 기억은 한 번에 오지 않는다. 더듬어 찾은 것만 돌아오고, 셋이 모이면 나머지가 저절로 온다.
  winter_remember:
    pov: "???"
    actions:
      - choice:
          key: w_remember
          presentation: explore
          prompt: "어둠 속에서 그 겨울에 보고 들었던 것들이 하나씩 떠오른다."
          options:
            - text: "냄새"
              at: { x: 31, y: 68 }
              when: { var: m_ash, op: eq, value: false }
              goto: mem_ash
            - text: "소리"
              at: { x: 72, y: 41 }
              when: { var: m_jar, op: eq, value: false }
              goto: mem_jar
            - text: "추위"
              at: { x: 49, y: 22 }
              when: { var: m_river, op: eq, value: false }
              goto: mem_river
            - text: "울음"
              at: { x: 18, y: 36 }
              when: { var: m_found, op: gte, value: 3 }
              goto: mem_child

  mem_ash:
    pov: "???"
    actions:
      - set: { m_ash: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "아궁이에 코를 가까이 대자 탄내만 희미하게 남아 있다." }
      - say: { channel: narration, text: "땅을 파서 지은 집이었다. 바닥에 다 식은 재가 흩어져 있었다." }
      - say: { channel: narration, text: "아침에 나설 때 부지깽이로 재를 모아 덮어 뒀었다." }
      - goto: winter_remember

  mem_jar:
    pov: "???"
    actions:
      - set: { m_jar: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "독 바닥에 남은 좁쌀을 손톱으로 긁어모으던 소리다." }
      - say: { channel: narration, text: "좁쌀이 두 줌." }
      - say: { channel: narration, text: "손바닥에 털어 보니 어제보다 적다." }
      - goto: winter_remember

  mem_river:
    pov: "???"
    actions:
      - set: { m_river: true }
      - add: { m_found: 1 }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "강을 건너다 얼음이 갈라져 찬물이 발목까지 찼다." }
      - say: { channel: narration, text: "건너 마을에서 곡식을 꾸어 준다는 말을 들었다." }
      - say: { channel: narration, text: "얼음이 가운데만 얇았다." }
      - say: { channel: narration, text: "가는 데 반나절, 오는 데 반나절." }
      - goto: winter_remember

  mem_child:
    pov: "???"
    actions:
      - effect: { name: focus, wait: true }
      - sticker: { id: blanket, image: blanket_sticker, x: 50, y: 34, width: "clamp(190px, 28%, 360px)", enter: fadeIn, inputLockMs: 300 }
      - say: { channel: narration, text: "식은 아궁이 옆에 이불 한 채가 보인다." }
      - wait: 700
      - say: { channel: narration, text: "아이가 있었다. 사흘째 울지 않았다." }
      - say: { channel: narration, text: "울지 않는 걸 괜찮다고 쳤다." }
      - say: { channel: narration, text: "덮어 두고 나갔다. 돌아왔을 때 불은 꺼져 있었다." }
      - clearSticker: { id: blanket, leave: fadeOut }
      - effect: { name: pulse, wait: true }
      - say: { channel: narration, text: "그 뒤로 서른 해를 더 살았다. 그런데 그 겨울만 자꾸 떠오른다." }
      - goto: winter_face

  # 아이는 돌아오지 않는다. 네 삶에서 되풀이된 것은 두고 간 쪽이다.
  winter_face:
    pov: "???"
    actions:
      - say: { channel: narration, text: "아이 얼굴이 생각나지 않는다. 그렇게 오래 떠올려 본 얼굴인데." }
      - wait: 1400
      - say: { channel: narration, text: "대신 다른 얼굴들이 온다. 살면서 곁에 있던 사람들이다.", wait: 1400 }
      - say: { channel: narration, text: "저녁을 같이 먹자던 열여섯. 나는 장부를 폈다." }
      - say: { channel: narration, text: "방문 여는 소리에 벽 쪽으로 돌아눕던 어머이. 나는 기차를 탔다." }
      - say: { channel: narration, text: "앞치마를 벗고 병실에 들어온 엄마. 나는 입을 다물었다." }
      - say: { channel: narration, text: "유리 너머에서 수화기를 먼저 내려놓던 엄마. 나는 다음 주에 온다고 했다." }
      - wait: 1800
      - mood: { tone: warm, level: 2 }
      - say: { channel: narration, text: "넷은 닮은 데가 없다. 웃는 것도, 나를 부르는 말도 다르다." }
      - say: { channel: narration, text: "넷 다 한 번 있던 사람이다." }
      - wait: 1800
      - say: { channel: narration, text: "그 아이도 그 겨울에 한 번 있었다.", wait: 2200 }
      - mood: off
      - effect: { name: eclipse, wait: true }
      - say: { channel: narration, text: "같은 것은 내 쪽이다." }
      - wait: 1400
      - say: { channel: narration, text: "녹취였다면 여기에 표시했다. 사람이 자꾸 돌아오는 대목이다." }
      - say: { channel: narration, text: "다온이는 뒤에 사람이 서 있다고 했다. 얼굴은 안 보인다고. 맨날 거기 서 있다고." }
      - say: { channel: narration, text: "내 뒤에 있는 것은 이불 한 채다. 내가 덮어 놓아서 얼굴이 안 보인다." }
      - goto: winter_churn

  # 서른 해 동안 되씹은 것들이 한꺼번에 올라온다. 쥘 수 있는 것은 그중 하나뿐이다.
  winter_churn:
    pov: "???"
    actions:
      - say: { channel: narration, text: "손이 기억보다 늦게 움직인다. 이제 와서 아이 쪽으로 뻗는다." }
      - say: { channel: narration, text: "그날 강을 안 건넜더라면." }
      - say: { channel: narration, text: "건너더라도 해 지기 전에 돌아왔더라면." }
      - say: { channel: narration, text: "건너편에 사람이 있다는 말을, 전해 들은 그 말을 믿지 말았어야 했다." }
      - say: { channel: narration, text: "가을에 좁쌀 반 섬만 더 들여놨더라면 아침에 눈 뜨자마자 강으로 가진 않았을 것이다." }
      - say: { channel: narration, text: "애를 업고 갈까 했었다. 함께 얼음 위에 올랐다가 빠지면 어쩌냐고, 내가 그렇게 생각했다." }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "기억을 더듬을수록 아이를 이불 속에 두고 문을 닫던 순간으로 돌아간다." }
      - wait: 900
      - say: { channel: narration, text: "쥐면 기운다. 기울면 또 누군가로 눈을 뜬다." }
      - say: { channel: narration, text: "어느 쪽을 쥐어도 그 아이한테 닿지는 않는다. 눈을 뜨면 곁에 처음 보는 사람이 있다." }
      - bg: { id: void_near, transition: dissolve, duration: 3200 }
      - wait: 800
      - say: { channel: narration, text: "등 뒤에 있던 빛이 조금 더 가까이 왔다." }
      - say: { channel: narration, text: "저기서 덮쳐 오는 빛에 강 위의 얼음이 다시 하얘진다." }
      - goto: winter_choice

  winter_choice:
    pov: "???"
    actions:
      - choice:
          key: v_end
          prompt: "그 겨울을 지나고 서른 해 동안 후회했다. 이제 하나를 가져갈 수 있다."
          options:
            - text: "비어 버린 쌀독"
              saveText: "독이 비지 않았더라면."
              set: { v_end: hold, deg_last: "041.2" }
              goto: winter_go
            - text: "집을 나선 후회"
              saveText: "그날 나가지 않았더라면."
              set: { v_end: kin, deg_last: "223.7" }
              goto: winter_go
            - text: "쥐지 않는다."
              goto: winter_stop

  winter_stop:
    pov: "???"
    actions:
      - choice:
          key: v_end_stop
          prompt: "그 겨울은 이곳에 두고 갈 것인가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: winter_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: winter_choice

  winter_still:
    pov: "???"
    actions:
      - say: { channel: narration, text: "아궁이 옆에 앉았다. 이번에는 문을 열고 나가지 않았다." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  winter_go:
    pov: "???"
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say:
          channel: narration
          when:
            all:
              - { var: t_hold, op: eq, value: true }
              - { var: v_end, op: eq, value: hold }
          text: "041.2. 목록에 이미 있는 숫자다. 방금 적은 칸과 같다."
      - say:
          channel: narration
          when:
            all:
              - { var: t_kin, op: eq, value: true }
              - { var: v_end, op: eq, value: kin }
          text: "223.7. 목록에 이미 있는 숫자다. 방금 적은 칸과 같다."
      - wait: 220
      - branch:
          cases:
            - when: { var: looked_back, op: eq, value: true }
              goto: look_choice
          default: last_arrive

  last_arrive:
    actions:
      - say: { channel: narration, text: "방금 본 숫자부터 흐려진다." }
      - say: { channel: narration, text: "목록에 적어 둔 이름들이 흐려진다. 겨울은 맨 끝까지 남는다." }
      - say: { channel: narration, text: "엄마라는 말이 마지막으로 빠져나간다. 쥔 것 하나만 남는다." }
      - bg: { id: void, transition: dissolve, duration: 900 }
      - branch:
          cases:
            - when:
                all:
                  - { var: t_hold, op: eq, value: true }
                  - { var: v_end, op: eq, value: hold }
              goto: end_circle
            - when:
                all:
                  - { var: t_kin, op: eq, value: true }
                  - { var: v_end, op: eq, value: kin }
              goto: end_circle
          default: end_onward

  end_circle:
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1600 }
      - say: { channel: narration, text: "같은 점이 두 번이다. 유 선생님은 없을 거라 여겼다." }
      - say: { channel: narration, text: "눈을 뜨면 그 수부터 잊어버린다." }
      - ending: circle

  end_onward:
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1600 }
      - ending: onward
