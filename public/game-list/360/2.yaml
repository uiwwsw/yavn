chapterTitle: "6인실"
pov: "민재"

script:
  - scene: opening_day

scenes:
  opening_day:
    title: "굴렁쇠"
    actions:
      - bg: { id: ward, transition: fade, duration: 900 }
      - music: ward
      - place: "1988년 9월 17일 · 혜화동 대학병원 6인실 · 민재"
      - char: { id: 민재, position: left }
      - char: { id: 수경, position: right }
      - say: { channel: action, with: [], text: "복도 쪽 벽에 텔레비전이 하나 걸려 있다. 여섯 침대 중 다섯이 그쪽으로 고개를 돌렸다." }
      - say: { channel: action, with: [], text: "운동장이 비었다. 사람이 하나 들어온다. 아이다." }
      - say: { char: 수경, with: [민재], motion: lean_in, text: "야, 굴렁쇠다. 쟤 혼자 저 넓은 데를 굴리고 간다." }
      - say: { char: 민재, with: [수경], text: "누나, 소리 좀 줄여요. 옆에 할아버지 주무세요." }
      - say: { char: 수경, with: [민재], text: "할아버지 보청기 뺐어, 내가 봤어. 너 몇 살이라 그랬지?" }
      - say: { char: 민재, with: [수경], text: "열일곱이요. 고2." }
      - say: { char: 수경, with: [민재], text: "어." }
      - say: { char: 수경, with: [민재], text: "난 스물하나, 미대 2학년 하다 말았어. 두 번째 입원이야. 넌 처음이지? 티 나." }
      - say: { char: 민재, with: [수경], text: "뭐가 티 나요." }
      - say: { char: 수경, with: [민재], text: "뭐긴 뭐야." }
      - say: { char: 수경, with: [민재], motion: laugh, text: "링거 줄 꼬일까 봐 팔을 안 움직이잖아. 그거 안 빠져." }
      - say: { char: 수경, with: [민재], text: "내가 줄넘기도 해 봤어." }
      - say: { channel: action, with: [], text: "웃을 때 왼쪽 눈이 먼저 감긴다." }
      - say: { char: 민재, with: [수경], text: "…누나 웃는 거, 어디서 본 것 같아요." }
      - say: { char: 수경, with: [민재], text: "뭐?" }
      - say: { char: 수경, with: [민재], motion: laugh, text: "내가 누구 닮았어? 그런 소리 가끔 들어." }
      - say: { channel: thought, with: [], text: "그런 게 아니다. 어디서 봤는지 말을 못 하겠다. 본 적이 없으니까." }
      - say:
          channel: thought
          with: []
          when: { var: t_guard, op: eq, value: true }
          text: "이 누나는 왜 나한테 잘해 주지. 뭘 바라는 건지 먼저 알아야 한다."
      - say:
          channel: action
          with: []
          when: { var: t_stay, op: eq, value: true }
          text: "침대 난간에 엄마 목도리가 묶여 있다. 꼭 다시 오라고, 내가 묶었다."
      - say: { char: 민재, with: [수경], text: "저 애는 왜 혼자 들어가요." }
      - say: { char: 수경, with: [민재], text: "몰라. 근데 십만 명이 쳐다보는데 혼자 들어가잖아." }
      - say: { char: 수경, with: [민재], text: "나였으면 첫발에 저거 넘어뜨렸다." }
      - say: { channel: action, with: [], text: "아이가 운동장 가운데에 선다. 굴렁쇠가 넘어지지 않고 혼자 조금 더 굴러간다." }
      - say: { channel: thought, with: [], text: "다섯 침대가 다 조용해졌다. 보청기를 뺐다는 할아버지도 그쪽을 본다." }
      - say: { char: 수경, with: [민재], text: "개막식 끝나면 2주 뒤가 폐막식이야. 그날 밤에 불꽃 쏘는 거, 한강에서 보면 다 보인다더라." }
      - say: { char: 민재, with: [수경], text: "여기서 한강이 어떻게 보여요." }
      - say: { char: 수경, with: [민재], text: "안 보이지. 그러니까 가야지." }
      - goto: mom_visit

  mom_visit:
    title: "수치"
    actions:
      - place: "구월 이십육일 · 아침 여섯 시"
      - char: { id: 민재, position: left }
      - char: { id: 엄마, position: right }
      - say: { char: 엄마, with: [민재], text: "민재야, 갈치 조렸다. 가시 다 발랐어." }
      - say: { char: 엄마, with: [민재], text: "선생님 회진 도셨니?" }
      - say: { char: 민재, with: [엄마], text: "아까요. 엄마 가게는." }
      - say: { char: 엄마, with: [민재], text: "경매 끝나고 바로 왔지. 열 시에 열면 돼." }
      - say: { char: 엄마, with: [민재], text: "선생님이 뭐라셔?" }
      - say: { channel: action, with: [], text: "엄마가 보온 도시락 뚜껑을 연다. 안쪽에 물방울이 가득하고, 갈치 가시는 접시 한쪽에 따로 모여 있다." }
      - say: { channel: thought, with: [], text: "가시를 다 발라 오면 먹는 데 오 분이면 된다. 바르는 데는 새벽에 한 시간이 걸린다." }
      - say: { char: 민재, with: [엄마], text: "엄마, 나 가시 발라 먹을 수 있어요." }
      - say: { char: 엄마, with: [민재], text: "할 줄 아는 거 알아. 손이 부으니까 하는 거야." }
      - say: { channel: record, with: [엄마], text: "혈액검사 9월 25일. 백혈구 수치 재상승. 2차 항암 일정 조정 요함." }
      - say: { channel: action, with: [], text: "차트는 침대 발치에 걸려 있다. 글씨가 거꾸로 보이는데 숫자는 거꾸로도 읽힌다." }
      - say: { channel: thought, with: [], text: "지난주 숫자를 외워 뒀다. 이번 주 숫자가 더 크다." }
      - say: { channel: thought, with: [], text: "엄마는 '조정'이라는 글자를 못 봤다. 봤으면 서 있는 자리가 달랐을 것이다." }
      - goto: open_choice

  open_choice:
    actions:
      - choice:
          key: l3_open
          prompt: "엄마 손에서 비린내가 난다. 앞치마도 못 벗고 왔다."
          char: 엄마
          with: [엄마]
          options:
            - text: "엄마에게 무섭다고 말한다."
              saveText: "\"엄마, 나 무서워.\""
              goto: open_try
            - text: "엄마를 가게로 돌려보낸다."
              saveText: "\"괜찮대요. 가게 가 보세요.\""
              goto: open_fine

  open_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: hold }
              goto: open_cannot
            - when: { var: last_taken, op: eq, value: say }
              goto: open_cannot
            - when: { var: last_taken, op: eq, value: guard }
              goto: open_cannot
            - when: { var: last_taken, op: eq, value: live }
              goto: open_cannot
          default: open_said

  open_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [엄마], text: "무, 까지 나왔다. 입이 닫힌다.", wait: 900, unskippable: true }
      - say: { channel: action, with: [엄마], text: "다시 해 본다. 숨까지는 들어온다. 거기서 멎는다." }
      - say: { channel: thought, with: [], text: "엄마가 도시락 뚜껑에서 물을 턴다. 아직 내 쪽은 안 봤다." }
      - goto: open_fine

  open_fine:
    actions:
      - say: { char: 민재, with: [엄마], text: "괜찮대요. 수치가 좀 왔다 갔다 한대요. 가게 가 보세요." }
      - say: { char: 엄마, with: [민재], motion: nod, text: "그래? 그럼 다행이고. 갈치 식기 전에 먹어. 내일은 고등어 가져올게." }
      - say: { channel: action, with: [], text: "엄마가 문 앞에서 한 번 돌아본다. 나는 숟가락을 든다." }
      - goto: closing_night

  open_said:
    actions:
      - set: { l3_said: true }
      - say: { char: 민재, with: [엄마], text: "엄마, 나 무서워. 수치가 다시 올랐대." }
      - move: { id: 엄마, toward: 민재, style: approach }
      - say: { char: 엄마, with: [민재], text: "…그래. 무섭지. 엄마도 어제 선생님 방에서 듣고 계단에서 한참 앉아 있었어." }
      - say: { char: 민재, with: [엄마], text: "가게는요." }
      - effect: heal
      - say: { char: 엄마, with: [민재], text: "옆집 건어물 아줌마가 봐 준댔어. 오늘은 여기 있을게. 갈치 먹어. 가시 다 발랐어." }
      - move: { id: 엄마, toward: 민재, style: reset }
      - goto: closing_night

  closing_night:
    title: "폐막식"
    actions:
      - place: "시월 이일 · 밤 열 시 이십 분"
      - char: { id: 민재, position: left }
      - char: { id: 수경, position: right }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "간호사 교대가 열 시 반이야. 십 분이면 정문이고. 택시비는 내가 있어." }
      - say: { char: 민재, with: [수경], delivery: whisper, text: "들키면요." }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "들키면 혼나지. 그게 다야. 여기서 혼나는 것보다 무서운 걸 우리가 얼마나 많이 했는데." }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "비상계단으로 가면 당직 안 지나. 3층에서 2층은 불이 안 켜져 있어. 두 번 가 봤어." }
      - say: { char: 민재, with: [수경], delivery: whisper, text: "두 번 갔는데 왜 또 가요." }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "두 번 다 밤에 그냥 앉아만 있다 왔어. 오늘은 쏘는 날이잖아." }
      - say: { channel: action, with: [], text: "건너편 침대에서 할아버지가 몸을 돌린다. 보청기는 침대 옆 컵에 들어 있다." }
      - say: { channel: thought, with: [], text: "할아버지는 아무것도 못 듣는다. 그런데 눈은 뜨고 있다." }
      - goto: out_choice

  out_choice:
    actions:
      - choice:
          key: l3_out
          prompt: "수경 누나가 환자복 위에 잠바를 걸친다. 내 잠바도 들고 있다."
          char: 수경
          with: [수경]
          options:
            - text: "잠바를 받는다."
              goto: out_try
            - text: "병실에 남는다."
              saveText: "\"누나 혼자 가요. 엄마가 여섯 시에 와요.\""
              goto: out_stay

  out_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: kin }
              goto: out_cannot
            - when: { var: last_taken, op: eq, value: free }
              goto: out_cannot
            - when: { var: last_taken, op: eq, value: stay }
              goto: out_cannot
            - when: { var: last_taken, op: eq, value: dare }
              goto: out_cannot
          default: out_go

  out_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [수경], text: "손을 뻗었다가 보니, 손은 침대 난간을 잡고 있다. 목도리 묶인 자리다.", wait: 900, unskippable: true }
      - say: { channel: action, with: [수경], text: "손가락을 하나씩 펴 본다. 놓으라고 하면 다시 쥔다." }
      - say: { channel: thought, with: [], text: "아침에 엄마가 왔는데 침대가 비어 있으면. 그 생각에서 한 발도 못 나간다." }
      - goto: out_stay

  out_stay:
    actions:
      - say: { char: 민재, with: [수경], text: "누나 혼자 가요. 엄마가 여섯 시에 오는데, 내가 없으면 안 돼요." }
      - say: { char: 수경, with: [민재], text: "알았어. 사진 찍어 올게. …아, 카메라 없다. 그려 올게." }
      - say: { channel: action, with: [], text: "새벽 세 시에 슬리퍼 소리가 돌아왔다. 누나한테서 강바람 냄새가 났다." }
      - sticker: { id: sketch, image: sketch_sticker, x: 50, y: 32, width: "clamp(160px, 22%, 300px)", enter: fadeIn, inputLockMs: 300 }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "약봉지밖에 종이가 없더라. 이게 제일 큰 거. 이건 다리. 이 점이 나." }
      - clearSticker: { id: sketch, leave: fadeOut }
      - say: { char: 민재, with: [수경], delivery: whisper, text: "점이네요, 진짜." }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "멀리서 보면 다 점이야. 너도 왔으면 점 두 개였을 텐데." }
      - say: { channel: action, with: [], text: "약봉지를 받아 베개 밑에 넣는다. 접힌 자리가 손에 걸린다." }
      - say: { char: 민재, with: [수경], delivery: whisper, text: "…누나. 다리는 언제 걸어요." }
      - say: { char: 수경, with: [민재], delivery: whisper, text: "퇴원하면. 너도 와. 양쪽 끝에서 시작해서 가운데서 만나는 거야." }
      - goto: consent

  out_go:
    actions:
      - set: { l3_went: true }
      - bg: { id: hangang_night, transition: fade, duration: 1000 }
      - place: "밤 열한 시 · 동호대교 아래 둔치"
      - char: { id: 민재, position: left }
      - char: { id: 수경, position: right }
      - effect: moonveil
      - say: { char: 수경, with: [민재], motion: hop, text: "터졌다! 봐, 봐, 저 초록색. 저게 다 세금이야." }
      - say: { char: 민재, with: [수경], text: "누나 뛰지 마요. 링거 자국 터져요." }
      - say: { char: 수경, with: [민재], text: "넌 불꽃을 안 보고 사람들을 보네. 아까부터." }
      - say: { char: 민재, with: [수경], text: "…누가 신고할까 봐요. 환자복 바지잖아요." }
      - say: { char: 수경, with: [민재], motion: laugh, text: "아무도 안 봐. 다 위를 보잖아. 오늘은 위만 봐도 되는 날이야." }
      - say: { char: 수경, with: [민재], text: "나 퇴원하면 저 다리 걸어서 건널 거야. 이쪽 끝에서 저쪽 끝까지." }
      - say: { char: 민재, with: [수경], text: "그게 소원이에요?" }
      - say: { char: 수경, with: [민재], text: "소원은 아껴야지. 그건 계획이야." }
      - say: { channel: action, with: [], text: "둔치에 사람이 빽빽한데 아무도 환자복을 쳐다보지 않는다. 다 위를 보고 있다." }
      - say: { char: 민재, with: [수경], text: "누나. 저 다리 몇 미터예요." }
      - say: { char: 수경, with: [민재], text: "몰라. 재 봐야 알지. 그래서 걸어 보겠다는 거야." }
      - say: { channel: thought, with: [], text: "열한 시 사십 분. 여섯 시까지 여섯 시간 이십 분." }
      - bg: { id: ward, transition: fade, duration: 1000 }
      - goto: consent

  # 복도의 계산. 열일곱은 두 숫자를 각각은 셀 줄 알지만 같이 놓고는 못 센다.
  consent:
    title: "동의서"
    actions:
      - place: "시월 구일 · 6인실"
      - move: { id: 수경, style: reset }
      - char: { id: 민재, position: left }
      - say: { channel: action, with: [], text: "병실 문이 한 뼘 열려 있다. 그 틈으로 복도가 보인다." }
      - char: { id: 엄마, position: left }
      - char: { id: 의사, position: right }
      - say: { channel: record, with: [], text: "동종 골수이식 시행 동의서. 공여자 적합 검사 결과 동봉. 예상 비용 금 팔백만 원정." }
      - say: { char: 엄마, with: [의사], text: "선생님." }
      - say: { char: 엄마, with: [의사], text: "팔백이면… 저희 가게를 넘겨도 사백입니다." }
      - say: { char: 의사, with: [엄마], text: "어머님. 성공률을 먼저 들으셔야 합니다." }
      - say: { char: 의사, with: [엄마], text: "이 경우 삼십에서 사십 퍼센트입니다." }
      - wait: 900
      - say: { char: 엄마, with: [의사], motion: droop, text: "…" }
      - say: { char: 엄마, with: [의사], text: "안 하면요." }
      - say: { char: 의사, with: [엄마], text: "그건 제가 말씀드릴 수 없습니다." }
      - say: { char: 의사, with: [엄마], text: "다만 지금 수치로는 길게 보기 어렵습니다." }
      - wait: 700
      - say: { char: 엄마, with: [의사], text: "사백은 오늘이라도 됩니다." }
      - say: { char: 엄마, with: [의사], text: "나머지는… 좀 기다려 주시면 안 될까요." }
      - say: { char: 의사, with: [엄마], text: "그건 원무과에 말씀하셔야 합니다." }
      - say: { char: 엄마, with: [의사], text: "네." }
      - say: { char: 엄마, with: [의사], text: "네, 알겠습니다." }
      - move: { id: 의사, style: exit }
      - say: { channel: action, with: [엄마], text: "엄마는 그 자리에 그대로 서 있다. 한참 서 있다." }
      - wait: 1100
      - say: { channel: thought, with: [], text: "삼십에서 사십이면 열에 서넛이다. 그건 내가 센다." }
      - say: { channel: thought, with: [], text: "팔백에서 사백을 빼면 사백이다. 그것도 센다." }
      - say: { channel: thought, with: [], text: "둘을 같이 놓고 세는 건 안 된다. 그건 배운 적이 없다." }
      - char: { id: 민재, position: left }
      - char: { id: 엄마, position: right }
      - say: { channel: action, with: [민재, 엄마], text: "엄마가 병실로 들어온다. 앞치마를 벗고 온 건 처음이다." }
      - say: { char: 엄마, with: [민재], text: "민재야. 엄마가 선생님이랑 얘기했는데." }
      - say: { char: 민재, with: [엄마], text: "…들었어요." }
      - say: { char: 엄마, with: [민재], motion: droop, text: "문이 열려 있었니. 아이고." }
      - say: { char: 민재, with: [엄마], text: "엄마. 가게는 넘기지 마요." }
      - say: { char: 엄마, with: [민재], text: "그런 소리 하지 마. 그건 엄마가 정해." }
      - wait: 900
      - say: { channel: thought, with: [], text: "나 그거 안 받을래요, 라고 하려다 말았다." }
      - say: { channel: thought, with: [], text: "이건 입이 안 떨어진 게 아니다. 엄마 얼굴을 봐서 내가 안 한 거다." }
      - say: { channel: thought, with: [], text: "둘이 다르다는 걸 이제 안다." }
      - goto: noticed

  noticed:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: "" }
              goto: october
          default: noticed_body

  # 전환점. 여기서 처음으로 인물이 자기한테 적이 있다는 걸 안다.
  noticed_body:
    actions:
      - place: "같은 날 · 새벽 두 시"
      - say: { channel: thought, with: [], text: "잠이 안 와서 그걸 생각한다." }
      - say: { channel: thought, with: [], text: "하려고 했다. 분명히 하려고 했는데 안 됐다." }
      - say: { channel: action, with: [], text: "오른손을 들어 본다. 올라갔다 내려오고, 또 올라간다." }
      - say: { channel: thought, with: [], text: "지금은 된다. 그때는 안 됐다." }
      - wait: 1100
      - say: { channel: thought, with: [], text: "무서운 건 안 됐다는 게 아니다." }
      - say: { channel: thought, with: [], text: "안 되는 쪽이 하필 내가 제일 하고 싶었던 쪽이라는 거다." }
      - effect: { name: pulse, wait: true }
      - say: { channel: thought, with: [], text: "누가 고르는 것 같다. 나 말고." }
      - wait: 900
      - say: { channel: thought, with: [], text: "이 얘기를 누구한테 하지." }
      - say: { channel: thought, with: [], text: "엄마한테 하면 엄마가 운다. 선생님한테 하면 약이 하나 는다." }
      - say: { channel: thought, with: [], text: "수경 누나한테 하면 믿어 줄 것 같다. 그래서 더 못 한다." }
      - say: { channel: action, with: [], text: "아무한테도 안 했다. 열일곱이 할 수 있는 건 그 정도다." }
      - goto: october

  october:
    title: "빈 침대"
    actions:
      - place: "시월 이십일일 · 6인실"
      - char: { id: 민재, position: left }
      - char: { id: 엄마, position: right }
      - say: { char: 민재, with: [엄마], text: "엄마, 수경 누나 침대 시트 왜 걷었어요. 무균실 갔다가 온다 그랬는데." }
      - say: { char: 엄마, with: [민재], motion: droop, text: "…어제 새벽에. 수경이 어머니가 네 거라고 이걸 주고 가셨어." }
      - say: { channel: action, with: [], text: "시트가 걷힌 침대는 매트리스 비닐이 그대로 보인다. 간호사가 아직 새 시트를 안 깔았다." }
      - say: { char: 민재, with: [엄마], text: "무균실 갔다가 온다고 했어요. 저한테 그렇게 말했어요." }
      - say: { char: 엄마, with: [민재], text: "…그렇게 말하고 가는 거야, 다들." }
      - say: { channel: thought, with: [], text: "이 누나가 나한테 뭘 바라는지를 끝까지 못 알아냈다. 바라는 게 없었던 것 같다." }
      - say:
          channel: action
          with: [엄마]
          when: { var: l3_went, op: eq, value: true }
          text: "약봉지다. 뒷면에 다리가 그려져 있고, 그 위에 점이 두 개 찍혀 있다."
      - say:
          channel: action
          with: [엄마]
          when: { var: l3_went, op: eq, value: false }
          text: "약봉지 묶음이다. 불꽃 그림 뒤로 열 장쯤, 전부 이 병실 창밖이다."
      - say: { channel: action, with: [], text: "열 장이 다 같은 창이다. 나무 한 그루, 주차장 선 세 개, 건너편 건물의 창문 열두 개." }
      - say: { channel: thought, with: [], text: "맨 끝 창문 하나는 열 장 다 비뚤다." }
      - say: { channel: thought, with: [], text: "맨 뒷장에 다리가 있다. 창밖에서는 저 다리가 안 보인다." }
      - move: { id: 엄마, toward: 민재, style: reset }
      - place: "십일월 이십구일"
      - say: { char: 엄마, with: [민재], text: "민재야, 뭐 먹고 싶은 거 없어? 선생님이 오늘은 아무거나 된대." }
      - say: { char: 민재, with: [엄마], text: "떡볶이. 대학로에 누나가 맨날 말하던 집." }
      - say: { char: 엄마, with: [민재], text: "나으면 가자. 엄마가 사 줄게. 순대도." }
      - wait: 1600
      - say:
          char: 민재
          with: [엄마]
          when: { var: l3_said, op: eq, value: true }
          text: "엄마, 나 아직 무서워. 근데 엄마 있으니까 좀 덜해."
          wait: 2000
      - say:
          char: 민재
          with: [엄마]
          when: { var: l3_said, op: eq, value: false }
          text: "…네. 엄마 가게 늦겠다."
          wait: 2000
      - bg: { id: void, transition: fade, duration: 2600 }
      - music: void
      - goto: void_three

  # 세 번째 재판. 자각한 삶은 묻는 소리가 어디서 나는지 한 걸음 더 간다.
  void_three:
    title: "암흑"
    actions:
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "병실 불을 끈 밤보다 훨씬 넓다. 복도 불빛도, 기계 소리도 없다." }
      - say: { channel: narration, text: "열일곱 해가 전부 떠오른다. 금방 끝난다." }
      - say: { channel: narration, text: "갈치 가시. 천장 얼룩. 굴렁쇠. 가 본 데가 몇 군데 없다." }
      - say:
          channel: narration
          when: { var: l3_went, op: eq, value: true }
          text: "초록색 불꽃. 그날 밤 나는 위를 몇 번 못 봤다."
      - say:
          channel: narration
          when: { var: l3_went, op: eq, value: false }
          text: "약봉지에 찍힌 점 하나. 두 개가 될 수 있었다."
      - wait: 700
      - say: { channel: narration, text: "묻는 소리가 난다." }
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: "" }
              goto: void_three_charges
          default: void_three_knew

  void_three_knew:
    actions:
      - say: { channel: narration, text: "이 소리를 안다. 새벽 두 시에 천장 보면서 들은 것과 같다." }
      - say: { channel: narration, text: "그때는 누가 고르는 것 같았다." }
      - wait: 900
      - say: { channel: narration, text: "지금 보니 고르는 쪽도 나다." }
      - say: { channel: narration, text: "그러면 그때 못 하게 한 것도 나인가. 거기까지는 모르겠다." }
      - goto: void_three_charges

  void_three_charges:
    actions:
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "앞치마를 벗고 들어왔을 때." }
      - say: { channel: narration, text: "그때 뭐라고든 했더라면." }
      - say: { channel: narration, text: "가게는 넘기지 말라고 한 게 내가 한 말의 전부다." }
      - say: { channel: narration, text: "삼십에서 사십. 둘을 같이 세는 법을 끝까지 안 배웠다." }
      - say:
          channel: narration
          when: { var: l3_said, op: eq, value: false }
          text: "한 번만 말하면 됐는데. 한 번이면 됐을 것 같은데."
      - say:
          channel: narration
          when: { var: l3_went, op: eq, value: false }
          text: "잠바. 받기만 하면 됐는데."
      - say:
          channel: narration
          when: { var: l3_went, op: eq, value: true }
          text: "다리를 언제 걷느냐고 묻지 말걸. 누나는 그걸 계획이라고 했는데."
      - wait: 900
      - say: { channel: narration, text: "대답할 차례다. 열일곱 해는 금방 뒤진다. 그런데도 변명이 없다." }
      - say: { channel: narration, text: "묻는 쪽과 답하는 쪽이 같아서 끝나지 않는다." }
      - say: { channel: narration, text: "뒤가 밝다. 어디서 본 것 같다. 어디인지는 모른다." }
      - bg: { id: void_light, transition: dissolve, duration: 3200 }
      - say: { channel: narration, text: "열일곱 해에는 이런 걸 본 적이 없다. 그런데 처음이 아니다." }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - say: { channel: narration, text: "끝내려면 하나를 쥐어야 한다. 쥐면 나머지는 놓는 것이다." }
      - goto: void_three_choice

  void_three_choice:
    actions:
      - choice:
          key: v3
          prompt: "한쪽이 덜 어둡다. 쥘 것이 몇 개 없다."
          options:
            - text: "더 살고 싶었던 마음"
              saveText: "더 살고 싶었다."
              set: { t_live: true, last_taken: live, deg_last: "164.8" }
              goto: void_three_go
            - text: "해 보지 못한 후회"
              saveText: "한 번은 해 볼걸."
              set: { t_dare: true, last_taken: dare, deg_last: "339.4" }
              goto: void_three_go
            - text: "쥐지 않는다."
              goto: void_three_stop

  void_three_stop:
    actions:
      - choice:
          key: v3_stop
          prompt: "남은 것이 정말 없는가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: void_three_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: void_three_choice

  void_three_still:
    actions:
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  void_three_go:
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "기울어진다. 빨라진다.", autoAdvance: 1784 }
      - bg: { id: void_near, transition: dissolve, duration: 900 }
      - wait: 240
      - say: { channel: narration, text: "병원 이름이 빠져나간다. 누나 이름이 빠져나간다. 엄마 손 냄새가 마지막이다." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - goto: /0.yaml
