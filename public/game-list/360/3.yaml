chapterTitle: "녹취"
pov: "지안"

script:
  - scene: edit_room

scenes:
  edit_room:
    title: "편집실"
    actions:
      - bg: { id: edit_room, transition: cut }
      - music: now
      - place: "2026년 3월 · 상암동 편집실 · 지안"
      - char: { id: 지안, position: left }
      - char: { id: 차피디, position: right }
      - say:
          char: 차피디
          with: [지안]
          when: { var: t_live, op: eq, value: true }
          text: "지안 씨, 비상구는 저쪽이에요. 들어올 때마다 표시등부터 보네."
      - say:
          char: 지안
          with: [차피디]
          when: { var: t_live, op: eq, value: true }
          text: "저기 불이 꺼져 있어서요. …아, 켜져 있네."
      - say:
          char: 차피디
          with: [지안]
          motion: laugh
          when: { var: t_live, op: eq, value: true }
          text: "불 나면 지안 씨 뒤만 따라가면 되겠네."
      - say:
          char: 차피디
          with: [지안]
          when: { var: t_dare, op: eq, value: true }
          text: "이력서 보니까 여기 오기 전에 벌써 네 군데나 다녔네. 제일 오래 다닌 데도 2년은 안 됐고."
      - say:
          char: 지안
          with: [차피디]
          when: { var: t_dare, op: eq, value: true }
          text: "면접 때도 그 얘기 하셨잖아요. 그 카페까지 세신 거예요?"
      - say:
          char: 차피디
          with: [지안]
          motion: laugh
          when: { var: t_dare, op: eq, value: true }
          text: "전세금 빼서 차린 카페요. 거기도 2년 못 채웠죠? …됐어요, 일 얘기나 합시다."
      - say: { char: 차피디, with: [지안], text: "「기억하는 사람들」 폴더 열어요. 전에 살았던 삶이 기억난다는 제보들이에요." }
      - say: { char: 차피디, with: [지안], text: "석 달 사이에 400건이 왔어요. 선배 말로는 10년 전만 해도 1년에 두 통 왔대요." }
      - say: { char: 지안, with: [차피디], text: "옛날 제보랑도 맞춰 볼게요. 같은 얘기 한 사람이 있었는지." }
      - say: { char: 차피디, with: [지안], text: "어." }
      - say: { char: 차피디, with: [지안], motion: headtilt, text: "그건 나중에. 오늘 편집에 넣을 이 세 개부터 풀어 줘요." }
      - say: { channel: record, with: [], text: "녹취 07. 유정림(71, 전 수학 교사). \"어두웠어요, 한참. 그러다 한쪽이 덜 어둡더라고. 그리로 갔지.\"" }
      - sticker: { id: globe, image: globe_sticker, x: 50, y: 30, width: "clamp(170px, 22%, 310px)", enter: fadeIn, inputLockMs: 300 }
      - say: { channel: record, with: [], text: "\"후회를 하나 고르니까 몸이 한쪽으로 기울었어요. 그 방향을 각도라고 불렀지요.\"" }
      - say: { channel: record, with: [], text: "\"원 둘레에 점을 찍는 거예요. 사람마다 다른 자리에. 같은 자리는 없을 거라고 생각해요.\"" }
      - say: { channel: record, with: [], text: "\"가까운 점끼리는 닮았어요. 맞은편에 찍힌 사람은 딴판이고요. 0.001도만 달라도 다른 사람이지요.\"" }
      - clearSticker: { id: globe, leave: fadeOut }
      - say: { channel: record, with: [], text: "\"가다가 돌아봤어요. 교탁에 두고 온 출석부가 생각나서. 그 순간이 아직 생생해.\"" }
      - say: { channel: record, with: [], text: "녹취 12. 박다온(8). \"깜깜했어. 근데 안 무서웠어. 그러다 슝 갔어. 가다가 뒤 봤어. 강아지 있나 하고.\"" }
      - say: { channel: record, with: [], text: "녹취 19. 오문호(68). “자꾸 빨라지더군요. 다른 걸 가져갈걸 싶어서 뒤를 봤소.”" }
      - goto: mark_choice

  mark_choice:
    actions:
      - choice:
          key: l4_mark
          prompt: "세 녹취에 겹치는 말이 있다. 형광펜 뚜껑을 연다."
          options:
            - text: "'어두웠다'에 줄을 긋는다."
              forgiveOnce: true
              forgiveMessage: "차 피디가 종이를 도로 민다. \"어두웠다는 건 다 하는 말이에요. 다시 봐요.\""
              goto: mark_dark
            - text: "'하나만 들고 간다'에 줄을 긋는다."
              forgiveOnce: true
              forgiveMessage: "차 피디가 녹취를 내려놓는다. “유 선생님 책에 나온 말이에요. 다른 두 사람도 제 말로 한 얘기를 찾아봐요.”"
              goto: mark_one
            - text: "'가다가 돌아봤다'에 줄을 긋는다."
              set: { looked_back: true }
              goto: mark_back

  mark_dark:
    actions:
      - say: { char: 차피디, with: [지안], text: "어두웠다는 건 다 하는 말이에요. 죽으면 깜깜하다, 그건 유치원생도 지어내요." }
      - goto: archive

  mark_one:
    actions:
      - say: { char: 차피디, with: [지안], text: "하나만 들고 간다. 음, 자막으로는 좋네. 근데 유 선생님 책 읽고 따라 한 걸 수도 있어서." }
      - goto: archive

  mark_back:
    actions:
      - say: { char: 차피디, with: [지안], motion: lean_in, text: "…어. 진짜네. 선생님도, 애도, 오 사장님도. 셋이 서로 모르는 사이인데." }
      - say: { char: 지안, with: [차피디], text: "셋 다 뒤를 봤어요. 돌아본 까닭은 다르고요." }
      - say: { char: 차피디, with: [지안], text: "음." }
      - say: { char: 차피디, with: [지안], text: "셋 다 돌아봤다고 하는 부분에 타임코드 찍어 줘요." }
      - goto: archive

  archive:
    actions:
      - place: "같은 주 금요일 · 편집실"
      - say: { channel: record, with: [], text: "1931년 경성 모 의원 진료부. 환자 김○○(34). \"전에 살았다고 주장. 캄캄한 데서 뒤를 보았다는 말을 되풀이.\" 처치: 격리." }
      - say: { char: 지안, with: [차피디], text: "자료실에서 복사해 왔어요. 1931년에도 같은 말을 한 사람이 있었네요. 방송국 대신 병원에 갔고요." }
      - say: { char: 차피디, with: [지안], text: "그래도 늘었다고는 못 하겠네. 우리가 옛날 제보를 얼마나 찾았는지도 모르잖아요." }
      - say: { char: 지안, with: [차피디], text: "네. 모르는 거죠." }
      - say: { thread: "엄마", char: 지안어머니, speakerName: "엄마", channel: message, side: them, with: [], text: "지안아 주말에 오니? 김치 담갔다. 통 가져와라" }
      - say: { channel: action, with: [], text: "읽음 표시만 남긴다. 답은 인터뷰 다녀와서 하기로 한다." }
      - say: { char: 차피디, with: [지안], text: "그 1931년 환자, 그 뒤로 어떻게 됐는지는 있어요?" }
      - say: { char: 지안, with: [차피디], text: "진료부가 거기서 끊겨요. 그 병원이 1945년에 없어졌어요." }
      - say: { char: 차피디, with: [지안], motion: sigh, text: "그럼 못 쓰지. 끝을 모르는 건 방송에 못 올려요." }
      - say: { char: 지안, with: [차피디], text: "끝을 알면 쓰실 거예요?" }
      - say: { char: 차피디, with: [지안], text: "…아니. 끝이 안 좋으면 더 못 쓰지." }
      - say: { channel: thought, with: [], text: "처치 칸을 들여다보는 사이, 엄마 문자 알림이 화면에서 사라졌다." }
      - goto: daon

  # 네 번째 얼굴. 이번에는 저쪽이 먼저 알아본다.
  daon:
    title: "녹취 12"
    actions:
      - bg: { id: interview_room, transition: fade, duration: 900 }
      - place: { text: "3월 말 · 구산동 다온이네", presentation: center }
      - char: { id: 지안, position: left }
      - say: { channel: action, with: [], text: "녹취 사용 동의를 다시 받으러 왔다. 다온 어머니가 현관에서 동의서부터 받아 든다." }
      - char: { id: 다온, position: right }
      - char: { id: 다온엄마, position: center }
      - say: { channel: action, with: [다온, 다온엄마], text: "아이가 식탁에서 색연필을 쥐고 있다." }
      - say: { char: 다온엄마, with: [지안, 다온], text: "다온아, 인사해야지." }
      - say: { channel: action, with: [지안, 다온], text: "아이가 색연필을 놓지 않은 채 나를 한참 본다." }
      - say: { char: 다온, with: [지안], text: "아줌마, 저번에 내 말 안 끊은 아줌마다." }
      - say: { char: 지안, with: [다온], text: "응. 방송국에서 녹음할 때 봤지." }
      - say: { char: 다온, with: [지안], text: "다른 사람은 끊어." }
      - wait: 900
      - say: { char: 다온엄마, with: [지안, 다온], motion: laugh, text: "얘가 말이 좀 느려요." }
      - say: { char: 다온엄마, with: [지안, 다온], text: "어른들이 기다리다 못해 뒷말을 대신 해 버리잖아요. 그게 싫대요." }
      - say: { char: 지안, with: [다온엄마], text: "…끊으면 녹취를 못 써서요. 일이 그래요." }
      - say: { char: 다온, with: [지안], motion: laugh, text: "거봐." }
      - say: { channel: action, with: [지안, 다온], text: "아이가 웃는다. 아랫니 하나가 빠진 자리가 보인다." }
      - say: { channel: thought, with: [], text: "제보 400건을 받아 적었다. 말하던 얼굴은 한 줄도 안 적었다." }
      - say: { char: 다온엄마, with: [지안], text: "저는 주방에 있을게요. 커피 드실래요?" }
      - say: { char: 지안, with: [다온엄마], text: "아, 괜찮습니다." }
      - move: { id: 다온엄마, style: exit }
      - say: { char: 다온, with: [지안], text: "아줌마." }
      - say: { char: 다온, with: [지안], text: "나 그때 뒤 봤다고 했잖아." }
      - say: { char: 다온, with: [지안], text: "뒤에 뭐 있었는지 알아?" }
      - say: { char: 지안, with: [다온], text: "글쎄. 난 강아지인 줄 알았어." }
      - say: { char: 다온, with: [지안], text: "그건 엄마한테 한 말이고." }
      - wait: 1100
      - mood: { tone: dread, level: 1 }
      - say: { char: 다온, with: [지안], text: "사람 있었어." }
      - mood: { tone: dread, level: 2 }
      - say: { char: 다온, with: [지안], text: "근데 얼굴은 안 보여. 맨날 거기 서 있어." }
      - say: { char: 지안, with: [다온], text: "…맨날?" }
      - say: { char: 다온, with: [지안], text: "응. 내가 뒤 볼 때마다." }
      - say: { char: 다온, with: [지안], text: "아줌마도 봤어?" }
      - say: { channel: thought, with: [], text: "다온이가 밑창으로 의자 다리를 문지르며 대답을 기다린다." }
      - say: { char: 지안, with: [다온], text: "…아니. 못 봤어." }
      - mood: off
      - say: { channel: action, with: [], text: "다온이네를 나오고 나서야 녹음기를 한 번도 안 켰다는 걸 알았다. 다음에 볼 문호 씨 자료 위에 녹음기를 올려 둔다." }
      - goto: munho_home

  munho_home:
    title: "파주"
    actions:
      - say: { channel: card, with: [], text: "4월 · 파주 오문호 씨 자택", autoAdvance: 1400 }
      - bg: { id: interview_room, transition: cut }
      - place: "4월 · 파주 오문호 씨 자택"
      - char: { id: 지안, position: left }
      - char: { id: 문호, position: right }
      - say: { char: 문호, with: [지안], text: "전생엔 운산 금광에서 광부들을 부리는 일을 했소. 내가 맡은 갱이 무너졌지." }
      - say: { char: 문호, with: [지안], text: "애들한테 글을 가르칠걸, 그 생각을 들고 왔소. 이번엔 내 아들 공부를 얼마나 시켰는지 아시오?" }
      - say: { char: 지안, with: [문호], text: "…얼마나요." }
      - say: { char: 문호, with: [지안], motion: sigh, text: "시켰지. 의사 만들었소. 그 애가 나하고 말을 안 한 지 12년이오. 명절에도." }
      - say: { char: 지안, with: [문호], text: "…그건 녹취에 넣을까요, 뺄까요?" }
      - say: { char: 문호.lean, with: [지안], text: "넣으시오. 그리고 아가씨. 내가 사람을 보면 대강 보여요. 전에 어떻게 살았는지." }
      - move: { id: 문호, toward: 지안, style: approach }
      - say:
          char: 문호.lean
          with: [지안]
          when: { var: t_live, op: eq, value: true }
          text: "아가씨, 젊어서 물에 빠져 죽었소. 조심성 많은 것도 그래서요. 오자마자 창문 잠겼는지 봤지요?"
      - say:
          char: 문호.lean
          with: [지안]
          when: { var: t_dare, op: eq, value: true }
          text: "전생에 평생 한집에 갇혀 지냈소. 그래서 한군데 오래 못 있지. 벌써 자리에서 일어나려 하잖소."
      - say: { char: 지안, with: [문호], text: "선생님. 그걸 어떻게 아세요." }
      - say: { char: 문호, with: [지안], text: "보면 알지. 나는 내 것도 봤으니까." }
      - say:
          char: 지안
          with: [문호]
          when: { var: looked_back, op: eq, value: true }
          text: "선생님, 지난번 녹취에서 뒤를 봤다고 하셨죠. 왜 돌아보셨어요?"
      - say:
          char: 문호
          with: [지안]
          when: { var: looked_back, op: eq, value: true }
          text: "…쥔 걸 바꾸고 싶어서. 가다가 그 생각이 들었소."
      - say:
          char: 지안
          with: [문호]
          when: { var: looked_back, op: eq, value: true }
          text: "바꾸셨어요?"
      - say:
          char: 문호
          with: [지안]
          when: { var: looked_back, op: eq, value: true }
          text: "못 바꿨지. 돌아봤을 뿐이오. 그래서 기억이 남은 거고."
      - say:
          channel: thought
          with: []
          when: { var: looked_back, op: eq, value: true }
          text: "돌아본 사람만 기억한다면 이 400건에는 안 돌아본 사람 말이 없겠지."
      - say: { char: 문호, with: [지안], text: "갱목 부러지던 소리가 아직 들려요. 처음엔 딱, 조금 있다 또 딱. 세 번째에 다 내려앉았소." }
      - say: { char: 문호, with: [지안], text: "그런 건 지어낼 수가 없소. 들은 사람만 아는 거라." }
      - say: { channel: thought, with: [], text: "녹취 19번이다. 자기 일처럼 말한다. 하지만 그게 남의 삶도 안다는 증거는 아니다." }
      - say: { char: 지안, with: [문호], text: "갱 얘기는 저도 믿어요. 세 번 들었는데도 숨이 막혔어요." }
      - say: { char: 문호, motion: nod, with: [지안], text: "그렇지. 그러니 남의 것도 봐 주는 거요. 나만 알고 있으면 아까우니까." }
      - say: { char: 문호, with: [지안], text: "아가씨는 기억이 안 나니 모르겠지만." }
      - say: { channel: thought, with: [], text: "운산 얘기에는 갱목 부러지는 순서가 있다. 내 얘기에는 방금 내가 한 행동밖에 없다." }
      - say: { channel: action, with: [], text: "거실 액자에 지도가 들어 있다. 유리 안에서 접힌 모서리 위로 ‘운산’ 두 글자가 보인다." }
      - goto: munho_choice

  munho_choice:
    actions:
      - choice:
          key: l4_munho
          prompt: "문호 씨가 내 손등을 두드리며 대답을 기다린다."
          char: 문호
          with: [문호]
          options:
            - text: "문호의 말에 반박한다."
              saveText: "\"그건 선생님이 모르시는 일이에요.\""
              set: { l4_refuted: true }
              goto: munho_refute
            - text: "녹음하며 듣는다."
              saveText: "녹음기를 끄지 않고 듣고만 있는다."
              goto: munho_listen

  munho_refute:
    actions:
      - say: { char: 지안, with: [문호], text: "그건 선생님이 모르시는 일이에요. 저도 모르고요." }
      - move: { id: 문호, toward: 지안, style: retreat }
      - say: { char: 문호, with: [지안], text: "…내 기억은 진짜요. 갱목 부러지는 소리까지 나요." }
      - say: { char: 지안, with: [문호], text: "운산 얘기는 녹취에 남길게요. 제 얘기엔 그렇게 적을 근거가 없어요." }
      - goto: munho_yuna

  munho_listen:
    actions:
      - say: { char: 문호.lean, with: [지안], text: "그러니 살던 대로 사시오. 타고난 걸 거스르면 탈이 나. 내가 그걸 알려 주는 거요." }
      - say: { channel: action, with: [], text: "녹음기 불빛이 빨갛다. 고개를 끄덕이지도 젓지도 않는다." }
      - goto: munho_yuna

  munho_yuna:
    actions:
      - move: { id: 문호, toward: 지안, style: reset }
      - say: { char: 문호, with: [지안], text: "지난번에 온 조연출, 유나라고 했나. 그 아가씨한테도 일러 줬소. 전에 무당이었다고." }
      - say: { char: 지안, with: [문호], text: "유나 씨 지난주에 사표 냈어요." }
      - say: { char: 문호, with: [지안], motion: nod, text: "잘했지. 제 길 찾아간 거요." }
      - say: { char: 지안, with: [문호], text: "선생님. 유나 씨는 피디 되려고 4년 준비했어요." }
      - say: { char: 문호, with: [지안], text: "4년이나 매달렸는데 안 됐잖소. 이제라도 그만두게 해 준 거요." }
      - say: { char: 지안, with: [문호], text: "안 될 거라고 누가 정했어요." }
      - say: { char: 문호.lean, with: [지안], text: "아가씨. 그렇게 따지는 것도 타고난 거요." }
      - say: { channel: thought, with: [], text: "아드님이 12년 동안 말을 안 했다고 했다. 그 얘기는 녹취에 넣으라고 했다." }
      - say: { channel: action, with: [], text: "문호 씨가 내 녹음기를 가리키며 끄라는 손짓을 한다. 더 물어보지 못하고 녹음을 멈춘다." }
      - say: { thread: "엄마", char: 지안어머니, speakerName: "엄마", channel: message, side: them, with: [], text: "김치 쉰다. 엄마 입원하기 전에 택배로 부칠까" }
      - goto: glass

  # 면회는 예약제고 한 번에 십 분이다. 유리 너머로 보고 수화기로 말한다.
  glass:
    title: "유리창"
    actions:
      - bg: { id: glass_visit, transition: fade, duration: 900 }
      - place: { text: "4월 · 김포 요양병원", presentation: center }
      - say: { channel: action, with: [], text: "엄마가 입원한 요양병원에 면회를 예약했다. 집에 들러 김치통을 챙기려다 늦어서, 빈손으로 면회실에 앉았다." }
      - char: { id: 지안, position: left }
      - say: { channel: action, with: [], text: "감염 예방 때문에 유리벽 너머로만 면회할 수 있다. 주어진 시간은 10분. 벽에 남은 시간이 뜬다." }
      - say: { channel: action, with: [], continueLabel: "수화기를 든다", at: { x: 62, y: 58 }, text: "엄마가 들어와 앉는다. 머리가 지난번보다 짧다." }
      - bg: { id: glass_visit_talk, transition: cut }
      - say: { char: 지안어머니, with: [], text: "왔네. 밥은 먹었니?" }
      - say: { channel: action, with: [], text: "유리 너머로 엄마 입이 움직인다. 수화기를 귀에 더 바짝 댄다." }
      - say: { char: 지안, with: [], text: "먹었어요. 엄마는." }
      - say: { char: 지안어머니, with: [], text: "여긴 때 되면 밥 나와. 너는 맨날 끼니 거르잖아." }
      - say: { channel: action, with: [], text: "07:12. 07:11." }
      - say: { char: 지안어머니, with: [], text: "그 방송은 언제 나오니?" }
      - say: { char: 지안, with: [], text: "9월이요. 2부에 제가 편집한 게 나와요." }
      - say: { char: 지안어머니, with: [], text: "그럼 방송 나오면 또 같이 보겠네." }
      - say: { channel: thought, with: [], text: "그때까지는 안 온다는 말로 들린다. 엄마는 그렇게 말한 적이 없다." }
      - say: { channel: action, with: [], text: "휴대폰 달력을 내려다본다. 9월 전에도 빈 주말은 많다. 그때까지 한 번도 못 올 만큼 바쁘진 않다." }
      - say: { char: 지안, with: [], text: "엄마." }
      - say: { char: 지안어머니, with: [], text: "응." }
      - wait: 1100
      - say: { char: 지안, with: [], text: "…다음 주에 올게요." }
      - say: { char: 지안어머니, with: [], text: "그래. 밥 먹고 다녀." }
      - wait: 1200
      - say: { channel: action, with: [], text: "02:51. 엄마가 먼저 수화기를 내려놓는다.", wait: 2400, unskippable: true }
      - bg: { id: glass_visit_hung, transition: cut }
      - say: { channel: thought, with: [], text: "유리 너머 엄마 쪽 수화기가 제자리에 돌아가 있다. 내 것은 아직 귀에 있다.", wait: 1200 }
      - goto: pattern

  # 남의 녹취에서는 되돌아가는 자리가 세 번이면 보인다. 자기 것은 서른네 해를 들어도 안 보인다.
  pattern:
    actions:
      - bg: { id: edit_room, transition: fade, duration: 900 }
      - place: { text: "5월 · 편집실", presentation: center }
      - say: { channel: action, with: [], text: "사람이 같은 얘기로 자꾸 돌아오는 대목에 표시한다. 녹취를 풀 때 하는 일이다." }
      - say: { channel: action, with: [], text: "400건을 열어 봤다. 한 군데도 표시 안 한 파일은 없다." }
      - say: { channel: thought, with: [], text: "다음 녹취를 열었는데 재생을 누르기 전에 엄마 목소리가 들리는 것 같았다. 방송 나오면 또 같이 보겠네." }
      - wait: 900
      - say: { channel: thought, with: [], text: "엄마. 응. …다음 주에 올게요." }
      - say: { channel: thought, with: [], text: "거기다. 다음 주로 미루는 말은 금방 나온다." }
      - say: { channel: action, with: [], text: "녹취라면 거기에 표시했을 텐데. 내 말은 끊어 들을 수가 없다." }
      - wait: 700
      - say: { channel: thought, with: [], text: "말이 안 되면 쓰면 된다. 쓰는 건 내 일이다." }
      - say: { channel: action, with: [], text: "메시지 창을 열었다." }
      - say: { thread: "엄마", channel: message, side: me, with: [], text: "엄마 저 다음 주 말고 이번 주에 갈게요 토요일에" }
      - say: { channel: action, with: [], text: "전송 버튼을 누르기 전에 쓴 말을 한 번 더 읽는다." }
      - wait: 1100
      - say: { channel: action, with: [], text: "글자를 맨 끝부터 지웠다.", wait: 900, unskippable: true }
      - say: { channel: thought, with: [], text: "다시 써 본다. 전송에 손을 대자 손가락이 굳는다." }
      - effect: { name: pulse, wait: true }
      - say: { channel: thought, with: [], text: "화면을 끄기 전에 ‘토요일에’까지는 남겨 둔다." }
      - goto: contract

  contract:
    title: "동의서"
    actions:
      - bg: { id: edit_room, transition: fade, duration: 900 }
      - place: "5월 · 편집실"
      - char: { id: 지안, position: left }
      - char: { id: 차피디, position: right }
      - say: { char: 차피디, with: [지안], text: "2부 예고는 오 사장님으로 가요. '당신의 전생을 읽어 드립니다.' 시청자 사연도 받고." }
      - say: { char: 지안, with: [차피디], text: "그분 건 자기 기억이라면서요. 남의 전생 얘기는 그분 짐작이고요." }
      - say: { char: 차피디, with: [지안], text: "알아요. 그래도 사람들이 보잖아. 참, 지안 씨 정규직 계약서 왔어요. 본부장 결재 났어요." }
      - say: { char: 차피디, with: [지안], text: "뒤에 붙은 건 녹취 원본 양도 동의서. 서명하면 원본은 회사 자산이에요. 편집권도." }
      - say: { char: 지안, with: [차피디], text: "원본도 드려야 돼요? 1부는 복사본으로 편집 다 끝냈잖아요." }
      - say: { char: 차피디, with: [지안], text: "시사 반응이 좋아서 벌써 재방송이며 해외 판권 얘기가 들어와요. 그때마다 원본을 지안 씨한테 달랠 순 없잖아요." }
      - say: { char: 차피디, with: [지안], text: "거절할 거면 저도 계약팀에 얘기를 해야 돼요. 오늘 안으로 답을 줘요." }
      - say: { char: 지안, with: [차피디], text: "정규직 시켜 준다면서 이걸 같이 내미시면 어떡해요." }
      - say: { char: 차피디, with: [지안], motion: sigh, text: "네. 이번엔 둘이 한 묶음이에요. 저도 여기서 십사 년 일했지만 이건 못 바꿔요." }
      - say: { channel: action, with: [], text: "차 피디가 계약서를 넘겨 서명할 칸을 짚어 준다." }
      - say: { channel: thought, with: [], text: "유정림, 박다온, 오문호. 사인하면 그 사람들 목소리를 넘기는 거다." }
      - goto: sign_choice

  sign_choice:
    actions:
      - choice:
          key: l4_sign
          prompt: "계약서 위에 펜이 놓여 있다. 뚜껑은 차 피디가 열어 두었다."
          char: 차피디
          with: [차피디]
          options:
            - text: "서명한다."
              saveText: "서명한다. 원본은 방송국이 갖는다."
              goto: sign_try
            - text: "서명을 거절한다."
              saveText: "서명하지 않는다. 증언자들을 한 명씩 다시 찾아간다."
              goto: leave_try

  sign_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: kin }
              goto: sign_cannot_stay
            - when: { var: last_taken, op: eq, value: free }
              goto: sign_cannot_stay
            - when: { var: last_taken, op: eq, value: stay }
              goto: sign_cannot_stay
            - when: { var: last_taken, op: eq, value: dare }
              goto: sign_cannot_stay
          default: sign_yes

  leave_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: hold }
              goto: sign_cannot_leave
            - when: { var: last_taken, op: eq, value: say }
              goto: sign_cannot_leave
            - when: { var: last_taken, op: eq, value: guard }
              goto: sign_cannot_leave
            - when: { var: last_taken, op: eq, value: live }
              goto: sign_cannot_leave
          default: sign_no

  sign_cannot_leave:
    actions:
      - set: { l4_sign_blocked: true }
      - wait: 1100
      - say:
          channel: action
          with: [차피디]
          when: { var: last_taken, op: ne, value: say }
          text: "일어서려고 했다. 손은 펜을 쥐고 있다."
          wait: 900
          unskippable: true
      - say:
          channel: thought
          with: []
          when: { var: last_taken, op: ne, value: say }
          text: "월세 자동이체가 25일. 실손보험이 27일."
      - say:
          channel: action
          with: [차피디]
          when: { var: last_taken, op: eq, value: say }
          text: "안 하겠다고 하려 했다. 입에서는 조항을 하나씩 따지는 말이 나온다."
          wait: 900
          unskippable: true
      - say:
          channel: thought
          with: []
          when: { var: last_taken, op: eq, value: say }
          text: "차 피디가 다 대답해 줬다. 물을 것이 떨어졌는데 손에 펜이 있다."
      - goto: sign_yes

  sign_cannot_stay:
    actions:
      - set: { l4_sign_blocked: true }
      - wait: 1100
      - say:
          channel: action
          with: [차피디]
          when: { var: last_taken, op: ne, value: stay }
          text: "펜을 들었다. 어느새 가방끈이 어깨에 걸려 있다."
          wait: 900
          unskippable: true
      - say:
          channel: thought
          with: []
          when: { var: last_taken, op: ne, value: stay }
          text: "앉아서 이름 석 자만 쓰면 되는데. 매번 문 쪽으로 몸이 먼저 간다."
      - say:
          channel: action
          with: [차피디]
          when: { var: last_taken, op: eq, value: stay }
          text: "펜을 들었다. 펜촉이 서명 칸 위에서 내려가지 않는다."
          wait: 900
          unskippable: true
      - say:
          channel: thought
          with: []
          when: { var: last_taken, op: eq, value: stay }
          text: "쓰면 유 선생님도 다온이도 내 서랍을 떠난다. 원본 폴더를 닫지도 못하고 앉아 있다."
      - goto: sign_no

  sign_yes:
    actions:
      - set: { l4_signed: true }
      - say: { char: 지안, with: [차피디], text: "뒤에 붙은 동의서에도 서명하면 되는 거죠?" }
      - say: { char: 차피디, with: [지안], motion: nod, text: "네. 장과 장 사이에 도장도 찍고요. 축하해요. 다음 달부터 4대 보험 들어요." }
      - place: "그해 9월"
      - say: { channel: system, with: [], text: "「기억하는 사람들」 2부 방영. 다음 날 출근하니 재방송 일정이 붙어 있다." }
      - say: { channel: record, with: [], text: "시청자 게시판. \"저 애 우리 학교임. 오늘 애들이 방송 따라 하면서 놀림.\"" }
      - say: { thread: "엄마", char: 지안어머니, speakerName: "엄마", channel: message, side: them, with: [], text: "방송 봤다. 네 이름 맨 끝에 지나가더라. 전화 좀 받아라" }
      - say: { channel: action, with: [], text: "편집실. 3부 마감이 내일이라 전화는 진동으로 돌려 둔다." }
      - goto: years_2026

  sign_no:
    actions:
      - say: { char: 지안, with: [차피디], text: "죄송해요. 원본은 제가 받은 거라서요." }
      - say: { char: 지안, with: [차피디], text: "그분들께는 방송에 쓴다는 허락만 받았어요. 넘겨도 되는지는 다시 여쭤야 해요." }
      - say: { char: 차피디, with: [지안], motion: sigh, text: "지안 씨. 이거 놓치면 다음은 없어요. 여섯 번째 회사 찾을 거예요?" }
      - say: { char: 지안, with: [차피디], text: "유 선생님부터 다시 뵙고 올게요." }
      - say: { channel: card, with: [], text: "이듬해 가을\n고시원 책상" }
      - say: { channel: system, with: [], text: "『돌아본 사람들』 출간. 서점에서 돌아온 책 상자가 고시원 문 앞에 쌓인다." }
      - say: { channel: record, with: [], text: "독자 엽서. \"우리 애가 다섯 살 때 하던 말이 이 책에 있었습니다. 병원에 안 데려가도 되겠지요.\" 박다온 어머니." }
      - say: { thread: "엄마", char: 지안어머니, speakerName: "엄마", channel: message, side: them, with: [], text: "책 샀다. 서점에 한 권 있더라. 밥은 먹고 다니니. 보증금은 엄마가 좀 보탤게" }
      - say: { channel: action, with: [], text: "고시원 책상. 다음 증언자가 목포에 있어서, 답은 다녀와서 하기로 한다." }
      - goto: years_2026

  years_2026:
    title: "마흔다섯 해"
    actions:
      - bg: { id: window_dawn, transition: fade, duration: 1200 }
      - branch:
          cases:
            - when: { var: l4_signed, op: eq, value: true }
              goto: years_2026_signed
          default: years_2026_book

  years_2026_signed:
    actions:
      - say: { channel: card, with: [], text: "그 뒤로 마흔다섯 해", autoAdvance: 1800 }
      - place: "2026년 10월 · 편집실"
      - say: { channel: thought, with: [], text: "3부가 나간 주에 다온이 어머니에게서 전화가 세 번 왔다. 세 번 다 편집실에 있었다. 다시 걸지는 않았다." }
      - goto: years_2026_mother

  years_2026_book:
    actions:
      - say: { channel: card, with: [], text: "그 뒤로 마흔네 해", autoAdvance: 1800 }
      - goto: years_2026_mother

  years_2026_mother:
    actions:
      - place: "2027년 · 김포 요양병원"
      - say: { channel: thought, with: [], text: "한 달에 한 번은 김포에 갔다. 유리 너머 십 분. 엄마는 그때마다 수화기를 먼저 내려놓았고, 나는 그때마다 다음 주에 온다고 했다." }
      - wait: 800
      - place: "2029년 겨울 · 김포"
