title: "360"
author:
  name: "uiwwsw"
version: "1.2.1"
seo:
  description: "1809년 조선에서 2026년 서울까지. 죽은 뒤에야 한꺼번에 떠오르는 기억 속에서 후회 하나를 골라 다음 삶으로 가져간다. 다섯 삶을 다룬 비주얼노벨. 5장, 결말 4종."
  keywords:
    - "환생 비주얼노벨"
    - "철학 SF"
    - "선택형 이야기"
    - "시대극"
    - "미스터리"
  image: "assets/bg/title.svg"
  imageAlt: "밤에 다섯 조각의 종이가 구체를 이루고, 궤도에 별 하나가 빛나는 그림"
textSpeed: 32
autoSave: true
clickToInstant: true
chapters: 5
ui:
  template: cinematic-noir
legalNotices:
  - id: content-warning
    title: "내용 안내"
    text: "죽음과 임종, 굶주림, 전쟁 중 피란, 화재, 청소년의 투병을 다룹니다. 신체와 사건의 경과는 자세히 묘사하지 않습니다."
startScreen:
  enabled: true
  music: assets/music/void.flac
  image: assets/bg/title.svg
  imagePosition: "50% 50%"
  mobileImagePosition: "64% 50%"
  showTitle: true
  titleColor: "#e9e4d8"
  startButtonText: "눈을 뜬다"
  buttonPosition: bottom-left
  eyebrow: "1809 – 2026 · 철학 SF · 5장 · 결말 4종"
  subtitle: "눈을 떴다. 어둠 속에서 방금 끝난 삶이 처음부터 떠오른다. 다음으로 가져갈 수 있는 것은 하나뿐이다."
  scene:
    layout: split
    motion: drift
    duration: 34000
    parallax: 6
    particles: dust
    intensity: 0.25
    fog: false
    light: breathe
    accent: "#c79c58"
endings:
  onward:
    title: "한 점"
    message: "{{deg_last}}°. 어느 해 어느 나라인지는 고를 수 없었다."
    epilogue: "갓난아이가 운다. 받아 든 사람이 웃는다. 왼쪽 눈이 먼저 감긴다."
    background: window_dawn
    music: birth
    tone: hopeful
  circle:
    title: "한 바퀴"
    message: "{{deg_last}}°. 일흔아홉 해를 살고 떠날 때 골랐던 자리와 같다. 같은 자리에 두 번 닿았다."
    epilogue: "갓난아이는 그 겨울을 모른다. 젖을 물고, 주먹을 쥔다."
    background: window_dawn
    music: birth
    tone: mystery
  returner:
    title: "돌아본 사람"
    message: "여섯 살 되던 해, 아이가 저녁을 먹다 말했다. \"엄마, 나 전에 편집실에서 일했어.\""
    epilogue: "엄마는 웃으면서 휴대폰 녹음 버튼을 눌렀다. 그해 제보는 구백 건을 넘었다."
    background: window_dawn
    music: now
    tone: mystery
  still:
    title: "머무름"
    message: "나아가지 않았다. 덜 어두운 쪽은 여전히 저기 있다."
    epilogue: "한참을 기다려도 더 가까워지는 빛은 없다."
    background: void
    music: void
    tone: mystery
defaultEnding: onward
