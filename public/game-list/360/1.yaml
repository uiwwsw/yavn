chapterTitle: "부두"
pov: "순임"

script:
  - scene: roster

scenes:
  # 한 자리에 둘이 서 있었다. 규칙은 쓰여 있었고, 나는 규칙대로 들어갔다.
  roster:
    title: "명부"
    actions:
      - bg: { id: busan_market, transition: fade, duration: 900 }
      - music: market
      - place: "1952년 12월 · 부산 국제시장 · 순임"
      - say: { channel: action, with: [], text: "국제시장에서는 상인회에 이름을 올려야 좌판을 펼 수 있다. 3열 17번을 기다리는 사람은 둘이었다." }
      - say: { channel: record, with: [], text: "대기 명부. 3열 17번. 김순임(29). 박복례(41)." }
      - say: { channel: action, with: [], text: "벽에 규칙이 붙어 있다. 두 사람이 같은 자리를 기다리면 자릿세부터 낸 사람이 들어간다." }
      - char: { id: 순임, position: left }
      - char: { id: 복례, position: right }
      - say: { char: 복례, with: [순임], text: "순임이 왔구먼." }
      - say: { char: 복례, with: [순임], text: "냈소?" }
      - say: { char: 순임, with: [복례], text: "…네." }
      - say: { char: 복례, with: [순임], text: "잘했지. 계 탔다며." }
      - say: { channel: thought, with: [복례], text: "지난달에 곗돈을 받았다. 아주머니가 돈을 마련하는 동안 내가 먼저 자릿세를 냈다." }
      - say: { char: 순임, with: [복례], text: "복례 아주머니, 저, 그게…" }
      - say: { char: 복례, with: [순임], text: "됐소." }
      - say: { char: 복례, with: [순임], text: "먼저 낸 사람이 임자지. 나는 길목에서 하오." }
      - say: { char: 순임, with: [복례], text: "길목은 천막을 못 치잖아요." }
      - say: { char: 복례, with: [순임], text: "치면 되지 뭐. 비 오면 걷고." }
      - say: { channel: thought, with: [복례], text: "저 집은 아이가 둘이다." }
      - say: { channel: thought, with: [복례], text: "미안하다는 말을 하려다 말았다. 하면 자리를 내놔야 할 것 같아서." }
      - say: { char: 복례, with: [순임], text: "순임아." }
      - say: { char: 복례, with: [순임], text: "좋은 자리야. 잘 써." }
      - move: { id: 복례, style: exit }
      - say: { channel: action, with: [], text: "복례 아주머니가 짐을 들고 길목으로 간다. 한 번도 돌아보지 않았다." }
      - goto: stall

  stall:
    title: "좌판"
    actions:
      - char: { id: 순임, position: left }
      - char: { id: 기호, position: right }
      - say: { char: 기호, with: [순임], text: "럭키 스트라이크 두 보루, 스팸 열 통. 오늘은 초콜릿도 있소." }
      - say: { char: 순임, with: [기호], text: "초콜릿은 됐어요. 애 이 썩어요." }
      - say: { char: 기호, with: [순임], text: "아이고." }
      - say: { char: 기호, with: [순임], motion: laugh, text: "영호 주라는 게 아니라 팔라는 거요, 아주머니. 장사를 이태 하고도 그러네." }
      - say:
          char: 순임
          with: [기호]
          when: { var: t_say, op: eq, value: true }
          text: "최 통역은 말끝이 또렷해요. 옆이 웅성거려도 하는 말이 다 들려요."
      - say:
          char: 순임
          with: [기호]
          when: { var: t_say, op: eq, value: true }
          text: "그게 보기 좋아요."
      - say:
          char: 기호
          with: [순임]
          motion: startle
          when: { var: t_say, op: eq, value: true }
          text: "…그런 말을 물건 받다 말고 하오? 옆 좌판에서 다 듣는데."
      - say:
          channel: thought
          with: []
          when: { var: t_say, op: eq, value: true }
          text: "말하고 나서야 옆 좌판에 사람 있는 게 보인다. 어려서부터 꼭 이랬다."
      - say:
          channel: action
          with: []
          text: "좌판 밑에 보따리 하나가 싸여 있다. 흥남에서 내려온 날부터 풀어 본 적이 없다."
      - say:
          channel: thought
          with: []
          text: "배에 오를 때 들고 있던 짐이다. 안에 든 건 어머이가 더 잘 안다."
      - say:
          channel: thought
          with: []
          text: "펴 놓으면 여기서 아주 살게 될 것 같았다. 어느새 이태가 지났다."
      - char: { id: 영호, position: center }
      - say: { char: 영호, with: [순임], motion: hop, text: "엄마! 할머이 또 부두 나갔어. 아버지 온다고." }
      - say: { channel: action, with: [], text: "웃을 때 왼쪽 눈이 먼저 감긴다. 제 아비도 그랬다던데 나는 본 기억이 없다." }
      - say: { char: 순임, with: [영호], text: "오늘은 배 들어오는 날이 아닌데." }
      - say: { char: 순임, with: [영호], text: "…참." }
      - say: { char: 영호, with: [순임], text: "날마다 들어온대, 할머이가. 나 초콜릿 하나만." }
      - say: { char: 기호, with: [영호, 순임], text: "옜다. 이건 아저씨가 주는 거다. 엄마한텐 비밀이고." }
      - say: { char: 순임, with: [기호], text: "제 앞에서 주면서 무슨 비밀이에요." }
      - say: { char: 기호, with: [순임], text: "허허." }
      - say: { char: 기호, with: [순임], text: "그건 그렇고, 서울 수복된 지가 언젠데 아직 여기서 좌판을 하오. 명동에 점방 자리가 났어." }
      - say: { char: 기호, with: [순임], text: "보증금이 삼백만 원이오. 한강 건널 도강증은 내가 부대에서 받아 오지. 곗돈 삼백오십 받았다며." }
      - say: { char: 기호, with: [순임], text: "같이 갑시다. 내가 물건 대고, 아주머니가 팔고." }
      - goto: heart_choice

  heart_choice:
    actions:
      - choice:
          key: l2_heart
          prompt: "기호가 좌판에 팔꿈치를 대고 웃는다."
          char: 기호
          with: [기호]
          options:
            - text: "거래 조건만 이야기한다."
              saveText: "돈 얘기만 한다. 삼백오십만 원, 영수증에 도장까지 받는다."
              goto: heart_try
            - text: "기호가 함께 가자는 이유를 묻는다."
              saveText: "돈보다 먼저 묻는다. 같이 가자는 게 점방인지, 나인지."
              goto: heart_told

  heart_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: hold }
              goto: heart_cannot
            - when: { var: last_taken, op: eq, value: say }
              goto: heart_cannot
            - when: { var: last_taken, op: eq, value: guard }
              goto: heart_cannot
            - when: { var: last_taken, op: eq, value: live }
              goto: heart_cannot
          default: heart_receipt

  heart_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [], text: "영수증부터 달라고 할 참이었다. 입을 열자 다른 말이 나왔다.", wait: 900, unskippable: true }
      - goto: heart_told

  heart_told:
    actions:
      - set: { l2_told: true }
      - say: { char: 순임, with: [기호], text: "나는 최 통역이 좋아요. 그래서 묻는 거예요." }
      - say: { char: 순임, with: [기호], text: "같이 가자는 게 점방이에요, 나예요?" }
      - move: { id: 기호, toward: 순임, style: retreat }
      - say: { char: 기호, with: [순임], text: "…둘 다면 안 되오?" }
      - say: { char: 순임, with: [기호], text: "돼요. 둘 다면 돼요." }
      - say: { channel: action, with: [], text: "전대를 풀어 건넸다. 세어 보라는 말도 하지 않았다." }
      - move: { id: 기호, toward: 순임, style: reset }
      - goto: shack

  heart_receipt:
    actions:
      - say: { char: 순임, with: [기호], text: "영수증 써 주세요. 받은 날짜, 금액, 이름 석 자. 도장도요." }
      - say: { char: 기호, with: [순임], motion: laugh, text: "아주머니 무섭네. 함흥 사람은 다 이렇소?" }
      - sticker: { id: receipt, image: receipt_sticker, x: 50, y: 32, width: "clamp(160px, 22%, 300px)", enter: fadeIn, inputLockMs: 300 }
      - say: { channel: record, with: [], text: "영수증. 일금 삼백오십만 원정. 단기 4285년 12월 9일. 영수인 최기호 (인)" }
      - clearSticker: { id: receipt, leave: fadeOut }
      - say: { char: 순임, with: [기호], text: "됐어요. 도강증은 언제 돼요?" }
      - say: { char: 기호, with: [순임], text: "정월 안에. 믿으시오." }
      - goto: shack

  shack:
    title: "영주동"
    actions:
      - bg: { id: busan_shack, transition: fade, duration: 900 }
      - place: "그날 밤 · 영주동 판잣집"
      - char: { id: 순임, position: left }
      - char: { id: 시어머니, position: right }
      - say: { char: 시어머니, with: [순임], text: "오늘도 안 왔다." }
      - say: { char: 순임, with: [시어머니], text: "어머이, 날이 찬데 부두에 종일 서 계시면 어떡해요. 무릎도 안 좋으면서." }
      - say: { char: 시어머니, with: [순임], text: "흥남서 배 탈 적에 내가 그랬지비, 부산 부두서 기다린다고. 자리 뜨면 못 찾는다." }
      - say: { char: 순임, with: [시어머니], text: "영호 애비는 그 말 못 들었어요. 그때 벌써 줄이 끊겼잖아요." }
      - say: { char: 시어머니, with: [순임], motion: shake, text: "들었다. 내 아들은 내 목소리 듣는다." }
      - say: { channel: action, with: [], text: "어머이 고무신 뒤축이 닳아 한쪽으로 기울었다. 부두까지 걸어서 사십 분이다." }
      - say: { char: 순임, with: [시어머니], text: "어머이. 그 배에 만 명이나 탔다잖아요. 그런 데서 어떻게 다 챙겨요." }
      - say: { char: 시어머니, with: [순임], text: "내가 거기 서 있어야 걔가 찾지." }
      - say: { char: 순임, with: [시어머니], text: "어머이, 저 서울에 점방 자리 알아보고 있어요. 봄에 다 같이 올라가요." }
      - say: { char: 시어머니, with: [순임], text: "가라. 영호 양말이나 기워 놓고 자라." }
      - say: { char: 시어머니, with: [순임], text: "내 안 간다." }
      - goto: fire

  fire:
    title: "정월 그믐"
    actions:
      - bg: { id: market_fire, transition: fade, duration: 700 }
      - place: "1953년 1월 30일 밤 · 국제시장"
      - effect: rumble
      - mood: { tone: dread, level: 2 }
      - char: { id: 순임, position: left }
      - char: { id: 영호, position: right }
      - say: { char: 영호, with: [순임], delivery: shout, motion: tremble, text: "엄마, 저기 우리 좌판 쪽이야! 천막이 다 붙었어!" }
      - say: { char: 순임, with: [영호], text: "가지 마. 손 놓지 마. 물건은 됐어." }
      - say: { channel: action, with: [], sound: market_fire, text: "바닷바람을 탄 불길이 옆 골목으로 번졌다. 날이 밝을 때까지 꺼지지 않았다." }
      - say: { channel: action, with: [], text: "천막을 얹은 지게가 길을 막는다. 물통 든 사람이 그 사이를 비집고 뛴다." }
      - say: { channel: action, with: [], text: "길목 쪽에서 아이 울음이 난다. 복례 아주머니 천막이 거기다." }
      - say: { channel: thought, with: [], text: "영호 손을 쥐고 있다. 다른 손이 비어 있다." }
      - wait: 900
      - say: { channel: thought, with: [], text: "비어 있는 손으로 뭘 해야 하는지 알면서 모르는 척한다." }
      - say: { channel: action, with: [], text: "옆 좌판 최 씨가 물수건을 머리에 쓰고 들어갔다. 쉰이 넘은 사람이다." }
      - wait: 1100
      - say: { channel: action, with: [], text: "아이 둘은 나왔다. 최 씨는 안 나왔다." }
      - say: { channel: thought, with: [], text: "영호 손을 놓지 못한 채 다른 손으로 치맛자락만 움켜쥐었다." }
      - say: { char: 영호, with: [순임], delivery: shout, text: "엄마, 보따리! 좌판 밑에!" }
      - say: { char: 순임, with: [영호], text: "두고 와. 손 놓지 마." }
      - say: { channel: thought, with: [], text: "이태를 안 풀었던 것이 그 밤에 없어졌다. 안에 뭐가 있었는지는 끝까지 모른다." }
      - say: { channel: record, with: [], text: "부산 국제시장. 단기 4286년 1월 30일 밤 화재. 점포 수천 호 소실. 사망 및 행방불명 다수." }
      - mood: off
      - bg: { id: busan_shack, transition: fade, duration: 1000 }
      - place: "사흘 뒤 · 판잣집"
      - say:
          char: 영호
          with: [순임]
          when: { var: l2_told, op: eq, value: true }
          text: "엄마, 통역 아저씨 서울 갔대. 양키시장 아줌마들이 그러는데 돈 맡긴 사람이 셋 더 있대."
      - say:
          char: 영호
          with: [순임]
          when: { var: l2_told, op: eq, value: false }
          text: "엄마, 부대 정문 아저씨가 그러는데 통역 중에 최기호라는 사람은 없대. 도장도 가짜래."
      - say:
          char: 순임
          with: [영호]
          when: { var: l2_told, op: eq, value: true }
          text: "…말끝을 또렷하게 하는 사람이었는데."
      - say:
          char: 순임
          with: [영호]
          when: { var: l2_told, op: eq, value: false }
          text: "…날짜, 금액, 이름 석 자. 다 받았는데."
      - say: { channel: action, with: [], text: "우리 천막은 타고 쇠기둥만 남았다. 그 사이에 누가 벌써 새 천막을 쳐 놓았다." }
      - say: { char: 순임, with: [영호], text: "…저기 우리 자리였는데." }
      - say: { char: 영호, with: [순임], text: "아줌마가 어제부터 저기 섰대. 먼저 선 사람이 임자래." }
      - say: { channel: thought, with: [], text: "그 말을 두 달 전에 들었다. 그때는 내가 임자였다." }
      - say: { char: 영호, with: [순임], text: "엄마, 벽보 봤어? 영등포 방직공장에서 사람 뽑는대. 기숙사도 준대." }
      - say: { char: 순임, with: [영호], text: "네가 그걸 읽었어?" }
      - say: { char: 영호, with: [순임], motion: perk, text: "'방' 자하고 '공' 자 읽었어. 나머진 옆집 형이." }
      - goto: mother_choice_intro

  mother_choice_intro:
    actions:
      - place: "이월 · 새벽 네 시"
      - char: { id: 순임, position: left }
      - char: { id: 시어머니, position: right }
      - say: { channel: action, with: [시어머니], text: "어머이는 보따리를 싸는 동안 눈을 감고 있었다. 방문을 여는 소리가 나자 벽 쪽으로 돌아누웠다." }
      - goto: mother_choice

  mother_choice:
    actions:
      - choice:
          key: l2_mother
          prompt: "서울 가는 기차는 다섯 시다. 영호는 신을 신고 문간에 서 있다."
          with: [시어머니]
          options:
            - text: "어머니를 모시고 간다."
              saveText: "어머이를 일으킨다. 업고라도 같이 간다고 한다."
              goto: mother_try
            - text: "쌀값을 두고 영호와 떠난다."
              saveText: "머리맡에 쌀 한 말 값을 놓고 나온다."
              goto: mother_leave

  mother_try:
    actions:
      - branch:
          cases:
            - when: { var: last_taken, op: eq, value: kin }
              goto: mother_cannot
            - when: { var: last_taken, op: eq, value: free }
              goto: mother_cannot
            - when: { var: last_taken, op: eq, value: stay }
              goto: mother_cannot
            - when: { var: last_taken, op: eq, value: dare }
              goto: mother_cannot
          default: mother_ask

  mother_cannot:
    actions:
      - wait: 1100
      - say: { channel: action, with: [시어머니], text: "어머이, 하고 불렀다. 보따리는 벌써 어깨에 있고 영호 손을 쥐고 있다.", wait: 900, unskippable: true }
      - say: { channel: thought, with: [], text: "나가려고 보따리를 멘 기억은 없다. 어깨에서 끈을 내려 보려 했는데 손이 안 간다." }
      - goto: mother_leave

  mother_ask:
    actions:
      - set: { l2_asked: true }
      - say: { char: 순임, with: [시어머니], text: "어머이, 일어나요. 영호 애비 오면 부두 사람들이 서울 갔다고 일러 줄 거예요." }
      - say: { char: 순임, with: [시어머니], text: "같이 가요." }
      - say: { char: 시어머니, with: [순임], text: "그 사람들이 내 아들 얼굴을 아나." }
      - say: { char: 순임, with: [시어머니], text: "제가 업을게요. 저 어머이 없으면 영호 못 키워요." }
      - say: { char: 순임, with: [시어머니], text: "무서워요." }
      - say: { char: 시어머니, with: [순임], motion: sigh, text: "…이거 가져가라. 내 가락지다. 팔아서 영호 학교 보내라." }
      - say: { char: 시어머니, with: [순임], text: "가라. 기차 놓친다." }
      - goto: train

  mother_leave:
    actions:
      - say: { channel: action, with: [시어머니], text: "지전을 접어 베개 밑에 밀어 넣는다. 어머이는 돌아눕지 않는다." }
      - say: { char: 시어머니, with: [순임], text: "…영호 목도리 해 줘라." }
      - goto: train

  train:
    actions:
      - say: { channel: action, with: [], text: "문이 등 뒤에서 닫힌다. 언덕을 내려오는 동안 영호는 한 번도 뒤를 보지 않았다." }
      - say: { channel: card, with: [], text: "1967년 삼월\n서울 영등포" }
      - goto: seoul

  seoul:
    title: "영등포"
    actions:
      - bg: { id: seoul_room, transition: fade, duration: 1000 }
      - place: "1967년 삼월 · 영등포 셋방"
      - char: { id: 순임, position: left }
      - char: { id: 청년영호, position: right }
      - say: { char: 청년영호, with: [순임], text: "엄마, 약 드세요. 공장 의무실에서 솜먼지를 십사 년이나 들이마셨으니 폐가 성할 턱이 없대요." }
      - say: { char: 순임, with: [청년영호], text: "너는 수업 안 가고 왜 여기 있니. 등록금이 얼만데." }
      - say: { char: 청년영호, with: [순임], text: "오늘 휴강이에요. 아, 그리고 이거. 부산 영주동 동사무소에서 답장 왔어요." }
      - say: { channel: record, with: [청년영호], text: "회신. 귀하가 문의한 영주동 산 3번지 일대 가옥은 1953년 11월 화재로 전소됨. 문의하신 분은 이재민 명부에 없음." }
      - say: { char: 순임, with: [청년영호], text: "…명부에 없으면, 어디 간 거니." }
      - say: { char: 청년영호, with: [순임], motion: droop, text: "몰라요. 부두 노무자 사무실에도 편지 넣어 볼게요." }
      - say: { char: 청년영호, with: [순임], text: "열네 번째지만." }
      - say: { char: 순임, with: [청년영호], text: "답장은 한 통 왔지. 그 한 통이 이거고." }
      - say: { char: 청년영호, with: [순임], text: "열다섯 번째도 쓸게요. 종이값은 제가 벌어요." }
      - say: { channel: action, with: [], text: "순임이 숨을 들이켜다 기침을 한다. 손으로 입을 막고, 그 손을 보지 않는다." }
      - say: { channel: thought, with: [], text: "기숙사 준다던 벽보를 영호가 읽었지. 아직 두 글자밖에 못 읽던 애가." }
      - say:
          char: 순임
          with: [청년영호]
          when: { var: l2_asked, op: eq, value: true }
          text: "가락지는 팔지 말 걸 그랬다. 네 중학교 입학금이 그거였어."
      - say:
          char: 순임
          with: [청년영호]
          when: { var: l2_asked, op: eq, value: false }
          text: "그날 새벽에 어머이가 목도리 얘기를 했어. 나는 대답을 안 하고 나왔다."
      - say: { char: 청년영호, with: [순임], text: "엄마, 뭐 드시고 싶은 거 없어요? 월급날이에요." }
      - wait: 1400
      - say: { char: 순임, with: [청년영호], text: "가자미식해. …서울엔 없지. 창문이나 좀 열어라.", wait: 1500 }
      - say: { char: 순임, with: [청년영호], text: "됐다.", wait: 1600 }
      - bg: { id: void, transition: fade, duration: 2600 }
      - music: void
      - goto: void_two

  # 두 번째 재판. 이번에는 돌아왔다는 것만 알고, 어디로 돌아왔는지는 모른다.
  void_two:
    title: "암흑"
    actions:
      - say: { channel: narration, text: "암흑." }
      - say: { channel: narration, text: "새벽 기차 유리창에 비치던 내 얼굴이 떠오른다." }
      - say:
          channel: narration
          when: { var: l2_told, op: eq, value: true }
          text: "마흔넷 해가 전부 떠오른다. 세어 보지도 않고 건넨 전대. 또렷하던 말끝."
      - say:
          channel: narration
          when: { var: l2_told, op: eq, value: false }
          text: "마흔넷 해가 전부 떠오른다. 날짜, 금액, 가짜 도장."
      - say: { channel: narration, text: "부두에 서 있던 어머이. 보낸 편지 열네 통에 답장 한 통." }
      - wait: 700
      - say: { channel: narration, text: "묻는 소리가 난다. 전에도 이랬던 것 같은데, 전이 언제인지는 모른다." }
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "3열 17번." }
      - say: { channel: narration, text: "거기 서는 사람이 꼭 나였어야 했나." }
      - say: { channel: narration, text: "미안하다고. 한마디." }
      - say: { channel: narration, text: "그 밤에 비어 있던 손." }
      - say: { channel: narration, text: "내가 먼저 뛰어갔으면 아이들은 나왔겠지. 옆 좌판 최 씨도 들어갈 일 없었을 테고." }
      - say: { channel: narration, when: { var: l2_asked, op: eq, value: true }, text: "어머이한테 한 번만 더 같이 가자고 할걸. 기차 시간이 좀 남았었는데." }
      - say: { channel: narration, when: { var: l2_asked, op: eq, value: false }, text: "쌀값 놓고 나오기 전에 같이 가자고 한마디라도 할걸. 아직 기차 시간이 남았었는데." }
      - wait: 900
      - say: { channel: narration, when: { var: l2_asked, op: eq, value: false }, text: "어머이, 영호가 목도리 잊지 않고 둘렀어요." }
      - say: { channel: narration, text: "동사무소에서 온 편지는 마지막까지 서랍에 두었다." }
      - bg: { id: void_light, transition: dissolve, duration: 3200 }
      - say: { channel: narration, text: "전대의 매듭과 어머이 손이 동시에 떠오른다." }
      - bg: { id: void_near, transition: dissolve, duration: 2600 }
      - goto: void_two_choice

  void_two_choice:
    actions:
      - choice:
          key: v2
          prompt: "전대를 건넨 날. 어머이를 두고 온 날."
          options:
            - text: "사람을 믿은 후회"
              saveText: "아무도 믿지 말았어야 했다."
              set: { t_guard: true, last_taken: guard, deg_last: "076.3" }
              goto: void_two_go
            - text: "떠난 후회"
              saveText: "떠나지 말았어야 했다."
              set: { t_stay: true, last_taken: stay, deg_last: "251.0" }
              goto: void_two_go
            - text: "쥐지 않는다."
              goto: void_two_stop

  void_two_stop:
    actions:
      - choice:
          key: v2_stop
          prompt: "남은 것이 정말 없는가."
          options:
            - text: "여기 남는다."
              saveText: "없다. 여기 있는다."
              goto: void_two_still
            - text: "다시 고른다."
              saveText: "…하나 있다."
              goto: void_two_choice

  void_two_still:
    actions:
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - ending: still

  void_two_go:
    actions:
      - place: "{{deg_last}}°"
      - effect: { name: tilt, wait: true }
      - say: { channel: narration, text: "몸이 기우는가 싶더니 바닥으로 떨어지듯 빨라진다.", autoAdvance: 2232 }
      - bg: { id: void_near, transition: dissolve, duration: 900 }
      - wait: 240
      - say: { channel: narration, text: "부두 이름이 생각나지 않는다. 가자미식해가 무슨 맛이었는지도 잊었다." }
      - bg: { id: void, transition: dissolve, duration: 1800 }
      - goto: /0.yaml
